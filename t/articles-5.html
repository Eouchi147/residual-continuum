<polygon points="638.7,273.0 633.5,276.0 628.3,273.0 628.3,267.0 633.5,264.0 638.7,267.0" class="wx-stone2 wx-edge"/><polygon points="651.2,273.0 646.0,276.0 640.8,273.0 640.8,267.0 646.0,264.0 651.2,267.0" class="wx-stone2 wx-edge"/><polygon points="663.7,273.0 658.5,276.0 653.3,273.0 653.3,267.0 658.5,264.0 663.7,267.0" class="wx-stone2 wx-edge"/><polygon points="676.2,273.0 671.0,276.0 665.8,273.0 665.8,267.0 671.0,264.0 676.2,267.0" class="wx-stone2 wx-edge"/><polygon points="688.7,273.0 683.5,276.0 678.3,273.0 678.3,267.0 683.5,264.0 688.7,267.0" class="wx-stone2 wx-edge"/><rect x="590" y="254" width="100" height="10" rx="2" class="wx-stone3 wx-edge"/><polygon points="601.2,251.0 596.0,254.0 590.8,251.0 590.8,245.0 596.0,242.0 601.2,245.0" class="wx-stone2 wx-edge"/><polygon points="613.7,251.0 608.5,254.0 603.3,251.0 603.3,245.0 608.5,242.0 613.7,245.0" class="wx-stone2 wx-edge"/><polygon points="626.2,251.0 621.0,254.0 615.8,251.0 615.8,245.0 621.0,242.0 626.2,245.0" class="wx-stone2 wx-edge"/><polygon points="638.7,251.0 633.5,254.0 628.3,251.0 628.3,245.0 633.5,242.0 638.7,245.0" class="wx-stone2 wx-edge"/><polygon points="651.2,251.0 646.0,254.0 640.8,251.0 640.8,245.0 646.0,242.0 651.2,245.0" class="wx-stone2 wx-edge"/><polygon points="663.7,251.0 658.5,254.0 653.3,251.0 653.3,245.0 658.5,242.0 663.7,245.0" class="wx-stone2 wx-edge"/><polygon points="676.2,251.0 671.0,254.0 665.8,251.0 665.8,245.0 671.0,242.0 676.2,245.0" class="wx-stone2 wx-edge"/><polygon points="688.7,251.0 683.5,254.0 678.3,251.0 678.3,245.0 683.5,242.0 688.7,245.0" class="wx-stone2 wx-edge"/></g><g class="wx-st" data-s="5"><circle cx="522" cy="130" r="9" class="wx-num"/><text x="522" y="134" text-anchor="middle" class="wx-numt">5</text><text x="538" y="134" class="wx-t-b">Cross and stack</text><text x="538" y="149" class="wx-t-s">header-stretcher courses,</text><text x="538" y="163" class="wx-t-s">coral rubble behind</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Nature makes the columns: cooling lava cracks into long prisms.</p><ol class="wx-steplist"><li>Nature makes the columns: cooling lava cracks into long prisms.</li><li>Levers pry columns loose along natural joints (proposed).</li><li>Rafts float them across the lagoon inside the reef at high tide (proposed).</li><li>Ropes haul them up inclined logs onto the islet (proposed).</li><li>Crossed courses of columns, with coral rubble behind, make the wall.</li></ol><figcaption>How the columns probably reached the islets. Step 1 is geology; steps 2 to 4 are the most widely proposed methods; step 5 is what survives. <span class="wx-src">Based on: Geology of columnar basalt; transport as proposed in the archaeological literature (e.g. Morgan 1988; UNESCO 2016). Schematic, not to scale.</span></figcaption><p class="vh">A cross-section from a rocky shore on the left, across a lagoon, to a coral-fill islet on the right. Step 1: vertical basalt prisms stand in the cliff, labelled cooling lava cracks into prisms. Step 2: a lever pries a column loose. Step 3: a column rides on a raft floating on the lagoon at high tide. Step 4: a column is hauled up two inclined logs onto the islet. Step 5: a wall of alternating lengthwise columns and end-on hexagonal columns stands on the islet.</p></figure><p>Most archaeologists think columns were levered from outcrops, floated on rafts across the calm lagoon inside the reef at high tide, and hauled up onto the walls along inclined logs with ropes, as tradition in some versions also suggests. No ancient raft has been found, which is no surprise in a wet tropical climate, and the method is a reasoned proposal rather than a documented one. Spread over generations, the work looks demanding but within reach of a chiefdom that could command the labour of the whole island.</p><blockquote class="wpull"><p>Perhaps the stones did fly, in a sense: carried by a society organised enough to lift them.</p></blockquote></section><section class="wsec" id="nan-madol-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What time is taking now</h3><p>The Saudeleur left no writing. Their history was held in oral tradition, much of it sacred and restricted, and recorded only after European contact. The wooden tools and ropes are gone. And the city itself is under threat: silt is choking the canals and mangrove roots are prying walls apart, which is why UNESCO listed Nan Madol as a World Heritage Site in Danger in the same year, 2016, that it was inscribed.</p><p>What we have lost is not only stone but the life inside it. Tradition and excavation give glimpses: on the islet of Idehd, priests kept a sacred eel in a well and fed it turtle offal; other islets held canoe houses, places for preparing food, and tombs of rulers. Excavations have turned up shell ornaments, drilled animal teeth, quartz crystals and pounders for kava. The ceremonies, the songs and the full political story that tied them together survive only in fragments, held by Pohnpeian families and chiefly titles that still exist today.</p><p>It is worth pausing on how remarkable that continuity is. The Nahnmwarki, the traditional paramount chiefs whose office tradition traces back to Isokelekel&#x27;s victory over the last Saudeleur, still exercise customary authority over the site. Few megalithic cities anywhere keep a living link to the people who say their ancestors built them.</p></section><section class="wsec" id="nan-madol-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle it</h3><p>Direct dates from many more islets, especially their lowest fill, would map the full building sequence. A systematic sonar and diving survey of the reef edge, with samples from any columnar features, would test the sunken-city tradition head on. More stone sourcing would show how the quarries were organised, and experimental trials with columns of known weight would put numbers on the labour. On current evidence, Nan Madol is a Pacific achievement of the twelfth century onward, built by Pohnpeians, and no less astonishing for that.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-use" style="--i:0"><span class="wtl-y">100 CE</span><span class="wtl-k">In use</span><span class="wtl-t">People already living on the reef edge</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">900 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Islet building under way (approximate)</span></li><li class="wtl-build" style="--i:2"><span class="wtl-y">1190 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Royal tomb at Nandauwas built, c. 1180–1200</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">1628 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Isokelekel overthrows the Saudeleur (traditional date)</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">1926 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Churchward links Nan Madol to lost Mu</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">2011 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">XRF study traces the basalt to Pohnpei</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2016 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">U-Th coral dates; UNESCO listing, in Danger</span></li></ol><details class="srcs"><summary>Sources for this case (10)</summary><ol><li>McCoy, M. D., Alderson, H. A., Hemi, R., Cheng, H. &amp; Edwards, R. L. (2016). Earliest direct evidence of monument building at the archaeological site of Nan Madol (Pohnpei, Micronesia) identified using 230Th/U coral dating and geochemical sourcing of megalithic architectural stone. Quaternary Research 86(3): 295–303. <a href="https://doi.org/10.1016/j.yqres.2016.08.002" target="_blank" rel="noopener">doi:10.1016/j.yqres.2016.08.002</a></li><li>McCoy, M. D. &amp; Athens, J. S. (2011). Sourcing the megalithic stones of Nan Madol: an XRF study of architectural basalt stone from Pohnpei, Federated States of Micronesia. Journal of Pacific Archaeology 3(1): 105–114. <a href="https://doi.org/10.70460/jpa.v3i1.68" target="_blank" rel="noopener">doi:10.70460/jpa.v3i1.68</a></li><li>UNESCO World Heritage Centre (2016). Nan Madol: Ceremonial Centre of Eastern Micronesia (List no. 1503).</li><li>Hanlon, D. (1988). Upon a Stone Altar: A History of the Island of Pohnpei to 1890. University of Hawaii Press.</li><li>Morgan, W. N. (1988). Prehistoric Architecture in Micronesia. University of Texas Press.</li><li>Pala, C. (2009). Nan Madol: the city built on coral reefs. Smithsonian Magazine.</li><li>Lythberg, B. (2018). Nan Madol: &#x27;In the space between things&#x27;. Smarthistory.</li><li>Churchward, J. (1926). The Lost Continent of Mu. William Edwin Rudge.</li><li>Childress, D. H. (1988). Lost Cities of Ancient Lemuria and the Pacific. Adventures Unlimited Press.</li><li>Hancock, G. (2002). Underworld: Flooded Kingdoms of the Ice Age. Michael Joseph.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-nan-madol" data-t="Nan Madol: The Basalt City on the Reef"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Nan Madol: The Basalt City on the Reef</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-nan-madol</span> (updated 25 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-carolina-bays-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Carolinabays.jpg" data-cap="Carolina Bays seen from the air" data-big><figcaption></figcaption></figure><div class="sh-k">Mysteries of the Earth</div><h2 class="sh-t" id="case-carolina-bays-st" tabindex="-1">The Carolina Bays: Half a Million Ovals Pointing One Way</h2><p class="sh-s">From the air the coastal plain is pocked with oval basins, all aligned. Did a comet throw them there, or did the wind carve them?</p><div class="sh-v"><span class="vstamp vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><p class="sh-claim"><b>What the stamp rates:</b> The Carolina Bays were made by a single cosmic impact event, as proposed for the Younger Dryas onset about 12,800 years ago.</p></div><p class="v4-q">Did a single cosmic impact punch half a million aligned ovals into the Atlantic coast?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Half a million shallow oval hollows dot the US east coast, all pointing roughly the same way.</li><li>One idea says chunks of ice from a single comet strike punched them all at once, about 12,800 years ago.</li><li>Dating of their sand rims gives ages from 109,000 to 2,000 years: built and rebuilt over ages.</li><li>The layers under them are undisturbed, and no impact minerals have been found.</li><li>Wind and waves on old ponds explain the shape; one blast is ruled out by the dates.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Geology</span><span class="thr">Climate</span><span class="thr">Physics</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="500000" >500,000</b><span class="ctr-u"> bays</span></div><div class="ctr-l">estimated number on the Atlantic coastal plain</div><div class="ctr-c">Prouty 1952</div></div><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="20000" >20,000</b><span class="ctr-u"> bays</span></div><div class="ctr-l">mapped and measured by a neural network from elevation data</div><div class="ctr-c">Lundine and Trembanis 2025</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="0.58" data-dec="2">0.58</b><span class="ctr-u"> </span></div><div class="ctr-l">average width-to-length ratio of the ovals</div><div class="ctr-c">Zamora 2017</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="109000" >109,000</b><span class="ctr-u"> years</span></div><div class="ctr-l">oldest luminescence age reported from a bay rim</div><div class="ctr-c">summarised in Lundine and Trembanis 2025</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The Carolina Bays were made by a single cosmic impact event, as proposed for the Younger Dryas onset about 12,800 years ago.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">For the Younger Dryas version, the dates contradict the claim: bay rims and sediments range from about 109,000 to about 2,000 years old, and sediments in several bays, including White Pond studied by impact supporters themselves, are far older than 12,800 years. The layers below the bays are undeformed and no impact minerals have been found. A much older Middle Pleistocene impact is harder to test and remains awaiting discovery, but nothing yet requires it.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks and park signs usually say the bays formed by wind and water and that the impact idea has been rejected. That verdict matches the evidence. But the confident tone can hide that geologists still disagree about the exact ordinary mechanism: wind and waves, permafrost thaw, groundwater, or all three. The origin is best described as ordinary but not fully solved.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Roughly 500,000 shallow elliptical depressions, from under a hectare to several thousand acres, dot the Atlantic coastal plain from New Jersey to northern Florida, with sand rims highest on their south-east ends.<small>Prouty 1952; Sharitz 2003</small></li><li>Their long axes share a direction that changes smoothly with latitude, from about N16°W in Georgia to N64°W in Virginia, then swings to about N48°E in Delmarva and New Jersey.<small>Regional studies since Prouty 1952</small></li><li>Luminescence (OSL) ages of bay rim and basin sands range from about 109,000 to about 2,000 years ago, with most between about 40,000 and 11,000 years ago.<small>Brooks et al. 2010; Moore et al. 2016; Lundine and Trembanis 2025</small></li><li>Cores show a few metres of sand and mud resting on older layers that show no sign of impact deformation.<small>Grant et al. 1998; Moore et al. 2016</small></li><li>Even at White Pond, a bay where the impact team reports a 12,800-year platinum anomaly, lake sediments began accumulating about 31,000–32,000 years ago.<small>Moore et al. 2019</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Which ordinary process mattered most: wind-driven waves in shallow ponds, thawing of frozen ground (thermokarst) in the ice age, groundwater dissolution, or a combination.</li><li>Whether markers reported at the Younger Dryas boundary inside some bays record a real cosmic event, even though the bays themselves are older.</li><li>Whether a much older impact, in the Middle Pleistocene, could have started the bays, as some impact supporters now propose.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Many bays have been ditched, drained, ploughed or built over, blurring their rims and mixing their upper sediments.</li><li>Lake sediments that would record a bay&#x27;s earliest days are often thin, reworked by wind and waves, or eroded away.</li><li>Only a small fraction of the bays has ever been cored and dated.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Most geologists read the bays as relict ice-age features shaped by wind and water. Shallow ponds on sandy, poorly drained ground were stretched and rounded by waves driven by strong prevailing winds, with sand piled on the downwind rims, and in colder spells thawing permafrost may have helped start them. Luminescence dates show rims built and rebuilt over tens of thousands of years, not in one day. Similar oriented lakes still form today where steady winds blow across flat, wet ground.</p><ul><li>Rim and basin ages spread across roughly 100,000 years, not a single moment.</li><li>The substrate under the bays is undisturbed, with no shocked minerals or impact breccia.</li><li>The smooth swing of orientation with latitude is what a regional wind pattern produces.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Impact readings of the bays go back to 1933, when Frederick Melton and William Schriever, studying new aerial photographs, asked whether the ovals were meteorite scars. The Comet Research Group revived the idea after 2007 as part of the Younger Dryas impact hypothesis. Antonio Zamora&#x27;s 2017 model, published in Geomorphology, argues from Google Earth and lidar that the bays are elliptical cones whose axes point back toward the Great Lakes. He proposes that an impact on the Laurentide ice sheet hurled huge blocks of ice that struck soft, waterlogged ground, leaving craters later reshaped by wind and water.</p><ul><li>The bays&#x27; width-to-length ratio averages 0.58, which Zamora says matches cones cut by projectiles arriving at about 35°.</li><li>Their axes appear to fan out from the Great Lakes region, like rays of ejecta.</li><li>They occur only on loose sediment near the water table, where ice impacts would leave soft craters rather than rocky ones.</li></ul><div class="face-s"><b>Its strongest point</b><p>Half a million basins with the same shape and a systematic alignment over more than 1,000 km is a striking pattern, and the way their axes seem to fan back toward one inland region is exactly what distant ejecta from a single point would produce.</p></div><p class="face-cr"><b>Credit</b> Antonio Zamora; Michael Davias; the Comet Research Group (Richard Firestone, Allen West and colleagues)</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Dating the lowest sediments in many bays chosen at random: a single impact predicts one shared starting age.</li><li>Cores beneath bays showing shocked minerals, impact melt or deformation in the underlying layers.</li><li>A physical model showing ice blocks from one impact could make 500,000 oval craters without leaving any trace in the substrate.</li><li>A crater or a clear source structure for the ejecta, of the right age.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,186 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Carolina Bays: Half a Million Ovals Pointing One Way"><button type="button" class="wtoc-i" data-go="carolina-bays-s1">A landscape that points</button><button type="button" class="wtoc-i" data-go="carolina-bays-s2">Meteorite scars?</button><button type="button" class="wtoc-i" data-go="carolina-bays-s3">What wind and water can do</button><button type="button" class="wtoc-i" data-go="carolina-bays-s4">The dates that do not fit</button><button type="button" class="wtoc-i" data-go="carolina-bays-s5">New eyes on an old landscape</button><button type="button" class="wtoc-i" data-go="carolina-bays-s6">What is still unexplained</button></nav></div><section class="wsec" id="carolina-bays-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A landscape that points</h3><p>On the ground they are easy to miss: a slightly lower patch of woodland, a pocosin thick with bay trees, a shallow lake with a faint sandy rise along one side. The local name, bay, comes from the sweet bay, loblolly bay and red bay trees that fill many of them. It was only when the first aerial photographs of the coastal plain were taken in the early 1930s that people saw what they were standing in.</p><p>From the air, the plain from New Jersey to northern Florida is pocked with ovals, roughly half a million of them by the most common estimate. Some are a few metres across, some cover several thousand acres; Lake Waccamaw in North Carolina fills one of about 36 square kilometres. Many overlap. And they point. In any one region their long axes run in nearly the same direction, and their sandy rims stand highest on the south-east end, as if something had struck the ground at a low angle from the north-west.</p><blockquote class="wpull"><p>Half a million ovals, overlapping and aligned, as if something had struck the coast at a low angle from the north-west.</p></blockquote></section><section class="wsec" id="carolina-bays-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Meteorite scars?</h3><p>That impression shaped the first big theory. In 1933 the geologist Frederick Melton and the physicist William Schriever, looking at the new photographs, asked in the Journal of Geology whether the bays were meteorite scars. In 1952 William Prouty argued for impacts more firmly, and the idea never quite went away. After 2007, the Comet Research Group, which proposes that a fragmenting comet struck the Northern Hemisphere 12,800 years ago, pointed to the bays as possible scars of the same event. Richard Firestone, Allen West and Simon Warwick-Smith featured them in their 2006 book The Cycle of Cosmic Catastrophes.</p><p>The most developed modern version is Antonio Zamora&#x27;s. In a 2017 paper in Geomorphology he used Google Earth and lidar elevation data to argue that the bays are elliptical cones with a width-to-length ratio averaging 0.58, the shape a cone makes when cut by projectiles arriving at about 35 degrees. Extended inland, he argues, their axes fan back toward the Great Lakes. His scenario: a cosmic impact on the Laurentide ice sheet hurled huge blocks of glacial ice, which fell on waterlogged ground liquefied by the shock, leaving soft craters that wind and water later reshaped. Michael Davias has mapped the bays in detail with lidar and argues for a similar ballistic origin.</p><figure class="wx wx--steps" id="carolina-bays-f2" data-n="3"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">Which way do the bays point?</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Which way do the bays point?"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" class="wx-svg" role="img" aria-labelledby="carolina-bays-f2-t"><title id="carolina-bays-f2-t">How the long axes of Carolina Bays change direction along the Atlantic coastal plain</title><defs><clipPath id="carolina-bays-f2-clip"><rect x="20" y="44" width="420" height="440"/></clipPath></defs><text class="wx-t-cap" x="24" y="28">Which way do the bays point? · schematic map</text><g clip-path="url(#carolina-bays-f2-clip)"><rect class="wx-sand wx-o60" x="20" y="44" width="420" height="440"/><path class="wx-water" d="M227.7,503.6 L229.9,478.4 L238.7,456.0 L260.8,433.6 L282.8,408.4 L303.6,404.2 L335.8,383.2 L357.9,365.0 L353.5,338.4 L346.8,318.8 L347.9,313.2 L366.7,279.6 L366.7,265.6 L371.1,262.0 L382.1,248.8 L391.0,219.4 L413.0,209.6 L437.3,201.2 L523.4,201.2 L523.4,526.0 L227.7,526.0Z"/><path class="wx-line" d="M227.7,503.6 L229.9,478.4 L238.7,456.0 L260.8,433.6 L282.8,408.4 L303.6,404.2 L335.8,383.2 L357.9,365.0 L353.5,338.4 L346.8,318.8 L347.9,313.2 L366.7,279.6 L366.7,265.6 L371.1,262.0 L382.1,248.8 L391.0,219.4 L413.0,209.6 L437.3,201.2"/><polygon class="wx-water wx-edge-soft" points="183.6,192.8 221.1,184.4 256.4,170.4 282.8,150.8 263.0,159.2 229.9,167.6 201.2,176.0"/><polygon class="wx-water wx-edge-soft" points="263.0,142.4 302.7,139.6 338.0,134.0 340.2,114.4 313.7,122.8 274.0,131.2"/ x-edge" cx="322.6" cy="318.8" rx="5" ry="9"/><ellipse class="wx-water2 wx-edge" cx="308.6" cy="328.8" rx="3.5" ry="6.3"/><ellipse class="wx-water2 wx-edge" cx="335.6" cy="306.8" rx="3.0" ry="5.4"/></g><g transform="rotate(48 353.5 271.2)"><ellipse class="wx-water2 wx-edge" cx="353.5" cy="271.2" rx="5" ry="9"/><ellipse class="wx-water2 wx-edge" cx="339.5" cy="281.2" rx="3.5" ry="6.3"/><ellipse class="wx-water2 wx-edge" cx="366.5" cy="259.2" rx="3.0" ry="5.4"/></g><g transform="rotate(48 371.1 243.2)"><ellipse class="wx-water2 wx-edge" cx="371.1" cy="243.2" rx="5" ry="9"/><ellipse class="wx-water2 wx-edge" cx="357.1" cy="253.2" rx="3.5" ry="6.3"/><ellipse class="wx-water2 wx-edge" cx="384.1" cy="231.2" rx="3.0" ry="5.4"/></g><text class="wx-t-n wx-halo" x="183.6" y="443.2" text-anchor="end">N16°W</text><text class="wx-t-n wx-halo" x="210.1" y="423.6" text-anchor="end">N22°W</text><text class="wx-t-n wx-halo" x="243.2" y="395.6" text-anchor="end">N39°W</text><text class="wx-t-n wx-halo" x="278.5" y="373.2" text-anchor="end">N49°W</text><text class="wx-t-n wx-halo" x="300.6" y="322.8" text-anchor="end">N64°W</text><text class="wx-t-n wx-halo" x="331.5" y="275.2" text-anchor="end">N48°E</text><text class="wx-t-s wx-halo" x="174.7" y="472.8" text-anchor="middle">Georgia</text><text class="wx-t-s wx-halo" x="205.6" y="383.2" text-anchor="middle">S. Carolina</text><text class="wx-t-s wx-halo" x="258.6" y="341.2" text-anchor="middle">N. Carolina</text><text class="wx-t-s wx-halo" x="282.8" y="293.6" text-anchor="middle">Virginia</text><text class="wx-t-s wx-halo" x="355.7" y="215.2" text-anchor="middle">New Jersey</text><text class="wx-t-m" x="357.9" y="428.0">Atlantic</text><g class="wx-st wx-hide" data-only="1"><text class="wx-t-h" x="462" y="70">1 · A pattern</text><text class="wx-t" x="462" y="94">Hundreds of thousands of oval basins</text><text class="wx-t" x="462" y="111">share a direction. Their long axes</text><text class="wx-t" x="462" y="128">turn gradually along the coast, from</text><text class="wx-t" x="462" y="145">N16°W in Georgia to N64°W in Virginia,</text><text class="wx-t" x="462" y="162">then flip to about N48°E in Delmarva</text><text class="wx-t" x="462" y="179">and New Jersey. Sand rims are highest</text><text class="wx-t" x="462" y="196">on the south-east side.</text></g><g class="wx-st wx-hide" data-only="2"><text class="wx-t-h" x="462" y="70">2 · The impact reading</text><text class="wx-t" x="462" y="94">Extend the axes inland and, Zamora</text><text class="wx-t" x="462" y="111">(2017) argues, they fan back toward</text><text class="wx-t" x="462" y="128">the Great Lakes, like ejecta from one</text><text class="wx-t" x="462" y="145">point: ice blocks thrown out by an</text><text class="wx-t" x="462" y="162">impact on the ice sheet. With these</text><text class="wx-t" x="462" y="179">regional averages the lines cross</text><text class="wx-t" x="462" y="196">short of the lakes, the flipped</text><text class="wx-t" x="462" y="213">Delmarva axes point elsewhere, and</text><text class="wx-t" x="462" y="230">no crater marks the source.</text></g><g class="wx-st wx-hide" data-only="3"><text class="wx-t-h" x="462" y="70">3 · The wind-and-water reading</text><text class="wx-t" x="462" y="94">A smooth swing in direction is what</text><text class="wx-t" x="462" y="111">a regional wind field produces. Lakes</text><text class="wx-t" x="462" y="128">in steady winds today, as on Alaska's</text><text class="wx-t" x="462" y="145">Arctic coast, also grow oval, with</text><text class="wx-t" x="462" y="162">sandy rims. Luminescence ages show</text><text class="wx-t" x="462" y="179">bays reworked over 100,000 years</text><text class="wx-t" x="462" y="196">(Lundine and Trembanis 2025).</text></g><text class="wx-t-s" x="20" y="504">Schematic: coastline simplified, bay sizes exaggerated. Orientations after regional averages.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 3.</b> The pattern: long axes turn gradually along the coast, then flip in Delmarva and New Jersey.</p><ol class="wx-steplist"><li>The pattern: long axes turn gradually along the coast, then flip in Delmarva and New Jersey.</li><li>The impact reading: extended axes fan back toward the Great Lakes, like ejecta from one point.</li><li>The wind-and-water reading: a smooth change of direction is what a regional wind field produces.</li></ol><figcaption>A schematic map of the bays&#x27; average orientations along the Atlantic coastal plain, and the two rival ways of reading the pattern. <span class="wx-src">Based on: Average orientations by region from published regional studies (since Prouty 1952); impact reading after Zamora (2017); wind reading after Kaczorowski (1977) and Lundine and Trembanis (2025). Coastline simplified; bay sizes greatly exaggerated.</span></figcaption><p class="vh">A simplified map of the eastern United States from Georgia to New Jersey, with the Atlantic Ocean on the right and the Great Lakes at top left. Clusters of small blue ovals mark the bays in Georgia, South Carolina, North Carolina, Virginia, Delmarva and New Jersey, each labelled with its average orientation: N16°W, N22°W, N39°W, N49°W, N64°W and N48°E. Step 1 describes the pattern. Step 2 extends each cluster&#x27;s long axis as a dashed line, showing how the southern axes fan inland toward the Great Lakes as the impact reading proposes, while the Delmarva and New Jersey axes point elsewhere. Step 3 explains the wind-and-water reading, in which the gradual turning of direction reflects regional winds.</p></figure></section><section class="wsec" id="carolina-bays-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>What wind and water can do</h3><p>The rival explanation begins with modern lakes. In 1977 Raymond Kaczorowski compared the bays with oriented lakes that form today on flat, wet ground under steady winds, and showed in wind-tank experiments that wind-driven waves and currents can stretch a round pond into an oval with a sandy rim downwind. Oriented lakes of this kind are common on Alaska&#x27;s Arctic coastal plain, and similar basins occur on the Texas Gulf coast and in the Rainwater Basin of Nebraska.</p><p>In this picture the bays began as shallow hollows on sandy, poorly drained land during colder, windier parts of the last ice age. Some researchers add thawing permafrost (the United States Geological Survey now describes the bays as relict thermokarst lakes modified by wind and water), others groundwater dissolving the subsoil. Waves did the shaping. The gradual swing of their orientation with latitude is what a regional wind field produces, while a single ejecta source would struggle to explain the abrupt switch to north-east-pointing bays in Delmarva and New Jersey.</p><aside class="wcall"><b>How do we know?</b><p>Optically stimulated luminescence measures when sand grains were last exposed to sunlight. Buried quartz slowly stores energy from natural radiation; heating or lighting it in the lab releases that energy as a glow, and the brightness gives the burial age. Sampling a bay&#x27;s rim layer by layer shows when each band of sand was blown or washed into place.</p></aside></section><section class="wsec" id="carolina-bays-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The dates that do not fit</h3><p>A single impact makes a sharp prediction: every bay should be the same age. Luminescence dating has tested it. Mark Brooks, Barbara Taylor and Andrew Ivester found that rims at Flamingo Bay were built in episodes from about 15,000 to 5,000 years ago, and other work there reports ages near 109,000 and 40,000 years. Christopher Moore and colleagues found rim sands at Herndon Bay in North Carolina about 37,000 to 27,000 years old. Big Bay in South Carolina yielded ages from about 36,000 to 2,000 years.</p><figure class="wx wx--static" id="carolina-bays-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">Ages from five bays</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Ages from five bays"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" class="wx-svg" role="img" aria-labelledby="carolina-bays-f1-t"><title id="carolina-bays-f1-t">Dates from Carolina Bay rims and sediments compared with the proposed 12,800-year impact</title><text class="wx-t-cap" x="24" y="28">Ages from five bays · thousands of years ago</text><rect class="wx-accfill wx-o20" x="234.4" y="74" width="455.6" height="244"/><text class="wx-t-m" x="681.5" y="88" text-anchor="end">older than the proposed impact</text><path class="wx-guide" d="M180.0,74V318"/><text class="wx-t-s" x="180.0" y="338" text-anchor="middle">0</text><path class="wx-guide" d="M265.0,74V318"/><text class="wx-t-s" x="265.0" y="338" text-anchor="middle">20</text><path class="wx-guide" d="M350.0,74V318"/><text class="wx-t-s" x="350.0" y="338" text-anchor="middle">40</text><path class="wx-guide" d="M435.0,74V318"/><text class="wx-t-s" x="435.0" y="338" text-anchor="middle">60</text><path class="wx-guide" d="M520.0,74V318"/><text class="wx-t-s" x="520.0" y="338" text-anchor="middle">80</text><path class="wx-guide" d="M605.0,74V318"/><text class="wx-t-s" x="605.0" y="338" text-anchor="middle">100</text><path class="wx-guide" d="M690.0,74V318"/><text class="wx-t-s" x="690.0" y="338" text-anchor="middle">120</text><path class="wx-thin" d="M180,110H690"/><text class="wx-t-b" x="168" y="114" text-anchor="end">Flamingo Bay, SC</text><circle class="wx-c2 wx-edge wx-pop" style="--d:0" cx="642.0" cy="110" r="5"/><circle class="wx-c2 wx-edge wx-pop" style="--d:1" cx="351.3" cy="110" r="5"/><circle class="wx-c2 wx-edge wx-pop" style="--d:2" cx="243.8" cy="110" r="5"/><circle class="wx-c2 wx-edge wx-pop" style="--d:3" cx="235.7" cy="110" r="5"/><circle class="wx-c2 wx-edge wx-pop" style="--d:4" cx="228.9" cy="110" r="5"/><circle class="wx-c2 wx-edge wx-pop" style="--d:5" cx="219.1" cy="110" r="5"/><circle class="wx-c2 wx-edge wx-pop" style="--d:6" cx="201.2" cy="110" r="5"/><path class="wx-thin" d="M180,158H690"/><text class="wx-t-b" x="168" y="162" text-anchor="end">Herndon Bay, NC</text><circle class="wx-c2 wx-edge wx-pop" style="--d:2" cx="336.0" cy="158" r="5"/><circle class="wx-c2 wx-edge wx-pop" style="--d:3" cx="305.8" cy="158" r="5"/><circle class="wx-c2 wx-edge wx-pop" style="--d:4" cx="295.6" cy="158" r="5"/><path class="wx-thin" d="M180,206H690"/><text class="wx-t-b" x="168" y="210" text-anchor="end">Big Bay, SC</text><circle class="wx-c2 wx-edge wx-pop" style="--d:4" cx="331.7" cy="206" r="5"/><circle class="wx-c2 wx-edge wx-pop" style="--d:5" cx="287.1" cy="206" r="5"/><circle class="wx-c2 wx-edge wx-pop" style="--d:6" cx="227.6" cy="206" r="5"/><circle class="wx-c2 wx-edge wx-pop" style="--d:7" cx="188.9" cy="206" r="5"/><path class="wx-thin" d="M180,254H690"/><text class="wx-t-b" x="168" y="258" text-anchor="end">White Pond, SC</text><rect class="wx-c3 wx-edge wx-pop" style="--d:6" x="307.9" y="248" width="12" height="12"/><path class="wx-thin" d="M180,302H690"/><text class="wx-t-b" x="168" y="306" text-anchor="end">Duke's Pond, GA</text><circle class="wx-c2 wx-edge wx-pop" style="--d:8" cx="280.3" cy="302" r="5"/><path class="wx-hl wx-s4 wx-draw" pathLength="1" style="--d:1" d="M234.4,66V328"/><text class="wx-t-b wx-halo" x="228.4" y="64" text-anchor="end">proposed impact, 12.8 ka</text><text class="wx-t-s" x="180" y="360">thousand years ago</text><circle class="wx-c2 wx-edge" cx="186" cy="382" r="6"/><text class="wx-t" x="198" y="386">luminescence (OSL) age of rim or basin sand</text><rect class="wx-c3 wx-edge" x="180" y="398" width="12" height="12"/><text class="wx-t" x="198" y="408">radiocarbon age of lowest lake sediment (c. 31–32 ka)</text></svg></div></div><figcaption>Published luminescence ages from bay rims and basin sands, and the base of the lake sediment at White Pond, compared with the 12,800-year date proposed for an impact. Most of the dates are older. <span class="wx-src">Based on: OSL ages: Brooks et al. (2010) and other studies for Flamingo Bay; Moore et al. (2016) for Herndon Bay; published ages for Big Bay and Duke&#x27;s Pond as compiled in Lundine and Trembanis (2025). White Pond basal radiocarbon age: Moore et al. (2019). Each dot is a reported age; uncertainties of several thousand years are not drawn.</span></figcaption><p class="vh">A dot chart with one row for each of five bays: Flamingo Bay, Herndon Bay, Big Bay, White Pond and Duke&#x27;s Pond. The horizontal axis runs from 0 to 120 thousand years ago. A red vertical line marks the proposed impact at 12.8 thousand years ago, and the region to its right, older than the impact, is shaded. Flamingo Bay has dots at about 5, 9, 11.5, 13, 15, 40 and 109 thousand years. Herndon Bay has dots at about 27, 30 and 37. Big Bay has dots at about 2, 11, 25 and 36. White Pond has a square at about 31.5 thousand years for the base of its lake sediment. Duke&#x27;s Pond has a dot at about 24.</p></figure><p>The most telling result comes from the impact team&#x27;s own side. In 2019 Moore, Brooks and colleagues, in a paper supporting the Younger Dryas impact hypothesis, reported a platinum anomaly at about 12,800 years ago in cores from White Pond, a Carolina bay in South Carolina. The same cores show that lake mud had been collecting there since about 31,000 to 32,000 years ago. Whatever happened 12,800 years ago, White Pond already existed.</p><p>Supporters reply that luminescence dates rim sand that wind and waves kept reworking long after a bay formed. That is fair for young ages, but it cannot explain sediments far older than the proposed impact lying inside the basins. Some impact supporters, including Michael Davias, have therefore moved their event much further back, to the Middle Pleistocene. That version is not contradicted by the dates in the same way, but no crater, shocked mineral or ejecta source has been found for it either.</p></section><section class="wsec" id="carolina-bays-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>New eyes on an old landscape</h3><aside class="wcall"><b>Fresh from the field</b><p>In February 2025 Mark Lundine and Arthur Trembanis of the University of Delaware published the broadest study yet in Marine Geology. A neural network found and measured over 20,000 bays in lidar elevation models; the team added sediment work in four states, satellite mapping of bay lakes, water-flow measurements in a bay pond and a compilation of published dates. Their conclusion: wind began the depressions and waves shaped them, and the impact hypotheses do not fit the dating. Davias and Harris have published a comment on it, Zamora and Holliday&#x27;s team have traded replies in Earth-Science Reviews, and the exchange continues.</p></aside><p>Lidar has been a gift to both sides. It strips away forests and fields to show thousands of bays that farming had made almost invisible, and lets anyone measure them. That is how Zamora and Davias built their catalogues, and how Lundine and Trembanis built theirs. The same tool, applied to the same shapes, has so far supported the ordinary reading when combined with dates and cores.</p></section><section class="wsec" id="carolina-bays-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What is still unexplained</h3><p>The bays are not a closed book. Geologists still argue about why they formed so densely here, what mix of wind, waves, permafrost and groundwater started them, and why the coastal plain froze such a record while other sandy plains did not. Many bays have been drained, ditched and ploughed since colonial times, and only a small fraction has ever been cored, so much of their early history may be lost.</p><p>What would change the verdict is concrete: shocked quartz or impact melt at the base of many bays, deformed layers beneath them, or basal sediments of one shared age from bays chosen at random. None has appeared so far. For now the best reading is that the Carolina Bays record not one terrible day but a hundred thousand years of wind and water working on a flat, wet land, which is its own quiet kind of marvel.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-study" style="--i:0"><span class="wtl-y">1895 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">L. C. Glenn describes the &#x27;bays&#x27; near Darlington, South Carolina</span></li><li class="wtl-study" style="--i:1"><span class="wtl-y">1933 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Melton and Schriever ask if they are meteorite scars</span></li><li class="wtl-study" style="--i:2"><span class="wtl-y">1952 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">William Prouty argues for an impact origin</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">1977 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Kaczorowski compares the bays with modern wind-oriented lakes</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">2007 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Younger Dryas impact hypothesis revives the impact idea</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">2010 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Brooks and colleagues publish luminescence ages for bay rims</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2017 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Zamora proposes ice-block ejecta from the Laurentide ice sheet</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2025 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Neural-network survey of over 20,000 bays favours wind and waves</span></li></ol><details class="srcs"><summary>Sources for this case (15)</summary><ol><li>Melton F. A., Schriever W. (1933). The Carolina &#x27;bays&#x27;: are they meteorite scars? Journal of Geology 41(1): 52–66. <a href="https://doi.org/10.1086/624004" target="_blank" rel="noopener">doi:10.1086/624004</a></li><li>Prouty W. F. (1952). Carolina bays and their origin. Geological Society of America Bulletin 63(2): 167. <a href="https://doi.org/10.1130/0016-7606(1952)63[167:CBATO]2.0.CO;2" target="_blank" rel="noopener">doi:10.1130/0016-7606(1952)63[167:CBATO]2.0.CO;2</a></li><li>Kaczorowski R. T. (1977). The Carolina Bays: a comparison with modern oriented lakes. Technical Report 13-CRD, Coastal Research Division, University of South Carolina.</li><li>Firestone R., West A., Warwick-Smith S. (2006). The Cycle of Cosmic Catastrophes. Bear &amp; Company.</li><li>Firestone R. B. et al. (2007). Evidence for an extraterrestrial impact 12,900 years ago that contributed to the megafaunal extinctions and the Younger Dryas cooling. PNAS 104(41): 16016–16021. <a href="https://doi.org/10.1073/pnas.0706977104" target="_blank" rel="noopener">doi:10.1073/pnas.0706977104</a></li><li>Zamora A. (2017). A model for the geomorphology of the Carolina Bays. Geomorphology 282: 209–216. <a href="https://doi.org/10.1016/j.geomorph.2017.01.019" target="_blank" rel="noopener">doi:10.1016/j.geomorph.2017.01.019</a></li><li>Brooks M. J., Taylor B. E., Ivester A. H. (2010). Carolina bays: time capsules of culture and climate change. Southeastern Archaeology 29: 146–163. <a href="https://doi.org/10.1179/sea.2010.29.1.010" target="_blank" rel="noopener">doi:10.1179/sea.2010.29.1.010</a></li><li>Moore C. R. et al. (2016). Quaternary evolution of Herndon Bay, a Carolina Bay on the Coastal Plain of North Carolina (USA): implications for paleoclimate and oriented lake genesis. Southeastern Geology 51: 145–171.</li><li>Moore C. R. et al. (2019). Sediment cores from White Pond, South Carolina, contain a platinum anomaly, pyrogenic carbon peak, and coprophilous spore decline at 12.8 ka. Scientific Reports 9: 15121. <a href="https://doi.org/10.1038/s41598-019-51552-8" target="_blank" rel="noopener">doi:10.1038/s41598-019-51552-8</a></li><li>Grant J. A., Brooks M. J., Taylor B. E. (1998). New constraints on the evolution of Carolina Bays from ground-penetrating radar. Geomorphology 22(3–4): 325–345. <a href="https://doi.org/10.1016/S0169-555X(97)00074-3" target="_blank" rel="noopener">doi:10.1016/S0169-555X(97)00074-3</a></li><li>Swezey C. S. (2020). Quaternary eolian dunes and sand sheets in inland locations of the Atlantic Coastal Plain province, USA. In Lancaster N., Hesp P. (eds), Inland Dunes of North America. Springer. <a href="https://doi.org/10.1007/978-3-030-40498-7_2" target="_blank" rel="noopener">doi:10.1007/978-3-030-40498-7_2</a></li><li>Holliday V. T. et al. (2023). Comprehensive refutation of the Younger Dryas Impact Hypothesis (YDIH). Earth-Science Reviews 247: 104502. <a href="https://doi.org/10.1016/j.earscirev.2023.104502" target="_blank" rel="noopener">doi:10.1016/j.earscirev.2023.104502</a></li><li>Lundine M., Trembanis A. (2025). Investigating the origin and dynamics of Carolina Bays. Marine Geology 480: 107449. <a href="https://doi.org/10.1016/j.margeo.2024.107449" target="_blank" rel="noopener">doi:10.1016/j.margeo.2024.107449</a></li><li>Davias M. E., Harris T. H. S. (2025). Comment on Lundine and Trembanis, &#x27;Investigating the origin and dynamics of Carolina Bays&#x27;. Marine Geology 485. <a href="https://doi.org/10.1016/j.margeo.2025.107556" target="_blank" rel="noopener">doi:10.1016/j.margeo.2025.107556</a></li><li>Sharitz R. R. (2003). Carolina bay wetlands: unique habitats of the southeastern United States. Wetlands 23(3): 550. <a href="https://doi.org/10.1672/0277-5212(2003)023[0550:CBWUHO]2.0.CO;2" target="_blank" rel="noopener">doi:10.1672/0277-5212(2003)023[0550:CBWUHO]2.0.CO;2</a></li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-carolina-bays" data-t="The Carolina Bays: Half a Million Ovals Pointing One Way"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Carolina Bays: Half a Million Ovals Pointing One Way</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-carolina-bays</span> (updated 25 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-richat-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Earth from Space- Eye of the Sahara ESA515004 - The Richat Structure in Mauritania.jpg" data-cap="Richat Structure, Adrar Plateau, near Ouadane, Mauritania" data-big><figcaption></figcaption></figure><div class="sh-k">Mysteries of the Earth</div><h2 class="sh-t" id="case-richat-st" tabindex="-1">The Eye of the Sahara: Atlantis in the Desert?</h2><p class="sh-s">From orbit it looks like a giant blue-and-white eye staring out of the Sahara. Some believe it is the ruin of Atlantis.</p><div class="sh-v"><span class="vstamp vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><p class="sh-claim"><b>What the stamp rates:</b> The Richat Structure in Mauritania is the site of Plato&#x27;s Atlantis.</p></div><p class="v4-q">Are the Sahara&#x27;s great concentric rings the remains of Plato&#x27;s Atlantis?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>In Mauritania, rings 40 kilometres across stare up out of the Sahara: the Eye of the Sahara.</li><li>Some say it is Plato&#x27;s Atlantis.</li><li>The rings are tilted beds of rock hundreds of millions of years old, shaped by doming and erosion, and they continue underground.</li><li>They are eight times too big for Plato&#x27;s city, far inland and high above any sea.</li><li>No walls, canals or artefacts have been reported inside; a settlement in the once-green Sahara is possible, but it would not be Atlantis.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Geology</span><span class="thr">Texts and scripts</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="40" >40</b><span class="ctr-u"> km</span></div><div class="ctr-l">diameter of the Richat Structure</div><div class="ctr-c">Matton et al. 2005</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="27" >27</b><span class="ctr-u"> stadia</span></div><div class="ctr-l">diameter of Plato&#x27;s rings of land and water, about 5 km</div><div class="ctr-c">Plato, Critias</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="3" >3</b><span class="ctr-u"> rings</span></div><div class="ctr-l">nested rings of outward-dipping hard rock</div><div class="ctr-c">Matton et al. 2005</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="99" >99</b><span class="ctr-u"> million years</span></div><div class="ctr-l">age of carbonatite intrusions in the centre</div><div class="ctr-c">Matton and Jébrak 2014; Abdeina et al. 2024</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The Richat Structure in Mauritania is the site of Plato&#x27;s Atlantis.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The rings themselves are the problem for the claim: they are tilted beds of rock hundreds of millions of years old, shaped by doming and erosion, and they continue underground. No walls, canals, harbour, or city-age artefacts have been reported inside them. The size is wrong by a factor of about eight for Plato&#x27;s rings, the site is far inland and high above the sea, and at 11,600 years ago the sea was even lower and farther away. A lost settlement in a green Sahara is possible in principle, but it would not be Plato&#x27;s ringed island city.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Geology textbooks present the Richat as a settled eroded dome, and on the main point they are right. But the details are still moving: new dating in 2024 suggests two magmatic episodes about 100 million years apart, so the story is more complicated than the tidy textbook version. On Atlantis, classicists speak with high confidence that it is invented; that is a reasonable judgement, though strictly an argument about Plato&#x27;s intentions rather than a physical test.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>The Richat Structure is a slightly elliptical dome about 40 km across, made of layered rocks from the late Proterozoic to the Ordovician, with three nested rings of outward-dipping hard beds.<small>Matton et al. 2005</small></li><li>Its centre holds a siliceous breccia formed when hot fluids dissolved limestone and the summit collapsed, together with gabbro ring dikes, kimberlites and carbonatites.<small>Matton et al. 2005; Matton and Jébrak 2014</small></li><li>It is not an impact crater: early claims of shocked quartz (coesite) were shown to be a misidentification in 1969.<small>Dietz et al. 1969; Fudali 1969</small></li><li>Stone tools, including Acheulean hand axes, lie in the wadis in and around the structure, showing people used the area in the deep past.<small>Monod; Sao et al. 2008; Giresse et al. 2012</small></li><li>Plato describes a capital of rings of land and water about 27 stadia across (roughly 5 km), inside an outer wall about 127 stadia across (roughly 23.5 km).<small>Plato, Critias 115d–117e</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether Plato&#x27;s Atlantis story draws on any real memory or place at all, or is a philosophical invention built to illustrate the ideal state of his Republic.</li><li>The exact timing and sequence of magmatism under Richat: a 2024 study suggests the gabbro rings are about 100 million years older than the rest of the complex.</li><li>How wet the Richat area was during the Green Sahara, and who lived there between about 11,000 and 5,000 years ago.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Wind has stripped and mixed much of the Sahara&#x27;s surface, so younger archaeological layers are often thin, scattered or lost.</li><li>The region is remote and has seen only limited systematic archaeological survey; most study has been geological.</li><li>The Egyptian records Plato says Solon consulted have never been found.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Geologists read the Richat as the eroded top of a magmatic dome. Molten rock pushed up flat-lying layers into a dome, hot fluids dissolved and collapsed its summit into breccia, and erosion then cut the tilted layers into rings, with hard quartzite beds standing as ridges and softer beds worn into valleys. The rings are bedrock hundreds of millions of years old, not walls or canals. Most classicists read Atlantis as a moral tale told by Plato, not a record of a real city.</p><ul><li>The rings are layers of sedimentary rock that continue down into the ground at a tilt, as a dome predicts.</li><li>The structure is about 40 km across, roughly eight times the width of Plato&#x27;s ring system and nearly twice his outer wall.</li><li>It lies roughly 500 km from the Atlantic, on a plateau far above sea level.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Since 2018 Jimmy Corsetti has argued on his Bright Insight channel that the Richat matches Plato&#x27;s Atlantis in its most specific details: concentric circles, with rings of water and land; an opening to the sea to the south; white, red and black stone; a large flat plain; and mountains to the north, the Atlas range, named for Atlantis&#x27;s first king. Plato placed Atlantis beyond the Pillars of Heracles, facing the Atlantic, and dated its fall 9,000 years before Solon, about 11,600 years ago, when the Sahara was turning green and wet. A catastrophic flood, he suggests, could have swept the city away.</p><ul><li>Concentric rings are rare in nature and are the single most distinctive feature of Plato&#x27;s city.</li><li>Plato&#x27;s date for the fall falls close to the end of the Younger Dryas and the start of the Green Sahara.</li><li>The region is beyond the Pillars of Heracles, as Plato said, and bordered to the north by mountains named Atlas.</li></ul><div class="face-s"><b>Its strongest point</b><p>Plato&#x27;s Atlantis is the only famous ancient city described as concentric rings, and the most striking set of natural rings on Earth sits beyond the Pillars of Heracles, in a land that was green and wet at roughly the date Plato gives.</p></div><p class="face-cr"><b>Credit</b> Jimmy Corsetti (Bright Insight); George Sarantitis; David Edwards and other online researchers</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>A systematic survey and excavation inside the rings that found worked stone, walls, harbour works or metal dated to around 11,600 years ago.</li><li>Sediment cores from the valleys between the rings showing whether they ever held standing water, and when.</li><li>Ground-penetrating radar or high-resolution elevation mapping looking for straight canals or foundations cut across the natural bedding.</li><li>Any independent ancient source, earlier than Plato, describing Atlantis or its location.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,069 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Eye of the Sahara: Atlantis in the Desert?"><button type="button" class="wtoc-i" data-go="richat-s1">An eye in the desert</button><button type="button" class="wtoc-i" data-go="richat-s2">Plato&#x27;s city of rings</button><button type="button" class="wtoc-i" data-go="richat-s3">The case for Atlantis in Mauritania</button><button type="button" class="wtoc-i" data-go="richat-s4">What the rocks say</button><button type="button" class="wtoc-i" data-go="richat-s5">Measuring Plato against the desert</button><button type="button" class="wtoc-i" data-go="richat-s6">What remains open</button></nav></div><section class="wsec" id="richat-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>An eye in the desert</h3><p>Fly over western Mauritania and the flat, sand-coloured Adrar plateau suddenly opens into a bullseye: ring after ring of dark ridges and pale valleys, about 40 kilometres across. Astronauts have long used it as a landmark, and satellite images have made it famous far beyond geology. Geologists call it the Richat Structure; everyone else calls it the Eye of the Sahara.</p><p>For decades nobody could say what it was. In the 1950s and 1960s it looked like the scar of a giant meteorite. Then it looked like a volcano, though nothing in it had erupted in the ordinary way. Only in 2005 did a Canadian team publish a full explanation. By then, the rings had caught the imagination of people reading a much older text.</p><blockquote class="wpull"><p>Ring after ring of dark ridges and pale valleys, 40 kilometres across, staring up out of the Sahara.</p></blockquote></section><section class="wsec" id="richat-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Plato&#x27;s city of rings</h3><p>In two dialogues written around 360 BCE, the Timaeus and the Critias, Plato tells of Atlantis, a naval power beyond the Pillars of Heracles that attacked Athens and was swallowed by the sea in a single day and night, 9,000 years before the Athenian statesman Solon. He says the story came from Egyptian priests. The capital, he writes, was built as a set of rings.</p><blockquote class="quote"><p>The largest of the zones into which a passage was cut from the sea was three stadia in breadth, and the zone of land which came next of equal breadth; but the next two zones, the one of water, the other of land, were two stadia, and the one which surrounded the central island was a stadium only in width.</p><cite>Plato, Critias 115e–116a, trans. Benjamin Jowett (1892)</cite></blockquote><p>Plato adds that the builders quarried stone of three colours, white, black and red, and that the island&#x27;s great plain looked towards the south, sheltered from the north by mountains. Rings of land and water are an unusual design for a city, and his description is precise enough to measure. That precision is what has drawn people to the Richat.</p></section><section class="wsec" id="richat-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The case for Atlantis in Mauritania</h3><p>The researcher George Sarantitis proposed the Richat as Atlantis in 2008, after re-reading Plato&#x27;s text. The idea went global in 2018, when Jimmy Corsetti, host of the YouTube channel Bright Insight, published a video that spread the idea to a huge new audience. In 2025 he summed up his case on social media: the Richat is made of concentric circles, with rings of water and land; it opened to the sea on the south; it holds white, red and black stones; it sits beside a large flat plain; and it has mountains to the north named Atlas, after Atlantis&#x27;s first king.</p><p>Two further points give the idea its pull. Plato puts Atlantis beyond the Pillars of Heracles, the Strait of Gibraltar, and the Richat does lie beyond them, on the Atlantic side of Africa. And Plato&#x27;s date for the catastrophe, about 11,600 years ago, falls close to the end of the Younger Dryas cold spell and the start of the African Humid Period, when the Sahara held lakes, rivers and grassland. On this reading a vast flood, perhaps from the last melting of the ice age, destroyed a ringed city in a green land that later dried into desert.</p><aside class="wcall"><b>Fresh from the field</b><p>In 2024 El Houssein Abdeina and colleagues published the first argon–argon dating of the Richat&#x27;s gabbro rings in the journal Lithos. The results suggest the gabbros were intruded between about 230 and 200 million years ago, during the great volcanic outpouring that accompanied the opening of the Atlantic, roughly 100 million years before the carbonatites at the centre. Earlier airborne magnetic and satellite gravity surveys by the same group traced a large gabbroic body deep beneath the rings.</p></aside></section><section class="wsec" id="richat-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>What the rocks say</h3><figure class="wx wx--steps" id="richat-f2" data-n="4"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">Building an eye: how the rings formed</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Building an eye: how the rings formed"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" class="wx-svg" role="img" aria-labelledby="richat-f2-t"><title id="richat-f2-t">How the Richat rings formed: layering, doming, dissolution and erosion</title><defs><clipPath id="richat-f2-clip"><rect x="40" y="112" width="640" height="228"/></clipPath></defs><text class="wx-t-cap" x="24" y="28">Building an eye · schematic cross-section, west to east, c. 50 km</text><rect class="wx-sky" x="40" y="44" width="640" height="66"/><polygon class="wx-rock" points="40,238.7 50,238.4 60,238.0 70,237.5 80,236.9 90,236.2 100,235.4 110,234.5 120,233.4 130,232.1 140,230.7 150,229.1 160,227.3 170,225.4 180,223.3 190,221.0 200,218.5 210,215.9 220,213.2 230,210.4 240,207.6 250,204.7 260,201.9 270,199.2 280,196.5 290,194.1 300,191.8 310,189.8 320,188.1 330,186.8 340,185.8 350,185.2 360,185.0 370,185.2 380,185.8 390,186.8 400,188.1 410,189.8 420,191.8 430,194.1 440,196.5 450,199.2 460,201.9 470,204.7 480,207.6 490,210.4 500,213.2 510,215.9 520,218.5 530,221.0 540,223.3 550,225.4 560,227.3 570,229.1 580,230.7 590,232.1 600,233.4 610,234.5 620
