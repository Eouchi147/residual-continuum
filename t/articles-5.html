rcle cx="505" cy="270" r="6.5" class="wx-card wx-edge-soft"/><circle cx="455" cy="312" r="2.2" class="wx-c2"/><circle cx="492" cy="296" r="2.2" class="wx-c2"/><circle cx="530" cy="318" r="2.2" class="wx-c2"/><line x1="505" y1="126" x2="505" y2="252" class="wx-thin"/><text x="440" y="102" class="wx-t-n wx-t-a">At least 37 people</text><text x="440" y="119" class="wx-t-s">cal 890–1160 CE · beads, iron knife, bell</text></g><g class="wx-st" data-s="5"><ellipse cx="318" cy="336" rx="30" ry="6" class="wx-stone3 wx-edge"/><path d="M650,340 C646,322 660,312 676,318 C688,324 690,336 686,340 Z" class="wx-rock wx-edge"/><text x="318" y="318" text-anchor="middle" class="wx-t-s wx-halo">stone disc</text><text x="668" y="304" text-anchor="middle" class="wx-t-s wx-halo">boulder marker</text></g><rect x="26" y="378" width="110" height="5" class="wx-inkfill"/><text x="81" y="398" text-anchor="middle" class="wx-t-s">1 m</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> A jar is carved and set up. At Site 2, sediment beneath jars gives OSL ages of 1240–660 BCE, a maximum age for placement.</p><ol class="wx-steplist"><li>A jar is carved and set up. At Site 2, sediment beneath jars gives OSL ages of 1240–660 BCE, a maximum age for placement.</li><li>Proposed first stage: a body is laid in a smaller jar or grave to decompose.</li><li>The bones are gathered and carried to a large jar: a secondary burial.</li><li>Generation after generation, Jar 1 fills: at least 37 people, cal 890–1160 CE, with glass beads, an iron knife and a bell.</li><li>Around the jars, stone discs and limestone boulders mark buried pots and graves, as at Site 1.</li></ol><figcaption>One proposed sequence, built on the Site 75 excavation. Jar 1 drawn to scale from its published size; the smaller jar and the first stage of burial are the excavators&#x27; proposal. <span class="wx-src">Based on: Jar 1 dimensions (base 2.05 m, preserved height 1.30 m) and contents from Skopal et al. 2026; two-stage model proposed by the same authors; grave markers from Shewan, O&#x27;Reilly and Luangkhoth 2016; OSL from Shewan et al. 2021. Small jar and body are schematic.</span></figcaption><p class="vh">Cross-section of a large stone jar 2.05 m across and 1.3 m high, drawn beside a 1.7 m person, with a smaller jar to its left. Step 1: the jar is carved and set in place, possibly as early as 1240 to 660 BCE. Step 2: a body is laid to decompose in a smaller jar or grave, a proposed first stage. Step 3: bones are gathered and carried to the large jar. Step 4: the large jar fills with the disarticulated bones of at least 37 people between about 890 and 1160 CE, with beads, a knife and a bell. Step 5: stone discs and boulders mark graves on the ground around the jars.</p></figure><p>Until recently that story had a hole in the middle: very few bones had been found inside a jar. That changed at Site 75, about 70 km northeast of Phonsavan. In 2024 a team led by Nicholas Skopal reported uncremated human bone inside a stone jar there. In 2026 they published Jar 1, a conglomerate vessel about 2.05 m across at the base, still undisturbed inside. It held the jumbled bones of at least 37 people, from toddlers about a year and a half old to adults, with some teeth deliberately removed in life, a ritual practice known across mainland Southeast Asia.</p></section><section class="wsec" id="plain-of-jars-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The case for a longer, stranger story</h3><p>The strongest challenge does not come from the giants of legend. It comes from the calendar. In 2021 Louise Shewan and colleagues dated sediment beneath jars at Site 2 by optically stimulated luminescence, which measures when mineral grains last saw daylight. The result: the jars were set in place possibly as early as 1240–660 BCE, in the late Bronze and early Iron Age. Every dated burial, though, is far younger. Human bone at Site 1 gave radiocarbon ages of roughly 772–950 and 1046–1219 CE, and the Site 75 bones date to about 890–1160 CE.</p><figure class="wx wx--static" id="plain-of-jars-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">The two thousand year gap</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The two thousand year gap"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" class="wx-svg" role="img" aria-labelledby="plain-of-jars-f1-t"><title id="plain-of-jars-f1-t">Dated evidence at the Plain of Jars on one time scale</title><text x="24" y="28" class="wx-t-cap">Dated evidence on one time scale · 100 px = 500 years</text><line x1="160" y1="50" x2="160" y2="300" class="wx-guide"/><line x1="260" y1="50" x2="260" y2="300" class="wx-guide"/><line x1="360" y1="50" x2="360" y2="300" class="wx-guide"/><line x1="460" y1="50" x2="460" y2="300" class="wx-guide"/><line x1="560" y1="50" x2="560" y2="300" class="wx-guide"/><rect x="112" y="68" width="116" height="24" rx="3" class="wx-stone3 wx-edge wx-growx" style="--d:1"/><g class="wx-pop" style="--d:4"><text x="242" y="78" class="wx-t-b">Jars set in place (OSL, Site 2)</text><text x="242" y="95" class="wx-t-s">1240–660 BCE · a maximum age for placement</text></g><rect x="514.4" y="138" width="35.6" height="24" rx="3" class="wx-c1 wx-edge wx-growx" style="--d:6"/><rect x="569.2" y="138" width="34.6" height="24" rx="3" class="wx-c1 wx-edge wx-growx" style="--d:7"/><g class="wx-pop" style="--d:8"><text x="500" y="148" text-anchor="end" class="wx-t-b">Burials around the jars, Site 1</text><text x="500" y="165" text-anchor="end" class="wx-t-s">radiocarbon on bone: c. 772–950 and 1046–1219 CE</text></g><rect x="538" y="204" width="54" height="24" rx="3" class="wx-c4 wx-edge wx-growx" style="--d:9"/><g class="wx-pop" style="--d:10"><text x="524" y="214" text-anchor="end" class="wx-t-b">Jar 1, Site 75: at least 37 people</text><text x="524" y="231" text-anchor="end" class="wx-t-s">eight radiocarbon dates, cal 890–1160 CE</text></g><g class="wx-pop" style="--d:12"><line x1="228" y1="96" x2="228" y2="252" class="wx-dash"/><line x1="514.4" y1="166" x2="514.4" y2="252" class="wx-dash"/><path d="M228,252 L228,262 L514.4,262 L514.4,252" class="wx-hl"/><text x="371.2" y="282" text-anchor="middle" class="wx-t-n wx-t-a wx-halo">c. 1,400 years with no dated activity yet</text></g><line x1="60" y1="300" x2="660" y2="300" class="wx-bold"/><line x1="60" y1="300" x2="60" y2="307" class="wx-line"/><line x1="160" y1="300" x2="160" y2="307" class="wx-line"/><line x1="260" y1="300" x2="260" y2="307" class="wx-line"/><line x1="360" y1="300" x2="360" y2="307" class="wx-line"/><line x1="460" y1="300" x2="460" y2="307" class="wx-line"/><line x1="560" y1="300" x2="560" y2="307" class="wx-line"/><line x1="660" y1="300" x2="660" y2="307" class="wx-line"/><text x="60" y="323" text-anchor="middle" class="wx-t-s">1500 BCE</text><text x="160" y="323" text-anchor="middle" class="wx-t-s">1000 BCE</text><text x="260" y="323" text-anchor="middle" class="wx-t-s">500 BCE</text><text x="360" y="323" text-anchor="middle" class="wx-t-s">1 CE</text><text x="460" y="323" text-anchor="middle" class="wx-t-s">500 CE</text><text x="560" y="323" text-anchor="middle" class="wx-t-s">1000 CE</text><text x="660" y="323" text-anchor="middle" class="wx-t-s">1500 CE</text><rect x="60" y="338" width="100" height="5" class="wx-inkfill"/><text x="168" y="344" class="wx-t-s">500 years</text></svg></div></div><figcaption>Dated evidence at the Plain of Jars on one time scale. The only dates for jar placement are far older than every dated burial. <span class="wx-src">Based on: OSL and Site 1 radiocarbon ranges from Shewan et al. 2021 (PLOS ONE); Site 75 range from Skopal et al. 2026 (Antiquity). Bars span the published ranges; gap measured from 660 BCE to 772 CE.</span></figcaption><p class="vh">A horizontal time chart from 1500 BCE to 1500 CE, with a scale bar of 500 years. The top bar, far left, marks optically stimulated luminescence ages for jar placement at Site 2, 1240 to 660 BCE, noted as a maximum age. Two bars far to the right mark radiocarbon ages for burials: Site 1, about 772 to 1219 CE, and Jar 1 at Site 75, cal 890 to 1160 CE, with at least 37 people. A bracket between them marks about 1,400 years with no dated activity yet.</p></figure><p>That leaves a gap of well over a thousand years with no dated activity at all. Maybe early burials exist and simply have not been found, since so little has been dug. Or maybe the medieval people who packed Jar 1 with their ancestors were reusing monuments that were already ancient to them, just as later peoples in Europe placed their dead in Neolithic tombs. The legend of rice wine, the idea of rain-water cisterns, and the lids that seem to fit storage all remain possible readings of what the jars were first cut to do.</p><blockquote class="wpull"><p>The bones tell us what the jars became. They do not yet tell us what the jars were born to be.</p></blockquote><p>The dating team says as much. Its OSL ages are maximum values, and it notes that whether all the sites are of the same age still needs work. Treating the burials and the jars as one event would be a shortcut the evidence does not allow.</p></section><section class="wsec" id="plain-of-jars-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>How new tools changed the picture</h3><p>Almost everything we know with numbers is new. Zircon geochronology tied a jar to its quarry. Luminescence gave the first estimate of when the jars were set up. Radiocarbon on bone and teeth dated the funerals. At Site 75, the chemistry of the glass beads added a surprise: most were of a South Asian mineral soda, high alumina type, two were Mesopotamian soda plant-ash glass, and one probably came from southern China or northern Vietnam. The people who used the jars were tied into trade routes that reached the Indian Ocean and beyond.</p><aside class="wcall"><b>Fresh from the field</b><p>In 2024 Skopal and colleagues reported the first substantial evidence of uncremated bodies inside a Lao stone jar, at Site 75. In 2026, in Antiquity, they published Jar 1 at the same site: at least 37 people, eight radiocarbon dates spanning cal 890–1160 CE, twenty glass beads, an iron knife and a copper-alloy bell. They propose that smaller jars were where bodies first decomposed, and the big jar was a multigenerational ossuary.</p></aside></section><section class="wsec" id="plain-of-jars-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What the bombs are hiding</h3><p>The plateau sits on one of the most heavily bombed landscapes on Earth. During the Secret War of the 1960s and early 1970s, the United States dropped an estimated 270 million cluster bomblets on Laos, and tens of millions failed to explode. Craters still pock the jar sites, and some jars were shattered. Since 2004 the Mines Advisory Group, working with UNESCO and the Lao government, has cleared the main visitor sites, but many of the more than 120 sites remain unsafe to excavate.</p><p>So the sample is tiny. A handful of sites, a few trenches, and a few jars with contents intact. Absence of early burials in that sample is weak evidence against them. Colani&#x27;s finds, dug before radiocarbon dating existed, cannot now be tied to exact layers. And the villages where the jar makers lived, ate and carved have not been found.</p></section><section class="wsec" id="plain-of-jars-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle it</h3><p>The question has become sharp enough to test. If the jars were funerary from the start, then sealed deposits under and inside early-placed jars should contain first-millennium BCE bone, beads or ash. If they were made for something else, residues on the inner walls might show it.</p><ul class="wlist"><li>OSL dates from under many more jars, across many sites, to see whether placement was early everywhere.</li><li>Excavation of intact jars at sites with early OSL ages, looking for burial material of the same age.</li><li>Residue analysis on the inner walls of empty jars.</li><li>Ancient DNA and isotopes from the Site 1 and Site 75 skeletons, to learn who these people were and where they grew up.</li><li>More bomb clearance, so the other sites can be read at all.</li></ul><p>For now the verdict is clear on one point and open on another. These were places of the dead for centuries. Whether they were made that way, in the second millennium BCE, is the part of the mystery still waiting under the grass.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">1,240 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Earliest OSL age for jar placement at Site 2 (range 1240–660 BCE)</span></li><li class="wtl-use" style="--i:1"><span class="wtl-y">772 CE</span><span class="wtl-k">In use</span><span class="wtl-t">Earliest radiocarbon date on a Site 1 burial</span></li><li class="wtl-use" style="--i:2"><span class="wtl-y">890 CE</span><span class="wtl-k">In use</span><span class="wtl-t">Burials begin in Jar 1 at Site 75, continuing to c. 1160</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">1935 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Madeleine Colani publishes Mégalithes du Haut-Laos</span></li><li class="wtl-loss" style="--i:4"><span class="wtl-y">1964 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Heavy US bombing of the plateau begins</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">2004 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Mines Advisory Group starts clearing visitor sites</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2016 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Australian and Lao team reopens Site 1</span></li><li class="wtl-event" style="--i:7"><span class="wtl-y">2019 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Inscribed as a UNESCO World Heritage site</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2021 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Zircon, OSL and radiocarbon study published</span></li><li class="wtl-find" style="--i:9"><span class="wtl-y">2026 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Jar 1 at Site 75 published: at least 37 people</span></li></ol><details class="srcs"><summary>Sources for this case (9)</summary><ol><li>Colani, M. (1935). Mégalithes du Haut-Laos (Hua Pan, Tran Ninh). 2 vols. Paris: École française d&#x27;Extrême-Orient.</li><li>Shewan, L., O&#x27;Reilly, D. and Luangkhoth, T. (2016). Recent excavations at a Megalithic jar site in Laos: site 1 revisited. Antiquity Project Gallery 90(351). <a href="https://doi.org/10.15184/S2978855200900118" target="_blank" rel="noopener">doi:10.15184/S2978855200900118</a></li><li>Shewan, L., O&#x27;Reilly, D., Armstrong, R., Toms, P., Webb, J., Beavan, N., Luangkhoth, T., Wood, J., Halcrow, S., Domett, K., Van Den Bergh, J. and Chang, N. (2021). Dating the megalithic culture of Laos: Radiocarbon, optically stimulated luminescence and U/Pb zircon results. PLOS ONE 16(3): e0247167. <a href="https://doi.org/10.1371/journal.pone.0247167" target="_blank" rel="noopener">doi:10.1371/journal.pone.0247167</a></li><li>Skopal, N., Bounxaythip, S., Cooper, C., Pradier, B., Pilgrim, T., Stewart, T., Florin, A., Devantier-Thomas, T., Baker, D. and Philip, S. (2024). Preliminary site report of a stone jar burial in the Lao People&#x27;s Democratic Republic. Archaeological Research in Asia 38: 100517. <a href="https://doi.org/10.1016/j.ara.2024.100517" target="_blank" rel="noopener">doi:10.1016/j.ara.2024.100517</a></li><li>Skopal, N., Pradier, B., Bounxaythip, S. et al. (2026). The death jar: a new mortuary tradition at the Plain of Jars, Lao PDR. Antiquity 100(412): 1050–1067. <a href="https://doi.org/10.15184/aqy.2026.10352" target="_blank" rel="noopener">doi:10.15184/aqy.2026.10352</a></li><li>UNESCO World Heritage Centre (2019). Megalithic Jar Sites in Xiengkhuang: Plain of Jars (property 1587).</li><li>University of Melbourne (2021). Researchers solve more of the mystery of Laos megalithic jars. Press release, 3 March 2021.</li><li>Plain of Jars Archaeological Project (Monash University, University of Melbourne, Lao Ministry of Information, Culture and Tourism). Project reports, 2016–2021.</li><li>Mines Advisory Group and UNESCO (2004–2007). Clearance of unexploded ordnance at Plain of Jars Sites 1, 2, 3, 16, 23, 25 and 52.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-plain-of-jars" data-t="The Plain of Jars: Stone Vessels of the Dead?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Plain of Jars: Stone Vessels of the Dead?</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-plain-of-jars</span> (updated 25 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-diquis-spheres-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Diquis Stone Spheres in situ Finca 6 CR 12 2020.jpg" data-cap="Stone spheres in place at Finca 6, Diquís Delta, Costa Rica" data-big><figcaption></figcaption></figure><div class="sh-k">Mysteries of the Earth</div><h2 class="sh-t" id="case-diquis-spheres-st" tabindex="-1">The Stone Spheres of the Diquís: Round on Purpose</h2><p class="sh-s">Hundreds of near-round stone balls, some taller than a person, lay hidden in a Costa Rican jungle until bulldozers found them.</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> Lines of Diquís spheres were laid out to mark astronomical or navigational directions.</p></div><p class="v4-q">Were the Diquís spheres lined up to point at the sky or the sea?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>More than 300 stone balls, some 2.5 metres across, were carved in Costa Rica between about 600 and 1500 CE.</li><li>Some once stood in lines, and people ask whether the lines pointed at stars or sea routes.</li><li>Almost every sphere was moved before it could be mapped; only a few groups remain in place.</li><li>With two or three points, any line points somewhere.</li><li>No published survey shows a sky alignment, so the idea waits for a proper test at the one site where spheres still stand.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Astronomy</span><span class="thr">Archaeology</span><span class="thr">Mathematics</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="300" >300</b><span class="ctr-u"> spheres</span></div><div class="ctr-l">known from the Diquís region</div><div class="ctr-c">Hoopes 2010; UNESCO 2014</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="2.57" data-dec="2">2.57</b><span class="ctr-u"> m</span></div><div class="ctr-l">diameter of the largest known sphere</div><div class="ctr-c">UNESCO 2014</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="4" >4</b><span class="ctr-u"> sites</span></div><div class="ctr-l">inscribed by UNESCO in 2014</div><div class="ctr-c">UNESCO 2014</div></div><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="5" >5</b><span class="ctr-u"> cm</span></div><div class="ctr-l">diameter variation on some spheres</div><div class="ctr-c">Hoopes; Museo Nacional de Costa Rica</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Lines of Diquís spheres were laid out to mark astronomical or navigational directions.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The rows exist, but almost every sphere was moved before it could be mapped, and the surviving in-place groups are few. With two or three points, any line points somewhere. We found no published archaeoastronomical survey showing solar or lunar orientation, and the navigation idea has no supporting evidence of ocean voyaging from the delta. The spheres date to c. 600–1500 CE and sit in local settlements. The idea is testable at Finca 6; it has simply not been shown.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Museum labels and UNESCO say the spheres were made by Diquís chiefdoms and that their purpose is uncertain, which matches the evidence well. Popular accounts go wrong in the other direction, calling them perfect spheres or linking them to Atlantis. The one soft spot in the official story is dating: spheres are dated by the layers and pottery around them, not directly, and most were moved from those layers long ago.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>More than 300 stone spheres are known from the Diquís Delta and Isla del Caño, from a few centimetres to about 2.57 m across.<small>UNESCO 2014; Hoopes 2010</small></li><li>Most are of hard igneous rock (gabbro or granodiorite); about a dozen are of shell-rich limestone and about a dozen of sandstone.<small>Lothrop 1963; Museo Nacional de Costa Rica</small></li><li>They belong to chiefdom settlements with mounds, paved areas and cemeteries dated c. 500–1500 CE; the earliest spheres are placed around 600 CE and most after 1000 CE.<small>UNESCO 2014; Hoopes 2010</small></li><li>They were first reported when the United Fruit Company cleared land for banana plantations in the 1930s; Doris Stone published the first study in 1943 and Samuel Lothrop a major survey in 1963.<small>Stone 1943; Lothrop 1963</small></li><li>At Finca 6 some spheres still stand in their original linear arrangements, and in 2007 a sphere was excavated in place beside a mound.<small>UNESCO 2014; Corrales and Badilla 2005</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>What the spheres meant: symbols of rank and authority, markers of territory, images of the Sun and Moon, or something else.</li><li>Whether their lines and groupings were oriented to astronomical events, to landmarks, or simply to the plazas and houses around them.</li><li>Exactly how they were shaped and checked for roundness, and how the largest were moved kilometres from the hills.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Most spheres were moved by plantation workers, bulldozers and collectors before anyone mapped them, so their original arrangements are lost.</li><li>Treasure hunters drilled and dynamited spheres in the hope of finding gold inside; several were destroyed.</li><li>The makers left no writing, and the Spanish conquest broke the chain of tradition that might have explained them.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Archaeologists attribute the spheres to the chiefdoms of the Diquís Delta, ancestors in the broad sense of the region&#x27;s Indigenous peoples. They were made by pecking and grinding boulders with harder hammerstones and polishing them with sand, over roughly nine centuries. Spheres stood in plazas and along approaches to elite houses, often on mounds and in lines, and most researchers read them as statements of power and identity. What they meant beyond that is openly unknown. As John Hoopes put it, the makers &#x27;didn&#x27;t leave any written records&#x27;.</p><ul><li>Unfinished spheres and gabbro sources lie in the hills several kilometres from the finished examples.</li><li>Some spheres still carry hammerstone marks from their shaping.</li><li>The spheres are found with local pottery, mounds and cemeteries, not with anything foreign.</li><li>UNESCO inscribed four sites in 2014 as evidence of complex Precolumbian chiefdom societies.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Zapp and Erikson argued that the spheres were the work of an advanced seafaring culture, and that lines of spheres encoded bearings for navigation across oceans, relics of a lost maritime science. A milder and more common reading is astronomical: that some lines mark the rising or setting of the Sun at solstices or equinoxes, or that the spheres themselves stand for the Sun and Moon. The attraction is real. Making a two-metre ball of gabbro takes enormous effort, and people who took that much care over shape may well have cared about placement too.</p><ul><li>Spheres were found in straight lines, some of which survive at Finca 6.</li><li>Perfect roundness was pursued at great cost, which suggests the form carried meaning.</li><li>Many Precolumbian societies built alignments to the Sun into their architecture.</li></ul><div class="face-s"><b>Its strongest point</b><p>The lines are real. Early investigators recorded spheres set in rows, and UNESCO notes linear arrangements still in place at Finca 6. Nobody has yet shown what, if anything, those rows point to.</p></div><p class="face-cr"><b>Credit</b> Ivar Zapp and George Erikson (Atlantis in America, 1998); astronomical readings by various writers</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Survey every surviving in-place line with modern instruments and test its orientation against solstice, equinox and lunar horizon events, with a statistical control for chance.</li><li>Georeference the maps made by Doris Stone and Samuel Lothrop to reconstruct the original positions of spheres that were later moved.</li><li>Excavate beneath in-place spheres for datable material, to learn when each line was set out.</li><li>Match sphere rock to its quarries by geochemistry, to reconstruct production sites and transport routes.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,151 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Stone Spheres of the Diquís: Round on Purpose"><button type="button" class="wtoc-i" data-go="diquis-spheres-s1">Balls in the banana fields</button><button type="button" class="wtoc-i" data-go="diquis-spheres-s2">What is solid</button><button type="button" class="wtoc-i" data-go="diquis-spheres-s3">The mainstream story: symbols of power</button><button type="button" class="wtoc-i" data-go="diquis-spheres-s4">Lines that point somewhere?</button><button type="button" class="wtoc-i" data-go="diquis-spheres-s5">What bulldozers and dynamite erased</button><button type="button" class="wtoc-i" data-go="diquis-spheres-s6">What would settle it</button></nav></div><section class="wsec" id="diquis-spheres-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Balls in the banana fields</h3><p>In the 1930s, crews of the United Fruit Company were clearing forest on the delta of the Río Grande de Térraba, in southern Costa Rica, to plant bananas. Their machines kept hitting stone. Not rubble, but balls: smooth, heavy, astonishingly round, some the size of an orange and some taller than the men who found them. Nobody in the region remembered who had made them. Many lay in rows.</p><p>More than 300 are now known, from the delta and from Isla del Caño off the coast. The largest, at El Silencio, is about 2.57 m across. Weights of 15–16 tonnes are widely quoted for the giants, although simple geometry for a solid ball of this dense rock that size gives more like 24–27 tonnes, so the true figure is uncertain. They were carved from gabbro and granodiorite, tough igneous rocks, far harder than the limestone of most ancient sculpture.</p><p>They have since rolled into popular culture. According to the University of Kansas archaeologist John Hoopes, the spheres helped inspire the giant rolling boulder in the opening of Raiders of the Lost Ark. They also attracted a flood of speculation, from Atlantis to visitors from space, which Hoopes has spent years answering with evidence.</p><blockquote class="wpull"><p>A perfect-looking sphere is one of the hardest shapes to make by hand. Someone thought it was worth doing, hundreds of times.</p></blockquote></section><section class="wsec" id="diquis-spheres-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What is solid</h3><p>Doris Stone published the first study in 1943, and Samuel Lothrop of Harvard&#x27;s Peabody Museum surveyed the delta and published a major report in 1963. Later work by the National Museum of Costa Rica, led in the field by Francisco Corrales and Adrián Badilla from 2002, tied the spheres to villages with house mounds, paved areas and cemeteries. Layers and pottery around them place the first spheres around 600 CE, with most made after 1000 CE and the tradition ending before the Spanish conquest.</p><figure class="wx wx--static" id="diquis-spheres-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">The spheres to scale</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The spheres to scale"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" class="wx-svg" role="img" aria-labelledby="diquis-spheres-f2-t"><title id="diquis-spheres-f2-t">Diquís spheres at one scale with a person</title><text x="24" y="28" class="wx-t-cap">Side view at one scale · 1 m = 110 px</text><line x1="20" y1="350" x2="534" y2="350" class="wx-line"/><circle cx="175" cy="208.6" r="141.4" class="wx-stone2 wx-edge wx-pop" style="--d:1"/><path d="M95,140 A100,100 0 0 1 150,95" class="wx-line wx-o40"/><line x1="33.6" y1="368" x2="316.4" y2="368" class="wx-dim"/><line x1="33.6" y1="362" x2="33.6" y2="374" class="wx-dim"/><line x1="316.4" y1="362" x2="316.4" y2="374" class="wx-dim"/><text x="175" y="388" text-anchor="middle" class="wx-t-n">c. 2.57 m</text><g class="wx-pop" style="--d:4"><text x="330" y="72" class="wx-t-b">Largest known sphere, El Silencio</text><text x="330" y="89" class="wx-t-s">weight often quoted as c. 15–16 t;</text><text x="330" y="104" class="wx-t-s">geometry suggests c. 24–27 t</text></g><g class="wx-pop" style="--d:3"><circle cx="362" cy="174" r="11" class="wx-inkfill"/><line x1="362" y1="185" x2="362" y2="272" class="wx-line"/><line x1="362" y1="272" x2="350" y2="350" class="wx-line"/><line x1="362" y1="272" x2="374" y2="350" class="wx-line"/><line x1="340" y1="215" x2="384" y2="215" class="wx-line"/><text x="362" y="152" text-anchor="middle" class="wx-t-s">1.7 m</text></g><circle cx="455" cy="311.5" r="38.5" class="wx-stone2 wx-edge wx-pop" style="--d:5"/><g class="wx-pop" style="--d:6"><text x="394" y="252" class="wx-t-b">0.7 m</text><text x="394" y="267" class="wx-t-s">smallest at UNESCO sites</text></g><circle cx="515" cy="347" r="3" class="wx-stone3 wx-edge wx-pop" style="--d:7"/><text x="508" y="332" text-anchor="middle" class="wx-t-s wx-pop" style="--d:7">a few cm</text><g class="wx-pop" style="--d:9"><rect x="540" y="130" width="170" height="210" rx="8" class="wx-card wx-edge-soft"/><text x="625" y="152" text-anchor="middle" class="wx-t-b">Out of round</text><ellipse cx="625" cy="228" rx="54" ry="43" class="wx-stone wx-edge"/><circle cx="625" cy="228" r="48.5" class="wx-dash"/><text x="625" y="298" text-anchor="middle" class="wx-t-s">over 5 cm on some spheres,</text><text x="625" y="313" text-anchor="middle" class="wx-t-s">about 2% of a 2.5 m ball;</text><text x="625" y="328" text-anchor="middle" class="wx-t-s">drawn 10× exaggerated</text></g><rect x="580" y="378" width="110" height="5" class="wx-inkfill"/><text x="635" y="400" text-anchor="middle" class="wx-t-s">1 m</text></svg></div></div><figcaption>The largest known sphere, a small one and a person at one scale, with an exaggerated view of how far a sphere can be out of round. <span class="wx-src">Based on: Diameters from UNESCO 2014 (0.7–2.57 m at the inscribed sites) and Hoopes 2010; roundness variation of more than 5 cm from the Museo Nacional and Hoopes; weight range quoted by Hoopes 2010, geometric estimate ours (volume of a 2.57 m sphere times density 2.7–3.0 t/m³).</span></figcaption><p class="vh">Side view at a scale of 110 pixels per metre. On the left, the largest known sphere, about 2.57 m across, from El Silencio, labelled with quoted weights of 15 to 16 tonnes and a geometric estimate of 24 to 27 tonnes. Next to it a 1.7 m person reaches about two thirds of its height. Then a sphere 0.7 m across, the smallest size at the UNESCO sites, and a tiny dot for spheres only a few centimetres across. An inset on the right compares a true circle with an oval exaggerated ten times, showing a diameter difference of over 5 cm, about 2 percent on a 2.5 m sphere. A scale bar shows 1 m.</p></figure><p>Their roundness is impressive but not magical. Lothrop&#x27;s often-quoted precision figures were averages, and some spheres vary by more than 5 cm in diameter. On a ball 2 m across that is about 2.5%, invisible to the eye and entirely within reach of patient hand work.</p><aside class="wcall"><b>How do we know how they were made?</b><p>Partly from the spheres and partly from the hills. Some carry the marks of hammerstones. Unfinished spheres lie in the hills near the gabbro sources, several kilometres from the finished ones. The method archaeologists reconstruct is simple and slow: rough out a boulder, peck it into shape with harder stones, then grind and polish it with sand. No sphere-making workshop has been fully excavated, and the exact way roundness was checked is still a guess.</p></aside></section><section class="wsec" id="diquis-spheres-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The mainstream story: symbols of power</h3><p>In the archaeological reading, the spheres belong to the chiefdoms that ruled the delta for about a thousand years. They stood in public plazas and along approaches to the houses of important families, sometimes on low mounds, sometimes in lines. Making and moving a multi-tonne ball required skilled carvers and many hands, and a chief who could command that labour had something to show for it. The spheres were, on this view, monuments to rank and community, the way a cathedral or a courthouse is today.</p><figure class="wx wx--steps" id="diquis-spheres-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">From boulder to sphere</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="From boulder to sphere"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" class="wx-svg" role="img" aria-labelledby="diquis-spheres-f1-t"><title id="diquis-spheres-f1-t">From boulder to stone sphere in five steps</title><defs><marker id="diquis-spheres-f1-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" class="wx-accfill"/></marker></defs><text x="24" y="28" class="wx-t-cap">One stone, five stages · schematic, not to scale</text><line x1="20" y1="196" x2="700" y2="196" class="wx-line"/><path d="M134,140 l10,0" class="wx-thin"/><path d="M140,135 l6,5 l-6,5" class="wx-thin"/><path d="M276,140 l10,0" class="wx-thin"/><path d="M282,135 l6,5 l-6,5" class="wx-thin"/><path d="M418,140 l10,0" class="wx-thin"/><path d="M424,135 l6,5 l-6,5" class="wx-thin"/><path d="M560,140 l10,0" class="wx-thin"/><path d="M566,135 l6,5 l-6,5" class " cy="145.0" r="1.3" class="wx-inkfill wx-o60"/><circle cx="319.9" cy="142.9" r="1.3" class="wx-inkfill wx-o60"/><circle cx="373.7" cy="135.1" r="1.3" class="wx-inkfill wx-o60"/><circle cx="356.3" cy="112.6" r="1.3" class="wx-inkfill wx-o60"/><circle cx="351.6" cy="177.0" r="1.3" class="wx-inkfill wx-o60"/><circle cx="374.5" cy="126.0" r="1.3" class="wx-inkfill wx-o60"/><circle cx="361.1" cy="127.5" r="1.3" class="wx-inkfill wx-o60"/><circle cx="355.8" cy="129.5" r="1.3" class="wx-inkfill wx-o60"/><circle cx="390.3" cy="130.1" r="1.3" class="wx-inkfill wx-o60"/><circle cx="323.3" cy="139.2" r="1.3" class="wx-inkfill wx-o60"/><circle cx="368.6" cy="151.9" r="1.3" class="wx-inkfill wx-o60"/><circle cx="334.1" cy="138.4" r="1.3" class="wx-inkfill wx-o60"/><circle cx="368.5" cy="134.0" r="1.3" class="wx-inkfill wx-o60"/><circle cx="352.3" cy="115.9" r="1.3" class="wx-inkfill wx-o60"/><circle cx="360.6" cy="155.5" r="1.3" class="wx-inkfill wx-o60"/><circle cx="355.4" cy="147.0" r="1.3" class="wx-inkfill wx-o60"/><circle cx="344.9" cy="147.9" r="1.3" class="wx-inkfill wx-o60"/><circle cx="370.5" cy="122.0" r="1.3" class="wx-inkfill wx-o60"/><circle cx="377.4" cy="174.2" r="1.3" class="wx-inkfill wx-o60"/><circle cx="370.8" cy="158.6" r="1.3" class="wx-inkfill wx-o60"/><circle cx="390.2" cy="135.1" r="1.3" class="wx-inkfill wx-o60"/><circle cx="361.5" cy="125.2" r="1.3" class="wx-inkfill wx-o60"/><circle cx="378.1" cy="141.5" r="1.3" class="wx-inkfill wx-o60"/><circle cx="341.5" cy="168.5" r="1.3" class="wx-inkfill wx-o60"/><circle cx="347.3" cy="145.4" r="1.3" class="wx-inkfill wx-o60"/><circle cx="346.6" cy="148.5" r="1.3" class="wx-inkfill wx-o60"/><circle cx="339.9" cy="151.4" r="1.3" class="wx-inkfill wx-o60"/><circle cx="353.3" cy="167.2" r="1.3" class="wx-inkfill wx-o60"/><circle cx="369.7" cy="145.7" r="1.3" class="wx-inkfill wx-o60"/><circle cx="348.5" cy="138.5" r="1.3" class="wx-inkfill wx-o60"/><circle cx="367.1" cy="121.1" r="1.3" class="wx-inkfill wx-o60"/><circle cx="353.4" cy="115.7" r="1.3" class="wx-inkfill wx-o60"/><circle cx="398.1" cy="155.9" r="1.3" class="wx-inkfill wx-o60"/><circle cx="365.5" cy="146.6" r="1.3" class="wx-inkfill wx-o60"/><ellipse cx="406" cy="90" rx="13" ry="9" transform="rotate(-30 406 90)" class="wx-rock wx-edge"/></g><g class="wx-st" data-s="4"><circle cx="502" cy="140" r="46" class="wx-stone2 wx-edge"/><path d="M462,78 A64,64 0 0 1 542,78" class="wx-hl"/><path d="M468,88 A52,52 0 0 1 536,88" class="wx-dim"/><line x1="462" y1="78" x2="468" y2="88" class="wx-hl"/><line x1="542" y1="78" x2="536" y2="88" class="wx-hl"/></g><g class="wx-st" data-s="5"><circle cx="644" cy="140" r="46" class="wx-stone2 wx-edge"/><path d="M616,118 A34,34 0 0 1 640,104" class="wx-line wx-o40"/><path d="M650,74 L696,74" class="wx-hl" marker-end="url(#diquis-spheres-f1-arr)"/></g><g><circle cx="38" cy="228" r="9" class="wx-num"/><text x="38" y="232" text-anchor="middle" class="wx-numt">1</text><text x="52" y="233" class="wx-t-b">Boulder</text><text x="26" y="255" class="wx-t-s">gabbro or granodiorite</text><text x="26" y="271" class="wx-t-s">in the hills</text></g><g><circle cx="180" cy="228" r="9" class="wx-num"/><text x="180" y="232" text-anchor="middle" class="wx-numt">2</text><text x="194" y="233" class="wx-t-b">Rough out</text><text x="168" y="255" class="wx-t-s">hammering</text><text x="168" y="271" class="wx-t-s">(heat: proposed)</text></g><g><circle cx="322" cy="228" r="9" class="wx-num"/><text x="322" y="232" text-anchor="middle" class="wx-numt">3</text><text x="336" y="233" class="wx-t-b">Peck</text><text x="310" y="255" class="wx-t-s">harder stones,</text><text x="310" y="271" class="wx-t-s">thousands of blows</text></g><g><circle cx="464" cy="228" r="9" class="wx-num"/><text x="464" y="232" text-anchor="middle" class="wx-numt">4</text><text x="478" y="233" class="wx-t-b">Check</text><text x="452" y="255" class="wx-t-s">curved gauge</text><text x="452" y="271" class="wx-t-s">(proposed)</text></g><g><circle cx="606" cy="228" r="9" class="wx-num"/><text x="606" y="232" text-anchor="middle" class="wx-numt">5</text><text x="620" y="233" class="wx-t-b">Polish, move</text><text x="594" y="255" class="wx-t-s">sand and water</text><text x="594" y="271" class="wx-t-s">how moved: unknown</text></g><text x="360" y="306" text-anchor="middle" class="wx-t-s">Hammerstone marks and unfinished spheres support steps 1, 3 and 5; steps 2 and 4 are proposals.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Choose a boulder of gabbro or granodiorite in the hills, several kilometres from the delta villages.</p><ol class="wx-steplist"><li>Choose a boulder of gabbro or granodiorite in the hills, several kilometres from the delta villages.</li><li>Rough it out by hammering off high points; heating and cooling to crack off the surface is a proposed extra.</li><li>Peck the surface with harder hammerstones, thousands of blows, until the stone is nearly round.</li><li>Check the curve against a gauge or cords and correct the high spots (proposed; no gauges found).</li><li>Grind and polish with sand and water, then move the sphere to a plaza or mound; how is unknown.</li></ol><figcaption>The sequence archaeologists reconstruct from unfinished spheres and tool marks. Steps marked proposed have no direct evidence yet. <span class="wx-src">Based on: Method as reconstructed by Lothrop 1963, Hoopes and the Museo Nacional de Costa Rica from hammerstone marks and unfinished spheres; heating and gauges are proposals without direct evidence. Schematic, not to scale.</span></figcaption><p class="vh">Five panels in a row show one stone changing shape. Step 1: an irregular boulder of gabbro in the hills. Step 2: the boulder is roughed out by hammering, with a dashed circle showing the target sphere and flakes flying off; heat and water to crack the surface is marked as proposed. Step 3: a near-round stone covered in small pecking marks, with a hammerstone. Step 4: a curved gauge held against the sphere to check roundness, marked as proposed. Step 5: a smooth polished sphere, with an arrow toward the delta settlement and a question mark over how it was moved.</p></figure><p>The spheres were not the only prestige objects of the delta. The same societies worked gold and carved stone statues, and Patricia Fernández and Ifigenia Quintanilla have discussed spheres, metalwork and statuary together as locally made symbols of power. The rare limestone and sandstone spheres, and the concentration of spheres at a few centres such as Finca 4 and Finca 6, fit a landscape where some villages outranked others; UNESCO describes Finca 6 as a likely principal centre and Grijalba-2 as a subordinate one.</p><p>Their inner meaning is openly admitted to be unknown. Archaeologists have suggested they may stand for the Sun or the Moon. The Bribri, an Indigenous people of Costa Rica, tell of them as the cannonballs of Tara, the god of thunder, hurled at the winds. These are not rival theories so much as different kinds of witness, and they may hold memories that stone alone cannot give.</p></section><section class="wsec" id="diquis-spheres-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Lines that point somewhere?</h3><p>The strongest unconventional case starts with the rows. Early investigators found spheres set in straight lines, and some of those lines still stand at Finca 6. In their 1998 book Atlantis in America, Ivar Zapp and George Erikson argued that such lines encoded bearings used by an advanced seafaring culture, a lost science of navigation. A more modest reading, common in popular accounts, is that some rows marked sunrise or sunset at the solstices and equinoxes.</p><p>Both ideas are worth taking seriously, because they are testable. The Diquís people certainly watched the sky; farmers everywhere do. And a society that spent so much effort on the shape of a stone may well have cared where it stood. The question is whether any surviving line points to something that chance would not explain.</p><p>The test is harder than it sounds. At the delta&#x27;s latitude, about 9° north, the Sun on the June solstice rises roughly 24° north of due east, and on the December solstice roughly 24° south of it; equinox sunrise is due east (our calculation for a flat horizon). A straight line points two ways, so it can hit one of just three directions. Allow 2° of error either side and a line placed at random would still match one about one time in fifteen. A handful of hits among a handful of lines means little. Many lines, measured on the real horizon, could mean a lot.</p><blockquote class="wpull"><p>The rows are real. What they point at, if anything, has never been measured and published.</p></blockquote></section><section class="wsec" id="diquis-spheres-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>What bulldozers and dynamite erased</h3><p>Here time and greed did their worst. Plantation workers pushed spheres aside with heavy machines. Rumours spread that they held gold, and treasure hunters drilled holes in them and blew them apart with dynamite; the National Museum reassembled six of the broken ones. Others were hauled away as garden ornaments and status symbols for homes across the country. By the time archaeologists arrived, most had been moved from the spots where their makers set them.</p><p>That matters above all for the alignment question. A line needs its points. Stone&#x27;s and Lothrop&#x27;s notes and maps are now the main record of many original groupings, and they were made before modern survey tools.</p><aside class="wcall"><b>Fresh from the field</b><p>Recent work has been about rescue more than revelation. In 2022 conservators from Mexico&#x27;s INAH and the National Museum of Costa Rica cleaned, stabilised and reburied six spheres at Finca 6 to protect them. In 2024 a 65 cm gabbro sphere was among 395 artefacts returned to Costa Rica from the United States. In 2025 the museum restored three limestone spheres from Finca 4. We found no published lidar or archaeoastronomical survey of the delta yet.</p></aside></section><section class="wsec" id="diquis-spheres-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What would settle it</h3><ul class="wlist"><li>Measure every in-place line at Finca 6 and other sites and compare the bearings with solstice, equinox and lunar events on the real horizon, with a test for chance.</li><li>Georeference the old maps to rebuild lost arrangements before the last witnesses fade.</li><li>Excavate beneath in-place spheres for charcoal or pottery that dates when each was set.</li><li>Fingerprint the rock of each sphere to find its quarry, and so its route to the plaza.</li></ul><p>Until then the verdict splits in two. That the Diquís chiefdoms made the spheres, by hand, over many centuries, is strongly supported. That their lines were aimed at the stars or across the oceans is an idea still waiting for its first measurement.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">600 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Earliest spheres, dated by association with layers and pottery</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">1000 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Most spheres made after this date</span></li><li class="wtl-loss" style="--i:2"><span class="wtl-y">1500 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Sphere-making ends before the Spanish conquest</span></li><li class="wtl-loss" style="--i:3"><span class="wtl-y">1935 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Banana plantation clearing uncovers spheres; many moved or dynamited</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">1943 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Doris Stone publishes the first study</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1963 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Samuel Lothrop&#x27;s survey of the Diquís Delta</span></li><li class="wtl-find" style="--i:6"><span class="wtl-y">2007 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Sphere excavated in its original place at Finca 6</span></li><li class="wtl-event" style="--i:7"><span class="wtl-y">2014 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Four sites inscribed as UNESCO World Heritage</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2022 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Mexican and Costa Rican team conserves and reburies spheres at Finca 6</span></li><li class="wtl-event" style="--i:9"><span class="wtl-y">2024 CE</span><span class="wtl-k">Event</span><span class="wtl-t">A 65 cm gabbro sphere is repatriated from the United States</span></li></ol><details class="srcs"><summary>Sources for this case (10)</summary><ol><li>Stone, D. (1943). A preliminary investigation of the flood plain of the Río Grande de Térraba, Costa Rica. American Antiquity 9(1): 74–88. <a href="https://doi.org/10.2307/275453" target="_blank" rel="noopener">doi:10.2307/275453</a></li><li>Lothrop, S. K. (1963). Archaeology of the Diquís Delta, Costa Rica. Papers of the Peabody Museum of Archaeology and Ethnology 51. Cambridge, MA: Harvard University.</li><li>McGimsey, C. R. III (1965). Review of Archaeology of the Diquís Delta, Costa Rica, by S. K. Lothrop. American Antiquity (1965): 122. <a href="https://doi.org/10.2307/2694039" target="_blank" rel="noopener">doi:10.2307/2694039</a></li><li>Corrales, F. and Badilla, A. (2005). El paisaje cultural del Delta del Diquís. San José: UNESCO and Museo Nacional de Costa Rica.</li><li>UNESCO World Heritage Centre (2014). Precolumbian Chiefdom Settlements with Stone Spheres of the Diquís (property 1453). Decision of the 38th session.</li><li>University of Kansas (2010). Mysterious stone spheres in Costa Rica investigated (John Hoopes). ScienceDaily, 22 March 2010.</li><li>Fernández, P. and Quintanilla, I. (2003). Metallurgy, balls, and stone statuary in the Diquís Delta, Costa Rica: local production of power symbols. In J. Quilter and J. W. Hoopes (eds), Gold and Power in Ancient Costa Rica, Panama, and Colombia. Washington, DC: Dumbarton Oaks.</li><li>Amador, J. A. and Alfaro, E. J. (2014). Weather and climate socio-economic impacts in Central America for the management and protection of world heritage sites and the Diquís Delta culture in Costa Rica (a case study). Advances in Geosciences 35: 157–167. <a href="https://doi.org/10.5194/adgeo-35-157-2014" target="_blank" rel="noopener">doi:10.5194/adgeo-35-157-2014</a></li><li>Zapp, I. and Erikson, G. (1998). Atlantis in America: Navigators of the Ancient World. Kempton, IL: Adventures Unlimited Press.</li><li>HeritageDaily (2022, 2024, 2025). Reports on the INAH and Museo Nacional conservation of spheres at Finca 6, the repatriation of a gabbro sphere, and the restoration of limestone spheres from Finca 4.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-diquis-spheres" data-t="The Stone Spheres of the Diquís: Round on Purpose"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Stone Spheres of the Diquís: Round on Purpose</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-diquis-spheres</span> (updated 25 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-longyou-caves-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Longyou Xiaonanhai Shishi 2016.12.11 15-56-16.jpg" data-cap="Inside one of the Longyou caverns, Zhejiang" data-big><figcaption></figcaption></figure><div class="sh-k">Mysteries of the Earth</div><h2 class="sh-t" id="case-longyou-caves-st" tabindex="-1">The Longyou Caves: Halls Carved in Silence</h2><p class="sh-s">In 1992 villagers drained a pond and found a cathedral-sized hall cut by hand into rock. Then they found twenty-three more.</p><div class="sh-v"><span class="vstamp vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><p class="sh-claim"><b>What the stamp rates:</b> The Longyou caverns were dug mainly as quarries for building stone.</p></div><p class="v4-q">Who dug the Longyou caverns, and what were they for?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Near Longyou in China, at least 24 huge halls were cut by hand into soft rock, with pillars, stairs and drainage.</li><li>No record of their making survives.</li><li>The simplest reading is quarrying: they sit beside a river, and enormous volumes of stone were removed.</li><li>But nobody has traced Longyou stone into a dated building, and the careful finishing suggests the space itself mattered.</li><li>Both sides argue from the architecture alone, so the purpose is a genuinely open question.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Engineering</span><span class="thr">Geology</span><span class="thr">Archaeology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="24" >24</b><span class="ctr-u"> caverns</span></div><div class="ctr-l">identified near Shiyan Beicun</div><div class="ctr-c">Yang, Yue and Li 2011</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="1057" >1,057</b><span class="ctr-u"> m²</span></div><div class="ctr-l">floor area of Cavern No. 2</div><div class="ctr-c">Yang, Yue and Li 2011</div></div><div class="ctr"><div class="ctr-v">up to <b class="ctr-n" data-v="18" >18</b><span class="ctr-u"> m</span></div><div class="ctr-l">greatest cavern height</div><div class="ctr-c">Yang, Yue and Li 2011</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="0.55" data-dec="2">0.55</b><span class="ctr-u"> m</span></div><div class="ctr-l">thinnest wall between two caverns</div><div class="ctr-c">Yang, Yue and Li 2011</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The Longyou caverns were dug mainly as quarries for building stone.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:41.7%" role="img" aria-label="Weight of evidence: Open question"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Quarrying explains the location beside a river and the sheer volume removed, and it needs no lost knowledge. But the evidence that would confirm it is missing: nobody has traced Longyou stone into a dated building, and the caverns&#x27; careful finishing, stairs, pillars and drainage suggest the space itself mattered. The purpose-built readings have no direct evidence either, such as burials or stored goods. Both sides argue from the architecture alone, so this is a genuinely open question.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Guides and news stories state confidently that the caverns are &#x27;more than 2,000 years old&#x27; and then say the purpose is a mystery. The honesty about purpose is right. The age is stated more firmly than the evidence allows: the Han pots show the caverns existed when the pots came to rest in the silt, which could be long after the pots were made, and the only firm minimum date comes from a text written before 1626.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>At least 24 artificial caverns have been identified near Shiyan Beicun on the Qu River; ten are complete and stable, the rest failed or partly collapsed.<small>Yang, Yue and Li 2011</small></li><li>The caverns were cut by hand into Cretaceous argillaceous siltstone; floor areas range from about 367 to 1,352 m² and heights from about 8 to 18 m. Cavern No. 2 covers about 1,057 m².<small>Yang, Yue and Li 2011</small></li><li>The walls carry regular bands of chisel marks, the bands 500–600 mm apart and the troughs about 6–14 mm deep.<small>Yang, Yue and Li 2011</small></li><li>Glazed pots of Western Han type (206 BCE–23 CE) were found in Cavern No. 2, and a written reference shows the caverns were known before 1626.<small>Li et al. 2009; Yang, Yue and Li 2011</small></li><li>The complete caverns were full of water when found, and engineering studies conclude that the water helped keep their thin roofs standing.<small>Yang, Yue and Li 2011</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>What the caverns were for: quarries, tombs, storage, a military base, a palace or a place of offering.</li><li>How old they are: the Han pottery gives a date for when the pots came to rest, not for the digging itself.</li><li>Who organised the work, and whether all 24 caverns belong to one project or several periods.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>No text records the digging, the workers or the purpose, although the scale implies a large, organised effort.</li><li>Whatever floor deposits and objects lay inside were disturbed when the caverns were pumped dry in the 1990s, and several caverns have collapsed.</li><li>Where the tens of thousands of cubic metres of removed rock went has not been traced.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Chinese and international engineering geologists have measured the caverns in detail, and archaeologists agree they are human-made, cut with iron chisels, probably around 2,000 years ago or earlier. Beyond that there is no consensus. The engineering team led by Yang Zhifa, Yue Zhongqi and Li Lihui listed quarrying, tombs, underground storage, a Taoist retreat, a secret military camp, a place of sacrifice and a palace, noting that each has reasonable arguments and none is settled. Quarrying is the most ordinary explanation: this soft, even siltstone is easy to cut, and the caverns sit beside a navigable river.</p><ul><li>Iron chisels and top-down, layer-by-layer cutting fit the known technology of the late first millennium BCE.</li><li>The caverns lie on the bank of the Qu River, a natural route for moving heavy stone.</li><li>Underground quarrying of building stone is attested in many regions and periods.</li><li>The Han pottery and later written mention fit an origin in antiquity, not in recent centuries.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>The challenge here is less about aliens than about intent. The caverns look designed. Roofs slope at almost exactly the angle of the rock layers, side walls lean inward, pillars are left at intervals, each cavern has a stair and a drainage system, and walls only half a metre thick separate neighbours without a single breakthrough. Every surface is finished in the same rhythmic pattern of chisel bands. To many observers that is more care than a quarry needs, and the lack of any record of such a vast project is itself strange.</p><ul><li>The regular chisel bands cover walls and ceilings like a finish, not like the rough scars of block extraction.</li><li>The partitions between caverns are as thin as 0.55 m, yet no cavern breaks into its neighbour, which suggests careful planning or surveying.</li><li>Stairs, drainage and inclined walls are features of a space meant to be used or entered.</li></ul><div class="face-s"><b>Its strongest point</b><p>A quarry takes stone and leaves scars. Longyou leaves patterned walls, sloping roofs tuned to the bedding, stairs and pillars, in 24 separate halls that never touch. That looks like a planned space, not a hole left behind.</p></div><p class="face-cr"><b>Credit</b> Researchers who read the caverns as planned architecture, and popular &#x27;lost technology&#x27; writers</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Trace the stone: compare the siltstone with old buildings, walls and tombs along the Qu River to see whether Longyou stone was used elsewhere, and when.</li><li>Date the surfaces or deposits directly, for example with luminescence on sediment sealed on cavern floors or dating of organic material trapped in the earliest silt.</li><li>Search the caverns and their surroundings for tool debris, block-splitting marks, spoil heaps or loading areas that a quarry would leave.</li><li>Look in regional archives and gazetteers for any record of large works, quarries or granaries at this spot.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,142 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Longyou Caves: Halls Carved in Silence"><button type="button" class="wtoc-i" data-go="longyou-caves-s1">The pond that was a doorway</button><button type="button" class="wtoc-i" data-go="longyou-caves-s2">What is solid</button><button type="button" class="wtoc-i" data-go="longyou-caves-s3">The ordinary answer: a quarry</button><button type="button" class="wtoc-i" data-go="longyou-caves-s4">The case for design</button><button type="button" class="wtoc-i" data-go="longyou-caves-s5">What water saved and air is destroying</button><button type="button" class="wtoc-i" data-go="longyou-caves-s6">What would settle it</button></nav></div><section class="wsec" id="longyou-caves-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The pond that was a doorway</h3><p>In June 1992, villagers in Shiyan Beicun, in the hills of western Zhejiang, began pumping out a pond. As the water dropped, walls appeared. Then steps. Then a vast chamber, its sloping ceiling held up by pillars of rock, every surface covered in neat parallel grooves. The pond had been the flooded mouth of a hand-cut hall.</p><p>Nearby ponds turned out to be the same. Engineers now count 24 artificial caverns along the north bank of the Qu River. The biggest, Cavern No. 2, has a floor of about 1,057 m², bigger than four tennis courts, and a ceiling up to 15 m high. Some caverns reach about 18 m. They are cut into soft red siltstone, and no chronicle, inscription or local legend records who made them or why.</p><blockquote class="wpull"><p>A project on this scale must have needed a large, organised workforce. It left behind no name, no date and no reason.</p></blockquote></section><section class="wsec" id="longyou-caves-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What is solid</h3><p>The caverns were measured in detail by engineering geologists led by Yang Zhifa, Yue Zhongqi and Li Lihui. They found ten complete, stable caverns and fourteen that have failed or partly collapsed. The rock is a Cretaceous argillaceous siltstone, fairly strong when dry but much weaker when wet. Floor areas range from about 367 to 1,352 m². Fifteen rock pillars between 4.6 and 12 m tall were left in place to hold the roofs.</p><figure class="wx wx--static" id="longyou-caves-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Inside a Longyou cavern</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Inside a Longyou cavern"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" class="wx-svg" role="img" aria-labelledby="longyou-caves-f1-t"><title id="longyou-caves-f1-t">Schematic cross-section of a Longyou cavern</title><defs><clipPath id="longyou-caves-f1-rock"><path d="M20,120 L700,250 L700,440 L20,440 Z"/></clipPath></defs><text x="24" y="28" class="wx-t-cap">Schematic section · 1 m = 12 px</text><path d="M20,120 L700,250 L700,440 L20, n"/></g><g class="wx-pop" style="--d:8"><text x="196" y="96" class="wx-t-b">Side wall leans in, c. 78°</text><line x1="210" y1="104" x2="172" y2="300" class="wx-thin"/></g><g class="wx-pop" style="--d:9"><text x="420" y="130" class="wx-t-b">Roof slopes c. 21.6°</text><text x="420" y="146" class="wx-t-s">parallel to the rock beds (c. 24°)</text><line x1="470" y1="152" x2="470" y2="331" class="wx-thin"/></g><g class="wx-pop" style="--d:10"><text x="352" y="330" class="wx-t-b wx-halo">Rock pillar</text><text x="352" y="345" class="wx-t-s wx-halo">left in place (4.6–12 m)</text></g><g class="wx-pop" style="--d:11"><text x="214" y="372" class="wx-t-b wx-halo">Full of water</text><text x="214" y="387" class="wx-t-s wx-halo">when found in 1992</text></g><text x="600" y="300" class="wx-t-s wx-halo">siltstone beds</text><rect x="560" y="458" width="120" height="5" class="wx-inkfill"/><text x="560" y="476" text-anchor="middle" class="wx-t-s">0</text><text x="680" y="476" text-anchor="middle" class="wx-t-s">10 m</text></svg></div></div><figcaption>A schematic cross-section based on the published survey: the roof follows the rock layers, the side wall leans inward, a pillar is left standing, and the hall was found full of water. <span class="wx-src">Based on: Angles, heights, pillar range and Cavern No. 2 dimensions from Yang, Yue and Li 2011 and Li et al. 2009. The drawing combines features of several caverns; it is not a survey of one.</span></figcaption><p class="vh">Cross-section through a hillside of layered red siltstone whose beds dip at about 24 degrees. A large hall is cut into it: a tall side wall leaning inward at about 78 degrees, a roof sloping down at about 21.6 degrees parallel to the rock layers, a rock pillar about 10 m tall, and a stair from the portal down to the floor. The hall is shaded as full of water, as found in 1992. A person 1.7 m tall stands on the floor for scale, and a scale bar shows 10 m. The span is about 34 m and the tallest wall about 15 m.</p></figure><p>The design is subtle. The ceilings slope at an average of about 21.6°, close to the 24° dip of the rock beds, so the roof follows a natural layer instead of cutting across it. The side walls lean inward at about 78°. Each cavern has a stair from its entrance to the floor and a drainage system for rainwater. And between Caverns No. 1 and No. 2 the dividing wall is only 0.55–1.3 m thick over 16.5 m, yet the two halls never break into each other.</p><aside class="wcall"><b>How do we know how old they are?</b><p>Not very precisely. Two glazed clay pots of a type typical of the Western Han dynasty (206 BCE–23 CE) were found in Cavern No. 2, a relief sculpture has been placed stylistically between 206 BCE and 589 CE, and a written reference shows the caverns were known before 1626. The pots show the cavern existed when they came to rest, which may have been long after they were made. So &#x27;over 2,000 years old&#x27; is a reasonable estimate, not a measurement.</p></aside></section><section class="wsec" id="longyou-caves-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The ordinary answer: a quarry</h3><p>The simplest explanation is that Longyou was a stone quarry. The siltstone is even, fine and easy to cut with iron tools, and the caverns open onto a river that could carry heavy blocks downstream. The chisel marks show cutting from the top down, layer by layer, which is how underground quarries are commonly worked. And the rock had to go somewhere: on the published dimensions, each large cavern represents thousands of cubic metres of stone removed, and the whole complex probably tens of thousands.</p><p>A rough sum shows the scale. Cavern No. 2 has a floor of about 1,057 m² and a ceiling that slopes from about 15 m down to a few metres. If its average height is around 8 m, some 8,000 m³ of rock came out of that one hall, perhaps 20,000 tonnes of siltstone (our estimate, from the published dimensions). Cutting that with hammers and chisels is a big job, but not an impossible one: it is the kind of volume that organised quarry crews moved across the ancient world.</p><figure class="wx wx--steps" id="longyou-caves-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">Reading the chisel marks</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Reading the chisel marks"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" class="wx-svg" role="img" aria-labelledby="longyou-caves-f2-t"><title id="longyou-caves-f2-t">How the chisel marks suggest a Longyou cavern was cut</title><defs><clipPath id="longyou-caves-f2-cav"><polygon points="70,330 80,90 300,150 305,330"/></clipPath><clipPath id="longyou-caves-f2-panel"><rect x="390" y="90" width="290" height="240"/></clipPath><marker id="longyou-caves-f2-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" class="wx-accfill"/></marker></defs><text x="24" y="28" class="wx-t-cap">Cutting from the top down · schematic</text><text x="390" y="28" class="wx-t-cap">Wall detail · enlarged</text><rect x="40" y="60" width="290" height="285" class="wx-stone2 wx-edge"/><rect x="60" y="54" width="30" height="36" class="wx-paper wx-edge"/><g clip-path="url(#longyou-caves-f2-cav)"><rect x="60" y="90" width="260" height="60" class="wx-paper wx-st" data-s="1"/><rect x="60" y="150" width="260" height="45" class="wx-paper wx-st" data-s="2"/><rect x="60" y="195" width="260" height="45" class="wx-paper wx-st" data-s="2"/><rect x="60" y="240" width="260" height="45" class="wx-paper wx-st" data-s="3"/><rect x="60" y="285" width="260" height="45" class="wx-paper wx-st" data-s="3"/></g><polygon points="70,330 80,90 300,150 305,330" class="wx-line"/><line x1="72" y1="150" x2="303" y2="150" class="wx-guide"/><line x1="72" y1="195" x2="303" y2="195" class="wx-guide"/><line x1="72" y1="240" x2="303" y2="240" class="wx-
