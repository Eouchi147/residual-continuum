<script type="text/x-tpl" id="case-band-of-holes-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Tambo Colorado, Peru.jpg" data-cap="Tambo Colorado, an Inca centre in the Pisco Valley near Monte Sierpe" data-big><figcaption></figcaption></figure><div class="sh-k">Mysteries of the Earth</div><h2 class="sh-t" id="case-band-of-holes-st" tabindex="-1">The Band of Holes: A Spreadsheet Dug Into a Mountain?</h2><p class="sh-s">Some 5,200 man-sized holes snake over a desert ridge for 1.5 km. For ninety years nobody could say why. Drones and pollen now offer an answer.</p><div class="sh-v"><span class="vstamp vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><p class="sh-claim"><b>What the stamp rates:</b> The holes of Monte Sierpe were laid out as a pre-Inca and Inca system for exchange and tribute accounting.</p></div><p class="v4-q">Who dug thousands of holes in rows on a Peruvian ridge, and why?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>About 5,200 holes run in a band for 1.5 kilometres along a ridge in Peru.</li><li>Drone maps show them grouped in sections with repeating counts, like a giant table.</li><li>Pollen of maize and basket plants was found inside them, and one date puts them in the 1300s.</li><li>They sit between two Inca centres on trade routes.</li><li>The best current reading is an accounting system for goods and tribute, close to a knotted-string khipu laid out on the ground; likely, not yet shown.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Mathematics</span><span class="thr">Biology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="5200" >5,200</b><span class="ctr-u"> holes</span></div><div class="ctr-l">in the band</div><div class="ctr-c">Bongers et al. 2025</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="1.5" data-dec="1">1.5</b><span class="ctr-u"> km</span></div><div class="ctr-l">length along the ridge</div><div class="ctr-c">Bongers et al. 2025</div></div><div class="ctr"><div class="ctr-v">at least <b class="ctr-n" data-v="60" >60</b><span class="ctr-u"> sections</span></div><div class="ctr-l">picked out by drone mapping</div><div class="ctr-c">Bongers et al. 2025</div></div><div class="ctr"><div class="ctr-v">at least <b class="ctr-n" data-v="27" >27</b><span class="ctr-u"> pollen types</span></div><div class="ctr-l">found in 21 sediment samples</div><div class="ctr-c">Bongers et al. 2025</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The holes of Monte Sierpe were laid out as a pre-Inca and Inca system for exchange and tribute accounting.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The reading is the first one based on systematic evidence: a full drone map with repeating counts, pollen of maize and basket plants inside the holes, a date in the fourteenth century, and a location between two Inca centres on trade routes. Rival uses find little support in the ground. But the accounting idea is an interpretation of patterns, supported by one date and a set of sediment samples, and the khipu parallel is suggestive rather than direct. It is the best current explanation, not yet a demonstrated one.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 2 of 6, cautious"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>cautious</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks and museum labels have mostly said nothing, and popular guides called the band unexplained, which was fair. The risk now runs the other way: headlines in 2025 said the mystery was solved. The evidence supports a strong hypothesis with one date and a first set of pollen samples. A little more caution than the headlines, and more confidence than the old silence, would match the evidence.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Monte Sierpe is a band of about 5,200 holes running some 1.5 km along a ridge in the Pisco Valley, 14–22 m wide; the holes are 1–2 m across and 0.5–1 m deep, many rimmed with stone.<small>Bongers et al. 2025</small></li><li>The band was brought to wide attention by aerial photographs taken by the Shippee-Johnson expedition and published in 1933.<small>Shippee 1933</small></li><li>Drone mapping divides the band into at least 60 sections, several with repeating counts, such as nine rows of eight holes.<small>Bongers et al. 2025</small></li><li>Charcoal from one hole gave a radiocarbon date of 635 ± 15 BP, calibrated to about 1320–1405 CE.<small>Bongers et al. 2025</small></li><li>Pollen from sediments in the holes includes maize and reed or bulrush types used for baskets.<small>Bongers et al. 2025</small></li><li>The site lies between two Inca administrative centres, Tambo Colorado and Lima La Vieja, on routes linking coast and highlands.<small>Bongers et al. 2025; Hyslop 1984</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the numerical regularities in some sections reflect a counting design or are partly a product of which sections were picked out.</li><li>Whether the band began as a marketplace and only later became an Inca tribute-counting device, or served one purpose throughout.</li><li>How closely the layout really mirrors khipu structure, since no one can read most khipu beyond their numbers.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Only one radiocarbon date has been published for the whole band, so when digging began and how long it lasted remain uncertain.</li><li>Whatever the holes once held has gone; only microscopic pollen and a few fragments remain.</li><li>Most khipu from the region were lost or destroyed after the Spanish conquest, and the knowledge of how to read them in full was not passed on.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>The 2025 study led by Jacob Bongers argues that Monte Sierpe began, probably before the Inca, as a place of exchange in the busy Chincha world, where coastal and highland people traded maize, cotton and other goods. Holes arranged in sections and rows made quantities visible at a glance. After the Inca conquest in the fifteenth century, the band may have been reused as a large accounting device for collecting tribute, its layout echoing the grouped cords of a khipu found in the same valley.</p><ul><li>Maize and basket-reed pollen fit goods being set down in the holes.</li><li>Repeating counts per row and section fit a system for measuring quantities.</li><li>A Pisco-area khipu has 80 groups of mostly 10–12 cords, a grouped structure like the band&#x27;s sections.</li><li>Defence, burial, mining and water collection are argued against by the absence of weapons, bones, ore and water.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>For decades the band was treated as one of Peru&#x27;s great riddles. Earlier visitors suggested graves robbed long ago, storage pits, defensive positions, gardens or devices to catch fog and water, and on television it became a candidate for something stranger. Their strongest point was not a single theory but a fair observation: nobody had dated the site, mapped it closely or tested what was in the holes, so confident explanations were guesses.</p><ul><li>The layout is so regular and so large that ordinary uses such as farming seemed to fit poorly.</li><li>No Spanish chronicle describes the site or its purpose.</li><li>Similar pit fields are rare, so there was no obvious parallel to reason from.</li></ul><div class="face-s"><b>Its strongest point</b><p>Until 2025 the band had one published date, no pollen work and no full map. Calling it a mystery was the honest position, and the new study rests on only a first round of evidence.</p></div><p class="face-cr"><b>Credit</b> Earlier investigators and popular writers: storage, grave, defence and water-capture readings; ancient-astronaut television</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Radiocarbon-date many holes from different sections to learn whether the band was dug at once or grew over centuries.</li><li>Excavate a sample of holes fully, sieving for seeds, fibres, fragments of baskets and textiles, and test them for residues.</li><li>Run a statistical test of the counts across all 60-plus sections, not only the most regular ones, against random layouts.</li><li>Compare the full structure of the Pisco khipu with the band&#x27;s sections, cord by section, to see whether the numbers correspond.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">6 min read · 1,220 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Band of Holes: A Spreadsheet Dug Into a Mountain?"><button type="button" class="wtoc-i" data-go="band-of-holes-s1">A serpent of holes</button><button type="button" class="wtoc-i" data-go="band-of-holes-s2">What is solid</button><button type="button" class="wtoc-i" data-go="band-of-holes-s3">Every guess on the table</button><button type="button" class="wtoc-i" data-go="band-of-holes-s4">What the drones and the pollen found</button><button type="button" class="wtoc-i" data-go="band-of-holes-s5">A spreadsheet dug into the ground</button><button type="button" class="wtoc-i" data-go="band-of-holes-s6">What time has taken</button><button type="button" class="wtoc-i" data-go="band-of-holes-s7">What would settle it</button></nav></div><section class="wsec" id="band-of-holes-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A serpent of holes</h3><p>Fly over the dry foothills of the Pisco Valley, about 35 km inland from the Pacific, and a strange stripe crosses the ridges below. It looks like a line of pockmarks, or the track of some enormous creature, winding up and down the slopes for about a kilometre and a half. Up close it is a band of holes, each wide enough for a person to stand in, thousands upon thousands of them, set in rows as neatly as seats in a stadium.</p><p>Local people call the place Monte Sierpe, serpent mountain, and it has also been known as Cerro Viruela, smallpox hill. The outside world noticed it in 1933, when aerial photographs from the Shippee-Johnson expedition were published. Then the questions began. Who dug some 5,200 holes in a desert with no water to spare? Why in rows? Why here? Nobody left an account. No Spanish chronicler described the site. The pits were empty.</p><blockquote class="wpull"><p>For ninety years the band was a message written in holes, with nobody left who could read it.</p></blockquote></section><section class="wsec" id="band-of-holes-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What is solid</h3><p>The measured facts are now good. The band runs roughly north to south for about 1.5 km and is 14–22 m wide, averaging around 19 m. The holes are 1–2 m across and 0.5–1 m deep, and many have raised rims lined with stones. There are about 5,200 of them, a figure from a full drone survey, replacing older estimates of 5,000 to 6,000.</p><p>What the drone survey revealed was structure. The band is not one continuous field of pits but at least 60 distinct sections, separated by gaps or changes in pattern. Some sections repeat numbers with striking regularity. One has nine consecutive rows of eight holes. Another has six rows of seven and a final row of eight, 50 holes in all. A third alternates rows of seven and eight for at least twelve rows.</p><figure class="wx wx--static" id="band-of-holes-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">The band, its sections and a khipu</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The band, its sections and a khipu"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" class="wx-svg" role="img" aria-labelledby="band-of-holes-f1-t"><title id="band-of-holes-f1-t">Monte Sierpe: a 1.5 km band of about 5,200 holes, the counts in two sections, and a khipu from the same valley</title><text x="24" y="26" class="wx-t-cap">The band from above · schematic, not to scale</text><path d="M20,150 C110,112 170,128 240,100 C320,70 380,96 450,80 C540,60 610,86 700,70 L700,168 L20,168 Z" class="wx-sand wx-o60"/><path d="M20,150 C110,112 170,128 240,100 C320,70 380,96 450,80 C540,60 610,86 700,70" class="wx-line wx-draw" pathLength="1" style="--d:0"/><g class="wx-pop" style="--d:2"><circle cx="60.0" cy="140.0" r="1.8" class="wx-inkfill wx-o60"/><circle cx="60.0" cy="146.0" r="1.8" class="wx-inkfill wx-o60"/><circle cx="60.0" cy="152.0" r="1.8" class="wx-inkfill wx-o60"/><circle cx="68.7" cy="140.0" r="1.8" class="w " y1="258" x2="652.0" y2="349" class="wx-line wx-s6"/><circle cx="652.0" cy="295" r="1.6" class="wx-inkfill"/><line x1="656.0" y1="258" x2="656.0" y2="330" class="wx-line wx-s6"/><circle cx="656.0" cy="280" r="1.6" class="wx-inkfill"/><line x1="660.0" y1="258" x2="660.0" y2="337" class="wx-line wx-s6"/><circle cx="660.0" cy="285" r="1.6" class="wx-inkfill"/><line x1="664.0" y1="258" x2="664.0" y2="344" class="wx-line wx-s6"/><circle cx="664.0" cy="290" r="1.6" class="wx-inkfill"/><line x1="668.0" y1="258" x2="668.0" y2="351" class="wx-line wx-s6"/><circle cx="668.0" cy="295" r="1.6" class="wx-inkfill"/><line x1="672.0" y1="258" x2="672.0" y2="332" class="wx-line wx-s6"/><circle cx="672.0" cy="280" r="1.6" class="wx-inkfill"/><line x1="676.0" y1="258" x2="676.0" y2="339" class="wx-line wx-s6"/><circle cx="676.0" cy="285" r="1.6" class="wx-inkfill"/><line x1="680.0" y1="258" x2="680.0" y2="346" class="wx-line wx-s6"/><circle cx="680.0" cy="290" r="1.6" class="wx-inkfill"/><text x="660.0" y="376" text-anchor="middle" class="wx-t-s">11</text><text x="470" y="398" class="wx-t-m">80 groups, most of 10, 11 or 12 cords</text><text x="470" y="414" class="wx-t-s">(4 of the 80 groups drawn)</text></g><text x="24" y="456" class="wx-t-s">Counts after Bongers et al. 2025. Hole sizes drawn uniform for clarity.</text></svg></div></div><figcaption>The band winds along a ridge; close up it breaks into sections with repeating counts, a grouped structure like the khipu from the same valley. <span class="wx-src">Based on: Bongers et al. 2025, Antiquity (dimensions, section counts, khipu VA16135 in the Ethnologisches Museum Berlin). Band shape schematic, not to scale.</span></figcaption><p class="vh">Top: a schematic ridge with a winding band of small dots running across it, labelled about 1.5 km long, about 5,200 holes and at least 60 sections; notes give the band as 14 to 22 metres wide and the holes as 1 to 2 metres across and half a metre to a metre deep. A small box on the band leads to two grids below. Section A shows nine rows of eight holes, 72 in all. Section B shows six rows of seven and one row of eight, 50 in all. On the right, a khipu is drawn as a main cord with four groups of hanging cords of 10, 11, 12 and 11 strings with knots, labelled 80 groups, most of 10, 11 or 12 cords.</p></figure><p>The location matters too. Monte Sierpe sits in the chaupiyunga, the transitional zone between coast and highlands, where routes carrying goods between the two met. It lies between two Inca administrative centres, Tambo Colorado and Lima La Vieja, and close to the heartland of the Chincha, one of the richest trading societies of the late pre-Hispanic Andes.</p></section><section class="wsec" id="band-of-holes-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Every guess on the table</h3><p>Before any systematic study, almost every idea was possible, and most were tried. Graves, perhaps looted long ago. Storage pits for crops. Defensive positions for slingers. Little gardens that trapped moisture. Devices for collecting water or fog. Mines. On television the band joined the catalogue of sites said to be beyond ordinary explanation.</p><p>The challengers deserve credit for one thing: they refused to let a thin explanation pass. The early visitors, including Victor von Hagen on his 1953 survey of Inca roads and Dwight Wallace and Frederic Engel in the early 1970s, recorded the site but never settled it. Without dates, maps or tests of the soil, every interpretation was a guess, and calling the band a mystery was the honest position.</p><p>The 2025 study tested these ideas against the ground. There are no fortifications or sling stones, which counts against defence. Very few human remains have turned up, which counts against a cemetery. There is no ore, which counts against mining. And in one of the driest places on Earth, rain and fog are too scarce for the holes to have made sense as water traps.</p></section><section class="wsec" id="band-of-holes-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>What the drones and the pollen found</h3><aside class="wcall"><b>Fresh from the field</b><p>In November 2025 Jacob Bongers and eleven colleagues published the first detailed study of Monte Sierpe in the journal Antiquity. They mapped the whole band with a drone, took 21 sediment samples from holes and identified at least 27 types of pollen, including maize in at least six samples, two of them from the centre of the site, and reeds or bulrushes of the kind woven into baskets. Charcoal from one hole gave a radiocarbon date of about 1320–1405 CE.</p></aside><p>The pollen is the quiet star of the study. Maize does not grow on a bare desert ridge, and neither do marsh reeds. Their pollen in the holes suggests that people brought plants there, most simply as goods: cobs of maize, and baskets or bundles woven from reeds. It is the first physical hint of what once filled the pits.</p><p>The date places use of at least one hole in the fourteenth century, before the Inca took the region in the fifteenth. That fits the idea of a pre-Inca origin in the Late Intermediate Period, roughly 1000–1400 CE, followed by continued use under the Inca. One date, though, is a single point on what may be a long history.</p></section><section class="wsec" id="band-of-holes-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>A spreadsheet dug into the ground</h3><p>Here is the reading the team proposes. In the Late Intermediate Period, the Chincha world was a hub of exchange. A Spanish document of the sixteenth century, studied by the historian María Rostworowski, describes Chincha as home to thousands of merchants. Perhaps, Bongers suggests, Monte Sierpe began as a kind of periodic market, a place where traders and farmers set out goods such as maize and cotton, each community in its own section, with the holes acting as standard measures.</p><figure class="wx wx--steps" id="band-of-holes-f2" data-n="5"><div class="wx-head"><span class= -glow wx-edge-soft"/><path d="M424,302 L456,302 L452,322 L428,322 Z" class="wx-wood wx-edge"/><circle cx="434" cy="306" r="3" class="wx-glow wx-edge-soft"/><circle cx="444" cy="305" r="3" class="wx-glow wx-edge-soft"/></g><g class="wx-st" data-s="2"><circle cx="262" cy="118" r="9" class="wx-num"/><text x="262" y="122" text-anchor="middle" class="wx-numt">2</text><text x="278" y="122" class="wx-t-b">Each group fills its own section</text><text x="278" y="137" class="wx-t-s">one hole, one unit of goods?</text></g><g class="wx-st" data-s="3"><path d="M96,278 L96,268 L550,268 L550,278" class="wx-hl"/><text x="320" y="258" text-anchor="middle" class="wx-t-b wx-t-a">5 of 7 holes filled in this row</text><circle cx="32" cy="158" r="9" class="wx-num"/><text x="32" y="162" text-anchor="middle" class="wx-numt">3</text><text x="48" y="162" class="wx-t-b">Count by row and section</text><text x="48" y="177" class="wx-t-s">rows of 7 or 8 make totals easy</text><text x="48" y="191" class="wx-t-s">to read at a glance</text></g><g class="wx-st wx-hide" data-s="4"><line x1="520" y1="60" x2="670" y2="60" class="wx-bold wx-s6"/><line x1="528" y1="60" x2="528" y2="120" class="wx-line wx-s6"/><circle cx="528" cy="78" r="2.2" class="wx-inkfill"/><line x1="538" y1="60" x2="538" y2="129" class="wx-line wx-s6"/><circle cx="538" cy="85" r="2.2" class="wx-inkfill"/><line x1="548" y1="60" x2="548" y2="138" class="wx-line wx-s6"/><circle cx="548" cy="92" r="2.2" class="wx-inkfill"/><line x1="558" y1="60" x2="558" y2="123" class="wx-line wx-s6"/><circle cx="558" cy="99" r="2.2" class="wx-inkfill"/><line x1="568" y1="60" x2="568" y2="132" class="wx-line wx-s6"/><circle cx="568" cy="84" r="2.2" class="wx-inkfill"/><line x1="578" y1="60" x2="578" y2="141" class="wx-line wx-s6"/><circle cx="578" cy="91" r="2.2" class="wx-inkfill"/><line x1="588" y1="60" x2="588" y2="126" class="wx-line wx-s6"/><circle cx="588" cy="98" r="2.2" class="wx-inkfill"/><line x1="598" y1="60" x2="598" y2="135" class="wx-line wx-s6"/><circle cx="598" cy="83" r="2.2" class="wx-inkfill"/><line x1="608" y1="60" x2="608" y2="120" class="wx-line wx-s6"/><circle cx="608" cy="90" r="2.2" class="wx-inkfill"/><line x1="618" y1="60" x2="618" y2="129" class="wx-line wx-s6"/><circle cx="618" cy="97" r="2.2" class="wx-inkfill"/><line x1="628" y1="60" x2="628" y2="138" class="wx-line wx-s6"/><circle cx="628" cy="82" r="2.2" class="wx-inkfill"/><line x1="638" y1="60" x2="638" y2="123" class="wx-line wx-s6"/><circle cx="638" cy="89" r="2.2" class="wx-inkfill"/><line x1="648" y1="60" x2="648" y2="132" class="wx-line wx-s6"/><circle cx="648" cy="96" r="2.2" class="wx-inkfill"/><line x1="658" y1="60" x2="658" y2="141" class="wx-line wx-s6"/><circle cx="658" cy="81" r="2.2" class="wx-inkfill"/><circle cx="506" cy="176" r="9" class="wx-num"/><text x="506" y="180" text-anchor="middle" class="wx-numt">4</text><text x="522" y="180" class="wx-t-b">Knot the totals</text><text x="522" y="195" class="wx-t-s">on a khipu (Inca period)</text></g><g class="wx-st wx-hide" data-only="5"><circle cx="102" cy="314" r="1.8" class="wx-c3"/><circle cx="109" cy="319" r="1.8" class="wx-c3"/><circle cx="116" cy="314" r="1.8" class="wx-c3"/><circle cx="123" cy="319" r="1.8" class="wx-c3"/><circle cx="130" cy="314" r="1.8" class="wx-c3"/><circle cx="137" cy="319" r="1.8" class="wx-c3"/><circle cx="182" cy="314" r="1.8" class="wx-c3"/><circle cx="189" cy="319" r="1.8" class="wx-c3"/><circle cx="196" cy="314" r="1.8" class="wx-c3"/><circle cx="203" cy="319" r="1.8" class="wx-c3"/><circle cx="210" cy="314" r="1.8" class="wx-c3"/><circle cx="217" cy="319" r="1.8" class="wx-c3"/><circle cx="262" cy="314" r="1.8" class="wx-c3"/><circle cx="269" cy="319" r="1.8" class="wx-c3"/><circle cx="276" cy="314" r="1.8" class="wx-c3"/><circle cx="283" cy="319" r="1.8" class="wx-c3"/><circle cx="290" cy="314" r="1.8" class="wx-c3"/><circle cx="297" cy="319" r="1.8" class="wx-c3"/><circle cx="342" cy="314" r="1.8" class="wx-c3"/><circle cx="349" cy="319" r="1.8" class="wx-c3"/><circle cx="356" cy="314" r="1.8" class="wx-c3"/><circle cx="363" cy="319" r="1.8" class="wx-c3"/><circle cx="370" cy="314" r="1.8" class="wx-c3"/><circle cx="377" cy="319" r="1.8" class="wx-c3"/><circle cx="422" cy="314" r="1.8" class="wx-c3"/><circle cx="429" cy="319" r="1.8" class="wx-c3"/><circle cx="436" cy="314" r="1.8" class="wx-c3"/><circle cx="443" cy="319" r="1.8" class="wx-c3"/><circle cx="450" cy="314" r="1.8" class="wx-c3"/><circle cx="457" cy="319" r="1.8" class="wx-c3"/><circle cx="502" cy="314" r="1.8" class="wx-c3"/><circle cx="509" cy="319" r="1.8" class="wx-c3"/><circle cx="516" cy="314" r="1.8" class="wx-c3"/><circle cx="523" cy="319" r="1.8" class="wx-c3"/><circle cx="530" cy="314" r="1.8" class="wx-c3"/><circle cx="537" cy="319" r="1.8" class="wx-c3"/><circle cx="582" cy="314" r="1.8" class="wx-c3"/><circle cx="589" cy="319" r="1.8" class="wx-c3"/><circle cx="596" cy="314" r="1.8" class="wx-c3"/><circle cx="603" cy="319" r="1.8" class="wx-c3"/><circle cx="610" cy="314" r="1.8" class="wx-c3"/><circle cx="617" cy="319" r="1.8" class="wx-c3"/></g><g class="wx-st" data-s="5"><circle cx="32" cy="362" r="9" class="wx-num"/><text x="32" y="366" text-anchor="middle" class="wx-numt">5</text><text x="48" y="366" class="wx-t-b">What survives: pollen in the soil</text><text x="48" y="381" class="wx-t-s">maize and basket-reed pollen found in 2025</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Goods arrive: maize, cotton and other produce, carried in reed baskets (proposed).</p><ol class="wx-steplist"><li>Goods arrive: maize, cotton and other produce, carried in reed baskets (proposed).</li><li>Each group sets its goods in its own section, one hole per unit (proposed).</li><li>Rows of 7 or 8 let officials or traders read totals at a glance (proposed).</li><li>Under the Inca, totals could be knotted onto a khipu (proposed).</li><li>What survives: maize and reed pollen in the soil of the holes, found in 2025.</li></ol><figcaption>The exchange and tribute reading proposed in 2025, step by step. Steps 1 to 4 are a reconstruction; step 5 is what was actually found. <span class="wx-src">Based on: Interpretation after Bongers et al. 2025; khipu recording after Urton and Brezine 2005. Schematic, not to scale.</span></figcaption><p class="vh">A cross-section through the ground shows a row of seven shallow holes with stone rims. Step 1: two people arrive carrying baskets. Step 2: baskets holding yellow cobs sit in five of the holes. Step 3: a bracket over the row reads five of seven holes filled in this row. Step 4: a knotted khipu cord appears at top right, labelled knot the totals. Step 5: small green dots in the soil of every hole represent pollen, labelled maize and basket-reed pollen found in 2025.</p></figure><p>After the Inca conquest, the same grid could have been turned to the empire&#x27;s great concern: tribute. Inca administrators recorded quantities on khipu, bundles of knotted cords. A complex khipu found near Pisco, now in Berlin, has 80 groups of cords, most containing 10, 11 or 12 strings. That grouped structure resembles the band&#x27;s sections of repeating rows. A section of holes, filled or empty, could be read like a group of cords: so many units from this village, so many from that one.</p><blockquote class="wpull"><p>If the reading is right, the Inca did not only knot their accounts in string. They also dug them into a mountain.</p></blockquote><p>Nothing in this requires anything exotic. What it requires is organisation, and the Andes had that in abundance. The striking thought is a different one: that an accounting system might be visible from the air, on a scale of kilometres.</p></section><section class="wsec" id="band-of-holes-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What time has taken</h3><p>Whatever the holes held is gone. Goods were collected, baskets rotted, wind filled and emptied the pits for five centuries. The Spanish conquest broke the administrative system that might have used the band, and with it went the people who could have explained it. Most khipu were lost, and even the ones that survive can be read for numbers but only partly for meaning.</p><p>That loss cuts both ways. It means the accounting reading will probably never be confirmed as directly as a written label would allow. It also means that the absence of other evidence, such as residues of specific goods, may reflect decay more than a different purpose.</p></section><section class="wsec" id="band-of-holes-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle it</h3><p>The next steps are clear. Many more radiocarbon dates, from sections along the whole band, would show whether it was dug at once or grew over time. Full excavation of a sample of holes, with fine sieving for seeds, fibres and fragments, could show what was set down in them. A statistical test of all the sections, not only the tidiest, would show whether the counts are more regular than chance. And a close comparison of the Pisco khipu with the band could reveal whether their numbers match.</p><p>For now, the band has moved from a riddle with no evidence to a hypothesis with some. That is real progress, and a good example of how drones and microscopes can make an old puzzle testable. It is not yet the last word.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">1000 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Late Intermediate Period: the Chincha world flourishes</span></li><li class="wtl-use" style="--i:1"><span class="wtl-y">1360 CE</span><span class="wtl-k">In use</span><span class="wtl-t">Charcoal in one hole dates to c. 1320–1405 CE</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">1450 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Inca incorporate the Pisco and Chincha valleys</span></li><li class="wtl-loss" style="--i:3"><span class="wtl-y">1532 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Spanish conquest; the system falls out of use</span></li><li class="wtl-find" style="--i:4"><span class="wtl-y">1933 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Shippee-Johnson aerial photos published</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1953 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Victor von Hagen visits on his Inca road survey</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2025 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Drone map, pollen and a date: the accounting reading</span></li></ol><details class="srcs"><summary>Sources for this case (9)</summary><ol><li>Bongers, J. L., Kiahtipes, C. A., Beresford-Jones, D., Osborn, J., Medrano, M., Dumitru, I. A., Bergmann, C., Román, J., Tavera Medina, C., Tantaleán, H., Huamán Mesía, L. &amp; Stanish, C. (2025). Indigenous accounting and exchange at Monte Sierpe (&#x27;Band of Holes&#x27;) in the Pisco Valley, Peru. Antiquity. <a href="https://doi.org/10.15184/aqy.2025.10237" target="_blank" rel="noopener">doi:10.15184/aqy.2025.10237</a></li><li>Shippee, R. (1933). Air adventures in Peru. National Geographic Magazine.</li><li>Von Hagen, V. W. (1955). Highway of the Sun. Duell, Sloan and Pearce.</li><li>Urton, G. &amp; Brezine, C. J. (2005). Khipu accounting in ancient Peru. Science 309: 1065–1067. <a href="https://doi.org/10.1126/science.1113426" target="_blank" rel="noopener">doi:10.1126/science.1113426</a></li><li>Rostworowski, M. (1970). Mercaderes del valle de Chincha en la época prehispánica: un documento y unos comentarios. Revista Española de Antropología Americana 5: 135–177.</li><li>Hyslop, J. (1984). The Inka Road System. Academic Press.</li><li>D&#x27;Altroy, T. N. (2014). The Incas. 2nd edition. Wiley-Blackwell.</li><li>Murra, J. V. (1980). The Economic Organization of the Inka State. JAI Press.</li><li>Stanish, C., Tantaleán, H., Nigra, B. T. &amp; Griffin, L. (2014). A 2,300-year-old architectural and astronomical complex in the Chincha Valley, Peru. PNAS 111(20): 7218–7223. <a href="https://doi.org/10.1073/pnas.1406501111" target="_blank" rel="noopener">doi:10.1073/pnas.1406501111</a></li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-band-of-holes" data-t="The Band of Holes: A Spreadsheet Dug Into a Mountain?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Band of Holes: A Spreadsheet Dug Into a Mountain?</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-band-of-holes</span> (updated 25 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-lost-scripts-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Indus civilisation seal unicorn at Indian Museum, Kolkata.jpg" data-cap="Indus seal with a &#x27;unicorn&#x27; and a line of unread signs" data-big><figcaption></figcaption></figure><div class="sh-k">Mysteries of the Earth</div><h2 class="sh-t" id="case-lost-scripts-st" tabindex="-1">Lost Scripts: The Writing Nobody Can Read</h2><p class="sh-s">Thousands of inscribed seals, tablets and boards survive, and nobody alive can read them. Machines are now joining the hunt.</p><div class="sh-v"><span class="vstamp vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><p class="sh-claim"><b>What the stamp rates:</b> The Indus signs encode a spoken language rather than a non-linguistic symbol system.</p></div><p class="v4-q">Do the Indus signs write a language, and could we ever read them?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Four to five thousand Indus inscriptions survive, mostly on seals, averaging five signs each.</li><li>The signs behave like writing: consistent direction, positional rules, recurring sequences.</li><li>But the texts are so short that statistics cannot yet separate writing from a symbol system.</li><li>No decipherment has survived testing; Linear A and Rongorongo remain unread too.</li><li>Most specialists lean towards a language being written; the challengers&#x27; case is serious.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Texts and scripts</span><span class="thr">Mathematics</span><span class="thr">Archaeology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. 4,000–<b class="ctr-n" data-v="5000" >5,000</b><span class="ctr-u"> inscriptions</span></div><div class="ctr-l">known in the Indus script</div><div class="ctr-c">Parpola 1994</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="5" >5</b><span class="ctr-u"> signs</span></div><div class="ctr-l">average Indus inscription</div><div class="ctr-c">Rao et al. 2009</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="1400" >1,400</b><span class="ctr-u"> inscriptions</span></div><div class="ctr-l">in Linear A</div><div class="ctr-c">Salgarella 2020</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="26" >26</b><span class="ctr-u"> objects</span></div><div class="ctr-l">carrying Rongorongo</div><div class="ctr-c">Ferrara et al. 2024</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="119" >119</b><span class="ctr-u"> signs</span></div><div class="ctr-l">longest Linear A text, on an ivory ring</div><div class="ctr-c">Kanta et al. 2025</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="1000000" >1,000,000</b><span class="ctr-u"> US$</span></div><div class="ctr-l">prize offered by Tamil Nadu in 2025</div><div class="ctr-c">Government of Tamil Nadu 2025</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The Indus signs encode a spoken language rather than a non-linguistic symbol system.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The signs behave like writing in several ways: consistent direction, positional rules, recurring sequences and use on seals and tags as in Mesopotamia. But the texts are very short, statistical tests have not separated writing from other symbol systems convincingly, and no decipherment has survived testing. The balance leans toward some kind of writing tied to language, which is why most specialists accept it, but the challengers&#x27; case is serious and the question remains open.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks and museum labels usually say simply that the Indus people had a writing system that has not been deciphered. That is probably right, but it hides a real debate: whether the signs spell out a language at all. Labels are somewhat overconfident here, and quieter than they should be about how little evidence there is to test any reading.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>About 4,000–5,000 Indus inscriptions are known, mostly on seals, dating mainly to c. 2600–1900 BCE; they average about five signs.<small>Parpola 1994; Rao et al. 2009</small></li><li>Linear A, used on Crete c. 1800–1450 BCE, survives in about 1,400 inscriptions; sound values borrowed from Linear B can be read aloud, but the language is unknown.<small>Salgarella 2020</small></li><li>About 26 Rongorongo objects survive; in 2024 the wood of one tablet was dated to c. 1493–1509 CE, before Europeans reached Rapa Nui in 1722.<small>Ferrara et al. 2024</small></li><li>Linear Elamite, used in Iran c. 2300–1850 BCE, was largely deciphered in 2022 using royal names on silver beakers and a bilingual inscription.<small>Desset et al. 2022</small></li><li>The Phaistos disc, found on Crete in 1908, carries 242 stamped signs of 45 types, and is the only object of its kind.<small>Robinson 2002</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the Indus signs record spoken language at all, or a non-linguistic system of emblems and administrative codes.</li><li>What language family lay behind the Indus script: Dravidian, Indo-Aryan, Munda or a lost language.</li><li>Whether Rongorongo was invented before European contact, and whether the 2024 wood date reflects the date of carving.</li><li>How complete and secure the 2022 Linear Elamite decipherment is, given that key beakers lack recorded findspots.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>No bilingual text pairs the Indus script with a known script, and no long Indus text has been found.</li><li>Anything written on perishable materials such as wood, cloth or leaves has almost certainly rotted.</li><li>On Rapa Nui, slave raids and epidemics in the 1860s killed many of the people who may have known how to read the tablets.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Most specialists, including Asko Parpola and Iravatham Mahadevan, treat the Indus signs as a real writing system, probably logo-syllabic like early cuneiform or Egyptian: word signs combined with sound signs. The script runs mainly right to left, has regular sign order and repeated sequences, and appears on seals, tags and pottery the way writing does elsewhere. The favoured language family has long been Dravidian, though Indo-Aryan and lost languages have supporters. Without a bilingual or long texts, decipherment claims cannot yet be tested.</p><ul><li>Signs cramp at the left edge, showing right-to-left writing.</li><li>Sign sequences follow regular positional rules.</li><li>Sign counts (roughly 400–700) fit a logo-syllabic system.</li><li>Indus seals reached Mesopotamia, so a bilingual could still turn up.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>In 2004 Farmer, Sproat and Witzel argued that the Indus signs were never writing in the linguistic sense but a system of emblems for families, gods and offices. Their evidence: texts are extremely short, many signs occur only once, and a century of digging has produced no long document. Sproat later showed that statistical tests claimed to detect language also pass some non-linguistic symbol systems. Mukhopadhyay argues from a different angle that the inscriptions were mainly logographic records for taxation, trade licences and access control, conveying meaning without spelling out spoken words.</p><ul><li>The average inscription is about five signs long, with none approaching a sentence-length text.</li><li>Rare signs are unusually common for a phonetic script.</li><li>Entropy statistics cannot separate writing from other symbol systems reliably.</li><li>The seals&#x27; contexts fit administration and commerce.</li></ul><div class="face-s"><b>Its strongest point</b><p>After more than a century of excavation at hundreds of sites, not one long Indus text has been found. A script that only ever wrote five-sign labels may never have written sentences at all.</p></div><p class="face-cr"><b>Credit</b> Steve Farmer, Richard Sproat and Michael Witzel; Bahata Ansumali Mukhopadhyay</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>A bilingual: an Indus inscription paired with cuneiform, for example on a seal or tag from Mesopotamia or the Gulf.</li><li>A long Indus text, or a stratified archive of tablets from a single building.</li><li>Publication of the complete Indus corpus with images in an open, machine-readable database.</li><li>For Rongorongo, dates on more tablets plus analysis of when the signs were carved relative to the wood.</li><li>For Linear Elamite, independent tests of the proposed values on newly excavated texts.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,028 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Lost Scripts: The Writing Nobody Can Read"><button type="button" class="wtoc-i" data-go="lost-scripts-s1">A unicorn and five silent signs</button><button type="button" class="wtoc-i" data-go="lost-scripts-s2">The unread shelf</button><button type="button" class="wtoc-i" data-go="lost-scripts-s3">How a script falls</button><button type="button" class="wtoc-i" data-go="lost-scripts-s4">Is the Indus script even writing?</button><button type="button" class="wtoc-i" data-go="lost-scripts-s5">Can AI read the unreadable?</button><button type="button" class="wtoc-i" data-go="lost-scripts-s6">What time erased</button><button type="button" class="wtoc-i" data-go="lost-scripts-s7">What would settle it</button></nav></div><section class="wsec" id="lost-scripts-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A unicorn and five silent signs</h3><p>Pick up an Indus seal, a square of fired steatite a few centimetres across, and you meet a beautifully carved animal, often a one-horned bull the excavators nicknamed the unicorn. Above it runs a short line of signs: fish shapes, jars, strokes, a man with raised arms. Someone carved it more than 4,000 years ago in one of the great cities of the Indus Valley, Harappa or Mohenjo-daro, in a civilisation as large as Egypt or Mesopotamia. Its message is perfectly preserved. Nobody can read it.</p><p>The Indus script is the most famous of a small club: writing systems whose signs we can see but whose words we cannot hear. Egypt and Mesopotamia speak to us in tens of thousands of documents. The Indus people, with their planned streets and drains, remain silent after a century of study.</p><blockquote class="wpull"><p>A civilisation that built cities for a thousand years left us thousands of messages and not a single sentence we can understand.</p></blockquote></section><section class="wsec" id="lost-scripts-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The unread shelf</h3><p>The Indus script is not alone. Each member of the club is stuck for a different reason.</p><ul class="wlist"><li>Indus script (c. 2600–1900 BCE): about 4,000–5,000 inscriptions, averaging about five signs, with estimates of 400 to nearly 700 distinct signs.</li><li>Linear A (Crete, c. 1800–1450 BCE): about 1,400 inscriptions. We can pronounce most of it, thanks to its descendant Linear B, and a few words such as ku-ro, &#x27;total&#x27;, are understood, but the Minoan language itself is unknown.</li><li>Proto-Elamite (Iran, c. 3100–2900 BCE): more than a thousand clay accounts, mostly from Susa. The numbers are understood; the words are not.</li><li>Rongorongo (Rapa Nui): about 26 wooden objects carrying more than 15,000 glyphs, first reported by a missionary in 1864.</li><li>The Phaistos disc (Crete): a single clay disc 16 cm across, stamped with 242 signs of 45 types, found in 1908.</li></ul><figure class="wx wx--static" id="lost-scripts-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Count the signs, guess the system</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Count the signs, guess the system"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" class="wx-svg" role="img" aria-labelledby="lost-scripts-f1-t"><title id="lost-scripts-f1-t">Number of distinct signs in known and undeciphered scripts on a logarithmic scale</title><text x="24" y="28" class="wx-t-cap">Count the signs, guess the system · distinct signs, log scale</text><rect x="245.3" y="52" width="75.2" height="360" class="wx-c3 wx-o20"/><text x="282.9" y="70" text-anchor="middle" class="wx-t-b">alphabets</text><rect x="320.5" y="52" width="99.5" height="360" class="wx-c2 wx-o20"/><text x="370.2" y="70" text-anchor="middle" class="wx-t-b">syllabaries</text><rect x="420.0" y="52" width="250.0" height="360" class="wx-c1 wx-o20"/><text x="545.0" y="70" text-anchor="middle" class="wx-t-b">word-signs plus sounds</text><text x="282.9" y="85" text-anchor="middle" class="wx-t-s">20–40</text><text x="370.2" y="85" text-anchor="middle" class="wx-t-s">40–100</text><text x="545.0" y="85" text-anchor="middle" class="wx-t-s">hundreds (e.g. cuneiform, Maya)</text><line x1="170.0" y1="412" x2="170.0" y2="418" class="wx-line"/><text x="170.0" y="432" text-anchor="middle" class="wx-t-s">10</text><line x1="245.3" y1="412" x2="245.3" y2="418" class="wx-line"/><text x="245.3" y="432" text-anchor="middle" class="wx-t-s">20</text><line x1="344.7" y1="412" x2="344.7" y2="418" class="wx-line"/><text x="344.7" y="432" text-anchor="middle" class="wx-t-s">50</text><line x1="420.0" y1="412" x2="420.0" y2="418" class="wx-line"/><text x="420.0" y="432" text-anchor="middle" class="wx-t-s">100</text><line x1="495.3" y1="412" x2="495.3" y2="418" class="wx-line"/><text x="495.3" y="432" text-anchor="middle" class="wx-t-s">200</text><line x1="594.7" y1="412" x2="594.7" y2="418" class="wx-line"/><text x="594.7" y="432" text-anchor="middle" class="wx-t-s">500</text><line x1="670.0" y1="412" x2="670.0" y2="418" class="wx-line"/><text x="670.0" y="432" text-anchor="middle" class="wx-t-s">1,000</text><line x1="170.0" y1="412" x2="670.0" y2="412" class="wx-line"/><text x="420.0" y="456" text-anchor="middle" class="wx-t-m">number of distinct signs</text><text x="24" y="112" class="wx-t-cap">Read</text><text x="24" y="248" class="wx-t-cap">Unread or newly read</text><line x1="24" y1="228" x2="690" y2="228" class="wx-guide"/><text x="24" y="128" class="wx-t-b">English alphabet</text><text x="24" y="142" class="wx-t-s">26 letters</text><circle cx="273.7" cy="130" r="7" class="wx-c3 wx-pop" style="--d:1"/><text x="24" y="164" class="wx-t-b">Cherokee syllabary</text><text x="24" y="178" class="wx-t-s">c. 85 signs</text><circle cx="402.4" cy="166" r="7" class="wx-c2 wx-pop" style="--d:2"/><text x="24" y="200" class="wx-t-b">Linear B (read 1952)</text><text x="24" y="214" class="wx-t-s">c. 87 sound signs</text><circle cx="404.9" cy="202" r="7" class="wx-c2 wx-pop" style="--d:3"/><text x="24" y="266" class="wx-t-b">Phaistos disc</text><text x="24" y="280" class="wx-t-s">45 signs, one object</text><circle cx="333.3" cy="268" r="7" class="wx-c4 wx-pop" style="--d:4"/><text x="24" y="308" class="wx-t-b">Linear Elamite</text><text x="24" y="322" class="wx-t-s">80–110 (Desset 2022)</text><rect x="395.8" y="304" width="34.5" height="12" rx="6" class="wx-c6 wx-growx" style="--d:5"/><text x="24" y="350" class="wx-t-b">Linear A</text><text x="24" y="364" class="wx-t-s">c. 90 core, 300+ variants</text><rect x="408.6" y="346" width="130.7" height="12" rx="6" class="wx-c4 wx-growx" style="--d:6"/><text x="24" y="392" class="wx-t-b">Indus script</text><text x="24" y="406" class="wx-t-s">c. 420–690 by count</text><rect x="575.6" y="388" width="54.7" height="12" rx="6" class="wx-c4 wx-growx" style="--d:7"/></svg></div></div><figcaption>Distinct sign counts on a logarithmic scale; ranges show disagreement between scholars. <span class="wx-src">Based on: Band limits are a common rule of thumb (Robinson 2002). Indus 419 (Mahadevan 1977) to c. 694 (Wells 2015) as summarised in the Indus literature; Linear A c. 90 core, 300+ with variants (Salgarella 2020); Linear Elamite 80–110 graphemes (Desset et al. 2022); Phaistos 45 (Robinson 2002); Linear B c. 87 syllabograms; Cherokee c. 85.</span></figcaption><p class="vh">A chart with a logarithmic horizontal axis of distinct signs from 10 to 1,000, shaded into three bands: alphabets at 20 to 40 signs, syllabaries at 40 to 100, and systems of word-signs plus sounds at hundreds of signs. Scripts we can read: the English alphabet at 26, the Cherokee syllabary at about 85, and Linear B at about 87 sound signs. Scripts unread or newly read: the Phaistos disc at 45 signs on one object; Linear Elamite at 80 to 110 in the 2022 decipherment; Linear A from about 90 core signs to over 300 with variants; and the Indus script from about 420 to 690 depending on who counts.</p></figure><p>The number of distinct signs is the first clue decipherers look for. An alphabet needs 20 to 40 letters, a syllabary 40 to 100, while systems mixing word signs and sound signs need hundreds. Linear A and the Phaistos disc look like syllabaries. The Indus count points to a mixed system, like cuneiform or Egyptian hieroglyphs, which is far harder to crack.</p></section><section class="wsec" id="lost-scripts-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>How a script falls</h3><p>Every successful decipherment has needed some combination of three things: enough text, a known language, and an anchor, usually names or a bilingual. Egyptian hieroglyphs fell with the Rosetta Stone. Linear B fell in 1952 when Michael Ventris found that place names on the tablets read as Greek.</p><figure class="wx wx--steps" id="lost-scripts-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">Cracking a script, and why Indus resists</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Cracking a script, and why Indus resists"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" class="wx-svg" role="img" aria-labelledby="lost-scripts-f2-t"><title id="lost-scripts-f2-t">How a script is cracked, using Linear Elamite as the example, and why the Indus script resists, in five steps</title><text x="24" y="28" class="wx-t-cap">Cracking a script · schematic signs, not real glyphs</text><path d="M40,70 L140,70 L130,210 Q90,222
