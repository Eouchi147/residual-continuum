class="wx-line wx-o60"/><line x1="506" y1="326" x2="530.2" y2="274" class="wx-line wx-o60"/><line x1="515" y1="326" x2="539.2" y2="274" class="wx-line wx-o60"/><line x1="524" y1="326" x2="548.2" y2="274" class="wx-line wx-o60"/><line x1="533" y1="326" x2="557.2" y2="274" class="wx-line wx-o60"/><line x1="542" y1="326" x2="566.2" y2="274" class="wx-line wx-o60"/><line x1="551" y1="326" x2="575.2" y2="274" class="wx-line wx-o60"/><line x1="560" y1="326" x2="584.2" y2="274" class="wx-line wx-o60"/><line x1="569" y1="326" x2="593.2" y2="274" class="wx-line wx-o60"/><line x1="578" y1="326" x2="602.2" y2="274" class="wx-line wx-o60"/><line x1="587" y1="326" x2="611.2" y2="274" class="wx-line wx-o60"/><line x1="596" y1="326" x2="620.2" y2="274" class="wx-line wx-o60"/><line x1="605" y1="326" x2="629.2" y2="274" class="wx-line wx-o60"/><line x1="614" y1="326" x2="638.2" y2="274" class="wx-line wx-o60"/><line x1="623" y1="326" x2="647.2" y2="274" class="wx-line wx-o60"/><line x1="632" y1="326" x2="656.2" y2="274" class="wx-line wx-o60"/><line x1="641" y1="326" x2="665.2" y2="274" class="wx-line wx-o60"/><line x1="650" y1="326" x2="674.2" y2="274" class="wx-line wx-o60"/><line x1="659" y1="326" x2="683.2" y2="274" class="wx-line wx-o60"/><line x1="668" y1="326" x2="692.2" y2="274" class="wx-line wx-o60"/><line x1="677" y1="326" x2="701.2" y2="274" class="wx-line wx-o60"/><line x1="686" y1="326" x2="710.2" y2="274" class="wx-line wx-o60"/></g><line x1="390" y1="270" x2="680" y2="270" class="wx-bold"/><line x1="694" y1="150" x2="694" y2="210" class="wx-dim"/><line x1="688" y1="150" x2="700" y2="150" class="wx-dim"/><line x1="688" y1="210" x2="700" y2="210" class="wx-dim"/><text x="535" y="80" text-anchor="middle" class="wx-t-b">bands 500–600 mm apart</text><text x="535" y="348" text-anchor="middle" class="wx-t-s">grooves at 60–75° to the band, 6–14 mm deep (mean c. 10 mm)</text></g><g class="wx-st wx-hide" data-s="5"><path d="M92,62 C112,42 140,40 162,48" class="wx-hl" marker-end="url(#longyou-caves-f2-arr)"/><text x="170" y="60" class="wx-t-big wx-t-a wx-halo">?</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Open a portal and cut the first lift just below the roof line.</p><ol class="wx-steplist"><li>Open a portal and cut the first lift just below the roof line.</li><li>Work downward in horizontal lifts, layer by layer, from the top to the floor.</li><li>Leave rock pillars and a stair in place as the hall deepens.</li><li>Dress each band of wall, 500–600 mm tall, with parallel strokes at 60–75°, about 10 mm deep.</li><li>Thousands of cubic metres per cavern were removed. Where the stone went is still unknown.</li></ol><figcaption>How the tool marks suggest the caverns were cut, from the top down, and the question they leave open. <span class="wx-src">Based on: Chisel mark spacing, depth and angles from Yang, Yue and Li 2011; top-down cutting inferred from the marks. Lift heights and proportions are schematic.</span></figcaption><p class="vh">Left: a small section of a cavern growing downward in horizontal lifts from a portal, with a pillar left in place. Right: an enlarged wall panel showing horizontal bands 50 to 60 cm tall, each filled with parallel chisel grooves at 60 to 75 degrees, 6 to 14 mm deep. Step 1: a portal and first lift. Step 2: more lifts taken from the top down. Step 3: a pillar and stair left in place. Step 4: the wall dressed in bands of parallel strokes. Step 5: a question mark over where the removed rock went.</p></figure><p>The survey team itself declined to pick a winner. Its list of proposed purposes runs from quarry to tomb, underground storage, a Taoist retreat, a secret military camp, a place of sacrifice and a palace. Each, they wrote, has reasonable arguments, and none has consensus. Travel guides add a granary. What is missing, for every option, is a single object or text that ties it to the caverns.</p></section><section class="wsec" id="longyou-caves-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The case for design</h3><p>Stand in Cavern No. 2 and the quarry idea feels thin. Quarrymen want blocks; they rarely spend time finishing the walls they leave behind. Yet the Longyou walls and ceilings are covered in bands of parallel chisel strokes, each band 500–600 mm wide, the grooves set at 60–75° to the band and about 10 mm deep on average. The pattern runs unbroken over huge surfaces, like the texture of a finished room.</p><p>Then there are the features a quarry does not need: stairs, drainage, pillars placed at intervals, roofs tuned to the bedding, a single portal to each hall, and partitions so thin that the diggers must have known exactly where their neighbours were. Popular writers go further and ask how such precision was achieved in near darkness, and why no one wrote it down. Those questions are fair, even if the answer is probably organised hand labour rather than lost technology.</p><p>Some of the design argument cuts both ways, and fairness means saying so. A roof that follows the rock beds is exactly what a practical quarryman would choose, because stone splits most easily along its layers and a roof in one layer is less likely to fall. Leaving pillars is standard practice in underground quarries too, because it saves the workers&#x27; lives. The finished chisel bands and the stairs are harder to explain as pure extraction, and those are where the case for a purpose-built space is strongest.</p><blockquote class="wpull"><p>A quarry takes stone and leaves scars. Longyou left patterned walls, stairs and pillars in 24 halls that never touch.</p></blockquote></section><section class="wsec" id="longyou-caves-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>What water saved and air is destroying</h3><p>The strangest twist is that the caverns may have survived because they were forgotten underwater. Yang and colleagues concluded that the complete caverns stayed stable for two thousand years largely because they were full of water, which supported the roofs and kept the rock damp and uniform. Once pumped dry for visitors, the rock began to change. In 2010 the roof of Cavern No. 24 collapsed, bringing down about 250 m³ of rock.</p><aside class="wcall"><b>Fresh from the field</b><p>The newest work is about survival rather than origins. A 2023 study in Tunnelling and Underground Space Technology by Zhang Huihui and colleagues, and a 2024 paper in Engineering Failure Analysis by Wang Tie and Yan Chengzeng, used monitoring and numerical models to show how swings in humidity drive cracking in the caverns&#x27; siltstone. Earlier, a Japanese and Chinese team used ground electrical resistivity to map moisture in the hill.</p></aside><p>Draining also disturbed whatever lay on the cavern floors. Much of the evidence that might have answered the purpose question, from tools to offerings to spilled grain, was either never there or went out with the mud.</p></section><section class="wsec" id="longyou-caves-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What would settle it</h3><ul class="wlist"><li>Trace the stone: match Longyou siltstone to dated walls, bridges, tombs or buildings along the Qu River.</li><li>Date the digging more directly, for example luminescence dating of the earliest sediment sealed on cavern floors.</li><li>Survey the hillside and riverbank for spoil heaps, loading areas, split blocks or abandoned half-cut stones.</li><li>Search regional gazetteers and archives for any record of works at this place before 1626.</li></ul><p>If Longyou stone turns up in a dated Han or earlier building, the quarry reading will be hard to beat. If the floors yield burials, stored goods or ritual objects, the caverns were built to be used. Until then, Longyou remains one of the few ancient places on Earth where we can measure almost everything except the one thing we most want to know: why.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-use" style="--i:0"><span class="wtl-y">206 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Western Han period begins; pots of this type later found in Cavern No. 2</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">1626 CE</span><span class="wtl-k">Event</span><span class="wtl-t">The caverns are known in writing by this date</span></li><li class="wtl-find" style="--i:2"><span class="wtl-y">1992 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Villagers pump out ponds and find the first caverns</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">2008 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Electrical resistivity survey of the ground around the caverns</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">2009 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Engineering-geology study of failure modes published</span></li><li class="wtl-loss" style="--i:5"><span class="wtl-y">2010 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Roof of Cavern No. 24 collapses, about 250 m³ of rock</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2011 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Detailed survey of design and mechanics of the complete caverns</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2023 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Studies link humidity swings to cracking in the caverns</span></li></ol><details class="srcs"><summary>Sources for this case (8)</summary><ol><li>Li, L. H., Yang, Z. F., Yue, Z. Q. and Zhang, L. Q. (2009). Engineering geological characteristics, failure modes and protective measures of Longyou rock caverns of 2000 years old. Tunnelling and Underground Space Technology 24: 190–207. <a href="https://doi.org/10.1016/j.tust.2008.08.003" target="_blank" rel="noopener">doi:10.1016/j.tust.2008.08.003</a></li><li>Yang, Z. F., Yue, Z. Q. and Li, L. H. (2011). Design, construction and mechanical behavior of relics of complete large Longyou rock caverns carved in argillaceous siltstone ground. Journal of Rock Mechanics and Geotechnical Engineering 3: 131–152. <a href="https://doi.org/10.3724/SP.J.1235.2011.00131" target="_blank" rel="noopener">doi:10.3724/SP.J.1235.2011.00131</a></li><li>Tanimoto, C., Ishida, Y., Koizumi, K., Li, L., Kamide, S. and Masuya, T. (2008). The consideration about ground electric resistivity at the Longyou Grottoes of China. Journal of the Society of Materials Science, Japan 57: 408–414. <a href="https://doi.org/10.2472/jsms.57.408" target="_blank" rel="noopener">doi:10.2472/jsms.57.408</a></li><li>Weathering rates of chisel imprints on pelitic siltstone inside five Longyou caverns (2015). In: Ancient Underground Opening and Preservation, pp. 133–140. CRC Press. <a href="https://doi.org/10.1201/b19169-20" target="_blank" rel="noopener">doi:10.1201/b19169-20</a></li><li>Study on the deformation and failure process of No. 24 ancient cavern of Longyou Grottoes (2015). In: Ancient Underground Opening and Preservation, pp. 49–54. CRC Press. <a href="https://doi.org/10.1201/b19169-9" target="_blank" rel="noopener">doi:10.1201/b19169-9</a></li><li>Zhang, H., Li, T., Tang, S., Li, P., Wang, Y. and Tang, C. (2023). The influence of environmental humidity change on the stability of rock caves in Longyou Grottoes. Tunnelling and Underground Space Technology 140: 105291. <a href="https://doi.org/10.1016/j.tust.2023.105291" target="_blank" rel="noopener">doi:10.1016/j.tust.2023.105291</a></li><li>Wang, T. and Yan, C. (2024). Fracture characteristics and failure analysis of underground caverns in Longyou Grottoes induced by humidity change. Engineering Failure Analysis 160: 108214. <a href="https://doi.org/10.1016/j.engfailanal.2024.108214" target="_blank" rel="noopener">doi:10.1016/j.engfailanal.2024.108214</a></li><li>HeritageDaily (2020). The mystery of the Longyou Caves.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-longyou-caves" data-t="The Longyou Caves: Halls Carved in Silence"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Longyou Caves: Halls Carved in Silence</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-longyou-caves</span> (updated 25 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-derinkuyu-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Derinkuyu Underground City 9778 Nevit.jpg" data-cap="A passage in the underground city of Derinkuyu, Cappadocia" data-big><figcaption></figcaption></figure><div class="sh-k">Mysteries of the Earth</div><h2 class="sh-t" id="case-derinkuyu-st" tabindex="-1">Derinkuyu: The City Beneath Cappadocia</h2><p class="sh-s">In 1963 a man knocked through his basement wall and found a room. Below it lay a city 85 m deep.</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> The deepest levels of Derinkuyu were dug in the Iron Age or earlier.</p></div><p class="v4-q">How old are the deepest levels of Cappadocia&#x27;s underground cities?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Derinkuyu in Turkey is a city carved downward into soft volcanic rock, about 85 metres deep, with rolling stone doors.</li><li>Some say the deepest levels were dug in the Iron Age or long before.</li><li>Nothing from the lowest floors has been dated that early; carving rock erases the evidence.</li><li>The chapels, doors, wells and written accounts of raids all point to Byzantine communities as the builders of the deep city.</li><li>A small early start near the surface is a fair guess; a deep ancient city is not shown.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Geology</span><span class="thr">Archaeology</span><span class="thr">Texts and scripts</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="85" >85</b><span class="ctr-u"> m</span></div><div class="ctr-l">depth of the deepest level</div><div class="ctr-c">Nývlt et al. 2016</div></div><div class="ctr"><div class="ctr-v">up to <b class="ctr-n" data-v="18" >18</b><span class="ctr-u"> floors</span></div><div class="ctr-l">reported in the whole system</div><div class="ctr-c">Nývlt et al. 2016</div></div><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="50" >50</b><span class="ctr-u"> shafts</span></div><div class="ctr-l">for ventilation</div><div class="ctr-c">Nývlt et al. 2016</div></div><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="360" >360</b><span class="ctr-u"> sites</span></div><div class="ctr-l">underground settlements geolocated in Cappadocia</div><div class="ctr-c">Bixio; HISTORY 2026</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The deepest levels of Derinkuyu were dug in the Iron Age or earlier.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">No find from the lowest floors has been dated to the Iron Age or earlier, and nothing physical ties them to the Younger Dryas. The Phrygian start is a reasonable guess for the first small rooms near the surface, not for the depths. The challengers are right that the digging is undated and that carving erases evidence, which is why the question stays open. But the evidence we do have, chapels, doors, wells and written accounts of raids, all points to Byzantine communities as the builders of the deep city.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Guidebooks often say Derinkuyu dates back to the Phrygians of the 8th century BCE and could hold 20,000 people, stated as facts. Both are estimates. The Phrygian start rests on analogy, not a dated find, and the capacity is a calculation. Textbooks are right that the city we can walk through is mostly Byzantine, and overconfident about how and when it began.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Derinkuyu is carved into volcanic tuff and reaches a depth of about 85 m, with up to 18 floors reported and more than 50 ventilation shafts.<small>Nývlt et al. 2016</small></li><li>Passages could be sealed from inside with large rolling stone doors, and each level could be closed off separately.<small>Nývlt et al. 2016; site descriptions</small></li><li>The complex was rediscovered in 1963 when a resident broke through a basement wall, and it opened to visitors in 1969.<small>Nývlt et al. 2016</small></li><li>It was greatly enlarged in the Byzantine period, when Christian communities sheltered from raids during the Arab–Byzantine wars (c. 780–1180), and it was used by local Christians until the population exchange of 1923.<small>Ousterhout 2017; site histories</small></li><li>Cappadocia holds hundreds of underground settlements; researchers have geolocated more than 360.<small>HISTORY 2026; Yamaç and Tok 2026</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Who dug the first rooms: Phrygians of the 8th–7th centuries BCE, earlier Anatolian peoples, or Roman-era and Byzantine communities.</li><li>How many people Derinkuyu could hold: the widely quoted 20,000 is an estimate, not a count.</li><li>Whether tunnels really link Derinkuyu to Kaymaklı, about 8–9 km away; the connection is often stated but has not been demonstrated.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Nobody has directly dated the cutting of any level; carving leaves no organic material to date, and each enlargement removes older surfaces.</li><li>Centuries of reuse, cleaning and modern clearing for visitors have removed most floor deposits that could have held datable finds.</li><li>Large parts of Cappadocia&#x27;s underground network, and new complexes such as Matiate under Midyat, remain unexcavated.</li></ul></div></div><h3 class="sub-h wsub">How the traditions tell it</h3><div class="v4texts"><blockquote class="quote v4q"><span class="v4q-t">Zoroastrian (Avesta) · Vendidad, Fargard 2.22 and 2.25</span><p>Upon the material world the evil winters are about to fall, that shall bring the fierce, deadly frost ... Therefore make thee a Vara, long as a riding-ground on every side of the square, to be an abode for man.</p><cite>trans. James Darmesteter, Sacred Books of the East vol. 4 (1880; American edition 1898)</cite></blockquote></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Most historians see the underground cities as refuges that grew over a very long time. Small cellars and rooms may have been cut into the soft tuff in the Iron Age, perhaps by Phrygians, but the city as visitors see it, with chapels, stables, wells and rolling stone doors, is mainly Byzantine. It served Christian villagers during the Arab raids of the 8th to 10th centuries and stayed in use, on and off, until 1923. The Phrygian start is an inference from regional rock-cut traditions, not a dated find.</p><ul><li>Chapels, crosses and Greek inscriptions tie much of the complex to the Christian centuries.</li><li>Byzantine sources describe Cappadocians hiding from raiders, which fits refuges with doors that close from inside.</li><li>Xenophon, around 400 BCE, described underground houses in Armenia with well-like entrances, showing the idea is old in the wider region.</li><li>Tuff is soft to cut but self-supporting, so digging deeper was always possible whenever a community needed it.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Hancock asks whether the underground cities began not as Byzantine refuges but as shelters from the Younger Dryas cold, about 12,800 to 11,600 years ago. He points to the Avestan story of Yima, told by the god Ahura Mazda to build a Vara, an enclosure to save people, animals and seeds from terrible winters. Archaeologists, he argues, cannot show the cities are Phrygian any more than he can show they are older, because the digging itself has never been dated. Andrew Collins and the Comet Research Group supply the wider frame: a comet-driven catastrophe at the end of the Ice Age that shaped Anatolian prehistory.</p><ul><li>The Vara of Yima is a shelter built against a killing winter, with seeds of life brought inside.</li><li>A shelter sealed from inside, with its own air, water and stables, would suit a long siege by climate as well as a short raid by enemies.</li><li>No level of Derinkuyu has a direct date for its cutting, so the Byzantine attribution is about use, not origin.</li></ul><div class="face-s"><b>Its strongest point</b><p>Nobody has dated the digging of any level. Byzantine chapels show who used the city last, and hollowing rock destroys the older surfaces that could record an earlier start. The conventional timeline is an inference too.</p></div><p class="face-cr"><b>Credit</b> Graham Hancock (Magicians of the Gods, 2015; Ancient Apocalypse, 2022), drawing on the Younger Dryas impact ideas of Andrew Collins and the Comet Research Group</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Excavate undisturbed floor deposits in unopened side chambers at the deepest levels and date charcoal, bone or pottery sealed in them.</li><li>Use luminescence dating on sediment trapped in the lowest ventilation shafts and wells, which began filling once they were cut.</li><li>Compare tool marks level by level with dated rock-cut tombs and churches in Cappadocia to build a chronology of carving techniques.</li><li>Publish full 3D surveys of Derinkuyu, Kaymaklı and Matiate, to show which spaces cut through older ones.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,012 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Derinkuyu: The City Beneath Cappadocia"><button type="button" class="wtoc-i" data-go="derinkuyu-s1">A door in the basement</button><button type="button" class="wtoc-i" data-go="derinkuyu-s2">What is solid</button><button type="button" class="wtoc-i" data-go="derinkuyu-s3">The mainstream story: a refuge that grew for centuries</button><button type="button" class="wtoc-i" data-go="derinkuyu-s4">The case for a much older shelter</button><button type="button" class="wtoc-i" data-go="derinkuyu-s5">What time has hidden, and what new tools see</button><button type="button" class="wtoc-i" data-go="derinkuyu-s6">What would settle it</button></nav></div><section class="wsec" id="derinkuyu-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A door in the basement</h3><p>In 1963 a man in the town of Derinkuyu, on the high plateau of Cappadocia in central Türkiye, was renovating his house. He knocked through a wall in the basement and found a room that should not have been there. Behind it was a passage. Behind the passage, another room, and a stair going down.</p><p>It kept going down. Derinkuyu, whose name means deep well, turned out to be a city carved entirely into volcanic rock, reaching about 85 m below the surface, with up to 18 floors reported and more than 50 ventilation shafts. There are stables, halls, wells, chapels and storage rooms, and passages that could be sealed from inside with round stone doors that roll across the corridor like giant coins. Estimates of how many people it could shelter run to 20,000, though that is a calculation, not a count.</p><blockquote class="wpull"><p>It is not a cave. Every cubic metre of it was cut by hand, and nobody wrote down when the cutting began.</p></blockquote></section><section class="wsec" id="derinkuyu-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What is solid</h3><p>The rock explains a lot. Cappadocia&#x27;s volcanoes blanketed the region in ash that hardened into tuff, soft enough to carve with hand tools but strong enough to stand without supports. People here have cut homes, churches, dovecotes and storerooms into it for thousands of years. Roberto Bixio, founder of the Centro Studi Sotterranei in Genoa, who has spent decades mapping these sites, calls a typical village &#x27;a stone iceberg&#x27;, with far more of it below ground than above.</p><figure class="wx wx--static" id="derinkuyu-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Derinkuyu in section</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Derinkuyu in section"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" class="wx-svg" role="img" aria-labelledby="derinkuyu-f1-t"><title id="derinkuyu-f1-t">Vertical section through Derinkuyu at true depth</title><text x="24" y="28" class="wx-t-cap">Vertical section · 1 m = 5.6 px · layout schematic</text><rect x="20" y="70" width="680" height="495" class="wx-stone wx-edge-soft"/><line x1="20" y1="70" x2="700" y2="70" class="wx-bold"/><rect x="430" y="52" width="26" height="18" class="wx-card wx-edge"/><rect x="462" y="56" width="20" height="14" class="wx-card wx-edge"/><rect x="488" y="50" width="30" height="20" class="wx-card wx-edge"/><rect x="524" y="55" width="22" height="15" class="wx-card wx-edge"/><path d="M560,70 L560,46 L576,34 L592,46 L592,70 Z" class="wx-card wx-edge"/><line x1="576" y1="34" x2="576" y2="24" class="wx-line"/><line x1="571" y1="28" x2="581" y2="28" class="wx-line"/><text x="512" y="44" text-anchor="middle" class="wx-t-s wx-halo">town and church above</text><g><circle cx="620" cy="61.5" r="1.8" class="wx-inkfill"/><line x1="620" y1="63" x2="620" y2="70" class="wx-line"/></g><text x="628" y="62" class="wx-t-s">person 1.7 m</text><rect x="325" y="70" width="10" height="308" class="wx-paper wx-edge"/><path d="M330,90 L330,370" class="wx-flow wx-s2"/><rect x="198" y="70" width="5" height="180" class="wx-paper wx-edge-soft"/><rect x="468" y="70" width="5" height="380" class="wx-paper wx-edge-soft"/><polyline points="390,70 250,110 420,160 240,210 430,260 250,320 420,380 260,440 420,500 300,546" class="wx-bold wx-draw" pathLength="1" style="--d:1"/><rect x="178" y="97" width="72" height="26" rx="8" class="wx-paper wx-edge wx-pop" style="--d:3"/><rect x="420" y="147" width="72" height="26" rx="8" class="wx-paper wx-edge wx-pop" style="--d:4"/><rect x="168" y="197" width="72" height="26" rx="8" class="wx-paper wx-edge wx-pop" style="--d:5"/><rect x="430" y="247" width="72" height="26" rx="8" class="wx-paper wx-edge wx-pop" style="--d:6"/><rect x="178" y="307" width="72" height="26" rx="8" class="wx-paper wx-edge wx-pop" style="--d:7"/><rect x="420" y="367" width="72" height="26" rx="8" class="wx-paper wx-edge wx-pop" style="--d:8"/><rect x="188" y="427" width="72" height="26" rx="8" class="wx-paper wx-edge wx-pop" style="--d:9"/><rect x="420" y="487" width="72" height="26" rx="8" class="wx-paper wx-edge wx-pop" style="--d:10"/><rect x="228" y="533" width="72" height="26" rx="8" class="wx-paper wx-edge wx-pop" style="--d:11"/><line x1="214" y1="312" x2="214" y2="328" class="wx-line"/><line x1="207" y1="317" x2="221" y2="317" class="wx-line"/><circle cx="408" cy="154" r="8" class="wx-stone3 wx-edge"/><circle cx="408" cy="154" r="2" class="wx-inkfill"/><circle cx="418" cy="254" r="8" class="wx-stone3 wx-edge"/><circle cx="418" cy="254" r="2" class="wx-inkfill"/><circle cx="408" cy="374" r="8" class="wx-stone3 wx-edge"/><circle cx="408" cy="374" r="2" class="wx-inkfill"/><g class="wx-pop" style="--d:12"><text x="24" y="106" class="wx-t-b">Stables and stores</text><text x="24" y="122" class="wx-t-s">upper levels</text></g><g class="wx-pop" style="--d:13"><text x="24" y="316" class="wx-t-b">Chapel</text><text x="24" y="332" class="wx-t-s">lower levels</text></g><g class="wx-pop" style="--d:14"><text x="24" y="392" class="wx-t-b">Air shaft c. 55 m</text><text x="24" y="408" class="wx-t-s">also used as a well</text><line x1="130" y1="396" x2="322" y2="378" class="wx-thin"/></g><g class="wx-pop" style="--d:15"><text x="24" y="542" class="wx-t-b">Deepest level</text><text x="24" y="558" class="wx-t-s">c. 85 m below the town</text></g><g class="wx-pop" style="--d:12"><text x="510" y="150" class="wx-t-b">Rolling stone doors</text><text x="510" y="166" class="wx-t-s">close from inside; each level</text><text x="510" y="181" class="wx-t-s">can be sealed separately</text><line x1="506" y1="160" x2="420" y2="156" class="wx-thin"/></g><g class="wx-pop" style="--d:14"><text x="510" y="440" class="wx-t-b">More than 50 shafts</text><text x="510" y="456" class="wx-t-s">bring air to every level</text><line x1="506" y1="444" x2="476" y2="440" class="wx-thin"/></g><g class="wx-pop" style="--d:16"><text x="510" y="296" class="wx-t-b">Up to 18 floors</text><text x="510" y="312" class="wx-t-s">reported; only part is open</text></g><line x1="692" y1="182.0" x2="700" y2="182.0" class="wx-line"/><text x="688" y="186.0" text-anchor="end" class="wx-t-s wx-halo">20 m</text><line x1="692" y1="294.0" x2="700" y2="294.0" class="wx-line"/><text x="688" y="298.0" text-anchor="end" class="wx-t-s wx-halo">40 m</text><line x1="692" y1="406.0" x2="700" y2="406.0" class="wx-line"/><text x="688" y="410.0" text-anchor="end" class="wx-t-s wx-halo">60 m</text><line x1="692" y1="518.0" x2="700" y2="518.0" class="wx-line"/><text x="688" y="522.0" text-anchor="end" class="wx-t-s wx-halo">80 m</text><rect x="24" y="578" width="56" height="5" class="wx-inkfill"/><text x="88" y="584" class="wx-t-s">10 m</text><text x="696" y="590" text-anchor="end" class="wx-t-s">No level of the city has been directly dated.</text></svg></div></div><figcaption>A simplified vertical section at true depth. Room layout is schematic; depths and features follow published descriptions. <span class="wx-src">Based on: Depth, number of floors, ventilation shafts and rolling stone door from Nývlt et al. 2016; the 55 m shaft used as a well from standard site descriptions. Chamber layout is schematic.</span></figcaption><p class="vh">A vertical section through the ground, 85 m deep, with a small town and church on the surface. A long ventilation shaft about 55 m deep, also used as a well, drops through the centre. Stairs and sloping passages zigzag down to chambers at many levels: stables and storage near the top, a chapel lower down, and the deepest level at about 85 m. Round rolling stone doors are marked on several passages. Depth ticks mark every 20 m, and a note reads that no level has been directly dated. A scale bar shows 10 m, and a 1.7 m person stands at the surface for comparison.</p></figure><p>Derinkuyu is not alone. Researchers have geolocated more than 360 underground settlements across Cappadocia. Kaymaklı, about 8–9 km away, is another; a tunnel between the two is often described, but a 2016 engineering study notes the connection is assumed rather than demonstrated. The later history is clearer. The city was greatly enlarged when Byzantine Christians hid from Arab raiders between roughly 780 and 1180, and local Christians still used it until they left Cappadocia in the Greek–Turkish population exchange of 1923.</p></section><section class="wsec" id="derinkuyu-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The mainstream story: a refuge that grew for centuries</h3><p>In the standard account, the underground cities are a slow accumulation. Iron Age people, possibly the Phrygians of the 8th and 7th centuries BCE, may have cut the first cellars. Around 400 BCE the Greek soldier Xenophon described villages further east, in Armenia, where houses were dug underground and entered by a shaft like a well, with animals kept below (Anabasis 4.5.25). In Roman and Byzantine times the cellars were joined, deepened and fitted with chapels, wells and doors, and the Arab raids made them refuges for whole communities.</p><figure class="wx wx--steps" id="derinkuyu-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">How the city grew, and why its start is hard to date</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How the city grew, and why its start is hard to date"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" class="wx-svg" role="img" aria-labelledby="derinkuyu-f2-t"><title id="derinkuyu-f2-t">How the underground city grew and why its start is hard to date</title><defs><marker id="derinkuyu-f2-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 Z" class="wx-accfill"/></marker></defs><text x="24" y="28" class="wx-t-cap">Growth of an underground city · schematic</text><rect x="20" y="90" width="460" height="280" class="wx-stone wx-edge-soft"/><line x1="20" y1="90" x2="480" y2="90" class="wx-bold"/><rect x="250" y="70" width="30" height="20" class="wx-card wx-edge"/><rect x="290" y="74" width="24" height="16" class="wx-card wx-edge"/><rect x="330" y="68" width="34" height="22" class="wx-card wx-edge"/><rect x="376" y="73" width="26" height="17" class="wx-card wx-edge"/><g class="wx-st" data-s="1"><rect x="262" y="100" width="40" height="20" rx="5" class="wx-paper"/><rect x="262" y="100" width="40" height="20" rx="5" class="wx-dash"/><rect x="352" y="100" width="40" height="20" rx="5" class="wx-paper"/><rect x="352" y="100" width="40" height="20" rx="5" class="wx-dash"/><text x="30" y="108" class="wx-t-b wx-halo">First cellars?</text><text x="30" y="123" class="wx-t-s wx-halo">Iron Age, proposed</text></g><g class="wx-st" data-s="2"><polyline points="282,120 282,160 372,160 372,120" class="wx-bold"/><rect x="230" y="148" width="60" height="24" rx="6" class="wx-paper wx-edge"/><rect x="360" y="148" width="70" height="24" rx="6" class="wx-paper wx-edge"/><line x1="395" y1="152" x2="395" y2="168" class="wx-line"/><line x1="389" y1="157" x2="401" y2="157" class="wx-line"/><text x="30" y="160" class="wx-t-b wx-halo">Rooms joined</text><text x="30" y="175" class="wx-t-s wx-halo">Roman to Byzantine; chapels</text></g><g class="wx-st" data-s="3"><polyline points="330,160 330,230 270,230 270,300 360,300 360,340" class="wx-bold"/><rect x="300" y="218" width="80" height="24" rx="6" class="wx-paper wx-edge"/><rect x="200" y="288" width="80" height="24" rx="6" class="wx-paper wx-edge"/><rect x="340" y="328" width="80" height="26" rx="6" class="wx-paper wx-edge"/><circle cx="330" cy="200" r="8" class="wx-stone3 wx-edge"/><circle cx="270" cy="270" r="8" class="wx-stone3 wx-edge"/><text x="30" y="250" class="wx-t-b wx-halo">Deepened as a refuge</text><text x="30" y="265" class="wx-t-s wx-halo">c. 780–1180 CE, stone doors</text></g><g class="wx-st" data-only="4"><line x1="420" y1="341" x2="520" y2="300" class="wx-thin"/><rect x="510" y="110" width="196" height="220" rx="10" class="wx-card wx-edge-soft"/><path d="M528,300 L528,170 Q528,140 560,140 L656,140 Q688,140 688,170 L688,300 Z" class="wx-paper wx-edge"/><path d="M560,300 L560,210 Q560,190 580,190 L630,190 Q650,190 650,210 L650,300" class="wx-dash"/><text x="608" y="252" text-anchor="middle" class="wx-t-s">older room</text><text x="608" y="266" text-anchor="middle" class="wx-t-s">(cut away)</text><text x="608" y="128" text-anchor="middle" class="wx-t-b">Enlarging erases</text><text x="608" y="320" text-anchor="middle" class="wx-t-s">only the last cut survives</text></g><g class="wx-st" data-s="5"><path d="M347,56 C347,76 350,90 352,98" class="wx-hl" marker-end="url(#derinkuyu-f2-arr)"/><text x="520" y="52" class="wx-t-b">1923: left</text><text x="520" y="70" class="wx-t-b">1963: found through</text><text x="520" y="86" class="wx-t-b">a basement wall</text><line x1="516" y1="62" x2="360" y2="56" class="wx-thin"/></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Soft tuff under a village. The first small cellars may be Iron Age, perhaps Phrygian (proposed, undated).</p><ol class="wx-steplist"><li>Soft tuff under a village. The first small cellars may be Iron Age, perhaps Phrygian (proposed, undated).</li><li>Roman and early Byzantine communities join the rooms into levels and cut chapels.</li><li>c. 780–1180 CE: raids drive the city deeper; rolling stone doors seal each level from inside.</li><li>Every enlargement shaves away older walls, so tool marks record only the last cut. The start is erased.</li><li>Used until 1923, forgotten, and rediscovered in 1963 through a basement wall.</li></ol><figcaption>The conventional sequence, with the proposed and undated parts drawn dashed. Step 4 shows why carving destroys its own record. <span class="wx-src">Based on: Conventional sequence as summarised in the site literature (e.g. Ousterhout 2017); dates of the Arab–Byzantine wars from standard histories; 1963 from Nývlt et al. 2016. Schematic, not to scale.</span></figcaption><p class="vh">A simple section through soft tuff. Step 1: a surface village with a few small cellars just below it, drawn dashed as a proposed Iron Age start. Step 2: rooms are joined into levels with a chapel, in the Roman and early Byzantine period. Step 3: the complex is deepened as a refuge with rolling stone doors between about 780 and 1180 CE. Step 4: a close-up of one room enlarged, with its older, smaller outline dashed inside, showing that the new cut removes the old surface. Step 5: the city is left in 1923 and rediscovered in 1963 through a basement wall.</p></figure><p>This account is sensible, but its first chapter is soft. The Phrygian attribution rests on the region&#x27;s wider tradition of rock-cut monuments and on analogy, not on a dated object found in a sealed layer at Derinkuyu. What is dated is use: Christian chapels, inscriptions and the documented raids.</p></section><section class="wsec" id="derinkuyu-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The case for a much older shelter</h3><p>Graham Hancock makes the challenge in Magicians of the Gods (2015) and in the episode &#x27;A Fatal Winter&#x27; of his Netflix series Ancient Apocalypse (2022). In a 2015 essay he asked: &#x27;Could this cold episode have been the Younger Dryas (from 12,800 years ago to 11,600 years ago) and if so might the underground &quot;cities&quot; be much older than archaeologists imagine?&#x27; His frame comes from the Younger Dryas impact idea championed by the Comet Research Group and, for Anatolia, by Andrew Collins: a comet-driven catastrophe at the end of the Ice Age, remembered in myth.</p><p>His key text is Zoroastrian. In the Vendidad, part of the Avesta, the god Ahura Mazda warns the righteous king Yima of a coming winter and tells him to build a Vara, a square enclosure, and bring into it the seeds of people, animals and plants.</p><blockquote class="quote"><p>Upon the material world the evil winters are about to fall, that shall bring the fierce, deadly frost ... Therefore make thee a Vara, long as a riding-ground on every side of the square, to be an abode for man.</p><cite>Vendidad, Fargard 2.22 and 2.25, trans. James Darmesteter, Sacred Books of the East vol. 4 (1880; American edition 1898)</cite></blockquote><p>It is a haunting parallel: a shelter built against a killing cold, with life carried inside to survive it. The text does not say the Vara was underground, and it names no place, but the image of a sealed refuge fits Derinkuyu well. Hancock&#x27;s sharpest point is fair: archaeologists have no direct date for the cutting of the city, so the conventional start is an inference too.</p><blockquote class="wpull"><p>Carving erases its own history. Each new chisel stroke removes the surface that recorded the last one.</p></blockquote></section><section class="wsec" id="derinkuyu-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>What time has hidden, and what new tools see</h3><p>Dating a hole is hard. Radiocarbon needs organic material, and cutting rock leaves none behind. Floor deposits that might hold charcoal or pottery have been cleared by centuries of reuse, by inhabitants cleaning their rooms, and by modern work to open the site to visitors. Critics of Hancock, such as the writer Jason Colavito, note that he offers no dated evidence for an Ice Age start either. That is the honest state of play: an undated excavation, with a Byzantine city on top and an unknown beginning.</p><p>The mainstream has a reasonable answer to the question of why anyone would dig so deep. The Arab–Byzantine frontier ran through this region for about four centuries, and raids came again and again. A refuge that each generation deepened a little, in rock soft enough to cut with iron picks, needs no single heroic project and no Ice Age. The same logic cuts against the conventional story, though: a city that grew by small additions over centuries could just as easily have started earlier than anyone has shown. Growth by accretion explains the size; it does not date the seed.</p><aside class="wcall"><b>Fresh from the field</b><p>In 2020, restoration work in Midyat, in southeastern Türkiye, uncovered Matiate, an underground city its excavators date to the 2nd or 3rd century CE. By 2022, 49 rooms had been exposed, with a church, silos, wells, coins and lamps; the excavation&#x27;s director, Gani Tarkan, suggested it could once have held 60,000–70,000 people, an estimate from a small explored fraction. At Derinkuyu, a 2023 study used satellite radar interferometry to track ground movement above the tunnels, and 2024–2026 studies mapped its layout and soundscape.</p></aside></section><section class="wsec" id="derinkuyu-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What would settle it</h3><ul class="wlist"><li>Excavate sealed floor layers in unopened chambers at the lowest levels, and date anything organic in them.</li><li>Date the fill at the bottom of the deepest shafts and wells by luminescence, which gives a minimum age for the cutting.</li><li>Build a chronology of tool marks from dated Cappadocian tombs and churches, then read the deep levels against it.</li><li>Map Derinkuyu, Kaymaklı and Matiate in 3D to see which spaces cut through older ones.</li></ul><p>If the deepest chambers yield Iron Age pottery sealed beneath their floors, the Phrygian start will firm up; if they yield anything older, the story changes dramatically. For now, the deep city belongs to the Byzantine world on the evidence we have, and its first shovel of tuff belongs to no one we can name.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">750 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Phrygian period: first rooms possibly cut (proposed, undated)</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">400 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Xenophon describes underground houses in Armenia</span></li><li class="wtl-build" style="--i:2"><span class="wtl-y">780 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Arab–Byzantine wars: the city is greatly enlarged as a refuge (to c. 1180)</span></li><li class="wtl-loss" style="--i:3"><span class="wtl-y">1923 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Population exchange: the Christian inhabitants leave</span></li><li class="wtl-find" style="--i:4"><span class="wtl-y">1963 CE</span><span class="wtl-k">Found</span><span class="wtl-t">A resident breaks through a basement wall and finds a room</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">1969 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Opened to visitors</span></li><li class="wtl-event" style="--i:6"><span class="wtl-y">1985 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Rock Sites of Cappadocia inscribed by UNESCO</span></li><li class="wtl-find" style="--i:7"><span class="wtl-y">2020 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Matiate underground city found beneath Midyat</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2023 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Satellite radar used to monitor ground movement over Derinkuyu</span></li></ol><details class="srcs"><summary>Sources for this case (13)</summary><ol><li>Nývlt, V., Musílek, J., Čejka, J. and Stopka, O. (2016). The study of Derinkuyu underground city in Cappadocia located in pyroclastic rock materials. Procedia Engineering 161: 2253–2258. <a href="https://doi.org/10.1016/j.proeng.2016.08.824" target="_blank" rel="noopener">doi:10.1016/j.proeng.2016.08.824</a></li><li>Aydan, Ö. and Ulusay, R. (2013). Geomechanical evaluation of Derinkuyu antique underground city and its implications in geoengineering. Rock Mechanics and Rock Engineering 46(4): 731–754. <a href="https://doi.org/10.1007/s00603-012-0301-7" target="_blank" rel="noopener">doi:10.1007/s00603-012-0301-7</a></li><li>Bixio, R. (ed.) (2012). Cappadocia: Schede dei siti sotterranei / Records of the underground sites. BAR International Series. Oxford: Archaeopress. <a href="https://doi.org/10.30861/9781407310114" target="_blank" rel="noopener">doi:10.30861/9781407310114</a></li><li>Ousterhout, R. G. (2017). Visualizing Community: Art, Material Culture, and Settlement in Byzantine Cappadocia. Washington, DC: Dumbarton Oaks.</li><li>Oktar, O. (2023). Investigation of Derinkuyu underground city by persistent scatterer interferometry technique. Afyon Kocatepe University Journal of Sciences and Engineering 23: 1206–1213. <a href="https://doi.org/10.35414/akufemubid.1211892" target="_blank" rel="noopener">doi:10.35414/akufemubid.1211892</a></li><li>Yılmaz Şenel, K. (2024). Space syntax study for underground city example: Derinkuyu. Journal of Turkish Studies 19: 725–737. <a href="https://doi.org/10.7827/turkishstudies.75098" target="_blank" rel="noopener">doi:10.7827/turkishstudies.75098</a></li><li>Yamaç, A. and Tok, E. (2026). Underground shelters of Cappadocia. In Advances in Karst Science, pp. 25–53. Cham: Springer. <a href="https://doi.org/10.1007/978-3-032-16095-9_3" target="_blank" rel="noopener">doi:10.1007/978-3-032-16095-9_3</a></li><li>Xenophon, Anabasis 4.5.25 (c. 370 BCE), on underground houses in Armenia.</li><li>Darmesteter, J. (trans.) (1880). The Zend-Avesta, Part I: The Vendidad. Sacred Books of the East vol. 4. Oxford: Clarendon Press.</li><li>Hancock, G. (2015). Magicians of the Gods. London: Coronet. Chapter 7.</li><li>Colavito, J. (2015). Review of Magicians of the Gods. jasoncolavito.com.</li><li>HISTORY (2026). Why is there a massive ancient city hidden beneath Turkey? history.com.</li><li>Smithsonian Magazine (2022). This huge underground city may have been a refuge for 70,000 early Christians. 17 May 2022.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-derinkuyu" data-t="Derinkuyu: The City Beneath Cappadocia"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Derinkuyu: The City Beneath Cappadocia</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-derinkuyu</span> (updated 25 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-nan-madol-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Nan Madol megalithic site, Pohnpei (Federated States of Micronesia).jpg" data-cap="Basalt walls of Nan Madol, Pohnpei" data-big><figcaption></figcaption></figure><div class="sh-k">Mysteries of the Earth</div><h2 class="sh-t" id="case-nan-madol-st" tabindex="-1">Nan Madol: The Basalt City on the Reef</h2><p class="sh-s">Nearly a hundred islets built on a coral reef from stacked basalt columns, on one of the most remote islands on Earth. Legend says the stones flew.</p><div class="sh-v"><span class="vstamp vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><p class="sh-claim"><b>What the stamp rates:</b> The megalithic city of Nan Madol was built by Pohnpeians under the Saudeleur dynasty, beginning in the late twelfth century CE.</p></div><p class="v4-q">Who stacked a city of basalt logs on a Pacific reef, and when?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Nan Madol is a city of about 100 artificial islets built from basalt logs on a Pacific reef.</li><li>Coral in the royal tomb dates its building to about 1180 to 1200 CE.</li><li>The basalt came from quarries on the island itself, matched by its chemistry.</li><li>Oral history describes the Saudeleur dynasty ruling from here, and digging shows people on the reef centuries earlier.</li><li>Built by Pohnpeians from the 1100s: strong evidence, with more islets still to be dated.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Chemistry</span><span class="thr">Texts and scripts</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="92" >92</b><span class="ctr-u"> islets</span></div><div class="ctr-l">artificial islets on the reef</div><div class="ctr-c">McCoy &amp; Athens 2011; counts vary to about 100</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="1180" >1,180</b><span class="ctr-u"> CE</span></div><div class="ctr-l">earliest U-Th date for building the royal tomb</div><div class="ctr-c">McCoy et al. 2016</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="750000" >750,000</b><span class="ctr-u"> tonnes</span></div><div class="ctr-l">stone and fill, a popular estimate</div><div class="ctr-c">Pala 2009</div></div><div class="ctr"><div class="ctr-v">up to <b class="ctr-n" data-v="7.5" data-dec="1">7.5</b><span class="ctr-u"> m</span></div><div class="ctr-l">height of the Nandauwas walls</div><div class="ctr-c">Morgan 1988</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The megalithic city of Nan Madol was built by Pohnpeians under the Saudeleur dynasty, beginning in the late twelfth century CE.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Several independent lines agree: uranium-thorium dates on coral put the royal tomb at about 1180–1200 CE; geochemistry ties the basalt to Pohnpei&#x27;s own quarries; oral history describes Saudeleur rule from Nan Madol; and excavations show earlier settlement on the reef from the first centuries CE, not a vanished older city. What keeps this short of fully established is how few islets have been dated, so the start of construction elsewhere on the site may differ.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Guidebooks and heritage listings present Nan Madol as a Saudeleur capital with confidence, and on the main point they are right. They sometimes state a single building date as if the whole site were dated, when only a few structures are, and they rarely mention that the transport methods are reasoned proposals. The mainstream account is well founded but a little more precise than its evidence.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Nan Madol consists of about 92 to 100 artificial islets, depending on how they are counted, built of basalt and coral fill on the reef flat off Temwen Island and separated by tidal canals.<small>McCoy &amp; Athens 2011; UNESCO 2016</small></li><li>Uranium-thorium dates on coral used in the construction of Nandauwas, the royal mortuary, place its building at about 1180–1200 CE.<small>McCoy et al. 2016</small></li><li>Geochemical (XRF) sourcing shows the builders used basalt from several sources on Pohnpei, favouring columnar basalt from an older volcanic phase.<small>McCoy &amp; Athens 2011</small></li><li>Pohnpeian oral history describes the Saudeleur dynasty ruling from Nan Madol until it was overthrown by the hero Isokelekel, an event traditionally placed around 1628.<small>Hanlon 1988</small></li><li>Nandauwas measures roughly 80 by 60 m, with walls 5.5–7.5 m high built of columns laid in alternating crosswise and lengthwise courses.<small>Morgan 1988; McCoy et al. 2016</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>When the first islets were built, since most structures have not been directly dated and the earliest platforms may be centuries older than the megalithic walls.</li><li>Exactly how the heaviest columns were moved and lifted, since no contemporary account or tool kit for transport survives.</li><li>How large a workforce was needed and over how many generations, which depends on total tonnage estimates that vary.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>No written records survive from the Saudeleur era; its history comes from oral tradition written down after European contact.</li><li>Wooden rafts, ropes and levers that may have moved the stones decay quickly in the tropics and leave little trace.</li><li>Silt and mangroves are now filling the canals and pushing walls apart, which is why UNESCO placed the site on its Danger list in 2016.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Archaeologists see Nan Madol as the political and ritual capital of the Saudeleur, a dynasty that unified Pohnpei under one ruler. People had lived on the reef edge since the first centuries CE; islets were built up over centuries, and the megalithic phase began around 1180–1200 CE with the royal tomb at Nandauwas. Builders pried natural basalt columns from outcrops around the island, probably floated them on rafts inside the reef, and stacked them like logs, filling the core with coral.</p><ul><li>Coral dated by uranium-thorium decay gives a tight date for the royal tomb.</li><li>Stone sourcing matches the columns to quarries on Pohnpei itself.</li><li>Oral history, excavated burials and the layout of elite and ritual islets fit a paramount chiefdom.</li><li>Columnar basalt forms naturally, so the builders moved and stacked stone rather than cutting it.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Early in the twentieth century James Churchward made Nan Madol a relic of Mu, a lost Pacific continent, and David Hatcher Childress later placed it among the lost cities of Lemuria and the Pacific. Graham Hancock, in Underworld (2002), took seriously Pohnpeian traditions of Kahnihmweiso, a sunken city beyond the reef, and asked whether they might preserve a memory of older structures drowned by rising seas. The staggering tonnage, the island&#x27;s small population and the legend of flying stones all feed the question: was the visible city built over something much older?</p><ul><li>Estimates of total stone run to hundreds of thousands of tonnes, for an island of about 334 square kilometres.</li><li>Pohnpeian tradition itself speaks of a sunken city and of stones moved by magic.</li><li>Only a few structures have been dated directly, so the earliest history of the site is incomplete.</li></ul><div class="face-s"><b>Its strongest point</b><p>Local tradition does describe a drowned city, and only a handful of Nan Madol&#x27;s islets have been directly dated, so the full building sequence, including what may lie beneath the visible walls, is genuinely not yet known.</p></div><p class="face-cr"><b>Credit</b> James Churchward; David Hatcher Childress; Graham Hancock</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Date coral and charcoal from many more islets, especially the lowest fill layers, to map the full building sequence.</li><li>Survey the reef edge and deeper water with sonar and divers, and sample any columnar features found, to test the sunken-city tradition.</li><li>Source more stones by XRF to trace which quarries fed which islets and when.</li><li>Experimental raft and lifting trials with columns of known weight to test transport methods and labour.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,185 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Nan Madol: The Basalt City on the Reef"><button type="button" class="wtoc-i" data-go="nan-madol-s1">A city of stone logs</button><button type="button" class="wtoc-i" data-go="nan-madol-s2">What is solid</button><button type="button" class="wtoc-i" data-go="nan-madol-s3">Dating a city with coral</button><button type="button" class="wtoc-i" data-go="nan-madol-s4">The case for something older</button><button type="button" class="wtoc-i" data-go="nan-madol-s5">How to move a basalt log</button><button type="button" class="wtoc-i" data-go="nan-madol-s6">What time is taking now</button><button type="button" class="wtoc-i" data-go="nan-madol-s7">What would settle it</button></nav></div><section class="wsec" id="nan-madol-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A city of stone logs</h3><p>Paddle through the mangroves off Pohnpei&#x27;s southeast coast at high tide and walls rise out of the green water: black stone laid like a log cabin, prism crossed over prism, some courses higher than a two-storey house. The stones are natural basalt columns, five- and six-sided, some several metres long and weighing tonnes. Around them lie nearly a hundred artificial islets separated by canals, on a coral reef, in one of the most remote places humans ever settled.</p><p>Nan Madol baffled the Europeans who reached it in the nineteenth century. Pohnpei is a small island, about 334 square kilometres, with no draught animals and no metal. Who had moved so much stone, and why build a city on the reef rather than on land? Pohnpeians had their own answer. Two sorcerer brothers, Olisihpa and Olosohpa, came from over the sea looking for a place to build an altar, and with a spell they made the stones fly through the air and settle into place.</p><blockquote class="wpull"><p>A city built on the sea, from stone logs that nature had already cut: it looks impossible until you see how the island made it possible.</p></blockquote></section><section class="wsec" id="nan-madol-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What is solid</h3><p>The site covers roughly 80 hectares of reef flat off Temwen Island. It divides into two parts: Madol Pah in the southwest, linked to the ruler and his court, and Madol Powe in the northeast, a precinct of priests and tombs. The grandest structure is Nandauwas, the royal mortuary, an enclosure about 80 by 60 metres with walls 5.5 to 7.5 metres high, an inner enclosure and a central tomb.</p><figure class="wx wx--static" id="nan-madol-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Nandauwas: wall and plan</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-la ="145.0" class="wx-dim"/><text x="328" y="272.5" class="wx-t-n">5.5–7.5 m</text><text x="328" y="287.5" class="wx-t-s">high</text><g class="wx-pop" style="--d:12"><circle cx="36" cy="348.2" r="6" class="wx-inkfill"/><line x1="36" y1="354.2" x2="36" y2="371.1" class="wx-bold"/><line x1="36" y1="371.1" x2="30" y2="400" class="wx-bold"/><line x1="36" y1="371.1" x2="42" y2="400" class="wx-bold"/><line x1="36" y1="354.1" x2="28" y2="369.4" class="wx-bold"/><line x1="36" y1="354.1" x2="44" y2="369.4" class="wx-bold"/></g><text x="36" y="436" text-anchor="middle" class="wx-t-s">1.7 m</text><line x1="180" y1="393" x2="180" y2="430" class="wx-thin"/><text x="186" y="444" class="wx-t-s">stretchers: columns laid lengthwise</text><text x="60" y="119.0" class="wx-t-b">Headers and stretchers</text><text x="60" y="133.0" class="wx-t-s">end-on columns (hexagons) cross lengthwise ones</text><line x1="200" y1="460" x2="268" y2="460" class="wx-bold"/><text x="276" y="464" class="wx-t-s">2 m</text><g class="wx-pop" style="--d:3"><rect x="400" y="70" width="240" height="180" class="wx-stone2 wx-edge"/><rect x="410" y="80" width="220" height="160" class="wx-sand"/></g><g class="wx-pop" style="--d:6"><rect x="460" y="115" width="120" height="90" class="wx-stone2 wx-edge wx-dash"/><rect x="468" y="123" width="104" height="74" class="wx-sand"/></g><g class="wx-pop" style="--d:9"><rect x="506" y="148" width="28" height="24" class="wx-stone3 wx-edge"/></g><path d="M404,268 L644,268" class="wx-flow wx-s2"/><text x="410" y="286" class="wx-t-s">tidal canal</text><line x1="400" y1="58" x2="640" y2="58" class="wx-dim"/><text x="520" y="52" text-anchor="middle" class="wx-t-n">c. 80 m</text><line x1="652" y1="70" x2="652" y2="250" class="wx-dim"/><text x="670" y="160" text-anchor="middle" transform="rotate(-90 670 160)" class="wx-t-n">c. 60 m</text><line x1="520" y1="172" x2="520" y2="310" class="wx-thin"/><text x="526" y="312" class="wx-t-b">Central tomb</text><text x="526" y="327" class="wx-t-s">built c. 1180–1200 CE (U-Th coral)</text><text x="402" y="354" class="wx-t-s">Outer wall and inner enclosure; inner</text><text x="402" y="368" class="wx-t-s">wall position approximate (dashed)</text><line x1="400" y1="390" x2="460" y2="390" class="wx-bold"/><text x="468" y="394" class="wx-t-s">20 m</text></svg></div></div><figcaption>A wall face of crossed basalt columns drawn to scale beside a person, and a simplified plan of the royal mortuary. <span class="wx-src">Based on: Wall height and enclosure size after Morgan 1988 and McCoy et al. 2016; header-stretcher technique after UNESCO 2016. Column sizes and inner wall position schematic.</span></figcaption><p class="vh">Left: a wall face drawn to scale, 1 metre to 34 pixels, rising 7.5 metres from the ground. Alternating courses show long basalt columns laid lengthwise and rows of hexagons, the ends of columns laid crosswise. A 1.7 metre human figure stands at its foot, reaching less than a quarter of the height. A dimension line reads 5.5 to 7.5 metres high and a scale bar shows 2 metres. Right: a simplified plan of Nandauwas, about 80 by 60 metres, with an outer wall, an approximate inner enclosure drawn dashed and a small central tomb labelled built about 1180 to 1200 CE by uranium-thorium coral dating. A tidal canal runs below, and a scale bar shows 20 metres.</p></figure><p>The building technique is distinctive. Columns were laid in alternating courses, a layer end-on across the wall, then a layer lengthwise, the pattern archaeologists call header and stretcher. The crossing layers lock each other in place without mortar, and the core is packed with coral rubble. Tradition and archaeology agree on the purpose: this was the capital of the Saudeleur, lords who ruled all of Pohnpei, until the hero Isokelekel overthrew them, an event traditionally dated around 1628.</p></section><section class="wsec" id="nan-madol-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Dating a city with coral</h3><aside class="wcall"><b>How do we know?</b><p>Living coral takes up a little uranium from seawater but almost no thorium. Once it dies, the uranium decays to thorium at a known rate, so the ratio acts as a clock. In a 2016 study, Mark McCoy and colleagues dated coral used in building Nandauwas and got about 1180–1200 CE, a precise date for the start of the megalithic tomb, and an earlier date than many had assumed.</p></aside><p>The same team matched the chemistry of the stones to outcrops on Pohnpei. An earlier XRF study by McCoy and Steven Athens found that the builders drew on several sources: most boulders came from Temwen Island and nearby, while the columns were chosen from basalt of an older volcanic phase, roughly 7 to 8 million years old, on the main island. Different structures used different quarries, perhaps as sources ran out or as political alliances changed.</p><p>Radiocarbon dates show people living on the reef edge from the first centuries CE, and islets were built up over the following centuries. The megalithic walls came late in a long story, not at its beginning.</p></section><section class="wsec" id="nan-madol-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The case for something older</h3><p>The challengers begin with the numbers. A popular estimate, repeated in the Smithsonian&#x27;s coverage, puts the stone and fill at about 750,000 tonnes, and single stones at Nandauwas are often estimated at up to around 50 tonnes. That is a heavy burden for an island population with only wood, fibre and muscle. James Churchward made Nan Madol a relic of Mu, his sunken Pacific continent; David Hatcher Childress set it among the lost cities of Lemuria and the Pacific.</p><p>Graham Hancock&#x27;s version is more careful. In Underworld he took Pohnpeian traditions seriously: stories speak of Kahnihmweiso, a city now under the sea beyond the reef, and divers have reported columns standing in deep water. If sea level or land had shifted, might Nan Madol be the last visible part of an older complex? It is a fair question, and one that tradition raises, not only modern writers.</p><p>The evidence so far points the other way. Dives to check the reports have not documented a human-made structure at depth, and the features investigated have been read as natural. Pohnpei was settled only around 2,000 years ago, and the settlement layers under the islets show an ordinary village on the reef, not the ruins of an older city.</p></section><section class="wsec" id="nan-madol-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>How to move a basalt log</h3><p>The first trick was done by nature. When thick lava cools slowly, it shrinks and cracks into long prisms, the same process that made the Giant&#x27;s Causeway. Pohnpei has cliffs of these ready-made columns, so the builders did not need to cut stone; they needed to pry it loose and move it.</p><figure class="wx wx--steps" id="nan-madol-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">From lava to wall</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="From lava to wall"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" class="wx-svg" role="img" aria-labelledby="nan-madol-f2-t"><title id="nan-madol-f2-t">From lava to wall: how basalt columns could have reached Nan Madol, in five steps</title><text x="24" y="26" class="wx-t-cap">From quarry to islet · schematic</text><path d="M20,300 L20,150 L60,150 L60,140 L150,140 L150,160 L210,300 Z" class="wx-rock wx-edge-soft"/><rect x="210" y="300" width="340" height="80" class="wx-water wx-o80"/><path d="M210,300 L550,300" class="wx-flow wx-s2"/><rect x="20" y="300" width="190" height="80" class="wx-rock"/><path d="M550,380 L550,308 L700,308 L700,380 Z" class="wx-stone wx-edge-soft"/><text x="625" y="350" text-anchor="middle" class="wx-t-s">coral-fill islet</text><g class="wx-st" data-s="1"><rect x="66" y="142" width="12" height="120" class="wx-stone3 wx-edge"/><rect x="80" y="142" width="12" height="116" class="wx-stone3 wx-edge"/><rect x="94" y="142" width="12" height="112" class="wx-stone3 wx-edge"/><rect x="108" y="142" width="12" height="108" class="wx-stone3 wx-edge"/><rect x="122" y="142" width="12" height="104" class="wx-stone3 wx-edge"/><rect x="136" y="142" width="12" height="100" class="wx-stone3 wx-edge"/><circle cx="32" cy="58" r="9" class="wx-num"/><text x="32" y="62" text-anchor="middle" class="wx-numt">1</text><text x="48" y="62" class="wx-t-b">Nature makes the columns</text><text x="48" y="77" class="wx-t-s">cooling lava cracks into prisms,</text><text x="48" y="91" class="wx-t-s">often five- or six-sided</text></g><g class="wx-st wx-hide" data-only="2"><line x1="150" y1="120" x2="160" y2="250" class="wx-bold wx-s6"/><rect x="150" y="215" width="70" height="12" rx="3" class="wx-stone3 wx-edge" transform="rotate(20 150 215)"/></g><g class="wx-st" data-s="2"><circle cx="262" cy="118" r="9" class="wx-num"/><text x="262" y="122" text-anchor="middle" class="wx-numt">2</text><text x="278" y="122" class="wx-t-b">Pry them loose</text><text x="278" y="137" class="wx-t-s">levers along natural joints; no</text><text x="278" y="151" class="wx-t-s">cutting needed (proposed)</text></g><g class="wx-st wx-hide" data-only="3"><g class="wx-bob"><rect x="300" y="294" width="110" height="10" class="wx-wood wx-edge"/><rect x="306" y="282" width="96" height="12" rx="3" class="wx-stone3 wx-edge"/></g><text x="355" y="272" text-anchor="middle" class="wx-t-s">at high tide</text></g><g class="wx-st" data-s="3"><circle cx="262" cy="344" r="9" class="wx-num"/><text x="262" y="348" text-anchor="middle" class="wx-numt">3</text><text x="278" y="348" class="wx-t-b">Float them across</text><text x="278" y="363" class="wx-t-s">on rafts inside the reef (proposed)</text></g><g class="wx-st wx-hide" data-only="4"><line x1="540" y1="308" x2="620" y2="220" class="wx-bold wx-s6"/><line x1="552" y1="308" x2="
