class="wx-line"/><circle cx="186" cy="60" r="9" class="wx-num"/><text x="186" y="64" text-anchor="middle" class="wx-numt">1</text><text x="202" y="64" class="wx-t-b">Collect every text and list the signs</text></g><g class="wx-st" data-s="2"><rect x="196" y="76" width="86" height="32" rx="6" class="wx-hl"/><rect x="196" y="118" width="86" height="32" rx="6" class="wx-hl"/><rect x="196" y="160" width="86" height="32" rx="6" class="wx-hl"/><circle cx="480" cy="92" r="9" class="wx-num"/><text x="480" y="96" text-anchor="middle" class="wx-numt">2</text><text x="496" y="96" class="wx-t-b">Spot repeats</text><text x="496" y="111" class="wx-t-s">the same group opens</text><text x="496" y="125" class="wx-t-s">many texts: a name or title?</text></g><g class="wx-st" data-s="3"><path d="M239,200 L239,226" class="wx-line"/><rect x="170" y="228" width="200" height="46" rx="8" class="wx-card wx-edge"/><text x="270" y="248" text-anchor="middle" class="wx-t-b">royal names known</text><text x="270" y="264" text-anchor="middle" class="wx-t-s">from cuneiform and a bilingual</text><circle cx="396" cy="236" r="9" class="wx-num"/><text x="396" y="240" text-anchor="middle" class="wx-numt">3</text><text x="412" y="240" class="wx-t-b">Anchor the sounds</text><text x="412" y="255" class="wx-t-s">e.g. kings Shilhaha, Ebarat, Puzur-Sushinak:</text><text x="412" y="269" class="wx-t-s">each sign in the name gets a sound value</text></g><g class="wx-st" data-s="4"><path d="M202,310 L208,326 L212,310 L218,326" class="wx-line"/><circle cx="238" cy="318" r="8" class="wx-line"/><rect x="259" y="311" width="14" height="14" class="wx-line"/><path d="M288,310 L300,326 M300,310 L288,326" class="wx-line"/><path d="M316,310 Q330,318 316,326" class="wx-line"/><path d="M346,318 L356,328 L374,306" class="wx-hl"/><circle cx="396" cy="314" r="9" class="wx-num"/><text x="396" y="318" text-anchor="middle" class="wx-numt">4</text><text x="412" y="318" class="wx-t-b">Test on other texts</text><text x="412" y="333" class="wx-t-s">the values should yield words already</text><text x="412" y="347" class="wx-t-s">known in Elamite from cuneiform</text></g><g class="wx-st" data-s="5"><rect x="24" y="374" width="672" height="84" rx="10" class="wx-stone wx-o40"/><path d="M46,408 L62,408 M54,398 L54,418" class="wx-line"/><path d="M74,418 L82,398 L90,418 Z" class="wx-line"/><path d="M104,400 Q118,408 104,416" class="wx-line"/><path d="M138,398 L146,408 L138,418 L130,408 Z" class="wx-line"/><path d="M159,399 L173,399 M166,399 L166,417 M159,417 L173,417" class="wx-line"/><circle cx="196" cy="402" r="9" class="wx-num"/><text x="196" y="406" text-anchor="middle" class="wx-numt">5</text><text x="212" y="406" class="wx-t-b">The Indus problem</text><text x="190" y="422" class="wx-t-s">no bilingual, no known names, no known language,</text><text x="190" y="437" class="wx-t-s">and texts that average about five signs: steps 2–4 have little to hold</text><text x="630" y="428" text-anchor="middle" class="wx-t-big wx-t-a">?</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Collect every text and list the distinct signs.</p><ol class="wx-steplist"><li>Collect every text and list the distinct signs.</li><li>Spot repeated sign groups, often names or titles.</li><li>Anchor sound values with names known from another script, ideally a bilingual.</li><li>Test the values on other texts: they should produce words in a known language.</li><li>The Indus script lacks a bilingual, known names, a known language and long texts.</li></ol><figcaption>The route that worked for Linear Elamite, and what is missing for the Indus script. Signs are schematic. <span class="wx-src">Based on: Method after Robinson 2002; Linear Elamite example after Desset et al. 2022 (royal names on silver beakers, bilingual Table au Lion). Glyph shapes are invented placeholders.</span></figcaption><p class="vh">A silver beaker with a short inscription on the left. Step 1: three lines of schematic signs are listed, standing for collected texts. Step 2: the same three-sign group is boxed at the start of each line, suggesting a recurring name or title. Step 3: a card below says royal names known from cuneiform and a bilingual, with a note naming kings Shilhaha, Ebarat and Puzur-Sushinak; each sign in a name gets a sound value. Step 4: a new line of signs gets a tick, meaning the values yield Elamite words already known from cuneiform. Step 5: a panel shows five Indus-style signs with a large question mark: no bilingual, no known names, no known language, and texts averaging about five signs.</p></figure><aside class="wcall"><b>Fresh from the field</b><p>In 2022 François Desset and colleagues published a decipherment of Linear Elamite, using royal names on silver beakers and a bilingual with Akkadian; many specialists welcomed it, though some beakers lack recorded findspots. In 2024 a radiocarbon study dated the wood of a Rongorongo tablet to about 1493–1509 CE, before European contact. In 2025 the longest Linear A text yet, about 119 signs on an ivory ring from Knossos, was published. And in January 2025 the government of Tamil Nadu offered a US$1 million prize for deciphering the Indus script.</p></aside><p>The Rongorongo result is especially intriguing. If the islanders carved signs before any European ship arrived, Rapa Nui may be one of the very few places on Earth where writing was invented from scratch. The caution is that a date for the wood is not a date for the carving: an old plank can be inscribed centuries after the tree fell.</p></section><section class="wsec" id="lost-scripts-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Is the Indus script even writing?</h3><p>In 2004 three scholars, Steve Farmer, Richard Sproat and Michael Witzel, published a paper with a deliberately provocative title, &#x27;The collapse of the Indus-script thesis&#x27;. They argued that the signs were never writing in the linguistic sense but emblems: marks of clans, gods, offices and ritual. Their strongest point is hard to wave away. After excavations at hundreds of sites, there is still no long Indus text, no sentence-length inscription, nothing like the archives of Mesopotamia.</p><p>The reply came with statistics. In 2009 Rajesh Rao and colleagues showed in Science that the way Indus signs follow one another resembles known languages more than random or rigidly ordered sequences. Sproat answered that some non-linguistic systems, such as Mesopotamian deity symbols, pass the same test. The statistical round ended roughly in a draw.</p><p>A newer voice, the independent researcher Bahata Ansumali Mukhopadhyay, reads the seals as mostly logographic records of taxation, trade licences, commodity control and access control. On her view the signs carried meaning without spelling out spoken words, which would explain both their regularity and their brevity. Meanwhile, many claimed full decipherments into Sanskrit, Tamil or other languages have come and gone without surviving independent testing.</p><blockquote class="wpull"><p>The honest position is uncomfortable: the Indus signs probably relate to language, but nobody has shown how.</p></blockquote></section><section class="wsec" id="lost-scripts-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Can AI read the unreadable?</h3><p>Machine learning is already changing epigraphy. DeepMind&#x27;s Ithaca, published in Nature in 2022, restores missing letters in ancient Greek inscriptions and suggests their date and place of origin; historians working with it did markedly better than either the historians or the machine alone. Algorithms developed at MIT by Jiaming Luo, Regina Barzilay and colleagues have re-deciphered Ugaritic and Linear B automatically, by matching them to a known related language, and have since been tried on harder cases such as Iberian.</p><p>That last condition is the catch. These methods work when the underlying language, or a close relative, is known and when there is enough text. For Linear A and the Indus script neither is true. AI can sort signs, spot patterns, and test thousands of hypotheses a scholar could never check by hand, and open databases such as SigLA for Linear A make that possible. But no algorithm can invent a bilingual. The bottleneck is not computing power; it is evidence in the ground.</p></section><section class="wsec" id="lost-scripts-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What time erased</h3><p>Writing survives by accident. Linear A and Linear B tablets were unbaked clay, preserved because the palaces that stored them burned. If the Indus people also wrote on palm leaves, cloth, bark or wood, as later South Asian scribes did, all of it has rotted, and the seals may be just the durable tip of a literate world. On Rapa Nui, the loss was human: Peruvian slave raids in 1862 and the epidemics that followed killed much of the population, probably including the people who could read the tablets. By the time scholars asked, the knowledge was gone or garbled.</p></section><section class="wsec" id="lost-scripts-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle it</h3><p>One lucky find could change everything. Indus seals travelled to Mesopotamia and the Gulf, where scribes wrote in cuneiform, so a bilingual tag or seal is not impossible. A single long text, or an archive of tablets from one building, would give decipherers the volume they need. Open, complete corpora would let both human and machine test every proposal honestly.</p><p>Until then the verdict is plausible, not established: the Indus signs probably encode language in some form, but the case is unproven and the challengers deserve a hearing. The strangeness is part of the story. Five thousand years after these people wrote, their words are in our museums and still out of reach.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-use" style="--i:0"><span class="wtl-y">3,100 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Proto-Elamite accounts at Susa</span></li><li class="wtl-use" style="--i:1"><span class="wtl-y">2,600 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Mature Indus script in use</span></li><li class="wtl-use" style="--i:2"><span class="wtl-y">1,800 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Linear A on Crete</span></li><li class="wtl-find" style="--i:3"><span class="wtl-y">1908 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Phaistos disc found</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">1952 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Ventris deciphers Linear B</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">2009 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Entropy study claims Indus is language</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2022 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Linear Elamite decipherment published</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2024 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Rongorongo wood dated before contact</span></li><li class="wtl-event" style="--i:8"><span class="wtl-y">2025 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Longest Linear A text; Indus prize</span></li></ol><details class="srcs"><summary>Sources for this case (14)</summary><ol><li>Rao, R. P. N., Yadav, N., Vahia, M. N., Joglekar, H., Adhikari, R. &amp; Mahadevan, I. (2009). Entropic evidence for linguistic structure in the Indus script. Science 324: 1165. <a href="https://doi.org/10.1126/science.1170391" target="_blank" rel="noopener">doi:10.1126/science.1170391</a></li><li>Farmer, S., Sproat, R. &amp; Witzel, M. (2004). The collapse of the Indus-script thesis: the myth of a literate Harappan civilization. Electronic Journal of Vedic Studies 11(2): 19–57. <a href="https://doi.org/10.11588/ejvs.2004.2.620" target="_blank" rel="noopener">doi:10.11588/ejvs.2004.2.620</a></li><li>Sproat, R. (2014). A statistical comparison of written language and nonlinguistic symbol systems. Language 90(2): 457–481. <a href="https://doi.org/10.1353/lan.2014.0031" target="_blank" rel="noopener">doi:10.1353/lan.2014.0031</a></li><li>Mukhopadhyay, B. A. (2023). Semantic scope of Indus inscriptions comprising taxation, trade and craft licensing, commodity control and access control: archaeological and script-internal evidence. Humanities and Social Sciences Communications 10: 972. <a href="https://doi.org/10.1057/s41599-023-02320-7" target="_blank" rel="noopener">doi:10.1057/s41599-023-02320-7</a></li><li>Parpola, A. (1994). Deciphering the Indus Script. Cambridge University Press.</li><li>Desset, F., Tabibzadeh, K., Kervran, M., Basello, G. P. &amp; Marchesi, G. (2022). The decipherment of Linear Elamite writing. Zeitschrift für Assyriologie und vorderasiatische Archäologie 112(1): 11–60. <a href="https://doi.org/10.1515/za-2022-0003" target="_blank" rel="noopener">doi:10.1515/za-2022-0003</a></li><li>Ferrara, S., Tassoni, L., Kromer, B., Wacker, L., Friedrich, M., Tonini, F., Lastilla, L., Ravanelli, R. &amp; Talamo, S. (2024). The invention of writing on Rapa Nui (Easter Island): new radiocarbon dates on the Rongorongo script. Scientific Reports 14: 2794. <a href="https://doi.org/10.1038/s41598-024-53063-7" target="_blank" rel="noopener">doi:10.1038/s41598-024-53063-7</a></li><li>Kanta, A., Nakassis, D., Palaima, T. G. &amp; Perna, M. (2025). [Publication of the Linear A inscribed ivory ring and sceptre from the Anetaki plot, Knossos]. Ariadne, University of Crete.</li><li>Assael, Y., Sommerschield, T., Shillingford, B. et al. (2022). Restoring and attributing ancient texts using deep neural networks. Nature 603: 280–283. <a href="https://doi.org/10.1038/s41586-022-04448-z" target="_blank" rel="noopener">doi:10.1038/s41586-022-04448-z</a></li><li>Luo, J., Cao, Y. &amp; Barzilay, R. (2019). Neural decipherment via minimum-cost flow: from Ugaritic to Linear B. Proceedings of the 57th Annual Meeting of the Association for Computational Linguistics.</li><li>Luo, J., Hartmann, F., Santus, E., Barzilay, R. &amp; Cao, Y. (2021). Deciphering undersegmented ancient scripts using phonetic prior. Transactions of the Association for Computational Linguistics 9: 69–81.</li><li>Salgarella, E. (2020). Aegean Linear Script(s): Rethinking the Relationship between Linear A and Linear B. Cambridge University Press.</li><li>Robinson, A. (2002). Lost Languages: The Enigma of the World&#x27;s Undeciphered Scripts. McGraw-Hill.</li><li>Government of Tamil Nadu (2025). Announcement of a US$1 million prize for deciphering the Indus script, January 2025 (press reports).</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-lost-scripts" data-t="Lost Scripts: The Writing Nobody Can Read"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Lost Scripts: The Writing Nobody Can Read</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-lost-scripts</span> (updated 25 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-voynich-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Voynich Manuscript (32).jpg" data-cap="A herbal page of the Voynich Manuscript, Beinecke MS 408" data-big><figcaption></figcaption></figure><div class="sh-k">Mysteries of the Earth</div><h2 class="sh-t" id="case-voynich-st" tabindex="-1">The Voynich Manuscript: Language or Beautiful Nonsense?</h2><p class="sh-s">About 240 pages of invented letters, impossible plants and bathing women have beaten every codebreaker for over a century. Is anything written there at all?</p><div class="sh-v"><span class="vstamp vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><p class="sh-claim"><b>What the stamp rates:</b> The Voynich text encodes a real language rather than meaningless writing.</p></div><p class="v4-q">Does the Voynich script hide a real language, or nothing at all?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>The Voynich manuscript is a 240-page book in a script found nowhere else, on vellum dated 1404 to 1438.</li><li>Its words follow the statistical laws of real languages and cluster by the pictures they sit beside.</li><li>But its letters carry far less information than any known language, and words repeat in odd runs.</li><li>People writing deliberate nonsense also produce language-like text.</li><li>After a century, no reading has survived independent testing: a genuinely open question.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Texts and scripts</span><span class="thr">Mathematics</span><span class="thr">Chemistry</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="240" >240</b><span class="ctr-u"> pages</span></div><div class="ctr-l">surviving, many illustrated</div><div class="ctr-c">Beinecke MS 408</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="38000" >38,000</b><span class="ctr-u"> words</span></div><div class="ctr-l">in an unknown script</div><div class="ctr-c">Bowern and Lindemann 2021</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="4" >4</b><span class="ctr-u"> samples</span></div><div class="ctr-l">of vellum radiocarbon dated to 1404–1438</div><div class="ctr-c">University of Arizona 2011</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="5" >5</b><span class="ctr-u"> scribes</span></div><div class="ctr-l">identified by their handwriting</div><div class="ctr-c">Davis 2020</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="600" >600</b><span class="ctr-u"> ducats</span></div><div class="ctr-l">reportedly paid by Emperor Rudolf II</div><div class="ctr-c">Marci letter, 1665/66</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The Voynich text encodes a real language rather than meaningless writing.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:41.7%" role="img" aria-label="Weight of evidence: Open question"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">There is real evidence on both sides. The text follows Zipf&#x27;s law, its keywords cluster by section and match the pictures, and Bowern and Lindemann found no argument for gibberish persuasive. But its character entropy is far below any known language, words repeat in odd runs, and experiments show that people writing deliberate nonsense also produce structured, language-like text. After more than a century, no reading has survived independent testing. The question is genuinely open.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 2 of 6, cautious"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>cautious</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">The Beinecke Library and scholarly surveys describe the text honestly as undeciphered and of unknown meaning, and that caution matches the evidence. The overconfidence lives elsewhere: headlines announcing that the manuscript has been &#x27;solved&#x27; appear every few years, and none of those solutions has survived review by specialists.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Four samples of the vellum, cut from four pages, were radiocarbon dated at the University of Arizona in 2009 to 1404–1438.<small>Hodgins, University of Arizona 2011 release</small></li><li>The book has about 240 surviving pages and roughly 38,000 words written in a script known from no other document, with about 20–25 common characters.<small>Beinecke MS 408; Bowern and Lindemann 2021</small></li><li>It was in Prague by the early 1600s: the name of Rudolf II&#x27;s chemist Jacobus Hořčický de Tepenec appears on the first page, and letters of 1639 and 1665/66 send it towards Athanasius Kircher in Rome.<small>Beinecke; Davis 2024</small></li><li>Inks and paints are iron-gall ink and inexpensive mineral pigments consistent with a medieval or Renaissance workshop.<small>McCrone Associates analysis, 2009</small></li><li>The text follows strong rules: words built from ordered slots, two statistical &#x27;dialects&#x27; (Currier A and B) and at least five scribal hands.<small>Currier 1976; Davis 2020</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the text records a natural language, a cipher of one, an invented language, or meaningless but structured writing.</li><li>Whether the very low character entropy rules out an ordinary alphabet for a known language.</li><li>Where and by whom it was made; the zodiac month names in Latin letters, in a Romance dialect, may be a later addition.</li><li>Whether the text was written soon after the vellum was prepared, or decades later on old stock.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>About 14 folios, roughly 28 pages, are lost, along with any title page or colophon that might have named the author.</li><li>There is no record of the book between the 1430s and about 1600.</li><li>No key, crib or second document in the same script has ever been found.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Manuscript specialists regard MS 408 as a genuine early 15th-century book: the vellum, inks, binding structure and scribal habits fit that date. Its text remains undeciphered. Linguists such as Claire Bowern find its statistics language-like in several ways but strange in others, and no proposed decipherment has produced readable text that others can reproduce. The possibility that it is meaningless, made to look like writing, remains on the table.</p><ul><li>The object is old; a modern forgery is effectively ruled out by the materials.</li><li>Every published &#x27;solution&#x27; so far has failed independent testing.</li><li>The text is too regular to be random scribbling, but regularity alone does not show meaning.</li><li>Experiments show people inventing gibberish also produce structured text.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Those who see meaning in the text argue at two levels. Montemurro and Zanette (2013) found that key words cluster by section and match the pictures, as real content words do. Stephen Bax proposed readings of plant names, and Gerard Cheshire claimed in 2019 that it is written in a lost &#x27;proto-Romance&#x27;. In 2025 Michael Greshko showed that a verbose cipher worked with dice and playing cards, tools available in 15th-century Italy, can turn Latin or Italian into text that closely resembles Voynichese, keeping the cipher idea alive.</p><ul><li>Word frequencies follow Zipf&#x27;s law, like natural languages.</li><li>Content-like words cluster in the sections whose pictures match them.</li><li>Herbal and pharmaceutical sections, both about plants, share vocabulary.</li><li>A historically plausible cipher can reproduce much of the text&#x27;s odd structure.</li></ul><div class="face-s"><b>Its strongest point</b><p>The text is organised at many levels at once: word structure, section vocabulary tied to illustrations, and two dialects matching different scribes and topics. That is hard to fake by accident, and no 15th-century forger knew these statistics existed.</p></div><p class="face-cr"><b>Credit</b> Marcelo Montemurro and Damián Zanette; Stephen Bax; Gerard Cheshire; Michael Greshko</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>A decipherment that reads pages its author has not yet studied and predicts their content from the illustrations.</li><li>A second document in the Voynich script, or a key, found in a European archive.</li><li>Dating the ink itself, to show whether the text was written soon after 1404–1438.</li><li>Statistical tests that clearly separate human-made gibberish from ciphered language on texts of the same length.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,193 words · 3 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Voynich Manuscript: Language or Beautiful Nonsense?"><button type="button" class="wtoc-i" data-go="voynich-s1">A book nobody can read</button><button type="button" class="wtoc-i" data-go="voynich-s2">What is solid: an old book with a real history</button><button type="button" class="wtoc-i" data-go="voynich-s3">Writing that behaves like language</button><button type="button" class="wtoc-i" data-go="voynich-s4">And not like any language we know</button><button type="button" class="wtoc-i" data-go="voynich-s5">The case for beautiful nonsense</button><button type="button" class="wtoc-i" data-go="voynich-s6">A graveyard of solutions</button><button type="button" class="wtoc-i" data-go="voynich-s7">What time has hidden, and what would settle it</button></nav></div><section class="wsec" id="voynich-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A book nobody can read</h3><p>Open it anywhere and the strangeness starts. Plants that match no species a botanist can name, with roots like bulbs and leaves like fans. Wheels of stars and tiny naked women holding them. Women bathing in green pools joined by tubes that look like plumbing, or intestines. Rosettes, jars and short paragraphs marked with stars. And on every page, neat, flowing lines in an alphabet found in no other document on Earth.</p><p>This is Beinecke MS 408 at Yale, named after Wilfrid Voynich, the book dealer who bought it in 1912 from the Jesuits at the Villa Mondragone near Rome. About 240 pages survive, carrying roughly 38,000 words. The greatest codebreakers of the 20th century, including William and Elizebeth Friedman&#x27;s circle and the British cryptanalyst John Tiltman, tried and failed to read it.</p><blockquote class="wpull"><p>The oldest question about the Voynich is not what it says. It is whether it says anything at all.</p></blockquote></section><section class="wsec" id="voynich-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What is solid: an old book with a real history</h3><p>Whatever the text is, the object is genuine. In 2009 Greg Hodgins of the University of Arizona cut four slivers, each about 1 by 6 millimetres, from four pages and radiocarbon dated them. The calfskin was prepared between 1404 and 1438, about a century earlier than many had assumed. McCrone Associates analysed the inks and paints and found iron-gall ink and cheap mineral pigments, nothing a medieval workshop could not supply.</p><figure class="wx wx--steps" id="voynich-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">Six centuries in the life of MS 408</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Six centuries in the life of MS 408"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" class="wx-svg" role="img" aria-labelledby="voynich-f1-t"><title id="voynich-f1-t">Six centuries in the life of the Voynich Manuscript, from its vellum to its latest scans</title><text x="24" y="28" class="wx-t-cap">The life of Beinecke MS 408 · what is documented, and the gap</text><line x1="60.0" y1="236" x2="60.0" y2="244" class="wx-line"/><text x="60.0" y="262" text-anchor="middle" class="wx-t-s">1400</text><line x1="158.4" y1="236" x2="158.4" y2="244" class="wx-line"/><text x="158.4" y="262" text-anchor="middle" class="wx-t-s">1500</text><line x1="256.8" y1="236" x2="256.8" y2="244" class="wx-line"/><text x="256.8" y="262" text-anchor="middle" class="wx-t-s">1600</text><line x1="355.2" y1="236" x2="355.2" y2="244" class="wx-line"/><text x="355.2" y="262" text-anchor="middle" class="wx-t-s">1700</text><line x1="453.7" y1="236" x2="453.7" y2="244" class="wx-line"/><text x="453.7" y="262" text-anchor="middle" class="wx-t-s">1800</text><line x1="552.1" y1="236" x2="552.1" y2="244" class="wx-line"/><text x="552.1" y="262" text-anchor="middle" class="wx-t-s">1900</text><line x1="650.5" y1="236" x2="650.5" y2="244" class="wx-line"/><text x="650.5" y="262" text-anchor="middle" class="wx-t-s">2000</text><line x1="60.0" y1="240" x2="680.0" y2="240" class="wx-line"/><g class="wx-st" data-s="1"><rect x="63.9" y="231" width="33.5" height="18" rx="3" class="wx-c1"/><line x1="80.7" y1="231" x2="80.7" y2="110" class="wx-thin"/><text x="63.9" y="98" class="wx-t-b">Calfskin prepared, 1404–1438</text><text x="86.7" y="128" class="wx-t-s">radiocarbon, 4 samples</text><text x="86.7" y="142" class="wx-t-s">(University of Arizona, 2009)</text><line x1="104.3" y1="218" x2="249.0" y2="218" class="wx-dash"/><text x="176.1" y="210" text-anchor="middle" class="wx-t-m">no record</text></g><g class="wx-st" data-s="2"><line x1="256.8" y1="240" x2="256.8" y2="280" class="wx-thin"/><line x1="266.7" y1="240" x2="266.7" y2="280" class="wx-thin"/><circle cx="256.8" cy="240" r="6" class="wx-c6"/><circle cx="266.7" cy="240" r="6" class="wx-c6"/><text x="254.8" y="290" text-anchor="start" class="wx-t-b wx-halo">Prague, c. 1600</text><text x="254.8" y="305" text-anchor="start" class="wx-t-s wx-halo">Rudolf II's court; Hořčický's name on f1r</text></g><g class="wx-st" data-s="3"><line x1="295.2" y1="240" x2="295.2" y2="184" class="wx-thin"/><line x1="320.8" y1="240" x2="320.8" y2="184" class="wx-thin"/><circle cx="295.2" cy="240" r="6" class="wx-c3"/><circle cx="320.8" cy="240" r="6" class="wx-c3"/><text x="293.2" y="168" text-anchor="start" class="wx-t-b wx-halo">1639 and 1665/66</text><text x="293.2" y="183" text-anchor="start" class="wx-t-s wx-halo">Baresch, then Marci, turn to Kircher in Rome</text></g><g class="wx-st" data-s="4"><line x1="563.9" y1="240" x2="563.9" y2="330" class="wx-thin"/><line x1="620.0" y1="240" x2="620.0" y2="330" class="wx-thin"/><circle cx="563.9" cy="240" r="6" class="wx-c5"/><circle cx="620.0" cy="240" r="6" class="wx-c5"/><text x="624.0" y="340" text-anchor="end" class="wx-t-b wx-halo">1912 and 1969</text><text x="624.0" y="355" text-anchor="end" class="wx-t-s wx-halo">Voynich buys it; it is given to Yale</text></g><g class="wx-st" data-s="5"><line x1="659.3" y1="240" x2="659.3" y2="114" class="wx-thin"/><circle cx="659.3" cy="240" r="6" class="wx-c4"/><text x="663.3" y="98" text-anchor="end" class="wx-t-b wx-halo">2009–2025: science</text><text x="663.3" y="113" text-anchor="end" class="wx-t-s wx-halo">radiocarbon, imaging, scribes, ciphers</text></g><text x="24" y="388" class="wx-t-s">Dashed: no documented owner. The 600-ducat sale to Rudolf II is known only from Marci’s letter, as hearsay.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> The calfskin for the pages is prepared between 1404 and 1438; then 160 years without a record.</p><ol class="wx-steplist"><li>The calfskin for the pages is prepared between 1404 and 1438; then 160 years without a record.</li><li>By about 1600 the book is in Prague, at the court of Rudolf II.</li><li>1639 and 1665/66: Prague scholars ask Athanasius Kircher in Rome to read it, then send it to him.</li><li>1912: Voynich buys it from the Jesuits; 1969: it reaches Yale.</li><li>2009–2025: radiocarbon dating, multispectral images, scribe studies and new cipher experiments.</li></ol><figcaption>From calfskin to Yale: the documented history of the Voynich Manuscript, and the long gap before 1600. <span class="wx-src">Based on: Hodgins (University of Arizona) 2009 dating; Beinecke Library catalogue; Marci letter to Kircher (1665/66); Davis 2020 and 2024.</span></figcaption><p class="vh">A horizontal timeline from 1400 to 2030. Step 1: a band at 1404 to 1438 marks when the calfskin was prepared, by radiocarbon dating of four samples in 2009, followed by a dashed line labelled owners unknown until about 1600. Step 2: Prague around 1600, where Rudolf II reportedly paid 600 ducats, and the name of his chemist Hořčický on the first page. Step 3: 1639, Georg Baresch writes to Athanasius Kircher, and 1665 or 1666, Marci sends the book to Kircher. Step 4: 1912, Wilfrid Voynich buys it from the Jesuits, and 1969, it is given to Yale&#x27;s Beinecke Library. Step 5: 2009 to 2025, scientific study: radiocarbon dating, multispectral imaging, scribe analysis and cipher experiments.</p></figure><p>The book&#x27;s paper trail begins in Prague around 1600. A later letter from the physician Johannes Marcus Marci reports hearsay that Emperor Rudolf II paid 600 ducats for it. The name of Rudolf&#x27;s chemist, Jacobus Hořčický de Tepenec, is written, now faintly, on the first page. In 1639 the Prague alchemist Georg Baresch wrote to the Jesuit scholar Athanasius Kircher for help, and in 1665 or 1666 Marci sent the book itself to Kircher in Rome, hoping he could read it. He could not.</p><aside class="wcall"><b>Fresh from the field</b><p>In September 2024 the medieval manuscript expert Lisa Fagin Davis published multispectral images of ten pages, taken in 2014 by the Lazarus Project team. Under ultraviolet and other wavelengths, the erased inscription on the first page reads clearly as Hořčický&#x27;s name. Hidden in its margin are three columns: a Latin alphabet, Voynich letters and a shifted Latin alphabet, in handwriting Davis matches to Marci. It looks like one of the earliest recorded attempts to crack the code.</p></aside></section><section class="wsec" id="voynich-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Writing that behaves like language</h3><p>Counted by computer, the text shows several habits of real language. Its word frequencies follow Zipf&#x27;s law: the commonest word appears about twice as often as the second, three times as often as the third. In 1976 the cryptologist Prescott Currier showed that it comes in two statistical &#x27;dialects&#x27;, A and B, and in 2020 Davis identified at least five scribes whose hands change between sections, never within them.</p><figure class="wx wx--static" id="voynich-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">The book at a glance</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The book at a glance"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" class="wx-svg" role="img" aria-labelledby="voynich-f2-t"><title id="voynich-f2-t">The six illustrated sections of the Voynich Manuscript by page count, with Currier language A or B</title><text x="24" y="28" class="wx-t-cap">The book in order · pages per section (approximate)</text><rect x="40.0" y="110" width="367.9" height="56" rx="3" class="wx-green wx-growx" style="--d:1"/><text x="225.0" y="136" text-anchor="middle" class="wx-t-b wx-halo">Herbal</text><text x="225.0" y="154" text-anchor="middle" class="wx-t-n wx-halo">126 pages</text><text x="225.0" y="198" text-anchor="middle" class="wx-t-m">Currier: A and B</text><rect x="409.9" y="110" width="47.9" height="56" rx="3" class="wx-c2 wx-growx" style="--d:2"/><line x1="434.9" y1="110" x2="434.9" y2="86" class="wx-thin"/><text x="434.9" y="68" text-anchor="middle" class="wx-t-b">Astronomical</text><text x="434.9" y="83" text-anchor="middle" class="wx-t-s">17 pages · labels</text><rect x="459.8" y="110" width="56.7" height="56" rx="3" class="wx-water2 wx-growx" style="--d:3"/><line x1="489.2" y1="166" x2="489.2" y2="176" class="wx-thin"/><text x="489.2" y="194" text-anchor="middle" class="wx-t-b">Balneological</text><text x="489.2" y="209" text-anchor="middle" class="wx-t-s">20 pages · B</text><rect x="518.5" y="110" width="39.1" height="56" rx="3" class="wx-c6 wx-growx" style="--d:4"/><line x1="539.1" y1="110" x2="539.1" y2="86" class="wx-thin"/><text x="539.1" y="68" text-anchor="middle" class="wx-t-b">Cosmological</text><text x="539.1" y="83" text-anchor="middle" class="wx-t-s">14 pages · labels</text><rect x="559.6" y="110" width="45.0" height="56" rx="3" class="wx-c3 wx-growx" style="--d:5"/><line x1="583.1" y1="166" x2="583.1" y2="216" class="wx-thin"/><text x="583.1" y="234" text-anchor="middle" class="wx-t-b">Pharmaceutical</text><text x="583.1" y="249" text-anchor="middle" class="wx-t-s">16 pages · A</text><rect x="606.6" y="110" width="71.4" height="56" rx="3" class="wx-c8 wx-growx" style="--d:6"/><line x1="643.3" y1="110" x2="643.3" y2="86" class="wx-thin"/><text x="643.3" y="68" text-anchor="middle" class="wx-t-b">Recipes</text><text x="643.3" y="83" text-anchor="middle" class="wx-t-s">25 pages · B</text><text x="24" y="296" class="wx-t-s">Currier A and B: two statistical "dialects" identified by Prescott Currier in 1976. "Labels" = mostly short</text><text x="24" y="311" class="wx-t-s">words beside drawings. Not shown: about 8 text-only pages and roughly 28 missing pages.</text><text x="24" y="336" class="wx-t-s">Image themes: plants unknown to botany, star wheels, bathing women in green pools, rosettes, jars, starred paragraphs.</text></svg></div></div><figcaption>The six illustrated sections in page order, with approximate page counts and Currier&#x27;s language A or B. <span class="wx-src">Based on: Section page counts as commonly summarised from Zandbergen&#x27;s description of the manuscript; Currier 1976; Bowern and Lindemann 2021. Counts are approximate because foldouts complicate page numbering.</span></figcaption><p class="vh">A horizontal strip divided in proportion to page counts. Herbal, 126 pages, languages A and B; Astronomical, 17 pages, mostly labels; Balneological, 20 pages, language B; Cosmological, 14 pages, mostly labels; Pharmaceutical, 16 pages, language A; Recipes, 25 pages, language B. A note explains that Currier A and B are two statistical dialects identified in 1976 and that about 8 text-only pages and about 28 missing pages are not shown.</p></figure><p>In 2013 the physicists Marcelo Montemurro and Damián Zanette went further. They measured which words cluster in particular parts of the book and found keyword networks that line up with the pictures: the herbal and pharmaceutical sections, both about plants, share vocabulary more than either shares with the bathing pages. &#x27;The accumulated evidence about organization at different levels&#x27;, they wrote, &#x27;limits severely the scope of the hoax hypothesis and suggests the presence of a genuine linguistic structure.&#x27;</p></section><section class="wsec" id="voynich-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>And not like any language we know</h3><p>Yet the same statistics are deeply odd. Voynich words are assembled from a small kit of parts in a fixed order, like beads on a string, and nearly all are between 2 and 10 characters long. Some characters appear only at the start of a paragraph or the end of a line. The same word can appear two, three or more times in a row, and neighbouring words often differ by a single letter.</p><figure class="wx wx--static" id="voynich-f3" data-n="0"><div class="wx-head"><span class="wx-k">Figure 3 · Animated drawing</span><h4 class="wx-title">How predictable is the next letter?</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How predictable is the next letter?"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" class="wx-svg" role="img" aria-labelledby="voynich-f3-t"><title id="voynich-f3-t">Conditional character entropy of Voynich A and B compared with natural languages</title><text x="24" y="28" class="wx-t-cap">How predictable is the next letter? · conditional entropy h2, bits</text><line x1="200.0" y1="60" x2="200.0" y2="220" class="wx-guide"/><text x="200.0" y="240" text-anchor="middle" class="wx-t-s">0</text><line x1="310.0" y1="60" x2="310.0" y2="220" class="wx-guide"/><text x="310.0" y="240" text-anchor="middle" class="wx-t-s">1</text><line x1="420.0" y1="60" x2="420.0" y2="220" class="wx-guide"/><text x="420.0" y="240" text-anchor="middle" class="wx-t-s">2</text><line x1="530.0" y1="60" x2="530.0" y2="220" class="wx-guide"/><text x="530.0" y="240" text-anchor="middle" class="wx-t-s">3</text><line x1="640.0" y1="60" x2="640.0" y2="220" class="wx-guide"/><text x="640.0" y="240" text-anchor="middle" class="wx-t-s">4</text><line x1="200.0" y1="220" x2="673.0" y2="220" class="wx-line"/><rect x="530.0" y="60" width="110.0" height="160" class="wx-accfill wx-o20"/><text x="585.0" y="78" text-anchor="middle" class="wx-t-b wx-t-a">natural languages</text><text x="585.0" y="94" text-anchor="middle" class="wx-t-s">about 3–4 bits</text><text x="24" y="130" class="wx-t-b">Voynich A</text><rect x="200.0" y="115" width="238.7" height="20" rx="3" class="wx-c2 wx-growx" style="--d:1"/><text x="446.7" y="130" class="wx-t-n">2.17</text><text x="24" y="180" class="wx-t-b">Voynich B</text><rect x="200.0" y="165" width="221.1" height="20" rx="3" class="wx-c2 wx-growx" style="--d:2"/><text x="429.1" y="180" class="wx-t-n">2.01</text><text x="431.0" y="262" text-anchor="middle" class="wx-t-m">← more predictable</text><text x="596.0" y="262" text-anchor="middle" class="wx-t-m">less predictable →</text><text x="24" y="288" class="wx-t-s">Lower values mean each character is more strongly fixed by the one before it, as in "q" almost always followed by "o".</text></svg></div></div><figcaption>Conditional character entropy (h2) of the two Voynich dialects against the range for natural languages in Bowern and Lindemann&#x27;s sample. <span class="wx-src">Based on: Bowern and Lindemann 2021, Annual Review of Linguistics 7: 285–308.</span></figcaption><p class="vh">A bar chart with an axis from 0 to 4 bits. A shaded band from 3 to 4 bits is labelled natural languages. Voynich A has a bar reaching 2.17 and Voynich B a bar reaching 2.01, both well to the left of the band, meaning each Voynich character is much more predictable from the one before it.</p></figure><p>The most striking number is entropy, a measure of how predictable the next character is. In Claire Bowern and Luke Lindemann&#x27;s 2021 review, Voynich A scores 2.17 bits and Voynich B 2.01, well below the roughly 3–4 bits of every natural language in their sample. That rules out a simple letter-for-letter code of Latin, German or Italian. It leaves room for a syllable-based script, a heavily abbreviated one, a verbose cipher that turns each letter into several symbols, or no language at all.</p></section><section class="wsec" id="voynich-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The case for beautiful nonsense</h3><p>In 2004 the psychologist Gordon Rugg showed that a Renaissance forger could have generated Voynich-like words by sliding a card with holes (a Cardan grille) over a table of syllables. In 2020 Torsten Timm and Andreas Schinner went further with a &#x27;self-citation&#x27; method: a scribe copies earlier words with small changes, and the result reproduces the repeats, the near-duplicate neighbours and the Zipf curve. In 2022 Daniel Gaskell and Claire Bowern asked volunteers to write pages of meaningless text by hand. Their gibberish was far from random, with its own repeated units and structure.</p><p>The hoax idea has problems of its own. A forger would need 15th-century vellum, a consistent invented script, five cooperating scribes and hundreds of detailed paintings, all to deceive a buyer, and Rugg&#x27;s grille does not explain why vocabulary tracks the pictures. Bowern and Lindemann concluded that they were &#x27;not persuaded by any of the arguments in favor of the Voynich text being gibberish&#x27;. The hoax has not been ruled out; it has not been shown either.</p></section><section class="wsec" id="voynich-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>A graveyard of solutions</h3><p>Few objects have attracted so many announced decipherments. In 1921 William Newbold claimed to find microscopic Greek shorthand in the pen strokes, crediting Roger Bacon; the &#x27;shorthand&#x27; turned out to be cracks in the ink. Since then readers have proposed Ukrainian, Old Turkic, Hebrew, Latin abbreviations and more. In 2019 Gerard Cheshire announced in Romance Studies that the book was written in a lost &#x27;proto-Romance&#x27; language; specialists found his readings circular, and the University of Bristol distanced itself from the claim.</p><p>Some attempts were more cautious. The linguist Stephen Bax proposed in 2014 that a few plant labels could be read as names such as &#x27;centaury&#x27;, offering them as a starting point rather than a solution. The pattern repeats: a hypothesis picks a language, the letters are matched until words appear, and the matching is too flexible to fail. (Scripts that really were cracked, like Linear B, are discussed in the lost-scripts case.)</p><blockquote class="wpull"><p>A true decipherment does not just find words. It reads the next page correctly before anyone has looked.</p></blockquote><p>The most interesting recent work is not a solution at all. In 2025 the science journalist Michael Greshko published the Naibbe cipher in Cryptologia: a scheme using dice and a deck of playing cards, both available in 15th-century Italy, that turns Latin or Italian into Voynich-like text following the manuscript&#x27;s word grammar. Greshko does not claim this is how the book was made. He shows that a meaningful cipher could have produced text this strange.</p></section><section class="wsec" id="voynich-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What time has hidden, and what would settle it</h3><p>Time has taken a lot. About 28 pages are missing, possibly including any title page or opening that named the author. The book&#x27;s first 160 years are blank. And no other document in the script has turned up, although countless archives in Central Europe and Italy have never been fully catalogued.</p><ul class="wlist"><li>A decipherment that makes testable predictions on unread pages and matches the pictures.</li><li>A key, a draft or a second text in the script, found in an archive.</li><li>A date for the ink itself, to tie the writing to the vellum.</li><li>Tests that reliably separate structured gibberish from ciphered language in texts this size.</li></ul><p>Until then the Voynich Manuscript is one of the rare mysteries where the object is firmly dated and fully visible, yet its central question remains as open as it was when Baresch first wrote for help in 1639.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">1421 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Calfskin prepared (radiocarbon 1404–1438)</span></li><li class="wtl-use" style="--i:1"><span class="wtl-y">1639 CE</span><span class="wtl-k">In use</span><span class="wtl-t">Georg Baresch writes to Kircher about the book</span></li><li class="wtl-use" style="--i:2"><span class="wtl-y">1665 CE</span><span class="wtl-k">In use</span><span class="wtl-t">Marci sends it to Kircher in Rome</span></li><li class="wtl-find" style="--i:3"><span class="wtl-y">1912 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Wilfrid Voynich buys it from the Jesuits</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">1969 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Given to Yale&#x27;s Beinecke Library</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1976 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Prescott Currier identifies languages A and B</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2009 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Vellum radiocarbon dated</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2019 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">&#x27;Proto-Romance&#x27; claim, rejected by specialists</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2024 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Multispectral images of ten pages published</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">2025 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Naibbe cipher reproduces Voynich-like text</span></li></ol><details class="srcs"><summary>Sources for this case (14)</summary><ol><li>Bowern, C. L. &amp; Lindemann, L. (2021). The linguistics of the Voynich manuscript. Annual Review of Linguistics 7: 285–308. <a href="https://doi.org/10.1146/annurev-linguistics-011619-030613" target="_blank" rel="noopener">doi:10.1146/annurev-linguistics-011619-030613</a></li><li>Montemurro, M. A. &amp; Zanette, D. H. (2013). Keywords and co-occurrence patterns in the Voynich manuscript: an information-theoretic analysis. PLOS ONE 8(6): e66344. <a href="https://doi.org/10.1371/journal.pone.0066344" target="_blank" rel="noopener">doi:10.1371/journal.pone.0066344</a></li><li>Amancio, D. R., Altmann, E. G., Rybski, D., Oliveira, O. N. &amp; Costa, L. da F. (2013). Probing the statistical properties of unknown texts: application to the Voynich manuscript. PLOS ONE 8(7): e67310. <a href="https://doi.org/10.1371/journal.pone.0067310" target="_blank" rel="noopener">doi:10.1371/journal.pone.0067310</a></li><li>Greshko, M. A. (2025). The Naibbe cipher: a substitution cipher that encrypts Latin and Italian as Voynich Manuscript-like ciphertext. Cryptologia. <a href="https://doi.org/10.1080/01611194.2025.2566408" target="_blank" rel="noopener">doi:10.1080/01611194.2025.2566408</a></li><li>Timm, T. &amp; Schinner, A. (2020). A possible generating algorithm of the Voynich manuscript. Cryptologia 44(1): 1–19. <a href="https://doi.org/10.1080/01611194.2019.1596999" target="_blank" rel="noopener">doi:10.1080/01611194.2019.1596999</a></li><li>Rugg, G. (2004). An elegant hoax? A possible solution to the Voynich manuscript. Cryptologia 28(1): 31–46.</li><li>Cheshire, G. (2019). The language and writing system of MS408 (Voynich) explained. Romance Studies 37(1): 30–67. <a href="https://doi.org/10.1080/02639904.2019.1599566" target="_blank" rel="noopener">doi:10.1080/02639904.2019.1599566</a></li><li>Davis, L. F. (2020). How many glyphs and how many scribes? Digital paleography and the Voynich manuscript. Manuscript Studies 5(1): 164–180.</li><li>Davis, L. F. (2024). Multispectral imaging and the Voynich Manuscript. Manuscript Road Trip (blog), 8 September 2024.</li><li>Gaskell, D. E. &amp; Bowern, C. L. (2022). Gibberish after all? Voynichese is statistically similar to human-produced samples of meaningless text. Proceedings of the International Conference on the Voynich Manuscript 2022 (CEUR Workshop Proceedings).</li><li>University of Arizona (2011). UA experts determine age of book &#x27;nobody can read&#x27; (G. Hodgins, radiocarbon dating). News release, February 2011.</li><li>Currier, P. (1976). Papers on the Voynich manuscript. In M. E. D&#x27;Imperio (ed.), New Research on the Voynich Manuscript: Proceedings of a Seminar. Washington DC.</li><li>Bax, S. (2014). A proposed partial decoding of the Voynich script. University of Bedfordshire (working paper).</li><li>Beinecke Rare Book and Manuscript Library, Yale University. Cipher manuscript (Voynich Manuscript), Beinecke MS 408. Catalogue record and digital facsimile.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-voynich" data-t="The Voynich Manuscript: Language or Beautiful Nonsense?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Voynich Manuscript: Language or Beautiful Nonsense?</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-voynich</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-sea-peoples-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Medinet Habu Ramses III. Tempel Nordostwand Abzeichnung 01.jpg" data-cap="The sea battle against the Sea Peoples, Medinet Habu, drawing of the relief" data-big><figcaption></figcaption></figure><div class="sh-k">Mysteries of the Earth</div><h2 class="sh-t" id="case-sea-peoples-st" tabindex="-1">The Sea Peoples and the End of the Bronze Age</h2><p class="sh-s">Within a few decades, palaces from Greece to Syria burned or emptied. Egypt blamed raiders from the islands. Were they the cause, or a symptom?</p><div class="sh-v"><span class="vstamp vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div><p class="sh-claim"><b>What the stamp rates:</b> Invading Sea Peoples were the main cause of the collapse of the Late Bronze Age world around 1200–1150 BCE.</p></div><p class="v4-q">Did the invading Sea Peoples bring down the Bronze Age world?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Around 1200 BCE the palaces of the eastern Mediterranean fell within a few decades.</li><li>Egyptian texts name sea-borne groups who attacked twice, and DNA shows newcomers settling at Ashkelon.</li><li>But drought is independently dated to the same years, and several cities were abandoned rather than stormed.</li><li>Some destructions show no sign of outside attackers at all.</li><li>The Sea Peoples were a real force in the collapse; the evidence does not make them its main cause.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Climate</span><span class="thr">Biology</span><span class="thr">Texts and scripts</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="9" >9</b><span class="ctr-u"> groups</span></div><div class="ctr-l">named among the Sea Peoples in Egyptian texts</div><div class="ctr-c">Wilson in Pritchard 1969; Cline 2014</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="3" >3</b><span class="ctr-u"> years</span></div><div class="ctr-l">of severe drought at Gordion, c. 1198–1196 BCE</div><div class="ctr-c">Manning et al. 2023</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="1177" >1,177</b><span class="ctr-u"> BCE</span></div><div class="ctr-l">Ramesses III&#x27;s Year 8 battles, by Cline&#x27;s dating</div><div class="ctr-c">Cline 2014</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="1881" >1,881</b><span class="ctr-u"> </span></div><div class="ctr-l">year Gaston Maspero coined &#x27;peoples of the sea&#x27;</div><div class="ctr-c">Cline 2014</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Invading Sea Peoples were the main cause of the collapse of the Late Bronze Age world around 1200–1150 BCE.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:50.0%" role="img" aria-label="Weight of evidence: Mixed record"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Parts of the claim are well supported: named sea-borne groups attacked Egypt twice, some cities show violent destruction at the right time, and ancient DNA shows newcomers settling at Ashkelon. But drought is independently dated to the same decades, several centres were abandoned rather than stormed, some destructions have no sign of outside attackers, and Carchemish survived despite Egypt&#x27;s claim. The Sea Peoples were a real force within the collapse; the evidence does not support them as its main cause.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">For much of the twentieth century, textbooks and documentaries told the collapse as an invasion, taking Ramesses III&#x27;s inscription largely at face value. Specialists have since moved to a many-causes, systems-collapse account, and popular books such as Eric Cline&#x27;s 1177 B.C. brought that to the public. The newer story is better supported, but it too can sound neater than the scattered, loosely dated evidence allows.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Between about 1225 and 1150 BCE, many palace centres of the eastern Mediterranean were destroyed or abandoned, including Pylos and Mycenae in Greece, the Hittite capital Hattusa and the port-city of Ugarit in Syria.<small>Cline 2014; Knapp and Manning 2016</small></li><li>Egyptian texts name groups from the sea: Merneptah fought Sherden, Shekelesh, Ekwesh, Lukka and Teresh alongside Libyans in his Year 5 (c. 1208 BCE); Ramesses III lists Peleset, Tjeker, Shekelesh, Denyen and Weshesh in his Year 8.<small>Wilson in Pritchard 1969; Cline 2014</small></li><li>Radiocarbon dates from the destruction layer at Tell Tweini, a harbour town of the kingdom of Ugarit, place its fall at about 1192–1190 BCE.<small>Kaniewski et al. 2011</small></li><li>Tree rings from Gordion in central Anatolia record an unusually severe three-year drought around 1198–1196 BCE (±3 years), coinciding with the end of the Hittite empire.<small>Manning et al. 2023</small></li><li>Pollen from the Sea of Galilee and from Cyprus shows a marked dry period around the end of the Late Bronze Age, driest roughly 1250–1100 BCE in the southern Levant.<small>Langgut et al. 2013; Kaniewski et al. 2013</small></li><li>Early Iron Age burials at Ashkelon, a Philistine city, show a new European-related genetic component that is absent in the Bronze Age people before them.<small>Feldman et al. 2019</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Where the Sea Peoples came from: western Anatolia, the Aegean, Cyprus, Sardinia, Sicily, or several of these at once.</li><li>Whether they were organised invaders, displaced refugees, opportunist raiders or mercenaries already inside the system.</li><li>How much of the destruction was done by people at all, rather than by earthquakes, fire or abandonment.</li><li>How closely the destructions cluster in time; several may be decades apart.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>The Sea Peoples left no texts of their own; almost everything about them comes from their enemies, above all Egyptian royal propaganda.</li><li>Their ships and camps have not been found, and wooden hulls rarely survive except in deep, calm water.</li><li>Many destruction layers were excavated before radiocarbon and careful stratigraphy, so their dates are loose.</li></ul></div></div><h3 class="sub-h wsub">How the traditions tell it</h3><div class="v4texts"><blockquote class="quote v4q"><span class="v4q-t">Egyptian royal inscription · Medinet Habu, Year 8 of Ramesses III</span><p>The foreign countries made a conspiracy in their islands. All at once the lands were removed and scattered in the fray. No land could stand before their arms, from Hatti, Qode, Carchemish, Arzawa and Alashiya on, being cut off at one time.</p><cite>trans. John A. Wilson, in J. B. Pritchard (ed.), Ancient Near Eastern Texts Relating to the Old Testament, 3rd ed. (Princeton, 1969), p. 262, as quoted in Wikipedia&#x27;s Sea Peoples article</cite></blockquote></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Most specialists now see the collapse as a systems failure with many causes. A tightly linked network of palace states depended on long-distance trade in copper, tin and grain. Drought, visible in tree rings and pollen, brought harvest failures. Earthquakes may have struck several centres. Internal revolt, the breakdown of trade and movements of people followed and fed each other. The Sea Peoples were real, and some of them fought and settled, but many scholars read them as much as a symptom of collapse as its cause.</p><ul><li>Drought is independently dated to the right decades by tree rings and pollen.</li><li>Hattusa appears to have been largely emptied before it burned, which does not look like a sudden sack.</li><li>Carchemish, listed by Ramesses III among the lands cut off, survived as a kingdom.</li><li>Egyptian victory texts are propaganda and simplify a complex enemy into one tide.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>The traditional reading, and the one Egypt wrote into stone, is that a confederation of sea-borne warriors swept through the Levant and nearly reached Egypt. Robert Drews (1993) sharpened it: new infantry tactics, running warriors with javelins and long swords, let &#x27;barbarian&#x27; fighters overwhelm the chariot armies of the palaces, and the destructions were the result. Eberhard Zangger (2016) argues that Luwian-speaking states of western Anatolia formed the Sea Peoples coalition in a region-wide war. On JRE #2368 (August 2025), Michael Button raised the collapse as a warning of how quickly advanced societies can fall, though he himself put more weight on climate driving trade breakdown and unrest.</p><ul><li>Egyptian texts under two pharaohs describe attacks by named sea-borne groups.</li><li>Destruction layers at sites such as Tell Tweini contain arrowheads and signs of fighting.</li><li>The Medinet Habu reliefs show ox-carts with women and children, a people on the move.</li><li>Ancient DNA at Ashkelon shows newcomers arriving at about the right time.</li></ul><div class="face-s"><b>Its strongest point</b><p>The people who lived through the crisis named the Sea Peoples as the enemy, repeatedly and specifically, and the newcomers left genetic and material traces in Philistine cities. Invasion is not a modern guess; it is the contemporary testimony.</p></div><p class="face-cr"><b>Credit</b> Robert Drews; Eberhard Zangger; raised by Michael Button on The Joe Rogan Experience #2368</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Precise radiocarbon series for each major destruction layer, to see whether they cluster within years or spread over decades.</li><li>Ancient DNA from more early Iron Age sites, including Sardinia, Sicily, Cyprus and western Anatolia, to trace where the newcomers came from.</li><li>The discovery and excavation of a Sea Peoples shipwreck or coastal camp.</li><li>More tree-ring and cave records across Greece and the Levant to test whether the drought was region-wide.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,157 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of The Sea Peoples and the End of the Bronze Age"><button type="button" class="wtoc-i" data-go="sea-peoples-s1">The year the lights went out</button><button type="button" class="wtoc-i" data-go="sea-peoples-s2">What is solid</button><button type="button" class="wtoc-i" data-go="sea-peoples-s3">The case for the invaders</button><button type="button" class="wtoc-i" data-go="sea-peoples-s4">Drought, earthquakes and a brittle system</button><button type="button" class="wtoc-i" data-go="sea-peoples-s5">Who were they?</button><button type="button" class="wtoc-i" data-go="sea-peoples-s6">What time has hidden</button><button type="button" class="wtoc-i" data-go="sea-peoples-s7">What would settle it</button></nav></div><section class="wsec" id="sea-peoples-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The year the lights went out</h3><p>Carved on the walls of Ramesses III&#x27;s mortuary temple at Medinet Habu, across the Nile from Luxor, is one of the most dramatic war reports of the ancient world. It tells of enemies who came from the sea and the islands, who overran one kingdom after another, and who were finally beaten on Egypt&#x27;s own borders.</p><blockquote class="quote"><p>The foreign countries made a conspiracy in their islands. All at once the lands were removed and scattered in the fray. No land could stand before their arms, from Hatti, Qode, Carchemish, Arzawa and Alashiya on, being cut off at one time.</p><cite>Medinet Habu, Year 8 of Ramesses III, trans. John A. Wilson, in Pritchard (ed.), Ancient Near Eastern Texts, 3rd ed. (Princeton, 1969), p. 262</cite></blockquote><p>Around 1200 BCE, something very like that did happen. Within a few decades, the Mycenaean palaces of Greece, the Hittite empire of Anatolia and rich port-cities such as Ugarit on the Syrian coast were destroyed or abandoned. Writing disappeared from Greece for centuries. When Michael Button sat down with Joe Rogan in August 2025, he used this moment as his prime example of how fast a sophisticated, connected world can fall.</p><blockquote class="wpull"><p>Egypt gave the collapse a villain. The harder question is whether the villain was the cause.</p></blockquote></section><section class="wsec" id="sea-peoples-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What is solid</h3><p>The Egyptian records are specific. In his Year 5, about 1208 BCE, the pharaoh Merneptah defeated a Libyan invasion that included Sherden, Shekelesh, Ekwesh, Lukka and Teresh, people &#x27;of the sea&#x27;. About thirty years later, in his Year 8, about 1177 BCE on Eric Cline&#x27;s dating, Ramesses III fought a coalition of Peleset, Tjeker, Shekelesh, Denyen and Weshesh in battles on land and in the Nile mouths. The reliefs at Medinet Habu show warriors with horned helmets and with tall headdresses, ships with bird-headed prows, and ox-carts carrying women and children.</p><p>The archives of Ugarit add a view from the victims&#x27; side. In one surviving letter, the last king, Ammurapi, wrote to the king of Alashiya, on Cyprus, that enemy ships had come, that his towns had been burned, and that his own troops and ships were away. At Tell Tweini, a harbour town of the same kingdom, radiocarbon dates from the destruction layer point to about 1192–1190 BCE, and the layer held bronze arrowheads.</p><p>The name &#x27;Sea Peoples&#x27; is modern. The French Egyptologist Gaston Maspero coined it in 1881. Of the groups, only one is securely identified: the Peleset are the Philistines, who settled on the southern coast of Canaan in cities such as Ashkelon and Ashdod.</p></section><section class="wsec" id="sea-peoples-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The case for the invaders</h3><p>The invasion story has real strengths. It is what the people who lived through the crisis said happened, under two pharaohs and in the letters of a Syrian king. Destruction layers at several sites show fire and fighting. And in 2019, ancient DNA from Ashkelon added hard evidence: people buried there in the early Iron Age carried a European-related genetic component absent in the Bronze Age population before them, and it faded within a few centuries as the newcomers mixed with locals.</p><p>Robert Drews argued in 1993 that a military revolution explains the speed of the collapse: the palace kingdoms relied on expensive chariot armies, and swarms of infantry with javelins and long swords learned to beat them. Eberhard Zangger argues that the Luwian-speaking states of western Anatolia formed the backbone of the Sea Peoples in a region-wide war. Both take the Egyptian texts seriously as history, not just propaganda.</p><figure class="wx wx--steps" id="sea-peoples-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">A world coming apart, step by step</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="g
