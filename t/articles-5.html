</g><g class="wx-st wx-hide" data-only="2"><text class="wx-t-h" x="40" y="372">2 · A dome</text><text class="wx-t" x="40" y="396">Magma pushes up from below and</text><text class="wx-t" x="40" y="413">bows the layers into a dome. New</text><text class="wx-t" x="40" y="430">dating suggests gabbros c. 230–200</text><text class="wx-t" x="40" y="447">and alkaline rocks c. 100 million years ago.</text></g><g class="wx-st wx-hide" data-only="3"><text class="wx-t-h" x="40" y="372">3 · A hollow heart</text><text class="wx-t" x="40" y="396">Hot fluids from the magma dissolve</text><text class="wx-t" x="40" y="413">limestone near the top. The summit</text><text class="wx-t" x="40" y="430">caves in, leaving a kilometre-scale</text><text class="wx-t" x="40" y="447">breccia core (Matton et al. 2005).</text></g><g class="wx-st wx-hide" data-only="4"><text class="wx-t-h" x="40" y="372">4 · Rings</text><text class="wx-t" x="40" y="396">Erosion planes off the dome. Hard</text><text class="wx-t" x="40" y="413">quartzite beds stand up as ring-shaped</text><text class="wx-t" x="40" y="430">ridges dipping outward; soft beds wear</text><text class="wx-t" x="40" y="447">into valleys. Seen from above: an eye.</text></g><text class="wx-t-s" x="400" y="372">Vertical scale exaggerated; not to scale.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 4.</b> Sandstones, limestones and quartzites are laid down in flat layers, roughly 1,000 to 450 million years ago.</p><ol class="wx-steplist"><li>Sandstones, limestones and quartzites are laid down in flat layers, roughly 1,000 to 450 million years ago.</li><li>Magma rises and bows the layers into a dome.</li><li>Hot fluids dissolve limestone at the summit, which collapses into a breccia core.</li><li>Erosion planes off the dome; hard beds stand as ring ridges, soft beds become valleys.</li></ol><figcaption>A schematic cross-section of the Richat through time: layered rocks, a magmatic dome, a collapsed summit, and erosion that carved the tilted layers into rings. <span class="wx-src">Based on: After Matton et al. (2005), Matton and Jébrak (2014) and Abdeina et al. (2024). Schematic; vertical scale exaggerated, layer thicknesses indicative only.</span></figcaption><p class="vh">A cross-section through layered rocks, about 50 km wide, with sky above and basement rock below. Step 1 shows flat layers of sandstone, quartzite and limestone. Step 2 shows the layers bowed up into a dome over an orange body of magma. Step 3 shows hot fluids rising from the magma and a dark breccia forming at the summit where limestone has dissolved and collapsed. Step 4 shows the top of the dome planed flat by erosion, with a dashed line marking the rock removed and hard quartzite beds standing up as ridges on either side of the centre, which from above form rings.</p></figure><p>Geologists Guillaume Matton, Michel Jébrak and James Lee showed in 2005 that the Richat is the eroded top of a dome. Flat layers of sandstone, limestone and quartzite, laid down between the late Proterozoic and the Ordovician, were pushed upward by magma from below. Hot fluids dissolved limestone near the summit, which collapsed into a kilometre-wide breccia. Over tens of millions of years erosion planed the dome flat. The hard quartzite beds now stand as ring-shaped ridges that dip outward, and the softer beds have become valleys. The same beds can be followed from the rings down into the ground.</p><p>This is the heart of the problem for the Atlantis claim. The rings are not built structures sitting on the landscape. They are the landscape: bedrock hundreds of millions of years old, whose shape was set long before any human existed. A city could in principle have been built inside such rings, but the rings themselves cannot be its walls and canals.</p></section><section class="wsec" id="richat-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Measuring Plato against the desert</h3><figure class="wx wx--static" id="richat-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">Same scale: the Richat Structure and Plato&#x27;s city</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Same scale: the Richat Structure and Plato&#x27;s city"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" class="wx-svg" role="img" aria-labelledby="richat-f1-t"><title id="richat-f1-t">The Richat Structure and Plato's Atlantis city drawn at the same scale</title><text class="wx-t-cap" x="24" y="28">Same scale: the Richat Structure and Plato's city</text><circle class="wx-sand wx-edge" cx="200" cy="250" r="140.0"/><circle class="wx-line wx-s6 wx-draw" pathLength="1" style="--d:2" cx="200" cy="250" r="114.8"/><circle class="wx-line wx-s6 wx-draw" pathLength="1" style="--d:3" cx="200" cy="250" r="89.6"/><circle class="wx-line wx-s6 wx-draw" pathLength="1" style="--d:1" cx="200" cy="250" r="140.0"/><circle class="wx-bold wx-s4 wx-draw" pathLength="1" style="--d:4" cx="200" cy="250" r="56.0"/><circle class="wx-bold wx-s4 wx-draw" pathLength="1" style="--d:5" cx="200" cy="250" r="21.0"/><circle class="wx-stone3 wx-o80" cx="200" cy="250" r="9.8"/><text class="wx-t-h" x="200" y="96.0" text-anchor="middle">Richat Structure</text><path class="wx-thin" d="M263.3,313.3L290,444"/><text class="wx-t wx-halo" x="28" y="456">rings of tilted hard rock (spacing schematic)</text><path class="wx-thin" d="M160.4,289.6L80,422"/><text class="wx-t wx-halo" x="28" y="436">gabbro ring dikes, 3 and 8 km from centre</text><text class="wx-t-b wx-halo" x="200" y="254" text-anchor="middle">breccia core</text><path class="wx-dim" d="M60.0,70.0H340.0M60.0,64.0V76.0M340.0,64.0V76.0"/><text class="wx-t-n wx-halo" x="200" y="66.0" text-anchor="middle">c. 40 km</text><circle class="wx-guide" cx="545" cy="250" r="82.2"/><circle class="wx-dash wx-draw" pathLength="1" style="--d:6" cx="545" cy="250" r="82.2"/><g class="wx-pop" style="--d:7"><circle class="wx-water wx-edge-soft" cx="545" cy="250" r="17.5"/><circle class="wx-green wx-edge-soft" cx="545" cy="250" r="13.6"/><circle class="wx-water wx-edge-soft" cx="545" cy="250" r="9.7"/><circle class="wx-green wx-edge-soft" cx="545" cy="250" r="7.1"/><circle class="wx-water wx-edge-soft" cx="545" cy="250" r="4.5"/><circle class="wx-stone wx-edge-soft" cx="545" cy="250" r="3.2"/></g><text class="wx-t-h" x="545" y="96.0" text-anchor="middle">Plato's city (Critias)</text><path class="wx-dim" d="M462.8,70.0H627.2M462.8,64.0V76.0M627.2,64.0V76.0"/><text class="wx-t-n wx-halo" x="545" y="66.0" text-anchor="middle">c. 23.5 km</text><text class="wx-t-m" x="545" y="159.8" text-anchor="middle">outer wall, 50 stadia out</text><path class="wx-thin" d="M555,260L607,370"/><text class="wx-t wx-halo" x="700" y="386" text-anchor="end">rings of land and water:</text><text class="wx-t-b wx-halo" x="700" y="402" text-anchor="end">27 stadia, c. 5 km across</text><path class="wx-bold" d="M40,480H110.0"/><path class="wx-line" d="M40,474V486M110.0,474V486M75.0,477V483"/><text class="wx-t-s" x="40" y="500">0</text><text class="wx-t-s" x="110.0" y="500" text-anchor="middle">10 km</text><text class="wx-t-s" x="160" y="484">Stadion taken as c. 185 m. Plato's figures from Critias 115d–117e;</text><text class="wx-t-s" x="160" y="499">Richat after Matton et al. 2005 and Matton and Jébrak 2014.</text></svg></div></div><figcaption>The Richat&#x27;s rings (left) and Plato&#x27;s ringed capital with its outer wall (right), drawn at the same scale. Plato&#x27;s rings of land and water, about 5 km across, would fit inside the Richat&#x27;s innermost gabbro ring. <span class="wx-src">Based on: Plato, Critias 115d–117e (Jowett translation), stadion taken as c. 185 m; Richat diameter and ring dikes after Matton et al. (2005) and Matton and Jébrak (2014). Spacing of the Richat&#x27;s ridge rings is schematic.</span></figcaption><p class="vh">Two circular plans side by side at the same scale, with a 10 km scale bar. On the left, the Richat Structure: a sand-coloured disc about 40 km across with concentric ridge lines, two bold red rings marking gabbro ring dikes 3 and 8 km from the centre, and a central breccia core. On the right, Plato&#x27;s city: a dashed circle about 23.5 km across for the outer wall, and at its centre a tiny set of blue and green rings, about 5 km across, representing the three rings of water and two of land around the central island.</p></figure><p>Size is the second problem. Taking a stadion as about 185 metres, Plato&#x27;s rings of land and water measure about 27 stadia across, or roughly 5 kilometres. Even his outer wall, 50 stadia beyond the largest ring, gives a circle only about 23.5 kilometres wide. The Richat is about 40 kilometres across. Supporters answer that ancient units varied, which is true, but no ordinary stadion stretches Plato&#x27;s rings to 40 kilometres.</p><p>Location is the third. Plato&#x27;s Atlantis was an island city with a canal to the sea. The Richat lies about 500 kilometres from the Atlantic, on a plateau far above sea level. Around 11,600 years ago the ocean stood tens of metres lower than today, so the coast was, if anything, farther away. The salt found in some Saharan hollows, sometimes cited as a sign of flooding by the sea, forms when groundwater and lake water evaporate in closed basins.</p><blockquote class="wpull"><p>The rings are not built structures sitting on the landscape. They are the landscape.</p></blockquote></section><section class="wsec" id="richat-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What remains open</h3><p>None of this means the Richat has no human story. Acheulean hand axes, made by early humans hundreds of thousands of years ago, lie in its wadis, and people surely returned during the wet millennia of the Green Sahara. The region has seen little systematic archaeology, and wind has stripped and mixed much of the desert surface, so a great deal of that story is probably lost or still unrecorded. A careful survey could yet find camps, hearths or rock art from the time Plato names. In 2022 the International Union of Geological Sciences named the Richat among its first 100 geological heritage sites, recognition that may help bring the patient fieldwork, geological and archaeological, that the structure deserves.</p><p>What would change the verdict is specific: worked stone walls, harbour works or canals cut across the natural rock beds, dated to around 11,600 years ago, or a source older than Plato that locates Atlantis in Africa. Until then the Eye of the Sahara is best seen as what it is: one of the most beautiful geological structures on the planet, and a vivid example of how a real wonder can become a screen for an old story.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-study" style="--i:0"><span class="wtl-y">1952 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Early French studies describe the structure; Théodore Monod records its stone tools</span></li><li class="wtl-study" style="--i:1"><span class="wtl-y">1969 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Impact-crater idea rejected: &#x27;coesite&#x27; was a misidentification</span></li><li class="wtl-study" style="--i:2"><span class="wtl-y">2005 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Matton and colleagues explain the dome and its breccia</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">2008 CE</span><span class="wtl-k">Event</span><span class="wtl-t">George Sarantitis proposes Richat as Atlantis</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">2018 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Jimmy Corsetti&#x27;s Bright Insight video popularises the idea</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">2024 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">New dating: gabbro rings c. 230–200 million years old</span></li></ol><details class="srcs"><summary>Sources for this case (12)</summary><ol><li>Plato, Timaeus and Critias, trans. B. Jowett (1892). The Dialogues of Plato, 3rd ed. Oxford University Press.</li><li>Matton G., Jébrak M., Lee J. K. W. (2005). Resolving the Richat enigma: doming and hydrothermal karstification above an alkaline complex. Geology 33(8): 665–668. <a href="https://doi.org/10.1130/G21542.1" target="_blank" rel="noopener">doi:10.1130/G21542.1</a></li><li>Matton G., Jébrak M. (2014). The &#x27;eye of Africa&#x27; (Richat dome, Mauritania): an isolated Cretaceous alkaline–hydrothermal complex. Journal of African Earth Sciences 97: 109–124. <a href="https://doi.org/10.1016/j.jafrearsci.2014.04.006" target="_blank" rel="noopener">doi:10.1016/j.jafrearsci.2014.04.006</a></li><li>Abdeina E. H., Jourdan F., Chazot G., Bertrand H., Le Gall B. (2024). How old is the Eye of Africa? A polyphase history for the igneous Richat Structure, Mauritania. Lithos 482–483: 107698. <a href="https://doi.org/10.1016/j.lithos.2024.107698" target="_blank" rel="noopener">doi:10.1016/j.lithos.2024.107698</a></li><li>Abdeina E. H., Bazin S., Chazot G. et al. (2021). Geophysical modelling of the deep structure of the Richat magmatic intrusion (northern Mauritania): insights into its kinematics of emplacement. Arabian Journal of Geosciences 14. <a href="https://doi.org/10.1007/s12517-021-08734-4" target="_blank" rel="noopener">doi:10.1007/s12517-021-08734-4</a></li><li>Dietz R. S., Fudali R., Cassidy W. (1969). Richat and Semsiyat domes (Mauritania): not astroblemes. Geological Society of America Bulletin 80(7): 1367. <a href="https://doi.org/10.1130/0016-7606(1969)80[1367:RASDMN]2.0.CO;2" target="_blank" rel="noopener">doi:10.1130/0016-7606(1969)80[1367:RASDMN]2.0.CO;2</a></li><li>Fudali R. F. (1969). Coesite from the Richat dome, Mauritania: a misidentification. Science 166(3902): 228–230. <a href="https://doi.org/10.1126/science.166.3902.228" target="_blank" rel="noopener">doi:10.1126/science.166.3902.228</a></li><li>Sao O. et al. (2008). [Sedimentary environments of the Acheulean deposits of the Akerdil and Bamouéré wadis, Richat, Mauritania] (in French; title translated). L&#x27;Anthropologie 112(1): 1–14. <a href="https://doi.org/10.1016/j.anthro.2008.01.001" target="_blank" rel="noopener">doi:10.1016/j.anthro.2008.01.001</a></li><li>Giresse P., Sao O., de Lumley H. (2012). [Palaeoenvironmental study of the Quaternary sediments of Guelb and Richat, Mauritania] (in French; title translated). L&#x27;Anthropologie 116(1): 12–38. <a href="https://doi.org/10.1016/j.anthro.2011.12.001" target="_blank" rel="noopener">doi:10.1016/j.anthro.2011.12.001</a></li><li>deMenocal P. et al. (2000). Abrupt onset and termination of the African Humid Period: rapid climate responses to gradual insolation forcing. Quaternary Science Reviews 19: 347–361. <a href="https://doi.org/10.1016/S0277-3791(99)00081-5" target="_blank" rel="noopener">doi:10.1016/S0277-3791(99)00081-5</a></li><li>IUGS International Commission on Geoheritage (2022). The First 100 IUGS Geological Heritage Sites: Richat Structure, a Cretaceous alkaline complex.</li><li>Corsetti J. Bright Insight (YouTube channel), Atlantis videos from 2018; post on X, June 2025, listing Richat&#x27;s claimed matches to Plato.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-richat" data-t="The Eye of the Sahara: Atlantis in the Desert?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Eye of the Sahara: Atlantis in the Desert?</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-richat</span> (updated 25 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-piri-reis-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Piri reis world map 01.jpg" data-cap="The surviving fragment of Piri Reis&#x27;s world map, 1513" data-big><figcaption></figcaption></figure><div class="sh-k">Mysteries of the Earth</div><h2 class="sh-t" id="case-piri-reis-st" tabindex="-1">The Piri Reis Map: Antarctica Before the Ice?</h2><p class="sh-s">An Ottoman admiral&#x27;s chart of 1513 shows a mysterious southern coast. Is it Antarctica, mapped before the ice?</p><div class="sh-v"><span class="vstamp vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><p class="sh-claim"><b>What the stamp rates:</b> The Piri Reis map shows the coast of Antarctica as it was before the ice.</p></div><p class="v4-q">Does a map from 1513 show Antarctica&#x27;s coast free of ice?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>A map drawn by an Ottoman admiral in 1513 is said to show Antarctica&#x27;s coast before the ice.</li><li>Antarctica has been under ice for about 34 million years, with an unbroken ice record of at least 800,000 years.</li><li>The map&#x27;s southern coast joins South America with no gap and sits where Patagonia should be.</li><li>Piri Reis wrote that he compiled it from about twenty older charts, including one by Columbus.</li><li>A remarkable map, but not for this reason: Antarctica before the ice is ruled out.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Geology</span><span class="thr">Climate</span><span class="thr">Texts and scripts</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="1513" >1,513</b><span class="ctr-u"> </span></div><div class="ctr-l">year the map was drawn, 21 years after Columbus&#x27;s first voyage</div><div class="ctr-c">map inscription</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="20" >20</b><span class="ctr-u"> charts</span></div><div class="ctr-l">sources Piri Reis says he used</div><div class="ctr-c">map inscription, trans. İnan 1954</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="34" >34</b><span class="ctr-u"> million years</span></div><div class="ctr-l">how long Antarctica has held ice sheets</div><div class="ctr-c">DeConto and Pollard 2003</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="1820" >1,820</b><span class="ctr-u"> </span></div><div class="ctr-l">year Antarctica&#x27;s coast was first sighted</div><div class="ctr-c">standard histories</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The Piri Reis map shows the coast of Antarctica as it was before the ice.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Antarctica has been covered by ice sheets for about 34 million years, and its ice cores hold an unbroken record of at least 800,000 years, so there was no ice-free coast in human times to map. The map&#x27;s southern coast also joins South America with no Drake Passage, and it lies where Brazil and Patagonia should be, not south of Africa where Queen Maud Land is. The 1949 survey that Hapgood relied on covered only a small part of that coast. The map is remarkable, but not for this reason.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">History of cartography treats the map as a compilation from Columbus and Portuguese sources, and on the Antarctic question the confidence is justified. Where textbooks can sound too sure is the southern coast itself: exactly which Portuguese voyages or charts fed it is still unknown, because those sources are lost. The ordinary explanation is strong, but its details are partly reconstruction.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>The map was drawn in 1513 (919 AH) by the Ottoman admiral Piri Reis on gazelle-skin parchment, about 87 × 63 cm; roughly one third of the original world map survives.<small>İnan 1954; McIntosh 2000</small></li><li>It turned up in 1929 in the Topkapı Palace in Istanbul, and in 1933 Paul Kahle identified it as partly based on a lost map by Columbus.<small>Kahle 1933</small></li><li>Piri Reis wrote on the map that he compiled it from about twenty charts and world maps, including Ptolemaic maps, an Arab map of India, four Portuguese maps and a map by Columbus.<small>Map inscription, trans. İnan 1954</small></li><li>Antarctica has carried ice sheets for about 34 million years, and its coast was first sighted by Europeans in 1820.<small>DeConto and Pollard 2003</small></li><li>The map&#x27;s southern coast runs on without a break from South America; no sea gap like the 800 km Drake Passage is shown.<small>McIntosh 2000</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Exactly which sources Piri Reis used for the southern coast, and how far south the Portuguese voyages behind them had reached by 1513.</li><li>Whether the eastward turn of the coast was forced by the shape of the parchment, as Svat Soucek suggests, or reflects a garbled source.</li><li>How closely the lost Columbus map can be reconstructed from Piri Reis&#x27;s copy of the Caribbean.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>About two thirds of the original map, including its eastern part, is lost.</li><li>The Columbus map Piri Reis says he used has never been found.</li><li>Many Portuguese charts and records of the early 1500s were secret, and much of what survived was destroyed in the Lisbon earthquake of 1755.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Historians of cartography read the map as a skilled compilation of the newest European and older Islamic and Ptolemaic sources, exactly as Piri Reis describes. Its Caribbean draws on Columbus, its South American coast on Portuguese charts. The southern coast is best read as the coast of Brazil and beyond, turned sharply east to fit the parchment or distorted by errors in the sources. Its interest lies in its sources and its date, not in lost Ice Age knowledge.</p><ul><li>Piri Reis names his sources on the map itself, and none of them is older than antiquity.</li><li>The southern coast joins South America directly, with no Drake Passage.</li><li>Queen Maud Land lies south of Africa, far to the east of where the map places its coast.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>In Maps of the Ancient Sea Kings (1966), the historian Charles Hapgood argued that the bottom coast of the Piri Reis map is Queen Maud Land in Antarctica, drawn as it looked before the ice. He cited a 1960 letter from Lt Col. Harold Ohlmeyer of the US Air Force saying the coast agreed remarkably with a 1949 seismic survey of the land under the ice. Hapgood proposed that Piri Reis&#x27;s ancient sources descended from maps made by a worldwide seafaring civilisation of the Ice Age. Graham Hancock opened Fingerprints of the Gods (1995) with the map, linking it to a lost civilisation and to a shift of the Earth&#x27;s crust.</p><ul><li>The map shows a long coast south of South America before Europeans are known to have explored it.</li><li>Piri Reis himself says some of his sources were charts drawn in the days of Alexander the Great.</li><li>Ohlmeyer&#x27;s letter compared the coast to seismic profiles of the land beneath the ice.</li></ul><div class="face-s"><b>Its strongest point</b><p>Piri Reis openly says he drew on ancient maps now lost, and his chart shows a southern coastline that no European is known to have sailed by 1513. Lost sources are a real phenomenon, so the question of what fed that coastline deserves an answer.</p></div><p class="face-cr"><b>Credit</b> Charles Hapgood; Graham Hancock; Rand and Rose Flem-Ath; earlier Erich von Däniken</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Finding the Columbus map or the Portuguese charts Piri Reis used, which would show where the southern coast came from.</li><li>A measured comparison of the map&#x27;s southern coast with the bed of Antarctica in modern datasets such as Bedmap3, done by independent cartographers.</li><li>Evidence from ice cores or seabed sediments that any part of the Queen Maud Land coast was ice-free within human times.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,130 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Piri Reis Map: Antarctica Before the Ice?"><button type="button" class="wtoc-i" data-go="piri-reis-s1">A chart in the palace library</button><button type="button" class="wtoc-i" data-go="piri-reis-s2">What Piri Reis tells us</button><button type="button" class="wtoc-i" data-go="piri-reis-s3">Hapgood&#x27;s ice-free Antarctica</button><button type="button" class="wtoc-i" data-go="piri-reis-s4">Where the idea breaks</button><button type="button" class="wtoc-i" data-go="piri-reis-s5">The historians&#x27; reading and the new maps</button><button type="button" class="wtoc-i" data-go="piri-reis-s6">A real mystery, just not that one</button></nav></div><section class="wsec" id="piri-reis-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A chart in the palace library</h3><p>In 1929, during work on the old imperial palace of Topkapı in Istanbul, a piece of painted gazelle skin came to light. It showed the Atlantic Ocean in rich colour: the coasts of Spain and West Africa on one side, the islands of the Caribbean and the long coast of South America on the other, crossed by the web of compass lines that marks a sailor&#x27;s chart. Notes in Ottoman Turkish ran across it, and it was signed by Piri Reis, an Ottoman admiral and cartographer, and dated 919 in the Islamic calendar: 1513.</p><p>That date alone made it a sensation. It was one of the earliest surviving maps to show the Americas, drawn barely two decades after Columbus. In 1933 the orientalist Paul Kahle argued in the Geographical Review that part of it was copied from a lost map by Columbus himself. Then, thirty years later, someone noticed the bottom of the map.</p><blockquote class="wpull"><p>At the bottom of the chart, the coast of South America turns and runs east, into a southern land nobody is known to have sailed by 1513.</p></blockquote></section><section class="wsec" id="piri-reis-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What Piri Reis tells us</h3><p>Unusually, the map explains itself. In one long note, Piri Reis lists his sources, and in another he tells the story of Columbus. Both were published in English in 1954 by the Turkish historian Afet İnan.</p><blockquote class="quote"><p>From about twenty charts and Mappae Mundi ... from eight Jaferiyes of that kind and one Arabic map of Hind, and from the maps just drawn by four Portuguese which show the countries of Hind, Sind and China geometrically drawn, and also from a map drawn by Colombo in the western region I have extracted it.</p><cite>Piri Reis map, inscription VI, trans. Afet İnan, The Oldest Map of America (Ankara, 1954)</cite></blockquote><p>The Jaferiyes are generally taken to be maps from Ptolemy&#x27;s Geography. Of his world maps, Piri Reis says they were &quot;drawn in the days of Alexander, Lord of the Two Horns&quot;, the title by which Alexander the Great was known in Islamic tradition. Near the southern coast he adds a note that reads more like a sailor&#x27;s rumour than a survey: &quot;This country is a waste. Everything is in ruin and it is said that large snakes are found here.&quot; He was a working navigator combining everything he could get, new and old.</p></section><section class="wsec" id="piri-reis-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Hapgood&#x27;s ice-free Antarctica</h3><p>In the late 1950s Charles Hapgood, a history teacher at Keene State College in New Hampshire, set his students to study old maps. In Maps of the Ancient Sea Kings (1966) he argued that the coast along the bottom of the Piri Reis map is not South America at all but Queen Maud Land in Antarctica, drawn as it looked before the ice. Ancient sources, he proposed, preserved surveys made by a seafaring civilisation of the Ice Age, whose maps were copied and recopied until they reached Piri Reis.</p><p>His strongest exhibit was a letter of 1960 from Lt Col. Harold Ohlmeyer of the US Air Force reconnaissance wing, who wrote that the lower part of the map agreed very remarkably with the results of the seismic profile made across the ice cap by the Norwegian-British-Swedish Antarctic Expedition of 1949. Hapgood also argued that the Earth&#x27;s crust had slipped, carrying Antarctica into the polar cold relatively recently. Erich von Däniken borrowed the map for ancient astronauts, and in 1995 Graham Hancock opened Fingerprints of the Gods with it, as the first clue to a lost civilisation destroyed at the end of the Ice Age.</p><figure class="wx wx--steps" id="piri-reis-f1" data-n="4"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">Reading the southern coast</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Reading the southern coast"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" class="wx-svg" role="img" aria-labelledby="piri-reis-f1-t"><title id="piri-reis-f1-t">Reading the southern coast of the Piri Reis map: Hapgood's Antarctica versus a bent South America</title><text class="wx-t-cap" x="24" y="28">The surviving fragment of 1513 · schematic, not traced</text><defs><clipPath id="piri-reis-f1-clip"><path d="M60,50H356L348,120L362,200L350,300L360,400L352,490H60Z"/></clipPath></defs><path class="wx-paper wx-edge" d="M60,50H356L348,120L362,200L350,300L360,400L352,490H60Z"/><path class="wx-sand wx-o60" d="M60,50H356L348,120L362,200L350,300L360,400L352,490H60Z"/><g clip-path="url(#piri-reis-f1-clip)"><path class="wx-guide" d="M230,250L630.0,250.0"/><path class="wx-guide" d="M230,250L600.9,399.8"/><path class="wx-guide" d="M230,250L517.7,527.9"/><path class="wx-guide" d="M230,250L392.7,615.4"/><path class="wx-guide" d="M230,250L244.0,649.8"/><path class="wx-guide" d="M230,250L93.2,625.9"/><path class="wx-guide" d="M230,250L-37.7,547.3"/><path class="wx-guide" d="M230,250L-129.5,425.3"/><path class="wx-guide" d="M230,250L-169.0,277.9"/><path class="wx-guide" d="M230,250L-150.4,126.4"/><path class="wx-guide" d="M230,250L-76.4,-7.1"/><path class="wx-guide" d="M230,250L42.2,-103.2"/><path class="wx-guide" d="M230,250L188.2,-147.8"/><path class="wx-guide" d="M230,250L340.3,-134.5"/><path class="wx-guide" d="M230,250L476.3,-65.2"/><path class="wx-guide" d="M230,250L576.4,50.0"/><path class="wx-guide" d="M230,250L626.1,194.3"/><path class="wx-guide" d="M120,410L520.0,410.0"/><path class="wx-guide" d="M120,410L490.9,559.8"/><path class="wx-guide" d="M120,410L407.7,687.9"/><path class="wx-guide" d="M120,410L282.7,775.4"/><path class="wx-guide" d="M120,410L134.0,809.8"/><path class="wx-guide" d="M120,410L-16.8,785.9"/><path class="wx-guide" d="M120,410L-147.7,707.3"/><path class="wx-guide" d="M120,410L-239.5,585.3"/><path class="wx-guide" d="M120,410L-279.0,437.9"/><path class="wx-guide" d="M120,410L-260.4,286.4"/><path class="wx-guide" d="M120,410L-186.4,152.9"/><path class="wx-guide" d="M120,410L-67.8,56.8"/><path class="wx-guide" d="M120,410L78.2,12.2"/><path class="wx-guide" d="M120,410L230.3,25.5"/><path class="wx-guide" d="M120,410L366.3,94.8"/><path class="wx-guide" d="M120,410L466.4,210.0"/><path class="wx-guide" d="M120,410L516.1,354.3"/></g><path class="wx-stone wx-edge" d="M356,50L300,52C292,70 298,90 290,104C300,112 296,124 306,132C300,160 288,190 292,220C300,250 320,270 334,290L350,300L362,200L348,120Z"/><text class="wx-t-s wx-halo" x="312" y="80" text-anchor="middle">Iberia</text><text class="wx-t-s wx-halo" x="322" y="210" text-anchor="middle">Africa</text><ellipse class="wx-stone wx-edge" cx="110" cy="118" rx="28" ry="10" transform="rotate(-8 110 118)"/><ellipse class="wx-stone wx-edge" cx="152" cy="140" rx="16" ry="7"/><ellipse class="wx-stone wx-edge" cx="82" cy="92" rx="18" ry="6"/><text class="wx-t-s wx-halo" x="120" y="166" text-anchor="middle">Caribbean islands</text><path class="wx-stone2 wx-edge" d="M60,200C90,205 120,215 140,235C160,258 170,285 166,310C160,340 150,360 160,385C172,410 205,425 245,430C285,436 320,440 352,446L352,490H60Z"/><text class="wx-t-b wx-halo" x="96" y="300">South America</text><path class="wx-hl wx-draw" pathLength="1" style="--d:1" d="M160,385C172,410 205,425 245,430C285,436 320,440 352,446"/><text class="wx-t-b wx-halo" x="214" y="470">the southern coast</text><text class="wx-t-s" x="60" y="512">Parchment c. 87 × 63 cm; about one third of the original world map survives.</text><g class="wx-st wx-hide" data-only="2"><text class="wx-t-b wx-t-a wx-halo" x="200" y="410">"Queen Maud Land"</text></g><g class="wx-st wx-hide" data-only="3"><path class="wx-hl wx-s4" d="M150,372L182,404"/><path class="wx-hl wx-s4" d="M182,372L150,404"/><text class="wx-t-b wx-halo" x="192" y="396">no sea gap here</text></g><g class="wx-st wx-hide" data-only="4"><path class="wx-dash" d="M160,385C150,420 150,450 148,490"/><path class="wx-line wx-s2" d="M160,392C175,408 190,416 208,420" /><text class="wx-t-b wx-halo" x="214" y="410">coast turned east</text><text class="wx-t-s wx-halo" x="92" y="440">real line</text></g><g class="wx-st wx-hide" data-s="3"><rect class="wx-water wx-o60" x="440" y="300" width="260" height="175"/><polygon class="wx-stone2 wx-edge" points="530.0,300.0 524.0,309.0 514.0,324.0 504.0,342.0 496.0,354.0 484.0,366.0 478.0,381.0 474.0,396.0 475.4,407.7 460.0,396.0 462.0,375.0 463.0,354.0 467.0,330.0 469.6,300.0"/><polygon class="wx-stone wx-edge" points="634.0,300.0 641.0,324.0 647.0,343.2 650.0,344.4 664.0,339.0 674.0,327.0 676.0,315.0 680.0,300.0"/><clipPath id="piri-reis-f1-ic"><rect x="440" y="300" width="260" height="175"/></clipPath><g clip-path="url(#piri-reis-f1-ic)"><polygon class="wx-ice wx-edge" points="496.0,429.6 482.0,438.0 470.0,450.0 454.0,459.0 440.0,465.0 440.0,510.0 700.0,510.0 700.0,441.0 680.0,445.5 650.0,448.5 620.0,450.0 590.0,453.0 554.0,465.0 530.0,474.0 506.0,471.0 490.0,456.0 488.0,444.0 493.0,433.5"/></g><path class="wx-hl" d="M620.0,450.0 L650.0,448.5 L680.0,445.5 L700.0,441.0"/><text class="wx-t-s wx-halo" x="640.0" y="442.0" text-anchor="middle">Queen Maud Land</text><text class="wx-t-s wx-halo" x="498.0" y="424.0">Drake Passage, c. 800 km</text><text class="wx-t-s wx-halo" x="490.0" y="330.0" text-anchor="middle">S. America</text><text class="wx-t-s wx-halo" x="658.0" y="312.0" text-anchor="middle">Africa</text><rect class="wx-line" x="440" y="300" width="260" height="175"/><text class="wx-t-cap" x="440" y="292">The real south Atlantic</text></g><g class="wx-st wx-hide" data-only="1"><text class="wx-t-h" x="440" y="70">1 · A chart of 1513</text><text class="wx-t" x="440" y="94">Piri Reis drew the Atlantic on</text><text class="wx-t" x="440" y="111">gazelle-skin parchment: Spain and</text><text class="wx-t" x="440" y="128">Africa on the right, the Caribbean</text><text class="wx-t" x="440" y="145">and South America on the left.</text><text class="wx-t" x="440" y="162">Along the bottom, a coast runs east.</text></g><g class="wx-st wx-hide" data-only="2"><text class="wx-t-h" x="440" y="70">2 · Hapgood's reading</text><text class="wx-t" x="440" y="94">In 1966 Charles Hapgood argued</text><text class="wx-t" x="440" y="111">that the bottom coast is Queen Maud</text><text class="wx-t" x="440" y="128">Land in Antarctica, mapped by an</text><text class="wx-t" x="440" y="145">ancient seafaring people before the</text><text class="wx-t" x="440" y="162">ice covered it.</text></g><g class="wx-st wx-hide" data-only="3"><text class="wx-t-h" x="440" y="70">3 · The problems</text><text class="wx-t" x="440" y="94">On the chart the coast runs straight</text><text class="wx-t" x="440" y="111">on from South America. On a globe,</text><text class="wx-t" x="440" y="128">800 km of open sea separate them, and</text><text class="wx-t" x="440" y="145">Queen Maud Land lies south of Africa.</text><text class="wx-t" x="440" y="162">Antarctica has held ice sheets for</text><text class="wx-t" x="440" y="179">over 30 million years.</text></g><g class="wx-st wx-hide" data-only="4"><text class="wx-t-h" x="440" y="70">4 · The historians' reading</text><text class="wx-t" x="440" y="94">Short of parchment, the mapmaker</text><text class="wx-t" x="440" y="111">probably turned the coast of Brazil</text><text class="wx-t" x="440" y="128">east (Soucek), compiling it from</text><text class="wx-t" x="440" y="145">Portuguese charts of recent voyages.</text><text class="wx-t" x="440" y="162">Mapmakers often did this.</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 4.</b> The surviving fragment of 1513: Atlantic coasts, the Caribbean and South America, with a coast running east along the bottom.</p><ol class="wx-steplist"><li>The surviving fragment of 1513: Atlantic coasts, the Caribbean and South America, with a coast running east along the bottom.</li><li>Hapgood&#x27;s reading: the bottom coast is Queen Maud Land, Antarctica, mapped before the ice.</li><li>The problems: no Drake Passage on the chart, and Queen Maud Land actually lies south of Africa.</li><li>The historians&#x27; reading: the coast of Brazil turned east to fit the parchment, compiled from Portuguese charts.</li></ol><figcaption>A schematic of the surviving fragment and the two rival readings of its southern coast, compared with the real geography of the South Atlantic. <span class="wx-src">Based on: Schematic after the Topkapı map as described by İnan (1954) and McIntosh (2000); readings after Hapgood (1966) and Soucek; inset geography simplified. Not a tracing of the map.</span></figcaption><p class="vh">On the left, a schematic of the Piri Reis map fragment: a tall parchment with compass lines, Iberia and Africa along the right edge, Caribbean islands at upper left and South America on the left whose coast bends east along the bottom, highlighted as the southern coast. Step 1 introduces the chart. Step 2 labels the bottom coast Queen Maud Land, Hapgood&#x27;s reading. Step 3 marks the join with South America with a red cross and shows an inset of the real South Atlantic: South America, Africa, and Antarctica with the Drake Passage of about 800 km and Queen Maud Land highlighted south of Africa. Step 4 shows a dashed line continuing the coast south, and the drawn coast turned east, the historians&#x27; reading.</p></figure></section><section class="wsec" id="piri-reis-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Where the idea breaks</h3><p>The first problem is on the map itself. Its southern coast runs on from South America without a break. In reality, some 800 kilometres of stormy sea, the Drake Passage, separate the tip of South America from Antarctica. And Queen Maud Land lies south of Africa, thousands of kilometres east of where the map puts its coast. To make the match, Hapgood had to assume that the source had drifted and been redrawn in complex ways.</p><p>The second problem is the ice. Antarctica began growing ice sheets about 34 million years ago, as carbon dioxide in the atmosphere fell, and the East Antarctic sheet that covers Queen Maud Land has persisted, with fluctuations, for millions of years. The geologist Paul Heinrich pointed out that Hapgood confused the shape of the rock beneath the ice with an ice-free coastline, ignored the way land rebounds when ice melts, and relied on a 1949 survey that measured only a small part of the area he compared.</p><figure class="wx wx--static" id="piri-reis-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">How long has Antarctica been icy?</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How long has Antarctica been icy?"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" class="wx-svg" role="img" aria-labelledby="piri-reis-f2-t"><title id="piri-reis-f2-t">How long Antarctica has been icy compared with human history and the Piri Reis map</title><text class="wx-t-cap" x="24" y="28">Years before today · each step is ten times longer</text><rect class="wx-ice wx-edge-soft wx-growx" style="--d:1" x="70" y="116" width="550.5" height="34"/><text class="wx-t-b wx-halo" x="612.5" y="138" text-anchor="end">Antarctic ice sheets, c. 34 million years</text><path class="wx-line" d="M70,150H660"/><path class="wx-thin" d="M70.0,150V144"/><text class="wx-t-s" x="70.0" y="110" text-anchor="middle">10</text><path class="wx-thin" d="M154.3,150V144"/><text class="wx-t-s" x="154.3" y="110" text-anchor="middle">100</text><path class="wx-thin" d="M238.6,150V144"/><text class="wx-t-s" x="238.6" y="110" text-anchor="middle">1,000</text><path class="wx-thin" d="M322.9,150V144"/><text class="wx-t-s" x="322.9" y="110" text-anchor="middle">10,000</text><path class="wx-thin" d="M407.1,150V144"/><text class="wx-t-s" x="407.1" y="110" text-anchor="middle">100,000</text><path class="wx-thin" d="M491.4,150V144"/><text class="wx-t-s" x="491.4" y="110" text-anchor="middle">1 million</text><path class="wx-thin" d="M575.7,150V144"/><text class="wx-t-s" x="575.7" y="110" text-anchor="middle">10 million</text><path class="wx-thin" d="M660.0,150V144"/><text class="wx-t-s" x="660.0" y="110" text-anchor="middle">100 million</text><g class="wx-pop" style="--d:4"><circle class="wx-accfill" cx="180.7" cy="150" r="4.5"/><path class="wx-thin" d="M180.7,154V184"/><text class="wx-t wx-halo" x="174.7" y="180" text-anchor="end">First sighted, 1820</text></g><g class="wx-pop" style="--d:5"><circle class="wx-accfill" cx="214.1" cy="150" r="4.5"/><path class="wx-thin" d="M214.1,154V206"/><text class="wx-t wx-halo" x="208.1" y="202" text-anchor="end">Piri Reis map, 1513</text></g><g class="wx-pop" style="--d:6"><circle class="wx-accfill" cx="298.9" cy="150" r="4.5"/><path class="wx-thin" d="M298.9,154V228"/><text class="wx-t wx-halo" x="292.9" y="224" text-anchor="end">Earliest writing, c. 5,200 years</text></g><g class="wx-pop" style="--d:7"><circle class="wx-accfill" cx="328.6" cy="150" r="4.5"/><path class="wx-thin" d="M328.6,154V250"/><text class="wx-t wx-halo" x="322.6" y="246" text-anchor="end">End of the last ice age, c. 11,700</text></g><g class="wx-pop" style="--d:8"><circle class="wx-accfill" cx="447.4" cy="150" r="4.5"/><path class="wx-thin" d="M447.4,154V272"/><text class="wx-t wx-halo" x="441.4" y="268" text-anchor="end">Homo sapiens, c. 300,000 years</text></g><g class="wx-pop" style="--d:9"><circle class="wx-accfill" cx="483.3" cy="150" r="4.5"/><path class="wx-thin" d="M483.3,154V294"/><text class="wx-t wx-halo" x="477.3" y="290" text-anchor="end">Oldest continuous ice core, c. 800,000</text></g><text class="wx-t-s" x="70" y="316">Ice-sheet onset after DeConto and Pollard (2003); ice-core record after EPICA (2004). Log scale.</text></svg></div></div><figcaption>On a logarithmic time scale, the whole of human history, and the date of the map, sit deep inside the age of Antarctica&#x27;s ice sheets. <span class="wx-src">Based on: Ice-sheet onset after DeConto and Pollard (2003); ice-core span after EPICA community members (2004); other dates standard.</span></figcaption><p class="vh">A horizontal logarithmic timeline from 10 to 100 million years ago. A long pale blue bar labelled Antarctic ice sheets runs from the present back to about 34 million years. Markers along the axis show the Piri Reis map in 1513, Antarctica first sighted in 1820, the earliest writing about 5,200 years ago, the end of the last ice age about 11,700 years ago, Homo sapiens about 300,000 years ago, and the oldest continuous ice core, about 800,000 years.</p></figure><aside class="wcall"><b>How do we know?</b><p>Ice sheets keep their own diaries. Each year&#x27;s snow is squeezed into a layer of ice that traps air and dust. The European EPICA core from Dome C in East Antarctica reaches back about 800,000 years without a break, through eight ice-age cycles. Marine sediments around the continent, full of ice-carried debris, extend the story back tens of millions of years. There is no gap in human times when the coast lay open.</p></aside></section><section class="wsec" id="piri-reis-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The historians&#x27; reading and the new maps</h3><p>In his 2000 study The Piri Reis Map of 1513, Gregory McIntosh concluded that the map is a fine piece of Renaissance compilation but not a uniquely accurate one; later charts by Diogo Ribeiro and others are more accurate. The historian of Ottoman cartography Svat Soucek observed that the edge of the parchment curves where South America is drawn, and that &quot;it was not unusual for cartographers to adjust the orientation of a coastline to fit the surface available&quot;. On this reading the southern coast is the coast of Brazil and beyond, bent east and perhaps garbled from Portuguese reports of voyages that are poorly recorded today.</p><aside class="wcall"><b>Fresh from the field</b><p>In March 2025 the British Antarctic Survey and partners published Bedmap3, the most detailed map yet of the land beneath Antarctica&#x27;s ice. It combines six decades of surveys, including 84 new aero-geophysical campaigns and 52 million new data points, on a 500-metre grid. The ice holds about 27 million cubic kilometres, enough to raise sea level by about 58 metres. Anyone can now compare an old chart with the buried coast; no published study has reported a match with the Piri Reis map.</p></aside><p>Satellite ice mapping and radar sounding make one more point clear: much of Antarctica&#x27;s rock bed lies below sea level, pressed down by the ice. Without its ice the continent&#x27;s coast would look quite different from today&#x27;s ice edge, and different again after centuries of rebound. Any honest comparison would need that moving target, which Hapgood did not have.</p></section><section class="wsec" id="piri-reis-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>A real mystery, just not that one</h3><p>The Piri Reis map still holds genuine puzzles. Two thirds of it are lost. The Columbus map it copies has never been found, and many Portuguese charts of the period were state secrets, and much of what survived burned or collapsed in the Lisbon earthquake of 1755. How far south the sources for the lower coast had really sailed, and whose voyages they recorded, remains unclear.</p><p>What would reopen the Antarctic question is specific: a surviving source chart showing the same coast with an older pedigree, or ice and seabed records showing Queen Maud Land free of ice within the last few thousand years. What the evidence shows instead is a chart that is marvellous in its own right, a window into the moment when Ottoman, Arab, Greek and European knowledge of the world were being stitched together on one skin.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">1492 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Columbus crosses the Atlantic</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">1513 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Piri Reis compiles his world map</span></li><li class="wtl-build" style="--i:2"><span class="wtl-y">1521 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Piri Reis completes the Kitab-ı Bahriye, his book of the sea</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">1820 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Antarctica first sighted</span></li><li class="wtl-find" style="--i:4"><span class="wtl-y">1929 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Map rediscovered in Topkapı Palace</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1966 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Hapgood&#x27;s Maps of the Ancient Sea Kings</span></li><li class="wtl-event" style="--i:6"><span class="wtl-y">1995 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Hancock&#x27;s Fingerprints of the Gods opens with the map</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2000 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Gregory McIntosh&#x27;s full study of the map</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2025 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Bedmap3 maps the land beneath Antarctica&#x27;s ice</span></li></ol><details class="srcs"><summary>Sources for this case (10)</summary><ol><li>Kahle P. (1933). A lost ma
