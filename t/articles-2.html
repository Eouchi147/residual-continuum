4 L660.4,135.5 Z" class="wx-card wx-dash"/><circle cx="650" cy="113.9" r="21.2" class="wx-card wx-dash"/></g><text x="650" y="462" text-anchor="middle" class="wx-t-b">Goliath</text><text x="650" y="478" text-anchor="middle" class="wx-t-n">c. 2.9 m</text><text x="650" y="493" text-anchor="middle" class="wx-t-s">6 cubits + span</text><line x1="478" y1="92" x2="478" y2="500" class="wx-dash"/><text x="270" y="92" text-anchor="middle" class="wx-t-cap">Bones</text><text x="600" y="92" text-anchor="middle" class="wx-t-cap">Texts</text><path d="M275,186 L275,178 L450,178 L450,186" class="wx-hl wx-draw" pathLength="1" style="--d:6"/><text x="362" y="156" text-anchor="middle" class="wx-t-b wx-t-a wx-halo">Denisovan by proteins</text><text x="362" y="170" text-anchor="middle" class="wx-t-s wx-halo">two dredged leg bones, 2026 preprint</text><text x="545" y="174" text-anchor="middle" class="wx-t-s wx-halo">Septuagint and</text><text x="545" y="188" text-anchor="middle" class="wx-t-s wx-halo">a Dead Sea Scroll</text><text x="594" y="132" text-anchor="end" class="wx-t-s wx-halo">Masoretic</text><text x="594" y="146" text-anchor="end" class="wx-t-s wx-halo">Hebrew text</text><text x="24" y="524" class="wx-t-m">Cubit taken as c. 44.5 cm and span as c. 22 cm; text heights are not measurements.</text></svg></div></div><figcaption>Stature estimates from bones, beside the two textual traditions for Goliath&#x27;s height, all drawn to the same scale. <span class="wx-src">Based on: Kaifu et al. 2026 (bioRxiv preprint) for Penghu 2 and 3; Rosenberg, Zuné and Ruff 2006 for Jinniushan; cubit taken as c. 44.5 cm and span as c. 22 cm for the text heights. Silhouettes schematic; heights to scale at 120 px per metre.</span></figcaption><p class="vh">Six human silhouettes standing on one ground line, with a scale bar from 0 to 3 metres. Under the heading Bones: a reference person of 1.70 m; the Jinniushan female, a possible relative, about 1.69 m; Penghu 2, estimated from a femur, about 1.80 m; and Penghu 3, estimated from a tibia, about 1.90 m. A bracket over the two Penghu figures reads Denisovan by proteins, two dredged leg bones, 2026 preprint. Under the heading Texts, two dashed outlines: Goliath in the Septuagint and a Dead Sea Scroll, four cubits and a span, about 2.0 m, and Goliath in the Masoretic Hebrew text, six cubits and a span, about 2.9 m.</p></figure><aside class="wcall"><b>Fresh from the field</b><p>The August 2026 preprint by Kaifu, Chang, Tsutaya and colleagues recovered 1,856 and 3,283 amino acid residues from the femur and tibia, each with a collagen variant (COL1A2 R996K) specific to Denisovans. It reports radiocarbon ages of about 45,000–43,000 years for three Penghu fossils, including the tibia. The team compares the two individuals with the largest Pleistocene humans from Africa and Europe, and with East Asian Homo erectus some 20–30 cm shorter. The paper has not yet completed peer review.</p></aside></section><section class="wsec" id="denisovan-giants-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The mainstream reading: big, probably</h3><p>Specialists welcomed the leg bones and urged caution in the same breath. Sally Reynolds of Bournemouth University pointed out that the analysis rests on two incomplete bones, dredged from the seabed with no record of where or in what layer they lay, and that we cannot tell whether the two people lived at the same time. Inferring a trait for a whole people from two individuals is hard, she wrote, and stature estimates have gone wrong before: different assumptions gave very different heights for Nariokotome Boy, the famous Homo erectus youth from Kenya.</p><p>There is a subtler point. Big teeth and big skulls do not automatically mean big bodies. Tooth size tracks diet, and a massive skull in a cold northern place such as Harbin may reflect climate and muscle as much as height. Radiocarbon ages close to 45,000 years also sit near the limit of the method, where small amounts of modern contamination make bones look younger than they are. None of this makes the Penghu figures wrong. It makes them a first measurement, not an average.</p><p>What the mainstream does not dispute is the pattern: no adult Denisovan bone identified so far points to a small body. If the preprint holds up, Denisovans join Neanderthals as heavily built people, and the tall end of the Ice Age human range gains a new member.</p></section><section class="wsec" id="denisovan-giants-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The challenger&#x27;s case at its strongest</h3><p>Michael Button&#x27;s wider argument, made on The Joe Rogan Experience in August 2025 and again in August 2026, is that human capability and human diversity both run far deeper than the textbook timeline. He points to the 2025 reconstruction of the Yunxian skull from central China, about a million years old, whose authors placed it near the root of the lineage leading to Homo longi and the Denisovans and argued that this lineage separated from ours more than a million years ago. That timing is still debated, but it is a peer-reviewed result, not a fringe one.</p><p>On size, Button is ahead of the evidence but pointing the right way. For decades, Chinese fossils such as Harbin, Dali and Jinniushan were filed as awkward archaic humans and largely ignored in the West. A skull spent some eighty-five years hidden in a well. Only proteins and ancient DNA forced the rethink, and each new identification has added a large, robust individual. His strongest point is that consistency: in a record of only a dozen or so bones, not one adult bone says small.</p><blockquote class="wpull"><p>The challengers ask a fair question: if a whole people stayed hidden until 2010, how sure should we be about their shape?</p></blockquote></section><section class="wsec" id="denisovan-giants-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Giants in the old texts</h3><p>The link to giants comes mainly from two passages in the Hebrew Bible. The first describes the Nephilim, a word of uncertain meaning that ancient Greek translators rendered as gigantes and the King James Version as giants.</p><blockquote class="quote"><p>The Nephilim were on the earth in those days ... These were the heroes that were of old, warriors of renown.</p><cite>Genesis 6:4, New Revised Standard Version Updated Edition (2021)</cite></blockquote><p>The second is the report of the spies sent into Canaan, who say they saw the Nephilim there:</p><blockquote class="quote"><p>There we saw the Nephilim (the Anakites come from the Nephilim), and to ourselves we seemed like grasshoppers, and so we seemed to them.</p><cite>Numbers 13:33, New Revised Standard Version Updated Edition (2021)</cite></blockquote><p>What these passages mean is for readers and their traditions, and this case does not judge it. The physical claim can be tested. Goliath, the best-known giant, is six cubits and a span tall in the Masoretic Hebrew text, about 2.9 m, but four cubits and a span in the Septuagint and a Dead Sea Scroll, about 2.0 m. The tallest Denisovan estimate so far is about 1.9 m. No Denisovan bone or gene has been found in the Near East, and the latest known Denisovans lived around 40,000 years before these texts were written. A tall archaic human is a remarkable thing, but on the evidence it is not the same thing as the giants of legend.</p></section><section class="wsec" id="denisovan-giants-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What time has hidden, and what would settle it</h3><p>Almost every Denisovan fossil arrived by luck: a finger in a Siberian cave, a jaw kept by a monk, a skull hidden in a well, bones in a fishing net. Much of their world, from the tropics of South-East Asia to the drowned plains of the Sunda shelf, destroys bone and DNA or lies under the sea. The first complete Denisovan skeleton, from a dated cave layer, would answer the size question at a stroke. Until then, replication of the Penghu results and protein screening of the many unidentified limb bones in Asian collections are the quickest routes to a real average.</p><p>The verdict for now: Denisovans were big, robust people, and plausibly tall. As for giants, the bones point to people like the tallest of us, not to the giants of legend.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-find" style="--i:0"><span class="wtl-y">1933 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Harbin skull reportedly found and hidden in a well</span></li><li class="wtl-find" style="--i:1"><span class="wtl-y">1984 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Jinniushan skeleton excavated in north-east China</span></li><li class="wtl-find" style="--i:2"><span class="wtl-y">2008 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Finger bone found in Denisova Cave</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">2010 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Denisovan genome published</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">2014 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Tibetan altitude gene traced to Denisovans</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">2019 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Xiahe jaw identified by proteins</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2025 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Penghu jaw and Harbin skull identified as Denisovan</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2026 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Preprint: Denisovan femur and tibia from Penghu</span></li></ol><details class="srcs"><summary>Sources for this case (16)</summary><ol><li>Reich, D. et al. (2010). Genetic history of an archaic hominin group from Denisova Cave in Siberia. Nature 468: 1053–1060. <a href="https://doi.org/10.1038/nature09710" target="_blank" rel="noopener">doi:10.1038/nature09710</a></li><li>Sawyer, S. et al. (2015). Nuclear and mitochondrial DNA sequences from two Denisovan individuals. PNAS 112: 15696–15700. <a href="https://doi.org/10.1073/pnas.1519905112" target="_blank" rel="noopener">doi:10.1073/pnas.1519905112</a></li><li>Chen, F. et al. (2019). A late Middle Pleistocene Denisovan mandible from the Tibetan Plateau. Nature 569: 409–412. <a href="https://doi.org/10.1038/s41586-019-1139-x" target="_blank" rel="noopener">doi:10.1038/s41586-019-1139-x</a></li><li>Xia, H. et al. (2024). Middle and Late Pleistocene Denisovan subsistence at Baishiya Karst Cave. Nature 632: 108–113. <a href="https://doi.org/10.1038/s41586-024-07612-9" target="_blank" rel="noopener">doi:10.1038/s41586-024-07612-9</a></li><li>Chang, C.-H. et al. (2015). The first archaic Homo from Taiwan. Nature Communications 6: 6037. <a href="https://doi.org/10.1038/ncomms7037" target="_blank" rel="noopener">doi:10.1038/ncomms7037</a></li><li>Tsutaya, T. et al. (2025). A male Denisovan mandible from Pleistocene Taiwan. Science 388: 176–180. <a href="https://doi.org/10.1126/science.ads3888" target="_blank" rel="noopener">doi:10.1126/science.ads3888</a></li><li>Fu, Q. et al. (2025). Ancient proteome of the Harbin cranium (title abbreviated). Science 389: 704–707. <a href="https://doi.org/10.1126/science.adu9677" target="_blank" rel="noopener">doi:10.1126/science.adu9677</a></li><li>Fu, Q. et al. (2025). Denisovan mitochondrial DNA from dental calculus of the &gt;146,000-year-old Harbin cranium. Cell 188: 3919–3926. <a href="https://doi.org/10.1016/j.cell.2025.05.040" target="_blank" rel="noopener">doi:10.1016/j.cell.2025.05.040</a></li><li>Ji, Q. et al. (2021). Late Middle Pleistocene Harbin cranium represents a new Homo species. The Innovation 2: 100132. <a href="https://doi.org/10.1016/j.xinn.2021.100132" target="_blank" rel="noopener">doi:10.1016/j.xinn.2021.100132</a></li><li>Feng, X. et al. (2025). The phylogenetic position of the Yunxian cranium elucidates the origin of Homo longi and the Denisovans. Science 389: 1320–1324.</li><li>Kaifu, Y., Chang, C.-H., Tarusawa, Y., Sawafuji, R., Yonemoto, S., Shimamura, S., Takai, M., Kono, R. T., Sun, C.-H., Tsai, C.-H., Yoneda, M. &amp; Tsutaya, T. (2026). Denisovan leg bones from Taiwan reveal large body size. bioRxiv preprint, posted August 2026. <a href="https://doi.org/10.64898/2026.08.07.743438" target="_blank" rel="noopener">doi:10.64898/2026.08.07.743438</a></li><li>Reynolds, S. C. (2026). Were Denisovans tall compared to other ancient humans? We should be skeptical. The Conversation, republished by Phys.org, August 2026.</li><li>Rosenberg, K. R., Zuné, L. &amp; Ruff, C. B. (2006). Body size, body proportions, and encephalization in a Middle Pleistocene archaic human from northern China. PNAS 103: 3552–3556. <a href="https://doi.org/10.1073/pnas.0508681103" target="_blank" rel="noopener">doi:10.1073/pnas.0508681103</a></li><li>Huerta-Sánchez, E. et al. (2014). Altitude adaptation in Tibetans caused by introgression of Denisovan-like DNA. Nature 512: 194–197. <a href="https://doi.org/10.1038/nature13408" target="_blank" rel="noopener">doi:10.1038/nature13408</a></li><li>The Joe Rogan Experience #2546, Michael Button (August 2026); #2368, Michael Button (August 2025).</li><li>The Holy Bible, New Revised Standard Version Updated Edition (2021). Genesis 6:4; Numbers 13:33.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-denisovan-giants" data-t="Denisovan Giants: How Big Were the Lost Humans?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Denisovan Giants: How Big Were the Lost Humans?</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-denisovan-giants</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-cart-ruts-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Malta - Siggiewi - Misrah Ghar il-Kbir - cart ruts 07 ies.jpg" data-cap="Cart ruts at Misraħ Għar il-Kbir, Malta" data-big><figcaption></figcaption></figure><div class="sh-k">Skills Older Than We Thought</div><h2 class="sh-t" id="case-cart-ruts-st" tabindex="-1">The Cart Ruts: Railway Lines Cut in Stone</h2><p class="sh-s">Paired grooves up to 60 cm deep cross Malta&#x27;s bare limestone, run off cliffs and slide into the sea. Nobody can date them.</p><div class="sh-v"><span class="vstamp vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><p class="sh-claim"><b>What the stamp rates:</b> The cart ruts were made in the Ice Age or earlier, long before the Bronze Age and before any known society in Malta or Anatolia.</p></div><p class="v4-q">How old are the cart ruts, and could they be older than any known civilisation?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Hundreds of paired grooves are cut into the rock of Malta, like railway lines in stone.</li><li>Some say they are from the Ice Age or earlier.</li><li>But nobody lived on Malta before about 8,500 years ago, and wheeled carts appear only around 3500 BCE.</li><li>Experiments show two-wheeled carts wear exactly these grooves into wet soft limestone.</li><li>Ice Age ruts are ruled out; how far back into the Temple Period they go is still open.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Geology</span><span class="thr">Engineering</span><span class="thr">Archaeology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="140" >140</b><span class="ctr-u"> cm</span></div><div class="ctr-l">typical gauge, centre to centre</div><div class="ctr-c">Groucutt 2022; Mottershead et al. 2008</div></div><div class="ctr"><div class="ctr-v">up to <b class="ctr-n" data-v="60" >60</b><span class="ctr-u"> cm</span></div><div class="ctr-l">deepest ruts at Misraħ Għar il-Kbir</div><div class="ctr-c">Wikipedia summary of site surveys</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="35" >35</b><span class="ctr-u"> km</span></div><div class="ctr-l">of rut surviving across Malta</div><div class="ctr-c">Mottershead 2011</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="1.36" data-dec="2">1.36</b><span class="ctr-u"> m</span></div><div class="ctr-l">lower relative sea level in Roman times</div><div class="ctr-c">Furlani et al. 2013</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The cart ruts were made in the Ice Age or earlier, long before the Bronze Age and before any known society in Malta or Anatolia.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Several independent lines contradict an Ice Age or older date. No people lived on Malta before about 8,500 years ago, and the first farmers came about 7,900 years ago. Wheeled vehicles appear only around 3500 BCE. The drowned ruts lie in shallow water, which modest sea-level rise since Roman times can explain, whereas Ice Age shorelines lie tens of metres deeper. The Phrygian claim confuses the age of the rock with the age of the grooves cut into it. A Temple Period date, older than the Bronze Age, remains an open question.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 3 of 6, leaning one way"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>leaning one way</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Guidebooks and some museum panels still say &#x27;Bronze Age&#x27; with more confidence than the evidence carries. Specialists are frank that no rut has a direct date, that the Punic-tomb argument can be read both ways, and that dates from the Neolithic to Roman times are all defended. The textbooks are slightly overconfident about the date, and well founded about how the ruts formed.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Hundreds of paired, parallel grooves are cut into the bedrock of Malta and Gozo, more densely than anywhere else known; Derek Mottershead estimates about 35 km of rut survive as fragments.<small>Groucutt 2022; Mottershead 2011</small></li><li>A measured sample shows fairly standard ruts: mean top width about 26 cm, base about 13 cm, maximum depth about 20 cm, and a centre-to-centre gauge of about 1.39–1.40 m.<small>Groucutt 2022</small></li><li>Geomorphologists showed that two-wheeled carts with a 1.40 m gauge and moderate loads could wear such ruts into Malta&#x27;s soft limestone when it is wet, until the ruts reach the cart&#x27;s ground clearance of about 0.675 m.<small>Mottershead, Pearson and Schaefer 2008</small></li><li>Some ruts are interrupted by the shafts of Punic rock-cut tombs, the usual basis for saying the ruts existed by about 700 BCE, though the reading of that evidence is itself disputed.<small>Bugeja 2001; Sagona 2004</small></li><li>At several coastal sites, such as St George&#x27;s Bay at Birżebbuġa, ruts run down to the shore and continue a short way under the water.<small>Trump 2002</small></li><li>Hunter-gatherers first reached Malta by sea about 8,500 years ago, and farmers followed about 7,900 years ago; there is no evidence of people on the islands before that.<small>Scerri et al. 2025</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the ruts were worn by wheels, by sledges or slide-cars, or deliberately cut with tools, for example as field furrows.</li><li>When they were made: the Temple Period (c. 3600–2500 BCE), the Bronze Age (c. 2500–700 BCE), the Punic and Roman periods, or across many periods.</li><li>Whether Punic tombs cut ruts that already existed, or were dug into ruts that belonged to Punic quarrying.</li><li>Whether the Phrygian tracks of central Turkey and the grooves in Sicily belong to the same phenomenon or simply to ancient roads.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>The soil that once covered the ruts, and any dateable pottery, charcoal or seeds in it, has been stripped by erosion over most of the Maltese plateaus.</li><li>No cart, wheel or sledge has been found with the ruts, and bare rock cannot be radiocarbon dated.</li><li>Quarrying, farming and building have destroyed an unknown share of the original network, including links between the surviving fragments.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Most archaeologists and geomorphologists see the cart ruts as the traces of ordinary traffic on soft rock: vehicles, most likely two-wheeled carts, worked across thin soils, broke through to the limestone and cut deeper with every wet-season pass until the carts grounded and drivers moved sideways to a new line. The date is the real argument. David Trump favoured the Bronze Age, Claudia Sagona the Temple Period, others the Punic or Roman centuries. Anton Bugeja showed that nearly every dating argument rests on nearness to a site rather than a shared layer, so the question remains open.</p><ul><li>Wet Maltese limestone loses most of its strength, so wheels can cut it quickly.</li><li>The gauge is fairly consistent, which fits vehicles of one type and perhaps one age.</li><li>Relative sea level at Malta in Roman times was about 1.4 m lower than today, enough to drown the lower end of coastal tracks.</li><li>Wheeled vehicles appear in Europe and the Near East only around 3500 BCE.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>The geologist Alexander Koltypin of Moscow&#x27;s International Independent University of Ecology and Politology argued in the mid-2010s that the rutted tracks of the Phrygian highlands in Turkey were made by heavy vehicles 12–14 million years ago, because the ruts lie in volcanic tuff of that age and look, to him, like tracks pressed into soft ground that later hardened. In Underworld (2002), Graham Hancock treated Malta&#x27;s ruts that run under the sea as a question worth asking about lost coastlines. On The Joe Rogan Experience, Michael Button has discussed the &#x27;fossil&#x27; ruts alongside the idea that traces of a far older civilisation could be almost erased by time.</p><ul><li>The ruts cannot be dated directly, so the textbook dates are inferences.</li><li>Some ruts run into the sea, which invites the thought of lower, older sea levels.</li><li>Similar grooves appear in Malta, Sicily and Anatolia, suggesting a widespread practice.</li><li>The Phrygian ruts sit in rock millions of years old.</li></ul><div class="face-s"><b>Its strongest point</b><p>Nobody has a direct date for a single rut. Every textbook date rests on nearness to a site, a tomb shaft or a quarry, so the conventional age is an inference, and inferences have been wrong before.</p></div><p class="face-cr"><b>Credit</b> Alexander Koltypin (Phrygian tracks); Graham Hancock; Michael Button</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Luminescence (OSL) dating of sediment trapped in the bottom of ruts that are sealed under undisturbed soil or ancient walls.</li><li>Excavation where ruts pass under a dateable layer, such as a Bronze Age or Punic floor, recorded stratigraphically rather than by proximity.</li><li>Underwater survey of the drowned ruts at Birżebbuġa and elsewhere, measuring exactly how far below sea level they reach.</li><li>Microscopic study of rut walls for tool marks versus wheel abrasion, using the same method across Malta, Sicily and Phrygia.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">6 min read · 1,296 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Cart Ruts: Railway Lines Cut in Stone"><button type="button" class="wtoc-i" data-go="cart-ruts-s1">Clapham Junction in the limestone</button><button type="button" class="wtoc-i" data-go="cart-ruts-s2">What the measurements show</button><button type="button" class="wtoc-i" data-go="cart-ruts-s3">The dating problem</button><button type="button" class="wtoc-i" data-go="cart-ruts-s4">Tracks into the sea</button><button type="button" class="wtoc-i" data-go="cart-ruts-s5">The challengers: Ice Age roads and 14-million-year tracks</button><button type="button" class="wtoc-i" data-go="cart-ruts-s6">What time has erased</button><button type="button" class="wtoc-i" data-go="cart-ruts-s7">What would settle it</button></nav></div><section class="wsec" id="cart-ruts-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Clapham Junction in the limestone</h3><p>On a bare, wind-scoured plateau above the cliffs near Siġġiewi in southern Malta, the rock is scored with lines. They come in pairs, about a metre and a half apart, and they curve, cross, split and merge like the tracks outside a busy station. The archaeologist David Trump nicknamed the place Clapham Junction, after the tangle of lines at the London railway interchange, and the name stuck. The local name is Misraħ Għar il-Kbir.</p><p>Some of these grooves are a few centimetres deep. Others, here and at San Ġwann, sink half a metre or more into the limestone. Some run to the edge of a cliff and stop in the air. Others slide down the shore at St George&#x27;s Bay in Birżebbuġa and continue under the sea. Nobody has found the vehicles that made them, and nobody has a direct date for a single rut.</p><blockquote class="wpull"><p>They look like the rails of a lost railway, and they are one of the few ancient puzzles you can stand inside.</p></blockquote><p>That combination, precise engineering-like lines with no date and no maker, has made the ruts a favourite of anyone arguing that history is older than we were taught. It is worth taking them slowly.</p></section><section class="wsec" id="cart-ruts-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What the measurements show</h3><p>The ruts were described in print as early as 1647 by the Maltese historian Giovanni Francesco Abela, and Sir Temi Zammit gave them their modern vocabulary in a 1928 paper in Antiquity. The first large statistical study came in 2022, when Huw Groucutt measured the shapes. Across 159 ruts, the mean top width was about 26 cm and the mean base width about 13 cm, a V or U shape that narrows downwards. Mean maximum depth was about 20 cm. The distance between the centres of a pair averaged about 1.39 m, and between the inner edges about 1.11 m.</p><figure class="wx wx--static" id="cart-ruts-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">A rut pair and the cart that fits it</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="A rut pair and the cart that fits it"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" class="wx-svg" role="img" aria-labelledby="cart-ruts-f1-t"><title id="cart-ruts-f1-t">End-on section of a Maltese rut pair at true scale, with the two-wheeled cart that fits it</title><defs><marker id="cart-ruts-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text x="24" y="24" class="wx-t-cap">Looking along the ruts · drawn to scale</text><path d="M24,280 L184,280 L197,320 L223,320 L236,280 L464,280 L477,320 L503,320 L516,280 L696,280 L696,470 L24,470 Z" class="wx-stone wx-edge"/><path d="M184,280 L200,400 L220,400 L236,280" class="wx-dash"/><text x="176" y="392" text-anchor="end" class="wx-t-s wx-halo">deepest ruts: up to c. 60 cm</text><line x1="150" y1="415" x2="560" y2="415" class="wx-hl wx-draw" pathLength="1" style="--d:8"/><text x="40" y="440" class="wx-t-b wx-t-a wx-halo">0.675 m deep: the axle grounds on the rock between the ruts</text><text x="40" y="458" class="wx-t-s wx-halo">so drivers shift sideways and start a new pair (Mottershead et al. 2008)</text><rect x="226" y="150" width="248" height="30" rx="3" class="wx-wood wx-o60 wx-edge wx-pop" style="--d:3"/><text x="350" y="170" text-anchor="middle" class="wx-t-s wx-t-w">cart body (schematic)</text><line x1="196" y1="185" x2="504" y2="185" class="wx-bold wx-draw" pathLength="1" style="--d:2"/><rect x="204" y="50" width="12" height="270" rx="5" class="wx-wood wx-edge wx-pop" style="--d:1"/><rect x="484" y="50" width="12" height="270" rx="5" class="wx-wood wx-edge wx-pop" style="--d:1"/><text x="196" y="80" text-anchor="end" class="wx-t wx-halo">wheel, seen edge-on</text><text x="196" y="95" text-anchor="end" class="wx-t-s wx-halo">(diameter schematic)</text><text x="510" y="189" class="wx-t wx-halo">axle</text><line x1="223" y1="320" x2="477" y2="320" class="wx-guide"/><line x1="350" y1="189" x2="350" y2="316" class="wx-dim" marker-start="url(#cart-ruts-f1-ah)" marker-end="url(#cart-ruts-f1-ah)"/><text x="360" y="232" class="wx-t-n wx-halo">0.675 m</text><text x="360" y="248" class="wx-t-s wx-halo">ground clearance</text><line x1="516" y1="300" x2="548" y2="318" class="wx-thin"/><text x="552" y="306" class="wx-t-b wx-halo">typical rut</text><text x="552" y="322" class="wx-t-s wx-halo">26 cm wide at the top</text><text x="552" y="337" class="wx-t-s wx-halo">13 cm at the base</text><text x="552" y="352" class="wx-t-s wx-halo">20 cm deep (means, 159 ruts)</text><line x1="210" y1="328" x2="210" y2="490" class="wx-guide"/><line x1="490" y1="328" x2="490" y2="490" class="wx-guide"/><line x1="214" y1="492" x2="486" y2="492" class="wx-dim wx-draw" pathLength="1" style="--d:5" marker-start="url(#cart-ruts-f1-ah)" marker-end="url(#cart-ruts-f1-ah)"/><text x="350" y="514" text-anchor="middle" class="wx-t-n">1.40 m gauge, centre to centre</text><text x="350" y="530" text-anchor="middle" class="wx-t-s">measured mean 1.39 m (Groucutt 2022)</text><line x1="576" y1="500" x2="676" y2="500" class="wx-bold"/><line x1="576" y1="494" x2="576" y2="506" class="wx-line"/><line x1="626" y1="496" x2="626" y2="504" class="wx-line"/><line x1="676" y1="494" x2="676" y2="506" class="wx-line"/><text x="626" y="522" text-anchor="middle" class="wx-t-s">50 cm</text><text x="690" y="458" text-anchor="end" class="wx-t-cap">soft limestone</text></svg></div></div><figcaption>End-on section of a typical Maltese rut pair at true scale, with the two-wheeled cart that Mottershead&#x27;s team modelled. <span class="wx-src">Based on: Rut dimensions: Groucutt 2022 (means of 159 top widths, 83 base widths, 75 depths). Gauge and ground clearance: Mottershead, Pearson and Schaefer 2008. Wheel size and cart body are schematic.</span></figcaption><p class="vh">A cross-section drawn to scale, looking along the ruts. A flat limestone surface has two V-shaped grooves 1.40 metres apart, centre to centre. Each typical groove is about 26 centimetres wide at the top, 13 centimetres at the base and 20 centimetres deep. A dashed outline shows the deepest ruts, about 60 centimetres. A schematic two-wheeled cart stands with its wheels in the grooves; its axle is 0.675 metres above the rut bottom, the ground clearance. When ruts get deeper than that, the cart&#x27;s underside hits the rock between them and drivers move to a new line. A 50 centimetre scale bar is shown.</p></figure><p>That consistency matters. Groucutt concluded that the ruts are fairly standardised, &#x27;perhaps suggesting that they are of a consistent age and function&#x27;, while noting that the popular comparison with railway gauge is misleading because the two are measured differently.</p><aside class="wcall"><b>How do we know how they formed?</b><p>In 2008 the geomorphologists Derek Mottershead, Alastair Pearson and Martin Schaefer tested the rock itself. Malta&#x27;s Globigerina limestone is weak, and when soaked it loses most of its strength. Their calculations showed that a two-wheeled cart with a 1.40 m gauge carrying moderate loads would gradually cut into wet rock. Once the ruts reached the cart&#x27;s ground clearance, about 0.675 m, the vehicle would ground, and drivers would shift to a fresh line. That explains why the ruts multiply and braid.</p></aside></section><section class="wsec" id="cart-ruts-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The dating problem</h3><p>Here is the honest difficulty. Bare limestone carries no charcoal, seeds or pottery to radiocarbon date, and the soil that might once have filled the ruts has long since washed away. So every date comes from context.</p><p>The most quoted clue is the Punic tombs. At places such as Mtarfa, Għar il-Kbir and Ras il-Ġebel, the square shafts of rock-cut tombs of the Phoenician and Punic period interrupt the ruts, which suggests the ruts were already there by about 700 BCE. But as Anton Bugeja showed in a 2001 review, identical evidence has been read in opposite ways: Anthony Bonanno pointed out that Punic tombs could have been dug into ruts made by Punic quarry traffic, so the tombs would not be later at all.</p><figure class="wx wx--steps" id="cart-ruts-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">Fencing in the date</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Fencing in the date"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" class="wx-svg" role="img" aria-labelledby="cart-ruts-f2-t"><title id="cart-ruts-f2-t">Time line from 12,000 BCE to the Common Era showing what limits the age of Malta's cart ruts</title><defs><marker id="cart-ruts-f2-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text x="24" y="26" class="wx-t-cap">What limits the age · years BCE, Malta</text><line x1="60" y1="50" x2="60" y2="400" class="wx-guide"/><line x1="160" y1="50" x2="160" y2="400" class="wx-guide"/><line x1="260" y1="50" x2="260" y2="400" class="wx-guide"/><line x1="360" y1="50" x2="360" y2="400" class="wx-guide"/><line x1="460" y1="50" x2="460" y2="400" class="wx-guide"/><line x1="560" y1="50" x2="560" y2="400" class="wx-guide"/><line x1="660" y1="50" x2="660" y2="400" class="wx-guide"/><line x1="60" y1="400" x2="660" y2="400" class="wx-line"/><text x="60" y="418" text-anchor="middle" class="wx-t-s">12,000</text><text x="160" y="418" text-anchor="middle" class="wx-t-s">10,000</text><text x="260" y="418" text-anchor="middle" class="wx-t-s">8,000</text><text x="360" y="418" text-anchor="middle" class="wx-t-s">6,000</text><text x="460" y="418" text-anchor="middle" class="wx-t-s">4,000</text><text x="560" y="418" text-anchor="middle" class="wx-t-s">2,000</text><text x="660" y="418" text-anchor="middle" class="wx-t-s">1 CE</text><g class="wx-st" data-s="1"><rect x="60" y="50" width="275" height="350" class="wx-rock wx-o40"/><text x="72" y="72" class="wx-t-b">No evidence of people on Malta</text><circle cx="110" cy="100" r="7" class="wx-c2"/><text x="124" y="97" class="wx-t wx-halo">Land bridge to Sicily drowns,</text><text x="124" y="112" class="wx-t-s wx-halo">c. 13,000 years ago (now c. 95 m deep)</text><line x1="96" y1="446" x2="40" y2="446" class="wx-hl" marker-end="url(#cart-ruts-f2-ah)"/><text x="104" y="450" class="wx-t-s">Koltypin's 12–14 million years would sit about a thousand chart-widths further left</text></g><g class="wx-st" data-s="2"><circle cx="335" cy="150" r="7" class="wx-c3"/><text x="325" y="146" text-anchor="end" class="wx-t wx-halo">Hunter-gatherers arrive by sea</text><text x="325" y="161" text-anchor="end" class="wx-t-s wx-halo">c. 6500 BCE (Scerri et al. 2025)</text><circle cx="365" cy="176" r="7" class="wx-c6"/><text x="377" y="180" class="wx-t wx-halo">First farmers, c. 5900 BCE</text></g><g class="wx-st" data-s="3"><rect x="480" y="214" width="55" height="14" rx="4" class="wx-c3"/><text x="472" y="220" text-anchor="end" class="wx-t-b wx-halo">Temple Period, 3600–2500 BCE</text><text x="472" y="235" text-anchor="end" class="wx-t-s wx-halo">Sagona 2004: ruts cut as field furrows?</text></g><g class="wx-st" data-s="4"><circle cx="485" cy="262" r="7" class="wx-c5"/><text x="475" y="266" text-anchor="end" class="wx-t wx-halo">First wheeled vehicles, c. 3500 BCE</text><rect x="535" y="286" width="90" height="14" rx="4" class="wx-c1"/><text x="527" y="292" text-anchor="end" class="wx-t-b wx-halo">Bronze Age, 2500–700 BCE</text><text x="527" y="307" text-anchor="end" class="wx-t-s wx-halo">Trump's favoured date for the ruts</text></g><g class="wx-st" data-s="5"><circle cx="625" cy="336" r="7" class="wx-accfill"/><text x="615" y="332" text-anchor="end" class="wx-t-b wx-halo">Punic tombs cut some ruts, from c. 700 BCE</text><text x="615" y="347" text-anchor="end" class="wx-t-s wx-halo">the usual latest date, itself disputed</text><circle cx="655" cy="376" r="7" class="wx-c2"/><text x="645" y="380" text-anchor="end" class="wx-t wx-halo">Roman sea level 1.36 m lower: coastal tracks can drown</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> About 13,000 years ago the land bridge to Sicily drowns. No people are known on Malta.</p><ol class="wx-steplist"><li>About 13,000 years ago the land bridge to Sicily drowns. No people are known on Malta.</li><li>People arrive by sea: hunter-gatherers about 6500 BCE, farmers about 5900 BCE. No wheels yet.</li><li>The Temple Period, 3600–2500 BCE: Sagona&#x27;s proposed date for the ruts.</li><li>Wheels appear about 3500 BCE; the Bronze Age, 2500–700 BCE, is Trump&#x27;s favoured date.</li><li>Punic tombs cut some ruts from about 700 BCE; Roman sea level was 1.36 m lower.</li></ol><figcaption>What limits the age of the ruts, step by step, on a time line from 12,000 BCE to 1 CE. <span class="wx-src">Based on: Scerri et al. 2025; Sagona 2004; Trump 2002; Bugeja 2001; Furlani et al. 2013. Period boundaries are approximate.</span></figcaption><p class="vh">A time line from 12,000 BCE on the left to the start of the Common Era on the right. Step 1: the land bridge from Malta to Sicily drowns about 13,000 years ago; no people are known on Malta. Step 2: hunter-gatherers arrive by sea about 6500 BCE and farmers about 5900 BCE, without wheels. Step 3: the Temple Period, 3600 to 2500 BCE, Sagona&#x27;s proposed date for the ruts. Step 4: wheeled vehicles appear about 3500 BCE and the Bronze Age runs 2500 to 700 BCE, Trump&#x27;s proposed date. Step 5: Punic tombs cut some ruts from about 700 BCE, and Roman sea level stood 1.36 metres lower. An arrow off the left edge notes that Koltypin&#x27;s 12 to 14 million years would lie a thousand times further left.</p></figure><p>The other main argument is nearness. Ruts run close to Bronze Age fortified villages such as Borġ in-Nadur, and David Trump favoured a Bronze Age date, broadly 2500–700 BCE. Claudia Sagona argued in 2004 for the earlier Temple Period, around 3600–2500 BCE, reading many ruts as deliberately cut furrows for spreading soil across rocky ground. Bugeja&#x27;s warning applies to all of these: &#x27;proximity has often been interpreted as association&#x27;, and a rut near a village is not the same as a rut sealed under that village&#x27;s floor.</p></section><section class="wsec" id="cart-ruts-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Tracks into the sea</h3><p>The ruts that disappear under the water are the most striking argument for great age. If the sea has risen over them, surely they must be very old? The answer depends on how far the sea has risen, and when.</p><p>At the end of the last Ice Age, global sea level was far lower, and a low land bridge between Malta and Sicily, now about 95 m deep, was drowned around 13,000 years ago. But the Maltese ruts go under the water by metres, not by tens of metres. A 2013 study of submerged Roman remains around Malta found that relative sea level in Roman times stood about 1.36 m below today&#x27;s. So even a Roman-era cart track that ended at the old shore could now be in the water. A Bronze Age track would be deeper still, but only modestly.</p><aside class="wcall"><b>Fresh from the field</b><p>In 2025 Eleanor Scerri and colleagues published evidence from Latnija cave that hunter-gatherers reached Malta by boat about 8,500 years ago, crossing roughly 100 km of open sea from Sicily, about a thousand years before the first farmers. It is a reminder that Malta&#x27;s human story is older than we thought. It also sets a hard floor: before about 8,500 years ago, nobody is known to have been on the islands to make any ruts.</p></aside></section><section class="wsec" id="cart-ruts-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The challengers: Ice Age roads and 14-million-year tracks</h3><p>The boldest claim comes from central Turkey. In the Phrygian highlands, around the rock-cut monuments of Midas City, long tracks with paired grooves cross the volcanic tuff, some cut deep into the rock. In the mid-2010s the Russian geologist Alexander Koltypin argued that these were made 12–14 million years ago by huge, heavy vehicles, pressed into soft ground that later hardened into stone. His reasoning, published on his own website rather than in a journal, was that the tuff is of that age.</p><p>Graham Hancock, in Underworld (2002), took Malta&#x27;s drowned ruts seriously as a clue to lost coastlines, and Michael Button has discussed the &#x27;fossil&#x27; ruts on The Joe Rogan Experience, in a wider conversation about whether a far older civilisation could have been almost erased from the record. That question is fair, and the challengers&#x27; strongest point is real: not one rut has a direct date.</p><blockquote class="wpull"><p>The age of a rock is not the age of a groove cut into it. A 14-million-year-old rock can carry a two-thousand-year-old road.</p></blockquote><p>But the specific claim of Ice Age or older ruts runs into several walls at once. Nobody lived on Malta before about 8,500 years ago. The wheel appears around 3500 BCE. The drowned Maltese ruts sit in shallow water that Roman-era sea level can explain. And the Phrygian tracks lie in a landscape that Phrygians, Romans and Byzantines used intensively, with Midas City&#x27;s monuments dating mainly to the 8th–6th centuries BCE. Tracks cut into old rock are exactly what we would expect from ancient roads.</p></section><section class="wsec" id="cart-ruts-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What time has erased</h3><p>Much of what would answer the question is gone. Soil loss on the Maltese plateaus has removed the deposits that once filled or covered the ruts. Centuries of quarrying for Malta&#x27;s building stone have cut through whole stretches of the network; Mottershead argued that the 35 km or so that survive are fragments of a much larger system. The wooden carts, sledges or baskets that moved along them have rotted away. Even the drowned sections are poorly surveyed, which leaves room for speculation that a careful dive with a depth gauge could close.</p></section><section class="wsec" id="cart-ruts-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle it</h3><p>The ruts are dateable in principle. Optically stimulated luminescence can tell when a grain of sand last saw daylight, so sediment sealed at the bottom of a rut under an undisturbed wall or soil layer could give a real age. Excavating where ruts pass under Bronze Age or Punic floors, and recording the layers properly, would replace nearness with stratigraphy. A measured underwater survey at Birżebbuġa would show exactly how deep the tracks go.</p><ul class="wlist"><li>If sealed sediments give ages in the last 4,000 years, the Bronze Age or later readings win.</li><li>If they give ages around 5,000 years, Sagona&#x27;s Temple Period reading gains ground.</li><li>An Ice Age age would need people on Malta before 8,500 years ago, and no such evidence exists.</li></ul><p>Until then, the cart ruts remain what they have been since 1647: a genuine puzzle about when, with a fairly clear answer about how.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">6,500 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Hunter-gatherers reach Malta by sea</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">5,900 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">First farmers settle Malta</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">3,500 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Earliest wheeled vehicles in Europe and the Near East</span></li><li class="wtl-use" style="--i:3"><span class="wtl-y">700 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Punic tombs cut some ruts (usual upper limit)</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">1647 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">G. F. Abela describes the ruts</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1928 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Temi Zammit&#x27;s paper in Antiquity</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2008 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Mottershead team models rut formation</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2022 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Groucutt measures rut variability</span></li><li class="wtl-find" style="--i:8"><span class="wtl-y">2025 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Malta settled 1,000 years earlier than thought</span></li></ol><details class="srcs"><summary>Sources for this case (11)</summary><ol><li>Mottershead, D., Pearson, A. &amp; Schaefer, M. (2008). The cart ruts of Malta: an applied geomorphology approach. Antiquity 82(318): 1065–1079. <a href="https://doi.org/10.1017/S0003598X00097787" target="_blank" rel="noopener">doi:10.1017/S0003598X00097787</a></li><li>Groucutt, H. S. (2022). The morphological variability of Maltese &#x27;cart ruts&#x27; and its implications. Journal of Archaeological Science: Reports 41: 103287. <a href="https://doi.org/10.1016/j.jasrep.2021.103287" target="_blank" rel="noopener">doi:10.1016/j.jasrep.2021.103287</a></li><li>Sagona, C. (2004). Land use in prehistoric Malta. A re-examination of the Maltese &#x27;cart ruts&#x27;. Oxford Journal of Archaeology 23(1): 45–60.</li><li>Bugeja, A. (2001). Methods of date assignment for cart-ruts in the Maltese Islands. The Oracle 2: 23–35.</li><li>Mottershead, D. (2011). The origin of Maltese cart-ruts: cut by wheels or tools? Malta Archaeological Review 8.</li><li>Zammit, T. (1928). Prehistoric cart-tracks in Malta. Antiquity 2(5): 18–25.</li><li>Furlani, S. et al. (2013). Holocene sea level change in Malta. Quaternary International 288: 146–157. <a href="https://doi.org/10.1016/j.quaint.2012.02.038" target="_blank" rel="noopener">doi:10.1016/j.quaint.2012.02.038</a></li><li>Scerri, E. M. L. et al. (2025). Hunter-gatherer sea voyages extended to remotest Mediterranean islands. Nature 641: 137–143. <a href="https://doi.org/10.1038/s41586-025-08780-y" target="_blank" rel="noopener">doi:10.1038/s41586-025-08780-y</a></li><li>Trump, D. H. (2002). Malta: Prehistory and Temples. Midsea Books, Malta.</li><li>Hancock, G. (2002). Underworld: The Mysterious Origins of Civilization. Michael Joseph, London.</li><li>Koltypin, A. (c. 2014–2015). Claims of 12–14-million-year-old vehicle tracks in Phrygia, published on his website and reported in the press (e.g. Ancient Origins).</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-cart-ruts" data-t="The Cart Ruts: Railway Lines Cut in Stone"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Cart Ruts: Railway Lines Cut in Stone</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-cart-ruts</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-channeled-scablands-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Dry Falls (Washington).jpg" data-cap="Channeled Scablands and Dry Falls, eastern Washington, USA" data-big><figcaption></figcaption></figure><div class="sh-k">Floods, Fire and Ice</div><h2 class="sh-t" id="case-channeled-scablands-st" tabindex="-1">The Channeled Scablands: The Flood Geologists Laughed At</h2><p class="sh-s">A dry waterfall five times wider than Niagara, ripples taller than a house, and a geologist mocked for forty years. Then he turned out to be right.</p><div class="sh-v"><span class="vstamp vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><p class="sh-claim"><b>What the stamp rates:</b> The Channeled Scablands were carved in geological moments by repeated catastrophic outburst floods at the end of the last Ice Age, as J Harlen Bretz argued against the geological consensus of his day.</p></div><p class="v4-q">Did floods of unimaginable size carve eastern Washington in days, not ages?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>In 1923 a geologist said a flood had carved eastern Washington in days; colleagues laughed for forty years.</li><li>The water came from an Ice Age lake in Montana held back by a wall of ice 600 metres tall.</li><li>When the dam floated, 2,500 cubic kilometres of water crossed the state, and it happened about forty times.</li><li>Dates on flood-carried boulders put the floods between about 18,000 and 14,700 years ago.</li><li>Bretz was right; the newer idea that a comet triggered the floods still needs a flood bed dated to the Younger Dryas.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Geology</span><span class="thr">Climate</span><span class="thr">Physics</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">up to c. <b class="ctr-n" data-v="2500" >2,500</b><span class="ctr-u"> km³</span></div><div class="ctr-l">water held by glacial Lake Missoula at its largest</div><div class="ctr-c">Bjornstad 2006</div></div><div class="ctr"><div class="ctr-v">up to c. <b class="ctr-n" data-v="600" >600</b><span class="ctr-u"> m</span></div><div class="ctr-l">height of the ice dam across the Clark Fork</div><div class="ctr-c">Pardee 1942; Bjornstad 2006</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="40" >40</b><span class="ctr-u"> floods</span></div><div class="ctr-l">separate flood beds counted in the Touchet Formation</div><div class="ctr-c">Waitt 1980</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="5.6" data-dec="1">5.6</b><span class="ctr-u"> km</span></div><div class="ctr-l">width of Dry Falls, the largest cataract</div><div class="ctr-c">Washington State Parks</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="56" >56</b><span class="ctr-u"> years</span></div><div class="ctr-l">from Bretz&#x27;s flood paper to his Penrose Medal</div><div class="ctr-c">Bretz 1923; GSA 1979</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The Channeled Scablands were carved in geological moments by repeated catastrophic outburst floods at the end of the last Ice Age, as J Harlen Bretz argued against the geological consensus of his day.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:91.7%" role="img" aria-label="Weight of evidence: Established"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Several independent lines agree. Lake Missoula&#x27;s shorelines and ripples show a real lake that drained fast; the Scablands&#x27; coulees, cataracts and scoured basalt need enormous flows; about 40 flood beds record repeated outbursts; and exposure dates tie the floods to the end of the last Ice Age. The challenger of his day was simply right, and the consensus was wrong. Carlson&#x27;s further step, that ice-sheet melting or a cosmic impact drove the floods, is a separate claim: the dates place the floods thousands of years before the Younger Dryas, and nothing yet points to an impact trigger.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Today&#x27;s textbooks tell Bretz&#x27;s floods as settled fact and as a parable of rebel vindication, and on the core they are right. They sound surer than the evidence on the details: peak discharges differ by up to tenfold between methods, the exact number of large floods is still argued, and the crust has shifted beneath the routes. Earlier textbooks made the opposite mistake, presenting slow erosion as settled when it was not.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>In 1923 J Harlen Bretz argued that the Channeled Scablands of eastern Washington were cut by a catastrophic flood. Most geologists rejected the idea for decades; by the 1960s and 1970s the field had come round, and in 1979 the Geological Society of America gave him its highest award, the Penrose Medal.<small>Bretz 1923; Soennichsen 2008</small></li><li>The water came from glacial Lake Missoula in western Montana, dammed by a lobe of the Cordilleran ice sheet up to about 600 m high and holding up to about 2,500 cubic kilometres of water. Its old shorelines are still visible on the hills above the city of Missoula.<small>Pardee 1942; Bjornstad 2006</small></li><li>In the Touchet Formation of southern Washington, Richard Waitt counted about 40 stacked flood beds, separated by signs of time passing between floods, such as burrows and volcanic ash. The floods were many, not one.<small>Waitt 1980</small></li><li>Beryllium-10 exposure dates on flood-carried boulders place one major flood at about 18,200 ± 1,500 years ago and the last Missoula floods at about 14,700 ± 1,200 years ago.<small>Balbas et al. 2017</small></li><li>Dry Falls, a cataract cut by the floods at the head of the Lower Grand Coulee, is about 5.6 km wide and 121 m high. Niagara&#x27;s Horseshoe Falls is about 0.82 km wide and 51 m high.<small>Washington State Parks; Bjornstad 2006</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>How big the peak flows were: classic estimates of up to about 17 million cubic metres per second assume channels filled to the brim, while a 2016 model for Moses Coulee gives flows five to ten times smaller.</li><li>Whether all the water came from Lake Missoula, or whether other sources added to some floods, such as glacial Lake Columbia or water stored beneath the ice sheet.</li><li>Randall Carlson&#x27;s proposal that sudden melting of the ice sheet itself, perhaps triggered by a cosmic impact, drove the largest floods.</li><li>Whether any people lived close enough to witness a flood; people were in western Idaho by about 16,000 years ago.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>The ice dam itself melted away long ago, so how it failed each time can only be modelled, not inspected.</li><li>Each flood scoured away much of the evidence left by the one before, so the earliest and smallest floods are the hardest to count.</li><li>The land itself has moved: as the ice sheet&#x27;s weight came and went, the crust tilted by tens to hundreds of metres, so today&#x27;s topography is not the landscape the floods crossed.</li><li>No archaeological site has yet been found buried beneath the flood deposits, but only a tiny fraction of them has been searched.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Geologists today treat the Missoula floods as one of the best-documented catastrophes in Earth&#x27;s history. Repeatedly, a lobe of ice blocked the Clark Fork River and impounded glacial Lake Missoula; repeatedly the ice dam floated and failed, and the lake emptied in days across eastern Washington, down the Columbia and into the Pacific. The dates cluster between about 18,000 and 14,700 years ago. The same profession resisted Bretz for four decades, and many geologists now tell his story as a warning against dismissing catastrophe out of hand.</p><ul><li>Lake Missoula&#x27;s shorelines, its lake-bed silts and the giant current ripples on its floor show a real lake that drained rapidly.</li><li>About 40 flood beds in the Touchet Formation, with ash, burrows and mud cracks between them, record many separate floods.</li><li>Exposure dates put the floods thousands of years before the Younger Dryas cold snap, which began about 12,900 years ago.</li><li>Ice dams float and fail when the water behind them reaches about nine-tenths of their height, the mechanism of outburst floods (jökulhlaups) observed in Iceland and Alaska today.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Carlson, who has spent decades walking the Scablands and leading groups across them, uses the landscape as his master example: the geological establishment was wrong about catastrophe once, for forty years, and he argues it may still be underestimating it. He accepts the floods and their scale; his challenge is to their source. He doubts that an ice dam could have held back a lake some 600 m deep, since no outburst flood observed in modern times comes close, and he argues that sudden melting of the ice sheet itself, perhaps set off by the cosmic impact proposed for the Younger Dryas, supplied water on a still larger scale.</p><ul><li>The Scablands show that the geological mainstream can reject a correct catastrophic reading for decades.</li><li>Features such as Dry Falls, giant current ripples and house-sized boulders carried far from their source rocks demand flows far beyond any modern river.</li><li>No modern glacier dams a lake remotely as deep as Lake Missoula, so its behaviour is an extrapolation, not an observation.</li><li>If the ice sheet melted catastrophically, the floods belong to a wider story of abrupt global change at the end of the Ice Age.</li></ul><div class="face-s"><b>Its strongest point</b><p>Bretz was right and his many critics were wrong, and the reason was not evidence but a rule of thumb: that the present-day pace of change explains the past. Carlson&#x27;s insistence that catastrophe be tested, not ruled out, is exactly the lesson the Scablands teach.</p></div><p class="face-cr"><b>Credit</b> Randall Carlson, on his Kosmographia podcast (episode #044 &#x27;Megafloods&#x27;, 2020, and #071 on ice dams), in his Scablands field tours, on Netflix&#x27;s Ancient Apocalypse (season 1, episode 8, &#x27;Cataclysm and Rebirth&#x27;, 2022) and The Joe Rogan Experience; J Harlen Bretz, the original challenger (1923 onwards); Graham Hancock</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>More exposure and luminescence dates from flood deposits across the whole route, to fix how many large floods occurred and exactly when.</li><li>Hydraulic models that combine the tilted Ice Age landscape with erosion thresholds, to narrow down the true peak discharges.</li><li>Geochemical fingerprints in flood silts and offshore sediments that distinguish lake water from ice-sheet meltwater.</li><li>A flood deposit securely dated to the start of the Younger Dryas, about 12,900 years ago, which Carlson&#x27;s impact link would require.</li><li>Archaeological survey beneath and beside flood deposits for traces of people who lived through the floods.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">6 min read · 1,404 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Channeled Scablands: The Flood Geologists Laughed At"><button type="button" class="wtoc-i" data-go="channeled-scablands-s1">A landscape that looks wrong</button><button type="button" class="wtoc-i" data-go="channeled-scablands-s2">Bretz&#x27;s heresy</button><button type="button" class="wtoc-i" data-go="channeled-scablands-s3">How a lake became a flood</button><button type="button" class="wtoc-i" data-go="channeled-scablands-s4">How big were the floods?</button><button type="button" class="wtoc-i" data-go="channeled-scablands-s5">Carlson&#x27;s case at its strongest</button><button type="button" class="wtoc-i" data-go="channeled-scablands-s6">Where the extra step falters</button><button type="button" class="wtoc-i" data-go="channeled-scablands-s7">What time has hidden, and what would settle the rest</button></nav></div><section class="wsec" id="channeled-scablands-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A landscape that looks wrong</h3><p>Drive across the wheat country of eastern Washington and the ground suddenly breaks. The soft, rolling hills of wind-blown soil give way to bare black basalt, cut into dry canyons with sheer walls, potholes, isolated mesas and gravel mounds the size of hills. At the head of the Lower Grand Coulee the road runs to the edge of a cliff and looks out over Dry Falls: a horseshoe of rock about 5.6 km wide and 121 m high, with plunge pools at its foot, and no river anywhere near it.</p><p>For Randall Carlson, the builder, geomythologist and host of the Kosmographia podcast, this landscape is the key to the past. He has walked it for decades and led groups across it, and he took Graham Hancock there for the final episode of Netflix&#x27;s Ancient Apocalypse in 2022. His point is simple and powerful: here, written in stone, is catastrophe shaping the Earth, and a reminder that the experts once refused to see it.</p><blockquote class="wpull"><p>The Scablands are the place where the rebel geologist won. The question is how far that victory reaches.</p></blockquote></section><section class="wsec" id="channeled-scablands-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Bretz&#x27;s heresy</h3><p>In 1923 J Harlen Bretz, a geologist at the University of Chicago, published &#x27;The Channeled Scabland of the Columbia Plateau&#x27;. He argued that the channels, cataracts and gravel bars could only have been made by an enormous flood of water sweeping across the plateau in a short time. To the geology of the day this sounded like a return to Noah. The discipline had been built on the principle that the slow processes we see today, working over vast spans of time, explain the landscape.</p><p>On 12 January 1927 Bretz presented his case to the Geological Society of Washington, and a panel of senior geologists lined up against him. None could say where so much water had come from, and Bretz had no answer either. One man in the room had a clue: Joseph Pardee of the US Geological Survey had mapped the shorelines of a vast ice-dammed lake in western Montana. It took him until 1942 to publish his description of giant current ripples on the floor of that lake, glacial Lake Missoula, evidence that it had drained with terrific force.</p><p>The tide turned slowly. Aerial photographs later revealed giant ripples in the Scablands too. In 1965 a party of geologists touring the area sent the elderly Bretz a telegram: &#x27;Greetings and Salutations. We are all now catastrophists!&#x27; When the Mariner 9 spacecraft photographed flood-carved channels on Mars in 1972, the Scablands became the model for them. In 1979, in his late nineties, Bretz received the Penrose Medal, the highest honour of the Geological Society of America. He died in 1981.</p></section><section class="wsec" id="channeled-scablands-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>How a lake became a flood</h3><p>The mechanism is now well understood. During the last glacial period a lobe of the Cordilleran ice sheet crept south into the Idaho panhandle and blocked the Clark Fork River. Behind the ice, water filled the valleys of western Montana to form Lake Missoula: up to about 2,500 cubic kilometres of water, about half the volume of Lake Michigan, pressing against an ice dam up to about 600 m high.</p><figure class="wx wx--steps" id="channeled-scablands-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · St
