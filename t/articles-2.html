x-hide" data-s="2"><path d="M409.6,198.5 L367.7,215.3 L335.1,235.2 L313.4,267.1 L316.1,294.9" class="wx-hl" style="stroke-width:4;opacity:.55"/><path d="M409.6,198.5 L367.7,215.3 L335.1,235.2 L313.4,267.1 L316.1,294.9" class="wx-flow wx-s2"/></g><g class="wx-st wx-hide" data-s="2"><path d="M409.6,198.5 L400.3,227.2 L378.6,255.1 L356.9,283.0 L332.4,306.9" class="wx-hl" style="stroke-width:4;opacity:.55"/><path d="M409.6,198.5 L400.3,227.2 L378.6,255.1 L356.9,283.0 L332.4,306.9" class="wx-flow wx-s2"/></g><g class="wx-st wx-hide" data-only="2"><text x="446.5" y="310.9" class="wx-t-b wx-halo">The dam fails</text><text x="446.5" y="324.9" class="wx-t-s wx-halo">the lake empties in days;</text><text x="446.5" y="338.9" class="wx-t-s wx-halo">water races west and south</text></g><g class="wx-st" data-s="3"><circle cx="304.7" cy="202.5" r="5" class="wx-accfill wx-edge"/></g><g class="wx-st wx-hide" data-only="3"><line x1="299.7" y1="205.5" x2="234.7" y2="262.5" class="wx-thin"/><text x="230.7" y="272.5" text-anchor="end" class="wx-t-b wx-halo">Dry Falls</text><text x="230.7" y="286.5" text-anchor="end" class="wx-t-s wx-halo">5.6 km wide, c. 120 m high</text><text x="373.1" y="239.2" text-anchor="middle" class="wx-t-b wx-halo">Channeled</text><text x="373.1" y="253.2" text-anchor="middle" class="wx-t-b wx-halo">Scablands</text><text x="373.1" y="267.2" text-anchor="middle" class="wx-t-s wx-halo">soil stripped, basalt plucked</text></g><g class="wx-st" data-s="4"><polygon points="283.5,271.0 313.4,263.1 340.6,287.0 337.8,314.9 327.0,326.8 305.2,322.8 280.8,302.9" class="wx-water2 wx-o60 wx-edge-soft"/><path d="M327.0,326.8 L242.8,353.1 L204.7,359.5 L150.4,364.2 L117.8,342.7 L90.6,316.5 L55.3,306.9" class="wx-flow wx-s2" style="stroke-width:3"/></g><g class="wx-st" data-s="4"><circle cx="327.0" cy="326.8" r="4" class="wx-inkfill"/></g><g class="wx-st wx-hide" data-only="4"><line x1="331.0" y1="328.8" x2="387.0" y2="366.8" class="wx-thin"/><text x="391.0" y="370.8" class="wx-t-b wx-halo">Wallula Gap</text><text x="391.0" y="384.8" class="wx-t-s wx-halo">a bottleneck: water backs up</text><text x="391.0" y="398.8" class="wx-t-s wx-halo">into temporary Lake Lewis and</text><text x="391.0" y="412.8" class="wx-t-s wx-halo">drops layered silts (rhythmites)</text><text x="139.5" y="414.4" text-anchor="middle" class="wx-t-b wx-halo">Through the Columbia Gorge</text><text x="139.5" y="428.4" text-anchor="middle" class="wx-t-s wx-halo">and on to the Pacific</text></g><g class="wx-st wx-hide" data-only="5"><text x="585.0" y="133.6" text-anchor="middle" class="wx-t-big wx-t-a wx-halo">× 40+</text><text x="585.0" y="155.6" text-anchor="middle" class="wx-t-s wx-halo">ice re-advances, the lake refills,</text><text x="585.0" y="169.6" text-anchor="middle" class="wx-t-s wx-halo">the dam fails again: c. 18,000 to</text><text x="585.0" y="183.6" text-anchor="middle" class="wx-t-s wx-halo">14,700 years ago (10Be dates)</text><text x="155.8" y="255.1" text-anchor="middle" class="wx-t wx-t-a wx-halo">Carlson (proposed): more water</text><text x="155.8" y="269.1" text-anchor="middle" class="wx-t-s wx-halo">from sudden melting of the ice</text><text x="155.8" y="283.1" text-anchor="middle" class="wx-t-s wx-halo">sheet itself, perhaps cosmic</text></g><g><rect x="40" y="472" width="35.8" height="5" class="wx-inkfill"/><rect x="75.8" y="472" width="35.8" height="5" class="wx-paper wx-edge"/><text x="40" y="467" class="wx-t-s">0</text><text x="111.6" y="467" text-anchor="middle" class="wx-t-s">100 km</text><text x="135.6" y="478" class="wx-t-s">N ↑ · coastline, ice and lake outlines simplified</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Ice blocks the Clark Fork River: Lake Missoula fills behind a dam up to about 600 m high.</p><ol class="wx-steplist"><li>Ice blocks the Clark Fork River: Lake Missoula fills behind a dam up to about 600 m high.</li><li>The dam floats and fails; the lake empties in days and water races across the plateau.</li><li>The flood strips soil, plucks basalt and cuts coulees and cataracts such as Dry Falls.</li><li>Wallula Gap chokes the flow: water ponds, drops layered silts, then runs to the Pacific.</li><li>The cycle repeats about 40 times. Carlson proposes extra meltwater from the ice sheet.</li></ol><figcaption>A simplified map of the Pacific Northwest showing how glacial Lake Missoula filled, burst and crossed eastern Washington, repeated about 40 times. <span class="wx-src">Based on: Outlines simplified after Bjornstad 2006 and the Ice Age Floods Institute maps; lake volume and dam height after Pardee 1942 and Bjornstad 2006; flood count Waitt 1980; dates Balbas et al. 2017. Ice margin generalised for the last glacial maximum.</span></figcaption><p class="vh">A simplified map of Washington, northern Idaho and western Montana, with the Pacific coast on the left and the Cordilleran ice sheet across the top. Step 1 shows glacial Lake Missoula in western Montana, held back by an ice dam up to about 600 metres high, holding up to about 2,500 cubic kilometres. Step 2 shows the dam failing and flood water racing west past Spokane in three broad tracts. Step 3 labels the Channeled Scablands and Dry Falls, 5.6 kilometres wide and about 120 metres high. Step 4 shows water ponding behind Wallula Gap in temporary Lake Lewis, laying down layered silts, then running through the Columbia Gorge to the Pacific. Step 5 marks the cycle repeating 40 or more times between about 18,000 and 14,700 years ago, and notes Randall Carlson&#x27;s proposal of extra meltwater from the ice sheet itself.</p></figure><p>Ice is lighter than water. When the lake grew deep enough, roughly nine-tenths of the dam&#x27;s height, the ice began to float, water forced its way underneath, and the dam failed. The lake emptied in a matter of days. The water tore across the Spokane area, stripped away the soil down to bedrock, plucked out blocks of columnar basalt and cut the coulees. At Wallula Gap, a narrow pass on the Columbia, it backed up into a temporary lake and dropped layers of silt before racing down the Columbia Gorge to the Pacific.</p><aside class="wcall"><b>How do we know there were many floods?</b><p>In 1980 Richard Waitt described about 40 stacked beds of sand and silt in the Touchet Formation, each coarse at the bottom and fine at the top, the signature of one flood. Between the beds he found burrows made by animals, cracks where the mud had dried, and layers of ash from Mount St Helens. Each bed was left by a separate flood, with years or decades between them, as the ice re-advanced and the lake refilled.</p></aside></section><section class="wsec" id="channeled-scablands-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>How big were the floods?</h3><p>Numbers for the peak flow depend on the method. Assuming the canyons ran full to the brim, Jim O&#x27;Connor and Victor Baker (1992) estimated a peak discharge of about 17 million cubic metres per second where the water left the lake, more than ten times the combined flow of all the world&#x27;s rivers today. In 2016 Isaac Larsen and Michael Lamb argued that canyons in fractured basalt deepen until the water only just has the force to erode them, so the floods never filled the final canyons to the brim. For Moses Coulee they found near-constant flows five to ten times smaller than full-to-the-brim estimates.</p><figure class="wx wx--static" id="channeled-scablands-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">Dry Falls and Niagara, to one scale</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Dry Falls and Niagara, to one scale"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" class="wx-svg" role="img" aria-labelledby="channeled-scablands-f2-t"><title id="channeled-scablands-f2-t">Dry Falls in Washington drawn to the same scale as the Horseshoe Falls at Niagara: 5.6 kilometres wide against 0.82, and about 121 metres high against 51</title><text x="24" y="26" class="wx-t-cap">Two waterfalls to one scale · heights exaggerated five times</text><rect x="40" y="107.5" width="600.0" height="64.5" class="wx-rock wx-grow" style="--d:1"/><polyline points="40.0,107.5 100.0,113.5 160.0,107.5 220.0,113.5 280.0,107.5 340.0,113.5 400.0,107.5 460.0,113.5 520.0,107.5 580.0,113.5 640.0,107.5" class="wx-line wx-draw" pathLength="1" style="--d:3"/><line x1="61.4" y1="117.5" x2="61.4" y2="172" class="wx-edge-soft wx-o40"/><line x1="82.9" y1="117.5" x2="82.9" y2="172" class="wx-edge-soft wx-o40"/><line x1="104.3" y1="117.5" x2="104.3" y2="172" class="wx-edge-soft wx-o40"/><line x1="125.7" y1="117.5" x2="125.7" y2="172" class="wx-edge-soft wx-o40"/><line x1="147.1" y1="117.5" x2="147.1" y2="172" class="wx-edge-soft wx-o40"/><line x1="168.6" y1="117.5" x2="168.6" y2="172" class="wx-edge-soft wx-o40"/><line x1="190.0" y1="117.5" x2="190.0" y2="172" class="wx-edge-soft wx-o40"/><line x1="211.4" y1="117.5" x2="211.4" y2="172" class="wx-edge-soft wx-o40"/><line x1="232.9" y1="117.5" x2="232.9" y2="172" class="wx-edge-soft wx-o40"/><line x1="254.3" y1="117.5" x2="254.3" y2="172" class="wx-edge-soft wx-o40"/><line x1="275.7" y1="117.5" x2="275.7" y2="172" class="wx-edge-soft wx-o40"/><line x1="297.1" y1="117.5" x2="297.1" y2="172" class="wx-edge-soft wx-o40"/><line x1="318.6" y1="117.5" x2="318.6" y2="172" class="wx-edge-soft wx-o40"/><line x1="340.0" y1="117.5" x2="340.0" y2="172" class="wx-edge-soft wx-o40"/><line x1="361.4" y1="117.5" x2="361.4" y2="172" class="wx-edge-soft wx-o40"/><line x1="382.9" y1="117.5" x2="382.9" y2="172" class="wx-edge-soft wx-o40"/><line x1="404.3" y1="117.5" x2="404.3" y2="172" class="wx-edge-soft wx-o40"/><line x1="425.7" y1="117.5" x2="425.7" y2="172" class="wx-edge-soft wx-o40"/><line x1="447.1" y1="117.5" x2="447.1" y2="172" class="wx-edge-soft wx-o40"/><line x1="468.6" y1="117.5" x2="468.6" y2="172" class="wx-edge-soft wx-o40"/><line x1="490.0" y1="117.5" x2="490.0" y2="172" class="wx-edge-soft wx-o40"/><line x1="511.4" y1="117.5" x2="511.4" y2="172" class="wx-edge-soft wx-o40"/><line x1="532.9" y1="117.5" x2="532.9" y2="172" class="wx-edge-soft wx-o40"/><line x1="554.3" y1="117.5" x2="554.3" y2="172" class="wx-edge-soft wx-o40"/><line x1="575.7" y1="117.5" x2="575.7" y2="172" class="wx-edge-soft wx-o40"/><line x1="597.1" y1="117.5" x2="597.1" y2="172" class="wx-edge-soft wx-o40"/><line x1="618.6" y1="117.5" x2="618.6" y2="172" class="wx-edge-soft wx-o40"/><line x1="20" y1="172" x2="700" y2="172" class="wx-line"/><path d="M40,99.5 H640.0" class="wx-flow wx-s2" style="stroke-width:3"/><text x="340.0" y="87.5" text-anchor="middle" class="wx-t-s wx-halo">flood water once poured over this whole lip (depth not drawn)</text><text x="340.0" y="143.8" text-anchor="middle" class="wx-t-h wx-halo">Dry Falls, Washington</text><rect x="40" y="216.8" width="87.4" height="27.2" class="wx-rock wx-grow" style="--d:5"/><path d="M40,212.8 H127.4" class="wx-flow wx-s2" style="stroke-width:2.4"/><line x1="20" y1="244" x2="700" y2="244" class="wx-thin"/><g class="wx-pop" style="--d:6"><text x="139.4" y="228.4" class="wx-t-b">Horseshoe Falls, Niagara</text><text x="139.4" y="243.4" class="wx-t-s">0.82 km wide · 51 m high · still flowing</text></g><g class="wx-pop" style="--d:4"><line x1="40" y1="188" x2="640.0" y2="188" class="wx-dim"/><line x1="40" y1="184" x2="40" y2="192" class="wx-dim"/><line x1="640.0" y1="184" x2="640.0" y2="192" class="wx-dim"/><text x="340.0" y="202" text-anchor="middle" class="wx-t-n">5.6 km</text></g><g class="wx-pop" style="--d:4"><line x1="654.0" y1="107.5" x2="654.0" y2="172" class="wx-dim"/><line x1="650.0" y1="107.5" x2="658.0" y2="107.5" class="wx-dim"/><line x1="650.0" y1="172" x2="658.0" y2="172" class="wx-dim"/><text x="660.0" y="143.8" class="wx-t-n">121 m</text></g><g><rect x="40" y="278" width="106.6" height="5" class="wx-inkfill"/><text x="40" y="273" class="wx-t-s">0</text><text x="146.6" y="273" text-anchor="middle" class="wx-t-s">1 km</text><text x="176.6" y="283" class="wx-t-s">horizontal scale; crest outline schematic</text></g></svg></div></div><figcaption>The dry cataract carved by the Missoula floods, drawn at the same scale as Niagara&#x27;s Horseshoe Falls. Heights are exaggerated five times so they can be seen. <span class="wx-src">Based on: Dry Falls: 3.5 miles wide, 400 ft high (Washington State Parks). Horseshoe Falls: 820 m crest, 51 m high. Crest outline schematic; vertical exaggeration ×5.</span></figcaption><p class="vh">Two waterfalls drawn as front elevations at the same horizontal scale. Above, Dry Falls in Washington spans 5.6 kilometres with a lip about 121 metres high, marked with dimension lines, with a note that flood water once poured over the whole lip. Below, Niagara&#x27;s Horseshoe Falls is a small block 0.82 kilometres wide and 51 metres high. A one-kilometre scale bar sits at the bottom. Heights are exaggerated five times.</p></figure><p>Even the smaller numbers are staggering, and the timing is clear. Beryllium-10, which builds up in rock surfaces exposed to cosmic rays, dates one major flood to about 18,200 years ago and the last Missoula floods to about 14,700 years ago, with a few later floods from glacial Lake Columbia. In 2022 Tamara Pico and colleagues added a twist: the weight of the ice sheet had tilted the crust by tens to hundreds of metres, steering later floods into different channels. The Ice Age landscape was not the one we see today.</p></section><section class="wsec" id="channeled-scablands-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Carlson&#x27;s case at its strongest</h3><p>Carlson does not deny the floods; he celebrates them. His challenge is to what fed them. On Kosmographia he has argued that a century of studying glacial outburst floods offers nothing like an ice dam holding back a lake some 600 m deep, so the standard story rests on an extrapolation far beyond anything observed. He proposes that much of the water came from sudden melting of the ice sheet itself, and in Ancient Apocalypse he and Hancock linked that melting to the cosmic impact proposed for the start of the Younger Dryas, about 12,900 years ago.</p><p>His strongest ground is historical. The experts who opposed Bretz were not stupid; they were defending a rule that had served geology well. It still took them some forty years to accept what the ground was showing. And there are real open questions about sources: in 1999 John Shaw and colleagues argued that some water may have come from reservoirs beneath the ice sheet, and later floods did come from Lake Columbia, not Missoula.</p><blockquote class="wpull"><p>Bretz won because he followed the ground. Any later theory has to win the same way.</p></blockquote></section><section class="wsec" id="channeled-scablands-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Where the extra step falters</h3><p>The difficulty is the dates. The Missoula floods ran from roughly 18,000 to 14,700 years ago, ending more than 1,500 years before the Younger Dryas began. The Touchet beds, with their burrows and ash between floods, record dozens of separate events spread over centuries or more, not one or two great surges. Lake Missoula&#x27;s shorelines, still visible on Mount Sentinel and Mount Jumbo above Missoula, show a real lake rising and falling, and the ripples on its bed show it drained quickly. Surface melting on the scale Carlson proposes would be expected to leave its own signals in ocean cores and sea-level records, and none has been tied to these floods.</p><p>That does not settle the wider comet debate, which has its own case on this site (see the Younger Dryas Comet), nor does it mean the ice-dam model is complete. It means that the Scablands support catastrophe and do not, on present evidence, support a cosmic trigger for these particular floods.</p></section><section class="wsec" id="channeled-scablands-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What time has hidden, and what would settle the rest</h3><p>Much is gone for good. The ice dam melted away, each flood erased part of the record of the last, and the crust has flexed beneath the routes. There is also a human question nobody can yet answer. At Cooper&#x27;s Ferry in western Idaho, people were making stone tools by about 16,000 years ago, not far from the flood route. Did anyone see a wall of water come down the valleys? No site has been found beneath the flood deposits, but almost none of them has been searched.</p><p>The core claim, Bretz&#x27;s claim, is as well supported as anything in geology: repeated catastrophic floods carved the Scablands in geological moments. What remains open is how large the biggest floods were, how many were truly huge, and whether any water came from sources other than the lake. More exposure dates, better flood models on the tilted Ice Age landscape, and chemical fingerprints that can tell lake water from ice-sheet melt would narrow those questions, and a flood securely dated to 12,900 years ago would reopen Carlson&#x27;s.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">16,200 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">A major Missoula flood, dated by beryllium-10</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">12,750 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Last Missoula floods cross the Scablands</span></li><li class="wtl-study" style="--i:2"><span class="wtl-y">1923 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Bretz publishes &#x27;The Channeled Scabland&#x27;</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">1927 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Bretz faces his critics in Washington, D.C.</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">1942 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Pardee describes Lake Missoula&#x27;s giant ripples</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">1965 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Visiting geologists telegram Bretz: &#x27;We are all now catastrophists!&#x27;</span></li><li class="wtl-event" style="--i:6"><span class="wtl-y">1979 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Bretz receives the Penrose Medal</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">1980 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Waitt counts about 40 floods</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2017 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Beryllium-10 dates for the floods</span></li><li class="wtl-event" style="--i:9"><span class="wtl-y">2022 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Ancient Apocalypse tours the Scablands with Carlson</span></li></ol><details class="srcs"><summary>Sources for this case (15)</summary><ol><li>Bretz, J H. (1923). The Channeled Scabland of the Columbia Plateau. Journal of Geology 31(8): 617–649. <a href="https://doi.org/10.1086/623053" target="_blank" rel="noopener">doi:10.1086/623053</a></li><li>Pardee, J. T. (1942). Unusual currents in glacial Lake Missoula, Montana. Geological Society of America Bulletin 53(11): 1569–1600.</li><li>Baker, V. R. (1973). Paleohydrology and sedimentology of Lake Missoula flooding in eastern Washington. Geological Society of America Special Paper 144.</li><li>Waitt, R. B. (1980). About forty last-glacial Lake Missoula jökulhlaups through southern Washington. Journal of Geology 88(6): 653–679. <a href="https://doi.org/10.1086/628553" target="_blank" rel="noopener">doi:10.1086/628553</a></li><li>O&#x27;Connor, J. E. &amp; Baker, V. R. (1992). Magnitudes and implications of peak discharges from glacial Lake Missoula. Geological Society of America Bulletin 104(3): 267–279.</li><li>Shaw, J. et al. (1999). The Channeled Scabland: back to Bretz? Geology 27(7): 605–608.</li><li>Larsen, I. J. &amp; Lamb, M. P. (2016). Progressive incision of the Channeled Scablands by outburst floods. Nature 538: 229–232. <a href="https://doi.org/10.1038/nature19817" target="_blank" rel="noopener">doi:10.1038/nature19817</a></li><li>Balbas, A. M., Barth, A. M., Clark, P. U., Clark, J., Caffee, M., O&#x27;Connor, J., Baker, V. R., Konrad, K. &amp; Bjornstad, B. (2017). 10Be dating of late Pleistocene megafloods and Cordilleran Ice Sheet retreat in the northwestern United States. Geology 45(7): 583–586. <a href="https://doi.org/10.1130/G38956.1" target="_blank" rel="noopener">doi:10.1130/G38956.1</a></li><li>Pico, T., David, S. R., Larsen, I. J., Mix, A. C., Lehnigk, K. E. &amp; Lamb, M. P. (2022). Glacial isostatic adjustment directed incision of the Channeled Scabland by Ice Age megafloods. PNAS 119(8): e2109502119. <a href="https://doi.org/10.1073/pnas.2109502119" target="_blank" rel="noopener">doi:10.1073/pnas.2109502119</a></li><li>Davis, L. G. et al. (2019). Late Upper Paleolithic occupation at Cooper&#x27;s Ferry, Idaho, USA, ~16,000 years ago. Science 365(6456): 891–897. <a href="https://doi.org/10.1126/science.aax9830" target="_blank" rel="noopener">doi:10.1126/science.aax9830</a></li><li>Bjornstad, B. (2006). On the Trail of the Ice Age Floods: A Geological Field Guide to the Mid-Columbia Basin. Keokee Books, Sandpoint.</li><li>Soennichsen, J. (2008). Bretz&#x27;s Flood: The Remarkable Story of a Rebel Geologist and the World&#x27;s Greatest Flood. Sasquatch Books, Seattle.</li><li>University of Chicago Magazine (2009). Legacy: J Harlen Bretz (1882–1981).</li><li>Carlson, R. Kosmographia podcast, episode #044 &#x27;Megafloods: Missoula, Lake Agassiz and Mars&#x27; (2020) and episode #071 &#x27;Pressure: enemy of glacial ice dams / outburst floods&#x27;. randallcarlson.com.</li><li>Ancient Apocalypse, season 1, episode 8, &#x27;Cataclysm and Rebirth&#x27;. Netflix, 2022.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-channeled-scablands" data-t="The Channeled Scablands: The Flood Geologists Laughed At"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Channeled Scablands: The Flood Geologists Laughed At</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-channeled-scablands</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-taurid-stream-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Tunguska Ereignis-1.jpg" data-cap="Tunguska airburst site, Krasnoyarsk Krai, Siberia, Russia" data-big><figcaption></figcaption></figure><div class="sh-k">Floods, Fire and Ice</div><h2 class="sh-t" id="case-taurid-stream-st" tabindex="-1">The Taurid Stream: A Giant Comet Still Breaking Up?</h2><p class="sh-s">Every autumn Earth ploughs through the debris of a comet. Some astronomers argue that it was once a giant, and that its fragments changed history.</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> The Taurid Complex is the debris of a giant comet, 50–100 km across, that broke up within the last 20,000–30,000 years and bombarded Earth at the start of the Younger Dryas.</p></div><p class="v4-q">Is the Taurid stream the wreck of a giant comet that struck our ancestors?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Twice a year Earth crosses the debris of comet Encke: the Taurid meteor streams.</li><li>Part of the stream is bunched into a swarm; in 2015 Earth crossed it and cameras caught 144 fireballs.</li><li>Some argue the swarm is the wreck of a giant comet that bombarded Earth at the start of the Younger Dryas.</li><li>Surveys in 2025 found only about 9 to 14 bodies over 100 metres in the swarm, fitting a parent near 10 kilometres, not 50 to 100.</li><li>The swarm and its hazard are real; the giant comet awaits evidence, and the swarm returns close in 2032 and 2036.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Astronomy</span><span class="thr">Physics</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="3.3" data-dec="1">3.3</b><span class="ctr-u"> years</span></div><div class="ctr-l">Encke&#x27;s orbit around the Sun, one of the shortest of any known comet</div><div class="ctr-c">comet catalogues</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="2150" >2,150</b><span class="ctr-u"> km²</span></div><div class="ctr-l">forest flattened by the Tunguska airburst, 1908</div><div class="ctr-c">Tunguska studies</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="144" >144</b><span class="ctr-u"> fireballs</span></div><div class="ctr-l">Taurid fireballs recorded in the 2015 swarm outburst</div><div class="ctr-c">Spurný et al. 2017</div></div><div class="ctr"><div class="ctr-v">no more than c. <b class="ctr-n" data-v="14" >14</b><span class="ctr-u"> bodies</span></div><div class="ctr-l">largest possible count of objects over c. 100 m in the swarm</div><div class="ctr-c">Li et al. 2025</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="2032" >2,032</b><span class="ctr-u"> </span></div><div class="ctr-l">next close pass of the swarm, followed by 2036</div><div class="ctr-c">Boslough et al. 2026</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The Taurid Complex is the debris of a giant comet, 50–100 km across, that broke up within the last 20,000–30,000 years and bombarded Earth at the start of the Younger Dryas.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Part of the picture is real and well measured: Encke&#x27;s stream, a resonant swarm, and asteroids hundreds of metres across within it. That is a genuine, underrated hazard. But the giant comet is not supported by current data. Surveys in 2025 found no more than about 9–14 large bodies in the swarm, consistent with a parent near 10 km; the orbital links may be coincidence; and Tunguska&#x27;s orbit looks asteroidal. The Younger Dryas bombardment has not been confirmed by independent tests. The claim awaits discovery rather than being ruled out.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Astronomy textbooks treat impact risk as a steady random rain and usually mention the Taurids only as a pretty autumn shower. That is broadly right about the long-term average, but it undersells what is known about clumped streams and the 2015 swarm, which specialists now take seriously enough to plan surveys for 2032 and 2036. On the giant comet and prehistoric bombardment, the textbooks&#x27; silence matches the weak evidence.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Comet Encke, with a nucleus about 4.8 km across and an orbit of 3.3 years, is the parent of the Taurid meteor showers. Earth crosses its debris twice a year: the night-time Taurids of October and November and the daytime Beta Taurids of late June and July.<small>Whipple 1940; Fernández et al. 2000</small></li><li>Part of the stream is bunched into a swarm by a 7:2 resonance with Jupiter. In 2015 Earth passed close to it and a network of cameras recorded an outburst of 144 Taurid fireballs, defining a new branch that also contains asteroids 2015 TX24 and 2005 UR, each some 200–300 m across.<small>Spurný et al. 2017</small></li><li>On 30 June 1908 an object exploded over Tunguska in Siberia and flattened about 2,150 km² of forest without leaving a crater; energy estimates range from about 3 to tens of megatons.<small>Boslough and Crawford 2008; Tunguska studies</small></li><li>Victor Clube and William Napier proposed from 1982 that the Taurid Complex is the remains of a giant comet whose fragments arrive in bursts, an idea they called coherent catastrophism. In 2010 Napier linked the debris of a 50–100 km comet to the proposed catastrophe of 12,900 years ago.<small>Clube and Napier 1982, 1990; Asher et al. 1994; Napier 2010</small></li><li>Telescope surveys published in 2025 found no more than about 9–14 bodies larger than about 100 m in the resonant swarm, and suggest a parent body nearer 10 km than 50–100 km.<small>Li et al. 2025; Wiegert et al. 2025</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the asteroids associated with the Taurids truly broke off the same parent as Encke: some orbits converge around 3200 BCE, but ordinary gravitational dynamics can produce similar orbits without a common origin.</li><li>Whether the Tunguska object belonged to the Taurid stream: it arrived in the Beta Taurid season, but orbital modelling favours an asteroid-like path.</li><li>How old the complex is and how big its parent was: estimates range from a few thousand to about 20,000–30,000 years, and from about 10 km to 100 km.</li><li>Whether Taurid debris caused the Younger Dryas catastrophe proposed by the Comet Research Group, and whether autumn festivals of the dead remember Taurid bombardments.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>The parent comet, if it was a giant, has dispersed; its history must be reconstructed from the orbits of what remains.</li><li>Dark, small fragments are hard to see, and the daytime Beta Taurids approach from the Sun&#x27;s direction, where telescopes cannot search.</li><li>Airbursts like Tunguska leave no crater, and their scorched ground and melt debris fade within centuries, so ancient ones are easily missed.</li><li>Ancient sky records are scattered and ambiguous, so a bombardment in prehistory could leave little trace in human memory we can read.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Meteor and asteroid specialists accept most of the physical picture: the Taurids come from Encke, a resonant swarm exists, and Earth meets it in some years, as in 2015. They are more cautious about the rest. Most estimate impact risk as a background of random events, and the orbital links between the Taurid asteroids and Encke may be coincidence. The 2025 surveys found far fewer large bodies in the swarm than a 50–100 km parent would predict. A 2026 paper by Mark Boslough and colleagues nonetheless urged targeted searches in November 2032 and June 2036, when Earth next passes near the swarm, to test whether the Taurids add a clustered component to impact risk.</p><ul><li>The 2015 fireball outburst and its 7:2 resonance confirm that a swarm exists.</li><li>Orbital convergence of Taurid asteroids around 3200 BCE fits a breakup 5,000–6,000 years ago, but dynamics alone may explain it; spectra are needed.</li><li>No more than about 9–14 bodies over 100 m sit in the swarm, a parent perhaps 10 km across.</li><li>Tunguska&#x27;s orbit is more likely asteroidal than cometary, about 83 percent to 17 percent in one modelling study.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Carlson presents the Taurids as the missing mechanism behind the catastrophes he reads in the landscape. Following Clube and Napier, he argues that Earth&#x27;s orbit crosses the debris of a once-giant comet, that the debris is clumped, so danger comes in bursts rather than at random, and that a dense encounter about 12,900 years ago set off the Younger Dryas. He points out that Earth still meets the stream in late June, the month of Tunguska, and again around the end of October, and he suggests that festivals of the dead held worldwide at that season preserve a memory of fire from the sky.</p><ul><li>The Taurid Complex holds a comet, many asteroids and a resonant swarm on similar orbits, the pattern expected from a giant comet breaking up in stages.</li><li>Tunguska shows that a body a few tens of metres wide can flatten a forest the size of a city region without leaving a crater.</li><li>Because the swarm is clumped by Jupiter, impacts should come in clusters, which random-risk models can miss.</li><li>Napier&#x27;s 2010 paper in a leading astronomy journal ties the Taurid Complex directly to a catastrophe 12,900 years ago.</li></ul><div class="face-s"><b>Its strongest point</b><p>The core idea is mainstream enough to be tested: a resonant Taurid swarm exists, it contains asteroids hundreds of metres across, and specialists now call for surveys at its 2032 and 2036 returns because clustered risk might be underestimated.</p></div><p class="face-cr"><b>Credit</b> Randall Carlson, on his Kosmographia podcast (episode #013 on the Taurids and the Younger Dryas extinction), in talks on the Taurids and autumn festivals of the dead (Cosmic Tusk, 2019) and on The Joe Rogan Experience #961 (May 2017, with Graham Hancock against Michael Shermer); Victor Clube and William Napier (The Cosmic Serpent, 1982; The Cosmic Winter, 1990); Martin Sweatman; the Comet Research Group</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Dedicated telescope surveys during the swarm returns of November 2032 and June 2036, counting bodies down to tens of metres.</li><li>Spectra of the Taurid-linked asteroids, to see whether they share Encke&#x27;s composition or are an unrelated mix.</li><li>Better orbital modelling that can separate a common breakup from chance convergence, and date any breakup.</li><li>Material from the Younger Dryas boundary with a verified cometary signature, found and confirmed by independent laboratories.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">6 min read · 1,341 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Taurid Stream: A Giant Comet Still Breaking Up?"><button type="button" class="wtoc-i" data-go="taurid-stream-s1">A shower with a past</button><button type="button" class="wtoc-i" data-go="taurid-stream-s2">The comet and its stream</button><button type="button" class="wtoc-i" data-go="taurid-stream-s3">Coherent catastrophism</button><button type="button" class="wtoc-i" data-go="taurid-stream-s4">Tunguska: a Taurid?</button><button type="button" class="wtoc-i" data-go="taurid-stream-s5">Weighing the giant comet</button><button type="button" class="wtoc-i" data-go="taurid-stream-s6">What the sky hides</button><button type="button" class="wtoc-i" data-go="taurid-stream-s7">The verdict, and the next test</button></nav></div><section class="wsec" id="taurid-stream-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A shower with a past</h3><p>Every year from late October into November, slow, bright fireballs cross the night sky. They are the Taurids, debris of comet Encke, and in some years they come in unusual numbers. Around Halloween in 2005, and again in 2015, observers across the world recorded outbursts of spectacular fireballs. Most Taurid meteoroids are grains and pebbles that burn up harmlessly. The question is whether the stream also carries something larger, and whether it once carried far more.</p><p>Randall Carlson thinks it did. In talks and on his Kosmographia podcast he presents the Taurids as the engine of the catastrophes he reads in the landscape: the debris of a once-giant comet, still crossing Earth&#x27;s path, which struck with devastating force about 12,900 years ago. He even suggests that the festivals of the dead held around the end of October in many cultures carry a faint memory of fire from the sky. It is a big, dramatic idea, and unlike many, it rests on a real body of astronomy.</p><blockquote class="wpull"><p>The Taurids are the rare catastrophe theory with a named suspect, a known orbit and a date for the next encounter.</p></blockquote></section><section class="wsec" id="taurid-stream-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The comet and its stream</h3><p>Comet Encke has one of the shortest orbits of any known comet: it swings from inside the orbit of Mercury out to the asteroid belt every 3.3 years. Its nucleus is about 4.8 km across. Over thousands of years it has shed dust and rock along its path, spreading into a broad, braided stream, which Earth crosses twice a year. In October and November we meet it at night and see the Taurids. In late June and July we meet it on the daylight side, where the Beta Taurids arrive from the direction of the Sun and are detected only by radar.</p><figure class="wx wx--steps" id="taurid-stream-f1" data-n="4"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">Where Earth meets the Taurids</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Where Earth meets the Taurids"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" class="wx-svg" role="img" aria-labelledby="taurid-stream-f1-t"><title id="taurid-stream-f1-t">The orbits of Earth, comet Encke and Jupiter, showing where Earth meets the Taurid stream, the resonant swarm, the proposed giant parent comet and what recent tests found, in four steps</title><text x="24" y="26" class="wx-t-cap">The Taurid stream · orbits to scale, flattened into one plane</text><polyline points="510.5,85.0 513.4,91.5 516.1,98.1 518.7,1  wx-hide" data-only="3"><circle cx="600" cy="474" r="46" class="wx-dash"/><text x="600" y="420" text-anchor="middle" class="wx-t-b wx-halo">Proposed giant parent (Napier 2010)</text><text x="600" y="478" text-anchor="middle" class="wx-t-s wx-halo">50–100 km comet,</text><text x="600" y="492" text-anchor="middle" class="wx-t-s wx-halo">breaking up</text><text x="600" y="540" text-anchor="middle" class="wx-t-s wx-halo">over 20,000–30,000 years into Encke,</text><text x="600" y="554" text-anchor="middle" class="wx-t-s wx-halo">asteroids and meteoroids; proposed to</text><text x="600" y="568" text-anchor="middle" class="wx-t-s wx-halo">have struck Earth c. 12,900 years ago</text></g><g class="wx-st wx-hide" data-only="3"><circle cx="628.7" cy="481.1" r="5" class="wx-accfill wx-o60 wx-bob" style="--d:0"/><circle cx="586.7" cy="497.3" r="4" class="wx-accfill wx-o60 wx-bob" style="--d:1"/><circle cx="574.9" cy="464.1" r="6" class="wx-accfill wx-o60 wx-bob" style="--d:2"/><circle cx="606.3" cy="447.3" r="3" class="wx-accfill wx-o60 wx-bob" style="--d:3"/><circle cx="617.2" cy="501.1" r="2.5" class="wx-accfill wx-o60 wx-bob" style="--d:4"/><circle cx="562.3" cy="484.7" r="2" class="wx-accfill wx-o60 wx-bob" style="--d:5"/></g><g class="wx-st wx-hide" data-only="3"><line x1="170.8" y1="322.8" x2="60" y2="522" class="wx-thin"/><text x="24" y="536" class="wx-t-b wx-halo">30 June 1908: Tunguska airburst</text><text x="24" y="550" class="wx-t-s wx-halo">during the Beta Taurid season (Kresák 1978);</text><text x="24" y="564" class="wx-t-s wx-halo">its orbit is more likely asteroidal (Farinella 2001)</text></g><g class="wx-st wx-hide" data-only="4"><rect x="452" y="400" width="250" height="176" rx="8" class="wx-card wx-edge-soft"/><text x="466" y="424" class="wx-t-b">What the tests found</text><text x="466" y="446" class="wx-t-s">2015: a swarm branch with two</text><text x="466" y="460" class="wx-t-s">asteroids of 200–300 m (Spurný 2017)</text><text x="466" y="482" class="wx-t-s">Orbits converge c. 3200 BCE, but</text><text x="466" y="496" class="wx-t-s">chance dynamics may explain it (Egal 2021)</text><text x="466" y="518" class="wx-t-s">2025 surveys: at most 9–14 bodies</text><text x="466" y="532" class="wx-t-s">over 100 m in the swarm; parent</text><text x="466" y="546" class="wx-t-s">perhaps c. 10 km, not 50–100 km</text><text x="466" y="564" class="wx-t-s">(Li et al. 2025; Wiegert et al. 2025)</text></g><g><rect x="24" y="470" width="78.0" height="5" class="wx-inkfill"/><text x="24" y="465" class="wx-t-s">0</text><text x="102.0" y="465" text-anchor="middle" class="wx-t-s">1 AU</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 4.</b> Earth crosses Encke&#x27;s debris twice a year: the Taurids in autumn, the daytime Beta Taurids in summer.</p><ol class="wx-steplist"><li>Earth crosses Encke&#x27;s debris twice a year: the Taurids in autumn, the daytime Beta Taurids in summer.</li><li>Jupiter bunches part of the debris into a resonant swarm, met in 2005 and 2015 and next in 2032 and 2036.</li><li>A proposed 50–100 km parent comet breaking up in stages; Tunguska fell in the Beta Taurid season.</li><li>The tests: large asteroids in the swarm, but fewer than a giant parent predicts, and links that may be chance.</li></ol><figcaption>The orbits of Earth, comet Encke and Jupiter drawn to scale and flattened into one plane, with the resonant swarm, the proposed giant parent comet and what recent tests found. <span class="wx-src">Based on: Orbit of 2P/Encke: a = 2.215 AU, e = 0.848 (JPL Small-Body Database); Jupiter 5.2 AU. Orbits projected into one plane (Encke&#x27;s inclination c. 12°); orientation schematic. Swarm: Asher and Clube 1993; Spurný et al. 2017; Boslough et al. 2026. Parent: Napier 2010; Li et al. 2025.</span></figcaption><p class="vh">A diagram of the inner solar system drawn to scale in astronomical units, with the orbits shown flattened into one plane. The Sun sits at left with Earth&#x27;s circular orbit around it. Comet Encke&#x27;s long ellipse stretches from inside Earth&#x27;s orbit out towards Jupiter, whose orbit is a dashed arc at 5.2 AU. Step 1 marks the two points where Earth crosses the stream: the night-time Taurids of October and November and the daytime Beta Taurids of June and July, which come from the Sun&#x27;s direction. Step 2 adds a clump of debris on Encke&#x27;s orbit, the resonant swarm held by a 7 to 2 resonance with Jupiter, met in 2005 and 2015 and next in 2032 and 2036. Step 3 shows the proposed giant parent comet, 50 to 100 kilometres across, breaking up, and marks the Tunguska airburst of 30 June 1908 in the Beta Taurid season. Step 4 lists the test results: 200 to 300 metre asteroids in the swarm, an orbital convergence around 3200 BCE that may be chance, and 2025 surveys limiting large bodies and suggesting a parent near 10 kilometres.</p></figure><p>Part of the stream is not spread evenly. Jupiter&#x27;s gravity herds some of the debris into a clump, the Taurid resonant swarm, whose members complete seven orbits for every two of Jupiter&#x27;s. David Asher and Victor Clube modelled this swarm in the early 1990s, and later work predicted the years when Earth would pass close to it. In 2015 such a pass came. Cameras of the European Fireball Network recorded 144 Taurid fireballs in the swarm, and Pavel Spurný and colleagues found that the new branch shares its orbit with two asteroids, 2015 TX24 and 2005 UR, each about 200–300 m across.</p></section><section class="wsec" id="taurid-stream-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Coherent catastrophism</h3><p>The bold reading comes from two British astronomers, Victor Clube and William Napier. In The Cosmic Serpent (1982) and The Cosmic Winter (1990) they argued that giant comets are occasionally thrown into the inner solar system, where they break up in stages. For thousands of years afterwards, their fragments and dust share similar orbits, so Earth meets them in bursts, at the same time of year, for centuries at a time. They called this coherent catastrophism, and they proposed that the Taurid Complex, Encke and the asteroids on similar orbits are the wreck of such a comet.</p><p>In 2010 Napier took the idea back to the end of the Ice Age. In a paper in Monthly Notices of the Royal Astronomical Society he proposed that Earth ran into the debris of a comet 50–100 km across, and that this &#x27;provides a satisfactory explanation&#x27; for the catastrophe of celestial origin proposed for about 12,900 years ago, with the Taurid Complex as that comet&#x27;s remains. Carlson, Graham Hancock and the Comet Research Group have made this the astronomical backbone of the Younger Dryas impact story.</p><aside class="wcall"><b>Why clumping matters</b><p>Most estimates of impact risk treat hits as independent random events, like raindrops. If debris is bunched in resonant swarms, risk is not spread evenly: it rises in certain years and at certain times of year, and falls in between. The average might barely change, but the chance of several strikes in a short window would be higher than a random model predicts. That is the testable core of coherent catastrophism.</p></aside></section><section class="wsec" id="taurid-stream-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Tunguska: a Taurid?</h3><p>On the morning of 30 June 1908 something exploded several kilometres above the Siberian forest near the Podkamennaya Tunguska river. The blast flattened about 2,150 km² of trees in a butterfly-shaped pattern some 70 km across, yet when Leonid Kulik&#x27;s expedition reached the site in 1927 it found no crater. Most modern estimates put the object at a few tens of metres across, perhaps 50–60 m, with an energy of about 3 to tens of megatons.</p><p>The date is suggestive: 30 June falls in the Beta Taurid season. In 1978 the Slovak astronomer Ľubor Kresák proposed that the Tunguska object was a fragment of comet Encke. It is a natural link for Carlson&#x27;s argument. But in 2001 Paolo Farinella and colleagues modelled the possible orbits from eyewitness and damage data and found an asteroid-like path about 83 percent likely, against 17 percent for a comet. The Taurid connection remains possible, not established.</p></section><section class="wsec" id="taurid-stream-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Weighing the giant comet</h3><p>Some tests have gone the challengers&#x27; way. The swarm exists, it contains asteroids hundreds of metres across, and in 2021 Auriane Egal and colleagues found that Encke and several Taurid asteroids had orbits that converged around 3200 BCE, compatible with a breakup of a larger body 5,000–6,000 years ago. The same paper warned that ordinary dynamics could produce this convergence without any common origin, and that spectra of the asteroids are needed to tell the difference. That date is also far younger than the 20,000–30,000 years of Napier&#x27;s model.</p><aside class="wcall"><b>Fresh from the field</b><p>In 2025 two teams went looking for large bodies in the swarm. Jasmine Li, Quanzhi Ye and colleagues used the Zwicky Transient Facility and found none, setting a limit of about 9–14 objects larger than about 100 m, which they judged consistent with a parent comet around 10 km across. Paul Wiegert and colleagues searched with the Canada-France-Hawaii Telescope down to objects of roughly 50–75 m and concluded that the swarm&#x27;s mass does not require an outsize parent.</p></aside><figure class="wx wx--static" id="taurid-stream-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">From fireball to giant comet: the sizes at stake</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="From fireball to giant comet: the sizes at stake"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" class="wx-svg" role="img" aria-labelledby="taurid-stream-f2-t"><title id="taurid-stream-f2-t">Sizes on a logarithmic scale from 10 metres to 100 kilometres: the Chelyabinsk and Tunguska objects, Taurid swarm asteroids, comet Encke, and two estimates for the Taurids' parent comet</title><text x="24" y="26" class="wx-t-cap">How big? Diameters on a log scale</text><line x1="250.0" y1="52" x2="250.0" y2="402" class="wx-guide"/><text x="250.0" y="420" text-anchor="middle" class="wx-t-n">10 m</text><line x1="360.0" y1="52" x2="360.0" y2="402" class="wx-guide"/><text x="360.0" y="420" text-anchor="middle" class="wx-t-n">100 m</text><line x1="470.0" y1="52" x2="470.0" y2="402" class="wx-guide"/><text x="470.0" y="420" text-anchor="middle" class="wx-t-n">1 km</text><line x1="580.0" y1="52" x2="580.0" y2="402" class="wx-guide"/><text x="580.0" y="420" text-anchor="middle" class="wx-t-n">10 km</text><line x1="690.0" y1="52" x2="690.0" y2="402" class="wx-guide"/><text x="690.0" y="420" text-anchor="middle" class="wx-t-n">100 km</text><text x="238" y="80" text-anchor="end" class="wx-t-b">Chelyabinsk meteor, 2013</text><rect x="250.0" y="70" width="25.3" height="12" class="wx-inkfill wx-o80 wx-growx" style="--d:0"/><rect x="275.3" y="70" width="7.8" height="12" class="wx-inkfill wx-o40 wx-growx" style="--d:0"/><text x="291.1" y="80" text-anchor="start" class="wx-t-s wx-pop" style="--d:2">c. 19 m</text><text x="238" y="128" text-anchor="end" class="wx-t-b">Tunguska object, 1908</text><rect x="250.0" y="118" width="76.9" height="12" class="wx-inkfill wx-o80 wx-growx" style="--d:1"/><rect x="326.9" y="118" width="8.7" height="12" class="wx-inkfill wx-o40 wx-growx" style="--d:1"/><text x="343.6" y="128" text-anchor="start" class="wx-t-s wx-pop" style="--d:3">c. 50–60 m (estimates vary)</text><text x="238" y="176" text-anchor="end" class="wx-t-b">Swarm limit, 2025 survey</text><rect x="250.0" y="166" width="110.0" height="12" class="wx-accfill wx-o80 wx-growx" style="--d:2"/><text x="368.0" y="176" text-anchor="start" class="wx-t-s wx-pop" style="--d:4">no more than 9–14 bodies over c. 100 m</text><text x="238" y="224" text-anchor="end" class="wx-t-b">2015 TX24 and 2005 UR</text><rect x="250.0" y="214" width="143.1" height="12" class="wx-accfill wx-o80 wx-growx" style="--d:3"/><rect x="393.1" y="214" width="19.4" height="12" class="wx-accfill wx-o40 wx-growx" style="--d:3"/><text x="420.5" y="224" text-anchor="start" class="wx-t-s wx-pop" style="--d:5">Taurid swarm asteroids, 200–300 m</text><text x="238" y="272" text-anchor="end" class="wx-t-b">Comet Encke's nucleus</text><rect x="250.0" y="262" width="294.9" height="12" class="wx-accfill wx-o80 wx-growx" style="--d:4"/><text x="552.9" y="272" text-anchor="start" class="wx-t-s wx-pop" style="--d:6">c. 4.8 km</text><text x="238" y="320" text-anchor="end" class="wx-t-b">Parent comet, 2025 estimate</text><rect x="250.0" y="310" width="330.0" height="12" class="wx-accfill wx-o80 wx-growx" style="--d:5"/><text x="574.0" y="338" text-anchor="end" class="wx-t-s wx-pop" style="--d:7">c. 10 km (Li et al. 2025)</text><text x="238" y="368" text-anchor="end" class="wx-t-b">Parent comet, Napier 2010</text><rect x="250.0" y="358" width="406.9" height="12" class="wx-stone2 wx-o40 wx-dash wx-growx" style="--d:6"/><rect x="656.9" y="358" width="33.1" height="12" class="wx-paper wx-dash wx-growx" style="--d:6"/><text x="684.0" y="386" text-anchor="end" class="wx-t-s wx-pop" style="--d:8">50–100 km (proposed)</text><text x="24" y="446" class="wx-t-s">Each gridline is ten times the last. Pale bar ends show ranges; dashed = proposed, not observed.</text></svg></div></div><figcaption>Diameters on a logarithmic scale, from the Chelyabinsk meteor to the giant parent comet proposed by Napier. The 2025 surveys point to a far smaller parent. <span class="wx-src">Based on: Chelyabinsk: Popova et al. 2013. Tunguska: Boslough and Crawford 2008 and later estimates. Swarm asteroids: Spurný et al. 2017. Survey limit and 10 km parent: Li et al. 2025. Encke: Fernández et al. 2000. Giant parent: Napier 2010.</span></figcaption><p class="vh">A horizontal bar chart on a logarithmic scale from 10 metres to 100 kilometres. Bars show the Chelyabinsk meteor of 2013 at about 19 metres, the Tunguska object of 1908 at about 50 to 60 metres, the 2025 survey limit of no more than 9 to 14 bodies over about 100 metres in the Taurid swarm, the swarm asteroids 2015 TX24 and 2005 UR at 200 to 300 metres, comet Encke&#x27;s nucleus at about 4.8 kilometres, a 2025 estimate of the parent comet at about 10 kilometres, and Napier&#x27;s proposed parent of 50 to 100 kilometres drawn dashed as a proposal.</p></figure><p>The specialists have not dismissed the hazard. In a 2026 paper in Acta Astronautica, Mark Boslough and colleagues, including several of the surveys&#x27; authors, argued that if the swarm holds bodies of Tunguska size, Earth&#x27;s risk will peak in November 2032 and June 2036, and they called for targeted surveys then. That is an unusual thing for a sceptical community to do, and a fair acknowledgement of Clube and Napier&#x27;s central point.</p></section><section class="wsec" id="taurid-stream-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What the sky hides</h3><p>The evidence is hard to gather. Small Taurid bodies are dark and faint, and the June branch approaches from the Sun&#x27;s direction, where no telescope can look. Airbursts leave no crater, and the scorched ground and melt particles they produce weather away. A giant comet that broke up 20,000 years ago would by now have dispersed into a thin, tangled complex whose history must be inferred from orbits alone. So the absence of large bodies today limits the swarm now, but only indirectly limits what the parent might once have been.</p><p>The link to the Younger Dryas is weaker still. As the site&#x27;s Younger Dryas Comet case describes, the proposed impact layer has not been reproduced by independent teams, the Greenland platinum spike now has a volcanic explanation, and several flagship papers were retracted in 2025 and 2026. Folklore adds colour but not dates: festivals of the dead cluster in autumn for many reasons, including harvest and the turning of the year.</p></section><section class="wsec" id="taurid-stream-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>The verdict, and the next test</h3><p>Carlson and his sources deserve credit for a hazard the textbooks underplay. Comet streams do clump, the Taurid swarm is real, and it holds asteroids large enough to cause regional destruction. But the specific claim, a 50–100 km comet that broke up within the last 20,000–30,000 years and bombarded Earth at the start of the Younger Dryas, is not supported by current data. The best estimates now point to a smaller parent and a younger, possibly unrelated set of asteroids. We rate it as awaiting discovery.</p><p>The good news is that the test has a date. In November 2032 and June 2036 Earth passes close to the swarm again. Deep surveys then, spectra of the Taurid asteroids, and independent analysis of the Younger Dryas boundary would show whether the stream is a thinning trail of cometary dust or the remains of a giant.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">1908 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Tunguska airburst flattens Siberian forest</span></li><li class="wtl-study" style="--i:1"><span class="wtl-y">1978 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Kresák suggests Tunguska was a fragment of Encke</span></li><li class="wtl-study" style="--i:2"><span class="wtl-y">1982 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Clube and Napier publish The Cosmic Serpent</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">1994 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">&#x27;Coherent catastrophism&#x27; paper in Vistas in Astronomy</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">2010 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Napier links the Taurids to 12,900 years ago</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">2015 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Taurid swarm outburst of fireballs</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2017 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Swarm branch found to hold 200–300 m asteroids</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2021 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Taurid asteroid orbits traced back to c. 3200 BCE</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2025 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Surveys limit large bodies in the swarm</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">2026 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Specialists call for searches in 2032 and 2036</span></li></ol><details class="srcs"><summary>Sources for this case (18)</summary><ol><li>Clube, V. &amp; Napier, B. (1982). The Cosmic Serpent: 1730787" target="_blank" rel="noopener">doi:10.1051/0004-6361/201730787</a></li><li>Devillepoix, H. A. R. et al. (2021). Taurid stream #628: a reservoir of large cometary impactors. Planetary Science Journal 2: 223. <a href="https://doi.org/10.3847/PSJ/ac2250" target="_blank" rel="noopener">doi:10.3847/PSJ/ac2250</a></li><li>Egal, A., Wiegert, P., Brown, P. G., Spurný, P., Borovička, J. &amp; Valsecchi, G. B. (2021). A dynamical analysis of the Taurid Complex: evidence for past orbital convergences. Monthly Notices of the Royal Astronomical Society 507(2): 2568–2591. <a href="https://doi.org/10.1093/mnras/stab2237" target="_blank" rel="noopener">doi:10.1093/mnras/stab2237</a></li><li>Li, J., Ye, Q., Vida, D., Clark, D. L. et al. (2025). In search of the potentially hazardous asteroids in the Taurid resonant swarm. arXiv:2503.08670.</li><li>Wiegert, P., Vida, D., Clark, D., Egal, A., Wainscoat, R. &amp; Weryk, R. (2025). A limit on the mass of the Taurid Resonant Swarm at sub-100 meter sizes. arXiv:2506.03327.</li><li>Boslough, M., Brown, P. G., Clark, D., Wiegert, P. &amp; Ye, Q. (2026). 2032 and 2036 risk enhancement from NEOs in the Taurid stream: is there a significant coherent component to impact risk? Acta Astronautica 238: 710–715. <a href="https://doi.org/10.1016/j.actaastro.2025.09.069" target="_blank" rel="noopener">doi:10.1016/j.actaastro.2025.09.069</a></li><li>Fernández, Y. R. et al. (2000). Physical properties of the nucleus of comet 2P/Encke. Icarus 147(1): 145–160.</li><li>Carlson, R. Kosmographia podcast, episode #013 &#x27;Younger Dryas: Extinction, Part 2&#x27; (Taurids). randallcarlson.com; and &#x27;Halloween, the Taurids and Randall Carlson&#x27;, The Cosmic Tusk, 31 October 2019.</li><li>The Joe Rogan Experience #961: Graham Hancock, Randall Carlson &amp; Michael Shermer (17 May 2017).</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-taurid-stream" data-t="The Taurid Stream: A Giant Comet Still Breaking Up?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Taurid Stream: A Giant Comet Still Breaking Up?</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-taurid-stream</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-megafauna-extinction-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Woolly mammoth (Mammuthus primigenius) - Mauricio Antón.jpg" data-cap="Fairbanks muck deposits, interior Alaska, USA" data-big><figcaption></figcaption></figure><div class="sh-k">Floods, Fire and Ice</div><h2 class="sh-t" id="case-megafauna-extinction-st" tabindex="-1">The Mammoth Mystery: Did a Cataclysm Kill the Giants?</h2><p class="sh-s">Mammoths, sabre-toothed cats and giant sloths vanished at the end of the Ice Age. Was it one sudden catastrophe, or a slow unravelling?</p><div class="sh-v"><span class="vstamp vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><p class="sh-claim"><b>What the stamp rates:</b> A single cataclysm about 12,900 years ago wiped out the Ice Age megafauna of the Americas and northern Eurasia.</p></div><p class="v4-q">Did a single cataclysm wipe out the Ice Age giants?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Mammoths, mastodons and giant sloths vanished; did one blow from the sky kill them all?</li><li>North America lost about 35 kinds of large animal within a couple of thousand years.</li><li>But Australia&#x27;s giants went 46,000 years ago, the woolly rhino before the Younger Dryas, and island mammoths lived on until 4,000 years ago.</li><li>The deaths were staggered continent by continent, and they tend to follow people and the climate swings of the melt.</li><li>One cataclysm is ruled out by the dates; hunting or climate, and in what mix, is still argued.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Biology</span><span class="thr">Climate</span><span class="thr">Archaeology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="35" >35</b><span class="ctr-u"> genera</span></div><div class="ctr-l">large-mammal genera lost in North America</div><div class="ctr-c">Faith and Surovell 2009</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="46000" >46,000</b><span class="ctr-u"> years ago</span></div><div class="ctr-l">when most of Australia&#x27;s giant animals were gone</div><div class="ctr-c">Roberts et al. 2001</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="7700" >7,700</b><span class="ctr-u"> years ago</span></div><div class="ctr-l">last giant deer, western Siberia</div><div class="ctr-c">Stuart et al. 2004</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="4000" >4,000</b><span class="ctr-u"> years ago</span></div><div class="ctr-l">last woolly mammoths, Wrangel Island</div><div class="ctr-c">Dehasque et al. 2024</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>A single cataclysm about 12,900 years ago wiped out the Ice Age megafauna of the Americas and northern Eurasia.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The timing contradicts a single event. Australia lost its giants some 33,000 years earlier; in northern Eurasia the woolly rhino vanished around 14,000 years ago, before the Younger Dryas, while giant deer lasted to about 7,700 years ago and island mammoths to about 4,000 years ago. The muck bones and frozen carcasses date across tens of thousands of years. The narrower idea, that an impact contributed to the fast North American losses, is not ruled out, but it rests on evidence that has not been reproduced and is rated awaiting discovery in the Younger Dryas Comet case.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks often present the extinctions as settled, blaming human hunting or &#x27;humans plus climate&#x27; with more confidence than the evidence allows: the balance of causes is still argued, and one 2021 study found a link to temperature but not to human numbers. On the pattern, though, textbooks are right: the losses were staggered by region, not simultaneous.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>North America lost about 35 genera of mostly large mammals, including mammoths, mastodons, horses, camels and giant ground sloths; their last dates fall between about 13,800 and 11,400 years ago, consistent with a sudden event.<small>Faith and Surovell 2009</small></li><li>At many sites in the western United States a dark &#x27;black mat&#x27; layer lies directly on top of the last mammoth and Clovis remains, near the start of the Younger Dryas.<small>Haynes 2008</small></li><li>Australia&#x27;s giant marsupials disappeared much earlier, around 46,000 years ago, within several thousand years of people arriving.<small>Roberts et al. 2001</small></li><li>In northern Eurasia the losses were staggered: the woolly rhino died out around 14,000 years ago, the giant deer survived in western Siberia to about 7,700 years ago, and woolly mammoths lived on St Paul Island until about 5,600 years ago and on Wrangel Island until about 4,000 years ago.<small>Lord et al. 2020; Stuart et al. 2004; Graham et al. 2016; Dehasque et al. 2024</small></li><li>The frozen &#x27;muck&#x27; of interior Alaska holds vast numbers of Ice Age bones, many broken and disarticulated, whose radiocarbon dates spread over tens of thousands of years.<small>Péwé 1975; Guthrie 1990, 2006</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>How much of the North American extinction was caused by human hunters, how much by the rapid climate swings at the end of the Ice Age, and how they combined.</li><li>Whether a cosmic impact at the Younger Dryas onset added to the losses, as the Comet Research Group proposes.</li><li>Whether DNA in Yukon permafrost soils shows mammoths and horses surviving until about 5,000–6,000 years ago, or DNA reworked from older layers.</li><li>How quickly each species actually declined: radiocarbon dates on the last few animals are sparse, so a gradual fade can look sudden.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>The last individuals of any species are almost never found; last-appearance dates always come before the true extinction.</li><li>Much of the Ice Age muck was washed away by hydraulic gold mining in the twentieth century, often without careful recording of where each bone lay.</li><li>The coastal plains where many animals and people lived are now under the sea.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Palaeontologists agree that the end of the Ice Age saw one of the largest losses of big animals in Earth&#x27;s recent history, but they read it as a series of regional collapses, not one global blow. The timing differs from continent to continent and tends to follow the arrival of modern humans and the sharp climate swings of the last deglaciation. The balance between hunting and climate is still argued: some studies link the losses mainly to people, others to temperature. The comet hypothesis is a minority view whose key evidence has not been reproduced.</p><ul><li>Australia lost its giants about 46,000 years ago, long before the Younger Dryas.</li><li>In Eurasia, species vanished over more than 10,000 years, some into the age of the pyramids.</li><li>New Zealand&#x27;s moa vanished within about 150 years of people arriving around 1280 CE, a clear case of human impact with no climate crisis.</li><li>The frozen carcasses and muck bones date across tens of thousands of years, not to one moment.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Carlson treats the death of the Ice Age giants as one of the clearest signs of catastrophe at the end of the Ice Age. He points to the Alaskan muck, described in the 1940s by Froelich Rainey and Frank Hibben as packed with shattered bones, twisted trees and frozen flesh, to frozen mammoth carcasses in Siberia, and to the black mat that caps the last mammoths in North America. In his reading, a cosmic impact at the start of the Younger Dryas, with fire, floods and sudden climate change, killed the megafauna across the northern hemisphere within a very short time.</p><ul><li>About 35 North American genera vanished within a narrow window, close to the Younger Dryas onset.</li><li>The black mat lies directly on the last mammoth and Clovis remains at many sites.</li><li>The Alaskan muck contains enormous numbers of broken, disarticulated bones mixed with uprooted trees.</li><li>Survivors included small and adaptable species, which fits a catastrophe that hit the largest animals hardest.</li></ul><div class="face-s"><b>Its strongest point</b><p>In North America the extinction really was fast and sweeping, about 35 genera within a couple of thousand years, and it coincides with the abrupt Younger Dryas cooling. A single sudden cause is a fair hypothesis to test.</p></div><p class="face-cr"><b>Credit</b> Randall Carlson, on his Kosmographia podcast (episode #011, &#x27;Younger Dryas: Catastrophe and Megafauna&#x27;, and #013, &#x27;Younger Dryas: Extinction, Part 2&#x27;), in his talks and on The Joe Rogan Experience; Graham Hancock (&#x27;Muck, Mammoths and Extinctions&#x27;, 2017); the Comet Research Group</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>More radiocarbon dates on the last members of each North American species, to show whether they vanished together or one by one.</li><li>Independent confirmation of impact markers at the same boundary sites where the last megafauna are found.</li><li>Careful re-dating of bones from the Alaskan and Siberian muck, recorded layer by layer.</li><li>Tests of the Yukon soil DNA that rule out reworking from older sediments.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,122 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Mammoth Mystery: Did a Cataclysm Kill the Giants?"><button type="button" class="wtoc-i" data-go="megafauna-extinction-s1">A world of giants, then silence</button><button type="button" class="wtoc-i" data-go="megafauna-extinction-s2">The muck and the mammoths</button><button type="button" class="wtoc-i" data-go="megafauna-extinction-s3">The case at its strongest</button><button type="button" class="wtoc-i" data-go="megafauna-extinction-s4">The dates that do not line up</button><button type="button" class="wtoc-i" data-go="megafauna-extinction-s5">What the muck really is</button><button type="button" class="wtoc-i" data-go="megafauna-extinction-s6">What time has hidden</button><button type="button" class="wtoc-i" data-go="megafauna-extinction-s7">The verdict</button></nav></div><section class="wsec" id="megafauna-extinction-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A world of giants, then silence</h3><p>Forty thousand years ago the northern world was crowded with giants. Woolly mammoths and woolly rhinos grazed the cold grasslands of Siberia, giant deer carried antlers more than three metres across, and North America had mastodons, sabre-toothed cats, camels, horses and ground sloths the size of cars. Within a few thousand years of the end of the Ice Age most of them were gone. It is one of the great mysteries of the recent past, and it has never been fully solved.</p><p>For Randall Carlson it is one of the clearest signs of catastrophe in the whole record. On his Kosmographia podcast and in talks he argues that the megafauna were not hunted out or slowly squeezed by a warming climate, but killed suddenly, across the northern hemisphere, by the cataclysm that began the Younger Dryas about 12,900 years ago. This case weighs that claim.</p><blockquote class="wpull"><p>A catastrophe leaves a signature in time: everything dies at once. So the first question is simply, when did they die?</p></blockquote></section><section class="wsec" id="megafauna-extinction-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The muck and the mammoths</h3><p>Carlson&#x27;s most vivid evidence comes from the gold fields of Alaska. In the 1930s and 1940s miners near Fairbanks used high-pressure water cannons to strip away the frozen silt, known as muck, that covered the gold-bearing gravels. Out of it came tens of thousands of Ice Age bones. The archaeologists Froelich Rainey and Frank Hibben described them in dramatic terms, and Graham Hancock revived their accounts in 2017.</p><blockquote class="quote"><p>In many places the Alaskan muck blanket is packed with animal bones and debris in trainload lots.</p><cite>Frank C. Hibben, The Lost Americans (1946), as quoted by Graham Hancock, &#x27;Muck, Mammoths and Extinctions&#x27; (2017)</cite></blockquote><p>Carlson adds the frozen mammoth carcasses of Siberia, some with flesh and stomach contents intact, and the black mat, a dark layer of wet-ground sediment that lies directly on top of the last mammoths and Clovis tools at many sites in the western United States. To him the picture is of animals overwhelmed and buried by fire, flood and sudden cold.</p></section><section class="wsec" id="megafauna-extinction-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The case at its strongest</h3><p>The North American record gives the catastrophe idea real traction. In 2009 Tyler Faith and Todd Surovell analysed the last radiocarbon dates of North America&#x27;s extinct mammals and found that about 35 genera disappeared between about 13,800 and 11,400 years ago, a pattern they described as consistent with a sudden event. That window brackets the onset of the Younger Dryas, when the northern hemisphere plunged back towards glacial cold within decades.</p><p>The same years saw the end of the Clovis culture and, according to the Comet Research Group, a thin layer of impact markers at the base of the black mat. If the extinction in North America was fast and the climate collapse abrupt, a single trigger is a reasonable hypothesis, and Carlson is right that textbooks sometimes wave it away rather than test it.</p><figure class="wx wx--steps" id="megafauna-extinction-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">When the giants vanished, region by region</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="When the giants vanished, region by region"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" class="wx-svg" role="img" aria-labelledby="megafauna-extinction-f1-t"><title id="megafauna-extinction-f1-t">Timeline of the last 60,000 years showing when large animals disappeared in Australia, North America, northern Eurasia, Arctic islands and New Zealand, compared with the Younger Dryas and the arrival of people, in five steps</title><text x="24" y="26" class="wx-t-cap">When the giants vanished · years ago, by region</text><line x1="196.0" y1="48" x2="196.0" y2="440" class="wx-guide"/><text x="196.0" y="458" text-anchor="middle" class="wx-t-s">60,000</text><line x1="279.3" y1="48" x2="279.3" y2="440" class="wx-guide"/><text x="279.3" y="458" text-anchor="middle" class="wx-t-s">50,000</text><line x1="362.7" y1="48" x2="362.7" y2="440" class="wx-guide"/><text x="362.7" y="458" text-anchor="middle" class="wx-t-s">40,000</text><line x1="446.0" y1="48" x2="446.0" y2="440" class="wx-guide"/><text x="446.0" y="458" text-anchor="middle" class="wx-t-s">30,000</text><line x1="529.3" y1="48" x2="529.3" y2="440" class="wx-guide"/><text x="529.3" y="458" text-anchor="middle" class="wx-t-s">20,000</text><line x1="612.7" y1="48" x2="612.7" y2="440" class="wx-guide"/><text x="612.7" y="458" text-anchor="middle" class="wx-t-s">10,000</text><line x1="696.0" y1="48" x2="696.0" y2="440" class="wx-guide"/><text x="696.0" y="458" text-anchor="middle" class="wx-t-s">today</text><text x="446.0" y="476" text-anchor="middle" class="wx-t-s">years ago</text><rect x="588.5" y="48" width="10.0" height="392" class="wx-c2 wx-o20"/><text x="584.5" y="434" text-anchor="end" class="wx-t-s wx-t-a wx-halo">Y
