 copper tool use declined: limited advantage over stone, the labour of mining, a drier climate after about 5,000 years ago, or a shift to ornaments and status goods.</li><li>How much copper left the Lake Superior region through trade, and how far it travelled.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Nineteenth-century mining companies dug through, reused or destroyed many ancient pits, and no complete survey of the surviving pits has been published.</li><li>Pits filled with soil and debris after abandonment, so their original volumes are unknown without excavation.</li><li>Countless artifacts were picked up by farmers and collectors, sold, lost or never recorded, and many surviving pieces have no context.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Archaeologists regard the Old Copper Complex as a genuine marvel: some of the world&#x27;s earliest metal tools, made by mobile hunter-gatherers from nearly pure native copper. They also regard the billion-pound figures as unsupported arithmetic. The numbers come from a privately published 1961 compilation that multiplied an assumed pit size by an assumed ore grade by an assumed pit count; none of the three was measured. Spread over several thousand years, intermittent mining could supply the tools, ornaments and trade goods found across the Great Lakes, and copper that was worn out, buried with the dead, lost or collected needs no mystery to explain it.</p><ul><li>The Milwaukee Public Museum calls 1.5 billion pounds the largest estimate and says the real amount is currently unknown.</li><li>Lead in lake sediments shows mining in pulses at different places, then a return to background levels.</li><li>Some copper came from nuggets in glacial drift, not from pits at all.</li><li>Experiments suggest copper blades offered little advantage over stone for many tasks, which helps explain the decline.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>On The Joe Rogan Experience in August 2026, Michael Button presented the Old Copper Complex as a lesson in lost technology. People of the Upper Midwest, he said, began extracting copper about 9,500 years ago, peaked between 7,000 and 5,000 years ago, and removed something like 1.5 billion pounds, about 680,000 tonnes, before abandoning the craft so completely that the knowledge was lost. If a metal industry could rise and vanish once, he argues, other ancient technologies may have done the same without leaving the record we expect. Earlier writers such as Betty Sodders pictured as many as 10,000 miners working some 10,000 pits for a thousand years.</p><ul><li>The dates are genuinely old: copper tools in North America are thousands of years older than bronze in Europe.</li><li>The pits are real, numerous and in places deep, worked with fire and stone hammers.</li><li>The craft really was abandoned, a rare reversal from metal back to stone.</li><li>Textbook histories of metallurgy that start in the Near East leave this tradition out.</li></ul><div class="face-s"><b>Its strongest point</b><p>The abandonment is real and documented. After thousands of years with copper, these communities went back to stone, a pattern Michelle Bebber and colleagues describe as exceptional. Technology can indeed be gained and then given up.</p></div><p class="face-cr"><b>Credit</b> Michael Button (British YouTuber and podcaster; The Joe Rogan Experience #2546, Aug 2026); earlier popular writers such as Betty Sodders (Michigan Prehistory Mysteries, 1990)</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>A lidar and field survey of every ancient pit on the Keweenaw and Isle Royale, with excavated sample pits to measure real volumes.</li><li>Assays of the rock around ancient pits to establish how much copper the miners were actually working.</li><li>A regional census of Archaic copper artifacts by weight, across museum and private collections.</li><li>Chemical and isotopic sourcing of copper found far from Lake Superior, to measure how much left the region.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">6 min read · 1,232 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Old Copper: Did a Billion Pounds Vanish?"><button type="button" class="wtoc-i" data-go="old-copper-s1">Metal that came out of the ground pure</button><button type="button" class="wtoc-i" data-go="old-copper-s2">What is solid</button><button type="button" class="wtoc-i" data-go="old-copper-s3">Where the billion pounds came from</button><button type="button" class="wtoc-i" data-go="old-copper-s4">The challenger&#x27;s case</button><button type="button" class="wtoc-i" data-go="old-copper-s5">The mainstream reading: real mining, imaginary tonnage</button><button type="button" class="wtoc-i" data-go="old-copper-s6">What time has hidden</button><button type="button" class="wtoc-i" data-go="old-copper-s7">What would settle it</button></nav></div><section class="wsec" id="old-copper-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Metal that came out of the ground pure</h3><p>Along the Keweenaw Peninsula and on Isle Royale, in the cold north of Lake Superior, copper lies in the rock as metal. Not ore that must be smelted, but native copper, almost pure, in threads, sheets and lumps, some of them enormous. The Ontonagon Boulder, a single mass of copper weighing about 1.5 tonnes, sat on a riverbank until it was hauled away to Washington in the 1840s.</p><p>When prospectors arrived in the 1840s, they found they were not the first. Lines of shallow depressions in the forest turned out to be filled-in pits, with grooved stone hammers scattered around them by the thousand. According to accounts gathered by the geologist Charles Whittlesey, miners at one site found an ancient pit holding a copper mass of several tons that the old miners had raised on wooden supports and then, for reasons no one knows, left behind.</p><blockquote class="wpull"><p>The first metalworkers of North America were hunter-gatherers, and they started thousands of years before bronze reached Europe.</p></blockquote><p>That much is real. The question here is a number that has travelled far beyond the evidence: that these miners took out between half a billion and 1.5 billion pounds of copper, and that almost all of it has vanished.</p></section><section class="wsec" id="old-copper-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What is solid</h3><p>The dating has improved sharply in recent years. In 2021 David Pompeani and colleagues gathered 53 radiocarbon dates, including eight new ones, from wood and cordage embedded in copper tools, cremations and mine fills. Their work put the start of copper working at least 9,500 years ago, with a peak between about 7,000 and 5,000 years ago. Dates from the mines themselves came out younger, which they read as the time the pits filled in after abandonment, not when they were worked.</p><p>Lakes kept their own record. Mining and heating copper-bearing rock releases lead, and cores from Keweenaw lakes show lead rising about 8,000 and 7,000 years ago, then shifting from lake to lake, as if mining moved around, before falling back to background after about 5,000 years ago. On Isle Royale, sediment from McCargoe Cove records mining from about 6,500 to 5,400 years ago, near the Minong Ridge pits.</p><aside class="wcall"><b>How do we know?</b><p>Heating rock with fire and dousing it with water cracks it, the method the ancient miners appear to have used. The same process sends traces of lead into the air and streams. Because lake mud builds up year by year, a core through it is a timeline, and a lead spike that matches radiocarbon-dated layers shows when mining happened nearby, even where the pits themselves have been destroyed.</p></aside><p>The products survive in quantity. Spear points, knives, axes, awls, fishhooks and beads have been found across the western Great Lakes. P. V. Lawson of Menasha compiled an inventory of at least 13,000 copper artifacts in Wisconsin alone, and the Milwaukee Public Museum suggests the total could be around 20,000.</p></section><section class="wsec" id="old-copper-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Where the billion pounds came from</h3><p>The big number has a traceable origin. In 1961 Roy Drier and Octave Du Temple privately published Prehistoric Copper Mining in the Lake Superior Region, a collection of older articles with their own estimate. The arithmetic went like this.</p><figure class="wx wx--steps" id="old-copper-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">How a guess became 1.5 billion pounds</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How a guess became 1.5 billion pounds"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" class="wx-svg" role="img" aria-labelledby="old-copper-f1-t"><title id="old-copper-f1-t">How the 1961 estimate of 0.5 to 1.5 billion pounds of prehistoric copper was calculated, in five steps</title><defs><marker id="old-copper-f1-ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,1 L9,5 L0,9 Z"/></marker></defs><text x="24" y="28" class="wx-t-cap">One assumed pit, multiplied · the 1961 calculation</text><rect x="24" y="120" width="316" height="313" class="wx-rock"/><rect x="24" y="120" width="316" height="16" class="wx-soil"/><g class="wx-st" data-s="2"><ellipse cx="47.6" cy="287.6" rx="4" ry="2.4" class="wx-bronze wx-edge-soft"/><ellipse cx="41.4" cy="267" rx="4" ry="2.4" class="wx-bronze wx-edge-soft"/><ellipse cx="51.2" cy="171.3" rx="4" ry="2.4" class="wx-bronze wx-edge-soft"/><ellipse cx="67.6" cy="208.3" rx="4" ry="2.4" class="wx-bronze wx-edge-soft"/><ellipse cx="220.7" cy="410.4" rx="4" ry="2.4" class="wx-bronze wx-edge-soft"/><ellipse cx="326.8" cy="159" rx="4" ry="2.4" class="wx-bronze wx-edge-soft"/><ellipse cx="291" cy="226.8" rx="4" ry="2.4" class="wx-bronze wx-edge-soft"/><ellipse cx="73.9" cy="178.9" rx="4" ry="2.4" class="wx-bronze wx-edge-soft"/><ellipse cx="84.9" cy="308.3" rx="4" ry="2.4" class="wx-bronze wx-edge-soft"/><ellipse cx="48.1" cy="203.5" rx="4" ry="2.4" class="wx-bronze wx-edge-soft"/><ellipse cx="328" cy="178.9" rx="4" ry="2.4" class="wx-bronze wx-edge-soft"/><ellipse cx="76.2" cy="282.4" rx="4" ry="2.4" class="wx-bronze wx-edge-soft"/><ellipse cx="41.9" cy="332.4" rx="4" ry="2.4" class="wx-bronze wx-edge-soft"/><ellipse cx="296.1" cy="233.5" rx="4" ry="2.4" class="wx-bronze wx-edge-soft"/><ellipse cx="285.4" cy="409.6" rx="4" ry="2.4" class="wx-bronze wx-edge-soft"/></g><path d="M92,120 L100,393 L267,393 L275,120 Z" class="wx-paper wx-edge"/><line x1="24" y1="120" x2="340" y2="120" class="wx-line"/><circle cx="300" cy="73.5" r="4.5" class="wx-inkfill"/><path d="M300,78 L300,97 M300,97 L295,120 M300,97 L305,120 M293,83.3 L307,83.3" class="wx-line"/><text x="310" y="96" class="wx-t-s">1.7 m</text><line x1="92" y1="104" x2="275" y2="104" class="wx-dim" marker-start="url(#old-copper-f1-ah)" marker-end="url(#old-copper-f1-ah)"/><text x="183.5" y="96" text-anchor="middle" class="wx-t-b">20 ft (6.1 m) wide</text><line x1="132" y1="124" x2="132" y2="389" class="wx-dim" marker-start="url(#old-copper-f1-ah)" marker-end="url(#old-copper-f1-ah)"/><text x="142" y="250.5" class="wx-t-b">30 ft</text><text x="142" y="265.5" class="wx-t-s">(9.1 m) deep</text><text x="183.5" y="423" text-anchor="middle" class="wx-t-s wx-halo">an assumed "average" pit, to scale</text><g class="wx-st wx-hide" data-only="5"><text x="68" y="110" class="wx-t-big wx-t-a">?</text><text x="220" y="264.5" class="wx-t-big wx-t-a">?</text><text x="44" y="383" class="wx-t-big wx-t-a wx-halo">?</text></g><g class="wx-st" data-s="1"><circle cx="382" cy="96" r="9" class="wx-num"/><text x="382" y="100" text-anchor="middle" class="wx-numt">1</text><text x="400" y="100" class="wx-t-b">Assume a pit 20 ft wide, 30 ft deep</text><text x="400" y="124" class="wx-t-n">1,000–1,200 tons of rock</text></g><line x1="400" y1="138" x2="690" y2="138" class="wx-guide"/><g class="wx-st" data-s="2"><circle cx="382" cy="168" r="9" class="wx-num"/><text x="382" y="172" text-anchor="middle" class="wx-numt">2</text><text x="400" y="172" class="wx-t-b">Assume the rock is 5% copper</text><text x="400" y="196" class="wx-t-n">about 100,000 lb per pit</text></g><line x1="400" y1="210" x2="690" y2="210" class="wx-guide"/><g class="wx-st" data-s="3"><circle cx="382" cy="240" r="9" class="wx-num"/><text x="382" y="244" text-anchor="middle" class="wx-numt">3</text><text x="400" y="244" class="wx-t-b">Assume 5,000 pits, all copper-bearing</text><text x="400" y="268" class="wx-t-n">500 million lb</text></g><line x1="400" y1="282" x2="690" y2="282" class="wx-guide"/><g class="wx-st" data-s="4"><circle cx="382" cy="312" r="9" class="wx-num"/><text x="382" y="316" text-anchor="middle" class="wx-numt">4</text><text x="400" y="316" class="wx-t-b">Assume 15% copper and more pits</text><text x="400" y="340" class="wx-t-h wx-t-a">over 1.5 billion lb</text></g><line x1="400" y1="354" x2="690" y2="354" class="wx-guide"/><g class="wx-st" data-s="5"><circle cx="382" cy="384" r="9" class="wx-num"/><text x="382" y="388" text-anchor="middle" class="wx-numt">5</text><text x="400" y="388" class="wx-t-b">Inputs actually measured</text><text x="400" y="412" class="wx-t-b wx-t-a">none: no census, no size survey, no assay</text></g><text x="24" y="486" class="wx-t-m">Figures as published by Drier and Du Temple (1961); critique after D. Johnson.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Assume one average pit, 20 ft wide and 30 ft deep: about 1,000–1,200 tons of rock.</p><ol class="wx-steplist"><li>Assume one average pit, 20 ft wide and 30 ft deep: about 1,000–1,200 tons of rock.</li><li>Assume the rock was 5% copper: about 100,000 lb per pit.</li><li>Assume 5,000 pits, all copper-bearing: 500 million lb.</li><li>Assume 15% copper and more pits: over 1.5 billion lb.</li><li>None of these inputs was ever measured.</li></ol><figcaption>The 1961 estimate, step by step: one assumed pit, multiplied by an assumed grade and an assumed number of pits. <span class="wx-src">Based on: Calculation as published by Drier and Du Temple (1961), quoted by D. Johnson (oldcoppercomplex.com); pit drawn to scale at 30 px per metre; copper specks schematic.</span></figcaption><p class="vh">A cross-section of a single pit drawn to scale in bedrock, 20 feet or 6.1 metres wide and 30 feet or 9.1 metres deep, beside a 1.7 metre person. To the right, five rows appear step by step. Step 1: assume a pit 20 feet wide and 30 feet deep, giving 1,000 to 1,200 tons of rock. Step 2: assume the rock is 5 percent copper, shown as copper specks in the rock, giving about 100,000 pounds per pit. Step 3: assume 5,000 pits, all copper-bearing, giving 500 million pounds. Step 4: assume 15 percent copper and more pits, giving over 1.5 billion pounds. Step 5: inputs actually measured, none; question marks appear on the width, depth and ore grade.</p></figure><p>Assume an average pit 20 feet across and 30 feet deep, which works out at 1,000–1,200 tons of rock. Assume the rock was 5 percent copper, about 100 pounds per ton, and each pit yields about 100,000 pounds. Assume 5,000 pits, all copper-bearing, and the total is 500 million pounds. Raise the grade to 15 percent and add more pits, and the total passes 1.5 billion. Later popular books, including Betty Sodders&#x27;s Michigan Prehistory Mysteries (1990), repeated and enlarged the picture.</p><p>The researcher David Johnson, who has examined the claim in detail, points out that every input is an assumption. No study has determined an average pit size, no comprehensive count of the pits has been published, and no one measured the copper content of the rock they came from. Change any one input and the answer moves by a factor of several. The Milwaukee Public Museum now describes 1.5 billion pounds as the largest estimate and says the real amount is currently unknown.</p></section><section class="wsec" id="old-copper-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The challenger&#x27;s case</h3><p>Michael Button raised the Old Copper Complex on The Joe Rogan Experience in August 2026 as a case study in lost technology. His framing is striking: a metal industry beginning about 9,500 years ago, peaking 7,000 to 5,000 years ago, extracting something like 1.5 billion pounds, about 680,000 tonnes, and then simply stopping, its know-how forgotten. If that could happen here, he argues, why not elsewhere, with technologies that left even fewer traces?</p><p>Much of this stands up. The dates he gives match the published radiocarbon work. The pits are real and there are many of them. And the abandonment is genuinely unusual. In 2019 Michelle Bebber and colleagues called it exceptional: most societies that took up metal tools never went back to stone, yet around 3,000 years ago these communities largely did. Button is also right that the tradition is left out of many general histories of metallurgy, which tend to begin in the Near East.</p><blockquote class="wpull"><p>Button&#x27;s deeper point survives the audit: a people can master a material and then choose to put it down.</p></blockquote></section><section class="wsec" id="old-copper-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The mainstream reading: real mining, imaginary tonnage</h3><p>Where the story breaks is the quantity, and with it the vanishing. A figure of 680,000 tonnes would equal roughly one seventh of everything Michigan&#x27;s industrial native copper mines produced from the 1840s to the 1960s, about 11 billion pounds, with steam, dynamite and railways. Nothing in the pits, the tools or the lake mud requires anything like that.</p><figure class="wx wx--static" id="old-copper-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">How much copper?</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How much copper?"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" class="wx-svg" role="img" aria-labelledby="old-copper-f2-t"><title id="old-copper-f2-t">Copper masses compared on a logarithmic scale, from a single copper boulder to Michigan's whole industrial output</title><text x="24" y="28" class="wx-t-cap">How much copper? · tonnes, logarithmic scale</text><line x1="250" y1="58" x2="250" y2="370" class="wx-guide"/><text x="250" y="388" text-anchor="middle" class="wx-t-s">1 t</text><line x1="312" y1="58" x2="312" y2="370" class="wx-guide"/><text x="312" y="388" text-anchor="middle" class="wx-t-s">10</text><line x1="374" y1="58" x2="374" y2="370" class="wx-guide"/><text x="374" y="388" text-anchor="middle" class="wx-t-s">100</text><line x1="436" y1="58" x2="436" y2="370" class="wx-guide"/><text x="436" y="388" text-anchor="middle" class="wx-t-s">1,000</text><line x1="498" y1="58" x2="498" y2="370" class="wx-guide"/><text x="498" y="388" text-anchor="middle" class="wx-t-s">10,000</text><line x1="560" y1="58" x2="560" y2="370" class="wx-guide"/><text x="560" y="388" text-anchor="middle" class="wx-t-s">100,000</text><line x1="622" y1="58" x2="622" y2="370" class="wx-guide"/><text x="622" y="388" text-anchor="middle" class="wx-t-s">1 Mt</text><line x1="684" y1="58" x2="684" y2="370" class="wx-guide"/><text x="684" y="388" text-anchor="middle" class="wx-t-s">10 Mt</text><line x1="250.0" y1="370" x2="684" y2="370" class="wx-line"/><text x="467" y="410" text-anchor="middle" class="wx-t-m">each gridline is ten times the one before</text><text x="24" y="92" class="wx-t-b">Ontonagon Boulder</text><text x="24" y="107" class="wx-t-s">one native copper mass</text><rect x="250.0" y="82" width="10.9" height="22" rx="3" class="wx-bronze wx-edge-soft wx-growx" style="--d:1"/><text x="268.9" y="97" text-anchor="start" class="wx-t-n wx-halo wx-pop" style="--d:6">c. 1.5 t</text><text x="24" y="150" class="wx-t-b">All Wisconsin artifacts</text><text x="24" y="165" class="wx-t-s">c. 20,000 at a generous 1 kg each</text><rect x="250.0" y="140" width="80.7" height="22" rx="3" class="wx-bronze wx-o40 wx-edge-soft wx-growx" style="--d:2"/><text x="338.7" y="155" text-anchor="start" class="wx-t-n wx-halo wx-pop" style="--d:7">c. 20 t</text><text x="24" y="208" class="wx-t-b">1961 low estimate</text><text x="24" y="223" class="wx-t-s">0.5 billion lb, never measured</text><rect x="250.0" y="198" width="332" height="22" rx="3" class="wx-card wx-dash wx-growx" style="--d:3"/><text x="572" y="213" text-anchor="end" class="wx-t-n wx-pop" style="--d:8">c. 227,000 t</text><text x="24" y="266" class="wx-t-b">1961 high estimate</text><text x="24" y="281" class="wx-t-s">1.5 billion lb, Button's figure</text><rect x="250.0" y="256" width="361.6" height="22" rx="3" class="wx-card wx-dash wx-growx" style="--d:4"/><text x="601.6" y="271" text-anchor="end" class="wx-t-n wx-pop" style="--d:9">c. 680,000 t</text><text x="24" y="324" class="wx-t-b">Michigan industry</text><text x="24" y="339" class="wx-t-s">native copper, 1840s–1960s</text><rect x="250.0" y="314" width="415.3" height="22" rx="3" class="wx-metal wx-edge-soft wx-growx" style="--d:5"/><text x="655.3" y="329" text-anchor="end" class="wx-t-n wx-pop" style="--d:10">c. 5 Mt</text></svg></div></div><figcaption>Known masses (solid) and unmeasured estimates (dashed) on a logarithmic scale, where each gridline is ten times the one before. <span class="wx-src">Based on: Milwaukee Public Museum (artifact counts; 1 kg each is an illustrative upper-end assumption, not a measurement); Drier and Du Temple 1961 (estimates); Copper mining in Michigan (industrial total, 11 billion lb); Ontonagon Boulder c. 1.5 t. Pounds converted at 0.4536 kg.</span></figcaption><p class="vh">A horizontal bar chart on a logarithmic scale from 1 tonne to 10 million tonnes. The Ontonagon Boulder, a single native copper mass: about 1.5 tonnes. All Wisconsin Archaic copper artifacts, about 20,000 at a generous 1 kilogram each: about 20 tonnes, drawn faint because it is an upper-end assumption. The 1961 low estimate of 0.5 billion pounds, never measured: about 227,000 tonnes, dashed. The 1961 high estimate of 1.5 billion pounds, the figure Button cites: about 680,000 tonnes, dashed. Michigan&#x27;s industrial native copper output from the 1840s to the 1960s: about 5 million tonnes.</p></figure><p>Archaeologists see instead a long, intermittent tradition carried out by small, mobile groups. Some of the copper, especially early on, was float copper picked from glacial gravels rather than mined. Tools were used until worn out, reworked, buried with the dead or lost; copper also travelled as a trade good. Experiments by Bebber and her colleagues found that stone flakes started out sharper and that copper blades showed no clear advantage for many tasks, so the effort of mining may simply not have been worth it once stone did the job. A drier climate after about 5,000 years ago may have added to the cost.</p><p>In short, no one has shown that a billion pounds was removed, so there is no missing billion pounds to explain.</p></section><section class="wsec" id="old-copper-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What time has hidden</h3><p>The honest gap is large. When industrial mining began, companies deliberately sought out the ancient pits as guides to rich ground and dug straight through many of them. Others were filled by centuries of soil and leaf litter. Collectors took thousands of artifacts from farm fields and never recorded where they came from, and much of what was found in the nineteenth century has been scattered. So the true scale of the ancient mining is not only unknown; parts of it can no longer be known.</p></section><section class="wsec" id="old-copper-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle it</h3><p>The question is answerable, at least in part. Airborne lidar can reveal pits under forest; a survey of every surviving pit, with a sample excavated to measure real volumes, would replace the guessed 5,000 pits and guessed dimensions. Assays of the surrounding rock would replace the guessed ore grade. A census of copper artifacts by weight, and chemical sourcing of copper found far from the lake, would show how much was used locally and how much travelled. Until then, the fair verdict is this: the Old Copper Complex is one of the great early metal traditions of the world, and the billion pounds is a sum that was never measured.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">7,500 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Copper working under way, at least 9,500 years ago</span></li><li class="wtl-use" style="--i:1"><span class="wtl-y">6,000 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Lead pollution from mining in Keweenaw lakes</span></li><li class="wtl-use" style="--i:2"><span class="wtl-y">4,500 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Mining begins near Minong Ridge, Isle Royale</span></li><li class="wtl-loss" style="--i:3"><span class="wtl-y">3,000 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Keweenaw lake lead returns to background</span></li><li class="wtl-loss" style="--i:4"><span class="wtl-y">1,000 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Copper tools largely abandoned for stone</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1863 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Whittlesey publishes Ancient Mining on the Shores of Lake Superior</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">1961 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Drier and Du Temple estimate 0.5–1.5 billion lb</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2013 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Lake sediments reveal prehistoric mining pollution</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2021 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Radiocarbon study redates the Old Copper Complex</span></li><li class="wtl-event" style="--i:9"><span class="wtl-y">2026 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Michael Button raises it on The Joe Rogan Experience</span></li></ol><details class="srcs"><summary>Sources for this case (18)</summary><ol><li>Pompeani, D. P., Steinman, B. A., Abbott, M. B., Pompeani, K. M., Reardon, W., DePasqual, S. &amp; Mueller, R. H. (2021) pone.0266908</a></li><li>Bebber, M. R. (2021). The role of functional efficiency in the decline of North America&#x27;s Copper Culture (8000–3000 BP): an experimental, ecological, and evolutionary approach. Journal of Archaeological Method and Theory. <a href="https://doi.org/10.1007/s10816-020-09497-0" target="_blank" rel="noopener">doi:10.1007/s10816-020-09497-0</a></li><li>Bebber, M. R. &amp; Eren, M. I. (2018). Toward a functional understanding of the North American Old Copper Culture &#x27;technomic devolution&#x27;. Journal of Archaeological Science.</li><li>Drier, R. W. &amp; Du Temple, O. J. (eds) (1961). Prehistoric Copper Mining in the Lake Superior Region: A Collection of Reference Articles. Privately published, Hinsdale, Illinois.</li><li>Whittlesey, C. (1863). Ancient Mining on the Shores of Lake Superior. Smithsonian Contributions to Knowledge 13. Washington: Smithsonian Institution.</li><li>Martin, S. R. (1999). Wonderful Power: The Story of Ancient Copper Working in the Lake Superior Basin. Detroit: Wayne State University Press.</li><li>Sodders, B. (1990). Michigan Prehistory Mysteries. Avery Color Studios.</li><li>Johnson, D. The Johnson Collection (critique of prehistoric copper tonnage estimates). oldcoppercomplex.com.</li><li>Milwaukee Public Museum. Old Copper Culture (online collections and research page).</li><li>National Park Service, Keweenaw National Historical Park. Indigenous mining.</li><li>Archaeology magazine (2021). Native American copper use in North America re-dated. News, 22 March 2021.</li><li>Wikipedia. Copper mining in Michigan (industrial production total of 11 billion pounds).</li><li>The Joe Rogan Experience #2546, Michael Button (August 2026).</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-old-copper" data-t="Old Copper: Did a Billion Pounds Vanish?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Old Copper: Did a Billion Pounds Vanish?</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-old-copper</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-denisovan-giants-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Homo longi holotype.jpg" data-cap="The Harbin cranium, &#x27;Dragon Man&#x27;, now linked to the Denisovans" data-big><figcaption></figcaption></figure><div class="sh-k">Skills Older Than We Thought</div><h2 class="sh-t" id="case-denisovan-giants-st" tabindex="-1">Denisovan Giants: How Big Were the Lost Humans?</h2><p class="sh-s">Two leg bones dredged from the Taiwan Strait suggest the Denisovans stood tall. Were they the giants of legend?</p><div class="sh-v"><span class="vstamp vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><p class="sh-claim"><b>What the stamp rates:</b> Denisovans were unusually large-bodied people, taller and heavier than most humans of their time.</p></div><p class="v4-q">Were the Denisovans unusually big, and could they be the giants of old stories?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>The Denisovans were another kind of human, known first from DNA in a finger bone.</li><li>In 2025 proteins identified the huge Harbin skull as Denisovan: one of the biggest archaic skulls ever found.</li><li>Two leg bones dredged off Taiwan suggest people about 1.8 to 1.9 metres tall, in a study not yet peer-reviewed.</li><li>So they were big people, but we do not yet have a population average.</li><li>Linking them to the giants of old stories has no evidence: the last known Denisovans lived 40,000 years before those texts.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Biology</span><span class="thr">Archaeology</span><span class="thr">Texts and scripts</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="190" >190</b><span class="ctr-u"> cm</span></div><div class="ctr-l">estimated stature from the Penghu 3 tibia</div><div class="ctr-c">Kaifu et al. 2026 (preprint)</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="180" >180</b><span class="ctr-u"> cm</span></div><div class="ctr-l">estimated stature from the Penghu 2 femur</div><div class="ctr-c">Kaifu et al. 2026 (preprint)</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="1420" >1,420</b><span class="ctr-u"> cm³</span></div><div class="ctr-l">brain volume of the Harbin skull</div><div class="ctr-c">Ji et al. 2021</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="146000" >146,000</b><span class="ctr-u"> years</span></div><div class="ctr-l">minimum age of the Harbin skull</div><div class="ctr-c">Ji et al. 2021; Fu et al. 2025</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="0" >0</b><span class="ctr-u"> skeletons</span></div><div class="ctr-l">complete Denisovan skeletons found so far</div><div class="ctr-c">Reynolds 2026</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Denisovans were unusually large-bodied people, taller and heavier than most humans of their time.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The big skull, teeth and jaws are securely identified, so robustness is established. Height rests on two dredged leg bones in a 2026 preprint not yet through peer review, estimated at about 180 and 190 cm; Jinniushan, a possible relative, gives about 169 cm for a female. That is a consistent picture of big people, but not yet a population average. The separate idea that Denisovans were the giants of legend has no supporting evidence: no Denisovan remains are known from the Near East, and the latest known ones lived about 40,000 years before the texts were written.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 2 of 6, cautious"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>cautious</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks and museum labels have been openly unsure about Denisovan bodies, saying they are known mostly from DNA, teeth and a few bones, and that caution was right. The risk now runs the other way: a single preprint about two dredged bones is already being retold as fact. The evidence supports big and robust well, tall on average only provisionally, and giants not at all.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>The Denisovans were discovered through DNA: a finger bone from Denisova Cave yielded their genome in 2010, and their molars are very large, outside the range of Neanderthals and modern humans.<small>Reich et al. 2010; Sawyer et al. 2015</small></li><li>In 2025 proteins and mitochondrial DNA identified the Harbin skull, at least 146,000 years old, as Denisovan. It is about 22 cm long with a brain of about 1,420 cm³, one of the largest archaic human skulls known.<small>Ji et al. 2021; Fu et al. 2025</small></li><li>A heavy jaw dredged from the Penghu Channel off Taiwan was identified by its proteins as a male Denisovan in 2025.<small>Chang et al. 2015; Tsutaya et al. 2025</small></li><li>Many Tibetans carry a version of the EPAS1 gene that helps at high altitude and that entered our species from Denisovans or their close relatives.<small>Huerta-Sánchez et al. 2014</small></li><li>The Jinniushan skeleton from north-east China, about 260,000 years old and sometimes grouped with the same Asian lineage, gives a stature of about 169 cm and a body mass of about 78.6 kg for a female.<small>Rosenberg, Zuné and Ruff 2006</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the two Penghu leg bones described in a 2026 preprint are correctly identified and dated, and whether two individuals can stand for a whole people.</li><li>Whether the Harbin, Yunxian, Dali and Jinniushan fossils belong to one lineage (often called Homo longi) that includes the Denisovans, and how long ago it split from ours.</li><li>Whether big skulls, jaws and teeth imply big bodies at all.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>No Denisovan pelvis, spine or complete skeleton has been found, so body mass rests on two leg bones and on estimates from possible relatives.</li><li>Key fossils were dredged from the seabed (Penghu), hidden in a well (Harbin) or handed in by a monk (Xiahe), so their original layers are unknown.</li><li>Much of the Denisovans&#x27; likely range is tropical, where bone and DNA decay fast, or drowned continental shelf now under the sea.</li></ul></div></div><h3 class="sub-h wsub">How the traditions tell it</h3><div class="v4texts"><blockquote class="quote v4q"><span class="v4q-t">Hebrew Bible · Genesis 6:4</span><p>The Nephilim were on the earth in those days ... These were the heroes that were of old, warriors of renown.</p><cite>New Revised Standard Version Updated Edition (2021)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Hebrew Bible · Numbers 13:33</span><p>There we saw the Nephilim (the Anakites come from the Nephilim), and to ourselves we seemed like grasshoppers, and so we seemed to them.</p><cite>New Revised Standard Version Updated Edition (2021)</cite></blockquote></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Specialists agree the Denisovans were robust: huge molars, heavy jaws and a massive skull. Until 2026 nobody could say how tall they stood, because no limb bone had been identified. A preprint by Yousuke Kaifu and colleagues now estimates about 180 cm and 83 kg for one individual and about 190 cm and 91 kg for another, as large as the biggest Ice Age humans known from Africa and Europe. Critics such as Sally Reynolds warn that two dredged bones without context cannot define a population, and stature formulas carry wide margins. Nothing in the evidence puts any Denisovan outside the range of tall people alive today.</p><ul><li>Skull and tooth size track diet, climate and sex as much as height; they are weak guides to stature.</li><li>Stature from a single long bone depends on which reference formula is used, so each figure carries a margin of several centimetres.</li><li>The preprint has not yet completed peer review, and the bones have no recorded findspot.</li><li>The nearest Denisovan evidence lies thousands of kilometres and roughly 40,000 years away from the world of the biblical texts.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Michael Button argues that the human story runs far deeper and stranger than school books allow. On The Joe Rogan Experience in August 2026 he cited the 2025 reconstruction of the Yunxian skull to argue that our lineage and the Denisovans&#x27; parted more than a million years ago, and that many human populations are known only as ghosts in our DNA. He has also linked big-bodied Denisovans with the giants of the Hebrew Bible, suggesting that old stories of tall, powerful peoples may keep a memory of real archaic humans. Graham Hancock has argued in a similar spirit that forgotten peoples sit behind humanity&#x27;s oldest stories.</p><ul><li>Every Denisovan bone found so far is large: the teeth, the Harbin skull, the Penghu jaw and now the leg bones.</li><li>The 2026 leg bones put two individuals at about 1.8 and 1.9 m, tall by any Ice Age standard.</li><li>The mainstream shelved big Asian fossils such as Harbin, Dali and Jinniushan for decades before proteins and DNA forced a rethink.</li><li>Stories of tall ancient peoples appear in many traditions, including Genesis 6:4 and Numbers 13:33.</li></ul><div class="face-s"><b>Its strongest point</b><p>Every Denisovan bone found so far points the same way: huge molars, the longest archaic skull known, a heavy jaw and now two long leg bones. The one consistent signal in their skeleton is size.</p></div><p class="face-cr"><b>Credit</b> Michael Button (British YouTuber and podcaster; The Joe Rogan Experience #2368, Aug 2025, and #2546, Aug 2026); Graham Hancock</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Peer review and independent replication of the proteins and radiocarbon dates on the Penghu femur and tibia.</li><li>A Denisovan skeleton with pelvis and limbs from a dated cave layer, such as Baishiya Karst Cave, to measure body mass directly.</li><li>Protein screening of unidentified Middle and Late Pleistocene limb bones in Chinese and South-East Asian museum collections.</li><li>For the legend link: any Denisovan fossil or DNA from the Near East, or from a time anywhere near the texts.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">6 min read · 1,418 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Denisovan Giants: How Big Were the Lost Humans?"><button type="button" class="wtoc-i" data-go="denisovan-giants-s1">Bones from a fishing net</button><button type="button" class="wtoc-i" data-go="denisovan-giants-s2">A body built from fragments</button><button type="button" class="wtoc-i" data-go="denisovan-giants-s3">Big teeth, a big head, long legs</button><button type="button" class="wtoc-i" data-go="denisovan-giants-s4">The mainstream reading: big, probably</button><button type="button" class="wtoc-i" data-go="denisovan-giants-s5">The challenger&#x27;s case at its strongest</button><button type="button" class="wtoc-i" data-go="denisovan-giants-s6">Giants in the old texts</button><button type="button" class="wtoc-i" data-go="denisovan-giants-s7">What time has hidden, and what would settle it</button></nav></div><section class="wsec" id="denisovan-giants-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Bones from a fishing net</h3><p>During the colder stretches of the Ice Age, the seabed between Taiwan and the Penghu islands was dry land, grazed by elephants and water buffalo. Today it lies under the sea, and trawlers dragging nets across the Penghu Channel bring up fossil bones, which end up in the hands of collectors. In 2015 one of those bones, a heavy human jaw, was described as the first archaic human from Taiwan. In 2025 the proteins still locked in its teeth marked it as a male Denisovan.</p><p>Then, in August 2026, a team led by Yousuke Kaifu of the University of Tokyo posted a preprint describing two more human bones from the same waters: a right thigh bone and a right shin bone. Both carried a variant of collagen known only in Denisovans. And both were long. The team estimated that the owner of the femur stood about 180 cm tall and weighed about 83 kg, and the owner of the tibia about 190 cm and 91 kg.</p><blockquote class="wpull"><p>For fifteen years the Denisovans were a genome without a body. The first leg bones suggest a tall one.</p></blockquote><p>For the British YouTuber and podcaster Michael Button, this is where the story turns. Big-bodied archaic humans who vanished, and ancient texts that speak of giants: are they the same memory? This case weighs both halves separately. First, how big do the bones say Denisovans were? Second, does any of it connect to the giants of legend?</p></section><section class="wsec" id="denisovan-giants-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>A body built from fragments</h3><p>The Denisovans were found backwards. In 2010 geneticists read a whole genome from the tip of a girl&#x27;s little finger found in Denisova Cave in the Altai Mountains of Siberia, and learned that an unknown human group had lived there. Their DNA survives in living people: many Tibetans carry a Denisovan version of a gene, EPAS1, that helps the body cope with thin air. But for years the people themselves were almost invisible, known from the finger, a few teeth and scraps of bone.</p><figure class="wx wx--steps" id="denisovan-giants-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">A body built from fragments</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="A body built from fragments"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" class="wx-svg" role="img" aria-labelledby="denisovan-giants-f2-t"><title id="denisovan-giants-f2-t">Every bone identified as Denisovan so far, placed on the outline of one body, in five steps</title><text x="24" y="28" class="wx-t-cap">A body from fragments · Denisovan bones placed on on " r="9" class="wx-num"/><text x="238" y="340" text-anchor="middle" class="wx-numt">1</text><text x="30" y="340" text-anchor="start" class="wx-t-b">Finger bone, 2008</text><text x="30" y="355" text-anchor="start" class="wx-t-s">a girl's little finger;</text><text x="30" y="370" text-anchor="start" class="wx-t-s">the first genome, 2010</text></g><g class="wx-st" data-s="2"><polygon points="340,106 344,121 352,128 368,128 376,121 380,106 373,106 369,119 351,119 347,106" class="wx-c5 wx-edge"/><path d="M324,199 Q360,185 396,199" class="wx-bold wx-s5"/><path d="M382,124 L462,146" class="wx-thin"/><path d="M398,200 L462,214" class="wx-thin"/><circle cx="476" cy="146" r="9" class="wx-num"/><text x="476" y="150" text-anchor="middle" class="wx-numt">2</text><text x="490" y="150" text-anchor="start" class="wx-t-b">Xiahe jaw, 2019</text><text x="490" y="165" text-anchor="start" class="wx-t-s">Tibetan Plateau, 3,280 m</text><circle cx="476" cy="214" r="9" class="wx-num"/><text x="476" y="218" text-anchor="middle" class="wx-numt">2</text><text x="490" y="218" text-anchor="start" class="wx-t-b">Baishiya rib, 2024</text><text x="490" y="233" text-anchor="start" class="wx-t-s">same cave, by proteins</text></g><g class="wx-st" data-s="4"><polygon points="332.9,299.3 335.4,312.2 330.6,369.1 325.9,381.3 333.5,387.4 342.1,382.7 339.6,369.8 344.4,312.9 349.1,300.7 341.5,294.6" class="wx-c5 wx-edge"/><polygon points="327.3,391.8 330,402.4 328.6,451.4 325.3,461.8 331.9,466.5 338.7,462.2 336,451.6 337.4,402.6 340.7,392.2 334.1,387.5" class="wx-c5 wx-edge"/><path d="M326,342 L250,420" class="wx-thin"/><path d="M326,428 L250,436" class="wx-thin"/><circle cx="238" cy="420" r="9" class="wx-num"/><text x="238" y="424" text-anchor="middle" class="wx-numt">4</text><text x="30" y="424" text-anchor="start" class="wx-t-b">Penghu femur and tibia</text><text x="30" y="439" text-anchor="start" class="wx-t-s">2026 preprint: c. 1.80 m</text><text x="30" y="454" text-anchor="start" class="wx-t-s">and c. 1.90 m tall</text></g><g class="wx-st" data-s="5"><polygon points="322,264 398,264 405,292 382,308 360,298 338,308 315,292" class="wx-hl wx-dash"/><path d="M406,284 L462,300" class="wx-thin"/><circle cx="476" cy="300" r="9" class="wx-num"/><text x="476" y="304" text-anchor="middle" class="wx-numt">5</text><text x="490" y="304" text-anchor="start" class="wx-t-b">Never found: pelvis, spine,</text><text x="490" y="319" text-anchor="start" class="wx-t-b">a complete limb or skeleton</text><text x="490" y="334" text-anchor="start" class="wx-t-s">body mass is still an estimate</text></g><text x="360" y="508" text-anchor="middle" class="wx-t-m">Outline is schematic; filled parts show which kinds of bone are known.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> 2008–2015: a finger bone gives the genome, and outsize molars hint at a robust people.</p><ol class="wx-steplist"><li>2008–2015: a finger bone gives the genome, and outsize molars hint at a robust people.</li><li>2019–2024: a jaw and a rib from a Tibetan cave, identified by their proteins.</li><li>2025: the Harbin skull and the Penghu jaw give the Denisovans a face.</li><li>2026 (preprint): a femur and a tibia from the Taiwan Strait give the first heights.</li><li>Still missing: a pelvis, a spine and any complete skeleton.</li></ol><figcaption>Each step lights up the kinds of bone that have been identified as Denisovan, in the order they were found. <span class="wx-src">Based on: Reich et al. 2010; Sawyer et al. 2015; Chen et al. 2019; Xia et al. 2024; Tsutaya et al. 2025; Fu et al. 2025; Kaifu et al. 2026 (preprint). Skeleton outline schematic, not to scale.</span></figcaption><p class="vh">A schematic human skeleton outline with parts filled in step by step. Step 1: molars and a finger bone from Denisova Cave, 2008 to 2015, with the note that the molars are far larger than Neanderthal or modern ones. Step 2: the Xiahe jaw from the Tibetan Plateau at 3,280 metres, 2019, and a rib from the same cave, 2024. Step 3: the Harbin skull and Penghu jaw, 2025, the first face, with a brain of about 1,420 cubic centimetres. Step 4: a femur and tibia from the Penghu Channel, 2026 preprint, giving statures of about 1.80 and 1.90 metres. Step 5: a dashed pelvis marks what has never been found: pelvis, spine, a complete limb or skeleton.</p></figure><p>Proteins, which survive longer than DNA, slowly filled in the outline. A jaw found by a monk on the Tibetan Plateau, at 3,280 metres, was identified in 2019; a rib from the same cave followed in 2024. In 2025 came the Penghu jaw and then the great prize, the Harbin skull, whose proteins and mitochondrial DNA matched the Denisovans of Siberia. For the first time there was a face. The leg bones of 2026 add the first measure of height. Even so, every Denisovan bone in the world&#x27;s collections would fit in a small box, and no pelvis, spine or complete skeleton has been found.</p></section><section class="wsec" id="denisovan-giants-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Big teeth, a big head, long legs</h3><p>The size signal has been there from the start. The Denisova molars are enormous, larger than those of Neanderthals or modern humans and closer in size to much older members of the genus Homo. The Harbin skull, at least 146,000 years old, is about 22 cm long with the longest brow ridge of any human skull measured and a brain of about 1,420 cubic centimetres, well within our own range. Its one surviving molar measures about 13.6 by 16.6 mm, against roughly 10 by 12 mm for a typical modern person. The Penghu jaw is thick and heavy.</p><p>The best earlier clue to body size came from a possible relative. The Jinniushan skeleton from north-east China, about 260,000 years old, is one of the few archaic Asian skeletons with a pelvis and limbs. In 2006 Karen Rosenberg, Lü Zuné and Christopher Ruff estimated that this woman stood about 169 cm tall and weighed about 78.6 kg, heavy for her height. Some researchers group Jinniushan with Harbin and the Denisovans; others do not.</p><figure class="wx wx--static" id="denisovan-giants-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">How tall is a giant?</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How tall is a giant?"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" class="wx-svg" role="img" aria-labelledby="denisovan-giants-f1-t"><title id="denisovan-giants-f1-t">Estimated statures of Denisovans and a possible relative, drawn to scale beside a 1.70 m person and the two text traditions for Goliath's height</title><text x="24" y="28" class="wx-t-cap">How tall is a giant? · estimated statures, drawn to scale</text><line x1="70" y1="320" x2="700" y2="320" class="wx-guide"/><text x="58" y="324" text-anchor="end" class="wx-t-s">1 m</text><line x1="70" y1="200" x2="700" y2="200" class="wx-guide"/><text x="58" y="204" text-anchor="end" class="wx-t-s">2 m</text><line x1="70" y1="
