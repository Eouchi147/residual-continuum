ounger Dryas</text><text x="184" y="90" text-anchor="end" class="wx-t-b">North America</text><line x1="196" y1="86" x2="696" y2="86" class="wx-thin"/><text x="184" y="168" text-anchor="end" class="wx-t-b">Australia</text><line x1="196" y1="164" x2="696" y2="164" class="wx-thin"/><text x="184" y="246" text-anchor="end" class="wx-t-b">Northern Eurasia</text><line x1="196" y1="242" x2="696" y2="242" class="wx-thin"/><text x="184" y="324" text-anchor="end" class="wx-t-b">Arctic islands</text><line x1="196" y1="320" x2="696" y2="320" class="wx-thin"/><text x="184" y="402" text-anchor="end" class="wx-t-b">New Zealand</text><line x1="196" y1="398" x2="696" y2="398" class="wx-thin"/><g class="wx-st" data-s="1"><rect x="581.0" y="80" width="20.0" height="12" class="wx-accfill" /></g><g class="wx-st" data-s="1"><text x="591.0" y="108" text-anchor="middle" class="wx-t-s wx-halo">35 genera lost,</text><text x="591.0" y="121" text-anchor="middle" class="wx-t-s wx-halo">c. 13,800–11,400</text></g><g class="wx-st" data-s="1"><polygon points="504.3,76 499.3,68 509.3,68" class="wx-c3"/><text x="504.3" y="64" text-anchor="middle" class="wx-t-s wx-halo">people by c. 23,000</text></g><g class="wx-st wx-hide" data-only="1"><text x="604.3" y="60" class="wx-t-b wx-t-a wx-halo">One blow?</text></g><g class="wx-st" data-s="2"><rect x="312.7" y="158" width="16.6" height="12" class="wx-accfill" /></g><g class="wx-st" data-s="2"><text x="321.0" y="186" text-anchor="middle" class="wx-t-s wx-halo">most giants gone</text><text x="321.0" y="199" text-anchor="middle" class="wx-t-s wx-halo">c. 46,000</text></g><g class="wx-st" data-s="2"><polygon points="279.3,154 274.3,146 284.3,146" class="wx-c3"/><text x="279.3" y="142" text-anchor="middle" class="wx-t-s wx-halo">people by c. 50,000</text></g><g class="wx-st" data-s="3"><circle cx="579.3" cy="242" r="5.5" class="wx-accfill wx-edge"/></g><g class="wx-st" data-s="3"><text x="579.3" y="264" text-anchor="end" class="wx-t-s wx-halo">woolly rhino</text><text x="579.3" y="277" text-anchor="end" class="wx-t-s wx-halo">c. 14,000</text></g><g class="wx-st" data-s="3"><circle cx="631.8" cy="242" r="5.5" class="wx-accfill wx-edge"/></g><g class="wx-st" data-s="3"><text x="631.8" y="264" text-anchor="start" class="wx-t-s wx-halo">giant deer</text><text x="631.8" y="277" text-anchor="start" class="wx-t-s wx-halo">c. 7,700</text></g><g class="wx-st" data-s="3"><polygon points="321.0,232 316.0,224 326.0,224" class="wx-c3"/><text x="321.0" y="220" text-anchor="middle" class="wx-t-s wx-halo">our species by c. 45,000</text></g><g class="wx-st" data-s="4"><circle cx="649.3" cy="320" r="5.5" class="wx-accfill wx-edge"/></g><g class="wx-st" data-s="4"><circle cx="662.7" cy="320" r="5.5" class="wx-accfill wx-edge"/></g><g class="wx-st" data-s="4"><text x="649.3" y="342" text-anchor="end" class="wx-t-s wx-halo">mammoths: St Paul c. 5,600,</text><text x="649.3" y="355" text-anchor="end" class="wx-t-s wx-halo">Wrangel c. 4,000</text></g><g class="wx-st" data-s="4"><rect x="601.0" y="80" width="53.3" height="12" class="wx-accfill wx-o40" style="stroke-dasharray:3 3"/></g><g class="wx-st" data-only="4"><text x="637.7" y="52" text-anchor="middle" class="wx-t-s wx-halo">Yukon soil DNA: traces</text><text x="637.7" y="65" text-anchor="middle" class="wx-t-s wx-halo">to c. 5,000 (debated)</text></g><g class="wx-st" data-s="5"><circle cx="691.0" cy="398" r="5.5" class="wx-accfill wx-edge"/></g><g class="wx-st" data-s="5"><polygon points="689.8,388 684.8,380 694.8,380" class="wx-c3"/><text x="697.8" y="376" text-anchor="end" class="wx-t-s wx-halo">people c. 1280 CE</text></g><g class="wx-st" data-s="5"><text x="691.0" y="420" text-anchor="end" class="wx-t-s wx-halo">moa gone within</text><text x="691.0" y="433" text-anchor="end" class="wx-t-s wx-halo">c. 150 years</text></g><g class="wx-st wx-hide" data-only="5"><text x="362.7" y="402" text-anchor="middle" class="wx-t wx-halo">Losses track people and climate,</text><text x="362.7" y="418" text-anchor="middle" class="wx-t wx-halo">region by region, not one date</text></g><g><polygon points="196,498 191,490 201,490" class="wx-c3"/><text x="206" y="498" class="wx-t-s">people arrive</text><circle cx="306" cy="494" r="5" class="wx-accfill wx-edge"/><text x="316" y="498" class="wx-t-s">last dates of large animals</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> North America: about 35 genera vanish around the Younger Dryas onset. It looks like one blow.</p><ol class="wx-steplist"><li>North America: about 35 genera vanish around the Younger Dryas onset. It looks like one blow.</li><li>Australia: most giants were gone about 46,000 years ago, soon after people arrived.</li><li>Northern Eurasia: losses spread over thousands of years, from woolly rhino to giant deer.</li><li>Refuges: island mammoths last to about 4,000 years ago; Yukon soil DNA hints at late survival.</li><li>New Zealand&#x27;s moa vanish within about 150 years of people. Losses track people and climate, not one date.</li></ol><figcaption>Last dates of large animals over the last 60,000 years in five regions, set against the Younger Dryas and the arrival of people. <span class="wx-src">Based on: Faith and Surovell 2009; Bennett et al. 2021 (White Sands); Roberts et al. 2001; Lord et al. 2020; Stuart et al. 2004; Graham et al. 2016; Dehasque et al. 2024; Murchie et al. 2021; Holdaway et al. 2014. Dates rounded; human arrival markers are minimum ages.</span></figcaption><p class="vh">A timeline from 60,000 years ago to today with five rows: North America, Australia, northern Eurasia, Arctic islands and New Zealand. A shaded band marks the Younger Dryas, 12,900 to 11,700 years ago. Step 1 shows North America losing about 35 genera between about 13,800 and 11,400 years ago, with people present by about 23,000 years ago. Step 2 shows Australia&#x27;s giants gone about 46,000 years ago, after people arrived by about 50,000 years ago. Step 3 shows northern Eurasia&#x27;s staggered losses: woolly rhino about 14,000 years ago and giant deer about 7,700 years ago. Step 4 adds island mammoths on St Paul, about 5,600 years ago, and Wrangel, about 4,000 years ago, and Yukon soil DNA traces to about 5,000 years ago, debated. Step 5 adds New Zealand&#x27;s moa, gone within about 150 years of people arriving around 1280 CE, and notes that losses track people and climate region by region.</p></figure></section><section class="wsec" id="megafauna-extinction-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The dates that do not line up</h3><p>The trouble begins when the lens widens. Australia lost its giant kangaroos, wombat-like diprotodons and huge lizards around 46,000 years ago, some 33,000 years before the Younger Dryas, within several thousand years of people arriving. In northern Eurasia the woolly rhino died out around 14,000 years ago, during a warm spell before the Younger Dryas. The giant deer lived on in western Siberia until about 7,700 years ago.</p><p>Mammoths are the most telling of all. They survived on St Paul Island in the Bering Sea until about 5,600 years ago, when the island&#x27;s fresh water ran short, and on Wrangel Island off Siberia until about 4,000 years ago, when the pyramids of Giza were already standing. A 2024 study of their genomes found a population that had been stable for thousands of years before it vanished. In Yukon, DNA in permafrost soils suggests that mammoths and horses may have lingered into the Holocene, perhaps as late as 5,000–6,000 years ago, though some specialists treat that cautiously.</p><aside class="wcall"><b>Fresh from the field</b><p>In February 2026 PLOS ONE retracted a 2025 Comet Research Group study that reported shocked quartz at Murray Springs, Blackwater Draw and Arlington Canyon and linked it to North American megafaunal extinction, citing problems with its age models and data reporting. Most of the authors disagreed with the retraction. The Younger Dryas Comet case describes the wider debate.</p></aside></section><section class="wsec" id="megafauna-extinction-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>What the muck really is</h3><p>The Alaskan muck, too, looks different up close. Geologists such as Troy Péwé showed that it is mostly wind-blown silt washed down the hillsides into the valleys, mixed with plant remains and frozen into permafrost, building up over tens of thousands of years. Its bones are jumbled because they were carried and reworked, and when they are dated they spread across much of the last glaciation, not one moment.</p><figure class="wx wx--static" id="megafauna-extinction-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">What the Alaskan muck is</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="What the Alaskan muck is"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" class="wx-svg" role="img" aria-labelledby="megafauna-extinction-f2-t"><title id="megafauna-extinction-f2-t">Schematic cross-section of a gold-mining creek valley near Fairbanks, Alaska, showing frozen muck over gold-bearing gravel and bedrock, with bones of different ages, and water cannons stripping the muck</title><text x="24" y="26" class="wx-t-cap">What the Alaskan muck is · schematic section, not to scale</text><polygon points="20,420 20,190 120,205 200,260 250,340 470,340 520,260 600,205 700,185 700,420" class="wx-rock"/><text x="40" y="400" class="wx-t-cap">Bedrock (schist)</text><polygon points="20,172 120,186 190,236 185.5,250 120,205 20,190" class="wx-sand"/><polygon points="700,167 600,187 530,236 534.5,250 600,205 700,185" class="wx-sand"/><text x="606" y="162" class="wx-t-s">wind-blown silt (loess)</text><polygon points="238.8,322 481.2,322 470,340 250,340" class="wx-stone3"/><text x="360" y="362" text-anchor="middle" class="wx-t-s wx-halo">gold-bearing gravel on bedrock</text><polygon points="185.5,250 200,260 238.8,322 481.2,322 520,260 534.5,250" class="wx-soil wx-grow" style="--d:1"/><polygon points="263,251 277,251 270,296" class="wx-ice wx-edge-soft"/><polygon points="323,251 337,251 330,296" class="wx-ice wx-edge-soft"/><polygon points="393,251 407,251 400,296" class="wx-ice wx-edge-soft"/><polygon points="453,251 467,251 460,296" class="wx-ice wx-edge-soft"/><rect x="369.5" y="285.5" width="12" height="3" rx="1.5" class="wx-paper wx-edge-soft wx-pop" transform="rotate(50.9 369.5 285.5)" style="--d:2"/><rect x="356.0" y="286.2" width="12" height="3" rx="1.5" class="wx-paper wx-edge-soft wx-pop" transform="rotate(10.5 356.0 286.2)" style="--d:3"/><rect x="357.3" y="271.6" width="12" height="3" rx="1.5" class="wx-paper wx-edge-soft wx-pop" transform="rotate(15.6 357.3 271.6)" style="--d:4"/><rect x="257.4" y="303.2" width="12" height="3" rx="1.5" class="wx-paper wx-edge-soft wx-pop" transform="rotate(-23.6 257.4 303.2)" style="--d:5"/><rect x="441.8" y="266.7" width="12" height="3" rx="1.5" class="wx-paper wx-edge-soft wx-pop" transform="rotate(23.2 441.8 266.7)" style="--d:6"/><rect x="492.3" y="264.2" width="12" height="3" rx="1.5" class="wx-paper wx-edge-soft wx-pop" transform="rotate(55.8 492.3 264.2)" style="--d:2"/><rect x="382.5" y="296.0" width="12" height="3" rx="1.5" class="wx-paper wx-edge-soft wx-pop" transform="rotate(-41.1 382.5 296.0)" style="--d:3"/><rect x="362.2" y="262.8" width="12" height="3" rx="1.5" class="wx-paper wx-edge-soft wx-pop" transform="rotate(-52.9 362.2 262.8)" style="--d:4"/><rect x="282.5" y="271.9" width="12" height="3" rx="1.5" class="wx-paper wx-edge-soft wx-pop" transform="rotate(-56.4 282.5 271.9)" style="--d:5"/><rect x="338.6" y="286.1" width="12" height="3" rx="1.5" class="wx-paper wx-edge-soft wx-pop" transform="rotate(41.1 338.6 286.1)" style="--d:6"/><rect x="389.9" y="289.0" width="12" height="3" rx="1.5" class="wx-paper wx-edge-soft wx-pop" transform="rotate(-0.0 389.9 289.0)" style="--d:2"/><rect x="343.5" y="296.4" width="12" height="3" rx="1.5" class="wx-paper wx-edge-soft wx-pop" transform="rotate(-26.6 343.5 296.4)" style="--d:3"/><rect x="465.4" y="313.9" width="12" height="3" rx="1.5" class="wx-paper wx-edge-soft wx-pop" transform="rotate(40.8 465.4 313.9)" style="--d:4"/><rect x="309.0" y="298.8" width="12" height="3" rx="1.5" class="wx-paper wx-edge-soft wx-pop" transform="rotate(-32.4 309.0 298.8)" style="--d:5"/><rect x="237.7" y="277.0" width="12" height="3" rx="1.5" class="wx-paper wx-edge-soft wx-pop" transform="rotate(32.0 237.7 277.0)" style="--d:6"/><rect x="445.3" y="282.8" width="12" height="3" rx="1.5" class="wx-paper wx-edge-soft wx-pop" transform="rotate(-13.6 445.3 282.8)" style="--d:2"/><g class="wx-pop" style="--d:3"><line x1="430" y1="262" x2="560" y2="92" class="wx-thin"/><text x="566" y="54" class="wx-t-b">"Muck"</text><text x="566" y="70" class="wx-t-s">silt washed down from the</text><text x="566" y="84" class="wx-t-s">hills with plant remains, frozen</text><text x="566" y="98" class="wx-t-s">into permafrost, built up over</text><text x="566" y="112" class="wx-t-s">tens of thousands of years</text></g><g class="wx-pop" style="--d:5"><line x1="300" y1="290" x2="150" y2="270" class="wx-thin"/><text x="24" y="236" class="wx-t-b">Bones of many ages</text><text x="24" y="252" class="wx-t-s">radiocarbon dates spread over</text><text x="24" y="266" class="wx-t-s">tens of thousands of years,</text><text x="24" y="280" class="wx-t-s">not one moment</text></g><g class="wx-pop" style="--d:6"><line x1="462" y1="280" x2="560" y2="292" class="wx-thin"/><text x="566" y="288" class="wx-t-s wx-halo">ice wedges: slow freezing,</text><text x="566" y="302" class="wx-t-s wx-halo">winter after winter</text></g><g class="wx-pop" style="--d:7"><rect x="112" y="140" width="30" height="10" rx="3" class="wx-metal wx-edge" transform="rotate(25 127 145)"/><path d="M144,156 C180,176 200,210 214,246" class="wx-flow wx-s2"/><text x="24" y="60" class="wx-t-b">Water cannons, 1920s–1950s</text><text x="24" y="76" class="wx-t-s">miners thawed and washed away the</text><text x="24" y="90" class="wx-t-s">muck to reach the gold, exposing bones</text><text x="24" y="104" class="wx-t-s">that Rainey and Hibben described</text></g><g class="wx-pop" style="--d:8"><circle cx="370" cy="306" r="6" class="wx-accfill wx-edge"/><line x1="376" y1="310" x2="520" y2="390" class="wx-thin"/><text x="526" y="386" class="wx-t-b">Blue Babe</text><text x="526" y="402" class="wx-t-s">a steppe bison with lion bite marks,</text><text x="526" y="416" class="wx-t-s">died c. 36,000 radiocarbon years ago</text><text x="526" y="430" class="wx-t-s">(Guthrie 1990)</text></g></svg></div></div><figcaption>A schematic section through a gold-mining creek valley near Fairbanks. The famous bone-rich muck is frozen silt that built up over tens of thousands of years. <span class="wx-src">Based on: After Péwé 1975 (USGS Professional Paper 835) and Guthrie 1990. Schematic; thicknesses vary from place to place.</span></figcaption><p class="vh">A schematic cross-section, not to scale, of a creek valley in interior Alaska. Bedrock forms the valley walls, capped by wind-blown silt on the hills. In the valley floor, gold-bearing gravel lies on bedrock, and above it a thick fill of frozen muck, silt washed down from the hills with plant remains, cut by ice wedges formed winter after winter. Bones of many ages are scattered through the muck. A water cannon on the left sprays the muck away, as miners did from the 1920s to the 1950s. A marker shows Blue Babe, a steppe bison with lion bite marks that died about 36,000 radiocarbon years ago.</p></figure><p>The palaeontologist Dale Guthrie studied one famous muck find, Blue Babe, a steppe bison found by miners near Fairbanks in 1979. Its hide bore the bite and claw marks of lions, and it had died some 36,000 radiocarbon years ago, frozen before scavengers finished it. The frozen carcasses of Siberia tell a similar story: animals that died one at a time, in mud, in rivers or in pits, across tens of thousands of years.</p></section><section class="wsec" id="megafauna-extinction-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What time has hidden</h3><p>Some doubts cut in Carlson&#x27;s favour. The last animal of a species is almost never found, so every last-appearance date comes before the true end. Radiocarbon dates on the final populations are sparse, which can make a gradual fade look sudden, or a sudden loss look gradual. Much of the Alaskan muck was washed away by miners without careful records. And the causes remain truly open: in 2021 Mathew Stewart and colleagues found that North American megafauna numbers tracked temperature but not human population, while other studies worldwide find that losses follow human arrival.</p><p>There is also the question of who survived. Carlson notes that small, adaptable animals came through while the largest died, which he reads as the mark of a catastrophe that hit big bodies hardest. But the same size bias appears wherever people arrived, including on islands with no Ice Age crisis at all: large animals breed slowly and cannot replace losses to hunting or habitat change quickly. Bison, elk, moose and caribou, all big, survived in North America. A size filter fits a slow squeeze by hunters and climate at least as well as a sudden blow.</p></section><section class="wsec" id="megafauna-extinction-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>The verdict</h3><p>The claim that one cataclysm about 12,900 years ago wiped out the megafauna of the Americas and northern Eurasia is contradicted by the timing. The losses were staggered by continent and by species over tens of thousands of years, with giants surviving on islands into the age of writing. We rate it as ruled out.</p><p>That does not close the North American question. The losses there really were fast, and whether hunters, climate or both drove them, and whether any cosmic event added a blow, is still worth testing with more dates on the last animals and independent checks of the boundary layers. The strongest pattern in the evidence is not a single day of doom but a long, uneven retreat of the giants, region by region, as the climate lurched and people spread.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-loss" style="--i:0"><span class="wtl-y">44,000 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Most of Australia&#x27;s giant animals gone</span></li><li class="wtl-loss" style="--i:1"><span class="wtl-y">12,000 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Woolly rhino dies out in Siberia</span></li><li class="wtl-loss" style="--i:2"><span class="wtl-y">10,900 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Younger Dryas begins; North American losses</span></li><li class="wtl-loss" style="--i:3"><span class="wtl-y">5,700 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Last giant deer in western Siberia</span></li><li class="wtl-loss" style="--i:4"><span class="wtl-y">3,600 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">St Paul Island mammoths die out</span></li><li class="wtl-loss" style="--i:5"><span class="wtl-y">2,000 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Last mammoths on Wrangel Island</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">1946 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Hibben describes the Alaskan muck</span></li><li class="wtl-find" style="--i:7"><span class="wtl-y">1979 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Blue Babe found near Fairbanks</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2021 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Yukon soil DNA suggests late survival</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">2024 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Wrangel mammoth genomes published</span></li></ol><details class="srcs"><summary>Sources for this case (18)</summary><ol><li>Faith, J. T. &amp; Surovell, T. A. (2009). Synchronous extinction of North America&#x27;s Pleistocene mammals. PNAS 106(49): 20641–20645. <a href="https://doi.org/10.1073/pnas.0908153106" target="_blank" rel="noopener">doi:10.1073/pnas.0908153106</a></li><li>Haynes, C. V. (2008). Younger Dryas &#x27;black mats&#x27; and the Rancholabrean termination in North America. PNAS 105(18): 6520–6525. <a href="https://doi.org/10.1073/pnas.0800560105" target="_blank" rel="noopener">doi:10.1073/pnas.0800560105</a></li><li>Roberts, R. G. et al. (2001). New ages for the last Australian megafauna: continent-wide extinction about 46,000 years ago. Science 292(5523): 1888–1892. <a href="https://doi.org/10.1126/science.1060264" target="_blank" rel="noopener">doi:10.1126/science.1060264</a></li><li>Stuart, A. J., Kosintsev, P. A., Higham, T. F. G. &amp; Lister, A. M. (2004). Pleistocene to Holocene extinction dynamics in giant deer and woolly mammoth. Nature 431: 684–689. <a href="https://doi.org/10.1038/nature02890" target="_blank" rel="noopener">doi:10.1038/nature02890</a></li><li>Lord, E. et al. (2020). Pre-extinction demographic stability and genomic signatures of adaptation in the woolly rhinoceros. Current Biology 30(19): 3871–3879.</li><li>Graham, R. W. et al. (2016). Timing and causes of mid-Holocene mammoth extinction on St. Paul Island, Alaska. PNAS 113(33): 9310–9314. <a href="https://doi.org/10.1073/pnas.1604903113" target="_blank" rel="noopener">doi:10.1073/pnas.1604903113</a></li><li>Dehasque, M., Morales, H. E., Díez-del-Molino, D. et al. (2024). Temporal dynamics of woolly mammoth genome erosion prior to extinction. Cell 187(14): 3531–3540. <a href="https://doi.org/10.1016/j.cell.2024.05.033" target="_blank" rel="noopener">doi:10.1016/j.cell.2024.05.033</a></li><li>Murchie, T. J. et al. (2021). Collapse of the mammoth-steppe in central Yukon as revealed by ancient environmental DNA. Nature Communications 12: 7120. <a href="https://doi.org/10.1038/s41467-021-27439-6" target="_blank" rel="noopener">doi:10.1038/s41467-021-27439-6</a></li><li>Stewart, M., Carleton, W. C. &amp; Groucutt, H. S. (2021). Climate change, not human population growth, correlates with Late Quaternary megafauna declines in North America. Nature Communications 12: 965. <a href="https://doi.org/10.1038/s41467-021-21201-8" target="_blank" rel="noopener">doi:10.1038/s41467-021-21201-8</a></li><li>Sandom, C., Faurby, S., Sandel, B. &amp; Svenning, J.-C. (2014). Global late Quaternary megafauna extinctions linked to humans, not climate change. Proceedings of the Royal Society B 281: 20133254. <a href="https://doi.org/10.1098/rspb.2013.3254" target="_blank" rel="noopener">doi:10.1098/rspb.2013.3254</a></li><li>Holdaway, R. N. et al. (2014). An extremely low-density human population exterminated New Zealand moa. Nature Communications 5: 5436. <a href="https://doi.org/10.1038/ncomms6436" target="_blank" rel="noopener">doi:10.1038/ncomms6436</a></li><li>Guthrie, R. D. (1990). Frozen Fauna of the Mammoth Steppe: The Story of Blue Babe. University of Chicago Press.</li><li>Guthrie, R. D. (2006). New carbon dates link climatic change with human colonization and Pleistocene extinctions. Nature 441: 207–209. <a href="https://doi.org/10.1038/nature04604" target="_blank" rel="noopener">doi:10.1038/nature04604</a></li><li>Péwé, T. L. (1975). Quaternary Geology of Alaska. US Geological Survey Professional Paper 835.</li><li>Hibben, F. C. (1946). The Lost Americans. Thomas Y. Crowell, New York.</li><li>Hancock, G. (2017). Muck, mammoths and extinctions: was Alaska the scene of a giant cataclysm at the end of the Ice Age? grahamhancock.com, 28 August 2017.</li><li>PLOS ONE Editors (2026). Retraction: Shocked quartz at the Younger Dryas onset (12.8 ka) supports cosmic airbursts/impacts contributing to North American megafaunal extinctions and collapse of the Clovis technocomplex. PLOS ONE. <a href="https://doi.org/10.1371/journal.pone.0342620" target="_blank" rel="noopener">doi:10.1371/journal.pone.0342620</a></li><li>Carlson, R. Kosmographia podcast, episodes #011 &#x27;Younger Dryas: Catastrophe and Megafauna&#x27; and #013 &#x27;Younger Dryas: Extinction, Part 2&#x27;. randallcarlson.com.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-megafauna-extinction" data-t="The Mammoth Mystery: Did a Cataclysm Kill the Giants?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Mammoth Mystery: Did a Cataclysm Kill the Giants?</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-megafauna-extinction</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-amazon-cities-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Area of the Aquiry (Fig. 3 in Pärssinen et al. (2026). Over 20,000 precolonial earthworks in the Southwest Amazonia), Nature.png" data-cap="Amazon basin: Upano Valley (Ecuador), Llanos de Mojos (Bolivia), Acre (Brazil), Upper Xingu (Brazil)" data-big><figcaption></figcaption></figure><div class="sh-k">Floods, Fire and Ice</div><h2 class="sh-t" id="case-amazon-cities-st" tabindex="-1">Amazon Garden Cities: Lost Knowledge or Local Genius?</h2><p class="sh-s">Lasers see through the rainforest and find roads, platforms and tens of thousands of earthworks. Did Amazonians invent all this, or inherit it from a lost Ice Age world?</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> The Amazon&#x27;s earthworks and dark earths were inherited from a lost Ice Age civilisation, rather than invented by Amazonian peoples over the last few thousand years.</p></div><p class="v4-q">Were the Amazon&#x27;s earthworks and dark earths inherited from a lost Ice Age civilisation?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Lasers flown over the Amazon have found thousands of platforms, roads and canals under the trees.</li><li>Some networks, like the Upano Valley in Ecuador, held cities from about 500 BCE.</li><li>The rich dark soils were built up over centuries from ordinary household waste, not delivered by anyone.</li><li>Every dated site falls within the last 2,600 years, and crops were domesticated locally from about 10,000 years ago.</li><li>A lost Ice Age civilisation is not needed to explain any of it; the local genius is the story.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Biology</span><span class="thr">Engineering</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="6000" >6,000</b><span class="ctr-u"> platforms</span></div><div class="ctr-l">earthen platforms mapped by lidar in the Upano Valley</div><div class="ctr-c">Rostain et al. 2024</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="315" >315</b><span class="ctr-u"> ha</span></div><div class="ctr-l">area of Landívar, the largest known Casarabe centre</div><div class="ctr-c">Prümers et al. 2022</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="24000" >24,000</b><span class="ctr-u"> earthworks</span></div><div class="ctr-l">estimated in south-western Amazonia alone (24,000–30,000)</div><div class="ctr-c">Pärssinen et al. 2026</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="10850" >10,850</b><span class="ctr-u"> years</span></div><div class="ctr-l">since people began building forest islands in Bolivia</div><div class="ctr-c">Lombardo et al. 2020</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The Amazon&#x27;s earthworks and dark earths were inherited from a lost Ice Age civilisation, rather than invented by Amazonian peoples over the last few thousand years.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The part of Hancock&#x27;s case about scale is right, and the evidence now outruns even his description. The part about origins is not supported. Every dated earthwork society falls within roughly the last 2,600 years, dark earths build up over centuries from ordinary household waste, and the crop record shows local domestication by Amazonian foragers from about 10,000 years ago. No site, artefact or crop from before the Younger Dryas points to an older source. The lost civilisation is not contradicted everywhere; it is simply absent from a record that keeps growing.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 3 of 6, leaning one way"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>leaning one way</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">For decades textbooks were overconfident in the wrong direction: they presented Amazonia as a thinly peopled wilderness, and some still do. The evidence now supports large, lasting and inventive societies. Newer textbooks are cautious about population sizes, which is fair. The gap to close is not towards a lost civilisation, but towards giving Amazonian peoples full credit for one of the great engineered landscapes of the world.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Lidar over about 300 km² of Ecuador&#x27;s Upano Valley revealed some 6,000 earthen platforms, plazas and straight roads, occupied from about 500 BCE to between 300 and 600 CE.<small>Rostain et al. 2024</small></li><li>In the Bolivian Amazon the Casarabe culture (c. 500–1400 CE) built low-density urban centres such as Cotoca (147 ha) and Landívar (315 ha), with platform mounds up to 22 m high, causeways and a 7 km canal, in a settlement network covering about 4,500 km².<small>Prümers et al. 2022</small></li><li>A 2026 lidar study in south-western Amazonia found 432 earthworks along its flight lines, only 36 of them previously known, and estimated some 24,000–30,000 in the region, built between about 600 BCE and 850 CE.<small>Pärssinen et al. 2026</small></li><li>People were painting rock shelters at Monte Alegre in the lower Amazon about 11,000 years ago, and in Bolivia they were building forest islands and growing manioc and squash by about 10,300–10,800 years ago.<small>Roosevelt et al. 1996; Lombardo et al. 2020</small></li><li>Amazonian dark earths (terra preta) are fertile, charcoal-rich soils made by people; the Kuikuro of the Upper Xingu still create them deliberately today.<small>Schmidt et al. 2023</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>How many people lived in Amazonia before 1492; estimates for regions and the whole basin vary several-fold.</li><li>When dark earths first formed; most date to the last 2,500 years, but a few sites may begin around 5,000 years ago, and one team has argued some began naturally.</li><li>What the geometric enclosures of Acre were for: ceremonial spaces, gathering places or defended villages.</li><li>What the faint &#x27;Australasian&#x27; genetic signal found in some Amazonian peoples means for how and when the Americas were first settled.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Wood, thatch and fibre, the main building materials, have rotted away, leaving only earthworks, pottery and soils.</li><li>Epidemics after 1492 emptied much of the basin before any European recorded its societies in detail, and the forest regrew over their works.</li><li>Most of Amazonia has never been surveyed by lidar, so the known sites are a small sample.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>For decades many archaeologists, following Betty Meggers&#x27;s Amazonia: Man and Culture in a Counterfeit Paradise (1971), held that poor soils kept Amazonian societies small. That view has collapsed. Lidar, excavation and soil science now show dense, engineered landscapes: platforms, roads, canals, ditched enclosures and fertile dark earths, built by Indigenous peoples over the last few thousand years on foundations laid by foragers and early farmers from about 11,000 years ago. The mainstream reads this as a long, local story of invention, not an inheritance from elsewhere.</p><ul><li>Every dated earthwork society falls within roughly the last 2,600 years.</li><li>Plant domestication in Amazonia can be traced step by step from about 10,000 years ago, in local species such as manioc and squash.</li><li>Dark earth is made today by the Kuikuro from household waste, charcoal and ash, a recipe that needs no lost technology.</li><li>No artefact, crop or site from Amazonia points to a foreign or older civilisation.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Graham Hancock argued, before much of the lidar work, that the Amazon was not a pristine jungle but home to people with &#x27;sophisticated geometrical and astronomical skills&#x27; who built &#x27;immense earthworks, many with footprints larger than that of the Great Pyramid&#x27;, in the words of his book&#x27;s description. He links the geometric enclosures of Acre to Ohio&#x27;s earthworks, calls terra preta a &#x27;miracle earth&#x27;, and argues that such skills are best explained as &#x27;a shared legacy of knowledge inherited from a much earlier civilization that has been lost to history&#x27;, one he places before the Younger Dryas, about 12,800 years ago.</p><ul><li>Archaeologists wrongly dismissed the Amazon for decades, and each new survey has made its societies larger and older.</li><li>Geometric earthworks in Amazonia and in Ohio share squares and circles, which he reads as a common tradition.</li><li>Dark earth seems to need large settled populations, while large populations seem to need dark earth, which he reads as a sign of knowledge brought in from outside.</li><li>A faint Australasian genetic signal in some Amazonian peoples (&#x27;Population Y&#x27;) hints at an unexpected ancient connection.</li></ul><div class="face-s"><b>Its strongest point</b><p>Hancock was right, early and against much expert opinion, that the Amazon held large, engineered, geometrically minded societies. The &#x27;counterfeit paradise&#x27; view that he attacked has been overturned by lidar and soil science.</p></div><p class="face-cr"><b>Credit</b> Graham Hancock (America Before, 2019; Ancient Apocalypse season 2, Netflix, 2024; The Joe Rogan Experience, including #2136 with Flint Dibble, April 2024)</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>An earthwork, platform or dark earth in Amazonia dated securely to before about 12,000 years ago.</li><li>A crop, tool type or material in early Amazonian sites that cannot have developed locally and matches an older source elsewhere.</li><li>Lidar and excavation of large unsurveyed regions, testing whether earlier monument phases lie beneath the known ones.</li><li>Ancient DNA that explains the Australasian signal with a specific route and date.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,155 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Amazon Garden Cities: Lost Knowledge or Local Genius?"><button type="button" class="wtoc-i" data-go="amazon-cities-s1">The jungle that was a garden</button><button type="button" class="wtoc-i" data-go="amazon-cities-s2">What the lasers found</button><button type="button" class="wtoc-i" data-go="amazon-cities-s3">Hancock&#x27;s case at its strongest</button><button type="button" class="wtoc-i" data-go="amazon-cities-s4">Where the dates lead</button><button type="button" class="wtoc-i" data-go="amazon-cities-s5">What the forest took</button><button type="button" class="wtoc-i" data-go="amazon-cities-s6">What would settle it</button></nav></div><section class="wsec" id="amazon-cities-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The jungle that was a garden</h3><p>For much of the 20th century, the Amazon was pictured as a green wilderness, too poor in soil to feed more than small bands. In 1971 the archaeologist Betty Meggers called it a &#x27;counterfeit paradise&#x27;: lush to look at, hostile to civilisation. Early Spanish reports of crowded riverbanks and great chiefdoms were dismissed as exaggerations.</p><p>Graham Hancock never accepted that picture. In America Before (2019) and in the second season of Ancient Apocalypse (2024), he described an Amazon full of immense geometric earthworks and a man-made &#x27;miracle earth&#x27; called terra preta, and argued that both reflect a legacy of knowledge from a civilisation lost at the end of the Ice Age. The first half of his argument has been spectacularly borne out. The second half is the question here.</p><blockquote class="wpull"><p>Hancock bet that the Amazon hid great works. The lasers bore him out on that, and pointed somewhere else on who made them.</p></blockquote></section><section class="wsec" id="amazon-cities-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What the lasers found</h3><p>Lidar, airborne laser scanning that measures the ground beneath the canopy, has transformed the field. In 2022 Heiko Prümers and colleagues published lidar maps of the Casarabe culture in the Llanos de Mojos of Bolivia, active from about 500 to 1400 CE. Its largest centres, Cotoca at 147 ha and Landívar at 315 ha, had platform mounds up to 22 m high, straight raised causeways running for kilometres, reservoirs and a 7 km canal, all set within a network of smaller sites over some 4,500 km².</p><p>In 2024 Stéphen Rostain and colleagues revealed the Upano Valley of Ecuador: about 6,000 rectangular platforms, plazas and a web of straight, dug roads across some 300 km², built by the Kilamope and Upano peoples from about 500 BCE and abandoned between 300 and 600 CE. They called it garden urbanism: towns spread through fields and orchards rather than packed inside walls.</p><figure class="wx wx--static" id="amazon-cities-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Bigger than the Great Pyramid</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Bigger than the Great Pyramid"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" class="wx-svg" role="img" aria-labelledby="amazon-cities-f2-t"><title id="amazon-cities-f2-t">The areas of two Casarabe sites in Bolivia compared with the base of the Great Pyramid, drawn to the same scale</title><text x="24" y="28" class="wx-t-cap">Footprints to the same scale (equal-area squares)</text><rect x="40.0" y="337.8" width="32.2" height="32.2" class="wx-stone2 wx-edge wx-grow" style="--d:0"/><text x="40.0" y="390" class="wx-t-b">Great Pyramid of Khufu</text><text x="40.0" y="404" class="wx-t-s">base 230 m, 5.3 ha</text><rect x="224.0" y="200.3" width="169.7" height="169.7" class="wx-green wx-o60 wx-edge wx-grow" style="--d:3"/><text x="224.0" y="390" class="wx-t-b">Cotoca, Casarabe culture</text><text x="224.0" y="404" class="wx-t-s">site area 147 ha</text><rect x="427.7" y="121.5" width="248.5" height="248.5" class="wx-green wx-o60 wx-edge wx-grow" style="--d:6"/><text x="427.7" y="390" class="wx-t-b">Landívar, Casarabe culture</text><text x="427.7" y="404" class="wx-t-s">site area 315 ha</text><text x="40" y="310" class="wx-t-s">the pyramid's</text><text x="40" y="323" class="wx-t-s">base, for scale</text><line x1="60" y1="328" x2="60" y2="335.8" class="wx-thin"/><g><rect x="40" y="420" width="35.0" height="5" class="wx-inkfill"/><rect x="75.0" y="420" width="35.0" height="5" class="wx-paper wx-edge"/><text x="40" y="438" class="wx-t-s">0</text><text x="110.0" y="438" text-anchor="middle" class="wx-t-s">500 m</text></g><text x="696" y="60" text-anchor="end" class="wx-t-s">Casarabe platform mounds reach 22 m high;</text><text x="696" y="74" text-anchor="end" class="wx-t-s">a 7 km canal fed Cotoca; causeways ran for kilometres</text></svg></div></div><figcaption>Two Casarabe centres in Bolivia compared with the base of the Great Pyramid, as squares of equal area at one scale. <span class="wx-src">Based on: Site areas and features from Prümers et al. 2022; pyramid base after Lehner 1997. Squares show area only, not the sites&#x27; real shapes.</span></figcaption><p class="vh">Three squares at the same scale, with a 500 metre scale bar. A small square for the base of the Great Pyramid of Khufu, 230 metres on a side, 5.3 hectares. A much larger square of equal area to Cotoca, a Casarabe culture centre of 147 hectares. A still larger square for Landívar, 315 hectares. A note adds that Casarabe platform mounds reach 22 metres high, a 7 kilometre canal fed Cotoca and causeways ran for kilometres.</p></figure><aside class="wcall"><b>Fresh from the field</b><p>In 2026 Martti Pärssinen and colleagues published lidar along 4,430 km of flight lines in south-western Amazonia, the land of the famous ditched geometric enclosures of Acre. They found 432 earthworks, only 36 previously known, and estimated some 24,000–30,000 in the region, built between about 600 BCE and 850 CE by what they call the Aquiry, a multicultural society. Their population estimate for 100–300 CE runs from 1.25 to 3 million people.</p></aside></section><section class="wsec" id="amazon-cities-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Hancock&#x27;s case at its strongest</h3><p>Hancock&#x27;s argument has three pillars. First, scale and geometry: squares and circles laid out with precision, some larger than the base of the Great Pyramid, resembling the geometric earthworks of Ohio such as Newark and High Bank. Second, terra preta: a fertile black soil still dug up and sold today, which seems to need large settled populations to create, while such populations need the soil to feed them. That circle, he suggests, is easiest to break if the knowledge came from outside.</p><p>Third, genetics. In 2015 Pontus Skoglund and colleagues found that some Amazonian peoples, such as the Suruí and Karitiana, carry a faint trace of ancestry shared with Indigenous Australians and New Guineans, which they called Population Y. Hancock reads it as a clue to ancient voyages. And behind all three pillars stands his most effective point: the experts who dismissed the Amazon were wrong for decades, so why trust their assurance that there is nothing older to find?</p></section><section class="wsec" id="amazon-cities-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Where the dates lead</h3><p>The difficulty is chronology. Every earthwork society dated so far falls within roughly the last 2,600 years: the Aquiry from about 600 BCE, the Upano Valley from about 500 BCE, Casarabe from 500 CE, and the Upper Xingu towns described by Michael Heckenberger from about 1250 CE. Before them lies a long, well documented build-up. People were painting the rock shelter of Caverna da Pedra Pintada near Monte Alegre about 11,000 years ago. In the Llanos de Mojos, Umberto Lombardo&#x27;s team found that people began building thousands of forest islands about 10,850 years ago and were growing manioc and squash by about 10,300 years ago.</p><figure class="wx wx--steps" id="amazon-cities-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">Eleven thousand years in the Amazon</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Eleven thousand years in the Amazon"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" class="wx-svg" role="img" aria-labelledby="amazon-cities-f1-t"><title id="amazon-cities-f1-t">A timeline of Amazonian people, farming, dark earths and earthwork societies compared with the proposed lost civilisation, in five steps</title><text x="24" y="28" class="wx-t-cap">Amazonia, years ago (evidence by date)</text><line x1="242.0" y1="48" x2="242.0" y2="392" class="wx-guide"/><text x="242.0" y="410" text-anchor="middle" class="wx-t-s">14,000</text><line x1="306.0" y1="48" x2="306.0" y2="392" class="wx-guide"/><text x="306.0" y="410" text-anchor="middle" class="wx-t-s">12,000</text><line x1="370.0" y1="48" x2="370.0" y2="392" class="wx-guide"/><text x="370.0" y="410" text-anchor="middle" class="wx-t-s">10,000</text><line x1="434.0" y1="48" x2="434.0" y2="392" class="wx-guide"/><text x="434.0" y="410" text-anchor="middle" class="wx-t-s">8000</text><line x1="498.0" y1="48" x2="498.0" y2="392" class="wx-guide"/><text x="498.0" y="410" text-anchor="middle" class="wx-t-s">6000</text><line x1="562.0" y1="48" x2="562.0" y2="392" class="wx-guide"/><text x="562.0" y="410" text-anchor="middle" class="wx-t-s">4000</text><line x1="626.0" y1="48" x2="626.0" y2="392" class="wx-guide"/><text x="626.0" y="410" text-anchor="middle" class="wx-t-s">2000</text><line x1="690.0" y1="48" x2="690.0" y2="392" class="wx-guide"/><text x="690.0" y="410" text-anchor="middle" class="wx-t-s">today</text><line x1="210" y1="392" x2="690" y2="392" class="wx-line"/><g class="wx-st" data-s="1"><text x="24" y="71" class="wx-t-b">Proposed lost civilisation</text><text x="24" y="84" class="wx-t-s">before c. 12,800 years ago</text><rect x="210.0" y="64" width="70.4" height="14" rx="3" class="wx-accfill wx-o20"/><rect x="210.0" y="64" width="70.4" height="14" rx="3" class="wx-dash"/><text x="286.4" y="75" class="wx-t-s wx-t-a">no dated site</text></g><g class="wx-st" data-s="1"><text x="24" y="108" class="wx-t-b">People in the Amazon</text><text x="24" y="121" class="wx-t-s">cave paintings, Monte Alegre</text><rect x="331.6" y="101" width="38.4" height="14" rx="3" class="wx-c2 wx-o80"/></g><g class="wx-st" data-s="2"><text x="24" y="145" class="wx-t-b">Farming and landscape</text><text x="24" y="158" class="wx-t-s">forest islands, manioc, squash</text><rect x="342.8" y="138" width="347.2" height="14" rx="3" class="wx-c3 wx-o80"/></g><g class="wx-st" data-s="3"><text x="24" y="182" class="wx-t-b">Dark earths (terra preta)</text><text x="24" y="195" class="wx-t-s">a few from c. 5,000 years; most later</text><rect x="530.0" y="175" width="80.0" height="14" rx="3" class="wx-c6 wx-o40"/><rect x="610.0" y="175" width="67.2" height="14" rx="3" class="wx-c6 wx-o80"/></g><g class="wx-st" data-s="4"><text x="24" y="219" class="wx-t-b">Upano Valley, Ecuador</text><text x="24" y="232" class="wx-t-s">c. 500 BCE–600 CE</text><rect x="610.0" y="212" width="35.2" height="14" rx="3" class="wx-c1 wx-o80"/></g><g class="wx-st" data-s="4"><text x="24" y="256" class="wx-t-b">Aquiry earthworks, Acre</text><text x="24" y="269" class="wx-t-s">c. 600 BCE–850 CE</text><rect x="606.8" y="249" width="46.4" height="14" rx="3" class="wx-c1 wx-o80"/></g><g class="wx-st" data-s="4"><text x="24" y="293" class="wx-t-b">Casarabe, Bolivia</text><text x="24" y="306" class="wx-t-s">c. 500–1400 CE</text><rect x="642.0" y="286" width="28.8" height="14" rx="3" class="wx-c1 wx-o80"/></g><g class="wx-st" data-s="4"><text x="24" y="330" class="wx-t-b">Upper Xingu towns</text><text x="24" y="343" class="wx-t-s">c. 1250–1650 CE</text><rect x="666.0" y="323" width="12.8" height="14" rx="3" class="wx-c1 wx-o80"/></g><g class="wx-st" data-s="5"><text x="24" y="367" class="wx-t-b">European contact, epidemics</text><text x="24" y="380" class="wx-t-s">from 1500 CE</text><rect x="674.0" y="360" width="16.0" height="14" rx="3" class="wx-c4 wx-o80"/></g><g class="wx-st wx-hide" data-only="4"><rect x="606.8" y="204" width="72.0" height="142" rx="6" class="wx-hl"/><text x="598.8" y="220" text-anchor="end" class="wx-t wx-t-a wx-halo">all dated earthwork</text><text x="598.8" y="234" text-anchor="end" class="wx-t wx-t-a wx-halo">societies: last c. 2,600 yr</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> The proposed lost civilisation, before c. 12,800 years ago, and the first dated Amazonians, c. 11,000 years ago.</p><ol class="wx-steplist"><li>The proposed lost civilisation, before c. 12,800 years ago, and the first dated Amazonians, c. 11,000 years ago.</li><li>Forest islands, manioc and squash in Bolivia from c. 10,850 years ago: a long local build-up.</li><li>Dark earths: a few may start c. 5,000 years ago; most form in the last 2,500 years.</li><li>Every dated earthwork society falls within the last c. 2,600 years.</li><li>From 1500 CE, epidemics empty much of the basin and the forest grows back.</li></ol><figcaption>The dated evidence from people, farming, dark earths and earthwork societies, set against the lost civilisation proposed before about 12,800 years ago. <span class="wx-src">Based on: Roosevelt et al. 1996; Lombardo et al. 2020; Schmidt et al. 2023 and published dark earth dates; Rostain et al. 2024; Pärssinen et al. 2026; Prümers et al. 2022; Heckenberger et al. 2008. Proposed dating after Hancock 2019.</span></figcaption><p class="vh">A timeline chart from 15,000 years ago to today. Step 1 shows a dashed bar before about 12,800 years ago for the proposed lost civilisation, marked &#x27;no dated site&#x27;, and a bar for people painting rock shelters at Monte Alegre from about 11,200 to 10,000 years ago. Step 2 adds farming and landscape shaping from about 10,850 years ago to today. Step 3 adds dark earths, faint from about 5,000 years ago and strong from about 2,500 years ago. Step 4 adds four earthwork societies: Upano Valley, the Aquiry earthworks of Acre, Casarabe in Bolivia and the Upper Xingu towns, all within the last 2,600 years, and highlights them. Step 5 adds European contact and epidemics from 1500 CE.</p></figure><p>Dark earth fits the same slow pattern. Most dated deposits are younger than about 2,500 years, with a few, such as at Teotônio on the upper Madeira, perhaps reaching back around 5,000 years. In 2023 Morgan Schmidt and colleagues documented how the Kuikuro of the Upper Xingu make it today, by spreading ash, charcoal, food waste and manioc peelings on their fields and middens. Dark earth begins to form within years and builds up over generations. The chicken-and-egg problem dissolves: small villages make a little, and the soil grows with the town.</p><aside class="wcall"><b>How do we know dark earth is made by people?</b><p>Dark earths are full of pottery sherds, charcoal and the phosphorus and calcium of bones and food waste, and they cluster around old village sites. In 2021 a team led by Lucas Silva proposed that some began as natural river deposits, enriched later by people. Some 45 researchers led by Umberto Lombardo replied that the evidence, including the Kuikuro practice seen today, supports a human origin. Either way, the dates place most dark earths within the last few thousand years.</p></aside><p>Population Y, meanwhile, is a real puzzle about the first settlement of the Americas, many thousands of years before any earthwork, and geneticists read it as a trace of ancestry carried by some of the first migrants from Asia. In the 2024 Joe Rogan Experience debate, the archaeologist Flint Dibble pressed the wider point: a lost civilisation should leave material traces, such as its crops. In Amazonia the crops tell a local story.</p></section><section class="wsec" id="amazon-cities-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>What the forest took</h3><p>Honesty requires a large caveat. Amazonian builders worked in earth, wood and fibre, and the wood and fibre have gone. Epidemics after 1492 swept through the basin before most of its societies were described, and the forest closed over their fields. Lidar has so far covered only a tiny fraction of the region; a 2023 study by Vinicius Peripato and colleagues estimated that more than 10,000 earthworks remained hidden, and the 2026 survey suggests that even that was too low. Older phases could lie beneath younger ones.</p><p>So the absence of Ice Age monuments here is weaker evidence than it would be in a desert. But it is not nothing. Wherever archaeologists have dug into the earthworks and dark earths, they have found the pottery, charcoal and plant remains of the peoples already known, stacked in order, with no foreign or older layer beneath.</p></section><section class="wsec" id="amazon-cities-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What would settle it</h3><p>The lost civilisation idea would gain real weight from one securely dated earthwork, platform or dark earth older than about 12,000 years, or from a crop or technology in early Amazonian sites that could not have developed locally. Lidar and excavation in unsurveyed regions are the way to find either. Ancient DNA from early Amazonian burials could explain Population Y.</p><p>Meanwhile the verdict on the two halves of Hancock&#x27;s argument differs sharply. On scale, he was ahead of many specialists, and the Amazon turns out to have been one of the great engineered landscapes of the world. On origins, the evidence points to a long, local story of Indigenous invention, which is arguably the more remarkable claim. For the first peopling of the continent, see the First Americans case.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">8,900 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Forest islands and early crops in Bolivia</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">500 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Upano Valley platforms and roads begin</span></li><li class="wtl-build" style="--i:2"><span class="wtl-y">500 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Casarabe culture begins</span></li><li class="wtl-build" style="--i:3"><span class="wtl-y">1250 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Upper Xingu towns</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">1971 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Meggers&#x27;s &#x27;counterfeit paradise&#x27;</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">2019 CE</span><span class="wtl-k">Event</span><span class="wtl-t">America Before published</span></li><li class="wtl-find" style="--i:6"><span class="wtl-y">2022 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Lidar reveals Casarabe urbanism</span></li><li class="wtl-find" style="--i:7"><span class="wtl-y">2024 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Upano Valley garden cities published</span></li><li class="wtl-find" style="--i:8"><span class="wtl-y">2026 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Over 20,000 earthworks in Acre region</span></li></ol><details class="srcs"><summary>Sources for this case (14)</summary><ol><li>Rostain, S., Dorison, A., de Saulieu, G., Prümers, H., Le Pennec, J.-L., Mejía Mejía, F., Freire, A. M., Pagán-Jiménez, J. R. &amp; Descola, P. (2024). Two thousand years of garden urbanism in the Upper Amazon. Science 383(6679): 183–189. <a href="https://doi.org/10.1126/science.adi6317" target="_blank" rel="noopener">doi:10.1126/science.adi6317</a></li><li>Prümers, H., Jaimes Betancourt, C., Iriarte, J., Robinson, M. &amp; Schaich, M. (2022). Lidar reveals pre-Hispanic low-density urbanism in the Bolivian Amazon. Nature 606: 325–328. <a href="https://doi.org/10.1038/s41586-022-04780-4" target="_blank" rel="noopener">doi:10.1038/s41586-022-04780-4</a></li><li>Pärssinen, M., Kalliola, R., Ranzi, A. et al. (2026). Over 20,000 precolonial earthworks in the Southwest Amazonia. Nature 657: 420–425. <a href="https://doi.org/10.1038/s41586-026-10835-7" target="_blank" rel="noopener">doi:10.1038/s41586-026-10835-7</a></li><li>Lombardo, U., Iriarte, J., Hilbert, L., Ruiz-Pérez, J., Capriles, J. M. &amp; Veit, H. (2020). Early Holocene crop cultivation and landscape modification in Amazonia. Nature 581: 190–193. <a href="https://doi.org/10.1038/s41586-020-2162-7" target="_blank" rel="noopener">doi:10.1038/s41586-020-2162-7</a></li><li>Schmidt, M. J. et al. (2023). Intentional creation of carbon-rich dark earth soils in the Amazon. Science Advances 9(38): eadh8499. <a href="https://doi.org/10.1126/sciadv.adh8499" target="_blank" rel="noopener">doi:10.1126/sciadv.adh8499</a></li><li>Roosevelt, A. C. et al. (1996). Paleoindian cave dwellers in the Amazon: the peopling of the Americas. Science 272: 373–384. <a href="https://doi.org/10.1126/science.272.5260.373" target="_blank" rel="noopener">doi:10.1126/science.272.5260.373</a></li><li>Heckenberger, M. J. et al. (2008). Pre-Columbian urbanism, anthropogenic landscapes, and the future of the Amazon. Science 321: 1214–1217. <a href="https://doi.org/10.1126/science.1159769" target="_blank" rel="noopener">doi:10.1126/science.1159769</a></li><li>Peripato, V. et al. (2023). More than 10,000 pre-Columbian earthworks are still hidden throughout Amazonia. Science 382: 103–109. <a href="https://doi.org/10.1126/science.ade2541" target="_blank" rel="noopener">doi:10.1126/science.ade2541</a></li><li>Skoglund, P. et al. (2015). Genetic evidence for two founding populations of the Americas. Nature 525: 104–108. <a href="https://doi.org/10.1038/nature14895" target="_blank" rel="noopener">doi:10.1038/nature14895</a></li><li>Silva, L. C. R. et al. (2021). A new hypothesis for the origin of Amazonian Dark Earths. Nature Communications 12: 127; with the reply by Lombardo, U. et al. (2022), Evidence confirms an anthropic origin of Amazonian Dark Earths, Nature Communications 13.</li><li>Meggers, B. J. (1971). Amazonia: Man and Culture in a Counterfeit Paradise. Aldine, Chicago.</li><li>Hancock, G. (2019). America Before: The Key to Earth&#x27;s Lost Civilization. St. Martin&#x27;s Press, New York; book description at grahamhancock.com/america-before.</li><li>Ancient Apocalypse: The Americas (2024). Season 2. Netflix.</li><li>The Joe Rogan Experience #2136, Graham Hancock and Flint Dibble (April 2024).</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-amazon-cities" data-t="Amazon Garden Cities: Lost Knowledge or Local Genius?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Amazon Garden Cities: Lost Knowledge or Local Genius?</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-amazon-cities</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-bimini-road-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Bimini-N S.JPG" data-cap="Off Paradise Point, North Bimini, Bahamas" data-big><figcaption></figcaption></figure><div class="sh-k">Floods, Fire and Ice</div><h2 class="sh-t" id="case-bimini-road-st" tabindex="-1">The Bimini Road: Atlantis Pavement or Beachrock?</h2><p class="sh-s">A half-mile line of squared stones lies under clear Bahamian water, found in the very year a psychic said Atlantis would rise. Road, harbour or rock?</p><div class="sh-v"><span class="vstamp vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><p class="sh-claim"><b>What the stamp rates:</b> The Bimini Road is a human-made structure, such as a road, wall or harbour, built before the end of the Ice Age.</p></div><p class="v4-q">Did people build the Bimini Road before the end of the Ice Age?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Off Bimini in the Bahamas, a line of flat stone blocks runs for nearly a kilometre under five metres of water.</li><li>The blocks are beachrock: beach sand cemented naturally, which cracks into squarish slabs.</li><li>Cores show the same tilted layers running from block to block, as in one broken slab.</li><li>Dates on the shells and cement fall within the last 2,000 to 4,000 years.</li><li>The stone did not exist when the Ice Age ended, so an Ice Age road is ruled out.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Geology</span><span class="thr">Chemistry</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="0.8" data-dec="1">0.8</b><span class="ctr-u"> km</span></div><div class="ctr-l">length of the line of blocks</div><div class="ctr-c">Gifford and Ball 1980</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="5.5" data-dec="1">5.5</b><span class="ctr-u"> m</span></div><div class="ctr-l">depth of water over the blocks</div><div class="ctr-c">Shinn 2009</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="17" >17</b><span class="ctr-u"> cores</span></div><div class="ctr-l">oriented cores drilled from neighbouring blocks</div><div class="ctr-c">McKusick and Shinn 1980; Shinn 2004</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="3500" >3,500</b><span class="ctr-u"> radiocarbon years</span></div><div class="ctr-l">age of shells in the beachrock</div><div class="ctr-c">Calvert et al. 1979</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The Bimini Road is a human-made structure, such as a road, wall or harbour, built before the end of the Ice Age.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The Ice Age claim fails on the rock itself. Radiocarbon dates on the blocks&#x27; shells and cement fall within roughly the last 2,000–4,000 years, so the stone did not exist when the Ice Age ended. The blocks are beachrock, a material that forms quickly on these shores and cracks into squarish slabs, and oriented cores show the same seaward-dipping layers continuing from block to block, as in a single broken slab. No tools, mortar or artefacts have been found. Later reuse by people is not ruled out, but nothing points to it.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Reference works present the road as natural beachrock with confidence, and the evidence supports that: the dates, the cores and the geology all agree. Where the confidence runs a little ahead of the data is in coverage. The key studies are more than forty years old and sampled a modest number of blocks. A modern, published survey would close the question properly, and would also answer the divers who report stones beneath the blocks.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>The feature is a line of flat, roughly rectangular and polygonal limestone blocks about 0.8 km long, with a hook at its south-west end, lying in about 5.5 m of water off North Bimini; most blocks are 2–3 m across and a few reach 3–4 m.<small>Gifford and Ball 1980; Shinn 2009</small></li><li>The blocks are beachrock: shell sand cemented by calcium carbonate in the intertidal zone, a rock that forms quickly on Bahamian and Caribbean shores and often cracks into squarish slabs.<small>Davaud and Strasser 1984; Shinn 2009</small></li><li>Radiocarbon dates on shells and cement from the blocks fall within roughly the last 2,000–4,000 years; one study dated the shells to about 3,500 and the cement to about 2,800 radiocarbon years.<small>Calvert et al. 1979; McKusick and Shinn 1980; Davaud and Strasser 1984</small></li><li>Seventeen oriented cores from neighbouring blocks showed the internal layers dipping seaward in the same direction from block to block, as expected of a single slab broken in place.<small>McKusick and Shinn 1980; Shinn 2004</small></li><li>The shallow Bahama banks were dry land during the last Ice Age, when sea level stood about 120 m lower, and were flooded as the ice melted.<small>Fairbanks 1989; Carew and Mylroie 1995</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether some blocks rest on smaller &#x27;prop stones&#x27; or on a second course of blocks, as divers such as Gregory Little report, and what that would mean.</li><li>Whether people could have reused natural beachrock slabs in the last few thousand years, for example as a breakwater, without shaping them.</li><li>How much of the site and its neighbouring lines of stones has been mapped and cored in detail since the 1980s.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>No artefacts, tool marks, mortar, wheel ruts or settlement traces have been reported from the site.</li><li>Detailed modern surveys of the whole feature, such as full photogrammetric mapping with dated cores from many blocks, have not been published.</li><li>Any Ice Age coastal sites on the drowned Bahama banks would lie tens of metres deep and have scarcely been searched.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Geologists read the Bimini Road as natural beachrock. Shell sand on the old shoreline was cemented into a slab in the wet intertidal zone a few thousand years ago, cracked along joints into blocks, and was left offshore as the sea crept up and the beach moved inland. The radiocarbon dates of the rock itself, a few thousand years, rule out an Ice Age age, and cores through neighbouring blocks show the same seaward-dipping layers running from one to the next. Similar pavements occur on many Caribbean shores.</p><ul><li>Beachrock is common in the Bahamas and cracks naturally into rectangular and polygonal blocks.</li><li>The rock is only a few thousand years old, by radiocarbon dating of its shells and cement.</li><li>Oriented cores show that neighbouring blocks share the same bedding dip, which laid blocks would not.</li><li>No worked stone, tools or other human traces have been found at the site.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Graham Hancock has dived at Bimini and presents the road as a case the experts closed too quickly. In Ancient Apocalypse he argues that the blocks look too regular and too neatly arranged to be natural, and that they lie on the edge of the Bahama banks, a large landmass drowned at the end of the Ice Age, just where a lost maritime people might have built. He cites divers such as Gregory Little who report stacked blocks and small stones wedged beneath larger ones, and he treats the site as part of a wider pattern of drowned coasts that archaeology has barely explored.</p><ul><li>The blocks form straight, parallel lines with near right-angled corners, which looks like design.</li><li>Some divers report a second layer of stones and small props beneath the large blocks.</li><li>The Bahama banks were a large dry landmass during the Ice Age, and submerged landscapes are rarely surveyed.</li><li>Most of the scientific work was done in the late 1970s and 1980s on a small number of blocks.</li></ul><div class="face-s"><b>Its strongest point</b><p>The drowned Bahama banks are real, vast and barely explored, and Hancock is right that submerged landscapes deserve far more archaeological attention than they get. The road&#x27;s geometry is striking to anyone who swims over it.</p></div><p class="face-cr"><b>Credit</b> Graham Hancock (Underworld, book and Channel 4 series, 2002; Ancient Apocalypse, Netflix, 2022, episode &#x27;Ghosts of a Drowned World&#x27;); with Gregory Little, and earlier J. Manson Valentine and David Zink</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>A new, published survey of the whole feature with high-resolution photogrammetry and oriented cores from many more blocks.</li><li>Any worked stone, tool mark, mortar or artefact sealed beneath a block.</li><li>Dating of the stones beneath the blocks (the reported second course or props) to show whether they are the same slab or something placed.</li><li>Archaeological survey of the deeper drowned shorelines of the Bahama banks, where any Ice Age coastal sites would now lie.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,155 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Bimini Road: Atlantis Pavement or Beachrock?"><button type="button" class="wtoc-i" data-go="bimini-road-s1">A road beneath the sea</button><button type="button" class="wtoc-i" data-go="bimini-road-s2">What the stones are made of</button><button type="button" class="wtoc-i" data-go="bimini-road-s3">The case for a built road</button><button type="button" class="wtoc-i" data-go="bimini-road-s4">Testing the harbour</button><button type="button" class="wtoc-i" data-go="bimini-road-s5">What the sea has hidden</button><button type="button" class="wtoc-i" data-go="bimini-road-s6">What would change the verdict</button></nav></div><section class="wsec" id="bimini-road-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A road beneath the sea</h3><p>On 2 September 1968, off the north-west tip of North Bimini in the Bahamas, the naturalist J. Manson Valentine and fellow divers Jacques Mayol and Robert Angove swam over something that stopped them: a straight line of large, flat, squarish stones in clear water, like paving slabs laid for giants. The timing made it famous. In a reading given in 1940, the American psychic Edgar Cayce had said that part of Atlantis would rise again, and named 1968 or 1969.</p><p>More than half a century later the Bimini Road is still the best known underwater mystery in the Atlantic. Graham Hancock dived there for his book and television series Underworld (2002), and brought it to a global audience in the fourth episode of Ancient Apocalypse (2022), &#x27;Ghosts of a Drowned World&#x27;. So what is it?</p><blockquote class="wpull"><p>Nature rarely makes a straight line of squared stones. On some Bahamian beaches, it does so all the time.</p></blockquote></section><section class="wsec" id="bimini-road-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What the stones are made of</h3><p>The feature is a line of blocks about 0.8 km long, running north-east to south-west with a hook at its southern end, in about 5.5 m of water. Most blocks are 2–3 m across, some 3–4 m, flat-topped with rounded edges, which divers have compared to giant loaves of bread. Two shorter parallel lines lie nearby.</p><p>Geologically, the blocks are beachrock. On warm carbonate coasts, the shell sand of the intertidal zone, wetted and dried twice a day, is glued together by calcium carbonate crystals into a hard slab, sometimes within years or decades. That slab keeps the gentle seaward slope of the beach in its internal layers. As it dries and settles, it cracks along joints, often at near right angles, into rectangles and polygons. When the sea rises and the loose sand is washed away, the hard slab is left behind as a line of blocks.</p><figure class="wx wx--steps" id="bimini-road-f1" data-n="4"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">How a beach becomes a &#x27;road&#x27;</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How a beach becomes a &#x27;road&#x27;"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" class="wx-svg" role="img" aria-labelledby="bimini-road-f1-t"><title id="bimini-road-f1-t">How beachrock forms on a shore, cracks into blocks and is left under the sea, in four steps</title><text x="24" y="28" class="wx-t-cap">Section through a Bahamian shore (not to scale)</text><rect x="24" y="40" width="676" height="340" class="wx-sky"/><polygon points="427.5,232 700,232 700,275.6" class="wx-water wx-o80"/><line x1="427.5" y1="232" x2="700" y2="232" class="wx-line wx-s2"/><polygon points="24,167.4 700,275.6 700,335.6 24,227.4" class="wx-sand wx-edge-soft"/><polygon points="24,227.4 700,335.6 700,380 24,380" class="wx-rock"/><text x="40" y="372" class="wx-t-s">older limestone bedrock</text><text x="60" y="203.2" class="wx-t-s">loose shell sand</text><line x1="365.0" y1="222" x2="700" y2="222" class="wx-dash"/><g class="wx-st wx-hide" data-only="1"><line x1="365.0" y1="192" x2="365.0" y2="224.0" class="wx-thin"/><line x1="490.0" y1="192" x2="490.0" y2="244.0" class="wx-thin"/><text x="427.5" y="170" text-anchor="middle" class="wx-t-b">Intertidal zone</text><text x="427.5" y="184" text-anchor="middle" class="wx-t-s">wetted and dried twice a day</text></g><text x="692" y="226" text-anchor="end" class="wx-t-s wx-halo">sea level then</text><g class="wx-st" data-s="2"><polygon points="325.0,217.6 580.0,258.4 580.0,272.4 325.0,231.6" class="wx-stone2 wx-edge"/><line x1="329.0" y1="221.6" x2="576.0" y2="262.4" class="wx-edge-soft"/><line x1="329.0" y1="225.6" x2="576.0" y2="266.4" class="wx-edge-soft"/><line x1="329.0" y1="228.6" x2="576.0" y2="269.4" class="wx-edge-soft"/></g><g class="wx-st wx-hide" data-only="2"><line x1="452.5" y1="234.0" x2="452.5" y2="120" class="wx-thin"/><text x="452.5" y="100" text-anchor="middle" class="wx-t-b">Cemented slab</text><text x="452.5" y="114" text-anchor="middle" class="wx-t-s">carbonate cement glues the sand; layers keep the seaward slope</text></g><g class="wx-st" data-s="3"><line x1="367.5" y1="223.4" x2="369.5" y2="239.4" class="wx-bold wx-s4"/><line x1="410.0" y1="230.2" x2="412.0" y2="246.2" class="wx-bold wx-s4"/><line x1="452.5" y1="237.0" x2="454.5" y2="253.0" class="wx-bold wx-s4"/><line x1="495.0" y1="243.8" x2="497.0" y2="259.8" class="wx-bold wx-s4"/><line x1="537.5" y1="250.6" x2="539.5" y2="266.6" class="wx-bold wx-s4"/></g><g class="wx-st wx-hide" data-only="3"><line x1="452.5" y1="234.0" x2="452.5" y2="120" class="wx-thin"/><text x="452.5" y="100" text-anchor="middle" class="wx-t-b">Joints crack it into blocks</text><text x="452.5" y="114" text-anchor="middle" class="wx-t-s">often near right angles; blocks 2–4 m across</text></g><g class="wx-st wx-hide" data-s="4"><polygon points="24,140 700,140 700,232 427.5,232 24,167.4" class="wx-water2 wx-o40"/><line x1="24" y1="140" x2="700" y2="140" class="wx-line wx-s2"/><text x="692" y="134" text-anchor="end" class="wx-t-s wx-halo">sea level today</text><line x1="512.5" y1="140" x2="512.5" y2="246.6" class="wx-dim"/><text x="518.5" y="192.8" class="wx-t-n wx-halo">c. 5.5 m</text><text x="60" y="80" class="wx-t-b wx-halo">The sea rises; the beach moves</text><text x="60" y="94" class="wx-t-s wx-halo">inland and the hard slab is left</text><text x="60" y="108" class="wx-t-s wx-halo">offshore as a line of blocks</text></g><g class="wx-st wx-hide" data-only="1"><text x="60" y="80" class="wx-t-b">A sandy beach</text><text x="60" y="94" class="wx-t-s">shell sand sloping gently to the sea</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</
