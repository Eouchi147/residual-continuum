t the surgical reading, and later Ice Age dental work at Villabruna and Riparo Fredian shows deliberate treatment of the living before farming. It falls short of established because it rests on one skeleton for surgery proper, and because planning, anaesthetic plants and infection control are inferred rather than observed.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">General histories of medicine have long opened with Neolithic trepanation and ancient Egyptian papyri, presented with quiet confidence as the beginning of surgery. That confidence was misplaced: it rested on where bones survive and where people looked. The textbooks were underconfident about the skill of Ice Age foragers; the new evidence is a single, strong case rather than a large body of data, so the corrected picture should also stay modest.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>A young person known as TB1 was buried in Liang Tebo cave, Borneo, about 31,000 years ago (modelled 31,201–30,714 years ago), and died aged about 19–20.<small>Maloney et al. 2022</small></li><li>The lowest third of TB1&#x27;s left tibia and fibula is missing, and both bones end in a clean, oblique cut without the crushing or splintering typical of accidents.<small>Maloney et al. 2022</small></li><li>The cut ends had remodelled into a rounded stump, showing survival for 6–9 years after an amputation in childhood, with no sign of bone infection.<small>Maloney et al. 2022</small></li><li>The burial was careful: limestone rocks placed over the head and arms, and a nodule of red ochre near the jaw.<small>Maloney et al. 2022</small></li><li>Later Ice Age and early Holocene people scraped decayed teeth (Villabruna, about 14,000 years ago), drilled living molars (Mehrgarh, 9,000–7,500 years ago) and performed trepanations that healed (Ensisheim, about 7,000 years ago).<small>Oxilia et al. 2015; Coppa et al. 2006; Alt et al. 1997</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the operation was planned from the start, or was the careful finishing of a traumatic injury such as a crushed foot.</li><li>How bleeding, pain and infection were controlled: medicinal plants are suggested by the authors but not directly evidenced.</li><li>Whether TB1 reflects a surgical tradition or a single, exceptional event.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Soft tissue, dressings, plant remedies and the cutting tool do not survive; the tool is unknown.</li><li>Tropical heat and acidity destroy most Pleistocene burials in Island South-East Asia, so comparable cases would rarely be preserved.</li><li>Skeletons record only operations that touched bone; any surgery on soft tissue is invisible.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>The 2022 Nature paper by Tim Maloney, Maxime Aubert, Melandri Vlok and colleagues is widely accepted as the oldest known surgical amputation, some 24,000 years older than the next case, a Neolithic farmer from Buthiers-Boulancourt in France. Outside specialists were cautious but supportive: the Durham bioarchaeologist Charlotte Roberts called it consistent with a surgical amputation, and Kate Domett of James Cook University said it certainly could be one. The main caution is that it is a single skeleton, and that the step from a clean cut to &#x27;medical knowledge&#x27; is an inference. The find has forced histories of medicine that began with farmers to start much earlier.</p><ul><li>The cut pattern and absence of crushing argue against accident; the absence of infection argues against an animal bite.</li><li>Survival for years implies sustained care from the group.</li><li>The same caves hold figurative rock art at least 40,000 years old.</li><li>One case cannot show how common such surgery was.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Michael Button, a British YouTuber and podcaster, presents the Borneo amputation as evidence that Ice Age people had medical knowledge far older and more sophisticated than the textbook story of surgery beginning with farmers. In his framing, removing a child&#x27;s lower leg through both bones, in a tropical forest, without the patient dying of blood loss, shock or infection, implies accumulated and taught knowledge of anatomy and wound care. He fits it into his broader argument that human capability runs deep into the past and that much knowledge has been lost. Here he largely agrees with the study&#x27;s own authors.</p><ul><li>The cut was clean and precise, not a desperate hack.</li><li>The patient survived childhood surgery and lived for years.</li><li>Success on a first attempt is unlikely, so earlier attempts and learned skill are implied.</li><li>The same people were painting cave walls, a sign of rich culture.</li></ul><div class="face-s"><b>Its strongest point</b><p>Amputating through both lower-leg bones without killing the patient from blood loss, shock or infection is hard even with modern care. Doing it successfully, in a tropical rainforest 31,000 years ago, is unlikely to have been a first try, which points to learned and transmitted skill.</p></div><p class="face-cr"><b>Credit</b> Michael Button (The Joe Rogan Experience #2546, August 2026)</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>More Pleistocene burials from the Sangkulirang–Mangkalihat caves, to see whether other surgical cases exist.</li><li>Residue and use-wear studies of stone tools from Liang Tebo&#x27;s burial layers, looking for blood or plant traces.</li><li>Ancient DNA or proteomic evidence of medicinal plants in dental calculus from the region.</li><li>Systematic re-examination of museum Pleistocene skeletons for healed cut marks previously read as trauma.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,174 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Ice Age Surgeons of Borneo"><button type="button" class="wtoc-i" data-go="stone-age-surgery-s1">A grave with a missing foot</button><button type="button" class="wtoc-i" data-go="stone-age-surgery-s2">What the bones say</button><button type="button" class="wtoc-i" data-go="stone-age-surgery-s3">Why not an accident?</button><button type="button" class="wtoc-i" data-go="stone-age-surgery-s4">The mainstream catches up</button><button type="button" class="wtoc-i" data-go="stone-age-surgery-s5">Michael Button&#x27;s case</button><button type="button" class="wtoc-i" data-go="stone-age-surgery-s6">What time has hidden</button><button type="button" class="wtoc-i" data-go="stone-age-surgery-s7">What would settle it</button></nav></div><section class="wsec" id="stone-age-surgery-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A grave with a missing foot</h3><p>In 2020, in Liang Tebo, a limestone cave in the rugged forested karst of East Kalimantan on Borneo, Indonesian and Australian archaeologists uncovered a grave. The young person inside, catalogued as TB1, had been laid out with care. Limestone rocks sat over the head and each arm. A lump of red ochre lay near the jaw. And the left foot, with the lowest part of the left leg, was missing.</p><p>It was not lost after burial. The two bones of the lower leg ended in a clean, angled cut, and the cut ends had healed. The burial was about 31,000 years old, deep in the last Ice Age, when everyone on Earth lived by foraging.</p><blockquote class="wpull"><p>A child lost a leg to a deliberate cut, survived, and was cared for until adulthood, 24,000 years before the next known amputation.</p></blockquote></section><section class="wsec" id="stone-age-surgery-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What the bones say</h3><p>The study, led by Tim Maloney of Griffith University and published in Nature in 2022, is precise. TB1 died aged about 19–20. The lowest third of the left tibia and fibula is missing. Both bones were severed along a clean oblique plane, and both show new bone growth that rounded off the cut ends into a stump. From the extent of remodelling, the team estimated that TB1 lived for 6–9 years after losing the leg, which means the operation happened in childhood.</p><figure class="wx wx--steps" id="stone-age-surgery-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">Reading TB1&#x27;s leg</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Reading TB1&#x27;s leg"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" class="wx-svg" role="img" aria-labelledby="stone-age-surgery-f1-t"><title id="stone-age-surgery-f1-t">The left lower leg of the Liang Tebo individual TB1, showing the amputation and healing</title><defs><marker id="stone-age-surgery-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text x="24" y="28" class="wx-t-cap">Liang Tebo, Borneo · individual TB1 · left lower leg, front view</text><circle cx="130" cy="92" r="20" class="wx-stone2 wx-edge"/><path d="M100,120 H160 L154,250 H106 Z" class="wx-stone2 wx-edge"/><path d="M100,124 L80,240" class="wx-bold"/><path d="M160,124 L180,240" class="wx-bold"/><path d="M116,250 L112,360 L110,460 L90,466" class="wx-bold"/><path d="M144,250 L148,360 L149,410" class="wx-bold"/><path d="M149,410 L150,460 L170,466" class="wx-dash"/><text x="130" y="494" text-anchor="middle" class="wx-t-b">TB1</text><text x="130" y="510" text-anchor="middle" class="wx-t-s">died aged 19–20</text><text x="130" y="524" text-anchor="middle" class="wx-t-s">(figure schematic)</text><rect x="132" y="240" width="40" height="232" rx="6" class="wx-guide"/><line x1="172" y1="250" x2="330" y2="90" class="wx-thin"/><line x1="172" y1="470" x2="330" y2="500" class="wx-thin"/><path d="M432,90 Q470,80 504,90 L500,112 Q484,130 483,160 L482,330 L456,318 L456,160 Q454,128 434,112 Z" class="wx-stone wx-edge"/><path d="M511,110 Q520,100 529,110 L525,130 L525,343 L515,340 L515,130 Z" class="wx-stone wx-edge"/><path d="M456,318 L454,420 Q446,440 444,452 H492 Q488,436 482,420 L482,330" class="wx-dash"/><path d="M515,340 L515,445 Q520,462 526,448 L525,343" class="wx-dash"/><path d="M430,462 Q470,456 534,462 L560,520 Q480,534 426,520 Z" class="wx-dash"/><text x="410" y="430" text-anchor="end" class="wx-t-m">missing:</text><text x="410" y="446" text-anchor="end" class="wx-t-m">lowest third</text><text x="410" y="462" text-anchor="end" class="wx-t-m">and the foot</text><text x="424" y="84" text-anchor="end" class="wx-t-b">knee</text><text x="444" y="220" text-anchor="end" class="wx-t-b wx-st" data-s="1">tibia</text><text x="534" y="220" class="wx-t-b wx-st" data-s="1">fibula</text><line x1="440" y1="312" x2="542" y2="349" class="wx-hl wx-st wx-hide" data-s="2"/><g class="wx-st" data-s="2"><text x="550" y="340" class="wx-t-b wx-t-a">clean oblique cut</text><text x="550" y="356" class="wx-t-m">through both bones,</text><text x="550" y="372" class="wx-t-m">lowest third of the leg</text></g><g class="wx-st" data-s="3"><rect x="560" y="400" width="140" height="120" rx="8" class="wx-card wx-edge-soft"/><text x="572" y="420" class="wx-t-cap">not seen here</text><rect x="590" y="430" width="16" height="40" class="wx-stone wx-edge"/><path d="M590,470 L594,478 L598,468 L602,482 L606,470" class="wx-line"/><path d="M596,488 L600,494 M604,486 L608,492" class="wx-line"/><text x="620" y="452" class="wx-t-s">crushed,</text><text x="620" y="466" class="wx-t-s">splintered</text><text x="572" y="508" class="wx-t-s">no bone infection</text></g><path d="M455,316 Q468,334 483,330" class="wx-bold wx-s3 wx-st wx-hide" data-s="4"/><path d="M514,338 Q520,348 526,342" class="wx-bold wx-s3 wx-st wx-hide" data-s="4"/><g class="wx-st" data-s="4"><text x="440" y="270" text-anchor="end" class="wx-t-b">rounded, remodelled</text><text x="440" y="286" text-anchor="end" class="wx-t-m">ends: 6–9 years</text><text x="440" y="302" text-anchor="end" class="wx-t-m">of healing</text><line x1="442" y1="296" x2="454" y2="318" class="wx-thin"/></g><g class="wx-st" data-s="5"><line x1="40" y1="566" x2="400" y2="566" class="wx-line"/><rect x="238" y="559" width="113" height="14" rx="4" class="wx-c3 wx-o60"/><circle cx="238" cy="566" r="6" class="wx-c4"/><circle cx="391" cy="566" r="6" class="wx-inkfill"/><text x="238" y="550" text-anchor="middle" class="wx-t-s">operation in childhood</text><text x="391" y="550" text-anchor="middle" class="wx-t-s">death, 19–20</text><text x="40" y="590" class="wx-t-s">age 0</text><text x="414" y="570" class="wx-t-m">lived on with care in steep karst</text></g><line x1="600" y1="100" x2="600" y2="200" class="wx-bold"/><text x="612" y="146" class="wx-t-s">10 cm</text><text x="612" y="162" class="wx-t-s">(bones schematic)</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> TB1 was buried in Liang Tebo about 31,000 years ago; the left foot and lowest part of the leg were missing.</p><ol class="wx-steplist"><li>TB1 was buried in Liang Tebo about 31,000 years ago; the left foot and lowest part of the leg were missing.</li><li>Both lower-leg bones end in a clean, oblique cut in their lowest third.</li><li>No crushing or splintering, and no bone infection: signs against an accident or an animal attack.</li><li>The cut ends had remodelled into a rounded stump: 6–9 years of healing.</li><li>The operation happened in childhood; TB1 lived to 19–20 with the group&#x27;s care.</li></ol><figcaption>What the lower-leg bones of the Liang Tebo individual show, step by step. Bone proportions are schematic. <span class="wx-src">Based on: Maloney et al. 2022 (missing distal third of left tibia and fibula, 6–9 years survival, age at death 19–20). Bone shapes, the silhouette and the exact age at operation are schematic.</span></figcaption><p class="vh">On the left, a simple standing human figure with the lower part of the left leg drawn dashed, labelled TB1, died aged 19 to 20. Guide lines lead to an enlarged front view of the left lower leg on the right: the tibia and the thinner fibula run down from the knee and stop about two thirds of the way down, with the missing lowest third and the foot drawn as dashed outlines. Step 2 highlights a clean oblique cut across both bones. Step 3 adds a small inset showing what is not seen: a crushed, splintered fracture, and a note that there is no bone infection. Step 4 draws rounded, remodelled ends labelled 6 to 9 years of healing. Step 5 adds a life bar from age 0 to death at 19 to 20, with the operation in childhood and a note that TB1 lived on with care in steep karst. A 10 cm scale bar is shown.</p></figure><p>Radiocarbon dates and a statistical model place the burial between 31,201 and 30,714 years ago. The authors note that TB1 would rarely have been able to walk far afterwards in steep, rocky country, and that survival would have needed what they called intensive post-operative nursing and care: feeding, keeping warm, cleaning the wound, moving the patient to avoid sores.</p></section><section class="wsec" id="stone-age-surgery-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Why not an accident?</h3><p>The obvious alternatives are a crushing fall, a rockslide or an animal attack, and the team tested each against the bone. Accidents that sever a limb usually leave crushed and splintered fractures; TB1&#x27;s bones show a clean section through both. Animal bites carry bacteria deep into wounds, and the resulting bone infection, osteomyelitis, would normally mark the skeleton. None is present.</p><aside class="wcall"><b>How do we know?</b><p>Bone keeps a diary. A fresh cut leaves sharp edges; living bone then lays down new tissue that rounds and seals the end over months and years. Infection leaves pitting and abnormal new bone. By reading how far the healing had gone, and the absence of infection or crushing, bioarchaeologists can tell a healed cut from an injury at death, and estimate how long the person lived afterwards.</p></aside><p>Outside experts were cautious but supportive. Charlotte Roberts of Durham University, a leading bioarchaeologist, was quoted in Smithsonian magazine calling it &#x27;consistent with an amputation that&#x27;s been done surgically&#x27;. Kate Domett of James Cook University said, &#x27;it certainly could be an amputation&#x27;. One alternative remains: an injury that was then finished and treated by cutting. Even that would require the same knowledge of where to cut and how to keep the patient alive.</p></section><section class="wsec" id="stone-age-surgery-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The mainstream catches up</h3><p>Until 2022 the oldest known amputation was that of an elderly Neolithic farmer at Buthiers-Boulancourt in France, about 7,000 years old, whose left forearm had been removed. Histories of medicine usually opened with trepanation, cutting a hole in the skull, which appears in Mesolithic Ukraine and becomes widespread in Neolithic Europe, where one man at Ensisheim in Alsace survived two operations. The unspoken assumption was that surgery came with farming, villages and specialists.</p><figure class="wx wx--static" id="stone-age-surgery-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">Surgery before writing</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Surgery before writing"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" class="wx-svg" role="img" aria-labelledby="stone-age-surgery-f2-t"><title id="stone-age-surgery-f2-t">The oldest evidence of surgery and dentistry over the last 32,000 years</title><text x="24" y="28" class="wx-t-cap">Surgery before writing · thousand years ago</text><line x1="690.0" y1="52" x2="690.0" y2="430" class="wx-guide"/><text x="690.0" y="450" text-anchor="middle" class="wx-t-s">0</text><line x1="618.1" y1="52" x2="618.1" y2="430" class="wx-guide"/><text x="618.1" y="450" text-anchor="middle" class="wx-t-s">5</text><line x1="546.2" y1="52" x2="546.2" y2="430" class="wx-guide"/><text x="546.2" y="450" text-anchor="middle" class="wx-t-s">10</text><line x1="474.4" y1="52" x2="474.4" y2="430" class="wx-guide"/><text x="474.4" y="450" text-anchor="middle" class="wx-t-s">15</text><line x1="402.5" y1="52" x2="402.5" y2="430" class="wx-guide"/><text x="402.5" y="450" text-anchor="middle" class="wx-t-s">20</text><line x1="330.6" y1="52" x2="330.6" y2="430" class="wx-guide"/><text x="330.6" y="450" text-anchor="middle" class="wx-t-s">25</text><line x1="258.8" y1="52" x2="258.8" y2="430" class="wx-guide"/><text x="258.8" y="450" text-anchor="middle" class="wx-t-s">30</text><line x1="230" y1="430" x2="690" y2="430" class="wx-line"/><text x="460" y="474" text-anchor="middle" class="wx-t-m">thousand years ago (today at the right)</text><rect x="230.0" y="52" width="291.8" height="378" class="wx-ice wx-o80"/><text x="237.2" y="68" class="wx-t-cap">last Ice Age</text><line x1="521.8" y1="52" x2="521.8" y2="430" class="wx-dash"/><text x="527.8" y="68" class="wx-t-s">farming begins soon after</text><text x="24" y="104" class="wx-t-b">Liang Tebo, Borneo</text><text x="24" y="119" class="wx-t-s">leg amputation</text><circle cx="244.4" cy="100" r="6.5" class="wx-c1 wx-pop" style="--d:1"/><text x="233.4" y="104" text-anchor="end" class="wx-t-s">c. 31</text><text x="24" y="154" class="wx-t-b">Villabruna, Italy</text><text x="24" y="169" class="wx-t-s">cavity scraped</text><circle cx="488.8" cy="150" r="6.5" class="wx-c2 wx-pop" style="--d:2"/><text x="477.8" y="154" text-anchor="end" class="wx-t-s">c. 14</text><text x="24" y="204" class="wx-t-b">Riparo Fredian, Italy</text><text x="24" y="219" class="wx-t-s">filled with bitumen</text><circle cx="503.1" cy="200" r="6.5" class="wx-c2 wx-pop" style="--d:3"/><text x="492.1" y="204" text-anchor="end" class="wx-t-s">c. 13</text><text x="24" y="254" class="wx-t-b">Mehrgarh, Pakistan</text><text x="24" y="269" class="wx-t-s">molars drilled</text><rect x="560.6" y="243" width="21.6" height="14" rx="4" class="wx-c2 wx-growx" style="--d:4"/><text x="590.2" y="254" class="wx-t-s">9–7.5</text><text x="24" y="304" class="wx-t-b">Ensisheim, France</text><text x="24" y="319" class="wx-t-s">healed trepanations</text><circle cx="589.4" cy="300" r="6.5" class="wx-c5 wx-pop" style="--d:5"/><text x="600.4" y="304" class="wx-t-s">c. 7</text><text x="24" y="354" class="wx-t-b">Buthiers-Boulancourt</text><text x="24" y="369" class="wx-t-s">forearm amputation</text><circle cx="590.8" cy="350" r="6.5" class="wx-c1 wx-pop" style="--d:6"/><text x="601.8" y="354" class="wx-t-s">c. 7</text><text x="24" y="404" class="wx-t-b">Egypt</text><text x="24" y="419" class="wx-t-s">oldest surgical text</text><circle cx="638.2" cy="400" r="6.5" class="wx-c6 wx-pop" style="--d:7"/><text x="649.2" y="404" class="wx-t-s">c. 3.6</text><line x1="253.4" y1="100" x2="580.4" y2="100" class="wx-hl wx-draw" pathLength="1" style="--d:9"/><text x="416.9" y="92" text-anchor="middle" class="wx-t-b wx-t-a wx-halo">24,000 years earlier than the next amputation</text><text x="24" y="494" class="wx-t-s">Egypt: the Edwin Smith papyrus, a surgical text copied c. 1600 BCE. All positions approximate.</text></svg></div></div><figcaption>The oldest dated evidence of surgery and dentistry: Liang Tebo stands alone, deep in the last Ice Age. <span class="wx-src">Based on: Maloney et al. 2022; Oxilia et al. 2015; Oxilia et al. 2017; Coppa et al. 2006; Alt et al. 1997; Buquet-Marcon et al. 2009. Positions approximate.</span></figcaption><p class="vh">A time chart from 32,000 years ago on the left to today on the right, with the last Ice Age shaded up to 11,700 years ago and a dashed line marking its end. Rows: Liang Tebo, Borneo, leg amputation at about 31,000 years; Villabruna, Italy, scraped cavity at about 14,000; Riparo Fredian, Italy, bitumen filling at about 13,000; Mehrgarh, Pakistan, drilled molars from 9,000 to 7,500; Ensisheim, France, healed trepanations at about 7,000; Buthiers-Boulancourt, France, forearm amputation at about 7,000; Egypt, the Edwin Smith surgical papyrus at about 3,600 years ago. An accent line joins the two amputations, labelled 24,000 years earlier than the next amputation.</p></figure><p>The dental record had already been hinting otherwise. At Villabruna in northern Italy, a man who died about 14,000 years ago had a cavity scraped out with a pointed stone tool. At Riparo Fredian in Tuscany, about 13,000 years ago, cavities were enlarged and filled with bitumen. At Mehrgarh in Pakistan, living people had molars drilled 9,000–7,500 years ago. Liang Tebo pushes deliberate treatment of the body far deeper, and the mainstream has accepted the revision.</p></section><section class="wsec" id="stone-age-surgery-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Michael Button&#x27;s case</h3><p>Michael Button, the British YouTuber and podcaster, raised the Borneo amputation on The Joe Rogan Experience in August 2026 as part of his wider argument that human capability runs much deeper in time than the textbooks allow. In his own terms: cutting through both bones of a child&#x27;s leg without the patient bleeding to death, going into shock or dying of infection is difficult even with modern medicine, and success on a first attempt is unlikely. The skill must have been learned, practised and passed on.</p><p>On this point Button stands with the study&#x27;s own authors, who wrote that the surgeons needed detailed knowledge of limb anatomy and of the muscles and blood vessels to prevent fatal blood loss and infection, and who suggested that local plants with medicinal properties may have been used to clean wounds and ease pain. Borneo&#x27;s rainforests are famously rich in plants that local healers still use.</p><blockquote class="wpull"><p>Here the challenger and the specialists read the bones the same way: someone knew what they were doing.</p></blockquote><p>Where the evidence stops is the larger thesis. TB1 shows skilled Ice Age foragers, not a lost medical civilisation. Their knowledge was presumably the practical, oral kind that hunter-gatherer healers hold today, and most of it has vanished because it was never written down.</p></section><section class="wsec" id="stone-age-surgery-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What time has hidden</h3><p>The Liang Tebo operation left traces only because it cut through bone and the skeleton happened to survive in a tropical cave. Plant remedies, bandages, stitches and the cutting tool itself have all gone. Most Pleistocene burials in Island South-East Asia have dissolved. It would be a mistake to treat TB1 as the first surgery; it is simply the first one we can see.</p><p>There are hints that plant medicine is very old indeed. DNA preserved in the dental calculus of a Neanderthal from El Sidrón in Spain, who suffered from a dental abscess and a gut parasite, included traces of poplar, a source of the painkiller salicylic acid, and of Penicillium mould. The authors were careful to say this is suggestive rather than conclusive, but it fits the picture of people who noticed what plants did to their bodies and used that knowledge long before anyone wrote it down.</p><aside class="wcall"><b>Fresh from the field</b><p>Two 2024 studies showed that wound care is older than humanity. In Sumatra, a wild male orangutan named Rakus was filmed chewing leaves of a liana used in traditional medicine and applying the juice to a facial wound, which healed without infection. And Florida carpenter ants were found to amputate the injured legs of nestmates, raising their survival. Deliberate treatment of wounds, it seems, has deep roots in the animal world.</p></aside></section><section class="wsec" id="stone-age-surgery-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle it</h3><p>More burials from the Sangkulirang–Mangkalihat caves could show whether TB1 was unique or one of many. Residue studies on stone tools from the burial layers might reveal blood or plant compounds. Dental calculus from the region could preserve traces of medicinal plants, as it has for Neanderthals at El Sidrón in Spain. And a fresh look at museum skeletons may reveal healed cuts that were once filed as injuries.</p><p>The verdict for now is a strong one. Thirty-one thousand years ago, in the forests of Borneo, a community took the life-or-death decision to cut away a child&#x27;s leg, did it well, and then looked after that child for years.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-study" style="--i:0"><span class="wtl-y">1997 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Healed Neolithic trepanations at Ensisheim, France</span></li><li class="wtl-study" style="--i:1"><span class="wtl-y">1998 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Mesolithic trepanations reported from Ukraine</span></li><li class="wtl-study" style="--i:2"><span class="wtl-y">2006 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Drilled molars from Mehrgarh, Pakistan</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">2015 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">14,000-year-old scraped tooth at Villabruna</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">2018 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Borneo cave art dated to at least 40,000 years</span></li><li class="wtl-find" style="--i:5"><span class="wtl-y">2020 CE</span><span class="wtl-k">Found</span><span class="wtl-t">TB1 burial excavated at Liang Tebo</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2022 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Amputation published in Nature</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2024 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Orangutan wound treatment and ant amputations reported</span></li></ol><details class="srcs"><summary>Sources for this case (13)</summary><ol><li>Maloney, T. R., Dilkes-Hall, I. E., Vlok, M. et al. (2022). Surgical amputation of a limb 31,000 years ago in Borneo. Nature 609: 547–551. <a href="https://doi.org/10.1038/s41586-022-05160-8" target="_blank" rel="noopener">doi:10.1038/s41586-022-05160-8</a></li><li>Aubert, M. et al. (2018). Palaeolithic cave art in Borneo. Nature 564: 254–257. <a href="https://doi.org/10.1038/s41586-018-0679-9" target="_blank" rel="noopener">doi:10.1038/s41586-018-0679-9</a></li><li>Buquet-Marcon, C., Charlier, P. &amp; Samzun, A. (2009). The oldest amputation on a Neolithic human skeleton in France. Nature Precedings.</li><li>Alt, K. W. et al. (1997). Evidence for stone age cranial surgery. Nature 387: 360. <a href="https://doi.org/10.1038/387360a0" target="_blank" rel="noopener">doi:10.1038/387360a0</a></li><li>Lillie, M. C. (1998). Cranial surgery dates back to Mesolithic. Nature 391: 854. <a href="https://doi.org/10.1038/36023" target="_blank" rel="noopener">doi:10.1038/36023</a></li><li>Coppa, A. et al. (2006). Early Neolithic tradition of dentistry. Nature 440: 755–756. <a href="https://doi.org/10.1038/440755a" target="_blank" rel="noopener">doi:10.1038/440755a</a></li><li>Oxilia, G. et al. (2015). Earliest evidence of dental caries manipulation in the Late Upper Palaeolithic. Scientific Reports 5: 12150. <a href="https://doi.org/10.1038/srep12150" target="_blank" rel="noopener">doi:10.1038/srep12150</a></li><li>Oxilia, G. et al. (2017). The dawn of dentistry in the late Upper Paleolithic: an early case of pathological intervention at Riparo Fredian. American Journal of Physical Anthropology 163: 446–461.</li><li>Weyrich, L. S. et al. (2017). Neanderthal behaviour, diet, and disease inferred from ancient DNA in dental calculus. Nature 544: 357–361. <a href="https://doi.org/10.1038/nature21674" target="_blank" rel="noopener">doi:10.1038/nature21674</a></li><li>Laumer, I. B. et al. (2024). Active self-treatment of a facial wound with a biologically active plant by a male Sumatran orangutan. Scientific Reports 14: 8932. <a href="https://doi.org/10.1038/s41598-024-58988-7" target="_blank" rel="noopener">doi:10.1038/s41598-024-58988-7</a></li><li>Frank, E. T. et al. (2024). Wound-dependent leg amputations to combat infections in an ant society. Current Biology 34.</li><li>Smithsonian Magazine (7 September 2022). Earliest known amputation was performed in Borneo 31,000 years ago.</li><li>ABC News Australia (8 September 2022). Earliest-known surgical limb amputation found in 31,000-year-old skeleton from Borneo cave.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-stone-age-surgery" data-t="The Ice Age Surgeons of Borneo"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Ice Age Surgeons of Borneo</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-stone-age-surgery</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-early-seafarers-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Clouds, cloudscape over Lombok Strait, Gili Islands, Indian Ocean, Indonesia.jpg" data-cap="The Lombok Strait, a deep channel never bridged by land" data-big><figcaption></figcaption></figure><div class="sh-k">Skills Older Than We Thought</div><h2 class="sh-t" id="case-early-seafarers-st" tabindex="-1">The First Sailors Were Not Us</h2><p class="sh-s">Stone tools on islands that were never joined to Asia show that human relatives crossed the sea a million years ago. The question is how.</p><div class="sh-v"><span class="vstamp vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><p class="sh-claim"><b>What the stamp rates:</b> Human relatives before our species crossed open sea on purpose, rather than drifting there by accident on natural rafts.</p></div><p class="v4-q">Did humans before our species cross open sea on purpose, or were they swept?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>About a million years ago, human relatives reached Flores, Sulawesi and Luzon: islands never joined to the mainland.</li><li>The stone tools are securely dated; the crossings themselves are not in doubt.</li><li>But rats, tortoises and dwarf elephants crossed the same water without boats, on storm-torn rafts of vegetation.</li><li>No craft survives, and models give accidental arrival real odds.</li><li>Repeated colonisation of separate islands is awkward for pure luck, so intent stays an open question.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Geology</span><span class="thr">Biology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">at least <b class="ctr-n" data-v="1.04" data-dec="2">1.04</b><span class="ctr-u"> million years</span></div><div class="ctr-l">minimum age of stone tools on Sulawesi</div><div class="ctr-c">Hakim et al. 2025</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="1.02" data-dec="2">1.02</b><span class="ctr-u"> million years</span></div><div class="ctr-l">age of the tools at Wolo Sege, Flores</div><div class="ctr-c">Brumm et al. 2010</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="709000" >709,000</b><span class="ctr-u"> years</span></div><div class="ctr-l">age of the butchered rhino on Luzon</div><div class="ctr-c">Ingicco et al. 2018</div></div><div class="ctr"><div class="ctr-v">at least <b class="ctr-n" data-v="19" >19</b><span class="ctr-u"> km</span></div><div class="ctr-l">minimum sea gap to Flores at the lowest sea levels</div><div class="ctr-c">Dennell et al. 2014</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="225" >225</b><span class="ctr-u"> km</span></div><div class="ctr-l">paddled by a replica Palaeolithic dugout in 2019</div><div class="ctr-c">Kaifu et al. 2025</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Human relatives before our species crossed open sea on purpose, rather than drifting there by accident on natural rafts.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:41.7%" role="img" aria-label="Weight of evidence: Open question"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The crossings themselves are firmly established: Flores, Sulawesi and Luzon were never joined to the mainland, and hominins were on all three by about 700,000 years ago. Intent is a different matter. No craft survives, island faunas show that animals crossed the same straits without boats, and published models give accidental colonisation real odds. Against that, repeated, lasting colonisation of separate islands is awkward for pure chance. The evidence does not yet favour either reading, so this remains an open question.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Many textbooks still present seafaring as an achievement of Homo sapiens, marked by the settlement of Australia around 50,000–65,000 years ago. On the fact of earlier crossings they are underconfident: the Wallacean evidence is strong and has been for over a decade. On deliberate voyaging, the challengers sometimes sound more certain than the evidence allows. Both sides tend to skip the honest answer: we know they crossed; we do not know how.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Stone tools at Wolo Sege on Flores lie beneath a volcanic deposit dated to 1.02 ± 0.02 million years.<small>Brumm et al. 2010</small></li><li>Seven chert tools at Calio on Sulawesi are at least 1.04 million years old and possibly as old as 1.48 million.<small>Hakim et al. 2025</small></li><li>At Kalinga on Luzon, 57 stone tools and a butchered rhinoceros skeleton date to about 709,000 years ago (777,000–631,000).<small>Ingicco et al. 2018</small></li><li>The Lombok Strait is at least 250 m deep and stayed open when Ice Age sea level fell about 120 m; Flores was always at least 19 km from its neighbours.<small>Dennell et al. 2014</small></li><li>Hominin fossils from Mata Menge on Flores, about 700,000 years old, belong to small-bodied ancestors of Homo floresiensis.<small>van den Bergh et al. 2016; Kaifu et al. 2024</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the Wallacean crossings were deliberate voyages on built craft or accidental drift on vegetation mats torn loose by storms or tsunamis.</li><li>Whether the Plakias finds on Crete are Lower Palaeolithic tools at least 130,000 years old, since they were dated through landforms and soils rather than directly.</li><li>Whether Kefalonia and Zakynthos were islands when Neanderthals reached them about 110,000 years ago, or connected to the mainland at lower sea levels.</li><li>Who made the Sulawesi tools: no hominin fossil of that age has been found on the island.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Rafts of bamboo, logs or reeds rot quickly; no Pleistocene watercraft of any kind survives, and the oldest known boat, the Pesse canoe from the Netherlands, is about 10,000 years old.</li><li>The Ice Age shorelines where departures and landings happened now lie tens of metres underwater.</li><li>Tropical soils destroy bone, so most island populations are known from stone tools alone.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>That human relatives reached Flores, Sulawesi and Luzon between about 1.5 million and 700,000 years ago is now accepted: the tools are in place and well dated, and the straits never dried. How they got there is open. Many specialists favour accident. Robin Dennell and colleagues point out that the islands&#x27; early animals are the kind that arrive by chance (swimming stegodons, rats, giant tortoises, Komodo dragons) and propose that people rafted on vegetation swept out by tsunamis. Their modelling put the odds of an accidental colonisation at about half those of a planned one. In the Mediterranean the Crete and Ionian claims remain unsettled.</p><ul><li>Island faunas show &#x27;sweepstakes&#x27; dispersal: few kinds of animals, each arriving by luck.</li><li>After the 2004 tsunami a woman who could not swim survived five days at sea on a floating sago tree.</li><li>No boat, paddle or rope of this age has been found anywhere.</li><li>Rudolf Botha (2025) argues that watercraft building cannot simply be assumed from the crossings.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Michael Button treats the islands east of the Wallace Line as some of the strongest evidence that pre-sapiens humans were more capable than textbooks allow. He argues that arrivals on Sulawesi, Flores and Luzon, hundreds of kilometres apart and each across deep water, look less like a string of lucky accidents and more like repeated behaviour, and he points to modelling of how many founders a lasting colony needs. The rock-art researcher Robert Bednarik has argued since the 1990s that Homo erectus seafaring implies planning and language, and tested it with bamboo rafts built using stone-age-type tools. Larry Barham and Daniel Everett count early seafaring among their lines of evidence for early symbolic communication.</p><ul><li>At least three separate islands were settled, not one.</li><li>Each population lasted for hundreds of thousands of years, which a lone stray family rarely manages.</li><li>Crossing to Sulawesi means leaving a coast for open water against strong currents.</li><li>The pattern may extend to the Mediterranean with Crete and the Ionian Islands.</li></ul><div class="face-s"><b>Its strongest point</b><p>Three separate islands, each across deep water that never dried, were colonised between about 1.5 million and 700,000 years ago, and the populations persisted. Pure chance would have to strike again and again, and each time deliver enough survivors to found a lasting population.</p></div><p class="face-cr"><b>Credit</b> Michael Button (The Joe Rogan Experience #2546, August 2026); Robert G. Bednarik; Larry Barham and Daniel Everett</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Evidence of craft: worked bamboo, cordage or a paddle from a waterlogged Pleistocene site in Wallacea.</li><li>Hominin fossils or ancient proteins from Calio or another Early Pleistocene Sulawesi site, to show who crossed.</li><li>Direct luminescence or cosmogenic dates on the Plakias tools on Crete.</li><li>Submerged-landscape surveys around the Ionian Islands to establish whether they were islands 110,000 years ago.</li><li>Drift and population models run for each strait, testing how often natural rafting could found a lasting colony.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,189 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The First Sailors Were Not Us"><button type="button" class="wtoc-i" data-go="early-seafarers-s1">Tools where no one should have been</button><button type="button" class="wtoc-i" data-go="early-seafarers-s2">Three islands, a million years</button><button type="button" class="wtoc-i" data-go="early-seafarers-s3">Why walking was never an option</button><button type="button" class="wtoc-i" data-go="early-seafarers-s4">The mainstream reading: a sweepstakes</button><button type="button" class="wtoc-i" data-go="early-seafarers-s5">The challengers: when does luck become behaviour?</button><button type="button" class="wtoc-i" data-go="early-seafarers-s6">What the sea has taken</button><button type="button" class="wtoc-i" data-go="early-seafarers-s7">What would settle it</button></nav></div><section class="wsec" id="early-seafarers-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Tools where no one should have been</h3><p>In the 1850s the naturalist Alfred Russel Wallace noticed something odd about the islands of Indonesia. Bali&#x27;s birds and mammals were Asian. Lombok&#x27;s, a short sail east, were strikingly different. The line he drew between them follows deep water that stayed open even in the Ice Ages, when sea level fell far enough to join Java, Sumatra and Borneo to Asia. East of it, land animals arrived only by swimming, floating or flying.</p><p>So did people. On Flores, Sulawesi and Luzon, islands that were never part of the mainland, archaeologists have found stone tools up to a million years old and more, made long before Homo sapiens existed.</p><blockquote class="wpull"><p>The crossings are not in doubt. The mystery is whether anyone meant to make them.</p></blockquote></section><section class="wsec" id="early-seafarers-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Three islands, a million years</h3><p>The receipts come from careful excavations published in Nature. On Flores, stone tools at Wolo Sege lie beneath volcanic ash dated to 1.02 million years. On Sulawesi, a team led by Budianto Hakim reported in 2025 seven chert flakes at Calio, dated by palaeomagnetism and by uranium-series and electron spin resonance on fossil teeth to at least 1.04 million years, and possibly 1.48 million. On Luzon, at Kalinga, 57 stone tools lay among the bones of a rhinoceros that had been butchered about 709,000 years ago.</p><figure class="wx wx--steps" id="early-seafarers-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">Stepping stones across the sea</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Stepping stones across the sea"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" class="wx-svg" role="img" aria-labelledby="early-seafarers-f1-t"><title id="early-seafarers-f1-t">Earliest evidence of humans on islands, from Java on foot to sea crossings, over the last 1.6 million years</title><text x="24" y="28" class="wx-t-cap">Earliest dated traces on each island · million years ago</text><line x1="690.0" y1="52" x2="690.0" y2="480" class="wx-guide"/><text x="690.0" y="500" text-anchor="middle" class="wx-t-s">0</text><line x1="632.5" y1="52" x2="632.5" y2="480" class="wx-guide"/><text x="632.5" y="500" text-anchor="middle" class="wx-t-s">0.2</text><line x1="575.0" y1="52" x2="575.0" y2="480" class="wx-guide"/><text x="575.0" y="500" text-anchor="middle" class="wx-t-s">0.4</text><line x1="517.5" y1="52" x2="517.5" y2="480" class="wx-guide"/><text x="517.5" y="500" text-anchor="middle" class="wx-t-s">0.6</text><line x1="460.0" y1="52" x2="460.0" y2="480" class="wx-guide"/><text x="460.0" y="500" text-anchor="middle" class="wx-t-s">0.8</text><line x1="402.5" y1="52" x2="402.5" y2="480" class="wx-guide"/><text x="402.5" y="500" text-anchor="middle" class="wx-t-s">1</text><line x1="345.0" y1="52" x2="345.0" y2="480" class="wx-guide"/><text x="345.0" y="500" text-anchor="middle" class="wx-t-s">1.2</text><line x1="287.5" y1="52" x2="287.5" y2="480" class="wx-guide"/><text x="287.5" y="500" text-anchor="middle" class="wx-t-s">1.4</text><line x1="230.0" y1="52" x2="230.0" y2="480" class="wx-guide"/><text x="230.0" y="500" text-anchor="middle" class="wx-t-s">1.6</text><line x1="230" y1="480" x2="690" y2="480" class="wx-line"/><text x="460" y="524" text-anchor="middle" class="wx-t-m">million years ago (today at the right)</text><g class="wx-st" data-s="1"><text x="24" y="84" class="wx-t-b">Java</text><text x="24" y="99" class="wx-t-s">on foot: joined to Asia</text></g><g class="wx-st" data-s="2"><text x="24" y="140" class="wx-t-b">Sulawesi</text><text x="24" y="155" class="wx-t-s">sea crossing</text></g><g class="wx-st" data-s="2"><text x="24" y="196" class="wx-t-b">Flores</text><text x="24" y="211" class="wx-t-s">sea crossing</text></g><g class="wx-st" data-s="3"><text x="24" y="252" class="wx-t-b">Luzon</text><text x="24" y="267" class="wx-t-s">sea crossing</text></g><g class="wx-st" data-s="4"><text x="24" y="324" class="wx-t-b">Crete</text><text x="24" y="339" class="wx-t-s">debated</text></g><g class="wx-st" data-s="4"><text x="24" y="380" class="wx-t-b">Ionian Islands</text><text x="24" y="395" class="wx-t-s">debated</text></g><g class="wx-st" data-s="5"><text x="24" y="452" class="wx-t-b">Sahul, Ryukyus</text><text x="24" y="467" class="wx-t-s">Homo sapiens</text></g><g class="wx-st" data-s="1"><rect x="258.8" y="75" width="57.5" height="10" rx="4" class="wx-dash"/><rect x="316.2" y="73" width="345.0" height="14" rx="4" class="wx-c6 wx-o60"/><text x="322.2" y="68" class="wx-t-s">Homo erectus by c. 1.3 (dashed: older estimates)</text></g><g class="wx-st" data-s="2"><rect x="264.5" y="131" width="126.5" height="10" rx="4" class="wx-dash"/><circle cx="391.0" cy="136" r="7" class="wx-c1"/><text x="403.0" y="140" class="wx-t-b">Calio: at least 1.04</text><text x="403.0" y="155" class="wx-t-s">7 stone tools; possibly 1.48 (dashed)</text></g><g class="wx-st" data-s="2"><circle cx="396.8" cy="192" r="7" class="wx-c1"/><text x="383.0" y="196" text-anchor="end" class="wx-t-b">Wolo Sege: 1.02</text></g><g class="wx-st" data-s="3"><rect x="488.8" y="187" width="186.9" height="10" rx="4" class="wx-c3 wx-o60"/><text x="488.8" y="214" class="wx-t-s">fossils from 0.7; Homo floresiensis to c. 0.05</text></g><g class="wx-st" data-s="3"><rect x="466.6" y="243" width="42.0" height="10" rx="4" class="wx-c2 wx-o40"/><circle cx="486.2" cy="248" r="7" class="wx-c2"/><text x="518.6" y="252" class="wx-t-b">Kalinga: c. 0.709</text><text x="518.6" y="267" class="wx-t-s">57 tools, butchered rhino</text></g><g class="wx-st" data-s="4"><circle cx="652.6" cy="320" r="7" class="wx-card wx-edge"/><line x1="643.6" y1="320" x2="632.5" y2="320" class="wx-dash"/><text x="638.6" y="306" text-anchor="end" class="wx-t-s">Plakias tools: at least 0.13, dated by landforms</text></g><g class="wx-st" data-s="4"><circle cx="658.4" cy="376" r="7" class="wx-card wx-edge"/><text x="644.4" y="362" text-anchor="end" class="wx-t-s">Neanderthal tools c. 0.11; islands then, or joined?</text></g><g class="wx-st" data-s="5"><circle cx="675.6" cy="448" r="6" class="wx-c4"/><circle cx="681.4" cy="448" r="4.5" class="wx-c4"/><text x="661.6" y="434" text-anchor="end" class="wx-t-s">Australia–New Guinea by c. 0.05; Ryukyus c. 0.03</text></g><line x1="391.0" y1="118" x2="391.0" y2="480" class="wx-hl wx-draw wx-st" data-s="2" pathLength="1" style="--d:2"/><text x="385.0" y="476" text-anchor="end" class="wx-t-s wx-t-a wx-st" data-s="2">first known crossings</text><text x="24" y="550" class="wx-t-s">Open circles and dashed ranges: disputed or indirect dates. Points mark the oldest dated evidence, not the arrival itself.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Java: Homo erectus by about 1.3 million years ago, reached on foot across the dry Sunda Shelf.</p><ol class="wx-steplist"><li>Java: Homo erectus by about 1.3 million years ago, reached on foot across the dry Sunda Shelf.</li><li>About a million years ago: tools appear on Sulawesi and Flores, across straits that never dried.</li><li>About 700,000 years ago: a butchered rhino on Luzon; fossils of hobbit ancestors on Flores.</li><li>Debated: tools on Crete (at least 130,000 years) and Neanderthal sites on the Ionian Islands.</li><li>Our species: Australia and New Guinea by about 50,000 years ago, the Ryukyus by about 30,000.</li></ol><figcaption>The oldest dated evidence of people on each island, from Java (reached on foot) to islands that required a sea crossing. <span class="wx-src">Based on: Matsu&#x27;ura et al. 2020 (Java); Hakim et al. 2025; Brumm et al. 2010; van den Bergh et al. 2016; Ingicco et al. 2018; Strasser et al. 2010; Ferentinos et al. 2012; Kaifu et al. 2025. Points show the oldest dated evidence, not the moment of arrival.</span></figcaption><p class="vh">A horizontal time chart from 1.6 million years ago on the left to today on the right, with seven rows. Java: Homo erectus by about 1.3 million years ago, with a dashed extension to 1.5 for older estimates, reached on foot. Sulawesi: a solid dot at 1.04 million years for the Calio tools, with a dashed range back to 1.48. Flores: a dot at 1.02 million for Wolo Sege, and a bar from 0.7 million to about 50,000 years ago for fossils and Homo floresiensis. Luzon: a dot at about 709,000 years for the Kalinga butchery site, with its error range. Crete: an open circle at 130,000 years for the debated Plakias tools. Ionian Islands: an open circle at about 110,000 years for Neanderthal tools. Sahul and the Ryukyus: dots at about 50,000 and 30,000 years for Homo sapiens. An accent line at 1.04 million years marks the first known crossings.</p></figure><p>These were not passing visits. On Flores, fossils from Mata Menge show small-bodied people there about 700,000 years ago, ancestors of the famous &#x27;hobbit&#x27;, Homo floresiensis, which survived until about 50,000 years ago. On Luzon, Homo luzonensis appears in Callao Cave at least 50,000 years ago. Whoever arrived stayed, and their descendants evolved in isolation for hundreds of thousands of years.</p><p>Who were they? On Flores and Luzon the answer seems to be small-bodied descendants of an early Homo population, most likely related to Homo erectus of Java, which shrank over time on islands with little food and few predators. On Sulawesi, twelve times larger than Flores, no fossil of the right age has yet been found, and the Calio team openly calls the toolmakers&#x27; identity a mystery. Whoever they were, they were not Homo sapiens, which would not exist for roughly another 700,000 years.</p></section><section class="wsec" id="early-seafarers-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Why walking was never an option</h3><p>At the height of an ice age the sea fell by about 120 metres. The Lombok Strait, about 20 km wide at its narrowest, is at least 250 metres deep, so water always remained. Flores stayed at least 19 km from its neighbours even at the lowest sea levels. Sulawesi and Luzon were separated from the Asian shelf by still wider and deeper channels, swept by strong currents.</p><figure class="wx wx--static" id="early-seafarers-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">Why walking was never an option</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Why walking was never an option"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" class="wx-svg" role="img" aria-labelledby="early-seafarers-f2-t"><title id="early-seafarers-f2-t">Cross-section of the Lombok Strait showing water remaining when Ice Age sea level fell 120 metres</title><defs><marker id="early-seafarers-f2-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text x="24" y="28" class="wx-t-cap">Why walking was never an option · Lombok Strait, schematic section</text><polygon points="160.0,150.0 200.0,210.0 240.0,300.0 280.0,380.0 320.0,412.0 360.0,418.0 400.0,410.0 440.0,375.0 480.0,300.0 520.0,210.0 560.0,150.0" class="wx-water wx-o60"/><polygon points="226.7,270.0 240.0,300.0 280.0,380.0 320.0,412.0 360.0,418.0 400.0,410.0 440.0,375.0 480.0,300.0 493.3,270.0" class="wx-water2 wx-o80 wx-grow" style="--d:3"/><polygon points="60.0,480.0 60.0,90.0 60.0,90.0 120.0,130.0 160.0,150.0 200.0,210.0 240.0,300.0 280.0,380.0 320.0,412.0 360.0,418.0 400.0,410.0 440.0,375.0 480.0,300.0 520.0,210.0 560.0,150.0 600.0,125.0 660.0,80.0 660.0,480.0" class="wx-rock wx-edge"/><line x1="136.0" y1="150.0" x2="584.0" y2="150.0" class="wx-line wx-s2"/><text x="664.0" y="154.0" text-anchor="end" class="wx-t-m wx-halo">sea level today</text><line x1="80.0" y1="270.0" x2="640.0" y2="270.0" class="wx-dash wx-draw" pathLength="1" style="--d:2"/><text x="664.0" y="262.0" text-anchor="end" class="wx-t-b wx-halo">Ice Age low stand, c. −120 m</text><text x="76.0" y="80.0" class="wx-t-b">Bali</text><text x="76.0" y="96.0" class="wx-t-s">joined to Java and Asia</text><text x="76.0" y="109.0" class="wx-t-s">when sea level fell</text><text x="644.0" y="72.0" text-anchor="end" class="wx-t-b">Lombok</text><text x="644.0" y="88.0" text-anchor="end" class="wx-t-s">east of the Wallace Line</text><line x1="160.0" y1="130.0" x2="560.0" y2="130.0" class="wx-dim" marker-start="url(#early-seafarers-f2-ah)" marker-end="url(#early-seafarers-f2-ah)"/><text x="360.0" y="122.0" text-anchor="middle" class="wx-t-n">about 20 km at the narrowest</text><line x1="360.0" y1="154.0" x2="360.0" y2="414.0" class="wx-dim" marker-start="url(#early-seafarers-f2-ah)" marker-end="url(#early-seafarers-f2-ah)"/><text x="368.0" y="360.0" class="wx-t-n wx-halo">at least 250 m deep</text><g class="wx-bob"><rect x="284.0" y="264.0" width="32" height="6" rx="2" class="wx-wood wx-edge"/></g><text x="300.0" y="292.0" text-anchor="middle" class="wx-t-b">still open sea</text><text x="270.0" y="205.0" text-anchor="middle" class="wx-t-s">water lost at the low stand</text><line x1="80.0" y1="450.0" x2="180.0" y2="450.0" class="wx-bold"/><text x="130.0" y="442.0" text-anchor="middle" class="wx-t-s">5 km</text><text x="640.0" y="454.0" text-anchor="end" class="wx-t-s">seabed shape schematic; vertical scale exaggerated 50×</text><rect x="24" y="498" width="672" height="46" rx="8" class="wx-card wx-edge-soft"/><text x="38" y="517" class="wx-t">Further east, Flores stayed at least 19 km from its neighbours at the lowest sea levels;</text><text x="38" y="534" class="wx-t">Sulawesi and Luzon were never joined to the Asian mainland either.</text></svg></div></div><figcaption>A schematic section across the Lombok Strait: even with sea level 120 m lower, deep water separated Bali from Lombok. <span class="wx-src">Based on: Strait width (about 20 km) and minimum depth (250 m) from standard hydrographic descriptions; glacial sea-level fall of about 120 m; Flores gap from Dennell et al. 2014. Seabed shape schematic.</span></figcaption><p class="vh">A cross-section with Bali on the left and Lombok on the right. The seabed dips into a channel about 20 km wide at the surface and at least 250 m deep. Pale blue water fills the channel up to today&#x27;s sea level. A dashed line marks the Ice Age low stand about 120 m lower, and darker blue water still fills the deep part of the channel below it, with a small raft floating on it labelled &#x27;still open sea&#x27;. The zone between the two lines is labelled as water lost at the low stand. Bali is labelled as joined to Java and Asia when sea level fell; Lombok as east of the Wallace Line. A 5 km scale bar and a note on 50 times vertical exaggeration sit at the bottom, with a box noting that Flores stayed at least 19 km from its neighbours and that Sulawesi and Luzon were never joined to the mainland.</p></figure><p>That is why these islands matter so much. On Java, which could be reached on foot across the dry Sunda Shelf, Homo erectus appears by about 1.3 million years ago. To go further, someone had to get wet.</p></section><section class="wsec" id="early-seafarers-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The mainstream reading: a sweepstakes</h3><p>The most careful sceptical case comes from Robin Dennell and colleagues, who looked at who else made the trip. The early animals of Flores are a strange, thin selection: a dwarf stegodon, a strong swimmer, plus giant rats, a giant tortoise and the Komodo dragon. Biologists call this sweepstakes dispersal, where a few lucky species win a lottery that most never enter. Dennell&#x27;s team proposed that hominins arrived the same way, clinging to mats of vegetation washed out to sea by tsunamis, perhaps from Sulawesi on the prevailing currents.</p><p>They offer a vivid modern parallel: after the 2004 Indian Ocean tsunami, a pregnant woman who could not swim was rescued after five days afloat on a sago palm. Their modelling suggested that an accidental colonisation had about half the chance of success of a planned one, which is far from negligible over hundreds of thousands of years. In 2025 the linguist Rudolf Botha argued that inferring boat-building, and from it language, from the crossings involves steps the evidence does not support.</p></section><section class="wsec" id="early-seafarers-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The challengers: when does luck become behaviour?</h3><p>Michael Button, the British YouTuber and podcaster, puts the other side to a large audience. On The Joe Rogan Experience in August 2026 he described the Wallacean islands as some of his strongest evidence. His argument, in his own terms, is about pattern: one accidental arrival is easy to believe, but Sulawesi, Flores and Luzon lie far apart, and each was reached and settled. At some point, he suggests, repeated accidents start to look like behaviour. He also points to modelling of how many founders a lasting colony needs.</p><p>He is not alone. Robert Bednarik argued in the 1990s and 2000s that Homo erectus seafaring implies planning and speech, and his First Mariners Project sailed bamboo rafts built with stone-age-type tools in Indonesian waters. Larry Barham, who led the Kalambo Falls excavation described in another case on this site, and the linguist Daniel Everett count early seafaring among their evidence for early symbolic communication. Everett has long argued that Homo erectus had language.</p><p>The Mediterranean offers tantalising echoes. In 2010 Thomas Strasser and colleagues reported handaxe-like tools near Plakias on Crete, an island for more than five million years, and argued from the marine terraces and soils around them that they were at least 130,000 years old. In 2012 George Ferentinos and colleagues argued that Neanderthals reached Kefalonia and Zakynthos across straits under 12 km wide. Both claims remain debated: the Crete tools were not dated directly, and Nena Galanidou has argued that at low sea levels some Ionian islands were hills on a coastal plain, reachable on foot.</p><blockquote class="wpull"><p>One accident is a story. Three islands settled across deep water begin to look like a pattern.</p></blockquote></section><section class="wsec" id="early-seafarers-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What the sea has taken</h3><p>The one piece of evidence that would settle the argument, a boat, is the one least likely to survive. Bamboo, logs, bark and fibre rot within years. The oldest known boat in the world, the Pesse canoe from the Netherlands, is about 10,000 years old. The Ice Age beaches where rafts were launched and landed now lie tens of metres underwater, and tropical soils have destroyed most of the bones of the people who made the crossings.</p><aside class="wcall"><b>Fresh from the field</b><p>In 2025 the Calio dates made Sulawesi the earliest known sea-crossing destination, at least 1.04 million years ago. The same year, Yousuke Kaifu&#x27;s team published their 2019 voyage: a 7.5 m dugout canoe, hollowed with replica Palaeolithic stone axes, paddled 225 km from Taiwan to Yonaguni in over 45 hours, largely out of sight of land. Reed and bamboo rafts had failed earlier trials in the Kuroshio current. That test concerns our own species 30,000 years ago, but it shows how much simple craft can do.</p></aside></section><section class="wsec" id="early-seafarers-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle it</h3><p>The case would move with a waterlogged site in Wallacea yielding worked bamboo, cordage or a paddle; fossils or ancient proteins from Calio that identify the crossers; direct dates on the Plakias tools; and seafloor mapping that fixes the Ionian coastline 110,000 years ago. Better drift models, run strait by strait, could test how often natural rafts could deliver enough people to found a population.</p><p>For now the honest scorecard has two lines. That human relatives crossed the sea a million years ago is well established, and it overturns the old idea that only our species could leave the land behind. Whether they meant to is a genuinely open question, and one of the most interesting in human prehistory.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-study" style="--i:0"><span class="wtl-y">1998 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Fission-track ages suggest Homo erectus reached Flores</span></li><li class="wtl-find" style="--i:1"><span class="wtl-y">2004 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Homo floresiensis described from Liang Bua</span></li><li class="wtl-study" style="--i:2"><span class="wtl-y">2010 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Wolo Sege tools dated to 1.02 million years; Plakias tools on Crete</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">2012 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Neanderthal seafaring proposed for the Ionian Islands</span></li><li class="wtl-find" style="--i:4"><span class="wtl-y">2016 CE</span><span class="wtl-k">Found</span><span class="wtl-t">700,000-year-old hominin fossils at Mata Menge</span></li><li class="wtl-find" style="--i:5"><span class="wtl-y">2018 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Butchered rhino on Luzon, c. 709,000 years</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2019 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Homo luzonensis named; replica dugout paddled Taiwan to Yonaguni</span></li><li class="wtl-find" style="--i:7"><span class="wtl-y">2025 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Calio tools on Sulawesi: at least 1.04 million years</span></li></ol><details class="srcs"><summary>Sources for this case (16)</summary><ol><li>Brumm, A. et al. (2010). Hominins on Flores, Indonesia, by one million years ago. Nature 464: 748–752. <a href="https://doi.org/10.1038/nature08844" target="_blank" rel="noopener">doi:10.1038/nature08844</a></li><li>Hakim, B., Wibowo, U. P., van den Bergh, G. D. et al. (2025). Hominins on Sulawesi during the Early Pleistocene. Nature 646: 378–383. <a href="https://doi.org/10.1038/s41586-025-09348-6" target="_blank" rel="noopener">doi:10.1038/s41586-025-09348-6</a></li><li>Ingicco, T. et al. (2018). Earliest known hominin activity in the Philippines by 709 thousand years ago. Nature 557: 233–237. <a href="https://doi.org/10.1038/s41586-018-0072-8" target="_blank" rel="noopener">doi:10.1038/s41586-018-0072-8</a></li><li>van den Bergh, G. D. et al. (2016). Homo floresiensis-like fossils from the early Middle Pleistocene of Flores. Nature 534: 245–248. <a href="https://doi.org/10.1038/nature17999" target="_blank" rel="noopener">doi:10.1038/nature17999</a></li><li>van den Bergh, G. D. et al. (2016). Earliest hominin occupation of Sulawesi, Indonesia. Nature 529: 208–211. <a href="https://doi.org/10.1038/nature16448" target="_blank" rel="noopener">doi:10.1038/nature16448</a></li><li>Kaifu, Y. et al. (2024). Early evolution of small body size in Homo floresiensis. Nature Communications 15: 6381. <a href="https://doi.org/10.1038/s41467-024-50649-7" target="_blank" rel="noopener">doi:10.1038/s41467-024-50649-7</a></li><li>Détroit, F. et al. (2019). A new species of Homo from the Late Pleistocene of the Philippines. Nature 568: 181–186. <a href="https://doi.org/10.1038/s41586-019-1067-9" target="_blank" rel="noopener">doi:10.1038/s41586-019-1067-9</a></li><li>Dennell, R. W., Louys, J., O&#x27;Regan, H. J. &amp; Wilkinson, D. M. (2014). The origins and persistence of Homo floresiensis on Flores: biogeographical and ecological perspectives. Quaternary Science Reviews 96: 98–107. <a href="https://doi.org/10.1016/j.quascirev.2013.06.031" target="_blank" rel="noopener">doi:10.1016/j.quascirev.2013.06.031</a></li><li>Botha, R. (2025). Did Homo erectus have language? The seafaring inference. Cambridge Archaeological Journal 35(1): 21–37. <a href="https://doi.org/10.1017/S0959774324000118" target="_blank" rel="noopener">doi:10.1017/S0959774324000118</a></li><li>Strasser, T. F. et al. (2010). Stone Age seafaring in the Mediterranean: evidence from the Plakias region for Lower Palaeolithic and Mesolithic habitation of Crete. Hesperia 79: 145–190. <a href="https://doi.org/10.2972/hesp.79.2.145" target="_blank" rel="noopener">doi:10.2972/hesp.79.2.145</a></li><li>Ferentinos, G., Gkioni, M., Geraga, M. &amp; Papatheodorou, G. (2012). Early seafaring activity in the southern Ionian Islands, Mediterranean Sea. Journal of Archaeological Science 39: 2167–2176. <a href="https://doi.org/10.1016/j.jas.2012.01.032" target="_blank" rel="noopener">doi:10.1016/j.jas.2012.01.032</a></li><li>Galanidou, N. (2018). Parting the waters: Middle Palaeolithic archaeology in the central Ionian Sea. Journal of Greek Archaeology 3: 1–23. <a href="https://doi.org/10.32028/jga.v3i.520" target="_blank" rel="noopener">doi:10.32028/jga.v3i.520</a></li><li>Barham, L. &amp; Everett, D. (2021). Semiotics and the origin of language in the Lower Palaeolithic. Journal of Archaeological Method and Theory 28: 535–579. <a href="https://doi.org/10.1007/s10816-020-09480-9" target="_blank" rel="noopener">doi:10.1007/s10816-020-09480-9</a></li><li>Bednarik, R. G. (2003). Seafaring in the Pleistocene. Cambridge Archaeological Journal 13(1): 41–66.</li><li>Kaifu, Y. et al. (2025). Paleolithic seafaring in East Asia: an experimental test of the dugout canoe hypothesis. Science Advances 11. <a href="https://doi.org/10.1126/sciadv.adv5507" target="_blank" rel="noopener">doi:10.1126/sciadv.adv5507</a></li><li>Matsu&#x27;ura, S. et al. (2020). Age control of the first appearance datum for Javanese Homo erectus in the Sangiran area. Science 367: 210–214.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-early-seafarers" data-t="The First Sailors Were Not Us"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The First Sailors Were Not Us</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-early-seafarers</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-old-copper-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Copper knife, spearpoints, awls, and spud, Late Archaic period, Wisconsin, 3000 BC-1000 BC - Wisconsin Historical Museum - DSC03436.JPG" data-cap="Old Copper tools from Wisconsin, Late Archaic period" data-big><figcaption></figcaption></figure><div class="sh-k">Skills Older Than We Thought</div><h2 class="sh-t" id="case-old-copper-st" tabindex="-1">Old Copper: Did a Billion Pounds Vanish?</h2><p class="sh-s">Thousands of ancient pits scar Lake Superior&#x27;s copper country. Did their miners really remove over a billion pounds of metal?</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> Ancient miners removed 0.5–1.5 billion pounds of copper from Lake Superior, which then vanished from the archaeological record.</p></div><p class="v4-q">How much copper did ancient miners take from Lake Superior, and where did it go?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Around Lake Superior, people were hammering pure copper into tools at least 9,500 years ago: among the oldest metalwork anywhere.</li><li>Lake mud records pulses of mining pollution about 8,000 and 7,000 years ago.</li><li>A 1961 calculation said half a billion to one and a half billion pounds of copper were taken and vanished.</li><li>That figure multiplied three assumed numbers, none measured.</li><li>The mining is established; the missing billion pounds awaits a real survey.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Chemistry</span><span class="thr">Archaeology</span><span class="thr">Geology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">at least <b class="ctr-n" data-v="9500" >9,500</b><span class="ctr-u"> years</span></div><div class="ctr-l">since copper working began</div><div class="ctr-c">Pompeani et al. 2021</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="20000" >20,000</b><span class="ctr-u"> artifacts</span></div><div class="ctr-l">Archaic copper objects estimated from Wisconsin</div><div class="ctr-c">Milwaukee Public Museum</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="5000" >5,000</b><span class="ctr-u"> pits</span></div><div class="ctr-l">assumed, not counted, in the 1961 calculation</div><div class="ctr-c">Drier and Du Temple 1961</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="1.5" data-dec="1">1.5</b><span class="ctr-u"> billion lb</span></div><div class="ctr-l">the largest estimate, never measured</div><div class="ctr-c">Drier and Du Temple 1961</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="11" >11</b><span class="ctr-u"> billion lb</span></div><div class="ctr-l">Michigan&#x27;s industrial native copper output</div><div class="ctr-c">Copper mining in Michigan</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Ancient miners removed 0.5–1.5 billion pounds of copper from Lake Superior, which then vanished from the archaeological record.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The mining is established. The tonnage is not: the 0.5–1.5 billion pound range comes from a 1961 calculation that multiplied three assumed numbers, none measured, and the upper figure simply swaps in a richer ore and more pits. Without a measured quantity there is nothing shown to have vanished. What survives, perhaps 20,000 artifacts in Wisconsin alone, fits long local use, and the pulses of lead pollution fit intermittent mining. A real survey could still raise the estimate, which is why this rates as awaiting evidence rather than ruled out.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 3 of 6, leaning one way"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>leaning one way</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">General histories of metallurgy often begin in the Near East and leave the Old Copper Complex out, which undersells one of the oldest metal traditions on Earth; there Button has a fair point. On quantity, museums are properly cautious and say the amount is unknown. The weak link is the popular retelling, where a 1961 back-of-envelope sum has hardened into a figure repeated as if it had been measured.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Archaic peoples of the western Great Lakes made tools from native copper beginning at least about 9,500 years ago, with a peak between about 7,000 and 5,000 years ago: among the oldest metalworking anywhere.<small>Pompeani et al. 2021</small></li><li>Lead pollution in Keweenaw lake sediments records copper mining and heating about 8,000 and 7,000 years ago, falling to background levels after about 5,000 years ago.<small>Pompeani et al. 2013</small></li><li>Sediment from McCargoe Cove on Isle Royale records mining 6,500–5,400 years ago, near the Minong Ridge pits, the largest known pre-Columbian copper mine.<small>Pompeani et al. 2015</small></li><li>Thousands of grooved stone hammers survive in and around the pits; miners used fire, water and hammerstones, then shaped the metal by cold hammering and annealing.<small>Milwaukee Public Museum; NPS</small></li><li>Wisconsin alone has yielded at least 13,000 and perhaps about 20,000 Archaic copper artifacts.<small>Milwaukee Public Museum</small></li><li>Around 3,000 years ago these hunter-gatherers largely gave up copper tools and returned to stone, a reversal that is rare among metal-using societies.<small>Bebber et al. 2019</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>How many ancient pits there were, how large and deep they typically were, and how rich in copper the rock was.</li><li>Why
