<script type="text/x-tpl" id="case-shared-symbols-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Newgrange entrance stone.jpg" data-cap="Spirals on the entrance stone at Newgrange, Ireland, about 5,200 years old" data-big><figcaption></figcaption></figure><div class="sh-k">Signs Across the World</div><h2 class="sh-t" id="case-shared-symbols-st" tabindex="-1">The Same Signs Everywhere: One Source or One Brain?</h2><p class="sh-s">Hand stencils, spirals, zigzags, hooked crosses and even &#x27;handbags&#x27; turn up on every inhabited continent. Were they inherited, carried, or simply rediscovered?</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> The recurring symbols in unconnected cultures point to a single lost source culture that handed them down.</p></div><p class="v4-q">Why do the same symbols appear in cultures that never met?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>The same simple signs appear in cultures that never met: spirals, zigzags, hand stencils.</li><li>Some see one lost source culture handing them down.</li><li>The oldest zigzag was made by Homo erectus half a million years ago; hand stencils appear on every inhabited continent at scattered dates.</li><li>The simplest shapes are the ones the human visual system produces by itself.</li><li>One brain, not one source: no dated trail of intermediate examples has been found.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Biology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="67800" >67,800</b><span class="ctr-u"> years</span></div><div class="ctr-l">oldest dated hand stencil (minimum age)</div><div class="ctr-c">Oktaviana et al. 2026</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="500000" >500,000</b><span class="ctr-u"> years</span></div><div class="ctr-l">age of the Trinil zigzag, made before our species</div><div class="ctr-c">Joordens et al. 2015</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="32" >32</b><span class="ctr-u"> signs</span></div><div class="ctr-l">recurring in Ice Age Europe</div><div class="ctr-c">von Petzinger 2016</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="4" >4</b><span class="ctr-u"> form families</span></div><div class="ctr-l">lattices, cobwebs, tunnels, spirals</div><div class="ctr-c">Klüver 1926/1966</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="829" >829</b><span class="ctr-u"> left hands</span></div><div class="ctr-l">against 31 right, at Cueva de las Manos</div><div class="ctr-c">Wikipedia summary of site studies</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The recurring symbols in unconnected cultures point to a single lost source culture that handed them down.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The repeats are real, but their pattern does not fit one source. The oldest zigzag was made by Homo erectus about half a million years ago, and hand stencils were made in Sulawesi and possibly by Neanderthals in Spain before 60,000 years ago. The motifs then appear at scattered dates on different continents, not in a single horizon that later spreads outward. The simplest forms match what the human visual system generates by itself, and the &#x27;handbag&#x27; objects are different things on close inspection. No dated trail of intermediate examples has been found.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Museum labels often present the entoptic explanation as if it were settled, when rock-art specialists still debate how far it reaches; there the confidence runs ahead of the evidence. On the lost-source idea the textbooks are right to be sceptical, though they rarely explain why the repeats happen at all, which leaves the field open to bolder stories.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Hand stencils occur on every inhabited continent; the oldest dated one, on Muna island off Sulawesi, is at least 67,800 years old, and Patagonia&#x27;s Cueva de las Manos stencils begin around 9,300 years ago.<small>Oktaviana et al. 2026; UNESCO</small></li><li>A zigzag engraved on a freshwater mussel shell from Trinil, Java, dates to about 540,000–430,000 years ago and is attributed to Homo erectus, long before our species existed.<small>Joordens et al. 2015</small></li><li>Genevieve von Petzinger catalogued 32 geometric signs that recur across 367+ Ice Age sites in Europe between about 40,000 and 10,000 years ago.<small>von Petzinger 2016</small></li><li>The swastika-like meander appears on a mammoth-ivory bird from Mezine, Ukraine, then on Samarra pottery around 4000 BCE and Indus seals from about 3000 BCE.<small>museum and site publications</small></li><li>The Assyrian apkallu reliefs show a bucket (banduddû) and a cone (mullilu), objects named in ritual texts as tools for sprinkling purifying water.<small>Wiggermann 1992</small></li><li>Visual researchers have documented four families of geometric forms (lattices, cobwebs, tunnels, spirals) that people see in migraine, drug states and near-sleep, across cultures.<small>Klüver 1926/1966; Bressloff et al. 2001</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether entoptic (inside-the-eye) imagery explains much Ice Age geometric art, or only a small share of it.</li><li>What the three carved objects on Göbekli Tepe&#x27;s Pillar 43 represent: bags, baskets, buildings or something else.</li><li>Whether the Spanish hand stencils dated above 66,700 years were made by Neanderthals, and whether the dates hold.</li><li>Whether the &#x27;flower of life&#x27; drawings at Abydos are ancient (early centuries CE) or much more recent.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Most symbolic life was on perishable media: skin paint, tattoos, textiles, basketry, wood and sand drawings. Almost none of it survives.</li><li>The Ice Age coastlines where many people lived are now 100 m or more under the sea.</li><li>Rock art is hard to date directly; many famous panels have only minimum ages or none at all.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Specialists explain recurring symbols with two ordinary forces working together. First, all humans share the same visual system, the same hands and the same physical world, so a spiral, a zigzag, a grid or a hand stencil gets invented again and again. Second, symbols do travel along trade, marriage and religious networks, as the swastika did with Buddhism into East Asia. Complex motifs such as the &#x27;handbags&#x27; look alike only at a glance: in context they are different objects with different jobs.</p><ul><li>Simple geometric forms are cheap to invent and reappear independently.</li><li>The oldest marks predate Homo sapiens, so no single human culture can be their source.</li><li>Documented diffusion leaves a trail of dated examples between regions.</li><li>Named objects in Assyrian texts explain the apkallu bucket and cone without any wider link.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Graham Hancock argues in Magicians of the Gods (2015) that civilising &#x27;sages&#x27; remembered in Mesopotamia, Mesoamerica and elsewhere could have been survivors of an advanced Ice Age culture, and he points to the &#x27;handbag&#x27; carried or displayed at Göbekli Tepe, La Venta and Nimrud as a possible shared badge of that tradition. Michael Button, discussing von Petzinger&#x27;s 32 signs on Joe Rogan&#x27;s podcast, argues that Ice Age people had a sophisticated symbolic tradition far older than textbooks allow, and that civilisations have risen and fallen more than once, leaving echoes behind.</p><ul><li>The handbag shape appears on monuments separated by thousands of kilometres and years.</li><li>The sages who carry it are credited in their own traditions with bringing knowledge.</li><li>Von Petzinger&#x27;s signs show that a graphic code could last some 30,000 years.</li><li>Academics dismissed Ice Age sophistication before, and were wrong.</li></ul><div class="face-s"><b>Its strongest point</b><p>Symbols clearly can persist for tens of thousands of years: von Petzinger&#x27;s database shows some Ice Age signs in use for 30,000 years. If a code can survive that long, echoes of a lost tradition are not absurd in principle.</p></div><p class="face-cr"><b>Credit</b> Graham Hancock; Michael Button (The Joe Rogan Experience #2368, 2025, and #2546, 2026)</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Direct dates for the Göbekli Tepe carvings and a published identification of the Pillar 43 objects from the excavators.</li><li>A chain of dated intermediate examples linking a complex motif across the Atlantic or Pacific before 1492.</li><li>A shared, non-obvious detail (a specific combination, not a simple shape) found in two unconnected regions at the same date.</li><li>Radiocarbon or pigment dating of the Abydos overlapping-circle drawings.</li><li>Cross-cultural studies testing whether entoptic forms predict the frequencies of signs in rock-art databases.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">6 min read · 1,404 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Same Signs Everywhere: One Source or One Brain?"><button type="button" class="wtoc-i" data-go="shared-symbols-s1">The hand on the wall</button><button type="button" class="wtoc-i" data-go="shared-symbols-s2">A catalogue of repeats</button><button type="button" class="wtoc-i" data-go="shared-symbols-s3">The handbag, the bucket and the pouch</button><button type="button" class="wtoc-i" data-go="shared-symbols-s4">Explanation one: the same brain</button><button type="button" class="wtoc-i" data-go="shared-symbols-s5">Explanation two: symbols travel</button><button type="button" class="wtoc-i" data-go="shared-symbols-s6">Explanation three: a lost source</button><button type="button" class="wtoc-i" data-go="shared-symbols-s7">What time has hidden, and what would settle it</button></nav></div><section class="wsec" id="shared-symbols-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The hand on the wall</h3><p>Press your palm against a rock, fill your mouth with ground red pigment and blow. When you lift your hand, a ghost of it stays behind. People have done exactly this in Indonesia, Spain, France, Australia, Borneo and Argentina. At the Cueva de las Manos in Patagonia, painted in waves from about 9,300 years ago, hundreds of hands crowd the wall, and 829 of them are left hands against 31 right ones: the painters held the blowpipe in their right hand.</p><p>Hands are only the start. Spirals curl over the entrance stone at Newgrange in Ireland. Zigzags, grids and dot rows fill Ice Age caves. Hooked crosses appear in Ukraine, Iraq, the Indus Valley, Greece and the American Southwest. And a squat object with a looped handle, nicknamed the &#x27;handbag&#x27;, is carved at Göbekli Tepe in Türkiye, held by a figure at La Venta in Mexico and carried by winged spirits on Assyrian palace walls.</p><blockquote class="wpull"><p>The same shapes recur across oceans and millennia. The question is whether they were inherited, carried or simply rediscovered.</p></blockquote><p>To many people that looks like a fingerprint: evidence that one forgotten culture taught the others. Here is what the evidence shows, and three ways to explain it.</p></section><section class="wsec" id="shared-symbols-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>A catalogue of repeats</h3><p>The oldest repeat is a zigzag. In 2015 Josephine Joordens and colleagues reported a freshwater mussel shell from Trinil on Java, collected in the 1890s, with a zigzag deliberately cut into it about 540,000–430,000 years ago. The maker was Homo erectus. At Blombos Cave in South Africa, a flake of stone carries a red ochre crosshatch drawn about 73,000 years ago. In Europe, Genevieve von Petzinger of the University of Victoria compiled 32 geometric signs, from dots and lines to open angles and &#x27;penniforms&#x27;, that recur across 367 or more sites between about 40,000 and 10,000 years ago (see the ice-age-signs case).</p><figure class="wx wx--static" id="shared-symbols-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">When each symbol first appears</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="When each symbol first appears"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" class="wx-svg" role="img" aria-labelledby="shared-symbols-f1-t"><title id="shared-symbols-f1-t">When the recurring symbols first appear, on a logarithmic time scale from a million to a thousand years ago</title><defs><marker id="shared-symbols-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text x="24" y="28" class="wx-t-cap">Earliest dated examples · years ago, logarithmic scale</text><rect x="502.3" y="70" width="7.4" height="400" class="wx-ice"/><line x1="200.0" y1="70" x2="200.0" y2="470" class="wx-guide"/><text x="200.0" y="488" text-anchor="middle" class="wx-t-s">1,000,000</text><line x1="283.7" y1="70" x2="283.7" y2="470" class="wx-guide"/><text x="283.7" y="488" text-anchor="middle" class="wx-t-s">300,000</text><line x1="360.0" y1="70" x2="360.0" y2="470" class="wx-guide"/><text x="360.0" y="488" text-anchor="middle" class="wx-t-s">100,000</text><line x1="443.7" y1="70" x2="443.7" y2="470" class="wx-guide"/><text x="443.7" y="488" text-anchor="middle" class="wx-t-s">30,000</text><line x1="520.0" y1="70" x2="520.0" y2="470" class="wx-guide"/><text x="520.0" y="488" text-anchor="middle" class="wx-t-s">10,000</text><line x1="603.7" y1="70" x2="603.7" y2="470" class="wx-guide"/><text x="603.7" y="488" text-anchor="middle" class="wx-t-s">3,000</text><line x1="680.0" y1="70" x2="680.0" y2="470" class="wx-guide"/><text x="680.0" y="488" text-anchor="middle" class="wx-t-s">1,000</text><line x1="200" y1="470" x2="680" y2="470" class="wx-line"/><text x="440.0" y="508" text-anchor="middle" class="wx-t-m">years ago (older on the left, today off the right edge)</text><line x1="283.7" y1="64" x2="283.7" y2="470" class="wx-hl wx-draw" pathLength="1" style="--d:1"/><text x="24" y="102" class="wx-t-b">Lines and zigzags</text><text x="24" y="117" class="wx-t-s">engraved, scratched</text><line x1="200" y1="100" x2="680" y2="100" class="wx-guide"/><text x="24" y="158" class="wx-t-b">Hand stencils</text><text x="24" y="173" class="wx-t-s">paint blown round a hand</text><line x1="200" y1="156" x2="680" y2="156" class="wx-guide"/><text x="24" y="214" class="wx-t-b">Ice Age signs</text><text x="24" y="229" class="wx-t-s">von Petzinger's 32</text><line x1="200" y1="212" x2="680" y2="212" class="wx-guide"/><text x="24" y="270" class="wx-t-b">Swastika and meander</text><text x="24" y="285" class="wx-t-s">hooked crosses</text><line x1="200" y1="268" x2="680" y2="268" class="wx-guide"/><text x="24" y="326" class="wx-t-b">Spirals</text><text x="24" y="341" class="wx-t-s">carved in stone</text><line x1="200" y1="324" x2="680" y2="324" class="wx-guide"/><text x="24" y="382" class="wx-t-b">Overlapping circles</text><text x="24" y="397" class="wx-t-s">the 'flower of life'</text><line x1="200" y1="380" x2="680" y2="380" class="wx-guide"/><text x="24" y="438" class="wx-t-b">'Handbag' objects</text><text x="24" y="453" class="wx-t-s">bag, bucket or pouch</text><line x1="200" y1="436" x2="680" y2="436" class="wx-guide"/><rect x="242.8" y="94" width="15.8" height="12" rx="4" class="wx-c1 wx-growx" style="--d:1"/><text x="242.8" y="122" text-anchor="start" class="wx-t-s wx-halo">Trinil, Java: 540,000–430,000 (Homo erectus)</text><circle cx="381.9" cy="100" r="6" class="wx-c1 wx-pop" style="--d:2"/><text x="391.9" y="88" text-anchor="start" class="wx-t-s wx-halo">Blombos crosshatch, 73,000</text><circle cx="387.0" cy="156" r="6" class="wx-c2 wx-pop" style="--d:3"/><line x1="378.0" y1="156" x2="347.0" y2="156" class="wx-line" marker-end="url(#shared-symbols-f1-ah)"/><text x="397.0" y="144" text-anchor="start" class="wx-t-s wx-halo">Sulawesi 67,800+ (Spain 66,700+, Neanderthal?)</text><circle cx="525.0" cy="156" r="6" class="wx-c2 wx-pop" style="--d:4"/><text x="525.0" y="176" text-anchor="middle" class="wx-t-s wx-halo">Patagonia 9,300</text><rect x="423.7" y="206" width="96.3" height="12" rx="4" class="wx-c5 wx-growx" style="--d:5"/><text x="423.7" y="200" text-anchor="start" class="wx-t-s wx-halo">Europe, 40,000–10,000 (367+ sites)</text><rect x="475.4" y="262" width="31.9" height="12" rx="4" class="wx-c6 wx-o80 wx-growx" style="--d:6"/><text x="469.4" y="272" text-anchor="end" class="wx-t-s wx-halo">Mezine ivory bird</text><circle cx="555.5" cy="268" r="6" class="wx-c6 wx-pop" style="--d:7"/><circle cx="568.2" cy="268" r="6" class="wx-c6 wx-pop" style="--d:7"/><text x="561.5" y="288" text-anchor="middle" class="wx-t-s wx-halo">Samarra 6,000 · Indus 5,000</text><circle cx="565.4" cy="324" r="6" class="wx-c3 wx-pop" style="--d:8"/><text x="555.4" y="328" text-anchor="end" class="wx-t-s wx-halo">Newgrange, Ireland, 5,200</text><circle cx="612.3" cy="380" r="6" class="wx-c7 wx-pop" style="--d:9"/><text x="602.3" y="384" text-anchor="end" class="wx-t-s wx-halo">Assyrian palace threshold</text><rect x="631.8" y="374" width="48.2" height="12" rx="4" class="wx-dash wx-pop" style="--d:9"/><text x="654.2" y="402" text-anchor="middle" class="wx-t-s wx-halo">Abydos: date unsure</text><circle cx="510.3" cy="436" r="6" class="wx-c4 wx-pop" style="--d:10"/><text x="500.3" y="440" text-anchor="end" class="wx-t-s wx-halo">Göbekli Tepe Pillar 43</text><rect x="599.2" y="430" width="20.0" height="12" rx="4" class="wx-c4 wx-o80 wx-growx" style="--d:11"/><circle cx="606.7" cy="436" r="6" class="wx-c4 wx-pop" style="--d:11"/><text x="606.7" y="458" text-anchor="middle" class="wx-t-s wx-halo">La Venta; Nimrud</text><text x="283.7" y="58" text-anchor="middle" class="wx-t-b wx-t-a">Homo sapiens appears</text><text x="505.9" y="58" text-anchor="middle" class="wx-t-s">Younger Dryas</text></svg></div></div><figcaption>Earliest dated examples of seven recurring motifs on a logarithmic time scale. The accent line marks the appearance of our species; the pale band is the Younger Dryas. <span class="wx-src">Based on: Joordens et al. 2015; Henshilwood et al. 2018; Oktaviana et al. 2026; Hoffmann et al. 2018; Cueva de las Manos (UNESCO); von Petzinger 2016; Mezine, Samarra and Indus dates from standard reference summaries; Newgrange c. 3200 BCE; Nimrud 883–859 BCE. Positions are approximate first appearances, not full ranges.</span></figcaption><p class="vh">A chart with a logarithmic time axis from one million years ago on the left to one thousand years ago on the right, and seven rows. Lines and zigzags: a bar at 540,000 to 430,000 years for the Trinil shell by Homo erectus and a dot at 73,000 for the Blombos crosshatch. Hand stencils: a dot at 67,800 with an arrow meaning at least that old, for Sulawesi, with a note on Spain at 66,700, and a dot at 9,300 for Patagonia. Ice Age signs: a bar from 40,000 to 10,000 in Europe. Swastika and meander: a bar for the Mezine ivory bird, then dots at 6,000 for Samarra and 5,000 for the Indus. Spirals: a dot at 5,200 for Newgrange. Overlapping circles: a dot for an Assyrian threshold and a dashed bar for Abydos, date unsure. Handbag objects: a dot at 11,500 for Göbekli Tepe and marks around 3,000 for La Venta and Nimrud. A vertical line at 300,000 marks Homo sapiens.</p></figure><p>The swastika has a long, well-dated story. A meander of joined hooked crosses decorates a mammoth-ivory bird from Mezine in Ukraine, a late Ice Age figurine. The motif sits at the centre of a Samarra bowl of about 4000 BCE and on Indus Valley seals from about 3000 BCE. Its Sanskrit name joins su, &#x27;good&#x27;, and asti, &#x27;it is&#x27;: a sign of well-being, still sacred in several Asian traditions. It appears among Pima and Navajo artists too, and in Iron Age Europe.</p><aside class="wcall"><b>Fresh from the field</b><p>In January 2026 Adhi Agus Oktaviana and colleagues reported in Nature a faded hand stencil in Liang Metanduno cave on Muna island, Sulawesi. Calcite that grew over the paint gave a minimum age of 67,800 ± 3,800 years by laser-ablation uranium-series dating. The fingers were deliberately narrowed, a style known only from Sulawesi, and the team attributes it to Homo sapiens. It edges past the 66,700-year minimum for a Spanish stencil attributed to Neanderthals.</p></aside></section><section class="wsec" id="shared-symbols-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The handbag, the bucket and the pouch</h3><p>The &#x27;handbag&#x27; is the most striking repeat, so it deserves a close look. On Göbekli Tepe&#x27;s Pillar 43, the Vulture Stone, carved about 11,500 years ago, three box-like shapes with looped tops sit along the upper edge, each with an animal. Klaus Schmidt, who led the excavation, left them unidentified, and the team&#x27;s publications still treat them as uncertain. Edward Banning suggested in 2011 that similar &#x27;handle&#x27; shapes might depict buildings with vaulted roofs.</p><p>The Assyrian version is not a mystery at all to Assyriologists. On the reliefs of Ashurnasirpal II&#x27;s palace at Nimrud (883–859 BCE), the winged apkallu sages hold a bucket and a cone. Ritual texts name them: the banduddû, a bucket, and the mullilu, a &#x27;purifier&#x27;. As Frans Wiggermann explained in 1992, the bucket held water and the cone sprinkled it, to guard doorways from evil. At La Venta, Monument 19 shows a seated figure framed by a crested rattlesnake, often read as an early feathered serpent, holding a small bag that is usually interpreted as a pouch for copal incense, a common Mesoamerican ritual object.</p><p>So the three &#x27;handbags&#x27; come from cultures thousands of years and kilometres apart, and in context they are a stone-carved object of unknown meaning, a bucket for holy water and an incense pouch. A container with a handle is one of the most useful shapes a human can make. The &#x27;flower of life&#x27; tells a similar story: its best-known ancient example, drawn in red ochre on a granite pillar in the Osireion at Abydos, is not listed in Margaret Murray&#x27;s 1904 survey of the temple&#x27;s graffiti and is usually dated to the early centuries CE, possibly later.</p></section><section class="wsec" id="shared-symbols-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Explanation one: the same brain</h3><p>In the 1920s the psychologist Heinrich Klüver noticed that people who took mescaline reported the same few shapes: lattices and checkerboards, cobwebs, tunnels and funnels, and spirals. Migraine sufferers, people drifting into sleep and people pressing on their closed eyes see them too. In 1988 David Lewis-Williams and Thomas Dowson argued that these entoptic forms, generated inside the visual system, explain much of the geometric art of the Ice Age and of the San painters of southern Africa, whose healers entered trance.</p><figure class="wx wx--steps" id="shared-symbols-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">Patterns made inside the brain</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Patterns made inside the brain"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" class="wx-svg" role="img" aria-labelledby="shared-symbols-f2-t"><title id="shared-symbols-f2-t">How stripes of activity in the visual cortex become rings, rays, spirals and lattices in what is seen</title><defs><clipPath id="shared-symbols-f2-cc"><rect x="60" y="110" width="200" height="240"/></clipPath><clipPath id="shared-symbols-f2-fc"><circle cx="530" cy="230" r="130"/></clipPath><marker id="shared-symbols-f2-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text x="24" y="30" class="wx-t-cap">Patterns made inside the brain · the Bressloff–C ="386" text-anchor="middle" class="wx-t-h">Tunnel or target</text><text x="530" y="404" text-anchor="middle" class="wx-t-m">stripes across the sheet → concentric rings</text></g><g class="wx-st wx-hide" data-only="3"><text x="530" y="386" text-anchor="middle" class="wx-t-h">Funnel or starburst</text><text x="530" y="404" text-anchor="middle" class="wx-t-m">stripes along the sheet → radial rays</text></g><g class="wx-st wx-hide" data-only="4"><text x="530" y="386" text-anchor="middle" class="wx-t-h">Spirals</text><text x="530" y="404" text-anchor="middle" class="wx-t-m">slanting stripes → spirals</text></g><g class="wx-st wx-hide" data-only="5"><text x="530" y="386" text-anchor="middle" class="wx-t-h">Lattice or honeycomb</text><text x="530" y="404" text-anchor="middle" class="wx-t-m">a grid of spots → a web of dots</text></g><line x1="24" y1="428" x2="696" y2="428" class="wx-guide"/><text x="24" y="450" class="wx-t-s">Klüver (1926) sorted drug and migraine visions into lattices, cobwebs, tunnels and spirals.</text><text x="24" y="464" class="wx-t-s">The model shows how simple waves of activity in V1 would produce exactly those families.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> The eye&#x27;s image lands on the cortex stretched: rings in what you see are vertical lines on the cortex, rays are horizontal lines.</p><ol class="wx-steplist"><li>The eye&#x27;s image lands on the cortex stretched: rings in what you see are vertical lines on the cortex, rays are horizontal lines.</li><li>Stripes of activity across the sheet are seen as concentric rings: the tunnel.</li><li>Stripes running along the sheet are seen as rays: the funnel or starburst.</li><li>Slanting stripes are seen as spirals.</li><li>A grid of spots is seen as a lattice or web.</li></ol><figcaption>A simplified version of the Bressloff–Cowan model: simple waves of activity on the visual cortex are seen as rings, rays, spirals and lattices. <span class="wx-src">Based on: Bressloff, Cowan, Golubitsky, Thomas and Wiener 2001; Klüver 1966. Schematic: one cortex sheet stands in for both hemispheres, and the proportions of the map are simplified.</span></figcaption><p class="vh">Two panels joined by an arrow labelled log-polar map. On the left, a rectangle standing for the flattened visual cortex, with distance from the centre of gaze running left to right and angle around the gaze running top to bottom. On the right, a circle standing for the visual field. Step 1: vertical lines on the cortex correspond to rings in the visual field and horizontal lines to rays. Step 2: vertical stripes of activity appear as concentric rings, a tunnel. Step 3: horizontal stripes appear as radial rays, a starburst. Step 4: slanting stripes appear as spiral arms. Step 5: a grid of spots appears as a web of dots, larger towards the edge. A note says Klüver sorted such visions into lattices, cobwebs, tunnels and spirals.</p></figure><p>In 2001 the mathematicians Paul Bressloff, Jack Cowan and colleagues showed why the forms are so few. The eye&#x27;s image is mapped onto the visual cortex in a stretched, log-polar way. When waves of activity arise on their own there, as simple stripes or spots, the brain reads them back as rings, rays, spirals or lattices. The shapes are built into how we see.</p><p>The idea has critics. Paul Bahn and others argue that it is hard to test, that hand stencils and animals are not entoptic, and that &#x27;trance&#x27; is read into art too easily. Mark Changizi and colleagues offered a second shared-biology reason in 2006: the shapes of letters and symbols worldwide match the junctions and contours most common in natural scenes. Either way, ordinary human biology predicts that simple geometric signs will be invented many times.</p></section><section class="wsec" id="shared-symbols-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Explanation two: symbols travel</h3><p>Some symbols really did travel, and when they did, they left a trail. The swastika moved with Buddhism from India into China, Korea and Japan, with dated stops along the route. Rosettes of overlapping circles spread through the Roman world on mosaics and silverware. Von Petzinger&#x27;s own maps show individual Ice Age signs appearing in one region and turning up later in others, which is what cultural transmission looks like.</p><blockquote class="wpull"><p>Real diffusion leaves footprints: dated examples, stepping from place to place. Independent invention leaves scattered first appearances.</p></blockquote><p>That is the test. A motif carried by people should appear first in one place and then, step by dated step, in neighbouring places. A motif rediscovered by many minds should pop up at unrelated dates in unrelated regions. The simplest repeats (spirals, zigzags, hands) mostly look like the second pattern. Complex, arbitrary combinations, such as a specific script or a particular god with particular attributes, look like the first.</p></section><section class="wsec" id="shared-symbols-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Explanation three: a lost source</h3><p>Graham Hancock takes the boldest reading. In Magicians of the Gods he suggests that the civilising sages remembered in several traditions, from the Mesopotamian apkallu to Mesoamerican culture heroes, could be memories of survivors from an advanced culture destroyed at the end of the Ice Age, and that the &#x27;handbag&#x27; may be one of their emblems. Michael Button, on Joe Rogan&#x27;s podcast in August 2026, drew on von Petzinger&#x27;s work to argue that Ice Age people held a sophisticated symbolic tradition far older than textbooks admit, and that civilisations rose and fell more than once.</p><p>Button&#x27;s underlying point has real support: symbolic behaviour is very old, and specialists underrated it for a long time. But a single lost source struggles with the dates. The zigzag was cut by Homo erectus half a million years ago, and hand stencils appear in Sulawesi and possibly among Neanderthals before 60,000 years ago, long before any proposed lost civilisation. The Göbekli carvings sit 8,000 years before the Nimrud reliefs, with no trail of handbags between them, and the objects themselves are different. A lost source would also need to explain why it passed on only the simplest shapes and none of its writing, numbers or tools.</p></section><section class="wsec" id="shared-symbols-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What time has hidden, and what would settle it</h3><p>Honesty cuts both ways. Most human symbols were never carved in stone. Body paint, tattoos, woven patterns, carved wood and drawings in sand vanish within years. The Ice Age coasts, where many people lived, are now deep underwater. The surviving record is a thin, biased sample, so gaps between examples are weak evidence of anything.</p><ul class="wlist"><li>A dated chain of intermediate examples linking a complex motif across an ocean before 1492.</li><li>A shared arbitrary detail, not a simple shape, in two unconnected regions at the same date.</li><li>Direct dates and an agreed reading for the Pillar 43 objects.</li><li>Pigment or radiocarbon dating of the Abydos circle drawings.</li></ul><p>Until then, the recurring signs tell us something remarkable, but it is about us: every human mind comes with the same eyes, the same hands and the same urge to leave a mark.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-study" style="--i:0"><span class="wtl-y">1926 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Heinrich Klüver describes geometric &#x27;form constants&#x27;</span></li><li class="wtl-study" style="--i:1"><span class="wtl-y">1988 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Lewis-Williams and Dowson publish the entoptic model</span></li><li class="wtl-find" style="--i:2"><span class="wtl-y">1995 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Excavations begin at Göbekli Tepe</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">2001 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Bressloff and colleagues model form constants in V1</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">2015 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Trinil shell zigzag dated to about 500,000 years</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">2016 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Von Petzinger&#x27;s The First Signs</span></li><li class="wtl-find" style="--i:6"><span class="wtl-y">2018 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Blombos crosshatch drawing, 73,000 years</span></li><li class="wtl-find" style="--i:7"><span class="wtl-y">2026 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Muna hand stencil dated to 67,800+ years</span></li></ol><details class="srcs"><summary>Sources for this case (14)</summary><ol><li>Oktaviana, A. A. et al. (2026). Rock art from at least 67,800 years ago in Sulawesi. Nature 650: 652–656. <a href="https://doi.org/10.1038/s41586-025-09968-y" target="_blank" rel="noopener">doi:10.1038/s41586-025-09968-y</a></li><li>Joordens, J. C. A. et al. (2015). Homo erectus at Trinil on Java used shells for tool production and engraving. Nature 518: 228–231. <a href="https://doi.org/10.1038/nature13962" target="_blank" rel="noopener">doi:10.1038/nature13962</a></li><li>Henshilwood, C. S. et al. (2018). An abstract drawing from the 73,000-year-old levels at Blombos Cave, South Africa. Nature 562: 115–118. <a href="https://doi.org/10.1038/s41586-018-0514-3" target="_blank" rel="noopener">doi:10.1038/s41586-018-0514-3</a></li><li>Hoffmann, D. L. et al. (2018). U-Th dating of carbonate crusts reveals Neandertal origin of Iberian cave art. Science 359: 912–915. <a href="https://doi.org/10.1126/science.aap7778" target="_blank" rel="noopener">doi:10.1126/science.aap7778</a></li><li>von Petzinger, G. (2016). The First Signs: Unlocking the Mysteries of the World&#x27;s Oldest Symbols. Atria Books.</li><li>Lewis-Williams, J. D. &amp; Dowson, T. A. (1988). The signs of all times: entoptic phenomena in Upper Palaeolithic art. Current Anthropology 29(2): 201–245. <a href="https://doi.org/10.1086/203629" target="_blank" rel="noopener">doi:10.1086/203629</a></li><li>Bressloff, P. C., Cowan, J. D., Golubitsky, M., Thomas, P. J. &amp; Wiener, M. C. (2001). Geometric visual hallucinations, Euclidean symmetry and the functional architecture of striate cortex. Philosophical Transactions of the Royal Society B 356: 299–330. <a href="https://doi.org/10.1098/rstb.2000.0769" target="_blank" rel="noopener">doi:10.1098/rstb.2000.0769</a></li><li>Klüver, H. (1966). Mescal and Mechanisms of Hallucinations. University of Chicago Press (first published 1926–1928).</li><li>Changizi, M. A., Zhang, Q., Ye, H. &amp; Shimojo, S. (2006). The structures of letters and symbols throughout human history are selected to match those found in objects in natural scenes. American Naturalist 167(5): E117–E139. <a href="https://doi.org/10.1086/502806" target="_blank" rel="noopener">doi:10.1086/502806</a></li><li>Banning, E. B. (2011). So fair a house: Göbekli Tepe and the identification of temples in the Pre-Pottery Neolithic of the Near East. Current Anthropology 52(5): 619–660. <a href="https://doi.org/10.1086/661207" target="_blank" rel="noopener">doi:10.1086/661207</a></li><li>Wiggermann, F. A. M. (1992). Mesopotamian Protective Spirits: The Ritual Texts. Cuneiform Monographs 1. Styx, Groningen.</li><li>Hancock, G. (2015). Magicians of the Gods. Coronet.</li><li>The Joe Rogan Experience #2368 (August 2025) and #2546 (August 2026), guest Michael Button. Podcast episodes.</li><li>UNESCO World Heritage Centre. Cueva de las Manos, Río Pinturas (inscribed 1999).</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-shared-symbols" data-t="The Same Signs Everywhere: One Source or One Brain?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Same Signs Everywhere: One Source or One Brain?</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-shared-symbols</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-kalambo-structure-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Kalambo River sunset.jpg" data-cap="The Kalambo River, Zambia and Tanzania, near the 476,000-year-old site" data-big><figcaption></figcaption></figure><div class="sh-k">Skills Older Than We Thought</div><h2 class="sh-t" id="case-kalambo-structure-st" tabindex="-1">Kalambo Falls: Carpentry Before Our Species</h2><p class="sh-s">Two logs joined by a deliberately cut notch, buried in a Zambian riverbank for nearly half a million years, before Homo sapiens existed.</p><div class="sh-v"><span class="vstamp vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><p class="sh-claim"><b>What the stamp rates:</b> Human relatives, before our own species existed, shaped and joined logs into a wooden structure nearly half a million years ago.</p></div><p class="v4-q">Did human relatives build with wood long before our own species appeared?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>At Kalambo Falls in Zambia, two logs lie crossed, the upper one cut with a notch that holds the lower.</li><li>Luminescence dating of the sands around them gives about 476,000 years.</li><li>The logs carry scraping and chopping marks; experiments showed the river could not make them.</li><li>Our own kind&#x27;s oldest fossils are about 300,000 years old, so whoever made this was not us.</li><li>It is strong evidence for the oldest wooden structure known; a second find would make it established.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Physics</span><span class="thr">Biology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="476000" >476,000</b><span class="ctr-u"> years</span></div><div class="ctr-l">age of the interlocking logs (± 23,000)</div><div class="ctr-c">Barham et al. 2023</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="141.3" data-dec="1">141.3</b><span class="ctr-u"> cm</span></div><div class="ctr-l">length of the notched upper log</div><div class="ctr-c">Barham et al. 2023</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="75" >75</b><span class="ctr-u"> °</span></div><div class="ctr-l">angle between the two logs</div><div class="ctr-c">Barham et al. 2023</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="16" >16</b><span class="ctr-u"> sand samples</span></div><div class="ctr-l">dated by luminescence</div><div class="ctr-c">Barham et al. 2023</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="235" >235</b><span class="ctr-u"> m</span></div><div class="ctr-l">drop of Kalambo Falls, just downstream</div><div class="ctr-c">University of Liverpool 2023</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Human relatives, before our own species existed, shaped and joined logs into a wooden structure nearly half a million years ago.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The deliberate notch, the shaped ends and the tool marks are well documented, experiments ruled out river damage as the cause, and the age rests on two luminescence methods and 16 samples. No published rebuttal has appeared since 2023. It stops short of established because it is a single join from one excavation, dated by one team, with its builders unidentified and its function still a proposal. Independent replication at Kalambo or another site would lift it further.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks and museum labels still present the Lower Palaeolithic confidently as an age of stone tools and simple spears, because stone is what survives. Kalambo shows that confidence was built on a biased sample. On the capabilities of pre-sapiens humans, the standard account has been overconfident in its modesty; on what Kalambo was used for, the evidence is still thin in both directions.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>In 2019 excavators at Kalambo Falls, Zambia, uncovered two logs of bushwillow (Combretum zeyheri) lying across each other at about 75°, the upper one cut with a U-shaped notch 13.2 × 11.4 cm in which the lower trunk sits.<small>Barham et al. 2023</small></li><li>Luminescence dating of the sands around the logs, using two methods on feldspar and quartz, gives an age of 476,000 ± 23,000 years; radiocarbon gives only &#x27;infinite&#x27; ages beyond its roughly 50,000-year range.<small>Barham et al. 2023</small></li><li>The upper log carries scraping striations, chopping facets and shaped, tapered ends; experiments exposing wood to the river did not produce similar marks.<small>Barham et al. 2023</small></li><li>Four more worked pieces (a wedge, a digging stick, a cut log and a notched branch) come from the same river deposits, dated between about 476,000 and 324,000 years ago, with Acheulean handaxes and cleavers nearby.<small>Barham et al. 2023</small></li><li>The oldest known Homo sapiens fossils, from Jebel Irhoud in Morocco, are about 300,000 years old, so the Kalambo join predates our species by well over 150,000 years.<small>Richter et al. 2017</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>What the join was for: the excavators suggest a raised platform, walkway or foundation on a wet floodplain, but only one join has been exposed.</li><li>Who made it: no human bones have been found at Kalambo Falls; archaic humans like the Broken Hill (Kabwe) individual from Zambia are the usual candidates.</li><li>Whether it implies people stayed in one place for long periods, as Larry Barham suggests, or returned seasonally to a rich spot.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Wood rots within years wherever oxygen reaches it, so nearly all early woodworking has vanished; Kalambo survived only because its water table stayed high.</li><li>The lower trunk was left in place and runs into the cliff section, and the wider area around the join has not been excavated.</li><li>No hominin fossils or proteins survive at the site, so the builders are known only through what they made.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Specialists have accepted the Kalambo find with little argument. The tool marks are clear under the microscope, the dates come from two independent luminescence methods on 16 samples, and the study passed peer review at Nature. The excavators call it the earliest known structural use of wood and attribute it to an archaic human population, perhaps related to the Broken Hill individual from Zambia. They are careful about function, noting the join has no known parallel in the African or Eurasian Palaeolithic. The honest criticism of the older consensus is that it defined these people by stone, the one material that survives, and so underrated them.</p><ul><li>Worked wood at Kalambo was first reported by J. Desmond Clark in the 1950s and 1960s, but dating it was difficult.</li><li>Two luminescence methods and experimental controls on tool marks support the 2023 reading.</li><li>One join is not yet a building: function remains a proposal.</li><li>Other early wood (Clacton, Schöningen, Gantangqing) shows spears and digging tools, not structures.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Michael Button, a British YouTuber and podcaster, uses Kalambo as a headline example of how the textbook timeline underrates the deep past. In his account, pieces of wood that were cut, tapered and fitted together at an angle show planning and engineering, nearly half a million years before the &#x27;cognitive revolution&#x27; of about 50,000 years ago that popular histories describe. He stresses preservation: if a single waterlogged riverbank kept a structure this old, the empty record elsewhere is a record of rot. He places the find within his broader argument that human capability is far older than taught, and that knowledge has been gained and lost more than once.</p><ul><li>The notch and shaped ends show a planned sequence of work, not a single blow.</li><li>Wood almost never survives, so one surviving structure implies many lost ones.</li><li>The find predates Homo sapiens, which undercuts any story in which only our species could build.</li><li>Mainstream timelines have repeatedly been pushed back by new finds.</li></ul><div class="face-s"><b>Its strongest point</b><p>The join was found only because Kalambo&#x27;s water table never dropped. If one lucky riverbank preserved carpentry 476,000 years old, the absence of structures elsewhere tells us about preservation, not about the minds of the people who lived then.</p></div><p class="face-cr"><b>Credit</b> Michael Button (The Joe Rogan Experience #2368, August 2025, and #2546, August 2026)</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Wider excavation around site BLB5 to see whether more joined logs form a platform, walkway or shelter.</li><li>Hominin fossils or ancient proteins from deposits of the same age in the region, to identify the builders.</li><li>Independent redating of the Kalambo sands by another luminescence laboratory.</li><li>Searches of other waterlogged Middle Pleistocene lake and river edges for worked or joined wood.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,169 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Kalambo Falls: Carpentry Before Our Species"><button type="button" class="wtoc-i" data-go="kalambo-structure-s1">A join in the riverbank</button><button type="button" class="wtoc-i" data-go="kalambo-structure-s2">What the logs actually show</button><button type="button" class="wtoc-i" data-go="kalambo-structure-s3">Who were the builders?</button><button type="button" class="wtoc-i" data-go="kalambo-structure-s4">The mainstream story, and where it lagged</button><button type="button" class="wtoc-i" data-go="kalambo-structure-s5">Michael Button&#x27;s case</button><button type="button" class="wtoc-i" data-go="kalambo-structure-s6">What time has erased</button><button type="button" class="wtoc-i" data-go="kalambo-structure-s7">What would settle it</button></nav></div><section class="wsec" id="kalambo-structure-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A join in the riverbank</h3><p>Just above Kalambo Falls, where the Kalambo River drops 235 metres on the border of Zambia and Tanzania, a team led by Larry Barham of the University of Liverpool dug into the riverbank in 2019. Below today&#x27;s river level, in sand that has stayed wet for an almost unimaginable length of time, they found two logs lying across each other. The upper one, a length of bushwillow 141.3 cm long, had a U-shaped notch cut into it. The lower trunk sat in that notch.</p><p>Someone had made a join. And the sand around it, dated by luminescence, was about 476,000 years old.</p><blockquote class="wpull"><p>The oldest known piece of carpentry was made by people who were not us.</p></blockquote><p>That is older than the earliest known fossils of our own species by roughly 170,000 years. Whoever cut the notch belonged to an earlier kind of human. The find raises a question that goes to the heart of this site: if wood almost never survives, what else could these people build that we will never see?</p></section><section class="wsec" id="kalambo-structure-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What the logs actually show</h3><p>The details, published in Nature in 2023, are specific. The upper log crosses the lower trunk at about 75°. Its notch measures 13.2 by 11.4 cm and runs across the log&#x27;s long axis. Both of its ends were shaped into tapers. Under magnification the surfaces carry V-shaped striations from scraping, small entry facets from chopping, and broad facets from shaping. The lower trunk, left in place where it runs into the cliff, has scraping marks of its own.</p><figure class="photo wimg" data-img="Shaping marks on the upper surfaces of object 1033 and on the underlying treetrunk.webp" data-cap="Tool-shaping marks on the Kalambo Falls logs, from Barham et al. 2023, Nature (CC BY 4.0)"><figcaption></figcaption></figure><figure class="wx wx--steps" id="kalambo-structure-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">Reading the Kalambo join</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Reading the Kalambo join"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" class="wx-svg" role="img" aria-labelledby="kalambo-structure-f1-t"><title id="kalambo-structure-f1-t">Plan of the two interlocking logs at Kalambo Falls, with the notch, tool marks, dates and a proposed reconstructi class="wx-dash"/><polygon points="288.2,282.7 318.8,290.9 311.8,317.3 281.2,309.1" class="wx-hl wx-st wx-hide" data-s="2"/><path d="M362.0,300.0 A62,62 0 0 0 316.0,240.1" class="wx-line"/><text x="352.0" y="260.0" class="wx-t-n wx-halo wx-st" data-s="1">75°</text><text x="357.9" y="150.2" class="wx-t-b wx-st" data-s="1">upper log</text><text x="357.9" y="166.2" class="wx-t-m wx-halo">bushwillow, 141.3 cm long,</text><text x="357.9" y="182.2" class="wx-t-m wx-halo">25.6 cm wide</text><g class="wx-st" data-s="2"><rect x="500" y="288" width="184" height="150" rx="8" class="wx-card wx-edge-soft"/><text x="512" y="306" class="wx-t-cap">the join, side view</text><path d="M522,322 H662 V376 H614.0 V362 A22,22 0 0 0 570.0,362 V376 H522 Z" class="wx-wood wx-edge"/><circle cx="592.0" cy="372" r="19" class="wx-wood wx-o60 wx-edge"/><text x="512" y="404" class="wx-t-s">U-shaped notch 13.2 × 11.4 cm,</text><text x="512" y="418" class="wx-t-s">trunk seated in it (schematic)</text></g><line x1="321.3" y1="304.1" x2="496" y2="340" class="wx-thin wx-st" data-s="2"/><g class="wx-st" data-s="3"><line x1="313.1" y1="179.9" x2="320.1" y2="169.4" class="wx-hl"/><line x1="322.0" y1="182.3" x2="329.0" y2="171.8" class="wx-hl"/><line x1="330.9" y1="184.7" x2="337.9" y2="174.2" class="wx-hl"/><line x1="339.8" y1="187.1" x2="346.8" y2="176.5" class="wx-hl"/><line x1="348.7" y1="189.5" x2="355.7" y2="178.9" class="wx-hl"/><line x1="248.2" y1="422.1" x2="255.2" y2="411.6" class="wx-hl"/><line x1="257.1" y1="424.5" x2="264.1" y2="413.9" class="wx-hl"/><line x1="266.0" y1="426.9" x2="273.0" y2="416.3" class="wx-hl"/><line x1="274.9" y1="429.3" x2="281.9" y2="418.7" class="wx-hl"/><line x1="283.8" y1="431.7" x2="290.8" y2="421.1" class="wx-hl"/></g><text x="87.9" y="457.1" class="wx-t-b wx-halo wx-st" data-s="3">tapered, shaped ends</text><text x="87.9" y="473.1" class="wx-t-m wx-halo wx-st" data-s="3">scraping striations and</text><text x="87.9" y="489.1" class="wx-t-m wx-halo wx-st" data-s="3">chopping facets (accent)</text><circle cx="470" cy="470" r="5" class="wx-c2 wx-st" data-s="4"/><circle cx="600" cy="468" r="5" class="wx-c2 wx-st" data-s="4"/><circle cx="110" cy="190" r="5" class="wx-c2 wx-st" data-s="4"/><circle cx="452" cy="118" r="5" class="wx-c2 wx-st" data-s="4"/><circle cx="620" cy="150" r="5" class="wx-c2 wx-st" data-s="4"/><g class="wx-st" data-s="4"><rect x="36" y="56" width="236" height="62" rx="8" class="wx-card wx-edge-soft"/><text x="48" y="80" class="wx-t-n">476,000 ± 23,000 years</text><text x="48" y="97" class="wx-t-s">luminescence on the sand (blue dots:</text><text x="48" y="110" class="wx-t-s">sample positions schematic)</text></g><line x1="400" y1="522" x2="520.0" y2="522" class="wx-bold"/><line x1="400" y1="516" x2="400" y2="528" class="wx-line"/><line x1="520.0" y1="516" x2="520.0" y2="528" class="wx-line"/><text x="460.0" y="512" text-anchor="middle" class="wx-t-s">50 cm</text><text x="36" y="526" class="wx-t-s">found below today's river level, in waterlogged sand</text><text x="24" y="572" class="wx-t-s">Upper log, notch and angle from Barham et al. 2023. Trunk width, notch position and sample dots are schematic.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Two bushwillow logs lie in waterlogged sand below river level, the upper one crossing the trunk at about 75°.</p><ol class="wx-steplist"><li>Two bushwillow logs lie in waterlogged sand below river level, the upper one crossing the trunk at about 75°.</li><li>A U-shaped notch, 13.2 × 11.4 cm, is cut into the upper log; the trunk sits in it.</li><li>Scraping striations, chopping facets and tapered ends; river-exposure experiments did not reproduce them.</li><li>Luminescence on the surrounding sand: 476,000 ± 23,000 years.</li><li>Proposed, not found: more logs forming a raised platform or walkway on the wet floodplain.</li></ol><figcaption>The two interlocking logs from site BLB5 in plan, drawn to scale from the published measurements, with the evidence added step by step. <span class="wx-src">Based on: Barham et al. 2023 (upper log 141.3 × 25.6 cm, notch 13.2 × 11.4 cm, 75° crossing, 16 luminescence samples). Lower trunk width, notch position along the log and sample positions are schematic; the reconstruction is hypothetical.</span></figcaption><p class="vh">A plan view on a sand-coloured background. A lower tree trunk runs horizontally from the cliff on the left and tapers to a point. An upper log, 141.3 cm long and 25.6 cm wide with tapered ends, crosses it at 75 degrees, marked by an angle arc. Step 2 highlights a notch 13.2 by 11.4 cm on the underside of the upper log, with an inset side view showing the trunk seated in a U-shaped cut. Step 3 adds short accent strokes near both ends for scraping striations and chopping facets. Step 4 adds blue dots for sand samples and a box reading 476,000 plus or minus 23,000 years by luminescence. Step 5 adds dashed outlines of additional logs, labelled as a proposed platform or walkway reconstruction. A 50 cm scale bar sits at the bottom.</p></figure><p>The team also tested the obvious objection. Could a river have battered wood into this shape? They exposed wood to river conditions and found that the resulting damage did not mimic the marks on the Kalambo logs. The same deposits yielded four more worked pieces (a wedge, a digging stick, a cut log and a notched branch), dated between about 476,000 and 324,000 years ago, along with Acheulean handaxes and cleavers.</p><aside class="wcall"><b>How do we know?</b><p>Grains of quartz and feldspar store energy from natural radiation once they are buried; sunlight empties that store. Measuring the stored signal in a lab tells how long the grains have been in the dark. The team used two versions of the method on 16 sand samples, and the ages fell into three clusters: 476,000 ± 23,000, 390,000 ± 25,000 and 324,000 ± 15,000 years. Radiocarbon on the wood only said &#x27;older than about 50,000 years&#x27;, its limit.</p></aside></section><section class="wsec" id="kalambo-structure-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Who were the builders?</h3><p>No human bones have been found at Kalambo Falls. The nearest clue comes from elsewhere in Zambia: the Broken Hill skull from Kabwe, a big-browed archaic human dated in 2020 to about 299,000 years ago. People of that broad kind, often called Homo heidelbergensis, are the usual suspects, but the honest answer is that the builders are known only through their work.</p><p>Barham put the lesson plainly when the paper came out: &quot;Forget the label &#x27;Stone Age&#x27;, look at what these people were doing: they made something new, and large, from wood.&quot; He also argued that a spot with reliable water and plenty of trees may have let people stay for long periods, which challenges the picture of early humans as constantly on the move.</p></section><section class="wsec" id="kalambo-structure-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The mainstream story, and where it lagged</h3><p>For more than a century the earliest chapters of the human story were written in stone because stone is what lasts. Wood appears only in rare windows. A broken spear tip from Clacton in England is around 400,000 years old. Ten wooden spears, 1.84 to 2.53 metres long, were excavated at Schöningen in Germany in the 1990s. In France, Neanderthals broke off some 400 pieces of stalagmite deep inside Bruniquel Cave about 176,000 years ago and arranged them into rings, a structure of a different material.</p><figure class="wx wx--static" id="kalambo-structure-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">The oldest worked wood and structures</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The oldest worked wood and structures"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" class="wx-svg" role="img" aria-labelledby="kalambo-structure-f2-t"><title id="kalambo-structure-f2-t">The oldest worked wood and built structures, in thousands of years ago</title><text x="24" y="28" class="wx-t-cap">Oldest worked wood and structures · thousand years ago</text><line x1="690.0" y1="56" x2="690.0" y2="400" class="wx-guide"/><text x="690.0" y="420" text-anchor="middle" class="wx-t-s">0</text><line x1="598.0" y1="56" x2="598.0" y2="400" class="wx-guide"/><text x="598.0" y="420" text-anchor="middle" class="wx-t-s">100</text><line x1="506.0" y1="56" x2="506.0" y2="400" class="wx-guide"/><text x="506.0" y="420" text-anchor="middle" class="wx-t-s">200</text><line x1="414.0" y1="56" x2="414.0" y2="400" class="wx-guide"/><text x="414.0" y="420" text-anchor="middle" class="wx-t-s">300</text><line x1="322.0" y1="56" x2="322.0" y2="400" class="wx-guide"/><text x="322.0" y="420" text-anchor="middle" class="wx-t-s">400</text><line x1="230.0" y1="56" x2="230.0" y2="400" class="wx-guide"/><text x="230.0" y="420" text-anchor="middle" class="wx-t-s">500</text><line x1="230" y1="400" x2="690" y2="400" class="wx-line"/><text x="460" y="444" text-anchor="middle" class="wx-t-m">thousand years ago (today at the right)</text><text x="24" y="94" class="wx-t-b">Kalambo Falls, Zambia</text><text x="24" y="109" class="wx-t-s">joined logs; tools</text><text x="24" y="144" class="wx-t-b">Clacton, England</text><text x="24" y="159" class="wx-t-s">spear tip</text><text x="24" y="194" class="wx-t-b">Schöningen, Germany</text><text x="24" y="209" class="wx-t-s">ten spears</text><text x="24" y="254" class="wx-t-b">Gantangqing, China</text><text x="24" y="269" class="wx-t-s">35 digging tools</text><text x="24" y="304" class="wx-t-b">Bruniquel, France</text><text x="24" y="319" class="wx-t-s">stalagmite rings</text><text x="24" y="354" class="wx-t-b">Homo sapiens</text><text x="24" y="369" class="wx-t-s">oldest fossils</text><rect x="230.9" y="83" width="42.3" height="14" rx="4" class="wx-c1 wx-growx" style="--d:1"/><text x="230.9" y="74" class="wx-t-b wx-t-a">structure, 476 ± 23</text><circle cx="331.2" cy="90" r="5.5" class="wx-c1 wx-pop" style="--d:3"/><circle cx="391.9" cy="90" r="5.5" class="wx-c1 wx-pop" style="--d:3"/><text x="395.9" y="112" text-anchor="end" class="wx-t-s">other tools, 390 and 324</text><circle cx="322.0" cy="140" r="5.5" class="wx-c6 wx-pop" style="--d:4"/><text x="332.0" y="144" class="wx-t-s">c. 400</text><rect x="380.0" y="185" width="34.0" height="10" rx="4" class="wx-dash wx-pop" style="--d:5"/><text x="397.4" y="178" text-anchor="middle" class="wx-t-s">2015 date</text><circle cx="506.0" cy="190" r="5.5" class="wx-c3 wx-pop" style="--d:6"/><line x1="418.0" y1="190" x2="497.0" y2="190" class="wx-thin"/><text x="516.0" y="194" class="wx-t-s">c. 200: 2025 revision</text><rect x="368.0" y="243" width="92.0" height="14" rx="4" class="wx-c2 wx-growx" style="--d:5"/><text x="468.0" y="254" class="wx-t-s">350–250</text><circle cx="527.6" cy="300" r="5.5" class="wx-c5 wx-pop" style="--d:7"/><text x="537.6" y="304" class="wx-t-s">c. 176 (Neanderthals)</text><rect x="414.0" y="343" width="276.0" height="14" rx="4" class="wx-c4 wx-o60 wx-growx" style="--d:8"/><text x="422.0" y="336" class="wx-t-s">Jebel Irhoud, Morocco, c. 300</text><line x1="414.0" y1="60" x2="414.0" y2="400" class="wx-hl wx-draw" pathLength="1" style="--d:9"/><text x="420.0" y="66" class="wx-t-s wx-t-a">our species appears</text><text x="24" y="462" class="wx-t-s">Wood this old survives only where it stayed waterlogged, so each point on this chart is a rare stroke of luck.</text></svg></div></div><figcaption>Kalambo sits far ahead of other surviving woodwork, and well before the first fossils of our own species (accent line). <span class="wx-src">Based on: Barham et al. 2023; Thieme 1997; Richter and Krbetschek 2015; Hutson et al. 2025; Liu et al. 2025; Jaubert et al. 2016; Richter et al. 2017. Clacton age approximate.</span></figcaption><p class="vh">A horizontal time chart from 500,000 years ago on the left to today on the right. Kalambo Falls: a bar from about 499,000 to 453,000 years ago for the structure, and dots at 390,000 and 324,000 for other worked wood. Clacton spear tip: a dot at about 400,000. Schöningen spears: a dashed box for the 2015 date of 337,000 to 300,000 and a dot at about 200,000 for the 2025 revision. Gantangqing digging tools: a bar from 350,000 to 250,000. Bruniquel stalagmite rings made by Neanderthals: a dot at about 176,000. Homo sapiens: a bar from 300,000 to today, starting with Jebel Irhoud. An accent line at 300,000 years marks when our species appears.</p></figure><aside class="wcall"><b>Fresh from the field</b><p>In 2025 two studies reshaped the wooden record around Kalambo. A team led by Jian-Hui Liu reported 35 wooden tools, mostly for digging up roots and tubers, from Gantangqing in south-west China, dated to about 350,000–250,000 years ago, the oldest in East Asia. And a new dating study argued that the Schöningen spears are about 200,000 years old rather than 300,000, which would make Neanderthals their likely makers.</p></aside><p>Specialists accepted Kalambo quickly, which is to their credit. But the find exposes a deeper problem with the conventional picture. Labels like &#x27;Stone Age&#x27; and diagrams that show early humans with nothing but a handaxe were built on the materials that happen to survive, and then taught with a confidence the evidence never justified.</p></section><section class="wsec" id="kalambo-structure-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Michael Button&#x27;s case</h3><p>Michael Button, a British YouTuber who studied ancient history at university, brought Kalambo to a huge audience on The Joe Rogan Experience in August 2025 and again in August 2026. His argument, in his own terms, is that cut, tapered and fitted timber is engineering, and that it pushes signs of a planning, building mind back almost ten times further than the &#x27;cognitive revolution&#x27; of about 50,000 years ago that many popular histories still describe.</p><p>He pairs this with a point about preservation that specialists would recognise. Wood that survives half a million years is a freak of geology. One such survival suggests many structures that rotted away, and he sets this inside his larger picture of a human past in which capability is older than we were taught, and has been gained and lost more than once.</p><blockquote class="wpull"><p>If one waterlogged riverbank kept a join this old, the empty record elsewhere says more about rot than about minds.</p></blockquote><p>On the first point the evidence is on his side, and so are many archaeologists: the idea of a sudden cognitive revolution was already under attack in the scholarly literature, notably in Sally McBrearty and Alison Brooks&#x27;s 2000 paper &#x27;The revolution that wasn&#x27;t&#x27;. On the larger thesis, Kalambo is silent. It shows woodworking and a joint, not houses, villages or a lost civilisation. The claim weighed here is the one Kalambo can actually answer.</p></section><section class="wsec" id="kalambo-structure-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What time has erased</h3><p>Wood decays wherever oxygen and microbes reach it. It survives for hundreds of thousands of years only when it is sealed underwater, frozen or extremely dry. Kalambo&#x27;s river kept its sediments saturated, which is why Desmond Clark had already found worked wood there in the 1950s and 1960s, including a log 165 cm long with a groove cut across it, though dating it proved hard. Most riverbanks of half a million years ago have long since eroded or dried out. The scarcity of early wooden structures is therefore weak evidence that they were rare: in places nobody could look, or where nothing could survive, absence tells us almost nothing.</p></section><section class="wsec" id="kalambo-structure-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle it</h3><p>Three things would move this case from strong to established. More of the structure: wider excavation around the join to learn whether other logs formed a platform or walkway. The builders: fossils or ancient proteins from deposits of the same age nearby. And replication: independent redating of the sands, and a second joined structure from another waterlogged site. Until then, one notch in one log tells us something remarkable with unusual clarity. Nearly half a million years ago, before there was any Homo sapiens, someone looked at two trees and decided how to make them fit.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-study" style="--i:0"><span class="wtl-y">1953 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">J. Desmond Clark begins excavating at Kalambo Falls</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">1964 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Kalambo Falls declared a national monument</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">2009 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Added to UNESCO&#x27;s Tentative List</span></li><li class="wtl-find" style="--i:3"><span class="wtl-y">2019 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Interlocking logs excavated at site BLB5</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">2023 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Published in Nature: 476,000 ± 23,000 years</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">2025 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Gantangqing wooden tools; Schöningen spears redated</span></li></ol><details class="srcs"><summary>Sources for this case (12)</summary><ol><li>Barham, L., Duller, G. A. T., Candy, I. et al. (2023). Evidence for the earliest structural use of wood at least 476,000 years ago. Nature 622: 107–111. <a href="https://doi.org/10.1038/s41586-023-06557-9" target="_blank" rel="noopener">doi:10.1038/s41586-023-06557-9</a></li><li>Clark, J. D. (ed.) (1969, 1974, 2001). Kalambo Falls Prehistoric Site, vols I–III. Cambridge University Press.</li><li>Duller, G. A. T., Tooth, S., Barham, L. &amp; Tsukamoto, S. (2015). New investigations at Kalambo Falls, Zambia: luminescence chronology, site formation, and archaeological significance. Journal of Human Evolution 85: 111–125.</li><li>Grün, R. et al. (2020). Dating the skull from Broken Hill, Zambia, and its position in human evolution. Nature 580: 372–375. <a href="https://doi.org/10.1038/s41586-020-2165-4" target="_blank" rel="noopener">doi:10.1038/s41586-020-2165-4</a></li><li>Richter, D. et al. (2017). The age of the hominin fossils from Jebel Irhoud, Morocco, and the origins of the Middle Stone Age. Nature 546: 293–296.</li><li>Thieme, H. (1997). Lower Palaeolithic hunting spears from Germany. Nature 385: 807–810. <a href="https://doi.org/10.1038/385807a0" target="_blank" rel="noopener">doi:10.1038/385807a0</a></li><li>Richter, D. &amp; Krbetschek, M. (2015). The age of the Lower Paleolithic occupation at Schöningen. Journal of Human Evolution 89: 46–56.</li><li>Hutson, J. M. et al. (2025). Revised age for Schöningen hunting spears indicates intensification of Neanderthal cooperative behavior around 200,000 years ago. Science Advances 11(19). <a href="https://doi.org/10.1126/sciadv.adv0752" target="_blank" rel="noopener">doi:10.1126/sciadv.adv0752</a></li><li>Liu, J.-H. et al. (2025). 300,000-year-old wooden tools from Gantangqing, southwest China. Science. <a href="https://doi.org/10.1126/science.adr8540" target="_blank" rel="noopener">doi:10.1126/science.adr8540</a></li><li>Jaubert, J. et al. (2016). Early Neanderthal constructions deep in Bruniquel Cave in southwestern France. Nature 534: 111–114. <a href="https://doi.org/10.1038/nature18291" target="_blank" rel="noopener">doi:10.1038/nature18291</a></li><li>McBrearty, S. &amp; Brooks, A. S. (2000). The revolution that wasn&#x27;t: a new interpretation of the origin of modern human behavior. Journal of Human Evolution 39: 453–563. <a href="https://doi.org/10.1006/jhev.2000.0435" target="_blank" rel="noopener">doi:10.1006/jhev.2000.0435</a></li><li>University of Liverpool (20 September 2023). Archaeologists discover world&#x27;s oldest wooden structure. News release.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-kalambo-structure" data-t="Kalambo Falls: Carpentry Before Our Species"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Kalambo Falls: Carpentry Before Our Species</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-kalambo-structure</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-stone-age-surgery-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Trephined skull, Neolithic period. Wellcome M0014688.jpg" data-cap="A Neolithic skull with a healed trepanation hole" data-big><figcaption></figcaption></figure><div class="sh-k">Skills Older Than We Thought</div><h2 class="sh-t" id="case-stone-age-surgery-st" tabindex="-1">The Ice Age Surgeons of Borneo</h2><p class="sh-s">A child lost the lower left leg to a clean cut 31,000 years ago, healed, and lived for years. Someone knew what they were doing.</p><div class="sh-v"><span class="vstamp vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><p class="sh-claim"><b>What the stamp rates:</b> Ice Age foragers performed deliberate surgery that the patient survived, drawing on real medical knowledge.</p></div><p class="v4-q">Could Ice Age foragers perform surgery that a patient survived?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>In a cave in Borneo, a young person buried about 31,000 years ago is missing the lower left leg.</li><li>Both bones end in a clean, angled cut, with none of the crushing an accident leaves.</li><li>The stump had healed and rounded: the child lived six to nine more years.</li><li>Before this, the oldest known amputation was a French farmer about 7,000 years ago.</li><li>Surgery that a patient survived, in the Ice Age: strong evidence, resting on one skeleton.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Biology</span><span class="thr">Archaeology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="31000" >31,000</b><span class="ctr-u"> years</span></div><div class="ctr-l">age of the Liang Tebo amputation</div><div class="ctr-c">Maloney et al. 2022</div></div><div class="ctr"><div class="ctr-v">at least <b class="ctr-n" data-v="6" >6</b><span class="ctr-u"> years</span></div><div class="ctr-l">survival after the operation (6–9 years)</div><div class="ctr-c">Maloney et al. 2022</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="24000" >24,000</b><span class="ctr-u"> years</span></div><div class="ctr-l">older than the previous oldest amputation</div><div class="ctr-c">Maloney et al. 2022</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="14000" >14,000</b><span class="ctr-u"> years</span></div><div class="ctr-l">age of the oldest known dental treatment</div><div class="ctr-c">Oxilia et al. 2015</div></div><div class="ctr"><div class="ctr-v">at least <b class="ctr-n" data-v="40000" >40,000</b><span class="ctr-u"> years</span></div><div class="ctr-l">age of the nearby figurative cave art</div><div class="ctr-c">Aubert et al. 2018</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Ice Age foragers performed deliberate surgery that the patient survived, drawing on real medical knowledge.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">TB1 is securely dated, the cut is clean and oblique through both bones, crushing and infection are absent, and healing shows years of survival. Independent specialists accep
