 x="71" y="221" width="28" height="28" class="wx-stone"/><rect x="101" y="221" width="28" height="28" class="wx-stone"/><rect x="131" y="221" width="28" height="28" class="wx-stone"/><rect x="161" y="221" width="28" height="28" class="wx-stone"/><rect x="191" y="221" width="28" height="28" class="wx-stone"/><rect x="221" y="221" width="28" height="28" class="wx-stone"/><rect x="251" y="221" width="28" height="28" class="wx-stone"/><rect x="281" y="221" width="28" height="28" class="wx-stone"/><rect x="311" y="221" width="28" height="28" class="wx-stone"/><rect x="41" y="251" width="28" height="28" class="wx-stone"/><rect x="71" y="251" width="28" height="28" class="wx-stone"/><rect x="101" y="251" width="28" height="28" class="wx-stone"/><rect x="131" y="251" width="28" height="28" class="wx-stone"/><rect x="161" y="251" width="28" height="28" class="wx-stone"/><rect x="191" y="251" width="28" height="28" class="wx-stone"/><rect x="221" y="251" width="28" height="28" class="wx-stone"/><rect x="251" y="251" width="28" height="28" class="wx-stone"/><rect x="281" y="251" width="28" height="28" class="wx-stone"/><rect x="311" y="251" width="28" height="28" class="wx-stone"/><rect x="41" y="281" width="28" height="28" class="wx-stone"/><rect x="71" y="281" width="28" height="28" class="wx-stone"/><rect x="101" y="281" width="28" height="28" class="wx-stone"/><rect x="131" y="281" width="28" height="28" class="wx-stone"/><rect x="161" y="281" width="28" height="28" class="wx-stone"/><rect x="191" y="281" width="28" height="28" class="wx-stone"/><rect x="221" y="281" width="28" height="28" class="wx-stone"/><rect x="251" y="281" width="28" height="28" class="wx-stone"/><rect x="281" y="281" width="28" height="28" class="wx-stone"/><rect x="311" y="281" width="28" height="28" class="wx-stone"/><rect x="41" y="311" width="28" height="28" class="wx-stone"/><rect x="71" y="311" width="28" height="28" class="wx-stone"/><rect x="101" y="311" width="28" height="28" class="wx-stone"/><rect x="131" y="311" width="28" height="28" class="wx-stone"/><rect x="161" y="311" width="28" height="28" class="wx-stone"/><rect x="191" y="311" width="28" height="28" class="wx-stone"/><rect x="221" y="311" width="28" height="28" class="wx-stone"/><rect x="251" y="311" width="28" height="28" class="wx-stone"/><rect x="281" y="311" width="28" height="28" class="wx-stone"/><rect x="311" y="311" width="28" height="28" class="wx-stone"/><rect x="41" y="341" width="28" height="28" class="wx-stone"/><rect x="71" y="341" width="28" height="28" class="wx-stone"/><rect x="101" y="341" width="28" height="28" class="wx-stone"/><rect x="131" y="341" width="28" height="28" class="wx-stone"/><rect x="161" y="341" width="28" height="28" class="wx-stone"/><rect x="191" y="341" width="28" height="28" class="wx-stone"/><rect x="221" y="341" width="28" height="28" class="wx-stone"/><rect x="251" y="341" width="28" height="28" class="wx-stone"/><rect x="281" y="341" width="28" height="28" class="wx-stone"/><rect x="311" y="341" width="28" height="28" class="wx-stone"/><text x="40" y="392" class="wx-t-b">The mound: c. 9 ha. Each square is 1 percent.</text><text x="40" y="410" class="wx-t-s">Solid: c. 5 percent excavated. Pale: up to c. 10 percent,</text><text x="40" y="426" class="wx-t-s">the range of published and official estimates.</text><text x="400" y="28" class="wx-t-cap">To scale: mound, roof and one enclosure</text><circle cx="540" cy="220" r="120.0" class="wx-soil wx-edge"/><text x="540" y="90.0" text-anchor="middle" class="wx-t-b">mound c. 300 m across</text><ellipse cx="530" cy="240" rx="36.0" ry="22.6" class="wx-card wx-o80 wx-dash"/><circle cx="536" cy="242" r="5.6" class="wx-accfill wx-pulse"/><line x1="536" y1="242" x2="630" y2="290" class="wx-thin"/><text x="634" y="288" class="wx-t-b wx-halo">Enclosure D</text><text x="634" y="303" class="wx-t-s wx-halo">c. 14 m across</text><line x1="494" y1="222" x2="430" y2="170" class="wx-thin"/><text x="430" y="164" text-anchor="end" class="wx-t-b wx-halo">roof, c. 4,000 m²</text><text x="430" y="179" text-anchor="end" class="wx-t-s wx-halo">over the main dig</text><text x="540" y="362.0" text-anchor="middle" class="wx-t-s">positions schematic; sizes to scale</text><line x1="440" y1="384.0" x2="480.0" y2="384.0" class="wx-bold"/><text x="488.0" y="388.0" class="wx-t-s">50 m</text></svg></div></div><figcaption>The share of the mound excavated so far, and the mound, its protective roof and one enclosure drawn to the same scale. <span class="wx-src">Based on: Mound size and excavated share after Clare 2020, the DAI project and press reports (NPR 2025); roof area after Hürriyet Daily News 2018; Enclosure D diameter after the DAI project. Positions schematic.</span></figcaption><p class="vh">Left: a grid of 100 squares standing for the whole mound, about 9 hectares, each square 1 percent. Five squares are shaded solid for about 5 percent excavated and five more pale for estimates of up to about a tenth. Right: a to-scale drawing of the mound as a circle about 300 metres across, a dashed oval of about 4,000 square metres for the protective roof over the main excavation, and a small pulsing dot about 14 metres across for Enclosure D. Positions are schematic and a 50 metre scale bar is shown.</p></figure><p>After Schmidt died in 2014, the DAI&#x27;s Lee Clare led research that continued through the rest of the decade and was summarised in print in 2020. In the 2020s the Istanbul University archaeologist Necmi Karul has led excavation at Göbekli Tepe and at its sister site Karahan Tepe, part of a regional programme launched in 2021, Taş Tepeler, the Stone Hills, that now covers about a dozen sites. Karahan Tepe, with its carved rock-cut chambers and human heads, is among the most striking finds of the decade.</p></section><section class="wsec" id="gobekli-excavation-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Corsetti&#x27;s case at its strongest</h3><p>Corsetti&#x27;s argument is not only about speed. He points to a sequence that, to him, looks like a change of priorities. In January 2016 the Doğuş Group launched a 20-year sponsorship of the site with the Ministry of Culture and Tourism at the World Economic Forum in Davos. Then came a protective roof of about 4,000 m², a visitor centre and new paths. In March 2018 archaeologists, including Schmidt&#x27;s widow Çiğdem Köksal-Schmidt and Karul himself, protested at heavy machinery and concrete near the ruins. The ministry denied any damage.</p><p>Then there were the trees. Hundreds of olive trees stood on the mound, over ground where geophysics showed buried structures. Corsetti argued for years that the trees blocked excavation and that their roots would damage the ruins, and he was widely mocked for it. In February 2025 about 800 trees were dug up and replanted elsewhere. The excavation head, Karul, explained that the roots threatened the remains below and that the trees stood over a far larger area than had been excavated, blocking further work.</p><p>That is the strongest part of Corsetti&#x27;s case: on a concrete, checkable point, the people in charge ended up doing what he had demanded.</p></section><section class="wsec" id="gobekli-excavation-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Why archaeologists dig slowly</h3><p>The archaeologists&#x27; answer starts with a basic fact about their science: excavation destroys what it studies. Once a layer is dug, the relationships between its objects, bones and walls survive only in the records. Clare put it plainly to NPR: &#x27;You can&#x27;t just bulldoze a site to get everything out. That&#x27;s the wrong approach.&#x27; He added that digging the whole site would take possibilities away from future archaeologists, whose methods, from ancient DNA to new dating techniques, will extract far more than ours.</p><aside class="wcall"><b>How do we know the work was not stopped?</b><p>Because it was published. The DAI&#x27;s summary of research from 2015 to 2019 appeared in 2020, and the Taş Tepeler project has since reported new buildings, sculptures and dates from Göbekli Tepe, Karahan Tepe and other sites in journals, conferences and the press. A project trying to hide what lies underground would not be widening its search to a dozen sister sites.</p></aside><p>Exposed stone also decays. Pillars that have spent 10,000 years in stable soil start to crack and weather within years in the open, which is why the excavated enclosures now stand under a roof. Leaving most of a site in the ground is normal at famous sites, from Pompeii, where a large part of the city is still buried, to Çatalhöyük.</p></section><section class="wsec" id="gobekli-excavation-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The trees, and what they did</h3><figure class="wx wx--steps" id="gobekli-excavation-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">Thirty years of digging</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Thirty years of digging"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" class="wx-svg" role="img" aria-labelledby="gobekli-excavation-f2-t"><title id="gobekli-excavation-f2-t">Timeline of excavation at Göbekli Tepe from 1995 to 2026, showing its directors, the sponsorship, the construction row, the Taş Tepeler project and the olive-tree removal, in five steps</title><text x="24" y="28" class="wx-t-cap">Thirty years of digging, 1995–2026</text><line x1="50" y1="300" x2="680" y2="300" class="wx-line"/><line x1="69.1" y1="300" x2="69.1" y2="306" class="wx-dim"/><text x="69.1" y="320" text-anchor="middle" class="wx-t-s">1995</text><line x1="164.5" y1="300" x2="164.5" y2="306" class="wx-dim"/><text x="164.5" y="320" text-anchor="middle" class="wx-t-s">2000</text><line x1="260.0" y1="300" x2="260.0" y2="306" class="wx-dim"/><text x="260.0" y="320" text-anchor="middle" class="wx-t-s">2005</text><line x1="355.5" y1="300" x2="355.5" y2="306" class="wx-dim"/><text x="355.5" y="320" text-anchor="middle" class="wx-t-s">2010</text><line x1="450.9" y1="300" x2="450.9" y2="306" class="wx-dim"/><text x="450.9" y="320" text-anchor="middle" class="wx-t-s">2015</text><line x1="546.4" y1="300" x2="546.4" y2="306" class="wx-dim"/><text x="546.4" y="320" text-anchor="middle" class="wx-t-s">2020</text><line x1="641.8" y1="300" x2="641.8" y2="306" class="wx-dim"/><text x="641.8" y="320" text-anchor="middle" class="wx-t-s">2025</text><g class="wx-st" data-s="1"><rect x="69.1" y="270" width="362.7" height="18" class="wx-c2 wx-o60"/><text x="73.1" y="283" class="wx-t-s wx-halo">Klaus Schmidt (DAI)</text></g><g class="wx-st" data-s="2"><rect x="443.3" y="270" width="122.2" height="18" class="wx-c3 wx-o60"/><text x="447.3" y="283" class="wx-t-s wx-halo">Lee Clare (DAI)</text></g><g class="wx-st" data-s="4"><rect x="565.5" y="270" width="112.6" height="18" class="wx-c6 wx-o60"/><text x="569.5" y="283" class="wx-t-s wx-halo">Necmi Karul, Taş Tepeler</text></g><g class="wx-st" data-s="1"><line x1="69.1" y1="216" x2="69.1" y2="300" class="wx-guide"/><circle cx="69.1" cy="300" r="5" class="wx-accfill"/><text x="75.1" y="226" text-anchor="start" class="wx-t-b wx-halo">Excavation begins</text><text x="75.1" y="241" text-anchor="start" class="wx-t-s wx-halo">Schmidt, with Şanlıurfa Museum</text></g><g class="wx-st" data-s="2"><line x1="441.4" y1="240" x2="441.4" y2="300" class="wx-guide"/><circle cx="441.4" cy="300" r="5" class="wx-accfill"/><text x="435.4" y="250" text-anchor="end" class="wx-t-b wx-halo">Schmidt dies (July 2014)</text></g><g class="wx-st" data-s="2"><line x1="470.0" y1="204" x2="470.0" y2="300" class="wx-guide"/><circle cx="470.0" cy="300" r="5" class="wx-accfill"/><text x="464.0" y="214" text-anchor="end" class="wx-t-b wx-halo">Doğuş sponsorship launched</text><text x="464.0" y="229" text-anchor="end" class="wx-t-s wx-halo">at Davos, January 2016</text></g><g class="wx-st" data-s="3"><line x1="512.0" y1="164" x2="512.0" y2="300" class="wx-guide"/><circle cx="512.0" cy="300" r="5" class="wx-accfill"/><text x="506.0" y="174" text-anchor="end" class="wx-t-b wx-halo">Roof, walkway and concrete row</text><text x="506.0" y="189" text-anchor="end" class="wx-t-s wx-halo">archaeologists protest; ministry denies damage</text></g><g class="wx-st" data-s="4"><line x1="565.5" y1="124" x2="565.5" y2="300" class="wx-guide"/><circle cx="565.5" cy="300" r="5" class="wx-accfill"/><text x="559.5" y="134" text-anchor="end" class="wx-t-b wx-halo">Taş Tepeler project</text><text x="559.5" y="149" text-anchor="end" class="wx-t-s wx-halo">a dozen sister sites, incl. Karahan Tepe</text></g><g class="wx-st" data-s="5"><line x1="643.7" y1="84" x2="643.7" y2="300" class="wx-guide"/><circle cx="643.7" cy="300" r="5" class="wx-accfill"/><text x="637.7" y="94" text-anchor="end" class="wx-t-b wx-halo">c. 800 olive trees moved</text><text x="637.7" y="109" text-anchor="end" class="wx-t-s wx-halo">to protect remains and allow digging</text></g><g class="wx-st" data-s="5"><line x1="660.9" y1="44" x2="660.9" y2="300" class="wx-guide"/><circle cx="660.9" cy="300" r="5" class="wx-accfill"/><text x="654.9" y="54" text-anchor="end" class="wx-t-b wx-halo">Geophysics reports dwellings</text><text x="654.9" y="69" text-anchor="end" class="wx-t-s wx-halo">near the enclosures</text></g><g class="wx-st wx-hide" data-only="5"><text x="50" y="360" class="wx-t wx-t-a">Corsetti: the move vindicates him; in 2026 he says root damage is confirmed.</text><text x="50" y="378" class="wx-t-s">Critics: the excavation head spoke of a risk to buried remains, not proven damage.</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> 1995: excavation begins under Klaus Schmidt of the German Archaeological Institute.</p><ol class="wx-steplist"><li>1995: excavation begins under Klaus Schmidt of the German Archaeological Institute.</li><li>2014–16: Schmidt dies; DAI work continues under Lee Clare; the Doğuş sponsorship is launched at Davos.</li><li>2018: archaeologists protest machinery and concrete used for the roof and walkway; the ministry denies damage.</li><li>2021 onward: the Taş Tepeler project, with Necmi Karul leading excavation at Göbekli Tepe and Karahan Tepe.</li><li>2025–26: about 800 olive trees are moved; Corsetti claims vindication; geophysics finds likely dwellings.</li></ol><figcaption>Who has led the work at Göbekli Tepe, and the events behind the row over its pace. <span class="wx-src">Based on: Clare 2020; Doğuş Group 2018; Hürriyet Daily News 2018 and 2025; Türkiye Today 2025; NPR 2025; Colavito 2025. Dates of the change of excavation leadership approximate.</span></figcaption><p class="vh">A timeline from 1995 to 2026. Step 1 shows excavation beginning in 1995 under Klaus Schmidt of the German Archaeological Institute, with a bar for his era to 2014. Step 2 adds Schmidt&#x27;s death in 2014, the DAI era under Lee Clare, and the Doğuş Group sponsorship launched at Davos in January 2016. Step 3 marks the 2018 row over the roof, walkway and concrete, when archaeologists protested and the ministry denied damage. Step 4 adds the Taş Tepeler project from 2021 and excavation led by Necmi Karul. Step 5 marks the removal of about 800 olive trees in February 2025 and 2026 geophysics reporting dwellings, with a note that Corsetti says root damage is confirmed while critics say the excavation head spoke of a risk.</p></figure><p>Even the tree story is less simple than it looks. The trees had been planted by the landowners before the state expropriated the land; reports put their planting around 15 years before, and a mature olive grove raises the compensation a landowner receives. Karul moved them, he said, because as they grew their roots would threaten what lies beneath. Whether any damage had already happened is disputed. The writer Jason Colavito argues that an English news report turned Karul&#x27;s Turkish, which spoke of damage that could happen, into damage that had begun.</p><aside class="wcall"><b>Fresh from the field</b><p>In August 2026 Corsetti posted that Turkish authorities had finally confirmed that tree roots had damaged the ruins, and that he held internal ministry documents on the matter. Those documents had not been published when this case was written. The same month, geophysical survey reported by Karul&#x27;s team detected large buildings near the enclosures whose layouts suggest dwellings, a reminder of how much of the site is still unknown.</p></aside></section><section class="wsec" id="gobekli-excavation-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What time has hidden</h3><p>Whatever the pace of digging, some of Göbekli Tepe&#x27;s story is already lost. For generations the mound was farmland: its top was ploughed, and stones were cleared into heaps and walls, which is how broken pillar pieces first came to the attention of surveyors in the 1960s. The upper layers are disturbed, and the latest phases of use are the hardest to read. The builders&#x27; timber, hides and cordage have mostly rotted away, and the settlements where they lived are only now being mapped. Even a site dug at record speed would never return the full picture; one dug carefully returns more of what survives.</p></section><section class="wsec" id="gobekli-excavation-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle it</h3><p>The question of motive is hard to test, but the questions around it are not. Publishing the site&#x27;s management and excavation plans, with the area dug each season, would show whether the pace is a plan or a drift. Releasing the ministry&#x27;s tree and root assessments, and the documents Corsetti says he holds, would settle what the roots actually did. An independent condition survey of the ground where the trees stood and where the 2018 construction happened would show whether anything was harmed.</p><p>And the best answer of all would be a spade. When one of the buried enclosures detected by geophysics is opened and published, the idea that the site is being kept in the dark will lose most of its force. Until then, the fair verdict is split: Corsetti&#x27;s criticisms of how the site was managed had real substance, while the claim that anyone is hiding what lies underground has no evidence behind it.</p><blockquote class="wpull"><p>A critic can be right about the trees and wrong about the conspiracy.</p></blockquote></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">9,600 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">First monumental enclosures built</span></li><li class="wtl-study" style="--i:1"><span class="wtl-y">1995 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Excavation begins under Klaus Schmidt</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">2014 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Schmidt dies; DAI work continues</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">2016 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Doğuş sponsorship launched at Davos</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">2018 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Construction row; UNESCO listing</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">2021 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Taş Tepeler project launched</span></li><li class="wtl-event" style="--i:6"><span class="wtl-y">2024 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Corsetti on JRE #2231</span></li><li class="wtl-event" style="--i:7"><span class="wtl-y">2025 CE</span><span class="wtl-k">Event</span><span class="wtl-t">About 800 olive trees moved</span></li><li class="wtl-event" style="--i:8"><span class="wtl-y">2026 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Corsetti claims root damage confirmed</span></li></ol><details class="srcs"><summary>Sources for this case (12)</summary><ol><li>Schmidt, K. (2012). Göbekli Tepe: A Stone Age Sanctuary in South-Eastern Anatolia. ex oriente, Berlin.</li><li>Clare, L. (2020). Göbekli Tepe, Turkey. A brief summary of research at a new World Heritage Site (2015–2019). e-Forschungsberichte des DAI 2020(2): 1–13. <a href="https://doi.org/10.34780/efb.v0i2.1012" target="_blank" rel="noopener">doi:10.34780/efb.v0i2.1012</a></li><li>Karul, N. (2021). Buried buildings at Pre-Pottery Neolithic Karahantepe. Türk Arkeoloji ve Etnografya Dergisi 82: 21–31.</li><li>Rosman, R. (9 August 2025). An ancient archaeological site meets conspiracy theories, and Joe Rogan. NPR (published via OPB).</li><li>Doğuş Group (2018). Doğuş Group&#x27;s 20-year partnership in support of Göbeklitepe, the world&#x27;s oldest ritual complex. dogusgrubu.com.tr.</li><li>Hürriyet Daily News (21 March 2018). Construction around site of Göbeklitepe stirs debate.</li><li>Bianet (20 March 2018). Concrete poured on world&#x27;s oldest temple Göbeklitepe.</li><li>Hürriyet Daily News (15 February 2025). Göbeklitepe moves olive trees to safeguard ancient artifacts.</li><li>Türkiye Today (14 February 2025). Göbeklitepe controversy leads to removal of trees: here is why.</li><li>Colavito, J. (28 August 2025). Getting to the bottom of Jimmy Corsetti&#x27;s Göbekli Tepe olive tree conspiracy. jasoncolavito.com.</li><li>The Joe Rogan Experience #2231, Jimmy Corsetti and Dan Richards (20 November 2024).</li><li>Archaeology Magazine (20 August 2026). Dwellings detected near monuments at Göbekli Tepe (news report).</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-gobekli-excavation" data-t="Göbekli Tepe: Why Is So Little of It Dug?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Göbekli Tepe: Why Is So Little of It Dug?</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-gobekli-excavation</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-temple-mount-access-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Jerusalem-2013(2)-Aerial-Temple Mount-(south exposure).jpg" data-cap="The Temple Mount / Haram al-Sharif, Jerusalem, from the south" data-big><figcaption></figcaption></figure><div class="sh-k">Who Controls the Evidence</div><h2 class="sh-t" id="case-temple-mount-access-st" tabindex="-1">The Temple Mount: The Hill No One May Dig</h2><p class="sh-s">The most contested acre of archaeology on Earth has never been systematically excavated. What it hides is only glimpsed in rubble and trenches.</p><div class="sh-v"><span class="vstamp vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><p class="sh-claim"><b>What the stamp rates:</b> Archaeology on the Temple Mount is restricted for political and religious reasons, at a cost to knowledge.</p></div><p class="v4-q">What has keeping archaeologists off the Temple Mount cost our knowledge of the past?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>The platform sacred to three faiths has never been systematically excavated.</li><li>The Islamic Waqf forbids digging as desecration; Israel keeps the status quo for political and security reasons.</li><li>In 1999 about 9,000 tonnes of soil were removed without archaeological supervision, and its layers were lost.</li><li>Sifting that dumped soil has since recovered thousands of finds without their context.</li><li>The restriction and its cost are on record; this rating concerns facts, not faith or sovereignty.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Institutions</span><span class="thr">Archaeology</span><span class="thr">Religion and myth</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="9000" >9,000</b><span class="ctr-u"> tonnes</span></div><div class="ctr-l">of soil removed by machine in 1999</div><div class="ctr-c">Barkay and Dvira 2016</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="350" >350</b><span class="ctr-u"> truckloads</span></div><div class="ctr-l">dumped in the Kidron Valley</div><div class="ctr-c">Barkay and Dvira 2016</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="70" >70</b><span class="ctr-u"> %</span></div><div class="ctr-l">of the dumped soil sifted by 2017</div><div class="ctr-c">Temple Mount Sifting Project</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="488" >488</b><span class="ctr-u"> m</span></div><div class="ctr-l">length of the platform&#x27;s western wall</div><div class="ctr-c">commonly cited dimensions; Ritmeyer 2006</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Archaeology on the Temple Mount is restricted for political and religious reasons, at a cost to knowledge.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:91.7%" role="img" aria-label="Weight of evidence: Established"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Every part of this claim is documented, and it is accepted by the parties themselves. The Waqf forbids excavation on religious grounds; Israel keeps the status quo for political and security reasons; Jordanian custodianship and competing legal claims leave no one clearly responsible for antiquities. The cost is also on record: the 1999 removal of about 9,000 tonnes of soil without archaeological supervision destroyed its layers. This rating concerns only the documentable facts, not faith or sovereignty.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Guidebooks state with confidence where the Temples stood and what lies below, and for the Herodian platform itself the evidence is strong. But no excavation has ever been allowed inside, the exact position of the Temples on the platform is debated, and no structural remains of the First Temple have been identified. The textbooks are right that this is the Temple site; they are too confident about the details.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>The platform, called the Temple Mount in Jewish and Christian usage and al-Haram al-Sharif in Muslim usage, is sacred to Judaism as the site of the First and Second Temples and to Islam as the setting of al-Aqsa Mosque and the Dome of the Rock; it is also central to Christian history.<small>Emek Shaveh 2017</small></li><li>Under the status quo agreed after June 1967, the Islamic Waqf administers the compound under Jordanian custodianship, confirmed in the 1994 Israel–Jordan peace treaty, while Israel controls security; non-Muslim prayer there is barred.<small>Emek Shaveh 2017</small></li><li>The platform has never been systematically excavated. The Waqf has long forbidden archaeological excavation, which it regards as desecration, and Israeli governments have not sought to change that.<small>Hammer 2011; Emek Shaveh 2017</small></li><li>In November 1999 the Waqf dug an entrance to the underground Marwani prayer hall (Solomon&#x27;s Stables) with heavy machinery, without an archaeological salvage dig: about 9,000 tonnes of soil were removed and some 350 truckloads dumped in the Kidron Valley.<small>Barkay and Dvira 2016</small></li><li>Since 2004 the Temple Mount Sifting Project has wet-sifted that soil, recovering finds from many periods, including seal impressions of the First Temple period, coins and floor tiles.<small>Barkay and Dvira 2016</small></li><li>In a 2007 Waqf trench for electric cables, overseen by the Israel Antiquities Authority, archaeologists recorded pottery, bones and olive pits dated to the 8th–6th centuries BCE, presented in 2016.<small>Baruch, Reich and Sandhaus 2016</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the 1999 works destroyed significant remains, as Israeli archaeologists argue, or removed only fill of little value, as the Waqf&#x27;s archaeologists have said.</li><li>How much the Sifting Project&#x27;s finds mean without their original layers, and whether all the soil came from the Mount.</li><li>Where on the platform the Temples stood, and whether any structural remains of the First Temple survive beneath it.</li><li>Who has legal authority over antiquities on the compound: the Waqf, Jordan or the Israel Antiquities Authority.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>The stratigraphy (the sequence of layers) of the soil removed in 1999, destroyed in a few days of machine digging.</li><li>Anything below the paved surface of most of the platform, which has never been excavated.</li><li>Records of Montagu Parker&#x27;s secret 1911 digging on the Mount, which ended in riots and his flight from the country.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Archaeologists of every background agree that the Mount is the least excavated major site in Jerusalem and that this has a cost. Israeli scholars such as Gabriel Barkay describe the 1999 works as a disaster for knowledge. The Waqf&#x27;s chief archaeologist, Yusuf Natsheh, told Smithsonian that every stone is a Muslim development, that if anything was destroyed it was Muslim heritage, and that sifted finds out of their layers are of little value. Emek Shaveh, an Israeli heritage group, argues that all sides use archaeology here for political ends and calls for conservation by international standards.</p><ul><li>What is known of the platform&#x27;s history comes mainly from texts, architecture and work along its outer walls.</li><li>Rescue observations, as in 2007, show that ancient layers survive under the surface.</li><li>The political deadlock means works on the compound are rarely supervised to ordinary archaeological standards.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>The sharpest critics come from two directions. Barkay, Dvira and the Israeli Committee for the Prevention of Destruction of Antiquities argue that the 1999 works wrecked unique evidence and that the Israeli state failed to stop them; the committee has alleged the aim was to erase traces of the Temples. The Waqf and many Palestinian scholars argue the reverse: that Israeli archaeology around the compound serves a political claim, that digging on a living mosque is desecration, and that the sifting project mixes science with national agendas.</p><ul><li>About 9,000 tonnes of soil from the most sacred hill in Jerusalem were removed without an archaeologist present.</li><li>Israel&#x27;s antiquities authority, which excavates everywhere else in the city, did not stop the work.</li><li>Palestinian scholars point out that excavations beside the compound have often served Israeli political aims.</li></ul><div class="face-s"><b>Its strongest point</b><p>On one point both sides agree: no one has been able to study this site by ordinary scientific standards, and in 1999 irreplaceable layers were lost in days. The cost to knowledge is on the record.</p></div><p class="face-cr"><b>Credit</b> Gabriel Barkay and Zachi Dvira (Temple Mount Sifting Project); the Committee for the Prevention of Destruction of Antiquities on the Temple Mount; on the other side, the Islamic Waqf and Palestinian scholars</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>An agreed, internationally supervised conservation and recording protocol for any works on the compound.</li><li>Full final publication of the Sifting Project&#x27;s finds and of the 2007 trench.</li><li>Non-invasive survey (ground-penetrating radar, muon imaging) of the platform, published openly, if all parties consent.</li><li>Publication of the Waqf&#x27;s own records of the 1996–1999 works.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,141 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Temple Mount: The Hill No One May Dig"><button type="button" class="wtoc-i" data-go="temple-mount-access-s1">The most sacred ground, and the least known</button><button type="button" class="wtoc-i" data-go="temple-mount-access-s2">Why no one digs</button><button type="button" class="wtoc-i" data-go="temple-mount-access-s3">The rubble of 1999</button><button type="button" class="wtoc-i" data-go="temple-mount-access-s4">Archaeology from the dump</button><button type="button" class="wtoc-i" data-go="temple-mount-access-s5">A glimpse in a trench</button><button type="button" class="wtoc-i" data-go="temple-mount-access-s6">Why it matters, and what could change it</button></nav></div><section class="wsec" id="temple-mount-access-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The most sacred ground, and the least known</h3><p>In the south-east corner of Jerusalem&#x27;s Old City stands a vast stone platform, some 14 hectares of paving, trees and domes. To Jews it is the Temple Mount, where the First and Second Temples stood. To Muslims it is al-Haram al-Sharif, the Noble Sanctuary, home of al-Aqsa Mosque and the Dome of the Rock. To Christians it is where much of the Gospel story of the Temple unfolds. Few places matter more to more people.</p><p>It is also, for an archaeologist, a blank. Jerusalem is one of the most excavated cities on Earth, yet the heart of it has never been systematically dug. What lies beneath the platform, three thousand years of layers perhaps, is known only from texts, from work along the outer walls, and from a few accidents. This case sets out why, fairly, and what it has cost.</p><blockquote class="wpull"><p>Jerusalem is dug almost everywhere. Its centre is dug almost nowhere.</p></blockquote></section><section class="wsec" id="temple-mount-access-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Why no one digs</h3><p>The reasons are religious and political, and every party states them openly. For the Islamic Waqf, which has administered the compound for centuries, it is a living mosque; its officials have long regarded excavation there as desecration. Its chief archaeologist, Yusuf Natsheh, told Smithsonian in 2011 that every stone is a Muslim development. For many Jewish religious authorities, entering the area at all raises questions of ritual purity, and digging there is unthinkable without a rebuilt Temple. For the Israeli state, which took East Jerusalem in June 1967, the priority has been to avoid an explosion.</p><p>Soon after the war, Israel agreed that the Waqf would continue to run the compound, under Jordanian custodianship, while Israel kept security control; the 1994 peace treaty with Jordan recognised Jordan&#x27;s special role. Non-Muslim prayer is barred. The result, as the heritage group Emek Shaveh puts it, is a vacuum: Jordanian law does not let Jordan&#x27;s antiquities department oversee the Waqf&#x27;s works, and Israel asserts authority it rarely uses.</p><p>History explains the caution. In 1911 a British adventurer, Montagu Parker, bribed his way into digging secretly inside the Haram in search of Temple treasure; when it was discovered, riots followed and he fled. In 1996 the opening of an exit to the Western Wall tunnel, beside the compound, set off deadly clashes. On this hill, a spade is a political act.</p><aside class="wcall"><b>The positions, in their own terms</b><p>The Waqf and Palestinian religious authorities: the whole compound is al-Aqsa Mosque, a place of worship rather than an archaeological site, and digging beneath it threatens both its sanctity and its foundations. Israeli archaeologists and the Israel Antiquities Authority: the hill holds unique evidence of every period, including the Temples, which the law should protect like any other antiquities. Many Jewish religious authorities: the sanctity of the place calls for restraint, and some forbid entering it at all. Each position is sincerely held, and this case does not judge between them.</p></aside></section><section class="wsec" id="temple-mount-access-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The rubble of 1999</h3><p>The underground vaults in the south-east corner, known as Solomon&#x27;s Stables, were converted by the Waqf in 1996 into the Marwani prayer hall. In November 1999, to build an emergency entrance, the Waqf dug a pit more than 40 m long and nearly 12 m deep with heavy machinery, with no archaeological salvage excavation. About 9,000 tonnes of soil went out in some 350 truckloads and were dumped in the Kidron Valley.</p><figure class="wx wx--static" id="temple-mount-access-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">The platform and the 1999 pit</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The platform and the 1999 pit"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" class="wx-svg" role="img" aria-labelledby="temple-mount-access-f1-t"><title id="temple-mount-access-f1-t">Simplified plan of the Temple Mount / Haram al-Sharif showing the Dome of the Rock, al-Aqsa Mosque, the Marwani prayer hall, the 1999 pit, the 2007 trench and the soil dumped in the Kidron Valley</title><text x="24" y="28" class="wx-t-cap">Temple Mount / Haram al-Sharif, plan</text><defs><marker id="temple-mount-access-f1-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="wx-accfill"/></marker></defs><polygon points="150.0,70.0 376.8,70.0 358.8,408.4 150.0,421.4" class="wx-stone wx-edge"/><rect x="218.4" y="167.2" width="93.6" height="97.19" class="wx-stone2 wx-o60"/><polygon points="282.5,221.2 272.4,231.3 258.0,231.3 247.9,221.2 247.9,206.8 258.0,196.7 272.4,196.7 282.5,206.8" class="wx-bronze wx-edge"/><circle cx="265.2" cy="214.0" r="10.3" class="wx-glow wx-edge-soft"/><text x="265.2" y="250.72" text-anchor="middle" class="wx-t-b wx-halo">Dome of the Rock</text><rect x="231.4" y="354.4" width="39.6" height="54.0" class="wx-stone3 wx-edge"/><text x="225.4" y="374.4" text-anchor="end" class="wx-t-b wx-halo">al-Aqsa</text><text x="225.4" y="388.4" text-anchor="end" class="wx-t-s wx-halo">Mosque</text><rect x="294.0" y="352.2" width="59.0" height="45.30" class="wx-dash"/><text x="323.5" y="374.2" text-anchor="middle" class="wx-t-s wx-halo">Marwani hall</text><text x="323.5" y="388.2" text-anchor="middle" class="wx-t-s wx-halo">(Solomon's Stables,</text><text x="323.5" y="400.2" text-anchor="middle" class="wx-t-s wx-halo">underground)</text><rect x="304.8" y="333.5" width="28.8" height="10" class="wx-c4 wx-pulse"/><polyline points="258.0,113.2 319.2,178.0 330.0,257.2 322.8,307.6" class="wx-hl wx-dash wx-draw" pathLength="1" style="--d:3"/><text x="252.0" y="115.2" text-anchor="end" class="wx-t-s wx-halo">2007 cable trench</text><text x="252.0" y="128.2" text-anchor="end" class="wx-t-s wx-halo">(route schematic)</text><path d="M470,60 C455,160 480,260 462,460" class="wx-line wx-s2 wx-o60"/><text x="478" y="440" class="wx-t-s">Kidron Valley</text><path d="M334.8,333.5 C400,300 420,200 458,150" class="wx-hl wx-flow" marker-end="url(#temple-mount-access-f1-ar)"/><circle cx="462" cy="146" r="9" class="wx-soil wx-edge"/><text x="490" y="120" class="wx-t-b">1999 soil dumped</text><text x="490" y="136" class="wx-t-s">c. 9,000 tonnes,</text><text x="490" y="150" class="wx-t-s">c. 350 truckloads</text><path d="M500,165 L560,215" class="wx-thin"/><text x="530" y="236" class="wx-t-b">2004 onward: sifted</text><text x="530" y="252" class="wx-t-s">at Emek Tzurim, then</text><text x="530" y="266" class="wx-t-s">Mount Scopus (from 2019)</text><text x="340.8" y="335.5" class="wx-t-b wx-t-a wx-halo">1999 pit</text><text x="340.8" y="349.5" class="wx-t-s wx-halo">&gt;40 m long, c. 12 m deep</text><text x="140" y="240" text-anchor="end" class="wx-t-s">west wall</text><text x="140" y="254" text-anchor="end" class="wx-t-n">c. 488 m</text><text x="263" y="60" text-anchor="middle" class="wx-t-s">north wall c. 315 m</text><text x="255" y="446" text-anchor="middle" class="wx-t-s">south wall c. 281 m</text><text x="382" y="160" class="wx-t-s">east wall</text><text x="382" y="174" class="wx-t-n">c. 470 m</text><path d="M60,120 L60,80" class="wx-bold"/><path d="M53,90 L60,78 L67,90" class="wx-line"/><text x="60" y="138" text-anchor="middle" class="wx-t-b">N</text><line x1="40" y1="460" x2="112.0" y2="460" class="wx-bold"/><text x="40" y="450" class="wx-t-s">0</text><text x="112.0" y="450" text-anchor="end" class="wx-t-s">100 m</text><text x="126.0" y="465" class="wx-t-s">outline simplified; pit, trench and dump positions schematic</text></svg></div></div><figcaption>Plan of the Temple Mount / Haram al-Sharif, with the 1999 excavation, the 2007 trench and where the soil went. <span class="wx-src">Based on: Wall lengths after Ritmeyer 2006; 1999 pit and soil volume after Barkay and Dvira 2016 and Hammer 2011; 2007 trench after Baruch, Reich and Sandhaus 2016. Outline simplified; positions of the pit, trench and dump schematic.</span></figcaption><p class="vh">A simplified plan of the trapezoid platform, north at the top, with walls of about 488 m on the west, 470 m on the east, 281 m on the south and 315 m on the north. The Dome of the Rock stands on a raised area west of centre; al-Aqsa Mosque lies on the south side; the underground Marwani prayer hall, Solomon&#x27;s Stables, is shown dashed in the south-east corner, with the 1999 pit, more than 40 m long, beside it. A dashed line marks the 2007 cable trench. An arrow runs east over the wall to the Kidron Valley, labelled about 9,000 tonnes of soil in some 350 truckloads, with a pointer to the sifting sites on Mount Scopus. A 100 m scale bar is shown.</p></figure><p>Israeli archaeologists called it a catastrophe for knowledge, and an Israeli committee for the prevention of destruction of antiquities alleged the aim was to erase evidence of the Temples. The Waqf&#x27;s archaeologists replied that the soil was examined and that nothing of special interest was found. In 2002 a bulge appeared in the southern wall that required major repairs. What is not disputed is that the layers of that soil, the sequence that would have dated everything in it, no longer exist.</p></section><section class="wsec" id="temple-mount-access-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Archaeology from the dump</h3><p>In 2004 the archaeologists Gabriel Barkay and Zachi Dvira of Bar-Ilan University began carting the dumped soil to Emek Tzurim, on the slope of Mount Scopus, and washing it through sieves. Over the years hundreds of thousands of volunteers took part. By 2017 about 70 percent of the soil had been sifted; after a pause for funding, the work resumed in 2019.</p><figure class="wx wx--steps" id="temple-mount-access-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">From layers to rubble to sieve</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="From layers to rubble to sieve"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" class="wx-svg" role="img" aria-labelledby="temple-mount-access-f2-t"><title id="temple-mount-access-f2-t">How machine digging turns ordered archaeological layers into mixed rubble, and what sifting can recover, in five steps</title><text x="24" y="28" class="wx-t-cap">From layers to rubble to sieve</text><rect x="40" y="60" width="110" height="38" class="wx-sand wx-edge-soft"/><text x="158" y="83" class="wx-t-s">Ottoman</text><circle cx="60" cy="79" r="4" class="wx-c1"/><rect x="40" y="98" width="110" height="38" class="wx-stone wx-edge-soft"/><text x="158" y="121" class="wx-t-s">Crusader</text><circle cx="77" cy="117" r="4" class="wx-c2"/><rect x="40" y="136" width="110" height="38" class="wx-soil wx-edge-soft"/><text x="158" y="159" class="wx-t-s">Early Islamic</text><circle cx="94" cy="155" r="4" class="wx-c3"/><rect x="40" y="174" width="110" height="38" class="wx-stone2 wx-edge-soft"/><text x="158" y="197" class="wx-t-s">Byzantine</text><circle cx="111" cy="193" r="4" class="wx-c4"/><rect x="40" y="212" width="110" height="38" class="wx-rock wx-edge-soft"/><text x="158" y="235" class="wx-t-s">Roman</text><circle cx="128" cy="231" r="4" class="wx-c5"/><rect x="40" y="250" width="110" height="38" class="wx-stone3 wx-edge-soft"/><text x="158" y="273" class="wx-t-s">Iron Age</text><circle cx="75" cy="269" r="4" class="wx-c6"/><text x="40" y="310" class="wx-t-s">oldest at the bottom</text><g class="wx-st wx-hide" data-s="2"><rect x="70" y="60" width="80" height="190" class="wx-paper wx-dash"/><text x="110" y="160" text-anchor="middle" class="wx-t-s">dug out</text></g><g class="wx-st wx-hide" data-only="1"><text x="40" y="332" class="wx-t wx-t-a">Each layer dates what it holds.</text></g><g class="wx-st" data-s="2"><path d="M250,288 Q300,180 350,288 Z" class="wx-soil wx-edge-soft"/><circle cx="270" cy="250" r="4" class="wx-c1"/><circle cx="293" cy="263" r="4" class="wx-c2"/><circle cx="316" cy="276" r="4" class="wx-c3"/><circle cx="277" cy="259" r="4" class="wx-c4"/><circle cx="300" cy="272" r="4" class="wx-c5"/><circle cx="323" cy="255" r="4" class="wx-c6"/><circle cx="284" cy="268" r="4" class="wx-c1"/><circle cx="307" cy="251" r="4" class="wx-c2"/><circle cx="330" cy="264" r="4" class="wx-c3"/><text x="300" y="310" text-anchor="middle" class="wx-t-b">mixed heap</text></g><g class="wx-st wx-hide" data-only="2"><path d="M210,160 L240,230" class="wx-hl wx-flow"/><text x="300" y="160" text-anchor="middle" class="wx-t wx-t-a">1999: machine digging</text></g><g class="wx-st" data-s="3"><rect x="440" y="250" width="70" height="34" rx="3" class="wx-metal wx-edge"/><rect x="510" y="260" width="26" height="24" rx="3" class="wx-stone3 wx-edge"/><circle cx="456" cy="288" r="7" class="wx-inkfill"/><circle cx="520" cy="288" r="7" class="wx-inkfill"/><text x="488" y="240" text-anchor="middle" class="wx-t-s">c. 350 loads to the Kidron</text></g><g class="wx-st wx-hide" data-only="3"><path d="M360,265 L432,265" class="wx-hl wx-flow"/></g><g class="wx-st" data-s="4"><path d="M550,120 L650,120 L630,170 L570,170 Z" class="wx-wood wx-edge"/><line x1="560" y1="135" x2="640" y2="135" class="wx-thin"/><line x1="564" y1="150" x2="636" y2="150" class="wx-thin"/><path d="M580,80 q20,20 0,35 M610,78 q20,20 0,36" class="wx-line wx-s2 wx-flow"/><text x="600" y="190" text-anchor="middle" class="wx-t-b">wet sifting</text><text x="600" y="205" text-anchor="middle" class="wx-t-s">from 2004, by volunteers</text></g><g class="wx-st wx-hide" data-only="4"><path d="M540,250 C580,240 600,230 600,210" class="wx-hl wx-flow"/></g><g class="wx-st wx-hide" data-s="5"><rect x="250" y="322" width="90" height="30" rx="4" class="wx-card wx-edge"/><circle cx="268" cy="337" r="4" class="wx-c1"/><circle cx="286" cy="337" r="4" class="wx-c1"/><circle cx="304" cy="337" r="4" class="wx-c1"/><circle cx="322" cy="337" r="4" class="wx-c1"/><text x="295" y="366" text-anchor="middle" class="wx-t-s">seals</text></g><g class="wx-st wx-hide" data-s="5"><rect x="360" y="322" width="90" height="30" rx="4" class="wx-card wx-edge"/><circle cx="378" cy="337" r="4" class="wx-c6"/><circle cx="396" cy="337" r="4" class="wx-c6"/><circle cx="414" cy="337" r="4" class="wx-c6"/><circle cx="432" cy="337" r="4" class="wx-c6"/><text x="405" y="366" text-anchor="middle" class="wx-t-s">coins</text></g><g class="wx-st wx-hide" data-s="5"><rect x="470" y="322" width="90" height="30" rx="4" class="wx-card wx-edge"/><circle cx="488" cy="337" r="4" class="wx-c2"/><circle cx="506" cy="337" r="4" class="wx-c2"/><circle cx="524" cy="337" r="4" class="wx-c2"/><circle cx="542" cy="337" r="4" class="wx-c2"/><text x="515" y="366" text-anchor="middle" class="wx-t-s">tiles</text></g><g class="wx-st wx-hide" data-only="5"><text x="580" y="334" class="wx-t-b wx-t-a">layer: lost</text><line x1="580" y1="330" x2="660" y2="330" class="wx-line wx-s4"/><text x="580" y="352" class="wx-t-s">dated by style only</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> In the ground: layers lie in order, oldest at the bottom, each dating what it holds.</p><ol class="wx-steplist"><li>In the ground: layers lie in order, oldest at the bottom, each dating what it holds.</li><li>November 1999: a machine digs the pit and the layers are mixed into one heap.</li><li>About 350 truckloads are dumped in the Kidron Valley.</li><li>From 2004: the soil is wet-sifted by volunteers at Emek Tzurim.</li><li>Finds are dated by their own style, not by their layer: much is saved, the context is lost.</li></ol><figcaption>What happens to archaeological evidence when soil is removed by machine instead of excavated, and what sifting can and cannot recover. <span class="wx-src">Based on: Barkay and Dvira 2016; Hammer 2011. Layer sequence illustrative, not a recorded section.</span></figcaption><p class="vh">Step 1 shows a column of soil in ordered layers labelled Ottoman, Crusader, Early Islamic, Byzantine, Roman and Iron Age, each holding objects. Step 2: a machine scoops it out and the layers become a single mixed heap. Step 3: trucks dump the heap in the Kidron Valley in 1999. Step 4: from 2004 the soil is washed through sieves by volunteers. Step 5: the finds are sorted into trays by period (seal impressions, coins, tiles), but a crossed-out line notes that their layer, and so their exact context, is lost.</p></figure><p>The finds span the site&#x27;s whole history: Egyptian scarabs of the second millennium BCE, figurines and seal impressions of the First Temple period, including one read as naming a member of the priestly Immer family, coins from every era, fragments of colourful stone floor tiles of the Herodian style, Byzantine crosses and Crusader arrowheads. They are a real window into the Mount&#x27;s past.</p><p>They are also, as critics on all sides stress, finds without a home. Out of their layers they cannot be tied to a building or a floor. The Waqf&#x27;s archaeologist dismissed them for that reason; the Israeli archaeologists Dan Bahat and Meir Ben-Dov questioned whether all the soil came from the Mount; Emek Shaveh called the project a mix of heritage concern and national agenda. The sifting salvaged what could be saved from a loss. It could not undo it.</p></section><section class="wsec" id="temple-mount-access-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>A glimpse in a trench</h3><p>The clearest evidence came by accident. In 2007 the Waqf dug a trench across the platform to lay electric cables. The Israel Antiquities Authority&#x27;s Jerusalem archaeologist, Yuval Baruch, oversaw the work, itself criticised as too hasty for proper recording. East of the Dome of the Rock, the trench cut an undisturbed layer containing pottery, animal bones and charred olive pits. Radiocarbon dates and the pottery placed them in the 8th to 6th centuries BCE, the First Temple period. Baruch, Ronny Reich and Deborah Sandhaus presented the finds in 2016, nine years later.</p><aside class="wcall"><b>How do we know anything is down there?</b><p>Because every time the surface is broken, ancient material appears: the 1999 soil, the 2007 trench, and the cisterns and passages mapped by Charles Warren of the Palestine Exploration Fund in the 1860s. The Herodian walls around the platform, with their giant stones, stand in plain view. What is missing is not evidence that layers survive, but permission to read them in order.</p></aside></section><section class="wsec" id="temple-mount-access-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Why it matters, and what could change it</h3><p>This is the rare gatekeeping case with no villain in the usual sense. The restriction is open, its reasons are stated, and they are serious: faith, sovereignty and the risk of bloodshed. This case takes no side on any of them. But the cost is real and documented, and it falls on everyone who wants to know the history of this hill, whatever they believe about it.</p><p>It also explains a good deal of distrust. When each side suspects the other of using archaeology to establish a claim or erase one, every find becomes a weapon. Change would not need excavation: an agreed protocol for recording any works on the compound, the full publication of the sifted finds and the 2007 trench, and perhaps one day a non-invasive scan made with the consent of all parties, would already add a great deal.</p><blockquote class="wpull"><p>Nobody has to dig the Temple Mount. But everybody loses when it is dug badly.</p></blockquote></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">20 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Herod begins rebuilding the Temple and enlarging the platform</span></li><li class="wtl-loss" style="--i:1"><span class="wtl-y">70 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Romans destroy the Second Temple</span></li><li class="wtl-build" style="--i:2"><span class="wtl-y">691 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Dome of the Rock completed</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">1867 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Charles Warren surveys the walls and cisterns</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">1911 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Parker&#x27;s secret dig sparks riots</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">1967 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Status quo: Waqf administers, Israel controls security</span></li><li class="wtl-loss" style="--i:6"><span class="wtl-y">1999 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Marwani entrance dug by machine; soil dumped</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2004 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Temple Mount Sifting Project begins</span></li><li class="wtl-find" style="--i:8"><span class="wtl-y">2007 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Cable trench exposes First Temple period layer</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">2019 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Sifting resumes at Mount Scopus</span></li></ol><details class="srcs"><summary>Sources for this case (10)</summary><ol><li>Barkay, G., Dvira, Z. (2016). Relics in the rubble: the Temple Mount Sifting Project. Biblical Archaeology Review 42(6).</li><li>Hammer, J. (April 2011). What is beneath the Temple Mount? Smithsonian Magazine.</li><li>Emek Shaveh (2017). The Temple Mount/Haram al-Sharif: Archaeology in a Political Context. Jerusalem.</li><li>Baruch, Y., Reich, R., Sandhaus, D. (2016). Findings from the 2007 trench on the Temple Mount, presented at a Hebrew University conference, October 2016; reported in The Times of Israel, 27 October 2016.</li><li>Seligman, J. (undated; online 2020). Solomon&#x27;s Stables, the Temple Mount, Jerusalem: the events concerning the destruction of antiquities 1999–2001. Israel Antiquities Authority.</li><li>Ritmeyer, L. (2006). The Quest: Revealing the Temple Mount in Jerusalem. Carta, Jerusalem.</li><li>Warren, C. (1876). Underground Jerusalem. Richard Bentley, London.</li><li>Treaty of Peace between the State of Israel and the Hashemite Kingdom of Jordan (26 October 1994), Article 9.</li><li>Temple Mount Sifting Project (tmsifting.org). Project reports and history, 2004–2025.</li><li>Silberman, N. A. (1982). Digging for God and Country: Exploration, Archeology, and the Secret Struggle for the Holy Land, 1799–1917. Knopf, New York.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-temple-mount-access" data-t="The Temple Mount: The Hill No One May Dig"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Temple Mount: The Hill No One May Dig</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-temple-mount-access</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-unpublished-finds-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="P. Oxy. 654.jpg" data-cap="Papyrus Oxyrhynchus 654: one of hundreds of thousands of fragments from a single dig, most still unpublished" data-big><figcaption></figcaption></figure><div class="sh-k">Who Controls the Evidence</div><h2 class="sh-t" id="case-unpublished-finds-st" tabindex="-1">The Unpublished Past: Finds That Never Left the Storeroom</h2><p class="sh-s">Much of what archaeologists dig up is never fully published. The reason is duller than the rumours, and in some ways more troubling.</p><div class="sh-v"><span class="vstamp vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><p class="sh-claim"><b>What the stamp rates:</b> A large share of excavated archaeological evidence has never been published.</p></div><p class="v4-q">How much excavated evidence has never been published, and why?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>A large share of everything ever excavated has never been published.</li><li>Israel&#x27;s antiquities authority says many of its 10,000 rescue digs were never written up.</li><li>Of about half a million papyrus fragments dug at Oxyrhynchus, some 5,500 texts had been published by 2019.</li><li>The cause is money, time and incentives: digging is funded, writing up is not.</li><li>The backlog is strong evidence; the idea that finds are hidden because they contradict history has no documented support.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Institutions</span><span class="thr">Archaeology</span><span class="thr">Texts and scripts</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="10000" >10,000</b><span class="ctr-u"> digs</span></div><div class="ctr-l">salvage and rescue excavations in Israel since 1948, many never properly published</div><div class="ctr-c">Israel Antiquities Authority, Favissa</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="500000" >500,000</b><span class="ctr-u"> fragments</span></div><div class="ctr-l">estimated papyrus fragments from Oxyrhynchus</div><div class="ctr-c">Parsons, in Press 2020</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="5476" >5,476</b><span class="ctr-u"> texts</span></div><div class="ctr-l">published from Oxyrhynchus in 84 volumes by 2019</div><div class="ctr-c">Press 2020</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="333" >333</b><span class="ctr-u"> digs</span></div><div class="ctr-l">excavations in Israel in 1998, up from 153 in 1989</div><div class="ctr-c">Kletter and De-Groot 2001</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>A large share of excavated archaeological evidence has never been published.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Several independent lines agree: an official statement by Israel&#x27;s antiquities authority, a published survey of Israeli fieldwork, the papyri of Oxyrhynchus, excavations like Kenyon&#x27;s in Jerusalem, and the literature on the curation crisis. It falls short of &#x27;established&#x27; only because no one has measured the share worldwide. The stronger claim, that finds are withheld because they contradict accepted history, has no documented support: the backlog is best explained by money, time and incentives.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks and museum labels present syntheses of the past with calm confidence and almost never mention that they rest on the published fraction of what was dug. The syntheses are usually reasonable, but they are overconfident about completeness. A sentence on how much remains unpublished, and where, would be more honest and would take the air out of rumours of hidden finds.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>The Israel Antiquities Authority states that more than 10,000 salvage and rescue excavations have been carried out in Israel since 1948 and that many were never properly published; its Favissa database was set up to put the files of past unpublished excavations online.<small>Israel Antiquities Authority, Favissa</small></li><li>A survey of fieldwork in Israel counted about 2,200 excavation projects in one decade, rising from 153 in 1989 to 333 in 1998, and found final publication lagging far behind; the authors proposed a pause on new licences to let publication catch up.<small>Kletter and De-Groot 2001</small></li><li>The papyri dug at Oxyrhynchus in Egypt between 1896 and 1907 are estimated by Peter Parsons at around half a million fragments; about 5,476 texts had been published in 84 volumes by 2019.<small>Press 2020</small></li><li>Kathleen Kenyon&#x27;s excavations in Jerusalem (1961–1967) were still being prepared for publication about fifty years after they ended.<small>Maeir 2022</small></li><li>Archaeologists have described a &#x27;curation crisis&#x27;: storerooms in many countries are full, underfunded and poorly catalogued.<small>Childs 2004; Kersel 2015</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>What share of excavations worldwide remain unpublished: no global count exists, and definitions of &#x27;published&#x27; vary from a short notice to a full final report.</li><li>Whether salvage digs that found little need full publication, or only an archived record.</li><li>Whether the backlog has biased the record, for example toward monumental sites and periods that attract funding.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Field notes, plans and photographs of excavators who died or retired before writing up, some now lost or unreadable.</li><li>Finds damaged or stolen in storerooms, including magazines in Egypt looted during the unrest of 2011.</li><li>Any global database of excavations and their publication status.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Archaeologists openly call the backlog one of the discipline&#x27;s worst failings. Aren Maeir of Bar-Ilan University ended a 2022 essay with a plea to publish before the finds perish. The causes they name are mundane: digging is funded and rewarded, while years of analysis and writing are not; salvage excavation driven by construction produces far more material than anyone can study; specialists are few; excavators die. The remedy now under way is open data: national databases, archives of field records and online publication.</p><ul><li>The backlog is documented mainly by archaeologists themselves, in journals and official statements.</li><li>The Israel Antiquities Authority launched a national database in 2025 with nearly 4 million records, including almost a million artefacts.</li><li>Unpublished is not the same as secret: most archives can be consulted by researchers on request.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Two very different critiques meet here. Hershel Shanks spent decades shaming archaeologists who dug and did not publish, arguing the public was being robbed of its own past. Michael Cremo and Richard Thompson went much further in Forbidden Archeology (1993), arguing that a &#x27;knowledge filter&#x27; keeps finds that contradict the accepted story of human origins out of the literature. Graham Hancock argues more generally that the record we build history from is partial, and that what lies unstudied in the ground and in storerooms could change it.</p><ul><li>If most of the evidence is unpublished, confident syntheses are built on a sample, not the whole.</li><li>Excavators control their material until they publish, sometimes for decades.</li><li>Anomalous finds are easier to ignore in a storeroom than in a journal.</li></ul><div class="face-s"><b>Its strongest point</b><p>The basic charge is documented by the discipline itself: huge quantities of excavated evidence have never been fully published, some of it for generations, and the history in our textbooks rests on the part that was.</p></div><p class="face-cr"><b>Credit</b> Hershel Shanks (Biblical Archaeology Review); Michael Cremo and Richard Thompson (Forbidden Archeology, 1993); Graham Hancock</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>A global register of excavation permits and their publication status, country by country.</li><li>Mandatory deposit of field records and finds lists in open archives within a fixed time of excavation.</li><li>Systematic audits of major storerooms, published with their catalogues.</li><li>Re-study of unpublished assemblages to test whether they differ from published ones.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,104 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Unpublished Past: Finds That Never Left the Storeroom"><button type="button" class="wtoc-i" data-go="unpublished-finds-s1">The other museum</button><button type="button" class="wtoc-i" data-go="unpublished-finds-s2">What the record shows</button><button type="button" class="wtoc-i" data-go="unpublished-finds-s3">Why it happens</button><button type="button" class="wtoc-i" data-go="unpublished-finds-s4">The suspicious reading</button><button type="button" class="wtoc-i" data-go="unpublished-finds-s5">What time is taking</button><button type="button" class="wtoc-i" data-go="unpublished-finds-s6">The open-data turn</button></nav></div><section class="wsec" id="unpublished-finds-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The other museum</h3><p>Behind every museum gallery is another museum that the public never sees: rows of shelves, crates of pottery, boxes of bones, drawers of coins, folders of plans and photographs. Some of it is catalogued and studied. A great deal of it is not, and never has been. The excavation happened, sometimes decades ago; the book that was supposed to follow did not.</p><p>This is the quietest form of gatekeeping on this site. No government forbids anything and no one is hiding a chamber. Yet the effect is similar. Evidence dug out of the ground, often at public expense, sits where no one can use it, and the history we are taught is built from the part that made it into print.</p><blockquote class="wpull"><p>An unpublished excavation is a site destroyed twice: once by the spade, once by silence.</p></blockquote></section><section class="wsec" id="unpublished-finds-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What the record shows</h3><p>The best evidence comes from archaeologists and institutions themselves. The Israel Antiquities Authority says plainly that more than 10,000 salvage and rescue excavations have been carried out in Israel since 1948 and that many were never properly published. It set up an online database, Favissa, to put the files of past unpublished digs online, noting that many of the original excavators have died or retired.</p><figure class="wx wx--static" id="unpublished-finds-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">The backlog in three numbers</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The backlog in three numbers"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" class="wx-svg" role="img" aria-labelledby="unpublished-finds-f1-t"><title id="unpublished-finds-f1-t">Three measures of the publication backlog: excavations in Israel per year in 1989 and 1998, Oxyrhynchus fragments against texts published, and over 10,000 salvage excavations in Israel since 1948</title><text x="24" y="28" class="wx-t-cap">The backlog in three numbers</text><text x="24" y="62" class="wx-t-b">Digs per year, Israel</text><line x1="30" y1="330" x2="200" y2="330" class="wx-line"/><rect x="50" y="222.9" width="50" height="107.1" class="wx-accfill wx-grow" style="--d:1"/><text x="75" y="214.9" text-anchor="middle" class="wx-t-n">153</text><text x="75" y="348" text-anchor="middle" class="wx-t-s">1989</text><rect x="130" y="96.9" width="50" height="233.1" class="wx-accfill wx-grow" style="--d:3"/><text x="155" y="88.9" text-anchor="middle" class="wx-t-n">333</text><text x="155" y="348" text-anchor="middle" class="wx-t-s">1998</text><text x="24"
