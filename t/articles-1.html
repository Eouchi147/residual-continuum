"17" height="17" class="wx-stone"/><rect x="290" y="210" width="17" height="17" class="wx-stone"/><rect x="310" y="210" width="17" height="17" class="wx-stone"/><rect x="330" y="210" width="17" height="17" class="wx-stone"/><rect x="350" y="210" width="17" height="17" class="wx-stone"/><rect x="370" y="210" width="17" height="17" class="wx-stone"/><rect x="390" y="210" width="17" height="17" class="wx-stone"/><rect x="410" y="210" width="17" height="17" class="wx-stone"/><rect x="430" y="210" width="17" height="17" class="wx-stone"/><rect x="250" y="230" width="17" height="17" class="wx-stone"/><rect x="270" y="230" width="17" height="17" class="wx-stone"/><rect x="290" y="230" width="17" height="17" class="wx-stone"/><rect x="310" y="230" width="17" height="17" class="wx-stone"/><rect x="330" y="230" width="17" height="17" class="wx-stone"/><rect x="350" y="230" width="17" height="17" class="wx-stone"/><rect x="370" y="230" width="17" height="17" class="wx-stone"/><rect x="390" y="230" width="17" height="17" class="wx-stone"/><rect x="410" y="230" width="17" height="17" class="wx-stone"/><rect x="430" y="230" width="17" height="17" class="wx-stone"/><rect x="250" y="250" width="17" height="17" class="wx-stone"/><rect x="270" y="250" width="17" height="17" class="wx-stone"/><rect x="290" y="250" width="17" height="17" class="wx-stone"/><rect x="310" y="250" width="17" height="17" class="wx-stone"/><rect x="330" y="250" width="17" height="17" class="wx-stone"/><rect x="350" y="250" width="17" height="17" class="wx-stone"/><rect x="370" y="250" width="17" height="17" class="wx-stone"/><rect x="390" y="250" width="17" height="17" class="wx-stone"/><rect x="410" y="250" width="17" height="17" class="wx-stone"/><rect x="430" y="250" width="17" height="17" class="wx-stone"/><rect x="250" y="270" width="17" height="17" class="wx-stone"/><rect x="270" y="270" width="17" height="17" class="wx-stone"/><rect x="290" y="270" width="17" height="17" class="wx-stone"/><rect x="310" y="270" width="17" height="17" class="wx-stone"/><rect x="330" y="270" width="17" height="17" class="wx-stone"/><rect x="350" y="270" width="17" height="17" class="wx-stone"/><rect x="370" y="270" width="17" height="17" class="wx-stone"/><rect x="390" y="270" width="17" height="17" class="wx-stone"/><rect x="410" y="270" width="17" height="17" class="wx-stone"/><rect x="430" y="270" width="17" height="17" class="wx-stone"/><text x="250" y="308" class="wx-t-s">100 squares = c. 500,000 fragments (est.)</text><text x="250" y="324" class="wx-t wx-t-a">■ c. 5,476 texts published by 2019</text><text x="250" y="340" class="wx-t-s">units differ: a text may join several fragments</text><text x="500" y="62" class="wx-t-b">Salvage digs, Israel, since 1948</text><text x="500" y="130" class="wx-t-big">10,000+</text><text x="500" y="152" class="wx-t-s">salvage and rescue excavations</text><rect x="500" y="180" width="190" height="26" class="wx-stone"/><rect x="500" y="180" width="190" height="26" class="wx-dash"/><text x="508" y="198" class="wx-t-s">share never properly published:</text><text x="500" y="230" class="wx-t-b wx-t-a">unknown, but "many"</text><text x="500" y="248" class="wx-t-s">in the authority's own words</text><text x="500" y="374" class="wx-t-s">Israel Antiquities Authority, Favissa</text></svg></div></div><figcaption>Three documented measures of excavated evidence and how much of it has been published. <span class="wx-src">Based on: Kletter and De-Groot 2001; Press 2020 (after Parsons); Israel Antiquities Authority, Favissa. The Oxyrhynchus comparison mixes fragments and texts and is only indicative.</span></figcaption><p class="vh">Three panels. Left: a bar chart of excavations in Israel per year, 153 in 1989 and 333 in 1998. Centre: a grid of 100 squares standing for an estimated half a million Oxyrhynchus papyrus fragments, each square about 5,000 fragments, with about one square highlighted for the roughly 5,476 texts published by 2019, and a note that a published text may join several fragments, so the units differ. Right: a large figure, over 10,000 salvage and rescue excavations in Israel since 1948, with a dashed bar labelled share never properly published: unknown, many.</p></figure><p>In 2001 Raz Kletter and Alon De-Groot counted about 2,200 excavation projects in Israel in a single decade. Their number rose from 153 in 1989 to 333 in 1998, while final reports lagged far behind. They argued, in a scholarly journal, for a pause on new excavation licences so that publication could catch up.</p><p>Egypt offers the most famous example. Between 1896 and 1907 Bernard Grenfell and Arthur Hunt dug the rubbish mounds of Oxyrhynchus and shipped home a hoard of papyri that the papyrologist Peter Parsons has estimated at around half a million fragments. Their publication, begun in 1898, is one of the great long-running projects of scholarship; by 2019 it had reached 84 volumes and about 5,476 texts. Kathleen Kenyon&#x27;s excavations in Jerusalem, which ended in 1967, were still being prepared for publication half a century later.</p><aside class="wcall"><b>How do we know?</b><p>Because the people responsible say so. The figures here come from an official antiquities authority, a peer-reviewed survey, the long-running publication of a papyrus collection and senior excavators writing in public. This is not a leak or a rumour. It is the discipline&#x27;s own, openly stated embarrassment.</p></aside></section><section class="wsec" id="unpublished-finds-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Why it happens</h3><p>The reasons archaeologists give are ordinary. Digging is exciting, fundable and rewarded; the years of analysis, drawing and writing that follow are none of those things. Salvage excavation, required before roads and buildings, produces material on a scale no one planned for. Specialists in pottery, bones or seeds are few and overbooked. Excavators move on, fall ill and die, and their notes become hard for anyone else to use. In the United States and elsewhere, archaeologists speak of a &#x27;curation crisis&#x27;: storerooms that are full, underfunded and poorly catalogued.</p><p>The rules rarely bite. Permit systems generally expect excavators to publish, but a deadline is hard to enforce against a scholar who is still, in principle, working on the material, and the same scholar usually keeps first rights to it. In salvage archaeology the excavator may be a contractor whose job ends when the site is cleared for building.</p><p>Aren Maeir of Bar-Ilan University, who has dug at Tell es-Safi/Gath for a quarter of a century, wrote bluntly in 2022 that the finds will perish unless archaeologists publish, and credited Hershel Shanks, a lawyer rather than an archaeologist, with calling out the problem more than 25 years earlier. He held up his doctoral adviser, Amihai Mazar, as an example of an excavator who publishes, and set himself the next decade to finish the Gath reports.</p></section><section class="wsec" id="unpublished-finds-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The suspicious reading</h3><p>Where the public hears of storerooms full of unstudied finds, suspicion follows. Michael Cremo and Richard Thompson argued in Forbidden Archeology (1993) that a &#x27;knowledge filter&#x27; keeps anomalous finds, such as tools in impossibly old layers, out of the scientific literature. Graham Hancock argues that the record behind textbook history is partial and that unstudied evidence could overturn it. Online, stories circulate that museums hide giant skeletons or impossible artefacts; one widely shared version in 2014 came from a satirical fake-news site.</p><p>The strongest part of this reading is simply true. The published record is a sample, and not a random one: monumental sites, rich burials and fundable periods are more likely to be written up than a farmstead found under a car park. A synthesis built from the published part may be skewed in ways no one has measured.</p><p>The rest has no documented support. No study has shown that unpublished material differs in kind from published material, and the finds that do overturn accepted views, from Göbekli Tepe to the Kalambo Falls wooden structure, were published in prominent journals, not buried. The backlog is best explained by money, time and incentives. It does not need a conspiracy, and a conspiracy would not explain it better.</p></section><section class="wsec" id="unpublished-finds-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>What time is taking</h3><p>The backlog is not static. Paper decays, digital files from the 1990s become unreadable, labels fall off boxes, and knowledge that lived in an excavator&#x27;s head dies with them. Storerooms are also vulnerable: during the unrest in Egypt in 2011, several antiquities magazines were broken into and objects stolen. Each year of delay turns some unpublished evidence into lost evidence.</p><p>There is a link here to the other files in this section. The Dead Sea Scrolls affair was, at bottom, a publication backlog that hardened into a monopoly: editors held the right to publish and did not. The Temple Mount&#x27;s sifted finds and the 2007 trench waited years for full reports. The difference between a slow scholar and a gatekeeper is often only a matter of time, and from outside the two look the same.</p></section><section class="wsec" id="unpublished-finds-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>The open-data turn</h3><p>The fix is under way, if slowly. In September 2025 the Israel Antiquities Authority opened a national archaeology database with nearly 4 million records, including almost a million artefacts, more than 1.2 million images and over 15,000 3D models. The Dead Sea Scrolls, once the symbol of hoarded evidence, are now online in high resolution. Open archives such as the UK&#x27;s Archaeology Data Service and platforms like Open Context and tDAR publish field data that once lived in filing cabinets.</p><figure class="wx wx--steps" id="unpublished-finds-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">Where evidence gets stuck</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Where evidence gets stuck"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" class="wx-svg" role="img" aria-labelledby="unpublished-finds-f2-t"><title id="unpublished-finds-f2-t">Pipeline from excavation to open data with the stages where evidence stalls, in five steps; widths illustrative</title><text x="24" y="28" class="wx-t-cap">From the trench to the public (widths illustrative)</text><g class="wx-st" data-s="1"><rect x="20" y="115.0" width="120" height="110" rx="6" class="wx-accfill wx-o60"/><text x="80" y="247.0" text-anchor="middle" class="wx-t-b">Excavation</text></g><g class="wx-st" data-s="2"><path d="M140,170 L160,170" class="wx-hl wx-flow"/></g><g class="wx-st" data-s="2"><rect x="160" y="120.0" width="120" height="100" rx="6" class="wx-accfill wx-o60"/><text x="220" y="242.0" text-anchor="middle" class="wx-t-b">Field records</text></g><g class="wx-st" data-s="3"><path d="M280,170 L300,170" class="wx-hl wx-flow"/></g><g class="wx-st" data-s="3"><rect x="300" y="122.0" width="120" height="96" rx="6" class="wx-stone3 wx-o80"/><text x="360" y="240.0" text-anchor="middle" class="wx-t-b">Storeroom</text></g><g class="wx-st" data-s="4"><path d="M420,170 L440,170" class="wx-hl wx-flow"/></g><g class="wx-st" data-s="4"><rect x="440" y="155.0" width="120" height="30" rx="6" class="wx-accfill wx-o60"/><text x="500" y="218" text-anchor="middle" class="wx-t-b">Final report</text></g><g class="wx-st" data-s="5"><rect x="580" y="135.0" width="120" height="70" rx="6" class="wx-c3 wx-o60"/><text x="640" y="227.0" text-anchor="middle" class="wx-t-b">Open data</text></g><g class="wx-st" data-s="4"><path d="M420,170 L440,170" class="wx-hl wx-flow"/></g><g class="wx-st" data-s="5"><path d="M560,170 L580,170" class="wx-hl wx-flow"/><path d="M360,122 C420,70 560,70 620,135" class="wx-line wx-s3 wx-flow"/><text x="490" y="82" text-anchor="middle" class="wx-t-s">databases can open stored records directly</text></g><g class="wx-st wx-hide" data-s="3"><circle cx="360" cy="170" r="16" class="wx-c4"/><text x="360" y="175" text-anchor="middle" class="wx-t-b wx-t-w">!</text><text x="360" y="258" text-anchor="middle" class="wx-t-s">years or decades</text></g><g class="wx-st wx-hide" data-s="4"><circle cx="500" cy="140" r="12" class="wx-c4"/><text x="500" y="144" text-anchor="middle" class="wx-t-b wx-t-w">!</text><text x="500" y="236" text-anchor="middle" class="wx-t-s">often never written</text></g><g class="wx-st wx-hide" data-only="1"><text x="24" y="320" class="wx-t wx-t-a">Digging destroys the layers it records: the record is all that remains.</text></g><g class="wx-st wx-hide" data-only="2"><text x="24" y="320" class="wx-t wx-t-a">Notes, plans, photographs and finds lists; lost if the excavator never writes up.</text></g><g class="wx-st wx-hide" data-only="3"><text x="24" y="320" class="wx-t wx-t-a">Most material waits in storerooms: the curation crisis.</text></g><g class="wx-st wx-hide" data-only="4"><text x="24" y="320" class="wx-t wx-t-a">Only part is fully analysed and published in a final report.</text></g><g class="wx-st wx-hide" data-only="5"><text x="24" y="320" class="wx-t wx-t-a">Open databases can release records even before a final report exists.</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Excavation: the site is dug and its layers destroyed as they are recorded.</p><ol class="wx-steplist"><li>Excavation: the site is dug and its layers destroyed as they are recorded.</li><li>Field records: notes, plans, photographs and finds lists are made.</li><li>Storeroom: finds are boxed and stored; many wait here for years or decades.</li><li>Final report: only part of the material is fully analysed and published.</li><li>Open data: databases can release records and images even before a final report.</li></ol><figcaption>The journey from excavation to open data, and the points where finds most often stall. <span class="wx-src">Based on: Stages after Kletter and De-Groot 2001, Kersel 2015 and Israel Antiquities Authority practice. Widths illustrative only.</span></figcaption><p class="vh">A pipeline of five stages from left to right: excavation, field records, storeroom, final report and open data, with a band of evidence narrowing as it passes each stage. Step 1 shows the excavation. Step 2 adds field notes, plans and photographs. Step 3 shows most material going into the storeroom, with a stall marker. Step 4 shows a thin stream reaching a final report, with a stall marker for missing reports. Step 5 shows open databases drawing from both the storeroom and the reports. Widths are illustrative, not measured.</p></figure><p>For the mysteries on this site, this matters more than any single find. Every claim that &#x27;they are hiding something&#x27; feeds on the gap between what was dug and what was shared. Every record put online narrows that gap, and lets anyone, sceptic or challenger, check the evidence for themselves.</p><blockquote class="wpull"><p>The past is not being hidden in the storerooms. It is being forgotten there, which is worse, and easier to fix.</p></blockquote></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-find" style="--i:0"><span class="wtl-y">1896 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Grenfell and Hunt begin digging Oxyrhynchus</span></li><li class="wtl-study" style="--i:1"><span class="wtl-y">1898 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">First Oxyrhynchus Papyri volume</span></li><li class="wtl-find" style="--i:2"><span class="wtl-y">1961 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Kenyon begins her Jerusalem excavations</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">1998 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Excavations in Israel reach 333 a year</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">2001 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Kletter and De-Groot call for a pause in new licences</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">2004 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">US archaeologists address the curation crisis</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2019 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Oxyrhynchus series reaches 84 volumes</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2025 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Israel&#x27;s national archaeology database goes online</span></li></ol><details class="srcs"><summary>Sources for this case (12)</summary><ol><li>Kletter, R., De-Groot, A. (2001). Excavating to excess? Implications of the last decade of archaeology in Israel. Journal of Mediterranean Archaeology 14(1): 76–85. <a href="https://doi.org/10.1558/jmea.v14i1.76" target="_blank" rel="noopener">doi:10.1558/jmea.v14i1.76</a></li><li>Israel Antiquities Authority. Favissa: past archaeological excavation reports (online database), publications.iaa.org.il.</li><li>Press, M. (9 January 2020). The perennial problem with the excavation of ancient sites. Hyperallergic.</li><li>Maeir, A. M. (15 July 2022). Publish or perish. Biblical Archaeology Society, Bible History Daily.</li><li>Childs, S. T. (ed.) (2004). Our Collective Responsibility: The Ethics and Practice of Archaeological Collections Stewardship. Society for American Archaeology, Washington DC.</li><li>Kersel, M. M. (2015). Storage wars: solving the archaeological curation crisis? Journal of Eastern Mediterranean Archaeology and Heritage Studies 3(1): 42–54.</li><li>Science (2007). Archaeology: curation in crisis. Science 317(5841): 1025. <a href="https://doi.org/10.1126/science.317.5841.1025" target="_blank" rel="noopener">doi:10.1126/science.317.5841.1025</a></li><li>Ynetnews (9 September 2025). Israel unveils massive national archaeology database with millions of records.</li><li>Grenfell, B. P., Hunt, A. S. et al. (1898–). The Oxyrhynchus Papyri. Egypt Exploration Society, London.</li><li>Cremo, M. A., Thompson, R. L. (1993). Forbidden Archeology: The Hidden History of the Human Race. Bhaktivedanta Institute, San Diego.</li><li>Kansa, E. C., Kansa, S. W. (2013). We all know that a 14 is a sheep: data publication and professionalism in archaeological communication. Journal of Eastern Mediterranean Archaeology and Heritage Studies 1(1): 88–97.</li><li>Archaeology Data Service, University of York (founded 1996). Open archive of archaeological data, archaeologydataservice.ac.uk.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-unpublished-finds" data-t="The Unpublished Past: Finds That Never Left the Storeroom"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Unpublished Past: Finds That Never Left the Storeroom</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-unpublished-finds</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-mkultra-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="DeclassifiedMKULTRA.jpg" data-cap="A declassified MKUltra document, released after the 1977 Senate hearing" data-big><figcaption></figcaption></figure><div class="sh-k">What Governments Did</div><h2 class="sh-t" id="case-mkultra-st" tabindex="-1">MKUltra: The CIA&#x27;s Secret Drug Experiments</h2><p class="sh-s">The CIA drugged people without their knowledge, a scientist died, and the files were shredded. What survived is on the record.</p><div class="sh-v"><span class="vstamp vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><p class="sh-claim"><b>What the stamp rates:</b> The CIA ran illegal mind-control experiments on people who did not know they were being tested.</p></div><p class="v4-q">Did the CIA really run illegal mind-control experiments on unwitting people?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>In 1953 the CIA approved MKUltra, a programme to find drugs and methods for controlling behaviour.</li><li>Its records list 149 subprojects across universities, hospitals, prisons and companies, often through front organisations.</li><li>People were given LSD without knowing, including in safe houses where members of the public were dosed and watched.</li><li>The CIA director confirmed it under oath in 1977; a presidential commission judged it illegal; courts paid settlements.</li><li>The experiments are established; that any mind-control method ever worked is not.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Institutions</span><span class="thr">Chemistry</span><span class="thr">Biology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="149" >149</b><span class="ctr-u"> subprojects</span></div><div class="ctr-l">MKUltra subprojects in the surviving records</div><div class="ctr-c">US Senate 1977</div></div><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="80" >80</b><span class="ctr-u"> institutions</span></div><div class="ctr-l">institutions the CIA said were involved</div><div class="ctr-c">US Senate 1977</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="20000" >20,000</b><span class="ctr-u"> pages</span></div><div class="ctr-l">documents that escaped the 1973 destruction</div><div class="ctr-c">US Senate 1977; Marks 1979</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="22" >22</b><span class="ctr-u"> years</span></div><div class="ctr-l">before Frank Olson&#x27;s family learned he had been drugged</div><div class="ctr-c">Rockefeller Commission 1975</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The CIA ran illegal mind-control experiments on people who did not know they were being tested.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:91.7%" role="img" aria-label="Weight of evidence: Established"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Every part of the claim rests on independent, documented lines: the CIA&#x27;s surviving financial records, the director&#x27;s sworn testimony in 1977, the Church Committee and Rockefeller Commission reports, court settlements in the United States and Canada, and the Olson case. The experiments aimed at controlling behaviour, used drugs on unwitting people, and were judged illegal by a presidential commission. What is not established is that any technique of mind control ever worked, or the darker extensions some writers propose.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks present MKUltra as a settled, closed chapter, and the core account is sound. But they can sound more complete than the evidence allows. The main files were destroyed on purpose, so the textbook story is built from what survived by accident. Confidence about what happened is justified; confidence that we know everything that happened is not.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>MKUltra was approved by Director of Central Intelligence Allen Dulles on 13 April 1953 and run by the chemist Sidney Gottlieb of the CIA&#x27;s Technical Services Staff, to study drugs and other means of influencing and controlling behaviour.<small>US Senate 1977; Church Committee 1976</small></li><li>The surviving records list 149 subprojects. In 1977 CIA Director Stansfield Turner told the Senate that the research involved 44 colleges or universities, 15 research foundations or chemical and drug companies, 12 hospitals or clinics and 3 prisons, often through cover organisations.<small>US Senate 1977</small></li><li>The Agency gave LSD and other drugs to people who did not know they were being tested, including through safe houses in San Francisco and New York in which unwitting members of the public were dosed and observed.<small>Church Committee 1976; US Senate 1977</small></li><li>The army scientist Frank Olson was secretly given LSD at a CIA-army retreat in November 1953 and died on 28 November 1953 after falling from a 13th-floor window of a New York hotel. His family learned of the drugging only in 1975.<small>Rockefeller Commission 1975; Kinzer 2019</small></li><li>In January 1973 Director Richard Helms ordered the MKUltra files destroyed. About 20,000 pages survived because they had been stored with financial records, and were found in 1977 after a Freedom of Information request by the journalist John Marks.<small>US Senate 1977; Marks 1979</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether Frank Olson&#x27;s death was suicide, an accident caused by the drug, or murder to stop him talking, as his family has argued since a 1994 exhumation.</li><li>How far the testing reached beyond the surviving records, and whether related work continued under other names after 1973.</li><li>Claimed links between MKUltra and later notorious figures or events, which rest on circumstance rather than documents.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Most operational files, burned or shredded on Helms&#x27;s 1973 order before Congress could see them.</li><li>The names of most people who were tested, and records of what happened to them afterwards.</li><li>Any full accounting of the work done abroad or through foreign institutions.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Historians and the official inquiries agree on the core. Fearing that the Soviet Union and China had found ways to break prisoners&#x27; minds, the CIA funded a secret research programme on drugs, hypnosis, sensory deprivation and other methods from 1953. It tested drugs on people who had not consented and did not know, and a man died. The Rockefeller Commission of 1975 called the testing of drugs on unsuspecting persons illegal, and the Church Committee found that consent was obviously not obtained. Where scholars are cautious is on the wilder stories: the surviving records show a programme that failed to find any reliable way to control a mind.</p><ul><li>The core facts come from the CIA&#x27;s own surviving files, its director&#x27;s sworn testimony and two official inquiries.</li><li>No surviving document shows a working mind-control technique; the Agency found LSD too unpredictable to use.</li><li>Claims of programmed assassins or links to famous crimes lack documents, though the missing files make them hard to rule out.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>The challengers argue that the documented story is the floor, not the ceiling. Eric Olson has spent decades arguing that his father was not a suicide but was killed because he had become a security risk, and that the LSD story was itself a cover. Stephen Kinzer presents Gottlieb as the head of a programme of unchecked human experiment. Tom O&#x27;Neill argues that CIA-funded research on drugs and behaviour came closer to the counterculture of the 1960s than official accounts admit. All of them stress the same point: the people who ran MKUltra destroyed the evidence, so the official account is built on what they failed to burn.</p><ul><li>The destruction of the files in 1973 was deliberate and was done as inquiries loomed.</li><li>The Olson family was told for 22 years that his death was an unexplained suicide.</li><li>Official inquiries only learned what the Agency chose to disclose or had failed to destroy.</li></ul><div class="face-s"><b>Its strongest point</b><p>The only reason we know the scale of MKUltra is an accident of filing. When the institution under investigation destroyed its own records, the gaps in the official account cannot fairly be read as proof that nothing worse happened.</p></div><p class="face-cr"><b>Credit</b> Eric Olson (son of Frank Olson); John Marks (The Search for the Manchurian Candidate, 1979); Stephen Kinzer (Poisoner in Chief, 2019); Tom O&#x27;Neill (Chaos, 2019)</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Release of any remaining MKUltra, MKSEARCH and Artichoke records still withheld, with the names of institutions and subjects where they survive.</li><li>Full disclosure of the CIA&#x27;s and the army&#x27;s internal files on Frank Olson&#x27;s death, including the 1953 investigations.</li><li>Court records from the Canadian class action over the Allan Memorial Institute experiments in Montreal, once the case is heard.</li><li>Testimony from surviving staff and subjects gathered by an independent historian with access to classified archives.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,170 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of MKUltra: The CIA&#x27;s Secret Drug Experiments"><button type="button" class="wtoc-i" data-go="mkultra-s1">A drink at Deep Creek Lake</button><button type="button" class="wtoc-i" data-go="mkultra-s2">What the record shows</button><button type="button" class="wtoc-i" data-go="mkultra-s3">The shredder</button><button type="button" class="wtoc-i" data-go="mkultra-s4">The official reading</button><button type="button" class="wtoc-i" data-go="mkultra-s5">Off the record: what the challengers argue</button><button type="button" class="wtoc-i" data-go="mkultra-s6">Why it matters for every other mystery</button><button type="button" class="wtoc-i" data-go="mkultra-s7">What would settle the rest</button></nav></div><section class="wsec" id="mkultra-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A drink at Deep Creek Lake</h3><p>In November 1953 a group of army and CIA scientists met at a lodge at Deep Creek Lake in western Maryland. After dinner, Sidney Gottlieb, the CIA chemist who ran a new and secret research programme, arranged for their Cointreau to be spiked with LSD. One of the men was Frank Olson, a biochemist who worked on biological weapons for the army at Camp Detrick. Olson became anxious and depressed in the days that followed. On 28 November, in a New York hotel where the CIA had taken him for psychiatric help, he fell to his death from a 13th-floor window.</p><p>His widow and children were told he had killed himself. They were not told about the drug until 1975, when a presidential commission revealed that an army employee had died after being given LSD without his knowledge. The programme behind that drink had a code name: MKUltra.</p><blockquote class="wpull"><p>We know how big MKUltra was only because some of its files were put in the wrong place.</p></blockquote></section><section class="wsec" id="mkultra-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What the record shows</h3><p>MKUltra was approved on 13 April 1953 by Allen Dulles, Director of Central Intelligence. It grew out of earlier projects, Bluebird and Artichoke, and out of Cold War fear: American prisoners in Korea had made false confessions, and officials worried that the Soviet Union and China had learned to control minds. The CIA&#x27;s answer was to look for such methods itself, through drugs, hypnosis, sensory deprivation, electroshock and more.</p><figure class="wx wx--static" id="mkultra-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Where the research was done</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Where the research was done"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" class="wx-svg" role="img" aria-labelledby="mkultra-f1-t"><title id="mkultra-f1-t">Bar chart of the kinds of institutions the CIA said in 1977 had taken part in MKUltra research: 44 colleges or universities, 15 research foundations or chemical and drug companies, 12 hospitals or clinics and 3 prisons, with three key numbers below</title><text x="24" y="28" class="wx-t-cap">Where MKUltra research was done, as the CIA told the Senate in 1977</text><line x1="250" y1="52" x2="250" y2="262" class="wx-line"/><g><text x="238" y="82" text-anchor="end" class="wx-t-b">Colleges and universities</text><rect x="250" y="66" width="396" height="24" class="wx-c2 wx-growx" style="--d:1"/><text x="654" y="83" class="wx-t-n">44</text></g><g><text x="238" y="130" text-anchor="end" class="wx-t-b">Research foundations,</text><text x="238" y="145" text-anchor="end" class="wx-t-s">chemical and drug companies</text><rect x="250" y="120" width="135" height="24" class="wx-c6 wx-growx" style="--d:2"/><text x="393" y="137" class="wx-t-n">15</text></g><g><text x="238" y="184" text-anchor="end" class="wx-t-b">Hospitals and clinics</text><text x="238" y="199" text-anchor="end" class="wx-t-s">beyond university hospitals</text><rect x="250" y="174" width="108" height="24" class="wx-c3 wx-growx" style="--d:3"/><text x="366" y="191" class="wx-t-n">12</text></g><g><text x="238" y="238" text-anchor="end" class="wx-t-b">Prisons</text><rect x="250" y="228" width="27" height="24" class="wx-c4 wx-growx" style="--d:4"/><text x="285" y="245" class="wx-t-n">3</text></g><line x1="250" y1="276" x2="340" y2="276" class="wx-dim"/><line x1="250" y1="272" x2="250" y2="280" class="wx-dim"/><line x1="340" y1="272" x2="340" y2="280" class="wx-dim"/><text x="348" y="280" class="wx-t-s">10 institutions</text><line x1="24" y1="300" x2="696" y2="300" class="wx-guide"/><g class="wx-pop" style="--d:5"><text x="24" y="344" class="wx-t-big">149</text><text x="24" y="366" class="wx-t-s">MKUltra subprojects listed in</text><text x="24" y="380" class="wx-t-s">the surviving records</text></g><g class="wx-pop" style="--d:6"><text x="260" y="344" class="wx-t-big">1973</text><text x="260" y="366" class="wx-t-s">Director Richard Helms orders</text><text x="260" y="380" class="wx-t-s">the programme's files destroyed</text></g><g class="wx-pop" style="--d:7"><text x="496" y="344" class="wx-t-big wx-t-a">c. 20,000</text><text x="496" y="366" class="wx-t-s">pages found in 1977 among</text><text x="496" y="380" class="wx-t-s">misfiled financial records</text></g></svg></div></div><figcaption>The kinds of institutions the CIA told the Senate in 1977 had taken part in MKUltra research, with three key numbers. <span class="wx-src">Based on: Testimony of CIA Director Stansfield Turner, joint Senate hearing of 3 August 1977 (US Senate 1977); Church Committee 1976; Marks 1979.</span></figcaption><p class="vh">A horizontal bar chart with four bars drawn to scale: 44 colleges or universities, 15 research foundations or chemical and drug companies, 12 hospitals or clinics beyond university hospitals, and 3 prisons. A scale bar shows 10 institutions. Below, three figures: 149 MKUltra subprojects listed in the surviving records; 1973, when Director Richard Helms ordered the files destroyed; and about 20,000 pages found in 1977 among misfiled financial records.</p></figure><p>The work was spread through universities, hospitals, drug companies and prisons, usually via front foundations so that many researchers did not know who was paying. In the most notorious strand, the Agency paid for safe houses in San Francisco and New York, run by a narcotics officer, where unwitting people were given LSD and watched. In Montreal, CIA money reached the psychiatrist Ewen Cameron, whose patients at the Allan Memorial Institute were put into drugged sleep for weeks and played recorded messages over and over, a method he called psychic driving. Some left with lasting memory loss.</p><aside class="wcall"><b>On record</b><p>Everything in this section comes from documents: the CIA&#x27;s surviving MKUltra files, the sworn testimony of CIA Director Stansfield Turner at a joint Senate hearing on 3 August 1977, the Rockefeller Commission report of June 1975 and the Church Committee&#x27;s final report of April 1976. Settlements followed: the United States paid the Olson family $750,000, and in 1988 the CIA settled a suit brought by Canadian former patients of Cameron.</p></aside></section><section class="wsec" id="mkultra-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The shredder</h3><p>In January 1973, as the Watergate scandal was breaking and months before he left the Agency, Director Richard Helms ordered the MKUltra files destroyed. Gottlieb, retiring the same year, carried out the order. When Congress began investigating the CIA in 1975 after reports of domestic spying, the inquiries could piece MKUltra together only from what staff remembered and what little paper remained.</p><figure class="wx wx--steps" id="mkultra-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">How the paper trail survived</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How the paper trail survived"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" class="wx-svg" role="img" aria-labelledby="mkultra-f2-t"><title id="mkultra-f2-t">Step-through drawing of how MKUltra's paper trail was made, destroyed in 1973 and partly recovered in 1977 from misfiled financial records</title><text x="24" y="28" class="wx-t-cap">How the MKUltra paper trail survived, just</text><text x="40" y="70" class="wx-t-b">Programme files, 1953 onward</text><g class="wx-st" data-only="1"><rect x="40" y="86" width="50" height="34" rx="2" class="wx-stone2 wx-edge-soft"/><line x1="57" y1="96" x2="73" y2="96" class="wx-thin"/><rect x="98" y="86" width="50" height="34" rx="2" class="wx-stone2 wx-edge-soft"/><line x1="115" y1="96" x2="131" y2="96" class="wx-thin"/><rect x="156" y="86" width="50" height="34" rx="2" class="wx-stone2 wx-edge-soft"/><line x1="173" y1="96" x2="189" y2="96" class="wx-thin"/><rect x="214" y="86" width="50" height="34" rx="2" class="wx-stone2 wx-edge-soft"/><line x1="231" y1="96" x2="247" y2="96" class="wx-thin"/><rect x="272" y="86" width="50" height="34" rx="2" class="wx-stone2 wx-edge-soft"/><line x1="289" y1="96" x2="305" y2="96" class="wx-thin"/><rect x="330" y="86" width="50" height="34" rx="2" class="wx-stone2 wx-edge-soft"/><line x1="347" y1="96" x2="363" y2="96" class="wx-thin"/><rect x="40" y="130" width="50" height="34" rx="2" class="wx-stone2 wx-edge-soft"/><line x1="57" y1="140" x2="73" y2="140" class="wx-thin"/><rect x="98" y="130" width="50" height="34" rx="2" class="wx-stone2 wx-edge-soft"/><line x1="115" y1="140" x2="131" y2="140" class="wx-thin"/><rect x="156" y="130" width="50" height="34" rx="2" class="wx-stone2 wx-edge-soft"/><line x1="173" y1="140" x2="189" y2="140" class="wx-thin"/><rect x="214" y="130" width="50" height="34" rx="2" class="wx-stone2 wx-edge-soft"/><line x1="231" y1="140" x2="247" y2="140" class="wx-thin"/><rect x="272" y="130" width="50" height="34" rx="2" class="wx-stone2 wx-edge-soft"/><line x1="289" y1="140" x2="305" y2="140" class="wx-thin"/><rect x="330" y="130" width="50" height="34" rx="2" class="wx-stone2 wx-edge-soft"/><line x1="347" y1="140" x2="363" y2="140" class="wx-thin"/><rect x="40" y="174" width="50" height="34" rx="2" class="wx-st x="2" class="wx-dash"/><rect x="330" y="86" width="50" height="34" rx="2" class="wx-dash"/><rect x="40" y="130" width="50" height="34" rx="2" class="wx-dash"/><rect x="98" y="130" width="50" height="34" rx="2" class="wx-dash"/><rect x="156" y="130" width="50" height="34" rx="2" class="wx-dash"/><rect x="214" y="130" width="50" height="34" rx="2" class="wx-dash"/><rect x="272" y="130" width="50" height="34" rx="2" class="wx-dash"/><rect x="330" y="130" width="50" height="34" rx="2" class="wx-dash"/><rect x="40" y="174" width="50" height="34" rx="2" class="wx-dash"/><rect x="98" y="174" width="50" height="34" rx="2" class="wx-dash"/><rect x="156" y="174" width="50" height="34" rx="2" class="wx-dash"/><rect x="214" y="174" width="50" height="34" rx="2" class="wx-dash"/><rect x="272" y="174" width="50" height="34" rx="2" class="wx-dash"/><rect x="330" y="174" width="50" height="34" rx="2" class="wx-dash"/><rect x="40" y="218" width="50" height="34" rx="2" class="wx-dash"/><rect x="98" y="218" width="50" height="34" rx="2" class="wx-dash"/><rect x="156" y="218" width="50" height="34" rx="2" class="wx-dash"/><rect x="214" y="218" width="50" height="34" rx="2" class="wx-dash"/><rect x="272" y="218" width="50" height="34" rx="2" class="wx-dash"/><rect x="330" y="218" width="50" height="34" rx="2" class="wx-dash"/><line x1="40" y1="86" x2="382" y2="252" class="wx-hl"/><line x1="382" y1="86" x2="40" y2="252" class="wx-hl"/><rect x="81" y="156" width="260" height="46" rx="6" class="wx-card wx-edge-soft"/><text x="211" y="176" text-anchor="middle" class="wx-t-b">Ordered destroyed, January 1973</text><text x="211" y="193" text-anchor="middle" class="wx-t-s">Helms and Gottlieb</text></g><text x="470" y="70" class="wx-t-b">Financial records centre</text><rect x="470" y="130" width="50" height="34" rx="2" class="wx-stone2 wx-edge-soft"/><rect x="528" y="130" width="50" height="34" rx="2" class="wx-stone2 wx-edge-soft"/><rect x="586" y="130" width="50" height="34" rx="2" class="wx-stone2 wx-edge-soft"/><text x="470" y="186" class="wx-t-s">payment and accounting files,</text><text x="470" y="200" class="wx-t-s">stored away from the main archive</text><g class="wx-st wx-hide" data-s="3"><rect x="462" y="122" width="182" height="50" rx="4" class="wx-hl"/><text x="470" y="108" class="wx-t wx-t-a">missed by the destruction order</text></g><g class="wx-st wx-hide" data-s="4"><path d="M553 210 L553 288" class="wx-hl" marker-end="url(#mkultra-f2-ar)"/><rect x="430" y="300" width="250" height="74" rx="8" class="wx-card wx-edge"/><text x="446" y="324" class="wx-t-b">1977: c. 20,000 pages found</text><text x="446" y="342" class="wx-t-s">after a FOIA request by John Marks</text><text x="446" y="360" class="wx-t-s">Senate hearing, 3 August 1977</text></g><g class="wx-st wx-hide" data-only="5"><rect x="40" y="290" width="342" height="118" rx="8" class="wx-card wx-edge-soft"/><text x="56" y="316" class="wx-t-b">Still missing</text><text x="56" y="338" class="wx-t">most operational files and reports</text><text x="56" y="358" class="wx-t">the names of most people tested</text><text x="56" y="378" class="wx-t">what happened to them afterwards</text><text x="56" y="398" class="wx-t-s">the surviving pages are mostly financial</text></g><defs><marker id="mkultra-f2-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="wx-accfill"/></marker></defs></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> 1953 onward: MKUltra&#x27;s subprojects generate files at CIA headquarters.</p><ol class="wx-steplist"><li>1953 onward: MKUltra&#x27;s subprojects generate files at CIA headquarters.</li><li>January 1973: Director Richard Helms orders the files destroyed; Sidney Gottlieb carries it out.</li><li>Financial records stored elsewhere are missed by the order.</li><li>1977: a FOIA request by John Marks leads to about 20,000 pages and a Senate hearing on 3 August.</li><li>What is still missing: most operational files, and the names and fates of most subjects.</li></ol><figcaption>The MKUltra files were ordered destroyed in 1973. A set of financial records escaped, and that accident is the basis of what we know. <span class="wx-src">Based on: US Senate 1977; Church Committee 1976; Marks 1979. Numbers of boxes are schematic.</span></figcaption><p class="vh">Step 1 shows a grid of 24 file boxes standing for the programme&#x27;s records from 1953, and three boxes to the right in a financial records centre. Step 2 replaces the grid with dashed outlines crossed out, labelled ordered destroyed in January 1973 by Helms and Gottlieb. Step 3 highlights the three financial boxes as missed by the destruction order. Step 4 draws an arrow to a card reading 1977, about 20,000 pages found after a FOIA request by John Marks, Senate hearing 3 August 1977. Step 5 lists what is still missing: most operational files, the names of most people tested, and what happened to them.</p></figure><p>Then, in 1977, a Freedom of Information request by the journalist John Marks turned up about 20,000 pages that had escaped the order because they had been stored with financial records. They were mostly invoices, budgets and project approvals, but they named the subprojects and many institutions. Turner reported the find to Congress, and on 3 August 1977 the Senate intelligence committee and Edward Kennedy&#x27;s health subcommittee held a joint hearing. Marks&#x27;s book, The Search for the Manchurian Candidate, followed in 1979.</p></section><section class="wsec" id="mkultra-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The official reading</h3><p>The inquiries and most historians agree on the heart of it. The Rockefeller Commission called the testing of drugs on unsuspecting persons illegal. The Church Committee found that prior consent was obviously not obtained from the subjects, and that the CIA&#x27;s own inspector general had criticised the practice in 1963, after which testing on unwitting Americans was suspended. In 1975 President Gerald Ford apologised to Frank Olson&#x27;s family at the White House.</p><p>What the documents do not show is success. The Agency found LSD unpredictable and unreliable as a weapon, and no surviving file describes a method that could reliably control anyone. MKUltra is best understood as a large, secret and unethical research effort that produced suffering and very little of what it sought.</p></section><section class="wsec" id="mkultra-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Off the record: what the challengers argue</h3><p>The people who have pushed hardest on MKUltra argue that the record is incomplete by design. Eric Olson had his father&#x27;s body exhumed in 1994. The forensic scientist James Starrs, who led the examination, reported an injury to the skull that he argued was more consistent with a blow before the fall than with the fall itself. The family has long argued that Frank Olson was killed because he had seen things that troubled him and had become a security risk. A 1996 inquiry by the Manhattan District Attorney&#x27;s office brought no charges, and a family lawsuit was dismissed in 2013. The murder claim is serious and documented as a claim, but it has not been proved in any court.</p><p>Further out are claims that MKUltra produced programmed assassins, or that its drug research shaped figures such as Charles Manson&#x27;s circle, as Tom O&#x27;Neill explores in his 2019 book Chaos. These rest on connections between people and funding rather than on documents that show intent. They should be read as open questions, labelled as such, not as findings.</p><aside class="wcall"><b>Fresh from the field</b><p>In 2025 the Quebec Superior Court authorised a class action by former patients of the Allan Memorial Institute and their families against institutions linked to Cameron&#x27;s work. It is one of the few places where new evidence about MKUltra-funded research may still be heard under oath.</p></aside></section><section class="wsec" id="mkultra-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Why it matters for every other mystery</h3><p>MKUltra is not a mystery about the past in the way a buried city is. But it sits at the root of a question that runs through this whole site: when an institution tells you there is nothing more to find, how much should you trust it? In this case the people who were told there was nothing to find, the Olson family, the Canadian patients, the public, were misled for decades. The evidence of wrongdoing survived only because a clerk filed some boxes in the wrong place.</p><p>That history explains why so many people now meet official explanations with suspicion, from Roswell to the pyramids. The honest lesson is double. Institutions can lie and destroy records, and the MKUltra record shows it. But the way we know that is through documents, testimony and courts, the same tools that should be used to test every other claim of a cover-up.</p><blockquote class="wpull"><p>MKUltra shows that cover-ups happen, and that they are exposed by paper, not by suspicion alone.</p></blockquote></section><section class="wsec" id="mkultra-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle the rest</h3><p>The core of MKUltra is settled. What remains open could be narrowed by the release of every remaining record of MKUltra and its sister projects, full disclosure of the CIA&#x27;s and the army&#x27;s 1953 files on Frank Olson, and the testimony and documents that the Quebec class action may bring out. An independent historian given access to classified archives, with a mandate to publish, would do more to answer the darker claims than any number of theories. Until then the fair verdict has two parts: the claim that the CIA ran illegal behaviour-control experiments on unwitting people is established, and the claim that we know the whole story is not.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">1953 CE</span><span class="wtl-k">Built</span><span class="wtl-t">MKUltra approved; Frank Olson dies</span></li><li class="wtl-use" style="--i:1"><span class="wtl-y">1957 CE</span><span class="wtl-k">In use</span><span class="wtl-t">CIA funding reaches Ewen Cameron&#x27;s work in Montreal</span></li><li class="wtl-study" style="--i:2"><span class="wtl-y">1963 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Internal inspection criticises testing on unwitting people</span></li><li class="wtl-loss" style="--i:3"><span class="wtl-y">1973 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Helms orders the files destroyed</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">1975 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Rockefeller Commission and Church Committee</span></li><li class="wtl-find" style="--i:5"><span class="wtl-y">1977 CE</span><span class="wtl-k">Found</span><span class="wtl-t">20,000 pages found; Senate hearing</span></li><li class="wtl-event" style="--i:6"><span class="wtl-y">1988 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Canadian patients settle with the CIA</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">1994 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Frank Olson&#x27;s body exhumed</span></li><li class="wtl-event" style="--i:8"><span class="wtl-y">2025 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Quebec court authorises a class action</span></li></ol><details class="srcs"><summary>Sources for this case (10)</summary><ol><li>US Senate (1977). Project MKULTRA, the CIA&#x27;s Program of Research in Behavioral Modification. Joint Hearing before the Select Committee on Intelligence and the Subcommittee on Health and Scientific Research of the Committee on Human Resources, 95th Congress, 3 August 1977. US Government Printing Office.</li><li>Senate Select Committee to Study Governmental Operations with Respect to Intelligence Activities (Church Committee) (1976). Final Report, Book I: Foreign and Military Intelligence. S. Rep. No. 94-755, April 1976.</li><li>Commission on CIA Activities within the United States (Rockefeller Commission) (1975). Report to the President. June 1975. US Government Printing Office.</li><li>CIA Inspector General (1963). Report of Inspection of MKULTRA. 26 July 1963. Released under FOIA; CIA Reading Room.</li><li>Marks, J. (1979). The Search for the &#x27;Manchurian Candidate&#x27;: The CIA and Mind Control. Times Books, New York.</li><li>Kinzer, S. (2019). Poisoner in Chief: Sidney Gottlieb and the CIA Search for Mind Control. Henry Holt, New York.</li><li>Collins, A. (1988). In the Sleep Room: The Story of the CIA Brainwashing Experiments in Canada. Lester &amp; Orpen Dennys, Toronto.</li><li>Albarelli, H. P. (2009). A Terrible Mistake: The Murder of Frank Olson and the CIA&#x27;s Secret Cold War Experiments. Trine Day.</li><li>O&#x27;Neill, T., with Piepenbring, D. (2019). Chaos: Charles Manson, the CIA, and the Secret History of the Sixties. Little, Brown, New York.</li><li>Quebec Superior Court (2025). Authorisation of a class action by former Allan Memorial Institute patients and relatives, as summarised in the Wikipedia article &#x27;MKUltra&#x27; (accessed September 2026).</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-mkultra" data-t="MKUltra: The CIA&#x27;s Secret Drug Experiments"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>MKUltra: The CIA&#x27;s Secret Drug Experiments</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-mkultra</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-tuskegee-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Tuskegee-syphilis-study doctor-injecting-subject.jpg" data-cap="A Public Health Service doctor with a participant in the Tuskegee study (US National Archives)" data-big><figcaption></figcaption></figure><div class="sh-k">What Governments Did</div><h2 class="sh-t" id="case-tuskegee-st" tabindex="-1">Tuskegee: Forty Years Without Treatment</h2><p class="sh-s">For four decades, government doctors watched hundreds of Black men with syphilis go untreated, and kept them from the cure.</p><div class="sh-v"><span class="vstamp vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><p class="sh-claim"><b>What the stamp rates:</b> The US government deliberately left Black men with syphilis untreated for decades.</p></div><p class="v4-q">Did the US government deliberately leave Black men with syphilis untreated for decades?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>From 1932 to 1972 the US Public Health Service watched 399 Black men with syphilis go untreated.</li><li>The men were told they had &#x27;bad blood&#x27; and never gave informed consent.</li><li>By 1943 penicillin was the cure; they were not offered it.</li><li>Officials reviewed the study and chose to continue it as late as 1969.</li><li>Established by the government&#x27;s own records, a federal panel, a settlement and a presidential apology.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Institutions</span><span class="thr">Biology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="600" >600</b><span class="ctr-u"> men</span></div><div class="ctr-l">enrolled in 1932 (399 with syphilis, 201 without)</div><div class="ctr-c">CDC timeline</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="40" >40</b><span class="ctr-u"> years</span></div><div class="ctr-l">that the study ran, 1932–1972</div><div class="ctr-c">CDC timeline</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="29" >29</b><span class="ctr-u"> years</span></div><div class="ctr-l">from penicillin becoming the treatment of choice to the study&#x27;s end</div><div class="ctr-c">CDC timeline</div></div><div class="ctr"><div class="ctr-v">$<b class="ctr-n" data-v="10" >10</b><span class="ctr-u"> million dollars</span></div><div class="ctr-l">out-of-court settlement in 1974</div><div class="ctr-c">CDC timeline</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The US government deliberately left Black men with syphilis untreated for decades.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:91.7%" role="img" aria-label="Weight of evidence: Established"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The claim rests on the government&#x27;s own records and admissions: the CDC&#x27;s published timeline, the 1973 federal advisory panel, the 1974 settlement and the 1997 presidential apology. The men were deceived about their diagnosis, penicillin was not offered after it became the treatment of choice, and officials reviewed the study and chose to continue it as late as 1969. Details of individual treatment vary, and some men received antibiotics elsewhere, but the deliberate policy of non-treatment is established by several independent lines.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 6 of 6, presented as settled fact"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>presented as settled fact</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Here the textbooks are right to be confident, and if anything they understate how long officials kept renewing the study. Where popular memory goes beyond the evidence is the widespread belief that the men were injected with syphilis; that is not supported for Tuskegee. The documented truth is grave enough, and a separate study in Guatemala did involve deliberate infection.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>In 1932 the US Public Health Service (PHS) began a study in Macon County, Alabama, of 600 Black men: 399 with syphilis and 201 without, enrolled as a comparison group.<small>CDC timeline; Jones 1993</small></li><li>The men were told they were being treated for &#x27;bad blood&#x27;, a local term for several ailments. They were not told they had syphilis, and they did not give informed consent.<small>CDC timeline; Ad Hoc Advisory Panel 1973</small></li><li>By 1943 penicillin was the treatment of choice for syphilis and becoming widely available, but the men in the study were not offered it.<small>CDC timeline</small></li><li>The study ran until 1972. After an Associated Press story by Jean Heller in July 1972, a federal advisory panel found it ethically unjustified, and it was ended in November 1972.<small>CDC timeline; Heller 1972</small></li><li>A class action brought in 1973 ended in a $10 million out-of-court settlement in 1974; President Bill Clinton formally apologised on 16 May 1997.<small>CDC timeline; Clinton 1997</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>How far treatment was actively blocked, rather than simply withheld, in each decade; historians describe PHS efforts to keep the men from treatment, while some men received antibiotics elsewhere over the years.</li><li>How much of the long-term damage to Black Americans&#x27; trust in medicine can be traced to Tuskegee itself rather than to wider discrimination in care.</li><li>Whether researchers in the 1930s had any scientific justification for observing untreated late syphilis; nothing justified the deception, and nothing justified withholding penicillin later.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Full medical histories of many of the men and their families, especially wives who were infected and children born with congenital syphilis.</li><li>The voices of most of the men themselves, few of whom were ever asked to tell their own story before they died; the last died in 2004.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Historians, the CDC and the federal government all accept the core account. The PHS set out in 1932 to observe the course of untreated syphilis in Black men, deceived them about what was being done, kept them in the study with small benefits, and continued for decades after penicillin became the standard cure. A federal panel called it ethically unjustified in 1972. Some historians add caution on details: a few scholars argued that doctors of the 1930s saw little benefit in treating late syphilis, and records show some men got antibiotics elsewhere. None of that reduces the deception or the decision to keep going.</p><ul><li>The government itself now calls it the Untreated Syphilis Study at Tuskegee and has apologised.</li><li>The study led directly to the National Research Act of 1974 and modern rules on informed consent.</li><li>The popular belief that the Tuskegee men were infected by doctors has no support; that did happen in a separate PHS study in Guatemala in 1946–1948.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>The people who exposed and litigated Tuskegee argued from the start that it was not neglect but a deliberate policy. Buxtun protested inside the PHS from 1966, was rebuffed, and eventually went to the press. Gray, who represented the men, argued that the government had used them as experimental subjects because they were Black and poor. Reverby&#x27;s research traced how the same agency ran the Guatemala experiments, in which people were deliberately infected. Their shared point is that Tuskegee was a choice made and remade by officials over forty years, not a single mistake.</p><ul><li>In 1969 a CDC panel reviewed the study and voted to continue it.</li><li>Letters to the men framed diagnostic spinal taps as special free treatment.</li><li>The same public health service deliberately infected people in Guatemala in the 1940s.</li></ul><div class="face-s"><b>Its strongest point</b><p>The study was reviewed and renewed by officials long after penicillin was standard, and only stopped when a whistleblower went to the press. That is a record of decisions, not of oversight.</p></div><p class="face-cr"><b>Credit</b> Peter Buxtun (PHS investigator and whistleblower); Fred D. Gray (the men&#x27;s lawyer, author of The Tuskegee Syphilis Study, 1998); Susan M. Reverby (historian)</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Full publication of the surviving PHS and CDC study files, with the men&#x27;s names protected, so that each decision to continue can be traced to who made it.</li><li>Further studies of long-term health and trust in the families and communities of Macon County, following Alsan and Wanamaker 2018.</li><li>Oral histories from descendants, recorded while those with memories of the men are still living.</li><li>Archive work on how often, and by whom, the men were kept from treatment in the 1940s and 1950s.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,155 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Tuskegee: Forty Years Without Treatment"><button type="button" class="wtoc-i" data-go="tuskegee-s1">Bad blood</button><button type="button" class="wtoc-i" data-go="tuskegee-s2">What the record shows</button><button type="button" class="wtoc-i" data-go="tuskegee-s3">How it ended</button><button type="button" class="wtoc-i" data-go="tuskegee-s4">What changed because of it</button><button type="button" class="wtoc-i" data-go="tuskegee-s5">The challengers, and the myth</button><button type="button" class="wtoc-i" data-go="tuskegee-s6">What it did to trust</button><button type="button" class="wtoc-i" data-go="tuskegee-s7">What is lost, and what would help</button></nav></div><section class="wsec" id="tuskegee-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Bad blood</h3><p>In 1932, in the cotton country of Macon County, Alabama, government doctors began inviting Black men to free medical examinations. Many were sharecroppers who had rarely seen a doctor. They were told they had &#x27;bad blood&#x27;, a phrase local people used for anything from anaemia to fatigue, and that they would be treated. They were given rides, hot meals and later the promise of burial insurance. What they were not told was that 399 of them had syphilis, and that the point of the study was to watch what the disease did to their bodies until they died.</p><p>The study ran for forty years. It is the clearest case in modern American history of a government deliberately withholding medical care from its own citizens, and it was not a secret inside the institution. It was published in medical journals. It was a secret from the men.</p><blockquote class="wpull"><p>It was published in medical journals. It was a secret from the men.</p></blockquote></section><section class="wsec" id="tuskegee-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What the record shows</h3><p>The US Public Health Service enrolled 600 men: 399 with syphilis and 201 without it, as a comparison group. Working with the Tuskegee Institute and a Black public health nurse, Eunice Rivers, who became the men&#x27;s trusted contact for decades, the PHS followed them with blood tests, examinations and, in the early years, painful spinal taps, which letters to the men presented as special free treatment.</p><figure class="wx wx--static" id="tuskegee-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">The 600 men</h4></div><div class 1.5" cy="313.0" r="5" class="wx-stone2"/><circle cx="40.0" cy="326.5" r="5" class="wx-stone2"/><circle cx="53.5" cy="326.5" r="5" class="wx-stone2"/><circle cx="67.0" cy="326.5" r="5" class="wx-stone2"/><circle cx="80.5" cy="326.5" r="5" class="wx-stone2"/><circle cx="94.0" cy="326.5" r="5" class="wx-stone2"/><circle cx="107.5" cy="326.5" r="5" class="wx-stone2"/><circle cx="121.0" cy="326.5" r="5" class="wx-stone2"/><circle cx="134.5" cy="326.5" r="5" class="wx-stone2"/><circle cx="148.0" cy="326.5" r="5" class="wx-stone2"/><circle cx="161.5" cy="326.5" r="5" class="wx-stone2"/><circle cx="175.0" cy="326.5" r="5" class="wx-stone2"/><circle cx="188.5" cy="326.5" r="5" class="wx-stone2"/><circle cx="202.0" cy="326.5" r="5" class="wx-stone2"/><circle cx="215.5" cy="326.5" r="5" class="wx-stone2"/><circle cx="229.0" cy="326.5" r="5" class="wx-stone2"/><circle cx="242.5" cy="326.5" r="5" class="wx-stone2"/><circle cx="256.0" cy="326.5" r="5" class="wx-stone2"/><circle cx="269.5" cy="326.5" r="5" class="wx-stone2"/><circle cx="283.0" cy="326.5" r="5" class="wx-stone2"/><circle cx="296.5" cy="326.5" r="5" class="wx-stone2"/><circle cx="310.0" cy="326.5" r="5" class="wx-stone2"/><circle cx="323.5" cy="326.5" r="5" class="wx-stone2"/><circle cx="337.0" cy="326.5" r="5" class="wx-stone2"/><circle cx="350.5" cy="326.5" r="5" class="wx-stone2"/><circle cx="364.0" cy="326.5" r="5" class="wx-stone2"/><circle cx="377.5" cy="326.5" r="5" class="wx-stone2"/><circle cx="391.0" cy="326.5" r="5" class="wx-stone2"/><circle cx="404.5" cy="326.5" r="5" class="wx-stone2"/><circle cx="418.0" cy="326.5" r="5" class="wx-stone2"/><circle cx="431.5" cy="326.5" r="5" class="wx-stone2"/></g><text x="40" y="354" class="wx-t-s">Each row is 30 men. Red: syphilis. Pale: comparison group.</text><g class="wx-pop" style="--d:4"><circle cx="478" cy="92" r="7" class="wx-c4"/><text x="494" y="88" class="wx-t-n">399 men with syphilis</text><text x="494" y="104" class="wx-t-s">told they were treated for 'bad blood'</text><text x="494" y="119" class="wx-t-s">never told their diagnosis</text></g><g class="wx-pop" style="--d:6"><circle cx="478" cy="258" r="7" class="wx-stone2"/><text x="494" y="254" class="wx-t-n">201 men without syphilis</text><text x="494" y="270" class="wx-t-s">enrolled as a comparison group</text></g><line x1="450" y1="70" x2="450" y2="230" class="wx-thin"/><line x1="450" y1="244" x2="450" y2="327" class="wx-thin"/><text x="494" y="172" class="wx-t wx-t-a">Offered free meals, rides,</text><text x="494" y="188" class="wx-t wx-t-a">medical checks and burial</text><text x="494" y="204" class="wx-t wx-t-a">insurance to stay enrolled</text></svg></div></div><figcaption>One dot for each man enrolled in 1932: 399 with syphilis, 201 without. <span class="wx-src">Based on: CDC timeline; Jones 1993.</span></figcaption><p class="vh">A grid of 600 dots in 20 rows of 30. The first 399 dots are red, for the men with syphilis, who were told they were being treated for bad blood and never told their diagnosis. The remaining 201 dots are pale, for the men without syphilis enrolled as a comparison group. A note says the men were offered free meals, rides, medical checks and burial insurance to stay enrolled.</p></figure><p>By 1943, the CDC records, penicillin was the treatment of choice for syphilis and was becoming widely available. The men were not offered it. Historians including James H. Jones have documented how, during the Second World War, the PHS gave local authorities the names of study subjects so they would not be treated when they were called up. In 1966 Peter Buxtun, a PHS venereal disease investigator in San Francisco, protested. In 1969 a CDC panel reviewed the study and voted to continue it.</p><aside class="wcall"><b>On record</b><p>Everything in this section is documented by the government itself: the CDC&#x27;s published timeline of what it now calls the US Public Health Service Untreated Syphilis Study at Tuskegee, the final report of the federal Ad Hoc Advisory Panel in 1973, the 1974 settlement and President Clinton&#x27;s apology of 16 May 1997.</p></aside></section><section class="wsec" id="tuskegee-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>How it ended</h3><p>Buxtun eventually went to the press. On 25 July 1972 an Associated Press story by Jean Heller reported that men in a federal study had gone untreated for 40 years; the New York Times ran it on its front page the next day. A federal advisory panel concluded that October that the study was ethically unjustified, and in November 1972 the Assistant Secretary for Health announced its end.</p><figure class="wx wx--static" id="tuskegee-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">Forty years, and the cure that was withheld</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Forty years, and the cure that was withheld"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" class="wx-svg" role="img" aria-labelledby="tuskegee-f1-t"><title id="tuskegee-f1-t">Timeline from 1930 to 2005 showing the Tuskegee study running from 1932 to 1972, the 29 years from 1943 in which penicillin was available but not offered, and the key events of exposure, settlement and apology</title><text x="24" y="28" class="wx-t-cap">Forty years of observation, 29 of them with a cure available</text><line x1="60" y1="320" x2="680" y2="320" class="wx-line"/><line x1="60.0" y1="320" x2="60.0" y2="326" class="wx-dim"/><text x="60.0" y="342" text-anchor="middle" class="wx-t-s">1930</text><line x1="142.7" y1="320" x2="142.7" y2="326" class="wx-dim"/><text x="142.7" y="342" text-anchor="middle" class="wx-t-s">1940</text><line x1="225.3" y1="320" x2="225.3" y2="326" class="wx-dim"/><text x="225.3" y="342" text-anchor="middle" class="wx-t-s">1950</text><line x1="308.0" y1="320" x2="308.0" y2="326" class="wx-dim"/><text x="308.0" y="342" text-anchor="middle" class="wx-t-s">1960</text><line x1="390.7" y1="320" x2="390.7" y2="326" class="wx-dim"/><text x="390.7" y="342" text-anchor="middle" class="wx-t-s">1970</text><line x1="473.3" y1="320" x2="473.3" y2="326" class="wx-dim"/><text x="473.3" y="342" text-anchor="middle" class="wx-t-s">1980</text><line x1="556.0" y1="320" x2="556.0" y2="326" class="wx-dim"/><text x="556.0" y="342" text-anchor="middle" class="wx-t-s">1990</text><line x1="638.7" y1="320" x2="638.7" y2="326" class="wx-dim"/><text x="638.7" y="342" text-anchor="middle" class="wx-t-s">2000</text><rect x="76.5" y="284" width="330.7" height="20" class="wx-c2 wx-o60 wx-growx" style="--d:1"/><text x="82.5" y="298" class="wx-t-s wx-halo">Study runs, 1932–1972</text><rect x="167.5" y="258" width="239.7" height="20" class="wx-c4 wx-o80 wx-growx" style="--d:3"/><text x="173.5" y="272" class="wx-t-s wx-t-w">Penicillin available, not offered</text><g class="wx-pop" style="--d:1"><line x1="76.5" y1="84" x2="76.5" y2="320" class="wx-guide"/><circle cx="76.5" cy="320" r="4.5" class="wx-inkfill"/><text x="82.5" y="96" text-anchor="start" class="wx-t-b wx-halo">1932: study begins</text><text x="82.5" y="111" text-anchor="start" class="wx-t-s wx-halo">Macon County, Alabama</text></g><g class="wx-pop" style="--d:2"><line x1="167.5" y1="128" x2="167.5" y2="320" class="wx-guide"/><circle cx="167.5" cy="320" r="4.5" class="wx-inkfill"/><text x="173.5" y="140" text-anchor="start" class="wx-t-b wx-halo">1943: penicillin</text><text x="173.5" y="155" text-anchor="start" class="wx-t-s wx-halo">treatment of choice (CDC)</text></g><g class="wx-pop" style="--d:4"><line x1="357.6" y1="212" x2="357.6" y2="320" class="wx-guide"/><circle cx="357.6" cy="320" r="4.5" class="wx-inkfill"/><text x="351.6" y="224" text-anchor="end" class="wx-t-b wx-halo">1966: Buxtun protests</text><text x="351.6" y="239" text-anchor="end" class="wx-t-s wx-halo">inside the PHS</text></g><g class="wx-pop" style="--d:5"><line x1="382.4" y1="168" x2="382.4" y2="320" class="wx-guide"/><circle cx="382.4" cy="320" r="4.5" class="wx-inkfill"/><text x="388.4" y="180" text-anchor="start" class="wx-t-b wx-halo">1969: CDC panel</text><text x="388.4" y="195" text-anchor="start" class="wx-t-s wx-halo">votes to continue</text></g><g class="wx-pop" style="--d:6"><line x1="407.2" y1="88" x2="407.2" y2="320" class="wx-guide"/><circle cx="407.2" cy="320" r="4.5" class="wx-accfill"/><text x="413.2" y="100" text-anchor="start" class="wx-t-b wx-halo">1972: AP story</text><text x="413.2" y="115" text-anchor="start" class="wx-t-s wx-halo">study ends in November</text></g><g class="wx-pop" style="--d:7"><line x1="423.7" y1="212" x2="423.7" y2="320" class="wx-guide"/><circle cx="423.7" cy="320" r="4.5" class="wx-inkfill"/><text x="429.7" y="224" text-anchor="start" class="wx-t-b wx-halo">1974: settlement</text><text x="429.7" y="239" text-anchor="start" class="wx-t-s wx-halo">$10 million</text></g><g class="wx-pop" style="--d:8"><line x1="613.9" y1="128" x2="613.9" y2="320" class="wx-guide"/><circle cx="613.9" cy="320" r="4.5" class="wx-inkfill"/><text x="607.9" y="140" text-anchor="end" class="wx-t-b wx-halo">1997: apology</text><text x="607.9" y="155" text-anchor="end" class="wx-t-s wx-halo">President Clinton, 16 May</text></g><g class="wx-pop" style="--d:9"><line x1="671.7" y1="46" x2="671.7" y2="320" class="wx-guide"/><circle cx="671.7" cy="320" r="4.5" class="wx-inkfill"/><text x="665.7" y="58" text-anchor="end" class="wx-t-b wx-halo">2004: last man dies</text><text x="665.7" y="73" text-anchor="end" class="wx-t-s wx-halo">January</text></g></svg></div></div><figcaption>The study ran from 1932 to 1972; for 29 of those years penicillin was the treatment of choice and the men were not offered it. <span class="wx-src">Based on: CDC, Timeline of the US Public Health Service Untreated Syphilis Study at Tuskegee; Jones 1993; Heller 1972. Years drawn to scale.</span></figcaption><p class="vh">A timeline from 1930 to 2005. A blue bar runs from 1932
