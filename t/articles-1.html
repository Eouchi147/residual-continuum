ded the conventional date controlled who could test it.</li></ul><div class="face-s"><b>Its strongest point</b><p>The people deciding who could test the Sphinx&#x27;s age were also the public defenders of its textbook date. Even with good intentions, that is a conflict of interest, and the anomalies of the 1990s were never tested in the open.</p></div><p class="face-cr"><b>Credit</b> Robert Schoch and John Anthony West; Graham Hancock and Robert Bauval; Thomas Dobecki</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Publication of the raw seismic and radar data from the 1991, 1992 and 1996 surveys in an open archive.</li><li>A new survey by an independent team with a published protocol agreed in advance, including where to drill any anomaly found.</li><li>Release of the permit files for the 1990s surveys.</li><li>A dated sample from the weathered floor rock of the enclosure, analysed by more than one laboratory.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,147 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of The Sphinx Surveys: Was Independent Research Shut Down?"><button type="button" class="wtoc-i" data-go="sphinx-surveys-s1">A geologist, a statue and a gate</button><button type="button" class="wtoc-i" data-go="sphinx-surveys-s2">The surveys on record</button><button type="button" class="wtoc-i" data-go="sphinx-surveys-s3">The challengers&#x27; case at its strongest</button><button type="button" class="wtoc-i" data-go="sphinx-surveys-s4">The authorities&#x27; answer</button><button type="button" class="wtoc-i" data-go="sphinx-surveys-s5">What time and restoration have hidden</button><button type="button" class="wtoc-i" data-go="sphinx-surveys-s6">What would settle it</button></nav></div><section class="wsec" id="sphinx-surveys-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A geologist, a statue and a gate</h3><p>In June 1990 a Boston University geologist named Robert Schoch walked into the Sphinx enclosure at Giza with the writer John Anthony West. West had argued for years that the deep, rounded weathering of the enclosure walls looked like the work of rain, not wind. Schoch came as a sceptic and left convinced that the carving was older, perhaps much older, than the reign of Khafre around 2500 BCE, the date in every textbook.</p><p>What followed was one of the loudest rows in modern archaeology. It was fought partly over rock and rainfall, which the Sphinx Erosion case weighs in detail. But it was also fought over access: who was allowed to measure the Sphinx, drill beside it and talk about the results. That second fight is the subject here.</p><blockquote class="wpull"><p>The question was not only how old the Sphinx is. It was who gets to find out.</p></blockquote></section><section class="wsec" id="sphinx-surveys-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The surveys on record</h3><p>The Sphinx is not an unstudied monument. In 1977–78 SRI International, working with the Edgar Cayce Foundation&#x27;s Association for Research and Enlightenment, surveyed around the paws with electrical and acoustic methods and reported natural fissures. In 1987 a team from Waseda University in Tokyo ran an electromagnetic survey. In April 1991, with the permission of the Egyptian Antiquities Organization, the geophysicist Thomas Dobecki ran seismic lines across the enclosure floor for Schoch&#x27;s project. In 1992 two Egyptian scientists, Imam Marzouk and Ali Gharib, carried out a shallow seismic study.</p><figure class="wx wx--steps" id="sphinx-surveys-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">Twenty years of surveys at the Sphinx</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Twenty years of surveys at the Sphinx"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" class="wx-svg" role="img" aria-labelledby="sphinx-surveys-f1-t"><title id="sphinx-surveys-f1-t">Timeline of geophysical surveys, public events and refusals at the Sphinx from 1977 to 1998, in five steps</title><text x="24" y="28" class="wx-t-cap">Surveys at the Sphinx, 1975–2000</text><circle cx="30" cy="50" r="5" class="wx-accfill"/><text x="40" y="54" class="wx-t-s">survey permitted</text><rect x="146" y="45" width="10" height="10" class="wx-c4"/><text x="162" y="54" class="wx-t-s">request refused</text><polygon points="268,44 274,50 268,56 262,50" class="wx-c2"/><text x="280" y="54" class="wx-t-s">public event</text><line x1="50" y1="330" x2="690" y2="330" class="wx-line"/><line x1="60.0" y1="330" x2="60.0" y2="336" class="wx-dim"/><text x="60.0" y="352" text-anchor="middle" class="wx-t-s">1975</text><line x1="184.0" y1="330" x2="184.0" y2="336" class="wx-dim"/><text x="184.0" y="352" text-anchor="middle" class="wx-t-s">1980</text><line x1="308.0" y1="330" x2="308.0" y2="336" class="wx-dim"/><text x="308.0" y="352" text-anchor="middle" class="wx-t-s">1985</text><line x1="432.0" y1="330" x2="432.0" y2="336" class="wx-dim"/><text x="432.0" y="352" text-anchor="middle" class="wx-t-s">1990</text><line x1="556.0" y1="330" x2="556.0" y2="336" class="wx-dim"/><text x="556.0" y="352" text-anchor="middle" class="wx-t-s">1995</text><line x1="680.0" y1="330" x2="680.0" y2="336" class="wx-dim"/><text x="680.0" y="352" text-anchor="middle" class="wx-t-s">2000</text><g class="wx-st" data-s="1"><line x1="129.4" y1="268" x2="129.4" y2="330" class="wx-guide"/><circle cx="129.4" cy="330" r="6" class="wx-accfill"/><text x="135.4" y="280" text-anchor="start" class="wx-t-b wx-halo">SRI International</text><text x="135.4" y="295" text-anchor="start" class="wx-t-s wx-halo">resistivity, acoustic; natural fissures</text></g><g class="wx-st" data-s="1"><line x1="357.6" y1="208" x2="357.6" y2="330" class="wx-guide"/><circle cx="357.6" cy="330" r="6" class="wx-accfill"/><text x="351.6" y="220" text-anchor="end" class="wx-t-b wx-halo">Waseda University</text><text x="351.6" y="235" text-anchor="end" class="wx-t-s wx-halo">electromagnetic survey</text></g><g class="wx-st" data-s="2"><line x1="464.2" y1="148" x2="464.2" y2="330" class="wx-guide"/><circle cx="464.2" cy="330" r="6" class="wx-accfill"/><text x="458.2" y="160" text-anchor="end" class="wx-t-b wx-halo">Schoch, Dobecki, West</text><text x="458.2" y="175" text-anchor="end" class="wx-t-s wx-halo">seismic lines; deep weathering, paw anomaly</text></g><g class="wx-st" data-s="2"><line x1="481.6" y1="268" x2="481.6" y2="330" class="wx-guide"/><circle cx="481.6" cy="330" r="6" class="wx-accfill"/><text x="487.6" y="280" text-anchor="start" class="wx-t-b wx-halo">Marzouk and Gharib</text><text x="487.6" y="295" text-anchor="start" class="wx-t-s wx-halo">Egyptian seismic study</text></g><g class="wx-st" data-s="3"><line x1="527.5" y1="98" x2="527.5" y2="330" class="wx-guide"/><polygon points="527.5,322 535.5,330 527.5,338 519.5,330" class="wx-c2"/><text x="521.5" y="110" text-anchor="end" class="wx-t-b wx-halo">NBC: The Mystery of the Sphinx</text><text x="521.5" y="125" text-anchor="end" class="wx-t-s wx-halo">c. 33 million viewers</text></g><g class="wx-st" data-s="4"><line x1="588.2" y1="208" x2="588.2" y2="330" class="wx-guide"/><circle cx="588.2" cy="330" r="6" class="wx-accfill"/><text x="582.2" y="220" text-anchor="end" class="wx-t-b wx-halo">Florida State and Schor</text><text x="582.2" y="235" text-anchor="end" class="wx-t-s wx-halo">remote-sensing survey</text></g><g class="wx-st" data-s="4"><line x1="630.4" y1="58" x2="630.4" y2="330" class="wx-guide"/><circle cx="630.4" cy="330" r="6" class="wx-accfill"/><text x="624.4" y="70" text-anchor="end" class="wx-t-b wx-halo">Test drill: natural cavity</text><text x="624.4" y="85" text-anchor="end" class="wx-t-s wx-halo">further drilling refused</text></g><g class="wx-st" data-s="4"><rect x="636.8" y="324" width="12" height="12" class="wx-c4"/></g><g class="wx-st wx-hide" data-only="5"><rect x="24" y="370" width="320" height="58" rx="8" class="wx-card wx-edge-soft"/><text x="36" y="392" class="wx-t-b">Authorities (on record)</text><text x="36" y="410" class="wx-t-s">"Nor do we try to stop reasonable research."</text><text x="36" y="423" class="wx-t-s">Hawass, NOVA, February 1997</text><rect x="370" y="370" width="326" height="58" rx="8" class="wx-card wx-edge-soft"/><text x="382" y="392" class="wx-t-b wx-t-a">Challengers (claims)</text><text x="382" y="410" class="wx-t-s">independent teams shut out after 1993;</text><text x="382" y="423" class="wx-t-s">permit files never released</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> 1977–1987: SRI International and Waseda University survey the Sphinx with electrical, acoustic and electromagnetic methods.</p><ol class="wx-steplist"><li>1977–1987: SRI International and Waseda University survey the Sphinx with electrical, acoustic and electromagnetic methods.</li><li>1991–1992: Schoch, Dobecki and West&#x27;s seismic survey, the GSA talk, and an Egyptian seismic study.</li><li>1993: NBC&#x27;s The Mystery of the Sphinx takes the older-Sphinx idea to about 33 million viewers.</li><li>1996–1998: Florida State and the Schor Foundation survey; a test drill finds a natural cavity; further drilling is refused.</li><li>The two readings: &#x27;we do not stop reasonable research&#x27; (Hawass, 1997) against claims of exclusion.</li></ol><figcaption>Which studies of the Sphinx enclosure were permitted, what was refused, and when the public argument broke out. <span class="wx-src">Based on: Hawass and Lehner, NOVA Online, 10 February 1997; Dobecki and Schoch 1992; Hawass 1998. Events placed by year; marker positions within a year approximate.</span></figcaption><p class="vh">A timeline from 1975 to 2000. Step 1 shows the SRI International survey of 1977 to 1978 and the Waseda University survey of 1987. Step 2 adds the April 1991 seismic survey by Schoch, Dobecki and West, the October 1991 Geological Society of America talk and the 1992 Egyptian seismic study. Step 3 adds the NBC broadcast of November 1993. Step 4 adds the Florida State and Schor Foundation survey of April 1996 and the 1998 test drilling, which found a natural cavity, with a red square marking the refusal of further drilling. Step 5 adds Hawass&#x27;s 1997 statement that the authorities do not try to stop reasonable research, set against the challengers&#x27; claim of exclusion.</p></figure><p>Dobecki&#x27;s results became famous. He found the floor weathered 1.8–2.4 m deep in front and along the sides, and about half as deep at the rear, which Schoch read as evidence that the front was cut first, long before Khafre. Dobecki also reported an anomaly under the front paws that he thought might be a man-made cavity. Schoch took the redating to the Geological Society of America in October 1991 and debated it at the American Association for the Advancement of Science in February 1992. In November 1993 NBC broadcast The Mystery of the Sphinx, presented by Charlton Heston, to an estimated 33 million viewers. West later won an Emmy for its research.</p><p>In April 1996 Florida State University and the Schor Foundation, led by Joseph Schor, carried out a further remote-sensing survey around the Sphinx and the plateau. In 1998 the Supreme Council of Antiquities allowed a test drilling to see how well the radar could find chambers. The drill hit a natural cavity. The council then refused permission to drill anywhere else.</p></section><section class="wsec" id="sphinx-surveys-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The challengers&#x27; case at its strongest</h3><p>Schoch, West and their supporters, among them Graham Hancock and Robert Bauval, tell this story as one of doors closing. After the NBC film made the older Sphinx a household idea, they say, independent geologists found it hard to return, and later teams worked under tight controls. According to an account sympathetic to them, the 1996 team was under contract with the Supreme Council not to make findings public without official permission. The anomaly under the paws was never opened. Those are claims by participants and supporters; the permit files that would confirm or refute them have not been released.</p><p>Their strongest point needs no claim at all. The officials who decided who could test the Sphinx&#x27;s age, above all Zahi Hawass, then director of the Giza plateau, were also the most public defenders of its conventional date. Hawass wrote in 1998 that the case for a lost civilisation &#x27;rests, ultimately, on angularity&#x27;, meaning the shape of the weathering. A referee who is also a player may call the game fairly. But the other side will never quite believe it.</p><aside class="wcall"><b>On record, off record</b><p>On record: the list of surveys, the 1991 permission, the 1998 test drilling and the refusal to drill again, the limits on seismic blasts, the public statements of Hawass and Lehner. Off record: that West and Schoch were deliberately kept out, that later teams were gagged, that any survey found something that was then suppressed. The first set is documented; the second rests on the testimony of participants and supporters.</p></aside></section><section class="wsec" id="sphinx-surveys-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The authorities&#x27; answer</h3><p>In February 1997 Hawass and Mark Lehner answered questions from the public on the website of the American science series NOVA. Hawass listed the surveys at the Sphinx, SRI, Waseda, Schoch and Dobecki, Marzouk and Gharib, and Florida State, and wrote: &#x27;Nor do we try to stop reasonable research.&#x27; Lehner urged viewers to approach television specials, his own side&#x27;s included, with critical thinking rather than acceptance.</p><p>The Egyptian side also had real reasons for caution. Through the late 1980s and 1990s the Sphinx was losing stone and was under a long restoration campaign; a large piece of its shoulder fell in 1988. Hawass wrote that seismic studies had been shown to be a potential hazard, and that limits were placed on the size of blasts near the statue. Drilling into the bedrock of a crumbling monument is not a small request.</p><p>And on the central question, the record favours the authorities. Independent research was permitted more than once after 1991, including a foreign team in 1996, and the one drilling test allowed in 1998 came back natural. Refusing further drilling may have been over-cautious, but it followed a negative result, not a promising one.</p></section><section class="wsec" id="sphinx-surveys-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>What time and restoration have hidden</h3><p>Some of what could answer the age question is gone or covered. The Sphinx has been patched with masonry since ancient times, and modern restorations added more, so much of the original rock surface of the body cannot now be seen. The raw data from several 1990s surveys have never been published in full, and the anomalies they reported were never excavated. The permit correspondence of the period sits in files no outsider has read.</p><p>That matters beyond the Sphinx. The same decade saw the halt to Rudolf Gantenbrink&#x27;s robot in the Great Pyramid (see The Door in the Great Pyramid), and the same officials controlled both sites. For a public already primed by the Dead Sea Scrolls affair to expect institutions to sit on evidence, a pattern of tight control at Giza looked like a pattern of concealment, whether or not it was one. Much of today&#x27;s online distrust of Egyptology, the suspicion that &#x27;they&#x27; are hiding chambers, rooms of records or older dates, grew from this period. Some of it is unfair. But it was fed by real decisions made behind closed doors, and the way to starve it is to open the files.</p></section><section class="wsec" id="sphinx-surveys-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What would settle it</h3><p>The access question could be settled cheaply. The raw seismic and radar data from 1991, 1992 and 1996 could be placed in an open archive. A new survey could be run by an independent team with a protocol published in advance, including a commitment to drill any strong anomaly. The permit files could be released. None of this requires a new excavation, and all of it would help the Chambers Under the Sphinx and Sphinx Erosion questions too.</p><blockquote class="wpull"><p>Gatekeeping is on the record. A cover-up is not. The cure for both suspicions is the same: open data.</p></blockquote></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">2,500 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Sphinx carved (conventional date, reign of Khafre)</span></li><li class="wtl-study" style="--i:1"><span class="wtl-y">1978 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">SRI International survey around the paws</span></li><li class="wtl-study" style="--i:2"><span class="wtl-y">1987 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Waseda University electromagnetic survey</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">1991 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Schoch, Dobecki and West seismic survey</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">1992 CE</span><span class="wtl-k">Event</span><span class="wtl-t">AAAS debate; Egyptian seismic study</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">1993 CE</span><span class="wtl-k">Event</span><span class="wtl-t">NBC broadcasts The Mystery of the Sphinx</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">1996 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Florida State and Schor Foundation survey</span></li><li class="wtl-event" style="--i:7"><span class="wtl-y">1998 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Test drill finds natural cavity; more refused</span></li></ol><details class="srcs"><summary>Sources for this case (13)</summary><ol><li>Dobecki, T. L., Schoch, R. M. (1992). Seismic investigations in the vicinity of the Great Sphinx of Giza, Egypt. Geoarchaeology 7(6): 527–544. <a href="https://doi.org/10.1002/gea.3340070603" target="_blank" rel="noopener">doi:10.1002/gea.3340070603</a></li><li>Schoch, R. M. (1992). Redating the Great Sphinx of Giza. KMT: A Modern Journal of Ancient Egypt 3(2): 52–59, 66–70.</li><li>Hawass, Z., Lehner, M. (10 February 1997). Responses to viewer questions. NOVA Online, Pyramids: The Inside Story. WGBH/PBS.</li><li>Hawass, Z. (1998). The Secrets of the Sphinx: Restoration Past and Present. American University in Cairo Press, Cairo.</li><li>Hawass, Z., Lehner, M. (1994). The Sphinx: who built it, and why? Archaeology 47(5).</li><li>Lehner, M., Hawass, Z. (2017). Giza and the Pyramids. Thames &amp; Hudson, London.</li><li>Gauri, K. L., Sinai, J. J., Bandyopadhyay, J. K. (1995). Geologic weathering and its implications on the age of the Sphinx. Geoarchaeology 10(2): 119–133. <a href="https://doi.org/10.1002/gea.3340100203" target="_blank" rel="noopener">doi:10.1002/gea.3340100203</a></li><li>NBC (10 November 1993). The Mystery of the Sphinx, presented by Charlton Heston; written by John Anthony West.</li><li>Hancock, G., Bauval, R. (1996). Keeper of Genesis (US title The Message of the Sphinx). Heinemann, London.</li><li>Schoch, R. M., McNally, R. A. (1999). Voices of the Rocks. Harmony Books, New York.</li><li>Wikipedia (accessed 2026). Hall of Records (summary of the 1978–1998 surveys and the 1998 test drilling).</li><li>Billington, D. P. Redating the Sphinx (online history of the West–Schoch fieldwork, 1990–1992).</li><li>Giza-Legacy (undated). 1991–2009 discoveries (account sympathetic to the challengers; used only for their claims about the 1996 survey).</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-sphinx-surveys" data-t="The Sphinx Surveys: Was Independent Research Shut Down?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Sphinx Surveys: Was Independent Research Shut Down?</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-sphinx-surveys</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-gobekli-excavation-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Göbekli Tepe, Urfa.jpg" data-cap="The enclosures of Göbekli Tepe" data-big><figcaption></figcaption></figure><div class="sh-k">Who Controls the Evidence</div><h2 class="sh-t" id="case-gobekli-excavation-st" tabindex="-1">Göbekli Tepe: Why Is So Little of It Dug?</h2><p class="sh-s">The oldest known monumental site on Earth is still mostly underground. Careful science, or a story someone wants kept buried?</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> Excavation at Göbekli Tepe has been deliberately slowed or restricted to keep what lies buried from the public.</p></div><p class="v4-q">Has excavation at Göbekli Tepe been deliberately slowed to keep its secrets buried?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Göbekli Tepe in Turkey holds stone circles raised about 11,600 years ago, before farming.</li><li>Only about a tenth of the mound has been dug, and some say that is deliberate.</li><li>The 2018 construction row was real, and trees on the mound were moved in 2025 after the dig director warned of damage.</li><li>But excavation continued, a dozen sister sites have been opened, and major finds keep being published.</li><li>Leaving most of a site for the future is standard practice; a motive to hide anything has no evidence.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Institutions</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="5" >5</b><span class="ctr-u"> %</span></div><div class="ctr-l">of the mound commonly said to be excavated (estimates up to about a tenth)</div><div class="ctr-c">Clare 2020; NPR 2025</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="800" >800</b><span class="ctr-u"> trees</span></div><div class="ctr-l">olive trees moved off the mound in February 2025</div><div class="ctr-c">Hürriyet Daily News 2025</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="4000" >4,000</b><span class="ctr-u"> m²</span></div><div class="ctr-l">area of the protective roof over the main excavation</div><div class="ctr-c">Hürriyet Daily News 2018</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="20" >20</b><span class="ctr-u"> years</span></div><div class="ctr-l">length of the Doğuş Group sponsorship launched in 2016</div><div class="ctr-c">Doğuş Group 2018</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Excavation at Göbekli Tepe has been deliberately slowed or restricted to keep what lies buried from the public.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Corsetti&#x27;s criticisms of site management have some basis: the 2018 construction row was real, and the trees were moved in 2025 after the excavation head said they threatened buried remains. But no evidence shows a motive to hide anything. Excavation continued after Schmidt, the programme has expanded to a dozen sister sites, and major new finds are published. Slow excavation with most of the mound left for the future is standard practice, and whether roots had caused damage or were a risk is itself disputed.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Guidebooks and museum panels present the slow pace simply as good science. That is largely right, and the site is well published. But the official account has been too smooth about real management failures: construction work archaeologists protested, and trees left on unexcavated ground for years. Admitting those mistakes plainly would have done more to answer the suspicion than dismissing the critics.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Excavation began in 1995 under Klaus Schmidt of the German Archaeological Institute (DAI) with the Şanlıurfa Museum. The main dig exposed Enclosures A to D, and geophysical survey shows more enclosures still buried in a mound about 300 m across.<small>Schmidt 2012; Clare 2020</small></li><li>Only a small share of the roughly 9 ha mound has been excavated; figures of 5 percent to about a tenth are commonly given.<small>Clare 2020; NPR 2025</small></li><li>After Schmidt&#x27;s death in 2014, DAI research continued under Lee Clare, who published a summary of work in 2015–2019. In the 2020s the Istanbul University archaeologist Necmi Karul has led excavation at Göbekli Tepe and Karahan Tepe within the wider Taş Tepeler project.<small>Clare 2020; Hürriyet Daily News 2025</small></li><li>In January 2016 the Doğuş Group launched a 20-year sponsorship with Türkiye&#x27;s Ministry of Culture and Tourism at the World Economic Forum in Davos, funding excavation, a visitor centre and site infrastructure.<small>Doğuş Group 2018</small></li><li>In March 2018 archaeologists including Çiğdem Köksal-Schmidt and Necmi Karul criticised heavy machinery and concrete used around the site during work on a walkway and a protective roof of about 4,000 m²; the ministry denied any damage.<small>Hürriyet Daily News 2018; Bianet 2018</small></li><li>In February 2025 about 800 olive trees on the mound, planted by former landowners before the land was expropriated, were moved and replanted elsewhere to protect buried remains and allow further excavation and survey.<small>Hürriyet Daily News 2025; Türkiye Today 2025</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the olive roots had already damaged buried walls, or were a future risk; Jason Colavito argues an English news report turned a conditional Turkish verb into a past-tense &#x27;began to damage&#x27;.</li><li>Whether the 2017–18 construction work damaged archaeological deposits.</li><li>How fast a site like Göbekli Tepe should be excavated, and how much should be left for future methods and generations.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Most enclosures detected by geophysics have never been opened, so their dates, carvings and contents are unknown.</li><li>The top of the mound was farmed and cleared of stones for generations before 1995, disturbing its upper layers.</li><li>The settlements of the people who built and used the site are only now being mapped.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Archaeologists say the slow pace is deliberate for good reasons, not sinister ones. Every layer must be recorded before it is removed, and excavation destroys the context it records, so leaving most of a site untouched for better future methods is standard practice. Exposed pillars also need shelter and conservation. Lee Clare, who directed DAI work there for years, told NPR that &#x27;you can&#x27;t just bulldoze a site&#x27;. Where the site&#x27;s managers earned criticism is in how they handled it: the 2018 construction row, the tourism branding and trees that stood on unexcavated ground for years.</p><ul><li>Excavation never stopped after Schmidt&#x27;s death; DAI work continued and the Taş Tepeler project has since widened it to a dozen sites.</li><li>New finds, such as the carved chambers of Karahan Tepe, are published, which is the opposite of concealment.</li><li>Leaving parts of a site unexcavated is common practice at major sites worldwide.</li><li>The excavation head moved the olive trees himself, citing the protection of buried remains.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Jimmy Corsetti has campaigned for years that Göbekli Tepe is being under-excavated. He argues that after Klaus Schmidt died, and after the Doğuş Group&#x27;s sponsorship was launched at the World Economic Forum, digging slowed while tourist infrastructure went up; that hundreds of olive trees planted on the mound blocked excavation and threatened the ruins; and that archaeologists who dismissed him were wrong. When about 800 trees were moved in February 2025 he declared himself vindicated, and in August 2026 he said Turkish authorities had confirmed root damage and that he held internal ministry documents.</p><ul><li>After 30 years only a small fraction of the world&#x27;s oldest known monumental site has been dug.</li><li>The trees were real, numbered in the hundreds, and were removed in 2025 partly to allow excavation.</li><li>Archaeologists themselves protested construction damage at the site in 2018.</li><li>A sponsorship launched at Davos gave the site a commercial, tourism-led face.</li></ul><div class="face-s"><b>Its strongest point</b><p>He was right about something concrete. Hundreds of olive trees stood on unexcavated parts of the mound, the excavation head said they had to go to protect the remains and allow digging, and they were moved in 2025 after years of public pressure.</p></div><p class="face-cr"><b>Credit</b> Jimmy Corsetti (Bright Insight; The Joe Rogan Experience #2231, November 2024, with Dan Richards; Matt Beall Limitless #25, October 2024; posts and videos 2024–2026)</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Publication of the site&#x27;s excavation and management plans, with the area excavated each season, for public review.</li><li>Release of the ministry documents Corsetti says he holds, alongside the ministry&#x27;s own assessments of the trees and roots.</li><li>An independent condition survey of the ground where trees stood and where the 2017–18 construction took place.</li><li>Excavation and prompt publication of one or more of the enclosures detected by geophysics.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,186 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Göbekli Tepe: Why Is So Little of It Dug?"><button type="button" class="wtoc-i" data-go="gobekli-excavation-s1">Pillars buried in dirt</button><button type="button" class="wtoc-i" data-go="gobekli-excavation-s2">What has actually been dug</button><button type="button" class="wtoc-i" data-go="gobekli-excavation-s3">Corsetti&#x27;s case at its strongest</button><button type="button" class="wtoc-i" data-go="gobekli-excavation-s4">Why archaeologists dig slowly</button><button type="button" class="wtoc-i" data-go="gobekli-excavation-s5">The trees, and what they did</button><button type="button" class="wtoc-i" data-go="gobekli-excavation-s6">What time has hidden</button><button type="button" class="wtoc-i" data-go="gobekli-excavation-s7">What would settle it</button></nav></div><section class="wsec" id="gobekli-excavation-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Pillars buried in dirt</h3><p>Göbekli Tepe is the kind of place that rewrites textbooks. On a hilltop in south-eastern Türkiye, people who had not yet invented pottery raised rings of carved limestone pillars, some over five metres tall, from about 9600 BCE. Since Klaus Schmidt recognised what they were in 1994, the site has become a symbol of how much we still do not know about the end of the Ice Age. It has also become a symbol of something else: a fight over who gets to dig, how fast, and why.</p><p>No one has pressed that fight harder than Jimmy Corsetti of Bright Insight. For years he has told his audience, on his channel and on shows such as The Joe Rogan Experience, that the world&#x27;s oldest known monumental site is being left in the ground. &#x27;We&#x27;re talking about pillars buried in dirt. It&#x27;s 2024. Don&#x27;t tell me we don&#x27;t have the technology!&#x27; he said, as quoted by NPR. He has accused archaeologists of slowing the work to protect the mystery and the tourist trade.</p><blockquote class="wpull"><p>How much of a site should you dig? Archaeology&#x27;s honest answer is: less than you want to.</p></blockquote></section><section class="wsec" id="gobekli-excavation-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What has actually been dug</h3><p>The facts are not in dispute. The artificial mound is about 300 m across and covers some 9 ha. Schmidt&#x27;s teams, from the German Archaeological Institute and the Şanlıurfa Museum, opened a main excavation area that exposed four great round enclosures, A to D, and smaller later buildings. Geophysical survey shows more enclosures still buried. Estimates of how much has been excavated range from about 5 percent to about a tenth.</p><figure class="wx wx--static" id="gobekli-excavation-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">How much of Göbekli Tepe has been dug</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How
