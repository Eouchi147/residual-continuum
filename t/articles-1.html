<use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> The US government holds recovered craft of non-human origin.</p></div><p class="v4-q">Does the US government hold recovered craft of non-human origin?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Since 2017 the US government has admitted studying unidentified aerial phenomena and released Navy sensor videos.</li><li>A 2021 assessment could explain only one of 144 reports; the Pentagon&#x27;s case list has passed 2,000.</li><li>In 2023 a former intelligence officer testified under oath to a programme retrieving crashed craft, from what others had told him.</li><li>No craft, material, sample or programme document has been made public, and official reviews found nothing non-human.</li><li>Some sightings are unexplained and secrecy is real; recovered craft await evidence.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Institutions</span><span class="thr">Physics</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="144" >144</b><span class="ctr-u"> reports</span></div><div class="ctr-l">reviewed in the 2021 assessment, only one explained</div><div class="ctr-c">ODNI 2021</div></div><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="2000" >2,000</b><span class="ctr-u"> cases</span></div><div class="ctr-l">in AARO&#x27;s caseload by February 2026</div><div class="ctr-c">DefenseScoop 2026</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="6" >6</b><span class="ctr-u"> releases</span></div><div class="ctr-l">of Pentagon UAP files, 8 May to 18 September 2026</div><div class="ctr-c">CBS News 2026</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="0" >0</b><span class="ctr-u"> craft</span></div><div class="ctr-l">made available for independent examination</div><div class="ctr-c">AARO 2024; CBS News 2026</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The US government holds recovered craft of non-human origin.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The claim rests on sworn but mostly secondhand testimony. No craft, material, sample or programme document has been made public, and the government&#x27;s own reviews in 2024, and six releases of files in 2026, show unresolved sightings but nothing non-human. Some sensor cases are genuinely unexplained, and the government has hidden studies and spread false stories, so suspicion is reasonable. But unexplained sightings and official secrecy are not evidence of recovered craft. The testable evidence has not appeared.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Official statements say plainly that there is no evidence of alien technology, and on the evidence made public that is fair. But they have often sounded more certain than the record allows: many cases remain unresolved, the Pentagon hid AATIP for years, and its own investigators found that officials had seeded false stories. A calmer admission of what is unknown would have done more for trust than repeated flat denials.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>On 16 December 2017 The New York Times revealed a secret Pentagon study of unidentified aerial phenomena, the Advanced Aerospace Threat Identification Program (AATIP), funded from 2007 to 2012 at the urging of Senator Harry Reid. The Pentagon later released three Navy sensor videos, in April 2020.<small>Cooper, Blumenthal and Kean 2017; DoD 2020</small></li><li>A June 2021 intelligence assessment reviewed 144 reports from US government sources and could explain only one. In 2022 the Pentagon set up the All-domain Anomaly Resolution Office (AARO), whose caseload passed 2,000 by February 2026, about 1,000 of them lacking enough data to analyse.<small>ODNI 2021; DefenseScoop 2026</small></li><li>On 26 July 2023 the former intelligence officer David Grusch told a House subcommittee under oath that he had been informed of a decades-long programme to retrieve and reverse-engineer crashed craft, and that the US held non-human biologics. He said his information came from interviews with other people and that he had been denied access to the programme.<small>US House 2023</small></li><li>In March 2024 AARO&#x27;s historical report found no verifiable evidence that the US government had ever possessed extraterrestrial technology or that any hidden programme had reverse-engineered it.<small>AARO 2024</small></li><li>In June 2025 the Wall Street Journal reported AARO&#x27;s finding that for decades some Air Force personnel had been told, as a hazing ritual, that they were joining a secret alien-technology programme, and that officials had at times encouraged UFO stories to protect classified aircraft.<small>Schectman and Viswanatha 2025</small></li><li>After President Trump ordered the release of government files on 19 February 2026, the Pentagon published six batches between 8 May and 18 September 2026. It described them as unresolved cases and said they did not provide confirmed evidence of extraterrestrial life.<small>Al Jazeera 2026; CBS News 2026</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether Grusch&#x27;s sources describe a real crash-retrieval programme, misunderstood classified human technology, or stories spread inside the military, including hoaxes like the one the Wall Street Journal reported.</li><li>Whether AARO&#x27;s 2024 review had access to every relevant programme, as its critics in Congress doubt.</li><li>What the best unexplained sensor cases, such as the 2004 Nimitz encounter and the orb filmed off Yemen in October 2024, actually show.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Any craft, material, biological sample or programme document that has been independently examined and made public.</li><li>The classified testimony Grusch and others say they have given, and the names of the programmes they refer to.</li><li>Raw sensor data for the most puzzling cases, most of which remains classified or was never recorded in a usable form.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>The government&#x27;s investigators and most scientists hold that unexplained is not the same as non-human. AARO and NASA&#x27;s 2023 independent study found no evidence that any UAP is extraterrestrial, and AARO&#x27;s 2024 historical report traced crash-retrieval stories to real classified programmes, misunderstandings and hoaxes. Former AARO director Sean Kirkpatrick argued that the allegations arose from unauthorised glimpses of legitimate human programmes. Skeptics such as Mick West point out that most famous videos have ordinary explanations, and that five months of released files in 2026 contained no craft, bodies or material. They accept that some cases remain genuinely unexplained.</p><ul><li>Grusch&#x27;s key claims are secondhand, and no document or object supporting them has been produced in public.</li><li>The government has admitted real secrets around UAP, including AATIP and deliberate disinformation, which explains distrust without implying craft.</li><li>Current AARO director Jon Kosloski has said openly that some cases are true anomalies no one understands.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>The disclosure advocates argue that the pattern of the last nine years points one way. A secret UAP study was hidden for years. A decorated intelligence officer testified under oath to a crash-retrieval programme and says he has named names in classified settings. Pilots and sailors have described objects outperforming known aircraft, and Congress was shown a 2024 video of a Hellfire missile striking an orb that kept flying. Senators Schumer and Rounds wrote legislation referring to technologies of unknown origin and biological evidence of non-human intelligence. The advocates see AARO&#x27;s denials as the institution protecting itself.</p><ul><li>Grusch&#x27;s reprisal complaint was found credible and urgent by the Intelligence Community Inspector General in 2022, before he went public.</li><li>The executive branch has, since 2026, created new channels to let insiders speak despite secrecy agreements.</li><li>Congressional leaders of both parties have written non-human intelligence into proposed law.</li></ul><div class="face-s"><b>Its strongest point</b><p>Named officials have testified under oath, at personal risk, that such a programme exists, and the government has previously hidden a UAP study and seeded false UFO stories. That history gives their testimony real weight as a reason to keep investigating.</p></div><p class="face-cr"><b>Credit</b> David Grusch (former intelligence officer); Luis Elizondo (former Pentagon official, author of Imminent, 2024); Christopher Mellon (former deputy assistant secretary of defense for intelligence); Representatives Tim Burchett, Anna Paulina Luna and Eric Burlison</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Public presentation of a recovered object or material, with independent laboratories allowed to test it.</li><li>Release, even redacted, of the classified testimony and programme names Grusch and others say they have given to Congress and the inspector general.</li><li>An independent review with access to every special access programme, reporting publicly on whether any holds non-human material.</li><li>Full raw sensor data from the best-documented cases, such as the 2004 Nimitz encounter, for open scientific analysis.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">6 min read · 1,241 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of UAP Disclosure: What the Government Has Admitted"><button type="button" class="wtoc-i" data-go="uap-disclosure-s1">The day the Pentagon admitted it was looking</button><button type="button" class="wtoc-i" data-go="uap-disclosure-s2">On the record</button><button type="button" class="wtoc-i" data-go="uap-disclosure-s3">Under oath but off the record</button><button type="button" class="wtoc-i" data-go="uap-disclosure-s4">The 2026 disclosure push</button><button type="button" class="wtoc-i" data-go="uap-disclosure-s5">The two readings</button><button type="button" class="wtoc-i" data-go="uap-disclosure-s6">Why it matters for the mysteries</button><button type="button" class="wtoc-i" data-go="uap-disclosure-s7">What would settle it</button></nav></div><section class="wsec" id="uap-disclosure-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The day the Pentagon admitted it was looking</h3><p>For most of the 20th century, a serious person could not say &#x27;UFO&#x27; in Washington without a smile. That changed on 16 December 2017, when The New York Times reported that the Pentagon had quietly run a study of unidentified aerial phenomena, with money that Senator Harry Reid had helped secure. The story came with videos from Navy fighter jets, grainy infrared images of objects the pilots could not identify. In 2020 the Pentagon officially released three of them.</p><p>Nine years later the subject has sworn testimony, new laws, a Pentagon office, a presidential order and six releases of files. It also has a claim that would be the most important news in human history if true: that the United States has recovered craft that were not made by human beings. This case separates what is on the record from what is still only said.</p><blockquote class="wpull"><p>Nine years of disclosure have produced hearings, laws and files. They have not yet produced a craft.</p></blockquote></section><section class="wsec" id="uap-disclosure-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>On the record</h3><figure class="wx wx--static" id="uap-disclosure-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Nine years of disclosure</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Nine years of disclosure"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 602" class="wx-svg" role="img" aria-labelledby="uap-disclosure-f1-t"><title id="uap-disclosure-f1-t">Vertical timeline of UAP disclosure from December 2017 to September 2026, marking official documents and actions separately from testimony</title><text x="24" y="28" class="wx-t-cap">From a secret study to six file releases, 2017–2026</text><circle cx="400" cy="50" r="6" class="wx-accfill"/><text x="412" y="54" class="wx-t-s">official document or action</text><polygon points="620,42 628,50 620,58 612,50" class="wx-c5"/><text x="634" y="54" class="wx-t-s">testimony</text><line x1="170" y1="72" x2="170" y2="578" class="wx-dim"/><line x1="24" y1="374" x2="696" y2="374" class="wx-guide"/><text x="696" y="370" text-anchor="end" class="wx-t-s">the 2026 disclosure push</text><g class="wx-pop" style="--d:1"><circle cx="170" cy="88" r="6" class="wx-accfill"/><text x="150" y="92" text-anchor="end" class="wx-t-n">Dec 2017</text><text x="190" y="92" class="wx-t">NYT reveals the Pentagon's secret AATIP study</text></g><g class="wx-pop" style="--d:2"><circle cx="170" cy="122" r="6" class="wx-accfill"/><text x="150" y="126" text-anchor="end" class="wx-t-n">Apr 2020</text><text x="190" y="126" class="wx-t">Pentagon releases three Navy sensor videos</text></g><g class="wx-pop" style="--d:3"><circle cx="170" cy="156" r="6" class="wx-accfill"/><text x="150" y="160" text-anchor="end" class="wx-t-n">Jun 2021</text><text x="190" y="160" class="wx-t">ODNI report: 144 cases, 1 explained</text></g><g class="wx-pop" style="--d:4"><circle cx="170" cy="190" r="6" class="wx-accfill"/><text x="150" y="194" text-anchor="end" class="wx-t-n">Jul 2022</text><text x="190" y="194" class="wx-t">AARO set up to investigate UAP</text></g><g class="wx-pop" style="--d:5"><polygon points="170,216 178,224 170,232 162,224" class="wx-c5"/><text x="150" y="228" text-anchor="end" class="wx-t-n">26 Jul 2023</text><text x="190" y="228" class="wx-t">House hearing: Grusch testifies under oath</text></g><g class="wx-pop" style="--d:6"><circle cx="170" cy="258" r="6" class="wx-accfill"/><text x="150" y="262" text-anchor="end" class="wx-t-n">Mar 2024</text><text x="190" y="262" class="wx-t">AARO history report: no evidence of alien craft</text></g><g class="wx-pop" style="--d:7"><polygon points="170,284 178,292 170,300 162,292" class="wx-c5"/><text x="150" y="296" text-anchor="end" class="wx-t-n">13 Nov 2024</text><text x="190" y="296" class="wx-t">House hearing: Elizondo, Gallaudet and others</text></g><g class="wx-pop" style="--d:8"><circle cx="170" cy="326" r="6" class="wx-accfill"/><text x="150" y="330" text-anchor="end" class="wx-t-n">Jun 2025</text><text x="190" y="330" class="wx-t">WSJ: officials seeded UFO myths, a hazing hoax</text></g><g class="wx-pop" style="--d:9"><polygon points="170,352 178,360 170,368 162,360" class="wx-c5"/><text x="150" y="364" text-anchor="end" class="wx-t-n">9 Sep 2025</text><text x="190" y="364" class="wx-t">House task force hearing; Yemen orb video</text></g><g class="wx-pop" style="--d:10"><circle cx="170" cy="394" r="6" class="wx-accfill"/><text x="150" y="398" text-anchor="end" class="wx-t-n">19 Feb 2026</text><text x="190" y="398" class="wx-t">Trump orders release of government UFO files</text></g><g class="wx-pop" style="--d:11"><circle cx="170" cy="428" r="6" class="wx-accfill"/><text x="150" y="432" text-anchor="end" class="wx-t-n">8 May 2026</text><text x="190" y="432" class="wx-t">First of six Pentagon file releases</text></g><g class="wx-pop" style="--d:12"><circle cx="170" cy="462" r="6" class="wx-accfill"/><text x="150" y="466" text-anchor="end" class="wx-t-n">16 Jun 2026</text><text x="190" y="466" class="wx-t">New interagency UAP Governance Board meets</text></g><g class="wx-pop" style="--d:13"><circle cx="170" cy="496" r="6" class="wx-accfill"/><text x="150" y="500" text-anchor="end" class="wx-t-n">22 Jul 2026</text><text x="190" y="500" class="wx-t">House adopts UAP Disclosure Act amendment</text></g><g class="wx-pop" style="--d:14"><circle cx="170" cy="530" r="6" class="wx-accfill"/><text x="150" y="534" text-anchor="end" class="wx-t-n">31 Jul 2026</text><text x="190" y="534" class="wx-t">ODNI lets insiders disclose despite NDAs</text></g><g class="wx-pop" style="--d:15"><circle cx="170" cy="564" r="6" class="wx-accfill"/><text x="150" y="568" text-anchor="end" class="wx-t-n">18 Sep 2026</text><text x="190" y="568" class="wx-t">Sixth release: 71 files, no craft or bodies</text></g></svg></div></div><figcaption>Key dated steps from the 2017 revelation of AATIP to the sixth file release of 18 September 2026, with testimony marked separately from official documents and actions. <span class="wx-src">Based on: Cooper, Blumenthal and Kean 2017; ODNI 2021; US House 2023; AARO 2024; Schectman and Viswanatha 2025; DefenseScoop 2025 and 2026; Al Jazeera 2026; DLA Piper 2026; CBS News 2026.</span></figcaption><p class="vh">A vertical timeline with fifteen dated entries. Circles mark official documents or actions and diamonds mark testimony. December 2017, the New York Times reveals the Pentagon&#x27;s secret AATIP study. April 2020, the Pentagon releases three Navy sensor videos. June 2021, an intelligence report reviews 144 cases and explains one. July 2022, AARO is set up. 26 July 2023, Grusch testifies under oath. March 2024, AARO&#x27;s historical report finds no evidence of alien craft. 13 November 2024, a House hearing with Elizondo, Gallaudet and others. June 2025, the Wall Street Journal reports that officials seeded UFO myths and ran a hazing hoax. 9 September 2025, a House task force hearing shows a Yemen orb video. Then the 2026 disclosure push: 19 February, Trump orders release of UFO files; 8 May, the first of six file releases; 16 June, a new interagency governance board meets; 22 July, the House adopts a UAP Disclosure Act amendment; 31 July, intelligence guidance lets insiders disclose despite secrecy agreements; 18 September, the sixth release of 71 files, with no craft or bodies.</p></figure><p>The documented steps are these. In June 2021 the Director of National Intelligence reported on 144 sightings by US government sources and could explain one, a deflating balloon. In 2022 the Pentagon created AARO, which by February 2026 had more than 2,000 cases, about half lacking enough data to analyse. NASA&#x27;s independent study team reported in September 2023 that it had found no evidence of extraterrestrial origin, while calling for better data. AARO&#x27;s director since 2024, Jon Kosloski, has said publicly that a few cases are true anomalies that no one yet understands.</p><p>The government has also admitted uncomfortable things. In June 2025 the Wall Street Journal reported AARO&#x27;s finding that for decades some new Air Force commanders had been told, as a hazing ritual, that they were joining a secret programme to exploit alien technology, and that officers had at times encouraged UFO stories to hide classified aircraft. The Pentagon said a second volume of its historical report would cover these findings.</p></section><section class="wsec" id="uap-disclosure-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Under oath but off the record</h3><p>The claim of recovered craft entered the congressional record on 26 July 2023. David Grusch, a former Air Force intelligence officer who had worked on a UAP task force, told a House subcommittee: &#x27;I was informed in the course of my official duties of a multi-decade UAP crash retrieval and reverse-engineering program to which I was denied access.&#x27; He said the United States held non-human biologics, and that his information came from interviews with dozens of people over several years. The former Navy pilots David Fravor and Ryan Graves described encounters with objects they could not explain.</p><aside class="wcall"><b>How to read testimony</b><p>Testimony under oath is serious: lying to Congress is a crime. But Grusch&#x27;s central claims are secondhand, and he has said the details can only be given in classified settings. Being credible about what others told him is not the same as documenting what exists. The Intelligence Community Inspector General found his complaint of reprisal credible and urgent in 2022; that finding concerned his treatment, not the truth of his claims about craft.</p></aside><p>Later hearings added more voices. On 13 November 2024, Luis Elizondo, the retired rear admiral Tim Gallaudet and others testified before the House Oversight Committee. On 9 September 2025 a new House task force heard military veterans describe encounters, and Representative Eric Burlison played a video of a US drone firing a Hellfire missile at a glowing orb off Yemen in October 2024; the object appeared to be hit and kept going. The video is real; what the orb was remains unknown.</p></section><section class="wsec" id="uap-disclosure-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The 2026 disclosure push</h3><p>The pace changed in 2026. On 19 February, after former President Barack Obama made remarks about aliens on a podcast and then clarified that he had seen no evidence of contact, President Trump posted that he would direct the Secretary of War and other agencies to begin identifying and releasing government files related to alien and extraterrestrial life. On 1 May the Pentagon launched a task force it calls PURSUE, and on 8 May it published the first batch of files. Five more followed, on 22 May, 12 June, 10 July, 7 August and 18 September.</p><p>An interagency UAP Governance Board, set up by the intelligence community, the FBI and the Pentagon, met for the first time on 16 June, and a science advisory council led by the Harvard astrophysicist Avi Loeb was announced to advise it. On 22 July the House adopted an amendment adding a UAP Disclosure Act to its defence bill for 2027. On 31 July the Director of National Intelligence issued guidance letting current and former staff and contractors disclose UAP information to designated officials despite their secrecy agreements.</p><aside class="wcall"><b>Fresh from the field</b><p>The sixth release, on 18 September 2026, contained 71 files, mostly from the Defense Department, dated from 1952 to 2025. They included videos, a study of injuries attributed to anomalous encounters, and 37 technical reports on topics such as warp drives and antigravity from a Defense Intelligence Agency programme of 2008–2012. The Pentagon noted that those reports should not be read as validating the concepts. As of late September 2026 no release had included a craft, body or material.</p></aside></section><section class="wsec" id="uap-disclosure-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The two readings</h3><figure class="wx wx--steps" id="uap-disclosure-f2" data-n="4"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">The evidence ladder</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The evidence ladder"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" class="wx-svg" role="img" aria-labelledby="uap-disclosure-f2-t"><title id="uap-disclosure-f2-t">An evidence ladder for the claim that the US holds non-human craft: videos and pilot reports, official reviews and sworn testimony exist, while the top rung, testable craft, material or documents, is missing</title><text x="24" y="28" class="wx-t-cap">Climbing the evidence ladder for recovered craft</text><line x1="80" y1="70" x2="80" y2="390" class="wx-bold"/><line x1="240" y1="70" x2="240" y2="390" class="wx-bold"/><g class="wx-st" data-s="1"><rect x="80" y="332" width="160" height="16" rx="3" class="wx-accfill"/><text x="270" y="334" class="wx-t-b">Sensor videos and pilot reports</text><text x="270" y="351" class="wx-t-s">On record: real, many still unexplained</text><text x="270" y="365" class="wx-t-s">not evidence of origin</text></g><g class="wx-st" data-s="2"><rect x="80" y="254" width="160" height="16" rx="3" class="wx-accfill"/><text x="270" y="256" class="wx-t-b">Official reviews</text><text x="270" y="273" class="wx-t-s">On record: AARO 2024 and the 2026 releases</text><text x="270" y="287" class="wx-t-s">find no confirmed non-human craft</text></g><g class="wx-st" data-s="3"><rect x="80" y="176" width="160" height="16" rx="3" class="wx-c5"/><text x="270" y="178" class="wx-t-b">Sworn testimony</text><text x="270" y="195" class="wx-t-s">Off record: Grusch and others, mostly</text><text x="270" y="209" class="wx-t-s">secondhand, no documents made public</text></g><g class="wx-st" data-s="4"><rect x="80" y="98" width="160" height="16" rx="3" class="wx-dash"/><text x="160" y="110" text-anchor="middle" class="wx-t-s">?</text><text x="270" y="100" class="wx-t-b wx-t-a">Craft, material or documents</text><text x="270" y="117" class="wx-t-s">Missing: nothing made public</text><text x="270" y="131" class="wx-t-s">that could be independently tested</text></g><text x="24" y="412" class="wx-t-s">Bottom to top: evidence that bears ever more directly on the claim</text><text x="160" y="62" text-anchor="middle" class="wx-t-s">what would settle it</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 4.</b> Sensor videos and pilot reports: on record, real, and not evidence of origin.</p><ol class="wx-steplist"><li>Sensor videos and pilot reports: on record, real, and not evidence of origin.</li><li>Official reviews: AARO&#x27;s 2024 report and the 2026 releases find no confirmed non-human craft.</li><li>Sworn testimony: serious, but mostly secondhand and undocumented in public.</li><li>The rung that would settle it, testable craft, material or documents, is still empty.</li></ol><figcaption>The kinds of evidence that bear on the claim of recovered craft, from least to most direct. The top rung is empty. <span class="wx-src">Based on: AARO 2024; US House 2023; CBS News 2026. Ladder is a conceptual diagram.</span></figcaption><p class="vh">A ladder with four rungs, added one per step. Bottom rung, filled: sensor videos and pilot reports, on record, real and many still unexplained, but not evidence of origin. Second rung, filled: official reviews, on record, AARO in 2024 and the 2026 releases, which find no confirmed non-human craft. Third rung, in a different colour: sworn testimony, off record, Grusch and others, mostly secondhand, with no documents made public. Top rung, dashed and marked with a question mark: craft, material or documents that could be independently tested, missing, nothing made public.</p></figure><p>The advocates, Grusch, Elizondo, the former defence official Christopher Mellon and members of Congress such as Tim Burchett and Anna Paulina Luna, argue that the direction of travel is unmistakable. A secret study was hidden; officers have testified under oath; Senate leaders of both parties drafted legislation in 2023 referring to technologies of unknown origin and biological evidence of non-human intelligence; and the executive branch has now built channels for insiders to talk. In their view AARO&#x27;s denials are an institution protecting itself.</p><p>The investigators and most scientists answer that all of this is consistent with a simpler picture: real secret human technology, poor sensor data, stories passed along inside the military, and at least one deliberate hoax. Kirkpatrick, AARO&#x27;s first director, has argued that the retrieval stories grew from unauthorised glimpses of legitimate programmes. Skeptical analysts note that the 2026 releases, which critics such as Jason Colavito said largely repeated material already public, contained no craft, bodies or material.</p></section><section class="wsec" id="uap-disclosure-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Why it matters for the mysteries</h3><p>UAP disclosure is the modern version of every question on this site: what does the institution know, what is it hiding, and what does the evidence actually show? The record here is mixed in an instructive way. The government did hide a UAP study, and some of its own officers did spread false stories, so public distrust has real roots. But the same record shows that when files are finally opened, the claims of hidden craft have not been in them.</p><p>The honest position is patient. Genuinely unexplained sightings exist and deserve better sensors and open science. The claim of recovered non-human craft deserves exactly one kind of answer: something that can be examined. Until it appears, sworn testimony is a reason to keep asking, not a reason to conclude.</p><blockquote class="wpull"><p>Sworn testimony is a reason to keep asking, not a reason to conclude.</p></blockquote></section><section class="wsec" id="uap-disclosure-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle it</h3><p>One object would do it: a piece of recovered material or a craft, presented publicly with a documented history and tested by independent laboratories. Short of that, the release of the classified testimony and programme names that Grusch and others say they have provided, an independent review with access to every special access programme, and raw sensor data from the best cases would all move the question. With the new disclosure channels created in 2026, insiders who say they know have a legal path to speak. If the claim is true, the next year or two should show it.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-find" style="--i:0"><span class="wtl-y">2017 CE</span><span class="wtl-k">Found</span><span class="wtl-t">New York Times reveals AATIP</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">2020 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Pentagon releases three Navy videos</span></li><li class="wtl-study" style="--i:2"><span class="wtl-y">2021 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Intelligence assessment of 144 reports</span></li><li class="wtl-build" style="--i:3"><span class="wtl-y">2022 CE</span><span class="wtl-k">Built</span><span class="wtl-t">AARO established</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">2023 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Grusch testifies under oath</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">2024 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">AARO historical report finds no evidence</span></li><li class="wtl-event" style="--i:6"><span class="wtl-y">2025 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Hazing hoax reported; new House hearing</span></li><li class="wtl-event" style="--i:7"><span class="wtl-y">2026 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Presidential order and six file releases</span></li></ol><details class="srcs"><summary>Sources for this case (14)</summary><ol><li>Cooper, H., Blumenthal, R. and Kean, L. (16 December 2017). Glowing auras and &#x27;black money&#x27;: the Pentagon&#x27;s mysterious U.F.O. program. The New York Times.</li><li>Office of the Director of National Intelligence (25 June 2021). Preliminary Assessment: Unidentified Aerial Phenomena.</li><li>US House of Representatives, Committee on Oversight and Accountability, Subcommittee on National Security, the Border, and Foreign Affairs (26 July 2023). Unidentified Anomalous Phenomena: Implications on National Security, Public Safety, and Government Transparency. Hearing, 118th Congress.</li><li>NASA (14 September 2023). Unidentified Anomalous Phenomena Independent Study Team Report.</li><li>All-domain Anomaly Resolution Office (8 March 2024). Report on the Historical Record of U.S. Government Involvement with Unidentified Anomalous Phenomena (UAP), Volume I. US Department of Defense.</li><li>Kirkpatrick, S. (2024). Here&#x27;s what I learned as the U.S. government&#x27;s UFO hunter. Scientific American.</li><li>Schectman, J. and Viswanatha, A. (June 2025). The Pentagon disinformation that fueled America&#x27;s UFO mythology. The Wall Street Journal.</li><li>DefenseScoop (9 September 2025). Military whistleblowers share new evidence of alleged UAP at transparency hearing.</li><li>DefenseScoop (25 February 2026). Hegseth doubles-down on Trump&#x27;s UAP disclosure promise as AARO&#x27;s caseload exceeds 2,000.</li><li>Al Jazeera (20 February 2026). Trump orders Pentagon, federal agencies to release files on UFOs and aliens.</li><li>DefenseScoop (17 June 2026). New science advisory council forms to help US government &#x27;resolve the UAP mystery&#x27;.</li><li>DLA Piper (August 2026). ODNI issues preliminary guidance on disclosure of unidentified anomalous phenomena (guidance dated 31 July 2026).</li><li>Becket, S. (18 September 2026). Pentagon releases more UFO files, including documents on secretive military program. CBS News.</li><li>Elizondo, L. (2024). Imminent: Inside the Pentagon&#x27;s Hunt for UFOs. William Morrow, New York.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-uap-disclosure" data-t="UAP Disclosure: What the Government Has Admitted"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>UAP Disclosure: What the Government Has Admitted</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-uap-disclosure</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-ice-age-signs-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Panel de manos de la cueva del Castillo.jpg" data-cap="Hand stencils and red disks, Panel of Hands, El Castillo cave, Spain" data-big><figcaption></figcaption></figure><div class="sh-k">Signs Across the World</div><h2 class="sh-t" id="case-ice-age-signs-st" tabindex="-1">The First Signs: Ice Age Europe&#x27;s 32 Symbols</h2><p class="sh-s">Beside the famous bison and horses, Ice Age artists painted the same few dots, lines and shapes again and again for 30,000 years.</p><div class="sh-v"><span class="vstamp vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><p class="sh-claim"><b>What the stamp rates:</b> Ice Age Europe&#x27;s geometric signs were a shared, meaningful and deliberately transmitted system of conventions, not random doodles.</p></div><p class="v4-q">Were Ice Age Europe&#x27;s geometric signs a shared code or random doodles?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>In Ice Age caves across Europe, geometric signs outnumber pictures of animals two to one.</li><li>Across 367 sites, only about 32 sign types repeat for some 30,000 years.</li><li>Two-thirds were already in use in the earliest phase, about 40,000 years ago.</li><li>A small repertoire, kept so long and placed so carefully, is very hard to explain by chance.</li><li>A shared, learned system is strongly supported; what the signs meant is unknown.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Texts and scripts</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="32" >32</b><span class="ctr-u"> sign types</span></div><div class="ctr-l">recurring across Ice Age Europe</div><div class="ctr-c">von Petzinger 2016</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="367" >367</b><span class="ctr-u"> sites</span></div><div class="ctr-l">in the European database</div><div class="ctr-c">von Petzinger 2016</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="30000" >30,000</b><span class="ctr-u"> years</span></div><div class="ctr-l">of continuous use</div><div class="ctr-c">von Petzinger 2016</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="52" >52</b><span class="ctr-u"> caves</span></div><div class="ctr-l">visited in person, 2013–2014</div><div class="ctr-c">von Petzinger, TED Ideas 2016</div></div><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="40800" >40,800</b><span class="ctr-u"> years</span></div><div class="ctr-l">minimum age of the El Castillo red disk</div><div class="ctr-c">Pike et al. 2012</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Ice Age Europe&#x27;s geometric signs were a shared, meaningful and deliberately transmitted system of conventions, not random doodles.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">A small repertoire, long persistence of individual signs, regional preferences and careful placement are very hard to explain by chance, and specialists broadly agree the signs were intentional and learned. That supports shared, meaningful and transmitted. What remains unknown is what they meant, whether meanings stayed fixed, and whether they formed one continental code or many local ones. The rating covers the system, not any particular reading of it; a claimed decipherment would rate far lower.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 3 of 6, leaning one way"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>leaning one way</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Most textbooks and museum labels give the signs a line, calling them &#x27;abstract&#x27; or &#x27;enigmatic&#x27;, and devote the space to the animals. That is underconfident: the signs outnumber the animals and show strong, measurable patterns. On meaning, textbooks are rightly cautious, and popular articles that call the signs &#x27;the first writing&#x27; go well beyond the evidence.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Geometric signs outnumber images of animals and people in Ice Age European caves by at least two to one.<small>von Petzinger 2016</small></li><li>Across 367 Upper Palaeolithic rock-art sites in Europe, Genevieve von Petzinger&#x27;s database records only about 32 sign types recurring over some 30,000 years.<small>von Petzinger 2016; TED 2015</small></li><li>About two-thirds of those sign types were already in use in the earliest phase of the record, the Aurignacian, roughly 40,000–30,000 years ago.<small>von Petzinger 2016; von Petzinger and Nowell 2014</small></li><li>Some signs are tightly restricted: tectiforms appear only about 17,000–13,000 years ago, and at only nine cave sites.<small>von Petzinger, TED Ideas 2016</small></li><li>Europe&#x27;s oldest dated cave painting is a red disk at El Castillo, older than 40,800 years by uranium-series dating of the calcite that formed over it.<small>Pike et al. 2012</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the signs carried specific meanings (names, counts, messages) or looser, changing associations.</li><li>Whether many of the forms began as &#x27;entoptic&#x27; images produced by the human visual system in altered states (Lewis-Williams and Dowson 1988), or as purely cultural inventions.</li><li>How many sign types there really are: categories are defined by modern researchers, so lumping or splitting changes the count (26 in von Petzinger&#x27;s earlier French study, 32 across Europe).</li><li>Whether a few signs, such as the ladder-shaped sign at La Pasiega dated to more than 64,000 years, were made by Neanderthals.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Signs painted or carved on wood, bark, hide or skin do not survive; the caves are a protected, unrepresentative sample.</li><li>Open-air rock surfaces weather away, and Ice Age coastlines, about 120 m below today&#x27;s sea level at the glacial maximum, are drowned.</li><li>Most signs are not directly dated; many ages are inferred from style or from nearby dated images, which risks circular reasoning.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>For a century specialists treated the signs as secondary to the animals. André Leroi-Gourhan (1965) was the exception: he mapped where signs sat in each cave and sorted them into &#x27;male&#x27; thin signs and &#x27;female&#x27; wide ones, arguing for an ordered plan. Later researchers dropped the sexual reading but kept the idea of order. Lewis-Williams and Dowson (1988) proposed that many forms match geometric images the nervous system produces in trance. Today most rock-art specialists accept that the signs were intentional and culturally patterned, while stressing that their meaning is lost.</p><ul><li>A limited, repeated set of forms fits learned convention better than chance.</li><li>Meanings may have varied between regions and over millennia even when the shapes stayed the same.</li><li>Dating signs by style can be circular; direct dates are few.</li><li>No Ice Age sign has a known reading, so &#x27;code&#x27; describes a function, not a translation.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Von Petzinger argues that the signs were overlooked because they are not beautiful, and that their numbers tell a story. A small, stable repertoire was used across a continent for 30,000 years, and most of it was already in place when modern humans reached Europe. That, she suggests, points to a shared graphic code whose roots lie further back, perhaps in Africa. She stops short of calling it writing: there are too few signs to record a spoken language. Hancock goes further, reading the geometric forms as traces of visionary experience at the root of art and religion.</p><ul><li>Only about 32 forms recur, although countless other shapes were possible.</li><li>Most forms appear early and fully formed, which implies an older, unrecorded history.</li><li>Signs occur in deliberate combinations, as on the &#x27;inscription&#x27; panel of La Pasiega.</li><li>The same signs appear on portable objects, such as the deer-tooth necklace from Saint-Germain-la-Rivière.</li></ul><div class="face-s"><b>Its strongest point</b><p>Random doodling over 30,000 years should produce endless variety. Instead, Ice Age Europeans kept to a short list of forms, held some for millennia and chose different ones by region: the signature of learned convention.</p></div><p class="face-cr"><b>Credit</b> Genevieve von Petzinger (University of Victoria); David Lewis-Williams on the neurological roots; Graham Hancock, who built on Lewis-Williams in Supernatural (2005)</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>A fully open database of sign types, positions and dates, so other teams can test statistically whether the patterns are non-random.</li><li>Direct dates (uranium-series on calcite, radiocarbon on charcoal pigment) for many more signs, replacing ages based on style.</li><li>Matching databases for Africa, Asia and Australia, to test whether the same forms were in use before people reached Europe.</li><li>A sign combination that recurs in the same kind of setting across many caves, which would point to shared meaning rather than shared shapes.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">6 min read · 1,278 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of The First Signs: Ice Age Europe&#x27;s 32 Symbols"><button type="button" class="wtoc-i" data-go="ice-age-signs-s1">The shapes nobody looked at</button><button type="button" class="wtoc-i" data-go="ice-age-signs-s2">Thirty-two signs, thirty thousand years</button><button type="button" class="wtoc-i" data-go="ice-age-signs-s3">What persists, what spreads</button><button type="button" class="wtoc-i" data-go="ice-age-signs-s4">The mainstream readings</button><button type="button" class="wtoc-i" data-go="ice-age-signs-s5">The challenger&#x27;s case: a graphic code</button><button type="button" class="wtoc-i" data-go="ice-age-signs-s6">What time has erased</button><button type="button" class="wtoc-i" data-go="ice-age-signs-s7">What would settle it</button></nav></div><section class="wsec" id="ice-age-signs-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The shapes nobody looked at</h3><p>Walk into El Castillo, a cave above the Pas valley in Cantabria, and your guide&#x27;s torch will find hands first: dozens of them, stencilled in red, fingers spread. Then come the animals. But look between them and you start to see something else: rows of red dots, a disk, lines, ladders, shapes like roofs and feathers. For more than a century, most visitors and many scholars walked straight past them.</p><p>Genevieve von Petzinger did not. As a graduate student at the University of Victoria in Canada, she set out to count them. She built a database of every geometric sign she could find in the Ice Age art of Europe, then spent 2013 and 2014 crawling through 52 caves in Spain, Portugal, France and Italy, many rarely visited, to check the records against the walls. What she found became a 2015 TED talk and a 2016 book, The First Signs.</p><blockquote class="wpull"><p>Across 30,000 years and an entire continent, Ice Age artists drew from a list of about 32 signs.</p></blockquote></section><section class="wsec" id="ice-age-signs-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Thirty-two signs, thirty thousand years</h3><p>The headline numbers are simple. Her database covers 367 Upper Palaeolithic rock-art sites, from northern Spain to the Urals. In them, geometric signs outnumber animals and people by at least two to one. And yet the variety is tiny: about 32 forms recur, including lines, dots, open angles, circles, zigzags, spirals, crosshatches, ladder shapes (scalariforms), feather shapes (penniforms), roof shapes (tectiforms), negative and positive hands, and finger flutings.</p><p>The second surprise is timing. About two-thirds of the types were already in use in the Aurignacian, the earliest part of the European record, roughly 40,000–30,000 years ago. Her earlier study of French caves had found a similar share, about 70 percent. In other words, the signs do not slowly accumulate as people settle into Europe. Most arrive early and already formed.</p><figure class="wx wx--static" id="ice-age-signs-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Which signs were in use, and when</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Which signs were in use, and when"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" class="wx-svg" role="img" aria-labelledby="ice-age-signs-f1-t"><title id="ice-age-signs-f1-t">When selected Ice Age sign types were in use in Europe, 42,000 to 10,000 years ago</title><defs><marker id="ice-age-signs-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text x="24" y="28" class="wx-t-cap">Selected sign types and when they were in use · Europe</text><line x1="277.5" y1="70" x2="277.5" y2="392" class="wx-guide"/><text x="277.5" y="412" text-anchor="middle" class="wx-t-s">40,000</text><line x1="346.2" y1="70" x2="346.2" y2="392" class="wx-guide"/><text x="346.2" y="412" text-anchor="middle" class="wx-t-s">35,000</text><line x1="415.0" y1="70" x2="415.0" y2="392" class="wx-guide"/><text x="415.0" y="412" text-anchor="middle" class="wx-t-s">30,000</text><line x1="483.8" y1="70" x2="483.8" y2="392" class="wx-guide"/><text x="483.8" y="412" text-anchor="middle" class="wx-t-s">25,000</text><line x1="552.5" y1="70" x2="552.5" y2="392" class="wx-guide"/><text x="552.5" y="412" text-anchor="middle" class="wx-t-s">20,000</text><line x1="621.2" y1="70" x2="621.2" y2="392" class="wx-guide"/><text x="621.2" y="412" text-anchor="middle" class="wx-t-s">15,000</text><line x1="690.0" y1="70" x2="690.0" y2="392" class="wx-guide"/><text x="690.0" y="412" text-anchor="middle" class="wx-t-s">10,000</text><line x1="250.0" y1="392" x2="690.0" y2="392" class="wx-line"/><text x="470.0" y="434" text-anchor="middle" class="wx-t-m">years ago (today is off the chart to the right)</text><rect x="277.5" y="70" width="137.5" height="322" class="wx-accfill wx-o20"/><text x="346.25" y="62" text-anchor="middle" class="wx-t-s wx-t-a">Aurignacian</text><text x="24" y="102" class="wx-t-b">About two-thirds</text><text x="24" y="117" class="wx-t-s">of the 32 sign types</text><rect x="277.5" y="95" width="137.5" height="16" rx="4" class="wx-accfill wx-growx" style="--d:1"/><text x="423.0" y="108" class="wx-t-s">already in use before 30,000 years ago</text><line x1="188" y1="145" x2="188" y2="167" class="wx-bold wx-s4"/><line x1="196" y1="145" x2="196" y2="167" class="wx-bold wx-s4"/><line x1="204" y1="145" x2="204" y2="167" class="wx-bold wx-s4"/><text x="24" y="154" class="wx-t-b">Lines</text><text x="24" y="169" class="wx-t-s">widespread, all periods</text><rect x="277.5" y="149" width="412.5" height="14" rx="4" class="wx-c4 wx-growx" style="--d:2"/><circle cx="187" cy="203" r="3.6" class="wx-c4"/><circle cx="196" cy="213" r="3.6" class="wx-c4"/><circle cx="205" cy="203" r="3.6" class="wx-c4"/><circle cx="196" cy="196" r="3.6" class="wx-c4"/><text x="24" y="206" class="wx-t-b">Dots</text><text x="24" y="221" class="wx-t-s">widespread, all periods</text><rect x="277.5" y="201" width="412.5" height="14" rx="4" class="wx-c4 wx-growx" style="--d:3"/><ellipse cx="196" cy="260" rx="17" ry="19" class="wx-c4 wx-o60"/><path d="M190,273 L189,259 L184,254 L186,252 L191,256 L191,246 L194,246 L194,256 L195,244 L198,244 L198,256 L200,246 L203,246 L202,257 L205,250 L207,251 L203,264 L202,273 Z" class="wx-paper"/><text x="24" y="258" class="wx-t-b">Negative hands</text><text x="24" y="273" class="wx-t-s">stencilled hands</text><rect x="277.5" y="253" width="247.5" height="14" rx="4" class="wx-c4 wx-growx" style="--d:4"/><line x1="529.0" y1="260" x2="662.5" y2="260" class="wx-dash wx-pop" style="--d:6"/><text x="281.5" y="248" text-anchor="start" class="wx-t-s wx-halo">most popular 40,000–22,000</text><line x1="196" y1="325" x2="196" y2="299" class="wx-bold wx-s4"/><polyline points="187,312 196,318 205,312" class="wx-line wx-s4"/><polyline points="187,304 196,310 205,304" class="wx-line wx-s4"/><polyline points="187,296 196,302 205,296" class="wx-line wx-s4"/><text x="24" y="310" class="wx-t-b">Penniform</text><text x="24" y="325" class="wx-t-s">feather or branch shape</text><rect x="415.0" y="305" width="27.5" height="14" rx="4" class="wx-c4 wx-growx" style="--d:5"/><line x1="446.5" y1="312" x2="662.5" y2="312" class="wx-dash wx-pop" style="--d:7"/><text x="415.0" y="300" text-anchor="start" class="wx-t-s wx-halo">first appears 30,000–28,000</text><polygon points="182,376 182,360 196,350 210,360 210,376" class="wx-line wx-s4"/><line x1="196" y1="350" x2="196" y2="376" class="wx-line wx-s4"/><line x1="182" y1="367" x2="210" y2="367" class="wx-thin"/><text x="24" y="362" class="wx-t-b">Tectiform</text><text x="24" y="377" class="wx-t-s">roof-like shape</text><rect x="593.8" y="357" width="55.0" height="14" rx="4" class="wx-c4 wx-growx" style="--d:6"/><text x="585.8" y="368" text-anchor="end" class="wx-t-s wx-halo">only 17,000–13,000, at 9 caves</text><line x1="483.8" y1="48" x2="518.1" y2="48" class="wx-dash"/><text x="524.1" y="52" class="wx-t-s">dashed: later use, less certain</text><circle cx="266.5" cy="52" r="6" class="wx-c4 wx-pulse"/><line x1="266.5" y1="59" x2="266.5" y2="70" class="wx-thin"/><text x="254.5" y="56" text-anchor="end" class="wx-t-s">El Castillo red disk, 40,800+</text></svg></div></div><figcaption>A stable core of signs sits beside forms that come and go: most types were already present in the Aurignacian. <span class="wx-src">Based on: von Petzinger 2016 and TED Ideas 2016 (sign counts, first appearances, tectiform window); Pike et al. 2012 (El Castillo disk). Bars are schematic spans; exact start and end dates vary by region.</span></figcaption><p class="vh">A time chart from 42,000 years ago on the left to 10,000 years ago on the right, with the Aurignacian period, 40,000 to 30,000 years ago, shaded. A top bar shows that about two-thirds of the 32 sign types were already in use before 30,000 years ago. Rows show five sign types with small drawings: lines and dots, used in every period across the whole chart; negative hand stencils, most popular from 40,000 to 22,000 years ago with rarer later use dashed; the feather-shaped penniform, first appearing 30,000 to 28,000 years ago; and the roof-shaped tectiform, found only from 17,000 to 13,000 years ago at nine caves. A red dot marks the El Castillo red disk, older than 40,800 years.</p></figure><aside class="wcall"><b>How do we know?</b><p>Few signs can be dated directly. Where calcite has grown over paint, uranium-series dating gives a minimum age: in 2012 Alistair Pike and colleagues showed that a red disk at El Castillo is older than 40,800 years. Where charcoal was used, radiocarbon dates the pigment itself. Most other signs are dated by style or by their position next to dated animals, which is why von Petzinger stresses the need for more direct dates.</p></aside></section><section class="wsec" id="ice-age-signs-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>What persists, what spreads</h3><p>The patterns within the list are the most interesting part. Lines and dots are everywhere and in every period. Negative hands, made by blowing pigment around a hand held to the wall, were most popular between about 40,000 and 22,000 years ago and then faded. The penniform first appears between about 30,000 and 28,000 years ago. The tectiform, a roof-like shape, belongs to a narrow window between about 17,000 and 13,000 years ago and turns up in only nine caves, clustered in one region of France.</p><p>That combination, a stable core plus signs that come and go in particular places, looks a great deal like how human conventions behave. A few forms are shared by everyone; others work like local dialects or fashions. Some sites show signs grouped deliberately. At La Pasiega, a panel of signs high on a wall was described by the priest and prehistorian Henri Breuil as an &#x27;inscription&#x27; carrying a message for initiates, a phrase few would use today but which captures how structured it looks.</p><p>The signs also leave the caves. A necklace of more than 70 perforated red-deer teeth, buried with a woman at Saint-Germain-la-Rivière in France about 16,000 years ago, carries incised marks that von Petzinger compares to the wall signs. That suggests a portable code, not just a cave decoration.</p></section><section class="wsec" id="ice-age-signs-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The mainstream readings</h3><p>Von Petzinger was not the first to take the signs seriously. In the 1960s André Leroi-Gourhan mapped their positions in dozens of caves and argued that each cave followed a plan, with thin &#x27;male&#x27; signs and wide &#x27;female&#x27; signs placed in patterned relation to the animals. His sexual reading has largely been abandoned, but his central idea, that the signs are ordered rather than random, has survived.</p><p>In 1988 David Lewis-Williams and Thomas Dowson offered a different root. Laboratory studies show that in altered states of consciousness, from migraine to trance, the human visual system produces the same geometric forms in everyone: grids, dots, zigzags, nested curves, parallel lines and meanders. The San rock art of southern Africa, made by people whose trance rituals are recorded, contains exactly these forms. They proposed that some Ice Age signs began the same way. Critics answer that such shapes are also simply the easiest to draw, and that the model explains the shapes better than their distribution.</p><p>The mainstream position today combines these threads. The signs were intentional, learned and culturally patterned. Some may have perceptual roots. Their meaning is lost, and &#x27;code&#x27; is a hypothesis about how they worked, not a translation.</p></section><section class="wsec" id="ice-age-signs-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The challenger&#x27;s case: a graphic code</h3><p>Von Petzinger&#x27;s argument, at its strongest, is about what the numbers imply. If signs were idle marks, 30,000 years of people should have produced endless variety. Instead they kept to a short list, held some forms for tens of thousands of years, and chose different ones in different regions. That is how shared conventions behave. And because two-thirds of the list was in place by the Aurignacian, she suggests the system may have come with the first modern humans into Europe, with roots in Africa. She is careful: the signs are not writing, because a few dozen signs cannot record the words of a language. She calls it graphic communication.</p><blockquote class="wpull"><p>A short list, kept for millennia and chosen by region, is the signature of convention, not chance.</p></blockquote><p>Graham Hancock, in Supernatural (2005), drew on Lewis-Williams to push the reading further, treating the geometric signs as traces of visionary experience at the very root of art and religion. That part of the argument concerns what trance experiences mean, which archaeology cannot test. The physical claim underneath it, that the signs were a shared and meaningful system, is the part the evidence can weigh, and it weighs heavily in its favour. The next Open Case, on Ice Age notation, asks whether some of these signs went further and stored information.</p></section><section class="wsec" id="ice-age-signs-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What time has erased</h3><p>Every count here comes from deep caves, where stable air and darkness protected the walls. Most Ice Age life happened outside, and most marks were probably made on wood, bark, hide and skin, all long gone. The coasts where many groups lived are drowned: at the height of the last glaciation sea level stood about 120 metres lower, and the one known painted cave with an entrance now below the sea, Cosquer near Marseille, shows what may be missing. The 32 signs are the survivors, not the whole vocabulary.</p></section><section class="wsec" id="ice-age-signs-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle it</h3><p>Three things would move this forward. First, an open database others can test: if the patterns hold under independent statistical analysis, the case for a system becomes very hard to resist. Second, many more direct dates, so that the time patterns do not rest on style. Third, comparable surveys in Africa, Asia and Australia, which could show whether the core signs predate the arrival of people in Europe, as von Petzinger suspects.</p><aside class="wcall"><b>Fresh from the field</b><p>In February 2026 the linguist Christian Bentz and the archaeologist Ewa Dutkiewicz published in PNAS an analysis of more than 3,000 signs on about 260 objects from the Swabian Jura, roughly 43,000–34,000 years old. They found the sign sequences were structured conventions, statistically comparable in information density to early proto-cuneiform, though not writing. It is the strongest quantitative support yet for the idea that Ice Age signs were a system.</p></aside><p>The signs have been hiding in plain sight for a century. The honest verdict is that they were not doodles: they were shared, learned and meaningful to the people who made them. What they said is still the open question.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-study" style="--i:0"><span class="wtl-y">1902 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Sceptics accept Ice Age cave art after Altamira</span></li><li class="wtl-study" style="--i:1"><span class="wtl-y">1965 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Leroi-Gourhan maps signs as a structured system</span></li><li class="wtl-study" style="--i:2"><span class="wtl-y">1988 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Lewis-Williams and Dowson propose the entoptic model</span></li><li class="wtl-find" style="--i:3"><span class="wtl-y">2012 CE</span><span class="wtl-k">Found</span><span class="wtl-t">El Castillo red disk dated to over 40,800 years</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">2015 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Von Petzinger&#x27;s TED talk on the 32 signs</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">2016 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">The First Signs published</span></li><li class="wtl-find" style="--i:6"><span class="wtl-y">2018 CE</span><span class="wtl-k">Found</span><span class="wtl-t">La Pasiega ladder sign dated to over 64,000 years</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2026 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Swabian sign sequences measured as a conventional system</span></li></ol><details class="srcs"><summary>Sources for this case (11)</summary><ol><li>von Petzinger, G. (2016). The First Signs: Unlocking the Mysteries of the World&#x27;s Oldest Symbols. Atria Books.</li><li>von Petzinger, G. &amp; Nowell, A. (2014). A place in time: situating Chauvet within the long chronology of symbolic behavioral development. Journal of Human Evolution 74: 37–54. <a href="https://doi.org/10.1016/j.jhevol.2014.02.022" target="_blank" rel="noopener">doi:10.1016/j.jhevol.2014.02.022</a></li><li>von Petzinger, G. (2015). Why are these 32 symbols found in ancient caves all over Europe? TED talk.</li><li>von Petzinger, G. (2016). What the mysterious symbols made by early humans can teach us about how we evolved. TED Ideas.</li><li>Lewis-Williams, J. D. &amp; Dowson, T. A. (1988). The signs of all times: entoptic phenomena in Upper Palaeolithic art. Current Anthropology 29(2): 201–245. <a href="https://doi.org/10.1086/203629" target="_blank" rel="noopener">doi:10.1086/203629</a></li><li>Leroi-Gourhan, A. (1965). Préhistoire de l&#x27;art occidental. Paris: Mazenod.</li><li>Pike, A. W. G. et al. (2012). U-series dating of Paleolithic art in 11 caves in Spain. Science 336: 1409–1413. <a href="https://doi.org/10.1126/science.1219957" target="_blank" rel="noopener">doi:10.1126/science.1219957</a></li><li>Hoffmann, D. L. et al. (2018). U-Th dating of carbonate crusts reveals Neandertal origin of Iberian cave art. Science 359: 912–915. <a href="https://doi.org/10.1126/science.aap7778" target="_blank" rel="noopener">doi:10.1126/science.aap7778</a></li><li>Bentz, C. &amp; Dutkiewicz, E. (2026). Humans 40,000 y ago developed a system of conventional signs. PNAS 123(9): e2520385123. <a href="https://doi.org/10.1073/pnas.2520385123" target="_blank" rel="noopener">doi:10.1073/pnas.2520385123</a></li><li>Hancock, G. (2005). Supernatural: Meetings with the Ancient Teachers of Mankind. Century.</li><li>Clottes, J. &amp; Lewis-Williams, D. (1998). The Shamans of Prehistory: Trance and Magic in the Painted Caves. Harry N. Abrams.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-ice-age-signs" data-t="The First Signs: Ice Age Europe&#x27;s 32 Symbols"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The First Signs: Ice Age Europe&#x27;s 32 Symbols</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-ice-age-signs</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-oldest-marks-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Cueva de las Manos (6811931046).jpg" data-cap="Hand stencils at Cueva de las Manos, Santa Cruz, Argentina" data-big><figcaption></figcaption></figure><div class="sh-k">Signs Across the World</div><h2 class="sh-t" id="case-oldest-marks-st" tabindex="-1">Older Than Us: The First Deliberate Marks</h2><p class="sh-s">A zigzag cut into a Javan mussel shell is at least 430,000 years old, made by a kind of human that was not us.</p><div class="sh-v"><span class="vstamp vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><p class="sh-claim"><b>What the stamp rates:</b> Symbolic marking began before Homo sapiens existed.</p></div><p class="v4-q">Did humans before our own species make deliberate marks and symbols?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>A mussel shell from Java carries a deliberately engraved zigzag, made about half a million years ago by Homo erectus.</li><li>Neanderthals traced lines with their fingers on a cave wall in France more than 57,000 years ago.</li><li>Our own kind engraved patterns on ochre in South Africa about 100,000 years ago.</li><li>So deliberate marks came before our species, resting so far on one shell.</li><li>Intentional does not automatically mean symbolic; plausible, not yet a pattern.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Biology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">at least <b class="ctr-n" data-v="430000" >430,000</b><span class="ctr-u"> years</span></div><div class="ctr-l">minimum age of the Trinil engraving</div><div class="ctr-c">Joordens et al. 2015</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="73000" >73,000</b><span class="ctr-u"> years</span></div><div class="ctr-l">age of the Blombos crayon drawing</div><div class="ctr-c">Henshilwood et al. 2018</div></div><div class="ctr"><div class="ctr-v">at least <b class="ctr-n" data-v="67800" >67,800</b><span class="ctr-u"> years</span></div><div class="ctr-l">minimum age of the Muna hand stencil</div><div class="ctr-c">Oktaviana et al. 2026</div></div><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="57000" >57,000</b><span class="ctr-u"> years</span></div><div class="ctr-l">minimum age of Neanderthal flutings at La Roche-Cotard</div><div class="ctr-c">Marquet et al. 2023</div></div><div class="ctr"><div class="ctr-v">at least <b class="ctr-n" data-v="51200" >51,200</b><span class="ctr-u"> years</span></div><div class="ctr-l">minimum age of the Sulawesi story scene</div><div class="ctr-c">Oktaviana et al. 2024</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Symbolic marking began before Homo sapiens existed.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Deliberate abstract marks by other humans are now well supported: the Trinil zigzag is securely dated and accepted as intentional, and Neanderthal finger flutings at La Roche-Cotard are sealed by dated sediment. But &#x27;before Homo sapiens&#x27; means older than about 300,000 years, and that rests almost entirely on one shell whose purpose is unknown. Intentional does not automatically mean symbolic. Plausible, and far better supported than twenty years ago, but not yet a pattern.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Older textbooks taught a &#x27;human revolution&#x27; in which art and symbols appeared suddenly with modern humans in Europe about 40,000 years ago. That was overconfident and has been overturned by African, Indonesian and Neanderthal evidence. Current textbooks are more open, but many museum labels still credit marking to Homo sapiens alone, which is now too narrow.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>A freshwater mussel shell from Trinil, Java, carries a deliberately engraved zigzag, dated to about 540,000–430,000 years ago, when Homo erectus is the only human known on Java.<small>Joordens et al. 2015</small></li><li>At Blombos Cave, South Africa, Homo sapiens engraved crosshatched patterns on pieces of ochre about 100,000–75,000 years ago, and drew a crosshatch with an ochre crayon on a stone flake about 73,000 years ago.<small>Henshilwood et al. 2002, 2009, 2018</small></li><li>Lines traced with fingers on the soft wall of La Roche-Cotard cave in France were sealed by sediment more than 57,000 years ago and are attributed to Neanderthals.<small>Marquet et al. 2023</small></li><li>A hand stencil in Liang Metanduno on Muna island, Sulawesi, lies under calcite at least 67,800 years old, the oldest dated cave art known (2026).<small>Oktaviana et al. 2026</small></li><li>Hand stencils appear on every inhabited continent, from Sulawesi and Spain to Patagonia&#x27;s Cueva de las Manos and Australia.<small>regional surveys; UNESCO</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the Trinil zigzag was a symbol, a test of a tool, an ownership mark or a moment&#x27;s play.</li><li>Whether uranium-thorium ages above 64,000 years for a ladder sign, a hand stencil and painted flowstone in three Spanish caves (Hoffmann et al. 2018) are reliable, and so whether Neanderthals made them.</li><li>Who made the Muna hand stencil: the team attributes it to Homo sapiens, but Denisovans and other humans also lived in the region.</li><li>Whether small-brained Homo naledi engraved the walls of Rising Star cave; the marks are undated and the claim is widely doubted.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Only a handful of engraved objects older than 100,000 years are known; marks on wood, bark, hide and skin are gone.</li><li>Tropical rock surfaces erode quickly, and the Ice Age coasts of Sunda and Sahul, where early seafarers lived, are under the sea.</li><li>The Trinil shell lay unnoticed in a museum collection for over a century; other old marks may still sit unrecognised in museum drawers.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>A generation ago many textbooks described a &#x27;creative explosion&#x27; about 40,000 years ago, when modern humans in Europe suddenly began making art and symbols. That model has collapsed. African finds pushed engraving and ornaments by Homo sapiens back beyond 70,000 years, and Indonesian cave art is now older than anything in Europe. Most specialists now accept that Neanderthals made some marks and ornaments, while debating how many. The Trinil zigzag is widely accepted as deliberate, but many doubt it was a symbol in our sense.</p><ul><li>Deliberate and symbolic are different claims: a pattern can be intentional without standing for anything.</li><li>Minimum ages from calcite crusts can come out too old if uranium was later washed out.</li><li>A single object, however secure, is a thin basis for a claim about a whole species.</li><li>Homo sapiens is about 300,000 years old, so Neanderthal marks at 65,000 years show breadth, not priority.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>The challengers argue that the capacity for marks and symbols is old and shared across the human family, not a late invention of our species. Joordens&#x27;s team shows a Homo erectus individual cutting a geometric pattern into a shell nearly half a million years ago. Hoffmann, Zilhão and colleagues date marks in three Spanish caves to more than 64,000 years ago, before modern humans are known in Iberia, and conclude Neanderthals made them. With Neanderthal ornaments and the La Roche-Cotard flutings, they read symbolism as an inheritance from a common ancestor.</p><ul><li>The Trinil zigzag was cut in one sitting with a hard, pointed tool on a fresh shell, with a steady hand.</li><li>Three Spanish caves hundreds of kilometres apart give minimum ages above 64,000 years.</li><li>La Roche-Cotard is dated by sediment luminescence, independent of uranium-series dating.</li><li>If both Neanderthals and our ancestors marked surfaces, their common ancestor may have too.</li></ul><div class="face-s"><b>Its strongest point</b><p>Different dating methods, argon and luminescence at Trinil, uranium-thorium in Spain and sediment luminescence at La Roche-Cotard, each point to hands other than ours making deliberate marks long before Europe&#x27;s supposed creative explosion.</p></div><p class="face-cr"><b>Credit</b> Josephine Joordens and colleagues (Trinil); Dirk Hoffmann, João Zilhão, Alistair Pike and colleagues (Neanderthal cave art); Lee Berger (Homo naledi)</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>More engraved objects from securely dated layers older than 300,000 years, turning Trinil from a single case into a pattern.</li><li>The Spanish dates checked with a second, independent method, and fresh samples taken layer by layer.</li><li>Ancient DNA or proteins from cave sediments to show which humans were present when marks were made.</li><li>Direct dates and independent study of the marks claimed for Homo naledi.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,163 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Older Than Us: The First Deliberate Marks"><button type="button" class="wtoc-i" data-go="oldest-marks-s1">A zigzag in a museum drawer</button><button type="button" class="wtoc-i" data-go="oldest-marks-s2">A ladder of marks</button><button type="button" class="wtoc-i" data-go="oldest-marks-s3">The old story and its collapse</button><button type="button" class="wtoc-i" data-go="oldest-marks-s4">The challengers&#x27; case: Neanderthal painters</button><button type="button" class="wtoc-i" data-go="oldest-marks-s5">Hands on every continent</button><button type="button" class="wtoc-i" data-go="oldest-marks-s6">What time has erased</button><button type="button" class="wtoc-i" data-go="oldest-marks-s7">What would settle it</button></nav></div><section class="wsec" id="oldest-marks-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A zigzag in a museum drawer</h3><p>In 1891 and 1892 the Dutch anatomist Eugène Dubois dug into the banks of the Solo River at Trinil on Java and found a skullcap and a thigh bone that became famous as Java Man, today classed as Homo erectus. His crews also collected fossil freshwater mussel shells, which went to the Netherlands and sat in the collection now held by Naturalis in Leiden for more than a century.</p><p>Then a researcher photographing the shells noticed something odd on one of them: a set of sharp, straight grooves forming a zigzag. In December 2014 a team led by Josephine Joordens published the shell in Nature. Microscope
