<script type="text/x-tpl" id="case-scrolls-monopoly-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Qumran Caves.jpg" data-cap="The caves at Qumran, where the Dead Sea Scrolls were found from 1947" data-big><figcaption></figcaption></figure><div class="sh-k">Who Controls the Evidence</div><h2 class="sh-t" id="case-scrolls-monopoly-st" tabindex="-1">The Dead Sea Scrolls: Forty Years Behind Closed Doors</h2><p class="sh-s">The century&#x27;s greatest manuscript find was held by a small team for four decades, until a library in California opened the vault.</p><div class="sh-v"><span class="vstamp vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><p class="sh-claim"><b>What the stamp rates:</b> Access to the Dead Sea Scrolls was restricted for decades by a small group of scholars.</p></div><p class="v4-q">Was access to the Dead Sea Scrolls restricted for decades by a small group?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Fifteen thousand scroll fragments from the caves near Qumran were assigned in the 1950s to a small team.</li><li>Only eight volumes appeared in the next 35 years, and scholars outside the team were kept out.</li><li>In 1991 a library released photographs and the monopoly broke.</li><li>Since then 32 more volumes have been published.</li><li>The restriction is established; the idea that texts were hidden for their content is not: nothing of that kind emerged.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Texts and scripts</span><span class="thr">Institutions</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="981" >981</b><span class="ctr-u"> manuscripts</span></div><div class="ctr-l">different manuscripts identified from the 11 Qumran caves</div><div class="ctr-c">Tov 2002</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="8" >8</b><span class="ctr-u"> volumes</span></div><div class="ctr-l">of the official series published in its first 35 years (1955–1990)</div><div class="ctr-c">DJD series</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="32" >32</b><span class="ctr-u"> volumes</span></div><div class="ctr-l">published in the next 19 years under Emanuel Tov (1991–2009)</div><div class="ctr-c">DJD series</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="1991" >1,991</b><span class="ctr-u"> </span></div><div class="ctr-l">year the Huntington Library opened its photographs to all</div><div class="ctr-c">Schiffman 1994</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Access to the Dead Sea Scrolls was restricted for decades by a small group of scholars.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:91.7%" role="img" aria-label="Weight of evidence: Established"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Everything about this claim is on the record: the size of the team, the publication dates of the official volumes, the testimony of scholars who were kept out, Strugnell&#x27;s removal, the Huntington announcement and the court case that followed. Scholars on every side now accept that access was restricted and publication far too slow. What is not supported is the stronger claim that the texts were suppressed because of their content: the material released since 1991 contains nothing of that kind.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Here the textbooks are mostly right, and unusually candid: most accounts now describe the delay as a scandal. They can sound too tidy about its causes, though. Treating it as a story of a few bad editors lets the institutions that allowed the monopoly for thirty years off lightly, and it forgets that the outsiders who forced the release were right on the main point.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>About 15,000 scroll fragments from 11 caves near Qumran make up some 981 different manuscripts, found between 1946/47 and 1956. The richest cave, Cave 4, yielded thousands of small fragments.<small>Tov 2002; Israel Antiquities Authority</small></li><li>From the early 1950s the Cave 4 fragments were assigned to a small international team working at the Palestine Archaeological (Rockefeller) Museum in East Jerusalem under Roland de Vaux; no Jewish scholar was on the original team.<small>Schiffman 1994; Vermes 2010</small></li><li>Only eight volumes of the official series, Discoveries in the Judaean Desert, appeared between 1955 and 1990. Under Emanuel Tov, 32 more followed between 1991 and 2009.<small>Tov 2002; DJD XL (2009)</small></li><li>John Strugnell, editor in chief from 1984, was removed in late 1990 after an interview in the Israeli paper Haaretz in which he disparaged Judaism; health was the reason officially given.<small>Schiffman 1994</small></li><li>In September 1991 Ben Zion Wacholder and Martin Abegg published computer reconstructions of unpublished texts, and on 22 September the Huntington Library announced it would open its full set of scroll photographs to all scholars.<small>Schiffman 1994; Library of Congress</small></li><li>In 2000 the Supreme Court of Israel upheld a ruling that Elisha Qimron held copyright in his reconstruction of the scroll 4QMMT, published without his consent in 1991.<small>Qimron v. Shanks (2000)</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Why publication was so slow: careerism and hoarding, an impossible workload for a few editors, poor funding, or (as a minority argued) a wish to keep awkward texts quiet.</li><li>Whether the 1991 release, which broke the official editors&#x27; rights, was a victory for open science or a breach of scholarly property, a question the Qimron case left partly open.</li><li>How much the early monopoly shaped the first readings of the scrolls, for example the identification of Qumran with the Essenes.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Up to 5 percent of some scrolls had deteriorated by 1958, partly from storage between window glass and early handling with sticky tape.</li><li>Many fragments were bought through dealers rather than excavated, so their exact cave and context are lost; some items sold later as scroll fragments have turned out to be modern forgeries.</li><li>Private notes and early transcriptions made by the first editors were never systematically published.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Scroll scholars today openly call the delay a scandal. Lawrence Schiffman, one of those kept waiting, wrote that editors hoarded the scrolls as currency for their careers and were given more fragments than any one person could handle. But the mainstream view is that the cause was ordinary: too few people, too much fragmentary material, rights treated as personal property, and weak oversight by the Jordanian and then Israeli authorities. The texts published since 1991 did not contain the church-shaking secrets some had predicted.</p><ul><li>The Israel Antiquities Authority began widening the team in the late 1980s, and it reached some thirty scholars by 1990 and more than fifty by 1992.</li><li>Once the photographs were free, every text was published in the official series by 2009, and the images are now online.</li><li>The Cave 4 texts that came out after 1991 are Jewish writings of the Second Temple period; none names Jesus or the early church.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Hershel Shanks, a lawyer and magazine editor, campaigned through the 1980s for the scrolls to be freed, calling the official editors a cartel. Robert Eisenman argued that the unpublished texts bore on the origins of Christianity and that access was controlled by a closed circle with a theological outlook. Michael Baigent and Richard Leigh went further, suggesting the Vatican, through the École Biblique in Jerusalem, had an interest in suppressing awkward material. Norman Golb challenged the official team&#x27;s Essene reading of Qumran and said the monopoly had entrenched it.</p><ul><li>The delay was real: after about 35 years most Cave 4 texts were still unpublished and unseen by most scholars.</li><li>The monopoly was broken from outside, by a library, two computer-minded scholars and a magazine, not by the official team.</li><li>A theory about the scrolls (the Essene hypothesis) became the textbook view while most evidence was locked away.</li></ul><div class="face-s"><b>Its strongest point</b><p>The central complaint was simply true. For decades a handful of scholars controlled texts that belonged to everyone&#x27;s history, and the system only changed when outsiders forced it open against official objections.</p></div><p class="face-cr"><b>Credit</b> Hershel Shanks (Biblical Archaeology Review); Robert Eisenman and James Robinson; Michael Baigent and Richard Leigh (The Dead Sea Scrolls Deception, 1991); Norman Golb</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Publication of the first editors&#x27; surviving correspondence and notes, to show what drove the delays.</li><li>Full provenance records for every fragment in the official collections, including those bought through dealers.</li><li>An independent history of the École Biblique and IAA decisions of the 1980s, drawn from their archives.</li><li>Continued open imaging of all fragments, including the smallest unassigned pieces.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,169 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Dead Sea Scrolls: Forty Years Behind Closed Doors"><button type="button" class="wtoc-i" data-go="scrolls-monopoly-s1">A library in the desert, and a locked room</button><button type="button" class="wtoc-i" data-go="scrolls-monopoly-s2">What the record shows</button><button type="button" class="wtoc-i" data-go="scrolls-monopoly-s3">The fight to open the vault</button><button type="button" class="wtoc-i" data-go="scrolls-monopoly-s4">The challengers&#x27; case at its strongest</button><button type="button" class="wtoc-i" data-go="scrolls-monopoly-s5">A court case, and what openness cost</button><button type="button" class="wtoc-i" data-go="scrolls-monopoly-s6">Why it matters for every mystery on this site</button></nav></div><section class="wsec" id="scrolls-monopoly-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A library in the desert, and a locked room</h3><p>In 1947 Bedouin shepherds pulled leather scrolls from a cave above the Dead Sea. Over the next nine years, eleven caves near the ruins of Qumran gave up the remains of about 981 manuscripts, among them the oldest known copies of books of the Hebrew Bible and hundreds of writings no one had read for two thousand years. It was, and still is, the greatest manuscript discovery of the twentieth century.</p><p>Then, for most of the world, the door closed. The largest cache, from Cave 4, arrived as thousands of crumbling fragments. They were laid out under glass in the Rockefeller Museum in East Jerusalem and handed to a small team. For almost forty years, if you were not on that team, you could not see most of them. Not the originals, not even photographs.</p><blockquote class="wpull"><p>The scrolls were a library of everyone&#x27;s past. For four decades most of it had a reading list of about ten names.</p></blockquote><p>This case is not about a lost civilisation. It is about something every mystery on this site depends on: who gets to see the evidence, and what happens to public trust when the answer is &#x27;not you&#x27;.</p></section><section class="wsec" id="scrolls-monopoly-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What the record shows</h3><p>The facts are not in dispute. In the early 1950s, under Jordanian rule in East Jerusalem, the Dominican scholar Roland de Vaux of the École Biblique organised an international team to edit the Cave 4 fragments. Its members were Catholic and Protestant scholars from Europe and North America; none was Jewish. Each editor was assigned a lot of fragments and held the right to publish them first, with no deadline.</p><figure class="wx wx--static" id="scrolls-monopoly-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Forty volumes, two speeds</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Forty volumes, two speeds"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" class="wx-svg" role="img" aria-labelledby="scrolls-monopoly-f1-t"><title id="scrolls-monopoly-f1-t">Cumulative volumes of the official Dead Sea Scrolls edition: 8 volumes from 1955 to 1990, then 32 more from 1991 to 2009</title><text x="24" y="28" class="wx-t-cap">Discoveries in the Judaean Desert: volumes published</text><line x1="90" y1="350.0" x2="690" y2="350.0" class="wx-line"/><line x1="90" y1="350.0" x2="680" y2="350.0" class="wx-guide"/><text x="80" y="354.0" text-anchor="end" class="wx-t-s">0</text><line x1="90" y1="285.0" x2="680" y2="285.0" class="wx-guide"/><text x="80" y="289.0" text-anchor="end" class="wx-t-s">10</text><line x1="90" y1="220.0" x2="680" y2="220.0" class="wx-guide"/><text x="80" y="224.0" text-anchor="end" class="wx-t-s">20</text><line x1="90" y1="155.0" x2="680" y2="155.0" class="wx-guide"/><text x="80" y="159.0" text-anchor="end" class="wx-t-s">30</text><line x1="90" y1="90.0" x2="680" y2="90.0" class="wx-guide"/><text x="80" y="94.0" text-anchor="end" class="wx-t-s">40</text><text x="24" y="224.0" class="wx-t-s">vols</text><line x1="90.0" y1="350.0" x2="90.0" y2="356.0" class="wx-dim"/><text x="90.0" y="372.0" text-anchor="middle" class="wx-t-s">1950</text><line x1="185.2" y1="350.0" x2="185.2" y2="356.0" class="wx-dim"/><text x="185.2" y="372.0" text-anchor="middle" class="wx-t-s">1960</text><line x1="280.3" y1="350.0" x2="280.3" y2="356.0" class="wx-dim"/><text x="280.3" y="372.0" text-anchor="middle" class="wx-t-s">1970</text><line x1="375.5" y1="350.0" x2="375.5" y2="356.0" class="wx-dim"/><text x="375.5" y="372.0" text-anchor="middle" class="wx-t-s">1980</text><line x1="470.6" y1="350.0" x2="470.6" y2="356.0" class="wx-dim"/><text x="470.6" y="372.0" text-anchor="middle" class="wx-t-s">1990</text><line x1="565.8" y1="350.0" x2="565.8" y2="356.0" class="wx-dim"/><text x="565.8" y="372.0" text-anchor="middle" class="wx-t-s">2000</text><line x1="661.0" y1="350.0" x2="661.0" y2="356.0" class="wx-dim"/><text x="661.0" y="372.0" text-anchor="middle" class="wx-t-s">2010</text><rect x="109.0" y="80.0" width="371.2" height="270.0" class="wx-stone wx-o40"/><text x="117.0" y="96.0" class="wx-t-b">The closed years</text><text x="117.0" y="112.0" class="wx-t-s">a small team holds the Cave 4 fragments</text><polyline points="109.0,350.0 137.6,350.0 137.6,343.5 194.7,343.5 194.7,337.0 204.2,337.0 204.2,330.5 232.7,330.5 232.7,324.0 261.3,324.0 261.3,317.5 346.9,317.5 346.9,311.0 394.5,311.0 394.5,304.5 470.6,304.5 470.6,298.0 480.2,298.0" class="wx-hl wx-draw" pathLength="1" style="--d:1"/><circle cx="137.6" cy="343.5" r="4.5" class="wx-accfill wx-pop" style="--d:2"/><circle cx="194.7" cy="337.0" r="4.5" class="wx-accfill wx-pop" style="--d:3"/><circle cx="204.2" cy="330.5" r="4.5" class="wx-accfill wx-pop" style="--d:4"/><circle cx="232.7" cy="324.0" r="4.5" class="wx-accfill wx-pop" style="--d:5"/><circle cx="261.3" cy="317.5" r="4.5" class="wx-accfill wx-pop" style="--d:6"/><circle cx="346.9" cy="311.0" r="4.5" class="wx-accfill wx-pop" style="--d:7"/><circle cx="394.5" cy="304.5" r="4.5" class="wx-accfill wx-pop" style="--d:8"/><circle cx="470.6" cy="298.0" r="4.5" class="wx-accfill wx-pop" style="--d:9"/><text x="261.3" y="272.0" text-anchor="middle" class="wx-t-n wx-halo">8 volumes in 35 years</text><text x="261.3" y="287.0" text-anchor="middle" class="wx-t-s wx-halo">1955–1990</text><line x1="480.2" y1="350.0" x2="480.2" y2="64.0" class="wx-dash"/><text x="474.2" y="66.0" text-anchor="end" class="wx-t-b wx-t-a">1991</text><text x="474.2" y="81.0" text-anchor="end" class="wx-t-s">photos freed; Tov editor</text><polygon points="480.2,298.0 651.5,90.0 651.5,109.5 480.2,298.0" class="wx-accfill wx-o40"/><line x1="480.2" y1="298.0" x2="651.5" y2="90.0" class="wx-hl wx-dash wx-draw" pathLength="1" style="--d:10"/><circle cx="651.5" cy="90.0" r="5.5" class="wx-accfill wx-pulse"/><text x="655.5" y="78.0" text-anchor="end" class="wx-t-n wx-halo">40</text><text x="579.8" y="207.0" class="wx-t-n wx-halo">32 volumes</text><text x="579.8" y="222.0" class="wx-t-s wx-halo">in 19 years (1991–2009)</text><text x="579.8" y="237.0" class="wx-t-s wx-halo">dates not plotted</text><text x="24" y="405" class="wx-t-s">Each dot is one volume of the official series, by year of publication.</text></svg></div></div><figcaption>Volumes of the official edition, Discoveries in the Judaean Desert, published before and after the monopoly was broken in 1991. <span class="wx-src">Based on: Volume years of DJD I–VIII (1955, 1961, 1962, 1965, 1968, 1977, 1982, 1990) from the series; the 32 volumes of 1991–2009 after Tov 2002 and the final volume, DJD XL (2009). The post-1991 rise is drawn as a straight band because individual dates are not plotted.</span></figcaption><p class="vh">A chart of cumulative volumes of the official Dead Sea Scrolls edition from 1950 to 2012. Eight dots mark the volumes published in 1955, 1961, 1962, 1965, 1968, 1977, 1982 and 1990, a slow staircase reaching 8 volumes after 35 years. A vertical marker at 1991 notes the release of the photographs and the new editor Emanuel Tov. A steep dashed band then rises from 8 to 40 volumes by 2009, labelled 32 volumes in 19 years, with individual dates not drawn.</p></figure><p>The pace tells the story. The official series, Discoveries in the Judaean Desert, published eight volumes between 1955 and 1990. When the Israel Antiquities Authority finally took charge of the process, the new editor in chief, Emanuel Tov, and a team that grew to more than fifty scholars produced 32 volumes between 1991 and 2009. Lawrence Schiffman, a leading scroll scholar who was kept waiting for years, later wrote that by the late 1980s much of the work on the Cave 4 texts &#x27;was not really proceeding at all&#x27;.</p><p>Meanwhile the scrolls themselves suffered. Fragments were handled with sticky tape and stored between panes of window glass that trapped moisture. By 1958, it was reported, up to 5 percent of some scrolls had completely deteriorated.</p></section><section class="wsec" id="scrolls-monopoly-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The fight to open the vault</h3><p>Pressure built through the 1980s. Hershel Shanks, a Washington lawyer who edited Biblical Archaeology Review, attacked the editors in issue after issue. Scholars such as Robert Eisenman and Norman Golb demanded access. In 1984 John Strugnell, who had joined the team in 1954 at the age of 23, became editor in chief. He brought Israeli scholars into the work, including Elisha Qimron, Devorah Dimant and Emanuel Tov, but the backlog remained.</p><p>In November 1990 Strugnell, by then seriously ill, gave an interview to the Israeli newspaper Haaretz in which he described Judaism in contemptuous terms. His colleagues relieved him of his post, for reasons of health, it was said. Tov replaced him. The remarks mattered because they confirmed what critics had long suspected about the culture of a team that had excluded Jewish scholars from Jewish texts.</p><figure class="wx wx--steps" id="scrolls-monopoly-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">How the vault was opened</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How the vault was opened"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" class="wx-svg" role="img" aria-labelledby="scrolls-monopoly-f2-t"><title id="scrolls-monopoly-f2-t">How access to the Cave 4 scroll fragments opened up between the 1950s and the end of 1991, in five steps</title><text x="24" y="28" class="wx-t-cap">Who could see the Cave 4 fragments</text><rect x="170" y="165" width="160" height="120" rx="10" class="wx-card wx-edge"/><text x="250" y="187" text-anchor="middle" class="wx-t-b">Cave 4 fragments</text><text x="250" y="202" text-anchor="middle" class="wx-t-s">and photographs</text><rect x="190" y="217" width="18" height="20" rx="2" class="wx-paper wx-edge-soft"/><rect x="190" y="245" width="18" height="20" rx="2" class="wx-paper wx-edge-soft"/><rect x="216" y="217" wi  cy="192" r="6" class="wx-accfill"/><circle cx="606" cy="226" r="6" class="wx-accfill"/><circle cx="606" cy="260" r="6" class="wx-accfill"/><circle cx="606" cy="294" r="6" class="wx-accfill"/><circle cx="606" cy="328" r="6" class="wx-accfill"/><circle cx="640" cy="90" r="6" class="wx-accfill"/><circle cx="640" cy="124" r="6" class="wx-accfill"/><circle cx="640" cy="158" r="6" class="wx-accfill"/><circle cx="640" cy="192" r="6" class="wx-accfill"/><circle cx="640" cy="226" r="6" class="wx-accfill"/><circle cx="640" cy="260" r="6" class="wx-accfill"/><circle cx="640" cy="294" r="6" class="wx-accfill"/><circle cx="640" cy="328" r="6" class="wx-accfill"/></g><text x="250" y="365" text-anchor="middle" class="wx-t-s">Rockefeller Museum, Jerusalem</text><defs><marker id="scrolls-monopoly-f2-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="wx-accfill"/></marker></defs><g class="wx-st wx-hide" data-s="3"><rect x="40" y="384" width="120" height="26" rx="4" class="wx-paper wx-edge"/><text x="100" y="401" text-anchor="middle" class="wx-t-s">team concordance</text><path d="M160,397 C300,420 430,400 470,330" class="wx-hl" marker-end="url(#scrolls-monopoly-f2-ar)"/></g><g class="wx-st wx-hide" data-only="3"><text x="24" y="434" class="wx-t wx-t-a">Wacholder and Abegg rebuild texts by computer (Cincinnati)</text></g><g class="wx-st wx-hide" data-s="4"><rect x="610" y="385" width="96" height="40" rx="5" class="wx-card wx-edge"/><text x="658" y="402" text-anchor="middle" class="wx-t-s">Huntington</text><text x="658" y="416" text-anchor="middle" class="wx-t-s">photo set</text><path d="M640,385 C620,350 600,340 590,330" class="wx-line wx-flow wx-s2"/></g><g class="wx-st wx-hide" data-only="4"><text x="24" y="434" class="wx-t wx-t-a">22 Sept 1991: the Huntington Library opens its photographs</text></g><g class="wx-st wx-hide" data-s="5"><path d="M334,225 L455,225" class="wx-hl wx-flow wx-s1"/><path d="M334,195 L455,150" class="wx-hl wx-flow wx-s1"/><path d="M334,255 L455,300" class="wx-hl wx-flow wx-s1"/><text x="380" y="217" class="wx-t-b wx-halo">open to all</text></g><g class="wx-st wx-hide" data-only="5"><text x="24" y="434" class="wx-t wx-t-a">Nov 1991: facsimile edition; restrictions dropped; Qimron sues</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> 1950s–1980s: a small team at the Rockefeller Museum holds the Cave 4 fragments and their photographs.</p><ol class="wx-steplist"><li>1950s–1980s: a small team at the Rockefeller Museum holds the Cave 4 fragments and their photographs.</li><li>1988–1990: the Israel Antiquities Authority widens the team; Strugnell is removed and Emanuel Tov takes over.</li><li>September 1991: Wacholder and Abegg rebuild unpublished texts by computer from the team&#x27;s own concordance.</li><li>22 September 1991: the Huntington Library opens its full set of photographs to any scholar.</li><li>November 1991 onward: a facsimile edition appears, restrictions are dropped, and Qimron sues over 4QMMT.</li></ol><figcaption>Who could see the Cave 4 fragments, from the 1950s to the end of 1991. <span class="wx-src">Based on: Schiffman 1994; Library of Congress, Scrolls from the Dead Sea; Qimron v. Shanks (2000). Numbers of people schematic.</span></figcaption><p class="vh">A diagram of a vault holding the scroll fragments, with a small ring of editors inside and many outside scholars around it. Step 1: only the small team has access. Step 2, 1988 to 1990: the circle widens to some thirty scholars and Strugnell is replaced by Tov. Step 3, September 1991: an arrow shows Wacholder and Abegg rebuilding texts from the team&#x27;s own concordance. Step 4, 22 September 1991: a second copy of the photographs at the Huntington Library opens to everyone. Step 5, November 1991 onward: a facsimile edition is published, the Israel Antiquities Authority drops its restrictions and Qimron&#x27;s copyright suit follows.</p></figure><p>The end came in a rush in 1991. In September, Ben Zion Wacholder and his student Martin Abegg in Cincinnati used a computer to rebuild unpublished texts from a concordance the team itself had compiled and circulated privately. On 22 September the Huntington Library in San Marino, California, announced that it held a complete set of scroll photographs, deposited years earlier as a security copy, and that any scholar could now study them. In November the Biblical Archaeology Society published a two-volume facsimile of the photographs. The Israel Antiquities Authority, which had first objected, dropped its restrictions within weeks.</p></section><section class="wsec" id="scrolls-monopoly-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The challengers&#x27; case at its strongest</h3><p>The strongest version of the challengers&#x27; case needs no conspiracy at all. A small group treated public evidence as private property for four decades. The people who ended that were outsiders: a librarian, a professor and his student, and a magazine editor. The institutions responsible allowed the situation to continue for about thirty years and resisted the final release. On these points the critics were simply right, and the verdict below reflects that.</p><p>Some went further. Robert Eisenman argued that the scrolls spoke of a movement linked to James, the brother of Jesus, and that a closed circle with a theological outlook controlled which readings prevailed. In The Dead Sea Scrolls Deception (1991), Michael Baigent and Richard Leigh suggested that the Vatican had an interest in keeping awkward material quiet. Norman Golb argued that the scrolls were a library brought from Jerusalem, not the books of an Essene sect, and that the monopoly had helped entrench the Essene theory.</p><aside class="wcall"><b>How do we know nothing was suppressed?</b><p>Because the whole corpus has now been published and photographed, and anyone can look. The Cave 4 texts released after 1991 turned out to be Jewish writings of the Second Temple period: biblical manuscripts, legal texts, hymns, calendars and commentaries. None mentions Jesus, John the Baptist or the early church. The theories that the delay hid explosive content have had thirty years of open access to find it, and have not.</p></aside></section><section class="wsec" id="scrolls-monopoly-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>A court case, and what openness cost</h3><p>Openness had its own casualties. The facsimile edition reproduced, without permission, Elisha Qimron&#x27;s reconstruction of a key legal text known as 4QMMT, which he had pieced together over years. Qimron sued Shanks and the editors in Israel. The Jerusalem District Court ruled for him in 1993, and in 2000 the Supreme Court of Israel upheld the ruling: a scholar&#x27;s reconstruction of an ancient text could be protected by copyright. It was the first time a court had applied copyright to such a reconstruction.</p><p>The ruling cuts both ways. It protected real scholarly labour. It also showed how easily control over the past can be framed as ownership, which is exactly what had kept the scrolls closed.</p><aside class="wcall"><b>Fresh from the field</b><p>In 2025 a team led by Mladen Popović combined new radiocarbon dates with a machine-learning model of handwriting to re-date many of the scrolls, suggesting that some are older than the traditional estimates based on script alone. The work was possible because the images and the data are now open.</p></aside></section><section class="wsec" id="scrolls-monopoly-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Why it matters for every mystery on this site</h3><p>The scrolls were published in the end, and the conspiracy theories about their contents failed. But the suspicion was not irrational. When evidence is held by a few people for decades, the public cannot tell the difference between slowness and concealment, and the people in charge lose the right to be believed. Every later case in this section, from Giza to the Temple Mount, is read in the shadow of this one.</p><p>It also shows what works. Photographs in a second location, a scholar with a computer and a public argument ended a monopoly that institutions had tolerated for a generation. Today the Leon Levy Dead Sea Scrolls Digital Library, launched by the Israel Antiquities Authority with Google in 2012, puts high-resolution and multispectral images of the fragments online for anyone.</p><blockquote class="wpull"><p>Secrecy is not evidence of a secret. But it guarantees that people will go looking for one.</p></blockquote></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-find" style="--i:0"><span class="wtl-y">1947 CE</span><span class="wtl-k">Found</span><span class="wtl-t">First scrolls found in Cave 1</span></li><li class="wtl-find" style="--i:1"><span class="wtl-y">1952 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Cave 4 discovered; fragments go to a small team</span></li><li class="wtl-study" style="--i:2"><span class="wtl-y">1955 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">First volume of the official series</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">1967 CE</span><span class="wtl-k">Event</span><span class="wtl-t">East Jerusalem and the museum come under Israeli control</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">1984 CE</span><span class="wtl-k">Event</span><span class="wtl-t">John Strugnell becomes editor in chief</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">1990 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Strugnell removed; Emanuel Tov appointed</span></li><li class="wtl-event" style="--i:6"><span class="wtl-y">1991 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Reconstructions, Huntington photos and facsimile edition</span></li><li class="wtl-event" style="--i:7"><span class="wtl-y">2000 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Israel&#x27;s Supreme Court rules in Qimron v. Shanks</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2009 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Final (40th) volume of the official series</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">2012 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Leon Levy Digital Library online</span></li></ol><details class="srcs"><summary>Sources for this case (12)</summary><ol><li>Schiffman, L. H. (1994). Reclaiming the Dead Sea Scrolls. Jewish Publication Society, Philadelphia (chapter &#x27;Scholars, Scrolls and Scandals&#x27;).</li><li>Tov, E. (ed.) (2002). The Texts from the Judaean Desert: Indices and an Introduction to the Discoveries in the Judaean Desert Series. DJD XXXIX. Clarendon Press, Oxford.</li><li>Discoveries in the Judaean Desert, vols. I–XL (1955–2009). Clarendon Press, Oxford.</li><li>Vermes, G. (2010). The Story of the Scrolls: The Miraculous Discovery and True Significance of the Dead Sea Scrolls. Penguin, London.</li><li>Library of Congress (1993). Scrolls from the Dead Sea: The Ancient Library of Qumran and Modern Scholarship. Exhibition, section &#x27;Two Thousand Years Later&#x27;.</li><li>Wacholder, B. Z., Abegg, M. G. (1991). A Preliminary Edition of the Unpublished Dead Sea Scrolls, fascicle 1. Biblical Archaeology Society, Washington DC.</li><li>Eisenman, R. H., Robinson, J. M. (1991). A Facsimile Edition of the Dead Sea Scrolls. 2 vols. Biblical Archaeology Society, Washington DC.</li><li>Qimron v. Shanks (appeal by Eisenman, Robinson, Shanks and the Biblical Archaeology Society), Supreme Court of Israel, judgment of 2000, upholding the Jerusalem District Court ruling of 1993.</li><li>Baigent, M., Leigh, R. (1991). The Dead Sea Scrolls Deception. Jonathan Cape, London.</li><li>Golb, N. (1995). Who Wrote the Dead Sea Scrolls? The Search for the Secret of Qumran. Scribner, New York.</li><li>Popović, M. et al. (2025). Dating ancient manuscripts using radiocarbon and AI-based writing style analysis. PLOS ONE 20(6).</li><li>Israel Antiquities Authority. The Leon Levy Dead Sea Scrolls Digital Library (launched December 2012), deadseascrolls.org.il.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-scrolls-monopoly" data-t="The Dead Sea Scrolls: Forty Years Behind Closed Doors"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Dead Sea Scrolls: Forty Years Behind Closed Doors</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-scrolls-monopoly</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-upuaut-door-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Kheops-Pyramid.jpg" data-cap="The Great Pyramid of Khufu, Giza" data-big><figcaption></figcaption></figure><div class="sh-k">Who Controls the Evidence</div><h2 class="sh-t" id="case-upuaut-door-st" tabindex="-1">The Door in the Great Pyramid: Who Holds the Key?</h2><p class="sh-s">A German robot found a sealed stone door deep inside the Great Pyramid in 1993. Then the work stopped for nine years.</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> Egyptian authorities have deliberately withheld discoveries made inside the Great Pyramid.</p></div><p class="v4-q">Have Egypt&#x27;s authorities held back what lies behind the Great Pyramid&#x27;s hidden doors?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Two tiny shafts, about 20 cm square, run from the Queen&#x27;s Chamber of the Great Pyramid into the masonry.</li><li>In 1993 a small robot called Upuaut climbed the southern one and found a stone slab with two copper pins: a &#x27;door&#x27;.</li><li>In 2002 a second robot drilled through it and found another stone a short way behind.</li><li>In 2011 the Djedi robot&#x27;s bendy camera saw red painted marks in the gap, probably builders&#x27; marks.</li><li>What lies behind the second stone is unknown; access to the pyramid is tightly controlled.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Engineering</span><span class="thr">Archaeology</span><span class="thr">Institutions</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="20" >20</b><span class="ctr-u"> cm</span></div><div class="ctr-l">width of the Queen&#x27;s Chamber shafts</div><div class="ctr-c">Richardson et al. 2013</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="60" >60</b><span class="ctr-u"> m</span></div><div class="ctr-l">distance Upuaut-2 climbed up the southern shaft to the first slab</div><div class="ctr-c">Lehner and Hawass 2017</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="9" >9</b><span class="ctr-u"> years</span></div><div class="ctr-l">between the 1993 find and the next exploration of the shaft</div><div class="ctr-c">1993 to 2002</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="2" >2</b><span class="ctr-u"> slabs</span></div><div class="ctr-l">found in the southern shaft, one behind the other</div><div class="ctr-c">Lehner and Hawass 2017</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Egyptian authorities have deliberately withheld discoveries made inside the Great Pyramid.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The documented record shows control and delay, not concealment. Access to the shafts was halted after 1993 and resumed only in 2002, and the explorer who found the door was not allowed back. But every mission that went in reported its results: the drill hole and second slab in 2002, the red marks and the back of the pins in a 2013 journal paper, and the muon voids in Nature. No evidence has been produced of a discovery that was made and then hidden.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Guidebooks present the shafts calmly as symbolic channels whose small doors hold no great secret. That reading is reasonable, but it is still a reading: nobody has seen what lies behind the second slab. And the official story is quiet about how access worked, the nine-year halt and the television exclusivity. Being more open about the process would do more to answer suspicion than repeating that nothing is hidden.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Two narrow shafts, about 20 cm square, leave the Queen&#x27;s Chamber to the north and south. They were found in 1872 by the engineer Waynman Dixon and do not reach the outside of the pyramid.<small>Lehner and Hawass 2017; Richardson et al. 2013</small></li><li>In March 1993 Rudolf Gantenbrink&#x27;s robot Upuaut-2, working under the German Archaeological Institute in Cairo, climbed some 60 m up the southern shaft and filmed a limestone slab with two copper fittings blocking it.<small>Stadelmann 1994; Lehner and Hawass 2017</small></li><li>Gantenbrink did not return to the shaft. The next exploration came in September 2002, when a robot built by iRobot drilled through the slab during a live television broadcast and found a second stone slab a short distance behind it; a slab was also found blocking the northern shaft.<small>Lehner and Hawass 2017</small></li><li>In 2011 the Djedi robot, led by the University of Leeds, pushed a bending camera through the drill hole and filmed red painted marks on the floor of the small space and the polished back of the copper loops; the results were published in 2013.<small>Richardson et al. 2013</small></li><li>Foreign fieldwork in Egypt needs a permit from the Supreme Council of Antiquities (earlier the Egyptian Antiquities Organization), which decides who may work where, and new discoveries are normally announced by Egypt&#x27;s antiquities authority.<small>Lehner and Hawass 2017</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Why Gantenbrink&#x27;s work was halted in 1993; a row over the news reaching the press before any Egyptian announcement is the reason most often given, but no official statement of reasons is widely available.</li><li>What the shafts were for: symbolic routes for the king&#x27;s soul toward the stars, as most Egyptologists hold, or something more practical.</li><li>Whether the nine-year gap and the television-led return in 2002 served science or the control of a spectacle.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>No exploration beyond the second slab of the southern shaft, or behind the slab in the northern shaft, has been published since 2011.</li><li>The full video and data of the 1993 and 2002 explorations have never been released as an open archive.</li><li>Most of the objects Dixon pulled from the shafts in 1872 were mislaid for over a century; a cedar fragment only resurfaced in a museum box in Aberdeen in 2020.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Egyptologists read the Queen&#x27;s Chamber shafts as symbolic, like the King&#x27;s Chamber shafts that point toward the northern and southern sky, and the slabs with copper pins as deliberate stoppers or symbolic doors. On access, the official line is that Egypt controls its monuments, as any country does, and that everything found has been announced and published: the 2002 drilling was shown live, the Djedi results were printed in a peer-reviewed journal, and the muon scans of the 2010s and 2020s were published in Nature and its sister journals.</p><ul><li>Rainer Stadelmann, who directed the German Institute in 1993, published the shaft results and argued the shafts were model corridors for the king&#x27;s ascent.</li><li>Each robot mission after 1993 reported what it saw, and the second slab and the red marks are public knowledge.</li><li>The ScanPyramids muon surveys found a large void (2017) and a corridor (2023), and both were published openly.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Robert Bauval and Graham Hancock were among the first to publicise Gantenbrink&#x27;s footage in 1993. They argue that one of the most important finds ever made inside the Great Pyramid was followed by nine years of silence, that the engineer who found the door was shut out, and that the return in 2002 was staged as a television event under the control of the antiquities chief, Zahi Hawass. Bauval has written that Gantenbrink was elbowed out so that others could claim the find. Supporters say Gantenbrink offered to lend his robot and was refused. They ask why, fifteen years after Djedi, no one has looked behind the second slab.</p><ul><li>The 1993 find was followed by a nine-year pause in exploration of the shaft.</li><li>The man who found the door never went back, and the next mission was a broadcast event.</li><li>Since 2011 the shafts have not been explored further, though the technology exists.</li></ul><div class="face-s"><b>Its strongest point</b><p>The pattern of access is real and on the record: a find in 1993, no exploration until a television deal in 2002, a brief scientific mission in 2011, and nothing published since. People are entitled to ask why.</p></div><p class="face-cr"><b>Credit</b> Robert Bauval and Graham Hancock (Keeper of Genesis, 1996; Bauval, Secret Chamber, 1999); supporters of Rudolf Gantenbrink</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>A new robot mission beyond the second slab of the southern shaft and behind the northern slab, with full video released.</li><li>Publication of the permit correspondence of 1993 between the German Institute and the Egyptian Antiquities Organization.</li><li>Release of the complete 1993 and 2002 footage as an open archive.</li><li>A published Egyptian policy on how and when discoveries by foreign teams are announced.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,157 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Door in the Great Pyramid: Who Holds the Key?"><button type="button" class="wtoc-i" data-go="upuaut-door-s1">A door at the end of a tunnel</button><button type="button" class="wtoc-i" data-go="upuaut-door-s2">What the robots found</button><button type="button" class="wtoc-i" data-go="upuaut-door-s3">The case for suspicion</button><button type="button" class="wtoc-i" data-go="upuaut-door-s4">The case for patience</button><button type="button" class="wtoc-i" data-go="upuaut-door-s5">What time and silence have hidden</button><button type="button" class="wtoc-i" data-go="upuaut-door-s6">What would settle it</button></nav></div><section class="wsec" id="upuaut-door-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A door at the end of a tunnel</h3><p>In March 1993 a small tracked robot called Upuaut-2, named after an Egyptian god who opens the ways, crept up a shaft no wider than a shoebox inside the Great Pyramid of Giza. About 60 m in, its camera lit up something no one had seen for at least 4,500 years: a smooth limestone slab closing the shaft, with two corroded copper fittings set into its face. The engineer driving it, Rudolf Gantenbrink, had found what the world press would soon call a door.</p><p>Then nothing happened for nine years. Gantenbrink never went back. When the door was finally drilled in 2002, it was on live television. When a better robot saw beyond it in 2011, the work stopped again. This is a case about a hidden space the size of a shoebox, and about a much larger question: who decides when we get to look?</p><blockquote class="wpull"><p>The pyramid kept its secret for at least 4,500 years. The paperwork kept it for nine more.</p></blockquote></section><section class="wsec" id="upuaut-door-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What the robots found</h3><p>The Great Pyramid has four narrow shafts. Two rise from the King&#x27;s Chamber and reach the outer faces. The two from the Queen&#x27;s Chamber, discovered in 1872 when the engineer Waynman Dixon chipped into the chamber walls, are about 20 cm square and stop inside the masonry. Dixon pushed rods up them and pulled out a ball of stone, a small bronze hook and a piece of cedar.</p><figure class="wx wx--static" id="upuaut-door-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Where the doors are</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Where the doors are"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" class="wx-svg" role="img" aria-labelledby="upuaut-door-f1-t"><title id="upuaut-door-f1-t">Section of the Great Pyramid showing the Queen's Chamber shafts and the stone slabs that block them, with an enlarged inset of the southern door</title><text x="24" y="28" class="wx-t-cap">Great Pyramid, north–south section</text><polygon points="99.7,400.0 330.0,106.8 560.3,400.0" class="wx-stone wx-edge"/><line x1="40" y1="400" x2="680" y2="400" class="wx-line"/><text x="93.7" y="392" text-anchor="end" class="wx-t-s">north</text><text x="566.3" y="392" class="wx-t-s">south</text><line x1="160.0" y1="394.0" x2="250.0" y2="356.6" class="wx-line"/><line x1="250.0" y1="356.6" x2="334.0" y2="314.0" class="wx-bold"/><line x1="250.0" y1="356.6" x2="324.8" y2="356.6" class="wx-line"/><rect x="324.8" y="344.2" width="10.4" height="12.4" class="wx-inkfill"/><rect x="334.0" y="302.4" width="21.0" height="11.6" class="wx-inkfill"/><text x="364.0" y="304.4" class="wx-t-s wx-halo">King's Chamber</text><text x="276.0" y="328.0" text-anchor="end" class="wx-t-s wx-halo">Grand Gallery</text><text x="332.8" y="376.2" class="wx-t-s wx-halo">Queen's Chamber</text><line x1="355.0" y1="310.0" x2="434.6" y2="240.0" class="wx-thin"/><line x1="334.0" y1="310.0" x2="211.3" y2="258.0" class="wx-thin"/><line x1="335.2" y1="354.0" x2="427.7" y2="277.5" class="wx-hl wx-draw" pathLength="1" style="--d:1"/><line x1="324.8" y1="354.0" x2="232.3" y2="277.5" class="wx-hl wx-draw" pathLength="1" style="--d:2"/><circle cx="427.7" cy="277.5" r="6" class="wx-accfill wx-pulse"/><circle cx="232.3" cy="277.5" r="5" class="wx-accfill"/><text x="222.3" y="273.5" text-anchor="end" class="wx-t-b wx-halo">northern slab</text><text x="222.3" y="288.5" text-anchor="end" class="wx-t-s wx-halo">found 2002</text><text x="391.4" y="325.8" class="wx-t-s wx-halo">southern shaft, c. 60 m</text><line x1="427.7" y1="277.5" x2="470" y2="200" class="wx-thin"/><rect x="470" y="50" width="230" height="150" rx="8" class="wx-card wx-edge"/><text x="482" y="70" class="wx-t-b">The southern door</text><rect x="482" y="110" width="206" height="40" class="wx-paper wx-edge-soft"/><rect x="600" y="108" width="14" height="44" class="wx-stone2 wx-edge"/><rect x="666" y="108" width="14" height="44" class="wx-stone3 wx-edge"/><path d="M600,117 q-7,3 0,6" class="wx-line wx-s1"/><path d="M600,137 q-7,3 0,6" class="wx-line wx-s1"/><line x1="596" y1="130" x2="618" y2="130" class="wx-dash"/><text x="574" y="98" text-anchor="middle" class="wx-t-s">copper pins</text><text x="673" y="98" text-anchor="middle" class="wx-t-s">2nd slab</text><text x="500" y="134" class="wx-t-s">shaft</text><line x1="478" y1="110" x2="478" y2="150" class="wx-dim"/><text x="482" y="170" class="wx-t-s">shaft c. 20 cm square; drill hole 2002</text><text x="482" y="186" class="wx-t-s">inset not to scale</text><line x1="60" y1="435" x2="160.0" y2="435" class="wx-bold"/><text x="60" y="425" class="wx-t-s">0</text><text x="160.0" y="425" text-anchor="end" class="wx-t-s">50 m</text><text x="176.0" y="440" class="wx-t-s">base 230 m, height c. 147 m; passages simplified</text></svg></div></div><figcaption>A north to south section of the Great Pyramid with the Queen&#x27;s Chamber shafts and the slabs that block them. <span class="wx-src">Based on: Pyramid dimensions after Lehner and Hawass 2017 (base 230.3 m, original height about 146.6 m); chamber heights and shaft routes simplified; shaft size and slab positions after Richardson et al. 2013. Shaft angles approximate and the northern shaft&#x27;s bends omitted.</span></figcaption><p class="vh">A to-scale section of the Great Pyramid, 230 m wide at the base and about 147 m high, with the Queen&#x27;s Chamber about 21 m above the base and the King&#x27;s Chamber about 43 m up, joined by the Grand Gallery. Two thin shafts rise from the Queen&#x27;s Chamber, north and south, and stop inside the masonry. A marker on the southern shaft about 60 m along its length shows the first slab found in 1993. An enlarged inset shows the shaft about 20 cm square, the first slab with two copper pins and a drill hole, a small empty space and a second slab behind it. A 50 m scale bar is shown.</p></figure><p>Gantenbrink&#x27;s project began in 1992 under the German Archaeological Institute in Cairo, then directed by Rainer Stadelmann, working with Egypt&#x27;s antiquities service. After his robot filmed the southern slab, news of the find reached the British press in April 1993, reportedly before any Egyptian announcement. The exploration of the shaft was not resumed. Stadelmann published the results, arguing that the shafts were symbolic corridors for the king&#x27;s ascent to the stars.</p><p>In September 2002 a new robot built by the Boston company iRobot climbed the same shaft in a live broadcast by National Geographic and the Fox network, overseen by Zahi Hawass, then head of the Supreme Council of Antiquities. It drilled a small hole through the slab and pushed a camera through. Behind it was a short, empty space and a second stone slab. Days later a robot in the northern shaft found a similar blocking slab.</p><figure class="wx wx--steps" id="upuaut-door-f2" data-n="4"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">Three robots at one door</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Three robots at one door"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" class="wx-svg" role="img" aria-labelledby="upuaut-door-f2-t"><title id="upuaut-door-f2-t">Close-up of the end of the southern Queen's Chamber shaft showing what the 1993, 2002 and 2011 robot missions saw, in four steps</title><text x="24" y="28" class="wx-t-cap">The end of the southern shaft (drawn level)</text><rect x="20" y="110" width="680" height="180" class="wx-stone wx-o60"/><rect x="20" y="150" width="660" height="100" class="wx-paper"/><line x1="20" y1="150" x2="680" y2="150" class="wx-line"/><line x1="20" y1="250" x2="680" y2="250" class="wx-line"/><rect x="440" y="150" width="26" height="100" class="wx-stone2 wx-edge"/><path d="M440,172 q-16,8 0,16" class="wx-bold wx-s1"/><path d="M440,212 q-16,8 0,16" class="wx-bold wx-s1"/><text x="453" y="100" text-anchor="middle" class="wx-t-b">first slab</text><line x1="453" y1="106" x2="453" y2="146" class="wx-thin"/><rect x="560" y="150" width="30" height="100" class="wx-stone3 wx-edge"/><text x="575" y="100" text-anchor="middle" class="wx-t-b">second slab</text><line x1="575" y1="106" x2="575" y2="146" class="wx-thin"/><g class="wx-st" data-s="1"><rect x="290" y="206" width="110" height="34" rx="5" class="wx-metal wx-edge"/><circle cx="305" cy="244" r="6" class="wx-inkfill"/><circle cx="385" cy="244" r="6" class="wx-inkfill"/><circle cx="398" cy="220" r="5" class="wx-glow wx-pulse"/><path d="M402,220 L436,170 M402,220 L436,238" class="wx-dash"/></g><g class="wx-st wx-hide" data-only="1"><text x="40" y="310" class="wx-t-b">1993 · Upuaut-2</text><text x="40" y="327" class="wx-t-s">films the slab and two copper pins; exploration halted</text></g><text x="345" y="174" text-anchor="middle" class="wx-t-s">robot</text><g class="wx-st wx-hide" data-s="2"><rect x="438" y="194" width="30" height="8" class="wx-paper"/><path d="M420,198 L556,198" class="wx-hl wx-flow"/></g><g class="wx-st wx-hide" data-only="2"><text x="40" y="310" class="wx-t-b">2002 · live broadcast</text><text x="40" y="327" class="wx-t-s">drill hole through the slab; camera sees a short space and a second slab</text></g><g class="wx-st wx-hide" data-s="3"><path d="M420,198 L480,198 C505,198 510,220 495,230" class="wx-bold wx-s2"/><circle cx="493" cy="231" r="4" class="wx-glow"/><path d="M466,172 q10,8 0,16 M466,212 q10,8 0,16" class="wx-line wx-s1"/><path d="M488,247 l6,-6 M498,247 l4,-6 l4,6 M512,247 l6,-6" class="wx-bold wx-s4"/></g><g class="wx-st wx-hide" data-only="3"><text x="40" y="310" class="wx-t-b">2011 · Djedi</text><text x="40" y="327" class="wx-t-s">snake camera films red painted marks and the polished backs of the loops</text></g><g class="wx-st wx-hide" data-s="4"><text x="636" y="212" text-anchor="middle" class="wx-t-big wx-t-a">?</text></g><g class="wx-st wx-hide" data-only="4"><text x="40" y="310" class="wx-t-b">Since 2011</text><text x="40" y="327" class="wx-t-s">no further exploration published; beyond the second slab is unknown</text></g><text x="60" y="204" class="wx-t-s">to the Queen's Chamber</text><line x1="690" y1="150" x2="690" y2="250" class="wx-dim"/><text x="690" y="268" text-anchor="end" class="wx-t-s">c. 20 cm</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 4.</b> 1993: Upuaut-2 climbs about 60 m and films a slab with two copper pins blocking the shaft.</p><ol class="wx-steplist"><li>1993: Upuaut-2 climbs about 60 m and films a slab with two copper pins blocking the shaft.</li><li>2002: on live television a robot drills through the slab; a camera sees a short space and a second slab.</li><li>2011: the Djedi snake camera films red painted marks and the polished backs of the copper loops.</li><li>Since 2011: no further exploration published; what lies beyond the second slab is unknown.</li></ol><figcaption>What each mission to the end of the southern shaft could see, and what it could not. <span class="wx-src">Based on: Lehner and Hawass 2017; Richardson et al. 2013; NBC News 2011. Distances inside the shaft schematic.</span></figcaption><p class="vh">A close-up side view of the end of the southern shaft. Step 1, 1993: the Upuaut-2 robot reaches the first slab and films its two copper pins. Step 2, 2002: a robot drills a small hole and a camera shows a short empty space and a second slab. Step 3, 2011: the Djedi robot&#x27;s bending camera films red marks on the floor and the polished backs of the copper loops. Step 4: what lies beyond the second slab remains unexplored, shown as a question mark.</p></figure><p>In 2011 the Djedi robot, led by Rob Richardson of the University of Leeds, fed a bending &#x27;snake&#x27; camera through the drill hole. It filmed red painted marks on the floor of the small space, which some read as builders&#x27; marks or numerals, and showed that the copper loops curl back neatly on the far side of the door, polished, like fittings rather than decorations. The team published in the Journal of Field Robotics in 2013. Since then, no further exploration of the shafts has been reported.</p></section><section class="wsec" id="upuaut-door-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The case for suspicion</h3><p>Robert Bauval and Graham Hancock, who helped bring Gantenbrink&#x27;s footage to the public in 1993, have argued for decades that the handling of the door looks bad. The discoverer was shut out. The shaft sat untouched for nine years. The return was packaged as a television event under the control of one official. Bauval has written that Gantenbrink was elbowed out so the project could be held for later, and supporters say the engineer offered to lend his robot and was refused. These are claims by named people, not documented findings, and they should be read that way.</p><p>The strongest part of the case does not need their interpretation. The timeline of access is on the record, and it is odd. A find that Egyptologists agreed was interesting was left alone for most of a decade, and after a brief scientific mission in 2011 the shafts have been left alone again for fifteen years.</p><aside class="wcall"><b>On record, off record</b><p>On record: the 1993 find, the halt, the 2002 broadcast, the second slab, the 2013 Djedi paper, the permit system. Off record: that Gantenbrink offered his robot and was refused, that the halt was engineered to keep the find for others, that anything was found and not announced. The first list is documented. The second rests on the word of participants and their supporters.</p></aside></section><section class="wsec" id="upuaut-door-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The case for patience</h3><p>Egypt&#x27;s side of the story is less dramatic. Every foreign mission works under a permit from the antiquities authority, and discoveries by foreign teams are normally announced by Egypt, not by the team or the press. A leaked find, under that system, is a breach of the terms, and halts after such breaches are not unusual. The shafts are also fragile, tiny and inside the country&#x27;s most visited monument.</p><p>More important, the record does not show concealment. Everything that each robot saw was made public. When the ScanPyramids project detected a large void above the Grand Gallery using cosmic-ray muons, the result was published in Nature in 2017, and the corridor behind the north face was imaged and published in 2023 and confirmed with other methods in 2025. These are the actions of authorities who control access tightly, and like the credit, not of authorities hiding finds.</p><p>There is history behind Egypt&#x27;s caution, too. For most of two centuries foreigners dug in Egypt largely on their own terms. In 1837 Colonel Howard Vyse used gunpowder to force his way into the spaces above the King&#x27;s Chamber, and the objects Dixon pulled from the Queen&#x27;s Chamber shafts in 1872 left the country. A modern permit system that makes Egypt the gatekeeper, and the announcer, of its own heritage is a response to that past. It can be clumsy and it can be political, but it is not in itself evidence of a cover-up.</p></section><section class="wsec" id="upuaut-door-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>What time and silence have hidden</h3><p>Some of the evidence has been lost the old-fashioned way. The objects Dixon took from the shafts in 1872 went to Britain; the cedar fragment was lost for more than a century until a curator in Aberdeen found it in a cigar box in 2020 and had it radiocarbon dated. The unedited footage of 1993 and 2002 has never been released as an open archive. And the space behind the second slab is, quite simply, unknown.</p><aside class="wcall"><b>Fresh from the field</b><p>In August 2026 the journal Remote Sensing retracted a 2022 paper claiming that satellite radar revealed a network of corridors inside the Great Pyramid. The door case shows the other side of the problem: when real exploration is slow and closely held, bold claims from outside fill the silence.</p></aside></section><section class="wsec" id="upuaut-door-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What would settle it</h3><p>The fix is not mysterious. A new robot, of the kind that climbed the shafts in 2011, could look behind both slabs in days, with the full video released as it is recorded. Publication of the 1993 correspondence would show why Gantenbrink&#x27;s work stopped. And a clear, published rule on who announces discoveries, and when, would take much of the heat out of every future find at Giza, including the scans discussed in the Great Pyramid deep dive and in the Khafre Scans and Chambers Under the Sphinx cases.</p><blockquote class="wpull"><p>Nothing on the record says a discovery was hidden. Everything on the record says access was rationed.</p></blockquote></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">2,560 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Great Pyramid built for Khufu</span></li><li class="wtl-find" style="--i:1"><span class="wtl-y">1872 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Waynman Dixon finds the Queen&#x27;s Chamber shafts</span></li><li class="wtl-find" style="--i:2"><span class="wtl-y">1993 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Upuaut-2 films the southern door</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">2002 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Live broadcast: drill hole, second slab</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">2011 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Djedi films red marks behind the door</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">2017 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">ScanPyramids reports the Big Void</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2023 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">North Face Corridor imaged</span></li><li class="wtl-event" style="--i:7"><span class="wtl-y">2026 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Radar paper on the pyramid retracted</span></li></ol><details class="srcs"><summary>Sources for this case (14)</summary><ol><li>Lehner, M., Hawass, Z. (2017). Giza and the Pyramids. Thames &amp; Hudson, London.</li><li>Stadelmann, R. (1994). Die sogenannten Luftkanäle der Cheopspyramide: Modellkorridore für den Aufstieg des Königs zum Himmel. Mitteilungen des Deutschen Archäologischen Instituts, Abteilung Kairo 50: 285–294.</li><li>Richardson, R. et al. (2013). The &#x27;Djedi&#x27; robot exploration of the southern shaft of the Queen&#x27;s Chamber in the Great Pyramid of Giza, Egypt. Journal of Field Robotics 30(3): 323–348. <a href="https://doi.org/10.1002/rob.21451" target="_blank" rel="noopener">doi:10.1002/rob.21451</a></li><li>University of Leeds, Robotics at Leeds. Djedi robot: archaeological expedition (project page).</li><li>NBC News (May 2011). Robot finds hidden hieroglyphs inside pyramid.</li><li>Morishima, K. et al. (2017). Discovery of a big void in Khufu&#x27;s Pyramid by observation of cosmic-ray muons. Nature 552: 386–390. <a href="https://doi.org/10.1038/nature24647" target="_blank" rel="noopener">doi:10.1038/nature24647</a></li><li>Procureur, S. et al. (2023). Precise characterization of a corridor-shaped structure in Khufu&#x27;s Pyramid by observation of cosmic-ray muons. Nature Communications 14: 1144. <a href="https://doi.org/10.1038/s41467-023-36351-0" target="_blank" rel="noopener">doi:10.1038/s41467-023-36351-0</a></li><li>Schumacher, T. et al. (2025). Confirmation of the ScanPyramids North Face Corridor in the Great Pyramid of Giza using multi-modal image fusion from three non-destructive testing techniques. Scientific Reports 15: 9275. <a href="https://doi.org/10.1038/s41598-025-91115-8" target="_blank" rel="noopener">doi:10.1038/s41598-025-91115-8</a></li><li>Hancock, G., Bauval, R. (1996). Keeper of Genesis (US title The Message of the Sphinx). Heinemann, London.</li><li>Bauval, R. (1999). Secret Chamber: The Quest for the Hall of Records. Century, London.</li><li>University of Aberdeen (16 December 2020). Missing 5,000-year-old piece of Great Pyramid puzzle discovered in cigar box in Aberdeen. News release.</li><li>Retraction Watch (31 August 2026). Journal retracts paper claiming network of corridors inside the Great Pyramid of Giza.</li><li>Vyse, H. (1840–42). Operations Carried On at the Pyramids of Gizeh in 1837. 3 vols. James Fraser, London.</li><li>Giza-Legacy (undated). 1991–2009 discoveries (account sympathetic to Gantenbrink, Bauval and Hancock; used only for their claims).</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-upuaut-door" data-t="The Door in the Great Pyramid: Who Holds the Key?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Door in the Great Pyramid: Who Holds the Key?</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-upuaut-door</span> (updated 28 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-sphinx-surveys-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Great Sphinx of Giza - 20080716a.jpg" data-cap="The Great Sphinx of Giza in its enclosure" data-big><figcaption></figcaption></figure><div class="sh-k">Who Controls the Evidence</div><h2 class="sh-t" id="case-sphinx-surveys-st" tabindex="-1">The Sphinx Surveys: Was Independent Research Shut Down?</h2><p class="sh-s">A geologist said the Sphinx was thousands of years older than Egypt&#x27;s kings. Then came the fight over who could study it.</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> Independent research on the Sphinx enclosure was stopped to protect the conventional date.</p></div><p class="v4-q">Were independent studies of the Sphinx halted to protect its textbook date?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Between 1978 and 1996 at least five teams from the USA, Japan and Egypt surveyed the ground around the Sphinx with radar and seismic methods.</li><li>In 1998 Egypt allowed one test drill into an anomaly; it found a natural cavity, and no more drilling was allowed.</li><li>Critics say access grew harder after a 1993 TV special made the &#x27;older Sphinx&#x27; idea famous, and that data were never fully released.</li><li>The authorities say the statue is fragile and every drill hole is a risk.</li><li>Tight control is documented; a cover-up is not. Publishing the raw data would settle most of the argument.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Institutions</span><span class="thr">Physics</span><span class="thr">Archaeology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="5" >5</b><span class="ctr-u"> surveys</span></div><div class="ctr-l">geophysical surveys at the Sphinx listed by Hawass, 1978–1996</div><div class="ctr-c">Hawass and Lehner 1997</div></div><div class="ctr"><div class="ctr-v">up to <b class="ctr-n" data-v="2.4" data-dec="1">2.4</b><span class="ctr-u"> m</span></div><div class="ctr-l">deepest weathering Dobecki&#x27;s seismic lines found under the enclosure floor</div><div class="ctr-c">Dobecki and Schoch 1992</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="33" >33</b><span class="ctr-u"> million</span></div><div class="ctr-l">estimated viewers of NBC&#x27;s The Mystery of the Sphinx, 1993</div><div class="ctr-c">NBC 1993</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="1" >1</b><span class="ctr-u"> drill test</span></div><div class="ctr-l">allowed in 1998; it reached a natural cavity</div><div class="ctr-c">Hall of Records summary</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Independent research on the Sphinx enclosure was stopped to protect the conventional date.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The record shows that independent research was permitted, repeatedly: a US geologist&#x27;s seismic survey in 1991, an Egyptian one in 1992 and a US university survey in 1996, and the Egyptian side allowed a test drilling in 1998. What was refused was further drilling after that test found natural rock, and the authorities kept tight control of methods and publicity. That is gatekeeping, and the conflict of interest is real, but no document or testimony shows that research was stopped because of what it might reveal about the date.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks present the Sphinx as Khafre&#x27;s work, carved about 2500 BCE, and rarely mention the surveys at all. The conventional date has good archaeological support, so the confidence is not baseless. But the way access was managed, by the same officials who defended that date, means the textbooks sound more certain about the process than the process deserves. Open data would cost nothing and settle much.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>At least five geophysical surveys were carried out at the Sphinx between 1978 and 1996: SRI International (1977–78), Waseda University (1987), the Schoch, Dobecki and West team (1991), Imam Marzouk and Ali Gharib (1992) and Florida State University with the Schor Foundation (April 1996).<small>Hawass and Lehner 1997 (NOVA)</small></li><li>In April 1991, with the permission of the Egyptian Antiquities Organization, geophysicist Thomas Dobecki and geologist Robert Schoch ran seismic tests on the enclosure floor and reported weathering 1.8–2.4 m deep in front and along the sides, roughly half as deep at the rear.<small>Dobecki and Schoch 1992</small></li><li>Schoch presented his redating to the Geological Society of America on 23 October 1991, and NBC broadcast The Mystery of the Sphinx on 10 November 1993 to an estimated 33 million viewers.<small>Schoch 1992; NBC 1993</small></li><li>In 1998 the Supreme Council of Antiquities allowed a test drilling to check what the radar surveys had detected; the drill reached a natural cavity, and the council refused permission to drill elsewhere.<small>Hall of Records summary (Wikipedia); Lehner and Hawass 2017</small></li><li>Survey permits in Egypt carry conditions set by the antiquities authority, including limits on methods (Hawass wrote that the size of seismic blasts near the Sphinx was restricted) and on how and when results are released.<small>Hawass 1998</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the Sphinx enclosure&#x27;s weathering and the depth of weathered rock under its floor point to a date thousands of years before Khafre (the Sphinx Erosion case weighs this).</li><li>Why fieldwork by West and Schoch did not continue after the early 1990s: their supporters describe exclusion, the authorities describe normal permit decisions.</li><li>Whether refusing further drilling after 1998 protected a fragile monument or closed off a legitimate test.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Most anomalies reported by the 1990s surveys were never tested by drilling or excavation, and the raw data of several surveys were never published in full.</li><li>The permit files and correspondence for the 1991–1998 surveys have not been released.</li><li>Parts of the bedrock around the Sphinx were covered by repairs and restoration masonry over the centuries, hiding the original surface.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Egyptologists say the Sphinx has been surveyed more than almost any monument on Earth and that nothing found requires a new date. Zahi Hawass, then in charge at Giza, answered critics in 1997 by listing the surveys he had allowed and writing: &#x27;Nor do we try to stop reasonable research.&#x27; He and Mark Lehner argue the Sphinx is a fragile, crumbling statue under constant restoration, that every drill hole and blast is a risk, and that the one test drilling allowed in 1998 found only a natural cavity. On the age, they rely on the quarry sequence and the Sphinx Temple.</p><ul><li>Five surveys in under twenty years, including two by foreign teams in the 1990s, is not the record of a closed site.</li><li>The 1998 drilling was the test the challengers asked for, and it found natural rock.</li><li>Limits on blasts and drilling were set to protect a statue that was losing stone at the time.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Robert Schoch, a Boston University geologist, and the writer John Anthony West argue that rain weathering dates the carving of the Sphinx enclosure to well before 2500 BCE, and that Dobecki&#x27;s seismic data showed both deep weathering and a possible rectangular cavity under the front paws. They and supporters such as Graham Hancock and Robert Bauval argue that after the 1993 broadcast made the idea famous, independent teams found access harder, that later surveys worked under tight controls on what they could say, and that the anomalies were never tested properly.</p><ul><li>The most interesting anomaly from 1991, under the front paws, has not been excavated.</li><li>The 1996 survey team was reportedly bound not to publish without official permission.</li><li>The same officials who defen
