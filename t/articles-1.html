 to 1972 for the study. A red bar from 1943 to 1972 is labelled penicillin available, not offered. Markers show 1932, study begins in Macon County, Alabama; 1943, penicillin the treatment of choice according to the CDC; 1966, Peter Buxtun protests inside the Public Health Service; 1969, a CDC panel votes to continue; 1972, the AP story and the end of the study in November; 1974, the $10 million settlement; 1997, President Clinton&#x27;s apology on 16 May; and 2004, the death of the last participant in January.</p></figure><p>The lawyer Fred Gray filed a class action on behalf of the men and their families in 1973. It was settled out of court in 1974 for $10 million. The government set up the Tuskegee Health Benefit Program to provide medical care, extended in 1975 to wives, widows and children. The last man in the study died in January 2004, and the last widow in January 2009. On 16 May 1997, with survivors present at the White House, President Bill Clinton apologised on behalf of the nation.</p></section><section class="wsec" id="tuskegee-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>What changed because of it</h3><p>Tuskegee changed the rules of medical research in the United States. In July 1974 Congress passed the National Research Act, which created a national commission on the protection of human subjects. Its Belmont Report of 1979 set out the principles still taught to every researcher: respect for persons, which means informed consent; beneficence, which means minimising harm; and justice, which means not loading the burdens of research onto the poor and powerless. Research on people funded by the federal government must now be approved in advance by an institutional review board.</p><p>The study also left hard questions about the people inside it. Eunice Rivers, the nurse who knew the men for decades, drove them to appointments, sat with their families and persuaded them to stay. Some historians see her as a victim of the same system, a Black professional with little power who believed she was helping; others see her as its most effective instrument. Both views appear in Reverby&#x27;s work, and both remind us that institutions do harm through ordinary people doing their jobs.</p></section><section class="wsec" id="tuskegee-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The challengers, and the myth</h3><p>In most cases on this site the challenger argues against an official account. At Tuskegee the official record bore the challengers out. Buxtun, Gray and later the historian Susan Reverby argued that this was a deliberate policy, renewed decision by decision, and not a regrettable oversight. The CDC&#x27;s 1969 review is the hardest fact against any gentler reading: long after penicillin was standard, officials looked at the study and chose to keep going.</p><p>One popular belief, though, goes beyond the evidence. Many people have heard that the government infected the Tuskegee men with syphilis. The men already had the disease when they were enrolled; the harm was in deception and withheld care. But the belief did not come from nowhere. In 2010 Reverby found records of a PHS study in Guatemala, from 1946 to 1948, in which researchers deliberately infected prisoners, soldiers and psychiatric patients with syphilis and gonorrhoea. The United States apologised to Guatemala that year, and a presidential commission reported on it in 2011.</p><blockquote class="wpull"><p>The Tuskegee men were not infected by doctors. People in Guatemala were.</p></blockquote></section><section class="wsec" id="tuskegee-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What it did to trust</h3><p>The damage outlived the study. In 2018 the economists Marcella Alsan and Marianne Wanamaker, writing in the Quarterly Journal of Economics, found that the 1972 disclosure was followed by more medical mistrust and fewer doctor visits among older Black men, and estimated a measurable fall in their life expectancy. Their paper is one study with its own assumptions, but it put numbers to what many families already knew.</p><p>For this site, Tuskegee matters in a specific way. When people doubt an official account, whether of a medical programme, a buried site or a crashed balloon, they are sometimes dismissed as paranoid. Tuskegee is the reminder that institutions have done exactly what they were suspected of, and have been exposed by their own documents. It also shows how exposure happens: through whistleblowers, reporters, records and courts.</p></section><section class="wsec" id="tuskegee-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What is lost, and what would help</h3><p>The men&#x27;s own voices are the great gap. Few were ever asked to tell their story, and the last of them died in 2004. Records of the infected wives and of children born with congenital syphilis are incomplete. The clearest remaining work is to publish the surviving study files in full, with names protected, so each decision to continue can be traced to the officials who made it; to record oral histories from descendants; and to extend the work that Alsan and Wanamaker began on the long shadow of mistrust. None of that is needed to answer the central question. The government&#x27;s own record answers it.</p><aside class="wcall"><b>Where this leaves us</b><p>Documented wrongdoing, admitted by the government that committed it. The weight of evidence for the claim is as strong as history gets. The one belief to set aside is that the Tuskegee men were deliberately infected; the Guatemala study, not Tuskegee, is where that happened.</p></aside></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">1932 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Study begins in Macon County</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">1943 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Penicillin becomes the treatment of choice</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">1966 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Peter Buxtun raises objections</span></li><li class="wtl-use" style="--i:3"><span class="wtl-y">1969 CE</span><span class="wtl-k">In use</span><span class="wtl-t">CDC panel votes to continue</span></li><li class="wtl-find" style="--i:4"><span class="wtl-y">1972 CE</span><span class="wtl-k">Found</span><span class="wtl-t">AP story; study ended in November</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">1974 CE</span><span class="wtl-k">Event</span><span class="wtl-t">$10 million settlement; National Research Act</span></li><li class="wtl-event" style="--i:6"><span class="wtl-y">1997 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Presidential apology</span></li><li class="wtl-loss" style="--i:7"><span class="wtl-y">2004 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Last participant dies</span></li></ol><details class="srcs"><summary>Sources for this case (11)</summary><ol><li>Centers for Disease Control and Prevention. The U.S. Public Health Service Untreated Syphilis Study at Tuskegee: Timeline. cdc.gov/tuskegee (accessed September 2026).</li><li>Jones, J. H. (1993). Bad Blood: The Tuskegee Syphilis Experiment. New and expanded edition. Free Press, New York (first edition 1981).</li><li>Reverby, S. M. (2009). Examining Tuskegee: The Infamous Syphilis Study and Its Legacy. University of North Carolina Press, Chapel Hill.</li><li>Tuskegee Syphilis Study Ad Hoc Advisory Panel (1973). Final Report. US Department of Health, Education, and Welfare, Washington.</li><li>Heller, J. (25 July 1972). Syphilis victims in U.S. study went untreated for 40 years. Associated Press.</li><li>Gray, F. D. (1998). The Tuskegee Syphilis Study: The Real Story and Beyond. NewSouth Books, Montgomery.</li><li>Alsan, M. and Wanamaker, M. (2018). Tuskegee and the health of Black men. Quarterly Journal of Economics 133(1): 407–455. <a href="https://doi.org/10.1093/qje/qjx029" target="_blank" rel="noopener">doi:10.1093/qje/qjx029</a></li><li>Brandt, A. M. (1978). Racism and research: the case of the Tuskegee Syphilis Study. Hastings Center Report 8(6): 21–29. <a href="https://doi.org/10.2307/3561468" target="_blank" rel="noopener">doi:10.2307/3561468</a></li><li>Clinton, W. J. (16 May 1997). Remarks by the President in apology for study done in Tuskegee. The White House, Office of the Press Secretary.</li><li>Presidential Commission for the Study of Bioethical Issues (2011). &#x27;Ethically Impossible&#x27;: STD Research in Guatemala from 1946 to 1948. Washington.</li><li>Benedek, T. G. and Erlen, J. (1999). The scientific environment of the Tuskegee Study of Syphilis, 1920–1960. Perspectives in Biology and Medicine 43(1): 1–30.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-tuskegee" data-t="Tuskegee: Forty Years Without Treatment"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Tuskegee: Forty Years Without Treatment</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-tuskegee</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-stargate-psychic-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="SRI International HQ.jpg" data-cap="SRI International, Menlo Park, where the government&#x27;s remote-viewing research began in 1972" data-big><figcaption></figcaption></figure><div class="sh-k">What Governments Did</div><h2 class="sh-t" id="case-stargate-psychic-st" tabindex="-1">Stargate: The Pentagon&#x27;s Psychic Spies</h2><p class="sh-s">For 23 years the US government paid people to spy with their minds. The files are open now. Did it work?</p><div class="sh-v"><span class="vstamp vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><p class="sh-claim"><b>What the stamp rates:</b> Government-funded remote viewing produced reliable intelligence.</p></div><p class="v4-q">Did government-funded remote viewing ever produce reliable intelligence?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>From 1972 to 1995 the US government paid psychics to describe distant places by mind alone.</li><li>The programme cost about 20 million dollars and had at most about 22 people.</li><li>The files, online since 2017, hold striking anecdotes.</li><li>The one systematic review, in 1995, found the output vague and never found an operation it had guided; the agencies shut it down.</li><li>Reliable intelligence is ruled out; whether any laboratory effect exists is a separate dispute.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Institutions</span><span class="thr">Biology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="23" >23</b><span class="ctr-u"> years</span></div><div class="ctr-l">of government-funded remote-viewing work, 1972–1995</div><div class="ctr-c">AIR 1995</div></div><div class="ctr"><div class="ctr-v">c. $<b class="ctr-n" data-v="20" >20</b><span class="ctr-u"> million dollars</span></div><div class="ctr-l">approximate total cost</div><div class="ctr-c">AIR 1995; CIA CREST files</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="5" >5</b><span class="ctr-u"> code names</span></div><div class="ctr-l">for the military unit, from Gondola Wish to Star Gate</div><div class="ctr-c">AIR 1995</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="3" >3</b><span class="ctr-u"> staff</span></div><div class="ctr-l">left in the unit when it closed in 1995</div><div class="ctr-c">CIA CREST files</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Government-funded remote viewing produced reliable intelligence.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The only systematic evaluation of the programme&#x27;s intelligence use, commissioned by the CIA in 1995, found the output vague, ambiguous and dependent on other information, and found no operation it had guided. The agencies that ran it for 23 years ended it on that advice, and the declassified files, online since 2017, contain striking anecdotes but no record of reliable, actionable accuracy. This verdict is about operational reliability. Whether laboratory remote viewing shows any real effect is a separate, still disputed question.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Reference works present Stargate as a failed programme, and on its intelligence value they are right. But they are often dismissive in a way that hides two facts: the government funded it seriously for 23 years, and one of its two expert reviewers judged the laboratory evidence significant. The honest summary is that it failed as intelligence while the underlying scientific argument was never fully closed.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>From 1972 the CIA funded research into remote viewing, the claimed ability to describe distant or hidden places by mind alone, by the physicists Harold Puthoff and Russell Targ at the Stanford Research Institute (SRI) in Menlo Park, with subjects including the artist Ingo Swann and the former police commissioner Pat Price.<small>AIR 1995; Wikipedia summary of CIA files</small></li><li>In 1977 the army set up a small remote-viewing unit at Fort Meade, Maryland, which ran under the code names Gondola Wish, Grill Flame, Center Lane and Sun Streak before being consolidated as Star Gate in 1991, later under the Defense Intelligence Agency.<small>AIR 1995</small></li><li>The programme cost about $20 million over its life. The unit had around 15 to 22 people at its peak and three when it closed in 1995.<small>AIR 1995; CIA CREST files</small></li><li>In 1995 the CIA commissioned the American Institutes for Research (AIR) to evaluate the programme. Its report of September 1995 found the information from remote viewing &#x27;vague and ambiguous&#x27; and concluded that its continued use in intelligence operations was not warranted. The programme was closed and made public that year.<small>Mumford, Rose and Goslin 1995</small></li><li>The two expert reviewers disagreed: the statistician Jessica Utts judged the laboratory results to be evidence of psychic functioning, while the psychologist Ray Hyman judged that conclusion premature.<small>Utts 1996; Hyman 1996</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the laboratory results at SRI and SAIC show a real effect or reflect flaws in protocols, judging and reporting.</li><li>Whether celebrated operational hits, such as Pat Price&#x27;s 1974 description of a crane at a Soviet site, were accurate beyond chance and selective memory.</li><li>Whether the AIR evaluation, which looked closely at the programme&#x27;s last years, gave a fair picture of its earlier operational record.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Complete tasking records showing every operational question put to the viewers, including the misses, so hits can be judged against all attempts.</li><li>Independent replication of the strongest laboratory results by skeptical researchers under agreed protocols.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Most scientists and intelligence professionals read the Stargate record as a Cold War experiment that did not pay off. Fear that the Soviet Union was researching psychic methods made the United States fund its own. The laboratory work was vulnerable to known problems, including cues in transcripts, loose judging and selective reporting. The operational output, when evaluated, was vague, needed other intelligence to interpret, and was never shown to have guided an operation. After 23 years and about $20 million the government shut it down on the advice of the evaluation it commissioned.</p><ul><li>Marks and Kammann showed in 1978 that SRI transcripts contained cues that could let a judge match them to targets without any psychic information.</li><li>The AIR evaluation found no case in which remote viewing had provided information that guided intelligence operations.</li><li>Hyman argued that without an agreed, replicable effect under skeptical controls, positive statistics are not enough.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>The challengers argue that remote viewing worked well enough, often enough, to keep a skeptical military and intelligence establishment paying for it through five administrations. Targ and Puthoff point to laboratory trials published in Nature in 1974 and later protocols tightened in response to critics. Utts, a professor of statistics asked to review the evidence for the CIA, concluded that by the standards used in any other field of science, psychic functioning had been well established. Former viewers such as McMoneagle and Smith describe operational sessions whose details were later confirmed.</p><ul><li>Laboratory protocols were repeatedly tightened in response to criticism and effects were still reported.</li><li>A statistician chosen by the evaluators judged the laboratory case strong.</li><li>Government sponsors reviewed and renewed the programme many times over two decades.</li></ul><div class="face-s"><b>Its strongest point</b><p>Jessica Utts, an independent statistician chosen for the 1995 review, concluded that the laboratory results met the standards applied to other areas of science. Her report was published alongside the skeptical one.</p></div><p class="face-cr"><b>Credit</b> Russell Targ and Harold Puthoff (SRI physicists); Jessica Utts (statistician, AIR reviewer); Joseph McMoneagle and Paul H. Smith (former Army remote viewers)</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>A preregistered, multi-laboratory replication of the best remote-viewing protocol, designed jointly by proponents and skeptics, with blind judging and all results published.</li><li>Publication of complete operational tasking logs, including every miss, so hit rates can be compared with chance and with ordinary analysts.</li><li>Independent re-judging of archived SRI and SAIC transcripts with all possible cues removed.</li><li>A head-to-head test of remote viewers against trained analysts given the same limited information.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,137 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Stargate: The Pentagon&#x27;s Psychic Spies"><button type="button" class="wtoc-i" data-go="stargate-psychic-s1">The spies who stayed in their chairs</button><button type="button" class="wtoc-i" data-go="stargate-psychic-s2">What the record shows</button><button type="button" class="wtoc-i" data-go="stargate-psychic-s3">How a trial worked, and where it could leak</button><button type="button" class="wtoc-i" data-go="stargate-psychic-s4">The challengers&#x27; case at its strongest</button><button type="button" class="wtoc-i" data-go="stargate-psychic-s5">The evaluation</button><button type="button" class="wtoc-i" data-go="stargate-psychic-s6">Why it matters for the mysteries</button><button type="button" class="wtoc-i" data-go="stargate-psychic-s7">What would settle it</button></nav></div><section class="wsec" id="stargate-psychic-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The spies who stayed in their chairs</h3><p>In a plain building at Fort Meade, Maryland, in the 1980s, a soldier sits in a darkened room with a notepad. An interviewer gives him nothing but a set of random numbers standing for a target. The soldier closes his eyes, relaxes and begins to describe what comes to mind: a tall structure, a curve of metal, something cold. He sketches it. Somewhere, perhaps, an analyst will compare his sketch with satellite photographs of a Soviet facility.</p><p>This was remote viewing, and for 23 years the United States government paid for it. The programme had many names, ending with Star Gate, and its existence was confirmed only in 1995. Today most of its files are public. That makes it one of the few alleged government secrets about the paranormal that we can actually test against the record.</p><blockquote class="wpull"><p>For once the secret files are open. The question is what they show.</p></blockquote></section><section class="wsec" id="stargate-psychic-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What the record shows</h3><p>The story begins in 1972, when the CIA, worried by reports that the Soviet Union was researching psychic phenomena, funded two laser physicists, Harold Puthoff and Russell Targ, at the Stanford Research Institute in Menlo Park. They worked with gifted subjects, notably the New York artist Ingo Swann and a retired police commissioner, Pat Price. In 1974 they published results in Nature, which printed the paper with an unusual editorial note on the referees&#x27; reservations.</p><figure class="wx wx--static" id="stargate-psychic-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Twenty-three years, five code names</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Twenty-three years, five code names"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" class="wx-svg" role="img" aria-labelledby="stargate-psychic-f1-t"><title id="stargate-psychic-f1-t">Timeline of US government remote-viewing research and operations from 1972 to 1995, with the laboratory work at SRI and SAIC and the army and DIA unit under its successive code names, ending with the 1995 evaluation</title><text x="24" y="28" class="wx-t-cap">Twenty-three years of government psychic research</text><line x1="60" y1="300" x2="660" y2="300" class="wx-line"/><line x1="60.0" y1="300" x2="60.0" y2="306" class="wx-dim"/><text x="60.0" y="322" text-anchor="middle" class="wx-t-s">1970</text><line x1="165.0" y1="300" x2="165.0" y2="306" class="wx-dim"/><text x="165.0" y="322" text-anchor="middle" class="wx-t-s">1975</text><line x1="270.0" y1="300" x2="270.0" y2="306" class="wx-dim"/><text x="270.0" y="322" text-anchor="middle" class="wx-t-s">1980</text><line x1="375.0" y1="300" x2="375.0" y2="306" class="wx-dim"/><text x="375.0" y="322" text-anchor="middle" class="wx-t-s">1985</text><line x1="480.0" y1="300" x2="480.0" y2="306" class="wx-dim"/><text x="480.0" y="322" text-anchor="middle" class="wx-t-s">1990</text><line x1="585.0" y1="300" x2="585.0" y2="306" class="wx-dim"/><text x="585.0" y="322" text-anchor="middle" class="wx-t-s">1995</text><text x="60" y="76" class="wx-t-b">Laboratory research</text><rect x="102.0" y="86" width="399.0" height="22" class="wx-c5 wx-o60 wx-growx" style="--d:1"/><text x="108.0" y="101" class="wx-t-s wx-halo">SRI, Menlo Park (Puthoff, Targ, later May)</text><rect x="501.0" y="86" width="84.0" height="22" class="wx-c5 wx-growx" style="--d:2"/><text x="591.0" y="101" class="wx-t-s">SAIC</text><text x="60" y="146" class="wx-t-b">Military remote-viewing unit, Fort Meade</text><rect x="207.0" y="156" width="21.0" height="22" class="wx-c2 wx-o40 wx-growx" style="--d:3"/><rect x="228.0" y="156" width="105.0" height="22" class="wx-c2 wx-o60 wx-growx" style="--d:4"/><rect x="333.0" y="156" width="63.0" height="22" class="wx-c2 wx-o80 wx-growx" style="--d:5"/><rect x="396.0" y="156" width="105.0" height="22" class="wx-c7 wx-o60 wx-growx" style="--d:6"/><rect x="501.0" y="156" width="84.0" height="22" class="wx-c7 wx-growx" style="--d:7"/><text x="234.0" y="171" class="wx-t-s wx-halo">Grill Flame</text><text x="402.0" y="171" class="wx-t-s wx-halo">Sun Streak</text><text x="507.0" y="171" class="wx-t-s wx-halo">Star Gate</text><line x1="207.0" y1="182" x2="207.0" y2="200" class="wx-thin"/><text x="207.0" y="214" text-anchor="middle" class="wx-t-s">Gondola Wish, 1977</text><line x1="364.5" y1="182" x2="364.5" y2="200" class="wx-thin"/><text x="364.5" y="214" text-anchor="middle" class="wx-t-s">Center Lane, 1983</text><text x="60" y="238" class="wx-t-s">Run by the army, then the Defense Intelligence Agency</text><g class="wx-pop" style="--d:2"><line x1="144.0" y1="250" x2="144.0" y2="300" class="wx-guide"/><circle cx="144.0" cy="300" r="4.5" class="wx-inkfill"/><text x="150.0" y="262" class="wx-t-s wx-halo">1974: Puthoff and Targ in Nature</text></g><g class="wx-pop" style="--d:8"><line x1="585.0" y1="60" x2="585.0" y2="300" class="wx-hl"/><circle cx="585.0" cy="300" r="5.5" class="wx-accfill"/><text x="579.0" y="58" text-anchor="end" class="wx-t-b wx-halo">1995: AIR evaluation for the CIA;</text><text x="579.0" y="72" text-anchor="end" class="wx-t-s wx-halo">programme ends and is made public</text></g><rect x="60" y="346" width="600" height="38" rx="6" class="wx-card wx-edge-soft"/><text x="76" y="370" class="wx-t">Total cost about $20 million. In January 2017 the CIA put the declassified files online.</text></svg></div></div><figcaption>Laboratory research at SRI and SAIC ran alongside a small military unit at Fort Meade whose code name changed four times before it closed in 1995. <span class="wx-src">Based on: Mumford, Rose and Goslin 1995 (AIR evaluation); CIA CREST records; Targ and Puthoff 1974. Transition years between code names approximate.</span></figcaption><p class="vh">A timeline from 1970 to 1998. The top row shows laboratory research at SRI in Menlo Park from 1972 to 1991 and at SAIC from 1991 to 1995. The second row shows the military unit at Fort Meade as consecutive bars: Gondola Wish from 1977, Grill Flame from 1978, Center Lane from 1983, Sun Streak from 1986 and Star Gate from 1991 to 1995, run by the army and then the Defense Intelligence Agency. A marker shows the 1974 Nature paper by Puthoff and Targ. A highlighted line at 1995 marks the AIR evaluation for the CIA and the end of the programme. A note gives the total cost of about $20 million and the online release of files in January 2017.</p></figure><p>In 1977 the army formed its own unit at Fort Meade, training soldiers as viewers. It changed code names as sponsors and rules changed, from Gondola Wish and Grill Flame to Center Lane and Sun Streak, and in 1991 it was consolidated as Star Gate, by then under the Defense Intelligence Agency. Laboratory research moved from SRI to the contractor SAIC. Viewers were tasked against Soviet sites, hostages and missing aircraft. The whole effort cost about $20 million.</p></section><section class="wsec" id="stargate-psychic-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>How a trial worked, and where it could leak</h3><figure class="wx wx--steps" id="stargate-psychic-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">How a remote-viewing trial worked</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How a remote-viewing trial worked"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" class="wx-svg" role="img" aria-labelledby="stargate-psychic-f2-t"><title id="stargate-psychic-f2-t">Step-through drawing of a laboratory remote-viewing trial: a target chosen at random, a viewer describing it, a blind judge ranking transcripts, the statistical result, and the flaws critics found</title><text x="24" y="28" class="wx-t-cap">How a remote-viewing trial worked, and where it could leak</text><g class="wx-st" data-s="1"><rect x="24" y="60" width="150" height="170" rx="10" class="wx-card wx-edge-soft"/><text x="99" y="84" text-anchor="middle" class="wx-t-b">1 Target pool</text><rect x="44" y="104" width="70" height="44" rx="3" class="wx-paper wx-edge"/><rect x="54" y="114" width="70" height="44" rx="3" class="wx-paper wx-edge"/><rect x="64" y="124" width="70" height="44" rx="3" class="wx-stone wx-edge"/><text x="99" y="192" text-anchor="middle" class="wx-t-s">sites in sealed envelopes;</text><text x="99" y="206" text-anchor="middle" class="wx-t-s">one picked at random</text><path d="M140 146 C 170 146 175 146 196 146" class="wx-flow wx-s6" /><text x="99" y="222" text-anchor="middle" class="wx-t-s">team drives to the site</text></g><g class="wx-st" data-s="2"><rect x="198" y="60" width="150" height="170" rx="10" class="wx-card wx-edge-soft"/><text x="273" y="84" text-anchor="middle" class="wx-t-b">2 Viewer</text><circle cx="250" cy="104" r="8" class="wx-stone3"/><path d="M250 112 L250 142 M236 124 L264 124 M250 142 L240 164 M250 142 L260 164" class="wx-line"/><rect x="270" y="150" width="56" height="40" rx="2" class="wx-paper wx-edge"/><path d="M278 178 L292 160 L304 172 L318 158" class="wx-thin"/><text x="273" y="210" text-anchor="middle" class="wx-t-s">in a shielded room,</text><text x="273" y="224" text-anchor="middle" class="wx-t-s">describes and sketches</text></g><g class="wx-st" data-s="3"><rect x="372" y="60" width="150" height="170" rx="10" class="wx-card wx-edge-soft"/><text x="447" y="84" text-anchor="middle" class="wx-t-b">3 Blind judge</text><circle cx="410" cy="104" r="8" class="wx-stone3"/><path d="M410 112 L410 142 M396 124 L424 124 M410 142 L400 164 M410 142 L420 164" class="wx-line"/><text x="440" y="124" class="wx-t-n">1st</text><text x="440" y="146" class="wx-t-s">2nd</text><text x="440" y="166" class="wx-t-s">3rd ...</text><text x="447" y="210" text-anchor="middle" class="wx-t-s">visits each site and ranks</text><text x="447" y="224" text-anchor="middle" class="wx-t-s">every transcript against it</text></g><g class="wx-st" data-s="4"><rect x="546" y="60" width="150" height="170" rx="10" class="wx-card wx-edge-soft"/><text x="621" y="84" text-anchor="middle" class="wx-t-b">4 Statistics</text><rect x="570" y="150" width="26" height="40" class="wx-stone2 wx-grow" style="--d:1"/><rect x="634" y="112" width="26" height="78" class="wx-accfill wx-grow" style="--d:3"/><line x1="566" y1="190" x2="676" y2="190" class="wx-line"/><text x="583" y="206" text-anchor="middle" class="wx-t-s">chance</text><text x="647" y="206" text-anchor="middle" class="wx-t-s">reported</text><text x="621" y="224" text-anchor="middle" class="wx-t-s">more first-place matches</text></g><g class="wx-st wx-hide" data-only="5"><rect x="120" y="282" width="480" height="116" rx="10" class="wx-card wx-edge"/><text x="140" y="308" class="wx-t-b wx-t-a">Where critics found leaks</text><text x="140" y="330" class="wx-t">Marks and Kammann (1978): transcripts held cues, such as dates and</text><text x="140" y="348" class="wx-t">references to earlier trials, that let a judge order them without any psi.</text><text x="140" y="370" class="wx-t-s">Defenders answered with edited transcripts and tighter protocols; Utts (1995) judged</text><text x="140" y="386" class="wx-t-s">later trials significant, Hyman found the case premature. The dispute continues.</text></g><g class="wx-st wx-hide" data-only="4"><text x="360" y="262" text-anchor="middle" class="wx-t">A result above chance was read as evidence that information reached the viewer.</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> A target site is picked at random from sealed envelopes and a team goes there.</p><ol class="wx-steplist"><li>A target site is picked at random from sealed envelopes and a team goes there.</li><li>At the agreed time the viewer, with a blind interviewer, describes and sketches impressions.</li><li>A judge who does not know the answer ranks every transcript against each site.</li><li>More first-place matches than chance are reported as evidence of an effect.</li><li>Critics found cues in the transcripts; the dispute over the laboratory results continued into the 1990s.</li></ol><figcaption>The outbound design used at SRI, and the weak point critics found in it. <span class="wx-src">Based on: Targ and Puthoff 1974; Marks and Kammann 1978; Utts 1996; Hyman 1996. Bar heights schematic.</span></figcaption><p class="vh">Four panels in a row. Panel 1, target pool: sites in sealed envelopes, one picked at random, and a team drives to the site. Panel 2, viewer: a figure in a shielded room describing and sketching. Panel 3, blind judge: a figure ranking every transcript against each site. Panel 4, statistics: a bar for chance and a taller bar for the reported number of first-place matches. Step 5 adds a note: Marks and Kammann found in 1978 that transcripts held cues such as dates and references to earlier trials; defenders answered with edited transcripts and tighter protocols; Utts judged later trials significant and Hyman found the case premature.</p></figure><p>In the classic SRI design, a target site was chosen at random from sealed envelopes and a team drove to it. At the agreed time the viewer, in a room with an interviewer who did not know the target, described and sketched impressions. Later an independent judge visited each site and ranked all the transcripts against it. If the right transcript came first more often than chance would predict, the result was counted as evidence.</p><p>In 1978 the psychologists David Marks and Richard Kammann, also writing in Nature, showed that the original transcripts contained cues, such as dates and references to earlier trials, which could let a judge put them in the right order without any psychic information at all. The SRI team answered with edited transcripts and stricter procedures. That exchange set the pattern of the next two decades: each critique led to tighter protocols, and each new positive result led to new critiques.</p></section><section class="wsec" id="stargate-psychic-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The challengers&#x27; case at its strongest</h3><p>The believers&#x27; case does not rest on anecdotes alone. When the CIA took the programme over in 1995 and asked the American Institutes for Research to evaluate it, one of the two expert reviewers was Jessica Utts, a professor of statistics at the University of California, Davis. Having reviewed the laboratory work, she wrote that, using the standards applied to any other area of science, psychic functioning had been well established. Targ, Puthoff and former viewers such as Joseph McMoneagle and Paul H. Smith add operational stories, the most famous being Pat Price&#x27;s 1974 sketch of a large gantry crane at a secret Soviet site, which they say later matched intelligence imagery.</p><p>They also argue that the evaluation was narrow. The AIR team looked in detail at the operational work of the unit&#x27;s last, run-down years, not at its peak, and a sponsor that had already decided to end a politically embarrassing programme had little reason to find value in it.</p><aside class="wcall"><b>Off record</b><p>The celebrated operational hits come mainly from the viewers&#x27; own books and interviews, and from project documents that record claims of accuracy. They are real claims by named people, and some are supported by contemporary memos, but no complete log of all taskings, hits and misses has been published against which they could be judged.</p></aside></section><section class="wsec" id="stargate-psychic-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The evaluation</h3><p>The AIR report, delivered in September 1995, reached a clear conclusion on the question that mattered to the government. Even if a paranormal effect exists in the laboratory, the report found, the information remote viewing produced in operations was vague and ambiguous, required substantial other intelligence to interpret, and had never been shown to guide an operation. Continued use in intelligence gathering was not warranted. Ray Hyman, the second reviewer, agreed that the laboratory studies had improved, but argued that Utts&#x27;s conclusion was premature until the effect could be reproduced by independent skeptical researchers.</p><p>The kidnapping of the American general James Dozier by the Red Brigades in Italy, in December 1981, shows the problem in miniature. Remote viewers were among the many sources tasked to find him. Their sessions produced impressions of buildings, water and cities, some of which supporters later read as partial matches. Dozier was freed by Italian police in January 1982 after conventional investigation located the flat where he was held. A description that seems to fit once the answer is known is very different from one that leads you to the door, and that difference is what the evaluators were measuring.</p><p>The programme closed. In January 2017 the CIA put its declassified records, including thousands of Stargate pages, into its online reading room, where anyone can read the session transcripts and judge them.</p></section><section class="wsec" id="stargate-psychic-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Why it matters for the mysteries</h3><p>Stargate is often cited as proof that governments hide paranormal truths. The record points the other way on that specific claim: the programme was secret, but it was ended, evaluated, disclosed and published, and its files show a government that took an extraordinary idea seriously and did not find it useful. That is worth knowing, because it shows that a secret programme and a successful one are not the same thing.</p><p>It also shows why the public stopped trusting simple denials. For years, officials would not have admitted that psychic spies existed at all. When they did, the story was stranger than most denials had allowed. The lesson for every mystery on this site is to ask for the file, then read what is actually in it.</p><blockquote class="wpull"><p>A secret programme is not the same thing as a programme that worked.</p></blockquote></section><section class="wsec" id="stargate-psychic-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle it</h3><p>The operational question is largely answered by the evaluation and the files. The laboratory question could be settled by a preregistered replication across several laboratories, designed jointly by proponents and skeptics, with blind judging and every result published. Publishing complete operational tasking logs, including every miss, would let hit rates be compared with chance and with ordinary analysts. Until then the verdict has two parts: the claim that remote viewing produced reliable intelligence is contradicted by the record, while the claim that some real effect was seen in the laboratory remains an open and argued question.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">1972 CE</span><span class="wtl-k">Built</span><span class="wtl-t">CIA funds remote-viewing research at SRI</span></li><li class="wtl-study" style="--i:1"><span class="wtl-y">1974 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Targ and Puthoff paper in Nature</span></li><li class="wtl-build" style="--i:2"><span class="wtl-y">1977 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Army unit formed at Fort Meade</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">1978 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Marks and Kammann find cues in transcripts</span></li><li class="wtl-use" style="--i:4"><span class="wtl-y">1991 CE</span><span class="wtl-k">In use</span><span class="wtl-t">Unit consolidated as Star Gate</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1995 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">AIR evaluation; programme ends and is made public</span></li><li class="wtl-find" style="--i:6"><span class="wtl-y">2017 CE</span><span class="wtl-k">Found</span><span class="wtl-t">CIA puts declassified files online</span></li></ol><details class="srcs"><summary>Sources for this case (10)</summary><ol><li>Mumford, M. D., Rose, A. M. and Goslin, D. A. (1995). An Evaluation of Remote Viewing: Research and Applications. American Institutes for Research, Washington, 29 September 1995.</li><li>Utts, J. (1996). An assessment of the evidence for psychic functioning. Journal of Scientific Exploration 10(1): 3–30.</li><li>Hyman, R. (1996). Evaluation of a program on anomalous mental phenomena. Journal of Scientific Exploration 10(1): 31–58.</li><li>Targ, R. and Puthoff, H. (1974). Information transmission under conditions of sensory shielding. Nature 251: 602–607. <a href="https://doi.org/10.1038/251602a0" target="_blank" rel="noopener">doi:10.1038/251602a0</a></li><li>Marks, D. and Kammann, R. (1978). Information transmission in remote viewing experiments. Nature 274: 680–681. <a href="https://doi.org/10.1038/274680a0" target="_blank" rel="noopener">doi:10.1038/274680a0</a></li><li>Central Intelligence Agency. CREST: 25-Year Program Archive, Stargate records, released online January 2017. cia.gov/readingroom.</li><li>McMoneagle, J. (2002). The Stargate Chronicles: Memoirs of a Psychic Spy. Hampton Roads, Charlottesville.</li><li>Smith, P. H. (2005). Reading the Enemy&#x27;s Mind: Inside Star Gate, America&#x27;s Psychic Espionage Program. Forge Books, New York.</li><li>Jacobsen, A. (2017). Phenomena: The Secret History of the U.S. Government&#x27;s Investigations into Extrasensory Perception and Psychokinesis. Little, Brown, New York.</li><li>Wikipedia contributors. Stargate Project (U.S. Army unit) (accessed September 2026), for code-name sequence and staffing.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-stargate-psychic" data-t="Stargate: The Pentagon&#x27;s Psychic Spies"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Stargate: The Pentagon&#x27;s Psychic Spies</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-stargate-psychic</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-roswell-mogul-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="RoswellDailyRecordJuly8,1947.jpg" data-cap="The Roswell Daily Record, 8 July 1947" data-big><figcaption></figcaption></figure><div class="sh-k">What Governments Did</div><h2 class="sh-t" id="case-roswell-mogul-st" tabindex="-1">Roswell: A Balloon, a Secret and a Legend</h2><p class="sh-s">In July 1947 the army announced it had captured a flying disc, then took it back within hours. The truth was a real secret, just not that one.</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> A craft of non-human origin was recovered near Roswell in 1947 and hidden by the US government.</p></div><p class="v4-q">Was a craft of non-human origin recovered at Roswell in 1947 and hidden?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>In July 1947 a rancher found strange debris in New Mexico, and the army base announced a &#x27;flying disc&#x27;.</li><li>The same day it was called a weather balloon; the rancher himself described rubber, foil, tough paper and sticks.</li><li>That matches a secret Mogul balloon train for listening to Soviet tests.</li><li>Stories of bodies appeared three decades later, and several were fabricated.</li><li>The government&#x27;s shifting explanations justify suspicion of its handling; they are not evidence of a craft.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Institutions</span><span class="thr">Physics</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="5" >5</b><span class="ctr-u"> years</span></div><div class="ctr-l">of base administrative records found destroyed (1945–1949)</div><div class="ctr-c">GAO 1995</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="31" >31</b><span class="ctr-u"> years</span></div><div class="ctr-l">before Marcel&#x27;s 1978 interview revived the story</div><div class="ctr-c">Air Force 1995</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="4" >4</b><span class="ctr-u"> official explanations</span></div><div class="ctr-l">disc, weather balloon, Mogul, test dummies</div><div class="ctr-c">GAO 1995; McAndrew 1997</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="50" >50</b><span class="ctr-u"> years</span></div><div class="ctr-l">from the find to the &#x27;Case Closed&#x27; report of 1997</div><div class="ctr-c">McAndrew 1997</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>A craft of non-human origin was recovered near Roswell in 1947 and hidden by the US government.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">No physical evidence, document or photograph from 1947 supports a non-human craft, and the contemporary descriptions of the debris, rubber strips, foil, tough paper and sticks, fit a Mogul balloon train closely. Accounts of bodies emerged three decades later and several key pieces of the legend were fabricated. The official record has real weaknesses: explanations that shifted and base records destroyed without authority. Those weaknesses justify suspicion of the government&#x27;s handling, but they are not evidence of a craft.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Official accounts present Roswell as solved, and the Mogul explanation fits the 1947 evidence well. But a report titled &#x27;Case Closed&#x27; that explains 1947 stories with dummies first dropped in the 1950s, after two earlier explanations, invited the distrust it received. The textbooks are right about the debris and overconfident in assuming that shifting official stories and destroyed records would reassure anyone.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>In June or early July 1947 the rancher W. W. &#x27;Mac&#x27; Brazel found scattered debris on a ranch near Corona, New Mexico, and reported it to the county sheriff on 6 July; Major Jesse Marcel of Roswell Army Air Field collected material.<small>Air Force 1995; Roswell Daily Record, 9 July 1947</small></li><li>On 8 July 1947 the base issued a press release, written by its public information officer Walter Haut, saying it had recovered a &#x27;flying disc&#x27;. The same day General Roger Ramey in Fort Worth identified the debris as a weather balloon with a radar reflector and displayed it to the press.<small>Roswell Daily Record, 8–9 July 1947; GAO 1995</small></li><li>Brazel&#x27;s account, as reported on 9 July 1947, described rubber strips, tinfoil, a rather tough paper and sticks, and no engine or metal parts.<small>Roswell Daily Record, 9 July 1947</small></li><li>In 1994 the Air Force reported that the debris most likely came from Project Mogul, a then top secret programme using long trains of balloons to listen for Soviet nuclear tests; Flight 4 was launched from Alamogordo on 4 June 1947. A 1997 report attributed later stories of alien bodies to test dummies dropped in the 1950s.<small>Air Force 1995; McAndrew 1997</small></li><li>A 1995 search by the General Accounting Office found that Roswell Army Air Field&#x27;s administrative records for 1945–1949 and outgoing messages for 1946–1949 had been destroyed, without a record of who authorised it.<small>GAO 1995</small></li><li>In March 2024 the Pentagon&#x27;s All-domain Anomaly Resolution Office (AARO) reviewed the case again and found no evidence of a recovered non-human craft, restating the Mogul and test-dummy explanations.<small>AARO 2024</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the debris photographed in General Ramey&#x27;s office was the material from the ranch or a substitute, as Marcel later suggested.</li><li>Whether accounts of bodies, recalled 30 to 50 years later, describe real events of 1947 or memories of later military incidents merged over time.</li><li>Why the base&#x27;s outgoing message records for the period were destroyed, and whether anything of relevance was lost with them.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>The RAAF outgoing messages and administrative records for 1946–1949, destroyed without documented authority.</li><li>Any piece of the original debris in a public collection that could be tested today.</li><li>Most first-hand witnesses, who had died before the story was investigated in depth from the late 1970s.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Historians and the government&#x27;s own investigations read Roswell as a real secret wrapped in a false one. The debris came from a classified balloon project, Mogul, whose purpose could not be admitted in 1947, so the army first overreached with a &#x27;flying disc&#x27; press release and then explained the material as an ordinary weather balloon. The story lay dormant for three decades. From 1978, interviews conducted long after the event, books and a series of hoaxes added bodies, second crash sites and secret documents. The official line has been criticised for its own shifting explanations, but its central finding fits the contemporary descriptions of the debris.</p><ul><li>The contemporary descriptions of the debris match the foil, sticks, tape and rubber of a Mogul balloon train.</li><li>No 1947 document or photograph mentions bodies; those accounts appear from the late 1970s onward.</li><li>Several key pieces of the legend, including the MJ-12 papers and the 1995 alien autopsy film, turned out to be fabricated.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Roswell researchers argue that the military told the truth first and lied afterwards. The base&#x27;s own press release said a flying disc had been recovered; within hours it was a weather balloon, and nearly 50 years later a secret balloon project, and later still test dummies that had not been used until the 1950s. Marcel, the officer who handled the debris, said in 1978 that the balloon story was a cover. Researchers such as Randle, Schmitt and Carey collected hundreds of interviews describing unusual material, threats to witnesses and bodies. Haut&#x27;s sealed affidavit, published after his death, said he had seen a craft and bodies.</p><ul><li>The official explanation changed three times, from flying disc to weather balloon to Mogul to dummies.</li><li>The base&#x27;s outgoing message records for the period were destroyed without authority.</li><li>Some witnesses were senior officers with no obvious motive to invent a story.</li></ul><div class="face-s"><b>Its strongest point</b><p>The Air Force&#x27;s own explanation shifted over five decades, and the records that could have settled the matter were destroyed without authority. An institution that changes its story and loses its files cannot expect to be believed on its word alone.</p></div><p class="face-cr"><b>Credit</b> Stanton Friedman (nuclear physicist and ufologist); Kevin Randle, Donald Schmitt and Thomas Carey (Roswell researchers); Major Jesse Marcel (interviews from 1978); Walter Haut (affidavit, 2002)</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Recovery and independent testing of any original debris, in a public collection, with its chain of custody documented.</li><li>Discovery of the missing RAAF outgoing messages for July 1947 in another archive, such as a copy held by a receiving headquarters.</li><li>Release of any remaining classified records naming Roswell, with an independent reviewer confirming the search was complete.</li><li>A contemporary 1947 document or photograph, of verified date, that shows bodies or a craft.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,127 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Roswell: A Balloon, a Secret and a Legend"><button type="button" class="wtoc-i" data-go="roswell-mogul-s1">Flying disc, weather balloon</button><button type="button" class="wtoc-i" data-go="roswell-mogul-s2">What the record shows</button><button type="button" class="wtoc-i" data-go="roswell-mogul-s3">How the legend grew</button><button type="button" class="wtoc-i" data-go="roswell-mogul-s4">What the government did, and did not do</button><button type="button" class="wtoc-i" data-go="roswell-mogul-s5">The challengers&#x27; case at its strongest</button><button type="button" class="wtoc-i" data-go="roswell-mogul-s6">Why Roswell matters for every other mystery</button><button type="button" class="wtoc-i" data-go="roswell-mogul-s7">What would settle it</button></nav></div><section class="wsec" id="roswell-mogul-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Flying disc, weather balloon</h3><p>On the morning of 8 July 1947, readers of the Roswell Daily Record found a headline that has never quite gone away: the army air field outside town had captured a flying saucer on a ranch in the region. The base&#x27;s public information officer, Walter Haut, had issued the release on his commander&#x27;s orders. By that evening the story had been reversed. In Fort Worth, General Roger Ramey showed reporters torn foil, sticks and rubber and explained that it was a weather balloon with a radar target. The next day&#x27;s paper carried the rancher&#x27;s own account.</p><p>For three decades almost nobody cared. Then, from 1978, Roswell grew into the most famous UFO story in the world, with a crashed craft, alien bodies and a government cover-up. The case is worth weighing carefully, because it contains both a real government secret and a real government failure, and neither of them is the one most people have heard about.</p><blockquote class="wpull"><p>Roswell contains a real secret and a real failure. Neither is the one most people have heard about.</p></blockquote></section><section class="wsec" id="roswell-mogul-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What the record shows</h3><p>The rancher, W. W. &#x27;Mac&#x27; Brazel, found a large area of wreckage on the property he managed near Corona. He reported it to the Chaves County sheriff on 6 July, and Major Jesse Marcel, an intelligence officer at Roswell Army Air Field, collected material. As the Roswell Daily Record reported on 9 July, Brazel described rubber strips, tinfoil, a rather tough paper and sticks. No engine or metal parts were mentioned.</p><figure class="wx wx--static" id="roswell-mogul-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">A Mogul balloon train, and what the rancher found</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="A Mogul balloon train, and what the rancher found"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" class="wx-svg" role="img" aria-labelledby="roswell-mogul-f1-t"><title id="roswell-mogul-f1-t">Schematic of a Project Mogul balloon train, with neoprene balloons, radar reflectors and an instrument package, matched to the debris described in July 1947</title><text x="24" y="28" class="wx-t-cap">A Mogul balloon train, and what was found on the ranch</text><line x1="150" y1="50" x2="150" y2="420" class="wx-line"/><ellipse cx="150" cy="66" rx="15" ry="13" class="wx-stone wx-edge-soft wx-bob" style="--d:0"/><ellipse cx="150" cy="100" rx="15" ry="13" class="wx-stone wx-edge-soft wx-bob" style="--d:1"/><ellipse cx="150" cy="134" rx="15" ry="13" class="wx-stone wx-edge-soft wx-bob" style="--d:2"/><ellipse cx="150" cy="168" rx="15" ry="13" class="wx-stone wx-edge-soft wx-bob" style="--d:3"/><ellipse cx="150" cy="202" rx="15" ry="13" class="wx-stone wx-edge-soft wx-bob" style="--d:4"/><text x="150" y="238" text-anchor="middle" class="wx-t-s wx-halo">... more balloons</text><g transform="translate(150 290)"><polygon points="0,-26 26,0 0,26 -26,0" class="wx-metal wx-o60 wx-edge"/><line x1="-26" y1="0" x2="26" y2="0" class="wx-thin"/><line x1="0" y1="-26" x2="0" y2="26" class="wx-thin"/></g><g transform="translate(150 356)"><polygon points="0,-22 22,0 0,22 -22,0" class="wx-metal wx-o60 wx-edge"/><line x1="-22" y1="0" x2="22" y2="0" class="wx-thin"/><line x1="0" y1="-22" x2="0" y2="22" class="wx-thin"/></g><rect x="136" y="400" width="28" height="28" rx="3" class="wx-stone3 wx-edge"/><text x="24" y="70" class="wx-t-b">Neoprene</text><text x="24" y="85" class="wx-t-b">weather</text><text x="24" y="100" class="wx-t-b">balloons</text><text x="24" y="286" class="wx-t-b">Radar</text><text x="24" y="301" class="wx-t-b">reflectors</text><text x="24" y="317" class="wx-t-s">foil on light</text><text x="24" y="331" class="wx-t-s">sticks, taped</text><text x="24" y="412" class="wx-t-b">Instruments</text><text x="24" y="427" class="wx-t-s">microphone, ballast</text><text x="190" y="448" class="wx-t-s">Schematic, not to scale. A real train was far longer than drawn.</text><rect x="330" y="60" width="366" height="330" rx="10" class="wx-card wx-edge-soft"/><text x="350" y="88" class="wx-t-b">Described in July 1947</text><text x="350" y="104" class="wx-t-s">Roswell Daily Record, 9 July, from Brazel's account</text><g class="wx-pop" style="--d:2"><text x="350" y="146" class="wx-t">rubber strips</text><path d="M346 142 C 280 142 230 100 170 100" class="wx-guide"/></g><g class="wx-pop" style="--d:4"><text x="350" y="206" class="wx-t">tinfoil</text><text x="350" y="236" class="wx-t">a rather tough paper</text><text x="350" y="266" class="wx-t">sticks</text><path d="M346 232 C 280 232 230 290 178 290" class="wx-guide"/></g><g class="wx-pop" style="--d:6"><text x="350" y="318" class="wx-t">tape with a flower-like pattern</text><text x="350" y="334" class="wx-t-s">recalled later by Marcel and by Mogul</text><text x="350" y="348" class="wx-t-s">engineer Charles Moore</text><path d="M346 314 C 280 314 230 356 174 356" class="wx-guide"/></g><text x="350" y="376" class="wx-t wx-t-a">No engine, no metal parts were reported</text></svg></div></div><figcaption>The parts of a Mogul balloon train matched to the debris described in July 1947. Schematic, not to scale. <span class="wx-src">Based on: Roswell Daily Record, 9 July 1947; Air Force 1995 (Weaver report and Moore&#x27;s statements); McAndrew 1997. Drawing schematic, not to scale.</span></figcaption><p class="vh">Left: a vertical line with a chain of neoprene weather balloons at the top, two diamond-shaped radar reflectors made of foil on light sticks in the middle, and an instrument package with a microphone and ballast at the bottom. A note says the drawing is schematic and a real train was far longer. Right: a card headed Described in July 1947, from the Roswell Daily Record of 9 July based on Brazel&#x27;s account, listing rubber strips, linked to the balloons; tinfoil, a rather tough paper and sticks, linked to the reflectors; and tape with a flower-like pattern, recalled later by Marcel and by Mogul engineer Charles Moore, also linked to the reflectors. A final line says no engine and no metal parts were reported.</p></figure><p>What Brazel and Marcel did not know was that balloons had been flying out of Alamogordo, not far away, for a top secret programme called Mogul. Its trains of weather balloons, radar reflectors and sensitive microphones were designed to float high in the atmosphere and listen for the sound of Soviet nuclear tests. The reflectors were made of foil on light sticks, held with tape, some of which, the engineer Charles Moore later recalled, came from a toy maker and had a flower-like pattern. The Air Force&#x27;s 1995 report, relying on Moore&#x27;s recollection and flight records, names Flight 4, launched on 4 June 1947, as the most likely source. The project&#x27;s written log for that flight is incomplete, a gap critics have stressed ever since.</p></section><section class="wsec" id="roswell-mogul-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>How the legend grew</h3><figure class="wx wx--steps" id="roswell-mogul-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">How the story grew</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How the story grew"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" class="wx-svg" role="img" aria-labelledby="roswell-mogul-f2-t"><title id="roswell-mogul-f2-t">The Roswell story drawn as layers of sediment, from the 1947 debris at the bottom to claims and official reports added between 1978 and 2024</title><text x="24" y="28" class="wx-t-cap">How the Roswell story grew, layer by layer</text><line x1="40" y1="380" x2="280" y2="380" class="wx-line"/><path d="M40 380 L40 60" class="wx-dim"/><text x="46" y="400" class="wx-t-s">oldest evidence at the bottom</text><g class="wx-st" data-s="1"><rect x="60" y="318" width="200" height="56" class="wx-sand wx-edge-soft"/><text x="160" y="351" text-anchor="middle" class="wx-t-b">July 1947</text><line x1="264" y1="346" x2="300" y2="346" class="wx-thin"/><text x="310" y="342" class="wx-t">Debris, a 'flying disc' press release,</text><text x="310" y="359" class="wx-t">then a weather balloon, all within a day</text></g><g class="wx-st" data-s="2"><rect x="60" y="256" width="200" height="56" class="wx-stone wx-edge-soft"/><text x="160" y="289" text-anchor="middle" class="wx-t-b">1978–1980</text><line x1="264" y1="284" x2="300" y2="284" class="wx-thin"/><text x="310" y="280" class="wx-t">Marcel calls the balloon a cover story;</text><text x="310" y="297" class="wx-t">Berlitz and Moore publish a book</text></g><g class="wx-st" data-s="3"><rect x="60" y="194" width="200" height="56" class="wx-stone2 wx-edge-soft"/><text x="160" y="227" text-anchor="middle" class="wx-t-b">Late 1980s–1990s</text><line x1="264" y1="222" x2="300" y2="222" class="wx-thin"/><text x="310" y="218" class="wx-t">Witnesses describe bodies and new crash</text><text x="310" y="235" class="wx-t">sites; MJ-12 papers appear</text></g><g class="wx-st" data-s="4"><rect x="60" y="132" width="200" height="56" class="wx-soil wx-edge-soft"/><text x="160" y="165" text-anchor="middle" class="wx-t-b">1994–1997</text><line x1="264" y1="160" x2="300" y2="160" class="wx-thin"/><text x="310" y="156" class="wx-t">Air Force reports: Mogul, then dummies;</text><text x="310" y="173" class="wx-t">GAO finds base messages destroyed</text></g><g class="wx-st" data-s="5"><rect x="60" y="70" width="200" height="56" class="wx-rock wx-edge-soft"/><text x="160" y="103" text-anchor="middle" class="wx-t-b">1995–2024</text><line x1="264" y1="98" x2="300" y2="98" class="wx-thin"/><text x="310" y="94" class="wx-t">Autopsy film (a fake, 2006); Haut affidavit</text><text x="310" y="111" class="wx-t">(2007); AARO repeats Mogul (2024)</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> July 1947: the debris, the flying disc release and the weather balloon explanation.</p><ol class="wx-steplist"><li>July 1947: the debris, the flying disc release and the weather balloon explanation.</li><li>1978–1980: Marcel&#x27;s interview and the first Roswell book revive the story.</li><li>Late 1980s–1990s: accounts of bodies, new crash sites and the MJ-12 papers are added.</li><li>1994–1997: the Air Force names Mogul and then test dummies; the GAO finds records destroyed.</li><li>1995–2024: a fake autopsy film, Haut&#x27;s affidavit and AARO&#x27;s 2024 review.</li></ol><figcaption>The Roswell story as layers of sediment: the oldest evidence at the bottom, later claims and reports on top. <span class="wx-src">Based on: Air Force 1995; GAO 1995; McAndrew 1997; AARO 2024; Berlitz and Moore 1980. Layer thickness schematic.</span></figcaption><p class="vh">A column of five stacked layers, added one per step. Bottom, July 1947: debris, a flying disc press release, then a weather balloon, all within a day. Second, 1978 to 1980: Marcel calls the balloon a cover story and Berlitz and Moore publish a book. Third, late 1980s to 1990s: witnesses describe bodies and new crash sites, and the MJ-12 papers appear. Fourth, 1994 to 1997: Air Force reports on Mogul and then dummies, and the GAO finds base messages destroyed. Top, 1995 to 2024: the autopsy film, admitted fake in 2006, Haut&#x27;s affidavit published in 2007, and AARO restating Mogul in 2024.</p></figure><p>In 1978 the physicist and UFO researcher Stanton Friedman interviewed Marcel, who said the weather balloon story had been a cover for something stranger. In 1980 Charles Berlitz and William Moore published The Roswell Incident. Over the next decade, with researchers such as Kevin Randle and Donald Schmitt collecting hundreds of interviews, the story gained a second crash site, a craft and small bodies. Some of it collapsed under scrutiny. The MJ-12 papers, supposedly a secret presidential briefing, were widely judged to be forgeries. A mortician&#x27;s story of an alien autopsy depended on a nurse whose identity could never be confirmed. A film of an alien autopsy released in 1995 was admitted in 2006 to be a staged recreation.</p><aside class="wcall"><b>Off record</b><p>Walter Haut, author of the 1947 press release, signed an affidavit in 2002, sealed until his death in 2005 and published in 2007, saying he had seen a craft and bodies in a base hangar. It is a sworn statement by a named witness. It was made 55 years after the event, it contradicts his own earlier interviews, and no document supports it.</p></aside></section><section class="wsec" id="roswell-mogul-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>What the government did, and did not do</h3><p>In 1993 Representative Steven Schiff of New Mexico, frustrated by the Pentagon&#x27;s answers, asked the General Accounting Office to search for records. Its report of July 1995 found something awkward: the administrative records of Roswell Army Air Field from March 1945 to December 1949, and its outgoing messages from October 1946 to December 1949, had been destroyed, and nobody could say under what authority. The GAO did find a July 1947 FBI teletype describing the object as resembling a high-altitude weather balloon with a radar reflector.</p><p>Meanwhile the Air Force produced its own reports. The first, in 1994, identified Mogul as the most likely source of the debris, with Mogul scientists confirming the materials. The second, published on 24 June 1997 under the title The Roswell Report: Case Closed, argued that the body stories were memories of anthropomorphic test dummies dropped from high-altitude balloons in the 1950s, and of later accidents, compressed in time. In March 2024 AARO&#x27;s historical report restated both conclusions and found no evidence of a recovered non-human craft.</p></section><section class="wsec" id="roswell-mogul-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The challengers&#x27; case at its strongest</h3><p>The Roswell researchers&#x27; best argument is not any single witness. It is the government&#x27;s record. The base announced a disc; it became a weather balloon within hours; nearly 50 years later it became a secret Mogul train; and the bodies became dummies that did not exist until years after 1947. The records that could have confirmed what was sent from the base that week are gone. Marcel was a senior intelligence officer with no obvious reason to invent a story, and several other witnesses held responsible posts.</p><p>That argument has real force against the government&#x27;s credibility. It has much less against the physical explanation. A shifting cover story fits a real classified balloon programme perfectly well: in 1947 the army could not say Mogul, so it said weather balloon. What the challengers have never produced is the thing that would change the verdict: a fragment, a document or a photograph from 1947 that points to a craft.</p></section><section class="wsec" id="roswell-mogul-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Why Roswell matters for every other mystery</h3><p>Roswell is the template for modern suspicion. It taught millions of people that the government lies about strange things, and in a narrow sense they were right: in 1947 the army did not tell the truth about what fell on the ranch, because the truth was a secret weapons programme. In 2025 the Wall Street Journal reported that AARO had found other cases where officials had encouraged UFO stories to protect classified projects. Secrecy breeds legends, and destroyed records feed them for generations.</p><p>The lesson cuts both ways. Suspicion of official accounts is earned. But a story that grows richer with every decade, as Roswell did, is the opposite of an archaeological deposit, where the oldest layer is the most reliable. Here the oldest layer, the debris of July 1947, is the dullest, and it matches a balloon.</p><blockquote class="wpull"><p>At Roswell the oldest layer of evidence is the dullest, and it looks like a balloon.</p></blockquote></section><section class="wsec" id="roswell-mogul-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle it</h3><p>The claim of a non-human craft could be revived by a single piece of original debris with a documented chain of custody, tested in an open laboratory, or by a contemporary 1947 document or photograph of verified date showing bodies or a craft. The missing RAAF outgoing messages for July 1947 might survive as copies in the files of the headquarters that received them. Until something like that appears, the fair verdict is that the government&#x27;s handling earned distrust, while the claim of a recovered craft has no evidence behind it.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">1947 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Debris found; &#x27;flying disc&#x27; release; weather balloon</span></li><li class="wtl-study" style="--i:1"><span class="wtl-y">1978 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Stanton Friedman interviews Jesse Marcel</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">1980 CE</span><span class="wtl-k">Event</span><span class="wtl-t">The Roswell Incident by Berlitz and Moore</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">1994 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Air Force report: Project Mogul</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">1995 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">GAO finds base records destroyed; autopsy film</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1997 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">&#x27;Case Closed&#x27; report on the body stories</span></li><li class="wtl-event" style="--i:6"><span class="wtl-y">2006 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Autopsy film maker admits it was staged</span></li><li class="wtl-event" style="--i:7"><span class="wtl-y">2007 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Haut&#x27;s 2002 affidavit published</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2024 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">AARO historical report restates Mogul</span></li></ol><details class="srcs"><summary>Sources for this case (10)</summary><ol><li>Roswell Daily Record (8 July 1947). RAAF Captures Flying Saucer On Ranch in Roswell Region; and (9 July 1947). Harassed Rancher who Located &#x27;Saucer&#x27; Sorry He Told About It.</li><li>US General Accounting Office (1995). Government Records: Results of a Search for Records Concerning the 1947 Crash Near Roswell, New Mexico. GAO/NSIAD-95-187, July 1995.</li><li>Weaver, R. L. and McAndrew, J. (1995). The Roswell Report: Fact vs. Fiction in the New Mexico Desert. Headquarters, United States Air Force, Washington (includes the 1994 Report of Air Force Research Regarding the &#x27;Roswell Incident&#x27;).</li><li>McAndrew, J. (1997). The Roswell Report: Case Closed. Headquarters, United States Air Force, Washington, 24 June 1997.</li><li>All-domain Anomaly Resolution Office (2024). Report on the Historical Record of U.S. Government Involvement with Unidentified Anomalous Phenomena (UAP), Volume I. US Department of Defense, March 2024.</li><li>Berlitz, C. and Moore, W. L. (1980). The Roswell Incident. Grosset &amp; Dunlap, New York.</li><li>Randle, K. D. and Schmitt, D. R. (1991). UFO Crash at Roswell. Avon Books, New York.</li><li>Carey, T. J. and Schmitt, D. R. (2007). Witness to Roswell: Unmasking the 60-Year Cover-Up. New Page Books (publishes Walter Haut&#x27;s 2002 affidavit).</li><li>Saler, B., Ziegler, C. A. and Moore, C. B. (1997). UFO Crash at Roswell: The Genesis of a Modern Myth. Smithsonian Institution Press, Washington.</li><li>Schectman, J. and Viswanatha, A. (June 2025). The Pentagon disinformation that fueled America&#x27;s UFO mythology. The Wall Street Journal.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-roswell-mogul" data-t="Roswell: A Balloon, a Secret and a Legend"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Roswell: A Balloon, a Secret and a Legend</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-roswell-mogul</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-uap-disclosure-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="David Grusch giving testimony on 26 July 2023 before the US House Subcommittee on National Security the Border and Foreign Affairs.png" data-cap="David Grusch testifying before a House subcommittee, 26 July 2023" data-big><figcaption></figcaption></figure><div class="sh-k">What Governments Did</div><h2 class="sh-t" id="case-uap-disclosure-st" tabindex="-1">UAP Disclosure: What the Government Has Admitted</h2><p class="sh-s">Secret studies, sworn testimony and six releases of files. Nine years into disclosure, what is on the record and what is still only said?</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true">
