work showed the grooves were cut in one session with a hard, pointed tool, on a fresh shell, with care. Dating of the sediment inside the shells, by argon-argon and luminescence methods, gave an age of about 540,000–430,000 years.</p><blockquote class="wpull"><p>The oldest known geometric engraving was made by a species that was not ours, and it waited a century in a drawer.</p></blockquote></section><section class="wsec" id="oldest-marks-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>A ladder of marks</h3><p>Trinil stands alone for a long time. The next securely dated patterns come from Africa and from our own species. At Blombos Cave on the southern Cape of South Africa, people engraved crosshatched designs on pieces of red ochre between about 100,000 and 75,000 years ago. In 2018 Christopher Henshilwood&#x27;s team reported a small silcrete flake from the 73,000-year-old levels with six roughly parallel red lines crossed by three curved ones, drawn with an ochre crayon: the oldest known drawing. At Diepkloof, about 60,000 years ago, people engraved ostrich-eggshell containers with a small set of repeated designs.</p><figure class="wx wx--static" id="oldest-marks-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Who marked what, and when</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Who marked what, and when"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" class="wx-svg" role="img" aria-labelledby="oldest-marks-f1-t"><title id="oldest-marks-f1-t">The oldest dated deliberate marks, by who made them, from 540,000 to 39,000 years ago</title><defs><marker id="oldest-marks-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text x="24" y="28" class="wx-t-cap">The oldest deliberate marks · thousands of years ago</text><line x1="160.0" y1="56" x2="160.0" y2="150" class="wx-guide"/><text x="160.0" y="166" text-anchor="middle" class="wx-t-s">700</text><line x1="235.7" y1="56" x2="235.7" y2="150" class="wx-guide"/><text x="235.7" y="166" text-anchor="middle" class="wx-t-s">600</text><line x1="311.4" y1="56" x2="311.4" y2="150" class="wx-guide"/><text x="311.4" y="166" text-anchor="middle" class="wx-t-s">500</text><line x1="387.1" y1="56" x2="387.1" y2="150" class="wx-guide"/><text x="387.1" y="166" text-anchor="middle" class="wx-t-s">400</text><line x1="462.9" y1="56" x2="462.9" y2="150" class="wx-guide"/><text x="462.9" y="166" text-anchor="middle" class="wx-t-s">300</text><line x1="538.6" y1="56" x2="538.6" y2="150" class="wx-guide"/><text x="538.6" y="166" text-anchor="middle" class="wx-t-s">200</text><line x1="614.3" y1="56" x2="614.3" y2="150" class="wx-guide"/><text x="614.3" y="166" text-anchor="middle" class="wx-t-s">100</text><line x1="690.0" y1="56" x2="690.0" y2="150" class="wx-guide"/><text x="690.0" y="166" text-anchor="middle" class="wx-t-s">0</text><line x1="160" y1="150" x2="690" y2="150" class="wx-line"/><text x="24" y="84" class="wx-t-b">Homo erectus</text><text x="24" y="99" class="wx-t-s">Trinil, Java</text><rect x="281.1" y="74" width="83.3" height="14" rx="4" class="wx-c6 wx-growx" style="--d:1"/><text x="372.4" y="85" class="wx-t-s">engraved shell, 540,000–430,000</text><text x="24" y="124" class="wx-t-b">Homo sapiens</text><text x="24" y="139" class="wx-t-s">exists from c. 300,000</text><rect x="462.9" y="117" width="227.1" height="6" rx="3" class="wx-c2 wx-o60 wx-growx" style="--d:2"/><rect x="606.7" y="56" width="56.8" height="94" class="wx-accfill wx-o20"/><text x="635.5" y="50" text-anchor="middle" class="wx-t-s wx-t-a">enlarged below</text><line x1="606.7" y1="150" x2="160" y2="206" class="wx-guide"/><line x1="663.5" y1="150" x2="690" y2="206" class="wx-guide"/><line x1="160.0" y1="206" x2="160.0" y2="440" class="wx-guide"/><text x="160.0" y="456" text-anchor="middle" class="wx-t-s">110,000</text><line x1="230.7" y1="206" x2="230.7" y2="440" class="wx-guide"/><text x="230.7" y="456" text-anchor="middle" class="wx-t-s">100,000</text><line x1="301.3" y1="206" x2="301.3" y2="440" class="wx-guide"/><text x="301.3" y="456" text-anchor="middle" class="wx-t-s">90,000</text><line x1="372.0" y1="206" x2="372.0" y2="440" class="wx-guide"/><text x="372.0" y="456" text-anchor="middle" class="wx-t-s">80,000</text><line x1="442.7" y1="206" x2="442.7" y2="440" class="wx-guide"/><text x="442.7" y="456" text-anchor="middle" class="wx-t-s">70,000</text><line x1="513.3" y1="206" x2="513.3" y2="440" class="wx-guide"/><text x="513.3" y="456" text-anchor="middle" class="wx-t-s">60,000</text><line x1="584.0" y1="206" x2="584.0" y2="440" class="wx-guide"/><text x="584.0" y="456" text-anchor="middle" class="wx-t-s">50,000</text><line x1="654.7" y1="206" x2="654.7" y2="440" class="wx-guide"/><text x="654.7" y="456" text-anchor="middle" class="wx-t-s">40,000</text><line x1="160" y1="440" x2="690" y2="440" class="wx-line"/><text x="425.0" y="480" text-anchor="middle" class="wx-t-m">years ago · filled dot: dated layer · open dot and arrow: minimum age</text><text x="24" y="288" class="wx-t-b">Homo sapiens</text><text x="24" y="303" class="wx-t-s">Africa and Asia</text><rect x="230.7" y="283" width="176.6" height="14" rx="4" class="wx-c2 wx-growx" style="--d:3"/><text x="230.7" y="274" class="wx-t-s">Blombos engraved ochre</text><circle cx="421.5" cy="290" r="6" class="wx-c2 wx-pop" style="--d:4"/><line x1="421.5" y1="297" x2="421.5" y2="312" class="wx-thin"/><text x="421.5" y="324" text-anchor="middle" class="wx-t-s">Blombos drawing, 73,000</text><line x1="451.2" y1="290" x2="434.2" y2="290" class="wx-line" marker-end="url(#oldest-marks-f1-ah)"/><circle cx="458.2" cy="290" r="6" class="wx-card wx-edge wx-pop" style="--d:5"/><line x1="458.2" y1="283" x2="458.2" y2="250" class="wx-thin"/><text x="454.2" y="244" class="wx-t-s">Muna hand stencil, 67,800+</text><circle cx="513.3" cy="290" r="6" class="wx-c2 wx-pop" style="--d:6"/><line x1="513.3" y1="297" x2="513.3" y2="330" class="wx-thin"/><text x="509.29" y="342" class="wx-t-s">Diepkloof, c. 60,000</text><line x1="568.5" y1="290" x2="551.5" y2="290" class="wx-line" marker-end="url(#oldest-marks-f1-ah)"/><circle cx="575.5" cy="290" r="6" class="wx-card wx-edge wx-pop" style="--d:7"/><line x1="575.5" y1="283" x2="575.5" y2="268" class="wx-thin"/><text x="579.5" y="264" text-anchor="end" class="wx-t-s">Sulawesi, 51,200+</text><text x="24" y="390" class="wx-t-b">Neanderthals</text><text x="24" y="405" class="wx-t-s">Europe</text><rect x="466.0" y="386" width="19.1" height="12" rx="4" class="wx-dash wx-pop" style="--d:8"/><line x1="459.0" y1="392" x2="442.0" y2="392" class="wx-line" marker-end="url(#oldest-marks-f1-ah)"/><circle cx="466.0" cy="392" r="6" class="wx-card wx-edge wx-pop" style="--d:8"/><text x="456.8" y="418" text-anchor="middle" class="wx-t-s">Spain, 64,000+ (disputed)</text><line x1="527.5" y1="392" x2="510.5" y2="392" class="wx-line" marker-end="url(#oldest-marks-f1-ah)"/><circle cx="534.5" cy="392" r="6" class="wx-card wx-edge wx-pop" style="--d:9"/><line x1="534.5" y1="385" x2="534.5" y2="370" class="wx-thin"/><text x="538.5" y="366" text-anchor="end" class="wx-t-s">La Roche-Cotard flutings, 57,000+</text><line x1="654.7" y1="392" x2="637.7" y2="392" class="wx-line" marker-end="url(#oldest-marks-f1-ah)"/><circle cx="661.7" cy="392" r="6" class="wx-card wx-edge wx-pop" style="--d:10"/><text x="663.7" y="418" text-anchor="end" class="wx-t-s wx-halo">Gorham's, 39,000+</text><line x1="654.7" y1="222" x2="654.7" y2="440" class="wx-hl wx-draw" pathLength="1" style="--d:11"/><text x="664.7" y="216" text-anchor="end" class="wx-t-b wx-t-a">old "creative explosion", c. 40,000</text></svg></div></div><figcaption>The Trinil shell sits alone before Homo sapiens; the enlarged panel shows how marks by sapiens and Neanderthals crowd the last 110,000 years. <span class="wx-src">Based on: Joordens et al. 2015; Henshilwood et al. 2002, 2018; Texier et al. 2010; Oktaviana et al. 2024, 2026; Hoffmann et al. 2018; Marquet et al. 2023; Rodríguez-Vidal et al. 2014. Linear time scales; minimum ages shown with arrows.</span></figcaption><p class="vh">A two-part time chart. The top panel runs from 700,000 years ago to today: a bar for the Trinil engraved shell by Homo erectus, 540,000 to 430,000 years ago, and a thin bar showing Homo sapiens existing from about 300,000 years ago. A shaded band from 110,000 to 35,000 years ago is enlarged below. The lower panel has two rows. Homo sapiens: Blombos engraved ochre 100,000 to 75,000; the Blombos drawing at 73,000; the Muna hand stencil, at least 67,800; Diepkloof eggshells, about 60,000; the Sulawesi scene, at least 51,200. Neanderthals: three Spanish caves, at least 64,000 to 66,700, marked disputed; La Roche-Cotard flutings, at least 57,000; Gorham&#x27;s Cave, at least 39,000. An accent line marks the old creative explosion model at 40,000 years ago.</p></figure><p>Then come the caves of Indonesia. In 2024 Adhi Agus Oktaviana and colleagues dated a painted scene in Leang Karampuang, Sulawesi, showing three human-like figures and a wild pig, to at least 51,200 years ago, the oldest known story told in pictures. Neanderthals appear on the ladder too: finger-traced lines at La Roche-Cotard in the Loire valley were sealed by sediment more than 57,000 years ago, and a crosshatch cut into the rock at Gorham&#x27;s Cave in Gibraltar lies under layers more than 39,000 years old.</p></section><section class="wsec" id="oldest-marks-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The old story and its collapse</h3><p>For much of the twentieth century the textbook story was simple. Art, ornament and symbols appeared suddenly around 40,000 years ago, when modern humans reached Europe: the &#x27;creative explosion&#x27; or &#x27;human revolution&#x27;. Neanderthals, in this story, did not make art. Earlier humans certainly did not.</p><p>Every part of that story has now been challenged by physical finds. Blombos and Diepkloof put patterned marks by Homo sapiens in Africa tens of thousands of years earlier. Sulawesi put figurative art in Asia earlier than in Europe. And a growing set of Neanderthal ornaments and marks, from eagle talons to cave-wall flutings, showed our closest relatives doing some of the same things.</p><p>The mainstream has changed its mind, to its credit, but it keeps one careful distinction. A mark can be deliberate without being symbolic. A zigzag may be a design with meaning, or a way of testing a new tool, or a moment&#x27;s play. We can show intention from the grooves; we cannot yet show meaning.</p></section><section class="wsec" id="oldest-marks-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The challengers&#x27; case: Neanderthal painters</h3><p>In 2018 Dirk Hoffmann, João Zilhão, Alistair Pike and colleagues published in Science uranium-thorium dates for thin calcite crusts over paint in three Spanish caves. A red ladder-shaped sign at La Pasiega, a hand stencil at Maltravieso and red-painted flowstone at Ardales all gave minimum ages above 64,000 years, the Maltravieso stencil about 66,700. Modern humans are not known in Iberia until roughly 42,000 years ago, so the team concluded that Neanderthals were the painters.</p><figure class="wx wx--steps" id="oldest-marks-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">How a calcite crust dates the paint beneath it</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How a calcite crust dates the paint beneath it"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" class="wx-svg" role="img" aria-labelledby="oldest-marks-f2-t"><title id="oldest-marks-f2-t">How uranium-series dating of calcite gives a minimum age for cave paint</title><defs><marker id="oldest-marks-f2-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text x="24" y="28" class="wx-t-cap">Dating paint by the crust that covers it · cross-section, not to scale</text><rect x="40" y="60" width="120" height="300" class="wx-rock"/><line x1="160" y1="60" x2="160" y2="360" class="wx-line"/><line x1="52" y1="80" x2="148" y2="90" class="wx-thin"/><line x1="52" y1="120" x2="148" y2="130" class="wx-thin"/><line x1="52" y1="160" x2="148" y2="170" class="wx-thin"/><line x1="52" y1="200" x2="148" y2="210" class="wx-thin"/><line x1="52" y1="240" x2="148" y2="250" class="wx-thin"/><line x1="52" y1="280" x2="148" y2="290" class="wx-thin"/><line x1="52" y1="320" x2="148" y2="330" class="wx-thin"/><text x="100" y="382" text-anchor="middle" class="wx-t-m">limestone wall</text><g class="wx-st" data-s="1"><rect x="160" y="150" width="7" height="120" class="wx-c4"/><line x1="167" y1="262" x2="232" y2="262" class="wx-thin"/><text x="238" y="266" class="wx-t-b">red pigment</text><text x="238" y="281" class="wx-t-s">for example a hand stencil</text></g><g class="wx-st" data-s="2"><rect x="167" y="120" width="10" height="180" class="wx-card wx-edge-soft"/><rect x="160" y="120" width="7" height="30" class="wx-card wx-edge-soft"/><rect x="160" y="270" width="7" height="30" class="wx-card wx-edge-soft"/><rect x="177" y="112" width="10" height="196" class="wx-ice wx-edge-soft"/><rect x="187" y="104" width="10" height="212" class="wx-card wx-edge-soft"/><path d="M205,52 C200,80 200,100 200,130 L200,310" class="wx-flow wx-s2"/><line x1="197" y1="130" x2="232" y2="130" class="wx-thin"/><text x="238" y="126" class="wx-t-b">calcite crust</text><text x="238" y="141" class="wx-t-s">laid down by seeping water</text></g><g class="wx-st" data-s="3"><circle cx="192" cy="200" r="9" class="wx-hl"/><line x1="201" y1="200" x2="400" y2="200" class="wx-dash"/><text x="410" y="178" class="wx-t-cap">In the sample</text><text x="410" y="204" class="wx-t">uranium-234</text><rect x="510" y="194" width="180" height="14" rx="4" class="wx-c2"/><text x="410" y="230" class="wx-t">thorium-230</text><rect x="510" y="220" width="100" height="14" rx="4" class="wx-c6 wx-growx" style="--d:2"/><text x="410" y="252" class="wx-t-s">thorium builds up from uranium at a known rate,</text><text x="410" y="266" class="wx-t-s">so the ratio is a clock for the crust</text></g><g class="wx-st" data-s="4"><text x="410" y="78" class="wx-t-cap">Example: Muna, Sulawesi</text><text x="410" y="102" class="wx-t">crust: 71,600 ± 3,800 years</text><text x="410" y="126" class="wx-t-b wx-t-a">so the paint is at least 67,800 years old</text><text x="410" y="144" class="wx-t-s">the paint is older, by an unknown amount</text></g><g class="wx-st wx-hide" data-s="5"><line x1="200" y1="318" x2="236" y2="336" class="wx-line wx-s4" marker-end="url(#oldest-marks-f2-ah)"/><line x1="200" y1="296" x2="240" y2="306" class="wx-line wx-s4" marker-end="url(#oldest-marks-f2-ah)"/><text x="250" y="316" class="wx-t-b">risk: uranium washed out later</text><text x="250" y="332" class="wx-t-s">less uranium makes the crust look too old</text><text x="250" y="358" class="wx-t-b">check: sample layer by layer</text><text x="250" y="374" class="wx-t-s">ages must get younger from the inner layer outwards</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Pigment goes onto the limestone wall.</p><ol class="wx-steplist"><li>Pigment goes onto the limestone wall.</li><li>Over time, seeping water lays down thin layers of calcite over the paint.</li><li>In a scraped sample, thorium-230 builds up from uranium at a known rate: the ratio dates the crust.</li><li>The paint lies under the crust, so it is older: the date is a minimum age.</li><li>The risk: if uranium washes out later, the crust looks too old. Layer-by-layer sampling checks for this.</li></ol><figcaption>Uranium-series dating gives the age of the crust, so it can only say the paint is older than that. <span class="wx-src">Based on: Pike et al. 2012; Hoffmann et al. 2018; White et al. 2020; Oktaviana et al. 2026 (Muna figures). Schematic; crust thickness exaggerated.</span></figcaption><p class="vh">A cross-section of a limestone cave wall. Step 1: a thin band of red pigment on the wall surface. Step 2: water seeping down the wall lays three thin layers of calcite crust over the pigment. Step 3: a sample is taken from the crust; bars show uranium-234 and a growing amount of thorium-230, whose ratio acts as a clock. Step 4: the Muna example, a crust age of 71,600 plus or minus 3,800 years, meaning the paint is at least 67,800 years old. Step 5: arrows show uranium being washed out of the crust later, which would make it look too old, and the check: ages must get younger from the inner layer outwards.</p></figure><p>The reply was sharp. In 2020 Randall White and a long list of rock-art specialists argued in the Journal of Human Evolution that the crusts may have lost uranium over time, which would make them look too old, and that the sampling did not rule this out. The Hoffmann team answered that their layer-by-layer ages behaved as expected. In 2021 a study of the Ardales pigments by Africa Pitarch Martí and colleagues concluded that the red paint there was deliberately applied, not a natural stain. The debate continues, and the independent La Roche-Cotard flutings now give the Neanderthal case a second leg to stand on.</p><blockquote class="wpull"><p>Two dating methods, three countries, three kinds of human: the marks keep getting older, and the makers keep multiplying.</p></blockquote><p>Lee Berger&#x27;s team goes further still, arguing that Homo naledi, with a brain a third the size of ours, cut crosshatched marks into the walls of Rising Star cave in South Africa. Those marks are undated and most specialists doubt they have been tied to naledi at all, as our Open Case on the other humans explains.</p></section><section class="wsec" id="oldest-marks-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Hands on every continent</h3><p>One kind of mark links almost all of this story: the hand stencil, made by blowing or spitting pigment around a hand pressed to rock. They appear in Sulawesi and Borneo, in Spain and France, in Australia, in the Sahara and at Cueva de las Manos in Patagonia, where hundreds of hands were stencilled by hunter-gatherers thousands of years ago. The idea may have been invented again and again, because hands are always at hand; or it may be one of the oldest shared human habits.</p><aside class="wcall"><b>Fresh from the field</b><p>In January 2026 Oktaviana and colleagues reported in Nature a faint hand stencil in Liang Metanduno cave on Muna island, south-east Sulawesi. Calcite over it dates to 71,600 ± 3,800 years, giving a minimum age of 67,800 years, about 1,100 years older than the Maltravieso stencil. Its fingers were deliberately narrowed to look like claws, a style known only from Sulawesi. The team attributes it to Homo sapiens, which would place our species in the region by then, but the identity of the maker is an inference.</p></aside></section><section class="wsec" id="oldest-marks-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What time has erased</h3><p>The record of early marks is a record of survival, not of practice. Bone, shell, ochre and deep-cave walls last; wood, bark, hide and painted bodies do not. Tropical rock faces erode quickly, and the coasts of Sunda and Sahul, where early seafarers lived, are under the sea. Only a handful of engraved objects older than 100,000 years are known anywhere, and the oldest of them was found by chance, a century after it was dug up. The honest assumption is that the first marks are older than the oldest we have.</p></section><section class="wsec" id="oldest-marks-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle it</h3><p>The strongest test would be more Trinils: engraved objects from securely dated layers older than 300,000 years, which would turn a single case into a pattern. Checking the Spanish dates with a second method, and collecting new samples layer by layer, would settle whether Neanderthals painted there. Ancient DNA and proteins recovered from cave sediments can now show which humans were present in a cave, which could name the makers of marks where no bones survive.</p><p>The verdict today: deliberate marking by other humans is well supported, and the old creative-explosion story is gone. Whether symbols, in the full sense, began before our species rests on one extraordinary shell. It is plausible, and the evidence has moved in that direction every time a new find has been dated.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-find" style="--i:0"><span class="wtl-y">1891 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Dubois digs at Trinil and finds Java Man</span></li><li class="wtl-find" style="--i:1"><span class="wtl-y">2002 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Blombos engraved ochre published</span></li><li class="wtl-study" style="--i:2"><span class="wtl-y">2014 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Trinil shell engraving published; Gorham&#x27;s Cave hashtag</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">2018 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Spanish marks dated over 64,000; Blombos drawing</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">2020 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Critics challenge the Spanish dates</span></li><li class="wtl-find" style="--i:5"><span class="wtl-y">2023 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Neanderthal flutings at La Roche-Cotard</span></li><li class="wtl-find" style="--i:6"><span class="wtl-y">2024 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Sulawesi story scene over 51,200 years</span></li><li class="wtl-find" style="--i:7"><span class="wtl-y">2026 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Muna hand stencil over 67,800 years</span></li></ol><details class="srcs"><summary>Sources for this case (14)</summary><ol><li>Joordens, J. C. A. et al. (2015). Homo erectus at Trinil on Java used shells for tool production and engraving. Nature 518: 228–231 (online December 2014). <a href="https://doi.org/10.1038/nature13962" target="_blank" rel="noopener">doi:10.1038/nature13962</a></li><li>Henshilwood, C. S. et al. (2002). Emergence of modern human behavior: Middle Stone Age engravings from South Africa. Science 295: 1278–1280. <a href="https://doi.org/10.1126/science.1067575" target="_blank" rel="noopener">doi:10.1126/science.1067575</a></li><li>Henshilwood, C. S., d&#x27;Errico, F. &amp; Watts, I. (2009). Engraved ochres from the Middle Stone Age levels at Blombos Cave, South Africa. Journal of Human Evolution 57: 27–47.</li><li>Henshilwood, C. S. et al. (2018). An abstract drawing from the 73,000-year-old levels at Blombos Cave, South Africa. Nature 562: 115–118. <a href="https://doi.org/10.1038/s41586-018-0514-3" target="_blank" rel="noopener">doi:10.1038/s41586-018-0514-3</a></li><li>Texier, P.-J. et al. (2010). A Howiesons Poort tradition of engraving ostrich eggshell containers dated to 60,000 years ago at Diepkloof Rock Shelter, South Africa. PNAS 107(14): 6180–6185. <a href="https://doi.org/10.1073/pnas.0913047107" target="_blank" rel="noopener">doi:10.1073/pnas.0913047107</a></li><li>Hoffmann, D. L. et al. (2018). U-Th dating of carbonate crusts reveals Neandertal origin of Iberian cave art. Science 359: 912–915. <a href="https://doi.org/10.1126/science.aap7778" target="_blank" rel="noopener">doi:10.1126/science.aap7778</a></li><li>White, R. et al. (2020). Still no archaeological evidence that Neanderthals created Iberian cave art. Journal of Human Evolution 144: 102640. <a href="https://doi.org/10.1016/j.jhevol.2019.102640" target="_blank" rel="noopener">doi:10.1016/j.jhevol.2019.102640</a></li><li>Pitarch Martí, A. et al. (2021). The symbolic role of the underground world among Middle Paleolithic Neanderthals. PNAS 118(33): e2021495118. <a href="https://doi.org/10.1073/pnas.2021495118" target="_blank" rel="noopener">doi:10.1073/pnas.2021495118</a></li><li>Marquet, J.-C. et al. (2023). The earliest unambiguous Neanderthal engravings on cave walls: La Roche-Cotard, Loire Valley, France. PLOS ONE 18(6): e0286568. <a href="https://doi.org/10.1371/journal.pone.0286568" target="_blank" rel="noopener">doi:10.1371/journal.pone.0286568</a></li><li>Rodríguez-Vidal, J. et al. (2014). A rock engraving made by Neanderthals in Gibraltar. PNAS 111(37): 13301–13306. <a href="https://doi.org/10.1073/pnas.1411529111" target="_blank" rel="noopener">doi:10.1073/pnas.1411529111</a></li><li>Oktaviana, A. A. et al. (2024). Narrative cave art in Indonesia by 51,200 years ago. Nature 631: 814–818. <a href="https://doi.org/10.1038/s41586-024-07541-7" target="_blank" rel="noopener">doi:10.1038/s41586-024-07541-7</a></li><li>Oktaviana, A. A. et al. (2026). Rock art from at least 67,800 years ago in Sulawesi. Nature 650: 652–656. <a href="https://doi.org/10.1038/s41586-025-09968-y" target="_blank" rel="noopener">doi:10.1038/s41586-025-09968-y</a></li><li>Pike, A. W. G. et al. (2012). U-series dating of Paleolithic art in 11 caves in Spain. Science 336: 1409–1413. <a href="https://doi.org/10.1126/science.1219957" target="_blank" rel="noopener">doi:10.1126/science.1219957</a></li><li>Martinón-Torres, M., Garate, D., Herries, A. I. R. &amp; Petraglia, M. D. (2024). No scientific evidence that Homo naledi buried their dead and produced rock art. Journal of Human Evolution 195: 103464. <a href="https://doi.org/10.1016/j.jhevol.2023.103464" target="_blank" rel="noopener">doi:10.1016/j.jhevol.2023.103464</a></li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-oldest-marks" data-t="Older Than Us: The First Deliberate Marks"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Older Than Us: The First Deliberate Marks</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-oldest-marks</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-ice-age-writing-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Vogelherd Mammut 2006.jpg" data-cap="Ivory mammoth from Vogelherd cave, Swabian Jura, about 40,000 years old" data-big><figcaption></figcaption></figure><div class="sh-k">Signs Across the World</div><h2 class="sh-t" id="case-ice-age-writing-st" tabindex="-1">Ice Age Notation: Records Before Writing?</h2><p class="sh-s">Rows of dots beside a painted horse, crosses on an ivory figurine, notches on a baboon bone: were Ice Age people keeping records?</p><div class="sh-v"><span class="vstamp vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><p class="sh-claim"><b>What the stamp rates:</b> Ice Age people used systems of signs to record information, a kind of proto-writing, tens of thousands of years before writing.</p></div><p class="v4-q">Did Ice Age people record information in signs, long before writing?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Long before writing, Ice Age people made rows of dots, lines and notches beside their animal paintings.</li><li>Some 260 objects from German caves, up to 43,000 years old, carry more than 3,000 such marks.</li><li>Two studies found patterned sequences that look like information being stored.</li><li>One reading sees a calendar of animal breeding seasons; critics dispute the tracings and the statistics.</li><li>Recording information is plausible; a system that could carry messages, proto-writing, is untested.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Mathematics</span><span class="thr">Texts and scripts</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="3000" >3,000</b><span class="ctr-u"> signs</span></div><div class="ctr-l">on Swabian Aurignacian objects</div><div class="ctr-c">Bentz and Dutkiewicz 2026</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="260" >260</b><span class="ctr-u"> objects</span></div><div class="ctr-l">analysed from the Swabian Jura</div><div class="ctr-c">Bentz and Dutkiewicz 2026</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="862" >862</b><span class="ctr-u"> sequences</span></div><div class="ctr-l">of dots, lines and Y signs tested</div><div class="ctr-c">Bacon et al. 2023</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="168" >168</b><span class="ctr-u"> marks</span></div><div class="ctr-l">on the Ishango bone</div><div class="ctr-c">Ishango bone records</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="43000" >43,000</b><span class="ctr-u"> years</span></div><div class="ctr-l">age of the Border Cave notched bone</div><div class="ctr-c">d&#x27;Errico et al. 2012</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Ice Age people used systems of signs to record information, a kind of proto-writing, tens of thousands of years before writing.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">That some Ice Age marks stored information is plausible and increasingly supported: patterned sequences, marks added over time and two quantitative studies point that way. But no study has shown what any sequence records. The calendar reading rests on a statistical fit and on tracings critics dispute, and neither team claims the signs encode language. Information recording is the better-supported description; proto-writing, in the sense of a system that could carry specific messages, remains untested.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks say writing began in Mesopotamia about 5,300 years ago, and for writing that records language they are right. But they usually file everything earlier under &#x27;art&#x27;, which undersells the evidence for notation. The honest position sits in between: marks that probably stored information for the people who made them, whose content we cannot yet read.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Writing that records language appears around 3300 BCE, with proto-cuneiform tablets from Uruk in Mesopotamia, and soon after in Egypt.<small>standard chronology; see Lost Scripts</small></li><li>About 260 Aurignacian objects from caves of the Swabian Jura, roughly 43,000–34,000 years old, carry more than 3,000 geometric signs: crosses, dots, notches and lines.<small>Bentz and Dutkiewicz 2026</small></li><li>In French and Spanish caves, rows of dots and lines often sit beside animal images; Bacon and colleagues compiled 862 such sequences, 256 of them including a Y-shaped sign.<small>Bacon et al. 2023</small></li><li>Notched bones are old: a notched baboon fibula from Border Cave, South Africa, is about 43,000 years old, and the Ishango bone from Congo, with 168 marks in three columns, about 20,000.<small>d&#x27;Errico et al. 2012; de Heinzelin 1962</small></li><li>Hundreds of engraved ostrich-eggshell fragments from Diepkloof, South Africa, about 60,000 years old, repeat a small set of standardised patterns.<small>Texier et al. 2010</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether dot-and-line rows count lunar months from spring, and whether the Y sign means &#x27;giving birth&#x27;, as Bacon and colleagues propose.</li><li>Whether the Swabian sign sequences held specific information or followed decorative traditions.</li><li>Whether notched bones such as Ishango record counts, the Moon&#x27;s phases, or nothing numerical at all.</li><li>Where to draw the lines between notation, proto-writing and writing.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Everyday records were probably kept on wood, bark, hide or knotted cord, none of which survives from the Ice Age.</li><li>There is no key: no bilingual text or living tradition to check any reading against.</li><li>Many cave marks are faint, and tracings made decades ago can misrepresent what is on the wall.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Most archaeologists date true writing to about 3300 BCE and see a long prehistory of tallies, tokens and marks behind it. Francesco d&#x27;Errico calls Palaeolithic marks that helped people remember &#x27;artificial memory systems&#x27;. His microscope studies show some sequences were cut in several sessions with different tools, as a record kept over time would be, but they cannot show what was counted. Specialists welcome quantitative work, yet warn that patterns can be found in any large set of marks, and that the label &#x27;proto-writing&#x27; invites confusion with writing proper.</p><ul><li>Writing records language; none of these systems does.</li><li>Tally sticks are known among recent hunter-gatherers, so Ice Age tallies would not be surprising.</li><li>Specific readings, such as lunar calendars or birth months, are hard to test independently.</li><li>Critics of Bacon et al. report tracings that do not match the walls and signs that are not there.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Bacon, an independent researcher, and his academic co-authors argue that dots and lines beside animal images count lunar months from the spring snowmelt, and that a Y sign marks the month of birth, forming a calendar of animal behaviour useful to hunters. Bentz and Dutkiewicz measured sign sequences on Swabian objects and found them as structured and information-dense as early proto-cuneiform, calling them a system of conventional signs. Marshack argued from the 1960s that notched bones and plaques tracked the Moon.</p><ul><li>Bacon et al. report statistically significant matches between sign counts and the birth and mating seasons of the animals drawn.</li><li>Bentz and Dutkiewicz find sequences that are neither random nor language-like, but structured like early accounting.</li><li>Similar marks recur for tens of thousands of years, pointing to a shared practice.</li><li>Microscopy shows some sequences grew over time, as records do.</li></ul><div class="face-s"><b>Its strongest point</b><p>Two independent quantitative studies, using different data and methods, find Ice Age sign sequences structured rather than random, and one finds them as information-dense as the earliest Mesopotamian tablets, which did lead to writing.</p></div><p class="face-cr"><b>Credit</b> Bennett Bacon, Paul Pettitt and colleagues (2023); Christian Bentz and Ewa Dutkiewicz (2026); earlier, Alexander Marshack; Genevieve von Petzinger</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Independent re-recording, with photographs, of the cave sequences Bacon et al. used, then re-running their test on accurate tracings.</li><li>Prediction on fresh data: sequences recorded after 2023 should fit the same month counts if the calendar is real.</li><li>Running the Bentz method on other regions and periods, and on control sets of plainly decorative marks, to see what the measure really separates.</li><li>Microscope studies of many more notched objects to show whether marks were added over time.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,162 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of Ice Age Notation: Records Before Writing?"><button type="button" class="wtoc-i" data-go="ice-age-writing-s1">A lion-man with a message?</button><button type="button" class="wtoc-i" data-go="ice-age-writing-s2">The marks are real, and old</button><button type="button" class="wtoc-i" data-go="ice-age-writing-s3">A calendar for hunters</button><button type="button" class="wtoc-i" data-go="ice-age-writing-s4">Measuring the information</button><button type="button" class="wtoc-i" data-go="ice-age-writing-s5">The sceptics&#x27; reading</button><button type="button" class="wtoc-i" data-go="ice-age-writing-s6">What time has erased</button><button type="button" class="wtoc-i" data-go="ice-age-writing-s7">What would settle it</button></nav></div><section class="wsec" id="ice-age-writing-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A lion-man with a message?</h3><p>In a museum case in Germany sits a small plaque of mammoth ivory, about 38,000 years old, found in Geißenklösterle cave in the Swabian Jura. On one side a figure stands with raised arms, part human, part lion: archaeologists call it the Adorant. Its edges and back carry rows of notches and dots. Nearby caves have given up a lion-headed man carved in ivory, with evenly spaced cuts on one arm, and an ivory figurine from Vogelherd covered in rows of crosses and dots.</p><p>We are taught that recording began with writing, in Mesopotamia, around 3300 BCE. Before that, the story goes, people remembered, told and drew, but did not record. The dots on the Adorant ask whether that line is in the right place.</p><blockquote class="wpull"><p>The question is not whether Ice Age people could write, but whether they could leave a record.</p></blockquote></section><section class="wsec" id="ice-age-writing-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The marks are real, and old</h3><p>Start with what nobody disputes. Repeated, patterned marks are very old. At Diepkloof in South Africa, people about 60,000 years ago engraved ostrich eggshells, probably water containers, with a small set of standardised designs. At Border Cave, on the border of South Africa and Eswatini, a baboon fibula about 43,000 years old carries a row of cut notches; Francesco d&#x27;Errico and colleagues list it among early objects that resemble the material culture of the later San. The Ishango bone, found in 1950 by Jean de Heinzelin beside the Semliki River on today&#x27;s Congo–Uganda border, is roughly 20,000 years old and carries 168 marks in three columns.</p><p>In Europe, rows of dots and short lines sit beside painted animals in cave after cave. And in the Swabian Jura, where some of the oldest figurative art in the world was made, about 260 objects carry more than 3,000 geometric signs. The previous Open Case, on the first signs, showed that Ice Age signs formed a shared set of conventions. This case asks a harder question: did any of them store information?</p></section><section class="wsec" id="ice-age-writing-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>A calendar for hunters</h3><p>In January 2023 the Cambridge Archaeological Journal published a paper by Bennett Bacon, an independent researcher in London, with academics including the Palaeolithic specialist Paul Pettitt and the psychologist Robert Kentridge of Durham University. Bacon had spent years studying images of cave animals and the marks beside them. The team proposed a simple system. Counting starts at the spring snowmelt. Each dot or line stands for one lunar month. A row of four marks beside an animal means month four, which they link to that species&#x27; mating season. A Y-shaped sign in the row means &#x27;giving birth&#x27;, and its position gives the month.</p><figure class="wx wx--steps" id="ice-age-writing-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">How the proposed calendar reads a row of marks</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How the proposed calendar reads a row of marks"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" class="wx-svg" role="img" aria-labelledby="ice-age-writing-f1-t"><title id="ice-age-writing-f1-t">How the proposed Ice Age phenological calendar reads rows of dots and a Y sign beside an animal</title><text x="24" y="28" class="wx-t-cap">The proposed calendar · Bacon et al. 2023 · schematic</text><g class="wx-st" data-s="1"><g transform="translate(-14,-52)"><path d="M84,132 C110,112 140,106 170,108 C205,110 232,112 252,118 C266,121 280,126 288,138 C294,148 294,156 286,160 C276,162 264,156 256,152 C250,162 244,170 240,178 L238,214 L229,214 L226,184 C200,188 175,188 150,184 L116,180 L110,214 L101,214 L98,176 C88,168 82,154 84,132 Z" class="wx-stone wx-edge"/><path d="M262,122 C268,108 278,100 290,98" class="wx-line"/><path d="M254,120 C254,106 260,98 268,94" class="wx-line"/><path d="M86,136 C74,148 70,166 72,184" class="wx-line"/><circle cx="272" cy="134" r="2.2" class="wx-inkfill"/></g><text x="330" y="80" class="wx-t-s">an animal image (schematic)</text><circle cx="81" cy="206" r="6" class="wx-c4 wx-pop" style="--d:1"/><circle cx="127" cy="206" r="6" class="wx-c4 wx-pop" style="--d:2"/><circle cx="173" cy="206" r="6" class="wx-c4 wx-pop" style="--d:3"/><circle cx="219" cy="206" r="6" class="wx-c4 wx-pop" style="--d:4"/><text x="245" y="210" class="wx-t-s">row A: four dots</text></g><g class="wx-st wx-hide" data-s="4"><line x1="81" y1="236" x2="81" y2="258" class="wx-bold wx-s4"/><line ="314" text-anchor="middle" class="wx-t-n">6</text><rect x="336" y="292" width="42" height="34" rx="4" class="wx-card wx-edge-soft"/><text x="357.0" y="314" text-anchor="middle" class="wx-t-n">7</text><rect x="382" y="292" width="42" height="34" rx="4" class="wx-card wx-edge-soft"/><text x="403.0" y="314" text-anchor="middle" class="wx-t-n">8</text><rect x="428" y="292" width="42" height="34" rx="4" class="wx-card wx-edge-soft"/><text x="449.0" y="314" text-anchor="middle" class="wx-t-n">9</text><rect x="474" y="292" width="42" height="34" rx="4" class="wx-card wx-edge-soft"/><text x="495.0" y="314" text-anchor="middle" class="wx-t-n">10</text><rect x="520" y="292" width="42" height="34" rx="4" class="wx-card wx-edge-soft"/><text x="541.0" y="314" text-anchor="middle" class="wx-t-n">11</text><rect x="566" y="292" width="42" height="34" rx="4" class="wx-card wx-edge-soft"/><text x="587.0" y="314" text-anchor="middle" class="wx-t-n">12</text><rect x="612" y="292" width="42" height="34" rx="4" class="wx-card wx-edge-soft"/><text x="633.0" y="314" text-anchor="middle" class="wx-t-n">13</text><g class="wx-st" data-s="2"><rect x="60" y="292" width="42" height="34" rx="4" class="wx-c3 wx-o40"/><text x="60" y="348" class="wx-t-b">spring</text><text x="60" y="364" class="wx-t-s">count starts</text></g><g class="wx-st" data-s="3"><rect x="198" y="292" width="42" height="34" rx="4" class="wx-accfill wx-o40"/><circle cx="219" cy="206" r="11" class="wx-hl"/><text x="198" y="348" class="wx-t-b wx-t-a">month 4: mating</text><text x="198" y="364" class="wx-t-s">four marks = four months</text></g><g class="wx-st" data-s="4"><rect x="152" y="292" width="42" height="34" rx="4" class="wx-c2 wx-o40"/><circle cx="173" cy="247" r="15" class="wx-line wx-s2"/><line x1="173" y1="328" x2="173" y2="374" class="wx-thin"/><text x="179" y="388" class="wx-t-b">month 3: births (the Y)</text></g><g class="wx-st" data-s="5"><rect x="470" y="100" width="226" height="148" rx="10" class="wx-card wx-edge-soft"/><text x="486" y="124" class="wx-t-cap">The test</text><text x="486" y="146" class="wx-t-b">862 sequences</text><text x="486" y="163" class="wx-t-s">606 without a Y, 256 with one</text><text x="486" y="184" class="wx-t">Counts matched known</text><text x="486" y="200" class="wx-t">seasons better than chance</text><text x="486" y="220" class="wx-t-s">Critics: some tracings are wrong,</text><text x="486" y="234" class="wx-t-s">some signs are not there</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> An animal image with a row of marks beside it, a common pairing in Ice Age caves.</p><ol class="wx-steplist"><li>An animal image with a row of marks beside it, a common pairing in Ice Age caves.</li><li>The proposal: count lunar months from the spring snowmelt, month 1.</li><li>Each dot or line is one month; four marks point to month 4, read as the mating season.</li><li>A Y sign means &#x27;giving birth&#x27;; its place in the row, here third, gives the birth month.</li><li>The test: 862 sequences matched known seasons better than chance; critics dispute the tracings.</li></ol><figcaption>A schematic of the phenological calendar proposed by Bacon and colleagues in 2023; the animal and marks are illustrative, not copied from one panel. <span class="wx-src">Based on: Bacon et al. 2023 (method, sequence counts); García-Bustos et al. 2023 (criticism). Month numbers are illustrative.</span></figcaption><p class="vh">A schematic painted animal, like an aurochs, with two rows of marks beside it: row A has four red dots; row B has two lines, a Y-shaped sign and another line. Below is a strip of thirteen boxes for lunar months, counted from the spring snowmelt. Step by step, month 1 is marked as spring, where the count starts; an arrow from the four dots points to month 4, labelled mating month; an arrow from the Y in third place points to month 3, labelled birth month. A final panel notes the test on 862 sequences, 606 without a Y and 256 with one, which matched known seasons better than chance, and the critics&#x27; objection that some tracings are wrong and some signs are not there.</p></figure><p>They tested it on 862 sequences from French and Spanish caves, across nine kinds of animal, from aurochs and bison to fish and birds, spanning roughly 37,000–13,000 years. The counts, they report, match the known birth and mating seasons of the animals&#x27; modern relatives far better than chance. If they are right, Ice Age hunters kept a shared calendar of animal behaviour, written on cave walls.</p><aside class="wcall"><b>How do we know?</b><p>The test compares each sequence&#x27;s count with the month in which the animal&#x27;s closest living relative mates or gives birth, then asks how often such matches would arise by chance. It depends on three things: accurate records of the marks, a sound rule for which marks belong to which animal, and modern breeding seasons that resemble Ice Age ones. Critics have challenged the first two.</p></aside></section><section class="wsec" id="ice-age-writing-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Measuring the information</h3><p>In February 2026 a different kind of study appeared in PNAS. The linguist Christian Bentz of Saarland University and the archaeologist Ewa Dutkiewicz of the Museum für Vor- und Frühgeschichte in Berlin digitised the sign sequences on about 260 Aurignacian objects and applied the statistical tools used to study languages and early scripts. They found the sequences were not random, and not like language either: they repeat, in runs such as cross, cross, cross, line, line, line, which spoken language does not do. But their information density was statistically comparable to that of proto-cuneiform, the Mesopotamian accounting tablets from which writing grew.</p><p>Bentz and Dutkiewicz are careful. Writing in the strict sense encodes spoken language, and these signs do not. What they describe is a system of conventional signs, a way of storing information on objects that seems to have been in place about 40,000 years ago.</p><blockquote class="wpull"><p>Not writing, but a system: the Swabian signs repeat like early accounts, not like speech.</p></blockquote></section><section class="wsec" id="ice-age-writing-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The sceptics&#x27; reading</h3><p>This idea has a history, and a cautionary one. From the 1960s Alexander Marshack, a journalist turned researcher at Harvard&#x27;s Peabody Museum, argued that notched bones and plaques, including a winding row of pits on a plaque from Abri Blanchard in France, were lunar records. His 1972 book The Roots of Civilization was hugely influential. Critics answered that he searched for patterns rather than testing for them, and the historian of mathematics George Gheverghese Joseph warned, about Ishango, that one bone can hardly carry the weight of conjecture piled on it.</p><p>Bacon&#x27;s calendar met similar resistance. In 2023 Miguel García-Bustos, Olivia Rivero, Georges Sauvet and Paula García Bustos, writing in the Journal of Paleolithic Archaeology, argued that some of the tracings used do not match the walls, that in several caves the signs counted are not really there, and that &#x27;association&#x27; between marks and animals was never defined. The dispute is not settled.</p><p>Specialists also stress that repeated, regular marks can be decorative, ritual or ownership signs. Structure shows a convention; it does not show a message.</p></section><section class="wsec" id="ice-age-writing-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What time has erased</h3><p>If Ice Age people kept records, most of them are gone. The notched stick, the knotted cord and the painted hide are exactly the kind of objects recent hunter-gatherers used for counting and remembering, and none survives from 40,000 years ago. What survives is carved in ivory and bone or painted in deep caves, which may be the most special, least everyday records. That bias cuts both ways: it may hide a far richer practice of notation, or it may make ritual marks look like bookkeeping. Our case on lost scripts shows how hard even true writing is to read without a key; here there is no key at all.</p></section><section class="wsec" id="ice-age-writing-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle it</h3><p>The calendar can be tested. If independent teams re-record the sequences with photographs and the pattern holds, and if sequences recorded since 2023 fit the same counts, it will be hard to dismiss. The Bentz method can be run on other regions, and on marks everyone agrees are decorative, to show what it really distinguishes. And microscope studies of more notched objects can show which were built up over time, the physical signature of a record.</p><aside class="wcall"><b>Fresh from the field</b><p>Two studies in three years moved this question from speculation to measurement: Bacon and colleagues&#x27; calendar in 2023 and Bentz and Dutkiewicz&#x27;s information analysis in 2026. Neither claims writing. Both claim that some Ice Age signs followed rules that carried information. The next step is independent replication.</p></aside><p>The fair verdict today: Ice Age people very probably used marks to help them remember, and some sequences look like structured information. What they recorded, and whether any of it amounted to proto-writing, remains open.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-find" style="--i:0"><span class="wtl-y">1950 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Ishango bone found in the Belgian Congo</span></li><li class="wtl-study" style="--i:1"><span class="wtl-y">1964 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Marshack proposes lunar notation</span></li><li class="wtl-study" style="--i:2"><span class="wtl-y">1972 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">The Roots of Civilization published</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">1995 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">d&#x27;Errico&#x27;s microscope study of engraved sequences</span></li><li class="wtl-find" style="--i:4"><span class="wtl-y">2010 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Diepkloof engraved eggshells published</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">2012 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Border Cave notched bone dated</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2023 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Bacon et al. propose a phenological calendar</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2026 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Bentz and Dutkiewicz measure Swabian signs</span></li></ol><details class="srcs"><summary>Sources for this case (11)</summary><ol><li>Bacon, B., Khatiri, A., Palmer, J., Freeth, T., P
