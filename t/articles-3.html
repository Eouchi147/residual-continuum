ht="43.4" class="wx-stone3 wx-edge"/><rect x="634" y="467.0" width="14" height="43.4" class="wx-stone3 wx-edge"/><g><circle cx="410" cy="396.3" r="3" class="wx-inkfill"/><line x1="410" y1="399.1" x2="410" y2="408.2" class="wx-line"/><line x1="410" y1="408.2" x2="406" y2="418.0" class="wx-line"/><line x1="410" y1="408.2" x2="414" y2="418.0" class="wx-line"/><line x1="404" y1="402.6" x2="416" y2="402.6" class="wx-line"/></g><text x="420" y="409.6" class="wx-t-s">1.7 m</text><line x1="40" y1="96.0" x2="50" y2="96.0" class="wx-dim"/><text x="56" y="100.0" class="wx-t-n wx-halo">0 m</text><line x1="40" y1="236.0" x2="50" y2="236.0" class="wx-dim"/><text x="56" y="240.0" class="wx-t-n wx-halo">10 m</text><line x1="40" y1="376.0" x2="50" y2="376.0" class="wx-dim"/><text x="56" y="380.0" class="wx-t-n wx-halo">20 m</text><line x1="40" y1="516.0" x2="50" y2="516.0" class="wx-dim"/><text x="56" y="520.0" class="wx-t-n wx-halo">30 m</text><line x1="45" y1="96" x2="45" y2="516.0" class="wx-dim"/><line x1="398" y1="210.8" x2="430" y2="186" class="wx-thin"/><text x="430" y="190" class="wx-t-b wx-halo">Level 1, c. 10 m down</text><text x="430" y="205" class="wx-t-s wx-halo">an empty chamber off the shaft</text><line x1="190" y1="397.0" x2="234.4" y2="258" class="wx-thin"/><text x="90" y="262" class="wx-t-b wx-halo">Level 2, c. 20–23 m</text><text x="90" y="277" class="wx-t-s wx-halo">side chambers with stone sarcophagi;</text><line x1="560" y1="390.0" x2="590" y2="258" class="wx-thin"/><text x="590" y="262" class="wx-t-b wx-halo">Late Period finds</text><text x="590" y="277" class="wx-t-s wx-halo">bones, shabtis, amulets</text><line x1="400" y1="482.4" x2="309.6" y2="466" class="wx-thin"/><text x="150" y="470" class="wx-t-b wx-halo">Level 3, c. 30 m down</text><text x="150" y="485" class="wx-t-s wx-halo">four rough pillars, a granite</text><text x="90" y="292" class="wx-t-s wx-halo">dated by style to the 26th Dynasty</text><text x="150" y="500" class="wx-t-s wx-halo">sarcophagus on a rock island, ringed by water</text><line x1="640" y1="516.0" x2="640" y2="520" class="wx-thin"/><text x="700" y="534" text-anchor="end" class="wx-t-s">groundwater floods the lowest level</text><line x1="24" y1="562" x2="94.0" y2="562" class="wx-bold"/><text x="102.0" y="566" class="wx-t-s">5 m</text></svg></div></div><figcaption>A section through the Osiris Shaft with its three levels, the sarcophagi of level 2 and the pillared island at the bottom. Depths are approximate because published figures differ. <span class="wx-src">Based on: Layout after Hawass 2007 and published descriptions; level depths approximate (sources give c. 9.6 m, c. 20–23 m and c. 30 m). Chamber sizes and positions simplified.</span></figcaption><p class="vh">A vertical section through bedrock beneath the causeway of Khafre, with a depth scale from 0 to 30 metres. A first shaft drops to a small empty chamber about 10 metres down. A second shaft descends to a long hall at about 20 to 23 metres, with three side bays holding stone sarcophagi, labelled as dated by style to the 26th Dynasty, with bones, shabtis and amulets; a 1.7 metre human figure stands in the hall for scale. A third shaft drops to the lowest level at about 30 metres, a room with four rough pillars around a rock island carrying a granite sarcophagus, with groundwater filling the floor around it. A 5 metre scale bar sits at the bottom left.</p></figure><p>The first shaft leads to an empty chamber about ten metres down. A second shaft continues to a larger level with side chambers, where massive stone sarcophagi lay. Two held decayed human skeletons, and the fill yielded shabti figurines, amulets and pottery, which Hawass dated on style to the 26th Dynasty, around 600 BCE. A third, shorter shaft drops to the lowest level: the pillared room, the island, the granite sarcophagus and the water. Accounts give slightly different depths for each level, but the bottom lies roughly 30 m below the causeway.</p></section><section class="wsec" id="osiris-shaft-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The case for a far older shaft</h3><p>Corsetti&#x27;s argument has several parts, and the best of them is genuinely scientific. Almost every date for the shaft comes from objects found inside it. But a rock-cut space can stand empty for centuries before anyone puts a coffin in it, and robbers and floods can remove whatever was there first. So the dates tell us when the shaft was used. When it was cut is another question, and no radiocarbon or other physical date for the cutting has been published.</p><p>He also points to Herodotus. Writing around 440 BCE, the Greek historian repeated what Egyptian priests told him about Cheops:</p><blockquote class="quote"><p>underground chambers on the hill upon which the pyramids stand, which he caused to be made as sepulchral chambers for himself in an island, having conducted thither a channel from the Nile.</p><cite>Herodotus, Histories 2.124, trans. G. C. Macaulay (1890)</cite></blockquote><p>An island tomb under the pyramid hill, surrounded by water: it is hard not to think of the lowest level. In a video released on 17 May 2026 Corsetti set this beside a second complaint. Hawass had said on air that nothing had been found in the shaft, yet his own report lists skeletons and amulets. What else, Corsetti asked, went unrecorded?</p></section><section class="wsec" id="osiris-shaft-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The Egyptological reading</h3><p>Hawass reads the lowest level as a symbolic tomb of Osiris, not a real burial. From the Middle Kingdom onward, Egyptians honoured Osiris with cenotaphs, and at Giza the god was worshipped as &#x27;Lord of Rosetau&#x27;, the old name for this part of the plateau. The best parallel is the Osireion at Abydos, built for Seti I around 1290–1279 BCE, where a hall of massive granite pillars stands on an island ringed by a water channel, echoing the mound rising from the waters of creation. Its builders&#x27; names and decoration date it securely.</p><figure class="photo wimg" data-img="Osireion at Abydos.jpg" data-cap="The Osireion at Abydos, Seti I&#x27;s cenotaph for Osiris: a pillared island surrounded by water, and the closest parallel to the lowest level of the Osiris Shaft."><figcaption></figcaption></figure><p>On this view the shaft was cut or finished in the New Kingdom and reused for burials in the 26th Dynasty, an age that revived Old Kingdom styles and filled Giza with new shrines and tombs. Herodotus, visiting a century or so later, heard a garbled version of a real place and pinned it on the famous king who owned the hill. Pottery of Old Kingdom style has also been reported from the lowest level, which would push some activity back into the Old Kingdom, but not before it.</p></section><section class="wsec" id="osiris-shaft-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Weighing it</h3><p>Put the two readings side by side and the evidence has a clear shape. Corsetti is right that the cutting of the shaft has never been dated directly, right that the main publication is thin, and right to ask why the public first saw the shaft on a live TV show. But everything that can be dated belongs to dynastic Egypt. The shaft lies under a dynastic causeway. Its design matches a dated Egyptian monument. Its water is groundwater, which has risen and fallen at Giza over the millennia. No tool mark, inscription or object points to an earlier culture.</p><figure class="wx wx--steps" id="osiris-shaft-f2" data-n="6"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">What each clue actually dates</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="What each clue actually dates"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" class="wx-svg" role="img" aria-labelledby="osiris-shaft-f2-t"><title id="osiris-shaft-f2-t">Timeline from 3500 BCE to 0 showing what each clue in the Osiris Shaft dates, from the undated rock cutting to Late Period burials, and the challenger's proposed early date, in six steps</title><defs><marker id="osiris-shaft-f2-ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-accfill" d="M0,1 L9,5 L0,9 Z"/></marker></defs><text x="24" y="28" class="wx-t-cap">What each clue dates, 3500 BCE to 0</text><line x1="70" y1="350" x2="690" y2="350" class="wx-line"/><line x1="70.0" y1="350" x2="70.0" y2="356" class="wx-dim"/><text x="70.0" y="370" text-anchor="middle" class="wx-t-s">3500 BCE</text><line x1="158.6" y1="350" x2="158.6" y2="356" class="wx-dim"/><text x="158.6" y="370" text-anchor="middle" class="wx-t-s">3000 BCE</text><line x1="247.1" y1="350" x2="247.1" y2="356" class="wx-dim"/><text x="247.1" y="370" text-anchor="middle" class="wx-t-s">2500 BCE</text><line x1="335.7" y1="350" x2="335.7" y2="356" class="wx-dim"/><text x="335.7" y="370" text-anchor="middle" class="wx-t-s">2000 BCE</text><line x1="424.3" y1="350" x2="424.3" y2="356" class="wx-dim"/><text x="424.3" y="370" text-anchor="middle" class="wx-t-s">1500 BCE</text><line x1="512.9" y1="350" x2="512.9" y2="356" class="wx-dim"/><text x="512.9" y="370" text-anchor="middle" class="wx-t-s">1000 BCE</text><line x1="601.4" y1="350" x2="601.4" y2="356" class="wx-dim"/><text x="601.4" y="370" text-anchor="middle" class="wx-t-s">500 BCE</text><line x1="690.0" y1="350" x2="690.0" y2="356" class="wx-dim"/><text x="690.0" y="370" text-anchor="middle" class="wx-t-s">0</text><rect x="140.9" y="328" width="73.3" height="16" class="wx-stone wx-edge-soft"/><text x="177.6" y="340" text-anchor="middle" class="wx-t-s">Early Dyn.</text><rect x="214.2" y="328" width="89.5" height="16" class="wx-stone wx-edge-soft"/><text x="258.9" y="340" text-anchor="middle" class="wx-t-s">Old Kingdom</text><rect x="415.4" y="328" width="85.2" height="16" class="wx-stone wx-edge-soft"/><text x="458.0" y="340" text-anchor="middle" class="wx-t-s">New Kingdom</text><rect x="572.4" y="328" width="58.8" height="16" class="wx-stone wx-edge-soft"/><text x="601.8" y="340" text-anchor="middle" class="wx-t-s">Late Period</text><g class="wx-st" data-s="1"><line x1="238.3" y1="326" x2="238.3" y2="70" class="wx-hl"/><text x="244.3" y="80" class="wx-t-b">Khafre's causeway above, c. 2550 BCE</text><text x="244.3" y="95" class="wx-t-s">the rock-cut shaft itself carries no date</text></g><g class="wx-st" data-s="2"><rect x="274.6" y="120" width="29.1" height="14" class="wx-c6"/><text x="311.7" y="131" class="wx-t">Old Kingdom-style red pottery reported in level 3</text></g><g class="wx-st" data-s="3"><circle cx="415.4" cy="170" r="7" class="wx-c2"/><text x="429.4" y="167" class="wx-t">Hawass: level 3 from c. 1550 BCE</text><text x="429.4" y="182" class="wx-t-s">judged by sarcophagus size and pottery style</text></g><g class="wx-st" data-s="4"><rect x="572.4" y="212" width="24.6" height="14" class="wx-c4"/><text x="564.4" y="223" text-anchor="end" class="wx-t">Level 2 burials, 26th Dynasty</text></g><g class="wx-st" data-s="5"><circle cx="612.1" cy="260" r="6" class="wx-c5"/><rect x="631.2" y="286" width="53.5" height="10" class="wx-c5 wx-o60"/><text x="602.1" y="264" text-anchor="end" class="wx-t">Herodotus describes an island tomb, c. 440 BCE</text><text x="621.2" y="296" text-anchor="end" class="wx-t-s">Ptolemaic and Roman use</text></g><g class="wx-st wx-hide" data-s="6"><line x1="140.9" y1="150" x2="40" y2="150" class="wx-hl wx-dash" marker-end="url(#osiris-shaft-f2-ah)"/><text x="40" y="206" class="wx-t-b wx-t-a">Proposed: cut</text><text x="40" y="221" class="wx-t-b wx-t-a">before 3100 BCE</text><text x="40" y="237" class="wx-t-s">no dated evidence yet</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button><button type="button" class="wx-dot" data-k="6" aria-label="Step 6" aria-pressed="false">6</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 6.</b> Khafre&#x27;s causeway runs above the shaft, c. 2550 BCE. The rock-cut rooms carry no date of their own.</p><ol class="wx-steplist"><li>Khafre&#x27;s causeway runs above the shaft, c. 2550 BCE. The rock-cut rooms carry no date of their own.</li><li>Red pottery of Old Kingdom style has been reported from the lowest level.</li><li>Hawass dates the lowest level from the New Kingdom, judging by sarcophagus size and pottery style.</li><li>Level 2 held burials of the 26th Dynasty: sarcophagi, skeletons, shabtis and amulets.</li><li>Herodotus hears of an island tomb under the pyramid hill; the shaft stays in use into Roman times.</li><li>The challenger&#x27;s proposal: the cutting predates dynastic Egypt. No dated evidence yet supports it.</li></ol><figcaption>The shaft&#x27;s dates come from objects placed in it; the rock cutting itself has never been dated. <span class="wx-src">Based on: Dates after Hawass 2007; period boundaries after Shaw (ed.) 2000; Herodotus 2.124. Old Kingdom pottery attribution as reported in secondary accounts of Hawass&#x27;s excavation.</span></figcaption><p class="vh">A timeline from 3500 BCE to 0 with bands for the Early Dynastic period, Old Kingdom, New Kingdom and Late Period. Step 1 marks Khafre&#x27;s causeway above the shaft at about 2550 BCE and notes that the rock-cut shaft carries no date. Step 2 adds a bar for Old Kingdom-style red pottery reported in the lowest level, about 2345 to 2181 BCE. Step 3 marks Hawass&#x27;s date for the lowest level, from about 1550 BCE, based on sarcophagus size and pottery style. Step 4 adds a bar for the 26th Dynasty burials in level 2, 664 to 525 BCE. Step 5 marks Herodotus&#x27;s account of an island tomb around 440 BCE and Ptolemaic and Roman use. Step 6 draws a dashed arrow running off before 3100 BCE for the challenger&#x27;s proposed early cutting, labelled no dated evidence yet.</p></figure><aside class="wcall"><b>Fresh from the field</b><p>In 2026 Armando Mei, a member of the team behind the 2025 radar claims about structures beneath Khafre&#x27;s pyramid, posted a preprint on Zenodo relating the Osiris Shaft to that radar data. It has not been peer reviewed, and the team&#x27;s earlier peer-reviewed paper on Khufu&#x27;s pyramid was retracted by Remote Sensing in August 2026 (see the Khafre Scans case). The row between Corsetti and Hawass that followed their May 2026 debate has put the shaft&#x27;s publication record under new scrutiny.</p></aside></section><section class="wsec" id="osiris-shaft-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What time and water have taken</h3><p>Any verdict here has to reckon with loss. The shaft stood open to robbers for centuries, probably millennia, and much of what it once held was taken long before Selim Hassan looked down into it. Then came the water. Rising groundwater, fed in modern times by irrigation and the spread of Cairo&#x27;s suburbs, flooded the lower levels and soaked whatever organic material remained, from wood to textiles to bone.</p><p>Floods also move things. Sherds and small objects can wash from one level to another, blurring the link between a find and the floor it lay on. That is why the careful context records of an excavation matter so much, and why their thin publication weakens the conventional dates as well as leaving room for doubt. What survives is a set of rooms, a few heavy coffins that no one could carry away, and a scatter of objects whose exact positions only the excavators know.</p></section><section class="wsec" id="osiris-shaft-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle it</h3><p>Two things would settle most of the argument. The first is publication: a full report of the 1999 work, with plans, sections, photographs and every find tied to its level. The second is radiocarbon. Bone, wood, plaster and any organic material in the fills can be dated, level by level, and a study of the tool marks on the rock walls could be compared with dated quarrying elsewhere on the plateau.</p><p>If the lowest level turned out to be cut long before the pyramids, it would be one of the most important finds in Egyptian archaeology. Nothing found so far suggests it. But Corsetti&#x27;s demand that the evidence be shown, rather than summarised, is one that Egyptologists should welcome.</p><blockquote class="wpull"><p>The water tomb is a real mystery of record keeping, not yet a mystery of age.</p></blockquote></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">2,550 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Khafre&#x27;s causeway built above</span></li><li class="wtl-use" style="--i:1"><span class="wtl-y">2,300 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Old Kingdom-style pottery (reported, lowest level)</span></li><li class="wtl-build" style="--i:2"><span class="wtl-y">1,550 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Lowest level dated from the New Kingdom (Hawass)</span></li><li class="wtl-build" style="--i:3"><span class="wtl-y">1,285 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Seti I&#x27;s Osireion at Abydos</span></li><li class="wtl-use" style="--i:4"><span class="wtl-y">600 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">26th Dynasty burials in level 2</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">440 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Herodotus hears of an island tomb</span></li><li class="wtl-find" style="--i:6"><span class="wtl-y">1934 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Selim Hassan records the flooded shaft</span></li><li class="wtl-find" style="--i:7"><span class="wtl-y">1999 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Excavated and shown on live TV</span></li><li class="wtl-event" style="--i:8"><span class="wtl-y">2026 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Corsetti challenges Hawass on the shaft</span></li></ol><details class="srcs"><summary>Sources for this case (10)</summary><ol><li>Hawass, Z. (2007). The discovery of the Osiris Shaft at Giza. In Z. Hawass and J. Richards (eds), The Archaeology and Art of Ancient Egypt: Essays in Honor of David B. O&#x27;Connor, vol. 1. Supreme Council of Antiquities, Cairo.</li><li>Hassan, S. (1932–1960). Excavations at Gîza. 10 vols. Government Press, Cairo.</li><li>Herodotus, Histories 2.124. Trans. G. C. Macaulay (1890), The History of Herodotus. Macmillan, London.</li><li>Frankfort, H. (1933). The Cenotaph of Seti I at Abydos. 2 vols. Egypt Exploration Society, London.</li><li>Lehner, M. &amp; Hawass, Z. (2017). Giza and the Pyramids. Thames &amp; Hudson, London.</li><li>Shaw, I. (ed.) (2000). The Oxford History of Ancient Egypt. Oxford University Press, Oxford.</li><li>Mei, A. (2026). The Osiris Shaft and the Khafre Causeway (Giza Plateau): archaeological context, second-level sarcophagi, and limited tomographic correlation. Zenodo preprint. <a href="https://doi.org/10.5281/zenodo.18184072" target="_blank" rel="noopener">doi:10.5281/zenodo.18184072</a></li><li>Colavito, J. (16 May 2026). Piers Morgan had three conspiracy theorists debate Zahi Hawass. They lost. jasoncolavito.com (account of the May 2026 broadcast).</li><li>Colavito, J. (17 May 2026). Jimmy Corsetti releases video accusing Zahi Hawass of crimes and cover-ups. jasoncolavito.com (summary of the Bright Insight video).</li><li>Opening the Lost Tombs: Live from Egypt (2 March 1999). Fox television special.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-osiris-shaft" data-t="The Osiris Shaft: How Old Is Giza&#x27;s Water Tomb?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Osiris Shaft: How Old Is Giza&#x27;s Water Tomb?</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-osiris-shaft</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-granite-drill-cores-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Unfinished Obelisk 02.jpg" data-cap="Giza plateau, Egypt (core found by Petrie); granite from Aswan" data-big><figcaption></figcaption></figure><div class="sh-k">Chambers, Sound and Stone</div><h2 class="sh-t" id="case-granite-drill-cores-st" tabindex="-1">Granite Drill Cores: Lost Machines in Ancient Egypt?</h2><p class="sh-s">A granite core with a spiral groove, saw cuts through hard stone, and one blunt question: could copper and sand really do this?</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> The drill cores and saw cuts in ancient Egyptian granite required lost machine tools, beyond copper, sand and human power.</p></div><p class="v4-q">Did Egyptian masons cut granite with lost machines, or with copper and sand?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Flinders Petrie collected a granite core at Giza in the 1880s, the waste from a drilled hole, with a spiral groove around it.</li><li>Engineer Christopher Dunn argued in 1984 that the groove showed a machine drill.</li><li>Experiments show that a copper tube fed with quartz sand cuts granite: the sand, harder than granite&#x27;s feldspar, does the grinding.</li><li>A copper drill with its leather bow-string, more than a thousand years older than Khufu, was identified in 2025.</li><li>No machine has ever been found; the exact groove has not yet been fully reproduced in a published test.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Engineering</span><span class="thr">Chemistry</span><span class="thr">Archaeology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="11" >11</b><span class="ctr-u"> cm</span></div><div class="ctr-l">height of Petrie&#x27;s core 7 (UC16036)</div><div class="ctr-c">UCL Petrie Museum</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="0.1" data-dec="1">0.1</b><span class="ctr-u"> inch</span></div><div class="ctr-l">groove pitch per turn that Petrie measured on core 7</div><div class="ctr-c">Petrie 1883</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="500" >500</b><span class="ctr-u"> times</span></div><div class="ctr-l">Dunn&#x27;s estimate of its feed per turn against a modern diamond drill</div><div class="ctr-c">Dunn 1984</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="7" >7</b><span class="ctr-u"> Mohs</span></div><div class="ctr-l">hardness of quartz sand, against about 3 for copper</div><div class="ctr-c">Stocks 2003</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The drill cores and saw cuts in ancient Egyptian granite required lost machine tools, beyond copper, sand and human power.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The machine reading rests on the claim that copper and sand could not do the job, and experiments since the 1980s show that they can, if slowly. The spiral groove that impressed Petrie is real, but grooves form whenever a hard grain is trapped between tube and stone, and Egypt had rotary drills for a thousand years before Khufu. No machine part, power source or impossible tool mark has been found. The exact groove has not been replicated in a published test, which keeps a detail open but does not make a machine likely.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks state flatly that Egyptians cut granite with copper and sand. The principle is well tested, so the confidence is mostly earned. Where they sound surer than the evidence is on the details: how long a granite coffer took, how much copper it ate, and exactly how the grooves on Petrie&#x27;s core formed. Those are reconstructed from experiments rather than recorded, and saying so openly would take much of the heat out of the debate.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Flinders Petrie collected granite drill cores and recorded tube-drill holes at Giza in 1880–82. His core 7, now UC16036 in the Petrie Museum, is about 11 cm tall, tapers from about 16.3 to 14.3 cm in circumference, and carries grooves he described as a regular spiral.<small>Petrie 1883; UCL Petrie Museum catalogue</small></li><li>Old Kingdom masons drilled and sawed granite, basalt and other hard stones: tube-drill holes and saw cuts survive on sarcophagi, blocks and temple pavements, including the King&#x27;s Chamber coffer.<small>Petrie 1883; Arnold 1991</small></li><li>Quartz sand ranks 7 on the Mohs scale, above feldspar (about 6) and equal to the quartz in granite, while copper ranks about 3. In a sand-fed cut, the sand does the grinding and the copper only carries and presses it.<small>Stocks 2003</small></li><li>Denys Stocks spent years replicating Egyptian stoneworking and drilled and sawed Aswan granite with copper tubes and blades fed with dry sand, producing cores and cuts. Progress was slow and the copper wore away steadily.<small>Stocks 2003</small></li><li>Rotary drilling with metal is very old in Egypt: a small copper-alloy drill with its leather bow-thong still coiled round it, from a Predynastic grave at Badari (Naqada IID, late 4th millennium BCE), was identified in 2025.<small>Odler and Kmošek 2025</small></li><li>Experiments by Gorelick and Gwinnett in 1983 showed that the choice of abrasive, not only the tool, controls whether a drilled hole carries concentric lines.<small>Gorelick and Gwinnett 1983</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the grooves on core 7 form one continuous spiral, and whether the groove spacing records how far the drill advanced per turn.</li><li>How long drilling and sawing granite took in practice, and how much copper, sand and labour a granite sarcophagus or beam consumed.</li><li>Whether harder abrasives such as emery, which Petrie proposed, were used alongside quartz sand.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>No Old Kingdom tube drill or long granite saw has been found in a workshop; copper was valuable and was reused and recycled.</li><li>Few deposits of spent sand and copper waste have been tied to particular granite objects, so working rates must be rebuilt from experiments.</li><li>Most cores were discarded as rubbish; Petrie&#x27;s handful is a tiny sample of what the masons produced.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Egyptologists and experimental archaeologists read the drill holes and saw cuts as the work of copper tubes and blades charged with loose quartz sand, driven by bows, cranks and human muscle, alongside pounding with hard dolerite balls in the quarries. The principle has been tested: sand-fed copper cuts granite, slowly. Where the field was slow is in the testing itself. For most of the 20th century the sand explanation was asserted rather than measured, Petrie&#x27;s own objection was left hanging, and the time and labour behind a granite coffer are still only roughly known.</p><ul><li>Copper and quartz sand, both abundant in Egypt, have drilled and sawn granite in repeated experiments.</li><li>Egyptian rotary drills are attested from the Predynastic period onward, and craft scenes in tombs show drills in use.</li><li>Tool marks such as overcut saw lines and tapered cores fit a slow abrasive process better than a rigid machine.</li><li>No machine parts, precision bearings, metal swarf or power sources have been found at any Egyptian quarry or workshop.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Jimmy Corsetti has argued for years, on his channel and on Joe Rogan&#x27;s show, that the precise cuts and circular drill marks in Egyptian granite could not have been made with copper chisels, copper saws and stone pounders, and that a more advanced technology, now lost, was at work. His guest-mates on Rogan, such as Ben van Kerkwyk, show the drill holes and saw cuts in detail. The engineering version comes from the machinist Christopher Dunn, who in 1984 read Petrie&#x27;s spiral groove as the track of a drill that advanced a tenth of an inch per turn, some 500 times the feed of a modern diamond drill.</p><ul><li>Petrie, the founder of scientific Egyptology, measured core 7 himself and judged that only fixed hard points could cut its grooves.</li><li>The grooves are deep and regular and run through quartz and feldspar alike.</li><li>Granite is hard and copper is soft; copper tools wear quickly against it.</li><li>No Egyptian text or picture explains how the granite coffers and beams at Giza were actually cut.</li></ul><div class="face-s"><b>Its strongest point</b><p>Flinders Petrie, the most careful surveyor Giza has had, examined the core and concluded that loose sand could not cut such a groove. Experimenters have drilled granite with copper and sand since, but the precise groove on core 7 has not been matched in a published side-by-side test.</p></div><p class="face-cr"><b>Credit</b> Jimmy Corsetti (Bright Insight; The Joe Rogan Experience #1742, December 2021, and #1928, January 2023, with Ben van Kerkwyk of UnchartedX); Christopher Dunn (Analog, 1984; The Giza Power Plant, 1998)</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>A controlled replication that reproduces core 7&#x27;s groove depth, pitch and taper with copper and sand, measured with the same instruments as the original.</li><li>High-resolution 3D scanning and microscopy of core 7 and other Giza cores for embedded abrasive grains, copper traces and tool chatter, with the data published.</li><li>Excavation of an Old Kingdom hard-stone workshop with spent sand, copper waste and unfinished drilled pieces.</li><li>Any tool mark that sand abrasion cannot make but a powered machine would, such as chatter at a fixed, regular frequency.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">6 min read · 1,234 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Granite Drill Cores: Lost Machines in Ancient Egypt?"><button type="button" class="wtoc-i" data-go="granite-drill-cores-s1">A groove in the granite</button><button type="button" class="wtoc-i" data-go="granite-drill-cores-s2">What Petrie found</button><button type="button" class="wtoc-i" data-go="granite-drill-cores-s3">The machine reading at its strongest</button><button type="button" class="wtoc-i" data-go="granite-drill-cores-s4">Copper, sand and patience</button><button type="button" class="wtoc-i" data-go="granite-drill-cores-s5">An older drill than anyone expected</button><button type="button" class="wtoc-i" data-go="granite-drill-cores-s6">What time has taken</button><button type="button" class="wtoc-i" data-go="granite-drill-cores-s7">What would settle it</button></nav></div><section class="wsec" id="granite-drill-cores-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A groove in the granite</h3><p>In a drawer of the Petrie Museum in London lies a stub of pink granite about 11 cm long, catalogued as UC16036. Flinders Petrie picked it up at Giza in the early 1880s and numbered it core 7. It is the waste plug left when someone bored a round hole through hard stone at least 4,500 years ago, and around it runs a fine groove that has launched a thousand videos.</p><p>Jimmy Corsetti, host of the YouTube channel Bright Insight, has made Egyptian stonework one of his signature subjects. On The Joe Rogan Experience in December 2021 he described drilling and cutting in granite that, to his eye, outstripped what the builders were supposed to have had. In a 2022 interview quoted by Inverse he put it bluntly: copper saws and chisels &quot;did not create the cuts&quot;. The question behind the soundbite is a fair one. Granite is among the hardest building stones there is. How did Bronze Age masons drill it so cleanly?</p><blockquote class="wpull"><p>The copper does not cut the granite. The sand does. That is the whole argument, and it can be tested.</p></blockquote></section><section class="wsec" id="granite-drill-cores-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What Petrie found</h3><p>Petrie was no romantic. He spent 1880 to 1882 measuring Giza with a precision no one had attempted, and he took the tool marks seriously. He recorded tube-drill holes in granite and basalt, straight saw cuts in hard stone, and a place on the King&#x27;s Chamber coffer where the saw had run too deep and been backed out. On core 7 he wrote that the grooves &quot;form a regular spiral, with no more interruption or waviness than is necessarily produced by the variations in the component crystals&quot;.</p><p>He measured the spiral&#x27;s pitch at about a tenth of an inch per turn and concluded that loose sand could not have cut it. Only fixed cutting points, he thought, perhaps jewels or emery set into the rim of a bronze tube, could plough such a line through quartz. The museum&#x27;s own record adds that the core is not a cylinder: one end is about 16.3 cm round and the other about 14.3 cm.</p><figure class="wx wx--static" id="granite-drill-cores-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Core 7 to scale, and why sand beats copper</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Core 7 to scale, and why sand beats copper"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" class="wx-svg" role="img" aria-labelledby="granite-drill-cores-f2-t"><title id="granite-drill-cores-f2-t">Petrie's granite drill core 7 drawn to scale with its spiral groove, beside a Mohs hardness ladder of copper, feldspar, quartz, corundum and diamond</title><text x="24" y="28" class="wx-t-cap">Petrie's core 7 (UC16036), drawn to scale</text><polygon points="91.7,90 228.3,90 237.8,420 82.2,420" class="wx-stone2 wx-edge"/><g><line x1="91.5" y1="98" x2="228.6" y2="101.8" class="wx-thin"/><line x1="91.3" y1="105.6" x2="228.8" y2="109.4" class="wx-thin"/><line x1="91.0" y1="113.2" x2="229.1" y2="117.0" class="wx-thin"/><line x1="90.8" y1="120.9" x2="229.3" y2="124.7" class="wx-thin"/><line x1="90.6" y1="128.5" x2="229.5" y2="132.3" class="wx-thin"/><line x1="90.4" y1="136.1" x2="229.7" y2="139.9" class="wx-thin"/><line x1="90.2" y1="143.7" x2="229.9" y2="147.5" class="wx-thin"/><line x1="89.9" y1="151.3" x2="230.2" y2="155.1" class="wx-hl"/><line x1="89.7" y1="159.0" x2="230.4" y2="162.8" class="wx-hl"/><line x1="89.5" y1="166.6" x2="230.6" y2="170.4" class="wx-hl"/><line x1="89.3" y1="174.2" x2="230.8" y2="178.0" class="wx-hl"/><line x1="89.1" y1="181.8" x2="231.0" y2="185.6" class="wx-thin"/><line x1="88.8" y1="189.4" x2="231.3" y2="193.2" class="wx-thin"/><line x1="88.6" y1="197.1" x2="231.5" y2="200.9" class="wx-thin"/><line x1="88.4" y1="204.7" x2="231.7" y2="208.5" class="wx-thin"/><line x1="88.2" y1="212.3" x2="231.9" y2="216.1" class="wx-thin"/><line x1="88.0" y1="219.9" x2="232.1" y2="223.7" class="wx-thin"/><line x1="87.7" y1="227.5" x2="232.4" y2="231.3" class="wx-thin"/><line x1="87.5" y1="235. 232.3" y1="166" x2="262" y2="150" class="wx-thin"/><text x="266" y="146" class="wx-t-b wx-halo">a groove traced</text><text x="266" y="160" class="wx-t-b wx-halo">for four turns</text><text x="266" y="176" class="wx-t-s wx-halo">pitch c. 2.5 mm</text><text x="266" y="190" class="wx-t-s wx-halo">(0.1 inch) per turn</text><line x1="85" y1="464" x2="235" y2="464" class="wx-bold"/><line x1="85" y1="459" x2="85" y2="469" class="wx-line"/><line x1="235" y1="459" x2="235" y2="469" class="wx-line"/><text x="160" y="482" text-anchor="middle" class="wx-t-s">5 cm</text><text x="380" y="28" class="wx-t-cap">Why sand cuts granite: Mohs hardness</text><rect x="380" y="62" width="90" height="22" class="wx-bronze wx-edge wx-growx" style="--d:1"/><text x="478" y="78" class="wx-t-n">3</text><text x="380" y="100" class="wx-t-b">Copper</text><text x="380" y="115" class="wx-t-s">the drill tube and saw blade</text><rect x="380" y="130" width="180" height="22" class="wx-stone2 wx-edge wx-growx" style="--d:2"/><text x="568" y="146" class="wx-t-n">6</text><text x="380" y="168" class="wx-t-b">Feldspar</text><text x="380" y="183" class="wx-t-s">most of the granite</text><rect x="380" y="198" width="210" height="22" class="wx-sand wx-edge wx-growx" style="--d:3"/><text x="598" y="214" class="wx-t-n">7</text><text x="380" y="236" class="wx-t-b">Quartz</text><text x="380" y="251" class="wx-t-s">in granite, and in desert sand</text><rect x="380" y="266" width="270" height="22" class="wx-metal wx-edge wx-growx" style="--d:4"/><text x="658" y="282" class="wx-t-n">9</text><text x="380" y="304" class="wx-t-b">Corundum (emery)</text><text x="380" y="319" class="wx-t-s">Petrie's proposed cutting points</text><rect x="380" y="334" width="300" height="22" class="wx-ice wx-edge wx-growx" style="--d:5"/><text x="688" y="350" class="wx-t-n">10</text><text x="380" y="372" class="wx-t-b">Diamond</text><text x="380" y="387" class="wx-t-s">modern core-drill bits</text><line x1="590" y1="54" x2="590" y2="395" class="wx-dash"/><text x="380" y="422" class="wx-t-s">Mohs is a ranking, not a linear scale. A scratch needs a</text><text x="380" y="436" class="wx-t-s">harder grain: quartz sand can wear feldspar and quartz;</text><text x="380" y="450" class="wx-t-s">copper cannot, so it only carries the sand.</text></svg></div></div><figcaption>Petrie&#x27;s core drawn at true proportions with its groove pitch, beside the hardness ranking that explains how sand-fed copper can cut granite. <span class="wx-src">Based on: Core dimensions: UCL Petrie Museum, UC16036 (height 11 cm; circumferences c. 16.3 and 14.3 cm); pitch 0.1 inch per turn after Petrie 1883. Mohs values are standard mineral hardness rankings.</span></figcaption><p class="vh">Left: a tapered granite core drawn to scale, 11 centimetres tall, one end about 14.3 centimetres round and the other about 16.3 centimetres, with fine slanting grooves and a highlighted band where a groove can be traced for four turns at a pitch of about 2.5 millimetres, or a tenth of an inch, per turn. A 5 centimetre scale bar sits below. Right: horizontal bars on the Mohs hardness scale: copper 3, feldspar 6, quartz 7, corundum or emery 9 and diamond 10, with a dashed line at quartz and a note that quartz sand can wear granite&#x27;s minerals while copper cannot.</p></figure></section><section class="wsec" id="granite-drill-cores-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The machine reading at its strongest</h3><p>In 1984 the machinist Christopher Dunn took Petrie&#x27;s numbers into the workshop. A modern diamond core drill in granite advances about two ten-thousandths of an inch per turn. If core 7&#x27;s groove records the drill&#x27;s feed, the ancient tool bit roughly 500 times deeper with each rotation. Dunn argued that no hand-powered tube could do that, and proposed a machine, perhaps an ultrasonic drill, that vibrated its way through the stone. He later developed the idea into his 1998 book The Giza Power Plant.</p><p>Corsetti&#x27;s version is broader and less technical. Look at the flat granite surfaces, the square inner corners, the drill holes and the sheer volume of hard stone moved and shaped at Giza, he argues, and then look at the tools on display in museums: copper chisels, stone hammers, wooden mallets. To him the mismatch is obvious, and Egyptologists who shrug it off have stopped asking questions.</p><p>The strongest part of this case is Petrie. The man who founded careful Egyptian archaeology measured the core himself and said sand could not do it. That deserves an answer, not a sneer.</p></section><section class="wsec" id="granite-drill-cores-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Copper, sand and patience</h3><p>The answer came slowly, and mostly from experiment. The key is hardness. On the Mohs scale copper ranks about 3, the feldspar that makes up most of granite about 6, and quartz 7. Desert sand is mostly quartz. Pressed under a turning copper tube, the grains roll and grind, chipping away feldspar and quartz alike, while the soft copper merely carries them and wears away in turn.</p><figure class="wx wx--steps" id="granite-drill-cores-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">How a copper tube and sand drill granite</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How a copper tube and sand drill granite"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" class="wx-svg" role="img" aria-labelledby="granite-drill-cores-f1-t"><title id="granite-drill-cores-f1-t">How a copper tube drill charged with sand cuts a core out of granite, in five steps</title><defs><marker id="granite-drill-cores-f1-ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-accfill" d="M0,1 L9,5 L0,9 Z"/></marker></defs><text x="24" y="28" class="wx-t-cap">Section through a copper tub d</text><text x="470" y="204" class="wx-t wx-t-a">of a machine, 0.1 inch per turn</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> A copper tube on a wooden shaft is spun by a bow and pressed down by weights.</p><ol class="wx-steplist"><li>A copper tube on a wooden shaft is spun by a bow and pressed down by weights.</li><li>Dry quartz sand fed into the slot does the cutting; the softer copper only carries it.</li><li>Grains rub the walls as the tube passes, so the slot is wider at the top and the core tapers.</li><li>A trapped grain or chip scores a groove that spirals as the drill sinks. Dunn reads it as a machine&#x27;s feed instead.</li><li>The core is snapped off with a wedge and thrown away, like Petrie&#x27;s core 7.</li></ol><figcaption>A schematic section of the tube-drilling method tested by experimenters, and the step where Dunn reads the groove as a machine&#x27;s feed instead. <span class="wx-src">Based on: Method after Stocks 2003 and Gorelick and Gwinnett 1983; taper values from the UCL Petrie Museum record of UC16036; Dunn&#x27;s reading after Dunn 1984. Schematic, not to scale.</span></figcaption><p class="vh">A cross-section of a granite block being drilled. Step 1 shows a copper tube on a wooden shaft, spun by a bow and pressed down by two hanging stone weights, sitting in a ring-shaped slot in the granite. Step 2 adds dry quartz sand poured into the slot and gathering under the tube&#x27;s rim, where it grinds the stone. Step 3 highlights that the slot is wider at the top than at the bottom, so the central core tapers. Step 4 draws slanting grooves round the core, forming a spiral as the drill sinks, with a note that Christopher Dunn reads the groove pitch as a machine&#x27;s feed per turn. Step 5 shows the tapered, grooved core snapped off and set aside.</p></figure><p>In 1983 Leonard Gorelick and John Gwinnett showed that the pattern of lines inside a drill hole depends heavily on the abrasive used. Over the following two decades Denys Stocks, working with Egyptian-style tools, drilled and sawed Aswan granite with copper tubes and blades fed with dry sand. He produced cores and cuts, and he measured how slow it was and how much copper was lost. His conclusion, published in 2003, was that the method works, given time, labour and a great deal of sand.</p><p>The grooves fit this picture. A grain or chip trapped between tube and stone scores a line as the tube turns, and because the tube is sinking, the line becomes a spiral. The slot is ground wider at the top the longer the tube passes through it, which is exactly why cores taper. Dunn&#x27;s feed rate assumes that the groove is the drill&#x27;s own thread; in an abrasive process it is a scratch.</p></section><section class="wsec" id="granite-drill-cores-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>An older drill than anyone expected</h3><aside class="wcall"><b>Fresh from the field</b><p>In a paper in Egypt and the Levant (2025), announced by Newcastle University in February 2026, Martin Odler and Jiří Kmošek identified a 63 mm copper-alloy rod from grave 3932 at Badari as a rotary drill of Naqada IID date, late in the 4th millennium BCE. Six coils of leather thong, the remains of the bow-string that spun it, were still wrapped round it, and its tip shows fine striations and rounding from turning. Egyptians were drilling with metal and bows more than half a millennium before Khufu.</p></aside><p>That find matters because the machine reading often implies a sudden leap. The record shows the opposite: Predynastic stone vessels drilled with crank and bow drills, Early Dynastic tube-drilled hard stone, then the granite of the 4th Dynasty. Tomb scenes of craftsmen at work show hand-turned drills weighted with stones. The skill grew over centuries, as crafts do.</p><aside class="wcall"><b>How do we know sand cuts granite?</b><p>Because people have done it and measured it. Stocks drilled granite with copper tubes and dry sand and sawed it with copper blades, recording rates, copper loss and the marks left behind. Experiments do not show which tool the Egyptians used on a given day, but they remove the claim that copper and sand could not do the work at all.</p></aside></section><section class="wsec" id="granite-drill-cores-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What time has taken</h3><p>The honest gaps are real. No Old Kingdom tube drill or long granite saw has been found in a workshop. Copper was precious and was melted down and reused, so the tools themselves are mostly gone. The heaps of spent sand that granite work must have produced have rarely been tied to particular objects, and Petrie&#x27;s cores are a handful of scraps from what must have been thousands.</p><p>So the working rate for a granite sarcophagus, or for the beams of the King&#x27;s Chamber, is reconstructed rather than recorded. Textbooks that simply say &#x27;copper and sand&#x27; can make it sound easy. It was not. It was slow, costly and organised on a scale that is itself a marvel, whatever the tools.</p><blockquote class="wpull"><p>The granite is astonishing. It does not follow that the tools were.</p></blockquote></section><section class="wsec" id="granite-drill-cores-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle it</h3><p>The cleanest test is also the simplest. Make a copper tube like the ones Petrie described, feed it with Egyptian sand, drill a core from Aswan granite, and compare it with core 7 under the same microscope and 3D scanner: groove depth, pitch, taper, surface texture. If the groove cannot be matched by any abrasive method, the machine reading gains ground. If it can, the most famous piece of evidence for lost machines becomes a record of patient hand work.</p><p>Scanning core 7 itself for embedded quartz grains or copper traces would help too, as would the excavation of an Old Kingdom hard-stone workshop. For now, the weight of evidence sits with copper, sand and a very large workforce. Corsetti is right that the stonework deserves wonder. The evidence so far points to people, not machines, as the source of it.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-use" style="--i:0"><span class="wtl-y">3,400 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Copper drill buried at Badari (Naqada IID)</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">2,560 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Granite chambers and coffer for Khufu</span></li><li class="wtl-study" style="--i:2"><span class="wtl-y">1880 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Petrie begins surveying Giza</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">1883 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Petrie publishes core 7</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">1983 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Gorelick and Gwinnett drilling tests</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">1984 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Dunn&#x27;s machining article</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2003 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Stocks publishes his experiments</span></li><li class="wtl-find" style="--i:7"><span class="wtl-y">2026 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Badari drill announced as Egypt&#x27;s oldest</span></li></ol><details class="srcs"><summary>Sources for this case (12)</summary><ol><li>Petrie, W. M. F. (1883). The Pyramids and Temples of Gizeh. Field &amp; Tuer, London.</li><li>UCL Petrie Museum of Egyptian Archaeology. UC16036: granite core from tubular drill hole, Giza (&#x27;core 7&#x27;). Online collections catalogue.</li><li>Stocks, D. A. (2003). Experiments in Egyptian Archaeology: Stoneworking Technology in Ancient Egypt. Routledge, London.</li><li>Gorelick, L. &amp; Gwinnett, A. J. (1983). Ancient Egyptian stone-drilling. Expedition 25(3). Penn Museum, Philadelphia.</li><li>Odler, M. &amp; Kmošek, J. (2025). The earliest metal drill of Naqada IID dating. Egypt and the Levant 35: 289ff. <a href="https://doi.org/10.1553/AEundL35s289" target="_blank" rel="noopener">doi:10.1553/AEundL35s289</a></li><li>Newcastle University press office (9 February 2026). Ancient Egyptian drill bit identified (news release on Odler and Kmošek 2025).</li><li>Arnold, D. (1991). Building in Egypt: Pharaonic Stone Masonry. Oxford University Press, New York.</li><li>Rademakers, F. W., Odler, M. &amp; Auenmüller, J. (2024). Copper-based metallurgy (up to 332 BCE). UCLA Encyclopedia of Egyptology.</li><li>Dunn, C. (1984). Advanced machining in ancient Egypt. Analog Science Fiction and Fact, August 1984.</li><li>Dunn, C. (1998). The Giza Power Plant: Technologies of Ancient Egypt. Bear &amp; Company, Santa Fe.</li><li>The Joe Rogan Experience #1742, Jimmy Corsetti (1 December 2021); #1928, Jimmy Corsetti and Ben van Kerkwyk (18 January 2023).</li><li>Inverse (10 January 2022). Who built the pyramids and how? The debate rages on YouTube (quotes Jimmy Corsetti).</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-granite-drill-cores" data-t="Granite Drill Cores: Lost Machines in Ancient Egypt?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Granite Drill Cores: Lost Machines in Ancient Egypt?</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-granite-drill-cores</span> (updated 28 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-temple-acoustics-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Ellora, cave 10, teaching Buddha (9841499104).jpg" data-cap="Ħal Saflieni Hypogeum, Paola, Malta, and other sites" data-big><figcaption></figcaption></figure><div class="sh-k">Chambers, Sound and Stone</div><h2 class="sh-t" id="case-temple-acoustics-st" tabindex="-1">Temples That Sing: Sound and Ancient Stone</h2><p class="sh-s">Hum in the right chamber and the stone answers. Physicists have measured the effect. Whether the builders planned it is a harder question.</p><div class="sh-v"><span class="vstamp vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div><p class="sh-claim"><b>What the stamp rates:</b> Ancient builders deliberately designed sacred spaces such as the Hypogeum, passage tombs, the King&#x27;s Chamber and Chavín&#x27;s galleries for their acoustic effects.</p></div><p class="v4-q">Did ancient builders design their sacred spaces for sound?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Some ancient rooms sing: Malta&#x27;s Hypogeum holds a low hum for 16 seconds, and Newgrange resonates at the pitch of a man&#x27;s voice.</li><li>The effects are real and well measured; the question is whether the builders meant them.</li><li>At Chavín in Peru, conch trumpets were found in galleries whose ducts carry exactly their notes.</li><li>At Stonehenge the modellers doubt acoustic design; in the King&#x27;s Chamber the resonances simply follow from the room&#x27;s size.</li><li>Intent is strong at some sites and weak at others: a mixed record.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Physics</span><span class="thr">Archaeology</span><span class="thr">Engineering</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">up to <b class="ctr-n" data-v="16" >16</b><span class="ctr-u"> seconds</span></div><div class="ctr-l">reverberation at 63 Hz in the Hypogeum, at most</div><div class="ctr-c">Till 2017</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="6" >6</b><span class="ctr-u"> chambers</span></div><div class="ctr-l">all resonating between 95 and 120 Hz</div><div class="ctr-c">Jahn et al. 1996</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="20" >20</b><span class="ctr-u"> conch trumpets</span></div><div class="ctr-l">excavated in a Chavín gallery in 2001</div><div class="ctr-c">Kolar 2013</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="0.6" data-dec="1">0.6</b><span class="ctr-u"> seconds</span></div><div class="ctr-l">reverberation inside the Stonehenge model</div><div class="ctr-c">Cox et al. 2020</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="16.4" data-dec="1">16.4</b><span class="ctr-u"> Hz</span></div><div class="ctr-l">lowest room mode of the King&#x27;s Chamber, from its length</div><div class="ctr-c">computed from Petrie 1883</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Ancient builders deliberately designed sacred spaces such as the Hypogeum, passage tombs, the King&#x27;s Chamber and Chavín&#x27;s galleries for their acoustic effects.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:50.0%" role="img" aria-label="Weight of evidence: Mixed record"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The acoustic effects themselves are well measured and genuinely striking. Intent is another matter, and the record splits by site. At Chavín, instruments found in galleries plus ducts that carry their sound make deliberate design the better reading. In painted caves the association is statistically weak but tenable. At Stonehenge the modellers doubt acoustic design, and at the Hypogeum the effects are real but inconsistent. For the King&#x27;s Chamber, the resonances follow directly from the room&#x27;s size, and nothing beyond that points to tuning.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks and site guides describe these places as tombs and temples and almost never mention sound, which quietly implies it did not matter. Measurements show that underplays the experience of being inside them. At the same time, popular accounts of &#x27;tuned&#x27; temples are far more confident than the evidence for intent. The standard account is underconfident about sound as experience and roughly right to be cautious about sound as design.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Rudimentary measurements in six Neolithic and Iron Age chambers in Britain and Ireland, including Newgrange, found that each sustained a strong resonance between 95 and 120 Hz, in the range of a man&#x27;s voice.<small>Jahn, Devereux and Ibison 1996</small></li><li>In the Oracle Room of the Ħal Saflieni Hypogeum (Malta, c. 4000–2500 BCE), Rupert Till measured primary resonances of about 41, 72 and 76 Hz and reverberation of up to 16 seconds at 63 Hz, with a bass emphasis far greater than in concert halls or cathedrals.<small>Till 2017</small></li><li>At Chavín de Huántar, Peru, twenty Strombus conch-shell trumpets (pututus) were excavated in a gallery in 2001, and measurements show that ducts linking the Lanzón Gallery to the Circular Plaza carry their 272–340 Hz tones 10–20 dB above other sound.<small>Kolar 2013</small></li><li>A 1:12 acoustic scale model of Stonehenge with 157 stones gave a reverberation time of about 0.6 seconds inside the circle, enough to strengthen voices and music played within it.<small>Cox, Fazenda and Greaney 2020</small></li><li>In five painted caves of northern Spain, Palaeolithic motifs, especially lines and dots, are statistically more likely where reverberation is moderate and the low-frequency response shows resonance; the authors call the association weak but tenable.<small>Fazenda et al. 2017</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the Hypogeum&#x27;s resonances are the ones earlier teams reported (70 and 114 Hz) or the ones Till measured (41, 72 and 76 Hz), and whether the Oracle niche was cut for its sound.</li><li>Whether the 95–120 Hz cluster in passage tombs reflects design, or simply that chambers of human scale ring at pitches a human voice can reach.</li><li>Whether 110 Hz tones affect the brain in a meaningful way: one study of 30 adults reported a shift in regional activity, but the finding has not become an established effect.</li><li>Claims of very long reverberation in the Ellora chaitya hall (reported as 15–20 seconds on The Joe Rogan Experience) have no published measurement behind them that we could find.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>The soft things that shaped sound are gone: textiles, wooden fittings, bodies, offerings, and the crowds themselves.</li><li>Many spaces were altered: Newgrange was heavily restored between 1962 and 1975, and parts of Chavín&#x27;s galleries were damaged by collapse and a 1945 mudslide.</li><li>No text survives from Neolithic Malta or Ireland describing what happened inside these chambers, so intent must be inferred from the architecture and finds alone.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>For most of the 20th century archaeology treated monuments as silent: plans, sightlines, burials, dates. From the late 1990s a small field called archaeoacoustics began measuring sound properly, and its careful practitioners (Rupert Till, Bruno Fazenda, Chris Scarre, Miriam Kolar, Trevor Cox) now accept that sound was part of how many sites were experienced. They are cautious about intent. Resonance follows from size and material, so a measured effect is not a design brief. They weigh intent case by case, and find it most likely where instruments, ducts or placement point to it, as at Chavín.</p><ul><li>Every enclosed stone space resonates; the pitch is set largely by its dimensions.</li><li>Stonehenge&#x27;s modellers do not think it was built for acoustics, though the effect was real.</li><li>Till found the Hypogeum&#x27;s niche effects &#x27;unpredictable&#x27; and inconsistent, not clearly engineered.</li><li>Chavín is the strongest case for deliberate acoustic design, because instruments and architecture fit together.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Tyler Engle, an engineer by training and electronic-music producer who runs the Bass Forge channel, argues that ancient temples were working instruments. On his reading, builders chose stone, shape and carving to produce specific sonic effects that altered the state of the people inside. On The Joe Rogan Experience in September 2026 he reportedly described an Ellora chanting hall whose reverberation lasts 15–20 seconds, and floral carvings on temple walls that match cymatic patterns and act as keys to the hall&#x27;s frequencies. Paul Devereux, who co-authored the 1996 resonance study, has long argued for sound-conscious builders; Christopher Dunn reads the King&#x27;s Chamber as a harmonic resonator.</p><ul><li>Resonances cluster in the range of the male voice across sites of different shapes.</li><li>The Hypogeum&#x27;s Oracle niche and Chavín&#x27;s ducts look like deliberate sound devices.</li><li>Stone chosen for its ring (the Preseli bluestones) suggests builders listened to rock.</li><li>Painted caves hint that sound mattered to people tens of thousands of years ago.</li></ul><div class="face-s"><b>Its strongest point</b><p>Six chambers of different shapes and sizes all rang between 95 and 120 Hz, the Hypogeum reverberates for up to 16 seconds, and Chavín&#x27;s instruments were found inside galleries built to carry their sound. Sound was plainly part of the experience.</p></div><p class="face-cr"><b>Credit</b> Tyler Engle (Bass Forge; The Joe Rogan Experience #2558, September 2026; CPAK 2026); with Paul Devereux, Christopher Dunn and John Stuart Reid</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>A published, calibrated impulse-response survey of Ellora Cave 10 and other chaitya halls, giving reverberation time by frequency.</li><li>A systematic test of many passage-tomb chambers, including unremarkable ones, to see whether their pitches cluster more tightly than size alone predicts.</li><li>Instruments, residues or wear found in place inside chambers, as with Chavín&#x27;s pututus.</li><li>Blind listening and physiological studies, replicated by independent teams, on the effect of these specific spaces on people.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">6 min read · 1,278 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Temples That Sing: Sound and Ancient Stone"><button type="button" class="wtoc-i" data-go="temple-acoustics-s1">A voice in the Oracle Room</button><button type="button" class="wtoc-i" data-go="temple-acoustics-s2">What the microphones found</button><button type="button" class="wtoc-i" data-go="temple-acoustics-s3">Why stone rooms ring</button><button type="button" class="wtoc-i" data-go="temple-acoustics-s4">Where intent looks likely</button><button type="button" class="wtoc-i" data-go="temple-acoustics-s5">The Bass Forge case</button><button type="button" class="wtoc-i" data-go="temple-acoustics-s6">The mainstream, slow but careful</button><button type="button" class="wtoc-i" data-go="temple-acoustics-s7">What time has muffled, and what would settle it</button></nav></div><section class="wsec" id="temple-acoustics-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A voice in the Oracle Room</h3><p>Beneath a street in Paola, Malta, three levels of chambers were cut into soft limestone between about 4000 and 2500 BCE. The Ħal Saflieni Hypogeum held the remains of more than 7,000 people. In its middle level is a small room with a niche in the wall, nicknamed the Oracle Room. Speak low into that niche and, visitors have reported for a century, the sound seems to swell and travel through the whole underground complex.</p><p>That experience is real, and it is measurable. The question this case weighs is the one that matters: did the people who cut the room intend it? Tyler Engle of the Bass Forge channel says yes, and says the same of temples from Egypt to India. Specialists in the young field of archaeoacoustics say: sometimes, perhaps, and it depends on the site. Keeping measured effect and intended design apart is the whole game here.</p><blockquote class="wpull"><p>Every stone room sings. The question is whether anyone chose the song.</p></blockquote></section><section class="wsec" id="temple-acoustics-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What the microphones found</h3><p>The first systematic test came in 1996. Robert Jahn, Paul Devereux and Michael Ibison took a loudspeaker and a sound meter into six chambers in Britain and Ireland, including Newgrange and two Loughcrew cairns, and swept the pitch. Each chamber sustained a strong resonance somewhere between 95 and 120 Hz, a range a man&#x27;s voice reaches easily.</p><p>In the Hypogeum, Rupert Till of the University of Huddersfield made a full survey, published in Antiquity in 2017. The Oracle Room&#x27;s main resonances sat at about 41, 72 and 76 Hz, somewhat different from the 70 and 114 Hz that an earlier team had reported. Low sounds lingered for up to 16 seconds at 63 Hz, and the balance of bass to treble was, in his words, far greater than in stone circles, concert halls or cathedrals.</p><figure class="wx wx--static" id="temple-acoustics-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Measured resonances of ancient spaces</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Measured resonances of ancient spaces"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" class="wx-svg" role="img" aria-labelledby="temple-acoustics-f2-t"><title id="temple-acoustics-f2-t">Measured and reported resonances of ancient stone spaces on a logarithmic frequency scale, compared with the range of the speaking voice</title><text x="24.0" y="24.0" class="wx-t-cap">Resonances of ancient spaces · frequency on a log scale</text><rect x="447.0" y="50" width="59.2" height="300" class="wx-accfill wx-o20"/><text x="476.6" y="44.0" class="wx-t-s wx-halo" text-anchor="middle">male speaking pitch</text><line x1="304.3" y1="50" x2="304.3" y2="350" class="wx-guide"/><text x="300.3" y="44.0" class="wx-t-s" text-anchor="end">← infrasound</text><line x1="472.4" y1="54" x2="472.4" y2="358" class="wx-hl wx-dash"/><text x="20.0" y="84.0" class="wx-t-b">King's Chamber, Giza</text><text x="20.0" y="99.0" class="wx-t-s">room modes from its size</text><line x1="236" y1="90" x2="690" y2="90" class="wx-guide"/><text x="20.0" y="144.0" class="wx-t-b">Ħal Saflieni, Malta</text><text x="20.0" y="159.0" class="wx-t-s">Oracle Room, two surveys</text><line x1="236" y1="150" x2="690" y2="150" class="wx-guide"/><text x="20.0" y="204.0" class="wx-t-b">Newgrange and others</text><text x="20.0" y="219.0" class="wx-t-s">six chambers, 1996</text><line x1="236" y1="210" x2="690" y2="210" class="wx-guide"/><text x="20.0" y="264.0" class="wx-t-b">Chavín de Huántar</text><text x="20.0" y="279.0" class="wx-t-s">pututu conch trumpets</text><line x1="236" y1="270" x2="690" y2="270" class="wx-guide"/><text x="20.0" y="320.0" class="wx-t-b">Adult speaking voice</text><text x="20.0" y="335.0" class="wx-t-s">typical ranges</text><line x1="236" y1="326" x2="690" y2="326" class="wx-guide"/><circle cx="284.8" cy="90" r="5.5" class="wx-accfill ="236.0" y1="358" x2="236.0" y2="364" class="wx-line"/><text x="236.0" y="378.0" class="wx-t-s wx-halo" text-anchor="middle">10</text><line x1="304.3" y1="358" x2="304.3" y2="364" class="wx-line"/><text x="304.3" y="378.0" class="wx-t-s wx-halo" text-anchor="middle">20</text><line x1="394.7" y1="358" x2="394.7" y2="364" class="wx-line"/><text x="394.7" y="378.0" class="wx-t-s wx-halo" text-anchor="middle">50</text><line x1="463.0" y1="358" x2="463.0" y2="364" class="wx-line"/><text x="463.0" y="378.0" class="wx-t-s wx-halo" text-anchor="middle">100</text><line x1="531.3" y1="358" x2="531.3" y2="364" class="wx-line"/><text x="531.3" y="378.0" class="wx-t-s wx-halo" text-anchor="middle">200</text><line x1="621.7" y1="358" x2="621.7" y2="364" class="wx-line"/><text x="621.7" y="378.0" class="wx-t-s wx-halo" text-anchor="middle">500</text><line x1="690.0" y1="358" x2="690.0" y2="364" class="wx-line"/><text x="690.0" y="378.0" class="wx-t-s wx-halo" text-anchor="middle">1,000</text><line x1="344.3" y1="358" x2="344.3" y2="362" class="wx-thin"/><line x1="372.7" y1="358" x2="372.7" y2="362" class="wx-thin"/><line x1="412.6" y1="358" x2="412.6" y2="362" class="wx-thin"/><line x1="427.8" y1="358" x2="427.8" y2="362" class="wx-thin"/><line x1="441.0" y1="358" x2="441.0" y2="362" class="wx-thin"/><line x1="452.6" y1="358" x2="452.6" y2="362" class="wx-thin"/><line x1="571.3" y1="358" x2="571.3" y2="362" class="wx-thin"/><line x1="599.7" y1="358" x2="599.7" y2="362" class="wx-thin"/><line x1="639.6" y1="358" x2="639.6" y2="362" class="wx-thin"/><line x1="654.8" y1="358" x2="654.8" y2="362" class="wx-thin"/><line x1="668.0" y1="358" x2="668.0" y2="362" class="wx-thin"/><line x1="679.6" y1="358" x2="679.6" y2="362" class="wx-thin"/><text x="690.0" y="398.0" class="wx-t-m" text-anchor="end">frequency, Hz</text><text x="472.4" y="398.0" class="wx-t-s wx-t-a" text-anchor="middle">accent line: 110 Hz test tone (Cook et al. 2008)</text></svg></div></div><figcaption>Where ancient rooms and instruments sit on the frequency scale, against the typical pitch of speaking voices. The 110 Hz accent line marks the tone used in one brain-activity study. <span class="wx-src">Based on: Petrie 1883 (computed modes); Danley (ProSoundWeb); Till 2017; Debertolis, Coimbra and Eneix 2015; Jahn, Devereux and Ibison 1996; Kolar 2013; Cook, Pajot and Leuchter 2008. Voice ranges are typical textbook values (Baken and Orlikoff 2000) and vary widely.</span></figcaption><p class="vh">A chart with a logarithmic frequency axis from 10 to 1,000 Hz. King&#x27;s Chamber: dots at 16.4, 29.4 and 32.7 Hz, computed from its size. Ħal Saflieni Oracle Room: dots at 41, 72 and 76 Hz from Till 2017, and rings at 70 and 114 Hz from Debertolis and colleagues 2015. Newgrange and five other chambers: a bar from 95 to 120 Hz. Chavín conch trumpets: a bar from 272 to 340 Hz, carried 10 to 20 dB louder by ducts. Speaking voice: bars for men from 85 to 155 Hz and women from 165 to 255 Hz, with a faint vertical band marking male speaking pitch across the chart. A dashed accent line marks 110 Hz and a dotted guide marks 20 Hz, the edge of infrasound.</p></figure><p>Elsewhere the numbers are gentler but still telling. A 1:12 model of Stonehenge as it stood around 2200 BCE, with 157 stones, gave about 0.6 seconds of reverberation: not a cathedral, but enough to lift a voice or drum. In a Buddhist chaitya hall at Kanheri near Mumbai, a 2022 survey found reverberation of roughly five seconds, much longer than in the monastery&#x27;s other caves.</p><aside class="wcall"><b>How do we know?</b><p>Acousticians fire a loud, sharp sound (a balloon burst, a starter pistol, or a sweeping tone) and record how the room answers at several positions. That recording, the impulse response, gives reverberation time for each frequency band and shows which pitches the room reinforces. The method is robust, but results depend on where source and microphone stand, which is one reason two teams in the Hypogeum reported different peaks.</p></aside></section><section class="wsec" id="temple-acoustics-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Why stone rooms ring</h3><p>The physics is old and simple. Sound bouncing between two parallel walls reinforces itself when a whole number of half-wavelengths fits between them. The lowest such pitch equals the speed of sound divided by twice the distance. The King&#x27;s Chamber in the Great Pyramid, 10.47 metres long according to Petrie&#x27;s survey, therefore has a lowest length mode near 16.4 Hz, below hearing. Its height and width give modes near 29 and 33 Hz.</p><figure class="wx wx--steps" id="temple-acoustics-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">Why a stone room rings</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Why a stone room rings"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" class="wx-svg" role="img" aria-labelledby="temple-acoustics-f1-t"><title id="temple-acoustics-f1-t">Why a stone room rings: the King's Chamber drawn to scale with its standing waves, and the same rule applied to a small passage-tomb chamber</title><defs><marker id="temple-acoustics-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text x="24.0" y="26.0" class="wx-t-cap">King's Chamber, Great Pyramid · long section, drawn to scale</text><text x="24.0" y="62.0" class="wx-t-m wx-st" data-s="1">Sound bouncing between parallel walls reinforces</text><text x="24.0" y="80.0" class="wx-t-m wx-st" data-s="1">itself when half a wavelength fits between them.</text><rect x="34" y="141.1" width="363.0" height="244.9" rx="3" class="wx-stone3 wx-edge"/><line x1="106.6" y1="141.1" x2="106.6" y2="185.1" class="wx-thin"/><line x1="179.2" y1="141.1" x2="179.2" y2="185.1" class="wx-thin"/><line
