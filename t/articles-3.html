 class="face-c face-m"><span class="face-k">The mainstream view</span><p>Radar and archaeology specialists reject the claim on physical grounds. Synthetic aperture radar measures echoes from the surface; in dry sand it can reach perhaps a couple of metres, and it cannot pass through a pyramid or hundreds of metres of limestone and return. Lawrence Conyers, a ground-penetrating radar specialist, called the Khafre claims a huge exaggeration. Zahi Hawass called them baseless. Sarah Parcak warned how easily satellite images can be made to show almost anything. The journal Remote Sensing retracted the team&#x27;s 2022 Khufu paper in 2026, and the authors disagreed with the decision.</p><ul><li>Radar signals at satellite wavelengths are absorbed or scattered within metres of the surface.</li><li>Any vibration method must be tested blind on known buried features before it is trusted on unknown ones.</li><li>Muon imaging, a well-tested method, has found voids at Giza, but only tens of metres across.</li><li>The known substructure of Khafre was entered in 1818 and surveyed repeatedly since.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Biondi, a remote-sensing engineer, and Malanga, a retired chemist, argue that their &#x27;SAR Doppler tomography&#x27; does not rely on radar passing through rock. Instead, they say, it reads the minute vibrations that seismic noise sets up in the ground and in the pyramid, recorded by the COSMO-SkyMed satellites, and inverts them into three-dimensional images. With Armando Mei they reported shafts, spiral paths and chambers far below Khafre. Supporters such as Dakota Pilicy argue the critics answered the press images, not the method. On JRE #2368 (August 2025), when Joe Rogan raised the scans, Michael Button said he was wary of sensational claims made with new technology, while allowing that this did not make them wrong.</p><ul><li>The method claims to use vibrations, not radar penetration, so the usual penetration objection may miss the point.</li><li>Their 2022 paper passed peer review and, they said, picked out known spaces in Khufu&#x27;s pyramid, including the area of the Big Void.</li><li>Nobody has imaged the deep bedrock beneath Giza by any other method, so there is nothing to contradict the images directly.</li><li>Muon scans have shown that Giza still holds unknown spaces.</li></ul><div class="face-s"><b>Its strongest point</b><p>The deep rock beneath Giza has never been imaged by any method, so no survey has shown that nothing is there. A new technique deserves a test, not a dismissal, and the team says its signal comes from vibrations, not from radar passing through stone.</p></div><p class="face-cr"><b>Credit</b> Filippo Biondi, Corrado Malanga and Armando Mei (the Khafre Project); discussed by Michael Button on The Joe Rogan Experience #2368</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Publication of the full Khafre data, code and uncertainty estimates, so other radar groups can reprocess them.</li><li>A blind test of the vibration method over a known deep structure, such as a mine shaft or a metro tunnel, with the answer kept secret until the images are in.</li><li>Independent deep seismic reflection or borehole surveys near the Khafre pyramid, under permit.</li><li>A formal response from the authors to the specific statistical errors identified in the 2026 retraction.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">6 min read · 1,256 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of The Khafre Scans: Pillars 600 Metres Down?"><button type="button" class="wtoc-i" data-go="khafre-radar-s1">Eight pillars in the dark</button><button type="button" class="wtoc-i" data-go="khafre-radar-s2">What we know about Khafre</button><button type="button" class="wtoc-i" data-go="khafre-radar-s3">How the scan was meant to work</button><button type="button" class="wtoc-i" data-go="khafre-radar-s4">The challengers&#x27; case</button><button type="button" class="wtoc-i" data-go="khafre-radar-s5">The critics, and a retraction</button><button type="button" class="wtoc-i" data-go="khafre-radar-s6">What real scanning has found</button><button type="button" class="wtoc-i" data-go="khafre-radar-s7">What would settle it</button></nav></div><section class="wsec" id="khafre-radar-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Eight pillars in the dark</h3><p>In March 2025, at a press conference in Italy, a small team made one of the most startling claims ever attached to the Giza pyramids. Using radar data from Italian satellites, Corrado Malanga, Filippo Biondi and the Giza researcher Armando Mei said they had found, beneath the pyramid of Khafre, eight vertical cylinders plunging about 648 m into the bedrock, wrapped in spiral paths, ending in two cube-shaped chambers reported as about 80 m on a side. Above them, they said, lay five multi-level structures joined by passages. Some reports spoke of features reaching 2 km down.</p><p>The images spread worldwide within days, and the claims came up again that August when Joe Rogan raised them with Michael Button on The Joe Rogan Experience. If true, it would be the most important archaeological discovery ever made, a buried complex several times deeper than the pyramid is tall.</p><blockquote class="wpull"><p>A 648-metre shaft beneath Khafre would reach about four and a half times deeper than the pyramid once stood tall.</p></blockquote></section><section class="wsec" id="khafre-radar-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What we know about Khafre</h3><p>Khafre&#x27;s pyramid, the second largest at Giza, was built around 2570 BCE for the son of Khufu. It stood about 143.5 m high on a base about 215 m on each side, and it still keeps a cap of its original casing. Its interior is modest: two descending passages, a small subsidiary chamber, and a burial chamber cut into the bedrock and roofed with gabled limestone slabs. Giovanni Belzoni forced his way in on 2 March 1818 and painted his name on the wall.</p><figure class="wx wx--static" id="khafre-radar-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">How deep is 648 metres?</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How deep is 648 metres?"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" class="wx-svg" role="img" aria-labelledby="khafre-radar-f1-t"><title id="khafre-radar-f1-t">Cross-section to one scale: the pyramid of Khafre, the claimed shafts 648 m deep, and the reach of radar and muon methods</title><defs><marker id="khafre-radar-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text x="24" y="24" class="wx-t-cap">Khafre, drawn to one scale · depth in metres</text><rect x="70" y="150" width="530" height="480" class="wx-stone wx-o60"/><line x1="70" y1="150" x2="600" y2="150" class="wx-line"/><line x1="70" y1="150.0" x2="600" y2="150.0" class="wx-guide"/><text x="62" y="154.0" text-anchor="end" class="wx-t-s">0 m</text><line x1="70" y1="216.0" x2="600" y2="216.0" class="wx-guide"/><text x="62" y="220.0" text-anchor="end" class="wx-t-s">100 m</text><line x1="70" y1="282.0" x2="600" y2="282.0" class="wx-guide"/><text x="62" y="286.0" text-anchor="end" class="wx-t-s">200 m</text><line x1="70" y1="348.0" x2="600" y2="348.0" class="wx-guide"/><text x="62" y="352.0" text-anchor="end" class="wx-t-s">300 m</text><line x1="70" y1="414.0" x2="600" y2="414.0" class="wx-guide"/><text x="62" y="418.0" text-anchor="end" class="wx-t-s">400 m</text><line x1="70" y1="480.0" x2="600" y2="480.0" class="wx-guide"/><text x="62" y="484.0" text-anchor="end" class="wx-t-s">500 m</text><line x1="70" y1="546.0" x2="600" y2="546.0" class="wx-guide"/><text x="62" y="550.0" text-anchor="end" class="wx-t-s">600 m</text><line x1="70" y1="612.0" x2="600" y2="612.0" class="wx-guide"/><text x="62" y="616.0" text-anchor="end" class="wx-t-s">700 m</text><polygon points="189.0,150 260,55.3 331.0,150" class="wx-sand wx-edge wx-grow" style="--d:1"/><g class="wx-o40"><polygon points="260,147 224,80 296,80" class="wx-c2 wx-pop" style="--d:4"/></g><rect x="254" y="144" width="12" height="6" class="wx-inkfill"/><line x1="230" y1="90" x2="186" y2="78" class="wx-thin"/><text x="182" y="74" text-anchor="end" class="wx-t wx-halo">Alvarez muon survey, 1960s:</text><text x="182" y="89" text-anchor="end" class="wx-t-s wx-halo">no hidden chambers in the zone seen</text><line x1="266" y1="147" x2="350" y2="128" class="wx-thin"/><text x="354" y="126" class="wx-t wx-halo">burial chamber (entered 1818)</text><text x="354" y="72" class="wx-t-b">Pyramid of Khafre</text><text x="354" y="88" class="wx-t-s">143.5 m high, 215 m wide</text><rect x="626" y="44" width="22" height="14" rx="2" class="wx-metal wx-edge"/><rect x="602" y="47" width="20" height="8" class="wx-c2 wx-edge-soft"/><rect x="652" y="47" width="20" height="8" class="wx-c2 wx-edge-soft"/><text x="637" y="78" text-anchor="middle" class="wx-t-s">radar satellite</text><path d="M630,86 L510,148" class="wx-flow wx-s2"/><line x1="480" y1="151" x2="600" y2="151" class="wx-hl"/><line x1="530" y1="153" x2="608" y2="176" class="wx-thin"/><text x="612" y="174" class="wx-t-b wx-t-a">radar reach</text><text x="612" y="189" class="wx-t-s">about 2 m into</text><text x="612" y="203" class="wx-t-s">dry sand: a hairline</text><text x="612" y="217" class="wx-t-s">at this scale</text><rect x="196" y="157.9" width="128" height="26.4" rx="3" class="wx-dash wx-s4 wx-pop" style="--d:6"/><line x1="200" y1="186.3" x2="200" y2="577.7" class="wx-dash wx-s4 wx-pop" style="--d:6"/><line x1="217" y1="186.3" x2="217" y2="577.7" class="wx-dash wx-s4 wx-pop" style="--d:7"/><line x1="234" y1="186.3" x2="234" y2="577.7" class="wx-dash wx-s4 wx-pop" style="--d:8"/><line x1="251" y1="186.3" x2="251" y2="577.7" class="wx-dash wx-s4 wx-pop" style="--d:9"/><line x1="268" y1="186.3" x2="268" y2="577.7" class="wx-dash wx-s4 wx-pop" style="--d:6"/><line x1="285" y1="186.3" x2="285" y2="577.7" class="wx-dash wx-s4 wx-pop" style="--d:7"/><line x1="302" y1="186.3" x2="302" y2="577.7" class="wx-dash wx-s4 wx-pop" style="--d:8"/><line x1="319" y1="186.3" x2="319" y2="577.7" class="wx-dash wx-s4 wx-pop" style="--d:9"/><rect x="202" y="577.7" width="52.8" height="52.8" class="wx-dash wx-s4 wx-pop" style="--d:10"/><rect x="264.8" y="577.7" width="52.8" height="52.8" class="wx-dash wx-s4 wx-pop" style="--d:10"/><line x1="330" y1="577.7" x2="580" y2="577.7" class="wx-hl"/><text x="340" y="569.7" class="wx-t-n wx-t-a">648 m</text><text x="340" y="599.7" class="wx-t wx-halo">two claimed 'cubes', c. 80 m</text><text x="340" y="615.7" class="wx-t-s wx-halo">reports of features to c. 2 km lie far below</text><text x="336" y="348.0" class="wx-t-b wx-t-a wx-halo">8 claimed shafts</text><text x="336" y="364.0" class="wx-t-s wx-halo">press conference, March 2025:</text><text x="336" y="378.0" class="wx-t-s wx-halo">no paper, data or</text><text x="336" y="392.0" class="wx-t-s wx-halo">independent check yet</text><text x="336" y="406.0" class="wx-t-s wx-halo">positions schematic</text><text x="336" y="180.4" class="wx-t-s wx-halo">5 claimed upper structures</text><rect x="546" y="150.0" width="18" height="94.7" class="wx-sand wx-edge-soft wx-grow" style="--d:2"/><rect x="546" y="244.7" width="18" height="94.7" class="wx-stone2 wx-edge-soft wx-grow" style="--d:3"/><rect x="546" y="339.4" width="18" height="94.7" class="wx-sand wx-edge-soft wx-grow" style="--d:4"/><rect x="546" y="434.1" width="18" height="94.7" class="wx-stone2 wx-edge-soft wx-grow" style="--d:5"/><rect x="546" y="528.8" width="18" height="48.9" class="wx-sand wx-edge-soft wx-grow" style="--d:6"/><text x="530" y="599.7" text-anchor="middle" class="wx-t-s"></text><text x="572" y="255.6" class="wx-t-s">each block =</text><text x="572" y="269.6" class="wx-t-s">one pyramid</text><text x="572" y="283.6" class="wx-t-s">height</text><text x="572" y="519.6" class="wx-t-b">4.5 ×</text></svg></div></div><figcaption>The pyramid of Khafre and the claimed shafts drawn to one scale, with the depth each method can actually reach. <span class="wx-src">Based on: Pyramid dimensions: Lehner 1997. Claimed features as reported from the Khafre Project press conference (Jerusalem Post 2025; Moss 2025); shaft positions are schematic. SAR reach: Moss 2025 citing radar specialists. Muon survey: Alvarez et al. 1970.</span></figcaption><p class="vh">A vertical cross-section drawn to a single scale. At the top, the pyramid of Khafre, 143.5 metres high and 215 metres wide, sits on the ground line. The known burial chamber sits near its base, with a cone showing the region Alvarez&#x27;s 1960s muon detector could see, where no hidden chambers were found. A thin band at the surface shows that satellite radar reaches at most about 2 metres into dry sand. Below the pyramid, eight dashed vertical lines marked &#x27;claimed, not verified&#x27; descend to 648 metres, ending in two dashed squares about 80 metres across. A depth scale runs from 0 to 700 metres. A dashed arrow at the bottom notes reports of features to about 2 kilometres, off the chart.</p></figure><aside class="wcall"><b>How do we know there are no hidden rooms inside?</b><p>In the late 1960s the Nobel laureate physicist Luis Alvarez placed a detector for cosmic-ray muons in Khafre&#x27;s burial chamber. Muons rain down constantly and are absorbed by stone, so a hidden room shows up as an excess of muons from one direction. His team found no unknown chambers in the part of the pyramid the detector could see. It was the first use of the technique that later found the Big Void in Khufu&#x27;s pyramid.</p></aside></section><section class="wsec" id="khafre-radar-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>How the scan was meant to work</h3><p>Synthetic aperture radar, or SAR, sends microwave pulses from a moving satellite and builds a sharp image from the echoes. It is superb for mapping ground movement of millimetres over a city. What it normally cannot do is see deep underground: the pulses are absorbed or scattered within the top metres of the ground, and in dry sand the reach is up to about two metres.</p><p>Biondi and Malanga argue that their method sidesteps this. In a 2022 paper in the journal Remote Sensing, they described &#x27;SAR Doppler tomography&#x27; of Khufu&#x27;s pyramid, using data from the COSMO-SkyMed satellites. The idea is that constant, tiny seismic vibrations make the ground and the monument shiver, that these shivers subtly change the radar echoes, and that the pattern of shivering reveals the solid and hollow parts inside. The paper reported many internal features and was cited a handful of times.</p><p>Notice what that requires. The satellites orbit hundreds of kilometres up and revisit a scene only every so often, while seismic noise at Giza shakes the ground by tiny amounts. To turn those echoes into a picture of a shaft 600 m down, the method has to pull a faint, deep signal out of noise, and then show that the signal is not the processing talking to itself. That is exactly the step outside experts have asked to see, and it is where the retraction later focused its criticism: on method and statistics.</p></section><section class="wsec" id="khafre-radar-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The challengers&#x27; case</h3><p>At their strongest, the Khafre researchers make three points. First, critics who say radar cannot pass through rock may be answering a claim the team never made, since the signal they use is the vibration, not the penetrating radar pulse. Second, their earlier paper passed peer review. Third, and most important, nobody has ever imaged the bedrock hundreds of metres beneath Giza by any other means, so there is no survey that shows the space is empty.</p><p>Writing on Graham Hancock&#x27;s website in June 2025, Dakota Pilicy argued that most critics responded to press images rather than the method, and lacked remote-sensing expertise. Michael Button, for his part, was cautious on Rogan&#x27;s show: he said he is wary of sensational claims made with new technology, while allowing that this does not make them wrong. That is a fair position, and it is the right question to ask of any new instrument: has it been tested where we already know the answer?</p><blockquote class="wpull"><p>A new instrument earns trust by finding what we already know is there, before it is believed about what we do not.</p></blockquote></section><section class="wsec" id="khafre-radar-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The critics, and a retraction</h3><p>Specialists were blunt. Lawrence Conyers of the University of Denver, a leading authority on ground-penetrating radar, called the claims &#x27;a huge exaggeration&#x27; and argued that the vibrations would be far too small for a satellite to measure. The Egyptologist Zahi Hawass called them baseless and noted that no permits had been granted for the work. The archaeologist Sarah Parcak, a pioneer of satellite archaeology, put it memorably: &#x27;I could get any satellite imagery to look almost any way I wanted with enough manipulation.&#x27;</p><aside class="wcall"><b>Fresh from the field</b><p>On 10 August 2026 Remote Sensing retracted Biondi and Malanga&#x27;s 2022 paper on Khufu&#x27;s pyramid. After an investigation prompted by a reader&#x27;s concerns, the editorial board found &#x27;serious methodological flaws and statistical errors that were deemed to undermine the scientific conclusions of the article.&#x27; The authors disagreed with the retraction. The Khafre results, based on a related approach, have still not been set out in a peer-reviewed paper.</p></aside><p>The retraction does not by itself show that nothing lies under Khafre. It does remove the one peer-reviewed foundation the method had, which means the Khafre images now stand on press statements alone.</p></section><section class="wsec" id="khafre-radar-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What real scanning has found</h3><p>It would be wrong to conclude that Giza has no secrets left. Muon imaging by the ScanPyramids project found the Big Void in Khufu&#x27;s pyramid in 2017, a space at least 30 m long above the Grand Gallery. In 2023 two independent muon teams measured a corridor behind the north face, about 9 m long and about 2 m by 2 m in section, and a camera pushed through a joint in the stones confirmed it. These finds came from independent teams, published data and a physical check.</p><p>They also show the scale of what careful work has found: rooms and corridors of metres to tens of metres, inside the monument. A complex reaching hundreds of metres into the rock would be a discovery of a wholly different kind, and would need evidence of a wholly different weight.</p><p>There is a deeper point too. Giza&#x27;s limestone, like most limestone, can hold natural cavities, and the plateau has been quarried, tunnelled and built on for more than 4,500 years. Any honest survey of the deep rock would have to tell natural voids, faults and old workings apart from anything built, which is one more reason the raw data matter.</p></section><section class="wsec" id="khafre-radar-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle it</h3><p>The path is simple, if not quick. The team could release the full data and code, so that other radar groups can reprocess the same COSMO-SkyMed scenes. The vibration method could be tested blind over something known and deep, such as a mine shaft or a metro line, with the answer withheld until the images are produced. And conventional geophysics, such as a seismic reflection survey or a borehole near the plateau, could sample the rock hundreds of metres down, with Egypt&#x27;s permission.</p><p>Until then, the pillars under Khafre remain a striking picture without a measurement behind it. The deep rock under Giza is unexplored, and that is a real gap in knowledge. It is not the same as evidence that something is there.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">2,570 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Khafre&#x27;s pyramid built</span></li><li class="wtl-find" style="--i:1"><span class="wtl-y">1818 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Belzoni enters the burial chamber</span></li><li class="wtl-study" style="--i:2"><span class="wtl-y">1970 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Alvarez muon survey finds no hidden chambers</span></li><li class="wtl-find" style="--i:3"><span class="wtl-y">2017 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Muons reveal the Big Void in Khufu</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">2022 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Biondi and Malanga SAR paper on Khufu</span></li><li class="wtl-find" style="--i:5"><span class="wtl-y">2023 CE</span><span class="wtl-k">Found</span><span class="wtl-t">North Face Corridor confirmed in Khufu</span></li><li class="wtl-event" style="--i:6"><span class="wtl-y">2025 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Khafre &#x27;shafts&#x27; announced in Italy</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2026 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Remote Sensing retracts the 2022 paper</span></li></ol><details class="srcs"><summary>Sources for this case (11)</summary><ol><li>Biondi, F. &amp; Malanga, C. (2022). Synthetic Aperture Radar Doppler Tomography Reveals Details of Undiscovered High-Resolution Internal Structure of the Great Pyramid of Giza. Remote Sensing 14(20): 5231. RETRACTED 2026. <a href="https://doi.org/10.3390/rs14205231" target="_blank" rel="noopener">doi:10.3390/rs14205231</a></li><li>Remote Sensing Editorial Office (2026). Retraction: Biondi, F.; Malanga, C. Synthetic Aperture Radar Doppler Tomography Reveals Details of Undiscovered High-Resolution Internal Structure of the Great Pyramid of Giza. Remote Sensing 18(16): 2679. <a href="https://doi.org/10.3390/rs18162679" target="_blank" rel="noopener">doi:10.3390/rs18162679</a></li><li>Alvarez, L. W. et al. (1970). Search for hidden chambers in the pyramids. Science 167(3919): 832–839. <a href="https://doi.org/10.1126/science.167.3919.832" target="_blank" rel="noopener">doi:10.1126/science.167.3919.832</a></li><li>Morishima, K. et al. (2017). Discovery of a big void in Khufu&#x27;s Pyramid by observation of cosmic-ray muons. Nature 552: 386–390. <a href="https://doi.org/10.1038/nature24647" target="_blank" rel="noopener">doi:10.1038/nature24647</a></li><li>Procureur, S., Morishima, K., Kuno, M. et al. (2023). Precise characterization of a corridor-shaped structure in Khufu&#x27;s Pyramid by observation of cosmic-ray muons. Nature Communications 14: 1144. <a href="https://doi.org/10.1038/s41467-023-36351-0" target="_blank" rel="noopener">doi:10.1038/s41467-023-36351-0</a></li><li>Moss, C. (2025). Is there really a secret city under Egypt&#x27;s Giza pyramids? National Geographic, 16 April 2025.</li><li>Jerusalem Post (2025). Researchers say they used SAR to find vast city beneath the pyramids. 23 March 2025.</li><li>Retraction Watch (2026). Journal retracts paper claiming network of corridors inside the Great Pyramid of Giza. 31 August 2026.</li><li>Pilicy, D. (2025). Tomographic Evidence Beneath the Pyramid of Khafre: Methodological Appraisal and Critical Responses. grahamhancock.com, 27 June 2025.</li><li>Lehner, M. (1997). The Complete Pyramids. Thames &amp; Hudson, London.</li><li>The Joe Rogan Experience #2368, Michael Button (August 2025); transcript published by The Singju Post.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-khafre-radar" data-t="The Khafre Scans: Pillars 600 Metres Down?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Khafre Scans: Pillars 600 Metres Down?</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-khafre-radar</span> (updated 28 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-sphinx-chambers-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Great Sphinx of Giza - 20080716a.jpg" data-cap="The Great Sphinx of Giza in its enclosure" data-big><figcaption></figcaption></figure><div class="sh-k">Chambers, Sound and Stone</div><h2 class="sh-t" id="case-sphinx-chambers-st" tabindex="-1">Chambers Under the Sphinx: A Hall of Records?</h2><p class="sh-s">A hole in its head, a tunnel in its rump, a psychic&#x27;s prophecy and a scan that saw something. What really lies under the Sphinx?</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> A hidden, man-made chamber holding the records of a lost civilisation lies beneath the Great Sphinx.</p></div><p class="v4-q">Is there a hidden chamber of records beneath the Great Sphinx?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>The Great Sphinx has several holes: a shaft in its head, a boring drilled in 1837, a tunnel in its rump and a shallow shaft near a back paw.</li><li>All the known ones have been explored; they end in rock or groundwater.</li><li>In 1933 the psychic Edgar Cayce said a Hall of Records from Atlantis lay nearby; that idea began as a reading, not an observation.</li><li>A 1991 seismic survey found a hollow under the front paws that has never been opened. A 1998 test drill elsewhere hit a natural cavity.</li><li>A small unexplored space is possible; a hall of records has no evidence yet.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Physics</span><span class="thr">Religion and myth</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="73" >73</b><span class="ctr-u"> m</span></div><div class="ctr-l">length of the Sphinx from paw to tail</div><div class="ctr-c">Lehner and Hawass 2017</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="8.2" data-dec="1">8.2</b><span class="ctr-u"> m</span></div><div class="ctr-l">depth where the 1837 boring rods stuck</div><div class="ctr-c">Vyse 1840–42</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="1998" >1,998</b><span class="ctr-u"> </span></div><div class="ctr-l">the year Cayce&#x27;s followers expected the hall to be found</div><div class="ctr-c">Cayce readings</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="5" >5</b><span class="ctr-u"> m</span></div><div class="ctr-l">depth of the rump passage&#x27;s lower branch, ending at groundwater</div><div class="ctr-c">Lehner and Hawass 2017</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>A hidden, man-made chamber holding the records of a lost civilisation lies beneath the Great Sphinx.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The idea began as a psychic reading, not an observation, and nothing found since has matched it. The Sphinx&#x27;s known cavities have all been entered and end in rock or groundwater. Scans have found anomalies, but Giza&#x27;s limestone is full of natural cavities and fissures, and the one anomaly drilled in 1998 was natural. The 1991 anomaly under the paws has not been opened, so a small unexplored space is possible. A records hall is a much bigger claim, and no trace of one has been found.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks say little about the ground beneath the Sphinx, and when they do they present &#x27;nothing there&#x27; as settled. That is broadly fair: every known hole has been explored. But the confidence rests partly on surveys and drilling that were never fully published, and on assurances from the officials who control access. Releasing the data would cost little and would turn a contested verdict into a checked one.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>The Sphinx does contain cavities: a hole in the top of the head (closed with a hatch by Émile Baraize in 1926), a boring behind the head drilled for Howard Vyse in 1837, whose rods stuck at about 8.2 m, a passage at the rump, and a shallow &#x27;keyhole&#x27; shaft opposite the northern hind paw.<small>Lehner and Hawass 2017</small></li><li>The rump passage, opened in 1926 and explored in 1980, splits into an upper branch rising about 4 m to a small niche and a lower branch dropping about 5 m to a dead end at groundwater. Mark Lehner mapped it and judged it the work of treasure hunters after the statue was carved.<small>Lehner and Hawass 2017; Hadingham 2010</small></li><li>In readings given in 1933 the American psychic Edgar Cayce described a hall or temple of records, left by refugees from Atlantis, near the Sphinx; his followers came to expect its discovery by 1998.<small>Cayce readings; Lehner 1974</small></li><li>Geophysical surveys around the Sphinx have found cavities and fissures in the bedrock. A 1978 SRI International survey reported natural fissures; a 1991 seismic survey by Thomas Dobecki recorded an anomaly under the front paws that he read as possibly man-made; a 1998 drilling in the area reached only a natural cavity.<small>Schoch 1992; Hawass and Lehner 1994</small></li><li>The Sphinx was carved from a knoll left in a quarry, and blocks cut from the ditch around it were used in the Sphinx Temple in front of it, tying statue and temple to one building project.<small>Hadingham 2010; Lehner and Hawass 2017</small></li><li>Mark Lehner, who spent five years mapping the Sphinx stone by stone, began his Egyptology with support from the Edgar Cayce Foundation.<small>Hadingham 2010</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>What the 1991 seismic anomaly in front of the paws is: a natural solution cavity, a fissure zone, an old quarry feature or a cut room.</li><li>Whether all the survey and drilling data from around the Sphinx, including the 1996–98 work funded by the Schor Foundation, have been published in a form others can re-analyse.</li><li>Whether Egypt&#x27;s tight permit system has held back legitimate exploration or has protected a fragile, eroding statue from damage.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>The Sphinx lay buried to its neck in sand for much of its history and has been patched with masonry since at least the New Kingdom, hiding or destroying early features.</li><li>Early clearances of the enclosure, by Caviglia in 1817 and Baraize in 1925–36, were poorly recorded; Baraize never published his work.</li><li>Some survey and drilling results near the Sphinx are known from books, interviews and summaries rather than full technical reports.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Egyptologists read the Sphinx as a 4th Dynasty statue carved from a bedrock knoll in a quarry, most likely for Khafre, with its temple built of blocks from the same ditch. The holes in and around it are either natural fissures in the limestone or holes cut by later explorers and repairers; none leads anywhere. Surveys found anomalies, and the one drilled proved natural. Zahi Hawass says work around the Sphinx found nothing but bedrock. Where the field earned criticism is style more than substance: early clearances were badly recorded, access is closed and slow, and results have too often reached the public as assurances rather than data.</p><ul><li>Every known cavity in the Sphinx has been entered and mapped, and ends in rock or groundwater.</li><li>Giza&#x27;s limestone is naturally riddled with fissures and solution cavities that show up on scans.</li><li>A cut room would leave traces nearby: spoil, tool marks, an entrance, sealing; none has been found.</li><li>The Hall of Records began as a psychic reading in 1933, not as an archaeological observation.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Jimmy Corsetti argues that the most important spaces at Giza have never been properly explored and that Egypt&#x27;s antiquities establishment, personified by Zahi Hawass, controls access and releases too little. On Piers Morgan&#x27;s show in May 2026 he pressed Hawass to release images from work beneath the Sphinx&#x27;s paws and pointed to footage of tunnels inside the statue; Hawass answered that they found nothing but rock and that the tunnels were dug by later treasure hunters. The idea he inherits is older: Cayce&#x27;s hall of records, and the 1991 seismic survey that registered a possible chamber under the paws.</p><ul><li>The Sphinx and its surroundings do contain passages and cavities, some still closed with modern hatches.</li><li>A professional seismic survey in 1991 registered an anomaly under the front paws, and it was never excavated.</li><li>Surveys in the 1990s ended under official pressure, and access to the Sphinx enclosure is tightly controlled.</li><li>Hawass&#x27;s assurances have often come in television and interviews rather than in full published data.</li></ul><div class="face-s"><b>Its strongest point</b><p>There are real, unexplained features: a 1991 seismic anomaly in front of the paws that no one has opened, and survey and drilling data the public has barely seen. Asking for those data to be published is a reasonable scientific demand, not a conspiracy theory.</p></div><p class="face-cr"><b>Credit</b> Jimmy Corsetti (Bright Insight; Piers Morgan Uncensored, 11 July 2025 and May 2026, opposite Zahi Hawass); Edgar Cayce (readings, 1933); Thomas Dobecki and Robert Schoch (1991 seismic survey)</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Publication of all geophysical and drilling data from around the Sphinx (1978, 1991, 1996–98 and later) for independent re-analysis.</li><li>A new high-resolution radar and seismic survey of the enclosure by an independent international team, with raw data released.</li><li>A narrow borehole or endoscope camera into the 1991 anomaly to show whether it is natural or cut.</li><li>If a cut room were found: tool marks, sealing, contents and dates that tie it to a culture older than dynastic Egypt.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,176 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Chambers Under the Sphinx: A Hall of Records?"><button type="button" class="wtoc-i" data-go="sphinx-chambers-s1">The door no one will open</button><button type="button" class="wtoc-i" data-go="sphinx-chambers-s2">What is really inside</button><button type="button" class="wtoc-i" data-go="sphinx-chambers-s3">A prophecy and a scan</button><button type="button" class="wtoc-i" data-go="sphinx-chambers-s4">The challenger&#x27;s case at its strongest</button><button type="button" class="wtoc-i" data-go="sphinx-chambers-s5">Where the evidence points</button><button type="button" class="wtoc-i" data-go="sphinx-chambers-s6">What time has hidden</button><button type="button" class="wtoc-i" data-go="sphinx-chambers-s7">What would settle it</button></nav></div><section class="wsec" id="sphinx-chambers-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The door no one will open</h3><p>Few ideas about ancient Egypt have lasted like this one. Somewhere under the Great Sphinx, the story goes, lies a sealed chamber, a hall of records left by a vanished civilisation, waiting for the right people at the right time. It has inspired novels, documentaries, a small industry of tours, and one of the sharpest confrontations of recent years.</p><p>In May 2026, on Piers Morgan&#x27;s show, the YouTuber Jimmy Corsetti of Bright Insight sat across from Zahi Hawass, Egypt&#x27;s best-known archaeologist and its former antiquities minister. Corsetti asked why images from work beneath the Sphinx&#x27;s paws had never been released, and pointed to video of tunnels inside the statue. Hawass replied that they had found nothing but rock, that the tunnels were dug by later treasure hunters, and that everything his teams discover is published. The exchange was the latest round in a campaign Corsetti has waged for years: that Giza&#x27;s most important spaces have not been explored, and that the people who control access are not telling the public enough.</p><blockquote class="wpull"><p>The Sphinx does have holes in it. The question is where they lead.</p></blockquote></section><section class="wsec" id="sphinx-chambers-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What is really inside</h3><p>Start with the facts, because they are stranger than most people know. The Sphinx, about 73 m long and 20 m high, is carved from the living rock of a quarry, and it is not solid. A hole in the top of the head was entered by a priest in the 1560s, according to a traveller&#x27;s account, and was closed with a metal hatch in 1926. Behind the head is a boring made for Howard Vyse in 1837, when his team drove iron rods into the back looking for chambers; the rods stuck at about 8.2 m.</p><figure class="wx wx--static" id="sphinx-chambers-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">The Sphinx&#x27;s known holes, to scale</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The Sphinx&#x27;s known holes, to scale"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 550" class="wx-svg" role="img" aria-labelledby="sphinx-chambers-f1-t"><title id="sphinx-chambers-f1-t">Side view of the Great Sphinx to scale showing the hole in its head, the 1837 boring, the rump passage, the keyhole shaft, the waist fissure and the reported 1991 seismic anomaly in front of the paws</title><text x="24" y="28" class="wx-t-cap">The Sphinx from the north, to scale, with its known cavities</text><rect x="16" y="360" width="688" height="60.8" class="wx-rock wx-o60"/><line x1="16" y1="398.0" x2="704" y2="398.0" class="wx-line wx-s2 wx-dash"/><text x="700" y="411.0" text-anchor="end" class="wx-t-s">groundwater, c. 5 m below the floor</text><line x1="16" y1="360" x2="704" y2="360" class="wx-line"/><polygon points="70.0,360.0 77.6,322.0 92.8,295.4 130.8,284.0 343.6,282.5 389.2,272.6 408.2,253.6 415.8,227.0 434.8,208.0 472.8,208.0 491.8,223.2 499.4,246.0 495.6,265.0 503.2,276.4 507.0,306.8 510.8,337.2 617.2,341.0 624.8,346.3 624.8,360.0" class="wx-stone2"/><polyline points="70.0,360.0 77.6,322.0 92.8,295.4 130.8,284.0 343.6,282.5 389.2,272.6 408.2,253.6 415.8,227.0 434.8,208.0 472.8,208.0 491.8,223.2 499.4,246.0 495.6,265.0 503.2,276.4 507.0,306.8 510.8,337.2 617.2,341.0 624.8,346.3 624.8,360.0" class="wx-line wx-draw" pathLength="1" style="--d:0"/><polyline points="427.2,215.6 416.6,253.6 427.2,265.0" class="wx-thin"/><polyline points="476.6,230.8 491.0,236.9" class="wx-thin"/><path d="M115.6,360.0 Q138.4,335.7 176.4,360.0" class="wx-thin"/><polyline points="298.0,283.2 302.6,303.0 296.5,322.0 301.8,341.0 298.0,360.0" class="wx-line wx-s4"/><line x1="457.6" y1="208.0" x2="457.6" y2="223.2" class="wx-bold wx-s1"/><line x1="396.8" y1="265.8" x2="396.8" y2="328.1" class="wx-bold wx-s1 wx-dash"/><polyline points="108.0,357.7 95.8,327.3" class="wx-bold wx-s1"/><rect x="92.0" y="322.0" width="7.6" height="10.8" class="wx-c1 wx-o60"/><polyline points="108.0,360.0 134.6,398.0" class="wx-bold wx-s1"/><rect x="184.0" y="360" width="10.8" height="15.2" class="wx-c1 wx-o60 wx-edge"/><rect x="518.4" y="369.1" width="76.0" height="24.3" rx="8" class="wx-accfill wx-o20"/><rect x="518.4" y="369.1" width="76.0" height="24.3" rx="8" class="wx-hl wx-pulse"/><g><circle cx="651.4" cy="348.2" r="1.9" class="wx-inkfill"/><line x1="651.4" y1="349.7" x2="651.4" y2="354.7" class="wx-line"/><line x1="651.4" y1="354.7" x2="648.9" y2="360" class="wx-line"/><line x1="651.4" y1="354.7" x2="653.9" y2="360" class="wx-line"/></g><text x="651.4" y="343.3" text-anchor="middle" class="wx-t-s">1.7 m</text><line x1="457.6" y1="208.0" x2="520" y2="74" class="wx-thin"/><text x="520" y="70" class="wx-t-b wx-halo" text-anchor="start">Hole in the head</text><text x="520" y="85" class="wx-t-s wx-halo" text-anchor="start">sealed with a hatch in 1926</text><line x1="396.8" y1="265.8" x2="290" y2="96" class="wx-thin"/><text x="290" y="92" class="wx-t-b wx-halo" text-anchor="start">1837 boring by Vyse's team</text><text x="290" y="107" class="wx-t-s wx-halo" text-anchor="start">rods stuck at c. 8.2 m</text><line x1="101.9" y1="340.2" x2="60" y2="124" class="wx-thin"/><text x="60" y="120" class="wx-t-b wx-halo" text-anchor="start">Rump passage (found 1926)</text><text x="60" y="135" class="wx-t-s wx-halo" text-anchor="start">up c. 4 m to a niche; down</text><line x1="298.0" y1="299.2" x2="230" y2="154" class="wx-thin"/><text x="230" y="150" class="wx-t-b wx-halo" text-anchor="start">Natural fissure</text><text x="230" y="165" class="wx-t-s wx-halo" text-anchor="start">cuts the body at the waist</text><text x="60" y="150" class="wx-t-s wx-halo">c. 5 m to groundwater</text><line x1="134.6" y1="398.0" x2="120" y2="478" class="wx-thin"/><text x="60" y="490" class="wx-t-s">lower branch ends at the water table</text><line x1="189.3" y1="375.2" x2="250" y2="470" class="wx-thin"/><text x="250" y="482" class="wx-t-b">"Keyhole" shaft</text><text x="250" y="497" class="wx-t-s">1.4 × 1.1 m, c. 2 m deep</text><line x1="556.4" y1="393.4" x2="560" y2="470" class="wx-thin"/><text x="700" y="482" text-anchor="end" class="wx-t-b wx-t-a">1991 seismic anomaly (reported)</text><text x="700" y="497" text-anchor="end" class="wx-t-s">position and shape schematic; never opened</text><text x="700" y="512" text-anchor="end" class="wx-t-s">1998 drilling near the Sphinx: a natural cavity</text><line x1="70" y1="436" x2="624.8" y2="436" class="wx-dim"/><line x1="70" y1="431" x2="70" y2="441" class="wx-dim"/><line x1="624.8" y1="431" x2="624.8" y2="441" class="wx-dim"/><text x="343.6" y="452" text-anchor="middle" class="wx-t-n wx-halo">73 m paw to tail</text><line x1="450.0" y1="360" x2="450.0" y2="208.0" class="wx-guide"/><text x="520.8" y="246.0" class="wx-t-n wx-halo">20 m high</text><line x1="24" y1="528" x2="100" y2="528" class="wx-bold"/><text x="108" y="532" class="wx-t-s">10 m</text><text x="700" y="28" text-anchor="end" class="wx-t-s">tail west (left), face east (right)</text></svg></div></div><figcaption>A side view of the Sphinx with every cavity that has been entered and mapped, and the one survey anomaly that never has been. <span class="wx-src">Based on: Dimensions and cavities after Lehner and Hawass 2017 and Lehner&#x27;s Sphinx mapping; boring depth after Vyse 1840–42; anomaly after Schoch 1992 (reported position, shape and size not published in detail, drawn schematically). Outline simplified.</span></figcaption><p class="vh">A side view of the Great Sphinx seen from the north, drawn to scale at 73 metres long and 20 metres high, with the tail at left and the face at right and a 1.7 metre human figure in front of the paws. Marked are a short hole in the top of the head, sealed in 1926; a boring behind the head from 1837 whose rods stuck at about 8.2 metres; the rump passage with an upper branch rising about 4 metres to a niche and a lower branch dropping about 5 metres to groundwater; a small keyhole shaft opposite the hind paw, 1.4 by 1.1 metres and about 2 metres deep; and a natural fissure through the waist. Under the front paws a highlighted, rounded box marks the 1991 seismic anomaly, drawn schematically because its shape is unknown, with a note that 1998 drilling near the Sphinx reached a natural cavity. A dashed line marks groundwater about 5 metres below the floor.</p></figure><p>At the rump, a passage found in 1926 and cleared in 1980 splits in two. One branch climbs about 4 m into the body and ends in a small niche. The other drops about 5 m into the bedrock and stops in a dead end at the water table. Opposite the northern hind paw is a shallow rectangular pit, and a natural fissure up to 2 m wide cuts through the statue&#x27;s waist, sealed by restorers with iron bars and cement. Every one of these spaces has been entered and mapped. None leads anywhere.</p></section><section class="wsec" id="sphinx-chambers-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>A prophecy and a scan</h3><p>The hall of records does not come from archaeology. In readings given in 1933, the American psychic Edgar Cayce described a hall or temple of records, left by survivors of Atlantis, near the Sphinx. His followers came to expect it to be found by 1998. There is an irony here that both sides should enjoy: the young Mark Lehner, who went on to map the Sphinx stone by stone and became one of Egypt&#x27;s leading archaeologists, began his studies in Cairo with support from the Edgar Cayce Foundation. He went looking for the hall and found a quarry.</p><p>Then came the scans. In 1978 a team from SRI International surveyed around the paws and reported natural fissures. In 1991, during Robert Schoch&#x27;s geological study of the Sphinx&#x27;s weathering, the geophysicist Thomas Dobecki ran a seismic survey and recorded an anomaly under the front paws that he interpreted as a possibly man-made cavity. From 1996 to 1998, surveys funded by the Schor Foundation with Florida State University continued the search until the authorities stopped them; a drilling in 1998 reached a cavity, and it was natural.</p><aside class="wcall"><b>How do we know what a scan means?</b><p>A seismic or radar survey sends energy into the ground and records how it comes back. A void, loose fill or cracked rock slows and scatters the waves, and shows as an anomaly. But the survey cannot tell a cut room from a natural cavity or a fissure zone. In limestone like Giza&#x27;s, full of both, only a borehole, a camera or excavation can decide.</p></aside><figure class="wx wx--steps" id="sphinx-chambers-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">What a scan can and cannot see</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="What a scan can and cannot see"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" class="wx-svg" role="img" aria-labelledby="sphinx-chambers-f2-t"><title id="sphinx-chambers-f2-t">How a seismic survey detects a cavity under rock and why a cut room, a natural solution cavity and a fissure zone look alike until someone drills, in five steps</title><defs><marker id="sphinx-chambers-f2-ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-accfill" d="M0,1 L9,5 L0,9 Z"/></marker></defs><text x="24" y="28" class="wx-t-cap">How a seismic survey finds a cavity, and why it cannot say what it is</text><rect x="24" y="90" width="672" height="210" class="wx-stone"/><line x1="24" y1="90" x2="696" y2="90" class="wx-line"/><text x="34" y="290" class="wx-t-cap">Limestone bedrock</text><rect x="54" y="60" width="30" height="12" class="wx-metal wx-edge"/><line x1="69" y1="72" x2="69" y2="88" class="wx-line"/><text x="44" y="52" class="wx-t-b">hammer source</text><polygon points="174,90 186,90 180,79" class="wx-inkfill"/><polygon points="254,90 266,90 260,79" class="wx-inkfill"/><polygon points="334,90 346,90 340,79" class="wx-inkfill"/><polygon points="414,90 426,90 420,79" class="wx-inkfill"/><polygon points="494,90 506,90 500,79" class="wx-inkfill"/><polygon points="574,90 586,90 580,79" class="wx-inkfill"/><polygon points="654,90 666,90 660,79" class="wx-inkfill"/><text x="250" y="70" text-anchor="middle" class="wx-t-s">geophones record arrival times</text><g class="wx-st" data-s="1"><polyline points="69,90 124.5,172.5 180,90" class="wx-thin"/></g><g class="wx-st" data-s="1"><polyline points="69,90 164.5,175.8 260,90" class="wx-thin"/></g><g class="wx-st" data-s="1"><polyline points="69,90 204.5,179.10 340,90" class="wx-thin"/></g><g class="wx-st" data-s="1"><polyline points="69,90 244.5,182.4 420,90" class="wx-thin"/></g><g class="wx-st" data-s="1"><polyline points="69,90 284.5,185.7 500,90" class="wx-thin"/></g><g class="wx-st" data-s="1"><polyline points="69,90 324.5,189.0 580,90" class="wx-thin"/></g><g class="wx-st" data-s="1"><polyline points="69,90 364.5,192.3 660,90" class="wx-thin"/></g><g class="wx-st wx-hide" data-only="2"><text x="360" y="250" text-anchor="middle" class="wx-t-b wx-halo">Solid rock: waves arrive on time</text><text x="360" y="266" text-anchor="middle" class="wx-t-s wx-halo">a smooth, predictable pattern</text></g><g class="wx-st wx-hide" data-s="3"><ellipse cx="470" cy="165" rx="70" ry="26" class="wx-accfill wx-o40"/><ellipse cx="470" cy="165" rx="70" ry="26" class="wx-hl wx-pulse"/><polyline points="420,160 400,190 380,176" class="wx-flow wx-s4"/><polyline points="520,160 548,188 570,172" class="wx-flow wx-s4 wx-flow-r"/><text x="560" y="228" class="wx-t-b wx-halo">Anomaly: waves slow</text><text x="560" y="244" class="wx-t-b wx-halo">and scatter here</text></g><g class="wx-st wx-hide" data-s="4"><text x="24" y="330" class="wx-t-cap">Three things that give the same signal</text><rect x="40" y="350" width="150" height="90" class="wx-card wx-edge-soft"/><rect x="80" y="372" width="70" height="36" class="wx-paper wx-edge wx-dash"/><text x="115" y="394" text-anchor="middle" class="wx-t-n">?</text><text x="115" y="430" text-anchor="middle" class="wx-t-b">a cut room</text><rect x="285" y="350" width="150" height="90" class="wx-card wx-edge-soft"/><path d="M318,392 Q326,366 356,372 Q392,366 400,388 Q390,410 360,404 Q330,414 318,392 Z" class="wx-paper wx-edge"/><text x="360" y="430" text-anchor="middle" class="wx-t-b">a solution cavity</text><rect x="530" y="350" width="150" height="90" class="wx-card wx-edge-soft"/><polyline points="580,360 596,376 588,392 604,408 598,418" class="wx-bold wx-s4"/><polyline points="620,364 628,384 622,404" class="wx-line wx-s4"/><text x="605" y="430" text-anchor="middle" class="wx-t-b">a fissure zone</text></g><g class="wx-st wx-hide" data-s="5"><line x1="470" y1="50" x2="470" y2="170" class="wx-bold wx-s1"/><rect x="462" y="38" width="16" height="12" class="wx-metal wx-edge"/><text x="490" y="46" class="wx-t-b wx-t-a">borehole or camera</text><text x="490" y="60" class="wx-t-s">1998, near the Sphinx: a natural cavity</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> A hammer blow sends seismic waves into the bedrock; geophones record when they come back.</p><ol class="wx-steplist"><li>A hammer blow sends seismic waves into the bedrock; geophones record when they come back.</li><li>In solid rock the waves arrive on time, in a smooth pattern.</li><li>A void, loose fill or cracked rock slows and scatters them: an anomaly, like the one under the paws in 1991.</li><li>But a cut room, a natural solution cavity and a fissure zone all give that kind of signal.</li><li>Only a borehole or camera can tell them apart. In 1998 a drill near the Sphinx met a natural cavity.</li></ol><figcaption>Why the anomalies around the Sphinx keep the debate alive, and why only a drill or camera can end it. <span class="wx-src">Based on: Seismic refraction principle; Giza survey history after Schoch 1992, Hawass and Lehner 1994 and later summaries. Schematic, not to scale.</span></figcaption><p class="vh">A cross-section of limestone bedrock. Step 1 shows a hammer source at the surface and a line of geophones, with wave paths running down into the rock and back up. Step 2 labels solid rock where waves arrive on time. Step 3 adds a highlighted oval zone at mid-depth where waves slow and scatter, an anomaly. Step 4 shows three panels below: a cut room with a question mark, a rounded natural solution cavity and a zone of fissures, all of which give the same kind of signal. Step 5 shows a drill descending into the anomaly, noting that a 1998 drilling near the Sphinx met a natural cavity.</p></figure></section><section class="wsec" id="sphinx-chambers-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The challenger&#x27;s case at its strongest</h3><p>Put the mysticism aside and Corsetti&#x27;s argument becomes a sensible one about evidence. A professional survey found an anomaly under the paws in 1991. It has never been opened. Later surveys were halted. Drilling results have reached the public mainly through interviews and summaries. When the man who controlled access for decades says there is nothing there, sceptics are entitled to ask to see the data rather than take his word.</p><p>He also has history on his side in a general way. Giza has kept surprising specialists: muon imaging revealed the Big Void inside the Great Pyramid in 2017 and a corridor behind its north face, confirmed in 2023. Nobody predicted either. If spaces of that size could hide in the most studied building on Earth, a small cavity under the Sphinx is not absurd.</p></section><section class="wsec" id="sphinx-chambers-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Where the evidence points</h3><p>But the leap from an unexplained anomaly to a hall of records is enormous. Giza&#x27;s limestone is naturally full of solution cavities and fissures; the Sphinx itself is split by one. The one anomaly that was drilled proved natural. A cut chamber would need an entrance, and someone would have had to remove and dump the stone; no such spoil or passage has been found in the thoroughly cleared enclosure. And the idea that the records are there at all comes from a psychic reading, not from any inscription, text or find.</p><aside class="wcall"><b>Fresh from the field</b><p>In March 2026 the radar specialist Filippo Biondi claimed that satellite radar showed a large anomaly about 50 m below ground near the Sphinx, shaped, he suggested, like a second Sphinx. Hawass called the claim lacking in empirical support, and no peer-reviewed paper has set out the data. In August 2026 the journal Remote Sensing retracted the team&#x27;s 2022 paper on Khufu&#x27;s pyramid (see the Khafre Scans case).</p></aside><p>So the fair position has two halves. There is no evidence for a hall of records. There is a real case for publishing every scan and core taken around the Sphinx, and for a modern, open survey of the anomaly under the paws.</p></section><section class="wsec" id="sphinx-chambers-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What time has hidden</h3><p>Much of what might once have told us about the Sphinx&#x27;s surroundings is gone. The statue spent long centuries buried in sand to its neck. Ancient restorers wrapped it in masonry, and Thutmose IV set his Dream Stele between its paws around 1400 BCE, perhaps after clearing it. Giovanni Caviglia dug out the chest in 1817 and Émile Baraize cleared the whole enclosure between 1925 and 1936, but Baraize never published his work. What those clearances found, moved or destroyed in the floor around the paws is known only in part.</p><blockquote class="wpull"><p>Asking to see the data is science. Assuming what the data will show is not.</p></blockquote></section><section class="wsec" id="sphinx-chambers-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle it</h3><p>This is one of the easier mysteries to close. Publish every survey and drilling record from around the Sphinx. Invite an independent team to run modern radar and seismic surveys with the raw data released. Then drop a narrow borehole or a camera into the 1991 anomaly. If it is a natural cavity, the hall of records loses its last physical foothold. If it is a cut space, it will need tool marks, contents and dates before anyone can say who made it. Either way, Corsetti&#x27;s core demand, open data and open doors, would be met, and the public would finally see what lies under the paws.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">2,550 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Sphinx carved (conventional date)</span></li><li class="wtl-use" style="--i:1"><span class="wtl-y">1,400 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Thutmose IV&#x27;s Dream Stele set between the paws</span></li><li class="wtl-study" style="--i:2"><span class="wtl-y">1837 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Vyse&#x27;s team bores into the back</span></li><li class="wtl-find" style="--i:3"><span class="wtl-y">1926 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Baraize clears the Sphinx, finds the rump passage</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">1933 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Cayce&#x27;s Hall of Records readings</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1978 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">SRI survey finds natural fissures</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">1991 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Dobecki&#x27;s seismic anomaly under the paws</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">1998 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Drilling meets a natural cavity</span></li><li class="wtl-event" style="--i:8"><span class="wtl-y">2026 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Corsetti presses Hawass on Piers Morgan</span></li></ol><details class="srcs"><summary>Sources for this case (12)</summary><ol><li>Lehner, M. &amp; Hawass, Z. (2017). Giza and the Pyramids. Thames &amp; Hudson, London.</li><li>Lehner, M. (1992). Documentation of the Sphinx. In Proceedings of the First International Symposium on the Great Sphinx, pp. 55–107. Egyptian Antiquities Organization Press, Cairo.</li><li>Hadingham, E. (2010). Uncovering secrets of the Sphinx. Smithsonian Magazine, February 2010.</li><li>Lehner, M. (1974). The Egyptian Heritage: Based on the Edgar Cayce Readings. A.R.E. Press, Virginia Beach.</li><li>Schoch, R. M. (1992). Redating the Great Sphinx of Giza. KMT: A Modern Journal of Ancient Egypt 3(2).</li><li>Hawass, Z. &amp; Lehner, M. (1994). The Sphinx: who built it, and why? Archaeology 47(5).</li><li>Vyse, H. (1840–42). Operations Carried On at the Pyramids of Gizeh in 1837. 3 vols. James Fraser, London.</li><li>Morishima, K. et al. (2017). Discovery of a big void in Khufu&#x27;s Pyramid by observation of cosmic-ray muons. Nature 552: 386–390. <a href="https://doi.org/10.1038/nature24647" target="_blank" rel="noopener">doi:10.1038/nature24647</a></li><li>Procureur, S. et al. (2023). Precise characterization of a corridor-shaped structure in Khufu&#x27;s Pyramid by observation of cosmic-ray muons. Nature Communications 14: 1144. <a href="https://doi.org/10.1038/s41467-023-36351-0" target="_blank" rel="noopener">doi:10.1038/s41467-023-36351-0</a></li><li>Colavito, J. (16 May 2026). Piers Morgan had three conspiracy theorists debate Zahi Hawass. They lost. jasoncolavito.com (account of the May 2026 broadcast).</li><li>Piers Morgan Uncensored (11 July 2025). &#x27;You can&#x27;t just drill into it!&#x27; Giza pyramids: is the truth being hidden? With Zahi Hawass, Jimmy Corsetti and Dan Richards.</li><li>Euro Weekly News (27 March 2026). Radar scans spark debate over possible second Sphinx beneath Giza plateau.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-sphinx-chambers" data-t="Chambers Under the Sphinx: A Hall of Records?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Chambers Under the Sphinx: A Hall of Records?</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-sphinx-chambers</span> (updated 28 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-osiris-shaft-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Khafre&#x27;s Pyramid at Giza (2427492641).jpg" data-cap="Osiris Shaft, beneath the causeway of Khafre, Giza plateau, Egypt" data-big><figcaption></figcaption></figure><div class="sh-k">Chambers, Sound and Stone</div><h2 class="sh-t" id="case-osiris-shaft-st" tabindex="-1">The Osiris Shaft: How Old Is Giza&#x27;s Water Tomb?</h2><p class="sh-s">Thirty metres under Khafre&#x27;s causeway, a granite coffin rests on a rock island ringed by water. Who cut it, and when?</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> The Osiris Shaft was cut long before dynastic Egypt, by an earlier culture, and was only reused by the Egyptians.</p></div><p class="v4-q">Is the Osiris Shaft far older than the dates Egyptologists give it?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Under Khafre&#x27;s causeway a shaft drops in three levels to about 30 metres below Giza.</li><li>The middle level held stone coffins, bones and amulets from around 600 BCE.</li><li>At the bottom a granite sarcophagus sits on a rock island surrounded by groundwater, dated by style to the New Kingdom.</li><li>Critics point out that objects date when a shaft was used, not when it was cut, and that little has been published.</li><li>Every find is Egyptian and a similar island tomb exists at Abydos; an older date needs radiocarbon or tool-mark evidence.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Religion and myth</span><span class="thr">Chemistry</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="30" >30</b><span class="ctr-u"> m</span></div><div class="ctr-l">approximate depth of the lowest level</div><div class="ctr-c">Hawass 2007</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="3" >3</b><span class="ctr-u"> levels</span></div><div class="ctr-l">cut one below another into the bedrock</div><div class="ctr-c">Hawass 2007</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="4" >4</b><span class="ctr-u"> pillars</span></div><div class="ctr-l">rough pillars around the island in the lowest level</div><div class="ctr-c">Hawass 2007</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="1999" >1,999</b><span class="ctr-u"> </span></div><div class="ctr-l">year the shaft was pumped out, explored and filmed live</div><div class="ctr-c">Hawass 2007</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The Osiris Shaft was cut long before dynastic Egypt, by an earlier culture, and was only reused by the Egyptians.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Corsetti&#x27;s key point is sound: objects placed in a shaft date its use, not its cutting, and the shaft has no radiometric dates. But every datable find, from Old Kingdom-style pottery to Late Period coffins, belongs to dynastic Egypt, the shaft sits under a dynastic causeway, and its island design has a securely dated Egyptian parallel at Abydos. Herodotus wrote in the 5th century BCE, when the shaft was in use. Nothing in it points to an earlier culture.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">The shaft barely appears in textbooks, and where it does its New Kingdom and Late Period dates are stated plainly. That is more confidence than the evidence supports. The dates rest on the style of objects in a robbed, flooded shaft, published in one chapter, with no radiometric dates. The conventional reading is still the best one, but the honest label is &#x27;probably&#x27;, and a full publication is overdue.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>A shaft system cut into the bedrock beneath Khafre&#x27;s causeway, between the Sphinx and Khafre&#x27;s pyramid, descends in three levels to roughly 30 m; published figures for the depth of each level differ between accounts.<small>Hawass 2007</small></li><li>The second level has side chambers holding large stone sarcophagi. Decayed human skeletons, shabti figurines, amulets and pottery were recovered there and dated on style to the 26th Dynasty (664–525 BCE).<small>Hawass 2007</small></li><li>The lowest level holds a granite sarcophagus set in a rock-cut emplacement, with four rough pillars around it and groundwater surrounding it. Hawass read it as a symbolic tomb of Osiris and dated it on style to the New Kingdom, from about 1550 BCE.<small>Hawass 2007</small></li><li>Selim Hassan&#x27;s excavations along the causeway in the 1930s recorded the shaft, then flooded. Hawass&#x27;s team pumped it out, explored it fully and opened it on live US television (Fox, 2 March 1999).<small>Hassan 1932–60; Hawass 2007</small></li><li>Egypt has a close parallel in the Osireion at Abydos, a cenotaph of Osiris built for Seti I (reigned c. 1290–1279 BCE), whose central hall of granite pillars stands on an island surrounded by a water channel.<small>Frankfort 1933</small></li><li>Herodotus, writing about 440 BCE, said Cheops made underground chambers on the pyramid hill as burial vaults &#x27;in an island&#x27;, fed by a channel from the Nile.<small>Herodotus 2.124</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>When the shaft was first cut: red pottery from the lowest level has been reported as Old Kingdom in style, while Hawass dated the lowest level to the New Kingdom and the burials above to the Late Period.</li><li>Whether the lowest level was designed as an Osiris cenotaph from the start or adapted from an older shaft, quarry or tomb.</li><li>How fully the finds were recorded and published, and whether any were lost between discovery and study.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>The shaft was robbed and flooded long before 1999; objects that might have dated its first cutting are gone.</li><li>No radiocarbon or luminescence dates from the shaft appear in the published reports.</li><li>A rock-cut room cannot be dated directly; only its tool marks, fills and contents can, and those can be younger than the room.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Egyptologists read the Osiris Shaft as a symbolic tomb of the god Osiris at Rosetau, the old name for this part of Giza, cut and used from the second millennium BCE and reused for burials in the 26th Dynasty, when interest in Old Kingdom Giza and its gods revived. Its island setting echoes the Osireion at Abydos and the myth of Osiris&#x27;s grave on a mound in the primeval waters. The weak point is publication. The main account is one chapter by Hawass, the dates rest on the style of pottery and coffins, and the public first met the shaft on a live TV special, which is not how any site should be introduced.</p><ul><li>An island tomb ringed by water fits Osiris&#x27;s mythology and has a securely dated parallel at Abydos.</li><li>Every datable object found is of Old Kingdom style or later; nothing points to an earlier culture.</li><li>Giza&#x27;s Late Period revival of the cult of &#x27;Osiris, Lord of Rosetau&#x27; fits the reuse of the shaft for burials.</li><li>Groundwater has risen and fallen at Giza over millennia, so the water need not have been designed.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Jimmy Corsetti argues that the Osiris Shaft is thousands of years older than its official dates and that the public has been told far too little about it. On Piers Morgan&#x27;s show in May 2026 he complained that for years the main public source was a 1999 TV special, and asked who had been buried there and why a merely symbolic tomb needed such labour. In a video days later he contrasted Hawass&#x27;s on-air statement that nothing had been found with Hawass&#x27;s own report, which lists skeletons and amulets, cited Herodotus&#x27;s island tomb as a much earlier witness, and suggested finds might have gone missing.</p><ul><li>Cutting three levels 30 m into bedrock and lowering a heavy granite sarcophagus to the bottom was a huge effort.</li><li>Herodotus describes an island burial chamber under the Giza hill, fed by water, which matches the lowest level.</li><li>The dates rest on the style of pottery and coffins placed in the shaft, which can be far younger than the rooms.</li><li>Hawass&#x27;s public statements and his written report do not match in emphasis.</li></ul><div class="face-s"><b>Its strongest point</b><p>Contents date use, not construction. Pottery and coffins placed in a rock-cut shaft show when it was used, and cannot by themselves tell us when the rock was first cut; no radiometric date for the cutting has been published.</p></div><p class="face-cr"><b>Credit</b> Jimmy Corsetti (Bright Insight), on Piers Morgan Uncensored (May 2026, opposite Zahi Hawass) and in a Bright Insight video of 17 May 2026; Armando Mei (Khafre Project, 2026 preprint on the shaft and radar data)</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Full publication of the 1999 excavation: plans, sections, photographs and every find with its level and context.</li><li>Radiocarbon dates on organic material from each level: bone, wood, plaster and any organic temper in mortar.</li><li>A tool-mark study of the rock-cut walls, compared with dated Old Kingdom, New Kingdom and Late Period quarrying at Giza.</li><li>Sediment and groundwater study of the lowest level to date when water first stood in it.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,153 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Osiris Shaft: How Old Is Giza&#x27;s Water Tomb?"><button type="button" class="wtoc-i" data-go="osiris-shaft-s1">An island thirty metres down</button><button type="button" class="wtoc-i" data-go="osiris-shaft-s2">Three levels into the rock</button><button type="button" class="wtoc-i" data-go="osiris-shaft-s3">The case for a far older shaft</button><button type="button" class="wtoc-i" data-go="osiris-shaft-s4">The Egyptological reading</button><button type="button" class="wtoc-i" data-go="osiris-shaft-s5">Weighing it</button><button type="button" class="wtoc-i" data-go="osiris-shaft-s6">What time and water have taken</button><button type="button" class="wtoc-i" data-go="osiris-shaft-s7">What would settle it</button></nav></div><section class="wsec" id="osiris-shaft-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>An island thirty metres down</h3><p>Walk down Khafre&#x27;s causeway from the pyramid toward the Sphinx and, about halfway, you pass over one of the strangest spaces at Giza. A shaft drops into the bedrock, then another, then another. At the bottom, some 30 m below the paving, a granite sarcophagus rests on a rock-cut island. Four rough pillars stand around it, and groundwater laps at its base. Egyptologists call it the Osiris Shaft, after the god whose grave, in myth, lay on a mound in the primeval waters.</p><p>For Jimmy Corsetti, host of the Bright Insight channel, it is also a test case for everything he believes is wrong with Egyptology. In May 2026, facing Zahi Hawass on Piers Morgan&#x27;s show, he complained that for decades most of what the public knew about the shaft came from a 1999 television special, asked who had been buried there, and asked why anyone would dig so deep for a merely symbolic tomb. His answer is that it is far older than the official dates, perhaps by thousands of years.</p><blockquote class="wpull"><p>Pottery tells you when someone used a room. It does not tell you when the room was cut.</p></blockquote></section><section class="wsec" id="osiris-shaft-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Three levels into the rock</h3><p>The shaft was known by the 1930s, when Selim Hassan&#x27;s excavations along the causeway recorded it, flooded with water. In 1999 Zahi Hawass&#x27;s team pumped it out, cleared it and, on 2 March, opened it live on the US network Fox. Hawass later described the work in a chapter published in 2007, the main scholarly account.</p><figure class="wx wx--static" id="osiris-shaft-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Three levels under the causeway</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Three levels under the causeway"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" class="wx-svg" role="img" aria-labelledby="osiris-shaft-f1-t"><title id="osiris-shaft-f1-t">Section through the Osiris Shaft under the causeway of Khafre, showing three levels descending to about 30 metres, the sarcophagi of the second level and the pillared, water-ringed lowest level</title><text x="24" y="28" class="wx-t-cap">Section through the Osiris Shaft (depths approximate)</text><rect x="16" y="96" width="688" height="442.4" class="wx-stone"/><line x1="16" y1="96" x2="704" y2="96" class="wx-line"/><rect x="150" y="82" width="480" height="14" class="wx-stone2 wx-edge"/><text x="390" y="74" text-anchor="middle" class="wx-t-b">Causeway of Khafre</text><text x="700" y="74" text-anchor="end" class="wx-t-s">to Khafre's pyramid</text><text x="24" y="74" class="wx-t-s">to the Sphinx</text><rect x="300" y="96" width="34" height="134.4" class="wx-paper wx-edge wx-grow" style="--d:1"/><rect x="300" y="194.0" width="98" height="36.4" class="wx-paper wx-edge wx-grow" style="--d:2"/><rect x="364" y="230.4" width="34" height="145.6" class="wx-paper wx-edge wx-grow" style="--d:3"/><rect x="190" y="376.0" width="370" height="42.0" class="wx-paper wx-edge wx-grow" style="--d:4"/><rect x="206" y="384.4" width="56" height="33.6" class="wx-card wx-edge-soft"/><rect x="212" y="402.6" width="44" height="15.4" class="wx-stone3 wx-edge wx-pop" style="--d:5"/><rect x="272" y="384.4" width="56" height="33.6" class="wx-card wx-edge-soft"/><rect x="278" y="402.6" width="44" height="15.4" class="wx-stone3 wx-edge wx-pop" style="--d:6"/><rect x="470" y="384.4" width="56" height="33.6" class="wx-card wx-edge-soft"/><rect x="476" y="402.6" width="44" height="15.4" class="wx-stone3 wx-edge wx-pop" style="--d:7"/><rect x="524" y="418.0" width="30" height="49.0" class="wx-paper wx-edge wx-grow" style="--d:6"/><rect x="400" y="467.0" width="260" height="56.0" class="wx-paper wx-edge wx-grow" style="--d:7"/><rect x="401" y="510.4" width="258" height="12.6" class="wx-water wx-o80"/><line x1="401" y1="510.4" x2="659" y2="510.4" class="wx-flow wx-s2"/><rect x="484" y="504.8" width="92" height="18.2" class="wx-stone2 wx-edge"/><rect x="494" y="490.8" width="72" height="14.0" class="wx-stone3 wx-edge wx-pop" style="--d:9"/><rect x="418" y="467.0" width="14" height="43.4" class="wx-stone3 wx-edge"/><rect x="456" y="467.0" width="14" height="43.4" class="wx-stone3 wx-edge"/><rect x="596" y="467.0" width="14" heig
