<script type="text/x-tpl" id="case-serpent-mound-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Serpent Mound (aerial view).jpg" data-cap="Serpent Mound, Adams County, Ohio, United States" data-big><figcaption></figcaption></figure><div class="sh-k">Sky Watchers</div><h2 class="sh-t" id="case-serpent-mound-st" tabindex="-1">Serpent Mound: How Old Is the Great Snake?</h2><p class="sh-s">A 411-metre earthen serpent swallows the summer solstice sunset. Was it laid out in the Ice Age, or by Ohio&#x27;s own farmers and mound builders?</p><div class="sh-v"><span class="vstamp vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><p class="sh-claim"><b>What the stamp rates:</b> Serpent Mound was first laid out in the Ice Age, around 12,800–13,000 years ago, as its solstice alignment and a likeness to Draco suggest.</p></div><p class="v4-q">Was Serpent Mound first laid out in the Ice Age, as its sunset alignment is said to show?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Serpent Mound in Ohio is an earthen snake 411 metres long with an egg at its jaws.</li><li>Some say it was first laid out in the Ice Age, because its head points to the summer solstice sunset.</li><li>Over 12,000 years that sunset point moves less than a degree, smaller than the error in sighting along a restored head.</li><li>Every radiocarbon date from inside and beneath it falls within the last 3,000 years.</li><li>The honest open question is 300 BCE or 1070 CE, not the Ice Age.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Astronomy</span><span class="thr">Geology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="411" >411</b><span class="ctr-u"> m</span></div><div class="ctr-l">length of the serpent along its body</div><div class="ctr-c">Ohio History Connection</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="300" >300</b><span class="ctr-u"> °</span></div><div class="ctr-l">azimuth of the summer solstice sunset line through the head</div><div class="ctr-c">Hardman and Hardman 1987</div></div><div class="ctr"><div class="ctr-v">less than <b class="ctr-n" data-v="1" >1</b><span class="ctr-u"> °</span></div><div class="ctr-l">shift in the sunset point between 1,000 and 13,000 years ago</div><div class="ctr-c">this case&#x27;s calculation</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="1400" >1,400</b><span class="ctr-u"> years</span></div><div class="ctr-l">gap between the two competing construction dates</div><div class="ctr-c">Herrmann et al. 2014; Lepper et al. 2018</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Serpent Mound was first laid out in the Ice Age, around 12,800–13,000 years ago, as its solstice alignment and a likeness to Draco suggest.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Every radiocarbon result from inside and beneath the mound, whichever camp&#x27;s reading you prefer, falls within roughly the last 3,000 years, and the earth of the mound rests on soils that formed long after the Ice Age. The solstice alignment cannot carry the date: over 12,000 years the sunset point shifts by less than a degree, smaller than the uncertainty in sighting along a restored earthen head. Draco is a Mediterranean constellation. The honest open question is Adena or Fort Ancient, not the Ice Age.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Guidebooks and signs often give Serpent Mound a single builder and date, though specialists still argue between Adena around 300 BCE and Fort Ancient around 1070 CE. That overconfidence about the culture is real and has fed claims that archaeologists are hiding something. What the textbooks get right is the range: the serpent belongs to the last three thousand years and to the ancestors of Native Americans, not to the Ice Age.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Serpent Mound is an earthen effigy about 411 m long along its body, roughly 6–7 m wide and up to about a metre high, with an oval at its open jaws and a coiled tail, on a plateau above Ohio Brush Creek.<small>Ohio History Connection; Squier and Davis 1848</small></li><li>Frederic Ward Putnam excavated and restored the mound between 1886 and 1889; the present shape is partly his reconstruction.<small>Putnam 1890</small></li><li>Radiocarbon dates from the mound disagree: charcoal from a 1991 trench gave about 1070 CE (Fort Ancient), while cores taken in 2011–2014 and modelled statistically gave first construction about 300 BCE (Adena) and repair about 1100 CE.<small>Fletcher et al. 1996; Herrmann et al. 2014</small></li><li>The head and oval line up roughly with the summer solstice sunset, and some have linked the coils to the winter solstice sunrise.<small>Hardman and Hardman 1987</small></li><li>Burial mounds near the serpent hold Adena burials and later Fort Ancient burials, and ash deposits on the plateau date to about 1041–1211 CE, so people used the site in both periods.<small>Ohio History Connection; 2011 investigations</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the Adena people built the serpent around 300 BCE and Fort Ancient people repaired it, or Fort Ancient people built it around 1070 CE on older ground.</li><li>Whether the older charcoal dates the mound, or came from soil that was already old when the mound was heaped up.</li><li>How precise the solstice alignment is, given Putnam&#x27;s restoration and the uncertainty in where to sight along a rounded earthen head.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Much of the original surface and any ritual deposits were disturbed by ploughing, erosion and the 19th-century restoration.</li><li>Few excavations have cut through the body itself; the mound is protected, so each new trench or core is rare and small.</li><li>No written or recorded oral tradition from the builders explains what the serpent meant.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Archaeologists agree the serpent was built by Native American ancestors in the last three thousand years, but not on which culture. One camp, led by the Herrmann and Romain team, argues for Adena builders around 300 BCE and a Fort Ancient repair around 1100 CE. Bradley Lepper and colleagues argue for Fort Ancient builders around 1070 CE, when serpent imagery flourished in Mississippian art, and suspect the older charcoal was already in the soil. Both readings rest on radiocarbon from inside and beneath the mound.</p><ul><li>All radiocarbon results from the mound fall within roughly the last 3,000 years; none approaches the Ice Age.</li><li>The earth of the mound lies on soils and deposits formed long after the Ice Age ended, and no Ice Age artefacts have been found on the plateau.</li><li>The sunset alignment is real but loose; it cannot separate a date 1,000 years ago from one 13,000 years ago.</li><li>Draco is a Greek and Babylonian constellation; there is no evidence Ohio&#x27;s builders saw those stars as a serpent in the same shape.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Graham Hancock sees Serpent Mound as one of a family of geometric and astronomical earthworks across the Americas that inherit a shared body of knowledge. He points to the head&#x27;s alignment with the summer solstice sunset, and argues that a small mismatch with today&#x27;s sunset could reflect the slow change in Earth&#x27;s tilt, pointing to an original layout around 12,800–13,000 years ago, later rebuilt by Adena and Fort Ancient peoples. He also discusses the idea, associated with Ross Hamilton, that the serpent mirrors the constellation Draco, and he criticises archaeologists for their changing dates.</p><ul><li>The alignment to the solstice sunset shows real astronomical intent by the builders.</li><li>Archaeologists have changed the date from Adena to Fort Ancient and back, so the question is less settled than museum labels suggest.</li><li>Sacred places are often rebuilt many times; the dated material could record repairs, not the first design.</li><li>Hancock says the Ohio History Connection refused him permission to film on the plateau in 2021 because of his views.</li></ul><div class="face-s"><b>Its strongest point</b><p>The serpent was built and rebuilt by people who watched the sky, and specialists themselves disagree by more than a thousand years about who built it and when. Hancock is right that the dating is less settled than a single museum label implies.</p></div><p class="face-cr"><b>Credit</b> Graham Hancock (America Before, 2019; Ancient Apocalypse, Netflix, 2022, episode &#x27;America&#x27;s Lost Civilization&#x27;); Ross Hamilton (The Mystery of the Serpent Mound, 2001)</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>New radiocarbon or luminescence dates on sediment from the very base of the mound at several points along the body, published with their stratigraphy.</li><li>A trench through an undisturbed section showing whether there is any construction layer older than the Adena period.</li><li>A precise survey of the head&#x27;s axis and the local horizon, published with its uncertainty, to test the alignment claims.</li><li>Any Ice Age artefact or hearth on the plateau in a sealed context beneath the mound.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,155 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Serpent Mound: How Old Is the Great Snake?"><button type="button" class="wtoc-i" data-go="serpent-mound-s1">A snake that swallows the sun</button><button type="button" class="wtoc-i" data-go="serpent-mound-s2">What the ground shows</button><button type="button" class="wtoc-i" data-go="serpent-mound-s3">Hancock&#x27;s serpent at its strongest</button><button type="button" class="wtoc-i" data-go="serpent-mound-s4">Testing the alignment</button><button type="button" class="wtoc-i" data-go="serpent-mound-s5">Draco, and where the mainstream erred</button><button type="button" class="wtoc-i" data-go="serpent-mound-s6">What would settle it</button></nav></div><section class="wsec" id="serpent-mound-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A snake that swallows the sun</h3><p>On a wooded plateau in southern Ohio, a long ridge of grassed earth coils across the ground. Walk along it and you are walking the body of a serpent some 411 m long, its tail wound in a tight spiral, its open jaws closing around a raised oval. On the evening of the summer solstice, visitors gather at the head. Around sunset the sun goes down roughly in line with the serpent&#x27;s gaze.</p><p>Serpent Mound is the largest known effigy mound in the world, and one of the most argued about. Archaeologists still disagree about who built it and when. Into that gap Graham Hancock, in his book America Before (2019) and in the Netflix series Ancient Apocalypse (2022), placed a far bolder idea: that the serpent&#x27;s design reaches back to the end of the Ice Age.</p><blockquote class="wpull"><p>The fight over Serpent Mound is real. It is just not the one most viewers think it is.</p></blockquote></section><section class="wsec" id="serpent-mound-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What the ground shows</h3><p>The mound was first surveyed by Ephraim Squier and Edwin Davis for their Ancient Monuments of the Mississippi Valley in 1848. In 1886 the Harvard archaeologist Frederic Ward Putnam, helped by a fund raised by Boston women, bought the site, excavated nearby burial mounds and restored the serpent, whose outline had been worn by ploughing. What we walk today is partly his reconstruction.</p><p>The dating is the heart of the matter. In 1991 a team including Robert Fletcher, Terry Cameron and Bradley Lepper reopened one of Putnam&#x27;s trenches and dated charcoal from the body to about 1070 CE, the Fort Ancient period. That overturned the old attribution to the Adena culture. Then in 2011–2014 Edward Herrmann, William Romain and colleagues took cores, surveyed the mound with a magnetometer and modelled seven new dates. Their result: first built around 300 BCE by Adena people, repaired around 1100 CE by Fort Ancient people.</p><figure class="wx wx--steps" id="serpent-mound-f1" data-n="4"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">The serpent, its sunset and its soil</h4></div><div  x="570" y="410" text-anchor="middle" class="wx-t-s wx-halo">first build c. 300 BCE</text><text x="570" y="356" text-anchor="middle" class="wx-t-s wx-t-a wx-halo">repair layer c. 1100 CE</text><text x="466" y="436" class="wx-t-s">old ground surface</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 4.</b> The effigy: an oval in the open jaws, a winding body about 411 m long, a coiled tail.</p><ol class="wx-steplist"><li>The effigy: an oval in the open jaws, a winding body about 411 m long, a coiled tail.</li><li>The line through the oval and head points roughly to the summer solstice sunset.</li><li>Over 12,000 years the sunset point moves by less than a degree, too little to date the mound.</li><li>Cores dated in 2014 suggest a first build c. 300 BCE and a repair c. 1100 CE; others argue for c. 1070 CE.</li></ol><figcaption>A simplified plan of Serpent Mound with the summer solstice line through its head, how little that line moves over 12,000 years, and an idealised section of the two-stage build reported in 2014. <span class="wx-src">Based on: Outline simplified and not surveyed, scaled to the published 411 m length after Squier and Davis 1848 and the Ohio History Connection; alignment after Hardman and Hardman 1987; sunset shift calculated for latitude 39.03 degrees north; section idealised from Herrmann et al. 2014.</span></figcaption><p class="vh">A simplified plan, north up, of an earthen serpent about 411 metres long winding south from its head, with an oval about 37 metres long in its open jaws at the north end and a coiled tail at the south end, with a 50 metre scale bar. Step 2 draws a line from the oval towards the summer solstice sunset at an azimuth of about 300 degrees. Step 3 draws two lines for the sunset 1,000 and 13,000 years ago, less than one degree apart and nearly overlapping. Step 4 adds an idealised cross-section of the body: a first build around 300 BCE with a repair layer on top around 1100 CE, on the old ground surface.</p></figure><p>Lepper and colleagues replied in 2018 that the older dates came from organic sediment in soil cores, material that can be far older than the earth heaped over it, and that serpent imagery fits the Fort Ancient world of the 11th century. The argument continues in print. Both sides, though, are arguing over a window of about 1,400 years, all within the last three millennia.</p></section><section class="wsec" id="serpent-mound-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Hancock&#x27;s serpent at its strongest</h3><p>Hancock places Serpent Mound in a wider pattern. In America Before he links it with the great geometric earthworks of Ohio, such as Newark and High Bank, and with the enclosures of the Amazon, and argues that all of them show &#x27;sophisticated geometrical and astronomical skills&#x27;, in the words of his own book description, inherited from a much earlier civilisation.</p><p>His astronomical point starts from accepted work. In 1987 the researchers C. and M. H. Hardman reported that the line through the oval and the head points to the summer solstice sunset. In Ancient Apocalypse Hancock suggested that a small mismatch between that line and today&#x27;s sunset might record an older sky, since the tilt of Earth&#x27;s axis changes slowly, and that the design could go back some 12,800–13,000 years, with Adena and Fort Ancient peoples rebuilding a far older sacred place. He also discusses Ross Hamilton&#x27;s idea that the serpent mirrors the constellation Draco, whose star Thuban was the pole star around 2800 BCE.</p><p>Hancock adds that the experts have changed their minds twice in thirty years, and says that the Ohio History Connection refused him permission to film on the plateau in 2021 because his views differ from those of mainstream archaeology. For many viewers, that refusal did more for his case than any argument.</p></section><section class="wsec" id="serpent-mound-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Testing the alignment</h3><p>The sunset alignment is worth taking seriously, and it can be tested with arithmetic. The point on the horizon where the solstice sun sets depends on the latitude, the height of the horizon and the tilt of Earth&#x27;s axis. That tilt does change: it reached about 24.2 degrees roughly 10,000 years ago and is about 23.4 degrees now. At Serpent Mound&#x27;s latitude, that change moves the sunset point by less than one degree between 1,000 and 13,000 years ago.</p><figure class="wx wx--static" id="serpent-mound-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">Dates proposed for the serpent</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Dates proposed for the serpent"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" class="wx-svg" role="img" aria-labelledby="serpent-mound-f2-t"><title id="serpent-mound-f2-t">Dates proposed for Serpent Mound, from an Ice Age reading to the radiocarbon results</title><text x="24" y="28" class="wx-t-cap">When was Serpent Mound built? Proposed dates</text><rect x="206" y="56" width="80" height="274" class="wx-ice wx-o60"/><rect x="316" y="56" width="374" height="274" class="wx-card"/><line x1="246.0" y1="330" x2="246.0" y2="335" class="wx-line"/><text x="246.0" y="350" text-anchor="middle" class="wx-t-s">11,000 BCE</text><line x1="378.3" y1="56" x2="378.3" y2="330" class="wx-guide"/><line x1="378.3" y1="330" x2="378.3" y2="335" class="wx-line"/><text x="378.3" y="350" text-anchor="middle" class="wx-t-s">1000 BCE</text><line x1="482.2" y1="56" x2="482.2" y2="330" class="wx-guide"/><line x1="482.2" y1="330" x2="482.2" y2="335" class="wx-line"/><text x="482.2" y="350" text-anchor="middle" class="wx-t-s">1 CE</text><line x1="586.1" y1="56" x2="586.1" y2="330" class="wx-guide"/><line x1="586.1" y1="330" x2="586.1" y2="335" class="wx-line"/><text x="586.1" y="350" text-anchor="middle" class="wx-t-s">1000 CE</text><line x1="690.0" y1="56" x2="690.0" y2="330" class="wx-guide"/><line x1="690.0" y1="330" x2="690.0" y2="335" class="wx-line"/><text x="690.0" y="350" text-anchor="middle" class="wx-t-s">2000</text><line x1="206" y1="330" x2="286" y2="330" class="wx-line"/><line x1="316" y1="330" x2="690" y2="330" class="wx-line"/><text x="301.0" y="334" text-anchor="middle" class="wx-t-b">//</text><text x="24" y="82" class="wx-t">Ice Age reading</text><rect x="232.7" y="71" width="26.7" height="14" rx="3" class="wx-accfill wx-o20"/><rect x="232.7" y="71" width="26.7" height="14" rx="3" class="wx-dash"/><text x="265.3" y="82" class="wx-t-s wx-halo">Hancock</text><text x="24" y="120" class="wx-t">Adena culture</text><rect x="399.1" y="109" width="93.5" height="14" rx="3" class="wx-stone2 wx-edge wx-growx" style="--d:2"/><text x="24" y="158" class="wx-t">Fort Ancient culture</text><rect x="586.1" y="147" width="67.5" height="14" rx="3" class="wx-stone2 wx-edge wx-growx" style="--d:4"/><text x="24" y="196" class="wx-t">Charcoal in 1991 trench</text><circle cx="593.4" cy="192" r="6" class="wx-num wx-pop" style="--d:6"/><text x="24" y="234" class="wx-t">2014 study, built</text><circle cx="451.1" cy="230" r="6" class="wx-num wx-pop" style="--d:8"/><text x="24" y="272" class="wx-t">2014 study, repaired</text><circle cx="596.5" cy="268" r="6" class="wx-num wx-pop" style="--d:10"/><text x="24" y="310" class="wx-t">Putnam restores it</text><circle cx="678.3" cy="306" r="6" class="wx-inkfill wx-pop" style="--d:12"/><text x="24" y="376" class="wx-t-s">Lepper and colleagues argue the older charcoal came from soil that predates the mound,</text><text x="24" y="392" class="wx-t-s">and favour a Fort Ancient build around 1070 CE.</text><text x="24" y="412" class="wx-t-b">Either way, every radiocarbon result falls within roughly the last 3,000 years.</text></svg></div></div><figcaption>The two archaeological readings differ by about 1,400 years, but both sit in the last three millennia; the Ice Age reading lies some 10,000 years earlier, with no dated material. <span class="wx-src">Based on: Fletcher et al. 1996; Herrmann et al. 2014; Lepper et al. 2018; culture spans approximate, after the Ohio History Connection; Ice Age reading after Hancock 2019 and Ancient Apocalypse (2022).</span></figcaption><p class="vh">A timeline chart with a broken axis. A small left panel around 11,000 BCE shows a dashed, proposed bar for Hancock&#x27;s Ice Age reading. The main panel from 1600 BCE to 2000 CE shows the Adena culture from about 800 BCE to 100 CE and the Fort Ancient culture from about 1000 to 1650 CE as bars, and points for charcoal from a 1991 trench at about 1070 CE, the 2014 study&#x27;s first construction at about 300 BCE and repair at about 1100 CE, and Putnam&#x27;s restoration in 1887. A note explains that Lepper and colleagues favour a Fort Ancient build, and that every radiocarbon result falls within roughly the last 3,000 years.</p></figure><p>One degree is less than the uncertainty in sighting along a rounded, restored earthen head several metres wide, and less than the effect of the wooded hills across Ohio Brush Creek. In 2025 Robert Cook and Bradley Lepper reported that a survey gave the alignment as about 300 degrees 5 minutes, which in their reading fits a date around 1,000 years ago, not the roughly 302 degrees Hancock&#x27;s argument needs. Whichever figure is right, the alignment shows that the builders cared about the solstice. It cannot tell us which millennium they lived in.</p><aside class="wcall"><b>How do we know the mound&#x27;s age?</b><p>Radiocarbon dates the death of the plant that became the charcoal or organic matter, not the moment the earth was piled up. So archaeologists look for material sealed at the base of the mound or on the old ground surface beneath it. An Ice Age mound would need Ice Age material at its base. Every sample taken so far, in both camps&#x27; studies, falls within roughly the last 3,000 years.</p></aside></section><section class="wsec" id="serpent-mound-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Draco, and where the mainstream erred</h3><p>The Draco comparison has a deeper problem. Constellations are cultural shapes. Draco, the dragon coiled around the northern pole, is the Greek form of an older Babylonian figure. There is no evidence that the peoples of the Ohio Valley grouped those stars the same way. Serpents do fill Native American art and story, from the horned serpents of the Great Lakes to the Mississippian serpent of the Beneath World, which Lepper proposes as the mound&#x27;s meaning; a serpent does not need Draco to explain it.</p><p>The mainstream has its own history to own. In the 19th century many Americans insisted the mounds were built by a vanished race rather than by Native Americans, a myth that served land seizure until Cyrus Thomas&#x27;s survey for the Smithsonian in 1894 showed otherwise. Critics hear echoes of that myth in lost civilisation stories; Hancock rejects any racial reading. And archaeologists did flip the serpent&#x27;s date twice. Their disagreement is a sign of real uncertainty, which Hancock is right to point out, even if his alternative does not fit the evidence.</p><blockquote class="wpull"><p>The serpent&#x27;s age is argued over a window of 1,400 years. The Ice Age lies 10,000 years beyond it.</p></blockquote></section><section class="wsec" id="serpent-mound-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What would settle it</h3><p>The Adena versus Fort Ancient question could be settled by new dates on material firmly sealed at the base of the body at several points, published with detailed section drawings, and by a careful survey of the head and horizon. The Ice Age idea would need something no study has found: a construction layer, hearth or artefact from before about 11,000 years ago beneath the serpent.</p><p>Until then, Serpent Mound belongs where both camps place it: in the long, inventive history of the peoples of the Ohio Valley, who watched the solstice sun and shaped the earth to meet it. That story is old and strange enough. For the wider debate on when people reached the Americas, see the First Americans case; for Amazonian earthworks, see Amazon Garden Cities.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">300 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">First construction, in the Adena reading</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">1070 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Construction, in the Fort Ancient reading</span></li><li class="wtl-study" style="--i:2"><span class="wtl-y">1848 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Squier and Davis publish the first survey</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">1887 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Putnam excavates and restores it</span></li><li class="wtl-find" style="--i:4"><span class="wtl-y">1991 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Trench charcoal dated to c. 1070 CE</span></li><li class="wtl-find" style="--i:5"><span class="wtl-y">2014 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Cores give c. 300 BCE, repair c. 1100 CE</span></li><li class="wtl-event" style="--i:6"><span class="wtl-y">2019 CE</span><span class="wtl-k">Event</span><span class="wtl-t">America Before proposes an Ice Age layout</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2025 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Cook and Lepper test the alignment claim</span></li></ol><details class="srcs"><summary>Sources for this case (12)</summary><ol><li>Herrmann, E. W., Monaghan, G. W., Romain, W. F., Schilling, T. M., Burks, J., Leone, K. L., Purtill, M. P. &amp; Tonetti, A. C. (2014). A new multistage construction chronology for the Great Serpent Mound, USA. Journal of Archaeological Science 50: 117–125. <a href="https://doi.org/10.1016/j.jas.2014.07.004" target="_blank" rel="noopener">doi:10.1016/j.jas.2014.07.004</a></li><li>Fletcher, R. V., Cameron, T. L., Lepper, B. T. et al. (1996). Serpent Mound: a Fort Ancient icon? Midcontinental Journal of Archaeology 21(1).</li><li>Lepper, B. T. et al. (2018). Arguments for the age of Serpent Mound. Cambridge Archaeological Journal 28(3): 433–450. <a href="https://doi.org/10.1017/S095977431800001X" target="_blank" rel="noopener">doi:10.1017/S095977431800001X</a></li><li>Romain, W. F., Herrmann, E. W., Monaghan, G. W. &amp; Burks, J. (2017). Radiocarbon dates reveal Serpent Mound is more than two thousand years old. Midcontinental Journal of Archaeology 42(3): 201–222.</li><li>Cook, R. A. &amp; Lepper, B. T. (2025). Uncoiling Serpent Mound&#x27;s &#x27;slithery vibe&#x27;: refuting modern manifestations of the Moundbuilder myth. Journal of Ohio Archaeology 11.</li><li>Hardman, C. &amp; Hardman, M. H. (1987). The Great Serpent and the Sun. Ohio Archaeologist 37(3): 34–40.</li><li>Squier, E. G. &amp; Davis, E. H. (1848). Ancient Monuments of the Mississippi Valley. Smithsonian Contributions to Knowledge 1. Smithsonian Institution, Washington.</li><li>Putnam, F. W. (1890). The Serpent Mound of Ohio. The Century Magazine 39.</li><li>Thomas, C. (1894). Report on the Mound Explorations of the Bureau of Ethnology. Twelfth Annual Report of the Bureau of Ethnology. Smithsonian Institution, Washington.</li><li>Hancock, G. (2019). America Before: The Key to Earth&#x27;s Lost Civilization. St. Martin&#x27;s Press, New York; book description at grahamhancock.com.</li><li>Ancient Apocalypse (2022). Season 1, episode 6, &#x27;America&#x27;s Lost Civilization&#x27;. Netflix.</li><li>Hamilton, R. (2001). The Mystery of the Serpent Mound: In Search of the Alphabet of the Gods. Frog Books, Berkeley.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-serpent-mound" data-t="Serpent Mound: How Old Is the Great Snake?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Serpent Mound: How Old Is the Great Snake?</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-serpent-mound</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-great-year-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Dendera zodiac, Louvre.jpg" data-cap="Rhodes and Alexandria (Hipparchus and Ptolemy); Greece, India, Mesopotamia, Scandinavia" data-big><figcaption></figcaption></figure><div class="sh-k">Sky Watchers</div><h2 class="sh-t" id="case-great-year-st" tabindex="-1">The Great Year: Did Myths Remember the Turning Sky?</h2><p class="sh-s">The sky turns once every 25,772 years. Did people who left no textbooks notice, and hide it in their myths of golden and iron ages?</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> Myths and monuments older than Hipparchus deliberately encode knowledge of the precession of the equinoxes.</p></div><p class="v4-q">Do ancient myths encode knowledge of precession far older than Hipparchus?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Earth&#x27;s axis wobbles like a slowing top, so the stars drift: one full circle in about 25,772 years.</li><li>The first recorded measurement is by Hipparchus around 130 BCE.</li><li>Some argue that myths and monuments far older secretly encode the number.</li><li>No text before Hipparchus describes the drift, and the Babylonians, who watched the sky for centuries, show no sign of knowing it.</li><li>The famous numbers arise just as easily from calendar arithmetic; the idea waits for a dated record.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Astronomy</span><span class="thr">Mathematics</span><span class="thr">Texts and scripts</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="25772" >25,772</b><span class="ctr-u"> years</span></div><div class="ctr-l">one full precession circle</div><div class="ctr-c">modern value</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="71.6" data-dec="1">71.6</b><span class="ctr-u"> years</span></div><div class="ctr-l">for the sky to drift by 1°</div><div class="ctr-c">modern value</div></div><div class="ctr"><div class="ctr-v">up to <b class="ctr-n" data-v="36000" >36,000</b><span class="ctr-u"> years</span></div><div class="ctr-l">Hipparchus&#x27;s upper estimate for the circle</div><div class="ctr-c">Almagest VII.2</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="432000" >432,000</b><span class="ctr-u"> years</span></div><div class="ctr-l">length of the Kali Yuga</div><div class="ctr-c">Puranas; Surya Siddhanta</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Myths and monuments older than Hipparchus deliberately encode knowledge of the precession of the equinoxes.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Precession is real, measurable by eye over generations, and plausibly noticed before 130 BCE. But noticing is not the claim. No text before Hipparchus describes it, and Babylonian records, the richest ancient archive of the sky, show no knowledge of it. The famous numbers arise just as easily from base-60 and calendar arithmetic, and the myth readings of Hamlet&#x27;s Mill depend on choices made after the fact. Sweatman&#x27;s Göbekli Tepe reading is published but disputed by the excavators. The idea remains open, waiting for a dated record.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks state flatly that Hipparchus discovered precession. That is fair for the first recorded measurement, which survives with its data. It is less fair as a claim that nobody earlier noticed anything, since the drift is visible to patient watchers and most early sky-lore is lost. The textbooks are slightly overconfident about firsts; the challengers are much more overconfident about codes.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Earth&#x27;s axis wobbles like a slowing top, so the pole of the sky and the equinox points drift against the stars: about 1° every 71.6 years, one full circle in about 25,772 years.<small>modern astronomical value</small></li><li>The first recorded measurement of this drift is by Hipparchus around 130 BCE, who compared his star positions with those of Timocharis and estimated at least 1° per century; Ptolemy later adopted 1° per century.<small>Ptolemy, Almagest VII.2 (trans. Toomer 1984)</small></li><li>Stories of declining world ages are old and widespread: Hesiod&#x27;s five races from gold to iron (c. 700 BCE) and the Indian yugas, whose shortest, the Kali Yuga, lasts 432,000 years in the Puranas and the Surya Siddhanta.<small>Hesiod, Works and Days 106–201; Yuga literature</small></li><li>The number 432,000 recurs outside India: the Babylonian priest Berossus gave 120 sars (432,000 years) for the kings before the flood, and the Norse Grímnismál gives Valhalla 540 doors with 800 warriors each.<small>Berossus fragments; Grímnismál 23</small></li><li>Precession, combined with Earth&#x27;s changing orbit, really does pace long climate cycles: deep-sea cores show rhythms of about 23,000 and 19,000 years alongside 41,000 and 100,000 years.<small>Hays, Imbrie and Shackleton 1976</small></li><li>No surviving text older than Hipparchus describes precession, and the claim that the Babylonian astronomer Kidinnu discovered it was rejected by Otto Neugebauer in 1950.<small>Neugebauer 1950</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether myths of a cosmic mill, a whirlpool or a tilted world-tree, read by de Santillana and von Dechend in Hamlet&#x27;s Mill, describe the precessing sky or something else entirely.</li><li>Whether the carvings on Göbekli Tepe&#x27;s Pillar 43 record star positions that let their makers date an event using precession, as Martin Sweatman argues.</li><li>Whether numbers such as 72, 2,160 and 432,000 in myths are precessional or simply round numbers of base-60 and calendar arithmetic.</li><li>Whether the Roman Mithras bull-slaying scene encodes precession (David Ulansey), a reading that would place such myth-making after Hipparchus, not before.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Oral traditions of the millennia before writing are almost entirely lost, so any sky-lore older than about 3000 BCE survives only in later retellings.</li><li>Few Egyptian astronomical papyri survive, and much Greek and Babylonian astronomical writing is known only through quotations.</li><li>Monuments that might once have tracked a drifting star have often been rebuilt, reoriented or ruined, blurring their original alignments.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Historians of astronomy credit Hipparchus with discovering precession because his reasoning survives in Ptolemy&#x27;s Almagest, built on dated measurements. Babylonian astronomy, superbly recorded on clay, shows no sign of it. Myths of ages are read as moral and cosmological stories about decline, not as coded astronomy, and big mythic numbers as expansions of calendar and base-60 arithmetic. Reviewers savaged Hamlet&#x27;s Mill: Edmund Leach called its unified archaic system pure fantasy. Specialists have, though, been slow to credit how much careful naked-eye sky-watching preliterate people did.</p><ul><li>The precessional rate needed to fit 72, 2,160 or 25,920 is chosen after the fact; Hipparchus himself thought the circle took at least 36,000 years.</li><li>432,000 falls out of base-60 counting (120 sars of 3,600) and the Indian 4:3:2:1 scheme of yugas with 360-day &#x27;divine years&#x27;.</li><li>Myths of mills and whirlpools can be matched to almost any theory when read across dozens of cultures without dating each source.</li><li>The Sumerian King List totals 241,200 years before the flood, not 432,000, so the numbers are not one shared code.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Tyler Engle presents history as cyclical, turning through ages from gold to iron within a Great Year, a view he discussed on Kyle Kingsbury&#x27;s podcast in 2025. The scholarly root of the idea is Hamlet&#x27;s Mill (1969), in which the MIT historian of science Giorgio de Santillana and the Frankfurt historian Hertha von Dechend argued that a Neolithic or older culture discovered precession and encoded it in myths of a great mill whose axle breaks. Graham Hancock popularised its numbers, and Robert Bauval dated the Giza layout by precession to about 10,500 BCE. Martin Sweatman argues that Göbekli Tepe&#x27;s carvings used precession to record a date around 10,850 BCE.</p><ul><li>Precession moves the sky about a day&#x27;s worth of solar travel every 70 or so years, enough for generations of careful watchers to notice that old star risings no longer matched the seasons.</li><li>Myths of a turning mill, a broken axle and a world that tilts are strikingly similar in cultures far apart.</li><li>Numbers close to precessional values (72, 2,160, 25,920, 432,000) recur in Indian, Babylonian and Norse sources.</li><li>Many of the same cultures also told of world ages that rise and fall, as if time itself turned on a wheel.</li></ul><div class="face-s"><b>Its strongest point</b><p>Precession is observable without instruments over a few human generations, and people who aligned monuments to star risings would have seen those alignments slowly fail. It would be surprising if nobody before Hipparchus noticed; the question is whether anyone recorded it.</p></div><p class="face-cr"><b>Credit</b> Tyler Engle (Bass Forge), Kyle Kingsbury Podcast #421 (September 2025); Giorgio de Santillana and Hertha von Dechend (Hamlet&#x27;s Mill, 1969); Graham Hancock (Fingerprints of the Gods, 1995); Robert Bauval; Martin Sweatman</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>A cuneiform tablet, papyrus or inscription older than Hipparchus that states the equinoxes or the pole drift against the stars.</li><li>A dated series of temples or tombs re-aligned step by step to follow one star as precession moved it, with each phase independently dated.</li><li>A blind test of the Hamlet&#x27;s Mill method: would the same reading find &#x27;precession&#x27; in myths chosen at random or known to be later than Hipparchus?</li><li>Radiocarbon dates tied directly to the carving of Göbekli Tepe&#x27;s Pillar 43, tested against the date Sweatman&#x27;s star reading predicts.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,150 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Great Year: Did Myths Remember the Turning Sky?"><button type="button" class="wtoc-i" data-go="great-year-s1">The sky is turning</button><button type="button" class="wtoc-i" data-go="great-year-s2">What Hipparchus saw</button><button type="button" class="wtoc-i" data-go="great-year-s3">Ages of gold and iron</button><button type="button" class="wtoc-i" data-go="great-year-s4">Hamlet&#x27;s Mill and its heirs</button><button type="button" class="wtoc-i" data-go="great-year-s5">The critics and the numbers</button><button type="button" class="wtoc-i" data-go="great-year-s6">What time has hidden</button><button type="button" class="wtoc-i" data-go="great-year-s7">Cycles without a clock</button></nav></div><section class="wsec" id="great-year-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The sky is turning</h3><p>Watch the stars wheel around the pole on a clear night and they seem fixed forever. They are not. Earth&#x27;s axis wobbles like a slowing top, and the point in the sky it aims at traces a great circle, one lap in about 25,772 years. Five thousand years ago the pole star was not Polaris but Thuban, in the Dragon. Fourteen thousand years ago it was near brilliant Vega.</p><p>Tyler Engle, the engineer and musician behind Bass Forge, builds on this slow turning. On Kyle Kingsbury&#x27;s podcast in September 2025 he described history as cyclical, moving through ages from gold to iron within a Great Year. It is an old idea with a thrilling modern form: that ancient people knew the sky&#x27;s slow wheel, far earlier than the textbooks allow, and wove it into their myths. Is there a record of it?</p><blockquote class="wpull"><p>The drift is real and visible to patient eyes. The question is whether anyone before Hipparchus wrote it down, in words or in myth.</p></blockquote></section><section class="wsec" id="great-year-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What Hipparchus saw</h3><p>Around 130 BCE the Greek astronomer Hipparchus compared his own star positions, including that of Spica, with those measured by Timocharis about 160 years earlier. The stars had shifted about 2° relative to the equinox. He concluded that the equinoxes slide backwards along the zodiac by at least 1° per century. His book is lost, but Ptolemy quotes his reasoning in the Almagest, and it is the first recorded measurement.</p><p>The modern rate is a little faster, about 1° every 71.6 years, roughly two Moon-widths in a human lifetime. That is slow, but not invisible. A star that rose with the Sun on the spring equinox would, after 700 years, rise about ten days later in the season. Anyone who kept star calendars or aligned buildings on star risings for many generations could in principle notice.</p><figure class="wx wx--static" id="great-year-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">One lap of the pole: the Great Year</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="One lap of the pole: the Great Year"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" class="wx-svg" role="img" aria-labelledby="great-year-f1-t"><title id="great-year-f1-t">The circle traced by the north celestial pole over one precession cycle of about 25,772 years, with the pole stars and dates of key moments in history</title><defs><marker id="great-year-f1-ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,1 L9,5 L0,9 Z"/></marker></defs><text x="24" y="28" class="wx-t-cap">Where the north pole of the sky points, over one great year</text><circle cx="250" cy="300" r="234" class="wx-sky"/><circle cx="250" cy="300" r="200" class="wx-line wx-draw" pathLength="1" style="--d:1"/><line x1="250.0" y1="105.0" x2="250.0" y2="95.0" class="wx-thin"/><line x1="297.1" y1="110.8" x2="299.5" y2="101.1" class="wx-thin"/><line x1="341.4" y1="127.7" x2="346.0" y2="118.9" class="wx-thin"/><line x1="380.2" y1="154.9" x2="386.9" y2="147.4" class="wx-thin"/><line x1="411.4" y1="190.6" x2="419.7" y2="185.0" class="wx-thin"/><line x1="433.1" y1="232.8" x2="442.4" y2="229.4" class="wx-thin"/><line x1="443.9" y1="279.0" x2="453.8" y2="277.9" class="wx-thin"/><line x1="443.2" y1="326.4" x2="453.1" y2="327.8" class="wx-th 10,000 CE</text></g><ellipse cx="640.0" cy="80" rx="27.8" ry="7" class="wx-dash"/><g class="wx-sweep" style="--a:6;transform-origin:640px 150px"><line x1="608.2" y1="223.4" x2="671.8" y2="76.6" class="wx-bold"/></g><circle cx="640" cy="150" r="34" class="wx-water2 wx-edge"/><line x1="640" y1="64" x2="640" y2="236" class="wx-guide"/><text x="640" y="256" text-anchor="middle" class="wx-t-s">Earth's axis, tilted 23.4°,</text><text x="640" y="270" text-anchor="middle" class="wx-t-s">wobbles like a slowing top</text><g class="wx-pop" style="--d:12"><text x="500" y="330" class="wx-t-n">c. 25,772 years</text><text x="500" y="346" class="wx-t-s">one full circle</text></g><g class="wx-pop" style="--d:13"><text x="500" y="392" class="wx-t-n">1° every c. 71.6 years</text><text x="500" y="408" class="wx-t-s">two Moon-widths per lifetime</text></g><g class="wx-pop" style="--d:14"><text x="500" y="454" class="wx-t-n">at least 1° per century</text><text x="500" y="470" class="wx-t-s">Hipparchus's estimate, c. 130 BCE</text></g><text x="24" y="548" class="wx-t-s">Schematic: stars shown at their approximate distance from the pole circle; dates rounded.</text></svg></div></div><figcaption>Over about 25,772 years the north pole of the sky traces a circle among the stars. Polaris is the pole star now; Thuban was when the pyramids rose. <span class="wx-src">Based on: Precession period 25,772 years and 23.4° obliquity (modern values); positions along the circle computed linearly from dates; stars placed approximately. Hipparchus: Ptolemy, Almagest VII.2.</span></figcaption><p class="vh">A large circle representing the path of the north celestial pole around the pole of the ecliptic, 23.4 degrees away, with a tick every 1,000 years. At the top, Polaris and the year 2000 CE. Moving clockwise into the past: Hipparchus measuring the drift around 130 BCE, the Great Pyramid around 2560 BCE near the star Thuban, Göbekli Tepe around 9600 BCE, and Vega near the pole around 12,000 BCE at the bottom. An arrow on the left shows the future direction, towards Deneb around 10,000 CE. On the right, an inset shows Earth with its axis tilted 23.4 degrees wobbling like a top, and three numbers: one circle in about 25,772 years; 1 degree every 71.6 years, about two Moon-widths per lifetime; and Hipparchus&#x27;s estimate of at least 1 degree per century.</p></figure></section><section class="wsec" id="great-year-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Ages of gold and iron</h3><p>The myths of turning ages are real and widespread. Around 700 BCE the Greek poet Hesiod described five races of humans, from a golden race who lived like gods in the time of Cronos down through silver, bronze and the heroes to his own race of iron, and he wished himself out of it:</p><blockquote class="quote"><p>Thereafter, would that I were not among the men of the fifth generation, but either had died before or been born afterwards. For now truly is a race of iron.</p><cite>Hesiod, Works and Days 174–176, trans. H. G. Evelyn-White (Loeb, 1914)</cite></blockquote><p>&#x27;Or been born afterwards&#x27; hints that the wheel might turn again. In India the yugas descend in lengths of 4:3:2:1, and in the Puranas and the Surya Siddhanta the last and worst, the Kali Yuga, lasts 432,000 years; tradition dates its start to 3102 BCE. Plato spoke of a &#x27;perfect year&#x27; when all the heavenly circuits return together. In 1894 Sri Yukteswar recast the yugas as a 24,000-year cycle tied to precession, the version most often heard today.</p></section><section class="wsec" id="great-year-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Hamlet&#x27;s Mill and its heirs</h3><p>The boldest case was made in 1969 by Giorgio de Santillana, a historian of science at MIT, and Hertha von Dechend. In Hamlet&#x27;s Mill they gathered myths of a cosmic mill, from Iceland to Finland, Greece and India, whose axle wobbles or breaks and whose grinding brings a new age. The mill, they argued, is the turning sky; the breaking axle is the shift of the equinox from one constellation to the next. Behind the myths they saw a lost archaic science, perhaps Neolithic, that had measured precession and coded it into story.</p><p>Graham Hancock gave the idea its widest audience in Fingerprints of the Gods (1995), pointing to &#x27;precessional numbers&#x27;: 72 years for a degree, 2,160 for a zodiac age, 25,920 for the circle and 432,000 as a multiple. The Norse Grímnismál seems to agree:</p><blockquote class="quote"><p>Five hundred doors and forty there are, I ween, in Valhall&#x27;s walls; Eight hundred fighters through one door fare When to war with the wolf they go.</p><cite>Grímnismál 23, The Poetic Edda, trans. Henry Adams Bellows (1923)</cite></blockquote><p>Five hundred and forty times eight hundred is 432,000. Robert Bauval used precession to date the Giza layout to about 10,500 BCE, and Martin Sweatman argues that Göbekli Tepe&#x27;s carvings record the sky of about 10,850 BCE in a way that only works if their makers understood precession.</p></section><section class="wsec" id="great-year-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The critics and the numbers</h3><p>Scholars were harsh. Jaan Puhvel called Hamlet&#x27;s Mill not a serious scholarly work. Edmund Leach called its unified archaic system pure fantasy and faulted its reliance on outdated etymologies. Hilda Ellis Davidson called it amateurish. The core objection is method: with hundreds of myths from dozens of cultures, undated and selectively quoted, a patient reader can find almost any pattern.</p><p>The numbers have a simpler explanation. The Babylonians counted in sixties; a sar was 3,600 years, so 120 sars is 432,000 without any sky-watching. The yuga figure is 1,200 &#x27;divine years&#x27; of 360 human years each. And 72 is not the measured rate but a round number close to it, while Hipparchus, the man who actually measured it, got at least 100. The Sumerian King List, meanwhile, gives 241,200 years before the flood, not 432,000.</p><figure class="wx wx--steps" id="great-year-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">Where does 432,000 come from?</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Where does 432,000 come from?"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" class="wx-svg" role="img" aria-labelledby="great-year-f2-t"><title id="great-year-f2-t">Two ways to arrive at the mythic number 432,000: as a multiple of precession, or as a round number in base-60 arithmetic, compared with the measured length of the precession cycle</title><defs><marker id="great-year-f2-ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,1 L9,5 L0,9 Z"/></marker></defs><text x="24" y="28" class="wx-t-cap">Where does 432,000 come from?</text><g class="wx-st" data-s="1"><text x="360" y="74" text-anchor="middle" class="wx-t-big">432,000</text><rect x="24" y="92" width="212" height="70" rx="8" class="wx-card wx-edge-soft"/><text x="38" y="114" class="wx-t-b">Kali Yuga</text><text x="38" y="132" class="wx-t">432,000 years</text><text x="38" y="150" class="wx-t-s">Puranas; Surya Siddhanta</text><rect x="254" y="92" width="212" height="70" rx="8" class="wx-card wx-edge-soft"/><text x="268" y="114" class="wx-t-b">Berossus</text><text x="268" y="132" class="wx-t">10 kings before the flood</text><text x="268" y="150" class="wx-t-s">reigned 120 sars</text><rect x="484" y="92" width="212" height="70" rx="8" class="wx-card wx-edge-soft"/><text x="498" y="114" class="wx-t-b">Valhalla</text><text x="498" y="132" class="wx-t">540 doors × 800</text><text x="498" y="150" class="wx-t-s">warriors (Grímnismál 23)</text></g><g class="wx-st" data-s="2"><circle cx="34" cy="196" r="9" class="wx-num"/><text x="34" y="200" text-anchor="middle" class="wx-numt">2</text><text x="50" y="201" class="wx-t-b wx-t-a">Read as precession (Hamlet's Mill)</text><text x="50" y="232" class="wx-t-n">72 years</text><text x="50" y="247" class="wx-t-s">taken as 1° of precession</text><line x1="40" y1="236" x2="40" y2="266" class="wx-thin" marker-end="url(#great-year-f2-ah)"/><text x="50" y="278" class="wx-t-n">72 × 30 = 2,160</text><text x="50" y="293" class="wx-t-s">one zodiac 'age'</text><line x1="40" y1="282" x2="40" y2="312" class="wx-thin" marker-end="url(#great-year-f2-ah)"/><text x="50" y="324" class="wx-t-n">72 × 360 = 25,920</text><text x="50" y="339" class="wx-t-s">one full 'great year'</text><line x1="40" y1="328" x2="40" y2="358" class="wx-thin" marker-end="url(#great-year-f2-ah)"/><text x="50" y="370" class="wx-t-n">72 × 6,000 = 432,000</text><text x="50" y="385" class="wx-t-s">the yuga number</text></g><g class="wx-st" data-s="3"><circle cx="384" cy="196" r="9" class="wx-num"/><text x="384" y="200" text-anchor="middle" class="wx-numt">3</text><text x="400" y="201" class="wx-t-b ">Read as base-60 counting</text><text x="400" y="232" class="wx-t-n">60 × 60 = 3,600</text><text x="400" y="247" class="wx-t-s">one sar, a Babylonian round number</text><line x1="390" y1="236" x2="390" y2="266" class="wx-thin" marker-end="url(#great-year-f2-ah)"/><text x="400" y="278" class="wx-t-n">3,600 × 120 = 432,000</text><text x="400" y="293" class="wx-t-s">Berossus's 120 sars</text><line x1="390" y1="282" x2="390" y2="312" class="wx-thin" marker-end="url(#great-year-f2-ah)"/><text x="400" y="324" class="wx-t-n">1,200 × 360 = 432,000</text><text x="400" y="339" class="wx-t-s">Kali Yuga: 1,200 'divine years' of 360</text><line x1="390" y1="328" x2="390" y2="358" class="wx-thin" marker-end="url(#great-year-f2-ah)"/><text x="400" y="370" class="wx-t-n">241,200 years</text><text x="400" y="385" class="wx-t-s">the Sumerian King List's own total</text></g><line x1="360" y1="186" x2="360" y2="400" class="wx-guide"/><g class="wx-st" data-s="4"><circle cx="34" cy="426" r="9" class="wx-num"/><text x="34" y="430" text-anchor="middle" class="wx-numt">4</text><text x="50" y="431" class="wx-t-b">Check against the sky: how long is one circle?</text><text x="210" y="462" text-anchor="end" class="wx-t">Measured today</text><rect x="220" y="450" width="272.0" height="16" class="wx-c3 wx-growx" style="--d:0"/><text x="500.0" y="462" class="wx-t-n">25,772</text><text x="210" y="490" text-anchor="end" class="wx-t">'72 × 360'</text><rect x="220" y="478" width="273.6" height="16" class="wx-accfill wx-growx" style="--d:1"/><text x="501.6" y="490" class="wx-t-n">25,920</text><text x="210" y="518" text-anchor="end" class="wx-t">Sri Yukteswar, 1894</text><rect x="220" y="506" width="253.3" height="16" class="wx-stone3 wx-growx" style="--d:2"/><text x="481.3" y="518" class="wx-t-n">24,000</text><text x="210" y="546" text-anchor="end" class="wx-t">Hipparchus's upper limit</text><rect x="220" y="534" width="380.0" height="16" class="wx-stone2 wx-growx" style="--d:3"/><text x="608.0" y="546" class="wx-t-n">36,000</text></g><g class="wx-st wx-hide" data-only="5"><rect x="24" y="560" width="672" height="32" rx="6" class="wx-card wx-edge-soft"/><text x="360" y="581" text-anchor="middle" class="wx-t-b wx-t-a">432,000 needs no precession: base-60 arithmetic makes it on its own.</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> 432,000 turns up in the Kali Yuga, in Berossus&#x27;s kings before the flood and in Valhalla&#x27;s doors.</p><ol class="wx-steplist"><li>432,000 turns up in the Kali Yuga, in Berossus&#x27;s kings before the flood and in Valhalla&#x27;s doors.</li><li>Read as precession: start from 72 years per degree and multiply.</li><li>Read as base-60 counting: 120 sars of 3,600 years, or 1,200 divine years of 360, give the same number.</li><li>Check against the sky: the measured circle is 25,772 years, and Hipparchus thought it was up to 36,000.</li><li>The number needs no precession to exist; the precessional reading works only if 72 is chosen first.</li></ol><figcaption>The famous &#x27;precessional number&#x27; can be built from the sky, or from base-60 counting. Only one route needs a rounded rate chosen in advance. <span class="wx-src">Based on: Kali Yuga: Puranas and Surya Siddhanta; Berossus fragments; Grímnismál 23 (Bellows 1923); Sumerian King List (WB 444) total 241,200 years; Sri Yukteswar 1894; Hipparchus via Ptolemy, Almagest VII.2. Bars drawn to scale.</span></figcaption><p class="vh">Step 1 shows the number 432,000 with three cards: the Kali Yuga of 432,000 years in the Puranas and Surya Siddhanta; Berossus&#x27;s ten kings before the flood who reigned 120 sars; and Valhalla&#x27;s 540 doors times 800 warriors in Grímnismál 23. Step 2, on the left, reads it as precession: 72 years for 1 degree, 72 times 30 is 2,160 for a zodiac age, 72 times 360 is 25,920 for the full great year, and 72 times 6,000 is 432,000. Step 3, on the right, reads it as base-60 counting: 60 times 60 is 3,600, one sar; 3,600 times 120 is 432,000; 1,200 divine years of 360 is also 432,000; and the Sumerian King List&#x27;s own total is 241,200 years. Step 4 is a bar chart of cycle lengths: measured today 25,772 years, the 72 times 360 figure 25,920, Sri Yukteswar&#x27;s 24,000, and Hipparchus&#x27;s upper limit 36,000. Step 5 concludes that 432,000 needs no precession, since base-60 arithmetic makes it on its own.</p></figure><p>The biggest silence is Babylon. Its astronomers left thousands of dated observations on clay over centuries, yet no tablet mentions the drift. Otto Neugebauer examined the claim that Kidinnu discovered precession and rejected it in 1950.</p></section><section class="wsec" id="great-year-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What time has hidden</h3><p>Still, the absence is partly an absence of sources. Almost nothing survives of the oral sky-lore of the millennia before writing. Egyptian astronomical papyri are few. Monuments aligned on stars were rebuilt or reoriented, and it is often unclear whether a change of axis followed a star or a new plan.</p><aside class="wcall"><b>Fresh from the field</b><p>In 2024 the chemical engineer Martin Sweatman of the University of Edinburgh published a reading in Time and Mind that the V-shaped marks on a Göbekli Tepe pillar count 365 days, as 12 lunar months plus 11 days, with the summer solstice marked, and that the site&#x27;s carvings record a date using precession. The German Archaeological Institute team had rejected his 2017 reading of Pillar 43, arguing that the date predates the enclosure&#x27;s radiocarbon evidence, that pillars were moved and that Neolithic people need not have seen Greek constellations.</p></aside><p>Even if Sweatman were right about a solar calendar, that is not yet knowledge of a 25,772-year cycle. And the clearest case of myth coding precession, David Ulansey&#x27;s reading of the Roman Mithras bull-slaying scene, would come after Hipparchus, as a response to his discovery.</p></section><section class="wsec" id="great-year-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>Cycles without a clock</h3><p>There is a true story of cycles here, and it is stranger than the myths. In 1976 Hays, Imbrie and Shackleton showed that deep-sea sediments carry the rhythms of Earth&#x27;s orbit, including precession at about 23,000 and 19,000 years. The wobble really does help pace the ice ages. That is part of why our Cycles timeline is full of rises and falls: sea levels, warm spells, droughts.</p><p>But orbital rhythms set the stage slowly and unevenly; they do not deliver golden ages on schedule, and the collapses on our timeline came at irregular times for many different reasons. Cycles, yes; a cosmic timetable for human history, no evidence.</p><p>What would change the verdict is a dated record: a tablet, papyrus or inscription older than Hipparchus that describes the drift, or a sequence of independently dated temples re-aligned step by step to follow one star. Until one appears, the ancients who watched the sky deserve our admiration, and the idea that they encoded its slowest motion in myth remains an intriguing hope still waiting for its evidence.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">9,600 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Göbekli Tepe&#x27;s enclosures in use</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">3,102 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Traditional start of the Kali Yuga</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">700 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Hesiod describes five ages</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">280 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Berossus writes of 120 sars before the flood</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">130 BCE</span><span class="wtl-k">Studied</span><span class="wtl-t">Hipparchus measures the drift</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">150 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Ptolemy&#x27;s Almagest records it</span></li><li class="wtl-event" style="--i:6"><span class="wtl-y">1894 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Sri Yukteswar&#x27;s 24,000-year cycle</span></li><li class="wtl-event" style="--i:7"><span class="wtl-y">1969 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Hamlet&#x27;s Mill published</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">1976 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Orbital cycles linked to the ice ages</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">2024 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Sweatman&#x27;s Göbekli Tepe calendar paper</span></li></ol><details class="srcs"><summary>Sources for this case (14)</summary><ol><li>de Santillana, G. &amp; von Dechend, H. (1969). Hamlet&#x27;s Mill: An Essay on Myth and the Frame of Time. Gambit, Boston.</li><li>Ptolemy, Almagest, trans. G. J. Toomer (1984). Ptolemy&#x27;s Almagest. Duckworth, London.</li><li>Neugebauer, O. (1950). The Alleged Babylonian Discovery of the Precession of the Equinoxes. Journal of the American Oriental Society 70(1): 1–8.</li><li>Hays, J. D., Imbrie, J. &amp; Shackleton, N. J. (1976). Variations in the Earth&#x27;s Orbit: Pacemaker of the Ice Ages. Science 194(4270): 1121–1132. <a href="https://doi.org/10.1126/science.194.4270.1121" target="_blank" rel="noopener">doi:10.1126/science.194.4270.1121</a></li><li>Hesiod, Works and Days, in Hesiod, the Homeric Hymns and Homerica, trans. H. G. Evelyn-White (1914). Loeb Classical Library 57. Heinemann, London.</li><li>The Poetic Edda, trans. H. A. Bellows (1923). American-Scandinavian Foundation, New York. Grímnismál 23.</li><li>Sri Yukteswar Giri (1894). The Holy Science (Kaivalya Darsanam).</li><li>Sweatman, M. B. (2024). Representations of calendars and time at Göbekli Tepe and Karahan Tepe support an astronomical interpretation of their symbolism. Time and Mind 17(3–4). <a href="https://doi.org/10.1080/1751696X.2024.2373876" target="_blank" rel="noopener">doi:10.1080/1751696X.2024.2373876</a></li><li>Sweatman, M. B. &amp; Tsikritsis, D. (2017). Decoding Göbekli Tepe with archaeoastronomy: what does the fox say? Mediterranean Archaeology and Archaeometry 17(1).</li><li>Notroff, J., Dietrich, O., Clare, L. et al. (2017). More than a vulture: a response to Sweatman and Tsikritsis. Mediterranean Archaeology and Archaeometry 17(2).</li><li>Ulansey, D. (1989). The Origins of the Mithraic Mysteries: Cosmology and Salvation in the Ancient World. Oxford University Press, New York.</li><li>Hancock, G. (1995). Fingerprints of the Gods. Heinemann, London.</li><li>Leach, E. (1970). Review of Hamlet&#x27;s Mill. The New York Review of Books; Puhvel, J. (1970). The American Historical Review; Davidson, H. R. E. (1974). Folklore.</li><li>Kyle Kingsbury Podcast #421, &#x27;Cyclical Time &amp; Ancient Mysteries: A Journey Through History &amp; Sound w/ Tyler Engle - Bass Forge&#x27; (2 September 2025); episode notes, Podbean.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-great-year" data-t="The Great Year: Did Myths Remember the Turning Sky?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Great Year: Did Myths Remember the Turning Sky?</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-great-year</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-sacred-metrology-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Kheops-Pyramid.jpg" data-cap="The Great Pyramid of Khufu, Giza" data-big><figcaption></figcaption></figure><div class="sh-k">Sky Watchers</div><h2 class="sh-t" id="case-sacred-metrology-st" tabindex="-1">Sacred Measures: Is the Earth Built Into the Pyramid?</h2><p class="sh-s">Multiply the Great Pyramid by 43,200 and you get the northern hemisphere, within one percent. Coincidence, or a message in stone?</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> The Great Pyramid was deliberately built as a 1:43,200 scale model of the northern hemisphere, showing that its builders knew the Earth&#x27;s size and shape.</p></div><p class="v4-q">Did ancient builders encode the size of the Earth in their monuments?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Multiply the Great Pyramid&#x27;s height and base by 43,200 and you get the Earth&#x27;s polar radius and equator to within about one percent.</li><li>Egyptians set slopes by a rule called the seked: 5½ palms across for each cubit (7 palms) up.</li><li>That slope makes perimeter divided by height almost exactly 2π for a pyramid of any size, and the Earth&#x27;s circumference divided by its radius is 2π because it is round.</li><li>So only the number 43,200 needs explaining, and it was picked after the fact.</li><li>No Egyptian text shows knowledge of the Earth&#x27;s size; the first known measurement is by Eratosthenes, around 240 BCE.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Mathematics</span><span class="thr">Astronomy</span><span class="thr">Engineering</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">1 : <b class="ctr-n" data-v="43200" >43,200</b><span class="ctr-u"> </span></div><div class="ctr-l">the scale factor said to link the pyramid to the northern hemisphere</div><div class="ctr-c">Hancock 1995</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="6.286" data-dec="3">6.286</b><span class="ctr-u"> </span></div><div class="ctr-l">the pyramid&#x27;s perimeter divided by its height (2π = 6.283)</div><div class="ctr-c">Petrie 1883</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="0.7" data-dec="1">0.7</b><span class="ctr-u"> %</span></div><div class="ctr-l">shortfall of the scaled-up perimeter against the equator</div><div class="ctr-c">calculation</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="51.84" data-dec="2">51.84</b><span class="ctr-u"> °</span></div><div class="ctr-l">slope of the pyramid&#x27;s faces, a seked of 5½ palms</div><div class="ctr-c">Lehner 1997</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="0.829" data-dec="3">0.829</b><span class="ctr-u"> m</span></div><div class="ctr-l">Thom&#x27;s proposed megalithic yard</div><div class="ctr-c">Thom 1967</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The Great Pyramid was deliberately built as a 1:43,200 scale model of the northern hemisphere, showing that its builders knew the Earth&#x27;s size and shape.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The numbers are real: at 1:43,200 the pyramid lands within one percent of the hemisphere. But the match is explained without hidden knowledge. The near-2π ratio follows from the seked of 5½ palms, as it would for any pyramid of that slope, and the Earth&#x27;s own circumference-to-radius ratio is about 2π because it is round. That leaves only the scale factor, which is chosen after the fact, and the best fits for the two dimensions differ. No Egyptian text shows any knowledge of the Earth&#x27;s size. Intent cannot be excluded, so the claim awaits discovery.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks present the pyramid as a royal tomb built with practical mathematics and say nothing of the Earth&#x27;s measure; that confidence is well founded. They often underplay how precise the builders were, and rarely explain where the famous 2π comes from, which leaves the field open to mystery. On the megalithic yard, blanket dismissal slightly overstates the case: a looser local unit, or pacing, remains possible.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Flinders Petrie&#x27;s survey gives the Great Pyramid a base of about 230.3 m a side and an original height of about 146.6 m, which is 440 by 280 Egyptian royal cubits of about 0.524 m.<small>Petrie 1883; Lehner 1997</small></li><li>The ratio of the pyramid&#x27;s perimeter to its height, 1,760 ÷ 280 = 6.286, is within 0.05 percent of 2π. It follows from its slope, a seked of 5½ palms per cubit, a way of setting slopes taught in the Rhind Mathematical Papyrus.<small>Rossi 2004; Imhausen 2016</small></li><li>Multiplied by 43,200, the perimeter gives about 39,806 km, 0.7 percent short of the Earth&#x27;s equatorial circumference of 40,075 km, and the height gives about 6,333 km, 0.4 percent short of the polar radius of 6,357 km.<small>calculation from Petrie 1883 and modern geodesy</small></li><li>The pyramid&#x27;s sides are aligned to true north, south, east and west within a few arcminutes, a real feat of ancient surveying.<small>Petrie 1883; Lehner 1997</small></li><li>Alexander Thom surveyed hundreds of British and French megalithic sites and proposed a standard &#x27;megalithic yard&#x27; of 0.829 m. Statistical re-analyses found at best marginal support for a unit that precise.<small>Thom 1967; Kendall 1974; Heggie 1981; Ruggles 1999</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether any Egyptian of Khufu&#x27;s time knew the Earth was a sphere, let alone its size; the earliest known measurement of the Earth&#x27;s circumference is Eratosthenes&#x27;, about 240 BCE.</li><li>Whether the 2π in the pyramid&#x27;s proportions was intended, or is a by-product of choosing a convenient seked.</li><li>Whether a standard megalithic unit existed at all, or whether stone circles were laid out by pacing, which gives similar but looser lengths.</li><li>Whether recurring numbers such as 72, 2,160, 25,920 and 432,000 in myth and calendars record knowledge of precession, or are products of base-60 arithmetic.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>No Old Kingdom architect&#x27;s plan, calculation or building manual for the Great Pyramid survives; the design reasoning has to be inferred.</li><li>The pyramid has lost its casing and capstone, so its original height is itself an estimate, uncertain by a few tens of centimetres.</li><li>Many megalithic sites have lost stones or been disturbed, which adds noise to any search for a standard unit.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Egyptologists and historians of mathematics read the pyramid&#x27;s proportions as the result of practical design rules. Egyptian builders set slopes by the seked, a run in palms for each cubit of rise. A seked of 5½ palms gives a base-to-height ratio of 11 to 7, and so a perimeter-to-height ratio of 44 to 7, very close to 2π, for a pyramid of any size. The texts that survive show sophisticated practical arithmetic and surveying, but no interest in the size of the Earth, which Egyptians pictured as a flat land beneath the arched body of the sky goddess Nut. Archaeologists are similarly doubtful of a precise megalithic yard.</p><ul><li>Seked problems in the Rhind Mathematical Papyrus show how Egyptian scribes worked out pyramid slopes.</li><li>A near-2π ratio arises automatically from a seked of 5½ palms, whatever the pyramid&#x27;s size.</li><li>The factor 43,200 is chosen after the fact; the best fits are about 43,490 and 43,360, not one number.</li><li>Petrie measured the pyramid to test pyramid-inch theories in the 1880s and found no evidence for them.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Carlson, a master builder who has taught sacred geometry for decades, argues that ancient units of measure and the monuments built with them were derived from the size and shape of the Earth. In a 2018 lecture published by Sacred Geometry International he states that &#x27;ancient master builders understood Earth&#x27;s fundamental geodetic parameters on a level not equalled until the advent of modern satellite surveys&#x27;, and describes the Great Pyramid as a model of
