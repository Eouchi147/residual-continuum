 the northern hemisphere. With Hancock he points to the 43,200 scale, a number tied to precession, and in his podcast he links the measures of Plato&#x27;s Atlantis to the measure of the Earth and of time.</p><ul><li>At a scale of 1:43,200 the pyramid matches the northern hemisphere&#x27;s circumference and polar radius within one percent.</li><li>The number 43,200 belongs to a family of precession numbers (72, 2,160, 25,920, 432,000) that recurs in myths and calendars worldwide.</li><li>The pyramid&#x27;s precise orientation and levelling show its builders were capable of accurate large-scale surveying.</li><li>Thom&#x27;s surveys suggested that Neolithic Britons used a standard unit across hundreds of sites.</li></ul><div class="face-s"><b>Its strongest point</b><p>The builders were genuinely brilliant surveyors: the pyramid is squared and aligned to within minutes of arc, and its proportions carry a near-perfect 2π. A people who could do that deserve not to be underestimated by default.</p></div><p class="face-cr"><b>Credit</b> Randall Carlson (&#x27;The Great Pyramid Decoded&#x27;, Sacred Geometry International, 2018; Kosmographia episode #010, &#x27;Precession, Cosmic Numbers and Cycles&#x27;; his sacred geometry courses); Graham Hancock (Fingerprints of the Gods, 1995); Livio Catullo Stecchini and Peter Tompkins (Secrets of the Great Pyramid, 1971); Alexander Thom (Megalithic Sites in Britain, 1967); John Michell</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>An Old Kingdom text, drawing or calculation showing knowledge of the Earth&#x27;s shape or size.</li><li>A second monument, independently dated, whose dimensions match the Earth at the same scale factor, fixed before the measurement rather than after.</li><li>A blind statistical test of the megalithic yard on new, accurately surveyed circles not used in Thom&#x27;s analysis.</li><li>Evidence of a pre-Greek measurement of the Earth, such as simultaneous shadow or star observations at distant places.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,172 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Sacred Measures: Is the Earth Built Into the Pyramid?"><button type="button" class="wtoc-i" data-go="sacred-metrology-s1">A planet in stone?</button><button type="button" class="wtoc-i" data-go="sacred-metrology-s2">A long tradition of measuring the pyramid</button><button type="button" class="wtoc-i" data-go="sacred-metrology-s3">The case at its strongest</button><button type="button" class="wtoc-i" data-go="sacred-metrology-s4">Where the 2π comes from</button><button type="button" class="wtoc-i" data-go="sacred-metrology-s5">The megalithic yard</button><button type="button" class="wtoc-i" data-go="sacred-metrology-s6">What we cannot recover</button><button type="button" class="wtoc-i" data-go="sacred-metrology-s7">The verdict</button></nav></div><section class="wsec" id="sacred-metrology-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A planet in stone?</h3><p>Take the Great Pyramid&#x27;s height, about 146.6 m, and multiply it by 43,200. You get about 6,333 km, within 0.4 percent of the distance from the Earth&#x27;s centre to the North Pole. Now take the perimeter of its base, about 921 m, and multiply by the same number. You get about 39,806 km, within 0.7 percent of the equator. Two dimensions, one scale factor, one planet. It is one of the most striking claims in alternative history.</p><p>For Randall Carlson it is not a coincidence but a key. A builder by trade and a teacher of sacred geometry for decades, he argues that ancient units of length and the monuments built with them were derived from the Earth itself, and that the Great Pyramid is a model of the northern hemisphere. &#x27;Ancient master builders understood Earth&#x27;s fundamental geodetic parameters on a level not equalled until the advent of modern satellite surveys,&#x27; he wrote in 2018. This case tests that claim with the pyramid&#x27;s own numbers.</p><blockquote class="wpull"><p>A measurement that fits within one percent feels like a message. The first question is how many ways it could have fitted by accident.</p></blockquote></section><section class="wsec" id="sacred-metrology-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>A long tradition of measuring the pyramid</h3><p>The idea is older than Carlson. In 1859 the London publisher John Taylor argued that the pyramid was built in a sacred unit, and in 1864 the astronomer Charles Piazzi Smyth promoted a &#x27;pyramid inch&#x27; that he believed encoded the Earth&#x27;s dimensions. In the 1880s a young Flinders Petrie went to Giza to test these ideas with a careful survey. He came back convinced otherwise.</p><blockquote class="quote"><p>There is no authentic example, that will bear examination, of the use or existence of any such measure as a &#x27;Pyramid inch&#x27;, or of a cubit of 25.025 British inches.</p><cite>W. M. Flinders Petrie, The Pyramids and Temples of Gizeh (1883)</cite></blockquote><p>The modern version arrived with Peter Tompkins&#x27; Secrets of the Great Pyramid (1971), in which the historian of measurement Livio Catullo Stecchini argued that the pyramid was a scaled model of the northern hemisphere. Graham Hancock gave it the number that stuck, 43,200, in Fingerprints of the Gods (1995), pointing out that it belongs to a family of numbers linked to the slow wobble of the Earth&#x27;s axis: the sky shifts by about 1 degree every 72 years, and 43,200 is 600 times 72.</p></section><section class="wsec" id="sacred-metrology-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The case at its strongest</h3><p>The strongest version of the argument starts from the builders&#x27; skill, which is not in doubt. The Great Pyramid&#x27;s sides are aligned to true north within a few arcminutes, its base is nearly level across more than 230 m, and its dimensions are clean numbers in Egyptian royal cubits: 440 across and 280 high. Carlson&#x27;s reading is that people capable of that could have measured the Earth, and that the pyramid&#x27;s proportions are their record. He goes further, arguing that the monument captures the Earth&#x27;s shape, including its bulge at the equator.</p><p>He also sees the same numbers elsewhere. On his Kosmographia podcast he links the measures of Plato&#x27;s Atlantis, its inner island five stades across, to the measure of the Earth and of time. The numbers 72, 2,160, 25,920 and 432,000 appear in calendars and myths from India to Mesopotamia to Scandinavia, as the site&#x27;s Great Year case describes. If they encode precession, perhaps the builders&#x27; units encode the planet too.</p><figure class="wx wx--steps" id="sacred-metrology-f1" data-n="4"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">How to turn a pyramid into a planet</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How to turn a pyramid into a planet"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" class="wx-svg" role="img" aria-labelledby="sacred-metrology-f1-t"><title id="sacred-metrology-f1-t">How the Great Pyramid is matched to the northern hemisphere at a scale of 1 to 43,200, and why the match follows from the pyramid's slope, in four steps</title><text x="24" y="26" class="wx-t-cap">The pyramid and the hemisphere · each drawn to its own scale</text><line x1="24" y1="330" x2="340" y2="330" class="wx-line"/><polygon points="40,330 183.9,146.8 327.9,330" class="wx-stone wx-edge"/><path d="M40,330 L183.9,146.8 L327.9,330" class="wx-line wx-draw" pathLength="1" style="--d:1"/><line x1="183.9" y1="146.8" x2="183.9" y2="330" class="wx-dash"/><text x="40" y="352" class="wx-t-b">Great Pyramid, as built</text><text x="40" y="368" class="wx-t-s">base 230.3 m, height c. 146.6 m</text><g class="wx-st wx-hide" data-only="1"><text x="189.9" y="238.4" class="wx-t wx-halo">280 cubits high</text><text x="183.9" y="322" text-anchor="middle" class="wx-t wx-halo">440 cubits base</text><path d="M74,330 A34,34 0 0,0 61.0,303.3" class="wx-hl"/><text x="82" y="318" class="wx-t-b wx-t-a wx-halo">51.8°</text><text x="360" y="90" class="wx-t-b">Designed in cubits</text><text x="360" y="108" class="wx-t-s">1 royal cubit = c. 0.524 m. The slope is set</text><text x="360" y="122" class="wx-t-s">by the seked: 5½ palms of run for each cubit</text><text x="360" y="136" class="wx-t-s">(7 palms) of rise, as taught in the Rhind papyrus.</text></g><g class="wx-st wx-hide" data-s="2"><rect x="34" y="328" width="299.9" height="4" class="wx-accfill"/></g><g class="wx-st wx-hide" data-only="2"><text x="360" y="90" class="wx-t-b">A built-in 2π</text><text x="360" y="112" class="wx-t-n">perimeter ÷ height = 1,760 ÷ 280 = 6.286</text><text x="360" y="130" class="wx-t-s">2π = 6.283. The seked of 5½ palms makes base ÷ height</text><text x="360" y="144" class="wx-t-s">= 11/7, so this ratio follows from the slope alone,</text><text x="360" y="158" class="wx-t-s">for a pyramid of any size (22/7 is close to π).</text></g><g class="wx-st" data-s="3"><path d="M410,330 A130,130 0 0,1 670,330 Z" class="wx-water wx-edge-soft"/><line x1="540" y1="330" x2="540" y2="200" class="wx-bold"/><line x1="410" y1="330" x2="670" y2="330" class="wx-hl" style="stroke-width:4"/><text x="540" y="352" text-anchor="middle" class="wx-t-b">Northern hemisphere</text><text x="540" y="368" text-anchor="middle" class="wx-t-s">section through the pole; base line = the equator</text></g><g class="wx-st wx-hide" data-only="3"><text x="546" y="265.0" class="wx-t wx-halo">polar radius 6,357 km</text><text x="532" y="320" text-anchor="end" class="wx-t wx-t-a wx-halo">equator: 40,075 km around</text><text x="360" y="90" class="wx-t-b">The Earth has the same kind of ratio</text><text x="360" y="112" class="wx-t-n">circumference ÷ polar radius = 6.304</text><text x="360" y="130" class="wx-t-s">Any circle gives about 2π; the Earth's slight</text><text x="360" y="144" class="wx-t-s">flattening nudges it up by 0.3 percent.</text></g><g class="wx-st wx-hide" data-only="4"><text x="360" y="60" class="wx-t-big wx-t-a">× 43,200</text><text x="360" y="86" class="wx-t-s">perimeter 921.4 m → 39,806 km: 0.7% short of the equator</text><text x="360" y="102" class="wx-t-s">height 146.6 m → 6,333 km: 0.4% short of the polar radius</text><text x="360" y="126" class="wx-t-b">The best-fitting factors differ:</text><text x="360" y="142" class="wx-t-s">about 43,490 for the equator, 43,360 for the radius.</text><text x="360" y="158" class="wx-t-s">43,200 (= 600 × 72, a precession number) is chosen</text><text x="360" y="174" class="wx-t-s">because it is close and meaningful, after the fact.</text></g><g><rect x="40" y="420" width="125.0" height="5" class="wx-inkfill"/><text x="40" y="415" class="wx-t-s">0</text><text x="165.0" y="415" text-anchor="middle" class="wx-t-s">100 m</text><rect x="410" y="420" width="102.2" height="5" class="wx-inkfill"/><text x="410" y="415" class="wx-t-s">0</text><text x="512.2" y="415" text-anchor="middle" class="wx-t-s">5,000 km</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 4.</b> The pyramid as designed: 440 by 280 royal cubits, its slope set by a seked of 5½ palms.</p><ol class="wx-steplist"><li>The pyramid as designed: 440 by 280 royal cubits, its slope set by a seked of 5½ palms.</li><li>Perimeter ÷ height = 6.286, close to 2π. The slope alone produces this, at any size.</li><li>The Earth: circumference ÷ polar radius = 6.304. Any round body gives about 2π.</li><li>Multiply by 43,200: close, but the best-fitting factors differ, and 43,200 is chosen afterwards.</li></ol><figcaption>The Great Pyramid&#x27;s section and the northern hemisphere, each drawn to its own scale, showing why their proportions match and where the number 43,200 comes in. <span class="wx-src">Based on: Pyramid: base 230.3 m, height c. 146.6 m (Petrie 1883; Lehner 1997); royal cubit c. 0.5236 m. Earth: equatorial circumference 40,075 km, polar radius 6,356.8 km (WGS 84). Scale factor as proposed by Hancock 1995.</span></figcaption><p class="vh">On the left, a to-scale section of the Great Pyramid, 230.3 metres across and about 146.6 metres high. Step 1 labels it as 440 by 280 royal cubits with a slope of 51.8 degrees, set by a seked of 5½ palms per cubit. Step 2 highlights the base and shows that the perimeter divided by the height is 1,760 divided by 280, or 6.286, close to 2π, a result of the slope alone. Step 3 adds a half-circle for the northern hemisphere, with a polar radius of 6,357 kilometres and an equator 40,075 kilometres around, whose ratio is 6.304. Step 4 multiplies the pyramid by 43,200: the perimeter becomes 39,806 kilometres, 0.7 percent short, and the height 6,333 kilometres, 0.4 percent short, and notes that the best-fitting factors are about 43,490 and 43,360.</p></figure></section><section class="wsec" id="sacred-metrology-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Where the 2π comes from</h3><p>The key is the slope. Egyptian builders did not measure angles in degrees. They used the seked, the horizontal run in palms for each cubit of rise, where a cubit is 7 palms. Problems 56 to 60 of the Rhind Mathematical Papyrus, copied around 1550 BCE from an older text, teach scribes to calculate it. The Great Pyramid&#x27;s seked is 5½ palms, a slope of about 51.8 degrees. That makes its half-base 5½/7 of its height, so its full base is 11/7 of its height and its perimeter is 44/7 of its height: 6.286. Twice π is 6.283.</p><p>That is the whole trick. Any pyramid built with a seked of 5½ palms has a perimeter-to-height ratio near 2π, whether it is 1 m or 1 km tall. And any round planet has a circumference-to-radius ratio near 2π, because that is what a circle is; the Earth&#x27;s flattening makes its ratio 6.304. So the shapes will always match. The only question is the scale factor, and that is where 43,200 comes in. The factor that best fits the equator is about 43,490; the one that best fits the polar radius is about 43,360. Neither is 43,200. It is chosen because it is close and because it is a precession number, after the match is known.</p><aside class="wcall"><b>How do we know?</b><p>Whether the Egyptians chose 5½ palms for its 2π, perhaps by rolling a drum to measure the base, or simply as a convenient slope, is debated among historians of mathematics. Either way, the ratio comes from the slope. For the Earth-model claim to hold, the Egyptians would also need to know the Earth&#x27;s size, which no Egyptian source mentions.</p></aside></section><section class="wsec" id="sacred-metrology-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The megalithic yard</h3><p>The same question arose in Britain. Alexander Thom, a professor of engineering at Oxford, spent decades surveying stone circles and rows, and in 1967 he proposed a &#x27;megalithic yard&#x27; of 0.829 m used across Britain and Brittany with remarkable precision. It was a serious, data-rich argument, and the Earth-measure school later adopted it.</p><p>Statisticians were less sure. David Kendall&#x27;s 1974 analysis found some evidence for a common unit in Scottish circles but not in English ones, and later reviews by Douglas Heggie and Clive Ruggles concluded that the evidence for a precise unit was at best marginal: a looser length, perhaps a pace, could produce the same patterns. Thom&#x27;s legacy is real, and he helped found the study of ancient astronomy, but a standard megalithic yard has not been shown.</p><figure class="wx wx--static" id="sacred-metrology-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">Ancient and modern units, to scale</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Ancient and modern units, to scale"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" class="wx-svg" role="img" aria-labelledby="sacred-metrology-f2-t"><title id="sacred-metrology-f2-t">Six units of length drawn to scale, from the Roman foot to the metre, including the Egyptian royal cubit, a walking step and Alexander Thom's megalithic yard</title><text x="24" y="26" class="wx-t-cap">Units of length, drawn to one scale</text><line x1="200.0" y1="48" x2="200.0" y2="360" class="wx-guide"/><text x="200.0" y="374" text-anchor="middle" class="wx-t-n">0 m</text><line x1="320.0" y1="48" x2="320.0" y2="360" class="wx-guide"/><text x="320.0" y="374" text-anchor="middle" class="wx-t-n">0.25 m</text><line x1="440.0" y1="48" x2="440.0" y2="360" class="wx-guide"/><text x="440.0" y="374" text-anchor="middle" class="wx-t-n">0.5 m</text><line x1="560.0" y1="48" x2="560.0" y2="360" class="wx-guide"/><text x="560.0" y="374" text-anchor="middle" class="wx-t-n">0.75 m</text><line x1="680.0" y1="48" x2="680.0" y2="360" class="wx-guide"/><text x="680.0" y="374" text-anchor="middle" class="wx-t-n">1 m</text><text x="188" y="69" text-anchor="end" class="wx-t-b">Roman foot</text><rect x="200" y="57" width="142.1" height="14" class="wx-stone3 wx-growx" style="--d:0"/><text x="200" y="88" class="wx-t-s wx-pop" style="--d:1">c. 0.296 m</text><text x="188" y="121" text-anchor="end" class="wx-t-b">Egyptian royal cubit</text><rect x="200" y="109" width="251.3" height="14" class="wx-stone3 wx-growx" style="--d:1"/><text x="200" y="140" class="wx-t-s wx-pop" style="--d:2">c. 0.524 m, from surviving cubit rods</text><text x="188" y="173" text-anchor="end" class="wx-t-b">A walking step</text><rect x="200" y="161" width="336.0" height="14" class="wx-stone3 wx-growx" style="--d:2"/><rect x="536.0" y="161" width="48.0" height="14" class="wx-stone3 wx-o40 wx-growx" style="--d:2"/><text x="200" y="192" class="wx-t-s wx-pop" style="--d:3">roughly 0.7–0.8 m, varies with the walker</text><text x="188" y="225" text-anchor="end" class="wx-t-b">Thom's megalithic yard</text><rect x="200" y="213" width="397.9" height="14" class="wx-accfill wx-growx" style="--d:3"/><text x="200" y="244" class="wx-t-s wx-pop" style="--d:4">0.829 m (2.72 ft), proposed from surveys</text><text x="188" y="277" text-anchor="end" class="wx-t-b">Imperial yard</text><rect x="200" y="265" width="438.9" height="14" class="wx-stone3 wx-growx" style="--d:4"/><text x="200" y="296" class="wx-t-s wx-pop" style="--d:5">0.914 m</text><text x="188" y="329" text-anchor="end" class="wx-t-b">Metre</text><rect x="200" y="317" width="480.0" height="14" class="wx-c2 wx-growx" style="--d:5"/><text x="200" y="348" class="wx-t-s wx-pop" style="--d:6">defined in 1791 from the Earth itself</text><g class="wx-pop" style="--d:8"><text x="24" y="402" class="wx-t-s">The metre was defined as one ten-millionth of the distance from the North Pole to the equator, and the nautical mile</text><text x="24" y="417" class="wx-t-s">(1,852 m) is about one minute of latitude: modern units that really are taken from the Earth, and say so.</text></g></svg></div></div><figcaption>Six units of length drawn to one scale. Thom&#x27;s megalithic yard sits within the range of an ordinary walking step, one reason statisticians doubt it was a precise standard. <span class="wx-src">Based on: Roman foot c. 0.296 m; royal cubit c. 0.5236 m (Petrie 1883); megalithic yard 0.829 m (Thom 1967); imperial yard 0.9144 m. Walking step is a typical adult range and varies widely.</span></figcaption><p class="vh">Horizontal bars drawn to one scale from 0 to 1 metre: the Roman foot at about 0.296 metres, the Egyptian royal cubit at about 0.524 metres, a walking step shown as a range of roughly 0.7 to 0.8 metres, Alexander Thom&#x27;s megalithic yard at 0.829 metres, the imperial yard at 0.914 metres and the metre. A note explains that the metre was defined in 1791 as one ten-millionth of the distance from the North Pole to the equator, and that the nautical mile of 1,852 metres is about one minute of latitude.</p></figure></section><section class="wsec" id="sacred-metrology-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What we cannot recover</h3><p>Honesty requires admitting what is missing. No Old Kingdom architect&#x27;s plan or notebook survives. The pyramid has lost its casing and capstone, so its original height is known to within tens of centimetres, not millimetres, which is enough to make fits to 0.1 percent meaningless. Stone circles have lost stones and been re-set. We are reconstructing intentions from ruins.</p><p>What survives of Egyptian thought, however, is revealing. The world of the Egyptian texts is a flat land, the earth god Geb, beneath the arched body of the sky goddess Nut. The first known measurement of the Earth&#x27;s circumference was made by Eratosthenes in Alexandria around 240 BCE, some 2,300 years after the pyramid. The metre, defined in 1791 as one ten-millionth of the distance from the North Pole to the equator, is a unit that truly encodes the Earth; its makers left long reports explaining how.</p></section><section class="wsec" id="sacred-metrology-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>The verdict</h3><p>The pyramid does not need a hidden planet to be astonishing. Its builders squared, levelled and aligned six million tonnes of stone with extraordinary precision, and its proportions carry a near-perfect 2π. But the scale-model reading adds nothing the slope does not already explain, depends on a factor picked after the fact, and has no support in any Egyptian source. We rate it as awaiting discovery: not impossible, but unsupported.</p><p>It would take new evidence to change that: an Old Kingdom text or drawing showing knowledge of the Earth&#x27;s size, or a second monument that matches the planet at a scale fixed in advance, not found afterwards. Until then, the Earth in the pyramid is a reflection of our own measurements, not theirs.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">2,560 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Great Pyramid completed for Khufu</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">1,550 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Rhind Mathematical Papyrus copied, with seked problems</span></li><li class="wtl-study" style="--i:2"><span class="wtl-y">240 BCE</span><span class="wtl-k">Studied</span><span class="wtl-t">Eratosthenes measures the Earth&#x27;s circumference</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">1791 CE</span><span class="wtl-k">Event</span><span class="wtl-t">The metre defined from the Earth&#x27;s quadrant</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">1864 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Piazzi Smyth&#x27;s pyramid inch</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1883 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Petrie&#x27;s survey finds no pyramid inch</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">1967 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Thom proposes the megalithic yard</span></li><li class="wtl-event" style="--i:7"><span class="wtl-y">1971 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Secrets of the Great Pyramid: the scale-model idea</span></li><li class="wtl-event" style="--i:8"><span class="wtl-y">1995 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Fingerprints of the Gods popularises 1:43,200</span></li><li class="wtl-event" style="--i:9"><span class="wtl-y">2018 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Carlson&#x27;s &#x27;The Great Pyramid Decoded&#x27;</span></li></ol><details class="srcs"><summary>Sources for this case (16)</summary><ol><li>Petrie, W. M. F. (1883). The Pyramids and Temples of Gizeh. Field &amp; Tuer, London.</li><li>Lehner, M. (1997). The Complete Pyramids. Thames &amp; Hudson, London.</li><li>Rossi, C. (2004). Architecture and Mathematics in Ancient Egypt. Cambridge University Press.</li><li>Imhausen, A. (2016). Mathematics in Ancient Egypt: A Contextual History. Princeton University Press.</li><li>Robins, G. &amp; Shute, C. (1987). The Rhind Mathematical Papyrus: An Ancient Egyptian Text. British Museum Publications, London.</li><li>Thom, A. (1967). Megalithic Sites in Britain. Clarendon Press, Oxford.</li><li>Kendall, D. G. (1974). Hunting quanta. Philosophical Transactions of the Royal Society of London A 276(1257): 231–266. <a href="https://doi.org/10.1098/rsta.1974.0020" target="_blank" rel="noopener">doi:10.1098/rsta.1974.0020</a></li><li>Heggie, D. C. (1981). Megalithic Science: Ancient Mathematics and Astronomy in Northwest Europe. Thames &amp; Hudson, London.</li><li>Ruggles, C. (1999). Astronomy in Prehistoric Britain and Ireland. Yale University Press, New Haven.</li><li>Taylor, J. (1859). The Great Pyramid: Why Was It Built, and Who Built It? Longman, London.</li><li>Smyth, C. P. (1864). Our Inheritance in the Great Pyramid. Alexander Strahan, London.</li><li>Tompkins, P. (1971). Secrets of the Great Pyramid, with an appendix by L. C. Stecchini. Harper &amp; Row, New York.</li><li>Hancock, G. (1995). Fingerprints of the Gods. Heinemann, London.</li><li>Michell, J. (1988). The Dimensions of Paradise. Thames &amp; Hudson, London.</li><li>Carlson, R. (2018). The Great Pyramid Decoded: Part 1. Sacred Geometry International, 31 July 2018 (lecture transcript from Cosmic Patterns and Cycles of Catastrophe).</li><li>Carlson, R. Kosmographia podcast, episode #010 &#x27;Precession, Cosmic Numbers and Cycles&#x27;. randallcarlson.com.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-sacred-metrology" data-t="Sacred Measures: Is the Earth Built Into the Pyramid?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Sacred Measures: Is the Earth Built Into the Pyramid?</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-sacred-metrology</span> (updated 28 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-plasma-petroglyphs-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Petroglyphs Newspaper Rock Utah USA.JPG" data-cap="Rock-art sites worldwide; Petroglyph National Monument, New Mexico, USA" data-big><figcaption></figcaption></figure><div class="sh-k">Sky Watchers</div><h2 class="sh-t" id="case-plasma-petroglyphs-st" tabindex="-1">Thunder Beings: Did Rock Art Record a Plasma Sky?</h2><p class="sh-s">A Los Alamos plasma physicist saw his laboratory instabilities carved on rocks worldwide. Did our ancestors watch the sky catch fire?</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> Prehistoric rock art around the world records one or more real, extremely intense aurorae in which a glowing plasma column stood in the sky.</p></div><p class="v4-q">Do prehistoric petroglyphs record a real, extreme plasma display in the sky?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>A plasma physicist noticed that some rock carvings look like the shapes a squeezed plasma column makes in the lab.</li><li>He proposed a prehistoric aurora far stronger than any in memory, with a glowing column standing in the sky.</li><li>The physics is real, and tree rings record extreme solar storms in the past.</li><li>But the case rests on resemblance, the carvings spread across millennia, and no isotope record shows a sustained monster solar wind.</li><li>Possible in principle; awaiting evidence in fact.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Physics</span><span class="thr">Astronomy</span><span class="thr">Archaeology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="84" >84</b><span class="ctr-u"> types</span></div><div class="ctr-l">abstract motif types Peratt&#x27;s team classified</div><div class="ctr-c">Peratt et al. 2007</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="139" >139</b><span class="ctr-u"> countries</span></div><div class="ctr-l">where the team reports compiling rock-art data</div><div class="ctr-c">Peratt et al. 2007</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="24000" >24,000</b><span class="ctr-u"> carvings</span></div><div class="ctr-l">at Petroglyph National Monument, most made 1300–1680s CE</div><div class="ctr-c">National Park Service</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="9" >9</b><span class="ctr-u"> storms</span></div><div class="ctr-l">extreme solar particle events known from the last 15,000 years</div><div class="ctr-c">Bard et al. 2023</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Prehistoric rock art around the world records one or more real, extremely intense aurorae in which a glowing plasma column stood in the sky.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The physics is real and the Sun can produce storms far bigger than any in modern memory, so an extraordinary aurora in prehistory is possible. But the case rests on visual resemblance between simple shapes and lab images, the prediction that motifs cluster in a few short windows has not been tested with direct dates, the best-dated corpora spread across millennia, and no isotope record of a sustained ten- to hundredfold solar wind has been reported. The separate claim that ancient builders used plasma as a technology has no physical evidence behind it.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 3 of 6, leaning one way"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>leaning one way</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks are fairly candid that the meaning of most abstract rock art is unknown, though some present the entoptic model with more confidence than its evidence supports. They rarely mention the sky as a subject, and the tree-ring discovery of extreme solar storms since 2012 has not reached them. Here the standard account is about right on meaning and slightly underconfident about how violent the ancient sky could be.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>In 2003 Anthony Peratt, a plasma physicist at Los Alamos National Laboratory, published a peer-reviewed paper in IEEE Transactions on Plasma Science comparing petroglyph shapes with images of high-current Z-pinch instabilities, and proposed an intense prehistoric aurora driven by a solar wind one to two orders of magnitude stronger than today&#x27;s.<small>Peratt 2003</small></li><li>Z-pinch instabilities are real, well-studied laboratory physics: a strong current squeezes its own plasma column, which breaks into stacked rings (&#x27;sausage&#x27; instability) and twists (&#x27;kink&#x27; instability).<small>Peratt 1992; Peratt 2003</small></li><li>Tree rings record sudden extreme solar particle storms in 774 and 993 CE and in 7176 and 5259 BCE, and a candidate event about 14,300 years ago roughly twice the size of 774 CE; nine such events are now known from the last 15,000 years.<small>Miyake et al. 2012; Brehm et al. 2022; Bard et al. 2023</small></li><li>People did write down aurorae: the earliest candidate written records come from Assyrian astrological reports of the 7th century BCE.<small>Hayakawa et al. 2019</small></li><li>At Petroglyph National Monument, New Mexico, one of the sites Peratt&#x27;s team cites, the National Park Service dates most of some 24,000 carvings to between 1300 and the 1680s CE, with the earliest around 2000 BCE.<small>National Park Service</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the resemblance between petroglyphs and plasma images is meaningful, or the product of simple forms (stick figures, rings, ladders, dots) that carvers anywhere would produce.</li><li>Whether the reported pattern of sites with a clear view toward the southern sky is real; it has not been tested by an independent team with a control sample.</li><li>What the &#x27;squatter man&#x27; motif shows: a plasma column, a human figure in a ritual pose, or, on one Iranian panel, a praying mantis.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Most petroglyphs cannot be dated directly, so it is hard to test whether the &#x27;plasma&#x27; motifs cluster in a few short windows as the hypothesis predicts.</li><li>The communities who made most early rock art are gone, and with them the stories that explained the images.</li><li>A glowing sky leaves no scar on the ground; its only physical traces would be isotopes in tree rings and ice, and the record thins out before about 12,000 years ago.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Rock-art specialists read most abstract motifs as products of local traditions: clan and ritual symbols, human and animal figures, maps, calendars and, in the influential entoptic model, forms seen in altered states of consciousness. They note that stick figures, circles and ladders are among the simplest shapes a person can carve, so resemblance to lab images is expected by chance. Dating is their strongest objection: well-dated corpora spread over thousands of years instead of clustering in a few short episodes. Peratt&#x27;s work appeared in a physics journal and has had little engagement from archaeologists, which is a fair criticism of both sides: the idea has been ignored more than tested.</p><ul><li>Simple shapes recur worldwide because human hands and eyes are the same everywhere.</li><li>Where petroglyphs are dated, they span millennia; at Petroglyph National Monument most are from 1300–1680s CE.</li><li>No tree-ring or ice-core signal of a sustained, ten- to hundredfold solar wind has been reported.</li><li>Rock art can record sky events (a comet, an eclipse, perhaps the supernova of 1054 CE), so the question is reasonable in principle.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Anthony Peratt, a student of the Nobel laureate Hannes Alfvén, argues that rock carvers worldwide drew what they saw: an aurora so intense that it formed a towering, glowing plasma column whose instabilities produced rings, ladders, stacked figures and the &#x27;squatter man&#x27;. With the linguist Marinus Anthony van der Sluijs he links this to myths of cosmic serpents, sky pillars and beings of thunder. The Electric Universe writers David Talbott and Wal Thornhill push further, reading many myths as memories of electrical events in the sky. Tyler Engle, the engineer and music producer behind Bass Forge, puts plasma at the centre of his account of the ancient world, adding that builders manipulated plasma as a technology.</p><ul><li>The same few abstract forms appear on every inhabited continent.</li><li>The forms match specific, published plasma instability images, not just generic shapes.</li><li>Peratt&#x27;s team reports that the sites share a clear view toward the southern sky, where the column would have stood.</li><li>Tree rings show the Sun can produce storms far beyond anything seen since 1859.</li></ul><div class="face-s"><b>Its strongest point</b><p>The Sun has produced storms far larger than any in the instrumental era, recorded in tree rings. People who saw such a sky would surely have drawn it, and the shapes Peratt catalogues match specific plasma forms he knows from the laboratory.</p></div><p class="face-cr"><b>Credit</b> Tyler Engle (Bass Forge; The Joe Rogan Experience #2558, September 2026); Anthony L. Peratt and Marinus Anthony van der Sluijs; David Talbott and Wal Thornhill (the Electric Universe)</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Direct dating of a large, random sample of the &#x27;plasma&#x27; motifs to test whether they cluster in one to three short windows between 10,000 and 3,000 BCE.</li><li>A radionuclide signal (carbon-14, beryllium-10, chlorine-36) in tree rings and ice cores for a sustained extreme solar event matching those windows.</li><li>A blind test: independent coders classify motifs without knowing the hypothesis, and sites with and without a southern horizon are compared.</li><li>For the technology claim: a published, replicated analysis of microspherules inside megalithic stone, compared with control samples of the same rock.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">6 min read · 1,362 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Thunder Beings: Did Rock Art Record a Plasma Sky?"><button type="button" class="wtoc-i" data-go="plasma-petroglyphs-s1">A physicist looks at a rock</button><button type="button" class="wtoc-i" data-go="plasma-petroglyphs-s2">What Peratt actually claimed</button><button type="button" class="wtoc-i" data-go="plasma-petroglyphs-s3">The Sun can do more than we thought</button><button type="button" class="wtoc-i" data-go="plasma-petroglyphs-s4">Why rock-art specialists are unconvinced</button><button type="button" class="wtoc-i" data-go="plasma-petroglyphs-s5">Bass Forge and the thunder beings</button><button type="button" class="wtoc-i" data-go="plasma-petroglyphs-s6">What time has erased</button><button type="button" class="wtoc-i" data-go="plasma-petroglyphs-s7">What would settle it</button></nav></div><section class="wsec" id="plasma-petroglyphs-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A physicist looks at a rock</h3><p>Anthony Peratt spent his career on some of the most violent physics humans make. Trained under the Swedish Nobel laureate Hannes Alfvén, he worked at Lawrence Livermore and then Los Alamos National Laboratory, simulating and photographing plasma columns carrying enormous electric currents. Those columns do not stay neat. They pinch into stacks of glowing rings, bend, twist and throw off filaments.</p><p>Then, by his account, he saw the same shapes somewhere unexpected: pecked into rock by people thousands of years ago. Stacked rings. Ladders. Circles with dots. And a strange stick figure with arms and legs bent up and down, flanked by dots, known in rock-art circles as the &#x27;squatter man&#x27;.</p><blockquote class="wpull"><p>What if the oldest art on Earth is not a mind looking inward, but eyes looking up at a sky on fire?</p></blockquote><p>The question he raised is exactly the kind this site loves: bold, testable, and anchored in real physics. It is also central to the world of Bass Forge, where plasma sits at the heart of how the ancient world is explained.</p></section><section class="wsec" id="plasma-petroglyphs-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What Peratt actually claimed</h3><p>Peratt&#x27;s paper appeared in December 2003 in IEEE Transactions on Plasma Science, a mainstream physics journal. It set images from high-current Z-pinch experiments beside petroglyphs and concluded that a great many archaic carvings can be classified by plasma stability and instability types. Because the same types recur worldwide, he suggested an intense aurora of the kind that might occur if the solar wind had increased by one to two orders of magnitude, millennia ago.</p><figure class="wx wx--steps" id="plasma-petroglyphs-f1" data-n="4"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">From plasma column to &#x27;squatter man&#x27;</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="From plasma column to &#x27;squatter man&#x27;"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" class="wx-svg" role="img" aria-labelledby="plasma-petroglyphs-f1-t"><title id="plasma-petroglyphs-f1-t">From a plasma column to the carved squatter man motif, in four steps</title><text x="24" y="28" class="wx-t-cap">The sky, as Peratt proposes</text><text x="490" y="28" class="wx-t-cap">The rock</text><rect x="24" y="44" width="444" height="352" rx="10" class="wx-sky"/><line x1="24" y1="396" x2="468" y2="396" class="wx-bold"/><rect x="24" y="396" width="444" height="14" class="wx-soil wx-o60"/><g><circle cx="40" cy="368" r="4.5" class="wx-inkfill"/><line x1="40" y1="373" x2="40" y2="384" class="wx-line"/><line x1="40" y1="384" x2="35" y2="395" class="wx-line"/><line x1="40" y1="384" x2="45" y2="395" class="wx-line"/><line x1="40" y1="376" x2="48" y2="370" class="wx-line"/></g><g class="wx-st" data-s="1"><rect x="78" y="80" width="24" height="316" rx="12" class="wx-glow wx-o60"/><line x1="90" y1="88" x2="90" y2="390" class="wx-hl"/><circle cx="90" cy="432" r="9" class="wx-num"/><text x="90" y="436" text-anchor="middle" class="wx-numt">1</text><text x="90" y="460" text-anchor="middle" class="wx-t-b">current column</text><text x="90" y="476" text-anchor="middle" class="wx-t-s">glowing plasma</text></g><g class="wx-st" data-s="2"><line x1="240" y1="84" x2="240" y2="392" class="wx-thin"/><ellipse cx="240" cy="108" rx="36" ry="10" class="wx-glow wx-o60 wx-edge-soft"/><ellipse cx="240" cy="152" rx="36" ry="10" class="wx-glow wx-o60 wx-edge-soft"/><ellipse cx="240" cy="196" rx="36" ry="10" class="wx-glow wx-o60 wx-edge-soft"/><ellipse cx="240" cy="240" rx="36" ry="10" class="wx-glow wx-o60 wx-edge-soft"/><ellipse cx="240" cy="284" rx="36" ry="10" class="wx-glow wx-o60 wx-edge-soft"/><ellipse cx="240" cy="328" rx="36" ry="10" class="wx-glow wx-o60 wx-edge-soft"/><ellipse cx="240" cy="372" rx="36" ry="10" class="wx-glow wx-o60 wx-edge-soft"/><circle cx="240" cy="432" r="9" class="wx-num"/><text x="240" y="436" text-anchor="middle" class="wx-numt">2</text><text x="240" y="460" text-anchor="middle" class="wx-t-b">pinched into rings</text><text x="240" y="476" text-anchor="middle" class="wx-t-s">'sausage' instability</text></g><g class="wx-st" data-s="3"><line x1="390" y1="114" x2="390" y2="386" class="wx-hl"/><circle cx="390" cy="100" r="13" class="wx-glow wx-o60 wx-edge-soft"/><path d="M336,126 C336,188 444,188 444,126" class="wx-bold wx-s1"/><path d="M350,152 C350,196 430,196 430,152" class="wx-line wx-s1"/><ellipse cx="390" cy="246" rx="38" ry="10" class="wx-glow wx-o60 wx-edge-soft"/><path d="M350,336 C350,292 430,292 430,336" class="wx-line wx-s1"/><path d="M336,370 C336,306 444,306 444,370" class="wx-bold wx-s1"/><circle cx="322" cy="246" r="6.5" class="wx-c1"/><circle cx="456" cy="246" r="6.5" class="wx-c1"/><circle cx="390" cy="432" r="9" class="wx-num"/><text x="390" y="436" text-anchor="middle" class="wx-numt">3</text><text x="390" y="460" text-anchor="middle" class="wx-t-b">rings bend</text><text x="390" y="476" text-anchor="middle" class="wx-t-s">upper up, lower down</text></g><g class="wx-st" data-s="4"><rect x="490" y="44" width="206" height="300" rx="26" class="wx-rock wx-o60 wx-edge-soft"/><circle cx="593" cy="112" r="11" class="wx-bold"/><line x1="593" y1="123" x2="593" y2="266" class="wx-bold"/><polyline points="548,128 548,176 638,176 638,128" class="wx-bold"/><polyline points="548,312 548,266 638,266 638,312" class="wx-bold"/><circle cx="518" cy="222" r="6.5" class="wx-inkfill"/><circle cx="668" cy="222" r="6.5" class="wx-inkfill"/><circle cx="593" cy="432" r="9" class="wx-num"/><text x="593" y="436" text-anchor="middle" class="wx-numt">4</text><text x="490" y="366" class="wx-t-b">the carved 'squatter man'</text><text x="490" y="384" class="wx-t-s">rival readings: a human figure</text><text x="490" y="398" class="wx-t-s">in a ritual pose, or (on one</text><text x="490" y="412" class="wx-t-s">Iranian panel) a praying mantis</text></g><text x="24" y="496" class="wx-t-s">Schematic, after Peratt 2003; not to scale. The carvings have not been dated to the proposed episodes.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 4.</b> Peratt&#x27;s premise: in an extreme aurora, current flows in a plasma column visible from the ground.</p><ol class="wx-steplist"><li>Peratt&#x27;s premise: in an extreme aurora, current flows in a plasma column visible from the ground.</li><li>The column&#x27;s own magnetic field pinches it into a stack of glowing rings (the &#x27;sausage&#x27; instability).</li><li>The rings bend, upper ones up and lower ones down, giving the outline Peratt matched to the &#x27;squatter man&#x27;.</li><li>The carved motif. Rival readings: a human figure in a ritual pose, or, on one Iranian panel, a praying mantis.</li></ol><figcaption>Peratt&#x27;s proposed link between a laboratory Z-pinch instability and a carved motif, in four steps. Shapes are schematic, after Peratt 2003. <span class="wx-src">Based on: Shapes schematic after Peratt 2003 and Peratt et al. 2007; alternative reading from Kolnegari et al. 2020. Not to scale.</span></figcaption><p class="vh">Two panels. On the left, a pale sky above a ground line with a small observer. Step 1 shows a straight glowing column of plasma rising from the horizon. Step 2 shows the column pinched into a stack of seven rings. Step 3 shows the rings bent: the upper ones curve upward like raised arms, the lower ones curve downward like bent legs, with a dot on each side, the outline Peratt matched to the squatter man. Step 4 adds, on the right, a grey rock panel with a carved stick figure: a head, raised bent arms, bent legs and two dots, labelled with the rival readings of a human figure or a praying mantis.</p></figure><p>A second paper in 2007, with co-authors including the Hopi engineer and artist Alfred Qöyawayma and the linguist Marinus Anthony van der Sluijs, went further. The team reports compiling rock-art data from 139 countries, sorting abstract images into 84 types, and finding that the sites share a field of view toward the southern sky. In a 2010 article for the Penn Museum&#x27;s Expedition magazine, van der Sluijs and Peratt proposed three episodes of this auroral activity between roughly 10,000 and 3,000 BCE, and acknowledged that there is no scientific proof such an event ever happened.</p><aside class="wcall"><b>How do we know?</b><p>A Z-pinch is a column of plasma carrying a strong current along its length. The current makes a magnetic field that squeezes the column inward. The squeeze is unstable: the column necks into a string of rings like sausages, or kinks sideways into a corkscrew. Physicists have photographed these forms in laboratories since the 1950s, and Peratt modelled them on supercomputers. The shapes are real; the question is whether the sky ever made one big enough to see from the ground.</p></aside></section><section class="wsec" id="plasma-petroglyphs-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The Sun can do more than we thought</h3><p>The strongest support for taking the idea seriously comes from a field that barely existed in 2003. In 2012 Fusa Miyake and colleagues found a sudden spike of carbon-14 in Japanese cedar rings from 774 CE, the fingerprint of an enormous burst of solar particles. More followed: 993 CE, then 7176 and 5259 BCE. In 2023 Edouard Bard&#x27;s team reported a candidate spike in subfossil pines from the French Alps about 14,300 years ago, roughly twice the 774 CE event and an order of magnitude beyond the 1859 Carrington storm, whose aurorae were seen far south of their usual range. That candidate has not yet been confirmed in wood from other regions.</p><figure class="wx wx--static" id="plasma-petroglyphs-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">The sky record and the rock record</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The sky record and the rock record"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" class="wx-svg" role="img" aria-labelledby="plasma-petroglyphs-f2-t"><title id="plasma-petroglyphs-f2-t">Timeline comparing the proposed aurora episodes with tree-ring solar storms, written aurora records and dated petroglyphs</title><text x="24" y="28" class="wx-t-cap">15,000 years of sky and rock, linear scale</text><g><line x1="170" y1="44" x2="170" y2="424" class="wx-guide"/><line x1="473.3" y1="44" x2="473.3" y2="424" class="wx-guide"/></g><text x="40" y="62" class="wx-t-b">Proposed: episodes of intense aurora and carving</text><rect x="170" y="72" width="303.3" height="28" rx="4" class="wx-accfill wx-o20 wx-growx" style="--d:1"/><rect x="170" y="72" width="303.3" height="28" rx="4" class="wx-dash"/><text x="321.7" y="91" text-anchor="middle" class="wx-t">c. 10,000–3,000 BCE</text><text x="483" y="91" class="wx-t-s">three episodes,</text><text x="483" y="104" class="wx-t-s">dates not fixed</text><text x="40" y="140" class="wx-t-b">Extreme solar particle storms found in tree rings</text><line x1="40" y1="164" x2="690" y2="164" class="wx-thin wx-o40"/><circle cx="68.2" cy="164" r="7" class="wx-card wx-dash wx-pop" style="--d:2"/><circle cx="292.4" cy="164" r="7" class="wx-c4 wx-pop" style="--d:3"/><circle cx="375.4" cy="164" r="7" class="wx-c4 wx-pop" style="--d:4"/><circle cx="636.9" cy="164" r="7" class="wx-c4 wx-pop" style="--d:5"/><circle cx="646.4" cy="164" r="7" class="wx-c4 wx-pop" style="--d:5"/><text x="54" y="190" class="wx-t-s">c. 12,350 BCE</text><text x="54" y="203" class="wx-t-s">candidate, largest</text><text x="292.4" y="190" text-anchor="middle" class="wx-t-s">7176 BCE</text><text x="375.4" y="190" text-anchor="middle" class="wx-t-s">5259 BCE</text><text x="690" y="190" text-anchor="end" class="wx-t-s">774 and 993 CE</text><text x="40" y="240" class="wx-t-b">Written aurora records</text><rect x="573.9" y="250" width="116.1" height="16" rx="3" class="wx-c2 wx-o80 wx-growx" style="--d:6"/><text x="563" y="262" text-anchor="end" class="wx-t-s">from Assyrian reports, 7th century BCE</text><text x="40" y="306" class="wx-t-b">Petroglyph National Monument, New Mexico</text><rect x="516.7" y="316" width="143" height="16" rx="3" class="wx-stone2 wx-o60 wx-growx" style="--d:7"/><rect x="659.7" y="312" width="16.4" height="24" rx="2" class="wx-c1 wx-grow" style="--d:9"/><text x="506" y="328" text-anchor="end" class="wx-t-s">earliest carvings c. 2000 BCE</text><line x1="668" y1="340" x2="668" y2="352" class="wx-thin"/><text x="690" y="365" text-anchor="end" class="wx-t-s">most of c. 24,000 carvings: 1300–1680s CE</text><text x="40" y="394" class="wx-t-b">Instrumental era</text><circle cx="683.9" cy="390" r="5" class="wx-inkfill wx-pop" style="--d:10"/><circle cx="691" cy="402" r="4" class="wx-inkfill wx-pop" style="--d:10"/><text x="672" y="394" text-anchor="end" class="wx-t-s">Carrington 1859, May 2024</text><line x1="40" y1="430" x2="690" y2="430" class="wx-line"/><g><line x1="83.3" y1="430" x2="83.3" y2="437" class="wx-line"/><line x1="170" y1="430" x2="170" y2="437" class="wx-line"/><line x1="256.7" y1="430" x2="256.7" y2="437" class="wx-line"/><line x1="343.3" y1="430" x2="343.3" y2="437" class="wx-line"/><line x1="430" y1="430" x2="430" y2="437" class="wx-line"/><line x1="516.7" y1="430" x2="516.7" y2="437" class="wx-line"/><line x1="603.3" y1="430" x2="603.3" y2="437" class="wx-line"/><line x1="690" y1="430" x2="690" y2="437" class="wx-line"/></g><text x="83.3" y="452" text-anchor="middle" class="wx-t-s">12,000 BCE</text><text x="170" y="452" text-anchor="middle" class="wx-t-s">10,000</text><text x="256.7" y="452" text-anchor="middle" class="wx-t-s">8000</text><text x="343.3" y="452" text-anchor="middle" class="wx-t-s">6000</text><text x="430" y="452" text-anchor="middle" class="wx-t-s">4000</text><text x="516.7" y="452" text-anchor="middle" class="wx-t-s">2000 BCE</text><text x="603.3" y="452" text-anchor="middle" class="wx-t-s">1 CE</text><text x="690" y="452" text-anchor="middle" class="wx-t-s">2000</text><text x="24" y="484" class="wx-t-s">Dashed = proposed or unconfirmed. Nine extreme solar storms are known from the last 15,000 years; the best dated are shown.</text></svg></div></div><figcaption>Peratt and van der Sluijs&#x27;s proposed window compared with extreme solar storms found in tree rings, written aurora records, and the dates of one of their cited petroglyph sites. <span class="wx-src">Based on: Van der Sluijs and Peratt 2010; Miyake et al. 2012; Brehm et al. 2022; Bard et al. 2023; Hayakawa et al. 2019; National Park Service. Linear time scale.</span></figcaption><p class="vh">A horizontal timeline from 13,000 BCE to 2000 CE. The top row shows a dashed box from 10,000 to 3,000 BCE for the proposed episodes of intense aurora and carving. The second row shows dots for extreme solar particle storms found in tree rings: a dashed candidate about 12,350 BCE, then 7176 BCE, 5259 BCE, and 774 and 993 CE. The third row shows written aurora records from the 7th century BCE to today. The fourth row shows Petroglyph National Monument: a thin bar from about 2000 BCE and a dense bar from 1300 to the 1680s CE, where most carvings fall. The bottom row marks the 1859 and 2024 storms.</p></figure><aside class="wcall"><b>Fresh from the field</b><p>In May 2024 the strongest geomagnetic storm in over twenty years painted aurorae across skies where they are almost never seen, far into the middle latitudes. It was tiny beside the tree-ring superstorms. Meanwhile the ancient record keeps growing: nine extreme solar particle events are now known from the last 15,000 years, each pinned to a single year.</p></aside><p>People certainly watched aurorae and wrote them down. The earliest candidate written records are Assyrian astrological reports from the 7th century BCE. And rock art can record sky events: a painted star, crescent and hand at Peñasco Blanco in Chaco Canyon is often read as the supernova of 1054 CE. So the question is legitimate. The problem lies in the evidence offered for this particular answer.</p></section><section class="wsec" id="plasma-petroglyphs-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Why rock-art specialists are unconvinced</h3><p>The first objection is the shapes themselves. A stick figure, a ring, a ladder, a spiral and a row of dots are among the simplest marks a hand can make. If you gather thousands of motifs from 139 countries and sort them into 84 types, some will resemble a given set of lab photographs whether or not there is a connection. The squatter man is a good test case. In 2020 an entomologist-led team argued that one Iranian example, with its raised, bent limbs, looks remarkably like a praying mantis.</p><p>The second objection is time. If carvers were recording a few episodes of sky fire between 10,000 and 3,000 BCE, the relevant motifs should cluster in those windows. Where rock art can be dated, it tends to spread over thousands of years. At Petroglyph National Monument in New Mexico, a site Peratt&#x27;s team cites, the National Park Service dates most of some 24,000 carvings to between 1300 and the 1680s CE, with the earliest around 2000 BCE. Those carvers lived long after any proposed episode.</p><p>The third is physics outside the laboratory. A solar wind ten to a hundred times stronger for long enough to be watched and drawn should leave traces in the isotope archives that captured the Miyake events. None has been reported. Archaeologists have mostly answered with silence rather than a test, which is not ideal: the idea was published in a respectable journal and makes predictions that could be checked.</p></section><section class="wsec" id="plasma-petroglyphs-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Bass Forge and the thunder beings</h3><p>Tyler Engle, the computer-trained engineer and electronic-music producer behind Bass Forge, argues that ancient monuments and myths were not symbolic in the modern sense but, in the words of his CPAK presenter page, &quot;functional systems designed to encode knowledge about perception, energy, and the nature of the universe itself.&quot; Plasma is central to that vision. On The Joe Rogan Experience #2558 he reportedly described ancient technology as manipulating plasma through matter in a symmetrical, geometric way, and pointed to microspherules, tiny glassy beads that form when material melts and cools fast, reported inside megalithic stone at Baalbek and elsewhere at far higher density than in meteorites.</p><p>He is not alone. The Electric Universe writers David Talbott and Wal Thornhill read world mythology as a memory of electrical events in a crowded sky. Many peoples tell of beings of thunder and lightning, such as the Wakinyan, the Thunder Beings of Lakota tradition, and of serpents and pillars reaching into heaven. To a plasma physicist, that looks like testimony.</p><blockquote class="wpull"><p>The sky has been more violent than any living person has seen. The open question is whether anyone drew it.</p></blockquote><p>The technology claim is weaker than the sky claim. Microspherules are everywhere: cosmic dust delivers tens of thousands of tonnes of extraterrestrial material to Earth each year, and furnaces, fires, volcanoes and lightning make them too. The figures Engle gave on air come from privately analysed samples that have not been published for others to check. The same debate over spherules runs through the Younger Dryas impact case.</p></section><section class="wsec" id="plasma-petroglyphs-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What time has erased</h3><p>Almost everything that would decide this case is fragile. A glowing sky leaves no crater. The stories that explained the carvings died with the people who told them, and many panels have been quarried, flooded or vandalised. Most petroglyphs lack organic material to date, so their ages rest on style, weathering and context. And the isotope record that caught the Miyake storms becomes coarser the further back it goes. The absence of evidence here is partly the absence of looking, and partly the absence of anything that could survive.</p></section><section class="wsec" id="plasma-petroglyphs-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle it</h3><p>Peratt&#x27;s hypothesis is better than most bold ideas because it makes predictions. Date a large, random sample of the &#x27;plasma&#x27; motifs directly and see whether they bunch into short windows. Search tree rings and ice cores across 10,000 to 3,000 BCE for the signature of a long, extreme solar outburst. Have coders who do not know the hypothesis classify the motifs, and compare sites with and without a view of the southern sky. For the technology claim, publish the microspherule analyses with controls. Until then, the verdict is simple: a real physicist asked a real question, the Sun turned out to be wilder than we knew, and the rock art has not yet answered.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">1859 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Carrington storm: aurorae far south of their usual range</span></li><li class="wtl-study" style="--i:1"><span class="wtl-y">2003 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Peratt&#x27;s Z-pinch aurora paper in IEEE Transactions on Plasma Science</span></li><li class="wtl-study" style="--i:2"><span class="wtl-y">2007 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Part II: directionality and source</span></li><li class="wtl-find" style="--i:3"><span class="wtl-y">2012 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Miyake finds the 774 CE solar storm in tree rings</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">2020 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Iranian &#x27;squatter man&#x27; panel read as a praying mantis</span></li><li class="wtl-find" style="--i:5"><span class="wtl-y">2022 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Storms of 7176 and 5259 BCE found in tree rings</span></li><li class="wtl-find" style="--i:6"><span class="wtl-y">2023 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Candidate storm c. 14,300 years ago, largest yet</span></li><li class="wtl-event" style="--i:7"><span class="wtl-y">2024 CE</span><span class="wtl-k">Event</span><span class="wtl-t">May 2024 storm brings aurorae to low latitudes</span></li><li class="wtl-event" style="--i:8"><span class="wtl-y">2026 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Tyler Engle on The Joe Rogan Experience #2558</span></li></ol><details class="srcs"><summary>Sources for this case (14)</summary><ol><li>Peratt, A. L. (2003). Characteristics for the occurrence of a high-current, Z-pinch aurora as recorded in antiquity. IEEE Transactions on Plasma Science 31(6): 1192–1214. <a href="https://doi.org/10.1109/TPS.2003.820956" target="_blank" rel="noopener">doi:10.1109/TPS.2003.820956</a></li><li>Peratt, A. L., McGovern, J., Qöyawayma, A. H., Van der Sluijs, M. A. &amp; Peratt, M. G. (2007). Characteristics for the occurrence of a high-current Z-pinch aurora as recorded in antiquity, Part II: Directionality and source. IEEE Transactions on Plasma Science 35(4): 778–802. <a href="https://doi.org/10.1109/TPS.2007.902630" target="_blank" rel="noopener">doi:10.1109/TPS.2007.902630</a></li><li>Van der Sluijs, M. A. &amp; Peratt, A. L. (2010). Searching for rock art evidence for an ancient super aurora. Expedition 52(2). Penn Museum.</li><li>Peratt, A. L. (1992). Physics of the Plasma Universe. New York: Springer.</li><li>Miyake, F., Nagaya, K., Masuda, K. &amp; Nakamura, T. (2012). A signature of cosmic-ray increase in AD 774–775 from tree rings in Japan. Nature 486: 240–242. <a href="https://doi.org/10.1038/nature11123" target="_blank" rel="noopener">doi:10.1038/nature11123</a></li><li>Brehm, N. et al. (2022). Tree-rings reveal two strong solar proton events in 7176 and 5259 BCE. Nature Communications 13: 1196. <a href="https://doi.org/10.1038/s41467-022-28804-9" target="_blank" rel="noopener">doi:10.1038/s41467-022-28804-9</a></li><li>Bard, E., Miramont, C., Capano, M. et al. (2023). Paper reporting a radiocarbon spike about 14,300 years ago in subfossil trees from the Drouzet river, French Alps. Philosophical Transactions of the Royal Society A 381: 20220206. <a href="https://doi.org/10.1098/rsta.2022.0206" target="_blank" rel="noopener">doi:10.1098/rsta.2022.0206</a></li><li>Hayakawa, H. et al. (2019). The earliest candidates of auroral observations in Assyrian astrological reports. The Astrophysical Journal Letters 884: L18.</li><li>Kolnegari, M., Naserifard, M., Hazrati, M. &amp; Shelomi, M. (2020). Squatting (squatter) mantis man: a prehistoric praying mantis petroglyph in Iran. Journal of Orthoptera Research 29(1): 41–44. <a href="https://doi.org/10.3897/jor.29.39400" target="_blank" rel="noopener">doi:10.3897/jor.29.39400</a></li><li>Lewis-Williams, J. D. &amp; Dowson, T. A. (1988). The signs of all times: entoptic phenomena in Upper Palaeolithic art. Current Anthropology 29(2): 201–245. <a href="https://doi.org/10.1086/203629" target="_blank" rel="noopener">doi:10.1086/203629</a></li><li>National Park Service. New Mexico: Petroglyph National Monument (nps.gov/articles/petroglyph.htm).</li><li>Talbott, D. &amp; Thornhill, W. (2005). Thunderbolts of the Gods. Portland: Mikamar.</li><li>CPAK presenter page: Tyler Engle (cpakonline.com/presenters/tyler-engle.html), accessed September 2026.</li><li>The Joe Rogan Experience #2558, Tyler Engle (24 September 2026); episode summary at finance.biggo.com/podcast/504223911cd0b1d7 (third-party write-up).</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-plasma-petroglyphs" data-t="Thunder Beings: Did Rock Art Record a Plasma Sky?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Thunder Beings: Did Rock Art Record a Plasma Sky?</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-plasma-petroglyphs</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-edfu-texts-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="The Pylon at the Temple of Edfu (VII).jpg" data-cap="Temple of Horus, Edfu, Aswan Governorate, Egypt" data-big><figcaption></figcaption></figure><div class="sh-k">Sky Watchers</div><h2 class="sh-t" id="case-edfu-texts-st" tabindex="-1">The Edfu Texts: A Lost Homeland on a Temple Wall?</h2><p class="sh-s">Ptolemaic priests carved the story of a primeval island, its builder gods and its ruin. Some read it as the oldest record of Atlantis.</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> The Edfu Building Texts preserve a historical memory of a lost civilisation: an island homeland destroyed by catastrophe whose survivors brought knowledge to Egypt.</p></div><p class="v4-q">Do the Edfu texts remember a real civilisation older than Egypt?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>The walls of the temple of Horus at Edfu, carved between 237 and 57 BCE, tell how the first temple rose on an island in the primeval waters.</li><li>Some read this as a memory of a real lost homeland destroyed by catastrophe.</li><li>The island, the reeds, the falcon and the mound all belong to Egyptian creation theology found in older sources.</li><li>The carving is more than a century younger than Plato&#x27;s Atlantis story.</li><li>A memory of an older Egyptian cult centre is possible; a lost civilisation is not shown.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Texts and scripts</span><span class="thr">Religion and myth</span><span class="thr">Archaeology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="180" >180</b><span class="ctr-u"> years</span></div><div class="ctr-l">from laying out the temple (237 BCE) to completion (57 BCE)</div><div class="ctr-c">Kurth 2004</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="95" >95</b><span class="ctr-u"> years</span></div><div class="ctr-l">to finish the main temple building (237–142 BCE)</div><div class="ctr-c">Kurth 2004</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="9000" >9,000</b><span class="ctr-u"> years</span></div><div class="ctr-l">before Solon: Plato&#x27;s date for Atlantis, credited to priests at Sais</div><div class="ctr-c">Plato, Timaeus</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The Edfu Building Texts preserve a historical memory of a lost civilisation: an island homeland destroyed by catastrophe whose survivors brought knowledge to Egypt.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The texts are real, extraordinary and older in their ideas than their carving, and their story of a world made, destroyed and rebuilt is genuinely striking. But nothing in them points outside Egypt: the island, reeds, falcon and mound belong to Egyptian creation theology, found in older sources and fitted to Edfu. The stone was carved over a century after Plato wrote. No archaeology shows a lost civilisation behind the story, though a memory of an older Egyptian cult centre, as Reymond proposed, remains possible.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Egyptology presents the Edfu texts confidently as Ptolemaic temple theology, and on the carving and its purpose that confidence is earned. Where it can be too quick is the depth of the ideas: the libraries the priests copied from are lost, so &#x27;Ptolemaic&#x27; dates the inscription, not the tradition. The honest position is that the sources are older and of unknown age, but they show no sign of a foreign or Ice Age homeland.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>The Temple of Horus at Edfu was laid out on day 7 of the month Epeiph in year 10 of Ptolemy III (237 BCE); its own inscriptions record the main temple finished in 142 BCE, and work was completed in 57 BCE under Ptolemy XII.<small>Kurth 2004</small></li><li>Its walls carry one of the largest bodies of hieroglyphic text from ancient Egypt, including &#x27;building texts&#x27; on the temple&#x27;s construction and a mythical account of how the first temples arose on an island in the primeval waters.<small>Reymond 1969; McClain 2011</small></li><li>In that account an island of sand, covered with reeds, emerges from the waters; creator beings called the Shebtiu gather; a falcon god alights on a reed; and sacred domains and the temple itself are founded.<small>McClain 2011</small></li><li>Eve Reymond&#x27;s 1969 study reconstructed a sequence of mythical eras from these records, including an &#x27;Island of the Egg&#x27;, a &#x27;Homeland of the Primeval Ones&#x27;, an attack by an enemy, the death of the first gods and a re-creation.<small>Reymond 1969</small></li><li>Edfu itself was inhabited from the Early Dynastic period, around 3000 BCE, and a small Dynasty 3 pyramid stands at South Edfu; no older settlement has been found there.<small>Tell Edfu Project</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>How old the ideas are: the carving is Ptolemaic, but the priests drew on temple libraries of older books whose age is unknown.</li><li>Whether Reymond&#x27;s sequence of eras is a real narrative in the texts or her own arrangement of scattered, allusive passages.</li><li>Whether any historical memory survives inside the myth: Reymond suggested a predynastic religious centre near Memphis; others read pure theology.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>The temple libraries themselves: the papyri the priests copied from are lost, so the sources behind the inscriptions cannot be dated.</li><li>The Nile valley&#x27;s predynastic and older landscape lies under metres of silt, fields and towns, and much of the Late Pleistocene shoreline of the Mediterranean is now under the sea.</li><li>Many faces and figures on the Edfu reliefs were hacked away after the temple closed, damaging parts of the record.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Egyptologists read the Edfu cosmogony as temple theology: a local version of the Egyptian idea that creation began with a mound rising from the waters, adapted so that Edfu itself becomes the site of first creation and the temple building embodies the primeval island. Late temples synthesised older traditions from their libraries to suit local cults, so the ideas can be older than the carving without describing history. The island image fits the Nile world, where land re-emerged each year as the flood fell, and the primeval hill already appears in the Pyramid Texts of the 24th century BCE. On this reading, the destruction and re-creation are mythic time, not a report of a lost nation.</p><ul><li>Every major temple claimed to stand on the first land of creation; Edfu is one voice in a chorus.</li><li>The boat scenes most visitors see belong to the Triumph of Horus drama, in which Horus defeats Seth, not a migration.</li><li>No archaeology in Egypt shows a complex society before the Neolithic, or foreign settlers bringing one.</li><li>The Edfu Project in Hamburg and Göttingen has been retranslating the inscriptions since 1986, superseding older renderings.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Andrew Collins argued in 1998 that the Shebtiu, falcons, sages and ancestors of the Edfu texts were a real people, &#x27;Elder Gods&#x27; who left Egypt before farming spread in the Near East. Graham Hancock, building on Reymond, reads the texts as describing a sacred island homeland in the ocean destroyed by flood and fire, whose surviving sages sailed away to rebuild the world, and links it to Plato&#x27;s Atlantis and the Younger Dryas. Tyler Engle of Bass Forge reportedly told Joe Rogan the building texts are &#x27;the first records of Atlantis that we have,&#x27; earlier in origin than Plato, showing gods arriving by boat from another land.</p><ul><li>The texts describe a homeland destroyed by catastrophe and a deliberate re-creation by surviving sages and builder gods.</li><li>The Edfu priests said their temple followed a book that came down from the sky north of Memphis.</li><li>Plato said his Atlantis story came from Egyptian priests at Sais, so an Egyptian source for it is expected.</li><li>Myths elsewhere, such as the Mesopotamian apkallu, also credit post-flood sages with bringing civilisation.</li></ul><div class="face-s"><b>Its strongest point</b><p>The Edfu priests said their temple followed a book handed down from the age of the gods, and the story they preserved is not a simple creation myth: a first world is built, destroyed and deliberately rebuilt by survivors. That is what a memory of catastrophe would look like.</p></div><p class="face-cr"><b>Credit</b> Tyler Engle (Bass Forge; The Joe Rogan Experience #2558, September 2026); Graham Hancock (Magicians of the Gods, 2015); Andrew Collins (Gods of Eden, 1998)</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Tracing the island narrative in older papyri or earlier temple inscriptions, to learn how far back its details go.</li><li>A fresh reading of the whole cosmogonical record from the Edfu Project&#x27;s modern translations, testing whether Reymond&#x27;s sequence of eras holds.</li><li>Archaeological evidence of the predynastic cult centre near Memphis that Reymond herself proposed.</li><li>Any Late Pleistocene or early Holocene site in or near Egypt showing monumental building or a complex society.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,144 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Edfu Texts: A Lost Homeland on a Temple Wall?"><button type="button" class="wtoc-i" data-go="edfu-texts-s1">A creation story in sandstone</button><button type="button" class="wtoc-i" data-go="edfu-texts-s2">What the texts say</button><button type="button" class="wtoc-i" data-go="edfu-texts-s3">The Egyptologists&#x27; reading</button><button type="button" class="wtoc-i" data-go="edfu-texts-s4">The lost-homeland case</button><button type="button" class="wtoc-i" data-go="edfu-texts-s5">Where the evidence runs out</button><button type="button" class="wtoc-i" data-go="edfu-texts-s6">What would settle it</button></nav></div><section class="wsec" id="edfu-texts-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A creation story in sandstone</h3><p>The Temple of Horus at Edfu is one of the best preserved temples in Egypt. Its pylon, about 36 metres high, still face
