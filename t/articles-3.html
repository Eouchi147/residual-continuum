375.0" class="wx-paper wx-edge"/><polyline points="353.2,384.9 353.2,375.0 360.0,368.5 366.8,375.0 366.8,384.9" class="wx-hl" style="stroke-dasharray:1.5 2.5"/><line x1="366.8" y1="377.6" x2="474" y2="466" class="wx-thin"/><text x="470" y="470" text-anchor="start" class="wx-t wx-halo">Salt crust = halite</text><text x="470" y="484" text-anchor="start" class="wx-t-s wx-halo">rock salt from the limestone</text><text x="470" y="498" text-anchor="start" class="wx-t-s wx-halo">itself, spreading with visitor</text><text x="470" y="512" text-anchor="start" class="wx-t-s wx-halo">humidity (study of 2022–2024)</text></g><line x1="60.6" y1="560" x2="659.4" y2="560" class="wx-dim"/><text x="360" y="555" text-anchor="middle" class="wx-t-n wx-halo">230.3 m base</text><g><rect x="24" y="570" width="65.0" height="5" class="wx-inkfill"/><rect x="89.0" y="570" width="65.0" height="5" class="wx-paper wx-edge"/><text x="24" y="592" class="wx-t-s">0</text><text x="154.0" y="592" text-anchor="middle" class="wx-t-s">50 m</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> The known interior: passages, the Grand Gallery and three chambers.</p><ol class="wx-steplist"><li>The known interior: passages, the Grand Gallery and three chambers.</li><li>Dunn&#x27;s power plant (1998): chemicals in, resonance in the gallery and granite, a microwave beam out. All proposed.</li><li>Tomb fittings: granite plugs still seal the way up, and a lidless granite sarcophagus stands in the King&#x27;s Chamber.</li><li>Sealed relieving chambers carry work-gang marks naming Khufu; the Queen&#x27;s Chamber shafts never reach the outside.</li><li>The Queen&#x27;s Chamber salt is halite from the limestone, spreading with visitors&#x27; humidity (Sessa et al. 2026).</li></ol><figcaption>The pyramid&#x27;s interior drawn to scale, first as Christopher Dunn&#x27;s power plant, then with what excavators and scientists actually found in each room. <span class="wx-src">Based on: Section after Petrie 1883 as summarised in Lehner 1997 (height 146.6 m, base 230.3 m, King&#x27;s Chamber floor c. 43 m); composite section, chambers not all in one plane. Power plant labels after Dunn 1998. Relieving chamber marks: Vyse 1840–42. Salt: Sessa et al. 2026.</span></figcaption><p class="vh">A north to south section of the Great Pyramid drawn to scale, 230.3 metres wide, with its passages and chambers. Step 1 labels the entrance, the Grand Gallery, the Queen&#x27;s Chamber, the King&#x27;s Chamber and the unfinished subterranean chamber. Step 2 shows Dunn&#x27;s proposed power plant: liquids flowing down the two Queen&#x27;s Chamber shafts to make hydrogen, the Grand Gallery glowing as a resonator, the King&#x27;s Chamber pulsing as a granite resonator, and an arrow for a microwave beam leaving by the south shaft. Step 3 highlights the three granite plugs sealing the ascending passage and the lidless sarcophagus. Step 4 highlights the five relieving chambers where work-gang marks name Khufu, and notes that the Queen&#x27;s Chamber shafts end at small slabs. Step 5 highlights the Queen&#x27;s Chamber walls, whose salt is halite from the limestone itself.</p></figure></section><section class="wsec" id="giza-power-plant-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The power plant at its strongest</h3><p>Dunn&#x27;s model assigns every room a job. Two liquids fed down the Queen&#x27;s Chamber shafts met and released hydrogen, which filled the upper passages. Resonators once mounted in the Grand Gallery&#x27;s side slots turned the ground&#x27;s constant, faint vibration into sound. The King&#x27;s Chamber, a box of granite beams stacked with more above it, rang like a tuned instrument, and because granite is rich in quartz, the vibration would make electricity. A microwave signal fed in through the north shaft was amplified by the energised hydrogen and left through the south shaft as a beam.</p><p>Engle&#x27;s version is gentler. On Rogan&#x27;s show he reportedly described the pyramid as a passive, tuned structure that absorbs energy and sinks it into the ground rather than broadcasting it, and he pointed to crusts of salt on the Queen&#x27;s Chamber walls, reported as calcium sulfate up to an inch thick, as the trace of chemical processes. He also cited Geoffrey Drumm&#x27;s Land of Chem, which reads the pyramids as chemical works making fertiliser.</p><p>The strongest part of the case is not the microwaves but the puzzle it answers. The relieving chambers, the shafts and the Grand Gallery are real, strange and expensive features, and Egyptologists still argue about some of them. Visitors and acoustic engineers alike report that the King&#x27;s Chamber resonates strongly. A tomb, the challengers ask, needs none of this.</p></section><section class="wsec" id="giza-power-plant-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The tomb&#x27;s paperwork</h3><p>Against the machine stands a paper trail that few ancient buildings can match. When Howard Vyse&#x27;s team blasted into the four upper relieving chambers in 1837, they found the blocks covered with red-painted builders&#x27; marks: levelling lines, and the names of work gangs formed from the king&#x27;s name, such as &#x27;The white crown of Khnum-Khufu is powerful&#x27;. Khufu&#x27;s name appears more than a dozen times, in spaces sealed as soon as the next beams went on.</p><aside class="wcall"><b>How do we know the marks are genuine?</b><p>The author Zecharia Sitchin argued in 1980 that Vyse forged the cartouches. Egyptologists answer that the marks are quarry and gang marks of a kind found at other Old Kingdom sites, that many run into joints and onto faces hidden when the blocks were set, and that they fit the gang-naming practices of Khufu&#x27;s time. Since 2013 an independent source has confirmed the link: Merer&#x27;s logbook, written by a man who delivered stone to the pyramid.</p></aside><p>Those papyri, found by Pierre Tallet&#x27;s team at Wadi al-Jarf on the Red Sea, record a crew of about 40 men shipping white limestone from the Tura quarries to &#x27;Akhet-Khufu&#x27;, the Horizon of Khufu, late in the king&#x27;s reign. Near the pyramids, Mark Lehner&#x27;s excavations at Heit el-Ghurab uncovered the town that fed the workforce, with bakeries and long galleries, and the builders&#x27; own tombs lie on the slope above. Radiocarbon dates on the pyramid&#x27;s mortar fall in the Old Kingdom, within a couple of centuries of the historical date.</p><figure class="wx wx--static" id="giza-power-plant-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">The paper trail of a king&#x27;s tomb</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The paper trail of a king&#x27;s tomb"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" class="wx-svg" role="img" aria-labelledby="giza-power-plant-f2-t"><title id="giza-power-plant-f2-t">Map of Egypt showing where the written and physical evidence for Khufu's pyramid project was found: Giza, the Tura quarries, the harbour of Wadi al-Jarf and the Aswan granite quarries</title><text x="24" y="26" class="wx-t-cap">The paper trail of a king's tomb</text><rect x="30.0" y="40.0" width="359.6" height="560.0" class="wx-sand wx-o60"/><polygon points="30.0,40.0 389.6,40.0 389.6,61.0 305.3,62.4 247.0,75.0 203.6,68.0 185.0,63.8 154.0,45.6 104.4,50.5 68.4,54.0 36.2,68.0 30.0,71.5" class="wx-water"/><polygon points="200.5,154.1 188.1,180.0 206.7,214.3 233.4,266.8 256.3,295.5 278.6,343.8 286.7,379.5 307.8,425.0 345.6,497.1 374.1,558.0 389.6,600.0 389.6,327.0 364.8,292.0 340.0,250.0 352.4,184.9 346.2,187.7 331.3,219.9 322.0,257.0 310.9,299.0 305.9,310.9 266.8,275.2 234.6,219.2 209.8,180.0 201.7,154.1" class="wx-water"/><text x="346.2" y="418.0" text-anchor="middle" class="wx-t-cap">Red Sea</text><text x="265.6" y="54.5" text-anchor="middle" class="wx-t-cap">Mediterranean</text><text x="290.4" y="222.0" text-anchor="middle" class="wx-t-cap">Sinai</text><polyline points="222.2,565.7 225.3,539.1 220.3,503.4 200.5,481.7 206.1,453.7 211.0,420.8 181.3,428.5 147.2,392.8 115.6,349.4 88.9,285.0 110.6,217.1 119.3,148.5" class="wx-line wx-s2 wx-draw" pathLength="1" style="stroke-width:2.6;--d:1"/><polyline points="119.3,148.5 98.2,110.0 68.4,54.0" class="wx-line wx-s2" style="stroke-width:1.6"/><polyline points="119.3,148.5 129.2,103.0 154.6,52.6" class="wx-line wx-s2" style="stroke-width:1.6"/><text x="131.0" y="341.0" class="wx-t-s wx-halo">Nile</text><circle cx="112.5" cy="153.4" r="5" class="wx-accfill wx-edge wx-pop" style="--d:3"/><circle cx="121.8" cy="156.9" r="4" class="wx-accfill wx-edge wx-pop" style="--d:5"/><circle cx="206.7" cy="229.0" r="5" class="wx-accfill wx-edge wx-pop" style="--d:7"/><circle cx="222.2" cy="565.7" r="5" class="wx-accfill wx-edge wx-pop" style="--d:9"/><g class="wx-pop" style="--d:4"><polyline points="118.5,153.4 428,60" class="wx-thin"/><text x="440" y="64" class="wx-t-b">Giza: the pyramid, Akhet-Khufu</text><text x="440" y="81" class="wx-t-s">Relieving chambers: work-gang marks</text><text x="440" y="95" class="wx-t-s">naming Khufu. Heit el-Ghurab: workers'</text><text x="440" y="109" class="wx-t-s">town with bakeries and galleries.</text></g><g class="wx-pop" style="--d:6"><polyline points="127.8,156.9 428,172" class="wx-thin"/><text x="440" y="176" class="wx-t-b">Tura quarries, across the river</text><text x="440" y="193" class="wx-t-s">White casing limestone, shipped</text><text x="440" y="207" class="wx-t-s">by Merer's crew of about 40 men.</text></g><g class="wx-pop" style="--d:8"><polyline points="212.7,229.0 428,266" class="wx-thin"/><text x="440" y="270" class="wx-t-b">Wadi al-Jarf harbour</text><text x="440" y="287" class="wx-t-s">Merer's logbook, found 2013: among</text><text x="440" y="301" class="wx-t-s">the oldest inscribed papyri, written</text><text x="440" y="315" class="wx-t-s">late in Khufu's reign.</text></g><g class="wx-pop" style="--d:10"><polyline points="228.2,565.7 428,466" class="wx-thin"/><text x="440" y="470" class="wx-t-b">Aswan granite quarries</text><text x="440" y="487" class="wx-t-s">Red granite for the King's Chamber,</text><text x="440" y="501" class="wx-t-s">floated c. 680 km north in a straight line,</text><text x="440" y="515" class="wx-t-s">farther along the river.</text></g><g><rect x="40" y="585" width="62.95" height="5" class="wx-inkfill"/><rect x="102.95" y="585" width="62.95" height="5" class="wx-paper wx-edge"/><text x="40" y="580" class="wx-t-s">0</text><text x="165.9" y="580" text-anchor="middle" class="wx-t-s">200 km</text></g><text x="195.9" y="590" class="wx-t-s">N ↑</text></svg></div></div><figcaption>Where the evidence that ties the Great Pyramid to Khufu&#x27;s workforce was found, from Giza to the Red Sea and Aswan. <span class="wx-src">Based on: Site positions from published coordinates; coastlines and Nile simplified. Merer: Tallet 2017; Tallet and Lehner 2021. Heit el-Ghurab: Lehner and Hawass 2017. Distance Aswan to Giza calculated along the great circle.</span></figcaption><p class="vh">A map of Egypt from the Mediterranean to Aswan, with the Nile, its delta, the Red Sea, the Gulf of Suez and Sinai. Four sites are marked. Giza: the pyramid, its sealed relieving chambers with work-gang marks naming Khufu, and the workers&#x27; town of Heit el-Ghurab. Tura, across the river: the white casing limestone shipped by Merer&#x27;s crew of about 40 men. Wadi al-Jarf on the Red Sea coast: the harbour where Merer&#x27;s logbook was found in 2013. Aswan, far to the south: the red granite quarries for the King&#x27;s Chamber, about 680 kilometres from Giza in a straight line. A scale bar shows 200 kilometres.</p></figure></section><section class="wsec" id="giza-power-plant-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Putting the machine to the test</h3><p>A machine explanation is testable, which is to its credit, so here are the tests. Start with the granite. Quartz is piezoelectric, but in granite its crystals point in every direction, and their charges largely cancel. When Tuck, Stacey and Starkey measured quartz-bearing granites in 1977, the effects were no larger than chance alignment of the grains would give. A granite box can ring; it is a poor generator.</p><aside class="wcall"><b>Fresh from the field</b><p>In April 2026 a team led by Clarimma Sessa and Christian Grosse published the first detailed study of the stone surfaces inside the King&#x27;s and Queen&#x27;s Chambers. The salt blooming on the Queen&#x27;s Chamber limestone is mainly halite, ordinary rock salt, which the authors trace to the marine limestone itself. Salt was confined to small areas in 2022 but widespread by 2024, while measurements in the King&#x27;s Chamber showed visitors pushing humidity near 90 percent and carbon dioxide to several thousand parts per million.</p></aside><p>That removes the machine model&#x27;s best physical clue. Salt in the Queen&#x27;s Chamber is what limestone full of old sea salt does when wet air reaches it. Nor has anyone reported zinc compounds, acid etching, soot or scorching in the shafts. The upper rooms were sealed with granite plugs that are still in place, and the Queen&#x27;s Chamber shafts never reach the outside, so there is no way to feed chemicals in from outside.</p><p>The 2025 claims of shafts hundreds of metres beneath the neighbouring pyramid of Khafre, sometimes read as the machine&#x27;s underground plumbing, were announced at a press conference, and the team&#x27;s earlier peer-reviewed paper was retracted in 2026 (see the Khafre Scans case).</p></section><section class="wsec" id="giza-power-plant-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What time has taken</h3><p>Honesty cuts both ways. The pyramid was robbed long ago, and nobody recorded Khufu&#x27;s body, the sarcophagus lid or any grave goods. The &#x27;Queen&#x27;s Chamber&#x27; was never a queen&#x27;s, and nobody knows for certain why it was left plain. The Big Void, a space at least 30 m long above the Grand Gallery found by muon imaging in 2017, has not been entered, and a corridor behind the north face was confirmed in 2023. The builders left no manual explaining the shafts.</p><p>Those gaps are real, and textbook diagrams that label every room with confidence hide them. But gaps are not evidence for a machine. Every find made inside or around the pyramid in the last two centuries, from the gang marks to Merer&#x27;s logbook to the salt analysis, has pointed the same way.</p><blockquote class="wpull"><p>The pyramid resonates. That is a fact about stone rooms, not evidence of a power station.</p></blockquote></section><section class="wsec" id="giza-power-plant-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would change the verdict</h3><p>The machine idea would revive with physical traces that the tomb reading cannot explain: reaction products in the shafts that come from neither the rock nor the visitors, measurable electrical output from the King&#x27;s Chamber granite beyond that of an ordinary block, or a fitting, groove or wear pattern that only a working device could have made. Exploring the spaces behind the Queen&#x27;s Chamber slabs and inside the Big Void would help both sides.</p><p>Until then, the reading best supported is the one left inside it in paint and papyrus: this was the Horizon of Khufu, most likely a king&#x27;s tomb, worked on by a vast, well-fed, well-organised workforce. When work on the plateau first began is a separate question, and still an open one. That is astonishing enough.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">2,560 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Pyramid completed for Khufu</span></li><li class="wtl-find" style="--i:1"><span class="wtl-y">1837 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Vyse opens four more relieving chambers</span></li><li class="wtl-find" style="--i:2"><span class="wtl-y">1872 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Dixon finds the Queen&#x27;s Chamber shafts</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">1883 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Petrie&#x27;s survey of the pyramid</span></li><li class="wtl-find" style="--i:4"><span class="wtl-y">1993 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Gantenbrink&#x27;s robot reaches a shaft slab</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">1998 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Dunn publishes The Giza Power Plant</span></li><li class="wtl-find" style="--i:6"><span class="wtl-y">2013 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Merer&#x27;s logbook found at Wadi al-Jarf</span></li><li class="wtl-find" style="--i:7"><span class="wtl-y">2017 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Muons reveal the Big Void</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2026 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Queen&#x27;s Chamber salt identified as halite</span></li></ol><details class="srcs"><summary>Sources for this case (16)</summary><ol><li>Dunn, C. (1998). The Giza Power Plant: Technologies of Ancient Egypt. Bear &amp; Company, Santa Fe.</li><li>Sessa, C., Deraz, R., Popovych, O., Tayoubi, M., Elkarmoty, M., Helal, H. &amp; Grosse, C. U. (2026). Material characterization of stone surfaces in the inner chambers of the Khufu (Cheops) Pyramid: towards informed conservation strategies. Scientific Reports 16: 12586. <a href="https://doi.org/10.1038/s41598-026-48805-8" target="_blank" rel="noopener">doi:10.1038/s41598-026-48805-8</a></li><li>Tuck, G. J., Stacey, F. D. &amp; Starkey, J. (1977). A search for the piezoelectric effect in quartz-bearing rocks. Tectonophysics 39(4): T7–T11. <a href="https://doi.org/10.1016/0040-1951(77)90148-2" target="_blank" rel="noopener">doi:10.1016/0040-1951(77)90148-2</a></li><li>Tallet, P. (2017). Les papyrus de la mer Rouge I: le journal de Merer (Papyrus Jarf A et B). IFAO, Cairo.</li><li>Tallet, P. &amp; Lehner, M. (2021). The Red Sea Scrolls: How Ancient Papyri Reveal the Secrets of the Pyramids. Thames &amp; Hudson, London.</li><li>Tallet, P. &amp; Marouard, G. (2014). The Harbor of Khufu on the Red Sea Coast at Wadi al-Jarf, Egypt. Near Eastern Archaeology 77(1): 4–14. <a href="https://doi.org/10.5615/neareastarch.77.1.0004" target="_blank" rel="noopener">doi:10.5615/neareastarch.77.1.0004</a></li><li>Vyse, H. (1840–42). Operations Carried On at the Pyramids of Gizeh in 1837. 3 vols. James Fraser, London.</li><li>Petrie, W. M. F. (1883). The Pyramids and Temples of Gizeh. Field &amp; Tuer, London.</li><li>Lehner, M. (1997). The Complete Pyramids. Thames &amp; Hudson, London.</li><li>Lehner, M. &amp; Hawass, Z. (2017). Giza and the Pyramids. Thames &amp; Hudson, London.</li><li>Bonani, G., Haas, H., Hawass, Z., Lehner, M. et al. (2001). Radiocarbon dates of Old and Middle Kingdom monuments in Egypt. Radiocarbon 43(3): 1297–1320.</li><li>Morishima, K. et al. (2017). Discovery of a big void in Khufu&#x27;s Pyramid by observation of cosmic-ray muons. Nature 552: 386–390. <a href="https://doi.org/10.1038/nature24647" target="_blank" rel="noopener">doi:10.1038/nature24647</a></li><li>Procureur, S. et al. (2023). Precise characterization of a corridor-shaped structure in Khufu&#x27;s Pyramid by observation of cosmic-ray muons. Nature Communications 14: 1144. <a href="https://doi.org/10.1038/s41467-023-36351-0" target="_blank" rel="noopener">doi:10.1038/s41467-023-36351-0</a></li><li>Drumm, G. The Land of Chem: An Initiation Into Ancient Chemistry Through The Degrees Of The Egyptian Pyramids. thelandofchem.com.</li><li>CPAK (2026). Presenter page: Tyler Engle (Bassforge), &#x27;Frequency to Form: How Sound Built The Ancient World&#x27;. cpakonline.com.</li><li>The Joe Rogan Experience #2558, Tyler Engle (24 September 2026); episode summary, BigGo Finance podcast notes (third-party).</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-giza-power-plant" data-t="The Giza Power Plant: Tomb or Machine?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Giza Power Plant: Tomb or Machine?</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-giza-power-plant</span> (updated 28 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script>
