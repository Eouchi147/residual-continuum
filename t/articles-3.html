lass="wx-st" data-s="5"><rect x="24" y="450" width="672" height="56" rx="8" class="wx-card wx-edge-soft"/><text x="40.0" y="474.0" class="wx-t-b">The pitch follows automatically from the size of the room.</text><text x="40.0" y="494.0" class="wx-t-m">Showing intent needs other clues: placement, instruments, residues, texts.</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> The King&#x27;s Chamber to scale: 10.47 m long, 5.84 m high, 5.24 m wide, all granite.</p><ol class="wx-steplist"><li>The King&#x27;s Chamber to scale: 10.47 m long, 5.84 m high, 5.24 m wide, all granite.</li><li>Half a wavelength spans the length: the lowest mode is about 343 ÷ 20.94 ≈ 16.4 Hz, below hearing.</li><li>Height and width give modes near 29 and 33 Hz; Tom Danley reported about 16 Hz and 30 Hz in the room.</li><li>The same rule in a small chamber about 1.56 m across gives about 110 Hz, the range of a man&#x27;s voice.</li><li>Pitch follows from size. Showing intent needs other evidence: placement, instruments, residues or texts.</li></ol><figcaption>The King&#x27;s Chamber in long section, to scale, with the standing waves its size produces, and the same rule applied to a small passage-tomb chamber. <span class="wx-src">Based on: Chamber dimensions from Petrie 1883 (412.4 × 206.3 in, height 230.1 in); speed of sound 343 m/s at 20 °C; axial mode f = c/2L. Danley&#x27;s figures as he reported them (ProSoundWeb). Small chamber is a generic illustration, not a surveyed tomb.</span></figcaption><p class="vh">A long section of the King&#x27;s Chamber in the Great Pyramid, 10.47 metres long and 5.84 metres high, drawn to scale with granite walls and roof beams, the stone coffer at the west end and a 1.7 metre person humming. Step 2 adds a half-wave curve spanning the length, with pressure peaks at the end walls and a node in the middle, giving about 16.4 Hz. Step 3 adds a blue vertical curve for the height mode near 29.4 Hz, and notes the width mode near 32.7 Hz and Tom Danley&#x27;s reports of about 16 and 30 Hz. Step 4 shows a small corbelled chamber 1.56 metres across at the same scale, resonating near 110 Hz, in a man&#x27;s voice range. Step 5 adds a note that the pitch follows automatically from the size of the room, and that showing intent needs other clues.</p></figure><p>The audio engineer Tom Danley, working in the chamber during a film production, reported infrasound near 16 Hz and a resonance near 30 Hz. Those are exactly the pitches the room&#x27;s size predicts. They are impressive to feel. They do not, by themselves, show tuning, because any granite room of that size would do the same.</p><p>The same rule explains much of the passage-tomb cluster. A chamber about 1.5 metres across rings near 110 Hz. Neolithic chambers were built for human bodies, so their dimensions, and therefore their resonances, fall in a narrow band that overlaps the voice. That is a reason for caution, not a refutation: people may still have noticed the effect and used it.</p></section><section class="wsec" id="temple-acoustics-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Where intent looks likely</h3><p>The best case is in the Peruvian Andes. Chavín de Huántar, built from before 1200 BCE at 3,180 metres, is honeycombed with narrow stone galleries. In 2001 John Rick&#x27;s team excavated twenty decorated conch-shell trumpets in one of them, laid out as if they had hung along the walls. Miriam Kolar&#x27;s measurements showed that three ducts linking the central Lanzón Gallery to the Circular Plaza carry the trumpets&#x27; 272–340 Hz tones 10–20 dB above other sound, and that the galleries blur where a sound comes from. Here instrument, architecture and ritual fit together.</p><p>Deep time offers hints too. In the 1980s Iegor Reznikoff and Michel Dauvois reported that paintings in French caves cluster at resonant spots, and Steven Waller linked rock art to echoing places in a 1993 Nature paper. A modern re-test in five Spanish caves found lines and dots more likely where the low-frequency response resonates, a statistically weak but tenable association. In the Preseli Hills of Wales, source of Stonehenge&#x27;s bluestones, Paul Devereux and Jon Wozencroft found that many rocks ring like bells or gongs when struck, and suggested this may be one reason they were chosen.</p></section><section class="wsec" id="temple-acoustics-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The Bass Forge case</h3><p>Tyler Engle, who trained in computer engineering and produces electronic music under the Bass Forge name, puts sound at the centre of his reading of the ancient world. His stated thesis on his CPAK 2026 presenter page is that many monuments and myths were not merely symbolic.</p><blockquote class="quote"><p>functional systems designed to encode knowledge about perception, energy, and the nature of the universe itself</p><cite>CPAK XIV 2026 presenter page for Tyler Engle (cpakonline.com)</cite></blockquote><p>On The Joe Rogan Experience #2558 in September 2026, according to third-party summaries, he described an Ellora chanting hall whose reverberation lasts 15–20 seconds, said sound is the one medium people can directly manipulate, and argued that floral carvings on temple walls match cymatic patterns and serve as keys to a temple&#x27;s frequencies. His strongest ground is the one the measurements share: across very different places, people built rooms that change how voices and drums behave, and some, like the Hypogeum, do so dramatically.</p><figure class="photo wimg" data-img="Lascar Ellora caves - Cave 10 (Vishwakarma cave) (4558324543).jpg" data-cap="Ellora Cave 10, the Vishvakarma chaitya hall, 7th century CE"><figcaption></figcaption></figure><p>Weighed carefully, the Ellora figure is the weak point. We could find no published measurement of Cave 10. The nearest comparable hall, at Kanheri, measured about five seconds. Very long decays are possible in stone, but Till&#x27;s 16 seconds in the Hypogeum was at 63 Hz, deep bass, not across the voice. The carving-as-frequency-key idea is a separate claim, weighed in the companion case on cymatic temples.</p></section><section class="wsec" id="temple-acoustics-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>The mainstream, slow but careful</h3><p>Archaeology was slow to listen. For most of the 20th century it described monuments as plans and sightlines, as if people moved through them in silence. Aaron Watson and David Keating&#x27;s 1999 study of a Scottish stone circle and passage grave, and the 2006 volume Archaeoacoustics edited by Chris Scarre and Graeme Lawson, helped change that, and Stonehenge&#x27;s 2020 model team concluded that sound improved the experience inside the circle.</p><p>But the careful researchers resist the leap to design. The Stonehenge team does not believe the monument was built for its acoustics. Till found that standing near the Hypogeum niche exaggerates some effects, but that the variations were unpredictable and inconsistent. And a single study reporting that a 110 Hz tone shifts brain activity in 30 volunteers is a lead, not an established effect. The mainstream verdict is that sound mattered to experience everywhere, and to design in some places.</p></section><section class="wsec" id="temple-acoustics-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What time has muffled, and what would settle it</h3><p>Sound is the most perishable part of a ritual. Textiles, wooden screens, bodies, smoke and crowds all changed how these rooms answered, and none survive. Many spaces were altered too: Newgrange was extensively restored between 1962 and 1975, and Chavín&#x27;s galleries suffered collapse and a mudslide in 1945. Silence in the record is partly silence by decay.</p><p>Clear tests exist. Measure Ellora&#x27;s Cave 10 and its sister halls properly and publish the results. Survey many passage tombs, including dull ones, to see whether their pitches cluster more tightly than size alone predicts. Look for instruments and residues in place, as at Chavín. The honest position today: ancient builders made spaces that sing, and at least some of them knew it.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">4,000 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Ħal Saflieni Hypogeum begins to be cut</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">3,200 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Newgrange passage tomb built</span></li><li class="wtl-build" style="--i:2"><span class="wtl-y">2,560 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">King&#x27;s Chamber completed in Khufu&#x27;s pyramid</span></li><li class="wtl-build" style="--i:3"><span class="wtl-y">2,500 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Sarsen circle raised at Stonehenge</span></li><li class="wtl-build" style="--i:4"><span class="wtl-y">1,200 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Monumental building under way at Chavín de Huántar</span></li><li class="wtl-build" style="--i:5"><span class="wtl-y">650 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Ellora&#x27;s Buddhist chaitya hall (Cave 10) cut, 7th century</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">1996 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Jahn, Devereux and Ibison publish chamber resonances</span></li><li class="wtl-find" style="--i:7"><span class="wtl-y">2001 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Twenty pututus excavated at Chavín</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2017 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Till&#x27;s Hypogeum survey; Fazenda&#x27;s cave study</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">2020 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Stonehenge acoustic scale model published</span></li></ol><details class="srcs"><summary>Sources for this case (16)</summary><ol><li>Jahn, R. G., Devereux, P. &amp; Ibison, M. (1996). Acoustical resonances of assorted ancient structures. Journal of the Acoustical Society of America 99(2): 649–658. <a href="https://doi.org/10.1121/1.414642" target="_blank" rel="noopener">doi:10.1121/1.414642</a></li><li>Devereux, P. &amp; Jahn, R. G. (1996). Preliminary investigations and cognitive considerations of the acoustical resonances of selected archaeological sites. Antiquity 70(269): 665–666. <a href="https://doi.org/10.1017/S0003598X00083800" target="_blank" rel="noopener">doi:10.1017/S0003598X00083800</a></li><li>Till, R. (2017). An archaeoacoustic study of the Ħal Saflieni Hypogeum on Malta. Antiquity 91(355): 74–89. <a href="https://doi.org/10.15184/aqy.2016.258" target="_blank" rel="noopener">doi:10.15184/aqy.2016.258</a></li><li>Debertolis, P., Coimbra, F. &amp; Eneix, L. (2015). Archaeoacoustic analysis of the Ħal Saflieni Hypogeum in Malta. Journal of Anthropology and Archaeology 3(1): 59–79. <a href="https://doi.org/10.15640/jaa.v3n1a4" target="_blank" rel="noopener">doi:10.15640/jaa.v3n1a4</a></li><li>Cox, T. J., Fazenda, B. M. &amp; Greaney, S. E. (2020). Using scale modelling to assess the prehistoric acoustics of Stonehenge. Journal of Archaeological Science 122: 105218. <a href="https://doi.org/10.1016/j.jas.2020.105218" target="_blank" rel="noopener">doi:10.1016/j.jas.2020.105218</a></li><li>Fazenda, B., Scarre, C., Till, R. et al. (2017). Cave acoustics in prehistory: exploring the association of Palaeolithic visual motifs and acoustic response. Journal of the Acoustical Society of America 142(3): 1332. <a href="https://doi.org/10.1121/1.4998721" target="_blank" rel="noopener">doi:10.1121/1.4998721</a></li><li>Kolar, M. A. (2013). Archaeological psychoacoustics at Chavín de Huántar, Perú. PhD dissertation, Stanford University; and Kolar, M. A. (2013). Tuned to the senses: an archaeoacoustic perspective on ancient Chavín. The Appendix 1(3).</li><li>Cook, I. A., Pajot, S. K. &amp; Leuchter, A. F. (2008). Ancient architectural acoustic resonance patterns and regional brain activity. Time and Mind 1(1): 95–104. <a href="https://doi.org/10.2752/175169608783489099" target="_blank" rel="noopener">doi:10.2752/175169608783489099</a></li><li>Watson, A. &amp; Keating, D. (1999). Architecture and sound: an acoustic analysis of megalithic monuments in prehistoric Britain. Antiquity 73(280): 325–336. <a href="https://doi.org/10.1017/S0003598X00088281" target="_blank" rel="noopener">doi:10.1017/S0003598X00088281</a></li><li>Waller, S. J. (1993). Sound and rock art. Nature 363: 501. <a href="https://doi.org/10.1038/363501a0" target="_blank" rel="noopener">doi:10.1038/363501a0</a></li><li>Umbarkar, A. S., Nandanwar, D. V. &amp; Chimankar, O. P. (2022). Preliminary archaeoacoustic study of Kanheri Caves in Mumbai (Maharashtra, India). Sound &amp; Vibration 56(2): 193–203. <a href="https://doi.org/10.32604/sv.2022.015322" target="_blank" rel="noopener">doi:10.32604/sv.2022.015322</a></li><li>Scarre, C. &amp; Lawson, G. (eds) (2006). Archaeoacoustics. McDonald Institute for Archaeological Research, Cambridge.</li><li>Devereux, P. &amp; Wozencroft, J. (2013–2014). Studies of lithophones on Carn Menyn, Preseli, and the Stonehenge bluestones. Time and Mind; Royal College of Art news release, 2 December 2013.</li><li>Petrie, W. M. F. (1883). The Pyramids and Temples of Gizeh. Field &amp; Tuer, London.</li><li>Danley, T. (2024). The Great Pyramid: early reflections and ancient echoes. ProSoundWeb (account of earlier measurements made during a film production).</li><li>Engle, T. CPAK XIV 2026 presenter page, &#x27;Frequency to Form: How Sound Built The Ancient World&#x27;, cpakonline.com; The Joe Rogan Experience #2558 (24 September 2026), as summarised by third-party write-ups (finance.biggo.com).</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-temple-acoustics" data-t="Temples That Sing: Sound and Ancient Stone"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Temples That Sing: Sound and Ancient Stone</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-temple-acoustics</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-cymatic-temples-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Chladni plate 10.jpg" data-cap="Borobudur, Magelang, Central Java, Indonesia" data-big><figcaption></figcaption></figure><div class="sh-k">Chambers, Sound and Stone</div><h2 class="sh-t" id="case-cymatic-temples-st" tabindex="-1">Cymatic Temples: Did Sound Shape the Stones?</h2><p class="sh-s">Sand on a singing plate draws mandalas. Some say temple builders copied them, or even lifted stones with sound.</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> Ancient builders used sound as a working technology, either laying out temple plans from cymatic patterns or moving megaliths with acoustic force.</p></div><p class="v4-q">Was sound a working technology for designing or building ancient monuments?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Sprinkle sand on a vibrating plate and it gathers into symmetric patterns, known since 1680.</li><li>Some say ancient builders laid out temples like Borobudur from those patterns, or even lifted stones with sound.</li><li>Patterns and temple plans look alike because both are symmetric; a single plate makes dozens of shapes.</li><li>No text, tool or workshop shows the method being used.</li><li>The design idea is untested; lifting a block with sound in air would need forces near the physical limit, so that part is ruled out.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Physics</span><span class="thr">Engineering</span><span class="thr">Archaeology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="1787" >1,787</b><span class="ctr-u"> </span></div><div class="ctr-l">Chladni publishes his sound figures</div><div class="ctr-c">Chladni 1787</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="55000" >55,000</b><span class="ctr-u"> m³</span></div><div class="ctr-l">andesite in Borobudur, laid without mortar</div><div class="ctr-c">Borobudur site survey figures</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="72" >72</b><span class="ctr-u"> stupas</span></div><div class="ctr-l">perforated, on three circular terraces</div><div class="ctr-c">Borobudur site survey figures</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="0.6" data-dec="1">0.6</b><span class="ctr-u"> g</span></div><div class="ctr-l">a 30 mm polystyrene ball held up by sound</div><div class="ctr-c">far-field levitation experiments</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="40" >40</b><span class="ctr-u"> million times</span></div><div class="ctr-l">heavier: a 25 t sarsen versus that ball</div><div class="ctr-c">our calculation</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Ancient builders used sound as a working technology, either laying out temple plans from cymatic patterns or moving megaliths with acoustic force.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">No text, tool, workshop or site shows vibration figures being used to design a temple, and the resemblance between plate patterns and plans follows from shared symmetry, since a single plate yields dozens of shapes. The design idea is untested rather than refuted, so it rates as awaiting discovery. The lifting idea is weaker: sound in air has lifted grams, and holding up a tonne-scale block would need intensities near the physical limit for sound in air. On its own, acoustic levitation of megaliths would rate as ruled out.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks present Borobudur confidently as a Buddhist mandala and megaliths as moved by muscle, sledge and lever. On the mechanics of moving stone that confidence is earned, although the exact method for any single block is usually a reconstruction. On design, the mandala reading is well grounded in Buddhist tradition, but how the builders turned it into exact dimensions is less certain than the tidy diagrams suggest.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Vibrating plates dusted with sand or flour form symmetric patterns: Robert Hooke saw them in 1680, and Ernst Chladni described them systematically in 1787; the sand gathers on nodal lines, where the plate does not move.<small>Chladni 1787</small></li><li>The pattern depends on the plate&#x27;s shape, how it is held and the pitch; physicists explain Chladni figures fully with classical wave mechanics.<small>Rossing and Fletcher 2004</small></li><li>Borobudur was built in stages from about 780 to 833 CE, of about 55,000 cubic metres of andesite laid without mortar, as six square platforms and three circular ones topped by a central stupa, on a base 123 m square.<small>UNESCO; site survey figures</small></li><li>Laboratory acoustic levitation, first shown with droplets in 1933, typically lifts milligrams; a 50 mm polystyrene sphere levitated in 2016 was a record for size, not weight.<small>Andrade et al. 2016</small></li><li>More than 40 of Borobudur&#x27;s relief panels show musical instruments, which are still played in 34 Indonesian provinces and at least 40 countries.<small>UNESCO 2021</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether any builders ever watched vibration patterns in sand, water or drumskins and borrowed them for designs, which is possible but undocumented.</li><li>Whether Borobudur&#x27;s proportions (a 4:6:9 ratio reported from a 1977 survey) and its self-similar geometry reflect mandala rules, algorithmic design, or something else.</li><li>Whether carved rosettes and floral panels encode frequencies, as Bass Forge argues, or are decoration and symbol in the usual sense.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Builders&#x27; drawings, cords and templates for Borobudur do not survive, so the design process is reconstructed from the monument itself.</li><li>No ancient text, workshop or device describing vibration figures or sound-driven lifting has been found anywhere.</li><li>The Tibetan levitation story that most acoustic-lifting claims trace back to has no independent record: no film, no site and no second witness has been produced.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Historians of architecture read Borobudur as a Buddhist mandala in stone, a path from the world of desire through the world of forms to formlessness, laid out with cord-and-peg geometry and proportional rules. Engineers and archaeologists explain the moving of megaliths with quarrying, sledges, rollers, levers, ramps and a great deal of labour, evidence for which survives in quarries, tool marks and ramps. Physicists regard cymatic patterns as ordinary wave mechanics, and note that acoustic radiation pressure is far too weak to lift heavy stone.</p><ul><li>Mandala geometry predates any known vibrating-plate experiment and is described in Buddhist and Hindu texts.</li><li>Symmetric boundaries produce symmetric patterns, so resemblance to a temple plan is expected, not diagnostic.</li><li>Egyptian art shows water poured in front of a sledge; lab work shows wet sand can roughly halve sliding friction.</li><li>The largest objects levitated by sound in air weigh grams, not tonnes.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Tyler Engle presents cymatics, the study of patterns made visible by vibration, as a key to temple design. In his short videos he reads Borobudur&#x27;s plan as a cymatic pattern, and on The Joe Rogan Experience he reportedly argued that floral carvings on temple walls match cymatic figures and act as keys to a temple&#x27;s frequencies. His CPAK 2026 talk is titled &#x27;Frequency to Form: How Sound Built The Ancient World&#x27;. Related writers go further: Henry Kjellson&#x27;s story of Tibetan monks raising stone blocks with drums and trumpets, popularised by Bruce Cathie, is the root of most acoustic-levitation claims about megaliths.</p><ul><li>Cymatic figures and mandalas share nested squares, circles and radial symmetry.</li><li>Temple cultures were musical cultures: Borobudur&#x27;s own reliefs show dozens of instruments.</li><li>Vibration patterns are easy to see in a bowl of water, a gong or a drumskin, so no modern apparatus was needed.</li><li>Standing waves really can hold objects in mid-air, as laboratories show.</li></ul><div class="face-s"><b>Its strongest point</b><p>Anyone who struck a bronze gong dusted with grit, or tapped a bowl of water, could have seen symmetric vibration patterns, and temple builders lived among musicians. The idea that such patterns inspired sacred geometry is not physically impossible.</p></div><p class="face-cr"><b>Credit</b> Tyler Engle (Bass Forge; CPAK 2026 talk &#x27;Frequency to Form: How Sound Built The Ancient World&#x27;; The Joe Rogan Experience #2558, September 2026); with Hans Jenny, John Stuart Reid, Stuart Mitchell, and the levitation stories of Henry Kjellson and Bruce Cathie</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>An ancient text, inscription or manual describing vibration figures used in design.</li><li>A temple plan whose proportions match a specific plate mode more closely than chance, tested against many plans and many modes.</li><li>Any demonstration of sound lifting even one kilogram more than a few millimetres in open air.</li><li>Excavated evidence at a megalithic site of a lifting method that leaves no ramp, sledge track or lever socket.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,174 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Cymatic Temples: Did Sound Shape the Stones?"><button type="button" class="wtoc-i" data-go="cymatic-temples-s1">Sand that draws mandalas</button><button type="button" class="wtoc-i" data-go="cymatic-temples-s2">What cymatics is, and what it is not</button><button type="button" class="wtoc-i" data-go="cymatic-temples-s3">The Bass Forge case</button><button type="button" class="wtoc-i" data-go="cymatic-temples-s4">Borobudur, read as a plan</button><button type="button" class="wtoc-i" data-go="cymatic-temples-s5">Could sound lift a stone?</button><button type="button" class="wtoc-i" data-go="cymatic-temples-s6">What would change the verdict</button></nav></div><section class="wsec" id="cymatic-temples-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Sand that draws mandalas</h3><p>Clamp a square brass plate at its centre, sprinkle it with fine sand and draw a violin bow down one edge. At certain pitches the plate sings and the sand leaps, then settles into sharp, symmetric figures: crosses, stars, rings, nested rounded squares. Ernst Chladni, a German physicist and musician, published these figures in 1787, and his public demonstrations made him famous across Europe.</p><p>Anyone who sees a good Chladni figure next to an aerial photograph of Borobudur, the great Buddhist monument of central Java, feels the pull of the comparison. Squares stepping inward, circles, a central point. Tyler Engle of Bass Forge has made that comparison a signature of his work, and his CPAK 2026 talk carries the whole argument in its title: &#x27;Frequency to Form: How Sound Built The Ancient World&#x27;.</p><blockquote class="wpull"><p>A picture that looks like a temple is a beautiful coincidence until someone shows it was a method.</p></blockquote></section><section class="wsec" id="cymatic-temples-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What cymatics is, and what it is not</h3><p>The phenomenon is old and well understood. Robert Hooke saw nodal patterns in flour on a bowed glass plate on 8 July 1680. Chladni&#x27;s Entdeckungen über die Theorie des Klanges (1787) mapped them. Michael Faraday described standing patterns on vibrating liquids in 1831. In 1967 the Swiss physician Hans Jenny published Kymatik, coining the word cymatics and filming sand, pastes and liquids on vibrating plates in striking detail.</p><figure class="wx wx--steps" id="cymatic-temples-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">Sand on a plate, and a temple plan</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Sand on a plate, and a temple plan"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" class="wx-svg" role="img" aria-labelledby="cymatic-temples-f1-t"><title id="cymatic-temples-f1-t">Two idealised Chladni patterns on a square plate beside a schematic plan of Borobudur, showing why a resemblance is not evidence of method</title><text x="24.0" y="26. 0" x2="540.0" y2="152.0" class="wx-thin"/><line x1="640.0" y1="152.0" x2="690" y2="152.0" class="wx-thin"/><line x1="490" y1="266" x2="571.3" y2="266" class="wx-bold"/><text x="577.3" y="270.0" class="wx-t-s">50 m</text></g><text x="30.0" y="292.0" class="wx-t-b">1 · Chladni's plate</text><text x="30.0" y="308.0" class="wx-t-s">clamped at the centre, bowed</text><text x="260.0" y="292.0" class="wx-t-b">2 · Same plate, higher pitch</text><text x="260.0" y="308.0" class="wx-t-s">nested, rounded squares appear</text><text x="490.0" y="292.0" class="wx-t-b">3 · Borobudur, plan</text><text x="490.0" y="308.0" class="wx-t-s">base 123 m; 72 stupas in rings</text><text x="30.0" y="324.0" class="wx-t-s wx-st" data-s="2">sand collects on still lines</text><text x="490.0" y="324.0" class="wx-t-s wx-st" data-s="4">(32, 24 and 16), c. 780–833 CE</text><g class="wx-st" data-s="5"><text x="475.0" y="160.0" class="wx-t-h wx-t-a" text-anchor="middle">≈?</text><rect x="24" y="352" width="672" height="92" rx="8" class="wx-card wx-edge-soft"/><text x="40.0" y="376.0" class="wx-t-b">Looking alike is not a method.</text><text x="40.0" y="396.0" class="wx-t-m">One plate has dozens of modes, so some pattern will resemble almost any symmetric plan.</text><text x="40.0" y="414.0" class="wx-t-m">A real test would need the terraces to match a single mode's proportions, and some trace</text><text x="40.0" y="432.0" class="wx-t-m">(a text, a tool, a workshop) showing that the builders worked from vibrating plates.</text></g><text x="24.0" y="470.0" class="wx-t-s">Plate patterns from a simplified model (sums of two cosine modes), not measurements.</text><text x="24.0" y="485.0" class="wx-t-s">Borobudur terrace outlines schematic, except the 123 m base and the stupa counts.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> A square plate, clamped at its centre and dusted with sand, is bowed at the edge.</p><ol class="wx-steplist"><li>A square plate, clamped at its centre and dusted with sand, is bowed at the edge.</li><li>At a resonant pitch the sand leaves the moving areas and gathers on the still, nodal lines.</li><li>At a higher pitch the same plate gives nested, rounded squares.</li><li>Borobudur&#x27;s plan: six square terraces, three circular ones with 72 stupas, a central stupa, base 123 m.</li><li>Looking alike is not a method: a real test needs matching proportions and evidence the builders used plates.</li></ol><figcaption>Two idealised patterns from one square plate beside a schematic plan of Borobudur: the resemblance is real, and so is the problem with using it as evidence. <span class="wx-src">Based on: Plate patterns from a simplified model of square-plate modes, cos(nπx)cos(mπy) + cos(mπx)cos(nπy) = 0, with (n, m) = (1, 5) and (3, 4); not measurements. Borobudur base 123 m, six square and three circular terraces, stupas 32, 24 and 16; other terrace outlines schematic.</span></figcaption><p class="vh">Three square panels in a row. Panel 1: a metal plate clamped at its centre with scattered sand and a violin bow at its right edge; at step 2 brown nodal lines appear in a four-petalled flower pattern around a small inner loop. Panel 2: the same plate at a higher pitch, where the nodal lines form nested, rounded squares with arcs at the corners. Panel 3: a schematic plan of Borobudur with six stepped square terraces, three circular terraces carrying rings of 32, 24 and 16 small stupas, a central stupa, stair axes, and a 50 metre scale bar. Step 5 links panels 2 and 3 with a dashed arc and a question mark, and a box explains that one plate has dozens of modes, so resemblance is not a method.</p></figure><p>The physics is classical. A plate vibrates in modes, each with lines that stay still. Sand is thrown off the moving regions and collects on those still lines. The pattern is set by the plate&#x27;s outline, where it is held, and the pitch. A square plate gives square-symmetric patterns, a round plate gives rings and spokes, and one plate can show dozens of different figures as the pitch rises. That richness is what makes cymatics beautiful, and it is also why resemblance alone is weak evidence.</p><figure class="photo wimg" data-img="Round Chladni plate with 3 circular and 4 linear nodes.jpg" data-cap="A round Chladni plate showing three circular and four straight nodal lines"><figcaption></figcaption></figure></section><section class="wsec" id="cymatic-temples-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The Bass Forge case</h3><p>Tyler Engle, an engineer by training and electronic-music producer, argues that ancient monuments were functional systems rather than merely symbolic ones, and that sound was central to how they worked. His short videos present Borobudur&#x27;s plan as a cymatic pattern. On The Joe Rogan Experience #2558 in September 2026, according to third-party summaries, he said the floral carvings on temple walls match cymatic figures and serve as keys to the temple&#x27;s frequencies.</p><p>He stands in a line of thinkers. Hans Jenny&#x27;s films of sand and liquids on vibrating plates gave the movement its images. John Stuart Reid, who developed the CymaScope instrument, has written about cymatics and Egyptian sites. At Rosslyn Chapel in Scotland, Thomas and Stuart Mitchell matched carved cubes to Chladni figures and composed music from them. And behind nearly every claim that sound lifted megaliths stands one story, told by the Swedish engineer Henry Kjellson and spread in English by Bruce Cathie.</p><p>Engle&#x27;s strongest point is modest and fair. Vibration patterns do not need a laboratory. Grit on a struck gong, water in a tapped bronze bowl, sand on a drumskin all show them. Borobudur&#x27;s own reliefs show more than 40 panels with musical instruments, and the Sound of Borobudur project, presented in 2021, has played reconstructions of them. The builders lived among sound. The question is whether they designed with it.</p></section><section class="wsec" id="cymatic-temples-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Borobudur, read as a plan</h3><p>Borobudur rose in stages from about 780 to 833 CE under the Sailendra dynasty. Around 55,000 cubic metres of andesite from nearby quarries and the Progo riverbed were cut, fitted with knobs, indentations and dovetails, and laid without mortar. The monument has six square platforms and three circular ones on a base 123 metres square, 504 Buddha statues, and 72 perforated stupas on the circular terraces (32, 24 and 16) around a central stupa.</p><p>Scholars read it as a mandala in stone: pilgrims walk upward and clockwise past narrative reliefs, from the world of desire to the world of form and finally to the formless circular terraces. Surveyors have reported a recurring 4:6:9 ratio in its dimensions, and a 2015 analysis by Hokky Situngkir argued that its self-similar, fractal-like layout could be generated by a simple repeated rule.</p><p>Could a Chladni figure explain it better? The drawing above shows the difficulty. A simple model of one square plate gives a flower at one pitch and nested rounded squares at another. With enough modes, some pattern will resemble almost any symmetric plan. A real test would have to show that Borobudur&#x27;s terrace spacings match one specific mode better than chance, and that the builders had a reason to use it. Nobody has published such a test.</p></section><section class="wsec" id="cymatic-temples-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Could sound lift a stone?</h3><p>The levitation story, as Kjellson told it, is vivid. In 1939 a Swedish doctor called Jarl supposedly watched Tibetan monks arrange 13 drums and 6 trumpets in a quarter circle 63 metres from a stone slab about 1 by 1.5 metres. As they played, the slab rose some 250 metres to a ledge, five or six blocks an hour. No independent record of the event has ever been produced.</p><p>Acoustic levitation is real, and that is exactly why we can weigh the story. Since Bücks and Müller floated alcohol droplets in 1933, standing-wave levitators have usually carried a few milligrams. Researchers in Brazil and Scotland made headlines in 2016 by levitating a 50 mm polystyrene ball, bigger than the sound&#x27;s 14 mm wavelength, but still a featherweight. Near-field levitation can float several kilograms, but only a fraction of a millimetre above a vibrating plate.</p><figure class="wx wx--static" id="cymatic-temples-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">What sound has lifted, and what builders moved</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="What sound has lifted, and what builders moved"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" class="wx-svg" role="img" aria-labelledby="cymatic-temples-f2-t"><title id="cymatic-temples-f2-t">Masses lifted by sound in laboratories compared with the masses of stones moved by ancient builders, on a logarithmic scale</title><text x="24.0" y="24.0" class="wx-t-cap">What sound has lifted, and what builders moved · log scale</text><text x="20.0" y="78.0" class="wx-t-b">Standing-wave levitator</text><text x="20.0" y="93.0" class="wx-t-s">typically a few milligrams</text><line x1="200" y1="84" x2="690" y2="84" class="wx-guide"/><text x="20.0" y="122.0" class="wx-t-b">Polystyrene ball, 30 mm</text><text x="20.0" y="137.0" class="wx-t-s">0.6 g, floating in air</text><line x1="200" y1="128" x2="690" y2="128" class="wx-guide"/><text x="20.0" y="166.0" class="wx-t-b">Near-field levitation</text><text x="20.0" y="181.0" class="wx-t-s">several kg, under 1 mm up</text><line x1="200" y1="172" x2="690" y2="172" class="wx-guide"/><text x="20.0" y="244.0" class="wx-t-b">Stonehenge Altar Stone</text><text x="20.0" y="259.0" class="wx-t-s">c. 6 t, from NE Scotland</text><line x1="200" y1="250" x2="690" y2="250" class="wx-guide"/><text x="20.0" y="288.0" class="wx-t-b">Stonehenge sarsen</text><text x="20.0" y="303.0" class="wx-t-s">typically c. 25 t</text><line x1="200" y1="294" x2="690" y2="294" class="wx-guide"/><text x="20.0" y="332.0" class="wx-t-b">Baalbek, Trilithon block</text><text x="20.0" y="347.0" class="wx-t-s">each c. 800 t</text><line x1="200" y1="338" x2="690" y2="338" class="wx-guide"/><text x="20.0" y="376.0" class="wx-t-b">Kjellson's Tibet story</text><text x="20.0" y="391.0" class="wx-t-s">told, never measured</text><line x1="200" y1="382" x2="690" y2="382" class="wx-guide"/><text x="20.0" y="212.0" class="wx-t-cap wx-t-a">MOVED BY BUILDERS</text><text x="20.0" y="50.0" class="wx-t-cap wx-t-a">LIFTED BY SOUND, IN THE LAB</text><line x1="20" y1="222" x2="690" y2="222" class="wx-thin"/><rect x="200.0" y="77" width="40.8" height="14" rx="3" class="wx-c2 wx-growx" style="--d:1"/><circle cx="313.3" cy="128" r="6" class="wx-c2 wx-pop" style="--d:2"/><text x="323.3" y="132.0" class="wx-t-s wx-halo">0.6 g</text><rect x="457.1" y="165" width="28.5" height="14" rx="3" class="wx-c2 wx-growx" style="--d:3"/><text x="451.1" y="176.0" class="wx-t-s wx-halo" text-anchor="end">a few kg</text><circle cx="598.9" cy="250" r="6" class="wx-c1 wx-pop" style="--d:4"/><text x="588.9" y="254.0" class="wx-t-s wx-halo" text-anchor="end">6 t</text><circle cx="624.2" cy="294" r="6" class="wx-c1 wx-pop" style="--d:5"/><text x="634.2" y="298.0" class="wx-t-s wx-halo" text-anchor="start">25 t</text><circle cx="685.6" cy="338" r="6" class="wx-c1 wx-pop" style="--d:6"/><text x="675.6" y="342.0" class="wx-t-s wx-halo" text-anchor="end">800 t</text><rect x="579.5" y="375" width="19.8" height="14" rx="3" class="wx-dash"/><text x="573.5" y="386.0" class="wx-t-s wx-halo" text-anchor="end">1 × 1.5 m slab, thickness unstated: 2–6 t if 0.5–1.5 m</text><defs><marker id="cymatic-temples-f2-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><path d="M313.3,140 C313.3,260 464.2,294 614.2,294" class="wx-hl wx-draw" pathLength="1" style="--d:7" marker-end="url(#cymatic-temples-f2-ah)"/><text x="690.0" y="212.0" class="wx-t-b wx-t-a wx-halo" text-anchor="end">about 40 million times heavier</text><line x1="200" y1="404" x2="690" y2="404" class="wx-line"/><line x1="200.0" y1="404" x2="200.0" y2="410" class="wx-line"/><text x="200.0" y="424.0" class="wx-t-s" text-anchor="middle">1 mg</text><line x1="322.4" y1="404" x2="322.4" y2="410" class="wx-line"/><text x="322.4" y="424.0" class="wx-t-s" text-anchor="middle">1 g</text><line x1="444.8" y1="404" x2="444.8" y2="410" class="wx-line"/><text x="444.8" y="424.0" class="wx-t-s" text-anchor="middle">1 kg</text><line x1="567.2" y1="404" x2="567.2" y2="410" class="wx-line"/><text x="567.2" y="424.0" class="wx-t-s" text-anchor="middle">1 t</text><line x1="689.6" y1="404" x2="689.6" y2="410" class="wx-line"/><text x="689.6" y="424.0" class="wx-t-s" text-anchor="middle">1,000 t</text><line x1="240.8" y1="404" x2="240.8" y2="408" class="wx-thin"/><line x1="281.6" y1="404" x2="281.6" y2="408" class="wx-thin"/><line x1="363.2" y1="404" x2="363.2" y2="408" class="wx-thin"/><line x1="404.0" y1="404" x2="404.0" y2="408" class="wx-thin"/><line x1="485.6" y1="404" x2="485.6" y2="408" class="wx-thin"/><line x1="526.4" y1="404" x2="526.4" y2="408" class="wx-thin"/><line x1="608.0" y1="404" x2="608.0" y2="408" class="wx-thin"/><line x1="648.8" y1="404" x2="648.8" y2="408" class="wx-thin"/><text x="690.0" y="438.0" class="wx-t-m" text-anchor="end">mass, log scale</text></svg></div></div><figcaption>Laboratory levitation and ancient megaliths on one logarithmic scale of mass. The gap spans seven to nine orders of magnitude. <span class="wx-src">Based on: Acoustic levitation figures from Andrade et al. 2016 and standard reviews; Stonehenge masses from English Heritage and Clarke et al. 2024; Baalbek from the site literature; Kjellson slab dimensions as told, mass range our estimate for granite-like rock (about 2.7 t per cubic metre).</span></figcaption><p class="vh">A chart with a logarithmic mass axis from 1 milligram to 1,000 tonnes. Upper group, lifted by sound in the lab: standing-wave levitators, a bar from 1 to 10 milligrams; a 30 mm polystyrene ball, a dot at 0.6 grams; near-field levitation, a bar from 2 to 10 kilograms, lifted under 1 millimetre. Lower group, moved by builders: the Stonehenge Altar Stone at about 6 tonnes, a Stonehenge sarsen at about 25 tonnes, and a Baalbek Trilithon block at about 800 tonnes. A dashed box marks Kjellson&#x27;s Tibetan slab, 2 to 6 tonnes if it was 0.5 to 1.5 metres thick, labelled as told but never measured. An accent arrow from the polystyrene ball to the sarsen is labelled about 40 million times heavier.</p></figure><aside class="wcall"><b>How do we know?</b><p>Sound pushes on what it hits, but weakly. By our own rough estimate, holding up a granite slab one metre thick by radiation pressure would need a continuous sound level of about 185–190 dB. Near 191–194 dB the quiet half of a sound wave would fall to a vacuum, so ordinary sound in air cannot grow much louder. That is thousands of times more intense than a jet engine at close range, and drums 63 metres away fall far short.</p></aside><p>Meanwhile the evidence for ordinary methods is physical. A tomb painting of Djehutihotep in Egypt shows a man pouring water in front of a sledge carrying a colossal statue, and experiments published in 2014 found that wetting sand the right amount can roughly halve the force needed to drag a load. In 2018 archaeologists at the Hatnub alabaster quarries described a steep ramp flanked by staircases and post holes from the time of Khufu.</p></section><section class="wsec" id="cymatic-temples-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What would change the verdict</h3><p>Time has taken a lot. Builders&#x27; cords, templates and drawings for Borobudur are gone, as are most working records from the ancient world. So an honest case has to allow that design methods we cannot see existed. But the cymatic reading needs something concrete: a text or inscription that describes vibration figures in design, a plan that matches a specific mode better than chance, or a workshop with plates and sand.</p><p>For lifting, the bar is simpler: a demonstration that sound can raise even one kilogram more than a few millimetres in open air. The companion case on temple acoustics shows that ancient builders did care about sound, and sometimes shaped spaces around it. That is well supported. Using sound to draw or lift the stones remains, for now, awaiting discovery.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">780 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Sailendra builders begin Borobudur</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">833 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Final building stage completed</span></li><li class="wtl-study" style="--i:2"><span class="wtl-y">1680 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Robert Hooke sees nodal patterns in flour on glass</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">1787 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Chladni&#x27;s Entdeckungen über die Theorie des Klanges</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">1831 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Faraday describes patterns on vibrating liquids</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1933 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">First acoustic levitation: droplets (Bücks and Müller)</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">1967 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Hans Jenny names the field: Kymatik</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2016 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">50 mm sphere levitated, larger than the wavelength</span></li><li class="wtl-event" style="--i:8"><span class="wtl-y">2021 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Sound of Borobudur presents the reliefs&#x27; instruments</span></li><li class="wtl-event" style="--i:9"><span class="wtl-y">2026 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Engle argues the case on The Joe Rogan Experience</span></li></ol><details class="srcs"><summary>Sources for this case (12)</summary><ol><li>Chladni, E. F. F. (1787). Entdeckungen über die Theorie des Klanges. Weidmanns Erben und Reich, Leipzig.</li><li>Jenny, H. (1967, 1972). Kymatik: Wellen und Schwingungen mit ihrer Struktur und Dynamik. 2 vols. Basilius Presse, Basel. English: Cymatics (2001), Macromedia Press.</li><li>Faraday, M. (1831). On a peculiar class of acoustical figures; and on certain forms assumed by groups of particles upon vibrating elastic surfaces. Philosophical Transactions of the Royal Society 121: 299–340.</li><li>Rossing, T. D. &amp; Fletcher, N. H. (2004). Principles of Vibration and Sound, 2nd edn. Springer, New York.</li><li>Andrade, M. A. B., Bernassau, A. L. &amp; Adamowski, J. C. (2016). Acoustic levitation of a large solid sphere. Applied Physics Letters 109: 044101. <a href="https://doi.org/10.1063/1.4959862" target="_blank" rel="noopener">doi:10.1063/1.4959862</a></li><li>Fall, A., Weber, B., Pakpour, M. et al. (2014). Sliding friction on wet and dry sand. Physical Review Letters 112: 175502. <a href="https://doi.org/10.1103/PhysRevLett.112.175502" target="_blank" rel="noopener">doi:10.1103/PhysRevLett.112.175502</a></li><li>Situngkir, H. (2015). Borobudur was built algorithmically. arXiv:1508.03649.</li><li>UNESCO (2021). Exploring Borobudur World Heritage Site through music. unesco.org.</li><li>UNESCO World Heritage Centre. Borobudur Temple Compounds (inscribed 1991), nomination and description.</li><li>Kjellson, H. Försvunnen teknik (Swedish; English title &#x27;The Lost Techniques&#x27;), as retold in Cathie, B. L. (1983). The Bridge to Infinity. Quark Enterprises.</li><li>Clarke, A. J. I. et al. (2024). A Scottish provenance for the Altar Stone of Stonehenge. Nature 632: 570–575. <a href="https://doi.org/10.1038/s41586-024-07652-1" target="_blank" rel="noopener">doi:10.1038/s41586-024-07652-1</a></li><li>Engle, T. CPAK XIV 2026 presenter page, &#x27;Frequency to Form: How Sound Built The Ancient World&#x27;, cpakonline.com; Bass Forge short video &#x27;Borobudur Temple Cymatic Pattern Theory Explained&#x27; (TikTok, @bassforge.us); The Joe Rogan Experience #2558 (24 September 2026), as summarised by third-party write-ups (finance.biggo.com).</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-cymatic-temples" data-t="Cymatic Temples: Did Sound Shape the Stones?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Cymatic Temples: Did Sound Shape the Stones?</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-cymatic-temples</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-giza-power-plant-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Great Pyramid of Giza Grand Gallery.jpg" data-cap="Great Pyramid of Khufu, Giza plateau, Egypt" data-big><figcaption></figcaption></figure><div class="sh-k">Chambers, Sound and Stone</div><h2 class="sh-t" id="case-giza-power-plant-st" tabindex="-1">The Giza Power Plant: Tomb or Machine?</h2><p class="sh-s">Granite that hums, salt on the walls, shafts that go nowhere. Was the Great Pyramid a power station that we mistook for a tomb?</p><div class="sh-v"><span class="vstamp vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><p class="sh-claim"><b>What the stamp rates:</b> The Great Pyramid was built to generate, convert or store energy, as a power plant or chemical works, rather than as Khufu&#x27;s tomb.</p></div><p class="v4-q">Was the Great Pyramid built to generate or store energy, not to bury a king?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Engineer Christopher Dunn proposed in 1998 that the Great Pyramid was a power plant, not a tomb.</li><li>A machine should leave traces, so the idea can be tested.</li><li>A 2026 study found the salt on the Queen&#x27;s Chamber walls is rock salt from the limestone itself, not a reaction product.</li><li>The quartz grains in granite point every which way, so their electrical effects largely cancel.</li><li>Sealed rooms above the King&#x27;s Chamber carry Khufu&#x27;s name, painted by work gangs; there is a king&#x27;s name, and no trace of a machine.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Physics</span><span class="thr">Chemistry</span><span class="thr">Archaeology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="43" >43</b><span class="ctr-u"> m</span></div><div class="ctr-l">height of the King&#x27;s Chamber floor above the base</div><div class="ctr-c">Petrie 1883; Lehner 1997</div></div><div class="ctr"><div class="ctr-v">more than <b class="ctr-n" data-v="12" >12</b><span class="ctr-u"> times</span></div><div class="ctr-l">Khufu&#x27;s name painted in the sealed relieving chambers</div><div class="ctr-c">Vyse 1840–42</div></div><div class="ctr"><div class="ctr-v">up to c. <b class="ctr-n" data-v="80" >80</b><span class="ctr-u"> t</span></div><div class="ctr-l">heaviest granite blocks in the King&#x27;s Chamber structure</div><div class="ctr-c">Lehner 1997</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="680" >680</b><span class="ctr-u"> km</span></div><div class="ctr-l">straight-line distance from the Aswan granite quarries to Giza</div><div class="ctr-c">map distance</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The Great Pyramid was built to generate, convert or store energy, as a power plant or chemical works, rather than as Khufu&#x27;s tomb.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The machine readings make specific predictions that can be checked, and the checks go against them. The salt on the Queen&#x27;s Chamber walls is halite from the limestone itself, not a reaction product. Quartz grains in granite point every which way, so their piezoelectric effects largely cancel. No residue, soot, fittings or wear have been found, and the upper rooms were sealed with granite plugs. Against this stands direct, independent evidence for a royal tomb: Khufu&#x27;s name in sealed chambers, Merer&#x27;s logbook, the workers&#x27; town and the sarcophagus. The pyramid&#x27;s resonance is real; its use as a machine is not supported.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 6 of 6, presented as settled fact"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>presented as settled fact</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks present the pyramid as Khufu&#x27;s tomb as settled fact. The direct evidence, work-gang marks, a logbook and a workers&#x27; town, ties it firmly to Khufu&#x27;s reign and to a king&#x27;s name; what it cannot show is when work on the plateau first began, or what the burial held. No body, lid or grave goods were ever recorded, and the shafts and the Big Void remain unexplained. Being honest about those gaps is what keeps the machine idea alive.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Work-gang marks painted on the blocks of the five relieving chambers above the King&#x27;s Chamber, spaces sealed during construction and first entered in 1837, include Khufu&#x27;s name more than a dozen times, in gang names such as &#x27;The white crown of Khnum-Khufu is powerful&#x27;.<small>Vyse 1840–42; Lehner 1997</small></li><li>Papyri found in 2013 at the Red Sea harbour of Wadi al-Jarf include the logbook of an inspector named Merer, whose crew shipped Tura limestone to &#x27;Akhet-Khufu&#x27;, the pyramid&#x27;s ancient name, late in Khufu&#x27;s reign.<small>Tallet 2017; Tallet and Lehner 2021</small></li><li>A planned settlement south of the Sphinx, Heit el-Ghurab, with bakeries, storerooms and long galleries, housed and fed part of the Giza workforce; builders&#x27; tombs lie on the slope above it.<small>Lehner and Hawass 2017</small></li><li>The King&#x27;s Chamber holds a lidless granite sarcophagus, and three granite plugs still block the lower end of the ascending passage, the way into the upper rooms; later tunnellers dug around them.<small>Petrie 1883; Lehner 1997</small></li><li>A 2026 study of the chamber surfaces found that the salt efflorescence in the Queen&#x27;s Chamber is mainly halite (rock salt) that comes from the nummulitic limestone itself, and that it spread markedly between 2022 and 2024 as visitors raised humidity.<small>Sessa et al. 2026</small></li><li>Laboratory tests on quartz-bearing granites found piezoelectric effects no larger than expected from randomly oriented quartz grains, which largely cancel each other out.<small>Tuck, Stacey and Starkey 1977</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>What the four narrow shafts from the King&#x27;s and Queen&#x27;s Chambers were for: ventilation, the king&#x27;s spirit and the stars, or something the builders abandoned.</li><li>Whether Khufu was ever buried in the sarcophagus, since no body or grave goods were recorded when the chamber was first described.</li><li>What the Big Void found by muon imaging in 2017 is, and whether it served the building work or a ritual purpose.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>The pyramid was robbed in antiquity; whatever burial, lid and grave goods it held are gone, along with any records of their removal.</li><li>What lies behind the small pinned slabs at the ends of the Queen&#x27;s Chamber shafts has been glimpsed by robot cameras but not fully explored.</li><li>The Big Void, at least 30 m long, has not been entered, so its shape and contents are unknown.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Egyptologists read the Great Pyramid as the tomb and eternal monument of Khufu, the high point of a sequence that runs from Djoser&#x27;s step pyramid through Meidum, the Bent Pyramid and the Red Pyramid. The evidence is unusually direct: the king&#x27;s name painted by his work gangs inside sealed spaces, the logbook of a crew delivering its casing stone, the workers&#x27; town and cemeteries, a granite sarcophagus, and radiocarbon dates on its mortar that fall in the Old Kingdom. Specialists have been slower to explain some details, such as the shafts and the Big Void, and the building method is still debated.</p><ul><li>The pyramid sits inside a funerary complex with a mortuary temple, a causeway, boat pits and queens&#x27; pyramids, like other royal tombs.</li><li>Its design grew step by step from earlier royal tombs, whose experiments and failures can still be seen.</li><li>Granite plugs sealed the upper rooms from inside, which suits a closed tomb and not a machine that needed tending.</li><li>No chemical residue, soot, wiring, metal fittings or worn machine parts of the kind a power plant would leave has been reported.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Christopher Dunn, an engineer and machinist, argued in 1998 that the pyramid was a vast acoustic device: chemicals fed down the Queen&#x27;s Chamber shafts made hydrogen, resonators in the Grand Gallery turned the ground&#x27;s constant vibration into sound, and the granite King&#x27;s Chamber resonated and turned that energy into a microwave beam that left by the south shaft. Tyler Engle, an engineer and musician who argues that ancient monuments were functional systems, reportedly described it on Joe Rogan&#x27;s show as a passive converter that draws radio-frequency energy into the ground, with quartz-rich, iron-bearing Aswan granite chosen as a tuning element. Geoffrey Drumm reads the pyramids as chemical works that made fertiliser.</p><ul><li>Aswan granite, hauled hundreds of kilometres, is rich in quartz, a piezoelectric mineral that makes a voltage when squeezed.</li><li>The King&#x27;s Chamber and the relieving chambers above it look to engineers like tuned, stacked resonators.</li><li>The Queen&#x27;s Chamber walls carry salt crusts, which Dunn and Engle read as residue from chemical reactions.</li><li>The shafts, sealed with small stone slabs fitted with copper pins, look to them more like plumbing than symbolism.</li></ul><div class="face-s"><b>Its strongest point</b><p>The building is plainly more than a burial pit: its hidden relieving chambers, narrow shafts, great corbelled gallery and granite-lined room have no simple ritual explanation that every Egyptologist agrees on, and engineers are right that the chambers resonate.</p></div><p class="face-cr"><b>Credit</b> Tyler Engle (Bass Forge), on The Joe Rogan Experience #2558 (September 2026) and the Aubrey Marcus Podcast #517; Christopher Dunn (The Giza Power Plant, 1998); Geoffrey Drumm (The Land of Chem)</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Chemical analysis of residues in the shafts and chambers for reaction products (such as zinc compounds or sulfates) that cannot come from the limestone, the granite or visitors.</li><li>Measurements of any electrical or electromagnetic output from the King&#x27;s Chamber granite under natural ground vibration, compared with an ordinary granite block.</li><li>Full exploration of the spaces behind the Queen&#x27;s Chamber shaft slabs and of the Big Void, with published results.</li><li>A single component, fitting or wear pattern in the pyramid that only a machine explanation accounts for.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">6 min read · 1,368 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Giza Power Plant: Tomb or Machine?"><button type="button" class="wtoc-i" data-go="giza-power-plant-s1">A machine made of stone?</button><button type="button" class="wtoc-i" data-go="giza-power-plant-s2">What is inside</button><button type="button" class="wtoc-i" data-go="giza-power-plant-s3">The power plant at its strongest</button><button type="button" class="wtoc-i" data-go="giza-power-plant-s4">The tomb&#x27;s paperwork</button><button type="button" class="wtoc-i" data-go="giza-power-plant-s5">Putting the machine to the test</button><button type="button" class="wtoc-i" data-go="giza-power-plant-s6">What time has taken</button><button type="button" class="wtoc-i" data-go="giza-power-plant-s7">What would change the verdict</button></nav></div><section class="wsec" id="giza-power-plant-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A machine made of stone?</h3><p>On 24 September 2026 Tyler Engle, the engineer and electronic musician behind the Bass Forge channel, sat down with Joe Rogan and made a case many listeners had never heard: that the Great Pyramid was not a tomb at all, but a working machine. According to a third-party summary of the episode, he described it as a passive converter, drawing radio-frequency energy down into the ground, with its King&#x27;s Chamber of Aswan granite acting as a tuning element. His wider thesis, set out on his CPAK presenter page, is that ancient monuments were &#x27;functional systems designed to encode knowledge about perception, energy, and the nature of the universe&#x27;.</p><p>The idea is older than Bass Forge. In 1998 the engineer Christopher Dunn published The Giza Power Plant, arguing that the pyramid turned the Earth&#x27;s vibrations into a beam of microwaves. It has become one of the most popular alternative readings of any ancient building. So it deserves a proper test: what does the machine predict, and what is actually inside?</p><blockquote class="wpull"><p>A good theory of the pyramid has to explain the rooms, the shafts, the salt and the paperwork, all at once.</p></blockquote></section><section class="wsec" id="giza-power-plant-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What is inside</h3><p>For six million tonnes of stone, the interior is small. An entrance about 17 m up the north face opens onto a passage sloping down into the bedrock to an unfinished chamber. Part way down, an ascending passage climbs to the Grand Gallery, a corbelled hall about 46.7 m long and 8.6 m high. A level passage leads to the so-called Queen&#x27;s Chamber on the pyramid&#x27;s midline. At the top of the gallery, through a small antechamber, lies the King&#x27;s Chamber, lined with red granite from Aswan, its floor about 43 m above the base.</p><p>Above it are five low compartments, the relieving chambers, roofed with granite beams, some estimated at up to about 80 tonnes. Four narrow shafts run from the two upper chambers. Those from the King&#x27;s Chamber reach the outer faces; those from the Queen&#x27;s Chamber stop some 60 m in, at small stone slabs fitted with copper pins, first reached by Rudolf Gantenbrink&#x27;s robot in 1993.</p><figure class="wx wx--steps" id="giza-power-plant-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through
