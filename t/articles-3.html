s the Nile between Luxor and Aswan, and almost every surface behind it is carved. When Auguste Mariette began clearing it in 1860, sand and silt had buried it nearly to the roof, which is partly why so much survives.</p><blockquote class="quote"><p>This beautiful day in the 10th regnal year, day 7 of the month Epeiph, in the time of the majesty the Son of Ra, Ptolemy Euergetes, was the day of the Senut-festival, when the measurements of the temple were laid out on the ground.</p><cite>Edfu building inscription, trans. Dieter Kurth, The Temple of Edfu: A Guide by an Ancient Egyptian Priest (Cairo, 2004)</cite></blockquote><p>That day fell in 237 BCE. The temple took until 57 BCE to finish. Among its inscriptions, the priests carved something stranger than a building record: an account of how the very first temples came into being, on an island in the waters before the world. That account is the source of one of the boldest claims in alternative history, and a favourite of Tyler Engle of Bass Forge.</p></section><section class="wsec" id="edfu-texts-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What the texts say</h3><p>The fullest modern study in English is Eve Reymond&#x27;s The Mythical Origin of the Egyptian Temple, published by Manchester University Press in 1969. The texts are allusive and scattered, and she assembled them into a sequence of mythical eras. In the simplest version, summarised by Egyptologist Brett McClain, an island of sand covered in reeds rises from the waters of chaos. Creator beings called the Shebtiu gather there. A reed is set up as a perch, and the first falcon god alights on it: the seat of the first occasion. Sacred districts appear, and the temple is founded.</p><figure class="wx wx--steps" id="edfu-texts-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">The primeval island, as the Edfu texts tell it</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The primeval island, as the Edfu texts tell it"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" class="wx-svg" role="img" aria-labelledby="edfu-texts-f1-t"><title id="edfu-texts-f1-t">The primeval island of the Edfu texts in five steps, and its two modern readings</title><text x="24" y="28" class="wx-t-cap">The first island, after Reymond 1969 and McClain 2011 · schematic</text><rect x="24" y="330" width="672" height="110" rx="8" class="wx-water wx-o60"/><path d="M44,356 q12,-6 24,0 t24,0 t24,0 M560,372 q12,-6 24,0 t24,0 t24,0 M120,404 q12,-6 24,0 t24,0 t24,0 M500,414 q12,-6 24,0 t24,0" class="wx-thin"/><path d="M44,386 q12,-6 24,0 t24,0" class="wx-line wx-s2 wx-flow" /><text x="40" y="430" class="wx-t-m">waters of chaos (Nun)</text><g class="wx-st wx-hide" data-s="4"><polygon points="318,296 326,238 354,238 356,294" class="wx-stone wx-edge"/><polygon points="364,294 366,238 394,238 402,296" class="wx-stone wx-edge"/><rect x="354" y="258" width="12" height="36" class="wx-stone2 wx-edge"/><line x1="330" y1="252" x2="350" y2="252" class="wx-thin"/><line x1="370" y1="252" x2="390" y2="252" class="wx-thin"/></g><path d="M230,334 Q360,250 490,334 Z" class="wx-sand wx-edge"/><g><line x1="270" y1="312" x2="266" y2="270" class="wx-line wx-s3"/><line x1="290" y1="304" x2="294" y2="262" class="wx-line wx-s3"/><line x1="310" y1="298" x2="306" y2="258" class="wx-line wx-s3"/><line x1="410" y1="298" x2="414" y2="258" class="wx-line wx-s3"/><line x1="430" y1="304" x2="426" y2="262" class="wx-line wx-s3"/><line x1="450" y1="312" x2="454" y2="270" class="wx-line wx-s3"/></g><line x1="492" y1="300" x2="456" y2="292" class="wx-thin"/><text x="498" y="300" class="wx-t-b wx-st" data-s="1">island of sand</text><text x="498" y="316" class="wx-t-m">covered in reeds</text><g class="wx-st" data-s="2"><line x1="360" y1="292" x2="360" y2="192" class="wx-bold wx-s3"/><ellipse cx="358" cy="176" rx="8" ry="13" class="wx-inkfill"/><circle cx="363" cy="160" r="6" class="wx-inkfill"/><polygon points="368,158 375,161 368,164" class="wx-inkfill"/><polygon points="352,186 348,200 358,190" class="wx-inkfill"/><g><circle cx="300" cy="283" r="5" class="wx-inkfill"/><line x1="300" y1="288" x2="300" y2="301" class="wx-line"/></g><g><circle cx="325" cy="277" r="5" class="wx-inkfill"/><line x1="325" y1="282" x2="325" y2="295" class="wx-line"/></g><g><circle cx="395" cy="277" r="5" class="wx-inkfill"/><line x1="395" y1="282" x2="395" y2="295" class="wx-line"/></g><g><circle cx="420" cy="283" r="5" class="wx-inkfill"/><line x1="420" y1="288" x2="420" y2="301" class="wx-line"/></g></g><g class="wx-st wx-hide" data-s="2"><text x="384" y="156" class="wx-t-b wx-halo">falcon on the reed perch:</text><text x="384" y="172" class="wx-t-m wx-halo">'seat of the first occasion'</text><line x1="296" y1="277" x2="262" y2="252" class="wx-thin"/><text x="140" y="250" class="wx-t-b wx-halo">the Shebtiu gather</text></g><g class="wx-st wx-hide" data-only="3"><polyline points="262,320 290,306 300,318 330,298 344,312 372,294 392,310 418,300 432,316 462,318" class="wx-bold wx-s4"/><path d="M70,392 C100,360 130,410 160,370 S210,330 236,322" class="wx-bold wx-s4"/><circle cx="238" cy="321" r="6" class="wx-c4"/><text x="40" y="168" class="wx-t-b wx-halo">an enemy serpent attacks</text><text x="40" y="184" class="wx-t-m wx-halo">in Reymond's reading, the first world</text><text x="40" y="200" class="wx-t-m wx-halo">and its gods die</text></g><g class="wx-st wx-hide" data-s="4"><line x1="404" y1="262" x2="500" y2="236" class="wx-thin"/><text x="506" y="226" class="wx-t-b wx-halo">the temple founded</text><text x="506" y="242" class="wx-t-m wx-halo">on the first land</text></g><g class="wx-st wx-hide" data-s="5"><rect x="24" y="44" width="262" height="72" rx="8" class="wx-card wx-edge-soft"/><text x="38" y="66" class="wx-t-cap">Egyptologists</text><text x="38" y="86" class="wx-t">local temple theology: every</text><text x="38" y="102" class="wx-t">temple is the first island</text><rect x="434" y="44" width="262" height="72" rx="8" class="wx-card wx-edge-soft"/><text x="448" y="66" class="wx-t-cap wx-t-a">Collins, Hancock, Engle</text><text x="448" y="86" class="wx-t">memory of a real homeland</text><text x="448" y="102" class="wx-t">lost to catastrophe</text></g><text x="24" y="468" class="wx-t-s">The texts are allusive and scattered; this sequence is a modern reconstruction.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> An island of sand, covered in reeds, rises from the waters of chaos.</p><ol class="wx-steplist"><li>An island of sand, covered in reeds, rises from the waters of chaos.</li><li>The Shebtiu gather; a reed perch is raised and the falcon god alights: the seat of the first occasion.</li><li>An enemy serpent attacks; in Reymond&#x27;s reading the first world and its gods die.</li><li>Successors restore what was lost, and the temple is founded on the mound: every temple re-enacts the first island.</li><li>Two readings: local temple theology (Egyptologists) or the memory of a lost homeland (Collins, Hancock, Engle).</li></ol><figcaption>The mythical sequence in five steps, following Reymond 1969 and McClain 2011, and the two ways it is read today. Schematic. <span class="wx-src">Based on: Sequence after Reymond 1969 and McClain 2011; drawing schematic, not to scale.</span></figcaption><p class="vh">A band of blue water across the bottom with a sandy mound in the middle. Step 1: reeds grow on the island of sand in the waters of chaos. Step 2: small figures for the Shebtiu gather and a falcon perches on a tall reed, the seat of the first occasion. Step 3: a serpent rises from the water and a dark shade falls over the island, the first world destroyed in Reymond&#x27;s reading. Step 4: a temple pylon stands on the mound, the temple founded on the first land. Step 5: two boxes above: on the left, Egyptologists read temple theology; on the right, Collins, Hancock and Engle read a memory of a lost homeland.</p></figure><p>Reymond&#x27;s reconstruction, as Hancock and others summarise it, goes further. She identified an &#x27;Island of the Egg&#x27;, a &#x27;Homeland of the Primeval Ones&#x27;, an enemy in the form of a serpent that attacked the island, the death of its first divine inhabitants, and a later period in which their successors, with the Shebtiu, the Seven Sages and the god Thoth, restored what had been lost and founded new sacred domains. In a passage Graham Hancock quotes, she suggested that the texts preserve the memory of a predynastic religious centre near Memphis.</p><aside class="wcall"><b>How do we know?</b><p>The inscriptions were copied and published by Émile Chassinat and colleagues in the multi-volume Le Temple d&#x27;Edfou from the 1890s. Reymond worked from those volumes. Since 1986 the Edfu Project, founded by Dieter Kurth in Hamburg and run by the Göttingen Academy since 2002, has been producing full German translations, including the pylon and both faces of the girdle wall. Modern readings of the cosmogony build on that work.</p></aside></section><section class="wsec" id="edfu-texts-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The Egyptologists&#x27; reading</h3><p>For most Egyptologists, the Edfu cosmogony is theology, and very Egyptian theology at that. Across Egypt, creation began with a mound emerging from the waters of Nun, an image as old as the Pyramid Texts of the 24th century BCE. It suited a land where, every autumn, the falling flood left islands of fresh mud gleaming in the water. Late temples such as Edfu and Esna each told this story so that their own site became the first land, and the temple building itself embodied the primeval island. McClain describes these compositions as syntheses of pre-existing traditions adapted to local cults.</p><p>Several details used by the challengers have ordinary explanations. The dramatic boat scenes on the enclosure wall belong to the Triumph of Horus, a ritual drama in which Horus harpoons his enemy Seth, not a migration from another land. The hacked faces are common on Egyptian temple reliefs after the temples closed, usually blamed on later iconoclasts. And the archaeology of Edfu begins with a town of the Early Dynastic period and a small Dynasty 3 pyramid nearby, around 3000–2600 BCE.</p><blockquote class="wpull"><p>&#x27;Ptolemaic&#x27; dates the chisel marks, not the ideas. The question is how far back the ideas go.</p></blockquote></section><section class="wsec" id="edfu-texts-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The lost-homeland case</h3><p>Andrew Collins, in Gods of Eden (1998), took the Edfu beings literally. The Shebtiu, the falcons, the sages and the ancestors were in his view a real people, &#x27;Elder Gods&#x27; who had lived in Egypt and vanished before the first farming villages rose in northern Syria and south-east Turkey. Graham Hancock, in Magicians of the Gods (2015), reads Reymond&#x27;s sequence as a flood-and-fire catastrophe that destroyed a sacred island in the ocean, after which surviving sages sailed out to rebuild civilisation. He ties it to the Younger Dryas and to Plato, whose Atlantis story was told to Solon by priests at Sais in Egypt.</p><p>Tyler Engle brought the idea to The Joe Rogan Experience in September 2026. According to a third-party summary, he called the Edfu building texts &#x27;the first records of Atlantis that we have,&#x27; earlier than Plato, and described scenes of gods arriving by boat from another land. It fits his wider thesis, stated on his CPAK presenter page, that ancient monuments and myths were &quot;functional systems designed to encode knowledge about perception, energy, and the nature of the universe itself.&quot;</p><p>There is a real strength here. The priests of Edfu kept a library, whose book titles are carved on its walls, and, in a line Reymond translated, said the temple was built according to a book that came down from the sky north of Memphis. The myth is not a simple creation story: a world is built, destroyed and deliberately rebuilt by survivors. The same pattern appears in the Mesopotamian apkallu sages who bring the arts of civilisation. Readers of the atlantis and flood cases here will recognise the shape.</p></section><section class="wsec" id="edfu-texts-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Where the evidence runs out</h3><figure class="wx wx--static" id="edfu-texts-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">How old is the memory?</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How old is the memory?"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" class="wx-svg" role="img" aria-labelledby="edfu-texts-f2-t"><title id="edfu-texts-f2-t">Timeline from 12,000 BCE to 1 CE placing the Edfu carving, older Egyptian traditions and the proposed lost homeland</title><text x="24" y="28" class="wx-t-cap">12,000 years on one linear scale</text><text x="40" y="62" class="wx-t-b">Younger Dryas cold spell</text><rect x="96" y="72" width="64" height="18" rx="3" class="wx-water2 wx-growx" style="--d:1"/><text x="170" y="86" class="wx-t-s">c. 10,950–9,750 BCE</text><text x="40" y="126" class="wx-t-b">Plato's date for Atlantis</text><circle cx="168" cy="144" r="7" class="wx-card wx-dash wx-pop" style="--d:2"/><text x="182" y="148" class="wx-t-s">c. 9600 BCE: '9,000 years' before Solon, told by priests at Sais</text><line x1="176" y1="196" x2="458" y2="196" class="wx-dash" marker-end="url(#edfu-texts-f2-ah)" marker-start="url(#edfu-texts-f2-ah)"/><defs><marker id="edfu-texts-f2-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text x="317" y="188" text-anchor="middle" class="wx-t-m">the gap a lost-homeland reading must bridge</text><text x="40" y="240" class="wx-t-b">Predynastic Nile cultures (Naqada)</text><rect x="466.7" y="250" width="48" height="16" rx="3" class="wx-stone2 wx-growx" style="--d:4"/><text x="456" y="262" text-anchor="end" class="wx-t-s">c. 4000–3100 BCE</text><text x="40" y="300" class="wx-t-b">Edfu: first settlement, then a Dynasty 3 pyramid</text><circle cx="520" cy="318" r="6" class="wx-c3 wx-pop" style="--d:5"/><circle cx="538.7" cy="318" r="6" class="wx-c3 wx-pop" style="--d:6"/><text x="508" y="322" text-anchor="end" class="wx-t-s">c. 3000 BCE and c. 2650 BCE</text><text x="40" y="360" class="wx-t-b">Pyramid Texts: the primeval mound in writing</text><circle cx="554.7" cy="378" r="6" class="wx-c5 wx-pop" style="--d:7"/><text x="542" y="382" text-anchor="end" class="wx-t-s">c. 2350 BCE</text><text x="40" y="420" class="wx-t-b">Plato writes; the Edfu texts are carved</text><circle cx="660.8" cy="438" r="5" class="wx-inkfill wx-pop" style="--d:8"/><rect x="667.4" y="429" width="9.6" height="18" rx="2" class="wx-accfill wx-grow" style="--d:9"/><text x="650" y="442" text-anchor="end" class="wx-t-s">Plato c. 360 BCE; Edfu carved 237–57 BCE</text><line x1="40" y1="470" x2="680" y2="470" class="wx-line"/><g><line x1="40" y1="470" x2="40" y2="477" class="wx-line"/><line x1="146.7" y1="470" x2="146.7" y2="477" class="wx-line"/><line x1="253.3" y1="470" x2="253.3" y2="477" class="wx-line"/><line x1="360" y1="470" x2="360" y2="477" class="wx-line"/><line x1="466.7" y1="470" x2="466.7" y2="477" class="wx-line"/><line x1="573.3" y1="470" x2="573.3" y2="477" class="wx-line"/><line x1="680" y1="470" x2="680" y2="477" class="wx-line"/></g><text x="40" y="492" text-anchor="middle" class="wx-t-s">12,000 BCE</text><text x="146.7" y="492" text-anchor="middle" class="wx-t-s">10,000</text><text x="253.3" y="492" text-anchor="middle" class="wx-t-s">8000</text><text x="360" y="492" text-anchor="middle" class="wx-t-s">6000</text><text x="466.7" y="492" text-anchor="middle" class="wx-t-s">4000</text><text x="573.3" y="492" text-anchor="middle" class="wx-t-s">2000</text><text x="680" y="492" text-anchor="middle" class="wx-t-s">1 CE</text><text x="24" y="520" class="wx-t-s">Dashed = a date given in a text, not found in the ground. Naqada and Pyramid Texts dates approximate.</text></svg></div></div><figcaption>The dates that matter to the lost-homeland reading, on one linear scale: the carving is recent, the ideas behind it older, and the proposed homeland far older still. <span class="wx-src">Based on: Kurth 2004; Tell Edfu Project; Plato, Timaeus 23e; Younger Dryas dates as used elsewhere on this site. Naqada and Pyramid Texts dates approximate.</span></figcaption><p class="vh">A timeline from 12,000 BCE to 1 CE. Near the left, a blue band marks the Younger Dryas cold spell, about 10,950 to 9,750 BCE, and a dashed circle marks Plato&#x27;s date for Atlantis, about 9,600 BCE. A long empty stretch follows. Near the right, a bar marks the predynastic Naqada cultures, about 4000 to 3100 BCE, then dots for the first settlement at Edfu about 3000 BCE, the Dynasty 3 pyramid at South Edfu, and the Pyramid Texts about 2350 BCE. At the far right, a dot marks Plato writing about 360 BCE and a thin accent bar marks the Edfu carving, 237 to 57 BCE.</p></figure><p>The trouble is that nothing in the texts points outside Egypt. The island, the reeds, the falcon, the mound and the builder gods are the furniture of Egyptian theology, not a foreign coastline. The carving itself postdates Plato by more than a century, so &#x27;earlier than Plato&#x27; can apply only to lost sources whose age nobody knows. The enemy serpent is a standard Egyptian figure of chaos. And no site in Egypt or its neighbours shows a complex society in the Late Pleistocene, the period Hancock has in mind.</p><p>Time has destroyed much. The papyri in the Edfu library are gone. Predynastic Egypt lies under metres of Nile silt, and the Late Pleistocene coast of the Mediterranean is under the sea. Absence of evidence in places nobody can dig is weak evidence. But the claim here is about what the texts remember, and the texts themselves read most naturally as a theology of the temple.</p></section><section class="wsec" id="edfu-texts-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What would settle it</h3><p>The cleanest test is philological. If older papyri or earlier temple inscriptions turn up carrying the island narrative, scholars can see how far back its details go, and whether the destruction episode grows or shrinks with age. A fresh reading of the whole record from the Edfu Project&#x27;s translations would show whether Reymond&#x27;s sequence of eras is in the texts or partly in her arrangement. Archaeology could test her own, more modest idea of a predynastic cult centre near Memphis. And a monumental site of the Late Pleistocene in or near Egypt would change everything. Until then, the Edfu texts are a magnificent record of how Egyptians thought about beginnings, with a haunting story of loss and renewal at their heart, but not yet a memory of Atlantis.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">237 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Temple of Horus laid out under Ptolemy III</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">142 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Main temple building completed</span></li><li class="wtl-build" style="--i:2"><span class="wtl-y">57 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Temple completed under Ptolemy XII</span></li><li class="wtl-find" style="--i:3"><span class="wtl-y">1860 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Auguste Mariette begins clearing the buried temple</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">1969 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Eve Reymond, The Mythical Origin of the Egyptian Temple</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1986 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Dieter Kurth founds the Edfu Project</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">1998 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Andrew Collins, Gods of Eden</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2015 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Graham Hancock, Magicians of the Gods</span></li><li class="wtl-event" style="--i:8"><span class="wtl-y">2026 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Tyler Engle calls the texts a record of Atlantis on JRE #2558</span></li></ol><details class="srcs"><summary>Sources for this case (13)</summary><ol><li>Reymond, E. A. E. (1969). The Mythical Origin of the Egyptian Temple. Manchester: Manchester University Press.</li><li>McClain, J. B. (2011). Cosmogony (Late to Ptolemaic and Roman Periods). In UCLA Encyclopedia of Egyptology. Los Angeles.</li><li>Finnestad, R. B. (1985). Image of the World and Symbol of the Creator: On the Cosmological and Iconological Values of the Temple of Edfu. Wiesbaden: Harrassowitz.</li><li>Kurth, D. (2004). The Temple of Edfu: A Guide by an Ancient Egyptian Priest. Cairo: American University in Cairo Press.</li><li>Kurth, D. (2004). Edfou VII. Die Inschriften des Tempels von Edfu, Abteilung I: Übersetzungen, Band 2. Wiesbaden: Harrassowitz.</li><li>Rochemonteix, M. de &amp; Chassinat, É. (1892–1934). Le Temple d&#x27;Edfou. Cairo: Institut français d&#x27;archéologie orientale.</li><li>Moeller, N. &amp; Marouard, G. Tell Edfu Project, Institute for the Study of Ancient Cultures, University of Chicago (isac.uchicago.edu).</li><li>Moeller, N. (2016). The Archaeology of Urbanism in Ancient Egypt: From the Predynastic Period to the End of the Middle Kingdom. Cambridge: Cambridge University Press.</li><li>Plato, Timaeus 21e–25d and Critias.</li><li>Collins, A. (1998). Gods of Eden: Egypt&#x27;s Lost Legacy and the Genesis of Civilisation. London: Headline.</li><li>Hancock, G. (2015). Magicians of the Gods. London: Coronet.</li><li>CPAK presenter page: Tyler Engle (cpakonline.com/presenters/tyler-engle.html), accessed September 2026.</li><li>The Joe Rogan Experience #2558, Tyler Engle (24 September 2026); episode summary at finance.biggo.com/podcast/504223911cd0b1d7 (third-party write-up).</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-edfu-texts" data-t="The Edfu Texts: A Lost Homeland on a Temple Wall?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Edfu Texts: A Lost Homeland on a Temple Wall?</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-edfu-texts</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-big-void-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Kheops-Pyramid.jpg" data-cap="The Great Pyramid of Khufu, Giza" data-big><figcaption></figcaption></figure><div class="sh-k">Chambers, Sound and Stone</div><h2 class="sh-t" id="case-big-void-st" tabindex="-1">The Big Void: A Hidden Space in the Great Pyramid</h2><p class="sh-s">Particles from space passed through the Great Pyramid and found an empty space at least 30 metres long that nobody has ever entered.</p><div class="sh-v"><span class="vstamp vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><p class="sh-claim"><b>What the stamp rates:</b> A large hidden space exists above the Grand Gallery of the Great Pyramid.</p></div><p class="v4-q">What is the large empty space that cosmic-ray muons revealed above the Grand Gallery?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Cosmic rays hitting the upper air make particles called muons, which rain down through everything, including stone.</li><li>Stone absorbs some of them; empty space lets more through. Counting muons from many directions maps where a building is hollow.</li><li>In 2017 three separate detector teams found too many muons coming from above the Great Pyramid&#x27;s Grand Gallery: an empty space at least 30 metres long.</li><li>In 2023 the same method found a smaller corridor behind the north face, and a camera pushed between the stones showed it: empty, with a gabled roof.</li><li>The Big Void itself has not been entered. Its shape, purpose and date of sealing are unknown. Strong evidence it exists; its meaning is open.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Physics</span><span class="thr">Archaeology</span><span class="thr">Engineering</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">at least <b class="ctr-n" data-v="30" >30</b><span class="ctr-u"> m</span></div><div class="ctr-l">minimum length of the Big Void</div><div class="ctr-c">Morishima et al. 2017</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="3" >3</b><span class="ctr-u"> methods</span></div><div class="ctr-l">independent muon detector technologies that saw it</div><div class="ctr-c">Morishima et al. 2017</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="9" >9</b><span class="ctr-u"> m</span></div><div class="ctr-l">length of the north face corridor, seen by camera in 2023</div><div class="ctr-c">Procureur et al. 2023</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="10000" >10,000</b><span class="ctr-u"> per m² per minute</span></div><div class="ctr-l">muons reaching the ground, roughly</div><div class="ctr-c">standard particle physics</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>A large hidden space exists above the Grand Gallery of the Great Pyramid.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The existence of the void rests on three independent detector technologies, peer review in Nature, and a later confirmation of the method when a camera entered the corridor it predicted. That makes it strong evidence. What the void is, and why it was built, is open: nobody has seen inside.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 2 of 6, cautious"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>cautious</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">The honest update is simple: the Great Pyramid contains at least one large sealed space whose purpose is unknown, found by physics rather than by digging.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>ScanPyramids, a mission of Cairo University and the HIP Institute in Paris under Egypt&#x27;s Ministry of Antiquities, began scanning the Great Pyramid with non-invasive methods in October 2015.<small>Morishima et al. 2017</small></li><li>Three independent muon technologies detected the same excess of muons from a region above the Grand Gallery: nuclear emulsion films (Nagoya University) and scintillator hodoscopes (KEK) placed in the Queen&#x27;s Chamber, and gas detectors (CEA) outside the north face. The void is at least 30 m long, with a cross-section similar to the Grand Gallery&#x27;s, detected at a statistical significance above 5 sigma.<small>Morishima et al. 2017</small></li><li>The 2017 data could not tell whether the void is horizontal or inclined, or whether it is one space or several close together.<small>Morishima et al. 2017</small></li><li>A smaller corridor behind the chevron blocks of the north face, about 9 m long and 2 m by 2 m, about 20 m above the base, was characterised with muons at over 10 sigma and then seen with an endoscope in March 2023: empty, with a gabled ceiling.<small>Procureur et al. 2023</small></li><li>Electrical resistivity tomography published in 2025 independently picked up the north face corridor.<small>Pugacheva et al. 2025</small></li><li>Muography in archaeology began with Luis Alvarez, who scanned Khafre&#x27;s pyramid in the late 1960s with spark chambers and found no hidden chambers in the volume he covered.<small>Alvarez et al. 1970</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the Big Void is a single long space or a group of smaller cavities, and whether it slopes like the Grand Gallery or runs level.</li><li>What it was for: a relieving space over the Grand Gallery, a gap left by the building process, a construction corridor, or a room with a purpose of its own.</li><li>Whether the North Face Corridor connects to the Big Void or to anything else; the 2023 study found no link but could not exclude a passage under 1 m wide.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Nobody has entered or photographed the Big Void; everything known comes from counting particles.</li><li>Its exact size, shape and position within a few metres are not yet pinned down; a proposed larger muon telescope outside the pyramid would sharpen the picture.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Physicists and Egyptologists accept the muon result as a real deficit of stone above the Grand Gallery; three methods and later studies agree. Most read it as a construction feature, such as an open space built to take weight off the gallery roof, as the stacked relieving chambers do above the King&#x27;s Chamber, or a space left by the building process. Zahi Hawass was sceptical when the void was announced in 2017 and later called the north face corridor a major discovery. What almost nobody claims is that it is known to hold anything.</p><ul><li>Three independent detector technologies saw the same excess.</li><li>The corridor found by the same method was confirmed by a camera.</li><li>The Great Pyramid already has open spaces built to spread load: the relieving chambers.</li><li>The void&#x27;s purpose cannot be read from its density alone.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Some writers have suggested the void could be an unfound burial chamber for Khufu, a store of records or objects, or evidence that the pyramid is older or more complex than Egyptologists allow. The data say only that a large volume above the Grand Gallery holds less stone than expected. A hidden room with contents would be a much bigger claim, and nothing measured so far bears on contents at all.</p><ul></ul><p class="face-cr"><b>Credit</b> Speculative readings in books, podcasts and online video since 2017</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>A larger muon telescope outside the pyramid, as proposed by Fermilab-led physicists, to map the void&#x27;s shape to within a metre.</li><li>An endoscope through an existing joint or a small hole, as used for the north face corridor.</li><li>Publication of a full three-dimensional density model with raw data.</li><li>Structural modelling of the gallery roof to test the relieving-space reading.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">4 min read · 801 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Big Void: A Hidden Space in the Great Pyramid"><button type="button" class="wtoc-i" data-go="big-void-s1">A rain from space</button><button type="button" class="wtoc-i" data-go="big-void-s2">Three teams, one shadow</button><button type="button" class="wtoc-i" data-go="big-void-s3">The camera test</button><button type="button" class="wtoc-i" data-go="big-void-s4">What could it be?</button><button type="button" class="wtoc-i" data-go="big-void-s5">What would settle it</button></nav></div><section class="wsec" id="big-void-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A rain from space</h3><p>Every minute, roughly ten thousand muons pass through each square metre of the ground you are standing on. They are made high in the atmosphere, when cosmic rays from the Sun and from distant exploding stars smash into air molecules, and they travel so fast that most reach the surface before they decay. They pass through your body, your house and, more slowly and in smaller numbers, through rock. That last fact is what makes them useful to archaeologists. Rock absorbs muons in proportion to how much of it lies along their path. Count the muons arriving from each direction and you get a shadow picture of the material above you, like an X-ray taken with light from the sky.</p><p>The idea is not new. In the late 1960s the physicist Luis Alvarez, later famous for the asteroid theory of the dinosaurs&#x27; extinction, put detectors in a chamber under Khafre&#x27;s pyramid at Giza to look for hidden rooms. He found none in the part of the pyramid his instruments could see. What changed in the following half century was the technology: detectors became more sensitive, cheaper and easier to carry into narrow spaces.</p><blockquote class="wpull"><p>Three different machines, run by three different teams, saw the same shadow.</p></blockquote></section><section class="wsec" id="big-void-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Three teams, one shadow</h3><p>In October 2015 a project called ScanPyramids, led by Cairo University and the HIP Institute in Paris with the permission of Egypt&#x27;s Ministry of Antiquities, set out to scan the Great Pyramid without drilling a hole. Its physicists used three kinds of muon detector. A team from Nagoya University laid nuclear emulsion films, a relative of photographic film, in the Queen&#x27;s Chamber. A team from the Japanese accelerator laboratory KEK placed electronic scintillator detectors in the same room. A team from France&#x27;s CEA set up gas detectors outside, facing the north side.</p><p>In November 2017 they reported in Nature that all three had recorded an excess of muons from the same region above the Grand Gallery, the tall sloping corridor that leads up to the King&#x27;s Chamber. The excess meant that less stone lay in that direction than the known structure predicted. The simplest reading is an empty space at least 30 metres long, with a cross-section like that of the Grand Gallery itself. The statistical confidence was above five sigma, the level physicists use for a discovery. The team was careful about what it did not know: the data could not say whether the void runs level or slopes, or whether it is one space or several.</p></section><section class="wsec" id="big-void-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The camera test</h3><p>A method is only as good as its predictions. The same collaboration had also noticed a smaller anomaly just behind the great chevron blocks over the pyramid&#x27;s original entrance on the north face. In 2023 it published a precise characterisation: a corridor about nine metres long and about two metres wide and high, some twenty metres above the ground, detected at over ten sigma. Then it did what the Big Void does not yet allow. A thin endoscope camera was pushed through a joint between the stones, and it showed an empty corridor with a gabled ceiling, exactly where the muons had placed it.</p><p>In 2025 a separate team using electrical resistivity tomography, which measures how easily current flows through stone, also detected the corridor. That independent confirmation matters. It shows that muography inside the pyramid sees real spaces, and it raises confidence that the much larger void above the Grand Gallery is real too.</p></section><section class="wsec" id="big-void-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>What could it be?</h3><p>Here the evidence thins. The builders of the Great Pyramid left open spaces for structural reasons. Above the King&#x27;s Chamber sit five low compartments, one on top of another, built to spread the weight of the masonry above the chamber&#x27;s flat granite ceiling. The Grand Gallery has a corbelled roof that steps inward; an open space above it could serve a similar purpose. Other suggestions include a gap left by the way the core was built around the gallery, or a working corridor used during construction and then sealed.</p><p>Some writers have gone further, suggesting an unfound burial chamber or a store of objects. Nothing in the data speaks to contents. A muon count measures missing density, not what, if anything, lies in the gap. The void could be empty, partly filled with rubble, or divided into several spaces.</p></section><section class="wsec" id="big-void-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>What would settle it</h3><p>Physicists led from Fermilab have proposed a much larger muon telescope placed outside the pyramid, able to map its whole interior to within about a metre. A small endoscope through an existing joint, as used for the north face corridor, could show the inside directly. And structural modelling of the gallery roof could test whether a relieving space is where engineers would expect it. Until then the fair summary is two sentences long: the void is almost certainly there, and nobody yet knows why.</p><blockquote class="wpull"><p>The void is almost certainly there. Nobody yet knows why.</p></blockquote></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">2,560 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Great Pyramid built for Khufu</span></li><li class="wtl-study" style="--i:1"><span class="wtl-y">1968 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Alvarez scans Khafre&#x27;s pyramid with muons</span></li><li class="wtl-study" style="--i:2"><span class="wtl-y">2015 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">ScanPyramids begins</span></li><li class="wtl-find" style="--i:3"><span class="wtl-y">2017 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Big Void published in Nature</span></li><li class="wtl-find" style="--i:4"><span class="wtl-y">2023 CE</span><span class="wtl-k">Found</span><span class="wtl-t">North face corridor seen by endoscope</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">2025 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Resistivity study confirms the corridor</span></li></ol><details class="srcs"><summary>Sources for this case (6)</summary><ol><li>Morishima, K. et al. (2017). Discovery of a big void in Khufu&#x27;s Pyramid by observation of cosmic-ray muons. Nature 552: 386–390. doi:10.1038/nature24647</li><li>Procureur, S. et al. (2023). Precise characterization of a corridor-shaped structure in Khufu&#x27;s Pyramid by observation of cosmic-ray muons. Nature Communications 14: 1144. doi:10.1038/s41467-023-36351-0</li><li>Pugacheva, P. et al. (2025). Investigation of the North Face Corridor in the Great Pyramid of Giza using Electrical Resistivity Tomography. Scientific Reports 15: 41187. doi:10.1038/s41598-025-29081-4</li><li>Alvarez, L. W. et al. (1970). Search for hidden chambers in the pyramids. Science 167(3919): 832–839. doi:10.1126/science.167.3919.832</li><li>Bross, A. et al. (2022). Tomographic muon imaging of the Great Pyramid of Giza. Journal for Advanced Instrumentation in Science. arXiv:2202.08184</li><li>Lehner, M. &amp; Hawass, Z. (2017). Giza and the Pyramids. Thames &amp; Hudson, London.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-big-void" data-t="The Big Void: A Hidden Space in the Great Pyramid"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Big Void: A Hidden Space in the Great Pyramid</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-big-void</span> (updated 28 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-merer-tpl"><div class="xp-inner"><div class="sh-hd"><div class="sh-k">Chambers, Sound and Stone</div><h2 class="sh-t" id="case-merer-st" tabindex="-1">The Diary of Merer: What the Work Crews Wrote Down</h2><p class="sh-s">The oldest inscribed papyri ever found are the logbook of a crew that shipped limestone to the Great Pyramid.</p><div class="sh-v"><span class="vstamp vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><p class="sh-claim"><b>What the stamp rates:</b> In Khufu&#x27;s reign, organised Egyptian crews shipped casing stone to the pyramid called Akhet-Khufu, as their own records show.</p></div><p class="v4-q">What do the Wadi al-Jarf papyri show about work on the Great Pyramid, and what can&#x27;t they show?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>In 2013 archaeologists digging an ancient harbour on Egypt&#x27;s Red Sea coast found rolls of papyrus in storage galleries cut into the rock.</li><li>They are the oldest inscribed papyri known, from late in a reign they name as Khufu&#x27;s: at least 4,500 years ago on the conventional chronology.</li><li>Some are the logbook of an inspector named Merer, who ran a crew of about forty boatmen.</li><li>Day by day he recorded loading white limestone at the Tura quarries and shipping it across the Nile flood to &#x27;Akhet-Khufu&#x27;, the Horizon of Khufu: the Great Pyramid.</li><li>His boss was Ankhhaf, Khufu&#x27;s half-brother. It is direct written evidence of crews working on the pyramid in Khufu&#x27;s reign. It does not show when the first stones were laid.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Texts and scripts</span><span class="thr">Archaeology</span><span class="thr">Geology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">about <b class="ctr-n" data-v="40" >40</b><span class="ctr-u"> men</span></div><div class="ctr-l">in Merer&#x27;s crew</div><div class="ctr-c">Tallet 2017</div></div><div class="ctr"><div class="ctr-v">about <b class="ctr-n" data-v="200" >200</b><span class="ctr-u"> blocks a month</span></div><div class="ctr-l">delivered by his crew</div><div class="ctr-c">Tallet &amp; Lehner 2021</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="2013" >2,013</b><span class="ctr-u"> </span></div><div class="ctr-l">year the papyri were found</div><div class="ctr-c">Tallet &amp; Marouard 2014</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="4560" >4,560</b><span class="ctr-u"> years</span></div><div class="ctr-l">age of the papyri</div><div class="ctr-c">Tallet 2017</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>In Khufu&#x27;s reign, organised Egyptian crews shipped casing stone to the pyramid called Akhet-Khufu, as their own records show.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:91.7%" role="img" aria-label="Weight of evidence: Established"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The papyri are contemporary documents found in a sealed archaeological context and published in full. They agree with the workers&#x27; town, the cemetery, the gang marks and radiocarbon dates. Few ancient building projects are this well attested.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">The papyri are recent enough that many popular accounts have not caught up.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>A French-Egyptian mission led by Pierre Tallet and Gregory Marouard found papyri in 2013 at Wadi al-Jarf, a harbour of Khufu&#x27;s reign on the Gulf of Suez, stored in galleries cut into the hillside.<small>Tallet &amp; Marouard 2014</small></li><li>The papyri are the oldest inscribed papyri known. The best-preserved logbook entries date to the year after the 13th cattle count of Khufu, usually taken as his 27th regnal year, in the months of the Nile flood.<small>Tallet 2017; Tallet &amp; Lehner 2021</small></li><li>Merer held the title of inspector (sehedj) and led a team of about forty men.<small>Tallet 2017</small></li><li>His entries record loading limestone at Tura North and Tura South, sailing with the stone, stopping at a basin called She-Khufu, and delivering at Akhet-Khufu, the name of the Great Pyramid.<small>Tallet 2017</small></li><li>His crew made two or three round trips about every ten days, perhaps thirty blocks per trip, roughly two hundred blocks a month.<small>Tallet &amp; Lehner 2021</small></li><li>The work was supervised by Ankhhaf, Khufu&#x27;s half-brother, named as overseer of Ra-shi-Khufu, the harbour or basin at Giza.<small>Tallet 2017</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>How the Tura blocks were used: the entries fit the white casing stone of the outer faces, delivered late in the building.</li><li>Exactly where the She-Khufu basin and the Giza harbour lay, and how canals linked them to the Nile in flood season.</li><li>Why the papyri were left at a Red Sea harbour far from Giza: the crew seems to have been sent on to other state work there.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Only parts of the logbooks survive; many rolls are fragments.</li><li>The logbook covers a few months of one year, not the whole project.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Egyptologists regard the Wadi al-Jarf papyri as among the most important finds for the Old Kingdom. They show a state that organised crews, boats, canals and supplies, recorded work day by day, and named the Great Pyramid as Khufu&#x27;s in its own time. Together with the workers&#x27; town, the builders&#x27; cemetery and the work-gang marks inside the pyramid, they tie the monument firmly to Khufu&#x27;s reign.</p><ul><li>The logbook is contemporary with the building.</li><li>It names the pyramid, the king, the overseer and the quarries.</li><li>It fits the archaeology of Giza and Tura.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Some argue that Khufu only restored or reused an older pyramid. The logbook does not by itself date the core, since it records the delivery of limestone late in the reign. But it names the pyramid Akhet-Khufu while it was being finished, and it sits alongside independent evidence: radiocarbon dates on mortar within the monument, the gang marks with Khufu&#x27;s name in sealed chambers, and a building sequence of earlier pyramids leading up to it.</p><ul></ul><p class="face-cr"><b>Credit</b> Writers who argue the Great Pyramid predates Khufu</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Further excavation at Wadi al-Jarf and at the Giza harbour basin.</li><li>Coring of the ancient Nile channels and basins near Giza to map the canal route.</li><li>Publication of the remaining papyrus fragments.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">3 min read · 579 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Diary of Merer: What the Work Crews Wrote Down"><button type="button" class="wtoc-i" data-go="merer-s1">A harbour on the wrong sea</button><button type="button" class="wtoc-i" data-go="merer-s2">Inspector Merer&#x27;s logbook</button><button type="button" class="wtoc-i" data-go="merer-s3">The king&#x27;s brother</button><button type="button" class="wtoc-i" data-go="merer-s4">Why it matters</button></nav></div><section class="wsec" id="merer-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A harbour on the wrong sea</h3><p>Wadi al-Jarf lies on the western shore of the Gulf of Suez, about 120 kilometres south of the modern city of Suez, a long way from the pyramids. In Khufu&#x27;s reign it was a working harbour: a stone jetty ran out into the sea, and ships crossed to the Sinai for copper and turquoise. Behind it, cut into a limestone hill, were galleries where boats and equipment were stored between expeditions. In 2013 a team led by the French Egyptologist Pierre Tallet and Gregory Marouard cleared those galleries and found, jammed between blocks that had sealed their entrances, rolls and fragments of papyrus.</p><p>They turned out to be the oldest inscribed papyri known. And some of them were written by a man who had spent the previous months hauling stone to the Great Pyramid.</p></section><section class="wsec" id="merer-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Inspector Merer&#x27;s logbook</h3><p>The writer was Merer, an inspector in charge of a crew of about forty men. His logbook is laid out like an accounts ledger, in columns with a line for each day, in hieratic, the cursive form of Egyptian writing. The best-preserved months fall in the season of the Nile flood, when the valley turned into a shallow lake and boats could reach places that were dry land for the rest of the year.</p><p>Day after day the entries repeat. The crew loads stone at Tura, on the east bank opposite modern Cairo, where the finest white limestone was quarried. It sails north with its load, spends a night at a basin called She-Khufu, and delivers the stone at Akhet-Khufu, the &#x27;Horizon of Khufu&#x27;, which was the name of the Great Pyramid itself. Then it sails back empty. Two or three round trips every ten days, perhaps thirty blocks each time: roughly two hundred blocks a month for one crew.</p><blockquote class="wpull"><p>Load at Tura. Night at She-Khufu. Deliver at the Horizon of Khufu.</p></blockquote></section><section class="wsec" id="merer-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The king&#x27;s brother</h3><p>The logbook names the man in charge: Ankhhaf, a half-brother of Khufu, with the title of overseer of Ra-shi-Khufu, the harbour or basin at Giza. Ankhhaf is known independently; his painted limestone bust is one of the finest portraits of the Old Kingdom, now in the Museum of Fine Arts in Boston. So the chain is complete: a named crew, a named inspector, a named overseer from the royal family, a named quarry and a named pyramid, in a record kept while the work was under way.</p><p>Because the Tura stone is the fine white limestone used for the pyramid&#x27;s outer casing, most scholars think Merer&#x27;s crew was supplying the last stage of the building, late in Khufu&#x27;s reign.</p></section><section class="wsec" id="merer-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Why it matters</h3><p>For two centuries the question of who built the pyramids was answered by inference: from the scale of the state, from tombs of officials, from graffiti left by work gangs in hidden places. The Wadi al-Jarf papyri are something different, a working document from a crew on the job. They show logistics as much as labour: boats, canals timed to the flood, supplies, and a system of record-keeping that let a king&#x27;s brother keep track of it all.</p><p>They also sit comfortably with everything else found at Giza: the planned town where workers were fed, the cemetery where they were buried, the work-gang names painted inside the pyramid, and radiocarbon dates on its mortar. No single find settles a building&#x27;s date, and none of these tells us when work on the plateau first began; what is rare is for so many kinds of evidence to agree on who was working there in Khufu&#x27;s reign.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">2,589 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Khufu&#x27;s reign begins (approx.)</span></li><li class="wtl-text" style="--i:1"><span class="wtl-y">2,560 BCE</span><span class="wtl-k"></span><span class="wtl-t">Merer&#x27;s logbook written</span></li><li class="wtl-find" style="--i:2"><span class="wtl-y">2013 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Papyri found at Wadi al-Jarf</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">2016 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">First papyri shown in the Egyptian Museum, Cairo</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">2017 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Full publication by Tallet</span></li></ol><details class="srcs"><summary>Sources for this case (4)</summary><ol><li>Tallet, P. (2017). Les papyrus de la mer Rouge I: le « journal de Merer » (Papyrus Jarf A et B). MIFAO 136. IFAO, Cairo.</li><li>Tallet, P. &amp; Marouard, G. (2014). The Harbor of Khufu on the Red Sea Coast at Wadi al-Jarf, Egypt. Near Eastern Archaeology 77(1): 4–14. doi:10.5615/neareastarch.77.1.0004</li><li>Tallet, P. &amp; Lehner, M. (2021). The Red Sea Scrolls: How Ancient Papyri Reveal the Secrets of the Pyramids. Thames &amp; Hudson, London.</li><li>Lehner, M. &amp; Hawass, Z. (2017). Giza and the Pyramids. Thames &amp; Hudson, London.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-merer" data-t="The Diary of Merer: What the Work Crews Wrote Down"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Diary of Merer: What the Work Crews Wrote Down</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-merer</span> (updated 28 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-builders-town-tpl"><div class="xp-inner"><div class="sh-hd"><div class="sh-k">Chambers, Sound and Stone</div><h2 class="sh-t" id="case-builders-town-st" tabindex="-1">The Builders&#x27; Town: Who Worked at Giza</h2><p class="sh-s">Bakeries, barracks, 11 cattle a day and the tombs of the builders, with their healed bones: a workforce that lived, worked and was buried beside the pyramids.</p><div class="sh-v"><span class="vstamp vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><p class="sh-claim"><b>What the stamp rates:</b> An organised Egyptian workforce was housed, fed and buried at Giza while the pyramids were being worked on.</p></div><p class="v4-q">What does the archaeology of Giza show about the people who worked on the pyramids, and what can&#x27;t it show?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>South of the Sphinx, beyond a huge stone wall, archaeologists have dug up a planned town from the time of the pyramids.</li><li>It had long galleries where crews probably slept, bakeries, storerooms, workshops and houses for officials.</li><li>Animal bones show the people there ate a great deal of beef, sheep and goat: by one estimate eleven cattle and thirty-seven sheep and goats a day.</li><li>Up the slope, the builders&#x27; own tombs carry job titles like &#x27;overseer of the side of the pyramid&#x27;. Their skeletons show hard work and injuries that were set and healed.</li><li>Together this shows an organised, fed and cared-for workforce of Egyptians, not a mystery.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Biology</span><span class="thr">Institutions</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="7" >7</b><span class="ctr-u"> hectares</span></div><div class="ctr-l">of town excavated</div><div class="ctr-c">AERA</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="11" >11</b><span class="ctr-u"> cattle a day</span></div><div class="ctr-l">estimated consumption, with 37 sheep and goats</div><div class="ctr-c">Redding 2013</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="600" >600</b><span class="ctr-u"> graves</span></div><div class="ctr-l">of workers in the lower cemetery</div><div class="ctr-c">Hawass</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="200" >200</b><span class="ctr-u"> m</span></div><div class="ctr-l">length of the Wall of the Crow</div><div class="ctr-c">AERA</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>An organised Egyptian workforce was housed, fed and buried at Giza while the pyramids were being worked on.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:91.7%" role="img" aria-label="Weight of evidence: Established"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Excavated architecture, food remains, a cemetery with job titles, and skeletal evidence all point the same way, and they fit the written record of Merer&#x27;s logbook and the gang marks inside the pyramids.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Popular media still often present the builders as a mystery, although the town has been excavated for over thirty years.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Mark Lehner began excavating the settlement south of the Wall of the Crow (Heit el-Ghurab) in December 1988; AERA has worked there since, uncovering more than 7 hectares of a planned 4th Dynasty town.<small>AERA; Lehner &amp; Hawass 2017</small></li><li>The town includes blocks of long galleries, probably barracks for rotating work crews, as well as bakeries, storerooms, workshops, and larger houses for administrators.<small>Lehner &amp; Hawass 2017</small></li><li>The Wall of the Crow, about 200 m long and 10 m high, with a gate about 2.5 m wide, bounds the site to the north-west.<small>AERA</small></li><li>Faunal analysis by Richard Redding estimated that the town consumed about 11 cattle and 37 sheep or goats per day, supported by herds on the order of 21,900 cattle and 54,750 sheep and goats.<small>Redding 2013</small></li><li>On 14 April 1990 the builders&#x27; cemetery was found above the town when a horse stumbled on a mud-brick wall. Zahi Hawass&#x27;s excavations recorded some 600 graves for workers and larger tombs for overseers, with titles such as &#x27;overseer of the side of the pyramid&#x27; and &#x27;director of the draftsmen&#x27;.<small>Hawass, tombs of the pyramid builders</small></li><li>Skeletons show degenerative arthritis of the spine and knees, fractures that healed after splinting, and at least two amputations that the patients survived.<small>Hawass, tombs of the pyramid builders</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>How large the total workforce was: estimates range from about 10,000 at a time to 20,000–25,000 at the peak.</li><li>How labour was recruited: a rotating corvée of conscripted farmers, permanent specialists, or both.</li><li>Whether the town was mainly a workers&#x27; camp, a pyramid town serving the royal cult, or also a port for the Giza harbour.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Much of the site lies under the modern town and cannot be excavated.</li><li>Records of pay and rations are fragmentary.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Egyptologists read Heit el-Ghurab and the cemetery above it as the support base for the Giza pyramids: a state-run town that housed, fed and organised rotating crews and specialists. The finds point to a large, managed workforce of Egyptians, fed on bread, beer and meat, some of whom were buried in tombs of their own near the king&#x27;s monument, with evidence of medical care. Most scholars avoid the word &#x27;slaves&#x27;, though labour was obligatory for many under a corvée system.</p><ul><li>Planned galleries and bakeries fit a large rotating workforce.</li><li>The animal bones show a state supply chain.</li><li>Tomb titles name pyramid-building jobs.</li><li>Healed injuries show medical care.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Popular books and television have long suggested that the pyramids were beyond Old Kingdom Egypt, built by visitors or by an earlier lost civilisation. The town and the cemetery do not address building methods directly, but they show where a large workforce lived, what it ate, how it was organised and where it was buried, in the same years as the pyramids.</p><ul></ul><p class="face-cr"><b>Credit</b> Ancient-astronaut and lost-civilisation writers</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Isotope studies of the builders&#x27; bones and teeth to show where they grew up.</li><li>Further publication of the gallery blocks and their occupation phases.</li><li>Excavation of the harbour basins linked to the town.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 485 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Builders&#x27; Town: Who Worked at Giza"><button type="button" class="wtoc-i" data-go="builders-town-s1">Beyond the Wall of the Crow</button><button type="button" class="wtoc-i" data-go="builders-town-s2">A town built to feed a workforce</button><button type="button" class="wtoc-i" data-go="builders-town-s3">The builders&#x27; own tombs</button><button type="button" class="wtoc-i" data-go="builders-town-s4">What it means</button></nav></div><section class="wsec" id="builders-town-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Beyond the Wall of the Crow</h3><p>Walk south from the Sphinx for a few hundred metres and you reach a colossal stone wall, 200 metres long and 10 metres high, known locally as Heit el-Ghurab, the Wall of the Crow. For centuries it guarded nothing anyone could see. In December 1988 the American archaeologist Mark Lehner began digging on its far side, looking for the people who had built the pyramids. Over the following decades his team, later organised as Ancient Egypt Research Associates, uncovered more than seven hectares of a planned town from the 4th Dynasty.</p></section><section class="wsec" id="builders-town-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>A town built to feed a workforce</h3><p>The heart of the site is a set of long, narrow buildings arranged in blocks, which Lehner calls galleries. Each has a front porch, a long hall with low benches, and space at the back, and they are most easily read as barracks for crews who rotated through the building work. Around them are bakeries, with the bell-shaped pots used to bake bread found in place, storerooms, workshops for copper and stone, and larger houses that may have belonged to managers.</p><p>The bones tell of the diet. The zooarchaeologist Richard Redding estimated from the animal remains that the town consumed about eleven cattle and thirty-seven sheep or goats every day, and that feeding it needed herds of tens of thousands of animals grazing across the Delta. That is a state supply chain, not an improvised camp.</p><blockquote class="wpull"><p>Eleven cattle and thirty-seven sheep and goats, every day.</p></blockquote></section><section class="wsec" id="builders-town-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The builders&#x27; own tombs</h3><p>On 14 April 1990 a tourist&#x27;s horse stumbled on a buried mud-brick wall on the slope above the town. It belonged to a tomb, and it led Zahi Hawass&#x27;s team to a cemetery of builders: some six hundred graves for workers and larger tombs for overseers, with small ramps and domes imitating the royal monuments. Their inscriptions give job titles such as &#x27;overseer of the side of the pyramid&#x27;, &#x27;director of the draftsmen&#x27; and &#x27;director for the king&#x27;s work&#x27;.</p><p>The skeletons are the most personal evidence. They show spines and knees worn by heavy labour, fractures of arms and legs that had been set and healed, and at least two amputations that the patients survived. Somebody was treating these people.</p></section><section class="wsec" id="builders-town-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>What it means</h3><p>The picture that emerges is of a large, organised, fed workforce: permanent specialists plus rotating crews of conscripted farmers, housed in state buildings, supplied with bread, beer and meat, and buried near the monuments they built. Estimates of its size vary, from about ten thousand at a time to twenty or twenty-five thousand at the peak. Most scholars avoid calling them slaves, although much of the labour was an obligation owed to the state.</p><p>The town does not answer every question about how the pyramids were built. It shows who was working here, and it agrees with the logbook of Inspector Merer, the gang names painted inside the Great Pyramid, and the conventional dates of the monuments. What it cannot settle is when work on the plateau first began.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">2,560 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Town in use during pyramid building</span></li><li class="wtl-study" style="--i:1"><span class="wtl-y">1988 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Lehner begins excavating Heit el-Ghurab</span></li><li class="wtl-find" style="--i:2"><span class="wtl-y">1990 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Builders&#x27; cemetery found</span></li><li class="wtl-find" style="--i:3"><span class="wtl-y">1991 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Bakeries found</span></li></ol><details class="srcs"><summary>Sources for this case (5)</summary><ol><li>Lehner, M. &amp; Hawass, Z. (2017). Giza and the Pyramids. Thames &amp; Hudson, London.</li><li>Lehner, M. (2015). Labor and the pyramids: the Heit el-Ghurab &#x27;workers town&#x27; at Giza. In P. Steinkeller &amp; M. Hudson (eds), Labor in the Ancient World. ISLET, Dresden.</li><li>Redding, R. (2013). Estimating the number of cattle, sheep and goats consumed at Heit el-Ghurab. In Proceedings of the 10th Meeting of the ICAZ Working Group Archaeozoology of Southwest Asia and Adjacent Areas. Peeters, Leuven.</li><li>Hawass, Z. (n.d.). The discovery of the tombs of the pyramid builders at Giza. Guardian&#x27;s Egypt.</li><li>Ancient Egypt Research Associates (AERA). The Lost City of the Pyramid Builders; The Wall of the Crow. aeraweb.org.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-builders-town" data-t="The Builders&#x27; Town: Who Worked at Giza"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Builders&#x27; Town: Who Worked at Giza</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-builders-town</span> (updated 28 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-khafre-radar-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Pyramid of Khafre Giza Egypt in 2015 2.jpg" data-cap="The pyramid of Khafre, Giza" data-big><figcaption></figcaption></figure><div class="sh-k">Chambers, Sound and Stone</div><h2 class="sh-t" id="case-khafre-radar-st" tabindex="-1">The Khafre Scans: Pillars 600 Metres Down?</h2><p class="sh-s">Satellite radar, an Italian press conference and eight &#x27;pillars&#x27; plunging 648 metres under Giza. Then, in 2026, a retraction.</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> A large built structure, including shafts about 648 m deep, lies hundreds of metres beneath the pyramid of Khafre.</p></div><p class="v4-q">Is there a vast structure hundreds of metres beneath the pyramid of Khafre?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>In 2025 an Italian team said satellite radar had found eight spiral shafts and two giant box-shaped structures hundreds of metres under Khafre&#x27;s pyramid.</li><li>Satellite radar of that kind cannot see through hundreds of metres of rock; specialists in the method say so.</li><li>The claim has not appeared in a peer-reviewed journal, and the team&#x27;s earlier pyramid paper was retracted in August 2026.</li><li>Real hidden spaces do exist at Giza: muons found a 30-metre void in the Great Pyramid in 2017.</li><li>Until a drill core, a seismic survey or open data back it up, the deep pillars stay a claim.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Physics</span><span class="thr">Geology</span><span class="thr">Archaeology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="648" >648</b><span class="ctr-u"> m</span></div><div class="ctr-l">claimed depth of the eight shafts</div><div class="ctr-c">Khafre Project press statements, March 2025</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="143.5" data-dec="1">143.5</b><span class="ctr-u"> m</span></div><div class="ctr-l">original height of Khafre&#x27;s pyramid</div><div class="ctr-c">Lehner 1997</div></div><div class="ctr"><div class="ctr-v">up to c. <b class="ctr-n" data-v="2" >2</b><span class="ctr-u"> m</span></div><div class="ctr-l">typical satellite radar reach into dry sand</div><div class="ctr-c">Moss 2025, citing radar specialists</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="9" >9</b><span class="ctr-u"> m</span></div><div class="ctr-l">length of the corridor muons found in Khufu, 2023</div><div class="ctr-c">Procureur et al. 2023</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>A large built structure, including shafts about 648 m deep, lies hundreds of metres beneath the pyramid of Khafre.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Nothing independent supports it. The Khafre results were announced at a press conference, not in a paper, and the data and code have not been released. The team&#x27;s peer-reviewed paper on the Khufu pyramid, the basis for the method, was retracted in 2026. Radar specialists doubt the vibrations exist at a level satellites could measure. Yet no other survey has looked hundreds of metres down, so the rock beneath Giza has not been shown to be empty. It is a claim still waiting for evidence, not one that evidence has tested and refuted.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks describe Khafre&#x27;s pyramid, its passages and its burial chamber with confidence, and that confidence is earned: the chambers were entered in 1818 and the pyramid was muon-scanned in the 1960s. They say nothing about what lies hundreds of metres down, because no one has looked. The confidence is justified for the monument; silence, not certainty, is the right stance on the deep rock.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>The pyramid of Khafre was built around 2570 BCE; it stood about 143.5 m high on a base about 215 m square, and its known passages and burial chamber lie near or just below its base.<small>Lehner 1997</small></li><li>In the late 1960s Luis Alvarez&#x27;s team placed a cosmic-ray muon detector in Khafre&#x27;s burial chamber and found no unknown chambers in the part of the pyramid it could see.<small>Alvarez et al. 1970</small></li><li>Muon imaging does find real hidden spaces at Giza: the &#x27;Big Void&#x27;, at least 30 m long, in Khufu&#x27;s pyramid in 2017, and a corridor about 9 m long and 2 m by 2 m in 2023, later seen with an endoscope.<small>Morishima et al. 2017; Procureur et al. 2023</small></li><li>In March 2025 Corrado Malanga, Filippo Biondi and Armando Mei announced at a press conference in Italy eight vertical shafts about 648 m deep, spiral paths and two cube-shaped structures beneath Khafre, from satellite radar data.<small>Moss 2025 (National Geographic); Jerusalem Post 2025</small></li><li>No peer-reviewed paper setting out the Khafre results had appeared by mid-2025, and the team&#x27;s earlier Remote Sensing paper on Khufu&#x27;s pyramid was retracted on 10 August 2026 for &#x27;serious methodological flaws and statistical errors&#x27;.<small>Pilicy 2025; Remote Sensing retraction notice 2026</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether satellite radar, combined with tiny ground vibrations, can image anything tens or hundreds of metres inside solid rock.</li><li>Whether the features in the team&#x27;s images are real structures, natural geology or artefacts of processing.</li><li>Whether the Remote Sensing retraction also undermines the Khafre work, which used a related but unpublished method.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>The full Khafre data, processing code and error estimates have not been released for independent checking.</li><li>No drill core, seismic reflection survey or borehole has been made public that samples the rock hundreds of metres beneath the plateau.</li><li>Excavation and drilling at Giza need permits from Egypt&#x27;s antiquities authorities, and none has been granted for this project.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div
