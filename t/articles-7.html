div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,162 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Dhul-Qarnayn and the Wall Against Gog and Magog"><button type="button" class="wtoc-i" data-go="dhul-qarnayn-s1">The ruler of the two horns</button><button type="button" class="wtoc-i" data-go="dhul-qarnayn-s2">The journey in its own terms</button><button type="button" class="wtoc-i" data-go="dhul-qarnayn-s3">Who was he? The great Muslim views</button><button type="button" class="wtoc-i" data-go="dhul-qarnayn-s4">Alexander&#x27;s gates in late antique legend</button><button type="button" class="wtoc-i" data-go="dhul-qarnayn-s5">Walls between the steppe and the south</button><button type="button" class="wtoc-i" data-go="dhul-qarnayn-s6">What archaeology can and cannot test</button></nav></div><section class="wsec" id="dhul-qarnayn-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The ruler of the two horns</h3><p>Surah al-Kahf, the Cave, is one of the most beloved chapters of the Quran, recited by many Muslims every Friday. Near its end come sixteen verses about a ruler called Dhul-Qarnayn, the One of the Two Horns. He is given power and means, and he travels: to where the sun sets, to where it rises, and finally to a gap between two mountains where a frightened people ask for protection from Gog and Magog.</p><blockquote class="quote"><p>bring me lumps of iron!&#x27; and then, when he had filled the gap between the two mountainsides [he said], &#x27;Work your bellows!&#x27; and then, when he had made it glow like fire, he said, &#x27;Bring me molten metal to pour over it!&#x27; Their enemies could not scale the barrier, nor could they pierce it,</p><cite>Quran 18:96–97, trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><p>It is an engineer&#x27;s verse: iron blocks packed into a gap, bellows roaring, metal poured to bind it. And it has sent travellers, caliphs and scholars searching for a real wall for more than a thousand years.</p></section><section class="wsec" id="dhul-qarnayn-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The journey in its own terms</h3><p>The Quran introduces the story as an answer to a question: they ask you about Dhul-Qarnayn. It then tells three journeys. In the west he finds the sun, as it seemed to him, setting into a muddy spring, and a people over whom he is given the choice to punish or to show kindness; he chooses justice, punishing wrongdoers and rewarding those who believe and do good. In the east he finds a people with no shelter from the sun. Then comes the gap between the mountains.</p><p>What stands out is his character. He refuses the tribute offered, saying that what God has given him is better. He asks only for labour. When the barrier is finished he takes no credit: this is a mercy from my Lord, and when my Lord&#x27;s promise comes, He will level it. The story is less about conquest than about power used humbly, and about the limits of any human wall.</p><blockquote class="quote"><p>and he said, &#x27;This is a mercy from my Lord. But when my Lord&#x27;s promise is fulfilled, He will raze this barrier to the ground: my Lord&#x27;s promise always comes true.&#x27;</p><cite>Quran 18:98, trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><p>Gog and Magog, Yajuj and Majuj in Arabic, also appear in the Hebrew Bible, where Ezekiel speaks of Gog of the land of Magog, and in the New Testament&#x27;s Revelation, as nations of the last days. The barrier&#x27;s final breaking belongs to the end of time. That part of the story is a matter of faith, not of archaeology. The barrier&#x27;s building, in a real place, is where evidence can speak.</p></section><section class="wsec" id="dhul-qarnayn-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Who was he? The great Muslim views</h3><p>Muslim scholars have discussed Dhul-Qarnayn&#x27;s identity for fourteen centuries, with real care and disagreement. Many classical commentators identified him with al-Iskandar, Alexander. Others objected. Ibn Kathir and Ibn Taymiyyah, among others, argued that Alexander of Macedon, a pagan who was hailed as a god, could not be the God-fearing ruler of the Quran, and that Dhul-Qarnayn must be an earlier, righteous king. The exegete al-Tabari recorded explanations of the name, including that he reached the two &#x27;horns&#x27;, the extremities, of the world.</p><p>A South Arabian tradition, preserved by Wahb ibn Munabbih and in Ibn Hisham&#x27;s book on the kings of Himyar, made him a Himyarite king, al-Saʿb Dhu Marathid. In the 19th and 20th centuries a different candidate gained ground. Sayyid Ahmad Khan, and then the Indian scholar and statesman Abul Kalam Azad, proposed Cyrus the Great, founder of the Persian empire, and Abul A&#x27;la Maududi also considered him the most likely candidate.</p><blockquote class="quote"><p>As for the ram that you saw with the two horns, these are the kings of Media and Persia.</p><cite>Daniel 8:20, NRSV</cite></blockquote><p>The Cyrus case is thoughtful. Cyrus is remembered in the Hebrew Bible as God&#x27;s anointed, the liberator who let the exiles return. He was famous for justice and tolerance. His campaigns reached west to the Aegean coast, east into Central Asia and north towards the steppe, where he died around 530 BCE fighting the Massagetae. Daniel&#x27;s two-horned ram stands for the kings of Media and Persia. Supporters also point to a relief at Pasargadae, Cyrus&#x27;s capital, showing a winged figure wearing a crown set on long horns.</p></section><section class="wsec" id="dhul-qarnayn-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Alexander&#x27;s gates in late antique legend</h3><p>Western scholarship has mostly followed a different trail. By the 1st century CE, Josephus already mentions gates built by Alexander as a barrier against the Scythians. Over the following centuries the gates grew into legend. The Syriac Alexander Legend, known as the Neshana, tells how Alexander went to the place where the sun sets into fetid waters, then built a gate of iron and bronze between two mountains to shut in the Huns, among whose kings are Gog and Magog, and prophesied their breakout at the end of time.</p><p>The parallels with Quran 18 are close, and scholars from Theodor Nöldeke to Kevin van Bladel and Tommaso Tesei have argued that the Quranic passage engages with this Christian legend. The dating is part of the argument. The Syriac text was long placed around 629–630 CE, after the emperor Heraclius defeated Persia; recent work suggests an earlier 6th-century core with later additions. The direction of influence, and whether both drew on a wider body of Alexander lore, is still debated.</p><blockquote class="wpull"><p>The earliest surviving writer to put Alexander&#x27;s gates in the Caucasus wrote in the first century, six centuries before the Quran.</p></blockquote></section><section class="wsec" id="dhul-qarnayn-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Walls between the steppe and the south</h3><p>Whatever the texts&#x27; relationship, the landscape behind them is real. For a thousand years, horse peoples of the steppe raided south through a few narrow gaps: the Darial Pass through the high Caucasus, the coastal strip at Derbent where the mountains nearly meet the Caspian, and the plain east of the Caspian. Empires closed those gaps with walls.</p><figure class="wx wx--static" id="dhul-qarnayn-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Barriers between the steppe and the south</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Barriers between the steppe and the south"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" class="wx-svg" role="img" aria-labelledby="dhul-qarnayn-f1-t"><title id="dhul-qarnayn-f1-t">Map of the Caucasus and Caspian region showing the Darial Pass, the Derbent walls and the Great Wall of Gorgan, the barriers most often linked with the wall against Gog and Magog</title><defs><marker id="dhul-qarnayn-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker><marker id="dhul-qarnayn-f1-ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text class="wx-t-cap" x="24" y="28">Barriers between the steppe and the south · late antiquity</text><rect class="wx-card wx-edge-soft" x="40" y="40" width="640" height="420"/><polygon class="wx-water wx-edge-soft" points="336,40 340,92.2 372,141.3 400,180.9 424,217.5 456,225.3 436,238.4 416,269.7 396,311.4 396,337.5 420,380.9 464,410.6 544,421.1 596,413.2 600,389.7 592,337.5 568,280.1 560,248.8 556,196.6 544,144.4 496,81.8 472,40"/><polygon class="wx-water wx-edge-soft" points="40,68.7 80,92.2 106.8,136.6 105.6,163.2 60,195.6 40,199.2"/><text class="wx-t-m" x="496" y="301" text-anchor="middle">Caspian Sea</text><text class="wx-t-s" x="52" y="123.5">Black</text><text class="wx-t-s" x="52" y="136.5">Sea</text><path class="wx-bold wx-s6 wx-draw" style="--d:1" pathLength="1" d="M60,71.3 L100,73.9 L140,81.8 L180,92.2 L220,105.2 L252,118.3 L280,134 L320,152.2 L340,165.3 L372,183.6 L400,199.2"/><polygon class="wx-stone3 wx-o80" points="93,78.9 100,66.9 107,78.9"/><polygon class="wx-stone3 wx-o80" points="133,86.8 140,74.8 147,86.8"/><polygon class="wx-stone3 wx-o80" points="173,97.2 180,85.2 187,97.2"/><polygon class="wx-stone3 wx-o80" points="213,110.2 220,98.2 227,110.2"/><polygon class="wx-stone3 wx-o80" points="245,123.3 252,111.3 259,123.3"/><polygon class="wx-stone3 wx-o80" points="273,139 280,127 287,139"/><polygon class="wx-stone3 wx-o80" points="313,157.2 320,145.2 327,157.2"/><polygon class="wx-stone3 wx-o80" points="333,170.3 340,158.3 347,170.3"/><polygon class="wx-stone3 wx-o80" points="365,188.6 372,176.6 379,188.6"/><text class="wx-t-b wx-halo" x="120" y="66.5">Greater Caucasus</text><path class="wx-bold wx-s6" d="M424,418.5 L472,436.7 L520,447.2 L580,436.7 L640,426.3 L680,415.8"/><polygon class="wx-stone3 wx-o80" points="465,441.7 472,429.7 479,441.7"/><polygon class="wx-stone3 wx-o80" points="513,452.2 520,440.2 527,452.2"/><polygon class="wx-stone3 wx-o80" points="573,441.7 580,429.7 587,441.7"/><polygon class="wx-stone3 wx-o80" points="633,431.3 640,419.3 647,431.3"/><text class="wx-t-b wx-halo" x="500" y="433.2" text-anchor="middle">Alborz</text><circle class="wx-c4 wx-pop" style="--d:4" cx="225.2" cy="105.8" r="6"/><circle class="wx-hl wx-pulse" cx="225.2" cy="105.8" r="13"/><text class="wx-t-b wx-halo wx-pop" style="--d:4" x="217.2" y="133.8" text-anchor="middle">Darial Pass</text><text class="wx-t-s wx-halo wx-pop" style="--d:4" x="217.2" y="147.8" text-anchor="middle">'Caucasian Gates'</text><line class="wx-bold wx-s4 wx-draw" style="--d:5" pathLength="1" x1="321.6" y1="145.3" x2="371.6" y2="145.3"/><circle class="wx-c4 wx-pop" style="--d:5" cx="371.6" cy="145.3" r="6"/><circle class="wx-hl wx-pulse" cx="371.6" cy="145.3" r="13"/><text class="wx-t-b wx-halo wx-pop" style="--d:5" x="391.6" y="123.3">Derbent walls</text><text class="wx-t-s wx-halo wx-pop" style="--d:5" x="391.6" y="137.3">Arabic Bāb al-Abwāb, 'Gate of Gates'</text><text class="wx-t-s wx-halo wx-pop" style="--d:5" x="391.6" y="150.3">5th–6th c. CE</text><path class="wx-bold wx-s4 wx-draw" style="--d:7" pathLength="1" d="M600.8,401.2 L616,393.9 L632,389.7 L652,387.1 L676,383.5"/><text class="wx-t-b wx-halo wx-pop" style="--d:7" x="674" y="353.1" text-anchor="end">Great Wall of Gorgan</text><text class="wx-t-s wx-halo wx-pop" style="--d:7" x="674" y="367.1" text-anchor="end">195 km · Persian 'Sadd-i Iskandar'</text><text class="wx-t-cap" x="160" y="53">STEPPE PEOPLES TO THE NORTH</text><text class="wx-t-cap" x="200" y="274.9" text-anchor="middle">ARMENIA</text><text class="wx-t-cap" x="316" y="234.7" text-anchor="middle">ALBANIA (Caucasian)</text><text class="wx-t-cap" x="340" y="379.3" text-anchor="middle">SASANIAN PERSIA</text><circle class="wx-inkfill" cx="232" cy="159" r="3.5"/><text class="wx-t-s" x="225" y="173" text-anchor="end">Tbilisi</text><circle class="wx-inkfill" cx="434.8" cy="227.4" r="3.5"/><text class="wx-t-s" x="428.8" y="243.4" text-anchor="end">Baku</text><line class="wx-bold" x1="60" y1="440" x2="154.1" y2="440"/><text class="wx-t-s" x="107.1" y="432" text-anchor="middle">200 km</text><path class="wx-inkfill" d="M656,56 L662,74 L656,70 L650,74 Z"/><text class="wx-t-b" x="656" y="88" text-anchor="middle">N</text><text class="wx-t-s" x="40" y="490">Each barrier sits where mountains nearly meet the sea or close a pass: the geography the</text><text class="wx-t-s" x="40" y="504">Quran describes as 'a place between two mountain barriers' (18:93). Coastlines simplified.</text></svg></div></div><figcaption>The Caucasus and Caspian region with the three great barrier sites of late antiquity: the Darial Pass, the Derbent walls and the Great Wall of Gorgan. <span class="wx-src">Based on: Coastlines simplified from standard maps; Derbent from the UNESCO listing (2003); Gorgan wall from Sauer et al. 2013; Darial from Sauer et al. 2020.</span></figcaption><p class="vh">A map with the Black Sea at far left and the Caspian Sea in the centre-right. The Greater Caucasus range runs diagonally from the Black Sea to the Caspian coast. A highlighted point in the middle of the range marks the Darial Pass, the Caucasian Gates. On the Caspian coast where the mountains nearly meet the sea, a red line marks the Derbent walls, called Bab al-Abwab, Gate of Gates, 5th to 6th century CE. South-east of the Caspian, below the Alborz mountains, a red line running east from the coast marks the Great Wall of Gorgan, 195 kilometres long, called Sadd-i Iskandar in Persian. Labels mark the steppe peoples to the north, Armenia, Caucasian Albania and Sasanian Persia, plus Tbilisi and Baku. A 200 kilometre scale bar and north arrow are shown.</p></figure><p>At Derbent, the Sasanian Persians first built mudbrick defences in the 5th century and then, under Khosrow I in the 6th, massive stone walls. Two parallel walls run about 3.6 km from the citadel of Naryn-Kala down to the sea, 300–400 m apart, and continued 500 m into the water to protect the harbour. A mountain wall ran some 40 km west. Arab geographers called the city Bab al-Abwab, the Gate of Gates.</p><figure class="wx wx--static" id="dhul-qarnayn-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">Derbent: a city inside a wall</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Derbent: a city inside a wall"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" class="wx-svg" role="img" aria-labelledby="dhul-qarnayn-f2-t"><title id="dhul-qarnayn-f2-t">Plan of the Sasanian fortifications of Derbent: the Naryn-Kala citadel on a ridge, two parallel walls running about 3.6 km to the Caspian Sea some 300 to 400 m apart, their extension into the sea, and the mountain wall running west</title><defs><marker id="dhul-qarnayn-f2-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker><marker id="dhul-qarnayn-f2-ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text class="wx-t-cap" x="24" y="28">Derbent: a city inside a wall · simplified plan</text><rect class="wx-water" x="578" y="60" width="142" height="330"/><text class="wx-t-m" x="608" y="90">Caspian</text><text class="wx-t-m" x="608" y="104">Sea</text><rect class="wx-sand wx-o40" x="20" y="60" width="558" height="330"/><path class="wx-stone2 wx-o60" d="M20,60 L130,60 L130,390 L20,390 Z"/><text class="wx-t-s wx-halo" x="30" y="380">foothills</text><rect class="wx-stone wx-o60" x="170" y="190" width="408" height="45.5"/><text class="wx-t-b wx-halo" x="364" y="216.8" text-anchor="middle">old city between the walls</text><line class="wx-bold wx-draw" style="--d:1" pathLength="1" x1="110" y1="190" x2="643" y2="178"/><line class="wx-bold wx-draw" style="--d:2" pathLength="1" x1="140" y1="235.5" x2="643" y2="247.5"/><rect class="wx-inkfill wx-pop" style="--d:3" x="167" y="184.7" width="6" height="8"/><rect class="wx-inkfill wx-pop" style="--d:3" x="194.2" y="184.1" width="6" height="8"/><rect class="wx-inkfill wx-pop" style="--d:3" x="221.4" y="183.5" width="6" height="8"/><rect class="wx-inkfill wx-pop" style="--d:3" x="248.6" y="182.9" width="6" height="8"/><rect class="wx-inkfill wx-pop" style="--d:3" x="275.8" y="182.3" width="6" height="8"/><rect class="wx-inkfill wx-pop" style="--d:3" x="303" y="181.7" width="6" height="8"/><rect class="wx-inkfill wx-pop" style="--d:3" x="330.2" y="181.1" width="6" height="8"/><rect class="wx-inkfill wx-pop" style="--d:3" x="357.4" y="180.5" width="6" height="8"/><rect class="wx-inkfill wx-pop" style="--d:3" x="384.6" y="179.9" width="6" height="8"/><rect class="wx-inkfill wx-pop" style="--d:3" x="411.8" y="179.3" width="6" height="8"/><rect class="wx-inkfill wx-pop" style="--d:3" x="439" y="178.7" width="6" height="8"/><rect class="wx-inkfill wx-pop" style="--d:3" x="466.2" y="178.1" width="6" height="8"/><rect class="wx-inkfill wx-pop" style="--d:3" x="493.4" y="177.5" width="6" height="8"/><rect class="wx-inkfill wx-pop" style="--d:3" x="520.6" y="176.9" width="6" height="8"/><rect class="wx-inkfill wx-pop" style="--d:3" x="547.8" y="176.3" width="6" height="8"/><rect class="wx-inkfill wx-pop" style="--d:3" x="575" y="175.7" width="6" height="8"/><text class="wx-t-s" x="649" y="216.8" text-anchor="start">harbour</text><polygon class="wx-stone3 wx-edge wx-pop" style="--d:0" points="80,150 170,160 170,245.5 120,255.5 70,225.5"/><text class="wx-t-b wx-halo" x="120" y="140" text-anchor="middle">Naryn-Kala citadel</text><text class="wx-t-s wx-halo" x="120" y="154" text-anchor="middle">walls 2.5–3.2 m thick</text><path class="wx-bold wx-dash wx-draw" style="--d:4" pathLength="1" d="M70,210 C50,220 60,200 20,220"/><text class="wx-t-s wx-halo" x="24" y="286">mountain wall (Dagh-Bary)</text><text class="wx-t-s wx-halo" x="24" y="300">continues c. 40 km west</text><line class="wx-thin" x1="40" y1="274" x2="40" y2="220"/><line class="wx-dim" x1="110" y1="340" x2="578" y2="340"/><line class="wx-dim" x1="110" y1="334" x2="110" y2="346"/><line class="wx-dim" x1="578" y1="334" x2="578" y2="346"/><text class="wx-t-n wx-halo" x="344" y="334" text-anchor="middle">c. 3.6 km from citadel to shore</text><line class="wx-dim" x1="555" y1="192" x2="555" y2="233.5"/><text class="wx-t-s wx-halo" x="549" y="255.5" text-anchor="end">300–400 m apart</text><text class="wx-t-s" x="582" y="281.5">walls ran c. 500 m</text><text class="wx-t-s" x="582" y="295.5">into the sea</text><text class="wx-t-s wx-halo" x="270" y="176">north wall: 46 of the 73 towers</text><line class="wx-bold" x1="40" y1="430" x2="170" y2="430"/><line class="wx-line" x1="40" y1="424" x2="40" y2="436"/><line class="wx-line" x1="170" y1="424" x2="170" y2="436"/><text class="wx-t-s" x="105" y="452" text-anchor="middle">1 km</text><path class="wx-inkfill" d="M690,400 L696,418 L690,414 L684,418 Z"/><text class="wx-t-b" x="690" y="432" text-anchor="middle">N</text><text class="wx-t-s" x="700" y="462" text-anchor="end">Figures from the UNESCO World Heritage listing (2003); outline simplified.</text></svg></div></div><figcaption>A simplified plan of Derbent&#x27;s Sasanian defences: twin walls from the citadel to the sea, running into the water to shelter the harbour, and a mountain wall heading west. <span class="wx-src">Based on: UNESCO World Heritage listing 1070 (lengths, spacing, towers, citadel walls); outline simplified, not a survey.</span></figcaption><p class="vh">Plan view with the Caspian Sea on the right and foothills on the left. The Naryn-Kala citadel sits on the high ground at the west end. From it two nearly parallel walls run east for about 3.6 kilometres to the shore, 300 to 400 metres apart, with towers marked along the north wall; the old city fills the narrow strip between them. Both walls continue about 500 metres into the sea to form a harbour. A dashed line runs west from the citadel as the mountain wall, Dagh-Bary, which continues about 40 kilometres. Labels note 46 of the 73 towers on the north wall and citadel walls 2.5 to 3.2 metres thick. A 1 kilometre scale bar and north arrow are shown.</p></figure><p>East of the Caspian, the Great Wall of Gorgan stretches 195 km, with more than 30 forts and a water-filled ditch. Excavations led by Eberhard Sauer, Hamid Omrani Rekavandi and Jebrael Nokandeh dated it to the late 5th or 6th century CE. Local people call it Sadd-i Iskandar, Alexander&#x27;s Barrier, which shows how naturally any great northern wall attracted his name. In the 840s the caliph al-Wathiq, reportedly after dreaming that the barrier had been breached, sent an interpreter named Sallam to find it; his account of the journey survives in the geographer Ibn Khurradadhbih&#x27;s book of routes.</p></section><section class="wsec" id="dhul-qarnayn-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What archaeology can and cannot test</h3><p>Archaeology cannot test who was granted power by God, or what will happen at the end of time. It can test whether a barrier of the kind described once closed a real pass, when, and by whom. So far the answer is mixed. Such barriers existed, and tradition put Dhul-Qarnayn&#x27;s in exactly those places. But the walls we can date are Sasanian, built nine centuries after Cyrus and eight after Alexander, and of stone and brick rather than iron bound with molten metal.</p><p>Time may hide the rest. Pass fortifications were rebuilt again and again on the same lines, so any earlier barrier would lie beneath later ones. The Achaemenid northern frontier is almost unknown on the ground. Excavation beneath Derbent&#x27;s walls and at the Darial fortress, and any trace of early metal-reinforced masonry, would give the question new evidence. Until then the barrier stands where it has always stood: firmly in the text, plausibly in the passes, and not yet in a trench.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">530 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Death of Cyrus the Great on the steppe frontier</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">330 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Alexander takes the Persian empire</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">75 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Josephus: Alexander&#x27;s iron gates</span></li><li class="wtl-build" style="--i:3"><span class="wtl-y">450 CE</span><span class="wtl-k">Built</span><span class="wtl-t">First Sasanian mudbrick defences at Derbent</span></li><li class="wtl-build" style="--i:4"><span class="wtl-y">500 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Great Wall of Gorgan in use (late 5th–6th c.)</span></li><li class="wtl-build" style="--i:5"><span class="wtl-y">560 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Stone walls of Derbent under Khosrow I</span></li><li class="wtl-event" style="--i:6"><span class="wtl-y">630 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Syriac Alexander Legend (traditional date)</span></li><li class="wtl-event" style="--i:7"><span class="wtl-y">632 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Quran complete, Surah al-Kahf 18:83–98</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">842 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Sallam the Interpreter sent to find the barrier</span></li><li class="wtl-event" style="--i:9"><span class="wtl-y">2003 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Derbent becomes a World Heritage Site</span></li></ol><details class="srcs"><summary>Sources for this case (12)</summary><ol><li>Abdel Haleem M.A.S. (trans.) (2004). The Qur&#x27;an: A New Translation. Oxford University Press.</li><li>Budge E.A.W. (1889). The History of Alexander the Great, being the Syriac Version of the Pseudo-Callisthenes. Cambridge University Press.</li><li>Reinink G.J. (1983). Das syrische Alexanderlied: Die drei Rezensionen. Corpus Scriptorum Christianorum Orientalium 454–455. Louvain: Peeters.</li><li>van Bladel K. (2008). The Alexander Legend in the Qur&#x27;an 18:83–102. In Reynolds G.S. (ed.), The Qur&#x27;an in its Historical Context. London: Routledge, 175–203.</li><li>Tesei T. (2013–2014). The prophecy of Dhū-l-Qarnayn (Q 18:83–102) and the origins of the Qur&#x27;ānic corpus. Miscellanea Arabica.</li><li>Sauer E.W., Omrani Rekavandi H., Wilkinson T.J., Nokandeh J. et al. (2013). Persia&#x27;s Imperial Power in Late Antiquity: The Great Wall of Gorgān and Frontier Landscapes of Sasanian Iran. Oxford: Oxbow.</li><li>Sauer E.W. et al. (2020). Dariali: The &#x27;Caspian Gates&#x27; in the Caucasus from Antiquity to the Age of the Huns and the Middle Ages. Oxford: Oxbow.</li><li>UNESCO World Heritage Centre. Citadel, Ancient City and Fortress Buildings of Derbent, listing 1070, inscribed 2003.</li><li>Josephus, The Jewish War 7.244–251, trans. William Whiston (1737).</li><li>Azad A.K. (1931 onward). Tarjuman al-Qur&#x27;an (commentary on Surah al-Kahf).</li><li>The Holy Bible, New Revised Standard Version (1989).</li><li>Anderson A.R. (1932). Alexander&#x27;s Gate, Gog and Magog, and the Inclosed Nations. Cambridge, MA: Medieval Academy of America.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-dhul-qarnayn" data-t="Dhul-Qarnayn and the Wall Against Gog and Magog"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Dhul-Qarnayn and the Wall Against Gog and Magog</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-dhul-qarnayn</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-exodus-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Merenptah Israel Stele Cairo.jpg" data-cap="The Merneptah Stele" data-big><figcaption></figcaption></figure><div class="sh-k">Peoples of the Sacred Texts</div><h2 class="sh-t" id="case-exodus-st" tabindex="-1">Moses, Pharaoh and the Sea That Stepped Back</h2><p class="sh-s">Two scriptures tell of a tyrant, a parted sea and a drowned army. Egypt kept the stones, but not the story.</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> A mass departure of the whole people of Israel from Egypt, some 600,000 men plus families, took place in the Late Bronze Age.</p><p class="sh-claim"><b>The text's own words:</b> <span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span> <span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span> <span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span> <span class="sh-more">(line by line below)</span></p></div><p class="v4-q">Did an exodus from Egypt happen, and which pharaoh faced Moses?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Two scriptures tell of a tyrant, a parted sea and a drowned army; Egypt kept its stones but not the story.</li><li>West Semitic people did live and work in the Nile Delta, and &#x27;Israel&#x27; is named in Canaan by about 1208 BCE.</li><li>Two million people crossing Sinai should have left traces; none has been found, and Israel&#x27;s first villages look local.</li><li>But the Delta lost its archives, and desert nomads leave little behind, so a smaller departure cannot be ruled out.</li><li>The biblical headcount awaits evidence; the events at the heart of both scriptures are left to faith, not archaeology.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Texts and scripts</span><span class="thr">Religion and myth</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="1208" >1,208</b><span class="ctr-u"> BCE</span></div><div class="ctr-l">Merneptah Stele names Israel</div><div class="ctr-c">Cairo JE 31408</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="600000" >600,000</b><span class="ctr-u"> men</span></div><div class="ctr-l">leaving Egypt, per Exodus 12:37</div><div class="ctr-c">Exodus 12:37</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="28" >28</b><span class="ctr-u"> m/s</span></div><div class="ctr-l">east wind needed in the Drews and Han model</div><div class="ctr-c">Drews and Han 2010</div></div><div class="ctr"><div class="ctr-v">about <b class="ctr-n" data-v="4" >4</b><span class="ctr-u"> hours</span></div><div class="ctr-l">that the modelled land bridge stays dry</div><div class="ctr-c">Drews and Han 2010</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>A mass departure of the whole people of Israel from Egypt, some 600,000 men plus families, took place in the Late Bronze Age.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">On its full scale the Exodus should have left traces: two million people crossing Sinai, an army lost, a labour force gone. None has been found, and Israel&#x27;s first villages look local. But the evidence is uneven. The Delta has lost its archives, Sinai nomads leave little behind, and Semitic workers in Egypt are well attested. A smaller exodus remains plausible and cannot be ruled out, while the mass departure awaits evidence. The divine events at the heart of the story are matters of faith, not archaeology.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks often say flatly that the Exodus &#x27;did not happen&#x27;. That is overconfident. What the silence of Sinai weighs against is the headcount the Hebrew text gives, two million people on the move; a departure from Egypt under Moses is a different question, and one the Delta, which preserves almost none of its paperwork, cannot yet answer either way. The honest summary is narrower: no evidence yet for a mass exodus on the biblical scale, a real but faint Egyptian thread in early Israel, and the events at the heart of both scriptures left to faith.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>The Merneptah Stele, carved about 1208 BCE, names &#x27;Israel&#x27; as a people in Canaan, written with the sign for a group of people rather than a city.<small>Cairo Museum JE 31408; Pritchard (ed.) 1969</small></li><li>West Semitic people lived and worked in the eastern Nile Delta throughout the 2nd millennium BCE; the Hyksos, rulers of Levantine origin, governed from Avaris until they were driven out around 1550 BCE.<small>Bietak 1996</small></li><li>Ramesses II built a new capital, Pi-Ramesses, at Qantir in the eastern Delta; Exodus 1:11 names the store city &#x27;Rameses&#x27;.<small>Shaw (ed.) 2000</small></li><li>No known Egyptian text mentions Israelites in Egypt, the plagues, or the loss of a pharaoh&#x27;s army in the sea.<small>Finkelstein and Silberman 2001; Hoffmeier 1997</small></li><li>Ocean modelling shows that a steady 28 m/s east wind for 12 hours can expose a mud-flat land bridge 3–4 km long and 5 km wide in a Delta lagoon for about 4 hours.<small>Drews and Han 2010</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Which pharaoh, if any: Ahmose I (the Hyksos expulsion), Thutmose III or Amenhotep II (the biblical 1446 BCE date), Ramesses II or Merneptah.</li><li>Whether a smaller group, perhaps the ancestors of the Levites, carried a real memory of Egypt into early Israel.</li><li>Where the Yam Suph (&#x27;Sea of Reeds&#x27;) lay: the Delta lagoons, the Bitter Lakes, the Gulf of Suez or the Gulf of Aqaba.</li><li>Whether Delta place names in Exodus reflect the Late Bronze Age or the 7th–6th centuries BCE, when the text took shape.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>The wet Delta, where the story is set, has preserved almost no papyri; most surviving Egyptian documents come from dry Upper Egypt.</li><li>The Pelusiac branch of the Nile and its lagoons silted up long ago, so the ancient shoreline must be reconstructed from cores and satellite images.</li><li>Pi-Ramesses was stripped for stone to build later cities such as Tanis, scattering its monuments and inscriptions.</li><li>Mobile herders in Sinai leave faint traces: a few tent circles and hearths that surveys can easily miss.</li></ul></div></div><h3 class="sub-h wsub">How the traditions tell it</h3><div class="v4texts"><blockquote class="quote v4q"><span class="v4q-t">Hebrew Bible · Exodus 14:21–22</span><p>Then Moses stretched out his hand over the sea. The Lord drove the sea back by a strong east wind all night and turned the sea into dry land, and the waters were divided. The Israelites went into the sea on dry ground, the waters forming a wall for them on their right and on their left.</p><cite>New Revised Standard Version Updated Edition (2021)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Quran · 26:63</span><p>Then We inspired to Moses, &#x27;Strike with your staff the sea,&#x27; and it parted, and each portion was like a great towering mountain.</p><cite>trans. Sahih International (1997)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Quran · 10:92</span><p>Today We shall save only your corpse as a sign to all posterity. A great many people fail to heed Our signs.</p><cite>trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Egyptian royal inscription · Merneptah Stele, line 27</span><p>Israel is laid waste, his seed is not</p><cite>trans. John A. Wilson, in J. B. Pritchard (ed.), Ancient Near Eastern Texts (Princeton, 3rd ed. 1969)</cite></blockquote></div><h3 class="sub-h wsub">In the text's own words</h3><p class="rd-rule">Each line rates only what the text itself says, not later dates, commentaries or modern identifications.</p><ul class="rds"><li class="rd"><p class="rd-s">Moses led the Children of Israel out of Egypt, and the sea parted before them (Quran 26:63; Exodus 14:21–22).</p><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span><p class="rd-n">No Egyptian record describes the event, which is expected: Egyptian monuments rarely recorded defeats. Semitic-speaking people in the eastern Delta are well documented, and &#x27;Israel&#x27; is in Canaan by about 1208 BCE (Merneptah Stele).</p></li><li class="rd"><p class="rd-s">Pharaoh called them &#x27;a small band&#x27; (Quran 26:54).</p><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span><p class="rd-n">A small group leaves almost no trace in the desert, which fits the silence of the ground far better than the 600,000 men of Exodus 12:37, a number archaeology has not supported.</p></li><li class="rd"><p class="rd-s">Pharaoh&#x27;s body would be preserved as a sign for later generations (Quran 10:92).</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">Many New Kingdom royal mummies survive, including Ramesses II and Merneptah, but the text does not name the Pharaoh, so no mummy can be matched to it on present evidence.</p></li></ul><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Most archaeologists and biblical scholars see the Exodus as a founding epic rather than a report. Israel appears in the highlands of Canaan around 1200 BCE, and its early villages look Canaanite in their pottery and houses, which points to a people who largely emerged from within the land. The book of Exodus reached its final form centuries later. Many scholars still allow that some ancestors, possibly a small group, came out of Egypt and that their story grew as it was retold.</p><ul><li>A migration of 600,000 men plus families (Exodus 12:37) would be about two million people; nothing on that scale shows up in Egyptian records or Sinai archaeology.</li><li>Kadesh Barnea, where Israel is said to have camped for decades, has produced remains no earlier than about the 10th century BCE.</li><li>Early Israelite hill villages share pottery and building traditions with Canaan, not Egypt.</li><li>Some geographical details in Exodus fit the 7th–6th centuries BCE better than the 13th.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Challengers come from several directions. Hoffmeier argues that the Egyptian background of Exodus (brickmaking, Delta geography, Egyptian names) is authentic Late Bronze Age detail. Rohl moves the whole Egyptian chronology to find Semitic slaves and a sudden abandonment at Avaris in an earlier era. Friedman proposes that only the Levites, whose names include Egyptian ones like Moses and Phinehas, came out of Egypt. Jacobovici and others tie the plagues and sea to the Thera eruption and the Hyksos expulsion. Bucaille identified Merneptah as the pharaoh of the Quran and the Bible.</p><ul><li>Egyptian personal names cluster among the priestly Levites: Moses, Hophni, Phinehas, Merari.</li><li>Egyptian texts do record Semitic &#x27;Apiru hauling stone for a Ramesside building project (Papyrus Leiden 348).</li><li>The Ahmose &#x27;Tempest Stela&#x27; describes a catastrophic storm that some link to Thera.</li></ul><div class="face-s"><b>Its strongest point</b><p>Egypt&#x27;s records are almost silent on slaves who escaped, and the Delta has lost nearly all its papyri, so the absence of an Egyptian report says little. A modest group leaving would be invisible to archaeology.</p></div><p class="face-cr"><b>Credit</b> James K. Hoffmeier; David Rohl and Tim Mahoney (Patterns of Evidence); Richard Elliott Friedman; Simcha Jacobovici; Maurice Bucaille</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>A Delta papyrus or ostracon naming Hebrew or Israelite labourers, or a flight of workers, in the 15th–12th centuries BCE.</li><li>Excavated Late Bronze Age campsites in Sinai or at Kadesh Barnea with material culture matching early Israel.</li><li>Sediment cores from the ancient Lake of Tanis showing a drowned chariot force or military equipment.</li><li>A securely dated link between the Thera eruption, Egyptian texts and the Hyksos expulsion.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">6 min read · 1,241 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Moses, Pharaoh and the Sea That Stepped Back"><button type="button" class="wtoc-i" data-go="exodus-s1">A king at the water&#x27;s edge</button><button type="button" class="wtoc-i" data-go="exodus-s2">What the stones do say</button><button type="button" class="wtoc-i" data-go="exodus-s3">Why most scholars doubt a mass exodus</button><button type="button" class="wtoc-i" data-go="exodus-s4">Four pharaohs and their champions</button><button type="button" class="wtoc-i" data-go="exodus-s5">Could wind really part a sea?</button><button type="button" class="wtoc-i" data-go="exodus-s6">The body kept as a sign</button><button type="button" class="wtoc-i" data-go="exodus-s7">What time hid, and what would settle it</button></nav></div><section class="wsec" id="exodus-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A king at the water&#x27;s edge</h3><p>Two scriptures tell the same night from different sides. In the book of Exodus, an east wind blows until dawn, the sea divides, and the Israelites walk through with water standing like walls on either side. When Pharaoh&#x27;s chariots follow, the sea returns. In the Quran, Moses is told to strike the sea with his staff, and each side rises &#x27;like a great towering mountain&#x27;. Then the camera, as it were, turns to Pharaoh himself.</p><blockquote class="quote"><p>But as he was drowning he cried, &#x27;I believe there is no God except the one the Children of Israel believe in. I submit to Him.&#x27;</p><cite>Quran 10:90, trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><p>The reply comes two verses later: &#x27;Today We shall save only your corpse as a sign to all posterity.&#x27; It is one of the most arresting lines in either tradition, a promise that the tyrant&#x27;s body would outlast him as a warning. It also raises questions a historian can actually chase. Which pharaoh? When? And what, if anything, did Egypt itself record?</p><p>Egypt is the best-documented civilisation of the Bronze Age. Its kings carved their victories on temple walls and buried their dead with their names. That makes the silence around the Exodus loud, and it makes every scrap of evidence around its edges precious.</p></section><section class="wsec" id="exodus-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What the stones do say</h3><p>In 1896 Flinders Petrie found a black granite slab, over 3 m tall, in a funerary temple at Thebes. It celebrates the victories of Merneptah, son of Ramesses II, in about 1208 BCE. Near the end comes a roll call of the defeated in Canaan: Ashkelon, Gezer, Yanoam, and then Israel. The first three are written with the sign for a city or land. Israel carries the sign for a people. By the late 13th century BCE, a group called Israel was living in Canaan and was worth boasting about.</p><figure class="wx wx--static" id="exodus-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Which pharaoh? The candidates on one timeline</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Which pharaoh? The candidates on one timeline"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" class="wx-svg" role="img" aria-labelledby="exodus-f1-t"><title id="exodus-f1-t">Timeline from 1650 to 1150 BCE showing the pharaohs proposed for the Exodus and the Merneptah Stele</title><text class="wx-t-cap" x="24" y="30">Which pharaoh? Conventional reign dates, BCE</text><g class="wx-pop" style="--d:10"><rect class="wx-accfill wx-o20" x="608.1" y="52" width="87.9" height="320"/></g><path class="wx-line wx-draw" pathLength="1" style="--d:0" d="M60,372 H680"/><path class="wx-thin" d="M60.0,372 V378"/><text class="wx-t-s" x="60.0" y="392" text-anchor="middle">1650</text><path class="wx-thin" d="M122.0,372 V378"/><text class="wx-t-s" x="122.0" y="392" text-anchor="middle">1600</text><path class="wx-thin" d="M184.0,372 V378"/><text class="wx-t-s" x="184.0" y="392" text-anchor="middle">1550</text><path class="wx-thin" d="M246.0,372 V378"/><text class="wx-t-s" x="246.0" y="392" text-anchor="middle">1500</text><path class="wx-thin" d="M308.0,372 V378"/><text class="wx-t-s" x="308.0" y="392" text-anchor="middle">1450</text><path class="wx-thin" d="M370.0,372 V378"/><text class="wx-t-s" x="370.0" y="392" text-anchor="middle">1400</text><path class="wx-thin" d="M432.0,372 V378"/><text class="wx-t-s" x="432.0" y="392" text-anchor="middle">1350</text><path class="wx-thin" d="M494.0,372 V378"/><text class="wx-t-s" x="494.0" y="392" text-anchor="middle">1300</text><path class="wx-thin" d="M556.0,372 V378"/><text class="wx-t-s" x="556.0" y="392" text-anchor="middle">1250</text><path class="wx-thin" d="M618.0,372 V378"/><text class="wx-t-s" x="618.0" y="392" text-anchor="middle">1200</text><path class="wx-thin" d="M680.0,372 V378"/><text class="wx-t-s" x="680.0" y="392" text-anchor="middle">1150</text><g class="wx-pop" style="--d:2"><rect class="wx-fire wx-o40 wx-edge-soft" x="84.8" y="78" width="99.2" height="14" rx="7" stroke-dasharray="4 3"/><text class="wx-t-b" x="84.8" y="68">Thera (Santorini) erupts</text><text class="wx-t-s" x="84.8" y="110">radiocarbon c. 1600 BCE, some favour</text><text class="wx-t-s" x="84.8" y="124">the mid-16th century; debated</text></g><rect class="wx-c6 wx-growx" style="--d:3" x="184.0" y="150" width="31.0" height="16" rx="3"/><g class="wx-pop" style="--d:4"><text class="wx-t-b" x="225.0" y="157">Ahmose I, 1550–1525</text><text class="wx-t-s" x="225.0" y="172">expels the Hyksos from the Delta; Josephus,</text><text class="wx-t-s" x="225.0" y="186">quoting Manetho, linked them to Israel</text></g><rect class="wx-c2 wx-growx" style="--d:5" x="272.0" y="222" width="67.0" height="16" rx="3"/><rect class="wx-c7 wx-growx" style="--d:6" x="336.5" y="244" width="32.3" height="16" rx="3"/><g class="wx-pop" style="--d:6"><path class="wx-hl" d="M313.0,206 V272"/><circle class="wx-accfill" cx="313.0" cy="206" r="4"/><text class="wx-t-b wx-t-a wx-halo" x="305.0" y="202" text-anchor="end">1446: date from 1 Kings 6:1</text><text class="wx-t-s wx-halo" x="264.0" y="235" text-anchor="end">Thutmose III</text><text class="wx-t-s wx-halo" x="376.8" y="256">Amenhotep II</text></g><rect class="wx-c1 wx-growx" style="--d:7" x="520.0" y="318" width="81.9" height="16" rx="3"/><rect class="wx-c4 wx-growx" style="--d:8" x="601.9" y="318" width="12.4" height="16" rx="1"/><g class="wx-pop" style="--d:8"><text class="wx-t-b" x="512.0" y="323" text-anchor="end">Ramesses II, 1279–1213</text><text class="wx-t-s" x="512.0" y="338" text-anchor="end">builds Pi-Ramesses: the "Rameses" of Exodus 1:11</text><text class="wx-t-s" x="512.0" y="352" text-anchor="end">then Merneptah (red), 1213–1203</text></g><g class="wx-pop" style="--d:10"><path class="wx-bold" d="M608.1,56 V372"/><rect class="wx-inkfill" x="603.1" y="52" width="10" height="16" rx="4"/><text class="wx-t-b" x="596.1" y="66" text-anchor="end">Merneptah Stele, c. 1208</text><text class="wx-t-s" x="596.1" y="82" text-anchor="end">"Israel" is already a people in Canaan</text></g><text class="wx-t-s" x="24" y="418">Reign dates after Shaw (ed.) 2000, Oxford History of Ancient Egypt; each carries an uncertainty of a decade or more.</text></svg></div></div><figcaption>Conventional reign dates for the pharaohs proposed as the Exodus king, the Thera eruption, the date implied by 1 Kings 6:1, and the Merneptah Stele. After c. 1208 BCE Israel is already in Canaan. <span class="wx-src">Based on: Reign dates after Shaw (ed.) 2000; Thera dates after Friedrich et al. 2006 and Pearson et al. 2018; 1 Kings 6:1 date by simple count.</span></figcaption><p class="vh">A horizontal timeline from 1650 to 1150 BCE. At the top left a dashed band marks the Thera eruption, radiocarbon dated around 1600 BCE and debated. Below it a short bar marks Ahmose I, 1550 to 1525 BCE, who expelled the Hyksos. Next come bars for Thutmose III and Amenhotep II with an accent marker at 1446 BCE, the date implied by 1 Kings 6:1. Near the right, a long bar for Ramesses II, 1279 to 1213 BCE, is followed by a short red bar for Merneptah. A thick vertical line marks the Merneptah Stele at about 1208 BCE, after which a shaded band shows Israel already in Canaan.</p></figure><p>The stele sets a latest date, and the chart above shows how the candidate pharaohs line up against it. Egypt also shows that Semitic people were a normal part of Delta life. A tomb at Beni Hasan paints a caravan of Asiatics arriving around 1890 BCE. A papyrus now in Brooklyn lists household servants with Semitic names. At Tell el-Dab&#x27;a, Manfred Bietak excavated Avaris, capital of the Hyksos, Levantine rulers who governed the north until Ahmose I expelled them around 1550 BCE. Later, under the Ramessides, Papyrus Leiden 348 records rations for &#x27;Apiru dragging stone for a great pylon.</p><aside class="wcall"><b>How do we know?</b><p>The &#x27;people&#x27; sign on the Merneptah Stele is a throw stick plus a seated man and woman over three plural strokes. Scribes used it for groups without a fixed city. Many scholars read it as a sign that Israel was still rural or semi-nomadic, though some argue scribes were not always consistent.</p></aside></section><section class="wsec" id="exodus-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Why most scholars doubt a mass exodus</h3><p>The text itself sets the bar high. Exodus 12:37 counts &#x27;about six hundred thousand men on foot, besides little ones&#x27;, which implies some two million people. A population that size, wandering for forty years, should leave something: hearths, pottery, burials. Surveys across Sinai have found camps of herders from other periods, including the 3rd millennium BCE and the Byzantine era, but nothing that fits a Late Bronze Age multitude. At Kadesh Barnea, where Israel is said to have stayed for decades, excavation found forts no older than about the 10th century BCE.</p><p>Meanwhile the first Israelite villages in the hills of Canaan, founded around 1200 BCE, look local. Their pots and houses continue Canaanite traditions. Israel Finkelstein and Neil Asher Silberman argued in 2001 that Israel emerged mainly from within Canaan and that the Exodus took its classic shape in the 7th century BCE, when Judah had its own reasons to tell a story of freedom from Egypt.</p><blockquote class="wpull"><p>Egypt kept its stones, but almost none of the paperwork where escaped workers would appear.</p></blockquote></section><section class="wsec" id="exodus-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Four pharaohs and their champions</h3><p>Each candidate has serious defenders. Readers of 1 Kings 6:1, which places the Exodus 480 years before Solomon built the Temple, arrive at about 1446 BCE and the reigns of Thutmose III or Amenhotep II. Others look to Ahmose I and the expulsion of the Hyksos: a real mass departure of Semitic people from the Delta. Josephus, quoting the Egyptian priest Manetho, already linked the two in the 1st century CE. Some add the eruption of Thera, which radiocarbon places around 1600 BCE or somewhat later, and the Ahmose &#x27;Tempest Stela&#x27;, which describes a storm and darkness over Egypt.</p><p>The best-known candidate is Ramesses II, because Exodus names the city &#x27;Rameses&#x27;. The French physician Maurice Bucaille, who examined royal mummies in the 1970s, argued instead for his son Merneptah, a view many Muslim readers adopted. David Rohl goes further and rebuilds the whole Egyptian chronology, placing the Exodus centuries earlier among the Semitic population of Avaris. Most Egyptologists reject his redating. James Hoffmeier, digging at Tell el-Borg in north Sinai, argues that the route and geography in Exodus fit a Late Bronze Age frontier of forts and lakes.</p><p>Richard Elliott Friedman offers a smaller, testable-sounding idea: the people who came out of Egypt were the Levites. Egyptian names are concentrated among them, from Moses to Phinehas, and the laws about welcoming strangers are strongest in texts linked to them. It would explain how a real memory could be carried into a people most of whom had never left Canaan.</p></section><section class="wsec" id="exodus-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Could wind really part a sea?</h3><p>The Hebrew name of the sea is Yam Suph, most likely &#x27;Sea of Reeds&#x27;. Reeds grow in fresh or brackish marshes, not the deep Red Sea, which is one reason modellers look at the shallow lagoons of the Delta. Exodus names the mechanism plainly: &#x27;a strong east wind all night&#x27;.</p><figure class="wx wx--steps" id="exodus-f2" data-n="4"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">How a strong east wind can bare a lagoon floor</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How a strong east wind can bare
