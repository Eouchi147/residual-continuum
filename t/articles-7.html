a-sun-f1-c1"><circle cx="236.8" cy="75.7" r="16"/></clipPath><clipPath id="joshua-sun-f1-c2"><circle cx="343.8" cy="175.2" r="16"/></clipPath><clipPath id="joshua-sun-f1-c3"><circle cx="413.5" cy="252.7" r="16"/></clipPath><clipPath id="joshua-sun-f1-c4"><circle cx="479.7" cy="334.7" r="16"/></clipPath><clipPath id="joshua-sun-f1-sky"><rect x="30" y="44" width="660" height="306"/></clipPath></defs><rect class="wx-sky" x="30" y="44" width="660" height="306"/><text class="wx-t-cap" x="24" y="30">Gibeon, 30 October 1207 BCE · looking west-southwest</text><path class="wx-guide" d="M30,240 H690"/><text class="wx-t-s wx-halo" x="36" y="236">10° up</text><path class="wx-guide" d="M30,130 H690"/><text class="wx-t-s wx-halo" x="36" y="126">20° up</text><polyline class="wx-dash" clip-path="url(#joshua-sun-f1-sky)" points="199.4,46.4 207.1,52.2 214.6,58.0 222.1,63.9 229.5,69.8 236.8,75.7 244.1,81.7 251.2,87.7 258.3,93.8 265.3,99.9 272.2,106.0 279.0,112.2 285.8,118.3 292.5,124.5 299.2,130.8 305.7,137.0 312.2,143.3 318.7,149.7 325.1,156.0 331.4,162.4 337.6,168.8 343.8,175.2 350.0,181.6 356.1,188.1 362.1,194.5 368.1,201.1 374.1,207.6 380.0,214.1 385.8,220.7 391.6,227.3 397.4,233.9 403.1,240.5 408.8,247.1 414.5,253.8 420.1,260.4 425.7,267.1 431.2,273.8 436.7,280.5 442.2,287.3 447.6,294.0 453.0,300.8 458.4,307.5 463.8,314.3 469.1,321.1 474.4,327.9 479.7,334.7 484.9,341.5 490.2,348.4 495.4,355.2"/><g class="wx-st" data-only="1"><circle class="wx-glow wx-edge-soft" cx="236.8" cy="75.7" r="16"/><circle class="wx-stone3" clip-path="url(#joshua-sun-f1-c1)" cx="255.7" cy="94.6" r="14"/></g><g class="wx-st" data-only="2"><circle class="wx-glow wx-edge-soft" cx="343.8" cy="175.2" r="16"/><circle class="wx-stone3" clip-path="url(#joshua-sun-f1-c2)" cx="353.9" cy="185.3" r="14"/></g><g class="wx-st" data-only="3"><circle class="wx-glow wx-edge-soft" cx="413.5" cy="252.7" r="16"/><circle class="wx-stone3" cx="413.5" cy="252.7" r="13"/></g><g class="wx-st" data-only="4"><circle class="wx-glow wx-edge-soft" cx="479.7" cy="334.7" r="16"/><circle class="wx-stone3" clip-path="url(#joshua-sun-f1-c4)" cx="467.4" cy="322.4" r="14"/></g><path class="wx-rock wx-edge-soft" d="M30,350 C120,342 200,346 280,340 C380,334 460,348 560,344 C620,341 660,347 690,350 V380 H30 Z"/><path class="wx-line" d="M30,380 H690"/><text class="wx-t-b" x="60.0" y="398" text-anchor="middle">SW</text><text class="wx-t-b" x="357.0" y="398" text-anchor="middle">WSW</text><text class="wx-t-b" x="654.0" y="398" text-anchor="middle">W</text><path class="wx-thin" d="M192.0,352 V364"/><text class="wx-t-s" x="192.0" y="414" text-anchor="middle">towards Azekah</text><path class="wx-thin" d="M614.4,352 V364"/><text class="wx-t-s" x="614.4" y="414" text-anchor="middle">valley of Aijalon</text><g class="wx-st wx-hide" data-only="1"><text class="wx-t-b wx-halo" x="262.8" y="71.7" text-anchor="start">15:27 first contact</text><text class="wx-t wx-halo" x="262.8" y="87.7" text-anchor="start">Sun c. 25° above the horizon</text></g><g class="wx-st wx-hide" data-only="2"><text class="wx-t-b wx-halo" x="369.8" y="171.2" text-anchor="start">about 16:15</text><text class="wx-t wx-halo" x="369.8" y="187.2" text-anchor="start">more than half covered, light dims</text></g><g class="wx-st wx-hide" data-only="3"><text class="wx-t-b wx-halo" x="439.5" y="248.7" text-anchor="start">16:48–16:53 annularity</text><text class="wx-t wx-halo" x="439.5" y="264.7" text-anchor="start">a ring of Sun round the dark Moon</text></g><g class="wx-st wx-hide" data-only="4"><text class="wx-t-b wx-halo" x="505.7" y="330.7" text-anchor="start">about 17:30, at the hills</text><text class="wx-t wx-halo" x="505.7" y="346.7" text-anchor="start">still partly eclipsed (estimate)</text></g><text class="wx-t-s" x="24" y="434">Times: Humphreys and Waddington 2017 (for Azekah, local sundial time). Sun path computed for Gibeon. Discs enlarged about 4×.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 4.</b> 15:27: the Moon&#x27;s edge first bites into the Sun, about 25° above the west-southwest horizon.</p><ol class="wx-steplist"><li>15:27: the Moon&#x27;s edge first bites into the Sun, about 25° above the west-southwest horizon.</li><li>About 16:15: more than half the Sun is covered and the light dims and cools.</li><li>16:48–16:53: annularity. A ring of Sun surrounds the dark, invisible Moon for about five minutes.</li><li>About 17:30: the Sun reaches the hills, still partly eclipsed on our rough estimate.</li></ol><figcaption>Tap through the eclipse as it would have looked from the hills of Gibeon, facing west-southwest. Times follow Humphreys and Waddington; the Sun&#x27;s path is computed for Gibeon&#x27;s latitude. <span class="wx-src">Based on: Eclipse times for Azekah from Humphreys and Waddington 2017; solar altitude and azimuth computed for latitude 31.85° N on 30 October 1207 BCE (Julian); sunset time and eclipse phase at sunset are our estimates.</span></figcaption><p class="vh">A view of the western sky above a line of low hills, with the compass points south-west, west-south-west and west along the horizon and markers towards Azekah and the valley of Aijalon. A dashed line shows the Sun&#x27;s path descending from upper left to the horizon at lower right. Step 1: at 15:27 the Sun, about 25 degrees up, has a small dark bite at its lower edge. Step 2: around 16:15 more than half the Sun is covered. Step 3: from 16:48 to 16:53 the dark Moon sits inside the Sun, leaving a bright ring, about 9 degrees above the horizon. Step 4: around 17:30 the Sun reaches the hills still partly eclipsed.</p></figure><p>They then searched the sky. Calculating eclipses three thousand years back requires correcting for the slow, irregular braking of the Earth&#x27;s spin by the tides. With that correction, they found that the only annular eclipse visible from Gibeon between 1500 and 1050 BCE happened on the afternoon of 30 October 1207 BCE. At Azekah the Moon&#x27;s edge first touched the Sun at about 15:27 local sundial time; the ring of fire lasted from about 16:48 to 16:53. By our own calculation, the Sun then stood only about 9° above the west-southwest horizon, and it would have set around 17:30 still partly covered. In an annular eclipse, the Moon is directly in front of the Sun and invisible. Both &#x27;stopped shining&#x27;.</p><aside class="wcall"><b>How do we know?</b><p>Eclipse geometry is exact, but for dates this old the Earth&#x27;s position under the Moon&#x27;s shadow depends on how much the day has lengthened since. That correction, called delta-T, was roughly 8 hours in 1200 BCE and is estimated from ancient eclipse records. The result depends on the value adopted, and a different value could shift where the shadow fell.</p></aside></section><section class="wsec" id="joshua-sun-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>What the eclipse would mean</h3><p>If the reading is right, the consequences reach Egypt. Merneptah&#x27;s stele, which places Israel in Canaan, is dated to his fifth year. Combining the eclipse with Egyptian lunar dates, Humphreys and Waddington proposed that Ramesses II ruled from 1276 to 1210 BCE and Merneptah from 1210 BCE, each give or take a year. It would also make Joshua 10 the oldest datable report of a solar eclipse anywhere. The rival claim, a clay tablet from Ugarit on the Syrian coast once dated to 1223 BCE by Teije de Jong and Wilfred van Soldt, is itself disputed.</p><p>One detail fits oddly well, and one does not. Seen from Gibeon, the eclipsed Sun hung low in the west-southwest, above the lowlands between the valley of Aijalon and Azekah, the very ground over which the chase ran. Perhaps soldiers on the descent of Beth-horon looked up into a dimming afternoon and saw the ring. But the poem puts the sun &#x27;at Gibeon&#x27; and the moon &#x27;in the valley of Aijalon&#x27;, two places, not one, and in an eclipse sun and moon stand together. Supporters answer that poetic parallelism splits one image across two lines; critics reply that this is exactly the kind of flexibility that lets a reading fit almost anything.</p></section><section class="wsec" id="joshua-sun-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The case against</h3><p>Critics answer on several fronts. William Osborn questioned the reading in a reply in the same journal, and other Hebraists note that dom elsewhere usually means to be silent or still. The narrator&#x27;s remark about a day that &#x27;did not hurry to set&#x27; describes lengthened daylight, which an eclipse does not produce. The comparative mythologist Marinus Anton van der Sluijs argued in the journal Culture and Cosmos that Joshua&#x27;s celestial miracle was not an eclipse at all. And Sawyer&#x27;s 1972 case for a partial eclipse in 1131 BCE shows that eclipse readings can be fitted to more than one date.</p><p>Archaeology adds its own doubt. James Pritchard&#x27;s excavations at el-Jib from 1956 found jar handles stamped with the name Gibeon, a great rock-cut pool and Iron Age wine cellars, but only scraps of Late Bronze Age occupation, mostly tombs. The walled city of the story is hard to find in the 13th century. Many of the conquest stories in Joshua sit uneasily with the ground.</p><p>At the far end of the spectrum, Velikovsky&#x27;s claim that a passing Venus stopped the Earth&#x27;s spin finds no support: ice cores and tree rings run unbroken through the period, and the orbits of the planets show no such encounter. A tale that NASA computers found a &#x27;missing day&#x27; in astronomical calculations has circulated since the 1970s; NASA has described it as false.</p></section><section class="wsec" id="joshua-sun-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What would settle it</h3><p>For believers, Joshua 10 records a day on which &#x27;the Lord fought for Israel&#x27;, whatever the mechanism, and nothing in the eclipse debate touches that confession. For historians, the question is narrow and testable: did a poet in Canaan describe the eclipse of 1207 BCE?</p><ul class="wlist"><li>Other ancient texts using dom or &#x27;amad for a darkened sun or moon.</li><li>An early translation or manuscript that reads the verse as darkness.</li><li>A Late Bronze Age town at Gibeon, with signs of conflict around 1200 BCE.</li><li>An independent record of the 1207 BCE eclipse from Canaan or Egypt.</li></ul></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">1,276 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Ramesses II&#x27;s accession on the eclipse chronology</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">1,210 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Merneptah&#x27;s accession on the eclipse chronology</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">1,208 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Merneptah Stele names Israel in Canaan</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">1,207 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Annular eclipse over Canaan, 30 October</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">1918 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Robert Dick Wilson suggests dom means &#x27;be dark&#x27;</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1950 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Velikovsky&#x27;s Worlds in Collision</span></li><li class="wtl-find" style="--i:6"><span class="wtl-y">1956 CE</span><span class="wtl-k">Found</span><span class="wtl-t">James Pritchard begins excavating Gibeon</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2017 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Humphreys and Waddington publish the eclipse reading</span></li></ol><details class="srcs"><summary>Sources for this case (10)</summary><ol><li>Humphreys C., Waddington G. (2017). Solar eclipse of 1207 BC helps to date pharaohs. Astronomy and Geophysics 58(5): 5.39–5.42. <a href="https://doi.org/10.1093/astrogeo/atx178" target="_blank" rel="noopener">doi:10.1093/astrogeo/atx178</a></li><li>Osborn W. (2018). Bible and the first recorded eclipse. Astronomy and Geophysics 59(4): 4.10. <a href="https://doi.org/10.1093/astrogeo/aty185" target="_blank" rel="noopener">doi:10.1093/astrogeo/aty185</a></li><li>van der Sluijs M. A. Joshua&#x27;s celestial miracle was not an eclipse. Culture and Cosmos 23(1).</li><li>Sawyer J. F. A. (1972). Joshua 10:12–14 and the solar eclipse of 30 September 1131 B.C. Palestine Exploration Quarterly 104: 139–146.</li><li>Holladay J. S. (1968). The day(s) the moon stood still. Journal of Biblical Literature 87: 166–178.</li><li>Walton J. H. (1994). Joshua 10:12–15 and Mesopotamian celestial omen texts. In Millard A. R., Hoffmeier J. K., Baker D. W. (eds), Faith, Tradition, and History. Eisenbrauns.</li><li>Wilson R. D. (1918). What does &#x27;the sun stood still&#x27; mean? Princeton Theological Review 16: 46–54.</li><li>Pritchard J. B. (1962). Gibeon, Where the Sun Stood Still. Princeton University Press.</li><li>de Jong T., van Soldt W. H. (1989). Redating an early solar eclipse record (KTU 1.78). Nature 338: 238–240.</li><li>Velikovsky I. (1950). Worlds in Collision. Macmillan.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-joshua-sun" data-t="Joshua&#x27;s Long Day: The Oldest Eclipse on Record?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Joshua&#x27;s Long Day: The Oldest Eclipse on Record?</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-joshua-sun</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-star-bethlehem-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Fra Angelico, Fra Filippo Lippi, The Adoration of the Magi.jpg" data-cap="The Adoration of the Magi, 15th century" data-big><figcaption></figcaption></figure><div class="sh-k">Peoples of the Sacred Texts</div><h2 class="sh-t" id="case-star-bethlehem-st" tabindex="-1">The Star of Bethlehem: A Sky Worth Reading</h2><p class="sh-s">Magi who read the sky arrive asking about a star. The heavens of 7–5 BCE offer three real candidates, and a Chinese court log.</p><div class="sh-v"><span class="vstamp vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><p class="sh-claim"><b>What the stamp rates:</b> A real astronomical event of 7–5 BCE lies behind the star in Matthew&#x27;s Gospel.</p><p class="sh-claim"><b>The text's own words:</b> <span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span> <span class="sh-more">(line by line below)</span></p></div><p class="v4-q">Was Matthew&#x27;s star a real event in the sky, and which one?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Only Matthew&#x27;s Gospel tells of the star and the Magi.</li><li>In 7 BCE Jupiter and Saturn met three times in Pisces, and Babylonian astronomers predicted it in advance.</li><li>In 5 BCE Chinese records note a comet or nova.</li><li>Sky-readers of the time would have watched such events.</li><li>A real sign behind the story is plausible; which one, if any, remains open.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Astronomy</span><span class="thr">Texts and scripts</span><span class="thr">Religion and myth</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="3" >3</b><span class="ctr-u"> conjunctions</span></div><div class="ctr-l">of Jupiter and Saturn in Pisces in 7 BCE</div><div class="ctr-c">computed ephemeris</div></div><div class="ctr"><div class="ctr-v">about <b class="ctr-n" data-v="1" >1</b><span class="ctr-u"> °</span></div><div class="ctr-l">closest separation of the planets, two full Moons apart</div><div class="ctr-c">computed ephemeris</div></div><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="70" >70</b><span class="ctr-u"> days</span></div><div class="ctr-l">that the 5 BCE comet was visible in China</div><div class="ctr-c">Humphreys 1991</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="4" >4</b><span class="ctr-u"> BCE</span></div><div class="ctr-l">usual date of Herod&#x27;s death</div><div class="ctr-c">Josephus</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>A real astronomical event of 7–5 BCE lies behind the star in Matthew&#x27;s Gospel.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The candidates are real and datable: the 7 BCE conjunctions can be computed and were predicted by Babylonian astronomers, and the 5 BCE comet is recorded in China. The Magi, as sky-readers, would have watched such events. That makes a real sign behind the story plausible. It stops short of &#x27;strong&#x27; because the account comes from one Gospel written decades later, fits a known scriptural motif, and no candidate matches every detail without special pleading. Which event, if any, remains open.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 3 of 6, leaning one way"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>leaning one way</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">New Testament introductions tend to treat the star as symbolic, while planetarium shows often present the 7 BCE conjunction as the answer. Both are more confident than the evidence. The symbolic reading ignores that the Magi were real astrologers in a year full of real signs; the planetarium answer ignores that a conjunction 1° apart would not look like one star, and that other events compete.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Only the Gospel of Matthew, written around 80–90 CE, tells of the star and the Magi.<small>Brown 1977</small></li><li>Jupiter and Saturn met three times in the constellation Pisces in 7 BCE, in late May, around the start of October and in early December, each time about 1° apart.<small>Computed ephemeris; Hughes 1976</small></li><li>A Babylonian astronomical almanac for 7/6 BCE predicted the positions of the planets for that year, including Jupiter and Saturn in Pisces.<small>Sachs and Walker 1984</small></li><li>Chinese records in the Han shu describe a &#x27;broom star&#x27; (a comet) in spring 5 BCE that was visible for over 70 days.<small>Humphreys 1991</small></li><li>Herod the Great, who appears in the story, died around 4 BCE by the usual reckoning, which bounds the window; a minority argue for 1 BCE.<small>Josephus, Antiquities 17; Filmer 1966</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Which event, if any: the 7 BCE conjunctions, a lunar occultation of Jupiter in Aries in 6 BCE, or the comet of 5 BCE.</li><li>Whether Matthew&#x27;s phrase usually translated &#x27;in the east&#x27; means &#x27;at its rising&#x27;, an astrological technical term.</li><li>Whether any natural object could &#x27;go ahead&#x27; of travellers and &#x27;stop&#x27; over one place.</li><li>Whether the star is a literary symbol built from Numbers 24:17 rather than a remembered observation.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>No Parthian or Babylonian astrological report interpreting a sign for Judea survives, though such reports were routine in earlier Mesopotamia.</li><li>The Chinese record gives position and duration but not the comet&#x27;s path night by night, so orbits must be inferred.</li></ul></div></div><h3 class="sub-h wsub">How the traditions tell it</h3><div class="v4texts"><blockquote class="quote v4q"><span class="v4q-t">New Testament · Matthew 2:1–2</span><p>In the time of King Herod, after Jesus was born in Bethlehem of Judea, magi from the east came to Jerusalem, asking, &#x27;Where is the child who has been born king of the Jews? For we observed his star in the east and have come to pay him homage.&#x27;</p><cite>New Revised Standard Version Updated Edition (2021); footnote: or &#x27;at its rising&#x27;</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">New Testament · Matthew 2:9–10</span><p>When they had heard the king, they set out, and there, ahead of them, went the star that they had seen in the east, until it stopped over the place where the child was. When they saw that the star had stopped, they were overwhelmed with joy.</p><cite>New Revised Standard Version Updated Edition (2021)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Hebrew Bible · Numbers 24:17</span><p>I see him but not now; I behold him but not near, a star shall come out of Jacob, and a scepter shall rise out of Israel</p><cite>New Revised Standard Version Updated Edition (2021)</cite></blockquote></div><h3 class="sub-h wsub">In the text's own words</h3><p class="rd-rule">Each line rates only what the text itself says, not later dates, commentaries or modern identifications.</p><ul class="rds"><li class="rd"><p class="rd-s">Magi saw a star rise and followed it to Bethlehem (Matthew 2:1–2, 9–10).</p><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span><p class="rd-n">Real sky events of 7–5 BCE include a triple conjunction of Jupiter and Saturn and a Chinese record of a &#x27;broom star&#x27; in 5 BCE. A star that stops over one house is best read as a matter of faith or of storytelling.</p></li></ul><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Many New Testament scholars read the star as part of a theological story rather than an observation. Matthew likes to show prophecy fulfilled, and the eastern seer Balaam&#x27;s oracle of &#x27;a star out of Jacob&#x27; was widely read as messianic. The Roman world also expected stars to herald great rulers. Astronomers who look for a real event disagree about which one, and note that no natural object moves ahead of travellers and halts over a single house. Some hold that the Magi, as professional astrologers, might have acted on a sign invisible to everyone else.</p><ul><li>Only Matthew mentions the star; Luke&#x27;s birth story has shepherds and angels instead.</li><li>Numbers 24:17 and Roman &#x27;ruler stars&#x27;, such as the comet after Julius Caesar&#x27;s death in 44 BCE, provide literary models.</li><li>Several candidate events exist, which makes it easy to fit one and hard to confirm any.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Challengers take the Magi at their word as sky-watchers. Kepler, after seeing the great conjunction of 1603 and a new star in 1604, wondered whether the 7 BCE conjunction had heralded a similar star. Humphreys argued in 1991 that the comet of 5 BCE, logged by Chinese astronomers, fits Matthew&#x27;s rising, moving and stopping star, following the conjunctions as a trigger. Molnar, a numismatist and astronomer, argued for the Moon passing in front of Jupiter in Aries on 17 April 6 BCE, an astrological sign of kingship that coins of Antioch link to Judea. In 2025 Matney modelled a comet orbit in which the 5 BCE comet appears to stand still overhead for hours.</p><ul><li>The 7 BCE triple conjunction was predictable, and a Babylonian almanac for that year survives.</li><li>The 5 BCE comet is independently recorded, by astronomers with no interest in Judea.</li><li>Matney&#x27;s 2025 model gives the first natural mechanism for a star that seems to &#x27;stop&#x27;.</li></ul><div class="face-s"><b>Its strongest point</b><p>The Magi were professional readers of the sky, and the years 7–5 BCE contained a rare triple conjunction in Pisces, a royal occultation and a long-lasting comet recorded in China. People like the Magi would have noticed all of them.</p></div><p class="face-cr"><b>Credit</b> Colin Humphreys; Michael Molnar; Mark Matney; Mark Kidger; historically Johannes Kepler</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>A cuneiform or Parthian text from 7–5 BCE interpreting a celestial sign as the birth of a king in the west or in Judea.</li><li>Further Chinese or Korean records narrowing the 5 BCE comet&#x27;s path, testing Matney&#x27;s orbit.</li><li>A firmer date for Jesus&#x27; birth and Herod&#x27;s death from independent evidence.</li><li>Early Christian sources, independent of Matthew, describing the star.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,169 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of The Star of Bethlehem: A Sky Worth Reading"><button type="button" class="wtoc-i" data-go="star-bethlehem-s1">Travellers asking about a star</button><button type="button" class="wtoc-i" data-go="star-bethlehem-s2">Who were the Magi?</button><button type="button" class="wtoc-i" data-go="star-bethlehem-s3">Kepler&#x27;s conjunction</button><button type="button" class="wtoc-i" data-go="star-bethlehem-s4">A royal occultation and a Chinese comet</button><button type="button" class="wtoc-i" data-go="star-bethlehem-s5">A star in the story</button><button type="button" class="wtoc-i" data-go="star-bethlehem-s6">What would settle it</button></nav></div><section class="wsec" id="star-bethlehem-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Travellers asking about a star</h3><p>Matthew&#x27;s Gospel tells it in a dozen verses. In the last years of King Herod, &#x27;magi from the east&#x27; arrive in Jerusalem with an unsettling question: where is the child born king of the Jews? They have seen his star. Herod&#x27;s scholars point them to Bethlehem, a few kilometres south. The star goes ahead of them &#x27;until it stopped over the place where the child was&#x27;, and they are &#x27;overwhelmed with joy&#x27;. They offer gold, frankincense and myrrh, and go home another way.</p><p>No other Gospel mentions the star. Luke&#x27;s birth story has shepherds and a manger instead. Matthew was written around 80–90 CE, some eighty years after the events it describes. Yet since at least the 3rd century, when the scholar Origen suggested the star was a kind of comet, people have searched the sky of those years for it. In Padua around 1305, Giotto painted it as a blazing comet, very likely inspired by Halley&#x27;s Comet of 1301.</p></section><section class="wsec" id="star-bethlehem-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Who were the Magi?</h3><p>The Greek word magoi first named a priestly tribe of the Medes, according to Herodotus, known for interpreting dreams. By Roman times it meant experts in Persian and Babylonian lore, and above all in reading the heavens. Babylonian astronomer-scribes were still at work: the latest datable cuneiform tablets, from the 1st century CE, are astronomical. Magi &#x27;from the east&#x27; would most naturally be astrologers from Parthian Mesopotamia or Persia.</p><p>That changes what we should look for. The NRSV Updated Edition notes that &#x27;in the east&#x27; can also be read &#x27;at its rising&#x27;, a technical phrase for a star&#x27;s first appearance in the dawn sky. Professional astrologers did not need a dazzling light. They needed a meaningful configuration: which planet, in which sign, doing what. An event could have meant everything to them and nothing to a shepherd.</p><blockquote class="wpull"><p>An event could have meant everything to an astrologer and nothing to a shepherd looking at the same sky.</p></blockquote><p>The gifts point east too. Frankincense and myrrh are resins of southern Arabia and the Horn of Africa, the same incense trade that had made the kingdom of Saba rich centuries before. Gold, incense and myrrh were the classic tribute of eastern peoples to a king, and Matthew&#x27;s readers would have heard the list that way.</p></section><section class="wsec" id="star-bethlehem-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Kepler&#x27;s conjunction</h3><p>In December 1603 Johannes Kepler watched Jupiter and Saturn meet in the sky. The following October a brilliant new star, a supernova, appeared near them. In his book De Stella Nova (1606) Kepler wondered whether a similar conjunction around the time of Christ&#x27;s birth had been joined by a similar new star. Working back, he found that Jupiter and Saturn had met in Pisces in 7 BCE.</p><figure class="wx wx--static" id="star-bethlehem-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Three passes in Pisces, 7 BCE</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Three passes in Pisces, 7 BCE"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" class="wx-svg" role="img" aria-labelledby="star-bethlehem-f1-t"><title id="star-bethlehem-f1-t">The paths of Jupiter and Saturn through Pisces in 7 BCE, passing each other three times</title><text class="wx-t-cap" x="24" y="30">Jupiter and Saturn in Pisces, April 7 BCE to January 6 BCE</text><path class="wx-guide" d="M40,157.5 H700"/><text class="wx-t-s" x="700" y="153.5" text-anchor="end">-1.5°</text><path class="wx-guide" d="M40,215.0 H700"/><text class="wx-t-s" x="700" y="211.0" text-anchor="end">-2.0°</text><path class="wx-guide" d="M40,272.5 H700"/><text class="wx-t-s" x="700" y="268.5" text-anchor="end">-2.5°</text><path class="wx-thin" d="M635.0,360 V366"/><text class="wx-t-s" x="635.0" y="380" text-anchor="middle">344°</te
