-pop" style="--d:6" cx="461.3" cy="140.9" r="2.4"/><circle class="wx-c2 wx-pop" style="--d:6" cx="519.7" cy="263.8" r="2.4"/><circle class="wx-c1 wx-pop" style="--d:6" cx="393.5" cy="136.0" r="2.4"/><circle class="wx-c2 wx-pop" style="--d:6" cx="487.2" cy="259.6" r="2.4"/><circle class="wx-c1 wx-pop" style="--d:6" cx="316.0" cy="131.7" r="2.4"/><circle class="wx-c2 wx-pop" style="--d:6" cx="448.3" cy="255.9" r="2.4"/><g class="wx-pop" style="--d:9"><path class="wx-dash" d="M313.0,139.4 V252.7"/><circle class="wx-glow wx-edge" cx="313.0" cy="139.4" r="6"/><circle class="wx-paper wx-edge" cx="313.0" cy="252.7" r="5"/><text class="wx-t-b wx-halo" x="313.0" y="109.4" text-anchor="middle">1 · c. 29–30 May</text></g><g class="wx-pop" style="--d:10"><path class="wx-dash" d="M481.5,186.2 V298.4"/><circle class="wx-glow wx-edge" cx="481.5" cy="186.2" r="6"/><circle class="wx-paper wx-edge" cx="481.5" cy="298.4" r="5"/><text class="wx-t-b wx-halo" x="481.5" y="338.4" text-anchor="middle">2 · c. 30 Sep–2 Oct</text></g><g class="wx-pop" style="--d:11"><path class="wx-dash" d="M562.1,151.8 V273.1"/><circle class="wx-glow wx-edge" cx="562.1" cy="151.8" r="6"/><circle class="wx-paper wx-edge" cx="562.1" cy="273.1" r="5"/><text class="wx-t-b wx-halo" x="562.1" y="121.80" text-anchor="middle">3 · c. 4–6 Dec</text></g><g class="wx-pop" style="--d:8"><text class="wx-t-b wx-t-a" x="134.8" y="167.2" text-anchor="end">Jupiter</text><text class="wx-t-b" x="247.5" y="276.5" text-anchor="end">Saturn</text></g><g class="wx-pop" style="--d:12"><text class="wx-t-m" x="40" y="56">Dots every 10 days. Both planets drift east (left), loop back</text><text class="wx-t-m" x="40" y="72">west around opposition in mid-September, then turn again:</text><text class="wx-t-m" x="40" y="88">three passes, each about 1° apart.</text></g><g class="wx-pop" style="--d:12"><path class="wx-line" d="M589.0,72 H635.0"/><text class="wx-t-s" x="612.0" y="64" text-anchor="middle">1° = two full Moons</text></g><text class="wx-t-s" x="24" y="426">Computed with PyEphem, Julian calendar. North–south spread exaggerated 2.5×. Published dates vary by a day or two.</text></svg></div></div><figcaption>The computed paths of Jupiter and Saturn from April 7 BCE to January 6 BCE. Jupiter overtakes Saturn three times; north–south spread is exaggerated so the loops can be seen. <span class="wx-src">Based on: Positions computed with PyEphem (VSOP87 planetary theory), ecliptic of date, Julian calendar; conjunction dates cross-checked against Hughes 1976 and Sachs and Walker 1984.</span></figcaption><p class="vh">A sky chart with ecliptic longitude from 356 to 344 degrees running left to right, east on the left. An orange track shows Jupiter moving left, looping back to the right around September, then moving left again. A blue track below shows Saturn doing the same in a smaller loop. Dashed vertical lines mark three conjunctions where the planets share the same longitude, about 1 degree apart: around 29 to 30 May, around 30 September to 2 October, and around 4 to 6 December 7 BCE. Dots mark every ten days, and a scale bar shows 1 degree, the width of two full Moons.</p></figure><p>It was not one meeting but three. Jupiter, moving faster, overtook Saturn in late May 7 BCE. Around opposition in mid-September both planets reversed direction for a few weeks, as outer planets do when Earth passes them, and Jupiter slipped back past Saturn around the start of October. When they turned forward again, Jupiter passed a third time in early December. Each time they were about 1° apart, two full-Moon widths, close but still clearly two points of light. A cuneiform almanac for that year, published by Abraham Sachs and Christopher Walker in 1984, shows that Babylonian astronomers had calculated the planets&#x27; positions in advance.</p><aside class="wcall"><b>How do we know?</b><p>Planetary positions can be computed backwards with great accuracy; the drawing here uses a standard ephemeris. The dates of the three conjunctions differ by a day or two depending on whether they are measured along the ecliptic or in right ascension, which is why published dates vary.</p></aside><p>In later astrological tradition, Jupiter was the planet of kings and Saturn was sometimes linked with the Jews. Whether a Parthian astrologer in 7 BCE read the pairing as a sign for Judea is unknown, because no interpretation survives.</p></section><section class="wsec" id="star-bethlehem-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>A royal occultation and a Chinese comet</h3><p>Other candidates compete. Michael Molnar, an astronomer who studied the coins of Antioch, noticed that some show a ram looking back at a star, and argued that Aries was the sign of Judea for Roman-era astrologers. On 17 April 6 BCE the Moon passed in front of Jupiter in Aries, and by Molnar&#x27;s calculation Jupiter was then rising in the east before dawn. For an astrologer, Molnar argued, that was a royal birth announced for Judea.</p><p>Colin Humphreys favoured something that anyone could see. The Han shu, the official history of China&#x27;s Former Han dynasty, records a &#x27;broom star&#x27;, a comet with a tail, appearing in spring 5 BCE and visible for over 70 days. It was logged by court astronomers with no interest in Judea, which makes it the strongest independent witness to something new in the sky in that window.</p><aside class="wcall"><b>Fresh from the field</b><p>In 2025 the NASA planetary scientist Mark Matney published an orbit for the 5 BCE comet in the Journal of the British Astronomical Association. In his best fit the comet passed close to Earth in June 5 BCE and, for several hours, moved almost in step with the sky&#x27;s rotation, appearing to stand still overhead. It is the first natural model for a star that seems to &#x27;stop&#x27;. It depends on an orbit inferred from sparse records.</p></aside></section><section class="wsec" id="star-bethlehem-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>A star in the story</h3><p>Many scholars, following Raymond Brown&#x27;s classic study of the birth narratives, think the star belongs to Matthew&#x27;s storytelling. Centuries earlier, the Book of Numbers had given an oracle of Balaam, himself a seer from the east: &#x27;a star shall come out of Jacob, and a scepter shall rise out of Israel&#x27;. Jewish readers took it as messianic. Romans, for their part, expected stars to herald rulers. After Julius Caesar&#x27;s death in 44 BCE a comet appeared, and Augustus presented it as Caesar&#x27;s soul rising among the gods.</p><p>The sceptical case has been put most fully by Aaron Adair, who argues that no candidate fits the text&#x27;s movements and that the story is shaped to fulfil scripture. The believer&#x27;s reading need not depend on any of this. For many Christians the star is a sign given for a purpose, and whether God used a comet, a conjunction or neither is secondary to what it pointed to.</p><p>The two readings are not as far apart as they sound. A writer steeped in Numbers 24:17 could still have drawn on a memory that astrologers from the east had seen something in the sky around the time of Herod&#x27;s death. The historian&#x27;s job is to weigh how likely that is.</p></section><section class="wsec" id="star-bethlehem-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What would settle it</h3><p>The calendar keeps every candidate in play only if the usual date for Herod&#x27;s death holds. Josephus ties it to a lunar eclipse shortly before a Passover, most often matched to 4 BCE; a minority prefer the eclipse of January 1 BCE, which would open the window to later events. Both the 7 BCE conjunctions and the 5 BCE comet sit comfortably before either date, and Matthew&#x27;s Herod asks the Magi when the star first appeared, as if it had been visible for some time.</p><ul class="wlist"><li>A cuneiform or Parthian text from 7–5 BCE reading a sky sign as a royal birth in Judea or the west.</li><li>More East Asian records to pin down the 5 BCE comet&#x27;s path and test Matney&#x27;s orbit.</li><li>Independent evidence fixing Jesus&#x27; birth year and Herod&#x27;s death.</li><li>An early source independent of Matthew describing the star.</li></ul><p>Until then, the sky of 7–5 BCE stands as a real and remarkable backdrop, recorded in Babylon and in China, against which Matthew&#x27;s travellers could plausibly have set out.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">44 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Comet after Julius Caesar&#x27;s death, hailed as a sign</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">7 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Triple conjunction of Jupiter and Saturn in Pisces</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">6 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Moon occults Jupiter in Aries, 17 April (Molnar)</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">5 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Chinese astronomers log a comet for over 70 days</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">4 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Herod the Great dies (usual dating)</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">85 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Gospel of Matthew written, c. 80–90 CE</span></li><li class="wtl-event" style="--i:6"><span class="wtl-y">1305 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Giotto paints the star as a comet in Padua</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">1606 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Kepler&#x27;s De Stella Nova links conjunction and new star</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">1991 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Humphreys proposes the comet of 5 BCE</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">2025 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Matney models a comet that appears to &#x27;stop&#x27;</span></li></ol><details class="srcs"><summary>Sources for this case (11)</summary><ol><li>Humphreys C. J. (1991). The Star of Bethlehem, a comet in 5 BC, and the date of the birth of Christ. Quarterly Journal of the Royal Astronomical Society 32: 389–407.</li><li>Matney M. (2025). The star that stopped: the Star of Bethlehem and the comet of 5 BCE. Journal of the British Astronomical Association 135(6): 387–406. <a href="https://doi.org/10.64150/193njt" target="_blank" rel="noopener">doi:10.64150/193njt</a></li><li>Molnar M. R. (1999). The Star of Bethlehem: The Legacy of the Magi. Rutgers University Press.</li><li>Sachs A. J., Walker C. B. F. (1984). Kepler&#x27;s view of the star of Bethlehem and the Babylonian almanac for 7/6 B.C. Iraq 46: 43–55.</li><li>Hughes D. W. (1976). The Star of Bethlehem. Nature 264: 513–517. <a href="https://doi.org/10.1038/264513a0" target="_blank" rel="noopener">doi:10.1038/264513a0</a></li><li>Kepler J. (1606). De Stella Nova in Pede Serpentarii. Prague.</li><li>Kidger M. (1999). The Star of Bethlehem: An Astronomer&#x27;s View. Princeton University Press.</li><li>Brown R. E. (1977). The Birth of the Messiah. Doubleday.</li><li>Adair A. (2013). The Star of Bethlehem: A Skeptical View. Onus Books.</li><li>Filmer W. E. (1966). The chronology of the reign of Herod the Great. Journal of Theological Studies 17: 283–298.</li><li>Josephus, Jewish Antiquities 17, trans. R. Marcus and A. Wikgren (Loeb).</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-star-bethlehem" data-t="The Star of Bethlehem: A Sky Worth Reading"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Star of Bethlehem: A Sky Worth Reading</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-star-bethlehem</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-troy-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Walls of Troy (2).jpg" data-cap="The walls of Troy at Hisarlık" data-big><figcaption></figcaption></figure><div class="sh-k">Legends and Relics</div><h2 class="sh-t" id="case-troy-st" tabindex="-1">Troy: The Myth the Experts Wrote Off</h2><p class="sh-s">Nineteenth-century scholars filed Troy under poetry. Then a banker with a shovel, a Hittite treaty and a buried lower town brought it back.</p><div class="sh-v"><span class="vstamp vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><p class="sh-claim"><b>What the stamp rates:</b> Homer&#x27;s Troy was a real, powerful Late Bronze Age city at Hisarlık, the Hittite Wilusa, that was attacked and burned in the age the Greeks remembered as the Trojan War.</p></div><p class="v4-q">Was Homer&#x27;s Troy a real city, and did it fall in a real war?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Homer&#x27;s Troy was written off as a story; then a mound at Hisarlık gave up nine cities stacked on one another.</li><li>Troy VI was a strong Late Bronze Age citadel with walls five metres thick.</li><li>Hittite archives name it Wilusa and record quarrels over it with a Greek-speaking power.</li><li>Troy VIIa burned around 1180 BCE with arrowheads and bodies in the ruins.</li><li>The city is strong evidence; the specific war is unproved, since no text names the attackers.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Texts and scripts</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="46" >46</b><span class="ctr-u"> sublevels</span></div><div class="ctr-l">identified by Carl Blegen in the mound</div><div class="ctr-c">Blegen et al. 1950–1958</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="30" >30</b><span class="ctr-u"> ha</span></div><div class="ctr-l">proposed extent of the lower town</div><div class="ctr-c">Korfmann; Jablonka and Rose 2004</div></div><div class="ctr"><div class="ctr-v">up to <b class="ctr-n" data-v="5" >5</b><span class="ctr-u"> m</span></div><div class="ctr-l">thickness of the Troy VI walls at their widest</div><div class="ctr-c">Troia project</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="3" >3</b><span class="ctr-u"> times a year</span></div><div class="ctr-l">the Alaksandu treaty had to be read aloud to the king of Wilusa</div><div class="ctr-c">Beckman, Bryce and Cline 2011</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Homer&#x27;s Troy was a real, powerful Late Bronze Age city at Hisarlık, the Hittite Wilusa, that was attacked and burned in the age the Greeks remembered as the Trojan War.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Several independent lines agree on the city: the excavated walls, the lower town, the Hittite name Wilusa, the treaty with Alaksandu, and Hittite letters about quarrels with Ahhiyawa. Troy VIIa burned around 1180 BCE with arrowheads and bodies in the ruins. What stays unproved is the specific war: no text names the attackers, and the burning could be the work of raiders, rivals or the wider collapse of the Bronze Age world.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">For much of the nineteenth century the textbooks were overconfident in the wrong direction, dismissing Troy as myth. Today most present the city as real and the war as open, which is roughly right. Popular accounts sometimes swing too far the other way, presenting Korfmann&#x27;s large lower town as settled when its size and density remain genuinely argued, and treating a Greek sack as fact.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>The mound of Hisarlık holds at least nine main settlement layers, divided by Carl Blegen into about 46 sublevels, running from about 3000 BCE to Roman and Byzantine times.<small>Blegen et al. 1950–1958</small></li><li>Troy VI (c. 1750–1300 BCE) was a strong Late Bronze Age citadel with sloping stone walls up to about 5 m thick, topped with mudbrick; Troy VIIa (c. 1300–1180 BCE) ended in fire, with bronze arrowheads and human remains in the destruction levels.<small>Blegen; Korfmann; Latacz 2004</small></li><li>Hittite archives name a western Anatolian kingdom called Wilusa, the name that became Greek (W)ilios, Ilion. A treaty of about 1280 BCE binds its king Alaksandu to the Hittite king Muwatalli II.<small>Beckman, Bryce and Cline 2011; Latacz 2004</small></li><li>Hittite letters record friction with Ahhiyawa, widely read as the Hittite name for Achaean Greeks, and one letter mentions a past dispute over Wilusa.<small>Tawagalawa letter; Beckman, Bryce and Cline 2011</small></li><li>Excavations and magnetometer surveys from 1988 onwards found a lower town south of the citadel, bounded by a ditch cut into bedrock, making Late Bronze Age Troy far larger than the citadel alone.<small>Jablonka and Rose 2004</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>How big and how urban the lower town really was: Korfmann&#x27;s team estimated around 30 ha and several thousand people; Frank Kolb argued the evidence shows a much smaller, thinly built settlement.</li><li>Whether Troy VI ended by earthquake or war, and whether the burning of Troy VIIa was the work of Greeks, other raiders, or internal conflict.</li><li>Whether the Trojan War of the poems remembers one real war, several raids merged into one, or a general memory of the Bronze Age collapse.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>The centre of the Late Bronze Age citadel, where a palace and archive would be, was cut away when Greek and Roman builders levelled the summit for the sanctuary of Athena.</li><li>Schliemann&#x27;s great trench of the 1870s destroyed large parts of the layers he was looking for, before the stratigraphy was understood.</li><li>No archive of Wilusa itself has been found; only one inscribed Luwian seal has turned up at the site.</li></ul></div></div><h3 class="sub-h wsub">How the traditions tell it</h3><div class="v4texts"><blockquote class="quote v4q"><span class="v4q-t">Homeric epic · Iliad 6.448–449</span><p>the day shall come when sacred Ilios shall be laid low, and Priam, and the people of Priam with goodly spear of ash.</p><cite>trans. A. T. Murray (Loeb Classical Library, 1924)</cite></blockquote></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Today&#x27;s consensus is that Hisarlık is Troy, that Late Bronze Age Troy was a significant fortified city, the Wilusa of Hittite texts, and that it had dealings, sometimes hostile, with Mycenaean Greeks. Most specialists stop short of the war itself. They see the Iliad as poetry composed around 750–650 BCE from centuries of oral tradition, which may hold real memories of conflicts over Wilusa but cannot be read as a war report.</p><ul><li>Hisarlık&#x27;s identification with Troy and with Wilusa is widely accepted.</li><li>Troy VIIa&#x27;s fiery end around 1180 BCE shows violence, but not who caused it.</li><li>Details such as Helen, the ten-year siege and the wooden horse are treated as poetic, not historical.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>In the mid-nineteenth century leading historians such as George Grote treated the Trojan War as legend and Troy as a city of the imagination. Amateurs took the poem at its word: Frank Calvert, a British consul who owned part of Hisarlık, and Heinrich Schliemann, a wealthy businessman, dug there and found a city. In our own time Manfred Korfmann and the classicist Joachim Latacz argued that Troy was a major regional capital and that the Homeric tradition preserves genuine Late Bronze Age memories.</p><ul><li>The site Homer described, a walled city near the Hellespont, exists and was important in exactly the right period.</li><li>Hittite texts independently name Wilusa, a king called Alaksandu, and Greek-Hittite quarrels over the region.</li><li>Some Homeric details, such as the sloping walls and the city&#x27;s commanding position, fit Troy VI rather than the Iron Age world of the poet.</li></ul><div class="face-s"><b>Its strongest point</b><p>The sceptics said there was no Troy. There was one, on the spot the poem names, fortified and burned in the Late Bronze Age, and known under the same name to a foreign empire&#x27;s scribes.</p></div><p class="face-cr"><b>Credit</b> Frank Calvert and Heinrich Schliemann (then); Manfred Korfmann and Joachim Latacz (now)</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>A Hittite or Mycenaean text that names who attacked Wilusa around 1200 BCE.</li><li>An archive of Wilusa itself, in Luwian or Hittite, from the lower town or the lost centre of the citadel.</li><li>Large-scale excavation of the lower town to measure how densely it was built and how many people lived there.</li><li>Scientific dating and sourcing of the arrowheads and weapons in the Troy VIIa destruction layer, to see whose they were.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">6 min read · 1,291 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of Troy: The Myth the Experts Wrote Off"><button type="button" class="wtoc-i" data-go="troy-s1">A poem with an address</button><button type="button" class="wtoc-i" data-go="troy-s2">How the experts wrote Troy off</button><button type="button" class="wtoc-i" data-go="troy-s3">Ten cities in one hill</button><button type="button" class="wtoc-i" data-go="troy-s4">Wilusa: Troy in the Hittite archives</button><button type="button" class="wtoc-i" data-go="troy-s5">Korfmann&#x27;s big city and the fight over it</button><button type="button" class="wtoc-i" data-go="troy-s6">What time and treasure hunters destroyed</button><button type="button" class="wtoc-i" data-go="troy-s7">What would settle it</button></nav></div><section class="wsec" id="troy-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A poem with an address</h3><p>Near the mouth of the Dardanelles, where the wind comes hard off the Aegean, a low grassy hill rises from the plain. Its Turkish name is Hisarlık, &#x27;place of the fortress&#x27;. For more than two thousand years people believed that this was where Troy stood. Alexander the Great came here to honour Achilles. The Romans rebuilt the town as Ilium and claimed descent from its refugees. Then, in the age of scientific history, the experts decided that Troy had never existed at all.</p><blockquote class="quote"><p>the day shall come when sacred Ilios shall be laid low, and Priam, and the people of Priam with goodly spear of ash.</p><cite>Homer, Iliad 6.448–449, trans. A. T. Murray (Loeb Classical Library, 1924)</cite></blockquote><p>The Iliad was probably fixed in writing around 750–650 BCE, from a tradition of oral poetry that reached back much further. It describes a rich walled city near the Hellespont, besieged by a coalition of Achaean Greeks. Whether that city was real became one of the great test cases of the question this site asks: can old stories remember real events that the history books had given up on?</p></section><section class="wsec" id="troy-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>How the experts wrote Troy off</h3><p>By the mid-1800s, critical scholarship had turned against the old stories. George Grote&#x27;s influential History of Greece treated the Trojan War as belonging to legend rather than history, something that could be neither affirmed nor denied and so was best set aside. Many classicists went further and located Troy, if anywhere, in the imagination of poets. The mood was reasonable in one way: nobody had found the city. It was overconfident in another: nobody had seriously dug for it.</p><p>The digging was done by outsiders. Frank Calvert, a British consular official who lived in the Dardanelles and owned part of Hisarlık, dug trial trenches in 1865 and became convinced that the hill held Troy. He persuaded Heinrich Schliemann, a German businessman with a fortune and an obsession with Homer, to excavate. From 1871 Schliemann tore into the hill with gangs of workmen. In 1873 he announced a hoard of gold and silver that he called Priam&#x27;s Treasure. The city he had found was real. The experts had been wrong.</p><blockquote class="wpull"><p>The scholars said there was no Troy. The people who found it were a consul and a businessman who took the poem at its word.</p></blockquote></section><section class="wsec" id="troy-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Ten cities in one hill</h3><p>Hisarlık turned out to be not one city but a stack of them. People rebuilt on the ruins of their predecessors for more than three thousand years, and the hill grew layer by layer. Schliemann&#x27;s architect Wilhelm Dörpfeld, then Carl Blegen of the University of Cincinnati in the 1930s, sorted the layers into nine main cities and about 46 sublevels. Step through the drawing to watch Troy build up, burn, and then suffer at the hands of its own discoverers.</p><figure class="wx wx--steps" id="troy-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">Ten cities in one hill</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Ten cities in one hill"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" class="wx-svg" role="img" aria-labelledby="troy-f1-t"><title id="troy-f1-t">Schematic section through the mound of Hisarlık showing the cities of Troy stacked from Troy I at the bottom to Greek and Roman Ilion at the top</title><text class="wx-t-cap" x="24" y="24">Hisarlık · schematic section, not to scale</text><text class="wx-t-h" x="24" y="52">Ten cities in one hill</text><rect class="wx-rock" x="20" y="400" width="692" height="36"/><path class="wx-line wx-draw" pathLength="1" d="M20,400 H712"/><g class="wx-st" data-s="1"><path class="wx-soil wx-edge-soft" d="M245,400 L270,372 H550 L575,400 Z"/><path class="wx-stone2 wx-edge-soft" d="M270,372 L285,344 H535 L550,372 Z"/><path class="wx-sand wx-edge-soft" d="M285,344 L300,304 H520 L535,344 Z"/><path class="wx-glow wx-edge" d="M414,358 l6,-6 l6,6 l-6,6 Z"/><path class="wx-thin" d="M214,384 H258 M214,358 H276 M214,324 H292"/><text class="wx-t-b" x="20" y="378">Troy I</text><text class="wx-t-s" x="20" y="391">c. 3000–2550 BCE</text><text class="wx-t-b" x="20" y="354">Troy II</text><text class="wx-t-s" x="20" y="367">c. 2500–2300 BCE, "treasure"</text><text class="wx-t-b" x="20" y="320">Troy III–V</text><text class="wx-t-s" x="20" y="333">c. 2300–1750 BCE</text></g><g class="wx-st" data-s="2"><path class="wx-stone wx-edge-soft" d="M300,304 L312,262 H508 L520,304 Z"/><path class="wx-stone3 wx-edge" d="M262,400 L292,300 L314,300 L286,400 Z"/><path class="wx-stone3 wx-edge" d="M558,400 L528,300 L506,300 L534,400 Z"/><path class="wx-soil wx-edge-soft" d="M575,400 L590,390 H700 V400 Z"/><path class="wx-stone3" d="M604,384 h10 v6 h-10 Z M624,384 h12 v6 h-12 Z M648,384 h10 v6 h-10 Z"/><path class="wx-paper wx-edge" d="M670,400 L680,420 L690,400 Z"/><path class="wx-thin" d="M214,284 H306 M570,300 L546,340 M680,440 V422"/><text class="wx-t-b" x="20" y="280">Troy VI</text><text class="wx-t-s" x="20" y="293">c. 1750–1300 BCE, big walls</text><text class="wx-t-b" x="560" y="280">Troy VI walls,</text><text class="wx-t-s" x="560" y="294">up to 5 m thick</text><text class="wx-t-b" x="592" y="356">Lower town</text><text class="wx-t-s" x="592" y="370">found by magnetometry</text><text class="wx-t-s" x="680" y="454" text-anchor="middle">rock-cut ditch</text></g><g class="wx-st" data-s="3"><path class="wx-fire wx-o60 wx-edge-soft" d="M312,262 L318,244 H502 L508,262 Z"/><path class="wx-soil wx-edge-soft" d="M318,244 L322,234 H498 L502,244 Z"/><path class="wx-thin" d="M214,244 H314"/><text class="wx-t-b" x="20" y="240">Troy VIIa</text><text class="wx-t-s" x="20" y="253">c. 1300–1180 BCE, burned</text></g><g class="wx-st" data-s="4"><path class="wx-stone wx-edge-soft" d="M322,234 L330,200 H490 L498,234 Z"/><path class="wx-stone wx-edge-soft" d="M360,234 L372,282 H448 L460,234 Z"/><path class="wx-card wx-edge" d="M394,186 h32 v14 h-32 Z M390,186 L410,176 L430,186 Z"/><path class="wx-thin" d="M214,206 H330"/><text class="wx-t-b" x="20" y="202">Troy VIII–IX</text><text class="wx-t-s" x="20" y="215">Greek and Roman Ilion</text><text class="wx-t-s wx-halo" x="436" y="190">temple of Athena</text><path class="wx-thin" d="M520,226 L446,252"/><text class="wx-t-s wx-halo" x="524" y="226">summit levelled</text></g><g class="wx-st wx-hide" data-s="5"><path class="wx-paper wx-dash" d="M336,198 V380 H372 V198"/><path class="wx-thin" d="M300,172 L352,196"/><text class="wx-t-b wx-t-a" x="210" y="150">Schliemann's great trench, 1870s:</text><text class="wx-t-m" x="210" y="166">cut through Troy VI–VII to reach Troy II</text></g><text class="wx-t-s" x="24" y="456">North: the plain and the Dardanelles</text><text class="wx-t-s" x="712" y="474" text-anchor="end">South: the plateau</text><text class="wx-t-s" x="24" y="494">After Blegen, Korfmann and Troia project publications; thicknesses and widths schematic.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Early Bronze Age: Troy I to V pile up between about 3000 and 1750 BCE. Schliemann&#x27;s &#x27;Priam&#x27;s Treasure&#x27; comes from Troy II, around 2500–2300 BCE.</p><ol class="wx-steplist"><li>Early Bronze Age: Troy I to V pile up between about 3000 and 1750 BCE. Schliemann&#x27;s &#x27;Priam&#x27;s Treasure&#x27; comes from Troy II, around 2500–2300 BCE.</li><li>Troy VI (c. 1750–1300 BCE): a fortified citadel with sloping stone walls up to 5 m thick, and a lower town to the south ringed by a ditch cut into bedrock.</li><li>Troy VIIa (c. 1300–1180 BCE): crowded houses and storage jars inside the old walls, ending in fire, with arrowheads and human remains in the ruins.</li><li>Greek and Roman Ilion (Troy VIII–IX): builders level the summit for a sanctuary of Athena, cutting away the centre of the Late Bronze Age citadel.</li><li>1870s: Schliemann&#x27;s great trench slices through Troy VI and VII to reach Troy II. Blegen and Korfmann later recover what survives at the edges.</li></ol><figcaption>Step through a schematic north-south section of Hisarlık, from the first Early Bronze Age settlement to the Roman sanctuary and the trench that nearly destroyed the evidence. Layer thicknesses are schematic. <span class="wx-src">Based on: Layer dates after Blegen and the Troia project (Korfmann; Jablonka and Rose 2004); wall thickness after project publications. Section is schematic, not measured.</span></figcaption><p class="vh">A schematic cross-section of the mound of Hisarlık above a band of bedrock. Step 1: three stacked bands at the bottom, Troy I, Troy II with a small gold diamond marking Schliemann&#x27;s treasure, and Troy III to V. Step 2: Troy VI adds a wider band with thick sloping stone walls on both flanks, and to the south a thin lower town with houses and a V-shaped ditch cut in bedrock. Step 3: Troy VIIa, a thin band coloured for fire, with Troy VIIb above. Step 4: Greek and Roman Ilion caps the mound with a temple of Athena, and a wedge of fill shows the summit being levelled, cutting away the Late Bronze Age layers in the centre. Step 5: a dashed vertical cut marks Schliemann&#x27;s great trench of the 1870s, slicing down through Troy VI and VII to Troy II.</p></figure><p>The irony is sharp. Schliemann believed the burned Troy II was Homer&#x27;s city, and in hunting for it he drove a great trench through the layers above, damaging the very Late Bronze Age walls he was looking for. Priam&#x27;s Treasure belongs to Troy II, around 2500–2300 BCE, more than a thousand years too early for any Trojan War. Blegen later argued that Troy VIIa, destroyed by fire around 1180 BCE, was the likeliest candidate for Homer&#x27;s Troy. Others preferred Troy VI, whose massive sloping walls and towers match the poem&#x27;s grandeur but which seems to have ended around 1300 BCE, perhaps in an earthquake.</p></section><section class="wsec" id="troy-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Wilusa: Troy in the Hittite archives</h3><p>The most striking support for Troy&#x27;s historical reality came not from Greece but from central Anatolia. The Hittite capital at Hattusa held thousands of clay tablets, and among them are references to a kingdom in the far west called Wilusa. Linguists see in it the Greek name for Troy, Ilios, which in its older form began with a w-sound, Wilios. Around 1280 BCE the Hittite king Muwatalli II made a treaty with a king of Wilusa named Alaksandu, a name startlingly close to Alexandros, the other name Homer gives to Paris. The treaty required it to be read aloud to him three times a year.</p><p>Other letters fill in a troubled frontier. The so-called Tawagalawa letter, from a Hittite king to the king of Ahhiyawa, mentions an earlier disagreement over Wilusa that had been resolved. A later letter refers to a deposed king of Wilusa called Walmu. Most Hittitologists read Ahhiyawa as the Hittite term for the Achaeans, Homer&#x27;s Greeks. None of this describes a ten-year siege. But it places Greeks, Hittites and Wilusa in the same diplomatic world, quarrelling over the same stretch of coast, in the very century the Greeks later set their war.</p><aside class="wcall"><b>How do we know?</b><p>In 1995 excavators at Troy found a small bronze seal inscribed in Luwian hieroglyphs, giving the name of a scribe on one side and a woman on the other. It came from the layer above the Troy VIIa destruction. It is the only inscription of its kind from the site, but it shows that the city belonged to the Luwian-speaking, Hittite-connected world of western Anatolia, just as the tablets imply.</p></aside></section><section class="wsec" id="troy-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Korfmann&#x27;s big city and the fight over it</h3><p>From 1988 until his death in 2005 Manfred Korfmann of the University of Tübingen led a new international excavation. Using magnetometers, his team traced features in the fields south of the citadel, then excavated to confirm them: houses, streets and a ditch cut into the bedrock, running around a lower town. Troy, he argued, had been a city of perhaps 30 ha and several thousand people, a trading capital controlling the entrance to the Dardanelles.</p><p>The claim provoked one of the angriest debates in modern archaeology. Frank Kolb, an ancient historian also at Tübingen, accused Korfmann of inflating thin evidence into a metropolis. Kolb argued that the lower town was sparsely built and that Troy was a modest regional centre, not a great trading city. The two sides fought in newspapers and at a public conference in 2002, and set out their cases in the American Journal of Archaeology in 2004. Most specialists now accept that a lower town existed and that Late Bronze Age Troy was far more than a hilltop fort, while treating its exact size and density as open.</p></section><section class="wsec" id="troy-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What time and treasure hunters destroyed</h3><p>The worst losses at Troy are exactly where the answers would be. When Greek and later Roman builders turned the hill into the sanctuary of Athena, they levelled the summit, shaving away the centre of the Late Bronze Age citadel. Whatever palace, and whatever archive, stood there went into Roman foundations and terracing. Schliemann&#x27;s trench did further damage. The Late Bronze Age layers survive best around the edges of the mound, which is why Troy VI is known mainly from its walls and the houses inside them.</p><p>The landscape has changed too. Studies of the sediments in the plain show that the bay which once reached towards the city has filled with river silt, pushing the shoreline kilometres north. Harbour installations, beached ships&#x27; camps and battlefield debris, if any existed, now lie under metres of alluvium. Here, absence of evidence is weak evidence: much of the relevant ground has been buried, bulldozed by ancient builders, or never dug.</p></section><section class="wsec" id="troy-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle it</h3><p>Troy&#x27;s reality is no longer in question. The war is. The single most powerful discovery would be a text, Hittite, Luwian or Mycenaean Greek, that names who attacked Wilusa around 1200 BCE. Tablets turn up in archives, and Wilusa must have had one; some may yet lie in the lower town, or in Hittite and Mycenaean archives still unexcavated. Scientific study of the arrowheads and weapons from the Troy VIIa destruction, comparing their metal and form with Aegean and Anatolian types, could show whose weapons they were.</p><p>Until then, Troy is the best lesson on this site about the limits of scholarly scepticism. The poets did not know everything, and they surely embroidered much. But the city was real, it stood where they said, it had the name they gave it, and it burned. The experts who dismissed it were not stupid; they simply mistook the absence of excavation for the absence of a city.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">1,750 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Troy VI begins: the great walled citadel</span></li><li class="wtl-loss" style="--i:1"><span class="wtl-y">1,300 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Troy VI ends, possibly in an earthquake</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">1,280 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Hittite treaty with Alaksandu of Wilusa</span></li><li class="wtl-loss" style="--i:3"><span class="wtl-y">1,180 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Troy VIIa destroyed by fire</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">700 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">The Iliad takes shape (c. 750–650 BCE)</span></li><li class="wtl-find" style="--i:5"><span class="wtl-y">1865 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Frank Calvert&#x27;s trial trenches at Hisarlık</span></li><li class="wtl-find" style="--i:6"><span class="wtl-y">1873 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Schliemann finds &#x27;Priam&#x27;s Treasure&#x27; in Troy II</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">1932 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Carl Blegen begins his careful re-excavation</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">1988 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Manfred Korfmann&#x27;s project begins; lower town found</span></li><li class="wtl-event" style="--i:9"><span class="wtl-y">1998 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Troy inscribed as a UNESCO World Heritage Site</span></li></ol><details class="srcs"><summary>Sources for this case (11)</summary><ol><li>Latacz J. (2004). Troy and Homer: Towards a Solution of an Old Mystery. Oxford University Press.</li><li>Jablonka P., Rose C. B. (2004). Late Bronze Age Troy: a response to Frank Kolb. American Journal of Archaeology 108(4): 615–630. <a href="https://doi.org/10.3764/aja.108.4.615" target="_blank" rel="noopener">doi:10.3764/aja.108.4.615</a></li><li>Kolb F. (2004). Troy VI: a trading center and commercial city? American Journal of Archaeology 108(4): 577–613.</li><li>Beckman G. M., Bryce T. R., Cline E. H. (2011). The Ahhiyawa Texts. Society of Biblical Literature.</li><li>Bryce T. (2006). The Trojans and their Neighbours. Routledge.</li><li>Blegen C. W., Caskey J. L., Rawson M., Sperling J. (1950–1958). Troy: General Introduction and the First Settlements, vols I–IV. Princeton University Press.</li><li>Korfmann M. (2004). Was there a Trojan War? Archaeology 57(3).</li><li>Allen S. H. (1999). Finding the Walls of Troy: Frank Calvert and Heinrich Schliemann at Hisarlık. University of California Press.</li><li>Cline E. H. (2013). The Trojan War: A Very Short Introduction. Oxford University Press.</li><li>Homer. Iliad, trans. A. T. Murray (1924). Loeb Classical Library, Harvard University Press.</li><li>UNESCO World Heritage Centre. Archaeological Site of Troy (no. 849), inscribed 1998.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-troy" data-t="Troy: The Myth the Experts Wrote Off"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Troy: The Myth the Experts Wrote Off</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-troy</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-vinland-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="L&#x27;Anse aux Meadows, small boat reconstruction.jpg" data-cap="Reconstruction at L&#x27;Anse aux Meadows" data-big><figcaption></figcaption></figure><div class="sh-k">Legends and Relics</div><h2 class="sh-t" id="case-vinland-st" tabindex="-1">Vinland: The Sagas Were Right</h2><p class="sh-s">Icelandic sagas told of a western land of grapes. For centuries scholars shrugged. Then a solar storm stamped the Norse visit with a date.</p><div class="sh-v"><span class="vstamp vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><p class="sh-claim"><b>What the stamp rates:</b> Norse Greenlanders reached North America and built a base there around 1000 CE, as the Vinland sagas report.</p></div><p class="v4-q">Did Norse Greenlanders really reach America five centuries before Columbus?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>The sagas say Norse Greenlanders sailed west to a land called Vinland around the year 1000.</li><li>In 1960 a Norse site was found at L&#x27;Anse aux Meadows in Newfoundland: turf houses, iron-working, boat rivets.</li><li>Three pieces of wood cut with metal blades carry a known cosmic-ray spike in their rings, fixing the cutting to the year 1021.</li><li>Butternuts found there grow only farther south, so the Norse travelled on.</li><li>The voyages are established; where exactly Vinland lay is still open.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Physics</span><span class="thr">Texts and scripts</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="1021" >1,021</b><span class="ctr-u"> CE</span></div><div class="ctr-l">year the Norse cut the dated wood</div><div class="ctr-c">Kuitems et al. 2022</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="29" >29</b><span class="ctr-u"> rings</span></div><div class="ctr-l">from the 993 CE spike to the bark</div><div class="ctr-c">Kuitems et al. 2022</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="471" >471</b><span class="ctr-u"> years</span></div><div class="ctr-l">before Columbus reached the Caribbean in 1492</div><div class="ctr-c">calculated from Kuitems et al. 2022</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="3" >3</b><span class="ctr-u"> pieces of wood</span></div><div class="ctr-l">from three different trees, all cut with metal blades</div><div class="ctr-c">Kuitems et al. 2022</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Norse Greenlanders reached North America and built a base there around 1000 CE, as the Vinland sagas report.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:91.7%" role="img" aria-label="Weight of evidence: Established"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Independent lines agree. The sagas describe voyages west to a land with large houses; excavation found Norse buildings, iron-working and artefacts in Newfoundland; butternuts show travel farther south; and three pieces of metal-cut wood carry the 993 CE carbon-14 spike 29 rings in from the bark, fixing the cutting to 1021 CE. Where exactly Vinland lay, and how long the visits lasted, remain open, but the voyages themselves are as secure as anything in medieval history.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">For generations, textbooks presented Columbus as the first European in the Americas and the sagas as legend, an overconfident dismissal. Today most present the Norse voyages as fact, which the evidence now supports. The remaining risk is the reverse: popular accounts sometimes treat Vinland&#x27;s location, or long-lasting Norse settlement, as known, when the evidence only secures one short-lived base and trips south.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>In 1960 Helge and Anne Stine Ingstad identified a Norse site at L&#x27;Anse aux Meadows, Newfoundland; excavations in the 1960s and 1970s uncovered turf buildings of Norse type, iron smelting, iron boat rivets and Norse artefacts.<small>Ingstad 1977; Wallace 2003</small></li><li>Three pieces of wood from the site, from three different trees and all cut with metal blades, carry the carbon-14 spike of 993 CE 29 rings in from the bark, dating the cutting to 1021 CE.<small>Kuitems et al. 2022, Nature</small></li><li>Butternuts were found in the Norse layers; the tree does not grow in Newfoundland, so the Norse travelled or traded farther south, probably around the Gulf of St Lawrence.<small>Wallace 2003; Parks Canada</small></li><li>Adam of Bremen, writing around 1075, reported an island called Vinland where wild vines and self-sown grain grew, on the word of the Danish king.<small>Adam of Bremen, Descriptio insularum Aquilonis</small></li><li>Yale University announced in 2021 that the famous Vinland Map is a modern forgery: its ink contains titanium dioxide in a form first manufactured in the 1920s.<small>Yale University 2021</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Where Vinland itself was: L&#x27;Anse aux Meadows fits the sagas&#x27; base camp, but grapes and butternuts point to lands farther south, and the sagas&#x27; sailing directions allow several readings.</li><li>How many voyages there were and for how long the Norse kept coming, whether a single decade or occasional visits for timber over a longer period.</li><li>Whether any site south of Newfoundland is Norse; claims such as the Kensington Runestone and the Newport Tower are rejected by most specialists.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Turf and timber buildings leave faint traces; any Norse camps farther south would be hard to find and may have eroded or been built over.</li><li>Almost nothing survives from the Indigenous side of the encounter except archaeology; the people the Norse called Skrælings left no written account.</li><li>The sagas were written down in Iceland about two centuries after the voyages, so their details cannot be checked line by line.</li></ul></div></div><h3 class="sub-h wsub">How the traditions tell it</h3><div class="v4texts"><blockquote class="quote v4q"><span class="v4q-t">Norse sagas · Grænlendinga saga (Flatey Book), the voyage of Leif Eriksson</span><p>Leif gave the land a name after its qualities, and called it Vinland, or Wineland.</p><cite>trans. in A. M. Reeves, N. L. Beamish and R. B. Anderson, The Norse Discovery of America (1906)</cite></blockquote></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Today the mainstream accepts Norse voyages to North America around 1000 CE as established: L&#x27;Anse aux Meadows is a Norse site, and tree-ring dating fixes activity there in 1021 CE. Scholars read the two Vinland sagas as real memories of several voyages, shaped by two centuries of retelling. The base in Newfoundland was probably a gateway, with trips farther south for grapes, nuts and timber. The Norse presence was brief and left no lasting colony.</p><ul><li>Norse artefacts, buildings and metalworking are confirmed at one site.</li><li>The date 1021 CE is fixed by a worldwide radiocarbon marker, independent of the sagas.</li><li>Claims of Norse sites deep in the continent have not survived testing.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>For much of the modern era, standard histories began European contact in the Americas with Columbus in 1492 and treated the Vinland sagas as colourful romance. Helge Ingstad, a Norwegian explorer and writer rather than a professional archaeologist, took the sagas&#x27; sailing directions seriously and searched the coasts by boat and plane until a local man, George Decker, showed him the mounds at L&#x27;Anse aux Meadows. His wife, the archaeologist Anne Stine Ingstad, led the excavations. Today some writers go further and argue for Norse visits deep into New England or the interior.</p><ul><li>The sagas&#x27; sequence of lands (stony Helluland, wooded Markland, then Vinland) matches the real coasts of Baffin Island, Labrador and Newfoundland.</li><li>The sagas describe a base with large houses where boats were repaired, which is what L&#x27;Anse aux Meadows turned out to be.</li><li>Butternuts show that the Norse knew lands where grapes grow wild, just as the sagas say.</li></ul><div class="face-s"><b>Its strongest point</b><p>Two medieval texts said Norse sailors reached a wooded land to the west, built houses and met local people. Archaeology found exactly such a site, and physics then dated it to the year.</p></div><p class="face-cr"><b>Credit</b> Helge Ingstad and Anne Stine Ingstad (then); advocates of Norse sites farther south (now)</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>A second securely Norse site farther south, with dated Norse artefacts or tool-cut wood.</li><li>More tool-cut wood from L&#x27;Anse aux Meadows dated by the 993 marker, to show whether the Norse came for one season or many.</li><li>Ancient DNA or isotope work on any Norse-period remains in Newfoundland or Labrador.</li><li>Excavation of Indigenous sites of the period to find traded Norse objects in their original context.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">6 min read · 1,363 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of Vinland: The Sagas Were Right"><button type="button" class="wtoc-i" data-go="vinland-s1">Grapes at the edge of the world</button><button type="button" class="wtoc-i" data-go="vinland-s2">Romance or record?</button><button type="button" class="wtoc-i" data-go="vinland-s3">A Norwegian couple and a grassy terrace</button><button type="button" class="wtoc-i" data-go="vinland-s4">The year the sky left a mark</button><button type="button" class="wtoc-i" data-go="vinland-s5">The forgery that muddied the water</button><button type="button" class="wtoc-i" data-go="vinland-s6">Where was Vinland?</button><button type="button" class="wtoc-i" data-go="vinland-s7">What would settle the rest</button></nav></div><section class="wsec" id="vinland-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Grapes at the edge of the world</h3><p>Around the year 1000, according to two Icelandic sagas, Leif Eriksson sailed west from the Norse farms of Greenland. He passed a land of flat stone slabs, which he called Helluland, then a low wooded coast he called Markland. Farther on he found a green land with salmon in the rivers, mild winters and, his crew reported, grapes. The Norse built houses there and wintered. Later expeditions brought settlers, cattle, trade and eventually fighting with the local people, whom the sagas call Skrælings. Then the Norse went home, and the land to the west faded into story.</p><blockquote class="quote"><p>Leif gave the land a name after its qualities, and called it Vinland, or Wineland.</p><cite>Grænlendinga saga (Flatey Book), trans. in A. M. Reeves, N. L. Beamish and R. B. Anderson, The Norse Discovery of America (1906)</cite></blockquote><p>It is a wonderful story. For most of the last five centuries, it was also treated as just that: a story. This case is the clearest example on this site of an old tradition that was right, a scholarly consensus that was too slow, and a piece of physics that settled the matter to the year.</p></section><section class="wsec" id="vinland-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Romance or record?</h3><p>The sagas, Grænlendinga saga and Eiríks saga rauða, were written down in Iceland in the 13th century, some two hundred years after the events. They disagree on details, include a ghost story or two, and name places no map could find. There was one early outside witness: around 1075 the German chronicler Adam of Bremen wrote that the Danish king had told him of an island in the northern ocean called Vinland, where vines grew wild and grain grew without sowing. But Adam also reported plenty of northern marvels, and later scholars could dismiss his Vinland with the rest.</p><p>By the 19th and 20th centuries, school histories began the European story of the Americas with Christopher Columbus in 1492. Some scholars argued for Norse voyages, and the sagas were widely discussed, but without a site the case stayed in the realm of literature. The sagas&#x27; grapes were a particular problem: grapes do not grow in Greenland, Labrador or Newfoundland, so perhaps the whole tale was a promotional fiction, like the name &#x27;Greenland&#x27; itself.</p><blockquote class="wpull"><p>The sagas had the order of the coasts right, the houses right and the people right. What they did not have was a date. Physics supplied one.</p></blockquote></section><section class="wsec" id="vinland-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>A Norwegian couple and a grassy terrace</h3><p>Helge Ingstad was a Norwegian adventurer and writer, not an academic archaeologist. He took the sagas&#x27; directions seriously and searched the coasts of North America by boat and plane. In 1960 George Decker, a fisherman at L&#x27;Anse aux Meadows on the northern tip of Newfoundland, showed him grassy ridges on a terrace near the shore. Anne Stine Ingstad, an archaeologist, led excavations there from 1961 to 1968, and Parks Canada continued the work in the 1970s under Bengt Schönbäck and Birgitta Wallace.</p><p>What they found was unmistakably Norse: the remains of turf-walled halls and huts of Norse design, a smithy where bog iron had been smelted, iron boat rivets, a bronze cloak pin and a stone spindle whorl of Norse type. The camp looked like a base for repairing ships and a gateway for expeditions, with room for perhaps several dozen people. And among the finds were butternuts, which do not grow in Newfoundland. Their nearest source is far to the south, around the Gulf of St Lawrence, a region where wild grapes also grow. Someone at the camp had been there and come back.</p><aside class="wcall"><b>How do we know?</b><p>Earlier radiocarbon dates on the site clustered broadly around 1000 CE, but radiocarbon alone gives ranges of decades, and some samples came from driftwood or old timber. The breakthrough came from wood chips and offcuts that were cut with metal tools, which the local Indigenous peoples did not use, and so must have been worked by the Norse.</p></aside></section><section class="wsec" id="vinland-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The year the sky left a mark</h3><p>In 2012 the Japanese physicist Fusa Miyake and colleagues reported something unexpected in tree rings: a sudden jump in carbon-14 in the ring for 774–775 CE. The next year her team found a second, smaller jump in 993–994 CE. These spikes, now called Miyake events, seem to have been caused by bursts of energetic particles, most likely from extreme solar storms, which produced extra carbon-14 in the upper atmosphere. The carbon mixed around the globe within a year, so every tree growing at the time recorded the same spike in the same ring. That turns a vague radiocarbon measurement into a calendar marker, if you can find the spike.</p><figure class="wx wx--steps" id="vinland-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">How a solar storm dated the Norse in America</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How a solar storm dated the Norse in America"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" class="wx-svg" role="img" aria-labelledby="vinland-f1-t"><title id="vinland-f1-t">How the carbon-14 spike of 993 CE dates wood cut by the Norse at L'Anse aux Meadows to 1021 CE</title><defs><marker id="vinland-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text class="wx-t-cap" x="24" y="24">Dating Norse wood to the year · schematic</text><text class="wx-t-h" x="24" y="52">A cosmic-ray fingerprint in the rings</text><text class="wx-t-b" x="60" y="100">Strip of wood from the centre (left) to the bark (right): one ring per year</text><g class="wx-pop" style="--d:0"><rect class="wx-wood wx-o20" x="60" y="112"
