<script type="text/x-tpl" id="case-thamud-hegra-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Qasr al-Farid, a 1st-century AD Nabatean unfinished tomb carved into a giant boulder in Hegra (Mada&#x27;in Salih), the kingdom&#x27;s second Nabatean capital after Petra, Saudi Arabia - 53535089614.jpg" data-cap="Qasr al-Farid at Hegra" data-big><figcaption></figcaption></figure><div class="sh-k">Peoples of the Sacred Texts</div><h2 class="sh-t" id="case-thamud-hegra-st" tabindex="-1">Thamud, Salih and the Houses Carved in Mountains</h2><p class="sh-s">The Quran&#x27;s Thamud carved homes from mountains and were struck down after killing a sacred camel. Assyrian annals and Roman temples confirm the people were real.</p><div class="sh-v"><span class="vstamp vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><p class="sh-claim"><b>What the stamp rates:</b> Thamud were a real people of northwest Arabia, the region where the Quran places al-Hijr.</p><p class="sh-claim"><b>The text's own words:</b> <span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span> <span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span> <span class="sh-more">(line by line below)</span></p></div><p class="v4-q">What does archaeology show about Thamud, and are Hegra&#x27;s rock-cut facades theirs?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>The Quran remembers Thamud, who carved houses in the mountains.</li><li>Few ancient Arabian peoples are better documented: an Assyrian king names them around 715 BCE, Greek and Roman writers place them in north-west Arabia, and they built a temple in the 160s CE.</li><li>Their horsemen served Rome around 400 CE.</li><li>That is exactly the region the Quran implies.</li><li>Thamud are established; whether Hegra&#x27;s carved facades, which are Nabataean tombs, were theirs is still to be shown.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Texts and scripts</span><span class="thr">Religion and myth</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="715" >715</b><span class="ctr-u"> BCE</span></div><div class="ctr-l">Thamud (Tamudi) named in Sargon II&#x27;s annals</div><div class="ctr-c">Eph&#x27;al 1982</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="111" >111</b><span class="ctr-u"> tombs</span></div><div class="ctr-l">monumental Nabataean tombs at Hegra, 94 decorated</div><div class="ctr-c">UNESCO</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="50" >50</b><span class="ctr-u"> inscriptions</span></div><div class="ctr-l">from the pre-Nabataean period at Hegra</div><div class="ctr-c">UNESCO</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="15000" >15,000</b><span class="ctr-u"> texts</span></div><div class="ctr-l">Ancient North Arabian inscriptions labelled &#x27;Thamudic&#x27;</div><div class="ctr-c">Macdonald 2004</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Thamud were a real people of northwest Arabia, the region where the Quran places al-Hijr.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:91.7%" role="img" aria-label="Weight of evidence: Established"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Few ancient Arabian peoples are better documented. Sargon II names them around 715 BCE, Greek and Roman geographers locate them in northwest Arabia, they built a temple for Roman emperors at Ruwafa in the 160s CE, and their horsemen served Rome around 400 CE. That places them in exactly the region the Quran implies. The narrower question, whether Hegra&#x27;s carved facades are Thamud&#x27;s houses, is different: those facades are Nabataean tombs, and a Thamudic phase at Hegra itself is still to be shown.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Where textbooks mention Thamud they treat them as a real tribe, and the evidence supports that confidence. The weaker link is in popular presentations, which often call Hegra&#x27;s tombs Thamud&#x27;s houses; they are Nabataean tombs. Conversely, some sceptical accounts treat the Quranic Thamud as legend, which ignores how well the people are attested outside the Quran.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>The annals of the Assyrian king Sargon II list the Tamudi among Arab groups he claims to have subdued around 715 BCE, describing desert dwellers who knew neither overseers nor officials.<small>Eph&#x27;al 1982</small></li><li>Greek and Roman writers from Agatharchides (2nd century BCE) and Diodorus to Pliny and Ptolemy place the Thamudeni in northwest Arabia, near the Red Sea coast and inland.<small>Retsö 2003</small></li><li>At Ruwafa, in the 160s CE, a Greek and Nabataean bilingual inscription records a temple built by the Thamud of Robathu, dedicated to the emperors Marcus Aurelius and Lucius Verus.<small>Bowersock 1975</small></li><li>The Notitia Dignitatum, a Roman list of offices and units from about 400 CE, includes cavalry units of Thamudeni, one in Egypt and one in Palestine.<small>Notitia Dignitatum</small></li><li>Hegra has 111 monumental tombs, 94 of them decorated, cut into sandstone outcrops by the Nabataeans, with dated inscriptions from about 1 BCE to 75 CE and some 50 earlier, pre-Nabataean inscriptions.<small>UNESCO World Heritage listing 1293</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether Thamud lived at Hegra before the Nabataeans. The monumental tombs are Nabataean, but earlier inscriptions show people were there before them.</li><li>&#x27;Thamudic&#x27; is a modern label for some 15,000 Ancient North Arabian inscriptions; the name does not show that the Thamud tribe wrote them.</li><li>Whether the Quran&#x27;s &#x27;houses carved from mountains&#x27; refers to Hegra&#x27;s facades (which are tombs), to earlier dwellings, or to the rock-cut architecture of the region as a whole.</li><li>What the Quran&#x27;s &#x27;earthquake&#x27; and &#x27;blast&#x27; correspond to physically; the region has volcanic fields and active faults, but no dated event has been tied to Thamud.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Thamud&#x27;s own settlements have hardly been identified, and much of northwest Arabia was barely excavated before the AlUla programmes of the 2000s and 2010s.</li><li>Any early Thamudic phase at Hegra would lie beneath Nabataean, Roman and later layers, most of which remain unexcavated.</li></ul></div></div><h3 class="sub-h wsub">How the traditions tell it</h3><div class="v4texts"><blockquote class="quote v4q"><span class="v4q-t">Quran · 7:73–74</span><p>To the people of Thamud We sent their brother, Salih. He said, &#x27;My people, serve God: you have no god other than Him. A clear sign has come to you now from your Lord: this is God&#x27;s she-camel- a sign for you- so let her graze in God&#x27;s land and do not harm her in any way, or you will be struck by a painful torment. Remember how He made you heirs after &#x27;Ad and settled you in the land to build yourselves castles on its plains and carve houses out of the mountains</p><cite>trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Quran · 7:77–78</span><p>and then they hamstrung the camel. They defied their Lord&#x27;s commandment and said, &#x27;Salih, bring down the punishment you threaten, if you really are a messenger!&#x27; An earthquake seized them: by the next morning they were lying dead in their homes.</p><cite>trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Quran · 15:80–83</span><p>The people of al-Hijr also rejected Our messengers: We gave them Our signs, but they turned their backs. They carved out dwellings in the mountains, and lived in security- the blast overwhelmed them early in the morning.</p><cite>trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Quran · 26:146–149</span><p>[Do you think] you will be left secure for ever in what you have here- gardens, springs, fields, palm trees laden with fruit- carving your fine houses from the mountains?</p><cite>trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Quran · 91:11–14</span><p>In their arrogant cruelty, the people of Thamud called [their messenger] a liar, when the most wicked man among them rose [against him]. The messenger of God said to them, &#x27;[Leave] God&#x27;s camel to drink,&#x27; but they called him a liar and hamstrung her. Their Lord destroyed them for their crime and levelled them.</p><cite>trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote></div><h3 class="sub-h wsub">In the text's own words</h3><p class="rd-rule">Each line rates only what the text itself says, not later dates, commentaries or modern identifications.</p><ul class="rds"><li class="rd"><p class="rd-s">A people called Thamud lived in northwest Arabia and carved homes from the mountains at al-Hijr (Quran 7:74; 15:80–82; 26:149).</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">Thamud appear in an inscription of the Assyrian king Sargon II (715 BCE), in Classical geographers and in a 2nd-century CE temple at Ruwafa. Rock-cut façades crowd the cliffs of al-Hijr (Hegra). The tombs we see today are Nabataean, but the text does not say which carvings it means.</p></li><li class="rd"><p class="rd-s">They were destroyed suddenly, by an earthquake and a blast, early one morning (Quran 7:78; 15:83).</p><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span><p class="rd-n">No destruction layer at al-Hijr has yet been tied to Thamud, and most of the pre-Nabataean town remains unexcavated. The region is seismically active.</p></li></ul><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Historians regard Thamud as one of the best-attested peoples of ancient Arabia, a tribe or confederation named in Assyrian, Greek, Latin and Nabataean sources for well over a thousand years. The spectacular facades of Hegra, however, are Nabataean tombs of the 1st century BCE and 1st century CE, built by the same kingdom that carved Petra. The Islamic-era name Mada&#x27;in Salih, the cities of Salih, reflects the tradition that identified al-Hijr with Thamud; archaeology has not yet shown a distinct Thamudic town there.</p><ul><li>Thamud appear in the record from about 715 BCE and are still serving in Roman cavalry around 400 CE.</li><li>Hegra&#x27;s dated tomb inscriptions name Nabataean owners and fall between about 1 BCE and 75 CE.</li><li>Pre-Nabataean inscriptions at Hegra show earlier inhabitants, but do not name them as Thamud.</li><li>The &#x27;Thamudic&#x27; script label is a convention, not proof of Thamud authorship.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>In this reading, the Quran preserves a real memory. Thamud lived in the rocky country of al-Hijr, grew rich on gardens, springs and palms, and cut dwellings into the mountains. They rejected Salih and were destroyed by an earthquake and a terrible blast, leaving their carved places empty. Later peoples, including the Nabataeans, built on and among their remains, which is why the site kept the name of Salih. The independent attestations of Thamud in exactly this region give the account a firm historical anchor.</p><ul><li>Thamud are attested in northwest Arabia, the region where tradition places al-Hijr, by several independent outside sources.</li><li>Hegra preserves pre-Nabataean inscriptions and earlier activity beneath the famous tombs.</li><li>The region is volcanic and seismically active, so an earthquake is a physically plausible end for a settlement.</li></ul><div class="face-s"><b>Its strongest point</b><p>Thamud are independently attested in the very region the Quran implies, by Assyrian, Greek, Roman and Nabataean sources across more than a thousand years, and Hegra has pre-Nabataean inscriptions beneath its famous tombs.</p></div><p class="face-cr"><b>Credit</b> The traditional reading of Muslim historians and commentators such as al-Tabari, and modern readers who see the Quranic account as regional history</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Excavation of pre-Nabataean layers at Hegra and in the AlUla valley that yields inscriptions naming Thamud.</li><li>A dated seismic or volcanic destruction layer at an early settlement in the Hijr area.</li><li>Systematic study of the &#x27;Thamudic&#x27; inscriptions near Hegra to see whether any writers identify themselves as Thamud.</li><li>Survey of early rock-cut dwellings, as opposed to tombs, around al-Hijr.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,070 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of Thamud, Salih and the Houses Carved in Mountains"><button type="button" class="wtoc-i" data-go="thamud-hegra-s1">Cliffs like ships in a sea of sand</button><button type="button" class="wtoc-i" data-go="thamud-hegra-s2">Salih and the she-camel</button><button type="button" class="wtoc-i" data-go="thamud-hegra-s3">A people in the Assyrian annals</button><button type="button" class="wtoc-i" data-go="thamud-hegra-s4">Who carved Hegra&#x27;s facades?</button><button type="button" class="wtoc-i" data-go="thamud-hegra-s5">Tombs, houses and memory</button><button type="button" class="wtoc-i" data-go="thamud-hegra-s6">What would settle it</button></nav></div><section class="wsec" id="thamud-hegra-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Cliffs like ships in a sea of sand</h3><p>Drive north from AlUla at sunrise and the sandstone outcrops of Hegra rise from the plain like beached ships. Carved into their flanks are facades: doorways framed by pilasters, heavy cornices, and above them the stepped crowns that look like staircases to nowhere. The largest, Qasr al-Farid, the Lonely Castle, stands alone in a single boulder, its lower part never finished.</p><p>For Muslims, this place has another name. It is al-Hijr, remembered in the Quran as the home of the people of Thamud, and it has long been called Mada&#x27;in Salih, the cities of Salih, after the prophet sent to them. The Quran speaks of them in many places, among the &#x27;people of old&#x27; whose ruins still stood.</p><blockquote class="quote"><p>and the Thamud, who hewed into the rocks in the valley,</p><cite>Quran 89:9, trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><p>So who were Thamud, and did they carve these rocks? Unusually for a people in a sacred story, we can follow them through other records for more than a thousand years.</p></section><section class="wsec" id="thamud-hegra-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Salih and the she-camel</h3><p>The Quran tells the story from several angles. Thamud were heirs to the power of ʿĀd, settled in a land of gardens, springs and palms, building castles on the plains and carving houses from the mountains. God sent them Salih, one of their own, with a sign: a she-camel that must be left to graze and drink in peace. The powerful mocked him. The most wicked among them hamstrung the camel, and they dared Salih to bring on the punishment.</p><blockquote class="quote"><p>and then they hamstrung the camel. They defied their Lord&#x27;s commandment and said, &#x27;Salih, bring down the punishment you threaten, if you really are a messenger!&#x27; An earthquake seized them: by the next morning they were lying dead in their homes.</p><cite>Quran 7:77–78, trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><p>Other passages speak of a blast that overwhelmed them early in the morning (15:83). The account is a moral one, about security that breeds arrogance and a community that turns on a sign of mercy. But it is also rooted in a particular landscape of rock-cut dwellings, oases and a named place, al-Hijr. That is where history can listen in.</p><blockquote class="wpull"><p>Few peoples in any sacred story can be followed through outside records for more than a thousand years. Thamud can.</p></blockquote></section><section class="wsec" id="thamud-hegra-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>A people in the Assyrian annals</h3><p>The first outside witness is an enemy. Around 715 BCE the Assyrian king Sargon II boasted in his annals of defeating distant Arab groups, among them the Tamudi, whom he described as desert people who knew neither overseers nor officials. Six centuries later, the Greek geographer Agatharchides described the Thamud along the Red Sea coast south of the Gulf of Aqaba, and Diodorus, Pliny and Ptolemy all place Thamudeni in northwest Arabia.</p><p>The most remarkable witness is a building. At Ruwafa, in the desert north-west of Hegra, a small temple carries a bilingual inscription in Greek and Nabataean Aramaic from the 160s CE. It records that the Thamud of Robathu built the shrine in honour of the emperors Marcus Aurelius and Lucius Verus, with the support of the Roman governor. Two centuries later, the Notitia Dignitatum lists cavalry units of Thamudeni serving the empire in Egypt and Palestine.</p><p>Here the Quran&#x27;s account fits the evidence warmly and specifically. It places Thamud after ʿĀd, in northwest Arabia, as a settled people of oases and rock. The outside sources agree on the people, the region and their long presence. Whatever one believes about their end, Thamud were not a legend.</p></section><section class="wsec" id="thamud-hegra-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Who carved Hegra&#x27;s facades?</h3><p>Hegra&#x27;s great facades were carved by the Nabataeans, the Arab kingdom whose capital was Petra, about 450 km to the north-north-west. Hegra was their southern city on the incense road. UNESCO counts 111 monumental tombs, 94 of them decorated, and many carry an inscribed panel above the door naming the owner, the year of the reigning king, and curses on anyone who reuses the tomb without permission. The dates run from about 1 BCE to 75 CE.</p><figure class="wx wx--static" id="thamud-hegra-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Anatomy of a Hegra tomb</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role x="76" y="262" width="218" height="10"/><rect class="wx-stone3 wx-edge wx-pop" style="--d:4" x="74" y="290" width="222" height="12"/><rect class="wx-stone wx-edge wx-pop" style="--d:3" x="82" y="302" width="18" height="168"/><rect class="wx-stone3 wx-edge wx-pop" style="--d:3" x="79" y="302" width="24" height="10"/><rect class="wx-stone wx-edge wx-pop" style="--d:3" x="270" y="302" width="18" height="168"/><rect class="wx-stone3 wx-edge wx-pop" style="--d:3" x="267" y="302" width="24" height="10"/><rect class="wx-stone3 wx-edge" x="160" y="392" width="50" height="78"/><rect class="wx-line" x="152" y="388" width="66" height="82"/><polygon class="wx-stone3 wx-edge wx-pop" style="--d:6" points="148,386 185,360 222,386"/><rect class="wx-stone wx-edge wx-pop" style="--d:7" x="150" y="322" width="70" height="28"/><line class="wx-thin" x1="158" y1="330" x2="212" y2="330"/><line class="wx-thin" x1="158" y1="337" x2="212" y2="337"/><line class="wx-thin" x1="158" y1="344" x2="212" y2="344"/><g><circle class="wx-inkfill" cx="250" cy="431.5" r="5.7"/><path class="wx-line" d="M250,437.3 L250,450.1 M250,450.1 L244.7,470 M250,450.1 L255.3,470 M242.9,439.9 L257.1,439.9"/></g><line class="wx-bold" x1="20" y1="470" x2="700" y2="470"/><line class="wx-thin wx-pop" style="--d:8" x1="135" y1="176" x2="135" y2="184"/><text class="wx-t-s wx-halo wx-pop" style="--d:8" x="135" y="170" text-anchor="middle">'crow-step' crown</text><line class="wx-thin" x1="296" y1="296" x2="318" y2="296"/><text class="wx-t-s wx-pop" style="--d:8" x="322" y="300">cornices</text><line class="wx-thin" x1="220" y1="336" x2="318" y2="336"/><text class="wx-t-s wx-pop" style="--d:9" x="322" y="340">inscription:</text><text class="wx-t-s wx-pop" style="--d:9" x="322" y="353">owner, date, curse</text><line class="wx-thin" x1="283" y1="420" x2="318" y2="420"/><text class="wx-t-s wx-pop" style="--d:9" x="322" y="424">pilaster</text><line class="wx-hl wx-draw" style="--d:10" pathLength="1" x1="58" y1="138" x2="58" y2="300" marker-end="url(#thamud-hegra-f1-ah)"/><text class="wx-t-s wx-halo" x="66" y="128">carved from the top down</text><path class="wx-sand wx-edge-soft" d="M440,470 L440,196 C500,160 600,150 700,160 L700,470 Z"/><rect class="wx-stone2 wx-edge" x="432" y="226" width="8" height="244"/><rect class="wx-stone3 wx-edge" x="428" y="226" width="12" height="8"/><rect class="wx-stone3 wx-edge" x="428" y="290" width="12" height="10"/><g class="wx-growx" style="--d:3"><rect class="wx-paper wx-edge" x="440" y="380" width="190" height="90"/></g><rect class="wx-line" x="440" y="392" width="0.1" height="78"/><rect class="wx-paper wx-edge wx-pop" style="--d:6" x="630" y="390" width="34" height="26"/><rect class="wx-paper wx-edge wx-pop" style="--d:6" x="630" y="428" width="34" height="26"/><rect class="wx-paper wx-edge wx-pop" style="--d:7" x="470" y="470" width="40" height="18"/><rect class="wx-paper wx-edge wx-pop" style="--d:7" x="540" y="470" width="40" height="18"/><rect class="wx-soil wx-o60" x="420" y="470" width="280" height="40"/><rect class="wx-paper wx-edge" x="470" y="470" width="40" height="18"/><rect class="wx-paper wx-edge" x="540" y="470" width="40" height="18"/><text class="wx-t-s wx-halo wx-pop" style="--d:8" x="535" y="372" text-anchor="middle">burial chamber cut into the rock</text><text class="wx-t-s wx-halo wx-pop" style="--d:9" x="700" y="380" text-anchor="end">wall niches</text><line class="wx-thin" x1="664" y1="412" x2="690" y2="388"/><text class="wx-t-s wx-pop" style="--d:9" x="610" y="504">floor graves</text><line class="wx-thin" x1="582" y1="482" x2="608" y2="500"/><text class="wx-t-s wx-halo" x="452" y="214">façade</text><g><circle class="wx-inkfill" cx="470" cy="431.5" r="5.7"/><path class="wx-line" d="M470,437.3 L470,450.1 M470,450.1 L464.7,470 M470,450.1 L475.3,470 M462.9,439.9 L477.1,439.9"/></g><line class="wx-bold" x1="80" y1="500" x2="210" y2="500"/><line class="wx-line" x1="80" y1="494" x2="80" y2="506"/><line class="wx-line" x1="210" y1="494" x2="210" y2="506"/><text class="wx-t-s" x="145" y="522" text-anchor="middle">5 m</text><text class="wx-t-s" x="230" y="522">person 1.7 m</text><text class="wx-t-s" x="700" y="534" text-anchor="end">Tallest façades c. 16 m; chambers vary. Dated inscriptions c. 1 BCE–75 CE.</text></svg></div></div><figcaption>A typical large Nabataean facade at Hegra, front and cut-through, with a person and a 5 m scale bar. The facades are tombs: the rooms behind them held the dead. <span class="wx-src">Based on: UNESCO World Heritage listing 1293 (tomb counts, dating); Nehmé 2015 (facade types, inscriptions, chamber layouts). Representative facade, proportions simplified; tallest facades reach about 16 m.</span></figcaption><p class="vh">On the left, the front of a rock-cut tomb carved into a sandstone outcrop: a smooth facade about 11 metres tall crowned by two stepped merlons, the crow-step motif, above two cornices, with corner pilasters, a doorway topped by a triangular pediment, and an inscription panel above it. An arrow down the left edge notes that the facade was carved from the top down. A person 1.7 metres tall stands beside it. On the right, a cut-through of the same tomb shows the thin carved facade on the cliff face and a burial chamber cut into the rock behind the door, with niches cut into the back wall and graves cut into the floor. A 5 metre scale bar is shown.</p></figure><p>The unfinished facades show how they were made: the masons started at the top and worked down, cutting the stepped crown first and the doorway last. Behind the door is a chamber cut into the rock, with niches in the walls and graves in the floor. These are houses for the dead, not the living. Rome annexed the Nabataean kingdom in 106 CE, and a Latin inscription of 175–177 CE calls the place civitas Hegrenorum, the city of the Hegrans.</p><aside class="wcall"><b>How do we know?</b><p>The tombs date themselves. Nabataean inscriptions over many doorways give the year of the reigning king, such as Aretas IV, which can be converted to our calendar. Some 50 older inscriptions, in scripts such as Lihyanite (Dadanitic) and so-called Thamudic, show that people wrote on these rocks before the Nabataeans arrived.</p></aside></section><section class="wsec" id="thamud-hegra-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Tombs, houses and memory</h3><p>So are Hegra&#x27;s facades Thamud&#x27;s houses? Not in the strict sense: they are Nabataean tombs. But the question is subtler than a simple no. The Quran speaks of Thamud carving homes in the mountains of al-Hijr, and people were living and writing at Hegra before the Nabataeans. Most of the site&#x27;s settlement area, and its earlier layers, remain unexcavated. A Thamudic phase at Hegra has not been demonstrated; it has not been ruled out either.</p><p>A related caution applies to the word Thamudic. Scholars use it for about 15,000 short inscriptions in Ancient North Arabian scripts scattered across the peninsula. It is a convenient label, not evidence that the Thamud tribe wrote them. Muslim tradition, for its part, kept the site&#x27;s identity with Salih vivid: it records that when the Prophet&#x27;s army passed al-Hijr on the way to Tabuk around 630 CE, he told his companions to pass quickly, as by a place of warning.</p><p>What of the earthquake and the blast? The Hijaz sits beside the Red Sea rift, with vast lava fields called harrats. In 2009 a swarm of tens of thousands of earthquakes at Harrat Lunayyir, less than 200 km south of Hegra, forced the evacuation of some 40,000 people. A seismic end to a settlement in this region is physically plausible. No dated destruction layer has yet been tied to Thamud.</p></section><section class="wsec" id="thamud-hegra-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What would settle it</h3><p>The best hope lies in the excavations now underway across the AlUla valley and at Hegra itself, where French and Saudi teams have been working since the early 2000s. An inscription from an early layer naming Thamud, or a dated destruction horizon at a pre-Nabataean settlement, would bring the Quranic account and the archaeology into direct contact. So would a careful study of the &#x27;Thamudic&#x27; texts around Hegra to see whether any writer calls himself a man of Thamud.</p><p>Until then, the verdict can be warm without claiming too much. The people of the story are real and well attested, in the right land and over the right centuries. The famous facades belong to their Nabataean neighbours and successors. And the rocks of al-Hijr still keep some of their secrets.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">715 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Sargon II lists the Tamudi</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">150 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Agatharchides describes the Thamud coast</span></li><li class="wtl-build" style="--i:2"><span class="wtl-y">1 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Earliest dated Nabataean tombs at Hegra</span></li><li class="wtl-build" style="--i:3"><span class="wtl-y">75 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Latest dated tomb inscriptions</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">106 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Rome annexes the Nabataean kingdom</span></li><li class="wtl-build" style="--i:5"><span class="wtl-y">166 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Thamud temple at Ruwafa for two emperors</span></li><li class="wtl-event" style="--i:6"><span class="wtl-y">400 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Thamudene cavalry in the Notitia Dignitatum</span></li><li class="wtl-event" style="--i:7"><span class="wtl-y">630 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Tradition: the Prophet passes al-Hijr on the way to Tabuk</span></li><li class="wtl-event" style="--i:8"><span class="wtl-y">2008 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Hegra becomes Saudi Arabia&#x27;s first World Heritage Site</span></li></ol><details class="srcs"><summary>Sources for this case (10)</summary><ol><li>Abdel Haleem M.A.S. (trans.) (2004). The Qur&#x27;an: A New Translation. Oxford University Press.</li><li>Eph&#x27;al I. (1982). The Ancient Arabs: Nomads on the Borders of the Fertile Crescent, 9th–5th Centuries B.C. Jerusalem: Magnes Press.</li><li>Retsö J. (2003). The Arabs in Antiquity: Their History from the Assyrians to the Umayyads. London: RoutledgeCurzon.</li><li>Bowersock G.W. (1975). The Greek-Nabataean bilingual inscription at Ruwwāfa, Saudi Arabia. In Le monde grec: Hommages à Claire Préaux. Brussels.</li><li>UNESCO World Heritage Centre. Hegra Archaeological Site (al-Hijr / Mada&#x27;in Salih), listing 1293, inscribed 2008.</li><li>Nehmé L. (2015). Atlas archéologique et épigraphique de Hégra (Madâ&#x27;in Sâlih). Paris: Académie des Inscriptions et Belles-Lettres.</li><li>Macdonald M.C.A. (2004). Ancient North Arabian. In Woodard R.D. (ed.), The Cambridge Encyclopedia of the World&#x27;s Ancient Languages. Cambridge University Press.</li><li>Healey J.F. (1993). The Nabataean Tomb Inscriptions of Mada&#x27;in Salih. Oxford: Oxford University Press (Journal of Semitic Studies Supplement 1).</li><li>Pallister J.S. et al. (2010). Broad accommodation of rift-related extension recorded by dyke intrusion in Saudi Arabia. Nature Geoscience 3: 705–712. <a href="https://doi.org/10.1038/ngeo966" target="_blank" rel="noopener">doi:10.1038/ngeo966</a></li><li>Notitia Dignitatum (c. 400 CE), Oriens sections on Egypt and Palestine.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-thamud-hegra" data-t="Thamud, Salih and the Houses Carved in Mountains"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Thamud, Salih and the Houses Carved in Mountains</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-thamud-hegra</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-sodom-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Tall el-Hammam overlooking the Jordan Valley 2007.jpg" data-cap="Tall el-Hammam above the Jordan Valley" data-big><figcaption></figcaption></figure><div class="sh-k">Peoples of the Sacred Texts</div><h2 class="sh-t" id="case-sodom-st" tabindex="-1">Sodom, the People of Lut, and a Comet Paper That Fell</h2><p class="sh-s">Genesis and the Quran both remember towns overturned by fire and stones near the Dead Sea. A 2021 airburst paper claimed to have found the cause, and was retracted in 2025.</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> A cosmic airburst destroyed Tall el-Hammam around 1650 BCE, and that event lies behind the story of Sodom.</p><p class="sh-claim"><b>The text's own words:</b> <span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span> <span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span> <span class="sh-more">(line by line below)</span></p></div><p class="v4-q">Did an earthquake, a fire from the sky or something else destroy a real Sodom?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Genesis and the Quran both remember towns overturned by fire and stones near the Dead Sea.</li><li>Real Bronze Age towns around the lake were destroyed or abandoned, some violently, and the rift makes earthquakes, bitumen and salt.</li><li>A 2021 paper said a comet airburst destroyed Tall el-Hammam around 1650 BCE.</li><li>Independent analysis found no signs of impact in its minerals, and the journal retracted the paper in 2025.</li><li>Which town was Sodom is open; the airburst is awaiting evidence; the account itself is not what is rated.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Geology</span><span class="thr">Texts and scripts</span><span class="thr">Religion and myth</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="36" >36</b><span class="ctr-u"> ha</span></div><div class="ctr-l">area of the Tall el-Hammam mound</div><div class="ctr-c">Collins and Scott 2013</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="430" >430</b><span class="ctr-u"> m</span></div><div class="ctr-l">below sea level: the Dead Sea&#x27;s surface</div><div class="ctr-c">Neev and Emery 1995</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="20000" >20,000</b><span class="ctr-u"> tombs</span></div><div class="ctr-l">estimated shaft tombs in Bab edh-Dhra&#x27;s cemeteries</div><div class="ctr-c">Rast and Schaub 2003</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="11" >11</b><span class="ctr-u"> authors</span></div><div class="ctr-l">of the 2021 paper disagreed with its retraction</div><div class="ctr-c">Retraction Note 2025</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>A cosmic airburst destroyed Tall el-Hammam around 1650 BCE, and that event lies behind the story of Sodom.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The city and its destruction are real. The airburst is not supported by the evidence as published: independent analysis found no mineralogical or geochemical signs of impact, image problems were flagged, and the journal retracted the paper in 2025, citing errors in method and interpretation and an overstated Tunguska comparison. Its authors disagree and continue to defend the idea, so it is not strictly ruled out. The identification of Tall el-Hammam as Sodom is a separate, open question.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Standard works present Sodom confidently as legend with no identified site, and on the site question that caution is justified. They are sometimes too quick to treat the story as pure invention: the region really did have destroyed Bronze Age towns, earthquakes and burning bitumen. On the airburst, the retraction shows the peer-review system catching an overconfident claim.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Tall el-Hammam is a large Bronze Age mound of about 36 ha in the Jordan Valley, 12.6 km north-east of the Dead Sea, excavated from 2005 by Steven Collins&#x27;s team; it has a Middle Bronze Age destruction layer.<small>Bunch et al. 2021 (retracted); Collins and Scott 2013</small></li><li>Bunch and colleagues (2021) proposed that a Tunguska-sized airburst destroyed the city around 1650 BCE. Jaret and Harris (2022) found no mineralogical or geochemical evidence of impact, and Scientific Reports retracted the paper on 24 April 2025.<small>Jaret and Harris 2022; Retraction Note 2025</small></li><li>Bab edh-Dhra, a walled Early Bronze Age town beside the Lisan peninsula, was occupied from about 3000 BCE and abandoned about 2350 BCE; its cemeteries hold an estimated 20,000 shaft tombs. Nearby Numeira ended in fire earlier.<small>Rast and Schaub 2003</small></li><li>The Dead Sea lies in an active rift: its surface is about 430 m below sea level, its faults produce damaging earthquakes, and its rocks and waters yield bitumen, sulphur and salt, including the salt ridge of Mount Sodom.<small>Neev and Emery 1995</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Where Sodom stood: in the north, in the &#x27;plain of the Jordan&#x27; where Tall el-Hammam lies, or in the south near the Lisan and Mount Sodom, where Bab edh-Dhra and Numeira lie and where later tradition placed it.</li><li>When: the southern towns ended around 2600–2350 BCE, Tall el-Hammam&#x27;s destruction is dated to about 1650 BCE, and the texts give no fixed date.</li><li>How: earthquake and fire, ground liquefaction (Harris and Beardow 1995), burning bitumen, war, or an airburst. Eleven of the retracted paper&#x27;s authors disagreed with the retraction.</li><li>Whether the story is chiefly a memory of destroyed towns or an explanation of an eerie, salt-bound landscape, or both.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Tall el-Hammam&#x27;s excavations are mostly published as preliminary reports; a full stratigraphic publication is still lacking.</li><li>The Dead Sea&#x27;s southern basin and shores have been transformed by the lake&#x27;s fall and by industrial evaporation ponds, and sites on the old shoreline may be submerged, buried or destroyed.</li><li>No inscription naming Sodom or Gomorrah has been found at any candidate site.</li></ul></div></div><h3 class="sub-h wsub">How the traditions tell it</h3><div class="v4texts"><blockquote class="quote v4q"><span class="v4q-t">Hebrew Bible · Genesis 19:24–26</span><p>Then the Lord rained on Sodom and Gomorrah sulphur and fire from the Lord out of heaven; and he overthrew those cities, and all the Plain, and all the inhabitants of the cities, and what grew on the ground. But Lot&#x27;s wife, behind him, looked back, and she became a pillar of salt.</p><cite>NRSV, Anglicised edition</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Quran · 11:81–83</span><p>Leave with your household in the dead of night, and let none of you turn back. Only your wife will suffer the fate that befalls the others. Their appointed time is the morning: is the morning not near?&#x27; And so when what We had ordained came about, We turned their town upside down and rained down stones of baked clay on it, layer upon layer, marked from your Lord. It is not far from the evildoers.</p><cite>trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Quran · 15:73–76</span><p>and the blast overtook them at sunrise: We turned their city upside down and rained on them a shower of clay stones. There truly is a sign in this for those who can learn- it is still there on the highway-</p><cite>trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote></div><h3 class="sub-h wsub">In the text's own words</h3><p class="rd-rule">Each line rates only what the text itself says, not later dates, commentaries or modern identifications.</p><ul class="rds"><li class="rd"><p class="rd-s">The towns of Lot&#x27;s people were overturned and rained on with stones of baked clay, at sunrise (Quran 11:82; 15:73–74; Genesis 19:24–25).</p><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span><p class="rd-n">Several Bronze Age sites near the Dead Sea were destroyed, including Bab edh-Dhra, Numeira and Tall el-Hammam. The airburst paper on Tall el-Hammam was retracted in 2025, and none of the sites is yet securely identified with the story.</p></li><li class="rd"><p class="rd-s">Their ruins lie on a road still travelled (Quran 15:76).</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">The candidate sites lie on or near the ancient routes around the Dead Sea, but until one is identified this remains open.</p></li></ul><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Archaeologists recognise real Bronze Age towns around the Dead Sea that were destroyed or abandoned, some violently, at various dates. Most read the Sodom tradition as a story that explains an extraordinary landscape, perhaps drawing on memories of ruined towns, earthquakes and burning bitumen. No site has been securely identified as Sodom. The airburst hypothesis for Tall el-Hammam lost its central peer-reviewed paper in 2025, after critics showed its mineral evidence did not indicate an impact.</p><ul><li>The rift&#x27;s earthquakes, bitumen, sulphur and salt give natural models for fire, overturning and pillars of salt.</li><li>Destruction layers in the region have ordinary explanations such as war, earthquake and accidental fire.</li><li>The candidate towns differ in date by over a thousand years, so the text cannot pin down one site.</li><li>Melted surfaces and shocked quartz claimed at Tall el-Hammam did not stand up to independent analysis.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Collins argues that Tall el-Hammam, the largest Bronze Age city in the southern Jordan Valley, fits Genesis&#x27;s geography: Lot chose the well-watered plain of the Jordan, visible from the hills near Bethel. The city was destroyed around 1650 BCE and the area then stood largely empty for centuries. Bunch, West, Kennett and colleagues reported melted pottery and mudbrick, tiny spherules, shocked quartz and high salt levels, and proposed that a cosmic airburst, like the one that flattened Siberian forest at Tunguska in 1908, burned the city in an instant: fire and sulphur from heaven.</p><ul><li>The northern Dead Sea plain fits the Genesis description of the &#x27;plain of the Jordan&#x27;.</li><li>Tall el-Hammam was a major city with a violent end followed by a long gap in occupation.</li><li>The authors reported high-temperature melt features and impact markers in the destruction layer.</li></ul><div class="face-s"><b>Its strongest point</b><p>Genesis places Lot&#x27;s cities in the well-watered plain of the Jordan that he saw from the hills near Bethel, which fits the northern Dead Sea basin, where Tall el-Hammam, the valley&#x27;s largest Bronze Age city, ends in a violent destruction.</p></div><p class="face-cr"><b>Credit</b> Steven Collins (Tall el-Hammam excavation); Ted Bunch, Allen West, James Kennett and colleagues of the Comet Research Group</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Full publication of Tall el-Hammam&#x27;s stratigraphy, with independent dating of the destruction layer.</li><li>Independent laboratories testing the claimed melt and shocked quartz against controls from ordinary building fires.</li><li>Regional surveys looking for the same destruction markers at other Jordan Valley sites of the same date, which an airburst would require.</li><li>An inscription naming Sodom, Gomorrah or Zoar at any candidate site.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,087 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of Sodom, the People of Lut, and a Comet Paper That Fell"><button type="button" class="wtoc-i" data-go="sodom-s1">Smoke like a furnace</button><button type="button" class="wtoc-i" data-go="sodom-s2">The story in both texts</button><button type="button" class="wtoc-i" data-go="sodom-s3">A landscape made for the story</button><button type="button" class="wtoc-i" data-go="sodom-s4">The southern towns</button><button type="button" class="wtoc-i" data-go="sodom-s5">The airburst, and its fall</button><button type="button" class="wtoc-i" data-go="sodom-s6">What time hides, and what would settle it</button></nav></div><section class="wsec" id="sodom-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Smoke like a furnace</h3><p>On the south-western shore of the Dead Sea, a ridge of almost pure rock salt about 11 km long rises from the lowest land on Earth. Rain carves its flanks into columns and fins, and one of them has long been pointed out to travellers as Lot&#x27;s wife. The air smells faintly of sulphur. Lumps of black bitumen once floated up from the lake, which the Greeks and Romans called Asphaltites.</p><p>No landscape on Earth seems more made for a story of divine fire. And the story is one of the most famous ever told.</p><blockquote class="quote"><p>Then the Lord rained on Sodom and Gomorrah sulphur and fire from the Lord out of heaven; and he overthrew those cities, and all the Plain, and all the inhabitants of the cities, and what grew on the ground. But Lot&#x27;s wife, behind him, looked back, and she became a pillar of salt.</p><cite>Genesis 19:24–26, NRSV (Anglicised edition)</cite></blockquote><p>Where were those cities, and what happened to them? Archaeology has three serious candidates, a retracted comet paper, and a rift valley that still shakes.</p></section><section class="wsec" id="sodom-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The story in both texts</h3><p>In Genesis, Abraham bargains with God to spare the city if ten righteous people can be found. Two angels come to Lot&#x27;s house in Sodom, the men of the town surround it, and at dawn Lot&#x27;s family is led out. Fire and sulphur fall, the cities of the Plain are overthrown, and Abraham, looking down the next morning, sees smoke rising like the smoke of a furnace.</p><p>The Quran tells the story of Lut, as it names him, in several surahs, and its account shares the core while framing it as the fate of a people who rejected their prophet. The messengers come to Lut after visiting Ibrahim. They tell him to leave with his household in the dead of night, without turning back, and that his wife will share the fate of the others. At the appointed morning the town is turned upside down and stones of baked clay rain upon it.</p><blockquote class="quote"><p>and the blast overtook them at sunrise: We turned their city upside down and rained on them a shower of clay stones. There truly is a sign in this for those who can learn- it is still there on the highway-</p><cite>Quran 15:73–76, trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><p>That last line is striking. The Quran speaks to listeners who travelled the caravan roads between Arabia and Syria, and it tells them the ruins lie on their route. The great north-south trade roads did pass close to the Dead Sea, whose shores are dotted with ruined Bronze Age towns. It is a detail that fits the geography well.</p><blockquote class="wpull"><p>The Quran tells its first listeners that the ruins are still there, on the road they travel.</p></blockquote></section><section class="wsec" id="sodom-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>A landscape made for the story</h3><p>The Dead Sea fills a gash in the Earth&#x27;s crust where the Arabian plate slides past the African plate. Its surface lies about 430 m below sea level, and its faults have produced destructive earthquakes throughout history. The rocks hold bitumen and natural sulphur, and beneath Mount Sodom a body of salt pushes slowly upwards.</p><figure class="wx wx--static" id="sodom-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">The Dead Sea rift and its candidate cities</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The Dead Sea rift and its candidate cities"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 596" class="wx-svg" role="img" aria-labelledby="sodom-f1-t"><title id="sodom-f1-t">Map of the Dead Sea rift with the candidate sites for Sodom, Tall el-Hammam in the north and Bab edh-Dhra and Numeira in the south, beside a west to east cross-section of the rift basin</title><defs><marker id="sodom-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker><marker id="sodom-f1-ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text class="wx-t-cap" x="24" y="28">The Dead Sea rift and the candidate cities · simplified</text><rect class="wx-card wx-edge-soft" x="40" y="40" width="300" height="540"/><path class="wx-dash wx-s4 wx-draw" style="--d:1" pathLength="1" d="M102.6,44 L107.4,200 L112.1,380 L107.4,576"/><path class="wx-dash wx-s4 wx-draw" style="--d:1" pathLength="1" d="M217.3,44 L222.1,220 L217.3,400 L207.7,576"/><text class="wx-t-s wx-t-a wx-halo" x="228.1" y="300">rift fault</text><path class="wx-line wx-s2 wx-draw" style="--d:2" path .8" cy="408.4" r="3.5"/><text class="wx-t-s" x="91.8" y="412.4" text-anchor="end">Masada</text><polygon class="wx-c8 wx-o60" points="112.1,503.6 121.7,570.8 124.1,503.6"/><text class="wx-t-s wx-halo" x="46" y="500">Mount</text><text class="wx-t-s wx-halo" x="46" y="513">Sodom</text><text class="wx-t-s wx-halo" x="46" y="526">(salt)</text><line class="wx-guide" x1="64.3" y1="274" x2="274.7" y2="274"/><text class="wx-t-b" x="66.3" y="269">A</text><text class="wx-t-b" x="272.7" y="269" text-anchor="end">B</text><line class="wx-bold" x1="48" y1="230" x2="98.5" y2="230"/><text class="wx-t-s" x="73.3" y="222" text-anchor="middle">10 km</text><path class="wx-inkfill" d="M316,54 L322,72 L316,68 L310,72 Z"/><text class="wx-t-b" x="316" y="86" text-anchor="middle">N</text><text class="wx-t-b" x="370" y="70">Section A–B across the rift (vertical x c. 16)</text><path class="wx-stone wx-edge-soft wx-pop" style="--d:2" d="M380,357 L380,136 L428,149 L476,201 L492,240 L512,295.9 L636,295.9 L652,240 L664,188 L684,129.5 L700,123 L700,357 Z"/><polygon class="wx-water wx-edge-soft wx-pop" style="--d:4" points="512,295.9 636,295.9 612,334.9 540,333.6"/><polygon class="wx-soil wx-o80 wx-pop" style="--d:3" points="512,295.9 540,333.6 612,334.9 636,295.9 628,357 516,357"/><polygon class="wx-water wx-edge-soft" points="512,295.9 636,295.9 612,334.9 540,333.6"/><line class="wx-bold wx-s4 wx-draw" style="--d:5" pathLength="1" x1="504" y1="123" x2="516" y2="357"/><line class="wx-bold wx-s4 wx-draw" style="--d:5" pathLength="1" x1="648" y1="123" x2="632" y2="357"/><line class="wx-dash" x1="380" y1="240" x2="700" y2="240"/><text class="wx-t-s" x="700" y="236" text-anchor="end">sea level</text><text class="wx-t-s wx-halo" x="574" y="312.8" text-anchor="middle">brine</text><text class="wx-t-s" x="574" y="373" text-anchor="middle">deep fill of salt and mud</text><text class="wx-t-s" x="396" y="117">A: Judean hills</text><text class="wx-t-s" x="700" y="108" text-anchor="end">Moab plateau: B</text><text class="wx-t-n wx-halo" x="574" y="287.9" text-anchor="middle">c. −430 m</text><text class="wx-t-s wx-halo" x="574" y="350.9" text-anchor="middle">deepest c. −730 m</text><text class="wx-t-s wx-t-a" x="444" y="279">fault</text><text class="wx-t-s wx-t-a" x="656" y="279">fault</text><rect class="wx-card wx-edge-soft" x="370" y="436" width="330" height="140" rx="8"/><text class="wx-t-b" x="384" y="458">What the landscape offers a storyteller</text><circle class="wx-accfill wx-pop" style="--d:6" cx="390" cy="476" r="3"/><text class="wx-t-s wx-pop" style="--d:6" x="400" y="480">earthquakes along the rift faults</text><circle class="wx-accfill wx-pop" style="--d:7" cx="390" cy="496" r="3"/><text class="wx-t-s wx-pop" style="--d:7" x="400" y="500">bitumen and natural sulphur in the rocks</text><circle class="wx-accfill wx-pop" style="--d:8" cx="390" cy="516" r="3"/><text class="wx-t-s wx-pop" style="--d:8" x="400" y="520">salt pillars eroding from Mount Sodom</text><circle class="wx-accfill wx-pop" style="--d:9" cx="390" cy="536" r="3"/><text class="wx-t-s wx-pop" style="--d:9" x="400" y="540">a lifeless sea, the lowest on Earth</text><circle class="wx-accfill wx-pop" style="--d:10" cx="390" cy="556" r="3"/><text class="wx-t-s wx-pop" style="--d:10" x="400" y="560">burned Bronze Age towns on its shores</text></svg></div></div><figcaption>A simplified map of the Dead Sea with the northern candidate, Tall el-Hammam, and the southern candidates, Bab edh-Dhra and Numeira, beside a cross-section of the rift basin. <span class="wx-src">Based on: Site coordinates from excavation reports and gazetteers; lake outline simplified from modern maps; section after Neev and Emery 1995, vertical exaggeration about 16 times.</span></figcaption><p class="vh">On the left, a map of the Dead Sea area with north at the top. The Jordan river flows into the northern end of the Dead Sea. Two dashed red lines mark the rift faults on either side. Tall el-Hammam is marked north-east of the sea as the northern candidate, near Jericho on the west side. The Lisan peninsula divides the northern basin from the former southern basin, now evaporation ponds. Bab edh-Dhra and Numeira are marked on the east shore beside the Lisan as southern candidates, and Mount Sodom, a salt ridge, on the south-west. Masada is marked on the west shore. A 10 kilometre scale bar and a line A to B across the sea are shown. On the right, section A to B shows the Judean hills on the west and the Moab plateau on the east, both cut by faults that drop steeply to the Dead Sea, whose surface is about 430 metres below sea level and whose deepest point is about 730 metres below, above a deep fill of salt and mud. A box lists what the landscape offers a storyteller: earthquakes, bitumen and sulphur, salt pillars, a lifeless sea, and burned Bronze Age towns.</p></figure><p>Geologists have long noticed how many elements of the story this setting can supply. In 1995 the engineers Graham Harris and Anthony Beardow argued that an earthquake could have liquefied waterlogged ground near the southern shore, letting buildings slide and sink, a physical version of a town turned upside down. The geologists David Neev and Kenneth Emery linked the region&#x27;s earthquakes, bitumen and climate to several biblical destructions. None of this identifies a site, but it shows that earthquake, fire and salt are part of daily geology here, not mere imagery.</p></section><section class="wsec" id="sodom-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The southern towns</h3><p>For much of the 20th century, attention focused on the south, where later tradition placed Sodom and where Zoar, the town Lot fled to, was identified with the area of Safi. On a plateau beside the Lisan peninsula stands Bab edh-Dhra, a walled town of the Early Bronze Age, occupied from about 3000 BCE and abandoned around 2350 BCE. Its cemeteries are vast: excavators estimate some 20,000 shaft tombs. Paul Lapp dug there in the 1960s, and Walter Rast and Thomas Schaub excavated the town from 1975.</p><p>A few kilometres south lies Numeira, a smaller town that ended in fire earlier. Some scholars, notably the archaeologist Bryant Wood, argued that Bab edh-Dhra and Numeira were Sodom and Gomorrah. The difficulty is chronology: these towns ended many centuries before the dates usually proposed for Abraham, and Bab edh-Dhra&#x27;s final phase shows abandonment rather than a single catastrophe.</p></section><section class="wsec" id="sodom-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The airburst, and its fall</h3><p>Steven Collins of Trinity Southwest University argued instead for the north. Genesis says Lot looked out from the hills near Bethel over the well-watered plain of the Jordan and chose it, which fits the northern end of the Dead Sea better than the south. There, Tall el-Hammam is the largest Bronze Age city in the southern Jordan Valley, about 36 ha, and Collins&#x27;s team began excavating it in 2005. It ended in a violent destruction around 1650 BCE.</p><p>In 2021 a team led by Ted Bunch, with Allen West, James Kennett and others associated with the Comet Research Group, published a paper in Scientific Reports proposing that a Tunguska-sized cosmic airburst had destroyed the city. They reported melted pottery surfaces and mudbrick, tiny spherules, shocked quartz and unusual salt, and connected the event to the Sodom story. It made headlines around the world.</p><p>The criticism was swift. Image specialists, including Elisabeth Bik, flagged altered figures. In 2022 Steven Jaret and Scott Harris reported no mineralogical or geochemical evidence of impact in the paper&#x27;s own data. Mark Boslough and a colleague argued that the Tunguska comparison greatly overstated that blast&#x27;s temperatures and winds. On 24 April 2025 the journal retracted the paper, citing errors in methodology, analyses and interpretation. Eleven authors disagreed with the retraction, and the team continues to defend the idea.</p><aside class="wcall"><b>How do we know?</b><p>Shocked quartz is one of the classic impact markers: grains crossed by sets of microscopic parallel planes that form only under enormous, sudden pressure. The challenge is telling them from ordinary fractures and features formed in other ways. Jaret and Harris argued that the fractures shown in the 2021 paper did not have the diagnostic properties of shock, which is one reason the claim did not hold.</p></aside></section><section class="wsec" id="sodom-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What time hides, and what would settle it</h3><p>The Dead Sea keeps changing. Its level has fallen by tens of metres in the last century, the southern basin is now a grid of industrial evaporation ponds, and sinkholes open along its shores. Ancient sites on the old shoreline may be submerged, buried or destroyed. No inscription naming Sodom or Gomorrah has been found anywhere.</p><p>Three things would move this case. A full publication of Tall el-Hammam&#x27;s stratigraphy with independently dated destruction layers; independent laboratories testing the claimed melt and quartz against ordinary burned buildings; and regional surveys showing whether other sites of the same date share the same damage, as an airburst would require. For the southern candidates, better dating of Numeira&#x27;s fire and Bab edh-Dhra&#x27;s end would help.</p><p>Meanwhile the texts&#x27; setting fits the landscape remarkably well: a sunken plain of towns, fire and sulphur in the ground, salt pillars, and ruins beside the road. What remains unproved is which ruins, and which fire.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">3,000 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Bab edh-Dhra becomes a walled town</span></li><li class="wtl-loss" style="--i:1"><span class="wtl-y">2,600 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Numeira ends in fire</span></li><li class="wtl-loss" style="--i:2"><span class="wtl-y">2,350 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Bab edh-Dhra abandoned</span></li><li class="wtl-loss" style="--i:3"><span class="wtl-y">1,650 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Tall el-Hammam destroyed</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">1965 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Paul Lapp excavates Bab edh-Dhra&#x27;s cemetery</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1975 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Rast and Schaub excavate the town</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2005 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Tall el-Hammam excavations begin</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2021 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Airburst paper in Scientific Reports</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2022 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Jaret and Harris: no evidence of impact</span></li><li class="wtl-event" style="--i:9"><span class="wtl-y">2025 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Paper retracted on 24 April</span></li></ol><details class="srcs"><summary>Sources for this case (10)</summary><ol><li>Bunch T.E. et al. (2021). A Tunguska sized airburst destroyed Tall el-Hammam a Middle Bronze Age city in the Jordan Valley near the Dead Sea. Scientific Reports 11: 18632 (retracted 2025). <a href="https://doi.org/10.1038/s41598-021-97778-3" target="_blank" rel="noopener">doi:10.1038/s41598-021-97778-3</a></li><li>Retraction Note: A Tunguska sized airburst destroyed Tall el-Hammam a Middle Bronze Age city in the Jordan Valley near the Dead Sea (2025). Scientific Reports. <a href="https://doi.org/10.1038/s41598-025-99265-5" target="_blank" rel="noopener">doi:10.1038/s41598-025-99265-5</a></li><li>Jaret S.J., Harris R.S. (2022). No mineralogic or geochemical evidence of impact at Tall el-Hammam, a Middle Bronze Age city in the Jordan Valley near the Dead Sea. Scientific Reports 12. <a href="https://doi.org/10.1038/s41598-022-08216-x" target="_blank" rel="noopener">doi:10.1038/s41598-022-08216-x</a></li><li>Collins S., Scott L. (2013). Discovering the City of Sodom. New York: Howard Books.</li><li>Rast W.E., Schaub R.T. (2003). Bab edh-Dhra: Excavations at the Town Site (1975–1981). Winona Lake: Eisenbrauns.</li><li>Neev D., Emery K.O. (1995). The Destruction of Sodom, Gomorrah, and Jericho: Geological, Climatological, and Archaeological Background. New York: Oxford University Press.</li><li>Harris G.M., Beardow A.P. (1995). The destruction of Sodom and Gomorrah: a geotechnical perspective. Quarterly Journal of Engineering Geology 28: 349–362. <a href="https://doi.org/10.1144/GSL.QJEGH.1995.028.P4.04" target="_blank" rel="noopener">doi:10.1144/GSL.QJEGH.1995.028.P4.04</a></li><li>Boslough M., Bruno A. (2025). Critique of the Tunguska comparison in the Tall el-Hammam airburst hypothesis, cited in the Scientific Reports retraction note.</li><li>Abdel Haleem M.A.S. (trans.) (2004). The Qur&#x27;an: A New Translation. Oxford University Press.</li><li>Wood B.G. (1999). The discovery of the sin cities of Sodom and Gomorrah. Bible and Spade 12(3).</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-sodom" data-t="Sodom, the People of Lut, and a Comet Paper That Fell"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Sodom, the People of Lut, and a Comet Paper That Fell</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-sodom</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-dhul-qarnayn-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Derbent wall.jpg" data-cap="Derbent, Dagestan, Russia (Caspian Gates)" data-big><figcaption></figcaption></figure><div class="sh-k">Peoples of the Sacred Texts</div><h2 class="sh-t" id="case-dhul-qarnayn-st" tabindex="-1">Dhul-Qarnayn and the Wall Against Gog and Magog</h2><p class="sh-s">The Quran tells of a just ruler who closed a mountain gap with iron and molten metal against Gog and Magog. Who was he, and does his wall still stand?</p><div class="sh-v"><span class="vstamp vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><p class="sh-claim"><b>What the stamp rates:</b> The barrier of Dhul-Qarnayn was a real fortification in a Caucasus or Caspian pass, such as Derbent or the Darial Pass.</p><p class="sh-claim"><b>The text's own words:</b> <span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span> <span class="sh-more">(line by line below)</span></p></div><p class="v4-q">Who was Dhul-Qarnayn, and can archaeology find his barrier?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>The Quran tells of Dhul-Qarnayn, who built an iron barrier against Gog and Magog in a mountain pass.</li><li>Real walls did close the passes between the steppe and the south: Derbent on the Caspian, the 195-kilometre Gorgan wall.</li><li>Every surviving wall dates to the 5th and 6th centuries CE, and none is built of iron fused with molten metal.</li><li>Older phases may lie beneath them; nobody has dug for them.</li><li>A real barrier in a real pass is plausible; matching it to one wall is still an open question.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Texts and scripts</span><span class="thr">Religion and myth</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="3.6" data-dec="1">3.6</b><span class="ctr-u"> km</span></div><div class="ctr-l">length of Derbent&#x27;s twin walls from citadel to sea</div><div class="ctr-c">UNESCO 1070</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="40" >40</b><span class="ctr-u"> km</span></div><div class="ctr-l">Derbent&#x27;s mountain wall running west into the Caucasus</div><div class="ctr-c">UNESCO 1070</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="195" >195</b><span class="ctr-u"> km</span></div><div class="ctr-l">length of the Great Wall of Gorgan</div><div class="ctr-c">Sauer et al. 2013</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="73" >73</b><span class="ctr-u"> towers</span></div><div class="ctr-l">on Derbent&#x27;s walls, 46 of them on the north wall</div><div class="ctr-c">UNESCO 1070</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The barrier of Dhul-Qarnayn was a real fortification in a Caucasus or Caspian pass, such as Derbent or the Darial Pass.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:41.7%" role="img" aria-label="Weight of evidence: Open question"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Walls closing the passes between steppe and south were very real, and both Christian and Muslim tradition located the barrier there. But every surviving wall is a Sasanian work of the 5th–6th century CE, far later than Cyrus or Alexander, and none is built of iron fused with molten metal. Earlier phases may be hidden beneath them, and the builder&#x27;s identity remains a matter of textual, not archaeological, argument. The historical core is plausible; a specific match is still open.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Western reference works usually state flatly that Dhul-Qarnayn is Alexander and that the story derives from the Syriac legend. The Alexander link is strongly supported, but the direction and date of influence are more debated than that confidence suggests, and the long tradition of Muslim scholarship identifying a different, monotheist ruler is rarely given a fair hearing.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Late antique empires walled the gaps between the steppe and the south. At Derbent the Sasanians built two parallel walls about 3.6 km long and 300–400 m apart from the citadel to the Caspian, running 500 m into the sea, with a mountain wall continuing about 40 km west.<small>UNESCO World Heritage listing 1070</small></li><li>The Great Wall of Gorgan, east of the Caspian, runs 195 km with more than 30 forts and was dated by luminescence and radiocarbon to the late 5th or 6th century CE; in Persian it is called Sadd-i Iskandar, Alexander&#x27;s Barrier.<small>Sauer et al. 2013</small></li><li>Josephus, in the 1st century CE, gives the first surviving reference to gates built by Alexander as a barrier against the Scythians.<small>Josephus, Jewish War 7.244–251; Antiquities 18.97</small></li><li>The Syriac Alexander Legend (the Neshana), dated to the 6th or early 7th century, tells how Alexander built a gate of iron and bronze between two mountains to shut in the Huns, whose kings include Gog and Magog, and how he saw the sun set into foul waters.<small>Budge 1889; Reinink 1983; van Bladel 2008</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Who Dhul-Qarnayn was: Alexander, as many classical commentators held; an earlier righteous king, as Ibn Kathir and others argued; a South Arabian king; or Cyrus the Great, as several modern Muslim scholars propose.</li><li>How the Quranic passage relates to the Syriac legend: many Western scholars see the legend as its background, while others argue the legend is older or younger than once thought, or that both draw on wider tradition.</li><li>Which pass, if any, the barrier refers to: Derbent, the Darial Pass, a wall east of the Caspian, or a place not yet identified.</li><li>What &#x27;the two horns&#x27; means: horned royal headgear, the two ends of the world, two ages, or two realms.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>No barrier of iron blocks fused with molten metal has been found in any pass; the surviving walls are of stone, mudbrick and fired brick.</li><li>Earlier fortifications in the Caucasus passes may lie beneath the Sasanian walls, which were rebuilt many times, and many sections are unexcavated.</li><li>The Achaemenid Persian empire&#x27;s northern frontier works, if any existed in the Caucasus, are almost unknown archaeologically.</li></ul></div></div><h3 class="sub-h wsub">How the traditions tell it</h3><div class="v4texts"><blockquote class="quote v4q"><span class="v4q-t">Quran · 18:83–86</span><p>[Prophet], they ask you about Dhu &#x27;l-Qarnayn. Say, &#x27;I will tell you something about him.&#x27; We established his power in the land, and gave him the means to achieve everything. He travelled on a certain road; then, when he came to the setting of the sun, he found it [seemed to be] setting into a muddy spring.</p><cite>trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Quran · 18:93–97</span><p>then, when he reached a place between two mountain barriers, he found beside them a people who could barely understand him. They said, &#x27;Dhu &#x27;l-Qarnayn, Gog and Magog are ruining this land. Will you build a barrier between them and us if we pay you a tribute?&#x27; He answered, &#x27;The power my Lord has given me is better than any tribute, but if you lend me your strength, I will put up a fortification between you and them: bring me lumps of iron!&#x27; and then, when he had filled the gap between the two mountainsides [he said], &#x27;Work your bellows!&#x27; and then, when he had made it glow like fire, he said, &#x27;Bring me molten metal to pour over it!&#x27; Their enemies could not scale the barrier, nor could they pierce it,</p><cite>trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Quran · 18:98</span><p>and he said, &#x27;This is a mercy from my Lord. But when my Lord&#x27;s promise is fulfilled, He will raze this barrier to the ground: my Lord&#x27;s promise always comes true.&#x27;</p><cite>trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Hebrew Bible · Daniel 8:20</span><p>As for the ram that you saw with the two horns, these are the kings of Media and Persia.</p><cite>NRSV</cite></blockquote></div><h3 class="sub-h wsub">In the text's own words</h3><p class="rd-rule">Each line rates only what the text itself says, not later dates, commentaries or modern identifications.</p><ul class="rds"><li class="rd"><p class="rd-s">A ruler reached a people between two mountain barriers and built a barrier of iron blocks filled with molten copper against Gog and Magog (Quran 18:93–97).</p><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span><p class="rd-n">The walls of the Caspian passes (Derbent, Darial, Gorgan) are stone, mud brick and fired brick, built mostly in Sasanian times. A barrier of iron and copper between two mountains has not been identified. The text itself says it will be levelled when the promise comes (18:98).</p></li></ul><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Most Western historians read the Quranic passage in the setting of late antique Alexander traditions. By the 1st century CE Alexander was credited with iron gates in the Caucasus; the Syriac legend turned them into a barrier against Gog and Magog; and real fortifications such as Derbent, Darial and the Gorgan wall gave the legend a landscape. Classical Muslim scholarship largely agreed that the ruler was called al-Iskandar, though some scholars insisted he was a different, earlier monotheist. The walls that survive are 5th–6th century Sasanian works.</p><ul><li>The barrier story is attached to Alexander centuries before the Quran.</li><li>The Syriac legend shares several details with Quran 18: the sun setting in murky waters, a gate of metal between two mountains, and Gog and Magog.</li><li>The surviving walls at Derbent and Gorgan were built by the Sasanians, not by Cyrus or Alexander.</li><li>Medieval Muslim geographers themselves looked for the barrier in the Caucasus and further east.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>The Quran&#x27;s Dhul-Qarnayn is a righteous, God-fearing ruler who refuses tribute and credits God for his power. Alexander of Macedon, who was worshipped as a god in his lifetime, fits that portrait poorly, a point made by classical scholars such as Ibn Kathir. Cyrus the Great fits better: a founder of empire remembered even in the Hebrew Bible as God&#x27;s anointed, a just and tolerant king whose campaigns ran west to the Aegean, east into Central Asia and north towards the steppe. The book of Daniel pictures the kings of Media and Persia as a ram with two horns. On this view the late antique Alexander legends borrowed an older memory, not the other way round.</p><ul><li>The Quranic ruler is a monotheist, which classical scholars found hard to square with Alexander.</li><li>Daniel 8:20 already calls the Persian kingship &#x27;two-horned&#x27;.</li><li>Recent scholarship dates parts of the Syriac legend to the 6th century and debates the direction of influence.</li></ul><div class="face-s"><b>Its strongest point</b><p>The Quran&#x27;s Dhul-Qarnayn is a just monotheist, and the ancient text that most famously calls a royal power &#x27;two-horned&#x27; is Daniel 8:20, whose two-horned ram stands for the kings of Media and Persia, the empire Cyrus founded.</p></div><p class="face-cr"><b>Credit</b> Sayyid Ahmad Khan; Mawlana Abul Kalam Azad; Abul A&#x27;la Maududi (Cyrus identification); scholars who question the Syriac dependence</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Excavation beneath the Sasanian walls at Derbent and in the Darial Pass for earlier barrier phases, with firm dates.</li><li>Evidence of Achaemenid fortification works on the northern frontier, in the Caucasus or east of the Caspian.</li><li>New manuscript or epigraphic evidence that fixes the date of the Syriac Alexander Legend more securely.</li><li>Metallurgical traces (iron-reinforced or metal-cast masonry) in any ancient pass barrier.</li></ol><
