,201.2 437,202.2 417,203.2 397,204.2 377,205.2 357,206.2 337,207.2 317,208.2 297,209.2 277,210.2 257,211.2 237,212.2 217,213.2 197,214.2 177,215.2 157,216.2 137,217.2 117,218.2 97,219.2 77,220.2 57,221.2 40,222.0"/><polygon class="wx-soil wx-edge-soft" points="40,222.0 40,222.0 60,221.0 80,220.0 100,219.0 120,218.0 140,217.0 160,216.0 180,215.0 200,214.0 220,213.0 240,212.0 260,211.0 280,210.0 300,209.0 320,208.0 340,207.0 360,206.0 380,205.0 400,204.0 420,203.0 440,202.0 460,201.0 480,200.0 500,199.0 520,198.0 540,197.0 560,196.0 580,185.0 600,174.0 620,163.0 640,152.0 660,141.0 680,130.0 680,300 40,300"/><polyline class="wx-line" points="40,222.0 60,221.0 80,220.0 100,219.0 120,218.0 140,217.0 160,216.0 180,215.0 200,214.0 220,213.0 240,212.0 260,211.0 280,210.0 300,209.0 320,208.0 340,207.0 360,206.0 380,205.0 400,204.0 420,203.0 440,202.0 460,201.0 480,200.0 500,199.0 520,198.0 540,197.0 560,196.0 580,185.0 600,174.0 620,163.0 640,152.0 660,141.0 680,130.0"/><path class="wx-guide" d="M40,150 H640"/><text class="wx-t-s" x="46" y="146">calm level</text><g class="wx-st wx-hide" data-only="1"><path class="wx-dim" marker-start="url(#exodus-f2-ah)" marker-end="url(#exodus-f2-ah)" d="M180,152 V214"/><text class="wx-t-n wx-halo" x="190" y="188">about 2 m</text><text class="wx-t wx-halo" x="360" y="178">Lake of Tanis lagoon, where the</text><text class="wx-t wx-halo" x="360" y="194">Pelusiac Nile branch flowed in</text></g><g class="wx-st wx-hide" data-only="2"><path class="wx-flow wx-s2" d="M660,84 H300"/><path class="wx-flow wx-s2" d="M630,100 H270"/><path class="wx-flow wx-s2" d="M600,116 H240"/><path class="wx-line" marker-end="url(#exodus-f2-ah)" d="M300,84 H250"/><text class="wx-t-b" x="690" y="96" text-anchor="end">east wind</text><text class="wx-t-s" x="690" y="112" text-anchor="end">28 m/s, 12 h</text></g><g class="wx-st wx-hide" data-only="3"><path class="wx-flow wx-s2" d="M660,84 H300"/><path class="wx-flow wx-s2" d="M630,100 H270"/><path class="wx-flow wx-s2" d="M600,116 H240"/><path class="wx-line" marker-end="url(#exodus-f2-ah)" d="M300,84 H250"/><text class="wx-t-b" x="690" y="96" text-anchor="end">east wind</text><text class="wx-t-s" x="690" y="112" text-anchor="end">28 m/s, 12 h</text></g><g class="wx-st wx-hide" data-only="2"><text class="wx-t wx-halo" x="60" y="124">water piles up downwind</text><text class="wx-t wx-halo" x="440" y="176">level drops upwind</text></g><g class="wx-st wx-hide" data-only="3"><polyline class="wx-hl" points="336,202.2 356,201.2 376,200.2 396,199.2 416,198.2 436,197.2 456,196.2 476,195.2 496,194.2 516,193.2 536,192.2 556,191.2 560,191.0 600,169.0"/><text class="wx-t-b wx-t-a wx-halo" x="400" y="146">mud flats exposed</text><text class="wx-t wx-halo" x="400" y="162">land bridge 3–4 km long, 5 km wide,</text><text class="wx-t wx-halo" x="400" y="178">open for about 4 hours</text></g><g class="wx-st wx-hide" data-only="4"><path class="wx-hl" marker-end="url(#exodus-f2-aa)" d="M200,134 H470"/><text class="wx-t-b wx-halo" x="200" y="124">wind stops: water flows back at about 4.4 m/s</text></g><text class="wx-t-s" x="24" y="330">After the Drews and Han (2010) model. Horizontal distances compressed, depths exaggerated.</text><text class="wx-t-s" x="24" y="346">Their site: the eastern Nile Delta. A similar model applies at the Gulf of Suez (Nof and Paldor 1992).</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 4.</b> Calm: a shallow coastal lagoon about 2 m deep, where the Pelusiac branch of the Nile met the Lake of Tanis.</p><ol class="wx-steplist"><li>Calm: a shallow coastal lagoon about 2 m deep, where the Pelusiac branch of the Nile met the Lake of Tanis.</li><li>A steady east wind of 28 m/s (about 100 km/h) pushes the water west. It piles up downwind and drops upwind.</li><li>After about 9.5 hours the mud flats break the surface: a land bridge 3–4 km long and 5 km wide that stays dry for about 4 hours.</li><li>When the wind stops, the water flows back as a shallow-water wave at about 4.4 m/s, far faster than people walk.</li></ol><figcaption>Tap through the four stages of wind setdown as modelled for the ancient Lake of Tanis in the eastern Nile Delta. The drawing is schematic, with depths exaggerated. <span class="wx-src">Based on: Drews and Han 2010, PLoS ONE (model depths, wind speed, timings, land-bridge size and return speed); Nof and Paldor 1992 for the Gulf of Suez.</span></figcaption><p class="vh">A cross-section of a shallow lagoon with west on the left and east on the right. Step 1: calm water about 2 metres deep over a gently rising bed. Step 2: arrows show an east wind of 28 metres per second; the water surface tilts, piling up on the west and dropping in the east. Step 3: after about twelve hours the eastern bed is exposed as mud flats, a land bridge 3 to 4 kilometres long and 5 kilometres wide that stays dry for about 4 hours. Step 4: the wind stops and an arrow shows the water flowing back at about 4.4 metres per second.</p></figure><p>Carl Drews and Weiqing Han modelled the ancient Lake of Tanis, where the Pelusiac branch of the Nile once met a coastal lagoon. With a steady east wind of 28 m/s for 12 hours, mud flats rose above the water after about nine and a half hours: a land bridge 3–4 km long and 5 km wide, dry for about 4 hours. When the wind dropped, the water came back fast. Doron Nof and Nathan Paldor had shown in 1992 that a similar effect is possible in the Gulf of Suez. Physics allows the scene. It cannot show that it happened, or where.</p></section><section class="wsec" id="exodus-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>The body kept as a sign</h3><p>Quran 10:92 promises that Pharaoh&#x27;s body would be saved &#x27;as a sign to all posterity&#x27;. Classical commentators such as al-Tabari reported that the sea cast the drowned king up on dry ground, so that the Israelites, who doubted that he was truly dead, could see him. In the 20th century many readers connected the verse to the royal mummies of Egypt. The mummy of Ramesses II was found in 1881 in a hidden cache at Deir el-Bahari and flown to Paris in 1976 for conservation. Merneptah&#x27;s was found in 1898 in the tomb of Amenhotep II.</p><p>Here the testable part is narrow. Dozens of New Kingdom royal mummies survive, embalmed in the usual way, and published studies have not identified any one of them as a drowned king. Claims circulating online that a mummy shows sea salt or drowning are not supported by peer-reviewed work. For believers, the sign of the verse does not depend on which body it was, and the classical reading is complete without a museum at all.</p></section><section class="wsec" id="exodus-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What time hid, and what would settle it</h3><p>Time has been unkind to exactly the right places. The Delta is wet, and its papyri have rotted, so the kind of document that might mention runaway workers survives mainly from the dry south. The Pelusiac branch of the Nile has vanished under silt and farmland. Pi-Ramesses was dismantled to build Tanis. Nomads in Sinai left a few stones in a circle. The case is open because the evidence was fragile to begin with.</p><ul class="wlist"><li>A Delta text naming Israelite or Hebrew labourers, or a flight of workers, from the right centuries.</li><li>Late Bronze Age camps in Sinai that match early Israel&#x27;s material culture.</li><li>Cores from the ancient Lake of Tanis with chariot fittings or weapons in a single layer.</li><li>A firm date tying Thera, the Tempest Stela and the Hyksos expulsion together.</li></ul></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">1,550 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Ahmose I drives the Hyksos out of Avaris</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">1,446 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Exodus date implied by 1 Kings 6:1</span></li><li class="wtl-build" style="--i:2"><span class="wtl-y">1,279 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Ramesses II takes the throne; Pi-Ramesses rises</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">1,208 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Merneptah Stele: Israel already in Canaan</span></li><li class="wtl-find" style="--i:4"><span class="wtl-y">1881 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Mummy of Ramesses II found in the Deir el-Bahari cache</span></li><li class="wtl-find" style="--i:5"><span class="wtl-y">1896 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Petrie finds the Merneptah Stele at Thebes</span></li><li class="wtl-find" style="--i:6"><span class="wtl-y">1898 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Mummy of Merneptah found in tomb KV35</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2010 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Drews and Han model wind setdown in the Delta</span></li></ol><details class="srcs"><summary>Sources for this case (16)</summary><ol><li>Drews C., Han W. (2010). Dynamics of wind setdown at Suez and the Eastern Nile Delta. PLoS ONE 5(8): e12481. <a href="https://doi.org/10.1371/journal.pone.0012481" target="_blank" rel="noopener">doi:10.1371/journal.pone.0012481</a></li><li>Nof D., Paldor N. (1992). Are there oceanographic explanations for the Israelites&#x27; crossing of the Red Sea? Bulletin of the American Meteorological Society 73: 305–314. <a href="https://doi.org/10.1175/1520-0477(1992)073&lt;0305:ATOEFT&gt;2.0.CO;2" target="_blank" rel="noopener">doi:10.1175/1520-0477(1992)073&lt;0305:ATOEFT&gt;2.0.CO;2</a></li><li>Pritchard J. B. (ed.) (1969). Ancient Near Eastern Texts Relating to the Old Testament, 3rd ed. Princeton University Press (Merneptah Stele, trans. J. A. Wilson).</li><li>Finkelstein I., Silberman N. A. (2001). The Bible Unearthed. Free Press.</li><li>Hoffmeier J. K. (1997). Israel in Egypt: The Evidence for the Authenticity of the Exodus Tradition. Oxford University Press.</li><li>Hoffmeier J. K. (2005). Ancient Israel in Sinai. Oxford University Press.</li><li>Bietak M. (1996). Avaris, the Capital of the Hyksos: Recent Excavations at Tell el-Dab&#x27;a. British Museum Press.</li><li>Levy T. E., Schneider T., Propp W. H. C. (eds) (2015). Israel&#x27;s Exodus in Transdisciplinary Perspective. Springer.</li><li>Friedman R. E. (2017). The Exodus. HarperOne.</li><li>Ritner R. K., Moeller N. (2014). The Ahmose &#x27;Tempest Stela&#x27;, Thera and comparative chronology. Journal of Near Eastern Studies 73(1): 1–19.</li><li>Pearson C. L. et al. (2018). Annual radiocarbon record indicates 16th century BCE date for the Thera eruption. Science Advances 4: eaar8241. <a href="https://doi.org/10.1126/sciadv.aar8241" target="_blank" rel="noopener">doi:10.1126/sciadv.aar8241</a></li><li>Shaw I. (ed.) (2000). The Oxford History of Ancient Egypt. Oxford University Press.</li><li>Bucaille M. (1976). La Bible, le Coran et la science. Seghers (English trans. 1978).</li><li>Rohl D. (2015). Exodus: Myth or History? Thinking Man Media.</li><li>The Quran, trans. M. A. S. Abdel Haleem (2004). Oxford University Press; al-Tabari, Jami&#x27; al-bayan, commentary on 10:92.</li><li>Friedrich W. L. et al. (2006). Santorini eruption radiocarbon dated to 1627–1600 B.C. Science 312: 548. <a href="https://doi.org/10.1126/science.1125087" target="_blank" rel="noopener">doi:10.1126/science.1125087</a></li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-exodus" data-t="Moses, Pharaoh and the Sea That Stepped Back"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Moses, Pharaoh and the Sea That Stepped Back</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-exodus</span> (updated 28 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-babel-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Etemenanki drawing.gif" data-cap="A reconstruction drawing of Etemenanki" data-big><figcaption></figcaption></figure><div class="sh-k">Peoples of the Sacred Texts</div><h2 class="sh-t" id="case-babel-st" tabindex="-1">The Tower of Babel Stood in Babylon</h2><p class="sh-s">Genesis tells of a tower that reached for heaven. Archaeologists found a real one, 91 metres square, in the city whose name the story puns on.</p><div class="sh-v"><span class="vstamp vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><p class="sh-claim"><b>What the stamp rates:</b> The Tower of Babel story in Genesis 11 was modelled on Babylon&#x27;s real ziggurat, Etemenanki.</p><p class="sh-claim"><b>The text's own words:</b> <span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span> <span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span> <span class="sh-more">(line by line below)</span></p></div><p class="v4-q">Was the Tower of Babel a real building, and did language begin as one?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Babylon had a real stepped tower, Etemenanki, with a base about 91 metres on each side.</li><li>It was wrecked in 689 BCE and rebuilt by kings who boasted of workers from many lands.</li><li>Judean exiles lived in Babylon while the rebuilt tower rose.</li><li>The name, the pun on it, the fired brick and bitumen all fit the Genesis story.</li><li>The tower is strongly supported as the model; the scattering of languages in a day is a matter of faith that linguistics does not test.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Texts and scripts</span><span class="thr">Religion and myth</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="91" >91</b><span class="ctr-u"> m</span></div><div class="ctr-l">side of the square base</div><div class="ctr-c">Koldewey 1914; George 2005/2006</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="7" >7</b><span class="ctr-u"> stages</span></div><div class="ctr-l">including the temple on top, per the Esagila tablet</div><div class="ctr-c">Esagila tablet</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="689" >689</b><span class="ctr-u"> BCE</span></div><div class="ctr-l">Sennacherib sacks Babylon and wrecks the tower</div><div class="ctr-c">George 2005/2006</div></div><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="7000" >7,000</b><span class="ctr-u"> languages</span></div><div class="ctr-l">spoken in the world today</div><div class="ctr-c">Ethnologue</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The Tower of Babel story in Genesis 11 was modelled on Babylon&#x27;s real ziggurat, Etemenanki.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Several independent lines agree: the city&#x27;s name, the pun on it, the stepped tower, the fired brick and bitumen, the royal boast of workers from many lands, and the presence of Judean exiles in Babylon while the rebuilt tower rose. What keeps this from &#x27;Established&#x27; is dating. If the story is older than the exile, its model may be the tower in ruins after 689 BCE, another ziggurat, or the idea of ziggurats in general. The scattering of languages in one day is a theological point that linguistics does not test.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Museum labels usually say plainly that Etemenanki inspired the Tower of Babel, and the evidence largely earns that confidence. The gap is in the details: the tablet&#x27;s 90 m height is often repeated as fact though some reconstructions are much lower, and the timing of the Genesis text, which decides which phase of the tower its authors knew, remains uncertain.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Etemenanki, the stepped temple tower of the god Marduk in Babylon, had a square base about 91 m on each side; its foundations were identified by Robert Koldewey&#x27;s German excavation.<small>Koldewey 1914; George 2005/2006</small></li><li>The tower was wrecked when Sennacherib sacked Babylon in 689 BCE and rebuilt by Esarhaddon, Nabopolassar and Nebuchadnezzar II (604–562 BCE).<small>George 2005/2006</small></li><li>The Tower of Babel stele in the Schøyen Collection, from Nebuchadnezzar&#x27;s reign, shows the king beside the stepped tower and is the oldest known image of it.<small>George 2011</small></li><li>Judeans were deported to Babylon in 597 and 586 BCE and lived there while the rebuilt tower dominated the city.<small>2 Kings 24–25; Babylonian Chronicles</small></li><li>Genesis 11:3 describes fired brick with bitumen for mortar, the characteristic building method of southern Mesopotamia rather than of stone-built Judah.<small>Genesis 11:3; Finkel and Seymour 2008</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>When the Babel story was written: before the exile (so modelled on an earlier or ruined tower) or during and after it.</li><li>How tall Etemenanki really stood: about 90 m by the Esagila tablet, or nearer 66 m in some modern reconstructions.</li><li>Whether all human languages descend from a single ancestral language, and whether that could ever be detected.</li><li>Whether the Sumerian &#x27;spell of Nudimmud&#x27; describes Enki confusing languages or restoring them to one.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>The tower&#x27;s brick mantle was dismantled under Alexander the Great and later quarried for centuries; today only the outline of its base remains, often waterlogged.</li><li>No Babylonian text mentions the Judean exiles&#x27; view of the tower, and no Hebrew manuscript of Genesis survives from before about the 2nd century BCE.</li><li>Spoken languages leave no direct record before writing, around 5,000 years ago, so earlier stages must be reconstructed.</li></ul></div></div><h3 class="sub-h wsub">How the traditions tell it</h3><div class="v4texts"><blockquote class="quote v4q"><span class="v4q-t">Hebrew Bible · Genesis 11:3–4</span><p>And they said to one another, &#x27;Come, let us make bricks and fire them thoroughly.&#x27; And they had brick for stone and bitumen for mortar. Then they said, &#x27;Come, let us build ourselves a city and a tower with its top in the heavens, and let us make a name for ourselves; otherwise we shall be scattered abroad upon the face of the whole earth.&#x27;</p><cite>New Revised Standard Version Updated Edition (2021)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Sumerian epic · Enmerkar and the Lord of Aratta, lines 134–155</span><p>Enki, the lord of abundance and of steadfast decisions, the wise and knowing lord of the Land, the expert of the gods, chosen for wisdom, the lord of Eridug, shall change the speech in their mouths, as many as he had placed there, and so the speech of mankind is truly one.</p><cite>trans. J. A. Black et al., Electronic Text Corpus of Sumerian Literature (Oxford)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Quran · 30:22</span><p>Another of His signs is the creation of the heavens and earth, and the diversity of your languages and colours. There truly are signs in this for those who know.</p><cite>trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote></div><h3 class="sub-h wsub">In the text's own words</h3><p class="rd-rule">Each line rates only what the text itself says, not later dates, commentaries or modern identifications.</p><ul class="rds"><li class="rd"><p class="rd-s">People built a city and a tower of fired brick, with bitumen for mortar (Genesis 11:3–4).</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">This is exactly how Mesopotamian ziggurats were built, including Etemenanki at Babylon.</p></li><li class="rd"><p class="rd-s">The diversity of human languages is a sign (Quran 30:22); languages were confused at Babel (Genesis 11:7–9).</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">Linguists trace language families far back in time, but where human speech first came from is still unknown.</p></li></ul><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Most historians and biblical scholars see the Babel story as a Judean reflection on Babylon, the empire that destroyed Jerusalem. Its tower matches a Mesopotamian ziggurat, its bricks and bitumen match Mesopotamian building, and its punchline turns Babylon&#x27;s proud name into a joke about confusion. Etemenanki, the greatest ziggurat of Babylon, is the obvious model. Linguists add that languages split slowly over many centuries, never in a single event, though a single distant origin of human language is possible.</p><ul><li>The name Babel is Babylon; the Hebrew verb balal, &#x27;to confuse&#x27;, makes the pun.</li><li>Ziggurats were built in fired and sun-dried brick set with bitumen, exactly as Genesis 11:3 says.</li><li>Nebuchadnezzar boasted of rebuilding the tower with labour gathered from many lands.</li><li>Language families such as Indo-European diverged over thousands of years.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Challengers push the story further back. David Rohl argues that the original Babel was Eridu, the oldest Sumerian city, whose ziggurat was repeatedly rebuilt and which some Babylonian texts associate with Babylon. On language, Merritt Ruhlen and John Bengtson claim to find word roots shared across the world&#x27;s language families, echoes of a single ancestral tongue. Quentin Atkinson&#x27;s 2011 study found that the number of speech sounds in a language tends to fall with distance from Africa, which he read as a trace of a single African origin.</p><ul><li>Eridu&#x27;s temple mound shows rebuilding from the 6th millennium BCE, the deep past Genesis seems to describe.</li><li>If modern humans spread from one small founding population that already spoke, humanity once shared a language.</li><li>The Sumerian Enmerkar epic has its own story about the speech of mankind and the god Enki.</li></ul><div class="face-s"><b>Its strongest point</b><p>Most linguists accept that a single origin of human language is possible, even likely, because all modern humans share the same capacity for it. In that deep sense &#x27;the whole earth had one language&#x27; is an open question, not a myth to be dismissed.</p></div><p class="face-cr"><b>Credit</b> David Rohl; Merritt Ruhlen and John Bengtson; Quentin Atkinson</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>A Judean or Babylonian text from the exile that names Etemenanki or describes the exiles working on it.</li><li>A firm date for the Genesis 11 text, from manuscripts or linguistic dating of its Hebrew.</li><li>Excavation of the earliest phases of Babylon&#x27;s tower, now largely below the water table.</li><li>A validated method that reconstructs word roots back beyond about 10,000 years, the current limit of the comparative method.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,093 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of The Tower of Babel Stood in Babylon"><button type="button" class="wtoc-i" data-go="babel-s1">A city, a tower and a pun</button><button type="button" class="wtoc-i" data-go="babel-s2">The real tower</button><button type="button" class="wtoc-i" data-go="babel-s3">Exiles in the tower&#x27;s shadow</button><button type="button" class="wtoc-i" data-go="babel-s4">A Sumerian Babel, and a Quranic sign</button><button type="button" class="wtoc-i" data-go="babel-s5">Did everyone once speak one language?</button><button type="button" class="wtoc-i" data-go="babel-s6">Other candidates, and what time erased</button></nav></div><section class="wsec" id="babel-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A city, a tower and a pun</h3><p>Genesis 11 is only nine verses long. &#x27;Now the whole earth had one language and the same words.&#x27; People move east, settle on a plain in the land of Shinar, bake bricks and decide to build &#x27;a city and a tower with its top in the heavens&#x27;. God comes down to see it, confuses their language, and scatters them. The city is named Babel, &#x27;because there the Lord confused the language of all the earth&#x27;.</p><p>In Hebrew the joke is sharp. Babel is simply the Hebrew name for Babylon. The Babylonians understood their city&#x27;s name as Bab-ili, &#x27;gate of the god&#x27;. Genesis hears it as balal, &#x27;to mix up&#x27;. The gate of heaven becomes the capital of confusion.</p><blockquote class="wpull"><p>The gate of the god becomes the capital of confusion, and the building behind the joke was real.</p></blockquote></section><section class="wsec" id="babel-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The real tower</h3><p>Babylon&#x27;s great ziggurat was called Etemenanki, Sumerian for &#x27;house, foundation platform of heaven and earth&#x27;. It stood beside Esagila, the temple of the god Marduk. When the German archaeologist Robert Koldewey excavated Babylon from 1899, he found its footprint: a square about 91 m on each side, with a massive stair on its south face. Very little else survived.</p><figure class="wx wx--static" id="babel-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Etemenanki drawn to scale</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Etemenanki drawn to scale"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" class="wx-svg" role="img" aria-labelledby="babel-f1-t"><title id="babel-f1-t">Elevation of the Etemenanki ziggurat of Babylon drawn to scale from the Esagila tablet, with a person and a 20 m scale bar</title><defs><marker id="babel-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text class="wx-t-cap" x="24" y="30">Etemenanki, Babylon · elevation to scale</text><path class="wx-line" d="M30,500 H700"/><rect class="wx-stone2 wx-edge wx-grow" style="--d:0" x="87.5" y="351.5" width="405.0" height="148.5"/><rect class="wx-stone wx-edge wx-grow" style="--d:2" x="114.5" y="270.5" width="351.0" height="81.0"/><rect class="wx-stone2 wx-edge wx-grow" style="--d:4" x="155.0" y="243.5" width="270.0" height="27.0"/><rect class="wx-stone wx-edge wx-grow" style="--d:6" x="175.2" y="216.5" width="229.5" height="27.0"/><rect class="wx-stone2 wx-edge wx-grow" style="--d:8" x="195.5" y="189.5" width="189.0" height="27.0"/><rect class="wx-stone wx-edge wx-grow" style="--d:10" x="215.8" y="162.5" width="148.5" height="27.0"/><rect class="wx-c2 wx-edge wx-grow" style="--d:12" x="236.0" y="95.0" width="108.0" height="67.5"/><g class="wx-pop" style="--d:4"><rect class="wx-stone3 wx-o60" x="269.75" y="270.5" width="40.5" height="229.5"/><path class="wx-thin" d="M269.75,491.2 H310.25"/><path class="wx-thin" d="M269.75,482.3 H310.25"/><path class="wx-thin" d="M269.75,473.5 H310.25"/><path class="wx-thin" d="M269.75,464.7 H310.25"/><path class="wx-thin" d="M269.75,455.9 H310.25"/><path class="wx-thin" d="M269.75,447.0 H310.25"/><path class="wx-thin" d="M269.75,438.2 H310.25"/><path class="wx-thin" d="M269.75,429.4 H310.25"/><path class="wx-thin" d="M269.75,420.6 H310.25"/><path class="wx-thin" d="M269.75,411.7 H310.25"/><path class="wx-thin" d="M269.75,402.9 H310.25"/><path class="wx-thin" d="M269.75,394.1 H310.25"/><path class="wx-thin" d="M269.75,385.2 H310.25"/><path class="wx-thin" d="M269.75,376.4 H310.25"/><path class="wx-thin" d="M269.75,367.6 H310.25"/><path class="wx-thin" d="M269.75,358.8 H310.25"/><path class="wx-thin" d="M269.75,349.9 H310.25"/><path class="wx-thin" d="M269.75,341.1 H310.25"/><path class="wx-thin" d="M269.75,332.3 H310.25"/><path class="wx-thin" d="M269.75,323.5 H310.25"/><path class="wx-thin" d="M269.75,314.6 H310.25"/><path class="wx-thin" d="M269.75,305.8 H310.25"/><path class="wx-thin" d="M269.75,297.0 H310.25"/><path class="wx-thin" d="M269.75,288.2 H310.25"/><path class="wx-thin" d="M269.75,279.3 H310.25"/></g><g class="wx-pop" style="--d:9"><path class="wx-dash" d="M200,203.0 H494"/><text class="wx-t-b" x="500" y="201.0">Lower modern estimate</text><text class="wx-t-m" x="500" y="217.0">c. 66 m including the temple</text></g><g class="wx-pop" style="--d:8"><path class="wx-dim" marker-start="url(#babel-f1-ah)" marker-end="url(#babel-f1-ah)" d="M65.5,95.0 V500"/><text class="wx-t-n" x="59.5" y="83.0">c. 90 m high per the tablet</text></g><g class="wx-pop" style="--d:14"><path class="wx-dim" marker-start="url(#babel-f1-ah)" marker-end="url(#babel-f1-ah)" d="M87.5,516 H492.5"/><text class="wx-t-n" x="290" y="534" text-anchor="middle">square base c. 91 m a side (excavated)</text></g><g class="wx-pop" style="--d:10"><path class="wx-thin" d="M494,436 L496.5,425.8"/><circle class="wx-inkfill" cx="492.5" cy="425.8" r="2"/><text class="wx-t-b" x="500" y="440">Stage 1: 33 m high</text><text class="wx-t-m" x="500" y="456">mud-brick core, baked-brick skin</text></g><g class="wx-pop" style="--d:11"><path class="wx-thin" d="M494,332 L469.5,311.0"/><circle class="wx-inkfill" cx="465.5" cy="311.0" r="2"/><text class="wx-t-b" x="500" y="336">Stage 2: 18 m</text></g><g class="wx-pop" style="--d:13"><path class="wx-thin" d="M494,264 L408.8,230.0"/><circle class="wx-inkfill" cx="404.8" cy="230.0" r="2"/><text class="wx-t-b" x="500" y="268">Stages 3–6: 6 m each</text><text class="wx-t-m" x="500" y="284">the tablet's figures</text></g><g class="wx-pop" style="--d:16"><path class="wx-thin" d="M494,116 L348.0,128.8"/><circle class="wx-inkfill" cx="344.0" cy="128.8" r="2"/><text class="wx-t-b" x="500" y="120">Temple on top: 15 m</text><text class="wx-t-m" x="500" y="136">shrine of Marduk</text></g><g class="wx-pop" style="--d:12"><path class="wx-line" d="M640,492.35 L640,496.4 M638,500 L640,496.4 L642,500"/><circle class="wx-inkfill" cx="640" cy="490.85" r="1.6"/><text class="wx-t-s" x="640" y="484" text-anchor="middle">1.7 m person</text></g><g class="wx-pop" style="--d:12"><rect class="wx-inkfill" x="590" y="514" width="45.0" height="6"/><rect class="wx-paper wx-edge" x="635.0" y="514" width="45.0" height="6"/><text class="wx-t-s" x="590" y="530" text-anchor="middle">0</text><text class="wx-t-s" x="680.0" y="530" text-anchor="middle">20 m</text></g><text class="wx-t-s" x="24" y="556">Stage sizes: the Esagila tablet converted at about 6 m per nindan. A reconstruction, not a survey.</text></svg></div></div><figcaption>The seven stages described by the Esagila tablet, stacked on the 91 m square base found by excavation, with a person and a 20 m scale bar. A dashed line marks a lower modern estimate. <span class="wx-src">Based on: Base from Koldewey&#x27;s excavation; stage sizes from the Esagila tablet converted at about 6 m per nindan, as usually reproduced (e.g. Wiseman 1985; George 2005/2006); lower estimate as reported by Montero Fenollós and colleagues.</span></figcaption><p class="vh">Side elevation of a seven-stage stepped tower drawn to scale. The lowest stage is 90 metres wide and 33 metres high, the second 78 metres wide and 18 metres high, then four stages each 6 metres high and narrowing from 60 to 33 metres wide, topped by a temple 24 metres wide and 15 metres high, for a total of about 90 metres. A central staircase climbs the front of the first two stages. A dimension line marks the square base of about 91 metres. A dashed line at 66 metres marks a lower modern estimate. A tiny 1.7 metre person stands at ground level next to a 20 metre scale bar.</p></figure><p>The height comes from a clay tablet. The so-called Esagila tablet, copied at Uruk in 229 BCE from an older text and translated by George Smith in 1876, gives the dimensions of each stage. Converted at about 6 m per Babylonian nindan, it describes seven stages rising to roughly 90 m, as tall as the base was wide. Some modern reconstructions come out lower, around 66 m including the temple. The Greek historian Herodotus, writing in the 5th century BCE, described a tower of eight stages with a stair winding around the outside and a shrine on top.</p><p>The tower had a violent history. Sennacherib of Assyria sacked Babylon in 689 BCE and wrecked it. Esarhaddon began repairs. Nabopolassar and his son Nebuchadnezzar II rebuilt it on a grand scale. Nabopolassar&#x27;s foundation cylinder boasts that he had his own sons carry earth and building materials. A black stone stele from Nebuchadnezzar&#x27;s reign, published by Andrew George in 2011, shows the king in profile beside the stepped tower.</p></section><section class="wsec" id="babel-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Exiles in the tower&#x27;s shadow</h3><p>In 597 BCE and again in 586 BCE, Nebuchadnezzar&#x27;s armies deported thousands of Judeans to Babylonia. Among them were priests and scribes, the people who would shape much of the Hebrew Bible. They lived in a city dominated by a mountain of brick that the king described as reaching to heaven, built with labour drawn from across his empire.</p><p>The details of Genesis fit that world closely. &#x27;They had brick for stone and bitumen for mortar,&#x27; the text explains, as if to readers who knew stone buildings. Judah built in stone. Babylonia, a land of river mud with no quarries, built in baked brick set in bitumen. The story sounds like a hill people&#x27;s description of a lowland empire.</p><aside class="wcall"><b>How do we know?</b><p>Babylonian ration tablets found in Nebuchadnezzar&#x27;s palace list oil issued to &#x27;Jehoiachin, king of Judah&#x27; and his sons. They confirm what 2 Kings says: the Judean royal family lived in Babylon, in the city of the tower.</p></aside><p>There is a complication. Many scholars assign the Babel story to an older strand of Genesis, which may have been written before the exile. If so, its authors may have known Etemenanki as a ruin after 689 BCE, a half-finished tower abandoned by its builders, which is exactly how the story ends.</p></section><section class="wsec" id="babel-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>A Sumerian Babel, and a Quranic sign</h3><p>The idea that languages were once one is older than Genesis. The Sumerian epic Enmerkar and the Lord of Aratta, known from copies of the early 2nd millennium BCE, includes a spell of the god Nudimmud (Enki). It imagines a time when many peoples &#x27;address Enlil together in a single language&#x27;, and says that Enki &#x27;shall change the speech in their mouths&#x27;. In 1968 Samuel Noah Kramer read it as a Sumerian &#x27;Babel of tongues&#x27;. Other Sumerologists read the same lines as a hope that languages would be made one again. The text is ambiguous, but the theme is there.</p><p>The Quran does not tell the Babel story. It does treat the variety of human speech as something to reflect on: &#x27;Another of His signs is the creation of the heavens and earth, and the diversity of your languages and colours.&#x27; And it gives a different tyrant a tower. In Quran 28:38, Pharaoh tells Haman to &#x27;light me a fire to bake clay bricks, then build me a tall building&#x27; so that he may climb up to the God of Moses. The motif of baked brick raised against heaven appears in both scriptures, and in both it ends in failure.</p></section><section class="wsec" id="babel-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Did everyone once speak one language?</h3><p>Here the challengers have a real point. More than 7,000 languages are spoken today, grouped into a few hundred families. Linguists can reconstruct parent languages by comparing regular sound changes. Proto-Indo-European, ancestor of English, Hindi and Persian, is dated to somewhere between about 6,000 and 8,000 years ago, and a 2023 study by Paul Heggarty and colleagues favoured the older end. Beyond roughly 10,000 years, most linguists think the signal fades into noise.</p><p>Merritt Ruhlen and John Bengtson argue that it does not fade completely. They list word roots, such as a form like &#x27;tik&#x27; for finger or one, that they claim to find across many families, and they read them as fossils of a single mother tongue. Most linguists doubt these matches, because chance resemblances are common. Quentin Atkinson took a different route in 2011, showing that languages far from Africa tend to use fewer distinct sounds, as if speech had lost variety as humans spread out. That result is also debated.</p><p>What linguistics does not see is a sudden break. Latin became French, Spanish and Romanian over some 1,500 years, gradually, speaker by speaker. A deep single origin is possible. A single afternoon of confusion is outside what the discipline can test.</p></section><section class="wsec" id="babel-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Other candidates, and what time erased</h3><p>Babylon&#x27;s tower was not the only candidate. Travellers for centuries pointed to the tall ruin at Borsippa, Birs Nimrud, a few kilometres south, because it still stood high when Etemenanki had vanished. David Rohl proposes Eridu, the ancient city of Enki, whose temple mound was rebuilt again and again from the 6th millennium BCE. Later Islamic storytellers, in collections of prophets&#x27; tales, gave the tower to the tyrant Nimrod.</p><p>The real Etemenanki had a sad ending. Alexander the Great ordered it cleared for rebuilding around 323 BCE and died before work began. Its bricks became a quarry for later builders. Today its base is a square outline, often flooded. Whatever inscriptions once lined its faces went with the bricks.</p><ul class="wlist"><li>A text from the exile that names Etemenanki in a Judean setting.</li><li>A secure date for Genesis 11 from manuscripts or the history of its Hebrew.</li><li>Excavation of the tower&#x27;s earliest phases below the water table.</li><li>A tested method that can reach beyond 10,000 years of language history.</li></ul></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-loss" style="--i:0"><span class="wtl-y">689 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Sennacherib sacks Babylon; the tower is ruined</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">620 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Nabopolassar begins rebuilding Etemenanki</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">586 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Jerusalem falls; more Judeans deported to Babylon</span></li><li class="wtl-build" style="--i:3"><span class="wtl-y">560 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Nebuchadnezzar II&#x27;s rebuild completed by his death in 562</span></li><li class="wtl-loss" style="--i:4"><span class="wtl-y">323 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Alexander has the tower cleared for a rebuild that never comes</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1876 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">George Smith translates the Esagila tablet</span></li><li class="wtl-find" style="--i:6"><span class="wtl-y">1913 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Koldewey excavates the tower&#x27;s foundations</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2011 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Andrew George publishes the Tower of Babel stele</span></li></ol><details class="srcs"><summary>Sources for this case (13)</summary><ol><li>George A. R. (2005/2006). The Tower of Babel: archaeology, history and cuneiform texts. Archiv für Orientforschung 51: 75–95.</li><li>George A. R. (2011). A stele of Nebuchadnezzar II. In Cuneiform Royal Inscriptions and Related Texts in the Schøyen Collection (CUSAS 17). CDL Press.</li><li>Koldewey R. (1914). The Excavations at Babylon. Macmillan.</li><li>Wiseman D. J. (1985). Nebuchadrezzar and Babylon (Schweich Lectures 1983). Oxford University Press.</li><li>Finkel I. L., Seymour M. J. (eds) (2008). Babylon: Myth and Reality. British Museum Press.</li><li>Herodotus, Histories 1.181, trans. A. D. Godley (Loeb, 1920).</li><li>Black J. A. et al. The Electronic Text Corpus of Sumerian Literature: Enmerkar and the Lord of Aratta (t.1.8.2.3). University of Oxford.</li><li>Kramer S. N. (1968). The &#x27;Babel of Tongues&#x27;: a Sumerian version. Journal of the American Oriental Society 88: 108–111.</li><li>Atkinson Q. D. (2011). Phonemic diversity supports a serial founder effect model of language expansion from Africa. Science 332: 346–349. <a href="https://doi.org/10.1126/science.1199295" target="_blank" rel="noopener">doi:10.1126/science.1199295</a></li><li>Heggarty P. et al. (2023). Language trees with sampled ancestors support a hybrid model for the origin of Indo-European languages. Science 381: eabg0818. <a href="https://doi.org/10.1126/science.abg0818" target="_blank" rel="noopener">doi:10.1126/science.abg0818</a></li><li>Ruhlen M. (1994). The Origin of Language: Tracing the Evolution of the Mother Tongue. Wiley.</li><li>Rohl D. (1998). Legend: The Genesis of Civilisation. Century.</li><li>The Quran, trans. M. A. S. Abdel Haleem (2004). Oxford University Press.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-babel" data-t="The Tower of Babel Stood in Babylon"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Tower of Babel Stood in Babylon</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-babel</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-sheba-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Bar&#x27;an temple 1986-3.jpg" data-cap="The Bar&#x27;an temple at Marib, Yemen" data-big><figcaption></figcaption></figure><div class="sh-k">Peoples of the Sacred Texts</div><h2 class="sh-t" id="case-sheba-st" tabindex="-1">The Queen of Sheba and the Flood of the Dam</h2><p class="sh-s">A queen who worshipped the sun, a letter carried by a hoopoe, and a dam whose collapse the Quran remembers. Saba was real. Was she?</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> A ruling queen from Saba in South Arabia made a state visit to Solomon in Jerusalem in the 10th century BCE.</p><p class="sh-claim"><b>The text's own words:</b> <span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span> <span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span> <span class="sh-more">(line by line below)</span></p></div><p class="v4-q">Did a queen of Saba visit Solomon, and does the dam story fit Marib?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Saba was a real kingdom in Yemen, rich from incense, with inscriptions from about the 8th century BCE.</li><li>The Quran&#x27;s account of its two irrigated oases and the bursting of its dam fits the archaeology of Marib remarkably well.</li><li>The queen&#x27;s visit to Solomon has no independent witness.</li><li>Saba&#x27;s records begin about two centuries after Solomon, and early Saba is barely excavated.</li><li>An absence in unexcavated ground, not evidence against: the visit awaits discovery.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Texts and scripts</span><span class="thr">Religion and myth</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">about <b class="ctr-n" data-v="580" >580</b><span class="ctr-u"> m</span></div><div class="ctr-l">length of the Great Dam of Marib</div><div class="ctr-c">Brunner 1983</div></div><div class="ctr"><div class="ctr-v">about <b class="ctr-n" data-v="14" >14</b><span class="ctr-u"> m</span></div><div class="ctr-l">height of the dam in its last phase</div><div class="ctr-c">Simpson (ed.) 2002</div></div><div class="ctr"><div class="ctr-v">about <b class="ctr-n" data-v="100" >100</b><span class="ctr-u"> km²</span></div><div class="ctr-l">of irrigated fields north and south of the wadi</div><div class="ctr-c">Brunner 1983</div></div><div class="ctr"><div class="ctr-v">c. 570–<b class="ctr-n" data-v="575" >575</b><span class="ctr-u"> CE</span></div><div class="ctr-l">the dam fails for the last time</div><div class="ctr-c">Vogt 2004</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>A ruling queen from Saba in South Arabia made a state visit to Solomon in Jerusalem in the 10th century BCE.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Saba&#x27;s existence, wealth and incense trade are well established, and the Quran&#x27;s account of its two irrigated oases and the flood of the dam fits the archaeology of Marib remarkably well. The visit itself has no independent witness. No inscription names a Sabaean queen, the kingdom&#x27;s records begin about two centuries after Solomon, and the one possible 10th-century link, the Ophel jar, is disputed. Because early Saba is so poorly explored, this is an absence in unexcavated ground, not evidence against.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks tend to file the queen under legend with some confidence, and on present evidence that is fair. But they sometimes imply that 10th-century Saba did not exist, which goes further than the evidence: the kingdom&#x27;s earliest phase is simply unexcavated and war now blocks fieldwork. Meanwhile the dam story, often treated as pious folklore, is one of the best-documented engineering disasters of antiquity.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Saba (Sheba) was a real kingdom centred on Marib in Yemen, with monumental inscriptions from about the 8th century BCE and a history lasting until the 6th century CE.<small>Simpson (ed.) 2002; UNESCO 2023</small></li><li>Assyrian records mention Saba: Sargon II received tribute from It&#x27;amra the Sabaean around 715 BCE, and Sennacherib gifts from Karib-il of Saba around 685 BCE.<small>Eph&#x27;al 1982</small></li><li>The Great Dam of Marib, about 580 m long and eventually about 14 m high, diverted flash floods into irrigated oases north and south of the wadi, around 100 km² of fields.<small>Brunner 1983; UNESCO 2023</small></li><li>The dam was breached and repaired in 449–450 and 548 CE (the second repair recorded in an inscription of Abraha) and finally failed around 570–575 CE.<small>Vogt 2004; Simpson (ed.) 2002</small></li><li>No South Arabian inscription found so far names a queen of Saba or a mission to Jerusalem; the early rulers named in inscriptions are men.<small>Simpson (ed.) 2002</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether Sabaean kingship and long-distance trade already existed in the 10th century BCE, when the visit is set.</li><li>Whether a 10th-century jar inscription from Jerusalem&#x27;s Ophel is written in Sabaic and mentions an incense ingredient.</li><li>Whether the queen was Sabaean at all, or a memory of the powerful north Arabian queens named in Assyrian records.</li><li>How far the Ethiopian tradition of Makeda and Menelik preserves memories of real Sabaean links across the Red Sea.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Most of ancient Marib is unexcavated; much of the Awam temple precinct is still under sand.</li><li>War since 2015 has halted fieldwork; the ancient dam was damaged in an airstrike in 2015 and sites have been looted.</li><li>Inscriptions older than the 8th century BCE are rare, so the kingdom&#x27;s earliest centuries are almost undocumented.</li></ul></div></div><h3 class="sub-h wsub">How the traditions tell it</h3><div class="v4texts"><blockquote class="quote v4q"><span class="v4q-t">Quran · 27:22–23</span><p>But he [i.e., the hoopoe] stayed not long and said, &#x27;I have encompassed [in knowledge] that which you have not encompassed, and I have come to you from Sheba with certain news. Indeed, I found [there] a woman ruling them, and she has been given of all things, and she has a great throne.&#x27;</p><cite>trans. Sahih International (1997)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Quran · 34:15–16</span><p>There was a sign for the people of Sheba, too, in their dwelling place: two gardens, one on the right, one on the left: &#x27;Eat from what your Lord has provided for you and give Him thanks, for your land is good, and your Lord most forgiving.&#x27; But they paid no heed, so We let loose on them a flood from the dam and replaced their two gardens with others that yielded bitter fruit, tamarisk bushes, and a few lote trees.</p><cite>trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Hebrew Bible · 1 Kings 10:1–2</span><p>When the queen of Sheba heard of the fame of Solomon (fame due to the name of the Lord), she came to test him with riddles. She came to Jerusalem with a very great retinue, with camels bearing spices and very much gold and precious stones, and when she came to Solomon, she told him all that was on her mind.</p><cite>New Revised Standard Version Updated Edition (2021)</cite></blockquote></div><h3 class="sub-h wsub">In the text's own words</h3><p class="rd-rule">Each line rates only what the text itself says, not later dates, commentaries or modern identifications.</p><ul class="rds"><li class="rd"><p class="rd-s">A woman ruled Saba, a land that had been given of all things (Quran 27:23; 1 Kings 10:1–2).</p><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span><p class="rd-n">The Sabaean kingdom is real and was rich by the early 1st millennium BCE. No inscription yet found names a ruling queen, and many early Sabaean texts are still unpublished or unexcavated.</p></li><li class="rd"><p class="rd-s">Saba had two gardens, one on the right and one on the left, and lost them to &#x27;the flood of the dam&#x27; (Quran 34:15–16).</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">The great dam of Marib watered two oases, north and south of the wadi. Sabaean inscriptions record its breaches and repairs into the 6th century CE, and it failed for the last time around 570–575 CE; the oases were then abandoned.</p></li></ul><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Historians accept Saba as a real and wealthy incense kingdom, and many find the Quran&#x27;s picture of its irrigated oases and failed dam strikingly accurate. The royal visit is another matter. Sabaean inscriptions begin around the 8th century BCE, two centuries after Solomon, and none mentions a queen. Most scholars read 1 Kings 10 as a story that celebrates Solomon&#x27;s wisdom and wealth, perhaps personifying the incense trade that reached Judah in the 8th and 7th centuries BCE.</p><ul><li>Domestic camels, essential for desert caravans, appear in the southern Levant only in the late 10th century BCE.</li><li>Frankincense residue was found on an altar at the Judahite shrine of Arad, dated to the 8th century BCE.</li><li>The Arabian queens in Assyrian records, Zabibe and Samsi, ruled north Arabian tribes, not Saba.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Ethiopia&#x27;s national epic, the Kebra Nagast, makes the queen Makeda, mother of Menelik I, founder of a dynasty that ruled until 1974. Sabaean inscriptions and a Sabaean-style temple at Yeha show that Sabaean influence did reach the Ethiopian highlands by around the 8th–7th century BCE. Kenneth Kitchen argued for a longer Sabaean chronology that leaves room for a 10th-century kingdom. In 2021 Daniel Vainstub reread a 10th-century BCE jar inscription from Jerusalem as Sabaic, naming an incense ingredient. Louise Schofield&#x27;s team claimed in 2012 to have found an ancient gold mine in northern Ethiopia linked to the queen.</p><ul><li>Sabaean links across the Red Sea are real, so Ethiopia&#x27;s claim is not a late invention from nothing.</li><li>A Sabaic inscription in 10th-century Jerusalem, if confirmed, would place South Arabian traders there in Solomon&#x27;s century.</li><li>Early Sabaean history is thinly documented; absence of inscriptions is weak evidence.</li></ul><div class="face-s"><b>Its strongest point</b><p>The written record of Saba begins only around the 8th century BCE, and Marib is barely excavated. A 10th-century queen could have left no inscription we have yet found, and the Ophel jar may already show South Arabians in Jerusalem.</p></div><p class="face-cr"><b>Credit</b> Ethiopian Orthodox tradition (Kebra Nagast); Kenneth Kitchen; Daniel Vainstub; Louise Schofield; Nicholas Clapp</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>A Sabaean inscription naming a ruling queen, or diplomatic contact with Israel or Judah.</li><li>Radiocarbon-dated 10th-century BCE monumental building at Marib or Sirwah.</li><li>Agreement among epigraphers on the script and reading of the Ophel jar inscription.</li><li>Frankincense or myrrh residues from securely dated 10th-century contexts in Jerusalem.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,100 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of The Queen of Sheba and the Flood of the Dam"><button type="button" class="wtoc-i" data-go="sheba-s1">A letter carried by a bird</button><button type="button" class="wtoc-i" data-go="sheba-s2">The kingdom was real</button><button type="button" class="wtoc-i" data-go="sheba-s3">Two gardens and the flood of the dam</button><button type="button" class="wtoc-i" data-go="sheba-s4">Where is the queen?</button><button type="button" class="wtoc-i" data-go="sheba-s5">The case for the queen</button><button type="button" class="wtoc-i" data-go="sheba-s6">What would settle it</button></nav></div><section class="wsec" id="sheba-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A letter carried by a bird</h3><p>In the Quran the story begins with a missing bird. Solomon, who has been taught &#x27;the speech of birds&#x27;, reviews his assembly and notices that the hoopoe is absent. It returns with news from a land he does not know: a kingdom called Sheba, ruled by a woman who &#x27;has been given a share of everything&#x27; and sits on a magnificent throne, whose people bow to the sun. Solomon sends a letter. The queen consults her counsellors, tests him with a gift, and finally comes herself. Her own throne has been brought ahead of her. She walks into a hall, takes its glass floor for a pool of water, lifts her skirts, and understands. &#x27;My Lord, I have wronged myself: I devote myself, with Solomon, to God, the Lord of the Worlds.&#x27;</p><p>The Hebrew Bible&#x27;s version is shorter and more worldly. The queen hears of Solomon&#x27;s fame, arrives in Jerusalem &#x27;with camels bearing spices and very much gold and precious stones&#x27;, tests him with riddles, and goes home impressed. Ethiopia&#x27;s Kebra Nagast, written down in the 14th century CE, adds a son, Menelik, founder of a royal line. Arab tradition calls her Bilqis. Ethiopia calls her Makeda. Three civilisations claim her.</p></section><section class="wsec" id="sheba-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The kingdom was real</h3><p>Saba lay on the edge of the Yemeni desert, at Marib, where the highlands give way to the sands of the Ramlat as-Sab&#x27;atayn. It grew rich on frankincense and myrrh, resins that grow only in southern Arabia and the Horn of Africa and that every temple in the Mediterranean wanted. UNESCO, which inscribed the &#x27;Landmarks of the Ancient Kingdom of Saba&#x27; in 2023, describes it as controlling much of the incense route from about the 8th century BCE.</p><p>Outsiders noticed. Sargon II of Assyria recorded tribute from It&#x27;amra the Sabaean around 715 BCE. Sennacherib received gifts from Karib-il, king of Saba, around 685 BCE. At Marib itself, the great oval temple of the god Almaqah, called Awam, still bears the local name Mahram Bilqis, &#x27;sanctuary of Bilqis&#x27;. A second temple nearby, Bar&#x27;an, is known as &#x27;Arsh Bilqis&#x27;, her throne. The Sabaean pantheon included a sun goddess, and some scholars now read Almaqah himself as a solar god rather than a moon god, which sits well with the Quran&#x27;s people who bowed to the sun.</p><blockquote class="wpull"><p>The Quran&#x27;s &#x27;two gardens, one on the right, one on the left&#x27; describes Marib&#x27;s two oases with a surveyor&#x27;s accuracy.</p></blockquote></section><section class="wsec" id="sheba-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Two gardens and the flood of the dam</h3><p>The Quran tells a second Sheba story, and this one archaeology can follow closely. Saba had &#x27;two gardens, one on the right, one on the left&#x27;. When its people turned away, God &#x27;let loose on them a flood from the dam&#x27;, and the gardens became scrub of bitter fruit, tamarisk and a few lote trees. The Arabic phrase, sayl al-&#x27;arim, became proverbial for a catastrophe that scatters a people.</p><figure class="wx wx--steps" id="sheba-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">How the Great Dam of Marib worked, and how it failed</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How the Great Dam of Marib worked, and how it failed"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" class="wx-svg" role="img" aria-labelledby="sheba-f1-t"><title id="sheba-f1-t">Schematic plan of the Great Dam of Marib with its two sluices, canals and the northern and southern oases</title><defs><marker id="sheba-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text class="wx-t-cap" x="24" y="30">The Great Dam of Marib · schematic plan, not to scale</text><g><path class="wx-line" d="M690,86 V56"/><path class="wx-inkfill" d="M690,48 L684,62 L696,62 Z"/><text class="wx-t-b" x="690" y="102" text-anchor="middle">N</text></g><g class="wx-st wx-hide" data-s="3"><rect class="wx-green wx-o60 wx-edge-soft" x="400" y="70" width="250" height="140" rx="14"/><path class="wx-thin" d="M408,93.3 H642"/><path class="wx-thin" d="M408,116.7 H642"/><path class="wx-thin" d="M408,140.0 H642"/><path class="wx-thin" d="M408,163.3 H642"/><path class="wx-thin" d="M408,186.7 H642"/></g><g class="wx-st wx-hide" data-s="3"><rect class="wx-green wx-o60 wx-edge-soft" x="400" y="300" width="250" height="140" rx="14"/><path class="wx-thin" d="M408,323.3 H642"/><path class="wx-thin" d="M408,346.7 H642"/><path class="wx-thin" d="M408,370.0 ,364 V300 M560,372 V300"/></g><g class="wx-st wx-hide" data-s="3"><text class="wx-t-b wx-halo" x="500" y="92">North oasis</text><text class="wx-t-b wx-halo" x="500" y="430">South oasis</text><circle class="wx-inkfill" cx="610" cy="176" r="5"/><text class="wx-t-s wx-halo" x="600" y="194" text-anchor="end">Marib city</text><rect class="wx-inkfill" x="604" y="322" width="10" height="10"/><text class="wx-t-s wx-halo" x="598" y="332" text-anchor="end">Awam temple</text></g><g class="wx-st wx-hide" data-only="3"><text class="wx-t wx-halo" x="700" y="474" text-anchor="end">"two gardens, one on the right, one on the left" (Quran 34:15)</text></g><g class="wx-st wx-hide" data-only="4"><rect class="wx-card wx-edge-soft" x="360" y="226" width="300" height="190" rx="10"/><text class="wx-t-cap" x="376" y="248">Dam section, height to scale</text><path class="wx-line" d="M380,392 H640"/><path class="wx-soil wx-edge" d="M440,392 L470,280 L500,280 L550,392 Z"/><path class="wx-soil wx-edge" d="M455,392 L483,336 L493,336 L520,392 Z"/><path class="wx-stone2 wx-edge" d="M462,392 L484,360 L492,360 L508,392 Z"/><text class="wx-t-s" x="560" y="366">c. 4 m, earliest</text><text class="wx-t-s" x="560" y="340">c. 7 m, c. 500 BCE</text><text class="wx-t-s" x="560" y="286">c. 14 m, late phase</text><text class="wx-t-s" x="376" y="410">silt raised fields, so the dam was raised</text></g><g class="wx-st wx-hide" data-s="5"><path class="wx-sand" d="M232,212 C260,206 290,200 308,200 L308,300 C290,300 260,296 232,288 C220,262 220,236 232,212 Z"/><path class="wx-sand wx-edge" d="M303,222 L316,228 L304,236 L318,244 L304,252 L317,262 L303,272 L312,278 L312,222 Z"/><path class="wx-sand" d="M304,224 H318 V276 H304 Z"/><path class="wx-flow wx-s2" d="M40,250 H520"/><rect class="wx-sand wx-o80" x="400" y="70" width="250" height="140" rx="14"/><rect class="wx-sand wx-o80" x="400" y="300" width="250" height="140" rx="14"/><text class="wx-t-b wx-t-a wx-halo" x="334" y="288">breach c. 570–575 CE</text><text class="wx-t wx-halo" x="420" y="150">fields revert to scrub:</text><text class="wx-t wx-halo" x="420" y="166">"bitter fruit, tamarisk bushes,</text><text class="wx-t wx-halo" x="420" y="182">and a few lote trees" (34:16)</text></g><text class="wx-t-s" x="24" y="494">After DAI survey work; dam length and heights from published figures, layout simplified.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Flash floods: a few times a year, rain in the highlands sends a torrent down the Wadi Dhana.</p><ol class="wx-steplist"><li>Flash floods: a few times a year, rain in the highlands sends a torrent down the Wadi Dhana.</li><li>The dam, about 580 m long, holds the flood briefly and lifts it to stone sluices at each end.</li><li>Canals carry the silty water to two oases, north and south of the wadi: about 100 km² of fields, &#x27;two gardens&#x27;.</li><li>Silt raises the fields, so the dam is raised: about 4 m at first, about 7 m by c. 500 BCE, about 14 m in its last phase.</li><li>After breaches in 449–450 and 548 CE, a flood around 570–575 CE overtops the dam. It is not rebuilt, and the gardens revert to scrub.</li></ol><figcaption>Tap through five stages, from flash flood to final breach. The plan is schematic; the dam&#x27;s length and heights follow published figures. <span class="wx-src">Based on: Dam length and heights: Brunner 1983; Simpson (ed.) 2002; breach dates: Vogt 2004; layout of oases after UNESCO 2023 and DAI surveys, simplified.</span></figcaption><p class="vh">A schematic plan with north at the top. Wadi Dhana runs from west to east through a gap between two hill masses. Step 1: blue dashes show a flash flood coming down the wadi toward a dam that spans the gap, with a stone sluice at each end. Step 2: water ponds behind the dam, about 580 metres long, rising to the sluices. Step 3: canals carry water from the northern sluice to a large green north oasis with Marib city, and from the southern sluice to a south oasis with the Awam temple; a caption quotes Quran 34:15 on two gardens. Step 4: an inset section shows the dam raised from about 4 metres to about 7 and finally about 14 metres. Step 5: the middle of the dam is breached around 570 to 575 CE, water runs through the gap, and both oases fade to sandy scrub.</p></figure><p>The Great Dam of Marib was not a reservoir in the modern sense. A few times a year, rain in the highlands sent a torrent down the Wadi Dhana. The dam, about 580 m long, held the flood just long enough to lift it to stone sluices at either end, which fed canals running to two vast irrigated oases, one north of the wadi and one south of it. German surveys estimated around 100 km² of fields. As silt raised the fields, the dam had to be raised too, from about 4 m to about 7 m and finally about 14 m.</p><p>It failed more than once. Breaches in 449–450 CE were repaired. In 548 CE the ruler Abraha repaired it again and carved a long inscription about it. Around 570–575 CE the flood overtopped the dam and it was not rebuilt. The oases dried back toward desert scrub. The final collapse fell within living memory of the generation that first heard the Quran, and its ruins still stand: the two sluice buildings, with the gap where the dam wall used to be.</p></section><section class="wsec" id="sheba-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Where is the queen?</h3><p>The difficulty is the calendar. Solomon&#x27;s reign is traditionally placed in the 10th century BCE. Saba&#x27;s monumental inscriptions start in the 8th. The earliest rulers they name, the mukarribs, are all men. Assyria did record powerful Arabian queens, Zabibe in 738 BCE and Samsi a few years later, but they led tribes of northern Arabia, not Saba.</p><p>Other clues cut both ways. Camel caravans were the engine of the incense trade, and camel bones from the copper mines of the Arabah show domestic camels arriving in the southern Levant only in the last decades of the 10th century BCE. Frankincense residue on an altar at Arad in Judah dates to the 8th century. That fits a trade that boomed after Solomon. Yet in 2021 the epigrapher Daniel Vainstub reread a short inscription on a 10th-century jar from Jerusalem&#x27;s Ophel as South Arabian Sabaic, naming an incense ingredient. If he is right, Sabaean traders were in Jerusalem in Solomon&#x27;s century. Other specialists read the same letters as a local script.</p><aside class="wcall"><b>Fresh from the field</b><p>In 2023 UNESCO placed seven Sabaean sites at Marib, including the dam, the Awam and Bar&#x27;an temples and the city of Sirwah, on both the World Heritage List and the List of World Heritage in Danger, citing damage and risk from Yemen&#x27;s war.</p></aside></section><section class="wsec" id="sheba-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The case for the queen</h3><p>Challengers point out that Saba did not stay on its own shore. Sabaean inscriptions and a Sabaean-style temple at Yeha in the Ethiopian highlands, built around the 8th–7th century BCE, show settlers or elites from South Arabia across the Red Sea. The Ethiopian claim to the queen, written down late, stands on real contact. The Egyptologist Kenneth Kitchen argued that early Sabaean chronology may run longer than the inscriptions show, leaving room for a 10th-century kingdom. In 2012 the archaeologist Louise Schofield announced an ancient gold mine and temple in northern Ethiopia that she linked to the queen&#x27;s wealth; the link has not been independently confirmed.</p><p>The strongest argument is about what has not been dug. Marib is one of the least excavated great capitals of the ancient world. Wendell Phillips&#x27; expedition to the Awam temple in 1951–52 ended in a hurried escape, and work resumed only decades later. A 10th-century queen could be waiting in an unexcavated layer, or could have left nothing that survives.</p></section><section class="wsec" id="sheba-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What would settle it</h3><p>Since 2015 war has closed Marib to archaeologists, and an airstrike damaged the ancient dam. Looted inscriptions appear on the antiquities market without context. The evidence that could answer this case is still in the ground, and some of it is being lost.</p><ul class="wlist"><li>A Sabaean inscription naming a ruling queen, or contact with Israel or Judah.</li><li>Securely dated 10th-century BCE monuments at Marib or Sirwah.</li><li>Agreement on the script and reading of the Ophel jar.</li><li>Incense residues from 10th-century Jerusalem.</li></ul><p>Until then the verdict is split in an interesting way. The queen&#x27;s journey awaits evidence. The Quran&#x27;s portrait of Saba&#x27;s two gardens and the flood of the dam stands on solid ground.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">715 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Sargon II records tribute from It&#x27;amra of Saba</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">685 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Karib-il of Saba sends gifts to Sennacherib</span></li><li class="wtl-build" style="--i:2"><span class="wtl-y">500 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Marib dam raised to about 7 m</span></li><li class="wtl-loss" style="--i:3"><span class="wtl-y">450 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Dam breached and repaired</span></li><li class="wtl-build" style="--i:4"><span class="wtl-y">548 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Abraha repairs the dam and records it in stone</span></li><li class="wtl-loss" style="--i:5"><span class="wtl-y">572 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Final breach, c. 570–575; the oases decline</span></li><li class="wtl-event" style="--i:6"><span class="wtl-y">1322 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Kebra Nagast recorded in Ethiopia</span></li><li class="wtl-find" style="--i:7"><span class="wtl-y">1951 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Wendell Phillips excavates the Awam temple</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2023 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Marib sites inscribed by UNESCO as World Heritage in Danger</span></li></ol><details class="srcs"><summary>Sources for this case (11)</summary><ol><li>Simpson St J. (ed.) (2002). Queen of Sheba: Treasures from Ancient Yemen. British Museum Press.</li><li>UNESCO World Heritage Centre (2023). Landmarks of the Ancient Kingdom of Saba, Marib (property 1700).</li><li>Brunner U. (1983). Die Erforschung der antiken Oase von Marib mit Hilfe geomorphologischer Untersuchungsmethoden. Archäologische Berichte aus dem Yemen 2. Philipp von Zabern.</li><li>Vogt B. (2004). Towards a new dating of the great dam of Marib. Proceedings of the Seminar for Arabian Studies 34: 377–388.</li><li>Eph&#x27;al I. (1982). The Ancient Arabs: Nomads on the Borders of the Fertile Crescent, 9th–5th Centuries BC. Magnes Press.</li><li>Sapir-Hen L., Ben-Yosef E. (2013). The introduction of domestic camels to the southern Levant: evidence from the Aravah Valley. Tel Aviv 40: 277–285. <a href="https://doi.org/10.1179/033443513X13753505864089" target="_blank" rel="noopener">doi:10.1179/033443513X13753505864089</a></li><li>Arie E., Rosen B., Namdar D. (2020). Cannabis and frankincense at the Judahite shrine of Arad. Tel Aviv 47: 5–28. <a href="https://doi.org/10.1080/03344355.2020.1732046" target="_blank" rel="noopener">doi:10.1080/03344355.2020.1732046</a></li><li>Vainstub D. (2021/2022). Incense from Sheba for the Jerusalem Temple: a Sabaic inscription from the Ophel. Jerusalem Journal of Archaeology.</li><li>Kitchen K. A. (2003). On the Reliability of the Old Testament. Eerdmans.</li><li>Budge E. A. W. (trans.) (1922). The Queen of Sheba and Her Only Son Menyelek (Kebra Nagast). Medici Society.</li><li>The Quran, trans. M. A. S. Abdel Haleem (2004). Oxford University Press.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-sheba" data-t="The Queen of Sheba and the Flood of the Dam"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Queen of Sheba and the Flood of the Dam</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-sheba</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-solomon-mines-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Timna pools.jpg" data-cap="The Timna valley, Israel" data-big><figcaption></figcaption></figure><div class="sh-k">Peoples of the Sacred Texts</div><h2 class="sh-t" id="case-solomon-mines-st" tabindex="-1">King Solomon&#x27;s Mines: Right Century, Whose Kingdom?</h2><p class="sh-s">Two scriptures link Solomon with a flood of copper. Radiocarbon put a copper boom right in his century, then asked who really ran it.</p><div class="sh-v"><span class="vstamp vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><p class="sh-claim"><b>What the stamp rates:</b> Industrial-scale copper production flourished in the Arabah (Faynan and Timna) during the 10th century BCE, the century tradition gives to Solomon.</p><p class="sh-claim"><b>The text's own words:</b> <span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span> <span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span> <span class="sh-more">(line by line below)</span></p></div><p class="v4-q">Were the Arabah copper mines booming in Solomon&#x27;s day, and whose were they?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>For decades guidebooks called King Solomon&#x27;s mines a myth.</li><li>Hundreds of radiocarbon dates from copper camps in the Arabah now show a boom in the 10th and 9th centuries BCE.</li><li>That is the century tradition gives to Solomon, with slag layers six metres deep.</li><li>Nothing ties the mines to Jerusalem; most researchers credit a local, largely nomadic kingdom.</li><li>The century is established; the owner is open.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Chemistry</span><span class="thr">Texts and scripts</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="6" >6</b><span class="ctr
