-u"> m</span></div><div class="ctr-l">depth of the slag mound excavated at Khirbat en-Nahas</div><div class="ctr-c">Levy et al. 2008</div></div><div class="ctr"><div class="ctr-v">some <b class="ctr-n" data-v="100" >100</b><span class="ctr-u"> buildings</span></div><div class="ctr-l">at Khirbat en-Nahas</div><div class="ctr-c">Levy et al. 2008</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="925" >925</b><span class="ctr-u"> BCE</span></div><div class="ctr-l">Sheshonq I&#x27;s campaign, linked to the technological leap</div><div class="ctr-c">Ben-Yosef et al. 2019</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="103" >103</b><span class="ctr-u"> dates</span></div><div class="ctr-l">radiocarbon dates from Iron Age Jerusalem in a 2024 study</div><div class="ctr-c">Regev et al. 2024</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Industrial-scale copper production flourished in the Arabah (Faynan and Timna) during the 10th century BCE, the century tradition gives to Solomon.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:91.7%" role="img" aria-label="Weight of evidence: Established"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Independent teams on both sides of the modern border, using hundreds of radiocarbon dates, slag chemistry, stratigraphy and organic finds, agree that the Arabah copper industry peaked in the 10th and 9th centuries BCE. That is as firm as Iron Age dating gets. What is not established is the link to Solomon: nothing ties the mines to Jerusalem, and most researchers credit a local, largely nomadic polity. The century is right. The owner remains an open question.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">From the 1970s many guidebooks and textbooks said flatly that &#x27;Solomon&#x27;s mines&#x27; were a myth, because Rothenberg had found an Egyptian shrine at Timna. That was overconfident about the date: radiocarbon moved the peak back into the 10th century. It remains fair about the owner. Some popular accounts now swing too far the other way, treating the dates as confirmation of Solomon&#x27;s empire.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>High-precision radiocarbon dating at Khirbat en-Nahas in Faynan shows large-scale copper smelting in the 10th and 9th centuries BCE, with slag layers more than 6 m deep.<small>Levy et al. 2008</small></li><li>At Timna, about 100 km to the south, smelting camps such as Site 30 and &#x27;Slaves&#x27; Hill&#x27; date mainly from the 11th to 9th centuries BCE.<small>Ben-Yosef et al. 2012</small></li><li>An Egyptian shrine to Hathor at Timna shows an earlier phase of mining under New Kingdom Egypt in the 13th–12th centuries BCE.<small>Rothenberg 1972</small></li><li>Slag chemistry shows a sudden jump in efficiency and standardisation in the late 10th century BCE, which its authors link to the campaign of Pharaoh Sheshonq I around 925 BCE.<small>Ben-Yosef et al. 2019 PLOS ONE</small></li><li>Textiles dyed with true royal purple were found at Timna in layers of about 1000 BCE, a sign of a wealthy, well-connected elite.<small>Sukenik et al. 2021</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Who controlled the mines: an early Edomite kingdom of largely nomadic people, a chiefdom based at Tel Masos in the Beersheba Valley, or Jerusalem.</li><li>How large and powerful Jerusalem was in the 10th century BCE: the &#x27;Low Chronology&#x27; of Israel Finkelstein versus the modified conventional chronology of Amihai Mazar.</li><li>Whether monumental buildings in Jerusalem excavated by Eilat Mazar belong to the time of David and Solomon.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>No inscription from the Arabah names its rulers, Solomon or any king of Edom.</li><li>Nomadic tent camps leave little behind, so the society that ran the mines is known mostly from its industrial waste.</li><li>Jerusalem&#x27;s 10th-century layers lie under a living city and have been dug in small patches for over 150 years.</li></ul></div></div><h3 class="sub-h wsub">How the traditions tell it</h3><div class="v4texts"><blockquote class="quote v4q"><span class="v4q-t">Quran · 34:12–13</span><p>We made a fountain of molten brass flow for him ... They made him whatever he wanted- palaces, statues, basins as large as water troughs, fixed cauldrons.</p><cite>trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Hebrew Bible · 1 Kings 7:45–46</span><p>The pots, the shovels, and the basins, all these vessels that Hiram made for King Solomon for the house of the Lord were of burnished bronze. In the plain of the Jordan the king cast them, in the clay ground between Succoth and Zarethan.</p><cite>New Revised Standard Version Updated Edition (2021)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Hebrew Bible · Deuteronomy 8:9</span><p>a land whose stones are iron and from whose hills you may mine copper.</p><cite>New Revised Standard Version Updated Edition (2021)</cite></blockquote></div><h3 class="sub-h wsub">In the text's own words</h3><p class="rd-rule">Each line rates only what the text itself says, not later dates, commentaries or modern identifications.</p><ul class="rds"><li class="rd"><p class="rd-s">Copper flowed for Solomon, and craftsmen made great basins and fixed cauldrons (Quran 34:12–13; 1 Kings 7:45–46).</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">Industrial copper smelting at Faynan and Timna peaked in exactly the 10th century BCE, and Iron Age bronze casting in the Jordan valley is attested.</p></li><li class="rd"><p class="rd-s">That this industry worked for Solomon&#x27;s kingdom.</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">The smelters may have been run by an Edomite or local polity that traded with Jerusalem. The texts and the slag heaps agree on the century; who controlled the mines is still argued.</p></li></ul><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Today most specialists accept that the Arabah was an industrial copper district in the 10th century BCE, the era the Bible gives to David and Solomon. Most also credit the operation to local people, the early Edomites or related desert groups, rather than to Jerusalem. The name &#x27;King Solomon&#x27;s Mines&#x27;, coined by Nelson Glueck in the 1930s after H. Rider Haggard&#x27;s novel, is treated as a romantic label: right about the date, unproven about the owner.</p><ul><li>Faynan and Timna lie in Edom&#x27;s territory, well south of Judah&#x27;s core.</li><li>The smelting camps show local pottery, desert livestock and long-distance trade, not Judahite administration.</li><li>Genesis 36:31 itself lists kings who &#x27;reigned in the land of Edom, before any king reigned over the Israelites&#x27;.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>For a generation, a school led by Israel Finkelstein argued that 10th-century Judah was a thinly settled hill chiefdom and that the grand kingdom of Solomon was a later projection. Levy&#x27;s radiocarbon dates from Faynan and Ben-Yosef&#x27;s from Timna challenged the idea that the 10th century was an empty age. Ben-Yosef goes further: if semi-nomads could run an industrial copper economy while leaving almost no stone buildings, archaeologists may have underestimated societies, including early Israel and Judah, whose power did not take the form of monuments. Eilat Mazar claimed to have found David&#x27;s palace in Jerusalem.</p><ul><li>Radiocarbon at Khirbat en-Nahas put the boom in the 10th century, earlier than Finkelstein had argued.</li><li>Timna&#x27;s purple cloth and imported food show wealth that tent camps would otherwise hide.</li><li>A 2024 study of 103 radiocarbon dates from Jerusalem found building and occupation through the 12th–10th centuries BCE.</li></ul><div class="face-s"><b>Its strongest point</b><p>The Arabah shows that a powerful, organised society can be almost invisible if you look only for palaces. That undercuts the main argument used to shrink 10th-century kingdoms, though it does not show that Solomon owned these mines.</p></div><p class="face-cr"><b>Credit</b> Thomas E. Levy; Erez Ben-Yosef; Eilat Mazar; Amihai Mazar (against Israel Finkelstein&#x27;s Low Chronology)</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>An inscription or seal from Faynan or Timna naming a ruler, a kingdom or a destination for the copper.</li><li>Lead-isotope matches between Arabah copper and securely dated 10th-century bronzes from Jerusalem or the Jordan Valley.</li><li>Well-dated excavation of 10th-century administrative buildings in Jerusalem, published with radiocarbon sequences.</li><li>Excavation of the living quarters of the Arabah workforce, to show who they were and where they came from.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,153 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of King Solomon&#x27;s Mines: Right Century, Whose Kingdom?"><button type="button" class="wtoc-i" data-go="solomon-mines-s1">A fountain of molten copper</button><button type="button" class="wtoc-i" data-go="solomon-mines-s2">A name that flipped three times</button><button type="button" class="wtoc-i" data-go="solomon-mines-s3">An industrial landscape in the desert</button><button type="button" class="wtoc-i" data-go="solomon-mines-s4">Edom, Judah or a desert chiefdom?</button><button type="button" class="wtoc-i" data-go="solomon-mines-s5">Finkelstein versus Mazar</button><button type="button" class="wtoc-i" data-go="solomon-mines-s7">Solomon in two scriptures</button><button type="button" class="wtoc-i" data-go="solomon-mines-s6">What time hid, and what would settle it</button></nav></div><section class="wsec" id="solomon-mines-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A fountain of molten copper</h3><p>Both scriptures surround Solomon with metal. The Hebrew Bible describes the bronze pillars, basins and a vast &#x27;sea&#x27; cast for his Temple &#x27;in the plain of the Jordan&#x27;, and calls the promised land a place &#x27;from whose hills you may mine copper&#x27;. The Quran, speaking of Solomon, or Sulayman, as a prophet-king granted extraordinary gifts, says: &#x27;We made a fountain of molten brass flow for him&#x27;, and lists what was made for him: palaces, statues, basins like troughs, great fixed cauldrons.</p><p>In 1885 H. Rider Haggard gave the world a novel called King Solomon&#x27;s Mines, set in southern Africa. Fifty years later the American archaeologist Nelson Glueck walked the Wadi Arabah, the long desert valley between the Dead Sea and the Red Sea, and found hills of black slag, the glassy waste of copper smelting. He borrowed Haggard&#x27;s title. The name stuck, then fell, then came back.</p></section><section class="wsec" id="solomon-mines-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>A name that flipped three times</h3><p>Glueck dated the smelting sites to the 10th century BCE by their pottery and credited them to Solomon. In 1969 the Israeli archaeologist Beno Rothenberg uncovered a small shrine to the Egyptian goddess Hathor at Timna, beneath the striking sandstone cliffs now called Solomon&#x27;s Pillars. It was full of Egyptian objects of the 13th and 12th centuries BCE. Rothenberg concluded that the mines were Egyptian and older than Solomon. For thirty years guidebooks said &#x27;Solomon&#x27;s mines&#x27; were a myth.</p><p>Then came radiocarbon. From 2002 Thomas Levy and Mohammad Najjar excavated Khirbat en-Nahas, &#x27;ruins of copper&#x27; in Arabic, in the Faynan district of Jordan. They cut through more than 6 m of slag and dated charcoal and seeds layer by layer. The biggest phase of production fell in the 10th and 9th centuries BCE. At Timna, Erez Ben-Yosef&#x27;s team found the same: most smelting camps were active from the 11th to the 9th centuries. The mines were booming in exactly the century the Bible gives Solomon.</p><blockquote class="wpull"><p>The mines were booming in exactly the century the Bible gives Solomon. The question is who owned them.</p></blockquote></section><section class="wsec" id="solomon-mines-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>An industrial landscape in the desert</h3><p>Khirbat en-Nahas covers about 10 hectares, with around 100 buildings, a fortress with a four-chambered gate, and slag heaps over 6 m deep. Miners followed veins and nodules of green copper ore in the sandstone. Smelters mixed crushed ore with charcoal and flux and fired it in small clay furnaces driven by bellows.</p><figure class="wx wx--steps" id="solomon-mines-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">From green ore to copper, and the 10th-century leap</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="From green ore to copper, and the 10th-century leap"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" class="wx-svg" role="img" aria-labelledby="solomon-mines-f1-t"><title id="solomon-mines-f1-t">Step-through of Iron Age copper smelting in the Arabah: mining, preparing the charge, smelting, tapping slag, and the late 10th century technological leap</title><defs><marker id="solomon-mines-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text class="wx-t-cap" x="24" y="30">From ore to copper in the Arabah, c. 1000 BCE</text><path class="wx-sand wx-edge-soft" d="M20,330 H700 V380 H20 Z"/><path class="wx-soil wx-edge-soft" d="M20,330 V120 C60,100 120,96 190,118 L210,330 Z"/><path class="wx-rock wx-o60" d="M20,170 C80,160 140,164 200,172 L202,184 C140,176 80,174 20,182 Z"/><g class="wx-st" data-s="1"><path class="wx-paper wx-edge" d="M100,112 H116 V286 H170 V304 H100 Z"/><circle class="wx-c3" cx="176" cy="292" r="5"/><circle class="wx-c3" cx="186" cy="300" r="4"/><circle class="wx-c3" cx="150" cy="316" r="4"/><circle class="wx-c3" cx="72" cy="258" r="4"/><path class="wx-line" d="M140,300 L140,288 M136,304 L140,300 L144,304 M134,292 L146,286"/><circle class="wx-inkfill" cx="140" cy="284" r="3"/><circle class="wx-num" cx="40" cy="100" r="9"/><text class="wx-numt" x="40" y="104" text-anchor="middle">1</text><text class="wx-t-b" x="56" y="84">Mine</text><text class="wx-t-s" x="30" y="352">shaft and gallery</text><text class="wx-t-s" x="30" y="366">in sandstone</text><text class="wx-t-s wx-halo" x="190" y="276" text-anchor="end">green ore</text></g><g class="wx-st" data-s="2"><rect class="wx-stone3 wx-edge" x="236" y="314" width="46" height="16" rx="3"/><ellipse class="wx-rock wx-edge" cx="262" cy="304" rx="11" ry="8"/><path class="wx-c3 wx-edge-soft" d="M288,330 Q300,304 312,330 Z"/><path class="wx-rock wx-edge" d="M316,330 Q329,300 342,330 Z"/><path class="wx-c4 wx-edge-soft" d="M346,330 Q356,308 366,330 Z"/><text class="wx-t-s" x="300" y="352" text-anchor="middle">ore</text><text class="wx-t-s" x="329" y="366" text-anchor="middle">charcoal</text><text class="wx-t-s" x="358" y="352" text-anchor="middle">flux</text><circle class="wx-num" cx="244" cy="224" r="9"/><text class="wx-numt" x="244" y="228" text-anchor="middle">2</text><text class="wx-t-b" x="260" y="228">Crush and mix</text></g><g class="wx-st" data-s="3"><path class="wx-stone3 wx-edge" d="M446,330 V226 H514 V330 Z"/><path class="wx-paper" d="M460,322 V226 H500 V322 Z"/><path class="wx-fire" d="M460,322 V270 Q480,250 500,270 V322 Z"/><ellipse class="wx-glow wx-pulse" cx="480" cy="300" rx="12" ry="16"/><path class="wx-bold" d="M410,302 H458"/><path class="wx-c4 wx-edge" d="M442,296 H462 V308 H442 Z"/><path class="wx-wood wx-edge" d="M370,286 Q400,280 410,302 Q400,322 370,316 Z"/><path class="wx-flow wx-s4" d="M380,302 H456"/><circle class="wx-num" cx="446" cy="180" r="9"/><text class="wx-numt" x="446" y="184" text-anchor="middle">3</text><text class="wx-t-b" x="462" y="184">Smelt</text><text class="wx-t-s" x="462" y="200">c. 1,200 °C</text><text class="wx-t-s" x="388" y="276" text-anchor="middle">bellows</text><text class="wx-t-s" x="436" y="352">tuyère</text></g><g class="wx-st" data-s="4"><ellipse class="wx-bronze wx-edge" cx="480" cy="318" rx="12" ry="4"/><path class="wx-metal wx-edge" d="M514,316 Q540,318 560,330 H514 Z"/><path class="wx-metal wx-edge" d="M580,330 Q610,260 650,256 Q684,260 700,330 Z"/><path class="wx-rock wx-edge" d="M600,330 Q630,290 670,300 L690,330 Z"/><circle class="wx-num" cx="596" cy="220" r="9"/><text class="wx-numt" x="596" y="224" text-anchor="middle">4</text><text class="wx-t-b" x="612" y="224">Tap slag</text><text class="wx-t-s" x="600" y="352">slag mounds,</text><text class="wx-t-s" x="600" y="366">metres deep</text><text class="wx-t-s" x="484" y="366" text-anchor="middle">copper</text></g><g class="wx-st wx-hide" data-only="5"><rect class="wx-card wx-edge-soft" x="250" y="44" width="450" height="118" rx="10"/><circle class="wx-num" cx="270" cy="66" r="9"/><text class="wx-numt" x="270" y="70" text-anchor="middle">5</text><text class="wx-t-b" x="286" y="70">The late 10th-century leap: copper wasted in slag</text><text class="wx-t-s" x="266" y="104">before, small tuyères</text><rect class="wx-c4 wx-growx" x="400" y="94" width="240" height="14" rx="2"/><text class="wx-t-s" x="266" y="134">after, large tuyères</text><rect class="wx-c3 wx-growx" x="400" y="124" width="107" height="14" rx="2"/><text class="wx-t-s" x="514" y="135">about 55% less</text><text class="wx-t-s" x="266" y="154">relative average copper left in slag, Ben-Yosef et al. 2019</text></g><text class="wx-t-s" x="24" y="408">Schematic. Furnace and bellows simplified from excavated Iron Age furnace remains at Timna and Faynan.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Mine: shafts and galleries cut into the sandstone reach nodules of green copper ore.</p><ol class="wx-steplist"><li>Mine: shafts and galleries cut into the sandstone reach nodules of green copper ore.</li><li>Prepare the charge: crush the ore and mix it with charcoal and a flux of iron and manganese oxides.</li><li>Smelt: bellows drive air through a clay tuyère; at around 1,200 °C the ore gives up its copper.</li><li>Tap: liquid slag runs off and the copper collects below. Waste slag builds mounds metres deep.</li><li>The leap: in the late 10th century BCE, larger tuyères and standard recipes left about 55% less copper in the slag.</li></ol><figcaption>Tap through the Arabah copper process: mine, prepare, smelt, tap, and the late 10th-century technological leap measured in the slag. <span class="wx-src">Based on: Process after Levy et al. 2008 and Ben-Yosef et al. 2012; slag comparison from Ben-Yosef et al. 2019 (PLOS ONE), shown as relative values; furnace simplified.</span></figcaption><p class="vh">A side-view strip. On the left, a sandstone cliff with a mine shaft and gallery where a miner reaches green ore nodules. Step 2: a stone anvil and hammer stone beside three small heaps of green ore, black charcoal and red flux. Step 3: a clay shaft furnace glowing inside, fed by leather bellows through a clay tuyère, labelled about 1,200 degrees Celsius. Step 4: dark slag runs from the furnace, copper collects at its base, and black slag mounds build up on the right. Step 5: an inset bar chart compares copper left in slag before and after the late 10th-century leap, showing about 55 per cent less after larger tuyères were introduced.</p></figure><p>The chemistry of the slag tells a story of its own. In 2019 Ben-Yosef, Levy and colleagues showed that the Arabah industry improved gradually for three centuries and then leapt forward in the late 10th century BCE: larger tuyères and furnaces, standardised recipes, and far less copper wasted in the slag. They linked the leap to the Egyptian pharaoh Sheshonq I, whose campaign into the region around 925 BCE is recorded at Karnak; a scarab with his throne name was found in Faynan. At Timna, fragments of cloth dyed with true royal purple, made from Mediterranean sea snails, date to about 1000 BCE. Somebody here was rich.</p><aside class="wcall"><b>How do we know?</b><p>Slag is a chemical diary. The less copper left in it, the better the furnace worked. Hundreds of slag samples from dated layers let researchers chart efficiency through time, and radiocarbon on short-lived seeds and twigs in the same layers gives the dates.</p></aside></section><section class="wsec" id="solomon-mines-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Edom, Judah or a desert chiefdom?</h3><p>The mines lie in the land the Bible calls Edom, south of the Dead Sea. The camps show desert pottery, donkeys and goats, and very few stone houses. Most excavators credit a largely nomadic Edomite polity. Genesis 36:31 even lists &#x27;the kings who reigned in the land of Edom, before any king reigned over the Israelites&#x27;. Israel Finkelstein argues instead that the copper trade was run from Tel Masos, a hub in the Beersheba Valley, and moved west to the coast and to Egypt.</p><p>Nothing found so far ties the Arabah to Jerusalem. There is no Judahite inscription, seal or administrative building in the mines. The Bible itself never says Solomon mined in the Arabah; it places his bronze casting in the Jordan Valley, far to the north. Where Arabah copper went is partly traceable: lead-isotope studies have matched some bronze tripods offered at Olympia in Greece, from about 950–750 BCE, to Faynan ore.</p></section><section class="wsec" id="solomon-mines-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Finkelstein versus Mazar</h3><p>The mines matter because they sit inside a long argument about how big Solomon&#x27;s kingdom was. Finkelstein&#x27;s &#x27;Low Chronology&#x27; moves many buildings once called Solomonic into the 9th century and sees 10th-century Jerusalem as a modest highland town. Amihai Mazar defends a &#x27;modified conventional chronology&#x27; in which a real, if smaller, kingdom existed in the 10th century. His cousin Eilat Mazar, excavating in the City of David from 2005, claimed a massive building as David&#x27;s palace; many colleagues doubted her dating.</p><p>Ben-Yosef turned the Arabah into an argument about method. If a society with barely any stone architecture could run one of the largest copper industries of its age, then an absence of palaces is weak evidence that a kingdom was weak. In 2024 Johanna Regev and colleagues published 103 radiocarbon dates from Jerusalem, showing occupation and building across the 12th to 10th centuries BCE; Finkelstein responded with reservations. The argument is live, and the Arabah is now evidence on both sides.</p></section><section class="wsec" id="solomon-mines-s7"><h3 class="wsec-h"><span class="wsec-n">06</span>Solomon in two scriptures</h3><p>The Hebrew Bible&#x27;s Solomon is a builder, a trader and a sage. Beyond the Temple bronzes, 1 Kings 9:26 says he built ships &#x27;at Ezion-geber, which is near Eloth on the shore of the Red Sea&#x27;, at the southern tip of the very valley where the mines lie. Glueck thought he had found Ezion-geber at Tell el-Kheleifeh near Aqaba; later study of the pottery moved that site&#x27;s main phases to the 8th–6th centuries BCE, so the port of Solomon&#x27;s fleet remains unlocated.</p><p>The Quran&#x27;s Sulayman is a prophet-king, son of David, and the gifts of metal run in the family. Of David it says &#x27;We softened iron for him&#x27; and told him to make coats of mail. Of Solomon it says a fountain of molten brass was made to flow for him, and it closes with a charge: &#x27;Work thankfully, family of David, for few of my servants are truly thankful.&#x27; Classical commentators mostly understood the fountain as a miraculous spring of molten metal; some modern readers see in it a mastery of casting on a grand scale. Either way the verse is about gifts and gratitude, not mining logistics, and archaeology cannot test a miracle. What it can say is warm and specific: the generation the tradition remembers lived in the one century when copper was flowing out of the southern Levant on an industrial scale.</p><blockquote class="wpull"><p>The Quran&#x27;s Solomon is surrounded by flowing copper, and so, archaeology now shows, was his century.</p></blockquote></section><section class="wsec" id="solomon-mines-s6"><h3 class="wsec-h"><span class="wsec-n">07</span>What time hid, and what would settle it</h3><p>Nomads leave hearths and dung, not archives. Jerusalem&#x27;s 10th-century layers lie under a living city. No inscription from the Arabah names a king. The Quran&#x27;s image of copper flowing for Solomon, and the Bible&#x27;s bronze Temple, are set in an age when, archaeology now shows, copper really was pouring out of the southern desert. Who held the ladle is still unknown.</p><ul class="wlist"><li>An inscription or seal from Faynan or Timna naming a ruler or buyer.</li><li>Lead-isotope matches between Arabah copper and dated 10th-century bronzes from Jerusalem or the Jordan Valley.</li><li>Published radiocarbon sequences for 10th-century public buildings in Jerusalem.</li><li>Excavation of the workers&#x27; own camps to learn who they were.</li></ul></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-use" style="--i:0"><span class="wtl-y">1,250 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Egyptian mining at Timna; Hathor shrine in use</span></li><li class="wtl-use" style="--i:1"><span class="wtl-y">1,000 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Royal purple cloth at Timna; Arabah copper booming</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">925 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Sheshonq I&#x27;s campaign; smelting technology leaps</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">1885 CE</span><span class="wtl-k">Event</span><span class="wtl-t">H. Rider Haggard publishes King Solomon&#x27;s Mines</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">1934 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Nelson Glueck surveys the Arabah and names the mines for Solomon</span></li><li class="wtl-find" style="--i:5"><span class="wtl-y">1969 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Beno Rothenberg uncovers the Egyptian Hathor shrine at Timna</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2008 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Levy&#x27;s team publishes 10th-century dates from Khirbat en-Nahas</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2024 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Regev et al. publish 103 radiocarbon dates for Jerusalem</span></li></ol><details class="srcs"><summary>Sources for this case (12)</summary><ol><li>Levy T. E. et al. (2008). High-precision radiocarbon dating and historical biblical archaeology in southern Jordan. PNAS 105: 16460–16465. <a href="https://doi.org/10.1073/pnas.0804950105" target="_blank" rel="noopener">doi:10.1073/pnas.0804950105</a></li><li>Ben-Yosef E. et al. (2012). A new chronological framework for Iron Age copper production at Timna (Israel). BASOR 367: 31–71. <a href="https://doi.org/10.5615/bullamerschoorie.367.0031" target="_blank" rel="noopener">doi:10.5615/bullamerschoorie.367.0031</a></li><li>Ben-Yosef E., Liss B., Yagel O. A., Tirosh O., Najjar M., Levy T. E. (2019). Ancient technology and punctuated change: detecting the emergence of the Edomite Kingdom in the Southern Levant. PLOS ONE 14(9): e0221967. <a href="https://doi.org/10.1371/journal.pone.0221967" target="_blank" rel="noopener">doi:10.1371/journal.pone.0221967</a></li><li>Ben-Yosef E. (2019). The architectural bias in current biblical archaeology. Vetus Testamentum 69: 361–387. <a href="https://doi.org/10.1163/15685330-12341370" target="_blank" rel="noopener">doi:10.1163/15685330-12341370</a></li><li>Sukenik N. et al. (2021). Early evidence of royal purple dyed textile from Timna Valley (Israel). PLOS ONE 16(1): e0245897. <a href="https://doi.org/10.1371/journal.pone.0245897" target="_blank" rel="noopener">doi:10.1371/journal.pone.0245897</a></li><li>Regev J., Gadot Y., Uziel J., Chalaf O. et al. (2024). Radiocarbon chronology of Iron Age Jerusalem reveals calibration offsets and architectural developments. PNAS 121. <a href="https://doi.org/10.1073/pnas.2321024121" target="_blank" rel="noopener">doi:10.1073/pnas.2321024121</a></li><li>Rothenberg B. (1972). Timna: Valley of the Biblical Copper Mines. Thames and Hudson.</li><li>Glueck N. (1940). The Other Side of the Jordan. American Schools of Oriental Research.</li><li>Finkelstein I., Mazar A. (2007). The Quest for the Historical Israel: Debating Archaeology and the History of Early Israel (ed. B. B. Schmidt). Society of Biblical Literature.</li><li>Levy T. E., Najjar M., Ben-Yosef E. (eds) (2014). New Insights into the Iron Age Archaeology of Edom, Southern Jordan. Cotsen Institute of Archaeology Press.</li><li>Kiderlen M., Bode M., Hauptmann A., Bienert Y. (2016). Tripod cauldrons produced at Olympia give evidence for trade with copper from Faynan (Jordan) to South West Greece, c. 950–750 BCE. Journal of Archaeological Science: Reports 8: 303–313.</li><li>The Quran, trans. M. A. S. Abdel Haleem (2004). Oxford University Press.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-solomon-mines" data-t="King Solomon&#x27;s Mines: Right Century, Whose Kingdom?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>King Solomon&#x27;s Mines: Right Century, Whose Kingdom?</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-solomon-mines</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-moon-split-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Moon, Age 12d 6.5h, Lick Observation (R.A.S 26), 1033511.jpg" data-cap="The Moon photographed at Lick Observatory" data-big><figcaption></figcaption></figure><div class="sh-k">Peoples of the Sacred Texts</div><h2 class="sh-t" id="case-moon-split-st" tabindex="-1">The Splitting of the Moon: What a Rille Can&#x27;t Tell Us</h2><p class="sh-s">The Quran opens a chapter with the Moon split in two. The internet points to a lunar crack as the scar. The Moon itself has more to say.</p><div class="sh-v"><span class="vstamp vstamp--on vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg><span class="vs-tx"><span class="vs-on">Rille theory:</span>Ruled out</span></span></div><p class="sh-claim"><b>What the stamp rates:</b> The &#x27;lunar scar&#x27; claim: lunar rilles such as Rima Ariadaeus are physical marks left by the splitting of the Moon. (The event itself, a sign reported by witnesses, is not what is rated here.)</p><p class="sh-claim"><b>The text's own words:</b> <span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span> <span class="sh-more">(line by line below)</span></p></div><p class="v4-q">What can science test about the splitting of the Moon, and what can&#x27;t it?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>The Quran opens a chapter with the Moon split; witnesses in the hadith reports saw it in two above Mina.</li><li>Online, a 300-kilometre lunar crack, Rima Ariadaeus, is shared as the scar.</li><li>That crack is a strip of crust that dropped between faults; craters on it give ages of tens of millions of years.</li><li>A whole-Moon fracture would leave global traces of a different kind, and none are found.</li><li>Only the &#x27;scar&#x27; claim is rated here; the sign itself is a matter of faith, and neither the Quran nor the reports speak of marks left behind.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Astronomy</span><span class="thr">Geology</span><span class="thr">Religion and myth</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">about <b class="ctr-n" data-v="300" >300</b><span class="ctr-u"> km</span></div><div class="ctr-l">length of Rima Ariadaeus</div><div class="ctr-c">Wilhelms 1987</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="3474" >3,474</b><span class="ctr-u"> km</span></div><div class="ctr-l">diameter of the Moon</div><div class="ctr-c">NASA</div></div><div class="ctr"><div class="ctr-v">under <b class="ctr-n" data-v="50" >50</b><span class="ctr-u"> million years</span></div><div class="ctr-l">upper age of the youngest lunar grabens</div><div class="ctr-c">Watters et al. 2012</div></div><div class="ctr"><div class="ctr-v">about <b class="ctr-n" data-v="1400" >1,400</b><span class="ctr-u"> years</span></div><div class="ctr-l">since the reported event</div><div class="ctr-c">hadith chronology</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The &#x27;lunar scar&#x27; claim: lunar rilles such as Rima Ariadaeus are physical marks left by the splitting of the Moon. (The event itself, a sign reported by witnesses, is not what is rated here.)</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">This rating covers only the modern &#x27;lunar scar&#x27; claim, not the Quranic account or the miracle it describes. Rilles are explained by crustal stretching and ancient volcanism; craters that overprint even the youngest grabens give ages of tens of millions of years; rock samples show no recent Moon-wide remelting; and a single 300 km trough is not the shape a whole-Moon fracture would leave. The claim also asks more of the text than the text asks. Neither the Quran nor the hadith reports speak of marks left behind.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Planetary geology textbooks present rilles as grabens and lava channels with confidence, and that confidence is earned by crater counts, orbital imaging and samples. Where they are less certain is the precise age of individual rilles, which can carry error bars of tens of millions of years. None of that uncertainty stretches to 1,400 years.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Quran 54:1–2 links the nearing of the Hour with the Moon being split and describes people who see a sign and dismiss it as magic.<small>Quran 54:1–2</small></li><li>Reports in the hadith collections of al-Bukhari and Muslim, attributed to several Companions, describe the Moon seen split in two at Mina, with the Prophet saying &#x27;Be witnesses&#x27;.<small>Sahih al-Bukhari 3869, 3637; Sahih Muslim 2800a</small></li><li>Rima Ariadaeus, the lunar feature most often shared as a &#x27;scar&#x27;, is a graben about 300 km long: a strip of crust that dropped between parallel faults as the crust was stretched.<small>Wilhelms 1987; Watters et al. 2012</small></li><li>The youngest lunar grabens are estimated at less than about 50 million years old from the craters that overprint them; most rilles are far older.<small>Watters et al. 2012</small></li><li>NASA has stated that no current scientific evidence shows the Moon was split into parts and reassembled.<small>Bailey, NASA Lunar Science Institute, 2010</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether 54:1 describes a past event witnessed in Mecca, as most classical commentators held, or a sign still to come at the Hour, a reading several commentators recorded.</li><li>Whether a brief sign seen in Arabia at night would be expected to appear in chronicles elsewhere.</li><li>Whether the Kerala tradition of a king who saw the Moon split preserves any early memory; historians date its composition to centuries later.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Few astronomical logs survive from 7th-century Byzantium, Persia and India; China&#x27;s official records are fuller but selective.</li><li>Arabia before Islam had no tradition of written astronomical records that would log a night-time sign.</li></ul></div></div><h3 class="sub-h wsub">How the traditions tell it</h3><div class="v4texts"><blockquote class="quote v4q"><span class="v4q-t">Quran · 54:1–2</span><p>The Hour draws near; the moon is split in two. Whenever the disbelievers see a sign, they turn away and say, &#x27;Same old sorcery!&#x27;</p><cite>trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Quran · 54:1</span><p>The Hour has come near, and the moon has split [in two].</p><cite>trans. Sahih International (1997)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Hadith · Sahih al-Bukhari 3869</span><p>The moon was split (into two pieces) while we were with the Prophet (ﷺ) in Mina. He said, &#x27;Be witnesses.&#x27; Then a piece of the moon went towards the mountain.</p><cite>narrated by Abdullah ibn Mas&#x27;ud, trans. Muhammad Muhsin Khan</cite></blockquote></div><h3 class="sub-h wsub">In the text's own words</h3><p class="rd-rule">Each line rates only what the text itself says, not later dates, commentaries or modern identifications.</p><ul class="rds"><li class="rd"><p class="rd-s">The Hour draws near and the Moon is split (Quran 54:1).</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">Believers read it as a miracle witnessed at Mecca, or as a sign of the Hour still to come; both readings are old. Lunar samples show no physical trace of a recent split, and a miracle is by its nature beyond what instruments can test. The site rates only the modern claim that rilles are its scars.</p></li></ul><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Planetary scientists explain lunar rilles as ordinary features of lunar geology: grabens formed when the crust was pulled apart, and winding channels cut by ancient lava. Their ages, from crater counts and from rock samples, run from tens of millions to billions of years. A splitting and rejoining of the whole Moon would have left global traces of a different kind. On the event itself, science has little to say: it concerns a sign reported by witnesses, which Muslim scholars classify as a miracle rather than a natural process.</p><ul><li>Rima Ariadaeus is one linear graben among many; similar features exist on Mars and on Earth.</li><li>Craters sit on top of the youngest grabens, which gives them ages of tens of millions of years.</li><li>Apollo and Luna rocks give ages of about 3.1 to 4.5 billion years, with no sign of a recent global remelting.</li><li>Gravity mapping by the GRAIL mission found ancient intrusions deep in the crust, not a Moon-wide fracture.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Two very different cases are made. The classical case is historical: reports of the event come from several Companions through many chains, and the scholar al-Kattani counted it among the mass-transmitted reports. Its strongest form concerns the Quran&#x27;s first audience: the verses were recited in Mecca to hostile listeners and describe them seeing a sign and calling it magic. The modern case is physical: online posts and some popular lecturers, including Zaghloul El-Naggar, have presented images of lunar rilles as the scar of the split.</p><ul><li>Reports are attributed to Ibn Mas&#x27;ud, Anas ibn Malik, Ibn Abbas and Ibn Umar, among others.</li><li>The Quran speaks of the sign to people who were present and could have denied seeing anything.</li><li>Online, the 300 km Rima Ariadaeus is shown as a &#x27;crack&#x27; across the Moon.</li></ul><div class="face-s"><b>Its strongest point</b><p>The verses were proclaimed to opponents who had every reason to contradict them. Classical scholars argue that describing those listeners as having seen a sign and called it magic would have been easy to refute if nothing had been seen.</p></div><p class="face-cr"><b>Credit</b> Classical hadith scholars such as al-Kattani; online proponents of the &#x27;lunar scar&#x27;; the Egyptian geologist Zaghloul El-Naggar</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>A 7th-century astronomical or chronicle record from outside Arabia describing an unusual lunar appearance on a datable night.</li><li>Lunar samples or crater counts showing a Moon-wide resurfacing event about 1,400 years ago (none found so far).</li><li>Nothing physical can settle whether a sign was granted to witnesses; that question belongs to faith and to the historical study of the reports.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,161 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of The Splitting of the Moon: What a Rille Can&#x27;t Tell Us"><button type="button" class="wtoc-i" data-go="moon-split-s1">The Hour draws near</button><button type="button" class="wtoc-i" data-go="moon-split-s2">How Muslim scholars read the verse</button><button type="button" class="wtoc-i" data-go="moon-split-s3">The crack that went viral</button><button type="button" class="wtoc-i" data-go="moon-split-s4">Why rilles are not evidence either way</button><button type="button" class="wtoc-i" data-go="moon-split-s5">What a physical test could and could not show</button></nav></div><section class="wsec" id="moon-split-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The Hour draws near</h3><p>Surah 54 of the Quran is named al-Qamar, the Moon. It opens with two short verses that pair the end of time with a sign in the sky and a very human reaction to it.</p><blockquote class="quote"><p>The Hour draws near; the moon is split in two. Whenever the disbelievers see a sign, they turn away and say, &#x27;Same old sorcery!&#x27;</p><cite>Quran 54:1–2, trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><p>The hadith collections fill in a scene. Abdullah ibn Mas&#x27;ud recalls being with the Prophet at Mina, near Mecca, when the Moon was seen in two pieces, one going towards the mountain, and the Prophet said, &#x27;Be witnesses.&#x27; Anas ibn Malik reports that the people of Mecca had asked for a miracle, and this was what they were shown. Tradition places the night some years before the migration to Medina in 622, often around 617 CE.</p><p>Picture Mina on a clear desert night: a valley a few kilometres east of Mecca, ringed by bare granite hills, perhaps under a Moon bright enough to read by. Perhaps a small group stands talking with the Prophet when someone looks up. That is the scene the reports describe, brief and local, witnessed by a handful of people who later told others what they had seen.</p><p>Fourteen centuries later the story acquired a second life online, attached to photographs of a long, straight crack on the Moon&#x27;s face. That modern claim can be tested. The older account, as its tellers understood it, is of another kind.</p></section><section class="wsec" id="moon-split-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>How Muslim scholars read the verse</h3><p>Most classical commentators, including Ibn Kathir, understood the verses as describing a real event witnessed in Mecca, one of the signs granted to the Prophet. They leaned on the number of Companions who reported it, among them Ibn Mas&#x27;ud, Anas ibn Malik, Ibn Abbas and Ibn Umar. The later hadith scholar al-Kattani listed it among the mass-transmitted reports, those carried by so many independent chains that forgery was thought implausible.</p><p>Other commentators recorded a second reading. Al-Raghib al-Isfahani, al-Mawardi and al-Zamakhshari noted that the Arabic verb can be understood as &#x27;the moon will be split&#x27;, one of the signs of the end of time, and a minority held that this is the verse&#x27;s only meaning. The wording that follows, about people who see signs and dismiss them, is read by the majority as pointing to something the first audience had witnessed.</p><p>The setting matters for how the verse was heard. Other Meccan passages record the Prophet&#x27;s opponents demanding proofs on their own terms, such as a spring gushing from the ground or a ladder into the sky (Quran 17:90–93). Surah 54 answers in a different register: it reminds its listeners of peoples before them, Noah&#x27;s, &#x27;Ad, Thamud, Lot&#x27;s and Pharaoh&#x27;s, who were warned and turned away. The split Moon is presented as one more sign, and after each story its refrain asks whether anyone will take heed.</p><aside class="wcall"><b>Reading the text in its own terms</b><p>In Islamic theology a miracle (mu&#x27;jiza) is by definition an act of God outside the ordinary course of nature, granted as a sign to particular people. It is not a claim that the laws of physics were quietly obeyed. That is why many Muslim scholars have been as unimpressed by the &#x27;lunar scar&#x27; posts as astronomers are.</p></aside></section><section class="wsec" id="moon-split-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The crack that went viral</h3><p>The photograph usually shared shows Rima Ariadaeus, a straight trench about 300 km long near the centre of the Moon&#x27;s near side. Posts claim that NASA found it to be the seam where two halves rejoined. NASA has said otherwise. In 2010 Brad Bailey of the NASA Lunar Science Institute wrote that &#x27;No current scientific evidence reports that the Moon was split into two (or more) parts and then reassembled at any point in the past.&#x27; The Egyptian geologist Zaghloul El-Naggar, among others, nonetheless helped spread the idea in popular lectures.</p><figure class="wx wx--static" id="moon-split-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Why a lunar rille is not a scar</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Why a lunar rille is not a scar"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" class="wx-svg" role="img" aria-labelledby="moon-split-f1-t"><title id="moon-split-f1-t">Why a lunar rille is not a scar: its size on the Moon, how a graben forms, and three clocks on one time scale</title><defs><marker id="moon-split-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text class="wx-t-cap" x="24" y="30">A rille · to scale on the Moon</text><text class="wx-t-cap" x="380" y="30">A graben · schematic section</text><circle class="wx-stone wx-edge wx-pop" style="--d:0" cx="160" cy="170" r="110"/><ellipse class="wx-rock wx-o60 wx-pop" style="--d:1" cx="130" cy="130" rx="34" ry="24"/><ellipse class="wx-rock wx-o60 wx-pop" style="--d:1" cx="180" cy="150" rx="26" ry="20"/><ellipse class="wx-rock wx-o60 wx-pop" style="--d:1" cx="100" cy="180" rx="24" ry="34"/><ellipse class="wx-rock wx-o60 wx-pop" style="--d:1" cx="200" cy="200" rx="20" ry="16"/><ellipse class="wx-rock wx-o60 wx-pop" style="--d:1" cx="150" cy="220" rx="30" ry="14"/><path class="wx-hl wx-draw" pathLength="1" style="--d:3" d="M192.6,161.2 L177.8,156.0"/><g class="wx-pop" style="--d:4"><path class="wx-thin" d="M196.6,165.2 L262,300"/><text class="wx-t-b" x="24" y="312">Rima Ariadaeus, c. 300 km long</text><text class="wx-t-m" x="24" y="328">Moon 3,474 km across: the rille spans</text><text class="wx-t-m" x="24" y="344">under a tenth of its width</text></g><g class="wx-pop" style="--d:5"><path class="wx-soil wx-edge-soft" d="M380,150 H480 L500,180 H590 L610,150 H700 V270 H380 Z"/><path class="wx-rock wx-o60" d="M380,210 H480 L505,240 H585 L610,210 H700 V226 H610 L585,256 H505 L480,226 H380 Z"/><path class="wx-bold" d="M480,150 L530,270 M610,150 L560,270"/></g><g class="wx-pop" style="--d:6"><path class="wx-line" marker-end="url(#moon-split-f1-ah)" d="M450,126 H392"/><path class="wx-line" marker-end="url(#moon-split-f1-ah)" d="M640,126 H698"/><text class="wx-t-s" x="545" y="130" text-anchor="middle">crust stretched apart</text></g><g class="wx-pop" style="--d:7"><path class="wx-paper wx-edge-soft" d="M520,180 Q532,192 544,180 Z"/><path class="wx-paper wx-edge-soft" d="M640,150 Q652,162 664,150 Z"/><path class="wx-thin" d="M532,190 L500,282"/><text class="wx-t-b" x="386" y="292">later craters sit on top:</text><text class="wx-t-m" x="386" y="308">the count gives an age</text><text class="wx-t-b" x="630" y="292" text-anchor="middle">normal faults</text><path class="wx-thin" d="M630,280 L592,240"/><text class="wx-t-s wx-halo" x="545" y="172" text-anchor="middle">floor drops</text></g><text class="wx-t-cap" x="24" y="376">Three clocks, years before present (log scale)</text><path class="wx-line wx-draw" pathLength="1" style="--d:8" d="M40,420 H680"/><path class="wx-thin" d="M40.0,420 V426"/><path class="wx-thin" d="M120.0,420 V426"/><path class="wx-thin" d="M200.0,420 V426"/><path class="wx-thin" d="M280.0,420 V426"/><path class="wx-thin" d="M360.0,420 V426"/><path class="wx-thin" d="M440.0,420 V426"/><path class="wx-thin" d="M520.0,420 V426"/><path class="wx-thin" d="M600.0,420 V426"/><path class="wx-thin" d="M680.0,420 V426"/><text class="wx-t-s" x="40.0" y="440" text-anchor="middle">100</text><text class="wx-t-s" x="200.0" y="440" text-anchor="middle">10,000</text><text class="wx-t-s" x="360.0" y="440" text-anchor="middle">1 million</text><text class="wx-t-s" x="520.0" y="440" text-anchor="middle">100 million</text><text class="wx-t-s" x="680.0" y="440" text-anchor="middle">10 billion</text><g class="wx-pop" style="--d:10"><circle class="wx-accfill" cx="131.7" cy="420" r="6"/><text class="wx-t-b wx-t-a" x="131.7" y="394" text-anchor="middle">c. 1,400 years</text><text class="wx-t-s" x="131.7" y="408" text-anchor="middle">the reports</text></g><g class="wx-pop" style="--d:12"><rect class="wx-c2" x="440.0" y="415" width="55.9" height="10" rx="3"/><text class="wx-t-b" x="495.9" y="394" text-anchor="end">youngest grabens</text><text class="wx-t-s" x="495.9" y="408" text-anchor="end">under c. 50 million</text></g><g class="wx-pop" style="--d:14"><rect class="wx-c1" x="639.3" y="415" width="13.0" height="10" rx="3"/><text class="wx-t-b" x="680" y="394" text-anchor="end">Apollo rock ages</text><text class="wx-t-s" x="680" y="408" text-anchor="end">3.1–4.5 billion</text></g><text class="wx-t-s" x="24" y="462">Rille position approximate. Ages: Watters et al. 2012 (grabens); Apollo sample dating (rocks).</text></svg></div></div><figcaption>Left: Rima Ariadaeus drawn to scale on the Moon&#x27;s face. Right: how a graben forms when the crust is stretched. Below: three clocks on one logarithmic time scale. <span class="wx-src">Based on: Moon diameter NASA; rille length Wilhelms 1987; graben ages Watters et al. 2012; sample ages Wilhelms 1987. Rille position approximate; section schematic.</span></figcaption><p class="vh">Three panels. Top left: a disc representing the Moon, 3,474 kilometres across, with a short orange line near the centre marking Rima Ariadaeus, about 300 kilometres long, less than a tenth of the Moon&#x27;s width. Top right: a schematic cross-section of the crust with arrows pulling outward and two inward-dipping faults; the block between them has dropped to form a flat-floored trough, with small craters on its floor and rim. Bottom: a logarithmic time axis from 100 years to 10 billion years, with a marker at about 1,400 years for the reported event, a blue bar for the youngest lunar grabens at under about 50 million years, and an orange bar for Apollo rock ages of 3.1 to 4.5 billion years.</p></figure><p>Rima Ariadaeus is a graben. When a planet&#x27;s crust is stretched, it breaks along two parallel faults and the strip between them drops, leaving a flat-floored trough. Grabens are common on the Moon, on Mars and on Earth, where the Rhine valley and parts of the East African Rift are giant examples. Some lunar rilles are different, winding channels cut by lava flowing billions of years ago. Neither kind requires the Moon to have come apart.</p></section><section class="wsec" id="moon-split-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Why rilles are not evidence either way</h3><p>Geologists date lunar surfaces by counting the craters that land on them after they form. In 2012 Thomas Watters and colleagues, using images from NASA&#x27;s Lunar Reconnaissance Orbiter, found small grabens so fresh that few craters cross them, and estimated them at less than about 50 million years old. Those are among the youngest tectonic features on the Moon. Rima Ariadaeus, pocked by craters of its own, is generally considered far older. The &#x27;scar&#x27; has been collecting craters for far longer than 1,400 years.</p><p>Shape tells the same story. At about 300 km, the rille spans less than a tenth of the Moon&#x27;s 3,474 km width. A fracture right through the Moon would not leave one tidy trench on one face. Gravity maps from the GRAIL mission in 2013 revealed ancient dikes of cooled magma deep in the crust, but no Moon-wide break.</p><blockquote class="wpull"><p>The rille is real and fascinating. It simply belongs to a different story, one measured in millions of years.</p></blockquote><p>The reverse also holds. The absence of a scar says nothing against the account as the tradition tells it, because neither the Quran nor the hadith reports claim that the Moon kept a mark. Using a rille as evidence, for or against, asks a trench in the lunar crust to answer a question it was never part of.</p></section><section class="wsec" id="moon-split-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>What a physical test could and could not show</h3><p>Physics can say something about one specific version of the event: a Moon that physically broke into pieces that drifted apart and then fell back together. Pulling the Moon&#x27;s mass apart and letting it reassemble would release energy on the order of 10²⁹ joules by our rough estimate, comparable to the energy needed to melt much of the Moon. Rocks returned by Apollo and the Soviet Luna probes have crystallisation ages of about 3.1 to 4.5 billion years. A Moon-wide remelting 1,400 years ago would have reset those clocks. That natural, physical version is excluded by the evidence.</p><p>What physics cannot reach is a sign given to witnesses by an act outside nature, which is how classical scholars described it. History can ask different questions. The event was reported at night; if the Moon was near full, as is often assumed, it would have been above the horizon across much of Asia and Europe too. No record of it has been identified in Chinese, Byzantine, Persian or Indian sources, though 7th-century observational records are patchy outside China. A Kerala tradition tells of a king, Cheraman Perumal, who saw the Moon split and travelled to Arabia, but historians such as Sebastian Prange date the story to the 12th–14th centuries and treat it as legend.</p><ul class="wlist"><li>A dated 7th-century record from outside Arabia describing a strange Moon on a known night.</li><li>Evidence of a young, Moon-wide resurfacing in samples or crater counts; none exists.</li><li>For the miracle itself, no instrument applies: it rests on the Quran and the reports of those present.</li></ul><p>So the verdict on this page is narrow on purpose. The internet claim that a lunar trench is the seam of a 7th-century split is ruled out by the Moon&#x27;s own geology. The account in the Quran and the hadith, of a sign seen by a few people on one night, lies outside what telescopes and rock samples can judge.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">617 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Traditional date of the sign at Mina, near Mecca</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">622 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Migration of the Prophet to Medina</span></li><li class="wtl-study" style="--i:2"><span class="wtl-y">870 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Death of al-Bukhari, whose collection preserves the reports</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">1300 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Kerala tradition of a king who saw the Moon split takes shape (12th–14th c.)</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">1969 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Apollo 11 returns the first lunar rocks for dating</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">2010 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">NASA statement on the split claim</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2012 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">LRO images reveal young, small lunar grabens</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2013 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">GRAIL maps the Moon&#x27;s internal structure</span></li></ol><details class="srcs"><summary>Sources for this case (10)</summary><ol><li>Watters T. R. et al. (2012). Recent extensional tectonics on the Moon revealed by the Lunar Reconnaissance Orbiter Camera. Nature Geoscience 5: 181–185. <a href="https://doi.org/10.1038/ngeo1387" target="_blank" rel="noopener">doi:10.1038/ngeo1387</a></li><li>Andrews-Hanna J. C. et al. (2013). Ancient igneous intrusions and early expansion of the Moon revealed by GRAIL gravity gradiometry. Science 339: 675–678. <a href="https://doi.org/10.1126/science.1231753" target="_blank" rel="noopener">doi:10.1126/science.1231753</a></li><li>Wilhelms D. E. (1987). The Geologic History of the Moon. USGS Professional Paper 1348.</li><li>Bailey B. (2010). Answer on the splitting of the Moon, NASA Lunar Science Institute (quoted in the Wikipedia article &#x27;Splitting of the Moon&#x27;).</li><li>Sahih al-Bukhari 3869 and 3637, trans. Muhammad Muhsin Khan (sunnah.com).</li><li>Sahih Muslim 2800a, trans. Abdul Hamid Siddiqui (sunnah.com).</li><li>Ibn Kathir, Tafsir al-Qur&#x27;an al-&#x27;Azim, commentary on Surah 54.</li><li>Friedmann Y. (1975). Qissat Shakarwati Farmad: traditions concerning the introduction of Islam to Malabar. Israel Oriental Studies 5: 233–258.</li><li>Prange S. R. (2018). Monsoon Islam: Trade and Faith on the Medieval Malabar Coast. Cambridge University Press.</li><li>The Quran, trans. M. A. S. Abdel Haleem (2004). Oxford University Press; The Quran, Sahih International translation (1997).</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-moon-split" data-t="The Splitting of the Moon: What a Rille Can&#x27;t Tell Us"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Splitting of the Moon: What a Rille Can&#x27;t Tell Us</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-moon-split</span> (updated 28 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-joshua-sun-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Solar annular eclipse of January 15, 2010 in Jinan, China.jpg" data-cap="An annular solar eclipse" data-big><figcaption></figcaption></figure><div class="sh-k">Peoples of the Sacred Texts</div><h2 class="sh-t" id="case-joshua-sun-st" tabindex="-1">Joshua&#x27;s Long Day: The Oldest Eclipse on Record?</h2><p class="sh-s">&#x27;Sun, stand still at Gibeon.&#x27; Two physicists argue the line records a ring of fire in the sky on 30 October 1207 BCE.</p><div class="sh-v"><span class="vstamp vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><p class="sh-claim"><b>What the stamp rates:</b> Joshua 10:12–14 preserves a record of the annular solar eclipse visible from Canaan on 30 October 1207 BCE.</p><p class="sh-claim"><b>The text's own words:</b> <span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span> <span class="sh-more">(line by line below)</span></p></div><p class="v4-q">Did Joshua&#x27;s poet see an annular eclipse, or something else entirely?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>The book of Joshua says the sun stood still over Gibeon.</li><li>An annular eclipse crossed Canaan on 30 October 1207 BCE, the only one visible there in 450 years.</li><li>Israel is named in Canaan by about 1208 BCE, so the date is historically possible.</li><li>The reading rests on a disputed sense of two Hebrew verbs and sets aside the narrator&#x27;s comment about a day that did not hurry to set.</li><li>The eclipse is certain; whether the poem remembers it is an open question.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Astronomy</span><span class="thr">Texts and scripts</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="1207" >1,207</b><span class="ctr-u"> BCE</span></div><div class="ctr-l">date of the proposed annular eclipse (30 October)</div><div class="ctr-c">Humphreys and Waddington 2017</div></div><div class="ctr"><div class="ctr-v">about <b class="ctr-n" data-v="5" >5</b><span class="ctr-u"> minutes</span></div><div class="ctr-l">of annularity at Azekah, 16:48–16:53</div><div class="ctr-c">Humphreys and Waddington 2017</div></div><div class="ctr"><div class="ctr-v">about <b class="ctr-n" data-v="9" >9</b><span class="ctr-u"> °</span></div><div class="ctr-l">height of the Sun above the horizon at annularity</div><div class="ctr-c">our calculation for Gibeon</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="1276" >1,276</b><span class="ctr-u"> BCE</span></div><div class="ctr-l">accession of Ramesses II if the eclipse reading holds</div><div class="ctr-c">Humphreys and Waddington 2017</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Joshua 10:12–14 preserves a record of the annular solar eclipse visible from Canaan on 30 October 1207 BCE.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:41.7%" role="img" aria-label="Weight of evidence: Open question"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The astronomy is solid: the eclipse happened, and it was visible from the right place in the right era. The link to the text is where the case divides. It rests on a disputed reading of two Hebrew verbs, it has to set aside the narrator&#x27;s clear comment about a day that &#x27;did not hurry to set&#x27;, and the poem&#x27;s date is unknown. Yet the fit of date and place is unusual, and the reading is argued in a peer-reviewed journal. Neither side can close the case, so it stays open.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 3 of 6, leaning one way"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>leaning one way</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Introductions to the Bible usually treat the passage briefly as poetry or omen language, and rarely mention the eclipse proposal. That caution is reasonable, but the brevity undersells a genuine, calculable coincidence. Popular retellings go the other way and present the 1207 BCE eclipse as solved. The astronomy deserves more confidence than it gets; the textual link deserves less.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>An annular solar eclipse was visible from Canaan on the afternoon of 30 October 1207 BCE; it was the only annular eclipse visible from Gibeon between 1500 and 1050 BCE.<small>Humphreys and Waddington 2017</small></li><li>At Azekah the partial phase would have begun about 15:27 local sundial time, with annularity between about 16:48 and 16:53.<small>Humphreys and Waddington 2017</small></li><li>The Merneptah Stele shows a people called Israel in Canaan by about 1208 BCE, so a date near 1207 BCE is historically possible.<small>Cairo JE 31408</small></li><li>Joshua 10:12–13 quotes its lines from an older lost book, the Book of Jashar, and they are written as poetry, with &#x27;sun&#x27; and &#x27;moon&#x27; in parallel.<small>Joshua 10:13; 2 Samuel 1:18</small></li><li>Excavations at el-Jib found jar handles inscribed with the name Gibeon, but little trace of a Late Bronze Age town.<small>Pritchard 1962</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the Hebrew verbs dom and &#x27;amad can mean &#x27;stop shining&#x27; rather than &#x27;stand still&#x27;.</li><li>Whether the text describes a lengthened day (&#x27;did not hurry to set for about a whole day&#x27;), which an eclipse does not produce.</li><li>Whether the conquest stories in Joshua reflect events of the late 13th century at all.</li><li>Whether other readings (celestial omen, hailstorm, poetic exaggeration) fit the text better.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>The Book of Jashar, which the passage quotes, is lost.</li><li>No inscription from Canaan of the 13th century BCE describes the battle, and the Late Bronze town of Gibeon, if it existed, has barely been found.</li></ul></div></div><h3 class="sub-h wsub">How the traditions tell it</h3><div class="v4texts"><blockquote class="quote v4q"><span class="v4q-t">Hebrew Bible · Joshua 10:12–14</span><p>On the day when the Lord gave the Amorites over to the Israelites, Joshua spoke to the Lord, and he said in the sight of Israel, &#x27;Sun, stand still at Gibeon, and Moon, in the valley of Aijalon.&#x27; And the sun stood still, and the moon stopped until the nation took vengeance on their enemies. Is this not written in the Book of Jashar? The sun stopped in midheaven and did not hurry to set for about a whole day. There has been no day like it before or since, when the Lord heeded a human voice, for the Lord fought for Israel.</p><cite>New Revised Standard Version Updated Edition (2021)</cite></blockquote></div><h3 class="sub-h wsub">In the text's own words</h3><p class="rd-rule">Each line rates only what the text itself says, not later dates, commentaries or modern identifications.</p><ul class="rds"><li class="rd"><p class="rd-s">The sun stood still at Gibeon and the moon in the valley of Aijalon (Joshua 10:12–13).</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">Read as an eclipse, it fits a real annular eclipse over Canaan in 1207 BCE; read as a halted sky, it is a matter of faith. The text is poetry quoted from an older lost book, the Book of Jashar.</p></li></ul><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Most biblical scholars read the lines as a fragment of victory poetry, quoted by a later narrator who took it literally and added the comment about a day-long halt. Some see the language of celestial omens: in Mesopotamian texts, the positions of sun and moon relative to each other on a given day were signs of victory or defeat, and Joshua&#x27;s words may be a prayer for a favourable sign. The historical value of the conquest narratives in Joshua is itself doubted, since several of the cities it describes were empty or small at the time.</p><ul><li>The quotation comes from a poetic source, the Book of Jashar, also cited for David&#x27;s lament in 2 Samuel 1:18.</li><li>Scholars such as John Holladay and John Walton compared the passage with Mesopotamian omen texts about sun and moon.</li><li>Jericho and Ai, famous in Joshua, show little or no occupation in the late 13th century BCE.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Humphreys, a materials scientist at Cambridge, and Waddington, an astrophysicist at Oxford, argue that the key verbs can mean &#x27;be dark&#x27; or &#x27;stop shining&#x27;, following a suggestion made by Robert Dick Wilson in 1918. On that reading, the sun and moon &#x27;stopped&#x27; by going dark, which is what happens in an eclipse. They computed that the only annular eclipse visible from Gibeon between 1500 and 1050 BCE fell on 30 October 1207 BCE, in the afternoon, and used it to refine the reign dates of Ramesses II and Merneptah. In 1972 John Sawyer had proposed a partial eclipse in 1131 BCE. Velikovsky, in 1950, claimed that a close pass of Venus had stopped the Earth&#x27;s rotation.</p><ul><li>The eclipse date lies within a year of the Merneptah Stele, the first record of Israel in Canaan.</li><li>A Babylonian cognate of dom means &#x27;to be dark&#x27;, supporting the eclipse reading.</li><li>If right, it would be the oldest datable eclipse report known and would pin Ramesses II&#x27;s accession to 1276 BCE.</li></ul><div class="face-s"><b>Its strongest point</b><p>Of all the centuries in which the story could be set, the only annular eclipse visible from Gibeon fell within about a year of the first external mention of Israel in Canaan. That is a striking coincidence, and it depends on calculation, not on belief.</p></div><p class="face-cr"><b>Credit</b> Colin Humphreys and Graeme Waddington; earlier John Sawyer; in a different vein Immanuel Velikovsky</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Independent evidence that Hebrew or cognate texts used dom or &#x27;amad for an eclipsed sun or moon.</li><li>An early manuscript or ancient translation of Joshua 10 that reads the passage as darkness rather than delay.</li><li>Archaeological evidence for a Late Bronze Age town at Gibeon and a conflict there around 1200 BCE.</li><li>A Canaanite or Egyptian record of the 1207 BCE eclipse against which the biblical wording could be compared.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,081 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of Joshua&#x27;s Long Day: The Oldest Eclipse on Record?"><button type="button" class="wtoc-i" data-go="joshua-sun-s1">Sun, stand still</button><button type="button" class="wtoc-i" data-go="joshua-sun-s2">Poem, prayer or report?</button><button type="button" class="wtoc-i" data-go="joshua-sun-s3">A ring of fire over Canaan</button><button type="button" class="wtoc-i" data-go="joshua-sun-s4">What the eclipse would mean</button><button type="button" class="wtoc-i" data-go="joshua-sun-s5">The case against</button><button type="button" class="wtoc-i" data-go="joshua-sun-s6">What would settle it</button></nav></div><section class="wsec" id="joshua-sun-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Sun, stand still</h3><p>The story in Joshua 10 is a war story. The people of Gibeon, a town in the hills north of Jerusalem, have made peace with the Israelites. Five Amorite kings march against Gibeon to punish them. Joshua&#x27;s army marches all night from Gilgal in the Jordan Valley, falls on the besiegers and chases them west down the pass of Beth-horon towards the valley of Aijalon and the lowlands around Azekah. Great hailstones fall on the fleeing army. Then the narrator stops, and quotes a poem.</p><blockquote class="quote"><p>&#x27;Sun, stand still at Gibeon, and Moon, in the valley of Aijalon.&#x27; And the sun stood still, and the moon stopped until the nation took vengeance on their enemies.</p><cite>Joshua 10:12–13, NRSV Updated Edition (2021)</cite></blockquote><p>The narrator adds: &#x27;Is this not written in the Book of Jashar? The sun stopped in midheaven and did not hurry to set for about a whole day. There has been no day like it before or since.&#x27; Few verses have caused more argument. Martin Luther is reported to have cited them against Copernicus. Immanuel Velikovsky built a cosmic catastrophe on them. And in 2017 two British scientists proposed that they record something that really did happen in the sky over Canaan.</p></section><section class="wsec" id="joshua-sun-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Poem, prayer or report?</h3><p>The lines are poetry. They pair &#x27;sun&#x27; with &#x27;moon&#x27; and &#x27;Gibeon&#x27; with &#x27;Aijalon&#x27; in the parallel style of Hebrew verse, and they come from the Book of Jashar, a lost collection also quoted for David&#x27;s lament over Saul in 2 Samuel 1:18. Many scholars think a later narrator took a poetic image literally and supplied the comment about a whole day.</p><p>Others hear the language of omens. In Mesopotamian astronomy, whether the sun and moon were seen together on a given day of the month, and where, was read as a sign of victory or defeat. John Holladay in 1968 and John Walton in 1994 argued that Joshua was praying for a favourable sign, and that &#x27;stand still&#x27; may mean to hold a position rather than to stop moving. The medieval Jewish philosopher Gersonides had his own solution: the sun did not stop at all; the miracle was that so complete a victory was won before it set.</p><blockquote class="wpull"><p>An annular eclipse turns the Sun into a ring of fire, and the Moon, directly in front of it, cannot be seen at all.</p></blockquote></section><section class="wsec" id="joshua-sun-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>A ring of fire over Canaan</h3><p>Colin Humphreys and Graeme Waddington started from the words. The verb translated &#x27;stand still&#x27;, dom, is related to a Babylonian word meaning &#x27;to be dark&#x27;, a connection suggested by Robert Dick Wilson in 1918. The second verb, &#x27;amad, &#x27;to stop&#x27;, could mean that the moon stopped doing what it normally does. Put together, they argue, the poem says the sun and moon stopped shining. That is a description of an eclipse.</p><figure class="wx wx--steps" id="joshua-sun-f1" data-n="4"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">The afternoon sky over Gibeon, 30 October 1207 BCE</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The afternoon sky over Gibeon, 30 October 1207 BCE"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" class="wx-svg" role="img" aria-labelledby="joshua-sun-f1-t"><title id="joshua-sun-f1-t">The afternoon sky seen from Gibeon on 30 October 1207 BCE, with the Sun sinking west-southwest through an annular eclipse</title><defs><clipPath id="joshu
