="wx-t-s wx-halo" x="320" y="388" text-anchor="middle">c. 25 m</text></g><rect class="wx-c4 wx-edge wx-pop" style="--d:10" x="252" y="246" width="30" height="26"/><g class="wx-pulse"><rect class="wx-accfill wx-o60 wx-edge" x="296" y="126" width="48" height="80"/><rect class="wx-accfill wx-o60 wx-edge" x="232" y="428" width="46" height="36"/><rect class="wx-accfill wx-o60 wx-edge" x="364" y="300" width="36" height="56"/><rect class="wx-accfill wx-o60 wx-edge" x="232" y="236" width="18" height="36"/></g><g class="wx-pop" style="--d:12"><path class="wx-thin" d="M510,150 L346,160"/><text class="wx-t-b" x="514" y="146">North Entrance</text><text class="wx-t-m" x="514" y="162">rebuilt bastion, bull relief copy</text></g><g class="wx-pop" style="--d:13"><path class="wx-thin" d="M510,300 L402,322"/><text class="wx-t-b" x="514" y="296">Grand Staircase</text><text class="wx-t-m" x="514" y="312">and residential quarter,</text><text class="wx-t-m" x="514" y="328">floors rebuilt in concrete</text></g><g class="wx-pop" style="--d:14"><path class="wx-thin" d="M510,450 L280,448"/><text class="wx-t-b" x="514" y="446">South Propylaeum</text><text class="wx-t-m" x="514" y="462">rebuilt, fresco replicas</text></g><g class="wx-pop" style="--d:11"><path class="wx-thin" d="M134,252 L250,258"/><text class="wx-t-b" x="24" y="240">Throne Room</text><text class="wx-t-m" x="24" y="256">gypsum throne</text></g><g class="wx-pop" style="--d:11"><path class="wx-thin" d="M100,330 L168,330"/><text class="wx-t-b" x="24" y="324">Storerooms</text><text class="wx-t-m" x="24" y="340">giant jars</text></g><g class="wx-pop" style="--d:15"><rect class="wx-accfill wx-o60 wx-edge" x="514" y="372" width="16" height="12"/><text class="wx-t-m" x="536" y="382">Evans's concrete rebuilds</text><rect class="wx-c4 wx-edge" x="514" y="392" width="16" height="12"/><text class="wx-t-m" x="536" y="402">Throne Room suite</text></g><g class="wx-pop" style="--d:15"><path class="wx-line" d="M660,110 V70"/><path class="wx-inkfill" d="M660,62 L654,76 H666 Z"/><text class="wx-t-b" x="660" y="126" text-anchor="middle">N</text></g><g class="wx-pop" style="--d:15"><rect class="wx-inkfill" x="60" y="512" width="26" height="6"/><rect class="wx-paper wx-edge" x="86" y="512" width="26" height="6"/><text class="wx-t-s" x="60" y="534" text-anchor="middle">0</text><text class="wx-t-s" x="112" y="534" text-anchor="middle">20 m</text></g><text class="wx-t-s" x="24" y="572">Simplified after Evans's plans and later surveys; room layout schematic, court and overall size approximate.</text></svg></div></div><figcaption>A simplified plan of the palace at Knossos, north at the top, with the central court and the main areas that Arthur Evans reconstructed in concrete. Room layout is schematic. <span class="wx-src">Based on: Simplified after Evans (1921–1935) and later site plans; central court c. 50 by 25 m and palace area c. 20,000 m² as published; room grid schematic.</span></figcaption><p class="vh">Plan of an irregular, roughly square building about 130 by 145 m, packed with small rectangular rooms drawn as a dense grid. In the middle lies an open rectangular central court about 50 m long north to south and 25 m wide, with dimension lines. On the west side a row of sixteen long narrow storerooms is labelled &#x27;Storerooms, rows of giant jars&#x27;, and a red block beside the court marks the Throne Room. Outside to the west is an open West Court. Four orange areas highlight Evans&#x27;s concrete reconstructions: the North Entrance with its bastion, the Grand Staircase and residential quarter on the east, the South Propylaeum, and the Throne Room antechamber. A north arrow and a 20 m scale bar are shown.</p></figure><p>And everywhere there were bulls. Frescoes show young men and women vaulting over charging bulls. Ritual vessels take the form of bulls&#x27; heads. Stone &#x27;horns of consecration&#x27; crowned the buildings. Double axes, the labrys, are carved into blocks and painted on pottery. Evans, who knew the myths intimately, felt he had found the House of the Double Axe, the Labyrinth itself.</p><aside class="wcall"><b>How do we know?</b><p>One tablet from the palace archive, catalogued as KN Gg 702, records an amphora of honey offered to da-pu2-ri-to-jo po-ti-ni-ja. Read in Greek, that is &#x27;to the Mistress of the Labyrinth&#x27;. The tablet belongs to the palace&#x27;s last phase, written in Linear B, the early Greek script deciphered by Michael Ventris in 1952. The word shows that a place or shrine called the Labyrinth was known at Knossos in the Late Bronze Age, though we do not know exactly what it was.</p></aside></section><section class="wsec" id="knossos-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>What Evans built, and what he got wrong</h3><p>Evans did not just excavate Knossos. He rebuilt it. From the 1900s into the 1930s his architects restored staircases, columns and whole upper floors, increasingly in reinforced concrete, painted to look like the timber and plaster that had burned. Fresco fragments were completed by the artists Émile Gilliéron and his son into full scenes. The results made Knossos one of the most visited sites in Greece, and they fixed a particular picture of the Minoans in the modern imagination.</p><ul class="wlist"><li>The &#x27;Prince of the Lilies&#x27;, a famous painted relief, was assembled from fragments that may come from more than one figure.</li><li>A &#x27;blue boy&#x27; gathering saffron in one restored fresco was later reinterpreted as a blue monkey.</li><li>Evans imagined a peaceful, nature-loving society ruled by priest-kings. Later finds, including weapons, a possible human sacrifice at Anemospilia and children&#x27;s bones with cut marks at Knossos, complicate that image.</li><li>He was sure mainland Greek culture was an offshoot of Crete. Ventris&#x27;s decipherment showed the reverse in the palace&#x27;s last phase: its administrators wrote Greek.</li></ul><p>None of this makes Evans a fraud. His excavation was, for its time, careful and reported promptly season by season, and without his roofs much of what survives would have melted in the winter rains. But it means that visitors to Knossos walk through a mixture of Bronze Age ruin and 1920s imagination. Evans himself shaped the myth he was testing.</p></section><section class="wsec" id="knossos-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The volcano next door</h3><p>About 110 km north of Crete lies Santorini, the remains of the volcanic island of Thera. In the Late Bronze Age it exploded in one of the largest eruptions of the last 10,000 years, burying the Minoan-style town of Akrotiri under tens of metres of pumice and ash. In 1939 Spyridon Marinatos proposed that this catastrophe, with its ashfall, earthquakes and tsunami, had destroyed Minoan Crete. It was a bold, testable idea, and Marinatos spent his later career testing it at Akrotiri.</p><figure class="wx wx--steps" id="knossos-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">Did Thera end the Minoans?</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Did Thera end the Minoans?"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 462" class="wx-svg" role="img" aria-labelledby="knossos-f2-t"><title id="knossos-f2-t">Timeline comparing the date of the Thera eruption with the destructions of Minoan palaces on Crete</title><text class="wx-t-cap" x="24" y="24">Did Thera end the Minoans?</text><text class="wx-t-h" x="24" y="52">An eruption, and a century of waiting</text><path class="wx-line wx-draw" pathLength="1" d="M60,392 H660"/><path class="wx-dim" d="M60.0,392 V398"/><text class="wx-t-s" x="60.0" y="414" text-anchor="middle">1700</text><path class="wx-dim" d="M135.0,392 V398"/><text class="wx-t-s" x="135.0" y="414" text-anchor="middle">1650</text><path class="wx-dim" d="M210.0,392 V398"/><text class="wx-t-s" x="210.0" y="414" text-anchor="middle">1600</text><path class="wx-dim" d="M285.0,392 V398"/><text class="wx-t-s" x="285.0" y="414" text-anchor="middle">1550</text><path class="wx-dim" d="M360.0,392 V398"/><text class="wx-t-s" x="360.0" y="414" text-anchor="middle">1500</text><path class="wx-dim" d="M435.0,392 V398"/><text class="wx-t-s" x="435.0" y="414" text-anchor="middle">1450</text><path class="wx-dim" d="M510.0,392 V398"/><text class="wx-t-s" x="510.0" y="414" text-anchor="middle">1400</text><path class="wx-dim" d="M585.0,392 V398"/><text class="wx-t-s" x="585.0" y="414" text-anchor="middle">1350</text><path class="wx-dim" d="M660.0,392 V398"/><text class="wx-t-s" x="660.0" y="414" text-anchor="middle">1300</text><text class="wx-t-s" x="660" y="432" text-anchor="end">years BCE</text><g class="wx-st" data-s="1"><text class="wx-t-b" x="24" y="96">1 · Marinatos, 1939: eruption and collapse together?</text><circle class="wx-fire wx-pulse" cx="360.0" cy="116" r="9"/><text class="wx-t-m" x="376.0" y="120">ash, quakes, tsunami, c. 1500 BCE</text></g><g class="wx-st" data-s="2"><text class="wx-t-b" x="24" y="156">2 · Pottery sequence: eruption in Late Minoan IA, palaces burn in LM IB</text><circle class="wx-fire" cx="330.0" cy="176" r="6"/><rect class="wx-c4 wx-o40" x="405.0" y="170" width="60.0" height="12" rx="3"/><text class="wx-t-m" x="475.0" y="180">palaces destroyed c. 1450</text></g><g class="wx-st" data-s="3"><text class="wx-t-b" x="24" y="216">3 · Tree rings and ice cores, 2022: three candidate years</text><circle class="wx-fire" cx="193.5" cy="236" r="6"/><rect class="wx-fire" x="267.0" y="230" width="10.5" height="12"/><circle class="wx-fire" cx="303.0" cy="236" r="6"/><text class="wx-t-s" x="193.5" y="258" text-anchor="middle">1611</text><text class="wx-t-s" x="273.0" y="258" text-anchor="middle">1562–55</text><text class="wx-t-s" x="311.0" y="258">1538</text></g><g class="wx-st" data-s="4"><text class="wx-t-b" x="24" y="290">4 · Knossos survives, now run in Greek (Linear B), until c. 1375–1350</text><rect class="wx-c2 wx-o40" x="435.0" y="302" width="150.0" height="12" rx="3"/><path class="wx-line wx-s4" d="M570.0,298 V318"/><text class="wx-t-m" x="593.0" y="312">final burning</text></g><g class="wx-st wx-hide" data-s="5"><path class="wx-hl" d="M193.5,346 V354 H435.0 V346"/><text class="wx-t-b wx-t-a" x="314.2" y="374" text-anchor="middle">c. 90–160 years between eruption and palace destructions</text></g><path class="wx-guide" d="M435.0,70 V392"/><text class="wx-t-s" x="24" y="456">Candidate years: Pearson et al. 2022 (PNAS Nexus); destruction dates: conventional Aegean chronology, approximate.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> 1939: Spyridon Marinatos proposes that the Thera eruption, with ash, earthquakes and tsunami, destroyed Minoan Crete around 1500 BCE.</p><ol class="wx-steplist"><li>1939: Spyridon Marinatos proposes that the Thera eruption, with ash, earthquakes and tsunami, destroyed Minoan Crete around 1500 BCE.</li><li>Pottery shows the eruption fell in Late Minoan IA, while most Cretan palaces burned later, in Late Minoan IB, around 1450 BCE.</li><li>2022: ice-core chemistry and tree rings narrow the eruption to three candidate dates: 1611, 1562–1555 or 1538 BCE.</li><li>Knossos survives the 1450 destructions, now administered in Greek (Linear B), until it burns for the last time around 1375–1350 BCE.</li><li>The result: roughly 90 to 160 years separate the eruption from the palace destructions. Thera was a blow, not the knockout.</li></ol><figcaption>Step through how the date of the Thera eruption moved away from the destructions of Crete&#x27;s palaces, on one time axis from 1700 to 1300 BCE. <span class="wx-src">Based on: Marinatos 1939; candidate eruption years from Pearson et al. 2022 (PNAS Nexus); destruction dates from the conventional Aegean chronology, approximate.</span></figcaption><p class="vh">A time axis runs from 1700 BCE on the left to 1300 BCE on the right, with a dashed guide at 1450 BCE. Step 1: Marinatos&#x27;s 1939 idea, a pulsing orange circle at about 1500 BCE marking ash, quakes and tsunami, with eruption and collapse together. Step 2: the pottery sequence, with the eruption dot in Late Minoan IA around 1520 and a red band for palaces destroyed around 1450. Step 3: three candidate eruption years from tree rings and ice cores, 1611, 1562 to 1555, and 1538 BCE. Step 4: a blue band from 1450 to 1350 BCE shows Knossos surviving under Greek-speaking administration until its final burning around 1375 to 1350. Step 5: an accent bracket marks the gap of about 90 to 160 years between eruption and palace destructions.</p></figure><p>The dating has since moved against a simple version of his theory. Pottery places the eruption in the Late Minoan IA phase, while the great fires that destroyed most Cretan palaces and villas came later, in Late Minoan IB, around 1450 BCE. Science has pushed the eruption earlier still. In 2022 Charlotte Pearson and colleagues combined ice-core chemistry and tree rings and narrowed it to 1611, 1562–1555 or 1538 BCE, after showing that a famous 1628 BCE signal came from Aniakchak in Alaska. That leaves a gap of roughly one to one and a half centuries. Tsunami deposits at Palaikastro in eastern Crete show that the eruption did strike Minoan towns, but Knossos kept going.</p></section><section class="wsec" id="knossos-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Challengers old and new</h3><p>Marinatos&#x27;s core insight has not gone away. A society that depended on sea trade, whose ships and harbours were battered by a tsunami and whose trading partners were disrupted, may have been fatally weakened even if it survived for generations. Some scholars see the later destructions as the long tail of that shock, perhaps through economic strain and internal conflict, followed by a takeover by Greek speakers from the mainland. The classicist J. V. Luce and others went further and suggested that memories of Thera and of Minoan sea power lie behind Plato&#x27;s story of Atlantis.</p><p>Hans Georg Wunderlich, a German geologist, made a stranger case in 1972: that Knossos was never a palace for the living but a vast house of the dead, a centre for burial and the cult of the dead, which would explain its windowless rooms, its many storage jars and the legend of a deadly maze. Specialists rejected it, because the archives, workshops and domestic debris point to a working centre. But his book made a fair point that is still made today: &#x27;palace&#x27; is a modern label, and Minoan Knossos may have worked in ways that do not match any later kingdom.</p><blockquote class="wpull"><p>The labyrinth is real in one sense at least: the building bewildered visitors 3,500 years ago and still does today.</p></blockquote></section><section class="wsec" id="knossos-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What time has hidden, and what would settle it</h3><p>The biggest gap is language. The Minoans wrote in Linear A, and we can sound out many of its signs because Linear B borrowed them, but we cannot understand the words. Until Linear A is deciphered, the Minoans&#x27; own names for their gods, their rulers and the building itself are lost. Upper floors, timber, textiles and most painted walls have perished, and Evans&#x27;s concrete now occupies some of the places where original evidence lay.</p><p>Several things could sharpen the picture. More Linear A texts, or a bilingual inscription, could crack the script. A secure link between the Thera candidate years and the Cretan pottery phases would measure exactly how long Knossos lasted after the eruption. Full publication of the old excavations, with modern scientific study of the stored finds, would separate Bronze Age fabric from 20th-century restoration. For now the fairest verdict is that the myth has real roots. There was no Minotaur. But there was a vast, bewildering building full of bulls, a Mistress of the Labyrinth, and a Crete that once ruled the waves, remembered long after its palaces had fallen.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">7,000 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">First farming settlement on the Kephala hill</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">1,900 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">First palace built</span></li><li class="wtl-loss" style="--i:2"><span class="wtl-y">1,700 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Palace destroyed, probably by earthquake, and rebuilt</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">1,560 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Thera erupts (candidate years 1611–1538 BCE)</span></li><li class="wtl-loss" style="--i:4"><span class="wtl-y">1,450 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Destructions across Crete; Knossos survives under Greek-speaking rule</span></li><li class="wtl-loss" style="--i:5"><span class="wtl-y">1,350 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Final destruction of the palace (c. 1375–1350)</span></li><li class="wtl-find" style="--i:6"><span class="wtl-y">1878 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Minos Kalokairinos makes the first excavation</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">1900 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Arthur Evans begins large-scale excavation</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">1952 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Michael Ventris deciphers Linear B as Greek</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">2022 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Ice cores and tree rings narrow the Thera date</span></li></ol><details class="srcs"><summary>Sources for this case (12)</summary><ol><li>Evans A. (1921–1935). The Palace of Minos at Knossos, 4 vols. Macmillan.</li><li>Pearson C., Sigl M. et al. (2022). Geochemical ice-core constraints on the timing and climatic impact of Aniakchak II (1628 BCE) and Thera (Minoan) volcanic eruptions. PNAS Nexus 1(2): pgac048. <a href="https://doi.org/10.1093/pnasnexus/pgac048" target="_blank" rel="noopener">doi:10.1093/pnasnexus/pgac048</a></li><li>Ventris M., Chadwick J. (1953). Evidence for Greek dialect in the Mycenaean archives. Journal of Hellenic Studies 73: 84–103. <a href="https://doi.org/10.2307/628239" target="_blank" rel="noopener">doi:10.2307/628239</a></li><li>Marinatos S. (1939). The volcanic destruction of Minoan Crete. Antiquity 13: 425–439.</li><li>Lazaridis I. et al. (2017). Genetic origins of the Minoans and Mycenaeans. Nature 548: 214–218. <a href="https://doi.org/10.1038/nature23310" target="_blank" rel="noopener">doi:10.1038/nature23310</a></li><li>Bruins H. J. et al. (2008). Geoarchaeological tsunami deposits at Palaikastro (Crete) and the Late Minoan IA eruption of Santorini. Journal of Archaeological Science 35: 191–212.</li><li>MacGillivray J. A. (2000). Minotaur: Sir Arthur Evans and the Archaeology of the Minoan Myth. Hill and Wang.</li><li>Gere C. (2009). Knossos and the Prophets of Modernism. University of Chicago Press.</li><li>Wunderlich H. G. (1974). The Secret of Crete. Macmillan (German original 1972).</li><li>Luce J. V. (1969). The End of Atlantis: New Light on an Old Legend. Thames and Hudson.</li><li>Sakellarakis Y., Sapouna-Sakellaraki E. (1981). Drama of death in a Minoan temple. National Geographic 159(2).</li><li>Homer. Odyssey, trans. A. T. Murray (1919). Loeb Classical Library, Harvard University Press.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-knossos" data-t="Knossos: Inside the Minotaur&#x27;s Labyrinth"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Knossos: Inside the Minotaur&#x27;s Labyrinth</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-knossos</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-jericho-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Jericho Neolitic Tower P1190752.JPG" data-cap="The Neolithic tower of Jericho" data-big><figcaption></figcaption></figure><div class="sh-k">Legends and Relics</div><h2 class="sh-t" id="case-jericho-st" tabindex="-1">Jericho: The Walls That Fell Too Early</h2><p class="sh-s">Joshua&#x27;s trumpets, a Neolithic tower 10,000 years old, and a century-long fight over one burned layer of grain.</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> Jericho&#x27;s walls fell and the city was burned around 1400 BCE, in line with a biblical date for Joshua&#x27;s conquest.</p><p class="sh-claim"><b>The text's own words:</b> <span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span> <span class="sh-more">(line by line below)</span></p></div><p class="v4-q">Did Jericho&#x27;s walls fall when the Book of Joshua says they did?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Jericho is one of the oldest towns on Earth, with a stone tower built around 8000 BCE.</li><li>Its last strongly walled Bronze Age city burned down; the question is when.</li><li>Radiocarbon on grain from the destruction gives the late 1600s or 1500s BCE, at least a century before a biblical date of about 1400.</li><li>No securely dated walled city of 1400 BCE has been found; those levels are badly eroded.</li><li>A later, smaller settlement and its end remain poorly known, so the story is not beyond reach.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Chemistry</span><span class="thr">Texts and scripts</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="8.5" data-dec="1">8.5</b><span class="ctr-u"> m</span></div><div class="ctr-l">height of the Neolithic tower</div><div class="ctr-c">Kenyon 1957</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="22" >22</b><span class="ctr-u"> steps</span></div><div class="ctr-l">in the tower&#x27;s internal staircase</div><div class="ctr-c">Kenyon 1957</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="3306" >3,306</b><span class="ctr-u"> BP</span></div><div class="ctr-l">radiocarbon age of grain burned in the final Middle Bronze Age destruction (± 7)</div><div class="ctr-c">Bruins and van der Plicht 1995</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="18" >18</b><span class="ctr-u"> samples</span></div><div class="ctr-l">dated from the destruction: 6 grain, 12 charcoal</div><div class="ctr-c">Bruins and van der Plicht 1995</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Jericho&#x27;s walls fell and the city was burned around 1400 BCE, in line with a biblical date for Joshua&#x27;s conquest.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The destruction Wood reassigns to about 1400 BCE has been radiocarbon-dated on short-lived grain to the late 17th or 16th century BCE, at least a century earlier, and that method does not depend on the pottery or Egyptian chronologies that the debate is about. No securely dated walled city of 1400 BCE has been found. The story is not beyond reach: the Late Bronze levels are badly eroded and little excavated, so a small later settlement and its end remain poorly known.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Many textbooks say flatly that Jericho was uninhabited when Joshua is supposed to have arrived. The radiocarbon supports a much earlier destruction, so the core point stands. But &#x27;empty&#x27; is stronger than the evidence: erosion removed much of the Late Bronze Age mound, and Kenyon&#x27;s trenches were narrow. &#x27;No walled city has been found for that time&#x27; is the honest version.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Tell es-Sultan is one of the oldest continuously revisited town sites on Earth, with a Natufian settlement from about 10,000 BCE and a walled Neolithic town of about 4 ha.<small>Kenyon 1957; UNESCO 2023</small></li><li>Its Neolithic stone tower, about 8.5 m tall and 9 m across at the base with an internal staircase of 22 steps, was built around 8000 BCE (radiocarbon c. 8300–7800 BCE).<small>Kenyon 1957; Barkai and Liran 2008</small></li><li>The last strongly fortified Bronze Age city on the tell was destroyed by fire at the end of the Middle Bronze Age; Kathleen Kenyon dated this to about 1550 BCE.<small>Kenyon 1957; Kenyon and Holland 1981</small></li><li>Radiocarbon on six samples of charred cereal grain from that destruction averages 3306 ± 7 BP, placing the fire in the late 17th or 16th century BCE.<small>Bruins and van der Plicht 1995, Radiocarbon</small></li><li>Late Bronze Age remains on the tell are thin and poorly preserved; there is no securely dated massive city wall from around 1400 or 1200 BCE.<small>Kenyon 1957; Italian-Palestinian expedition</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether Kenyon&#x27;s small trenches missed Late Bronze Age material, and whether local pottery and scarabs point to a destruction nearer 1400 BCE, as Bryant Wood argues.</li><li>How large and what kind of settlement stood at Jericho in the 14th century BCE, when Kenyon found only scraps of a small building and some tombs.</li><li>Whether an earthquake, common in the Jordan Rift, brought down walls at some stage, and whether the biblical story preserves a memory of it.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Centuries of rain and wind stripped the upper layers of the mound; Kenyon herself thought much of the Late Bronze Age town had eroded away.</li><li>Garstang&#x27;s 1930s excavation removed key deposits with methods that did not record fine stratigraphy, so some of his evidence cannot be rechecked.</li><li>Large parts of the tell remain unexcavated, and there is no written record from Jericho itself for the Late Bronze Age.</li></ul></div></div><h3 class="sub-h wsub">How the traditions tell it</h3><div class="v4texts"><blockquote class="quote v4q"><span class="v4q-t">Hebrew Bible · Joshua 6:20</span><p>So the people shouted when the priests blew with the trumpets: and it came to pass, when the people heard the sound of the trumpet, and the people shouted with a great shout, that the wall fell down flat, so that the people went up into the city, every man straight before him, and they took the city.</p><cite>King James Version (1611)</cite></blockquote></div><h3 class="sub-h wsub">In the text's own words</h3><p class="rd-rule">Each line rates only what the text itself says, not later dates, commentaries or modern identifications.</p><ul class="rds"><li class="rd"><p class="rd-s">Jericho&#x27;s wall fell down flat and the city was taken (Joshua 6:20).</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">Jericho&#x27;s walls did collapse and the city did burn, but Kenyon dated that to about 1550 BCE, before most dates for Joshua. Bryant Wood argued for about 1400 BCE; much of the site has eroded, so the question stays open.</p></li></ul><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Most archaeologists follow Kenyon and the radiocarbon. Jericho&#x27;s last great walls fell, with a violent fire, at the end of the Middle Bronze Age, around 1600–1530 BCE. For most of the Late Bronze Age the site was small or empty, so there was little or no walled city to conquer in the periods usually proposed for Joshua, whether the 15th or the 13th century BCE. Many scholars read the story as later Israelites explaining an ancient ruin in their land.</p><ul><li>Short-lived grain dates the destruction directly, independent of pottery styles or Egyptian king lists.</li><li>The walls Garstang attributed to Joshua&#x27;s time turned out to be Early Bronze Age, over 1,000 years older.</li><li>Only scattered Late Bronze Age remains have been found on the tell.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>In 1990 the archaeologist Bryant Wood re-examined Kenyon&#x27;s published pottery and argued that she had dated the destruction from the absence of an imported ware rather than from the local pottery, which he read as late 15th century BCE. He pointed to Egyptian scarabs in the cemetery naming pharaohs down to the early 14th century BCE, jars full of grain (a siege that ended quickly, before harvest was eaten), and a collapsed mudbrick wall at the foot of the revetment. David Rohl takes another route: he keeps the destruction where Kenyon put it in the sequence but argues that Egyptian chronology should be lowered by centuries, which would align it with Joshua.</p><ul><li>Kenyon&#x27;s date leaned partly on missing Cypriot pottery in a poor quarter of the city, an argument from absence.</li><li>The destruction layer contains abundant stored grain, consistent with a short siege in spring, as Joshua describes around Passover.</li><li>Mudbrick from the upper wall lay tumbled at the base of the stone revetment, as if the wall had fallen outward.</li></ul><div class="face-s"><b>Its strongest point</b><p>Kenyon&#x27;s own pottery argument relied heavily on what she did not find, in a small exposure, on a mound where erosion had removed so much that the evidence for a later city may simply be gone.</p></div><p class="face-cr"><b>Credit</b> Bryant G. Wood; David Rohl</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>New radiocarbon dates on short-lived seeds from every Middle and Late Bronze Age floor on the tell, analysed with modern Bayesian models.</li><li>Excavation of any surviving Late Bronze Age deposits on the slopes, where eroded material would have collected.</li><li>Re-study of the grain jars and tumbled brick with micromorphology to date the collapse and test for an earthquake.</li><li>Independent checks of the scarab sequence from the cemetery against the settlement layers.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">6 min read · 1,299 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Jericho: The Walls That Fell Too Early"><button type="button" class="wtoc-i" data-go="jericho-s1">The oldest tower in the world</button><button type="button" class="wtoc-i" data-go="jericho-s2">The story in Joshua</button><button type="button" class="wtoc-i" data-go="jericho-s3">Garstang finds his walls, Kenyon takes them away</button><button type="button" class="wtoc-i" data-go="jericho-s4">The challenger&#x27;s case</button><button type="button" class="wtoc-i" data-go="jericho-s5">The grain that dated the fire</button><button type="button" class="wtoc-i" data-go="jericho-s6">What erosion took</button><button type="button" class="wtoc-i" data-go="jericho-s7">What would settle it</button></nav></div><section class="wsec" id="jericho-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The oldest tower in the world</h3><p>Before the walls of Joshua, there was the tower. Around 8000 BCE, beside a strong spring in the Jordan Valley some 250 m below sea level, people who had only recently begun to farm built a round tower of undressed stone about 8.5 m high, with a staircase of 22 steps running up inside it. They also built a stone wall around their town of about 4 ha. There was no metal, no pottery and no writing. Estimates of the population run from several hundred to a few thousand people, and they could organise the labour to raise a monument that still stands today.</p><figure class="wx wx--static" id="jericho-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">The Neolithic tower of Jericho</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The Neolithic tower of Jericho"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" class="wx-svg" role="img" aria-labelledby="jericho-f2-t"><title id="jericho-f2-t">Cross-section of the Neolithic stone tower of Jericho with its internal staircase, beside a person for scale</title><defs><marker id="jericho-f2-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text class="wx-t-cap" x="24" y="24">The tower of Jericho · simplified section, to scale</text><text class="wx-t-h" x="24" y="52">Built c. 8000 BCE</text><rect class="wx-soil" x="20" y="380" width="680" height="24"/><path class="wx-line" d="M20,380 H700"/><path class="wx-stone2 wx-edge wx-grow" style="--d:1" d="M196,380 V272 H250 L247.3,380 Z"/><path class="wx-stone wx-edge wx-grow" style="--d:2" d="M250,380 L280,125 H490 L520,380 Z"/><path class="wx-paper wx-edge-soft wx-pop" style="--d:5" d="M514,380 L514.0,368.6 L506.3,368.6 L506.3,357.3 L498.5,357.3 L498.5,345.9 L490.8,345.9 L490.8,334.5 L483.1,334.5 L483.1,323.2 L475.4,323.2 L475.4,311.8 L467.6,311.8 L467.6,300.5 L459.9,300.5 L459.9,289.1 L452.2,289.1 L452.2,277.7 L444.5,277.7 L444.5,266.4 L436.7,266.4 L436.7,255.0 L429.0,255.0 L429.0,243.6 L421.3,243.6 L421.3,232.3 L413.5,232.3 L413.5,220.9 L405.8,220.9 L405.8,209.5 L398.1,209.5 L398.1,198.2 L390.4,198.2 L390.4,186.8 L382.6,186.8 L382.6,175.5 L374.9,175.5 L374.9,164.1 L367.2,164.1 L367.2,152.7 L359.5,152.7 L359.5,141.4 L351.7,141.4 L351.7,130.0 L344.0,130.0 L344,125 L374.6,125 L514,330 Z"/><path class="wx-hl wx-draw" pathLength="1" style="--d:6" d="M514,380 L514.0,368.6 L506.3,368.6 L506.3,357.3 L498.5,357.3 L498.5,345.9 L490.8,345.9 L490.8,334.5 L483.1,334.5 L483.1,323.2 L475.4,323.2 L475.4,311.8 L467.6,311.8 L467.6,300.5 L459.9,300.5 L459.9,289.1 L452.2,289.1 L452.2,277.7 L444.5,277.7 L444.5,266.4 L436.7,266.4 L436.7,255.0 L429.0,255.0 L429.0,243.6 L421.3,243.6 L421.3,232.3 L413.5,232.3 L413.5,220.9 L405.8,220.9 L405.8,209.5 L398.1,209.5 L398.1,198.2 L390.4,198.2 L390.4,186.8 L382.6,186.8 L382.6,175.5 L374.9,175.5 L374.9,164.1 L367.2,164.1 L367.2,152.7 L359.5,152.7 L359.5,141.4 L351.7,141.4 L351.7,130.0 L344.0,130.0"/><g class="wx-pop" style="--d:8"><path class="wx-dim" marker-start="url(#jericho-f2-ah)" marker-end="url(#jericho-f2-ah)" d="M556,127 V378"/><text class="wx-t-n wx-halo" x="564" y="256">8.5 m</text></g><g class="wx-pop" style="--d:9"><path class="wx-dim" marker-start="url(#jericho-f2-ah)" marker-end="url(#jericho-f2-ah)" d="M252,420 H518"/><text class="wx-t-n" x="385" y="438" text-anchor="middle">c. 9 m at the base</text></g><g class="wx-pop" style="--d:9"><path class="wx-dim" marker-start="url(#jericho-f2-ah)" marker-end="url(#jericho-f2-ah)" d="M282,108 H488"/><text class="wx-t-n wx-halo" x="385" y="100" text-anchor="middle">c. 7 m at the top</text></g><g class="wx-pop" style="--d:10"><path class="wx-thin" d="M600,196 L430,264"/><text class="wx-t-b" x="604" y="192">22 stone steps</text><text class="wx-t-m" x="604" y="208">inside, roofed</text><text class="wx-t-m" x="604" y="224">with stone slabs</text></g><g class="wx-pop" style="--d:11"><path class="wx-thin" d="M150,250 L218,300"/><text class="wx-t-b" x="24" y="226">Town wall,</text><text class="wx-t-m" x="24" y="242">c. 3.6 m high</text></g><g class="wx-pop" style="--d:11"><path class="wx-thin" d="M600,300 L518,356"/><text class="wx-t-b" x="604" y="296">Doorway</text><text class="wx-t-m" x="604" y="312">at the foot</text></g><g class="wx-pop" style="--d:12"><circle class="wx-line" cx="640" cy="335.5" r="5.5"/><path class="wx-line" d="M640,341 L640,362 M632,380 L640,362 L648,380 M630,356 L640,346 L650,356"/><text class="wx-t-s" x="640" y="396" text-anchor="middle">1.7 m</text></g><g class="wx-pop" style="--d:12"><rect class="wx-inkfill" x="24" y="330" width="30" height="6"/><rect class="wx-paper wx-edge" x="54" y="330" width="30" height="6"/><rect class="wx-inkfill" x="84" y="330" width="30" height="6"/><rect class="wx-paper wx-edge" x="114" y="330" width="30" height="6"/><rect class="wx-inkfill" x="144" y="330" width="30" height="6"/><text class="wx-t-s" x="24" y="352" text-anchor="middle">0</text><text class="wx-t-s" x="174" y="352" text-anchor="middle">5 m</text></g><text class="wx-t-s" x="24" y="464">After Kenyon's excavation records; dimensions as published, staircase geometry simplified.</text></svg></div></div><figcaption>A simplified section through the tower at true scale, with its internal staircase, the town wall beside it and a person for comparison. <span class="wx-src">Based on: Dimensions from Kenyon&#x27;s excavation reports (height c. 8.5 m, base c. 9 m, top c. 7 m, 22 steps; wall c. 3.6 m); staircase geometry simplified.</span></figcaption><p class="vh">A tapering stone tower in section, about 9 m wide at the base and 7 m at the top, 8.5 m tall, with dimension lines. Inside, a staircase of 22 steps rises diagonally from a doorway at the foot on the right to an opening at the top left, drawn as a pale passage with a highlighted stepped line. On the left a lower block marks the town wall, about 3.6 m high. On the right stands a 1.7 m person, and a 5 m scale bar sits on the left.</p></figure><p>Nobody knows what the tower was for. Kenyon, who found it in the 1950s, saw it as defensive. Others suggest flood control, storage, a place for ceremonies, or a statement of power. In 2008 Roy Liran and Ran Barkai argued that it was placed so that the shadow of the nearby mountains at midsummer sunset would fall on it first, linking it to the calendar. Whatever its purpose, it belongs to the same astonishing early world as Göbekli Tepe: people who were supposed to be simple villagers building on a scale the textbooks once reserved for kings.</p><blockquote class="wpull"><p>The oldest monumental building in a city famous for a collapse is a tower that has stood for 10,000 years.</p></blockquote></section><section class="wsec" id="jericho-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The story in Joshua</h3><p>Jericho&#x27;s fame, though, comes from a different moment. In the Book of Joshua the Israelites cross the Jordan into Canaan. Jericho is shut up tight. For six days the people march around the city once a day, with priests carrying the Ark of the Covenant and blowing rams&#x27; horns. On the seventh day they circle it seven times, the priests blow, the people shout, and the wall falls.</p><blockquote class="quote"><p>So the people shouted when the priests blew with the trumpets: and it came to pass, when the people heard the sound of the trumpet, and the people shouted with a great shout, that the wall fell down flat, so that the people went up into the city, every man straight before him, and they took the city.</p><cite>Joshua 6:20, King James Version (1611)</cite></blockquote><p>The city is burned, Rahab and her family are spared, and Joshua lays a curse on anyone who rebuilds it. The testable parts are clear: a walled city, a sudden collapse, and a fire, at a time that biblical chronology can help fix. The First Book of Kings (6:1) places the Exodus 480 years before Solomon began the Temple, which points to a conquest around 1400 BCE. Many historians instead link the emergence of Israel to the 13th or 12th century BCE. Either way, the question for archaeology is simple: was there a walled Jericho to fall?</p></section><section class="wsec" id="jericho-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Garstang finds his walls, Kenyon takes them away</h3><p>In the 1930s the British archaeologist John Garstang dug at the tell and found what looked like the answer: a double ring of mudbrick walls, collapsed and burned. From pottery and Egyptian scarabs he dated the destruction to around 1400 BCE. It seemed a triumph for the biblical account, and it was widely reported as one.</p><p>Then Kathleen Kenyon, one of the pioneers of careful stratigraphic excavation, returned between 1952 and 1958. Digging in narrow, deep trenches that let her read the layers precisely, she showed that Garstang&#x27;s double wall belonged to the Early Bronze Age, over 1,000 years before any date proposed for Joshua. The last strong city, with a massive stone revetment and mudbrick wall above it, had been destroyed in a fierce fire at the end of the Middle Bronze Age, which she put at around 1550 BCE. After that, she found only scraps: part of a small 14th-century building and some tombs. Her conclusion became the textbook one. When Joshua was supposed to come, there was no walled Jericho to conquer.</p></section><section class="wsec" id="jericho-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The challenger&#x27;s case</h3><p>In 1990 Bryant Wood, an archaeologist specialising in Canaanite pottery, reopened the question in Biblical Archaeology Review. He pointed out that Kenyon had leaned on an argument from absence: a distinctive imported Cypriot ware typical of the 15th century was missing, so she placed the destruction earlier. But she had dug in a poor quarter of the city, where expensive imports would be rare. Wood argued that the local pottery from the destruction layer fits the late 15th century, that scarabs in the cemetery name Egyptian rulers down to the early 14th century BCE, and that other details match the biblical story strikingly well.</p><ul class="wlist"><li>Many storage jars full of burned grain: the city fell quickly, before its food was used up, and was burned rather than plundered, as Joshua 6 commands.</li><li>Tumbled mudbrick piled at the foot of the stone revetment, as if the wall above had collapsed outward, making a ramp for attackers.</li><li>An earthquake-prone rift valley, which could explain a sudden collapse.</li></ul><p>David Rohl, an Egyptologist and author, argues differently. He accepts the destruction where Kenyon put it in the archaeological sequence but proposes that the conventional Egyptian chronology, on which Bronze Age dates across the Levant hang, should be moved later by about three centuries. On his New Chronology, Kenyon&#x27;s burned city becomes Joshua&#x27;s.</p></section><section class="wsec" id="jericho-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The grain that dated the fire</h3><p>Both challenges meet a problem that did not exist in Kenyon&#x27;s time. In 1995 Hendrik Bruins and Johannes van der Plicht of Groningen published high-precision radiocarbon dates on material from Kenyon&#x27;s excavation of that very destruction. Six samples were charred cereal grains, which grow and die within a single year, so they date the harvest just before the fire. Their weighted average is 3306 ± 7 radiocarbon years before present, which calibrates to the late 17th or 16th century BCE. The drawing sets that date beside the others.</p><figure class="wx wx--steps" id="jericho-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">Five dates for one destruction</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Five dates for one destruction"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 432" class="wx-svg" role="img" aria-labelledby="jericho-f1-t"><title id="jericho-f1-t">Five attempts to date the fall of Jericho's walls, plotted on one time axis from 1800 to 1100 BCE</title><text class="wx-t-cap" x="24" y="24">When did Jericho's last walled city fall?</text><text class="wx-t-h" x="24" y="52">Five dates for one destruction</text><path class="wx-guide" d="M402.9,76 V362 M274.3,76 V362"/><text class="wx-t-s" x="402.9" y="72" text-anchor="middle">1400 BCE</text><text class="wx-t-s" x="274.3" y="72" text-anchor="middle">1550 BCE</text><path class="wx-line wx-draw" pathLength="1" d="M60,362 H660"/><path class="wx-dim" d="M60.0,362 V370"/><text class="wx-t-s" x="60.0" y="386" text-anchor="middle">1800</text><path class="wx-dim" d="M145.7,362 V370"/><text class="wx-t-s" x="145.7" y="386" text-anchor="middle">1700</text><path class="wx-dim" d="M231.4,362 V370"/><text class="wx-t-s" x="231.4" y="386" text-anchor="middle">1600</text><path class="wx-dim" d="M317.1,362 V370"/><text class="wx-t-s" x="317.1" y="386" text-anchor="middle">1500</text><path class="wx-dim" d="M402.9,362 V370"/><text class="wx-t-s" x="402.9" y="386" text-anchor="middle">1400</text><path class="wx-dim" d="M488.6,362 V370"/><text class="wx-t-s" x="488.6" y="386" text-anchor="middle">1300</text><path class="wx-dim" d="M574.3,362 V370"/><text class="wx-t-s" x="574.3" y="386" text-anchor="middle">1200</text><path class="wx-dim" d="M660.0,362 V370"/><text class="wx-t-s" x="660.0" y="386" text-anchor="middle">1100</text><text class="wx-t-s" x="660" y="404" text-anchor="end">years BCE</text><g class="wx-st" data-s="1"><text class="wx-t-b" x="24" y="104">1 · Garstang, 1930s: fallen walls, c. 1400 BCE</text><circle class="wx-c4" cx="402.9" cy="120" r="7"/><path class="wx-line" d="M362.9,120 H442.9"/><text class="wx-t-m" x="452.9" y="124">pottery and scarabs</text></g><g class="wx-st" data-s="2"><text class="wx-t-b" x="24" y="154">2 · Kenyon, 1950s: last walled city burned c. 1550 BCE</text><circle class="wx-c2" cx="274.3" cy="170" r="7"/><path class="wx-line" d="M252.9,170 H295.7"/><text class="wx-t-m" x="309.7" y="174">Garstang's walls were c. 1,000 years older</text></g><g class="wx-st" data-s="3"><text class="wx-t-b" x="24" y="204">3 · Radiocarbon on burned grain, 1995: 3306 ± 7 BP</text><rect class="wx-c3 wx-o60" x="216.9" y="213" width="74.5" height="14" rx="3"/><path class="wx-line wx-s3" d="M216.9,220 H291.4"/><text class="wx-t-m" x="303.4" y="224">calibrated: late 17th to 16th century BCE</text></g><g class="wx-st" data-s="4"><text class="wx-t-b" x="24" y="254">4 · Bryant Wood, 1990: back to c. 1400 BCE</text><circle class="wx-c1" cx="402.9" cy="270" r="7"/><path class="wx-line" d="M385.7,270 H420.0"/><text class="wx-t-m" x="434.9" y="274">needs the radiocarbon to be wrong</text></g><g class="wx-st" data-s="5"><text class="wx-t-b" x="24" y="304">5 · The texts: 1 Kings 6:1 points to c. 1400; many historians prefer 1250–1150</text><circle class="wx-c5" cx="397.7" cy="322" r="6"/><rect class="wx-c5 wx-o40" x="531.4" y="315" width="85.7" height="14" rx="3"/><text class="wx-t-s" x="625.1" y="326">town all but empty</text></g><text class="wx-t-s" x="24" y="426">Radiocarbon: Bruins and van der Plicht 1995; calibrated range as summarised for the Italian-Palestinian project.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> 1930s: John Garstang finds collapsed, burned walls and dates them by pottery and scarabs to about 1400 BCE, apparently matching Joshua.</p><ol class="wx-steplist"><li>1930s: John Garstang finds collapsed, burned walls and dates them by pottery and scarabs to about 1400 BCE, apparently matching Joshua.</li><li>1950s: Kathleen Kenyon shows Garstang&#x27;s walls are Early Bronze Age. The last walled city burned about 1550 BCE.</li><li>1995: radiocarbon on charred grain from that fire averages 3306 ± 7 BP, calibrating to the late 17th or 16th century BCE.</li><li>1990: Bryant Wood argues from pottery and scarabs for about 1400 BCE again. That needs the grain dates to be about 150 years too old.</li><li>The texts: 1 Kings 6:1 points to about 1400 BCE; many historians place Israel&#x27;s emergence around 1250–1150 BCE, when Jericho was nearly empty.</li></ol><figcaption>Step through a century of attempts to date the fall of Jericho&#x27;s last walled city, on one time axis from 1800 to 1100 BCE. <span class="wx-src">Based on: Garstang and Garstang 1940; Kenyon 1957; Wood 1990; Bruins and van der Plicht 1995; calibrated range 1617–1530 BCE as summarised in recent syntheses of the site.</span></figcaption><p class="vh">A horizontal time axis runs from 1800 BCE on the left to 1100 BCE on the right, with dashed guides at 1550 and 1400 BCE. Step 1: Garstang&#x27;s 1930s date, a red dot at 1400 BCE based on pottery and scarabs. Step 2: Kenyon&#x27;s 1950s date, a blue dot at about 1550 BCE, with a note that Garstang&#x27;s walls were about 1,000 years older. Step 3: a green bar from about 1617 to 1530 BCE for radiocarbon on burned grain, 3306 plus or minus 7 BP. Step 4: Bryant Wood&#x27;s 1990 date, back at about 1400 BCE, which needs the radiocarbon to be wrong. Step 5: the biblical date from 1 Kings 6:1 near 1400 BCE, and a purple band from 1250 to 1150 BCE preferred by many historians, when the town was all but empty.</p></figure><p>The radiocarbon is decisive against both routes to 1400 BCE for this particular destruction. It does not depend on pottery styles, so it answers Wood&#x27;s pottery argument; and it does not depend on Egyptian king lists, so it cannot be moved by re-dating the pharaohs, as Rohl proposes. For the conquest story to match this fire, the burned grain would have to be about 150 years younger than its carbon says.</p><aside class="wcall"><b>How do we know?</b><p>Radiocarbon measures the decay of carbon-14 in once-living material. Because the amount of carbon-14 in the air has varied, raw dates are calibrated against a curve built from tree rings of known age. Short-lived samples such as seeds avoid the &#x27;old wood&#x27; problem, where charcoal from a centuries-old beam gives a date far older than the fire. At Jericho the charcoal was indeed older on average, 3370 ± 6 BP, just as that problem predicts.</p></aside></section><section class="wsec" id="jericho-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What erosion took</h3><p>The honest gap in the mainstream account is the Late Bronze Age itself. Jericho sits in a hot valley with fierce winter downpours, and an abandoned mudbrick town melts. Kenyon believed that much of the later Bronze Age settlement had simply washed off the mound, leaving the few floors and tombs she found. If so, the absence of a 14th- or 13th-century city is partly the absence of preserved layers, not proof that nobody lived there. An Italian-Palestinian expedition working since 1997 has refined the Bronze Age sequence, but the upper levels remain thin everywhere they have looked.</p><p>The biblical text has its own clues. Joshua curses whoever rebuilds Jericho, and the First Book of Kings (16:34) reports that a man named Hiel rebuilt it in the time of King Ahab, in the 9th century BCE. Archaeology does show Iron Age occupation returning to the site. For a long stretch before that, the great mound by the spring would have been a striking ruin, its broken walls visible to anyone passing. Many scholars think that is where the story began: a real catastrophe, remembered by the landscape itself and later woven into Israel&#x27;s account of its origins.</p></section><section class="wsec" id="jericho-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle it</h3><p>Three kinds of evidence could move this case. A new, systematic radiocarbon programme on seeds from every Middle and Late Bronze Age floor, analysed with modern statistical models, would test the 1995 dates and fix the Late Bronze settlement&#x27;s start and end. Excavation on the slopes, where eroded material from the summit would have collected, could recover the missing later town. And micromorphology on the grain jars and fallen brick could show whether the collapse came from an earthquake, a siege, or both.</p><p>For now, the evidence tells a remarkable story, just not the one Garstang hoped for. Jericho&#x27;s walls really did fall, violently, and the city really did burn with its grain still in the jars. It happened more than a century before any proposed date for Joshua. The deeper surprise of Jericho is older still: a 10,000-year-old tower that shows how early people began building for the ages.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-use" style="--i:0"><span class="wtl-y">10,000 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Natufian hunter-gatherers settle by the spring</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">8,000 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">The stone tower and town wall are built</span></li><li class="wtl-loss" style="--i:2"><span class="wtl-y">1,575 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Last Middle Bronze Age walled city burns (radiocarbon)</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">1,406 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Traditional date for Joshua from 1 Kings 6:1</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">1868 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Charles Warren makes the first soundings</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1930 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">John Garstang begins excavating</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">1952 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Kathleen Kenyon begins her excavations</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">1990 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Bryant Wood argues for a destruction c. 1400 BCE</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">1995 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Radiocarbon on burned grain published</span></li><li class="wtl-event" style="--i:9"><span class="wtl-y">2023 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Tell es-Sultan inscribed as a UNESCO World Heritage Site</span></li></ol><details class="srcs"><summary>Sources for this case (10)</summary><ol><li>Bruins H. J., van der Plicht J. (1995). Tell es-Sultan (Jericho): radiocarbon results of short-lived cereal and multiyear charcoal samples from the end of the Middle Bronze Age. Radiocarbon 37(2): 213–220. <a href="https://doi.org/10.1017/S0033822200030666" target="_blank" rel="noopener">doi:10.1017/S0033822200030666</a></li><li>Kenyon K. M. (1957). Digging Up Jericho. Ernest Benn.</li><li>Kenyon K. M., Holland T. A. (1981). Excavations at Jericho, vol. 3: The Architecture and Stratigraphy of the Tell. British School of Archaeology in Jerusalem.</li><li>Garstang J., Garstang J. B. E. (1940). The Story of Jericho. Hodder and Stoughton.</li><li>Wood B. G. (1990). Did the Israelites conquer Jericho? A new look at the archaeological evidence. Biblical Archaeology Review 16(2): 44–58.</li><li>Bienkowski P. (1990). Jericho was destroyed in the Middle Bronze Age, not the Late Bronze Age. Biblical Archaeology Review 16(5).</li><li>Barkai R., Liran R. (2008). Midsummer sunset at Neolithic Jericho. Time and Mind 1(3): 273–283. <a href="https://doi.org/10.2752/175169708X329345" target="_blank" rel="noopener">doi:10.2752/175169708X329345</a></li><li>Rohl D. (1995). A Test of Time: The Bible from Myth to History. Century.</li><li>Finkelstein I., Silberman N. A. (2001). The Bible Unearthed. Free Press.</li><li>UNESCO World Heritage Centre. Ancient Jericho/Tell es-Sultan (no. 1687), inscribed 2023.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-jericho" data-t="Jericho: The Walls That Fell Too Early"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Jericho: The Walls That Fell Too Early</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-jericho</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-gilgamesh-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Hero mastering a lion-AO 19862-Paris 2016 (30109929844).jpg" data-cap="Hero mastering a lion, Khorsabad" data-big><figcaption></figcaption></figure><div class="sh-k">Legends and Relics</div><h2 class="sh-t" id="case-gilgamesh-st" tabindex="-1">Gilgamesh: Was the First Epic Hero a Real King?</h2><p class="sh-s">A king list gives him 126 years on the throne and puts eight kings and 241,200 years before a flood. Is anything in it real?</p><div class="sh-v"><span class="vstamp vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><p class="sh-claim"><b>What the stamp rates:</b> Gilgamesh was a real king of Uruk who ruled around 2700–2600 BCE.</p></div><p class="v4-q">Was Gilgamesh a real king of Uruk, and what do the impossible reigns remember?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Gilgamesh, hero of the oldest epic, is listed as a king of Uruk who reigned 126 years.</li><li>Uruk was a real walled city, and his rival&#x27;s father is named on stone vessels from about 2600 BCE.</li><li>Gilgamesh was worshipped as a god within a few generations of his supposed lifetime.</li><li>What is missing is any inscription of his own, which is not surprising for a period with almost none.</li><li>A real king is plausible; the impossible reigns before the flood cannot be read as literal years.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Texts and scripts</span><span class="thr">Archaeology</span></div></section><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Gilgamesh was a real king of Uruk who ruled around 2700–2600 BCE.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Everything around him checks out. His rival&#x27;s father, Enmebaragesi, is named on vessels of about 2600 BCE; Uruk was a real, walled metropolis; Gilgamesh was worshipped as a god within a few generations; and later kings named him beside rulers who are securely attested. What is missing is his own inscription. That is not surprising for the period, since royal inscriptions from Uruk at this date are very rare, but it keeps him at plausible rather than strong. The pre-flood reigns are a different matter and cannot be read as literal years.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 3 of 6, leaning one way"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>leaning one way</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks usually say Gilgamesh &#x27;was probably a real king&#x27;, which matches the evidence well: cautious and circumstantial. Where they are sometimes overconfident is in dismissing the King List as pure propaganda. Its later sections are accurate, its flood break matches real flood deposits at Shuruppak and Kish, and the Enmebaragesi find shows that names once thought legendary can surface in stone. The list deserves more careful reading than a shrug.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>The Sumerian King List gives eight kings before the flood a combined 241,200 years and Gilgamesh of Uruk 126 years; its best copy, the Weld-Blundell Prism, dates to about 1800 BCE.<small>ETCSL 2.1.1; Jacobsen 1939</small></li><li>Enmebaragesi of Kish, father of Gilgamesh&#x27;s rival Aga in the poem Gilgamesh and Aga, is named as king of Kish on stone vessel fragments of about 2600 BCE: the earliest King List ruler attested in his own time.<small>Frayne 2008, RIME 1</small></li><li>Gilgamesh is already listed as a god in god lists from Fara (Shuruppak) of about 2600 BCE, within a few generations of his supposed lifetime.<small>George 2003</small></li><li>Uruk was one of the largest cities on Earth in the early 3rd millennium BCE, ringed by a wall about 9 km long that later Uruk kings credited to Gilgamesh.<small>George 2003; Uruk excavations</small></li><li>George Smith announced the Babylonian flood story on Tablet XI of the Epic to the Society of Biblical Archaeology in London on 3 December 1872.<small>Smith 1873</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether Gilgamesh was a historical ruler whose fame grew into myth, or a hero or god later placed on a king list.</li><li>Why the early reigns are so long: inflation for prestige, number symbolism in base 60, or a garbled memory of a far older past.</li><li>Whether the King List&#x27;s flood remembers one real, unusually large flood, such as the layer at Shuruppak dated to about 2900 BCE.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Early Dynastic Uruk lies under deep later levels; the palace and archives of Gilgamesh&#x27;s time, if they existed, have not been found.</li><li>Southern Iraq&#x27;s sites were heavily looted in the 1990s and after 2003; tens of thousands of tablets entered the market without findspots, stripping away their context.</li><li>Unbaked clay and mud brick decay; most records of the early 3rd millennium never survived, and writing was then still mainly used for accounts.</li></ul></div></div><h3 class="sub-h wsub">How the traditions tell it</h3><div class="v4texts"><blockquote class="quote v4q"><span class="v4q-t">Sumerian King List · ETCSL 2.1.1, lines on the flood</span><p>Then the flood swept over. After the flood had swept over, and the kingship had descended from heaven, the kingship was in Kish.</p><cite>trans. J. A. Black et al., Electronic Text Corpus of Sumerian Literature (Oxford, 1998–2006)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Sumerian King List · ETCSL 2.1.1, First Dynasty of Uruk</span><p>Gilgamesh, whose father was a phantom (?), the lord of Kulaba, ruled for 126 years.</p><cite>trans. J. A. Black et al., Electronic Text Corpus of Sumerian Literature (Oxford, 1998–2006)</cite></blockquote></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Most Assyriologists think a real Gilgamesh probably ruled Uruk around 2700–2600 BCE, but they hold that view loosely. His rival&#x27;s father is attested in stone, he was deified early, and later kings treated him as a predecessor. The King List itself is read as a political document, written in the late 3rd millennium to argue that kingship passed from one city to another, one at a time. Its long early reigns are treated as legendary inflation, not memory.</p><ul><li>Enmebaragesi&#x27;s inscription anchors the Gilgamesh and Aga story in a real Early Dynastic world.</li><li>The Tummal Inscription lists Gilgamesh among rulers who rebuilt a shrine at Nippur, next to kings who are attested in their own inscriptions.</li><li>The King List was compiled or reshaped under the Akkad or Ur III kings, so its structure serves their politics.</li><li>No contemporary inscription of Gilgamesh as king has been found.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Graham Hancock and others read the pre-flood kings not as invention but as a scrambled memory of a real age that ended in catastrophe. Mesopotamian scribes, the Babylonian priest Berossus and the book of Genesis all keep a short list of long-lived rulers or patriarchs before a flood, and all treat the flood as the great break in history. In Hancock&#x27;s reading the numbers are encoded time, and the sages said to have served those kings, the apkallu, recall survivors who carried knowledge across the break.</p><ul><li>Berossus, writing about 290 BCE, gave ten pre-flood kings a total of 120 sars, 432,000 years.</li><li>Genesis 5 lists ten generations of very long-lived patriarchs before Noah&#x27;s flood.</li><li>Mesopotamian tradition credits the apkallu sages, who served the pre-flood kings, with bringing the arts of civilisation.</li></ul><div class="face-s"><b>Its strongest point</b><p>Several independent-looking traditions agree on the same shape of the past: a short line of pre-flood rulers, a flood that broke history, and kingship restarted afterwards. Shapes like that can preserve real memories even when the numbers are wild.</p></div><p class="face-cr"><b>Credit</b> Graham Hancock; readers of Berossus and the pre-flood king lists</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>An Early Dynastic inscription, sealing or votive object naming Gilgamesh (Bilgames) as king or lord of Uruk.</li><li>Excavation of 3rd-millennium palace or archive levels at Uruk, beneath the later Eanna and Anu precincts.</li><li>Radiocarbon dates tying Uruk&#x27;s city wall firmly to one generation around 2700–2600 BCE.</li><li>Early copies of the King List&#x27;s pre-flood section older than the Old Babylonian period, which would show whether it was original or added later.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">7 min read · 1,459 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of Gilgamesh: Was the First Epic Hero a Real King?"><button type="button" class="wtoc-i" data-go="gilgamesh-s1">A king who ruled for 126 years</button><button type="button" class="wtoc-i" data-go="gilgamesh-s2">What the clay and stone firmly say</button><button type="button" class="wtoc-i" data-go="gilgamesh-s3">The mainstream reading: a real man inside a political text</button><button type="button" class="wtoc-i" data-go="gilgamesh-s4">The challengers: a memory from before the flood?</button><button type="button" class="wtoc-i" data-go="gilgamesh-s5">The flood tablet and a looted dream</button><button type="button" class="wtoc-i" data-go="gilgamesh-s6">What time and looting have hidden</button><button type="button" class="wtoc-i" data-go="gilgamesh-s7">What would settle it</button></nav></div><section class="wsec" id="gilgamesh-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A king who ruled for 126 years</h3><p>Around 1800 BCE a scribe in southern Mesopotamia pressed a list of every king who had ever ruled onto a four-sided clay prism. It begins in a world we would not recognise. Kingship comes down from heaven to Eridu, where Alulim rules for 28,800 years. Eight kings in five cities rule for 241,200 years in all. Then, in one flat line, the whole world changes: the flood sweeps over, kingship descends from heaven again, and the story restarts at Kish.</p><blockquote class="quote"><p>Then the flood swept over. After the flood had swept over, and the kingship had descended from heaven, the kingship was in Kish.</p><cite>Sumerian King List, trans. J. A. Black et al., ETCSL 2.1.1 (Oxford, 1998–2006)</cite></blockquote><p>A few dozen names later comes the most famous hero of the ancient world: Gilgamesh, lord of Kulaba, who ruled Uruk for 126 years. He is the star of the oldest great epic, the man who fought Humbaba in the Cedar Forest, lost his friend Enkidu, and crossed the waters of death to ask the flood survivor for the secret of eternal life. So was he a real man? And what, if anything, do those impossible reigns remember?</p></section><section class="wsec" id="gilgamesh-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What the clay and stone firmly say</h3><p>Start with what does not depend on the King List. Uruk was real and enormous. By the early 3rd millennium BCE it covered about 5.5 square kilometres inside a city wall about 9 km long, one of the largest cities anywhere on Earth. Centuries later, a king of Uruk named Anam recorded that he restored the city&#x27;s old wall, which he called the work of Gilgamesh. The epic ends with the same wall: its hero, having failed to win immortality, shows it off to a boatman as the thing that will outlast him.</p><p>The best anchor is his rival&#x27;s family. In the Sumerian poem Gilgamesh and Aga, Aga of Kish besieges Uruk and Gilgamesh faces him down. Aga&#x27;s father, according to the King List, was Enmebaragesi. For a long time Enmebaragesi looked as legendary as the rest, with 900 years on the throne. Then fragments of stone vessels turned up bearing his name and the title &#x27;king of Kish&#x27;, in a style of about 2600 BCE. He is the earliest ruler on the list whose existence is confirmed in his own time.</p><figure class="wx wx--static" id="gilgamesh-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">How long the King List says they ruled</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How long the King List says they ruled"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" class="wx-svg" role="img" aria-labelledby="gilgamesh-f1-t"><title id="gilgamesh-f1-t">Reign lengths in the Sumerian King List, on a logarithmic scale</title><text class="wx-t-cap" x="16" y="20">Years of reign, logarithmic scale</text><path class="wx-guide" d="M222.0,50V582"/><text class="wx-t-s" x="222.0" y="42"
