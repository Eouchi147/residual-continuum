"637.5" cy="343.2" r="3.2"/><rect class="wx-accfill wx-o80" x="225" y="112" width="15" height="46"/><path class="wx-dash" d="M232.5,160 V304"/><text class="wx-t-b wx-halo" x="232.5" y="176" text-anchor="middle">993</text></g><g class="wx-st" data-s="4"><path class="wx-hl" marker-end="url(#vinland-f1-ah)" d="M232.5,200 H652"/><text class="wx-t-b wx-halo" x="440" y="194" text-anchor="middle">29 rings out to the bark</text><text class="wx-t-big wx-t-a" x="700" y="236" text-anchor="end">1021</text></g><g class="wx-st wx-hide" data-s="5"><text class="wx-t-b" x="24" y="448">Three pieces, three trees, all cut with metal blades:</text><text class="wx-t" x="24" y="466">every one was felled in 1021 CE.</text><g class="wx-bob"><rect class="wx-wood wx-edge" x="420" y="436" width="70" height="14" rx="3"/><rect class="wx-wood wx-edge" x="500" y="436" width="84" height="14" rx="3"/><rect class="wx-wood wx-edge" x="594" y="436" width="62" height="14" rx="3"/></g><path class="wx-line" d="M486,436 L494,450 M580,436 L588,450 M652,436 L660,450"/></g><text class="wx-t-s" x="24" y="492">After Kuitems et al. 2022 (Nature 601); carbon-14 values drawn schematically, not to measured scale.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Every year a tree adds one ring. The ring under the bark is the year the tree was cut, but on its own a ring does not tell you which year that was.</p><ol class="wx-steplist"><li>Every year a tree adds one ring. The ring under the bark is the year the tree was cut, but on its own a ring does not tell you which year that was.</li><li>In 993 CE a burst of cosmic radiation, probably from an extreme solar storm, raised carbon-14 in the air everywhere. Every tree alive locked the spike into that year&#x27;s ring.</li><li>Measure carbon-14 ring by ring in the Norse-cut wood. The spike shows up in one ring, and that ring must have grown in 993.</li><li>Count outwards: the spike sits 29 rings in from the bark. The outermost ring grew in 1021, the year the tree was cut.</li><li>Three pieces of wood from three different trees, all cut with metal blades that local peoples did not use, give the same year: 1021 CE.</li></ol><figcaption>Step through the method Kuitems and colleagues used: find the carbon-14 spike of 993 CE in a piece of Norse-cut wood, then count the rings to the bark. <span class="wx-src">Based on: Method and ring count from Kuitems et al. (2022, Nature 601: 388–391); 993 CE event from Miyake et al. (2013). Carbon-14 curve drawn schematically, not to measured values.</span></figcaption><p class="vh">Top: a horizontal strip of wood with 40 annual rings from the centre on the left to the bark on the right. Step 1: the rings are unnumbered and a label under the bark asks &#x27;year?&#x27;. Step 2: below the strip a graph of carbon-14 per ring appears, flat for the earliest rings, then a sudden rise labelled the 993 CE event, recorded in trees worldwide, followed by a slow decline; year ticks 985, 993, 1000, 1010 and 1021 run under it. Step 3: measured points from the Norse wood match the curve, and the ring holding the spike is highlighted and labelled 993. Step 4: an arrow runs from the 993 ring 29 rings out to the bark, where a large label reads 1021. Step 5: three small wooden pieces with angled cuts appear with the note that all three, from three trees cut with metal blades, were felled in 1021 CE.</p></figure><p>In 2021 a team led by Margot Kuitems and Michael Dee of the University of Groningen, working with Birgitta Wallace, measured carbon-14 ring by ring in three pieces of wood from L&#x27;Anse aux Meadows, each from a different tree and each bearing cuts from a metal blade. In all three they found the 993 spike. The bark edge survived, so they could count outwards to the year each tree was cut. The answer, published in Nature, was the same for all three: 1021 CE.</p><aside class="wcall"><b>Fresh from the field</b><p>The 1021 date is the earliest securely dated evidence of Europeans in the Americas, and the first time the Atlantic crossing is fixed to a single year. It also shows how precise dating can be when a Miyake event is available: without the spike, the same wood would have given a radiocarbon range of several decades.</p></aside></section><section class="wsec" id="vinland-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The forgery that muddied the water</h3><p>Not everything offered in support of Vinland helped it. In 1965, on the eve of Columbus Day, Yale University unveiled the Vinland Map, a world map in medieval style bound with a 15th-century manuscript. It showed a large island in the western ocean labelled Vinland, and a note in Latin describing its discovery by Bjarni and Leif. It was hailed as the oldest map of America and caused a sensation.</p><p>Doubts began almost at once. In the 1970s the chemist Walter McCrone found that the ink contained anatase, a form of titanium dioxide first manufactured as a pigment around the 1920s. Defenders argued for decades that the analysis was flawed. In 2021 Yale&#x27;s own conservators and scientists re-examined the map and announced that it is a forgery: the titanium compound runs through the lines and lettering, and a Latin inscription on the back had been altered to make the map seem to belong with the manuscript. The Vinland Map is a lesson in how a spectacular fake can make a true story look doubtful, and how the real evidence was quieter: turf walls, rivets, nutshells and tree rings.</p></section><section class="wsec" id="vinland-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Where was Vinland?</h3><p>L&#x27;Anse aux Meadows fits the sagas&#x27; description of Leif&#x27;s houses, or of a base like them, but it is not Vinland itself in the sagas&#x27; sense of a land of grapes and wheat. Most specialists now see it as a gateway, used by crews who ranged south into the Gulf of St Lawrence and perhaps beyond. Those southern camps, if they were substantial at all, would have been temporary shelters of timber and turf, easy to lose to erosion, forest and later building.</p><p>That makes it a tempting field for bold claims. The Kensington Runestone, found in Minnesota in 1898, is regarded by most runologists as a 19th-century creation. The Newport Tower in Rhode Island has been dated by its mortar to the colonial era. In 2016 satellite imagery raised hopes of a second Norse site at Point Rosee in southwest Newfoundland, but excavation found no Norse traces. The lesson cuts both ways: the sagas deserved more trust than they got, but each new site still needs the same kind of evidence that L&#x27;Anse aux Meadows provided.</p></section><section class="wsec" id="vinland-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle the rest</h3><p>The voyages are no longer in doubt. The open questions are about scale and place. More tool-cut wood from L&#x27;Anse aux Meadows, dated with the 993 marker, could show whether the Norse came for one season or returned over years. A second Norse site farther south, with cut wood or iron, would locate at least part of Vinland on the map. Excavation of Indigenous sites of the period might turn up Norse objects that travelled by trade, and would give voice, through archaeology, to the people on the other side of the encounter.</p><p>In the meantime, Vinland stands as a model for this whole site. An old tradition said something that experts considered too good to be true. The tradition was right about the essentials. And the proof, in the end, came from an unexpected witness: a solar storm a thousand years ago that left the same fingerprint in every tree on Earth.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">985 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Erik the Red leads settlers to Greenland (c. 985)</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">993 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Cosmic-ray event marks tree rings worldwide</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">1000 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Leif Eriksson&#x27;s voyage to Vinland (c. 1000, sagas)</span></li><li class="wtl-use" style="--i:3"><span class="wtl-y">1021 CE</span><span class="wtl-k">In use</span><span class="wtl-t">Norse cut wood at L&#x27;Anse aux Meadows</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">1075 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Adam of Bremen mentions Vinland</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">1250 CE</span><span class="wtl-k">Event</span><span class="wtl-t">The Vinland sagas are written down in Iceland</span></li><li class="wtl-find" style="--i:6"><span class="wtl-y">1960 CE</span><span class="wtl-k">Found</span><span class="wtl-t">The Ingstads identify the site</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">1965 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Yale unveils the Vinland Map</span></li><li class="wtl-event" style="--i:8"><span class="wtl-y">1978 CE</span><span class="wtl-k">Event</span><span class="wtl-t">L&#x27;Anse aux Meadows named a UNESCO World Heritage Site</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">2021 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">1021 date published; Yale declares the map a forgery</span></li></ol><details class="srcs"><summary>Sources for this case (11)</summary><ol><li>Kuitems M., Wallace B. L., Lindsay C., Scifo A., Doeve P., Jenkins K., Lindauer S., Erdil P., Ledger P. M., Forbes V., Vermeeren C., Friedrich R., Dee M. W. (2022). Evidence for European presence in the Americas in AD 1021. Nature 601: 388–391. <a href="https://doi.org/10.1038/s41586-021-03972-8" target="_blank" rel="noopener">doi:10.1038/s41586-021-03972-8</a></li><li>Miyake F., Nagaya K., Masuda K., Nakamura T. (2012). A signature of cosmic-ray increase in AD 774–775 from tree rings in Japan. Nature 486: 240–242. <a href="https://doi.org/10.1038/nature11123" target="_blank" rel="noopener">doi:10.1038/nature11123</a></li><li>Miyake F., Masuda K., Nakamura T. (2013). Another rapid event in the carbon-14 content of tree rings. Nature Communications 4: 1748. <a href="https://doi.org/10.1038/ncomms2783" target="_blank" rel="noopener">doi:10.1038/ncomms2783</a></li><li>Ingstad A. S. (1977). The Discovery of a Norse Settlement in America: Excavations at L&#x27;Anse aux Meadows, Newfoundland 1961–1968. Universitetsforlaget.</li><li>Ingstad H. (1969). Westward to Vinland. St Martin&#x27;s Press.</li><li>Wallace B. L. (2003). The Norse in Newfoundland: L&#x27;Anse aux Meadows and Vinland. Newfoundland and Labrador Studies 19(1).</li><li>Reeves A. M., Beamish N. L., Anderson R. B. (1906). The Norse Discovery of America. Norroena Society.</li><li>Skelton R. A., Marston T. E., Painter G. D. (1965). The Vinland Map and the Tartar Relation. Yale University Press.</li><li>Yale University (2021). Beinecke Library conservators and scientists determine the Vinland Map is a fake. Yale News, 1 September 2021.</li><li>Adam of Bremen (c. 1075). Gesta Hammaburgensis ecclesiae pontificum, book 4 (Descriptio insularum Aquilonis).</li><li>UNESCO World Heritage Centre. L&#x27;Anse aux Meadows National Historic Site (no. 4), inscribed 1978.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-vinland" data-t="Vinland: The Sagas Were Right"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Vinland: The Sagas Were Right</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-vinland</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-knossos-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Knossos north entrance, Crete 001.JPG" data-cap="The north entrance at Knossos" data-big><figcaption></figcaption></figure><div class="sh-k">Legends and Relics</div><h2 class="sh-t" id="case-knossos-st" tabindex="-1">Knossos: Inside the Minotaur&#x27;s Labyrinth</h2><p class="sh-s">A monster in a maze, a king who ruled the sea, a volcano next door. How much of the myth was Bronze Age Crete, and how much was Arthur Evans?</p><div class="sh-v"><span class="vstamp vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><p class="sh-claim"><b>What the stamp rates:</b> The Minotaur and Labyrinth legend preserves a memory of Bronze Age Knossos: a vast, maze-like palace with a bull cult, at the heart of a real Aegean power.</p></div><p class="v4-q">Does the Minotaur legend remember a real palace and a real sea power?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>The Minotaur legend tells of a maze-like palace on Crete and a bull at its heart.</li><li>Knossos was a huge multi-storey palace, and bull ritual is everywhere in its art.</li><li>A clay tablet from the palace records honey for the Mistress of the Labyrinth.</li><li>Crete really was a sea power that mattered across the Aegean.</li><li>The ingredients of the myth are real; the chain of memory to later Greek storytellers cannot be shown.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Texts and scripts</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="20000" >20,000</b><span class="ctr-u"> m²</span></div><div class="ctr-l">approximate area of the palace</div><div class="ctr-c">Knossos excavation reports</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="50" >50</b><span class="ctr-u"> m</span></div><div class="ctr-l">length of the central court (about 25 m wide)</div><div class="ctr-c">Evans 1921–1935</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="7000" >7,000</b><span class="ctr-u"> BCE</span></div><div class="ctr-l">first settlement on the Kephala hill</div><div class="ctr-c">Knossos excavation reports</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="1900" >1,900</b><span class="ctr-u"> BCE</span></div><div class="ctr-l">first palace built</div><div class="ctr-c">Knossos excavation reports</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The Minotaur and Labyrinth legend preserves a memory of Bronze Age Knossos: a vast, maze-like palace with a bull cult, at the heart of a real Aegean power.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The ingredients of the myth are all real: a huge multi-storey building that bewildered visitors, bull ritual everywhere, a Linear B offering to a &#x27;Mistress of the Labyrinth&#x27;, and a Crete that mattered across the Aegean. What cannot be shown is the chain of memory from Bronze Age Knossos to the Greek storytellers of centuries later. The link is reasonable and widely accepted but indirect; the story could also have grown from ruins that later Greeks saw and explained.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Guidebooks and some museum labels still present Evans&#x27;s Knossos, with its priest-kings, queens&#x27; apartments and peaceful Minoans, as if it were simply what was found. Much of it is interpretation, and some is concrete. On the other hand, older textbooks that called Thera the destroyer of the Minoans were overconfident; the eruption came generations before the collapse. The evidence supports a real, powerful Knossos but a messier story than the tidy one on the signboards.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Knossos was settled from about 7000 BCE; the first palace was built around 1900 BCE, rebuilt after destruction around 1700 BCE, and covered roughly 20,000 m² around a central court about 50 by 25 m.<small>Knossos excavation reports; Evans 1921–1935</small></li><li>Bulls were central to Minoan ritual: bull-leaping frescoes, bull&#x27;s-head vessels and stone &#x27;horns of consecration&#x27; appear at Knossos and across Crete.<small>Heraklion Archaeological Museum collections</small></li><li>A Linear B tablet from Knossos (KN Gg 702) records honey for da-pu2-ri-to-jo po-ti-ni-ja, usually read as &#x27;the Mistress of the Labyrinth&#x27;.<small>Ventris and Chadwick 1953; Linear B corpus</small></li><li>Linear B, the script of Knossos&#x27;s final palace phase, was deciphered in 1952 as an early form of Greek, showing that Greek speakers ran the palace in its last period.<small>Ventris and Chadwick 1953</small></li><li>The eruption of Thera (Santorini) happened in the Late Minoan IA period; ice cores and tree rings narrow it to 1611, 1562–1555 or 1538 BCE, generations before the widespread destructions of Cretan palaces around 1450 BCE.<small>Pearson et al. 2022, PNAS Nexus</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the &#x27;palace&#x27; was a royal residence, a religious centre, an administrative hub, or all three; Evans&#x27;s labels such as &#x27;Throne Room&#x27; and &#x27;Queen&#x27;s Megaron&#x27; are interpretations.</li><li>Whether the word labyrinth comes from labrys, the double axe, as Evans popularised, or is an older pre-Greek word of unknown meaning.</li><li>How much the Thera eruption weakened Minoan society, and who or what destroyed the palaces around 1450 BCE: earthquakes, internal revolt, or Mycenaean conquest.</li><li>Whether the Athenian tribute to Minos recalls real Minoan dominance over the Aegean, the &#x27;thalassocracy&#x27; described by Thucydides.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Upper storeys, timber, painted plaster and textiles have largely perished; much of what we &#x27;see&#x27; of the upper floors is Evans&#x27;s reconstruction.</li><li>Linear A, the Minoans&#x27; own script, is still undeciphered, so we cannot read what they said about themselves.</li><li>Evans&#x27;s concrete rebuilding covers or replaced original fabric in several areas, making some questions impossible to check on the spot.</li></ul></div></div><h3 class="sub-h wsub">How the traditions tell it</h3><div class="v4texts"><blockquote class="quote v4q"><span class="v4q-t">Homeric epic · Odyssey 19.172–179</span><p>There is a land called Crete, in the midst of the wine-dark sea, a fair, rich land, begirt with water, and therein are many men, past counting, and ninety cities.</p><cite>trans. A. T. Murray (Loeb Classical Library, 1919)</cite></blockquote></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Knossos was the largest centre of Minoan Crete, a complex of many hundreds of rooms around a great court, with storerooms, shrines, workshops and archives. Bull imagery ran through its art and ritual. Most scholars think the later Greek myth of Minos, the Labyrinth and the Minotaur grew partly from memories of this bewildering building, its bull cult and Crete&#x27;s former importance, reshaped by Athenian storytellers centuries later. The Thera eruption was a major blow but did not end Minoan civilisation at a stroke.</p><ul><li>The palace&#x27;s size and complexity would have seemed maze-like to visitors, especially once in ruins.</li><li>Linear B shows Greek speakers controlled Knossos in its final phase, a possible root of mainland stories about Crete.</li><li>Thera erupted generations before the main palace destructions, so it was not a single knockout blow.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>In 1939 the Greek archaeologist Spyridon Marinatos argued that the Thera eruption, with its ash, earthquakes and tsunami, destroyed Minoan Crete, and he later excavated the buried town of Akrotiri to test it. Others, including the classicist J. V. Luce, suggested that the catastrophe and the fall of a rich island sea power lie behind Plato&#x27;s Atlantis. In 1972 the geologist Hans Georg Wunderlich argued that Knossos was not a palace at all but a vast necropolis, a house of the dead, and that its maze of rooms explains the labyrinth story.</p><ul><li>Thera&#x27;s eruption was one of the largest of the last 10,000 years and buried Akrotiri under tens of metres of ash and pumice.</li><li>Tsunami deposits on Crete&#x27;s north coast show the eruption did hit Minoan towns directly.</li><li>Evans&#x27;s confident palace labels rest on analogy and imagination as much as on evidence, which leaves room for other readings.</li></ul><div class="face-s"><b>Its strongest point</b><p>A civilisation that dominated the Aegean was struck by one of the largest volcanic eruptions in human history, then declined and was taken over by Greek speakers, whose descendants told stories of a lost island power and a monster in a maze.</p></div><p class="face-cr"><b>Credit</b> Spyridon Marinatos; Hans Georg Wunderlich; J. V. Luce and others on Atlantis</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Deciphering Linear A, which would let the Minoans speak for themselves about their rulers, gods and bulls.</li><li>A secure calendar date for the Thera eruption, matched to the pottery phases, to measure the gap to the palace destructions.</li><li>Full publication and scientific re-study of the older excavations, separating original fabric from Evans&#x27;s reconstructions.</li><li>More evidence from Late Bronze Age Athens and Attica for contact, tribute or conflict with Crete.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,137 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Knossos: Inside the Minotaur&#x27;s Labyrinth"><button type="button" class="wtoc-i" data-go="knossos-s1">Into the labyrinth</button><button type="button" class="wtoc-i" data-go="knossos-s2">A palace that felt like a maze</button><button type="button" class="wtoc-i" data-go="knossos-s3">What Evans built, and what he got wrong</button><button type="button" class="wtoc-i" data-go="knossos-s4">The volcano next door</button><button type="button" class="wtoc-i" data-go="knossos-s5">Challengers old and new</button><button type="button" class="wtoc-i" data-go="knossos-s6">What time has hidden, and what would settle it</button></nav></div><section class="wsec" id="knossos-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Into the labyrinth</h3><p>The Greek story is one of the darkest in their mythology. King Minos of Crete, son of Zeus, rules the sea. His wife gives birth to a monster, half man and half bull, the Minotaur. Minos has his craftsman Daedalus build a labyrinth to hold it, a building so intricate that no one who enters can find the way out. Every few years Athens must send seven young men and seven young women to be fed to the creature, until the prince Theseus volunteers, kills the Minotaur, and escapes by following a thread given to him by the king&#x27;s daughter, Ariadne.</p><blockquote class="quote"><p>There is a land called Crete, in the midst of the wine-dark sea, a fair, rich land, begirt with water, and therein are many men, past counting, and ninety cities.</p><cite>Homer, Odyssey 19.172–179, trans. A. T. Murray (Loeb Classical Library, 1919)</cite></blockquote><p>In the same passage Homer names Knossos as the great city where Minos reigned. For centuries that was just a name. Then, in 1878, a Cretan merchant named Minos Kalokairinos dug into a hill called Kephala, south of modern Heraklion, and hit walls and storage jars. In 1900 the British archaeologist Arthur Evans, who had bought the land, began to dig in earnest. Within weeks he was uncovering a building so vast and tangled that it seemed to answer the myth directly.</p></section><section class="wsec" id="knossos-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>A palace that felt like a maze</h3><p>What Evans found was a complex covering about 20,000 m², rising in places to several storeys, with many hundreds of rooms arranged around a great paved court about 50 m long and 25 m wide. There were long corridors of storerooms lined with giant jars for oil, wine and grain, light wells, staircases, shrines, workshops, and archives of clay tablets. Walk through it, even today, and it is easy to lose your bearings.</p><figure class="wx wx--static" id="knossos-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">A maze of rooms around one court</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="A maze of rooms around one court"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" class="wx-svg" role="img" aria-labelledby="knossos-f1-t"><title id="knossos-f1-t">Simplified plan of the palace of Knossos around its central court, with the areas Arthur Evans rebuilt in concrete highlighted</title><text class="wx-t-cap" x="24" y="24">Palace of Knossos · simplified plan</text><text class="wx-t-h" x="24" y="52">A maze of rooms around one court</text><path class="wx-sand wx-o60" d="M112,150 H150 V420 H112 Z"/><text class="wx-t-b" x="131" y="200" text-anchor="middle">West</text><text class="wx-t-b" x="131" y="216" text-anchor="middle">Court</text><path class="wx-line wx-draw" pathLe
