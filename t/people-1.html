<script type="text/x-tpl" id="person-laetoli-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Earliest known human footprints - one set - australopithecus afarensis - Smithsonian Museum of Natural History - 2012-05-17.jpg" data-cap="Cast of the Laetoli footprints" data-big><figcaption></figcaption></figure><div class="sh-k">Laetoli, Tanzania</div><h2 class="sh-t" id="person-laetoli-st" tabindex="-1">The Laetoli footprint makers</h2><p class="sh-s">A few upright walkers crossed a field of wet volcanic ash 3.66 million years ago, and their stride is still there.</p><div class="sh-v"><span class="vstamp vstamp--when">3.66M yrs ago</span></div></div><div class="sh-meta"><span>The first walkers whose actual steps we can follow</span><span>about 3.66 million years ago</span></div><p>In 1976, at Laetoli in northern Tanzania, a playful fight with dried elephant dung sent the researcher Andrew Hill diving to the ground, where he noticed animal tracks pressed into hardened ash. The search that followed, led by Mary Leakey, uncovered in 1978 what she had hoped for: a trail of about 70 hominin footprints stretching some 24 metres at Site G. They were made about 3.66 million years ago, after ash from a nearby eruption was dampened by light rain and then set almost like cement. At least two walkers left the trail, and a third probably stepped into the prints of one of them. Heel strikes, raised arches and big toes in line with the other toes show upright striding. The story keeps growing. In 2015 a new trail at Site S revealed an individual nicknamed S1 who may have stood about 165 cm, much taller than Lucy, hinting at large size differences within the species. In 2019 a team re-excavated odd tracks at Site A, first uncovered in 1976 and once blamed on a bear. They concluded a hominin made them, walking with a cross-over step, which suggests more than one kind of biped shared this landscape.</p><div class="evi"><div><b>What we actually have</b>Hominin trackways in the Footprint Tuff at Laetoli Sites G, S and A, plus casts, photographs and 3D scans.</div><div><b>How we know</b>Radiometric dating of the volcanic tuffs; footprint shape compared with humans, other primates and bears; stature estimated from footprint length.</div></div><div class="dyk"><p>The Site G trail was reburied in 1979 and re-protected in the 1990s after tree roots began damaging the prints.</p></div><details class="srcs"><summary>Sources (3)</summary><ol><li>Leakey, M. D. &amp; Hay, R. L. (1979). Pliocene footprints in the Laetolil Beds at Laetoli, northern Tanzania. Nature 278, 317-323. <a href="https://doi.org/10.1038/278317a0" target="_blank" rel="noopener">doi:10.1038/278317a0</a></li><li>Masao, F. T. et al. (2016). New footprints from Laetoli (Tanzania) provide evidence for marked body size variation in early hominins. eLife 5, e19568. <a href="https://doi.org/10.7554/eLife.19568" target="_blank" rel="noopener">doi:10.7554/eLife.19568</a></li><li>McNutt, E. J. et al. (2021). Footprint evidence of early hominin locomotor diversity at Laetoli, Tanzania. Nature 600, 468-471. <a href="https://doi.org/10.1038/s41586-021-04187-7" target="_blank" rel="noopener">doi:10.1038/s41586-021-04187-7</a></li></ol></details></div></script><script type="text/x-tpl" id="person-lucy-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Reconstruction of the fossil skeleton of &quot;Lucy&quot; the Australopithecus afarensis.jpg" data-cap="A reconstruction of Lucy&#x27;s skeleton" data-big><figcaption></figcaption></figure><div class="sh-k">Hadar, Ethiopia</div><h2 class="sh-t" id="person-lucy-st" tabindex="-1">Lucy (AL 288-1), also called Dinkinesh</h2><p class="sh-s">She is the most famous skeleton on Earth, and much of what people think they know about her is wrong.</p><div class="sh-v"><span class="vstamp vstamp--when">3.2M yrs ago</span></div></div><div class="sh-meta"><span>Celebrity fossil who never asked to be the &#x27;missing link&#x27;</span><span>about 3.2 million years ago</span></div><p>On 24 November 1974, Donald Johanson and Tom Gray spotted a piece of arm bone in a gully at Hadar, Ethiopia. Over the following weeks the team recovered several hundred bone fragments from one individual, about 40 percent of a skeleton. That night the camp played the Beatles&#x27; &#x27;Lucy in the Sky with Diamonds&#x27; over and over, and the name stuck. In Ethiopia she is Dinkinesh, &#x27;you are marvelous&#x27;. She stood about 1.1 metres tall, weighed perhaps 29 kg, and walked upright, while keeping long, strong arms useful for climbing. Now, what she was not. She was not the &#x27;missing link&#x27;: human evolution is a branching bush, not a chain. She was not the oldest hominin; older ones, such as Ardipithecus, are known. She was probably not alone: other hominin species likely shared the region at around the same time. And her death is an open case. A 2016 CT study argued that her unhealed fractures fit a fall from a tall tree; critics answer that many breaks could have formed long after death, as the bones fossilized and eroded. In 2025 she left Ethiopia for her first European exhibition, in Prague.</p><div class="evi"><div><b>What we actually have</b>Several hundred fragments of a single skeleton (about 40 percent complete), held at the National Museum of Ethiopia, Addis Ababa.</div><div><b>How we know</b>Radiometric dating of volcanic layers bracketing the find; comparative anatomy of pelvis, knee and ankle for upright walking; high-resolution CT scanning (2008) of the bones for injury analysis.</div></div><div class="dyk"><p>During her US tour, Lucy was CT scanned at the University of Texas in 2008, producing about 35,000 digital slices.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Johanson, D. C. &amp; Taieb, M. (1976). Plio-Pleistocene hominid discoveries in Hadar, Ethiopia. Nature 260, 293-297. <a href="https://doi.org/10.1038/260293a0" target="_blank" rel="noopener">doi:10.1038/260293a0</a></li><li>Kappelman, J. et al. (2016). Perimortem fractures in Lucy suggest mortality from fall out of tall tree. Nature 537, 503-507. <a href="https://doi.org/10.1038/nature19332" target="_blank" rel="noopener">doi:10.1038/nature19332</a></li></ol></details></div></script><script type="text/x-tpl" id="person-nariokotome-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Turkana Boy rec.jpg" data-cap="The Nariokotome skeleton, reconstructed" data-big><figcaption></figcaption></figure><div class="sh-k">Nariokotome, Kenya</div><h2 class="sh-t" id="person-nariokotome-st" tabindex="-1">The Nariokotome boy (KNM-WT 15000, &#x27;Turkana Boy&#x27;)</h2><p class="sh-s">The icon of early human long-distance walking was a child, probably with a toothache.</p><div class="sh-v"><span class="vstamp vstamp--when">1.5M yrs ago</span></div></div><div class="sh-meta"><span>Homo erectus kid with a sore back and a bad tooth</span><span>about 1.5 million years ago</span></div><p>In August 1984 Kamoya Kimeu, the celebrated fossil finder of the National Museums of Kenya, spotted a small piece of skull on a slope near the Nariokotome River, west of Lake Turkana. Excavations led by Richard Leakey and Alan Walker grew it into the most complete early human skeleton then known: about 1.5 million years old and assigned to Homo erectus (some call it Homo ergaster). He was young. His teeth were still coming in, and studies of tooth growth lines suggest he was probably around 8 years old, although estimates have ranged from about 7 to 12, because his species likely grew up faster than we do. He was already tall for his age, long-legged and narrow-hipped, a body plan suited to walking in heat. Early estimates had him becoming a 180 cm giant; later work suggests a more modest adult height. His lower jaw shows signs of infection, and a 2013 re-study argued that his spine reflects a herniated disc rather than a growth disorder, as had once been proposed. So one of the best-known fossils of our lineage is probably best imagined as a lanky, sore-backed kid with a bad tooth.</p><div class="evi"><div><b>What we actually have</b>A nearly complete skeleton, including skull, jaw, spine, ribs, pelvis and limb bones.</div><div><b>How we know</b>Dental development and tooth microstructure for age; skeletal proportions for body size; comparative anatomy and pathology studies of the spine and jaw.</div></div><div class="dyk"><p>A fossil primate, Kamoyapithecus, is named in honour of Kamoya Kimeu, the man who found the boy.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Graves, R. R. et al. (2010). Just how strapping was KNM-WT 15000? Journal of Human Evolution 59, 542-554. <a href="https://doi.org/10.1016/j.jhevol.2010.06.007" target="_blank" rel="noopener">doi:10.1016/j.jhevol.2010.06.007</a></li><li>Schiess, R. &amp; Haeusler, M. (2013). No skeletal dysplasia in the Nariokotome boy KNM-WT 15000 (Homo erectus): a reassessment of congenital pathologies of the vertebral column. American Journal of Physical Anthropology 150, 365-374. <a href="https://doi.org/10.1002/ajpa.22211" target="_blank" rel="noopener">doi:10.1002/ajpa.22211</a></li></ol></details></div></script><script type="text/x-tpl" id="person-denny-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Interior Denisova Cave.webp" data-cap="Inside Denisova Cave, Siberia" data-big><figcaption></figcaption></figure><div class="sh-k">Denisova Cave, Russia</div><h2 class="sh-t" id="person-denny-st" tabindex="-1">Denny (Denisova 11)</h2><p class="sh-s">A bone splinter the size of a thumbnail revealed a girl whose parents came from two different human groups.</p><div class="sh-v"><span class="vstamp vstamp--when">90,000 yrs ago</span></div></div><div class="sh-meta"><span>Daughter of a Neanderthal mother and a Denisovan father</span><span>about 90,000 years ago</span></div><p>Denisova Cave in Siberia has produced thousands of bone scraps too broken to identify by eye. Researchers screened them with ZooMS, a method that fingerprints the collagen protein in bone, and in 2016 reported that one splinter, among roughly 2,000 fragments, came from a hominin rather than a mammoth or a bear. It was only about 2.5 cm long. Its genome, published in 2018, told one of the most surprising family stories in science. This individual, a girl at least 13 years old, had a Neanderthal mother and a Denisovan father: not distant mixed ancestry, but first-generation parents from two different groups. Her father&#x27;s own genome carried traces of an earlier Neanderthal ancestor, so meetings like this had happened before. Her mother was genetically closer to Neanderthals who lived later in Croatia than to an earlier Neanderthal from the same Siberian cave, which hints that Neanderthal populations moved across Eurasia. Denny lived roughly 90,000 years ago. We have no face, no grave and no tools linked to her; just a sliver of long bone that changed estimates of how often these groups met and had children.</p><div class="evi"><div><b>What we actually have</b>A single fragment of long bone (specimen DC1227), about 2.5 cm long.</div><div><b>How we know</b>ZooMS collagen fingerprinting to spot the fragment; ancient DNA sequencing, including patterns of heterozygosity showing one Neanderthal and one Denisovan parent; bone cortex thickness for minimum age.</div></div><div class="dyk"><p>Only a handful of Denisovan fossils have ever been identified, so a large part of what we know about the group comes from DNA rather than bones.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Brown, S. et al. (2016). Identification of a new hominin bone from Denisova Cave, Siberia using collagen fingerprinting and mitochondrial DNA analysis. Scientific Reports 6, 23559. <a href="https://doi.org/10.1038/srep23559" target="_blank" rel="noopener">doi:10.1038/srep23559</a></li><li>Slon, V. et al. (2018). The genome of the offspring of a Neanderthal mother and a Denisovan father. Nature 561, 113-116. <a href="https://doi.org/10.1038/s41586-018-0455-x" target="_blank" rel="noopener">doi:10.1038/s41586-018-0455-x</a></li></ol></details></div></script><script type="text/x-tpl" id="person-shanidar-z-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Erbil governorate shanidar cave.jpg" data-cap="Shanidar Cave, Iraqi Kurdistan" data-big><figcaption></figcaption></figure><div class="sh-k">Shanidar Cave, Iraq</div><h2 class="sh-t" id="person-shanidar-z-st" tabindex="-1">Shanidar Z</h2><p class="sh-s">Her skull had been flattened to about 2 cm thick; scientists put her face back together piece by piece.</p><div class="sh-v"><span class="vstamp vstamp--when">75,000 yrs ago</span></div></div><div class="sh-meta"><span>Neanderthal woman rebuilt from 200 fragments</span><span>about 75,000 years ago</span></div><p>In 2018, working at Shanidar Cave in Iraqi Kurdistan for the first time in about half a century, a team led by Cambridge researchers found the upper body of a Neanderthal. Her skull had been crushed in the ground to roughly 2 cm thick. Conservator Lucia Lopez-Polin strengthened the fragile pieces on site, and in the lab more than 200 fragments were reassembled, a high-stakes 3D jigsaw. Proteins in her tooth enamel point to a female; heavy wear, with front teeth ground down to the roots, suggests she died in her mid-40s, about 75,000 years ago. She stood roughly 150 cm tall and had some of the smallest adult arm bones in the Neanderthal record. She lay on her side with her left hand under her head, with a rock behind the head, within a cluster of burials beside a tall vertical rock. She lies close to Shanidar 4, the famous &#x27;flower burial&#x27; reported in the 1960s. A 2023 study argues that the pollen there was most likely carried in by burrowing bees rather than left by mourners. The flowers may be gone, but the pattern of repeated burial at one spot still suggests these Neanderthals returned to, and remembered, their dead.</p><div class="evi"><div><b>What we actually have</b>A crushed skull and upper skeleton excavated in 2018, reconstructed from more than 200 fragments.</div><div><b>How we know</b>Enamel peptide analysis for sex; dental wear for age; stratigraphy and luminescence dating of the cave deposits; palynology and bee-burrow analysis for the pollen question.</div></div><div class="dyk"><p>Her face was modelled by the palaeoartists Adrie and Alfons Kennis for the 2024 documentary Secrets of the Neanderthals.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Pomeroy, E. et al. (2020). New Neanderthal remains associated with the &#x27;flower burial&#x27; at Shanidar Cave. Antiquity 94, 11-26. <a href="https://doi.org/10.15184/aqy.2019.207" target="_blank" rel="noopener">doi:10.15184/aqy.2019.207</a></li><li>Hunt, C. O. et al. (2023). Shanidar et ses fleurs? Reflections on the palynology of the Neanderthal &#x27;Flower Burial&#x27; hypothesis. Journal of Archaeological Science 159, 105822. <a href="https://doi.org/10.1016/j.jas.2023.105822" target="_blank" rel="noopener">doi:10.1016/j.jas.2023.105822</a></li></ol></details></div></script><script type="text/x-tpl" id="person-mungo-lady-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Lake Mungo the Wall of China-.jpg" data-cap="The eroded lunette at Lake Mungo" data-big><figcaption></figcaption></figure><div class="sh-k">Lake Mungo, Australia</div><h2 class="sh-t" id="person-mungo-lady-st" tabindex="-1">Mungo Lady (Lake Mungo 1)</h2><p class="sh-s">Forty thousand years ago, on the shore of a lake that no longer exists, people cremated a young woman with care.</p><div class="sh-v"><span class="vstamp vstamp--when">40,000 yrs ago</span></div></div><div class="sh-meta"><span>Woman at the centre of one of the oldest known cremations</span><span>about 40,000 years ago</span></div><p>In July 1968 the geologist Jim Bowler was mapping ancient shorelines in the dry Willandra Lakes of New South Wales when he noticed burnt bone weathering out of a sand dune at Lake Mungo. The remains were of a young woman. Her body had been burned, the bones broken, and then burned again before being placed in a small pit: one of the oldest known cremations anywhere. In 1974, nearby, Bowler found a man buried on his back with his hands clasped, his body sprinkled with red ochre. Dating arguments ran for decades, with estimates from under 30,000 to over 60,000 years. A 2003 multi-method study placed both burials at about 40,000 years old, which makes these among the oldest funeral rituals known for modern humans. Her story also belongs to the present. Mungo Lady was returned to her Traditional Owners, the Paakantyi, Mutthi Mutthi and Ngiyampaa peoples, in 1992; Mungo Man was returned in 2015 and brought home to Lake Mungo in 2017. For these communities she is an ancestor, not a specimen, and her return reshaped how Australian science works with Aboriginal people and their dead.</p><div class="evi"><div><b>What we actually have</b>Burnt and fragmented skeletal remains from a small pit in the Mungo lunette, plus the nearby ochre burial of Mungo Man.</div><div><b>How we know</b>Optically stimulated luminescence and other dating of the dune layers; osteology of burnt bone; burial context.</div></div><div class="dyk"><p>Lake Mungo has been dry for thousands of years; the burials sit in a crescent dune, the &#x27;Walls of China&#x27;, that formed along its old shore.</p></div><details class="srcs"><summary>Sources (1)</summary><ol><li>Bowler, J. M. et al. (2003). New ages for human occupation and climatic change at Lake Mungo, Australia. Nature 421, 837-840. <a href="https://doi.org/10.1038/nature01383" target="_blank" rel="noopener">doi:10.1038/nature01383</a></li></ol></details></div></script><script type="text/x-tpl" id="person-cave-children-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Paintings-Handprint-Cueva-de-las-Manos-Argentina.webp" data-cap="Hand stencils at the Cueva de las Manos, Argentina" data-big><figcaption></figcaption></figure><div class="sh-k">Rouffignac, France</div><h2 class="sh-t" id="person-cave-children-st" tabindex="-1">The children of the Ice Age caves</h2><p class="sh-s">Some of the marks in France&#x27;s painted caves were made by toddlers, probably held up by an adult to reach the ceiling.</p><div class="sh-v"><span class="vstamp vstamp--when">17,000–13,000 yrs ago</span></div></div><div class="sh-meta"><span>Toddlers who drew on ceilings and teenagers who fetched clay</span><span>about 17,000 to 13,000 years ago</span></div><p>In Rouffignac Cave in the Dordogne, probably around 13,000 years ago, people dragged soft fingers through the clay of a chamber ceiling, leaving looping lines called flutings. Kevin Sharpe and Leslie Van Gelder measured the width of three-finger marks and compared them with flutings made by modern volunteers. They concluded that some ceiling marks were made by children about 2 to 5 years old. Given the height of the ceiling, the smallest artists were probably lifted by adults. Picture an Ice Age grown-up holding a toddler up so the child could add their own lines. Footprints tell related stories. In 2013 three expert San trackers from Namibia, invited by the Tracking in Caves project, read Ice Age prints in caves of the French Pyrenees. At Tuc d&#x27;Audoubert they identified a man of about 38 and a boy of about 14 walking on their heels near a clay pit, probably gathering clay for the famous modelled bison about 15 metres away. At Niaux they read one set of prints as those of a girl of about 12, although those prints are not securely dated. Children were not just tagging along; they were probably taking part.</p><div class="evi"><div><b>What we actually have</b>Finger flutings in Chamber A1 of Rouffignac; human footprints preserved in cave clay at Tuc d&#x27;Audoubert and Niaux.</div><div><b>How we know</b>Metric comparison of finger-mark widths with experimental flutings; expert Indigenous tracking combined with archaeological recording of footprints.</div></div><div class="dyk"><p>The San trackers read age, sex and even load-carrying from prints, using skills learned tracking animals in the Kalahari.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Sharpe, K. &amp; Van Gelder, L. (2006). Evidence for cave marking by Palaeolithic children. Antiquity 80, 937-947. <a href="https://doi.org/10.1017/S0003598X00094527" target="_blank" rel="noopener">doi:10.1017/S0003598X00094527</a></li><li>Pastoors, A. et al. (2015). Tracking in caves: experience based reading of Pleistocene human footprints in French caves. Cambridge Archaeological Journal 25, 551-564. <a href="https://doi.org/10.1017/S0959774315000050" target="_blank" rel="noopener">doi:10.1017/S0959774315000050</a></li></ol></details></div></script><script type="text/x-tpl" id="person-naia-tpl"><div class="xp-inner"><div class="sh-hd"><div class="sh-k">Hoyo Negro, Mexico</div><h2 class="sh-t" id="person-naia-st" tabindex="-1">Naia (Hoyo Negro 5/48)</h2><p class="sh-s">A teenage girl fell into a pitch-black pit at the end of the Ice Age; divers found her lying among saber-toothed cats.</p><div class="sh-v"><span class="vstamp vstamp--when">13,000–12,000 yrs ago</span></div></div><div class="sh-meta"><span>Teenager who helped link the first Americans to living Native peoples</span><span>about 13,000 to 12,000 years ago</span></div><p>Around 13,000 to 12,000 years ago, on the Yucatan Peninsula, a teenage girl walked through a dry cave system in the dark, probably searching for water. She fell into a deep pit now called Hoyo Negro, &#x27;black hole&#x27;. Later, as the Ice Age ended and sea levels rose, the caves flooded. In 2007 cave divers exploring the drowned passages found her skeleton on the pit floor alongside the bones of saber-toothed cats, giant ground sloths and other animals that had made the same fatal mistake. Researchers named her Naia, after water nymphs. She was about 15 or 16. Her mitochondrial DNA belongs to a lineage (D1) found among living Native Americans, while her skull has the long, narrow shape typical of early Paleoamericans. Together these support the idea that the first Americans and today&#x27;s Indigenous peoples share ancestry despite differences in appearance. Later analyses, presented at a 2017 conference, suggest she was small and slender, went through repeated periods of hunger, and may have given birth before she died. Hers was likely a hard and mobile life, cut short by a single misstep in the dark.</p><div class="evi"><div><b>What we actually have</b>A nearly complete skeleton recovered from an underwater pit, with associated Ice Age animal bones.</div><div><b>How we know</b>Radiocarbon and uranium-thorium dating of tooth enamel and cave mineral deposits; mitochondrial DNA; skeletal and dental analysis.</div></div><div class="dyk"><p>Her remains lay underwater for thousands of years; mineral crusts on the bones helped scientists date her.</p></div><details class="srcs"><summary>Sources (1)</summary><ol><li>Chatters, J. C. et al. (2014). Late Pleistocene human skeleton and mtDNA link Paleoamericans and modern Native Americans. Science 344, 750-754. <a href="https://doi.org/10.1126/science.1252619" target="_blank" rel="noopener">doi:10.1126/science.1252619</a></li></ol></details></div></script><script type="text/x-tpl" id="person-otzi-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Archeoparc - Museum Ötzi Kleidung.jpg" data-cap="A replica of Ötzi&#x27;s clothing" data-big><figcaption></figcaption></figure><div class="sh-k">Tisenjoch, Italy</div><h2 class="sh-t" id="person-otzi-st" tabindex="-1">Otzi the Iceman</h2><p class="sh-s">Hikers thought they had found a recent climber; he had been lying in the ice for 5,300 years, with an arrowhead in his shoulder.</p><div class="sh-v"><span class="vstamp vstamp--when">5,300 yrs ago</span></div></div><div class="sh-meta"><span>Copper Age traveller, murder victim and the most studied body on Earth</span><span>about 5,300 years ago (c. 3350 to 3100 BCE)</span></div><p>On 19 September 1991, hikers Erika and Helmut Simon saw a brown body emerging from melting ice high in the Otztal Alps and assumed he was an unlucky modern climber. He had died about 5,300 years ago. Surveyors later placed the spot 92.56 metres inside Italy, which is why he now rests in a museum in Bolzano. For a decade he seemed to have died of exposure; then, in 2001, X-rays revealed a stone arrowhead in his left shoulder. He also had a head injury. His stomach, analysed in 2018, held a last meal eaten between half an hour and two hours before death: very fatty ibex meat, red deer, einkorn wheat and traces of bracken. The copper of his axe came from southern Tuscany. His 61 tattoos, a 2024 experimental study argues, were most likely hand-poked rather than cut. And a 2023 genome re-analysis changed his look: he probably had dark skin, dark eyes and male-pattern baldness, and more than 90 percent of his ancestry came from early farmers with roots in Anatolia. The pale, shaggy Iceman of older museum reconstructions reflected modern assumptions more than his DNA.</p><div class="evi"><div><b>What we actually have</b>A naturally mummified body with clothing, a copper axe, a bow, arrows, a dagger and other gear.</div><div><b>How we know</b>Radiocarbon dating; X-ray and CT imaging; stomach-content analysis (proteomics, lipids, DNA, microscopy); lead-isotope sourcing of the axe; whole-genome sequencing.</div></div><div class="dyk"><p>After a long legal dispute, the couple who found him were awarded a finder&#x27;s fee of 150,000 euros in 2008.</p></div><details class="srcs"><summary>Sources (3)</summary><ol><li>Maixner, F. et al. (2018). The Iceman&#x27;s last meal consisted of fat, wild meat, and cereals. Current Biology 28, 2348-2355. <a href="https://doi.org/10.1016/j.cub.2018.05.067" target="_blank" rel="noopener">doi:10.1016/j.cub.2018.05.067</a></li><li>Artioli, G. et al. (2017). Long-distance connections in the Copper Age: new evidence from the Alpine Iceman&#x27;s copper axe. PLOS ONE 12, e0179263. <a href="https://doi.org/10.1371/journal.pone.0179263" target="_blank" rel="noopener">doi:10.1371/journal.pone.0179263</a></li><li>Wang, K. et al. (2023). High-coverage genome of the Tyrolean Iceman reveals unusually high Anatolian farmer ancestry. Cell Genomics 3, 100377. <a href="https://doi.org/10.1016/j.xgen.2023.100377" target="_blank" rel="noopener">doi:10.1016/j.xgen.2023.100377</a></li></ol></details></div></script><script type="text/x-tpl" id="person-kushim-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Kushim Illustration.png" data-cap="Drawing of an early accounting tablet" data-big><figcaption></figcaption></figure><div class="sh-k">Uruk, southern Iraq</div><h2 class="sh-t" id="person-kushim-st" tabindex="-1">Kushim</h2><p class="sh-s">The first individual whose name we may be able to read left no poem, no battle and no face; just a receipt.</p><div class="sh-v"><span class="vstamp vstamp--when">3200–3000 BCE</span></div></div><div class="sh-meta"><span>Possibly the first named person in history, and possibly an accountant</span><span>about 3200 to 3000 BCE</span></div><p>Around 3200 to 3000 BCE, in the city of Uruk in what is now southern Iraq, administrators pressed signs into small clay tablets. The earliest writing, called proto-cuneiform, was not yet used for letters or poems; it was bookkeeping. One tablet, now in the Schoyen Collection, records a large total of barley over 37 months and ends with two signs read KU and SHIM. The same combination appears on about 18 tablets. Yuval Noah Harari&#x27;s bestseller Sapiens made the reading famous, rendering it as 29,086 measures of barley, signed Kushim. Specialists are more cautious. The signs could be a personal name, but they could also be a job title or the name of an office, because the earliest script rarely made the difference clear. The texts linked to Kushim deal with barley and grain products, probably connected with the malting and brewing work of a large institution. If Kushim was a person, then the first name we can read belongs not to a king but to someone checking that the numbers added up. That is a rather reassuring start for written history.</p><div class="evi"><div><b>What we actually have</b>Proto-cuneiform clay tablets from Uruk (for example MS 1717 in the Schoyen Collection) bearing the sign sequence KU.SHIM.</div><div><b>How we know</b>Decipherment of proto-cuneiform numerical systems and administrative formats, comparing sign use across hundreds of archaic tablets.</div></div><div class="dyk"><p>A rival for the &#x27;oldest known name&#x27;, Gal-Sal, appears on a tablet from around 3100 BCE together with two enslaved people, En-pap X and Sukkalgir.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Nissen, H. J., Damerow, P. &amp; Englund, R. K. (1993). Archaic Bookkeeping: Early Writing and Techniques of Economic Administration in the Ancient Near East. University of Chicago Press.</li><li>Harari, Y. N. (2014). Sapiens: A Brief History of Humankind. Harvill Secker.</li></ol></details></div></script><script type="text/x-tpl" id="person-merer-tpl"><div class="xp-inner"><div class="sh-hd"><div class="sh-k">Tura quarries and Giza, Egypt</div><h2 class="sh-t" id="person-merer-st" tabindex="-1">Merer, inspector of boatmen</h2><p class="sh-s">The oldest inscribed papyri ever found are not royal decrees; they are the work diary of a mid-level boss hauling stone for the Great Pyramid.</p><div class="sh-v"><span class="vstamp vstamp--when">2560 BCE</span></div></div><div class="sh-meta"><span>Middle manager whose logbook tracks work on the Great Pyramid</span><span>about 2560 BCE (reign of Khufu, year 27)</span></div><p>In 2013, at Wadi al-Jarf, an ancient harbour on Egypt&#x27;s Red Sea coast, a team led by Pierre Tallet and Gregory Marouard found papyrus rolls left at the entrance of storage galleries cut into the rock. They are the oldest inscribed papyri known, from late in the reign of King Khufu, around 2560 BCE. Among them is the logbook of an inspector named Merer, who led a crew of about 40 boatmen. His entries are laid out day by day in neat columns, recording a steady rhythm: loading limestone at the Tura quarries across the Nile, sailing to Akhet-Khufu, &#x27;Horizon of Khufu&#x27;, the ancient name for the Great Pyramid site at Giza, stopping overnight at places such as the She-Khufu basin, and heading back for more. The fine Tura limestone was probably destined for the pyramid&#x27;s outer casing. Merer also mentions Ankhhaf, Khufu&#x27;s half-brother, as the official in charge of a harbour at Giza. No pharaoh speaks in these pages, and there are no secret machines; just a supervisor counting trips and days. It is the closest thing we have to a worker&#x27;s view of the Great Pyramid in its final years of construction.</p><div class="evi"><div><b>What we actually have</b>Fragments of papyrus logbooks (the &#x27;Diary of Merer&#x27;) found at Wadi al-Jarf, now in the Egyptian Museum, Cairo.</div><div><b>How we know</b>Hieratic palaeography and translation; regnal-year dating in the texts; excavation of the Wadi al-Jarf harbour and storage galleries.</div></div><div class="dyk"><p>The papyri probably ended up at the Red Sea because Merer&#x27;s crew was later sent to work at the harbour there.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Tallet, P. &amp; Marouard, G. (2014). The harbor of Khufu on the Red Sea coast at Wadi al-Jarf, Egypt. Near Eastern Archaeology 77, 4-14. <a href="https://doi.org/10.5615/neareastarch.77.1.0004" target="_blank" rel="noopener">doi:10.5615/neareastarch.77.1.0004</a></li><li>Tallet, P. (2017). Les papyrus de la mer Rouge I: le journal de Merer. Institut francais d&#x27;archeologie orientale.</li></ol></details></div></script><script type="text/x-tpl" id="person-puabi-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Closeup of Queen Puabi&#x27;s gold headdress and gold jewelry recovered from the royal cemetery of Ur, Iraq 2550-2450 BCE (33434975442).jpg" data-cap="Puabi&#x27;s gold headdress" data-big><figcaption></figcaption></figure><div class="sh-k">Royal Cemetery, southern Iraq</div><h2 class="sh-t" id="person-puabi-st" tabindex="-1">Puabi of Ur</h2><p class="sh-s">Her headdress of gold leaves is one of the most dazzling objects of the ancient world; the people buried around her tell a darker story.</p><div class="sh-v"><span class="vstamp vstamp--when">2600–2500 BCE</span></div></div><div class="sh-meta"><span>Queen or high lady buried in gold, and not alone</span><span>about 2600 to 2500 BCE</span></div><p>In the late 1920s, Leonard Woolley&#x27;s excavators at Ur opened a tomb numbered PG 800 and found a woman on a wooden bier, her upper body covered in beads of gold, silver, lapis lazuli and carnelian, with a spectacular headdress of gold leaves, ribbons and flowers. A lapis cylinder seal nearby named her Puabi, with the title nin, meaning &#x27;queen&#x27; or &#x27;lady&#x27;. Unusually, the seal names no husband, which likely signals that her rank stood on its own. She died around 2600 to 2500 BCE, probably at about 40 years old. She was not buried alone. Woolley recorded dozens of attendants in her burial complex, about 52 by one count, and imagined them calmly drinking poison. In 2011, CT scans of two skulls from other graves in the Royal Cemetery suggested a harsher end: blunt-force wounds, probably from a pointed, weighted weapon, plus signs of heating and traces of mercury sulphide, possibly used to slow decay while the bodies were laid out. Behind the glitter of the headdress sits a sobering question: what did royal display cost the people around it?</p><div class="evi"><div><b>What we actually have</b>Tomb PG 800 with Puabi&#x27;s skeleton, jewellery, headdress and inscribed cylinder seals, now largely at the Penn Museum, Philadelphia.</div><div><b>How we know</b>Excavation records; reading of the cuneiform seal inscription; later CT scanning and forensic analysis of skulls from the Royal Cemetery.</div></div><div class="dyk"><p>Her name is Akkadian, not Sumerian, and may mean something like &#x27;word of my father&#x27;.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Baadsgaard, A., Monge, J., Cox, S. &amp; Zettler, R. L. (2011). Human sacrifice and intentional corpse preservation in the Royal Cemetery of Ur. Antiquity 85, 27-42.</li><li>Woolley, C. L. (1934). Ur Excavations II: The Royal Cemetery. British Museum and University of Pennsylvania Museum.</li></ol></details></div></script><script type="text/x-tpl" id="person-enheduanna-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Disk of Enheduanna (2).jpg" data-cap="The Disk of Enheduanna" data-big><figcaption></figcaption></figure><div class="sh-k">Ur, southern Iraq</div><h2 class="sh-t" id="person-enheduanna-st" tabindex="-1">Enheduanna</h2><p class="sh-s">The first author known by name in world literature may have been a princess-priestess writing about her own exile.</p><div class="sh-v"><span class="vstamp vstamp--when">2300–2250 BCE</span></div></div><div class="sh-meta"><span>Princess, high priestess and the first named author</span><span>about 2300 to 2250 BCE</span></div><p>Around 2300 BCE, Sargon of Akkad built the first great empire of Mesopotamia and installed his daughter as en-priestess of the moon god Nanna at Ur. She took, or was given, the name Enheduanna. In the 1920s Leonard Woolley&#x27;s team at Ur found a calcite disk showing her at a ritual in a flounced robe, with an inscription naming her as Sargon&#x27;s daughter. Her fame rests on poetry. Several Sumerian hymns, copied by scribes centuries later, name her as their author, which would make her the first named author in world literature. In the poem known as &#x27;The Exaltation of Inana&#x27; she speaks in the first person: pushed out of her office during a revolt, she describes her exile with raw emotion and pleads with the goddess Inana to restore her. It is vivid, personal and startlingly angry. Scholars debate how much she composed herself, because the surviving copies are around 500 years younger than she is, and the attribution may partly reflect later tradition. Either way, Mesopotamian scribes chose to remember a woman as the voice behind some of their greatest hymns.</p><blockquote class="quote"><p>I, En-hedu-ana the en priestess, entered my holy jipar in your service.</p><cite>The Exaltation of Inana (Inana B), ETCSL translation, University of Oxford</cite></blockquote><div class="evi"><div><b>What we actually have</b>An inscribed calcite (alabaster) disk from Ur (Penn Museum) naming her; Old Babylonian clay-tablet copies of hymns attributed to her; seals of her servants.</div><div><b>How we know</b>Excavation at Ur; reading of Sumerian and Akkadian inscriptions; philology of the hymn manuscripts and their colophons.</div></div><div class="dyk"><p>The disk showing her had been smashed in antiquity; it was pieced back together after excavation.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Helle, S. (2020). The birth of the author: co-creating authorship in Enheduana&#x27;s Exaltation. Orbis Litterarum 75, 55-72. <a href="https://doi.org/10.1111/oli.12250" target="_blank" rel="noopener">doi:10.1111/oli.12250</a></li><li>Black, J. et al. (1998 to 2006). The Electronic Text Corpus of Sumerian Literature, text 4.07.2. University of Oxford.</li></ol></details></div></script><script type="text/x-tpl" id="person-hammurabi-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Code of Hammurabi (Louvre Sb 8)-31434550325.jpg" data-cap="The Hammurabi stele, Louvre" data-big><figcaption></figcaption></figure><div class="sh-k">Babylon, central Iraq</div><h2 class="sh-t" id="person-hammurabi-st" tabindex="-1">Hammurabi of Babylon</h2><p class="sh-s">His famous law code was carried off as war loot, lost for three thousand years, and dug up in a different country.</p><div class="sh-v"><span class="vstamp vstamp--when">1792–1750 BCE</span></div></div><div class="sh-meta"><span>King who carved his idea of justice into stone</span><span>reigned about 1792 to 1750 BCE</span></div><p>Hammurabi ruled Babylon from about 1792 to 1750 BCE and turned a mid-sized city-state into the leading power of Mesopotamia. Late in his reign he set up a tall black stone stele, over 2 metres high, topped by a carving of the king standing before a god usually identified as Shamash, the sun god and guardian of justice. Below it: a prologue, about 282 laws, and an epilogue inviting anyone wronged to come and have the inscription read to them. The laws are not an even-handed modern code. Penalties depend on social status: destroying the eye of a free man could cost an eye, while injuring a commoner or an enslaved person meant a payment. A builder whose badly built house collapsed and killed the owner could be put to death. Many scholars now read the collection less as a rulebook judges followed and more as a royal showcase of wise judgments. The stele had its own adventures: an Elamite king carried it to Susa as war booty in the 12th century BCE, and French excavators found it there in 1901 and 1902. Today it stands in the Louvre, still making its case to visitors.</p><blockquote class="quote"><p>to bring about the rule of righteousness in the land, to destroy the wicked and the evil-doers; so that the strong should not harm the weak</p><cite>Prologue to the Laws of Hammurabi, trans. L. W. King (1910)</cite></blockquote><div class="evi"><div><b>What we actually have</b>The basalt stele in the Louvre, fragments of other copies, and later clay-tablet copies of the laws, plus Hammurabi&#x27;s surviving letters.</div><div><b>How we know</b>Decipherment of Akkadian cuneiform; comparison with legal documents, contracts and royal letters of the period.</div></div><div class="dyk"><p>Several columns of text on the stele were probably erased by the Elamite captors, perhaps to make room for an inscription that was never carved.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Roth, M. T. (1997). Law Collections from Mesopotamia and Asia Minor (2nd ed.). Scholars Press.</li><li>King, L. W. (1910). The Code of Hammurabi (translation). Public domain.</li></ol></details></div></script><script type="text/x-tpl" id="person-ea-nasir-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Complaint tablet to Ea-Nasir 2020.jpg" data-cap="Nanni&#x27;s complaint tablet" data-big><figcaption></figcaption></figure><div class="sh-k">Ur, southern Iraq</div><h2 class="sh-t" id="person-ea-nasir-st" tabindex="-1">Ea-nasir and Nanni</h2><p class="sh-s">The oldest known customer complaint was found in the house of the merchant it was aimed at.</p><div class="sh-v"><span class="vstamp vstamp--when">1750 BCE</span></div></div><div class="sh-meta"><span>Copper merchant with a bad reputation, and his furious customer</span><span>about 1750 BCE</span></div><p>Around 1750 BCE, a man named Nanni in the city of Ur was fed up. He had dealt with Ea-nasir, a merchant who brought copper up the Gulf through Dilmun (modern Bahrain), and received ingots he considered below the agreed quality. Worse, he said his servant had been treated rudely and his money had not come back. So he had a clay tablet written, and it survives: a small letter about 11.6 cm tall, now in the British Museum. He complains that messengers he sent to collect his money came back empty-handed, several times, even through dangerous territory, and he demands to be treated with respect. The best twist: the tablet was found in Ea-nasir&#x27;s own house at Ur during Leonard Woolley&#x27;s excavations, alongside other letters grumbling about copper deliveries. Either Ea-nasir kept his complaints on file, or complaints were simply a large share of his business correspondence. Nearly 4,000 years later he has become an internet legend, a sort of patron saint of bad suppliers. The tablet is also a serious window onto long-distance metal trade, credit and business etiquette in the Old Babylonian world.</p><blockquote class="quote"><p>What do you take me for, that you treat somebody like me with such contempt?</p><cite>Nanni to Ea-nasir, UET V 81, trans. A. Leo Oppenheim, Letters from Mesopotamia (1967)</cite></blockquote><div class="evi"><div><b>What we actually have</b>Clay tablet BM 131236 (UET V 81), written in Akkadian cuneiform, plus other letters from the same house at Ur.</div><div><b>How we know</b>Excavation context at Ur; decipherment and translation of Old Babylonian Akkadian letters.</div></div><div class="dyk"><p>Guinness World Records lists the tablet as the oldest written customer complaint.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Oppenheim, A. L. (1967). Letters from Mesopotamia. University of Chicago Press, pp. 82-83.</li><li>Figulla, H. H. &amp; Martin, W. J. (1953). Ur Excavations Texts V: Letters and Documents of the Old-Babylonian Period. British Museum.</li></ol></details></div></script><script type="text/x-tpl" id="person-hatshepsut-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Large Kneeling Statue of Hatshepsut MET 21V CAT091R2.jpg" data-cap="Kneeling statue of Hatshepsut" data-big><figcaption></figcaption></figure><div class="sh-k">Thebes, Egypt</div><h2 class="sh-t" id="person-hatshepsut-st" tabindex="-1">Hatshepsut</h2><p class="sh-s">She ruled Egypt as king for about twenty years; the smashing of her statues afterwards may not have been the revenge story we were told.</p><div class="sh-v"><span class="vstamp vstamp--when">1479–1458 BCE</span></div></div><div class="sh-meta"><span>Queen who made herself king</span><span>reigned about 1479 to 1458 BCE</span></div><p>Hatshepsut was the daughter of one pharaoh, the wife of another, and regent for a third, the young Thutmose III. Then she did something unusual: she had herself crowned king. For about two decades she ruled with full royal titles and was often shown with a king&#x27;s kilt and false beard. Her projects include the terraced temple at Deir el-Bahri, whose reliefs celebrate an expedition to the distant land of Punt that returned with incense trees and exotic animals. After her death her images were broken and her name cut from monuments, long read as Thutmose III&#x27;s revenge. A 2025 study of 1920s excavation archives suggests a cooler motive. Many statues were broken at weak points such as the neck, waist and knees in ways consistent with ritual &#x27;deactivation&#x27;, some faces were left intact, and the pieces were reused as building material. The erasure also came years into Thutmose&#x27;s sole reign, which fits succession politics better than personal hatred. Even her body is debated: a mummy from tomb KV60 was identified as hers in 2007 on the basis of a tooth, but that match has not been confirmed by DNA and some scholars remain unconvinced.</p><div class="evi"><div><b>What we actually have</b>Her mortuary temple at Deir el-Bahri, obelisks at Karnak, hundreds of statue fragments, inscriptions, and a debated mummy (KV60-A).</div><div><b>How we know</b>Hieroglyphic inscriptions; archaeology of statue deposits and archival excavation records; CT imaging and dental comparison for the mummy.</div></div><div class="dyk"><p>Isotope analysis of mummified baboons, animals Egyptians imported from Punt, points to a source region around modern Eritrea, Ethiopia and neighbouring lands.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Wong, J. Y. (2025). The afterlife of Hatshepsut&#x27;s statuary. Antiquity 99, 746-761. <a href="https://doi.org/10.15184/aqy.2025.64" target="_blank" rel="noopener">doi:10.15184/aqy.2025.64</a></li><li>Dominy, N. J. et al. (2020). Mummified baboons reveal the far reach of early Egyptian mariners. eLife 9, e60860. <a href="https://doi.org/10.7554/eLife.60860" target="_blank" rel="noopener">doi:10.7554/eLife.60860</a></li></ol></details></div></script><script type="text/x-tpl" id="person-tutankhamun-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Mask of Tutankhamun in 2025.jpg" data-cap="Tutankhamun&#x27;s gold mask" data-big><figcaption></figcaption></figure><div class="sh-k">Valley of the Kings, Egypt</div><h2 class="sh-t" id="person-tutankhamun-st" tabindex="-1">Tutankhamun</h2><p class="sh-s">Behind the golden mask was a young man who probably walked with a cane.</p><div class="sh-v"><span class="vstamp vstamp--when">1323 BCE</span></div></div><div class="sh-meta"><span>Teenage king whose body tells a story of illness</span><span>died about 1323 BCE</span></div><p>Howard Carter&#x27;s 1922 discovery of a nearly intact royal tomb made Tutankhamun the world&#x27;s most famous pharaoh, although he was a minor king who died young, around 1323 BCE. What does his body tell us? A 2010 study combining CT scans and DNA from royal mummies concluded that he died at about 19 and that his parents were probably brother and sister: the mummy from tomb KV55, most likely Akhenaten, and an unnamed woman known as the &#x27;Younger Lady&#x27; from tomb KV35. The study reported a clubfoot, bone death in part of his left foot (Kohler disease II), a cleft palate, and DNA from the most dangerous malaria parasite, Plasmodium falciparum. It proposed malaria combined with the bone disease as the most likely cause of death. His tomb held about 130 walking sticks and staves, some with signs of use, which fits a king who probably walked with pain. Treat the details with care: other researchers have questioned the ancient DNA methods and some diagnoses, and a broken leg remains debated as either injury or damage from embalming or excavation. The golden mask covered a young man who was probably often unwell.</p><div class="evi"><div><b>What we actually have</b>His mummy, CT data, DNA samples, and the contents of tomb KV62, including about 130 sticks and staves.</div><div><b>How we know</b>CT scanning, ancient DNA (Y-chromosome and autosomal markers) for kinship, pathogen DNA testing, and study of the tomb objects.</div></div><div class="dyk"><p>Two mummified foetuses buried in his tomb may have been his daughters, according to the same 2010 DNA study.</p></div><details class="srcs"><summary>Sources (1)</summary><ol><li>Hawass, Z. et al. (2010). Ancestry and pathology in King Tutankhamun&#x27;s family. JAMA 303, 638-647. <a href="https://doi.org/10.1001/jama.2010.121" target="_blank" rel="noopener">doi:10.1001/jama.2010.121</a></li></ol></details></div></script><script type="text/x-tpl" id="person-deir-el-medina-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Schiaparelli&#x27;s excavations - Theban region, Deir el-Medina, Excavations at the village, temple and chapels, 1905-1909, photo 32 of 38 - Archivio fotografico Museo Egizio, Turin C00860.jpg" data-cap="Deir el-Medina during excavation, about 1905" data-big><figcaption></figcaption></figure><div class="sh-k">Deir el-Medina, Egypt</div><h2 class="sh-t" id="person-deir-el-medina-st" tabindex="-1">The Deir el-Medina tomb builders (and the scribe Amennakht)</h2><p class="sh-s">When the grain rations were late, the pharaoh&#x27;s tomb builders put down their tools and walked out.</p><div class="sh-v"><span class="vstamp vstamp--when">1157 BCE</span></div></div><div class="sh-meta"><span>Royal tomb workers who staged the first recorded strike</span><span>about 1157 BCE (year 29 of Ramesses III)</span></div><p>The craftsmen who cut and decorated the royal tombs in the Valley of the Kings lived in their own walled village, Deir el-Medina, and were paid in rations of grain. In year 29 of Ramesses III, around 1157 BCE, those rations were badly overdue. So the crew did something no earlier record shows: they stopped work and walked out. The scribe Amennakht kept notes, which survive on a papyrus now in Turin. The workers marched past the guard posts of the necropolis, sat down behind temples on the west bank, and refused to go back, insisting their grievance be reported to Pharaoh. Officials delivered rations; the crew returned; supplies slipped again; they struck again. The dispute stretched over several months. For the officials it was an embarrassment. For historians it is priceless: a record of ordinary workers in a powerful state organizing, negotiating and getting at least part of what they were owed. The village was unusually literate, and its rubbish heaps have yielded thousands of inscribed potsherds and limestone flakes, including a register of work absences whose excuses range from illness to brewing beer.</p><blockquote class="quote"><p>On this day the crew passed the five guard-posts of the tomb saying: &#x27;We are hungry.&#x27;</p><cite>Turin Strike Papyrus, trans. P. J. Frandsen, &#x27;Editing Reality: The Turin Strike Papyrus&#x27; (1990)</cite></blockquote><div class="evi"><div><b>What we actually have</b>The Turin Strike Papyrus (Museo Egizio, Cat. 1880), plus thousands of ostraca from the village.</div><div><b>How we know</b>Translation of hieratic administrative documents; excavation of the village and its rubbish deposits.</div></div><div class="dyk"><p>The villagers&#x27; written notes are so abundant that historians can follow individual families, feuds and even court cases across generations.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Edgerton, W. F. (1951). The strikes in Ramses III&#x27;s twenty-ninth year. Journal of Near Eastern Studies 10, 137-145. <a href="https://doi.org/10.1086/371037" target="_blank" rel="noopener">doi:10.1086/371037</a></li><li>Frandsen, P. J. (1990). Editing reality: the Turin Strike Papyrus. In S. Israelit-Groll (ed.), Studies in Egyptology presented to Miriam Lichtheim, Magnes Press.</li></ol></details></div></script><script type="text/x-tpl" id="person-tollund-man-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Tollundmannen.jpg" data-cap="The face of Tollund Man" data-big><figcaption></figcaption></figure><div class="sh-k">Bjaeldskovdal bog, Denmark</div><h2 class="sh-t" id="person-tollund-man-st" tabindex="-1">Tollund Man</h2><p class="sh-s">His face looked so fresh that the peat cutters who found him called the police.</p><div class="sh-v"><span class="vstamp vstamp--when">405–380 BCE</span></div></div><div class="sh-meta"><span>Iron Age man with a peaceful face and a noose around his neck</span><span>about 405 to 380 BCE</span></div><p>On 8 May 1950, peat cutters near Silkeborg in Denmark uncovered a face so well preserved that they called the police, fearing a recent death. He had died around 405 to 380 BCE. The acidic, oxygen-poor bog had tanned his skin and preserved his head in extraordinary detail: closed eyes, short-cropped hair and a faint stubble. He wore a pointed skin cap and a belt, and around his neck was a plaited leather noose. He was about 40 and had been hanged, then laid in an old peat cutting in a curled, sleeping position. Many archaeologists interpret him as a sacrifice, although the reasons remain uncertain. A 2021 re-examination of his gut found that his last meal, eaten roughly 12 to 24 hours before death, was a porridge made mainly of barley, pale persicaria seeds and flax, with some fish. He also carried whipworm, roundworm and tapeworm. The researchers found nothing obviously festive or special about the meal. A ritual death, then, but perhaps preceded by an ordinary day&#x27;s food, which makes him feel even closer to us.</p><div class="evi"><div><b>What we actually have</b>A bog body whose head is exceptionally well preserved, with the noose, cap and belt; gut contents.</div><div><b>How we know</b>Radiocarbon dating; autopsy, X-ray and CT scanning; macrofossil, pollen, protein and parasite analysis of gut contents.</div></div><div class="dyk"><p>At Silkeborg Museum his head is original, but most of the body on display is a replica, because only parts of it were conserved in 1950.</p></div><details class="srcs"><summary>Sources (1)</summary><ol><li>Nielsen, N. H. et al. (2021). The last meal of Tollund Man: new analyses of his gut content. Antiquity 95, 1195-1212. <a href="https://doi.org/10.15184/aqy.2021.98" target="_blank" rel="noopener">doi:10.15184/aqy.2021.98</a></li></ol></details></div></script><script type="text/x-tpl" id="person-xin-zhui-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Banière funéraire, peinture sur soie, Chine.jpg" data-cap="The silk funeral banner from Mawangdui" data-big><figcaption></figcaption></figure><div class="sh-k">Mawangdui, China</div><h2 class="sh-t" id="person-xin-zhui-st" tabindex="-1">Xin Zhui, Lady Dai (Marquise of Dai)</h2><p class="sh-s">Her body was so well preserved that doctors could perform an autopsy 2,100 years after she died, and they found melon seeds in her stomach.</p><div class="sh-v"><span class="vstamp vstamp--when">168 BCE</span></div></div><div class="sh-meta"><span>Han dynasty noblewoman with a modern-looking medical file</span><span>died about 168 BCE</span></div><p>In 1972, at Mawangdui near Changsha, archaeologists excavated Tomb 1, a deep Han dynasty grave sealed with thick layers of charcoal and white clay. Inside four nested coffins, in a mysterious liquid, lay Xin Zhui, wife of Li Cang, Marquis of Dai and chancellor of the Changsha kingdom. She had died around 168 BCE, at about 50, and her body was astonishingly preserved: soft skin, joints that could still bend, hair still in place. The autopsy reads like a modern medical file. She had hardened coronary arteries, gallstones, spinal problems that probably caused back pain, and schistosomiasis, a parasitic infection. In her digestive tract were more than a hundred melon seeds, suggesting she ate melon a few hours before a heart attack killed her, probably in summer. She was buried with over a thousand objects, including silk garments, lacquerware, food and a painted T-shaped silk banner that depicts a journey from the underworld to the heavens. Her body suggests the privileged life of a Han noblewoman also brought diseases we still link to rich diets and little exercise.</p><div class="evi"><div><b>What we actually have</b>A remarkably preserved body, her tomb furnishings and a painted silk banner, now in the Hunan Museum, Changsha.</div><div><b>How we know</b>Modern medical autopsy and pathology (1972); study of tomb inscriptions and seals naming her household; later preservation research.</div></div><div class="dyk"><p>One of the silk robes from the Mawangdui tombs is so fine that it weighs under 50 grams.</p></div><details class="srcs"><summary>Sources (1)</summary><ol><li>Wang, X.-S. et al. (2019). Mawangdui-type ancient human cadavers in China and strategies for their long-term preservation. Biopreservation and Biobanking 17, 404-410. <a href="https://doi.org/10.1089/bio.2019.0018" target="_blank" rel="noopener">doi:10.1089/bio.2019.0018</a></li></ol></details></div></script><script type="text/x-tpl" id="person-pompeii-graffiti-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Wall Decoration with Graffiti - Pompeii Antiquarium.jpg" data-cap="Painted wall with graffiti, Pompeii" data-big><figcaption></figcaption></figure><div class="sh-k">Pompeii, Italy</div><h2 class="sh-t" id="person-pompeii-graffiti-st" tabindex="-1">The graffiti writers of Pompeii</h2><p class="sh-s">Pompeii&#x27;s walls were its social media, and one ancient writer complained that there was too much of it.</p><div class="sh-v"><span class="vstamp vstamp--when">up–79 CE</span></div></div><div class="sh-meta"><span>A whole town of scribblers, gossips and election campaigners</span><span>up to 79 CE</span></div><p>When Vesuvius buried Pompeii in 79 CE it froze a town whose walls were covered in writing. Archaeologists have recorded thousands of painted notices and scratched graffiti: election endorsements, gladiator fan messages, greetings to friends, love notes, insults, sums and occasional crude boasts. One line, found in the Basilica, the Theatre and the Amphitheatre, is a joke about the whole scene: the wall deserves praise for not collapsing under so much boring writing. Graffiti were not mainly vandalism; studies of houses show messages answering one another, like comment threads. And the walls still make news. In 2018 a charcoal note in a house under renovation at the time of the eruption recorded a date equal to 17 October. The year is not written, but it supports other evidence, such as autumn fruits and lit braziers, that the eruption came later than the traditional 24 August. In January 2026, a Sorbonne-led team using reflectance transformation imaging, which lights a surface from many angles, announced 79 previously unknown graffiti in the corridor leading to the theatres, including a declaration of love and a drawing of two gladiators.</p><blockquote class="quote"><p>Admiror, paries, te non cecidisse ruinis, qui tot scriptorum taedia sustineas. (I wonder, wall, that you have not fallen in ruins, bearing the tedious scribbles of so many writers.)</p><cite>CIL IV 1904, Pompeii; literal translation of the Latin</cite></blockquote><div class="evi"><div><b>What we actually have</b>Thousands of painted and incised inscriptions catalogued in the Corpus Inscriptionum Latinarum volume IV, plus new finds.</div><div><b>How we know</b>Epigraphy (reading and dating Latin inscriptions); stratigraphy; reflectance transformation imaging of faint incisions.</div></div><div class="dyk"><p>The same weary couplet about the overloaded wall was scratched in at least three public buildings, so it was probably a popular joke.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Benefiel, R. R. (2010). Dialogues of ancient graffiti in the House of Maius Castricius in Pompeii. American Journal of Archaeology 114, 59-101. <a href="https://doi.org/10.3764/aja.114.1.59" target="_blank" rel="noopener">doi:10.3764/aja.114.1.59</a></li><li>Doronzo, D. M. et al. (2022). The 79 CE eruption of Vesuvius: a lesson from the past and the need of a multidisciplinary approach for developments in volcanology. Earth-Science Reviews 231, 104072. <a href="https://doi.org/10.1016/j.earscirev.2022.104072" target="_blank" rel="noopener">doi:10.1016/j.earscirev.2022.104072</a></li></ol></details></div></script><script type="text/x-tpl" id="person-claudia-severa-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Vindolanda tablet 291.jpg" data-cap="Vindolanda tablet 291, the birthday invitation" data-big><figcaption></figcaption></figure><div class="sh-k">Vindolanda, UK</div><h2 class="sh-t" id="person-claudia-severa-st" tabindex="-1">Claudia Severa</h2><p class="sh-s">The earliest known Latin handwriting by a woman is the end of a birthday invitation.</p><div class="sh-v"><span class="vstamp vstamp--when">97–105 CE</span></div></div><div class="sh-meta"><span>Officer&#x27;s wife who sent a birthday invitation on the Roman frontier</span><span>about 97 to 105 CE</span></div><p>Around 100 CE, at the Roman fort of Vindolanda in northern Britain (Hadrian&#x27;s Wall came a couple of decades later), Sulpicia Lepidina, wife of the commander Flavius Cerialis, received a thin wooden leaf tablet written in ink. It came from her friend Claudia Severa, wife of Aelius Brocchus, who commanded a fort nearby. The message: please come to my birthday celebration on 11 September; it will make the day more enjoyable. Most of the letter was written by a scribe. At the end, a different hand adds a personal farewell. Scholars identify this as Claudia herself, which makes these lines among the earliest known examples of Latin written by a woman. The tablet was excavated in 1985, one of hundreds of documents preserved in waterlogged, oxygen-free layers at Vindolanda, alongside requests for beer, lists that mention socks, and a report sneering at the &#x27;Brittunculi&#x27;, the &#x27;wretched little Britons&#x27;. What survives here is not grand history but friendship on a cold frontier: two women arranging a party, and one of them adding her own words.</p><blockquote class="quote"><p>Farewell, sister, my dearest soul, as I hope to prosper, and hail.</p><cite>Claudia Severa to Sulpicia Lepidina, Tab. Vindol. 291, trans. A. K. Bowman and J. D. Thomas</cite></blockquote><div class="evi"><div><b>What we actually have</b>Vindolanda tablet 291, a wooden leaf tablet written in ink, now in the British Museum (1986,1001.64).</div><div><b>How we know</b>Excavation of waterlogged deposits; infrared imaging of faded ink; palaeography comparing the scribe&#x27;s hand with the closing hand.</div></div><div class="dyk"><p>Another letter from Claudia to Lepidina (Tab. Vindol. 292) also survives, again with a closing in what appears to be her own hand.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Bowman, A. K. &amp; Thomas, J. D. (1994). The Vindolanda Writing-Tablets (Tabulae Vindolandenses II). British Museum Press.</li><li>Roman Inscriptions of Britain online, Tab. Vindol. 291.</li></ol></details></div></script><script type="text/x-tpl" id="person-hypatia-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Hypatia by Julius Kronberg, 1889.jpg" data-cap="Hypatia as imagined in 1889; no ancient portrait survives" data-big><figcaption></figcaption></figure><div class="sh-k">Alexandria, Egypt</div><h2 class="sh-t" id="person-hypatia-st" tabindex="-1">Hypatia of Alexandria</h2><p class="sh-s">She was the most respected teacher in a great city of learning, until local politics turned lethal.</p><div class="sh-v"><span class="vstamp vstamp--when">March 415 CE</span></div></div><div class="sh-meta"><span>Mathematician, astronomer and philosopher</span><span>died March 415 CE</span></div><p>Hypatia taught in Alexandria in the late 300s and early 400s CE, a mathematician, astronomer and philosopher in a city famous for learning. Her father Theon was a mathematician who edited Euclid and wrote on Ptolemy; a heading in his commentary on Ptolemy&#x27;s Almagest credits Hypatia with revising the text of one book. Later sources say she wrote commentaries on Diophantus&#x27;s Arithmetica and Apollonius&#x27;s Conics, though none survive clearly under her name. What survives best is her reputation. Her student Synesius, later a bishop, wrote her admiring letters, including one asking her to have a hydroscope, an instrument for weighing liquids, made for him. The church historian Socrates Scholasticus, writing a generation later, praised her learning and her public standing among the city&#x27;s officials. In March 415, amid a bitter feud between the city&#x27;s prefect Orestes and its bishop Cyril, a mob seized her in the street, dragged her into a church and killed her. Modern films and slogans have turned her into many symbols. The ancient sources show something more human: a brilliant teacher caught in local power struggles.</p><blockquote class="quote"><p>made such attainments in literature and science, as to far surpass all the philosophers of her own time.</p><cite>Socrates Scholasticus, Ecclesiastical History 7.15, trans. A. C. Zenos (1890)</cite></blockquote><div class="evi"><div><b>What we actually have</b>No body and none of her own writings securely survive; the evidence is textual: Synesius&#x27;s letters to her, Socrates Scholasticus, Damascius and the Suda, and her father&#x27;s commentaries.</div><div><b>How we know</b>Critical reading and comparison of ancient Greek sources written by her student, by a near-contemporary historian, and by later compilers.</div></div><div class="dyk"><p>Seven letters from Synesius addressed to her survive, but not a single reply from Hypatia.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Dzielska, M. (1995). Hypatia of Alexandria. Harvard University Press.</li><li>Watts, E. J. (2017). Hypatia: The Life and Legend of an Ancient Philosopher. Oxford University Press.</li></ol></details></div></script><script type="text/x-tpl" id="person-pakal-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Maya Jade Mask &amp; Burial Artifacts of Kinich Hanab Pakal, Ruler of Palenque, 615-683 AD.jpg" data-cap="Pakal&#x27;s jade funerary mask" data-big><figcaption></figcaption></figure><div class="sh-k">Palenque, Mexico</div><h2 class="sh-t" id="person-pakal-st" tabindex="-1">K&#x27;inich Janaab Pakal of Palenque</h2><p class="sh-s">The inscriptions said he died at 80; his skeleton seemed to say 40; the argument took half a century to settle.</p><div class="sh-v"><span class="vstamp vstamp--when">603–683 CE</span></div></div><div class="sh-meta"><span>Maya king who ruled for 68 years</span><span>603 to 683 CE</span></div><p>K&#x27;inich Janaab Pakal was born in 603 CE and crowned king of the Maya city of Palenque in 615, at the age of 12, after a turbulent period in which his mother, Sak K&#x27;uk&#x27;, held power. He ruled for 68 years, long enough to rebuild a battered kingdom into one of the most elegant cities of the Classic Maya world. His funerary monument, the Temple of the Inscriptions, carries one of the longest Maya hieroglyphic texts. In 1948 the archaeologist Alberto Ruz Lhuillier noticed a floor slab with holes for lifting it and found a rubble-filled staircase leading down into the pyramid. Clearing it took years. In 1952 he reached a crypt with a huge carved sarcophagus lid and a skeleton wearing a jade mosaic mask. Then came a puzzle: the inscriptions said Pakal died at 80, but the teeth suggested someone of 40 to 50. Decades of debate followed. A bioarchaeological team led by Vera Tiesler, working from 1999 to 2003, concluded the bones fit an elderly man; his soft, refined royal diet had probably spared his teeth. The texts, it seems, were right.</p><div class="evi"><div><b>What we actually have</b>His skeleton, sarcophagus, jade mask and tomb in the Temple of the Inscriptions, plus hieroglyphic texts recording his life dates.</div><div><b>How we know</b>Decipherment of Maya hieroglyphs and calendar dates; skeletal ageing methods; bioarchaeological analysis of the tomb.</div></div><div class="dyk"><p>His jade death mask was stolen from Mexico&#x27;s National Museum of Anthropology in 1985 and recovered in 1989.</p></div><details class="srcs"><summary>Sources (1)</summary><ol><li>Tiesler, V. &amp; Cucina, A. (eds.) (2006). Janaab&#x27; Pakal of Palenque: Reconstructing the Life and Death of a Maya Ruler. University of Arizona Press. <a href="https://doi.org/10.2307/j.ctv1qwwk7s" target="_blank" rel="noopener">doi:10.2307/j.ctv1qwwk7s</a></li></ol></details></div></script><script type="text/x-tpl" id="person-birka-bj581-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Birka, Sweden Viking grave Bj 581 by Hjalmar Stolpe in 1889.jpg" data-cap="Stolpe&#x27;s 1889 drawing of grave Bj 581" data-big><figcaption></figcaption></figure><div class="sh-k">Birka, Sweden</div><h2 class="sh-t" id="person-birka-bj581-st" tabindex="-1">The Birka warrior of grave Bj 581</h2><p class="sh-s">For a century she was the textbook Viking warrior, assumed to be a man; then her DNA was read.</p><div class="sh-v"><span class="vstamp vstamp--when">mid-900s CE</span></div></div><div class="sh-meta"><span>Viking-age woman buried with a full warrior&#x27;s kit</span><span>mid-900s CE</span></div><p>In the 1870s Hjalmar Stolpe excavated a chamber grave at Birka, a Viking-age trading town on an island in Lake Malaren, Sweden. Grave Bj 581, from the mid-900s, held one person buried with a sword, an axe, two spears, armour-piercing arrows, two shields, two horses and a gaming set with pieces and dice. For more than a century it served as the model of a high-status Viking warrior, assumed to be male. In 2016 the osteologist Anna Kjellstrom re-examined the skeleton and found female traits; in 2017 a genomic study found two X chromosomes and no Y. Isotopes suggest she was not born at Birka, and she was over 30 when she died. The reaction was huge, and so was the criticism. Had the bones been mixed up since the 19th century? Were the weapons gifts for someone who never fought? In 2019 the team replied, rechecking the excavation records and arguing the skeleton belongs to the grave. They left open whether she was a fighting warrior, a symbolic one or something else. The debate now centres less on her sex and more on how archaeologists read gender into grave goods for a century.</p><div class="evi"><div><b>What we actually have</b>Chamber grave Bj 581 with its skeleton, weapons, horses and gaming set, documented in Stolpe&#x27;s records and stored in Stockholm.</div><div><b>How we know</b>Osteology; ancient DNA (sex chromosomes and mitochondrial DNA); strontium isotopes for mobility; re-examination of 19th-century excavation plans.</div></div><div class="dyk"><p>The gaming set placed on her lap has led some researchers to suggest she may have been a tactician or commander, though that remains speculative.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Hedenstierna-Jonson, C. et al. (2017). A female Viking warrior confirmed by genomics. American Journal of Physical Anthropology 164, 853-860. <a href="https://doi.org/10.1002/ajpa.23308" target="_blank" rel="noopener">doi:10.1002/ajpa.23308</a></li><li>Price, N. et al. (2019). Viking warrior women? Reassessing Birka chamber grave Bj.581. Antiquity 93, 181-198. <a href="https://doi.org/10.15184/aqy.2018.258" target="_blank" rel="noopener">doi:10.15184/aqy.2018.258</a></li></ol></details></div></script><script type="text/x-tpl" id="person-mansa-musa-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Mansa Musa.jpg" data-cap="Mansa Musa on the Catalan Atlas, 1375" data-big><figcaption></figcaption></figure><div class="sh-k">Mali Empire, West Africa</div><h2 class="sh-t" id="person-mansa-musa-st" tabindex="-1">Mansa Musa of Mali</h2><p class="sh-s">He arrived in Cairo with so much gold that, according to one chronicler, the price of gold fell.</p><div class="sh-v"><span class="vstamp vstamp--when">1312–1337 CE</span></div></div><div class="sh-meta"><span>Emperor whose gold made headlines in Cairo and Europe</span><span>ruled about 1312 to 1337 CE; journey to Cairo in 1324</span></div><p>In 1324 Mansa Musa, ruler of the Mali Empire in West Africa, crossed the Sahara on pilgrimage to Mecca and stopped in Cairo. He came with a huge caravan and, by every account, astonishing quantities of gold. The Damascus-born official al-Umari, writing about a dozen years later using interviews with Cairo officials who had met him, reports that Musa showered gold on courtiers and office holders, and that his people spent so freely that the value of gold in Egypt fell. He also reports a court drama: told to kiss the ground before the Mamluk sultan, Musa at first refused. The visit made Mali famous far beyond Africa; the Catalan Atlas of 1375 shows a West African king holding a gold nugget. Modern claims that Musa was the richest person who ever lived are guesses, since no figure can be calculated. And the historian Warren Schultz, checking Cairo exchange-rate records, found the gold slump real but temporary, not the twelve-year crash al-Umari describes. Even so, the episode shows West African gold at the heart of the medieval world economy.</p><blockquote class="quote"><p>They exchanged gold until they depressed its value in Egypt and caused its price to fall.</p><cite>al-Umari, Masalik al-absar, trans. in N. Levtzion and J. F. P. Hopkins, Corpus of Early Arabic Sources for West African History (1981)</cite></blockquote><div class="evi"><div><b>What we actually have</b>Arabic chronicles (al-Umari, Ibn Khaldun, al-Maqrizi and others), Cairo exchange-rate records, and the Catalan Atlas of 1375.</div><div><b>How we know</b>Critical comparison of medieval Arabic sources; economic history of Mamluk coinage and exchange rates; study of European maps.</div></div><div class="dyk"><p>Musa told his Cairo hosts that the ruler before him had sent a fleet out into the Atlantic to find its far edge, and had never returned.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Levtzion, N. &amp; Hopkins, J. F. P. (eds.) (1981). Corpus of Early Arabic Sources for West African History. Cambridge University Press.</li><li>Schultz, W. C. (2006). Mansa Musa&#x27;s gold in Mamluk Cairo: a reappraisal of a world civilizations anecdote. In J. Pfeiffer &amp; S. A. Quinn (eds.), Post-Mongol Central Asia and the Middle East. Harrassowitz.</li></ol></details></div></script>
