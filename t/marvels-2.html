230 L74,396" class="wx-flow wx-s3" style="stroke-width:3" marker-end="url(#lycurgus-cup-f1-a3)"/><text x="86" y="414" class="wx-t-b">you see green:</text><text x="86" y="430" class="wx-t-m">light scattered back</text></g><g class="wx-st wx-hide" data-only="2"><path d="M192,310 Q210,324 228,310 Z" class="wx-bronze wx-edge"/><path d="M224,308 Q228,296 230,288 Q236,298 234,308 Z" class="wx-glow wx-pulse"/><text x="290" y="120" class="wx-t-b">lamp inside</text><path d="M270,124 L234,290" class="wx-thin"/><path d="M214,292 L78,402" class="wx-flow wx-s4" style="stroke-width:3" marker-end="url(#lycurgus-cup-f1-a4)"/><path d="M234,290 L370,350" class="wx-flow wx-s4" style="stroke-width:3"/><path d="M206,286 L70,140" class="wx-flow wx-s4" style="stroke-width:3"/></g><g class="wx-st wx-hide" data-only="2"><text x="86" y="450" class="wx-t-b">you see red:</text><text x="86" y="466" class="wx-t-m">light passing through</text></g><g class="wx-st wx-hide" data-s="3"><text x="236" y="450" class="wx-t-b">both at once:</text><text x="236" y="466" class="wx-t-m">real light mixes the two</text></g><g class="wx-st wx-hide" data-s="3"><circle cx="312" cy="260" r="10" class="wx-hl"/><path d="M320,252 L434,130 M320,268 L434,342" class="wx-guide"/><clipPath id="lycurgus-cup-f1-z"><circle cx="540" cy="236" r="150"/></clipPath><circle cx="540" cy="236" r="150" class="wx-card"/><g clip-path="url(#lycurgus-cup-f1-z)"><rect x="490" y="86" width="100" height="300" class="wx-sky"/><circle cx="514" cy="140" r="9" class="wx-bronze wx-edge"/><circle cx="558" cy="178" r="9" class="wx-bronze wx-edge"/><circle cx="530" cy="224" r="9" class="wx-bronze wx-edge"/><circle cx="564" cy="266" r="9" class="wx-bronze wx-edge"/><circle cx="518" cy="308" r="9" class="wx-bronze wx-edge"/><circle cx="554" cy="346" r="9" class="wx-bronze wx-edge"/><circle cx="510" cy="376" r="9" class="wx-bronze wx-edge"/><circle cx="568" cy="106" r="9" class="wx-bronze wx-edge"/></g><circle cx="540" cy="236" r="150" class="wx-line"/><text x="540" y="72" class="wx-t-b" text-anchor="middle">inside the glass wall (schematic)</text><path d="M370,226 L526,226" class="wx-bold" marker-end="url(#lycurgus-cup-f1-ar)"/><text x="370" y="214" class="wx-t-b">white light</text><path d="M522,218 L420,146" class="wx-flow wx-s3" style="stroke-width:3" marker-end="url(#lycurgus-cup-f1-a3)"/><text x="370" y="120" class="wx-t-b wx-halo" text-anchor="start">green scattered back</text><path d="M530,236 L538,238" class="wx-line wx-s2"/><circle cx="530" cy="224" r="15" class="wx-dash"/><text x="480" y="280" class="wx-t-m" text-anchor="end">blue-green</text><text x="480" y="296" class="wx-t-m" text-anchor="end">absorbed</text><path d="M482,276 L518,240" class="wx-thin"/><path d="M542,226 L710,226" class="wx-flow wx-s4" style="stroke-width:3" marker-end="url(#lycurgus-cup-f1-a4)"/><text x="708" y="250" class="wx-t-b wx-halo" text-anchor="end">red passes through</text></g><g class="wx-st wx-hide" data-s="4"><path d="M554,266 L620,316" class="wx-thin"/><text x="624" y="322" class="wx-t-b">Ag–Au particle</text><text x="624" y="338" class="wx-t-n">c. 50–100 nm</text><text x="540" y="408" class="wx-t" text-anchor="middle">glass: c. 300 ppm silver, c. 40 ppm gold</text><text x="540" y="426" class="wx-t-s" text-anchor="middle">particles and spacing not to scale</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 4.</b> Lamp outside: light bounces back from the glass towards you, and the cup looks green.</p><ol class="wx-steplist"><li>Lamp outside: light bounces back from the glass towards you, and the cup looks green.</li><li>Lamp inside: light passes through the glass wall to you, and the cup glows red.</li><li>Zoom into the glass: tiny silver-gold particles absorb and scatter green and blue light, and let red light through.</li><li>The particles are only c. 50–100 nm across, made from c. 300 ppm silver and c. 40 ppm gold in the glass.</li></ol><figcaption>Light from outside is mostly scattered back as green; light from inside mostly passes through as red. The zoom shows why: silver-gold particles absorb and scatter green and blue, and let red through. <span class="wx-src">Based on: Barber and Freestone 1990; Freestone et al. 2007. Ray paths are schematic; real viewing mixes reflected and transmitted light.</span></figcaption><p class="vh">Step 1 shows the cup lit by a lamp in front: rays bounce back from the glass to an eye and are drawn green, and the cup appears green. Step 2 shows a lamp inside the cup: rays pass through the glass wall to the eye and are drawn red, and the cup appears red. Step 3 zooms into the glass wall, where white light meets small round silver-gold particles: green and blue light are scattered or absorbed, red continues through. Step 4 adds the particle size, about 50 to 100 nanometres, and the metal contents, about 300 ppm silver and 40 ppm gold.</p></figure><p>Metal particles this small behave very differently from a lump of metal. Their free electrons can be set sloshing back and forth together by light of particular wavelengths, an effect physicists call a localised surface plasmon resonance. At resonance, the particles absorb and scatter light strongly. In the Lycurgus glass, the particles absorb much of the green and blue part of the spectrum and scatter greenish light, while letting red light pass. Freestone and colleagues sum it up this way: the gold is mainly responsible for the reddish transmission and the silver for the greenish reflection.</p><p>So the two colours are two views of the same process. Lit from outside, you see mostly light scattered back towards you by the particles: green. Lit from inside, you see mostly light that made it through the glass: red. Real viewing mixes both, which is why the cup can look olive, amber or purple-red in between.</p><p>Composition and size matter a great deal. Gold particles on their own tend to make glass ruby red, which is the basis of the gold ruby glass that European glassmakers such as Johann Kunckel made famous in the 17th century. Silver on its own tends towards yellow, the colour of the silver stain used in medieval stained glass. The Lycurgus glass sits between the two, with alloy particles whose mixed composition and fairly large size give both a strong green scatter and a red transmission. Change the recipe or the heating, and the balance tips.</p><blockquote class="wpull"><p>The cup is not dyed green or red. It is a filter and a mirror at the same time, and the lamp decides which one you see.</p></blockquote></section><section class="wsec" id="lycurgus-cup-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Did the Romans do nanotechnology?</h3><p>It is tempting to say yes, and headlines often do. The honest answer is more interesting. The Romans did make nanoparticles, and they did it on purpose in the sense that someone deliberately added silver and gold to the glass batch and controlled the heating to get this effect. Such low concentrations suggest that the precious metal was added in a finely divided form, perhaps as dust, filings or a dilute solution, and thoroughly mixed.</p><p>But they had no idea that particles were involved, let alone how light interacts with electrons. Their knowledge was practical: a recipe, a sequence of heating and a skilled eye that could judge when the glass had &#x27;struck&#x27; its colour. We might call it nanotechnology by craft rather than by design.</p><p>How do such particles form? In a hot glass melt, small amounts of gold and silver can dissolve as individual atoms or ions, and the glass then looks nearly colourless. When the glass is held at a suitable temperature, or reheated after cooling, the metal atoms drift together and cluster into particles, which grow until they are large enough to colour the glass. Glassmakers call this &#x27;striking&#x27; the colour. It is highly sensitive to temperature and time, which may be one reason why so few ancient dichroic glasses survive.</p><p>The effect was also hard to control. Only a handful of dichroic glasses of this kind survive, and they vary: a fragment of a cage cup in the Metropolitan Museum of Art, showing a satyr, shifts from olive green to reddish amber rather than jade to ruby. A letter attributed to the emperor Hadrian, preserved in the unreliable Historia Augusta, mentions &#x27;cups of changing colours&#x27; among precious gifts, which hints that such glass was known and prized, though the passage cannot be tied to this cup.</p><ul class="wlist"><li>Deliberate: adding precious metals to glass to colour it.</li><li>Probably deliberate: the heat treatment that brings out the colour.</li><li>Not understood: that the colour came from particles 50–100 nm across.</li><li>Uncertain: how often workshops could reproduce the effect.</li></ul></section><section class="wsec" id="lycurgus-cup-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>A 1,600-year-old idea in modern labs</h3><p>The physics behind the Lycurgus Cup is now central to a branch of modern science called plasmonics. Gold and silver nanoparticles are used in pregnancy tests, where they give the familiar red line, and in sensors that detect tiny changes in their surroundings, because the colour a particle scatters shifts when the material around it changes.</p><p>In 2013 a team at the University of Illinois led by engineer Gang Logan Liu took direct inspiration from the cup. They imprinted billions of tiny cup-shaped wells onto a plastic plate and coated them with metal nanoparticles, creating what they called nano Lycurgus cup arrays. When liquids were placed on the plate, its colour changed: light green for water, red for oil. The researchers reported that the prototype was about 100 times more sensitive to changes in salt levels than comparable commercial sensors.</p><p>The same principle turns up in everyday medicine. The coloured line in many rapid diagnostic tests is made by gold nanoparticles a few tens of nanometres across, which appear red for exactly the kind of reason the Lycurgus Cup glows red: their electrons resonate with green light and remove it from what reaches your eye.</p><blockquote class="quote"><p>The Romans knew how to make and use nanoparticles for beautiful art. We wanted to see if this could have scientific applications.</p><cite>Gang Logan Liu, quoted in Smithsonian Magazine (2013)</cite></blockquote><p>Other groups have used silver and gold nanoparticles in polymers, including 3D-printable materials, to recreate the cup&#x27;s green-to-red switch. The old glassmakers would have recognised the effect at once, even if the explanation would have baffled them.</p></section><section class="wsec" id="lycurgus-cup-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>From a dealer&#x27;s shop to Room 41</h3><p>Where the cup was found is unknown. It first appears in print in 1845, in the possession of a collector recorded as M. Dubois. By 1857 it belonged to the banker Lionel de Rothschild, and it was lent to a major exhibition in London in 1862. Not every viewer was impressed: the German art historian Gustav Waagen dismissed it as barbaric and debased, a reminder that taste changes as much as science does.</p><p>In 1958 Victor, Lord Rothschild sold the cup to the British Museum for £20,000, with £2,000 contributed by the Art Fund. Its metal mounts were removed for study that year and later reunited with the glass. Today it is on display in Room 41, among objects of the Late Roman and early Byzantine world.</p><figure class="photo wimg" data-img="Lycurgus Cup red BM MME1958.12-2.1.jpg" data-cap="The Lycurgus Cup lit from inside, glowing red. The gilt-silver rim and foot are later additions."><figcaption></figcaption></figure><p>Where was it made? The quality of the cutting points to one of the great glass centres of the Late Roman world. Rome and Alexandria have both been proposed, but there is no inscription or workshop evidence to settle it.</p></section><section class="wsec" id="lycurgus-cup-s8"><h3 class="wsec-h"><span class="wsec-n">08</span>What remains uncertain</h3><p>Compared with many ancient wonders, the Lycurgus Cup holds few deep mysteries. We know what it is made of, why it changes colour and, broadly, how it was cut. Its mystery level is low. The open questions are about people and places.</p><ul class="wlist"><li>Which workshop made it, and where?</li><li>In what form was the silver and gold added, and how did the glassmakers control the heat?</li><li>Was the glass made for this cup, or was a dichroic blank bought from a specialist glassmaker and then cut elsewhere?</li><li>Does the myth carry a political message about Constantine and Licinius, or is it simply a good wine story?</li><li>How many cutting hours did it take? Estimates range widely, and no ancient source records it.</li></ul><p>Perhaps the best way to think of it is as a meeting point. A myth about wine and the punishment of pride, a feat of cold-working that pushed glass to its limits, and a trace of precious metal that happened to put physics on display. Roman craftspeople did not need to understand plasmons to make something that still stops visitors in their tracks. They needed patience, experience and an eye for light.</p><blockquote class="wpull"><p>The science is modern. The wonder was always there, waiting for someone to put a lamp inside.</p></blockquote></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">300 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Cup made in a Late Roman workshop (4th century CE)</span></li><li class="wtl-find" style="--i:1"><span class="wtl-y">1845 CE</span><span class="wtl-k">Found</span><span class="wtl-t">First mentioned in print, owned by a M. Dubois</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">1857 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Owned by Lionel de Rothschild</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">1862 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Lent for exhibition in London (South Kensington)</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">1958 CE</span><span class="wtl-k">Event</span><span class="wtl-t">British Museum buys it from Victor Rothschild</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1959 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Harden and Toynbee publish the classic study</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">1990 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Barber and Freestone find silver-gold nanoparticles by electron microscopy</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2007 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Freestone and colleagues call it &#x27;a Roman nanotechnology&#x27;</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2013 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Illinois team builds &#x27;nano Lycurgus cup&#x27; sensor arrays</span></li></ol><h3 class="sub-h wsub">The big debates</h3><div class="debate"><p class="debate-q">Did Roman glassmakers deliberately create nanoparticles?</p><div class="sides"><div class="side"><b>Yes, in effect</b><span>The silver and gold were clearly added on purpose in tiny, controlled amounts, and the colour requires suitable heat treatment.</span></div><div class="side"><b>Not knowingly</b><span>They had no concept of particles or plasmons; few similar glasses survive and colours vary, suggesting a hard-won, partly unpredictable recipe.</span></div></div><p class="debate-why"><b>The bold claim:</b> The Romans practised nanotechnology deliberately.</p><div class="meter" style="--pos:50.0%" role="img" aria-label="Weight of evidence: Mixed record"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The ingredients and probably the heating were deliberate, so the Romans did intentionally make a material whose properties depend on nanoparticles. But they did not know that particles existed or controlled their size by design. Calling it nanotechnology is fair as a description of the material, misleading as a description of Roman knowledge.</p></div><div class="debate"><p class="debate-q">Was the cage cut from a solid blank, or partly moulded?</p><div class="sides"><div class="side"><b>Cut and ground</b><span>Tool and polishing marks, the undercut figures and the hidden bridges fit subtractive cold-working, the view of most specialists.</span></div><div class="side"><b>Partly moulded</b><span>Lierke argued that hot-shaping in moulds could have produced the basic cage before finishing.</span></div></div><p class="debate-why"><b>The bold claim:</b> The Lycurgus Cup was made by cutting and grinding away a thick glass blank.</p><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The surfaces and structure of the cup match cold-cutting, and the moulding alternative has found little acceptance among glass specialists. Experimental reproductions of cage cups by cutting also succeed. Some details of the tools and time involved remain uncertain.</p></div><div class="debate"><p class="debate-q">Does the cup celebrate Constantine&#x27;s victory over Licinius?</p><div class="sides"><div class="side"><b>Possibly</b><span>Some scholars link the punished king to Licinius, defeated in 324 CE, and date the cup to around that time.</span></div><div class="side"><b>Not necessarily</b><span>Dionysiac scenes and wine myths were popular decorations for drinking vessels without any political meaning.</span></div></div><p class="debate-why"><b>The bold claim:</b> The Lycurgus scene was a coded reference to Licinius&#x27;s defeat by Constantine.</p><div class="meter" style="--pos:41.7%" role="img" aria-label="Weight of evidence: Open question"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The dating allows it and the idea is attractive, but there is no inscription, documented commission or other direct evidence. The myth suits a wine cup on its own terms. This remains an interpretation, not a demonstrated fact.</p></div><details class="srcs"><summary>Sources for this deep dive (9)</summary><ol><li>Barber, D. J. &amp; Freestone, I. C. (1990). An investigation of the origin of the colour of the Lycurgus Cup by analytical transmission electron microscopy. Archaeometry 32(1): 33–45. <a href="https://doi.org/10.1111/j.1475-4754.1990.tb01079.x" target="_blank" rel="noopener">doi:10.1111/j.1475-4754.1990.tb01079.x</a></li><li>Freestone, I., Meeks, N., Sax, M. &amp; Higgitt, C. (2007). The Lycurgus Cup: a Roman nanotechnology. Gold Bulletin 40(4): 270–277. <a href="https://doi.org/10.1007/BF03215599" target="_blank" rel="noopener">doi:10.1007/BF03215599</a></li><li>Harden, D. B. &amp; Toynbee, J. M. C. (1959). The Rothschild Lycurgus Cup. Archaeologia 97: 179–212.</li><li>British Museum. Collection record 1958,1202.1: the Lycurgus Cup (dimensions, provenance, display).</li><li>Harden, D. B. et al. (1987). Glass of the Caesars. Olivetti, Milan (exhibition catalogue, British Museum, Corning Museum of Glass and Römisch-Germanisches Museum).</li><li>Gartia, M. R., Liu, G. L. et al. (2013). Colorimetric plasmon resonance imaging using nano Lycurgus cup arrays. Advanced Optical Materials 1(1): 68–76. <a href="https://doi.org/10.1002/adom.201200040" target="_blank" rel="noopener">doi:10.1002/adom.201200040</a></li><li>Smithsonian Magazine (2013). This 1,600-year-old goblet shows that the Romans were nanotechnology pioneers (interviews with I. Freestone and G. L. Liu).</li><li>Lierke, R. (1999). Antike Glastöpferei: ein vergessenes Kapitel der Glasgeschichte. Philipp von Zabern, Mainz.</li><li>Homer. The Iliad, trans. S. Butler (1898). Longmans, Green and Co., London.</li></ol></details><aside class="rc-cite" data-v="marvels" data-id="marvel-lycurgus-cup" data-t="The Lycurgus Cup"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Lycurgus Cup</i>. <span class="cite-u">https://residualcontinuum.com/#marvels/marvel-lycurgus-cup</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="marvel-teotihuacan-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Teotihuacan, Pyramid of the Sun and Avenue of the Dead (20686678965).jpg" data-cap="The Avenue of the Dead and the Pyramid of the Sun" data-big><figcaption></figcaption></figure><div class="sh-k">Basin of Mexico</div><h2 class="sh-t" id="marvel-teotihuacan-st" tabindex="-1">Teotihuacan</h2><p class="sh-s">A planned metropolis of perhaps 100,000 people, laid out 15.5 degrees off north, whose own name for itself is still lost.</p><div class="sh-v"><span class="vstamp vstamp--mys">Mystery <span class="pips" role="img" aria-label="Mystery level 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span></span></div></div><div class="wquick"><h3 class="sub-h">The quick read</h3><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="100000" >100,000</b><span class="ctr-u"> people</span></div><div class="ctr-l">a common estimate of the peak population</div><div class="ctr-c">Millon 1973; Cowgill 2015</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="2000" >2,000</b><span class="ctr-u"> compounds</span></div><div class="ctr-l">walled apartment compounds mapped across the city</div><div class="ctr-c">Millon 1973</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="15.5" data-dec="1">15.5</b><span class="ctr-u"> °</span></div><div class="ctr-l">tilt of the street grid east of true north</div><div class="ctr-c">Šprajc 2000</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="260" >260</b><span class="ctr-u"> days</span></div><div class="ctr-l">between the two sunsets the Sun Pyramid faces</div><div class="ctr-c">Šprajc 2000</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="103" >103</b><span class="ctr-u"> m</span></div><div class="ctr-l">length of the tunnel under the Feathered Serpent Pyramid</div><div class="ctr-c">Gómez Chávez, in La Jornada 2014</div></div><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="50000" >50,000</b><span class="ctr-u"> objects</span></div><div class="ctr-l">offerings recovered from the tunnel by 2014</div><div class="ctr-c">La Jornada 2014; INAH</div></div></div><div class="stats"><div><b>c. 20 km²</b><span>City area at its height</span></div><div><b>c. 75,000–125,000 (estimates vary)</b><span>Population</span></div><div><b>c. 222–225 m a side, c. 63–65 m high today</b><span>Pyramid of the Sun</span></div><div><b>c. 43 m high, seven building phases</b><span>Pyramid of the Moon</span></div><div><b>c. 15°28′ east of true north</b><span>Grid orientation</span></div><div><b>c. 2,000</b><span>Apartment compounds</span></div><div><b>103 m long, c. 18 m deep</b><span>Tunnel under the Feathered Serpent Pyramid</span></div></div><p>Teotihuacan grew from scattered villages after about 100 BCE into a city planned on one tilted grid, about 15°28′ east of true north. Its great pyramids are mostly fill: earth, rubble and adobe held in place by stone retaining walls, then faced with stone and thick lime plaster that was often painted. The Pyramid of the Sun rose in a few big episodes, with radiocarbon dates from inside it clustering in about 170–310 CE; the Pyramid of the Moon was enlarged at least six times over its first earlier structure. Builders quarried local volcanic stone, including red tezontle and basalt, and carried fill in baskets, with no draft animals and no wheeled carts. Around 150–200 CE the Feathered Serpent Pyramid went up over more than 200 sacrificial burials, and beneath it a 103 m tunnel was cut, filled with offerings and sealed around 250 CE.</p><div class="flip" id="marvel-teotihuacan-flip"><div class="flip-in"><div class="flip-f"><b>The myth</b><p>The Aztecs built Teotihuacan, or giants did; or its pyramids are a scale model of the solar system, laid out with a lost unit of measurement or knowledge from somewhere far away.</p></div><div class="flip-b"><b>The reality</b><p>The city was already centuries in ruins when Nahuatl speakers named it Teotihuacan, &#x27;the place where the gods were made&#x27;. Excavation shows a home-grown, multi-ethnic city with neighbourhoods of migrants from Oaxaca and elsewhere, built on a calendar-linked grid. Solar-system readings do not survive careful survey. Real open questions remain: the city&#x27;s own name and language, who ruled it, and why its centre burned around 550 CE.</p></div></div><button type="button" class="flip-btn" aria-pressed="false" onclick="flip('marvel-teotihuacan-flip',this)">Flip it</button></div><div class="twist"><b>Wow</b><p>Around 250 CE people sealed a 103 m tunnel under the Feathered Serpent Pyramid, its walls dusted with glittering mineral powder and liquid mercury left near its far end. Nobody saw it again until a sinkhole opened in 2003.</p></div><div class="wmys"><span>Mystery meter</span><span class="pips" role="img" aria-label="Mystery level 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><small>Real open questions</small></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">10 min read · 2,186 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Teotihuacan"><button type="button" class="wtoc-i" data-go="teotihuacan-s1">The place where the gods were made</button><button type="button" class="wtoc-i" data-go="teotihuacan-s2">A city drawn with one ruler</button><button type="button" class="wtoc-i" data-go="teotihuacan-s3">Mountains made by hand</button><button type="button" class="wtoc-i" data-go="teotihuacan-s4">The serpent&#x27;s secret tunnel</button><button type="button" class="wtoc-i" data-go="teotihuacan-s5">Life in the apartment blocks</button><button type="button" class="wtoc-i" data-go="teotihuacan-s6">A city of migrants</button><button type="button" class="wtoc-i" data-go="teotihuacan-s7">Strangers at Tikal, 378 CE</button><button type="button" class="wtoc-i" data-go="teotihuacan-s8">Fire in the centre</button><button type="button" class="wtoc-i" data-go="teotihuacan-s9">Legends, measurements and what is still unknown</button></nav></div><section class="wsec" id="teotihuacan-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The place where the gods were made</h3><p>Stand at the foot of the Pyramid of the Moon just after sunrise and look south. A dead-straight avenue, about 40 m wide, runs away from you for more than two kilometres, lined with the stumps of temples. On your left the Pyramid of the Sun sits like a man-made mountain. Behind you rises Cerro Gordo, a real one. It is hard to shake the feeling that the whole view was composed, and it was.</p><p>By the time the Aztecs came here in the 1400s, the city had been a ruin for roughly nine centuries. They did not know who had built it, so they gave it a name that fitted its grandeur: Teotihuacan, usually translated as &#x27;the place where the gods were made&#x27; or &#x27;where the gods were born&#x27;. They also gave its main street the name we still use, the Avenue of the Dead, because they took the rubble mounds along it for tombs. They were wrong about that, but their awe was well placed.</p><blockquote class="quote"><p>It is told that when yet [all] was in darkness, when yet no sun had shone and no dawn had broken, it is said, the gods gathered themselves together and took counsel among themselves there at Teotihuacan.</p><cite>Florentine Codex, Book 7, trans. A. J. O. Anderson and C. E. Dibble (1953)</cite></blockquote><p>In that Aztec story, two gods throw themselves into a bonfire at Teotihuacan to become the Sun and the Moon. It is a myth about the city, not from it. The people who actually lived here left no readable history of their own, and we still do not know what they called their home, which language they spoke, or who governed them. What they did leave is an astonishing amount of physical evidence, and some of the best of it has turned up in the last twenty years.</p></section><section class="wsec" id="teotihuacan-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>A city drawn with one ruler</h3><p>Teotihuacan began as a cluster of farming villages in a side valley of the Basin of Mexico around 100 BCE. Within three centuries it had become a city of roughly 20 km² and, by the most common estimates, somewhere between 75,000 and 125,000 people. René Millon&#x27;s Teotihuacan Mapping Project, which began in 1962 and walked and recorded the whole urban area, showed something unusual: almost everything was built on one grid.</p><p>That grid is not aligned to true north. Streets, walls and buildings run about 15°28′ east of north, and the cross-streets at right angles to them. When the archaeoastronomer Ivan Šprajc measured the major buildings, he found the east–west axis of the Pyramid of the Sun points to where the Sun sets on about 29–30 April and 12–13 August. The interval between those two sunsets, counted through the winter, is 260 days, exactly the length of the sacred calendar used across Mesoamerica. The north–south axis, meanwhile, lines up with the summit of Cerro Gordo.</p><figure class="wx wx--static" id="teotihuacan-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">One city, one tilt: the core of Teotihuacan</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="One city, one tilt: the core of Teotihuacan"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" class="wx-svg" role="img" aria-labelledby="teotihuacan-f1-t"><title id="teotihuacan-f1-t">Plan of Teotihuacan's ceremonial core, tilted 15.5 degrees east of north</title><line x1="330" y1="122" x2="330" y2="22" class="wx-guide"/><line x1="330" y1="122" x2="356.4" y2="26.9" class="wx-dash"/><path d="M330 42A80 80 0 0 1 351.4 44.9" class="wx-hl wx-draw" pathLength="1" style="--d:8"/><text x="356" y="64" class="wx-t-h wx-t-a wx-halo">15.5°</text><path d="M330 10l-5 11h10z" class="wx-inkfill"/><text x="330" y="16" class="wx-t-cap" text-anchor="end" dx="-10">True north</text><text x="364.4" y="30.9" class="wx-t-s">avenue axis, toward Cerro Gordo</text><polygon points="305.4,128.2 347.9,140 337.2,178.5 294.7,166.7" class="wx-sand wx-edge-soft"/><polygon points="311.9,171.5 320,173.7 198.2,612.8 190.1,610.6" class="wx-sand wx-edge-soft"/><line x1="316" y1="172.6" x2="194.2" y2="611.7" class="wx-line wx-draw" pathLength="1" style="--d:1"/><line x1="194.2" y1="611.7" x2="177.4" y2="672.4" class="wx-dash"/><polyline points="117.9,446.7 122.8,451.2 128.3,453.4 134.5,453 140.6,453 146.2,454.6 151.9,456.2 157.6,457.7 163.2,459.3 168.9,460.9 174.6,462.4 180.2,464 185.9,465.6 191.6,467.2 197.2,468.7 202.9,470.3 208.6,471.9 214.2,473.4 219.9,475 225.6,476.6 231.2,478.2 236.9,479.7 242.6,481.3 248.2,482.9 253.9,484.4 259.6,486 265.2,487.6 270.9,489.2 276.6,490.7 282.2,492.3 287.9,493.9 293.6,495.4 299.2,497 304.9,498.6 310.6,500.2 316.2,501.7 321. -t-m" text-anchor="start">c. 18 m below the surface</text></g><g class="wx-pop" style="--d:12"><polyline points="130.7,502.6 128,548" class="wx-thin"/><text x="122" y="552" class="wx-t-b" text-anchor="end">Great Compound</text><text x="122" y="567" class="wx-t-m" text-anchor="end">outline approximate</text></g><g class="wx-pop" style="--d:13"><polyline points="136.1,451.8 128,400" class="wx-thin"/><text x="122" y="404" class="wx-t-b" text-anchor="end">Río San Juan</text><text x="122" y="419" class="wx-t-m" text-anchor="end">canalised to</text><text x="122" y="434" class="wx-t-m" text-anchor="end">follow the grid</text></g><g class="wx-pop" style="--d:16"><text x="24" y="40" class="wx-t-cap">One tilt for a whole city</text><text x="24" y="60" class="wx-t-m">Streets, walls and even the river</text><text x="24" y="76" class="wx-t-m">follow an axis about 15°28′</text><text x="24" y="92" class="wx-t-m">east of true north. Sunsets on</text><text x="24" y="108" class="wx-t-m">29–30 April and 12–13 August</text><text x="24" y="124" class="wx-t-m">line up with the Sun Pyramid:</text><text x="24" y="140" class="wx-t-m">dates exactly 260 days apart.</text></g><g><rect x="456" y="606" width="52.5" height="5" class="wx-inkfill"/><rect x="508.5" y="606" width="52.5" height="5" class="wx-card wx-edge"/><text x="456" y="624" class="wx-t-s" text-anchor="middle">0</text><text x="561" y="624" class="wx-t-s" text-anchor="middle">500 m</text></g><text x="604" y="610" class="wx-t-s">Schematic plan;</text><text x="604" y="623" class="wx-t-s">positions approximate</text></svg></div></div><figcaption>The Avenue of the Dead, the three great pyramids, the Ciudadela and even the San Juan river follow a single axis about 15.5 degrees east of true north. <span class="wx-src">Based on: Positions simplified from the Teotihuacan Mapping Project plan (Millon 1973) and site coordinates; orientation from Šprajc 2000; dimensions from Sugiyama et al. 2013 and INAH. Schematic, positions approximate.</span></figcaption><p class="vh">Schematic plan of Teotihuacan&#x27;s ceremonial core drawn with true north at the top. The Avenue of the Dead runs from the Pyramid of the Moon at the north end down toward the lower left, tilted 15.5 degrees east of north, shown by an arc between a true-north line and the avenue axis pointing toward Cerro Gordo. The square Pyramid of the Sun sits east of the avenue; further south the Ciudadela enclosure holds the Feathered Serpent Pyramid, with the 103 metre tunnel marked in accent colour. The Great Compound lies opposite, and the canalised Río San Juan crosses the avenue. A 500 metre scale bar is included.</p></figure><blockquote class="wpull"><p>The builders bent a river to fit their plan. That tells you how seriously they took the grid.</p></blockquote><p>The commitment was total. The Río San Juan, which crosses the city, was straightened into a channel that follows the grid where it passes the ceremonial core. The same orientation, give or take a degree, appears in modest homes on the edge of town. Planning on this scale needs surveyors, a shared unit of length and an authority that everybody obeys. Saburo Sugiyama has argued that many buildings were set out in multiples of a unit of about 83 cm, a proposal that fits a surprising number of measurements, though not every scholar accepts it.</p><aside class="wcall"><b>How do we know the angle?</b><p>The 15.5 degree figure is not a guess from a satellite photo. Šprajc (2000) took azimuths with a theodolite along the preserved walls and base lines of the Pyramid of the Sun and the Ciudadela, corrected for the local horizon, and calculated the dates on which the Sun would set along those lines around the city&#x27;s heyday. The results cluster tightly, which is why the calendar reading is taken seriously.</p></aside></section><section class="wsec" id="teotihuacan-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Mountains made by hand</h3><p>The Pyramid of the Sun is about 222–225 m a side, almost as broad as Khufu&#x27;s pyramid at Giza, though at roughly 63–65 m it is less than half as tall. It is not a solid stone mountain. Inside, tunnels dug by archaeologists show layers of earth, rubble and adobe held in by stone retaining walls, with an outer skin of stone and lime plaster that was once painted. How tall it originally stood is uncertain, partly because Leopoldo Batres, who rebuilt it between 1905 and 1910 for Mexico&#x27;s independence centenary, stripped away some of the outer fabric, a decision archaeologists still lament.</p><p>In 1971 a cave was found under the pyramid, reached by a stairway near its front. It had been dug or reshaped by people and was sealed long ago. When exactly the pyramid itself rose is a lively argument. Excavations from 2008 to 2011 produced radiocarbon and pottery dates that place its main construction at about 170–310 CE. Rebecca Sload re-analysed the dates in 2015 and argued that the cave&#x27;s use began in the first century CE, with the later dates marking a ritual closing rather than the first building. The debate below sets out both sides.</p><p>At the north end of the avenue the Pyramid of the Moon, about 43 m high, grew in at least seven stages between roughly 100 and 400 CE, each one wrapping the last. Saburo Sugiyama and Rubén Cabrera&#x27;s tunnels through it, begun in 1998, found five dedicatory burial complexes inside the layers. They held sacrificed people, some of them apparently foreigners, along with pumas, wolves, eagles and serpents, animals linked with warfare. Sacred mountains, in other words, were also stages for political theatre.</p></section><section class="wsec" id="teotihuacan-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The serpent&#x27;s secret tunnel</h3><p>The third great monument sits inside the Ciudadela, a walled enclosure about 400 m square at the southern end of the avenue. The Feathered Serpent Pyramid, built around 150–200 CE, is famous for its facade of stone serpent heads. Excavations in the 1980s found that it had also been dedicated with more than 200 sacrificial burials, many of them young men buried with weapons and ornaments, laid out in patterns that suggest careful planning.</p><p>On 2 October 2003, after a heavy rainstorm, a hole about a metre wide opened in the plaza at the pyramid&#x27;s foot. The archaeologist Sergio Gómez Chávez of Mexico&#x27;s National Institute of Anthropology and History (INAH) looked down it and saw a shaft. It took years of radar survey, fundraising and permits before digging started in earnest. The team sank a shaft 14 m deep and about 5 m wide, found a deliberately sealed entrance, and began to clear a passage that runs 103 m east to a point under the centre of the pyramid, about 18 m below the surface.</p><figure class="wx wx--steps" id="teotihuacan-f2" data-n="6"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">Into the serpent&#x27;s tunnel, step by step</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Into the serpent&#x27;s tunnel, step by step"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" class="wx-svg" role="img" aria-labelledby="teotihuacan-f2-t"><title id="teotihuacan-f2-t">Section through the tunnel beneath the Feathered Serpent Pyramid, step by step</title><rect x="20" y="214" width="680" height="146" class="wx-soil"/><rect x="20" y="221.8" width="680" height="138.2" class="wx-rock wx-o60"/><text x="692" y="352" class="wx-t-s" text-anchor="end">compact volcanic subsoil (tepetate)</text><line x1="20" y1="214" x2="700" y2="214" class="wx-line"/><defs><clipPath id="teotihuacan-f2-clip"><rect x="20" y="0" width="680" height="400"/></clipPath></defs><g clip-path="url(#teotihuacan-f2-clip)"><polygon points="436.6,214 442.8,197.5 768.4,197.5 774.6,214" class="wx-stone2 wx-edge"/><polygon points="460.5,197.5 466.8,181.1 744.4,181.1 750.7,197.5" class="wx-stone2 w  2003</text><text x="28" y="66" class="wx-t">After heavy rain a hole about 1 m wide</text><text x="28" y="82" class="wx-t">opens at the foot of the temple.</text></g><g class="wx-st wx-hide" data-only="2"><circle class="wx-num" cx="36" cy="40" r="9"/><text x="36" y="43.8" class="wx-numt" text-anchor="middle">2</text><text x="54" y="44" class="wx-t-b wx-t-a">2004–2005</text><text x="28" y="66" class="wx-t">Ground-penetrating radar traces a</text><text x="28" y="82" class="wx-t">passage running about 100 m east.</text></g><g class="wx-st wx-hide" data-only="3"><circle class="wx-num" cx="36" cy="40" r="9"/><text x="36" y="43.8" class="wx-numt" text-anchor="middle">3</text><text x="54" y="44" class="wx-t-b wx-t-a">2009–2010</text><text x="28" y="66" class="wx-t">The team digs a 14 m shaft, 5 m wide,</text><text x="28" y="82" class="wx-t">and meets the ancient sealed entrance.</text></g><g class="wx-st wx-hide" data-only="4"><circle class="wx-num" cx="36" cy="40" r="9"/><text x="36" y="43.8" class="wx-numt" text-anchor="middle">4</text><text x="54" y="44" class="wx-t-b wx-t-a">2010–2014</text><text x="28" y="66" class="wx-t">Nearly 1,000 t of deliberate fill is cleared;</text><text x="28" y="82" class="wx-t">small robots scout the passage ahead.</text></g><g class="wx-st wx-hide" data-only="5"><circle class="wx-num" cx="36" cy="40" r="9"/><text x="36" y="43.8" class="wx-numt" text-anchor="middle">5</text><text x="54" y="44" class="wx-t-b wx-t-a">Finds</text><text x="28" y="66" class="wx-t">Tens of thousands of offerings; walls dusted</text><text x="28" y="82" class="wx-t">with magnetite, pyrite and hematite.</text></g><g class="wx-st wx-hide" data-only="6"><circle class="wx-num" cx="36" cy="40" r="9"/><text x="36" y="43.8" class="wx-numt" text-anchor="middle">6</text><text x="54" y="44" class="wx-t-b wx-t-a">The end</text><text x="28" y="66" class="wx-t">Chambers under the pyramid's centre, liquid</text><text x="28" y="82" class="wx-t">mercury, greenstone figures. Sealed c. 250 CE.</text></g><text x="700" y="392" class="wx-t-s" text-anchor="end">True scale; after Gómez Chávez (INAH) reports</text><g><rect x="28" y="368" width="52" height="5" class="wx-inkfill"/><rect x="80" y="368" width="52" height="5" class="wx-card wx-edge"/><text x="28" y="386" class="wx-t-s" text-anchor="middle">0</text><text x="132" y="386" class="wx-t-s" text-anchor="middle">20 m</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button><button type="button" class="wx-dot" data-k="6" aria-label="Step 6" aria-pressed="false">6</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 6.</b> October 2003: after heavy rain, a hole about 1 m wide opens in the plaza at the foot of the temple.</p><ol class="wx-steplist"><li>October 2003: after heavy rain, a hole about 1 m wide opens in the plaza at the foot of the temple.</li><li>2004–2005: ground-penetrating radar traces a passage running about 100 m east, under the pyramid.</li><li>2009–2010: the team digs a shaft 14 m deep and about 5 m wide and meets the ancient, sealed entrance.</li><li>Nearly 1,000 tonnes of fill packed in by the builders is cleared by hand; small robots scout ahead.</li><li>Tens of thousands of offerings line the way; walls and ceiling carry powdered magnetite, pyrite and hematite.</li><li>At the far end, about 18 m down under the pyramid&#x27;s centre: chambers, greenstone figures and liquid mercury. Sealed c. 250 CE.</li></ol><figcaption>A true-scale section through the tunnel beneath the Feathered Serpent Pyramid, from the 2003 sinkhole to the chambers at its far end. <span class="wx-src">Based on: Tunnel length and depth from Sergio Gómez Chávez as reported in La Jornada (2014); shaft size, dates and finds from INAH reports and Smithsonian (2016); sealing date from INAH (2026). Pyramid height drawn approximately.</span></figcaption><p class="vh">True-scale cross-section. On the right stands the stepped Feathered Serpent Pyramid with the Adosada platform in front of it; the Ciudadela plaza is to the left. Step by step, a sinkhole appears in the plaza, radar traces a dashed passage, a 14 metre vertical shaft is dug, the 103 metre tunnel is cleared as it slopes gently down, offerings and glittering mineral traces appear along its length, and finally chambers about 18 metres below the surface under the pyramid&#x27;s centre are shown with a pool of liquid mercury. A 20 metre scale bar is included.</p></figure><p>The builders had packed the tunnel with nearly 1,000 tonnes of earth and stone, sealed behind a series of walls, so every metre had to be emptied by hand. Two small remote-controlled robots, named Tlaloque and Tláloc II, were sent ahead to film the unexplored stretches. By 2014 the team had recovered more than 50,000 objects: shells, jade and greenstone, carved figures, obsidian blades, wooden objects, seeds and animal bones. The walls and ceiling had been rubbed with powdered minerals, including magnetite, pyrite and hematite, which would have glittered in torchlight like a starry sky.</p><p>Hundreds of clay balls, 40–130 mm across, lay in the chambers near the end. Their golden-yellow crust is jarosite, a mineral that forms when pyrite weathers, so they were probably once coated in shining &#x27;fool&#x27;s gold&#x27;. And in 2015 Gómez announced traces of liquid mercury near the tunnel&#x27;s end. Liquid mercury has turned up at only a handful of Mesoamerican sites; it may have been made by heating the red mineral cinnabar, and the team interprets it as a symbol of an underworld lake or river.</p><aside class="wcall"><b>Fresh from the field</b><p>In March 2026 INAH published the full study of the tunnel, Proyecto Tlalocan: &#x27;Camino bajo la tierra&#x27;, en Teotihuacan, coordinated by Sergio Gómez Chávez and Julie Gazzola, with 14 chapters by 15 specialists. Among its findings is turquoise, which the team reports identifying at Teotihuacan for the first time. It points to exchange with northern Mexico and the American Southwest, alongside the known links to the Maya region and the Gulf Coast. The tunnel was in use from around the start of the Common Era and sealed around 250 CE.</p></aside><p>The hope that the tunnel would end in a royal tomb has not been fulfilled, at least not yet. That matters, because Teotihuacan is strangely quiet about its rulers. Unlike Maya cities, it has no portraits of named kings and no obvious royal burials. Either power was shared among several groups, or it was displayed in ways we have not learned to read.</p></section><section class="wsec" id="teotihuacan-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Life in the apartment blocks</h3><p>Most Teotihuacanos did not live in temples. They lived in walled apartment compounds, of which the mapping project recorded about 2,000. A typical compound was a single-storey block of rooms, patios and small shrines, housing perhaps 60–100 people, often several related families sharing a trade. Some compounds made obsidian tools, others pottery, figurines or lapidary work. The better-off ones had painted murals of gods, priests, jaguars and flowering trees.</p><ul class="wlist"><li>Tetitla, Atetelco and Zacuala: compounds known for their fine murals.</li><li>Teopancazco: a neighbourhood centre with evidence of foreign cooks, tailors and craftworkers.</li><li>La Ventilla: a district with a large plaza and a rare set of painted glyphs on its floor.</li></ul><p>Life expectancy was not high, and skeletons show hard work and seasonal hunger. But the compounds were solid, drained and plastered, and for centuries they kept a very large population housed in one place, something few ancient cities managed so well.</p></section><section class="wsec" id="teotihuacan-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>A city of migrants</h3><p>On Teotihuacan&#x27;s western edge lies a neighbourhood archaeologists call the Oaxaca Barrio, Tlailotlacan. Its houses used pottery in the style of the Zapotec valley of Oaxaca, roughly 400 km to the southeast, and at least one tomb was built in the Oaxacan way. People there appear to have kept their homeland&#x27;s customs for centuries.</p><p>Chemistry backs this up. Oxygen isotopes in teeth and bones record the water a person drank while those tissues formed, and water differs from place to place. Christine White, Michael Spence and colleagues found that the enclave&#x27;s residents kept moving between Teotihuacan, the Oaxaca homeland and other diaspora communities, with some children apparently spending years away before returning. It looks strikingly like a modern migrant community, with ties that stretch across hundreds of kilometres.</p><p>Other districts held people with Gulf Coast and Maya-lowland connections. Teotihuacan was not a monoculture but a magnet, and its planners found room for all of them inside the same tilted grid.</p></section><section class="wsec" id="teotihuacan-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>Strangers at Tikal, 378 CE</h3><p>Some 1,000 km away, in the Maya city of Tikal in Guatemala, carved inscriptions record that on a day in January 378 CE a man called Siyaj K&#x27;ahk&#x27; &#x27;arrived&#x27;. According to the epigrapher David Stuart&#x27;s reading, Tikal&#x27;s king Chak Tok Ich&#x27;aak &#x27;entered the water&#x27;, a phrase for dying, on that same day. Soon a new king, Yax Nuun Ahiin, took the throne; he was the son of a figure the texts call Spearthrower Owl, and on a later Tikal monument, Stela 31, he is shown dressed as a Teotihuacan-style warrior.</p><p>Whether this was conquest, a coup backed by Teotihuacan, or a political alliance dressed up in foreign prestige is still argued. In 2021 a team led by Stephen Houston reported, using lidar and excavation, a compound at Tikal that copies the layout of Teotihuacan&#x27;s Ciudadela at a smaller scale, with Teotihuacan-style incense burners and green obsidian points from central Mexico. Whatever happened in 378, Teotihuacan&#x27;s influence reached deep into the Maya world.</p></section><section class="wsec" id="teotihuacan-s8"><h3 class="wsec-h"><span class="wsec-n">08</span>Fire in the centre</h3><p>Around 550 CE, the temples and elite buildings along the Avenue of the Dead were burned. Sculptures were broken and some buildings were dismantled. A Bayesian analysis of radiocarbon dates from the neighbourhood of Teopancazco, published in 2009, places the end of the city&#x27;s main Classic phase at about 550 CE, roughly a century earlier than once thought.</p><blockquote class="wpull"><p>The fire picked its targets. Temples and palaces burned; many ordinary homes did not.</p></blockquote><p>That selectivity is why many archaeologists favour an internal revolt, perhaps against an elite that had grown rich while the rest of the city struggled. Others keep outside attackers in the frame. Either way, people did not vanish. The population fell sharply but some lived on among the ruins for centuries, and later groups farmed and built in the valley.</p></section><section class="wsec" id="teotihuacan-s9"><h3 class="wsec-h"><span class="wsec-n">09</span>Legends, measurements and what is still unknown</h3><p>Teotihuacan attracts big theories. In the 1970s an engineer, Hugh Harleston Jr., proposed that the city&#x27;s monuments were laid out as a scale model of the solar system, using a unit of about 1.059 m. The idea still circulates online. It does not hold up: the matches depend on choosing convenient points, and they include planets nobody could see before telescopes. The alignments that do show up clearly are to sunsets, a sacred calendar and a mountain, which is what we would expect from what we know about Mesoamerican religion.</p><p>The genuinely unsolved questions are more interesting. Who ruled? Why no royal portraits? What did the Teotihuacanos call themselves? In 2025 the linguists Magnus Pharao Hansen and Christophe Helmke argued in Current Anthropology that some signs in Teotihuacan writing can be read as an early Uto-Aztecan language, ancestral to Nahuatl, Cora and Huichol. If they are right, the Aztecs who named the ruins may have been distant linguistic relatives of the builders. The proposal is bold and is being debated; the corpus of signs is small, and many readings remain uncertain.</p><p>So the city keeps its secrets, but it no longer keeps them silently. A sinkhole, a radar scan and a lot of patient digging have given us a glittering underworld, sealed for 1,750 years. The next surprise may already be waiting under a patch of grass.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">100 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Villages in the valley begin to grow into a town</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">200 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Feathered Serpent Pyramid built over 200+ sacrificial burials (c. 150–200 CE)</span></li><li class="wtl-build" style="--i:2"><span class="wtl-y">240 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Sun Pyramid&#x27;s main mass in place (radiocarbon c. 170–310 CE)</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">250 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Tunnel under the Feathered Serpent Pyramid filled and sealed</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">378 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Siyaj K&#x27;ahk&#x27;, linked to Teotihuacan, arrives at Tikal</span></li><li class="wtl-build" style="--i:5"><span class="wtl-y">400 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Pyramid of the Moon reaches its final form</span></li><li class="wtl-loss" style="--i:6"><span class="wtl-y">550 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Civic and elite buildings along the Avenue burned</span></li><li class="wtl-use" style="--i:7"><span class="wtl-y">1450 CE</span><span class="wtl-k">In use</span><span class="wtl-t">Aztecs revere the ruins and call them Teotihuacan (1400s)</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">1905 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Leopoldo Batres begins rebuilding the Sun Pyramid</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">1962 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">René Millon&#x27;s Teotihuacan Mapping Project begins</span></li><li class="wtl-find" style="--i:10"><span class="wtl-y">1971 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Cave found beneath the Pyramid of the Sun</span></li><li class="wtl-find" style="--i:11"><span class="wtl-y">2003 CE</span><span class="wtl-k">Found</span><span class="wtl-t">A sinkhole reveals the Feathered Serpent tunnel</span></li><li class="wtl-study" style="--i:12"><span class="wtl-y">2025 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Linguists propose the city wrote an early Uto-Aztecan language</span></li><li class="wtl-study" style="--i:13"><span class="wtl-y">2026 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">INAH publishes the full tunnel study, Proyecto Tlalocan</span></li></ol><figure class="wbars"><h4 class="wx-title">How wide are the great pyramids? Base side length</h4><div class="wb-r" style="--w:100.0%;--i:0"><div class="wb-l">Great Pyramid of Cholula, Mexico<small>largest base by area; low and broad</small></div><div class="wb-t"><i></i><span>450 m</span></div></div><div class="wb-r" style="--w:51.2%;--i:1"><div class="wb-l">Khufu, Giza<small>original</small></div><div class="wb-t"><i></i><span>230.3 m</span></div></div><div class="wb-r" style="--w:49.8%;--i:2"><div class="wb-l">Pyramid of the Sun, Teotihuacan<small>c. 222–225 m</small></div><div class="wb-t"><i></i><span>224 m</span></div></div><div class="wb-r" style="--w:32.7%;--i:3"><div class="wb-l">Pyramid of the Moon, Teotihuacan<small>east–west side</small></div><div class="wb-t"><i></i><span>147 m</span></div></div><div class="wb-r" style="--w:14.4%;--i:4"><div class="wb-l">Feathered Serpent Pyramid, Teotihuacan<small>approximate</small></div><div class="wb-t"><i></i><span>65 m</span></div></div><div class="wb-r" style="--w:12.3%;--i:5"><div class="wb-l">El Castillo, Chichen Itza</div><div class="wb-t"><i></i><span>55.3 m</span></div></div><figcaption>Source: Petrie 1883; Sugiyama et al. 2013; Sugiyama 2005; INAH site data; published site surveys (rounded)</figcaption></figure><h3 class="sub-h wsub">The big debates</h3><div class="debate"><p class="debate-q">When was the Pyramid of the Sun built?</p><div class="sides"><div class="side"><b>Later: mostly in the late second to early fourth century CE.</b><span>Tunnelling into the pyramid in 2008–2011 produced radiocarbon and ceramic evidence placing its main construction at about 170–310 CE (Sugiyama, Sugiyama and Sarabia 2013).</span></div><div class="side"><b>Earlier: begun in the first century CE, with the late dates marking a remodelling.</b><span>Sload (2015) modelled new dates from the cave below with Bayesian statistics and argued its use began in the mid first century, reading the third-century dates as a ritual closing of the cave and a redefinition of the pyramid.</span></div></div><p class="debate-why"><b>The bold claim:</b> The Sun Pyramid we see was essentially built in the third century CE, not the first.</p><div class="meter" style="--pos:41.7%" role="img" aria-label="Weight of evidence: Open question"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Both camps use real radiocarbon dates; they disagree about which events those dates record. Samples from fill can be older than the construction they end up in, and ritual activity can add later dates, so the choice of model drives the answer. More dated samples from sealed contexts inside the pyramid are needed before either reading can be called settled.</p></div><div class="debate"><p class="debate-q">Is the city a scale model of the solar system?</p><div class="sides"><div class="side"><b>Yes: distances between monuments encode planetary orbits in a special unit.</b><span>In the 1970s Hugh Harleston Jr. proposed a unit of about 1.059 m and argued that spacings along the Avenue matched the orbits of the planets.</span></div><div class="side"><b>No: the layout follows the calendar, the landscape and ordinary units.</b><span>Surveys show the grid follows sunset dates and the peak of Cerro Gordo (Šprajc 2000). Sugiyama (1993) found a unit of about 83 cm that fits many buildings without any astronomy of orbits.</span></div></div><p class="debate-why"><b>The bold claim:</b> Teotihuacan&#x27;s builders laid out the planets&#x27; orbits to scale.</p><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The planetary matches depend on choosing which points to measure and on including planets unknown before telescopes, which the builders could not have seen. The same measurements are better explained by a calendar-linked grid and a human-scale unit of length. Nothing in the city&#x27;s art or writing refers to such a model.</p></div><div class="debate"><p class="debate-q">Who set fire to the city&#x27;s centre around 550 CE?</p><div class="sides"><div class="side"><b>Insiders: a revolt against the ruling elite.</b><span>Burning concentrates on temples and elite buildings along the Avenue of the Dead, and statues were smashed, which looks targeted rather than random (Millon 1988).</span></div><div class="side"><b>Outsiders: raiders or rival groups from beyond the valley.</b><span>The city was already declining, and new groups with different pottery traditions appear in the valley in the following century.</span></div></div><p class="debate-why"><b>The bold claim:</b> The fire of about 550 CE was an internal uprising, not an invasion.</p><div class="meter" style="--pos:50.0%" role="img" aria-label="Weight of evidence: Mixed record"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The selective pattern of destruction fits an internal upheaval well, and the revised radiocarbon chronology places it around 550 CE (Beramendi-Orosco et al. 2009). But archaeology rarely records who held the torch, and the two explanations are not exclusive: a weakened city could suffer both.</p></div><details class="srcs"><summary>Sources for this deep dive (17)</summary><ol><li>Millon, R. (1973). Urbanization at Teotihuacan, Mexico. Vol. 1: The Teotihuacan Map. University of Texas Press.</li><li>Cowgill, G. L. (1997). State and Society at Teotihuacan, Mexico. Annual Review of Anthropology 26: 129–161. <a href="https://doi.org/10.1146/annurev.anthro.26.1.129" target="_blank" rel="noopener">doi:10.1146/annurev.anthro.26.1.129</a></li><li>Cowgill, G. L. (2015). Ancient Teotihuacan: Early Urbanism in Central Mexico. Cambridge University Press.</li><li>Šprajc, I. (2000). Astronomical Alignments at Teotihuacan, Mexico. Latin American Antiquity 11(4): 403–415. <a href="https://doi.org/10.2307/972004" target="_blank" rel="noopener">doi:10.2307/972004</a></li><li>Sugiyama, S. (1993). Worldview Materialized in Teotihuacan, Mexico. Latin American Antiquity 4(2): 103–129. <a href="https://doi.org/10.2307/971798" target="_blank" rel="noopener">doi:10.2307/971798</a></li><li>Sugiyama, N., Sugiyama, S., and Sarabia G., A. (2013). Inside the Sun Pyramid at Teotihuacan, Mexico: 2008–2011 Excavations and Preliminary Results. Latin American Antiquity 24(4): 403–432. <a href="https://doi.org/10.7183/1045-6635.24.4.403" target="_blank" rel="noopener">doi:10.7183/1045-6635.24.4.403</a></li><li>Sload, R. (2015). When was the Sun Pyramid Built? Maintaining
