<script type="text/x-tpl" id="marvel-petra-water-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Al-Siq, Petra, Jordan7.jpg" data-cap="The Siq at Petra, with its water channel" data-big><figcaption></figcaption></figure><div class="sh-k">Wadi Musa, Jordan</div><h2 class="sh-t" id="marvel-petra-water-st" tabindex="-1">Petra&#x27;s water system</h2><p class="sh-s">A desert kingdom that caught every winter storm, tamed a killer gorge and built a swimming pool to show it could.</p><div class="sh-v"><span class="vstamp vstamp--mys">Mystery <span class="pips" role="img" aria-label="Mystery level 1 of 5"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></span></span></div></div><div class="wquick"><h3 class="sub-h">The quick read</h3><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="193" >193</b><span class="ctr-u"> mm</span></div><div class="ctr-l">of rain in a typical year</div><div class="ctr-c">Petra climate normals, cited in Wikipedia &#x27;Petra&#x27;</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="88" >88</b><span class="ctr-u"> m</span></div><div class="ctr-l">flood-diversion tunnel at the Siq entrance</div><div class="ctr-c">Petra Development and Tourism Region Authority</div></div><div class="ctr"><div class="ctr-v">up to <b class="ctr-n" data-v="4000" >4,000</b><span class="ctr-u"> m³ a day</span></div><div class="ctr-l">from the Ain Musa spring, upper estimate</div><div class="ctr-c">Ortloff 2020</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="10000" >10,000</b><span class="ctr-u"> m³</span></div><div class="ctr-l">held by the Zurraba reservoir</div><div class="ctr-c">Ortloff 2020</div></div><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="2000" >2,000</b><span class="ctr-u"> m³</span></div><div class="ctr-l">in the garden complex pool</div><div class="ctr-c">Bedal 2004</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="12" >12</b><span class="ctr-u"> skeletons</span></div><div class="ctr-l">found in a tomb under the Treasury in 2024</div><div class="ctr-c">American Center of Research; Creasman 2024</div></div></div><div class="stats"><div><b>c. 150–200 mm a year, mostly in a few winter storms</b><span>Rainfall</span></div><div><b>c. 1.2 km long, as narrow as c. 3 m</b><span>The Siq</span></div><div><b>c. 88 m long, cut through solid sandstone</b><span>Flood-diversion tunnel</span></div><div><b>c. 1,000–4,000 m³ a day (Ortloff&#x27;s estimate)</b><span>Ain Musa spring</span></div><div><b>c. 10,000 m³</b><span>Zurraba reservoir</span></div><div><b>43 × 23 m, 2.5 m deep, over 2,000 m³</b><span>Garden pool</span></div><div><b>c. 39.5 m tall</b><span>Treasury facade</span></div><div><b>c. 20,000 (estimate, debated)</b><span>Peak population</span></div></div><p>The Nabataeans treated every drop as money. At the mouth of the Siq, the gorge that leads into the city, they built a dam and cut a tunnel about 88 m long so that winter flash floods in Wadi Musa were sent around the mountain instead of down the narrow canyon. Along the Siq itself they carved an open channel into one cliff and laid a pipeline of interlocking clay pipes in a groove on the other, bringing water from the spring of Ain Musa into the city. Small settling basins let silt drop out. Reservoirs such as the Zurraba, and many rock-cut cisterns plastered against leaks, stored the winter&#x27;s rain for the long dry summer. Hydraulic engineer Charles Ortloff&#x27;s modelling suggests some pipelines were run partly full, near their best possible flow, which avoids the bursts that pressurised clay pipes suffer.</p><div class="flip" id="marvel-petra-water-flip"><div class="flip-in"><div class="flip-f"><b>The myth</b><p>Petra was a &#x27;lost city&#x27; in a barren desert, rediscovered in 1812, and its survival there needed some forgotten or impossible technology.</p></div><div class="flip-b"><b>The reality</b><p>Local Bedouin knew Petra all along; Burckhardt was simply the first European to describe it. Its water engineering is carved in plain sight: dams, a tunnel, channels, clay pipes, settling basins and cisterns, all using known methods. What remains debated is how many people lived there, and which parts of the network are Nabataean and which were added or repaired under Roman rule.</p></div></div><button type="button" class="flip-btn" aria-pressed="false" onclick="flip('marvel-petra-water-flip',this)">Flip it</button></div><div class="twist"><b>Wow</b><p>In the middle of a city that gets less rain than most deserts&#x27; edges, King Aretas IV&#x27;s engineers built an ornamental pool 43 m long with an island pavilion, apparently to show visiting merchants how much water Petra could afford to waste.</p></div><div class="wmys"><span>Mystery meter</span><span class="pips" role="img" aria-label="Mystery level 1 of 5"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></span><small>Mostly solved</small></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">10 min read · 2,287 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Petra&#x27;s water system"><button type="button" class="wtoc-i" data-go="petra-water-s1">The storm that fills a year</button><button type="button" class="wtoc-i" data-go="petra-water-s2">Who were the Nabataeans?</button><button type="button" class="wtoc-i" data-go="petra-water-s3">Closing the front door: the dam and the tunnel</button><button type="button" class="wtoc-i" data-go="petra-water-s4">Plumbing a canyon</button><button type="button" class="wtoc-i" data-go="petra-water-s5">Springs, reservoirs and a city of cisterns</button><button type="button" class="wtoc-i" data-go="petra-water-s6">A swimming pool in the desert</button><button type="button" class="wtoc-i" data-go="petra-water-s7">The Treasury: carved from the top down</button><button type="button" class="wtoc-i" data-go="petra-water-s8">The earthquake of 363 and the long fade</button><button type="button" class="wtoc-i" data-go="petra-water-s9">Myths, arguments and what is still open</button></nav></div><section class="wsec" id="petra-water-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The storm that fills a year</h3><p>Picture a December afternoon above Petra. The sky over the limestone uplands turns the colour of slate, and for an hour or two rain hammers the bare rock. Very little soaks in. Within minutes every gully is running, the gullies feed the dry bed of Wadi Musa, and a brown wall of water, carrying gravel and uprooted shrubs, heads downhill towards a crack in the mountain barely wider than a lorry.</p><p>That crack is the Siq, the famous gorge that leads visitors to the Treasury. It is about 1.2 km long and in places only about 3 m wide. Funnel a flash flood into it and you get something close to a fire hose. In 1963, as the Associated Press later recounted, rising water in the Siq killed 22 French tourists and a local guide.</p><p>Yet two thousand years ago this same valley held a capital city of perhaps 20,000 people, according to one widely used estimate, with baths, gardens, fountains and an ornamental pool. Petra receives roughly 150 to 200 mm of rain a year, most of it in a handful of winter storms. The story of Petra is really the story of how the Nabataeans turned those few violent days into a year of water, and how they kept the violent part out of their front door.</p><blockquote class="wpull"><p>Petra&#x27;s engineers did not fight the desert&#x27;s rain. They caught it, steered it and saved it for July.</p></blockquote></section><section class="wsec" id="petra-water-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Who were the Nabataeans?</h3><p>The Nabataeans were Arab traders who grew rich moving incense, spices and other luxury goods across the deserts between Arabia, Egypt and the Mediterranean. By the late 4th century BCE Greek writers already knew them as a people who could vanish into waterless country where armies could not follow. The trick, those writers said, was water that nobody else could find.</p><blockquote class="quote"><p>They are exceptionally fond of freedom; and, whenever a strong force of enemies comes near, they take refuge in the desert, using this as a fortress; for it lacks water and cannot be crossed by others, but to them alone, since they have prepared subterranean reservoirs lined with stucco, it furnishes safety.</p><cite>Diodorus Siculus, Library of History 19.94.6, trans. Russel M. Geer, Loeb Classical Library (1954)</cite></blockquote><p>Diodorus was writing in the 1st century BCE about events of around 312 BCE, probably drawing on an eyewitness source, so the passage describes a nomadic habit rather than the later city. But it captures the mindset that built Petra: plaster the walls of a cistern so it does not leak, hide its mouth, and let the desert do your defending. Over the next three centuries that habit scaled up into urban engineering. The high point came under King Aretas IV (ruled 9 BCE to 40 CE), when the city&#x27;s greatest monuments, and much of its plumbing, took their surviving form. Rome annexed the kingdom in 106 CE, and the city carried on, repaired and adapted, for centuries more.</p></section><section class="wsec" id="petra-water-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Closing the front door: the dam and the tunnel</h3><p>The Nabataeans solved the Siq problem with a piece of engineering that still works. Just before the gorge entrance, at a spot called Bab as-Siq, they built a dam across Wadi Musa. On its own a dam would only create a lake that eventually overtopped. So they also cut a tunnel, about 88 m long, straight through the sandstone ridge beside the entrance. When the flood arrived, the dam turned it aside and the tunnel carried it into a neighbouring valley, Wadi al-Mudhlim. From there the water ran around the back of the massif, joined Wadi al-Mataha and reached the city centre by a longer, gentler route, well away from the people walking through the Siq.</p><figure class="wx wx--steps" id="petra-water-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">How Petra handled a flash flood</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How Petra handled a flash flood"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" class="wx-svg" role="img" aria-labelledby="petra-water-f1-t"><title id="petra-water-f1-t">How Petra's engineers handled a winter flash flood: schematic plan</title><defs><marker id="petra-water-f1-ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="wx-water2"/></marker></defs><text x="18" y="26" class="wx-t-cap">Schematic plan · not to scale</text><path d="M150,118 C230,96 360,92 470,110 L520,150 L500,188 C470,170 430,160 395,158 C330,150 250,160 205,195 C185,212 170,240 162,262 L132,250 C130,200 135,150 150,118 Z" class="wx-rock wx-o60 wx-edge-soft"/><path d="M180,262 C200,228 240,208 300,204 C360,200 410,212 440,242 L462,262 L482,300 L470,372 C430,410 360,436 280,438 C220,438 180,420 166,392 L170,330 Z" class="wx-stone2 wx-o60 wx-edge-soft"/><text x="262" y="412" class="wx-t-s" text-anchor="middle">sandstone massif</text><path d="M22,300 C40,270 90,262 150,280 L168,312 L166,420 C120,450 60,452 26,430 Z" class="wx-sand wx-edge-soft"/><text x="84" y="398" class="wx-t-b" text-anchor="middle">Petra</text><text x="84" y="414" class="wx-t-s" text-anchor="middle">city centre</text><path d="M548,120 C600,110 660,112 706,124 L706,200 C660,192 600,192 552,200 Z" class="wx-sand wx-o60 wx-edge-soft"/><text x="628" y="190" class="wx-t-s" text-anchor="middle">modern Wadi Musa town</text><path d= </text><path d="M508,410 L486,326" class="wx-thin"/><text x="528" y="424" class="wx-t-b">Dam at the Siq entrance</text><text x="528" y="440" class="wx-t-s">the flood is stopped before it</text><text x="528" y="454" class="wx-t-s">can funnel into the narrow gorge</text></g><g class="wx-st" data-s="3"><path d="M492,294 L468,248" class="wx-bold" stroke-dasharray="3 4"/><path d="M492,294 L470,252 C448,212 410,188 360,182 C300,176 238,184 206,214 C184,236 168,262 150,286 C128,318 96,334 60,344" class="wx-flow wx-s2" marker-end="url(#petra-water-f1-ah)"/><text x="330" y="170" class="wx-t-m wx-halo" text-anchor="middle">Wadi al-Mudhlim</text><text x="150" y="238" class="wx-t-m wx-halo" text-anchor="end">Wadi</text><text x="150" y="252" class="wx-t-m wx-halo" text-anchor="end">al-Mataha</text></g><g class="wx-st wx-hide" data-only="3"><circle cx="530" cy="346" r="9" class="wx-num"/><text x="530" y="350" class="wx-numt" text-anchor="middle">3</text><path d="M522,340 L482,272" class="wx-thin"/><text x="546" y="350" class="wx-t-b">Tunnel, c. 88 m</text><text x="546" y="366" class="wx-t-s">floodwater goes through the rock</text><text x="546" y="380" class="wx-t-s">and round the massif instead</text></g><g class="wx-st" data-s="4"><circle cx="684" cy="140" r="8" class="wx-water2 wx-edge"/><path d="M680,148 C664,210 610,272 548,290 C520,294 498,300 476,310 C440,306 412,326 380,322 C348,318 318,340 286,342 C258,344 228,354 206,358 C188,362 176,366 164,370 C140,376 110,380 86,378" class="wx-flow wx-s7"/><rect x="364" y="318" width="10" height="10" rx="1" class="wx-card wx-edge"/><text x="672" y="136" class="wx-t-s" text-anchor="end">Ain Musa spring</text></g><g class="wx-st wx-hide" data-only="4"><circle cx="196" cy="458" r="9" class="wx-num"/><text x="196" y="462" class="wx-numt" text-anchor="middle">4</text><text x="212" y="462" class="wx-t-b">Spring water flows in along the Siq</text><text x="212" y="478" class="wx-t-s">in a rock-cut channel and a clay pipeline;</text><text x="212" y="492" class="wx-t-s">settling basins (square) let the silt drop out</text><path d="M372,448 L369,330" class="wx-thin"/></g><g class="wx-st" data-s="5"><rect x="560" y="146" width="28" height="16" rx="3" class="wx-water2 wx-edge"/><circle cx="60" cy="316" r="6" class="wx-water wx-edge"/><circle cx="112" cy="300" r="6" class="wx-water wx-edge"/><circle cx="130" cy="352" r="6" class="wx-water wx-edge"/><circle cx="48" cy="364" r="6" class="wx-water wx-edge"/><circle cx="238" cy="392" r="6" class="wx-water wx-edge"/><circle cx="300" cy="244" r="6" class="wx-water wx-edge"/><circle cx="420" cy="380" r="6" class="wx-water wx-edge"/><circle cx="250" cy="140" r="6" class="wx-water wx-edge"/><circle cx="400" cy="130" r="6" class="wx-water wx-edge"/></g><g class="wx-st wx-hide" data-only="5"><circle cx="27" cy="54" r="9" class="wx-num"/><text x="27" y="58" class="wx-numt" text-anchor="middle">5</text><text x="42" y="58" class="wx-t-b">Store it for summer</text><text x="18" y="76" class="wx-t-s">rock-cut cisterns (circles)</text><text x="18" y="90" class="wx-t-s">and reservoirs such as Zurraba</text><text x="596" y="159" class="wx-t-s wx-halo">Zurraba, c. 10,000 m³</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> A winter storm hits the uplands and runoff pours down Wadi Musa towards the Siq.</p><ol class="wx-steplist"><li>A winter storm hits the uplands and runoff pours down Wadi Musa towards the Siq.</li><li>A dam across the Siq entrance stops the flood from funnelling into the narrow gorge.</li><li>A tunnel about 88 m long carries the flood into Wadi al-Mudhlim and around the massif.</li><li>Clean spring water from Ain Musa runs through the Siq in a channel and a clay pipeline, past settling basins.</li><li>Cisterns and reservoirs such as the Zurraba store the winter&#x27;s water for the dry months.</li></ol><figcaption>A schematic plan, not to scale: the dam and tunnel send floodwater around the massif while clean spring water flows through the Siq to be stored. <span class="wx-src">Based on: Layout simplified from published site plans; tunnel length from the Petra Development and Tourism Region Authority; Zurraba capacity from Ortloff 2020; channel and pipeline from Bellwald et al. 2003.</span></figcaption><p class="vh">Schematic plan of Petra. A storm cloud over the uplands in the east sends runoff down Wadi Musa towards the narrow Siq gorge. A dam blocks the Siq entrance, and a tunnel about 88 metres long carries the flood into Wadi al-Mudhlim, which curves around the north of the sandstone massif and reaches the city centre through Wadi al-Mataha. A second line shows spring water from Ain Musa flowing through the Siq in a channel and pipeline past a settling basin, and the final step marks rock-cut cisterns and the Zurraba reservoir.</p></figure><p>Walk into the tunnel today and you can see the chisel marks on its walls. The modern dam that stands at the entrance was built in 1964, after the 1963 disaster, on top of the Nabataean one; the Petra Development and Tourism Region Authority notes that the ancient dam was larger. In 2014 Jordan added an electronic flood-warning system that watches rain gauges and water sensors around the site, a modern layer on an ancient idea.</p><figure class="photo wimg" data-img="Petra Dam.jpg" data-cap="The dam at the entrance of the Siq, rebuilt in 1964 on the line of the Nabataean original."><figcaption></figcaption></figure><p>Upstream, the Nabataeans also scattered small check dams across side gullies. Each slowed the runoff, dropped some of its gravel and gave the water time to sink into the ground or be led into cisterns. Surveys with ground-penetrating radar in Petra&#x27;s northern hinterland have traced more of these barriers. The overall pattern is a landscape tuned to turn a flood into a series of manageable trickles.</p></section><section class="wsec" id="petra-water-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Plumbing a canyon</h3><p>With the floods gone, the Siq became the city&#x27;s main water main. According to Ueli Bellwald&#x27;s team, who excavated the gorge floor for the Petra National Trust, the works date to the last decades of the 1st century BCE, together with the paved road. Two separate lines ran along it. On one side, an open channel was cut into the foot of the cliff and in places covered with stone slabs. On the other, a groove was carved into the rock face about a metre above the road, and into it the builders laid a pipeline of fired clay pipes.</p><figure class="wx wx--static" id="petra-water-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">A cross-section of the Siq</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="A cross-section of the Siq"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" class="wx-svg" role="img" aria-labelledby="petra-water-f2-t"><title id="petra-water-f2-t">Cross-section of the Siq with the rock-cut channel, the clay pipeline and a person for scale</title><text x="20" y="16" class="wx-t-cap">Section across the Siq · looking along the gorge</text><path d="M140,34 L218,34 C212,120 232,180 226,230 C220,280 232,330 228,376 L206,376 L206,410 L226,410 L225,440 L140,440 Z" class="wx-stone2 wx-edge"/><path d="M580,34 L494,34 C500,110 486,170 492,230 C498,300 486,336 494,372 L512,372 L512,398 L496,398 L500,440 L580,440 Z" class="wx-stone2 wx-edge"/><path d="M140,34 l10,-8 l12,10 l14,-9 l12,8 l14,-7 l16,6" class="wx-thin"/><path d="M494,34 l14,-8 l12,9 l16,-8 l12,7 l16,-6 l16,6" class="wx-thin"/><path d="M140,34 l-8,40 l8,40 l-8,40 l8,40 l-8,40 l8,40 l-8,40 l8,40 l-8,40 l8,46" class="wx-thin"/><path d="M580,34 l8,40 l-8,40 l8,40 l-8,40 l8,40 l-8,40 l8,40 l-8,40 l8,40 l-8,46" class="wx-thin"/><path d="M160,90 l18,6 M170,170 l22,-4 M156,260 l20,5 M166,330 l16,-3 M520,80 l20,4 M530,160 l18,-5 M520,250 l24,4 M536,320 l16,-4" class="wx-thin wx-o60"/><text x="358" y="52" class="wx-t-s" text-anchor="middle">cliffs continue upward for many tens of metres</text><rect x="140" y="440" width="440" height="12" class="wx-stone3 wx-edge-soft"/><path d="M180,440 v12 M226,440 v12 M270,440 v12 M318,440 v12 M362,440 v12 M410,440 v12 M452,440 v12 M498,440 v12 M540,440 v12" class="wx-thin"/><rect x="140" y="452" width="440" height="16" class="wx-soil"/><rect x="207" y="394" width="19" height="15" class="wx-water2 wx-pulse"/><rect x="202" y="369" width="32" height="7" rx="1" class="wx-stone3 wx-edge"/><circle cx="503" cy="386" r="9" class="wx-stone3 wx-edge"/><circle cx="503" cy="386" r="5.5" class="wx-water wx-pulse"/><g class="wx-pop" style="--d:6"><circle cx="300" cy="354" r="7.5" class="wx-inkfill"/><path d="M300,363 L300,402 M300,402 L292,439 M300,402 L308,439 M300,372 L289,398 M300,372 L312,396" class="wx-bold"/><text x="318" y="356" class="wx-t-s">person, 1.7 m</text></g><g class="wx-pop" style="--d:3"><rect x="244" y="64" width="236" height="150" rx="10" class="wx-card wx-edge-soft"/><text x="258" y="86" class="wx-t-cap">Zoom · the clay pipeline</text><rect x="262" y="121" width="200" height="38" class="wx-stone3 wx-edge"/><rect x="262" y="126.7" width="200" height="26.6" class="wx-paper"/><rect x="262" y="130.7" width="200" height="22.6" class="wx-water"/><path d="M268,142 L456,142" class="wx-flow wx-s2"/><rect x="322.5" y="116" width="12" height="48" rx="2" class="wx-stone3 wx-edge"/><rect x="389" y="116" width="12" height="48" rx="2" class="wx-stone3 wx-edge"/><path d="M262,108 L328.5,108 M262,104 v8 M328.5,104 v8" class="wx-dim"/><text x="338" y="112" class="wx-t-s">one section c. 35 cm</text><text x="258" y="184" class="wx-t-s">bore c. 14 cm; socket joints</text><text x="258" y="200" class="wx-t-s">flowing partly full (Ortloff 2020)</text></g><path d="M480,160 C500,220 512,300 505,374" class="wx-thin wx-draw" pathLength="1" style="--d:4"/><g class="wx-pop" style="--d:4"><text x="20" y="318" class="wx-t-b">Open channel</text><text x="20" y="334" class="wx-t-s">cut into the foot</text><text x="20" y="348" class="wx-t-s">of one cliff; slabs</text><text x="20" y="362" class="wx-t-s">cover it in places</text></g><path d="M112,368 C150,380 180,392 204,398" class="wx-thin wx-draw" pathLength="1" style="--d:4"/><g class="wx-pop" style="--d:5"><text x="596" y="318" class="wx-t-b">Clay pipeline</text><text x="596" y="334" class="wx-t-s">laid in a groove</text><text x="596" y="348" class="wx-t-s">in the other wall,</text><text x="596" y="362" class="wx-t-s">c. 1 m above the road</text></g><path d="M606,370 C580,380 540,384 514,386" class="wx-thin wx-draw" pathLength="1" style="--d:5"/><g class="wx-pop" style="--d:6"><text x="20" y="430" class="wx-t-s">ancient paving</text><path d="M96,426 L150,444" class="wx-thin"/></g><path d="M225,470 v20 M500,470 v20" class="wx-guide"/><path d="M225,484 L500,484" class="wx-dim wx-draw" pathLength="1" style="--d:6"/><path d="M225,478 v12 M500,478 v12" class="wx-dim"/><text x="362" y="506" class="wx-t-n" text-anchor="middle">c. 5 m here</text><text x="362" y="519" class="wx-t-s" text-anchor="middle">the Siq narrows to c. 3 m in places</text><g class="wx-pop" style="--d:7"><rect x="20" y="486" width="55" height="6" class="wx-inkfill"/><rect x="75" y="486" width="55" height="6" class="wx-card wx-edge"/><text x="20" y="506" class="wx-t-s" text-anchor="middle">0</text><text x="75" y="506" class="wx-t-s" text-anchor="middle">1</text><text x="130" y="506" class="wx-t-s" text-anchor="middle">2 m</text></g></svg></div></div><figcaption>An open channel is cut into one cliff and a clay pipeline sits in a groove in the other. Drawn at about 55 px per metre; channel and pipe positions are approximate. <span class="wx-src">Based on: Pipe bore c. 14 cm and section length c. 35 cm from Ortloff 2020; channel and pipeline arrangement from Bellwald et al. 2003; Siq width from published descriptions (narrowest c. 3 m). Heights of the channel and groove are approximate.</span></figcaption><p class="vh">Cross-section across the Siq gorge, drawn to scale with a 2 metre scale bar. Two sandstone walls rise out of the frame on either side of a paved road about 5 metres wide at this point. At the foot of the left wall a small open channel is cut into the rock with a stone slab over it. In the right wall, about 1 metre above the road, a round clay pipe sits in a carved groove. A person 1.7 metres tall stands in the middle. A zoomed inset shows interlocking clay pipe sections about 35 centimetres long with a 14 centimetre bore, flowing partly full.</p></figure><p>The pipes are the clever part. Each section is roughly 35 cm long with a bore of about 14 cm, and one end is narrower so it slots into the next, like a stack of paper cups. Along the route, small settling basins slowed the flow so sand and lime could settle out before the water reached the city. Visitors can still see pieces of the pipeline, and of the channel, in the walls of the Siq.</p><p>Charles Ortloff, a hydraulic engineer who has spent decades modelling ancient water systems, calculated how these pipelines behaved. His conclusion is that several were designed to flow partly full, close to what engineers call critical flow, the condition at which a channel of given size and slope carries the most water for the least depth. A pipe flowing partly full is under little pressure, so its mortared clay joints are far less likely to leak or burst than a pipe running full. For the Siq line, his model gives about 0.017 to 0.023 m³ per second at slopes of 1 to 2 degrees, or very roughly 1,500 to 2,000 m³ a day.</p><aside class="wcall"><b>How do we know?</b><p>Ortloff&#x27;s numbers come from measuring surviving pipe sizes, channel dimensions and slopes, then applying standard open-channel hydraulics. That is a reconstruction, not a flow meter reading from antiquity. We cannot know how often the pipes were blocked, repaired or running below capacity. What the modelling does show is that the design choices, such as pipe size, slope and settling basins, are consistent with engineers who understood how to move water steadily without pressure.</p></aside><figure class="photo wimg" data-img="Roman Water Channel the Siq Petra Jordan1339.jpg" data-cap="A stretch of water channel cut into the Siq wall. The photo&#x27;s title calls it Roman, but the system is Nabataean in origin, later maintained under Rome."><figcaption></figcaption></figure></section><section class="wsec" id="petra-water-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Springs, reservoirs and a city of cisterns</h3><p>The Siq line began at Ain Musa, the Spring of Moses, which rises in the uplands where the modern town of Wadi Musa now stands. Ortloff estimates its output at around 1,000 to 4,000 m³ a day, depending on season and year. Near the spring, the Zurraba reservoir, with a capacity of about 10,000 m³, acted as a buffer, storing water so that the city&#x27;s supply did not simply follow the spring&#x27;s rhythm. Other springs, including Ain Braq and Ain Dibdiba, fed further pipelines that entered Petra by other routes.</p><p>Then there was the rain itself. Across the city and the surrounding hills, the Nabataeans cut cisterns into the rock and plastered them to keep them watertight. Roofs, courtyards and even bare rock slopes were shaped so that runoff flowed into channels and on into storage. Many cisterns had settling tanks in front of them, so the first dirty flush of a storm was held back. The sheer number of these features, from tiny basins to large tanks, is what made the system resilient: when one source failed, others remained.</p><p>Keeping all this working was a year-round job. Every storm washed sand into channels and cisterns, so settling tanks and basins had to be dug out; plaster cracked and had to be patched; clay pipes broke and were replaced. Nabataean water was as much a matter of daily maintenance as of clever design. When, centuries later, the people and money for that maintenance dwindled, the system did not fail in a single dramatic moment. It silted up, one basin at a time.</p><ul class="wlist"><li>Catch: shape slopes, roofs and gullies so that rain runs where you want it.</li><li>Slow: check dams and settling tanks take the energy and the silt out of the water.</li><li>Store: plastered cisterns and reservoirs hold winter water through a rainless summer.</li><li>Deliver: gravity-fed channels and low-pressure clay pipelines carry water to fountains, baths and houses.</li></ul><p>Ortloff&#x27;s working figure for the city at its height is about 20,000 people, a number often repeated. It is best read as a plausible order of magnitude rather than a census. Population estimates for Petra depend on assumptions about how many houses were occupied at once, and there is still no complete map of domestic buildings.</p></section><section class="wsec" id="petra-water-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>A swimming pool in the desert</h3><p>For most of the 20th century, a large terrace beside Petra&#x27;s colonnaded street was labelled the &#x27;Lower Market&#x27;. Beginning in 1998, excavations led by Leigh-Ann Bedal showed it was nothing of the sort. Under the rubble lay a great pool, 43 by 23 m and 2.5 m deep, holding over 2,000 m³ of water. In the middle stood an island pavilion about 11.5 by 14.5 m, open to the water on at least three sides. Around it were gardens, walkways and an intricate network of channels, filtering basins and ceramic pipes, fed from a tank on the escarpment above.</p><p>Bedal dates the complex to the end of the 1st century BCE, early in Aretas IV&#x27;s reign, and compares it to the paradeisos, the walled pleasure garden that spread into the Mediterranean world after Alexander&#x27;s campaigns in the east. She reads the pool as deliberate conspicuous consumption: a traveller arriving from the desert would see, at the heart of the city, an expanse of open water that evaporated freely in the sun. Few statements of wealth and control could have been clearer.</p><blockquote class="wpull"><p>In a place where water meant life, a pool you could row a boat across was the loudest boast in the kingdom.</p></blockquote><p>The complex stayed in use after the Roman annexation and was abandoned sometime in the late 2nd or 3rd century CE. By the time of the great earthquake of 363 it was already out of use, and the quake left it in ruins.</p></section><section class="wsec" id="petra-water-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>The Treasury: carved from the top down</h3><p>At the end of the Siq the gorge opens and the Treasury, al-Khazneh, fills the view: a two-storey facade about 39.5 m high, with columns, pediment and a round pavilion topped by an urn. It is usually attributed to the reign of Aretas IV and is widely interpreted as a royal tomb or memorial, not a treasury at all. The name comes from a local legend that the urn held a pharaoh&#x27;s gold; the bullet marks on it were left by people who tried to shoot it open. Inside, the rooms are plain, with a main chamber and side chambers adding up to around 2,000 m³ of space.</p><p>How do you carve a building out of a cliff? Unfinished facades elsewhere at Petra show the likely answer: the stonecutters started at the top and worked downward, so the finished upper parts never had to be reached from below and no scaffolding tower was needed against the rock face. They probably cut ledges and steps, dressed the stone as they descended, and used the rising floor of rubble as a working platform. It is a method that punishes mistakes, since nothing can be added back, and the Treasury&#x27;s crisp detailing is a measure of how well the carvers planned.</p><aside class="wcall"><b>Fresh from the field</b><p>In 2003 and 2005, excavations in front of the Treasury found tombs beneath the forecourt, with the remains of at least 11 people. In August 2024 a Jordanian and American team, including the Department of Antiquities and the American Center of Research led on site by Pearce Paul Creasman, opened another tomb there and found 12 skeletons with bronze, iron and ceramic objects, including a small juglet. The finds are not yet fully published. Radiocarbon, luminescence and DNA samples are being analysed, and remote sensing hints at more features deeper under the courtyard.</p></aside></section><section class="wsec" id="petra-water-s8"><h3 class="wsec-h"><span class="wsec-n">08</span>The earthquake of 363 and the long fade</h3><p>On the night of 19 May 363 CE a powerful earthquake struck the region. A letter attributed to Cyril, bishop of Jerusalem, lists Petra among the towns damaged, and archaeology backs this up: collapsed buildings across the city date to this event. The quake also broke the water system. Bellwald&#x27;s team found that afterwards only one of the Siq&#x27;s two water lines was repaired, which suggests a city with fewer people and fewer resources, choosing the line that mattered most.</p><p>Petra did not end in 363. Churches were built there in the 5th and 6th centuries, and some occupation continued into the 7th. But trade routes had shifted, and without constant maintenance a water network like Petra&#x27;s slowly silts up. Channels clogged, cisterns cracked, pipes were robbed for their clay. By the time Johann Ludwig Burckhardt arrived in 1812, disguised as a traveller seeking to make a sacrifice at the tomb of Aaron, the city was a ruin known well to the local Bedouin but not to Europe.</p></section><section class="wsec" id="petra-water-s9"><h3 class="wsec-h"><span class="wsec-n">09</span>Myths, arguments and what is still open</h3><p>The biggest myth is the &#x27;lost city&#x27;. Petra was never lost to the people who lived around it; Burckhardt was the first European to write about it, which is a different thing. The second myth is that its survival in the desert needed some unknown technology. Every component of the system, from the tunnel to the plaster, uses methods known across the ancient Mediterranean and Near East. What is impressive is the combination and the planning.</p><p>The real arguments are more interesting. How many people did Petra hold, and when? Estimates of about 20,000 are often quoted, but they rest on water budgets and assumptions rather than a count of houses. Which parts are Nabataean and which were added or rebuilt under Rome is also debated, because pipelines were repaired and rerouted over centuries. And some scholars caution against assuming that the critical-flow design was intended, rather than being the result of rules of thumb that happened to work well.</p><p>What nobody disputes is that a small kingdom of traders built one of the ancient world&#x27;s most carefully managed urban water systems in a place that gets less rain in a year than London does in four months. The chisel marks are still in the tunnel. The next winter storm will still be sent around the mountain.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">312 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Greek sources describe Nabataeans hiding water in plastered underground cisterns</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">25 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Late 1st century BCE: Siq dam, tunnel, channels and paving built</span></li><li class="wtl-build" style="--i:2"><span class="wtl-y">9 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Aretas IV begins his reign: era of the Treasury and the pool complex</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">106 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Rome annexes the Nabataean kingdom</span></li><li class="wtl-loss" style="--i:4"><span class="wtl-y">363 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">19 May earthquake cripples buildings and waterworks</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">1812 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Burckhardt becomes the first European to describe Petra</span></li><li class="wtl-event" style="--i:6"><span class="wtl-y">1963 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Flash flood in the Siq kills 22 French tourists and a local guide</span></li><li class="wtl-build" style="--i:7"><span class="wtl-y">1964 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Dam rebuilt over the Nabataean original</span></li><li class="wtl-event" style="--i:8"><span class="wtl-y">1985 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Petra inscribed as a UNESCO World Heritage Site</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">1998 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Leigh-Ann Bedal begins excavating the pool and garden complex</span></li><li class="wtl-find" style="--i:10"><span class="wtl-y">2003 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Tombs found beneath the Treasury forecourt</span></li><li class="wtl-find" style="--i:11"><span class="wtl-y">2024 CE</span><span class="wtl-k">Found</span><span class="wtl-t">New tomb with 12 skeletons found under the Treasury</span></li></ol><figure class="wbars"><h4 class="wx-title">Petra&#x27;s water in cubic metres: storage and daily flow</h4><div class="wb-r" style="--w:100.0%;--i:0"><div class="wb-l">Zurraba reservoir<small>capacity</small></div><div class="wb-t"><i></i><span>10,000 m³</span></div></div><div class="wb-r" style="--w:40.0%;--i:1"><div class="wb-l">Ain Musa spring, high estimate<small>per day</small></div><div class="wb-t"><i></i><span>4,000 m³</span></div></div><div class="wb-r" style="--w:20.0%;--i:2"><div class="wb-l">Garden complex pool<small>capacity, over</small></div><div class="wb-t"><i></i><span>2,000 m³</span></div></div><div class="wb-r" style="--w:19.9%;--i:3"><div class="wb-l">Siq pipeline at a 2° slope<small>per day, modelled (0.023 m³/s)</small></div><div class="wb-t"><i></i><span>1,990 m³</span></div></div><div class="wb-r" style="--w:10.0%;--i:4"><div class="wb-l">Ain Musa spring, low estimate<small>per day</small></div><div class="wb-t"><i></i><span>1,000 m³</span></div></div><figcaption>Source: Ortloff 2020 (Water 12: 3498); Bedal 2004</figcaption></figure><h3 class="sub-h wsub">The big debates</h3><div class="debate"><p class="debate-q">Did Nabataean engineers deliberately design pipes for critical flow?</p><div class="sides"><div class="side"><b>Yes, by design</b><span>Ortloff&#x27;s hydraulic models show several pipelines sized and sloped to run partly full near critical flow, which maximises delivery while keeping pressure, leaks and bursts low.</span></div><div class="side"><b>Rule of thumb, not theory</b><span>No Nabataean engineering text survives. Builders may have reached good designs by trial and error; the modern concept of critical flow did not exist.</span></div></div><p class="debate-why"><b>The bold claim:</b> Petra&#x27;s pipelines were engineered to run near maximum efficient flow without pressure.</p><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The measured pipe sizes and slopes are consistent with near-critical, low-pressure flow, and that is a sensible design for mortared clay pipes. But the evidence is a modern reconstruction. Whether the builders understood the principle or simply learned what worked cannot be tested directly, so the result is plausible rather than established.</p></div><div class="debate"><p class="debate-q">Was Petra a lost city until 1812?</p><div class="sides"><div class="side"><b>Rediscovered</b><span>Burckhardt&#x27;s 1812 visit introduced Petra to European scholarship and travel writing.</span></div><div class="side"><b>Never lost</b><span>Local Bedouin lived in and around the site, grazed flocks there and guided Burckhardt to it. Crusaders also knew the area.</span></div></div><p class="debate-why"><b>The bold claim:</b> Petra was lost to the world until a European found it.</p><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The city was abandoned as an urban centre, but people living nearby always knew it. Burckhardt was the first European to describe it in print. Calling it &#x27;lost&#x27; reflects a European point of view, not the history of the site.</p></div><div class="debate"><p class="debate-q">How many people did Petra&#x27;s water support?</p><div class="sides"><div class="side"><b>About 20,000 or more</b><span>Water-budget estimates based on spring output, reservoirs and cisterns, used by Ortloff and others.</span></div><div class="side"><b>Unknown, possibly fewer</b><span>No full survey of housing exists, and different parts of the city were occupied at different times.</span></div></div><p class="debate-why"><b>The bold claim:</b> Nabataean Petra held around 20,000 people at its height.</p><div class="meter" style="--pos:41.7%" role="img" aria-label="Weight of evidence: Open question"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The figure is a reasonable estimate of what the water system could supply, but capacity is not the same as population. Until domestic areas are mapped and dated more fully, any headcount remains an informed guess.</p></div><details class="srcs"><summary>Sources for this deep dive (14)</summary><ol><li>Ortloff, C. R. (2005). The water supply and distribution system of the Nabataean city of Petra (Jordan), 300 BC–AD 300. Cambridge Archaeological Journal 15(1): 93–109. <a href="https://doi.org/10.1017/S0959774305000053" target="_blank" rel="noopener">doi:10.1017/S0959774305000053</a></li><li>Ortloff, C. R. (2020). Hydraulic engineering at 100 BC–AD 300 Nabataean Petra (Jordan). Water 12(12): 3498. <a href="https://doi.org/10.3390/w12123498" target="_blank" rel="noopener">doi:10.3390/w12123498</a></li><li>Bellwald, U. et al. (2003). The Petra Siq: Nabataean Hydrology Uncovered. Amman: Petra National Trust.</li><li>Bedal, L.-A. (2004). The Petra Pool-Complex: A Hellenistic Paradeisos in the Nabataean Capital. Piscataway: Gorgias Press.</li><li>Bedal, L.-A. (2002). Desert oasis: water consumption and display in the Nabataean capital. Near Eastern Archaeology 65(4): 225–234.</li><li>Bedal, L.-A., Gleason, K. L. &amp; Schryver, J. G. (2011). The Petra Garden and Pool Complex, 2007 and 2009. Annual of the Department of Antiquities of Jordan 55: 313–328.</li><li>Diodorus Siculus. Library of History, Vol. X (Books 19.66–20), trans. R. M. Geer. Loeb Classical Library, Harvard University Press (1954).</li><li>Russell, K. W. (1980). The earthquake of May 19, A.D. 363. Bulletin of the American Schools of Oriental Research 238: 47–64.</li><li>American Center of Research (2024). Petra &#x27;Expedition Unknown&#x27; episodes: learn more (Khazneh tomb excavations, 2003, 2005 and 2024). acorjordan.org.</li><li>The Conversation (2024). What 12 ancient skeletons discovered in a mysterious tomb in Petra could tell us about the ancient city.</li><li>Petra Development and Tourism Region Authority. Visit Petra: Al Mudhlim Tunnel and Bab as-Siq Dam; Al Khazna (The Treasury). visitpetra.jo.</li><li>Associated Press (2018). In Jordan&#x27;s ancient Petra, sirens warn of flash floods (reported via Arab News).</li><li>Urban, T. M., Bocancea, E., Vella, C., Herringer, S., Tuttle, C. A. &amp; Alcock, S. E. Investigating ancient dams in Petra&#x27;s northern hinterland with ground-penetrating radar (Brown University Petra Archaeological Project).</li><li>UNESCO World Heritage Centre. Petra (inscribed 1985), property 326.</li></ol></details><aside class="rc-cite" data-v="marvels" data-id="marvel-petra-water" data-t="Petra&#x27;s water system"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Petra&#x27;s water system</i>. <span class="cite-u">https://residualcontinuum.com/#marvels/marvel-petra-water</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="marvel-terracotta-army-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Qin Terracotta Army, Pit 1 01.jpg" data-cap="Pit 1 of the Terracotta Army" data-big><figcaption></figcaption></figure><div class="sh-k">Lintong, Xi&#x27;an, China</div><h2 class="sh-t" id="marvel-terracotta-army-st" tabindex="-1">The Terracotta Army</h2><p class="sh-s">Thousands of life-size soldiers, each with his own face, mass-produced by named workshops to guard an emperor&#x27;s tomb nobody has yet opened.</p><div class="sh-v"><span class="vstamp vstamp--mys">Mystery <span class="pips" role="img" aria-label="Mystery level 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span></span></div></div><div class="wquick"><h3 class="sub-h">The quick read</h3><div class="ctrs"><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="8000" >8,000</b><span class="ctr-u"> soldiers</span></div><div class="ctr-l">estimated in the three main pits</div><div class="ctr-c">Portal 2007</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="6000" >6,000</b><span class="ctr-u"> figures</span></div><div class="ctr-l">and horses estimated in pit 1 alone</div><div class="ctr-c">Emperor Qinshihuang&#x27;s Mausoleum Site Museum</div></div><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="40000" >40,000</b><span class="ctr-u"> bronze items</span></div><div class="ctr-l">weapons and fittings recovered</div><div class="ctr-c">Martinón-Torres et al. 2019</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="464" >464</b><span class="ctr-u"> parts</span></div><div class="ctr-l">tested: chromium on only c. 8%</div><div class="ctr-c">Martinón-Torres et al. 2019</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="230" >230</b><span class="ctr-u"> m</span></div><div class="ctr-l">length of pit 1, 62 m wide</div><div class="ctr-c">Emperor Qinshihuang&#x27;s Mausoleum Site Museum</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="1974" >1,974</b><span class="ctr-u"> </span></div><div class="ctr-l">year farmers digging a well struck a clay head</div><div class="ctr-c">UNESCO</div></div></div><div class="stats"><div><b>over 8,000 soldiers, 130 chariots, c. 670 horses (Portal 2007)</b><span>Estimated figures</span></div><div><b>c. 230 × 62 m, c. 6,000 figures and horses estimated</b><span>Pit 1</span></div><div><b>c. 1.75–2 m</b><span>Figure height</span></div><div><b>over 40,000</b><span>Bronze weapon items</span></div><div><b>464; chromium on c. 8%, from lacquer</b><span>Weapon parts tested for chromium (2019)</span></div><div><b>29 March 1974, by farmers digging a well</b><span>Discovered</span></div><div><b>still unexcavated</b><span>Emperor&#x27;s tomb chamber</span></div></div><p>The warriors were built like modular machines. Workshops shaped solid clay legs on a plinth, built hollow torsos up from coils or slabs of clay, attached separately made arms and hands, and pressed heads in a small number of two-part moulds. Then craftsmen added ears, hair, moustaches and expressions by hand, so that faces vary endlessly. Many pieces carry the stamped or incised names of workshop foremen, a quality-control system that lets archaeologists trace who made what. The finished figures were fired at roughly 950–1,050 °C, coated with two layers of East Asian lacquer, painted with mineral pigments including the synthetic &#x27;Chinese purple&#x27;, armed with real bronze weapons and lined up in timber-roofed corridors in pits east of the emperor&#x27;s tomb.</p><div class="flip" id="marvel-terracotta-army-flip"><div class="flip-in"><div class="flip-f"><b>The myth</b><p>Qin metalworkers chrome-plated their bronze swords to stop them rusting, a technology the West only invented in the 20th century.</p></div><div class="flip-b"><b>The reality</b><p>A 2019 analysis of 464 weapon parts found chromium on only a small fraction, mostly fittings that had touched lacquered wood. The chromium came from the lacquer, not from deliberate plating. The weapons survived well because of the mildly alkaline, fine-grained burial soil and the bronze&#x27;s tin-rich composition.</p></div></div><button type="button" class="flip-btn" aria-pressed="false" onclick="flip('marvel-terracotta-army-flip',this)">Flip it</button></div><div class="twist"><b>Wow</b><p>No two excavated faces are known to be identical, yet the army came off something close to an ancient production line, with named supervisors signing their work.</p></div><div class="wmys"><span>Mystery meter</span><span class="pips" role="img" aria-label="Mystery level 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><small>A few loose ends</small></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">10 min read · 2,307 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Terracotta Army"><button type="button" class="wtoc-i" data-go="terracotta-army-s1">A head in the well</button><button type="button" class="wtoc-i" data-go="terracotta-army-s2">An emperor who planned for ever</button><button type="button" class="wtoc-i" data-go="terracotta-army-s3">Pit 1: an army in corridors</button><button type="button" class="wtoc-i" data-go="terracotta-army-s4">A production line with faces</button><button type="button" class="wtoc-i" data-go="terracotta-army-s5">Real weapons, and a chrome myth</button><button type="button" class="wtoc-i" data-go="terracotta-army-s6">An army in colour</button><button type="button" class="wtoc-i" data-go="terracotta-army-s7">Rivers of mercury</button><button type="button" class="wtoc-i" data-go="terracotta-army-s8">Portraits, propaganda and patience</button></nav></div><section class="wsec" id="terracotta-army-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A head in the well</h3><p>In March 1974, during a drought, a group of farmers in Lintong, east of Xi&#x27;an, were digging a well. A few metres down their spades hit fragments of fired clay, then something stranger: a head, life-size, with a moustache. Among the diggers was Yang Zhifa, who would spend much of the rest of his life signing books in the museum that grew over his field.</p><p>What they had found was the edge of pit 1 of the Terracotta Army. Over the following years archaeologists uncovered a subterranean army about 1.5 km east of the burial mound of Ying Zheng, the king of Qin who in 221 BCE conquered his rivals and declared himself Qin Shi Huang, the First Emperor. Estimates now run to more than 8,000 soldiers, 130 chariots with 520 horses and 150 cavalry horses in the three main pits, most of them still in the ground.</p><blockquote class="wpull"><p>It is an army built to face east, for eternity, towards the kingdoms its emperor had just destroyed.</p></blockquote><p>The Terracotta Army is often described as one of the wonders of the ancient world, and it deserves it. But its real fascination is not just its size. It is the combination of an industrial production system with astonishing individuality, and the fact that the greatest treasure of all, the emperor&#x27;s own tomb, remains unopened.</p></section><section class="wsec" id="terracotta-army-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>An emperor who planned for ever</h3><p>Ying Zheng became king of Qin in 246 BCE, aged about thirteen, and work on his tomb began almost at once, as was usual for rulers of the time. After unification the project grew to match his new status. The historian Sima Qian, writing about a century later, says that more than 700,000 people from across the empire were sent to work on it. That figure is probably rounded and may include convict labour on other state projects, but the scale of what survives makes clear this was an enormous undertaking.</p><p>The tomb complex covers dozens of square kilometres. At its centre is the mound, a truncated pyramid of rammed earth that still rises some 50 m or more above the plain, depending on where it is measured from, surrounded by the remains of inner and outer walls. Around it archaeologists have found some 200 accompanying pits holding stables with real horses, bronze waterbirds, stone armour, acrobats and officials. The army pits lie outside the walls, to the east.</p><p>Why an army? The First Emperor spent his life at war and then trying to escape death, sending expeditions to find elixirs of immortality. A tomb furnished like a palace and guarded like a capital was a way of carrying his power into the afterlife. The soldiers are arranged in battle formation and face east, the direction from which his defeated rivals had come.</p><p>Standardisation was a Qin obsession. After unification the First Emperor&#x27;s government imposed common weights and measures, a single script, a standard coinage and even a fixed width for cart axles, so that wagons could run in the same ruts across the empire. The terracotta army is that mindset turned into sculpture. The same state that insisted every measuring cup hold the same volume also organised its tomb builders into units working to shared templates, with each unit&#x27;s output labelled and checked. Seen this way, the army is not only a work of art or a religious offering. It is a monument to bureaucracy, and a very effective one.</p></section><section class="wsec" id="terracotta-army-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Pit 1: an army in corridors</h3><p>Pit 1 is the biggest: roughly 230 m long and 62 m wide, dug several metres into the loess. Its builders divided it with ten rammed-earth walls into eleven corridors, most of them more than 3 m wide. They floored the corridors with bricks, stood the figures in ranks, and roofed the whole pit with massive timber beams covered with reed mats and layers of earth. Then they buried it.</p><figure class="wx wx--static" id="terracotta-army-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Pit 1 in plan</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Pit 1 in plan"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" class="wx-svg" role="img" aria-labelledby="terracotta-army-f2-t"><title id="terracotta-army-f2-t">Plan of Terracotta Army pit 1 and its position east of the tomb mound</title><defs><marker id="terracotta-army-f2-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" class="wx-inkfill"/></marker><marker id="terracotta-army-f2-aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" class="wx-accfill"/></marker><marker id="terracotta-army-f2-am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" class="wx-c2"/></marker></defs><text x="20" y="24" class="wx-t-cap 1="200" y1="227.2" x2="200" y2="194" class="wx-thin"/><text x="190" y="190" class="wx-t" text-anchor="start">flank guards face outward</text><line x1="598" y1="360.8" x2="598" y2="401.2" class="wx-thin"/><text x="598" y="415.2" class="wx-t" text-anchor="middle">war chariots in the corridors</text><line x1="310" y1="339" x2="310" y2="423.2" class="wx-thin"/><text x="318" y="435.2" class="wx-t">10 rammed-earth walls divide 11 corridors;</text><text x="318" y="450.2" class="wx-t">roofed with timber beams, mats and earth</text><line x1="68.8" y1="379.2" x2="70" y2="401.2" class="wx-thin"/><text x="60" y="415.2" class="wx-t">rear guard faces west</text><path d="M60.0,475.2 L658,475.2" class="wx-dim" marker-start="url(#terracotta-army-f2-ah)" marker-end="url(#terracotta-army-f2-ah)"/><text x="130" y="471.2" class="wx-t-n wx-halo" text-anchor="middle">c. 230 m</text><path d="M46.0,222.0 L46.0,383.2" class="wx-dim" marker-start="url(#terracotta-army-f2-ah)" marker-end="url(#terracotta-army-f2-ah)"/><text x="40.0" y="302.6" class="wx-t-n" text-anchor="middle" transform="rotate(-90 40.0 302.6)">c. 62 m</text><path d="M666,302.6 L698,302.6" class="wx-line" marker-end="url(#terracotta-army-f2-ah)"/><text x="682" y="294.6" class="wx-t-b" text-anchor="middle">E</text><rect x="60.0" y="487.2" width="130" height="5" class="wx-inkfill"/><text x="196" y="493.2" class="wx-t-s">50 m</text><text x="700" y="493.2" class="wx-t-s" text-anchor="end">corridor layout and figure rows schematic</text></svg></div></div><figcaption>Eleven corridors between ten rammed-earth walls, with a vanguard of archers facing east, flank guards, a rear guard and chariots among the infantry. <span class="wx-src">Based on: Pit 1 dimensions (c. 230 × 62 m, 11 corridors) and figure estimates from the Mausoleum Site Museum and Portal 2007; distance to the mound c. 1.5 km. Corridor widths, figure rows and the excavated boundary are schematic.</span></figcaption><p class="vh">An inset map shows the square tomb mound on the left and, about 1.5 km to the east, three small rectangles for pits 1, 2 and 3, with a north arrow and a 500 m scale bar. Below, a scaled plan of pit 1, about 230 m long and 62 m wide, shows eleven long corridors separated by ten earthen walls. Rows of dots mark soldiers: three rows at the east end form the vanguard, single rows along the outer corridors face outward, three rows at the west end form the rear guard, and four columns fill each central corridor with small brown rectangles for chariots. The western half is veiled to show it is largely unexcavated.</p></figure><p>The formation is a textbook of Qin warfare. At the eastern end a vanguard of archers stands three rows deep. Along the outer corridors, flank guards face outwards. The main body, infantry in columns with war chariots among them, fills the central corridors, and a rear guard faces west. Pit 1 alone is estimated to hold about 6,000 figures and horses. Pit 2, to the north-east, holds a mixed force of cavalry, chariots, archers and infantry; tiny pit 3, with 68 figures and a chariot, looks like a command post.</p><p>The army did not rest in peace for long. After the First Emperor died in 210 BCE, his dynasty collapsed within four years. The pits were broken into, weapons were taken and the timber roofs burned, a destruction traditionally blamed on the rebel general Xiang Yu. The roofs fell in, smashing the figures. Almost every warrior on display today has been pieced together from fragments, like a vast three-dimensional jigsaw.</p><p>The ranks are not all the same. Archers kneel or stand in different poses, ready to shoot in turn. Charioteers stretch out their arms to hold long-vanished reins. Cavalrymen stand beside their saddled horses. Officers are taller and wear more elaborate armour and headgear, and a handful of so-called generals, with tasselled caps and bellies that strain against their armour, are the tallest of all. Their postures and hand positions match the weapons they once held, so that even where the wood and bronze have gone, archaeologists can often tell who carried a crossbow and who a spear.</p><figure class="photo wimg" data-img="Terracotta Army, View of Pit 1.jpg" data-cap="Restored ranks in pit 1, looking along the corridors."><figcaption></figcaption></figure></section><section class="wsec" id="terracotta-army-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>A production line with faces</h3><p>How do you make thousands of life-size ceramic soldiers in a few decades? You design them like a kit. Each warrior was assembled from standard parts, and the tomb&#x27;s workshops seem to have divided the labour much like a modern factory.</p><figure class="wx wx--steps" id="terracotta-army-f1" data-n="6"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">Making a warrior, part by part</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Making a warrior, part by part"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" class="wx-svg" role="img" aria-labelledby="terracotta-army-f1-t"><title id="terracotta-army-f1-t">How a terracotta warrior was made, step by step</title><defs><marker id="terracotta-army-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" class="wx-inkfill"/></marker><marker id="terracotta-army-f1-aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" class="wx-accfill"/></marker><marker id="terracotta-army-f1-am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" class="wx-c2"/></marker></defs><text x="20" y="26" class="wx-t-cap">Making a warrior, part by part</text><line x1="20" y1="452" x2="400" y2="452" class="wx-thin"/><g class="wx-st" data-s="1"><rect x="186" y="434" width="14
