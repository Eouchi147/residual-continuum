4 L620.9,247 L633,246 L633,246 L632.6,233.7 L625.8,228.6 L619.1,223.7 L612.6,219 L606.2,214.6 L599.7,210.4 L593.1,206.8 L586.4,203.8 L579.6,201.4 L572.8,199.5 L566,198 L559.3,196.8 L552.7,195.8 L546.1,195 L539.5,194.5 L533,194.5 L526.4,194.9 L519.9,195.9 L513.4,197.4 L507,199.3 L500.6,201.5 L494.3,204.1 L488,206.9 L481.7,210 L475.4,213.5 L469.1,217.4 L462.9,221.7 L456.8,226.4 L450.6,231.5 L444.5,236.9 Z" class="wx-fire wx-o80 wx-pop" style="--d:8"/><path d="M445.5,238 L451.7,232.9 L458,228.1 L464.2,223.7 L470.5,219.7 L476.8,216 L483,212.7 L489.2,209.8 L495.5,207.3 L501.8,205.1 L508,203.3 L514.2,201.9 L520.5,200.9 L526.8,200.2 L533,199.9 L539.2,200 L545.5,200.5 L551.8,201.3 L558,202.5 L564.2,204.1 L570.5,206 L576.8,208.3 L583,211 L589.2,214.1 L595.5,217.5 L601.8,221.3 L608,225.5 L614.2,230.1 L620.5,235 L626.8,240.3 L633,246" class="wx-flow wx-s8" style="stroke-width:2"/><path d="M603,262 Q611,250 619,262 Q627,246 635,262 Q643,252 651,262 Z" class="wx-fire wx-pulse"/><path d="M639,228 Q649,266 679,274 L720,274 L720,232 Z" class="wx-stone3 wx-edge"/><text x="659" y="218" class="wx-t-s">enemy ship</text><path d="M36,366 L423.5,366 M36,360 L36,372 M423.5,360 L423.5,372" class="wx-dim"/><rect x="169.8" y="357" width="120" height="18" rx="4" class="wx-paper"/><text x="229.8" y="370" class="wx-t-n" text-anchor="middle">c. 31 m long</text><path d="M445.5,366 L633,366 M445.5,360 L445.5,372 M633,360 L633,372" class="wx-dim"/><rect x="495.2" y="357" width="88" height="18" rx="4" class="wx-paper"/><text x="539.2" y="370" class="wx-t-n" text-anchor="middle">c. 15 m jet</text><path d="M36,404 L161,404" class="wx-bold"/><path d="M36,399 L36,409 M98.5,400 L98.5,408 M161,399 L161,409" class="wx-line"/><text x="36" y="422" class="wx-t-s" text-anchor="middle">0</text><text x="161" y="422" class="wx-t-s" text-anchor="middle">10 m</text><text x="185" y="408" class="wx-t-s">human figure on forecastle = 1.7 m</text><path d="M423.5,242 L449.5,306" class="wx-thin"/><text x="453.5" y="318" class="wx-t-b">siphon</text><text x="453.5" y="333" class="wx-t-m">bronze-clad, in the bow</text><path d="M409.5,206 L439.5,150" class="wx-thin"/><text x="443.5" y="146" class="wx-t-b">forecastle</text><path d="M166,270 L186,306" class="wx-thin"/><text x="190" y="318" class="wx-t-b">two oar banks</text><text x="190" y="333" class="wx-t-m">25 oars per bank per side</text><path d="M42,282 L48,326" class="wx-thin"/><text x="52" y="338" class="wx-t-b">steering oar</text></svg></div></div><figcaption>Side profile of a 10th-century bireme dromon (about 31 m), with the siphon under the forecastle in the bow and the reconstructed 15 m jet. Heights are approximate. <span class="wx-src">Based on: Hull length and oar arrangement: Pryor and Jeffreys 2006 (tenth-century bireme, c. 31–32 m, 25 oars per bank per side). Jet range: Haldon 2006. Siphon position: Leo VI, Taktika 19. Heights and sail plan approximate.</span></figcaption><p class="vh">Side profile of a long, low Byzantine war galley about 31 metres long, with two banks of oars, two masts with lateen yards, a raised forecastle at the bow and a steering oar at the stern. A bronze siphon projects from the bow beneath the forecastle. From it an arcing jet of fire reaches about 15 metres towards the bow of an enemy ship on the right. A 10 metre scale bar and a 1.7 metre human figure on deck give scale. Labels mark the siphon, the forecastle, the two oar banks and the jet range, with a note that the profile is a reconstruction.</p></figure><p>A successful reconstruction is not the same as recovering the original, and Haldon is careful to say so. It shows that the texts can be satisfied by technology the Byzantines had. It does not tell us their exact recipe, pressures or nozzle design. Other arrangements, such as a pump system with no heating at all, cannot be ruled out.</p><blockquote class="wpull"><p>The experiment answers &#x27;could it work?&#x27; with a loud yes. It cannot answer &#x27;was it exactly like this?&#x27;</p></blockquote></section><section class="wsec" id="greek-fire-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What was in the tank?</h3><p>Over the centuries, writers have proposed almost every flammable substance known to the medieval world. The main hypotheses fall into a few families.</p><ul class="wlist"><li>Petroleum-based: light crude oil or naphtha, possibly distilled or &#x27;prepared&#x27;, often with pine resin added to make it sticky and longer-burning. This is the majority view today.</li><li>Quicklime: calcium oxide heats up violently when wet, which once seemed a neat explanation for fire that water could not quench. Most scholars now reject it as the main ingredient, because quicklime alone cannot produce a projected jet of flame.</li><li>Saltpetre and gunpowder: popular in older books, but saltpetre-based mixtures are not documented in the Mediterranean until the 13th century, centuries after Greek fire appeared.</li><li>Sulphur and other additives: possible minor ingredients, mentioned in later medieval incendiary recipes, but no Byzantine text confirms them.</li></ul><p>The petroleum case rests on several converging clues. Constantine VII&#x27;s handbook on foreign peoples, the De administrando imperio, names oil-bearing places around the Black Sea and Caucasus, such as Tamatarcha and Zichia. Descriptions of fire floating and spreading on water fit a light oil. Thick smoke fits incomplete combustion of crude petroleum. And the sources&#x27; list of extinguishers, sand, strong vinegar and old urine, fits a burning oil that water scatters but a smothering or wetting agent might suppress.</p><p>Resin is the best candidate for the &#x27;prepared&#x27; part. Adding pine resin to oil raises its viscosity, helping it cling to a hull and burn longer. It is chemistry any Byzantine workshop could manage. But no text states it outright, and we should say so plainly.</p><p>There is one more practical clue. Greek fire needed a steady, reliable supply. Crude oil seeps around the Black Sea and Caucasus were far from Constantinople, reached through trade and diplomacy with peoples such as the Khazars. If the fuel was a particular light crude from a few specific places, then the weapon was only as secure as those routes, a point that becomes important at the end of the story.</p></section><section class="wsec" id="greek-fire-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>A secret too well kept</h3><p>The Byzantines treated the fire as a state secret, perhaps the most successful one in medieval history. In the mid-10th century Emperor Constantine VII told his son that the preparation of the liquid fire must never be handed to any foreign people, whatever they asked. He wrapped the rule in a sacred origin story: the recipe, he wrote, had been revealed from heaven to Constantine the Great, the empire&#x27;s founder, and anyone who betrayed it would be struck down. He even told of an official who had been bribed into giving some away and was consumed by fire from the sky as he entered a church.</p><p>Historians such as Alex Roland have argued that the Byzantines protected the secret by splitting it. One group of specialists knew how to prepare the fuel, another built and serviced the siphons, and ships&#x27; crews learned only to operate them. Nobody outside the inner circle held the whole system.</p><p>The secrecy seems to have been strategic as well as practical. Enemies did capture Byzantine equipment from time to time. According to Theophanes, the Bulgar khan Krum seized a stock of the fire and its siphons in 812 but could not use them. If true, it suggests that the hardware alone was useless without the prepared fuel and the knowledge of how to handle it.</p><p>That strategy worked for centuries, and then it failed from the inside. After the late 11th century, references to ship-mounted siphons become rare. When crusaders stormed Constantinople in 1204, the defenders used improvised fire ships, but no chronicle describes the famous siphons. Haldon suggests that loss of access to Caucasus oil, as Byzantine influence around the Black Sea shrank, may have undermined the whole supply chain. Other explanations include the collapse of the navy itself and the death of the few specialists who knew the process.</p><aside class="wcall"><b>Fresh from the field</b><p>Popular interest keeps renewing the debate: in July 2026 historians Michael Charles and Eva Anagnostou-Laoutides reviewed the evidence for a general audience, again favouring a crude-oil and resin mixture delivered by a pressurised siphon. No new physical evidence, such as an excavated siphon or chemically analysed residue, has yet been found.</p></aside></section><section class="wsec" id="greek-fire-s8"><h3 class="wsec-h"><span class="wsec-n">08</span>What is still unknown</h3><p>Greek fire earns a high mystery rating because the core questions remain open. We do not have the recipe. We do not know whether the oil was distilled, whether resin, sulphur or other substances were added, or in what proportions. We do not know the siphon&#x27;s exact layout, the operating pressure, or how often it was actually decisive rather than simply terrifying. And some of its most famous victories, like the first siege, are themselves under historical review.</p><p>Other powers eventually built their own incendiary weapons. Arab armies fielded specialist naphtha troops, and fire pots and burning arrows became common across the medieval Mediterranean. But none of them seems to have matched the Byzantine combination of a pumped liquid jet mounted on a fast warship.</p><p>Archaeology might still help. Small ceramic containers, often called &#x27;grenades&#x27;, are found across the medieval Mediterranean and Near East, and some may have carried incendiary liquids. Chemical analysis of residues inside such vessels, and of any bronze fittings from Byzantine wrecks such as those excavated at Yenikapı in Istanbul, is the kind of evidence that could one day move the debate from texts to tangible remains.</p><blockquote class="wpull"><p>It was less a miracle substance than a system: oil, bronze, a pump, a ship and a guarded body of know-how.</p></blockquote><p>The strongest evidence points to a petroleum-based liquid projected by a heated, pressurised siphon, a hypothesis that has now been built and fired. The rest remains uncertain, and perhaps it always will, unless a wreck on the floor of the Sea of Marmara one day gives up a corroded bronze tube.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">672 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Kallinikos flees to Constantinople with his &#x27;sea fire&#x27;</span></li><li class="wtl-use" style="--i:1"><span class="wtl-y">677 CE</span><span class="wtl-k">In use</span><span class="wtl-t">Fire ships repel the Arab fleet (traditional dating 674–678, now debated)</span></li><li class="wtl-use" style="--i:2"><span class="wtl-y">718 CE</span><span class="wtl-k">In use</span><span class="wtl-t">Fire destroys ships of the second Arab siege, 717–718</span></li><li class="wtl-use" style="--i:3"><span class="wtl-y">822 CE</span><span class="wtl-k">In use</span><span class="wtl-t">Used against the rebel Thomas the Slav</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">905 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Leo VI&#x27;s Taktika describes the bronze-clad siphon in the prow</span></li><li class="wtl-use" style="--i:5"><span class="wtl-y">941 CE</span><span class="wtl-k">In use</span><span class="wtl-t">Rus&#x27; fleet of Igor burned off the Bosporus</span></li><li class="wtl-event" style="--i:6"><span class="wtl-y">950 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Constantine VII orders the secret never be shared</span></li><li class="wtl-use" style="--i:7"><span class="wtl-y">1099 CE</span><span class="wtl-k">In use</span><span class="wtl-t">Lion-headed siphons used against a Pisan fleet (Anna Komnene)</span></li><li class="wtl-loss" style="--i:8"><span class="wtl-y">1204 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Constantinople falls to the Fourth Crusade; no Greek fire recorded</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">1977 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Haldon and Byrne propose the heated, pressurised siphon</span></li><li class="wtl-study" style="--i:10"><span class="wtl-y">2002 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Working reconstruction throws a jet of fire about 15 m</span></li></ol><figure class="wbars"><h4 class="wx-title">Crews of Byzantine warships in the 10th century</h4><div class="wb-r" style="--w:100.0%;--i:0"><div class="wb-l">Heavy dromon<small>230 rowers + 70 marines</small></div><div class="wb-t"><i></i><span>300 men</span></div></div><div class="wb-r" style="--w:53.3%;--i:1"><div class="wb-l">Chelandion pamphylon (upper)<small>range 120–160</small></div><div class="wb-t"><i></i><span>160 men</span></div></div><div class="wb-r" style="--w:36.0%;--i:2"><div class="wb-l">Chelandion ousiakon</div><div class="wb-t"><i></i><span>108 men</span></div></div><div class="wb-r" style="--w:20.0%;--i:3"><div class="wb-l">Galea / monērēs<small>approximate</small></div><div class="wb-t"><i></i><span>60 men</span></div></div><figcaption>Source: Constantine VII, De ceremoniis (expedition lists of 911 and 949), as analysed by Pryor and Jeffreys 2006</figcaption></figure><h3 class="sub-h wsub">The big debates</h3><div class="debate"><p class="debate-q">Was Greek fire based on petroleum?</p><div class="sides"><div class="side"><b>Yes, crude oil with additives</b><span>Fire floating on water, heavy smoke, named oil sources around the Black Sea in De administrando imperio, and a successful 2002 reconstruction using light crude oil.</span></div><div class="side"><b>Other key ingredients</b><span>Earlier writers proposed quicklime or saltpetre; later medieval recipes add sulphur and resins, and no Byzantine recipe confirms petroleum explicitly.</span></div></div><p class="debate-why"><b>The bold claim:</b> Greek fire was a petroleum-based liquid, probably light crude oil perhaps thickened with resins.</p><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Several independent lines of evidence point the same way: descriptions of the fire&#x27;s behaviour, Byzantine interest in specific oil-bearing regions, the known chemistry of alternatives, and an experiment that reproduces the described effects. The exact recipe is still missing, so this is strong support for the base fuel, not a full solution.</p></div><div class="debate"><p class="debate-q">Did the siphon heat and pressurise the liquid?</p><div class="sides"><div class="side"><b>Heated pressure siphon</b><span>References to cauldrons, braziers and bronze tubes; Roman force-pump technology; the working 2002 model.</span></div><div class="side"><b>Other designs possible</b><span>No siphon has been excavated; the texts are brief and could fit a simpler pump without heating, or different arrangements of tank and nozzle.</span></div></div><p class="debate-why"><b>The bold claim:</b> Byzantine ships used a heated, pump-pressurised bronze siphon with a lit nozzle.</p><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The design fits the texts and has been shown to work with technology the Byzantines possessed. But it is reconstructed from a handful of short passages, and other layouts could also satisfy them. Until a siphon or a detailed technical text is found, it remains a well-tested hypothesis.</p></div><div class="debate"><p class="debate-q">Was Greek fire an early form of gunpowder?</p><div class="sides"><div class="side"><b>Yes</b><span>Some 19th and 20th-century writers linked &#x27;fire that roars&#x27; to saltpetre mixtures.</span></div><div class="side"><b>No</b><span>Saltpetre-based mixtures are not documented in the Mediterranean before the 13th century, and the sources describe a projected burning liquid, not explosions.</span></div></div><p class="debate-why"><b>The bold claim:</b> Greek fire contained saltpetre and was a precursor of gunpowder.</p><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The chronology does not work: Greek fire appears in the 670s, centuries before saltpetre mixtures are attested in the region, and its described behaviour is that of a burning liquid jet. Partington&#x27;s classic study and later work by Haldon both reject the gunpowder identification.</p></div><details class="srcs"><summary>Sources for this deep dive (12)</summary><ol><li>Haldon, J. &amp; Byrne, M. (1977). A possible solution to the problem of Greek fire. Byzantinische Zeitschrift 70(1): 91–100. <a href="https://doi.org/10.1515/byzs.1977.70.1.91" target="_blank" rel="noopener">doi:10.1515/byzs.1977.70.1.91</a></li><li>Haldon, J. (2006). &#x27;Greek fire&#x27; revisited: recent and current research. In E. Jeffreys (ed.), Byzantine Style, Religion and Civilization: In Honour of Sir Steven Runciman. Cambridge University Press, 290–325.</li><li>Pryor, J. H. &amp; Jeffreys, E. M. (2006). The Age of the Dromōn: The Byzantine Navy ca 500–1204. Brill, Leiden.</li><li>Partington, J. R. (1960). A History of Greek Fire and Gunpowder. Heffer, Cambridge (reprinted Johns Hopkins University Press, 1999).</li><li>Roland, A. (1992). Secrecy, technology, and war: Greek fire and the defense of Byzantium, 678–1204. Technology and Culture 33(4): 655–679. <a href="https://doi.org/10.2307/3106585" target="_blank" rel="noopener">doi:10.2307/3106585</a></li><li>Theophanes the Confessor. The Chronicle of Theophanes: Anni mundi 6095–6305 (A.D. 602–813), trans. H. Turtledove (1982). University of Pennsylvania Press.</li><li>Theophanes the Confessor. The Chronicle of Theophanes Confessor, trans. C. Mango &amp; R. Scott (1997). Clarendon Press, Oxford.</li><li>Anna Komnene. The Alexiad, trans. E. A. S. Dawes (1928). Kegan Paul, London.</li><li>Leo VI. The Taktika of Leo VI, ed. and trans. G. T. Dennis (2010). Dumbarton Oaks Texts 12, Washington DC.</li><li>Constantine Porphyrogenitus. De administrando imperio, ed. Gy. Moravcsik, trans. R. J. H. Jenkins (1967). Dumbarton Oaks, Washington DC.</li><li>Jankowiak, M. (2013). The first Arab siege of Constantinople. Travaux et Mémoires 17: 237–320.</li><li>Charles, M. B. &amp; Anagnostou-Laoutides, E. (2026). Greek fire was the most devastating weapon in the Eastern Roman empire. But what was it? The Conversation, 20 July 2026.</li></ol></details><aside class="rc-cite" data-v="marvels" data-id="marvel-greek-fire" data-t="Greek fire"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Greek fire</i>. <span class="cite-u">https://residualcontinuum.com/#marvels/marvel-greek-fire</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="marvel-baghdad-battery-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Ironie pile Bagdad.jpg" data-cap="A replica of the so-called Baghdad battery" data-big><figcaption></figcaption></figure><div class="sh-k">Khujut Rabu, near Baghdad, Iraq</div><h2 class="sh-t" id="marvel-baghdad-battery-st" tabindex="-1">The &#x27;Baghdad battery&#x27;</h2><p class="sh-s">A palm-sized clay jar with a copper tube and an iron rod inside: ancient battery, or something far stranger and more human?</p><div class="sh-v"><span class="vstamp vstamp--mys">Mystery <span class="pips" role="img" aria-label="Mystery level 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span></span></div></div><div class="wquick"><h3 class="sub-h">The quick read</h3><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="14" >14</b><span class="ctr-u"> cm</span></div><div class="ctr-l">height of the clay jar</div><div class="ctr-c">König 1938, as summarised in later literature</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="9" >9</b><span class="ctr-u"> cm</span></div><div class="ctr-l">length of the rolled copper cylinder</div><div class="ctr-c">König 1938</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="0.78" data-dec="2">0.78</b><span class="ctr-u"> V</span></div><div class="ctr-l">ideal voltage of a copper–iron cell from standard electrode potentials</div><div class="ctr-c">standard electrochemistry tables</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="4.3" data-dec="1">4.3</b><span class="ctr-u"> V</span></div><div class="ctr-l">from ten replica jars wired in series on MythBusters</div><div class="ctr-c">MythBusters, 2005</div></div><div class="ctr"><div class="ctr-v">up to <b class="ctr-n" data-v="1.4" data-dec="1">1.4</b><span class="ctr-u"> V</span></div><div class="ctr-l">best result from Alexander Bazes&#x27;s 2026 reconstruction</div><div class="ctr-c">Bazes 2026</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="0" >0</b><span class="ctr-u"> wires</span></div><div class="ctr-l">wires, conductors or electrical devices found with any such jar</div><div class="ctr-c">Keyser 1993; Hafford, quoted by History.com 2026</div></div></div><div class="stats"><div><b>c. 14 cm (reports range from 13 to 15 cm)</b><span>Jar height</span></div><div><b>c. 8 cm at its widest</b><span>Jar width</span></div><div><b>c. 9 cm long, c. 2.6 cm across</b><span>Copper cylinder</span></div><div><b>heavily corroded, projecting c. 1 cm above an asphalt (bitumen) stopper</b><span>Iron rod</span></div><div><b>1936, Khujut Rabu; described by Wilhelm König in 1938</b><span>Found</span></div><div><b>roughly 0.5–2 V per jar, depending on the electrolyte</b><span>Replica voltage</span></div><div><b>none</b><span>Wires or electrical devices found with it</span></div><div><b>unknown; missing after the looting of the Iraq Museum</b><span>Whereabouts since 2003</span></div></div><p>The object is a small unglazed clay jar. Inside stood a sheet of copper rolled into a tube about 9 cm long, closed at the bottom with a copper disc and held in place with bitumen. An iron rod hung inside the tube, fixed by a bitumen stopper, with its top poking out. Filled with an acid such as vinegar, the same arrangement makes a weak galvanic cell, which is why Wilhelm König suggested in 1938 that it was a battery, perhaps for gilding. Very similar jars from nearby Seleucia and Ctesiphon contained bronze tubes with remains of rolled organic material, such as papyrus, which points many archaeologists towards a container for written scrolls or a ritual deposit.</p><div class="flip" id="marvel-baghdad-battery-flip"><div class="flip-in"><div class="flip-f"><b>The myth</b><p>The ancient Mesopotamians had electricity: they used batteries like this to electroplate jewellery, light temples or even run lost machines inherited from an advanced civilisation.</p></div><div class="flip-b"><b>The reality</b><p>Any two different metals in an acid make a small voltage, so replicas do work as feeble cells. But no wires, conductors, electrodes, plated objects or texts about electricity have been found anywhere in the ancient Near East, and gilding of the period was done with mercury and heat, not current. Close parallels contained rolled organic material, which fits a container for scrolls or a sealed ritual object. The function remains uncertain; the battery reading lacks supporting evidence.</p></div></div><button type="button" class="flip-btn" aria-pressed="false" onclick="flip('marvel-baghdad-battery-flip',this)">Flip it</button></div><div class="twist"><b>Wow</b><p>The world&#x27;s most famous &#x27;ancient battery&#x27; has been missing since the Iraq Museum was looted in 2003, so every modern experiment rests on old photographs, reports and König&#x27;s drawing.</p></div><div class="wmys"><span>Mystery meter</span><span class="pips" role="img" aria-label="Mystery level 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><small>Real open questions</small></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">10 min read · 2,224 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The &#x27;Baghdad battery&#x27;"><button type="button" class="wtoc-i" data-go="baghdad-battery-s1">A jar that launched a thousand theories</button><button type="button" class="wtoc-i" data-go="baghdad-battery-s2">From a hill near Baghdad to the Iraq Museum</button><button type="button" class="wtoc-i" data-go="baghdad-battery-s3">Cousins from Seleucia and Ctesiphon</button><button type="button" class="wtoc-i" data-go="baghdad-battery-s4">Turning it on: the experiments</button><button type="button" class="wtoc-i" data-go="baghdad-battery-s5">The problem of the missing wires</button><button type="button" class="wtoc-i" data-go="baghdad-battery-s6">Gold without electricity</button><button type="button" class="wtoc-i" data-go="baghdad-battery-s7">Other explanations: medicine, scrolls and ritual</button><button type="button" class="wtoc-i" data-go="baghdad-battery-s8">Lost again, and what remains unknown</button></nav></div><section class="wsec" id="baghdad-battery-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A jar that launched a thousand theories</h3><p>It would fit in your hand. A pale, unglazed clay jar about 14 cm tall, a little bulbous, with a narrow neck. Inside it, a sheet of copper rolled into a tube. Inside the tube, a corroded iron rod, held in place by a plug of black asphalt. That is all. And yet since 1938 this modest object has been called the &#x27;Baghdad battery&#x27;, and it has turned up in school textbooks, museum exhibitions, science television and countless books about lost ancient technologies.</p><p>The reason is simple and genuinely intriguing. Copper and iron in an acid really do make electricity. Pour vinegar into a replica and a voltmeter twitches. So the question is not whether this arrangement can make a current. It can. The question is whether anyone, two thousand years ago, ever used it to do so.</p><p>Part of the jar&#x27;s fame comes from timing. König described it in the late 1930s, when electrification was still transforming daily life and radio was new. The idea that ancient people might have beaten Volta, who built the first battery in 1800, by some two thousand years was irresistible. Over the following decades the jar became a staple of books arguing that ancient people possessed lost high technology, and replicas became a favourite science fair project. It is easy to see why: it is simple, cheap and it really does make a spark of current.</p><p>This article gives the battery idea a fair hearing. It tests the idea against what archaeologists found in the ground, what the object is made of, what ancient craftspeople already knew, and what the jar&#x27;s closest relatives contained.</p><blockquote class="wpull"><p>Any two metals in an acid make a battery. The real question is whether anyone ever plugged anything into this one.</p></blockquote></section><section class="wsec" id="baghdad-battery-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>From a hill near Baghdad to the Iraq Museum</h3><p>The jar came from Khujut Rabu, a low mound near Baghdad not far from Ctesiphon, the great capital of the Parthian and then the Sasanian empires. It was found in 1936 during work at the site and entered the Iraq Museum. There it caught the eye of Wilhelm König, an Austrian working at the museum in the 1930s (sources describe him variously as an assistant and as head of its laboratory), who had a painter&#x27;s training and a keen interest in ancient crafts.</p><p>Picture the setting. Ctesiphon and its twin city Seleucia, on opposite banks of the Tigris, were among the largest cities of the ancient world, crowded with merchants, officials, artisans and scholars speaking Aramaic, Greek and Persian. Workshops produced glazed pottery, glass, textiles and silver vessels. Several religious communities lived side by side, and many households used written charms and inscribed objects for protection. A small sealed jar with a metal tube inside would not have been out of place in that world, whatever it was for.</p><p>In 1938 König published a short article in the German journal Forschungen und Fortschritte with a cautious question for a title: Ein galvanisches Element aus der Partherzeit?, &#x27;A galvanic cell from the Parthian period?&#x27;. He described the jar, the copper cylinder and the rod, and noticed that the iron was badly corroded, as if by an acid. He had seen silver objects from ancient Iraq with extremely thin gold layers, and he wondered whether jars like this, filled with an acidic liquid, had supplied current to gild them.</p><figure class="wx wx--static" id="baghdad-battery-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Inside the jar: an exploded cutaway</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Inside the jar: an exploded cutaway"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" class="wx-svg" role="img" aria-labelledby="baghdad-battery-f1-t"><title id="baghdad-battery-f1-t">Inside the Baghdad jar: an exploded cutaway to scale</title><text x="20" y="24" class="wx-t-cap">Drawn to scale from published dimensions · arrangement after König 1938</text><path d="M200,440 L214.5,433.8 L217.8,427.5 L220.8,421.2 L223.6,415 L226.1,408.8 L228.5,402.5 L230.8,396.2 L233,390 L235,383.8 L236.9,377.5 L238.7,371.2 L240.3,365 L241.8,358.8 L243.2,352.5 L244.5,346.2 L245.7,340 L246.7,333.8 L247.5,327.5 L248.3,321.2 L248.9,315 L249.4,308.8 L249.7,302.5 L249.9,296.2 L250,290 L249.9,283.8 L249.7,277.5 L249.2,271.2 L248.6,265 L247.9,258.8 L246.9,252.5 "wx-thin"/><text x="284" y="85" class="wx-t-b wx-halo">iron rod</text><path d="M180.5,122.5 L280,132" class="wx-thin"/><text x="284" y="136" class="wx-t-b wx-halo">bitumen stopper</text><path d="M182.5,285 L274,285" class="wx-thin"/><text x="278" y="289" class="wx-t-b wx-halo">copper cylinder</text><path d="M182.5,341 L250,371" class="wx-thin"/><text x="254" y="375" class="wx-t-b wx-halo">bitumen, base disc</text></svg></div></div><figcaption>The Khujut Rabu jar in section with its parts pulled apart, drawn to scale from published dimensions. A modern AA cell is shown for size. <span class="wx-src">Based on: Dimensions after König 1938 as summarised in later literature (jar c. 14 cm by 8 cm; cylinder c. 9 by 2.6 cm; rod projecting c. 1 cm). Exact profile of the jar approximate. AA cell 50.5 by 14.5 mm (IEC R6).</span></figcaption><p class="vh">On the left, a cutaway of a bulbous clay jar about 14 centimetres tall and 8 centimetres wide, with a copper cylinder standing inside it. On the right, the parts are shown pulled apart in a vertical column: an asphalt stopper, a corroded iron rod, the rolled copper cylinder about 9 centimetres long and 2.6 centimetres wide, and the copper disc that closed its base, set in bitumen. Dimension lines give the heights and widths, a 5 centimetre scale bar sits below, and a modern AA battery is drawn at the same scale for comparison.</p></figure><p>The dating is itself uncertain. König placed the jar in the Parthian period, roughly 250 BCE to 224 CE. Many later specialists think a Sasanian date, between 224 and 651 CE, is more likely, based on comparisons with similar finds. Without the original excavation records being fully published, a firm date is hard to pin down.</p></section><section class="wsec" id="baghdad-battery-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Cousins from Seleucia and Ctesiphon</h3><p>The Khujut Rabu jar is not alone, and its relatives matter more than it does. In 1930, excavators from the University of Michigan working under Leroy Waterman at Seleucia on the Tigris found several clay vessels sealed with bitumen that contained bronze or copper cylinders. Inside some of those cylinders were traces of rolled organic material, described as papyrus.</p><p>At Ctesiphon, a German expedition in 1931–1932 found further vessels. According to reports of these finds, one contained a number of bronze tubes, each holding decayed rolled material, and others held iron nails, bronze pieces and lead sheets. The excavator Ernst Kühnel interpreted similar objects as containers for written charms or blessings.</p><p>This is a crucial clue. If jars built the same way sometimes contained rolled scrolls, the simplest reading is that the Khujut Rabu jar belonged to the same family: a small sealed container for something written, whose contents rotted away, leaving acids and corrosion that look, to a modern eye, like the residue of an electrolyte.</p><p>Rolling a text and sealing it in a metal tube was a widespread habit in the ancient world. Across the Roman Empire and the Near East, people wore thin sheets of gold, silver or lead inscribed with protective words, rolled tight and slipped into small metal capsules. Archaeologists find these amulet cases in graves and houses from Britain to Syria. Seen against that background, a copper tube holding a rolled text inside a sealed jar looks far less mysterious.</p><aside class="wcall"><b>How do we know?</b><p>Mostly from old excavation reports, a few photographs and König&#x27;s description and drawing. The original jar cannot currently be examined, the Seleucia and Ctesiphon parallels are scattered across collections, and no modern chemical analysis of residues inside the Khujut Rabu cylinder has been published. That limits how confident anyone can be about its use.</p></aside></section><section class="wsec" id="baghdad-battery-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Turning it on: the experiments</h3><p>The battery idea is testable, and people tested it. Around 1940, Willard Gray, an engineer at General Electric in Pittsfield, Massachusetts, built a replica from König&#x27;s description, filled it with a copper sulphate solution and reported that it worked, briefly, as a cell. Later the German Egyptologist Arne Eggebrecht reported using several replicas with grape juice to deposit a thin layer of gold onto a small silver figure, though no written documentation of that experiment was published.</p><p>In 2005 the television programme MythBusters built ten replica jars, filled them with lemon juice and wired them in series. Together they produced a little over 4 V, around half a volt per jar. Most recently, in January 2026, independent researcher Alexander Bazes published a reconstruction in the journal Sino-Platonic Papers arguing that the jar may have worked as two cells at once, reaching about 1.4 V, comparable to an AA battery.</p><figure class="wx wx--steps" id="baghdad-battery-f2" data-n="4"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">Two hypotheses, step by step</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Two hypotheses, step by step"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" class="wx-svg" role="img" aria-labelledby="baghdad-battery-f2-t"><title id="baghdad-battery-f2-t">The Baghdad jar read two ways: battery or container</title><defs><marker id="baghdad-battery-f2-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" class="wx-line"/></marker></defs><text x="180" y="30" class="wx-t-h" text-anchor="middle">Battery reading</text><text x="540" y="30" class="wx-t-h" text-anchor="middle">Container reading</text><path d="M360,14 L360,540" class="wx-guide"/><g class="wx-st" data-s="1"><path d="M210,320 L218.7,316.2 L220.7,312.5 L222.5,308.8 L224.1,305 L225.7,301.2 L227.1,297.5 L228.5,293.8 L229 paper wx-edge-soft"/><path d="M548.5,146 L548.5,242 M571.5,146 L571.5,242" class="wx-thin"/><text x="666" y="170" class="wx-t-b" text-anchor="middle">written</text><text x="666" y="185" class="wx-t-b" text-anchor="middle">scroll</text><g></g></g><g class="wx-st" data-s="3"><path d="M525.5,120 Q560,106 594.5,120 L591.5,132 L528.5,132 Z" class="wx-stone3 wx-edge"/><path d="M521.5,124 L480,130" class="wx-thin"/><text x="476" y="126" class="wx-t-b" text-anchor="end">sealed with</text><text x="476" y="141" class="wx-t-b" text-anchor="end">bitumen</text></g><g class="wx-st" data-s="4"><circle cx="563.1" cy="233.2" r="2.7" class="wx-stone3"/><circle cx="571.1" cy="233.1" r="2.9" class="wx-stone3"/><circle cx="548.2" cy="214.1" r="2.9" class="wx-stone3"/><circle cx="563.7" cy="244.2" r="1.6" class="wx-stone3"/><circle cx="559.2" cy="199" r="2.3" class="wx-stone3"/><circle cx="561.8" cy="182.9" r="1.7" class="wx-stone3"/><circle cx="554.5" cy="245.2" r="2.6" class="wx-stone3"/><circle cx="551.5" cy="237" r="1.6" class="wx-stone3"/><circle cx="562.9" cy="190.7" r="1.4" class="wx-stone3"/><circle cx="569.3" cy="196.5" r="1.7" class="wx-stone3"/><circle cx="572.1" cy="242.2" r="1.9" class="wx-stone3"/><circle cx="571.5" cy="219.2" r="2.5" class="wx-stone3"/><circle cx="552.6" cy="246.9" r="2.5" class="wx-stone3"/><circle cx="571.7" cy="243.7" r="1.9" class="wx-stone3"/><circle cx="556.5" cy="193.5" r="1.6" class="wx-stone3"/><circle cx="549.1" cy="202.8" r="2.4" class="wx-stone3"/><rect x="557" y="137" width="6" height="102" rx="2" class="wx-c1 wx-o80"/><path d="M538.5,212 L490,242" class="wx-thin"/><text x="486" y="246" class="wx-t-b" text-anchor="end">fibres decay,</text><text x="486" y="261" class="wx-t-m" text-anchor="end">acids rust the iron</text></g><g class="wx-st" data-s="1"><g><circle class="wx-num" cx="190" cy="368" r="9"/><text x="190" y="371.8" class="wx-numt" text-anchor="middle">1</text></g><text x="206" y="372" class="wx-t-b">Same object: clay jar, copper tube, iron rod, bitumen</text></g><g class="wx-st" data-s="2"><g><circle class="wx-num" cx="30" cy="396" r="9"/><text x="30" y="399.8" class="wx-numt" text-anchor="middle">2</text></g><text x="46" y="400" class="wx-t">Add an acid electrolyte</text></g><g class="wx-st" data-s="3"><g><circle class="wx-num" cx="30" cy="432" r="9"/><text x="30" y="435.8" class="wx-numt" text-anchor="middle">3</text></g><text x="46" y="436" class="wx-t">A weak cell: c. 0.5–2 V, milliamps</text></g><g class="wx-st" data-s="4"><g><circle class="wx-num" cx="30" cy="468" r="9"/><text x="30" y="471.8" class="wx-numt" text-anchor="middle">4</text></g><text x="46" y="472" class="wx-t">Connect it to what? No wires, plated</text><text x="46" y="488" class="wx-t">objects or devices have ever been found</text></g><g class="wx-st" data-s="2"><g><circle class="wx-num" cx="390" cy="396" r="9"/><text x="390" y="399.8" class="wx-numt" text-anchor="middle">2</text></g><text x="406" y="400" class="wx-t">Roll a text, slide it into the tube</text></g><g class="wx-st" data-s="3"><g><circle class="wx-num" cx="390" cy="432" r="9"/><text x="390" y="435.8" class="wx-numt" text-anchor="middle">3</text></g><text x="406" y="436" class="wx-t">Seal the tube with bitumen</text></g><g class="wx-st" data-s="4"><g><circle class="wx-num" cx="390" cy="468" r="9"/><text x="390" y="471.8" class="wx-numt" text-anchor="middle">4</text></g><text x="406" y="472" class="wx-t">Over centuries: decay and corrosion,</text><text x="406" y="488" class="wx-t">as in jars from Seleucia and Ctesiphon</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 4.</b> One object: a clay jar with a copper tube and an iron rod, sealed with bitumen.</p><ol class="wx-steplist"><li>One object: a clay jar with a copper tube and an iron rod, sealed with bitumen.</li><li>Battery reading: pour in an acid such as vinegar. Container reading: roll a written scroll and slide it into the copper tube.</li><li>Battery: a meter would read about 0.5–2 V. Container: the tube is sealed with bitumen and the jar closed.</li><li>Battery: but connect it to what? No wires, plated objects or devices have been found. Container: the scroll decays, acids corrode the iron, as seen in the parallels.</li></ol><figcaption>The same object read two ways. The battery reading needs things that have never been found; the container reading matches the parallels from Seleucia and Ctesiphon. <span class="wx-src">Based on: König 1938; Keyser 1993; replica voltages from MythBusters 2005 and Bazes 2026; container parallels from Seleucia (Waterman excavations, 1930) and Ctesiphon (1931–1932).</span></figcaption><p class="vh">Two columns share one jar drawing. Left column, battery hypothesis: acid such as vinegar is poured in; a voltmeter reads about 0.5 to 2 volts; but there is nothing to connect it to, shown by an empty dashed box labelled no wires, no device found. Right column, container hypothesis: a written scroll is rolled and slid into the copper tube; the tube is sealed with bitumen; over centuries the organic scroll decays and acids corrode the iron rod, leaving the residues seen today.</p></figure><p>How does such a cell work? Iron gives up electrons more readily than copper. In an acid, iron atoms at the rod&#x27;s surface dissolve as ions, leaving electrons behind in the metal. If a wire links the iron to the copper, those electrons flow through the wire to the copper, where they are consumed by reactions in the liquid, typically producing hydrogen. The flow is an electric current. Without a wire outside the jar, the same reactions still happen, but they simply corrode the iron, with no useful current anywhere.</p><p>So the physics is not in doubt. A copper–iron couple in an acid produces, in theory, about 0.78 V, and real replicas give roughly 0.5–2 V depending on the liquid. The currents are tiny, measured in milliamperes, and fade as the iron corrodes. That is enough to tingle a tongue, move a meter or slowly deposit a film of metal. It is not enough to light anything but a modern low-power LED, which did not exist in antiquity.</p><blockquote class="wpull"><p>The experiments settle what the jar could do. They say nothing about what it did do.</p></blockquote></section><section class="wsec" id="baghdad-battery-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The problem of the missing wires</h3><p>Here the battery case runs into trouble. A battery is only useful if you connect it to something. The Khujut Rabu jar has no terminal on the copper cylinder, which was sealed inside the jar with bitumen, an excellent electrical insulator. To draw current you would have to attach a wire to the copper, and nothing on the object shows how that was done.</p><ul class="wlist"><li>No wires or conductors have been found with any of these jars.</li><li>No electroplated objects from ancient Mesopotamia have been identified; thin gold layers of the period match known non-electrical methods.</li><li>No text in Aramaic, Middle Persian, Greek or any other language of the region describes electricity, currents or plating by current.</li><li>Related jars held multiple bronze tubes or organic scrolls, which do not fit a single working cell.</li><li>The iron rod&#x27;s top sits inside a bitumen plug, again awkward for making a connection.</li></ul><p>It is worth being fair here. Ancient smiths could certainly draw copper wire, so the absence of wires is not because they were impossible to make. The point is that none has been found with these jars, in any report, and nothing about the jar&#x27;s construction provides a place to attach one. For a device whose whole purpose would be to deliver current somewhere else, that silence is significant.</p><p>William Hafford, an archaeologist at the Penn Museum, points out that modern replicas tend to follow König&#x27;s drawing, which reconstructed the object as a battery in the first place, so it is no surprise that they behave like batteries. Elizabeth Stone, a specialist in Mesopotamian archaeology, put the field&#x27;s view bluntly to a History.com reporter in 2026: she knew of nobody working in the area who thought it was a real battery.</p></section><section class="wsec" id="baghdad-battery-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Gold without electricity</h3><p>König&#x27;s gilding hypothesis was a sensible idea in 1938, because he had seen very thin gold layers on silver objects. But ancient craftspeople had excellent ways to gild without current. The most important was fire-gilding, also called mercury gilding. Gold is dissolved in mercury to make a paste, the paste is brushed onto a metal surface, and the object is heated so that the mercury evaporates, leaving a thin, firmly bonded layer of gold.</p><p>According to conservation scientist Katharina Anheuser, fire-gilding was used in China from about 300 BCE and in Europe from about 200 CE, and it remained the main gilding method until electroplating arrived in the 19th century. Sasanian silversmiths were masters of it: many of their famous silver plates carry scenes picked out with mercury gilding. Thin gold leaf, applied with adhesives or by burnishing, was even older. None of this needs a battery, and the physical traces left by fire-gilding, such as residual mercury, are recognisable in laboratory analysis.</p><p>Other techniques were available too. Craftspeople in several regions practised depletion gilding, treating a gold alloy so that the base metals at the surface were removed, leaving a gold-rich skin. Gold leaf could be beaten thinner than a micrometre and burnished onto a surface. Laboratory study of ancient gilded objects routinely identifies which method was used, and electroplating is not among the methods found on objects from antiquity.</p><p>In other words, the problem König was trying to solve already had a well-documented solution. That does not make his question foolish. It makes the battery answer unnecessary.</p></section><section class="wsec" id="baghdad-battery-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>Other explanations: medicine, scrolls and ritual</h3><p>If not for gilding, could a small current have had some other use? In 1993 the classicist Paul Keyser suggested, in the Journal of Near Eastern Studies, that such cells might have been used for mild electrical pain relief, much as Greek and Roman doctors applied electric fish to patients with headaches or gout. It is a creative idea, and the electric-fish practice is well documented in ancient medical writers, but there is no evidence that anyone used jars this way.</p><p>The explanation favoured by many archaeologists is more modest. The jar was a small container, perhaps for a written scroll, sealed with bitumen, whose organic contents decayed into acids that corroded the iron. Hafford goes further, reading jars of this type as ritual deposits: the iron rod as a nail, the copper tube as a sealed case for a protective text, the whole object buried for its symbolic power rather than any practical function. Protective inscriptions were common in the region in this period, most famously on clay incantation bowls buried under houses.</p><p>Bazes, interestingly, bridges the two camps. His 2026 paper takes the electrochemistry seriously but proposes that any current was a side effect with a ritual meaning, visibly corroding the metal and perhaps the written prayer sealed inside, rather than a power supply for a device.</p><p>Each explanation makes predictions that could be checked. If the jar held an electrolyte, residues of acetic acid or wine and a particular pattern of copper and iron corrosion products should survive. If it held a scroll, fibres, ink traces or impressions of a rolled sheet might remain inside the cylinder. If it was a ritual deposit, its findspot should resemble those of other buried protective objects, such as under a floor or at a threshold. Frustratingly, the published record of the 1936 find is too thin to say which of these fits, and the object itself is not available to test.</p><blockquote class="wpull"><p>The most human explanation may also be the most likely: a sealed prayer in a jar, not a power pack.</p></blockquote></section><section class="wsec" id="baghdad-battery-s8"><h3 class="wsec-h"><span class="wsec-n">08</span>Lost again, and what remains unknown</h3><p>In April 2003, during the invasion of Iraq, the Iraq Museum in Baghdad was looted and thousands of objects were taken. The Khujut Rabu jar is reported to have disappeared at that time, and its current whereabouts are unknown. Many objects have since been recovered and returned, but we could find no verified report that this one has been among them.</p><p>That loss is painful for science as well as for Iraq&#x27;s heritage. Modern techniques could analyse residues in the copper cylinder, identify whether the corrosion products came from vinegar, wine, organic decay or something else, and look for traces of written material. Until the jar is found, or a parallel from Seleucia or Ctesiphon is analysed with the same care, key questions stay open.</p><ul class="wlist"><li>When exactly was it made, Parthian or Sasanian?</li><li>What liquid, if any, did it hold?</li><li>Were the parallel jars&#x27; tubes all scroll holders, or did they vary?</li><li>Is the iron rod a structural pin, a ritual nail or an electrode?</li></ul><p>The honest verdict is that the jar&#x27;s function is uncertain, the scroll or ritual container reading fits the evidence best, and the battery hypothesis, however fun, has no supporting archaeological evidence. It remains a wonderful classroom demonstration and a reminder to ask not only whether something could work, but whether anyone ever used it that way.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">250 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Parthian period begins in Mesopotamia (earliest proposed date)</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">224 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Sasanian period begins; many now favour this date for the jars</span></li><li class="wtl-find" style="--i:2"><span class="wtl-y">1930 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Similar jars with bronze tubes excavated at Seleucia</span></li><li class="wtl-find" style="--i:3"><span class="wtl-y">1936 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Jar found at Khujut Rabu</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">1938 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Wilhelm König proposes a galvanic cell</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1940 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Willard Gray&#x27;s replica with copper sulphate works briefly</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">1993 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Paul Keyser suggests mild electrical pain relief</span></li><li class="wtl-loss" style="--i:7"><span class="wtl-y">2003 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Iraq Museum looted; the jar disappears</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2005 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">MythBusters: ten replicas make about 4.3 V</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">2026 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Bazes publishes a two-cell reconstruction; ritual explanations gain attention</span></li></ol><figure class="wbars"><h4 class="wx-title">How much voltage? Replicas compared with a modern cell</h4><div class="wb-r" style="--w:11.6%;--i:0"><div class="wb-l">One replica jar (MythBusters, lemon juice)<small>approximate</small></div><div class="wb-t"><i></i><span>0.5 V</span></div></div><div class="wb-r" style="--w:18.1%;--i:1"><div class="wb-l">Ideal copper–iron cell<small>standard potentials</small></div><div class="wb-t"><i></i><span>0.78 V</span></div></div><div class="wb-r" style="--w:32.6%;--i:2"><div class="wb-l">Bazes 2026 reconstruction<small>best case</small></div><div class="wb-t"><i></i><span>1.4 V</span></div></div><div class="wb-r" style="--w:34.9%;--i:3"><div class="wb-l">Modern AA cell<small>nominal</small></div><div class="wb-t"><i></i><span>1.5 V</span></div></div><div class="wb-r" style="--w:100.0%;--i:4"><div class="wb-l">Ten replicas in series (MythBusters)</div><div class="wb-t"><i></i><span>4.3 V</span></div></div><figcaption>Source: MythBusters episode 29 (2005), as reported; Bazes 2026 (via Chemistry World and History.com); standard electrode potentials Cu2+/Cu +0.34 V, Fe2+/Fe −0.44 V</figcaption></figure><h3 class="sub-h wsub">The big debates</h3><div class="debate"><p class="debate-q">Was the jar a working battery?</p><div class="sides"><div class="side"><b>Yes</b><span>Replicas produce roughly 0.5–2 V; the iron shows acid corrosion; Bazes (2026) argues for an efficient two-cell design.</span></div><div class="side"><b>No evidence it was used as one</b><span>No wires, terminals, electrical devices or texts; the copper is sealed in insulating bitumen; similar jars held scrolls and multiple tubes.</span></div></div><p class="debate-why"><b>The bold claim:</b> The Khujut Rabu jar was built and used as an electric battery.</p><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">That the arrangement can make a voltage is not in dispute. But there is no archaeological evidence that anyone drew current from it: no conductors, no powered devices, no electroplated objects and no texts. The closest parallels point to containers. Unless the jar or a parallel yields new evidence, the battery reading has no receipts.</p></div><div class="debate"><p class="debate-q">Was it used for electroplating gold or silver?</p><div class="sides"><div class="side"><b>Yes</b><span>König saw very thin gold layers on ancient silver; Eggebrecht reported plating a figure with replicas.</span></div><div class="side"><b>No</b><span>Fire-gilding with mercury was well established and explains thin gold layers; no electroplated ancient object has been identified; Eggebrecht&#x27;s experiment was not documented in print.</span></div></div><p class="debate-why"><b>The bold claim:</b> Ancient Mesopotamian smiths used jars like this to electroplate metal objects.</p><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The gilding König observed has a documented non-electrical explanation, mercury fire-gilding, whose traces are detectable in analysis, and no object from the region has been shown to be electroplated. The one experiment claiming success was never properly published. The claim rests only on possibility.</p></div><div class="debate"><p class="debate-q">Was it a container for a scroll or a ritual deposit?</p><div class="sides"><div class="side"><b>Yes</b><span>Similar jars from Seleucia and Ctesiphon held bronze tubes with rolled organic material; protective texts were common in the period.</span></div><div class="side"><b>Not yet shown for this jar</b><span>No scroll remains have been reported from the Khujut Rabu cylinder itself, and the original cannot now be analysed.</span></div></div><p class="debate-why"><b>The bold claim:</b> The jar was a sealed container for a written scroll, probably with a protective or ritual purpose.</p><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">This reading fits the construction, the bitumen seals and the contents of close parallels without requiring any unknown technology. But direct evidence from the Khujut Rabu jar is missing, its context is poorly published and the object is lost, so the case rests on analogy.</p></div><details class="srcs"><summary>Sources for this deep dive (10)</summary><ol><li>König, W. (1938). Ein galvanisches Element aus der Partherzeit? Forschungen und Fortschritte 14: 8–9.</li><li>Keyser, P. T. (1993). The purpose of the Parthian galvanic cells: a first-century A.D. electric battery used for analgesia. Journal of Near Eastern Studies 52(2): 81–98. <a href="https://doi.org/10.1086/373610" target="_blank" rel="noopener">doi:10.1086/373610</a></li><li>Bazes, A. (2026). The Baghdad Battery. Sino-Platonic Papers 377, University of Pennsylvania (January 2026).</li><li>Chemistry World (2026). Baghdad battery reconstruction shows ancient artefact produced higher voltage than previously found. Royal Society of Chemistry.</li><li>History.com (2026). Could ancient Mesopotamians have built a battery? (interviews with W. B. Hafford and E. Stone).</li><li>Anheuser, K. (1997). The practice and characterization of historic fire gilding techniques. JOM 49: 58–62. <a href="https://doi.org/10.1007/s11837-997-0015-6" target="_blank" rel="noopener">doi:10.1007/s11837-997-0015-6</a></li><li>Waterman, L. (1931). Preliminary Report upon the Excavations at Tel Umar, Iraq. University of Michigan Press, Ann Arbor.</li><li>Harper, P. O. &amp; Meyers, P. (1981). Silver Vessels of the Sasanian Period, Volume 1: Royal Imagery. Metropolitan Museum of Art, New York.</li><li>MythBusters (2005). Baghdad battery segment, episode 29 (March 2005). Discovery Channel.</li><li>Bazes, A. (2026). &#x27;Battery-powered prayers&#x27;, guest post on Language Log, University of Pennsylvania.</li></ol></details><aside class="rc-cite" data-v="marvels" data-id="marvel-baghdad-battery" data-t="The &#x27;Baghdad battery&#x27;"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The &#x27;Baghdad battery&#x27;</i>. <span class="cite-u">https://residualcontinuum.com/#marvels/marvel-baghdad-battery</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="marvel-lycurgus-cup-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Front of 4th century CE Roman Lycurgus Cup, British Museum (1958,1202.1).jpg" data-cap="The Lycurgus Cup" data-big><figcaption></figcaption></figure><div class="sh-k">Late Roman glass</div><h2 class="sh-t" id="marvel-lycurgus-cup-st" tabindex="-1">The Lycurgus Cup</h2><p class="sh-s">A Roman glass cup that glows jade green by day and blood red when lit from within, thanks to specks of gold and silver.</p><div class="sh-v"><span class="vstamp vstamp--mys">Mystery <span class="pips" role="img" aria-label="Mystery level 1 of 5"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></span></span></div></div><div class="wquick"><h3 class="sub-h">The quick read</h3><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="16.5" data-dec="1">16.5</b><span class="ctr-u"> cm</span></div><div class="ctr-l">height with its later metal mounts</div><div class="ctr-c">Freestone et al. 2007; British Museum</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="70" >70</b><span class="ctr-u"> nm</span></div><div class="ctr-l">typical size of the silver-gold particles (range c. 50–100 nm)</div><div class="ctr-c">Barber and Freestone 1990</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="300" >300</b><span class="ctr-u"> ppm silver</span></div><div class="ctr-l">silver in the glass</div><div class="ctr-c">Barber and Freestone 1990; Freestone et al. 2007</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="40" >40</b><span class="ctr-u"> ppm gold</span></div><div class="ctr-l">gold in the glass</div><div class="ctr-c">Barber and Freestone 1990; Freestone et al. 2007</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="700" >700</b><span class="ctr-u"> g</span></div><div class="ctr-l">weight of the cup</div><div class="ctr-c">British Museum collection record</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="100" >100</b><span class="ctr-u"> × more sensitive</span></div><div class="ctr-l">Illinois &#x27;nano Lycurgus cup&#x27; sensor vs commercial sensors, for salt-level changes</div><div class="ctr-c">Gartia, Liu et al. 2013 (as reported)</div></div></div><div class="stats"><div><b>c. 16.5 cm with its later metal mounts (museum catalogue: 15.9 cm)</b><span>Height</span></div><div><b>c. 13.2 cm</b><span>Diameter</span></div><div><b>c. 700 g</b><span>Weight</span></div><div><b>opaque jade green in reflected light; translucent red in transmitted light</b><span>Colour</span></div><div><b>c. 300 ppm silver and c. 40 ppm gold in the glass</b><span>Silver and gold</span></div><div><b>silver-gold alloy nanoparticles, c. 50–100 nm across</b><span>Colour-making particles</span></div><div><b>cage cup: cut and ground from a thick glass blank</b><span>Technique</span></div><div><b>1958, from Lord Rothschild, for £20,000</b><span>Bought by the British Museum</span></div></div><p>The cup is a cage cup, or diatretum. A glassworker first made a thick-walled blank of a special glass that contained tiny amounts of silver and gold. Cutters then spent a very long time grinding most of that wall away with rotating wheels and abrasives, leaving the figures of the myth standing proud of the inner cup and linked to it by small hidden bridges of glass. The colour comes from the metal: during heating, the dissolved silver and gold came together as alloy particles about 50–100 nanometres across. Those particles scatter green light back towards the viewer and let red light pass through, so the glass changes colour depending on where the light comes from.</p><div class="flip" id="marvel-lycurgus-cup-flip"><div class="flip-in"><div class="flip-f"><b>The myth</b><p>The Romans understood nanotechnology and deliberately engineered nanoparticles with modern precision, or the cup was made with a lost chemical secret no one can reproduce.</p></div><div class="flip-b"><b>The reality</b><p>Roman glassmakers clearly knew that adding tiny amounts of precious metal and controlling the heat produced this remarkable glass, and their control of trace amounts was impressive. But they had no concept of particles, electrons or plasmonics; the effect was reached by experiment, recipe and skill. Very few dichroic glasses survive, so how reliably they could repeat it is uncertain. Modern scientists explain the colour with plasmon physics and have borrowed it for sensors and reproductions.</p></div></div><button type="button" class="flip-btn" aria-pressed="false" onclick="flip('marvel-lycurgus-cup-flip',this)">Flip it</button></div><div class="twist"><b>Wow</b><p>The particles that turn the cup red are about a thousand times thinner than a human hair, and there are so few of them that the whole cup contains only a tiny fraction of a gram of gold.</p></div><div class="wmys"><span>Mystery meter</span><span class="pips" role="img" aria-label="Mystery level 1 of 5"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></span><small>Mostly solved</small></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">10 min read · 2,105 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Lycurgus Cup"><button type="button" class="wtoc-i" data-go="lycurgus-cup-s1">A cup that changes its mind</button><button type="button" class="wtoc-i" data-go="lycurgus-cup-s2">A king trapped by a vine</button><button type="button" class="wtoc-i" data-go="lycurgus-cup-s3">How to carve a cage from glass</button><button type="button" class="wtoc-i" data-go="lycurgus-cup-s4">Green by day, red by lamplight</button><button type="button" class="wtoc-i" data-go="lycurgus-cup-s5">Did the Romans do nanotechnology?</button><button type="button" class="wtoc-i" data-go="lycurgus-cup-s6">A 1,600-year-old idea in modern labs</button><button type="button" class="wtoc-i" data-go="lycurgus-cup-s7">From a dealer&#x27;s shop to Room 41</button><button type="button" class="wtoc-i" data-go="lycurgus-cup-s8">What remains uncertain</button></nav></div><section class="wsec" id="lycurgus-cup-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A cup that changes its mind</h3><p>In a gallery of the British Museum stands a glass cup about the size of a large coffee mug. Lit from the front, as most museum objects are, it looks like polished jade: an opaque, slightly milky green, carved with writhing figures. Then someone places a light inside it, and the whole cup turns a deep, glowing red, like wine held up to a candle. Same glass, same cup, two completely different colours.</p><p>This is the Lycurgus Cup, made in the Late Roman Empire in the 4th century CE. It is famous for two separate reasons. The first is craftsmanship: it is one of the finest surviving cage cups, vessels whose decoration was cut free from the body so that it stands away from the surface like a net. The second is physics. Its colour change comes from metal particles only tens of nanometres across, which is why materials scientists sometimes call it the oldest known piece of nanotechnology.</p><p>Picture it, perhaps, on the table of a wealthy household in the 4th century, in a dining room lit by oil lamps. By daylight the cup would have looked like carved green stone. As evening fell and a lamp was set behind it, or wine was poured and the vessel lifted towards the flame, the green would have warmed to amber and then to red. We do not know how its owners used it, or even whether it was meant for drinking at all, since the delicate cage makes it awkward to hold. But it is easy to imagine the gasp around the table.</p><blockquote class="wpull"><p>Two colours from one glass: green where light bounces back, red where light passes through.</p></blockquote><p>Both claims deserve a careful look, because the story of how the cup was made is at least as remarkable as the story of what it does.</p></section><section class="wsec" id="lycurgus-cup-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>A king trapped by a vine</h3><p>The figures on the cup tell a savage myth. Lycurgus, a king of the Edonians in Thrace, attacked the god Dionysus and his followers. The earliest version appears in Homer&#x27;s Iliad, where the hero Diomedes cites Lycurgus as a warning about fighting gods.</p><blockquote class="quote"><p>He it was that drove the nursing women who were in charge of frenzied Bacchus through the land of Nysa, and they flung their thyrsi on the ground as murderous Lycurgus beat them with his oxgoad.</p><cite>Homer, Iliad 6.132–135, trans. Samuel Butler (1898)</cite></blockquote><p>Later versions of the story add the episode shown on the cup. One of Dionysus&#x27;s followers, the nymph Ambrosia, is attacked by Lycurgus and calls for help. She is transformed into a vine, which wraps around the king and holds him fast. On the cup, Lycurgus is caught mid-struggle, almost naked, tangled in the vine&#x27;s branches. Around him the god&#x27;s companions close in: Dionysus himself with his thyrsus, the staff tipped with a pine cone, and his panther; Pan; and a satyr preparing to hurl a rock.</p><p>Why this scene? Wine and Dionysus suit a drinking cup, and the colour change, from green to wine red, may have seemed a delightful echo of the vine and its grapes. Some scholars have also suggested a political meaning, linking the punished king to a defeated ruler of the early 4th century, perhaps the emperor Licinius, defeated by Constantine in 324 CE. That reading is possible but cannot be confirmed.</p></section><section class="wsec" id="lycurgus-cup-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>How to carve a cage from glass</h3><p>Cage cups, known in Latin as diatreta, are among the most difficult objects ancient craftspeople ever made. Only a few dozen are known, most of them fragmentary, and they date mainly to the 3rd and 4th centuries CE. Nearly all have an openwork net of glass rings standing away from an inner bowl. The Lycurgus Cup is unusual because, instead of a net, its &#x27;cage&#x27; is a crowd of figures.</p><figure class="wx wx--static" id="lycurgus-cup-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Anatomy of a cage cup</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Anatomy of a cage cup"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" class="wx-svg" role="img" aria-labelledby="lycurgus-cup-f2-t"><title id="lycurgus-cup-f2-t">Anatomy of a cage cup: size, cutting and nanoparticles</title><text x="20" y="30" class="wx-t-h">The cup</text><text x="20" y="48" class="wx-t-m">front view, to scale</text><path d="M252.4,122.6 L252.6,130.8 L252.8,138.9 L253,147.1 L253.1,155.3 L253.2,163.4 L253.1,171.6 L253,179.8 L252.8,187.9 L252.4,196.1 L251.9,204.3 L251.3,212.4 L250.6,220.6 L249.7,228.8 L248.6,236.9 L247.5,245.1 L246.2,253.3 L244.8,261.4 L243.3,269.6 L241.7,277.8 L240,285.9 L237.5,294.1 L231.2,302.3 L221,310.4 L207.3,318.6 L112.7,318.6 L99,310.4 L88.8,302.3 L82.5,294.1 L80,285.9 L78.3,277.8 L76.7,269.6 L75.2,261.4 L73.8,253.3 L72.5,245.1 L71.4,236 ath d="M548,301 L548,311 M608,301 L608,311" class="wx-line"/><text x="616" y="310" class="wx-t-s">100 nm</text><text x="548" y="340" class="wx-t-b">silver-gold particles</text><text x="548" y="358" class="wx-t-n">c. 70 nm (50–100 nm)</text><text x="548" y="376" class="wx-t-s">c. 300 ppm silver, 40 ppm gold</text><text x="548" y="392" class="wx-t-s">a hair is c. 1,000× thicker</text></svg></div></div><figcaption>Left: the cup&#x27;s height and width, with its later metal mounts. Centre: how a thick blank was cut back to leave figures joined to the inner wall by hidden bridges. Right: the scale of the colour-making particles. <span class="wx-src">Based on: Dimensions: British Museum record 1958,1202.1 and Freestone et al. 2007. Cutting sequence after Harden and Toynbee 1959 and Freestone et al. 2007; wall thicknesses schematic. Particle size: Barber and Freestone 1990.</span></figcaption><p class="vh">On the left, an outline of the Lycurgus Cup about 16.5 centimetres tall including its later metal rim and foot, and 13.2 centimetres wide, with figures in openwork relief and a dimension line for each. In the centre, three small cross-sections of the cup wall: first a thick plain blank, then the outer glass cut away to leave a raised figure, then the figure undercut so it stands free, linked to the inner wall by small glass bridges. On the right, a circular inset shows several round particles in glass with a 100 nanometre scale bar, labelled silver-gold alloy particles about 70 nanometres across.</p></figure><p>The method that most specialists accept is subtractive. A glassworker first blew or cast a thick-walled blank, a plain cup with walls far thicker than the finished object. Cutters then removed glass with rotating wheels fed with abrasives, and with drills and files, working from the outside in. They cut the figures in high relief, then carefully undercut behind them, leaving the figures linked to the inner wall only by small bridges of glass hidden behind limbs and drapery. One slip could crack the blank and waste weeks of work.</p><p>The tools were simple, and that is what makes the result so astonishing. Roman glass cutters used wheels of stone or metal, turned by a bow or a treadle-driven lathe, fed with a slurry of abrasive sand or emery in water. Drills and small files did the finer work. Every curve of the vine, every finger of the satyr, had to be ground out a fraction of a millimetre at a time, with constant checks to avoid cutting through a bridge or cracking the thin inner wall.</p><p>In the 1990s the German glass researcher R. Lierke proposed that cage cups were partly shaped in moulds while the glass was hot, which would reduce the amount of cutting. Her idea sparked useful debate, but most experts have not accepted it for the Lycurgus Cup, whose surfaces show the marks of cutting and polishing, as Ian Freestone and colleagues note.</p><aside class="wcall"><b>How do we know?</b><p>By looking very closely. Tool marks, polished surfaces, the shapes of the hidden bridges and the way the figures join the wall all record how the glass was worked. The gilt-silver mounts on the rim and foot are later additions, and they were temporarily removed during research in 1958, allowing the glass to be studied more fully.</p></aside></section><section class="wsec" id="lycurgus-cup-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Green by day, red by lamplight</h3><p>What causes the colour change? For centuries nobody could say. Harden and Toynbee&#x27;s classic 1959 study described the glass in detail but could not see what was inside it. The answer came in 1990, when David Barber and Ian Freestone examined tiny fragments of the cup under an analytical transmission electron microscope, an instrument that can image and analyse particles far too small for any optical microscope.</p><p>They found scattered particles of a silver-gold alloy, typically about 70 nm across and ranging from roughly 50 to 100 nm, with a little copper. Chemical analysis showed the glass contains only about 300 parts per million of silver and about 40 parts per million of gold. The rest is ordinary Roman soda-lime-silica glass, about 73.5% silica, 13% soda and 6% lime.</p><figure class="wx wx--steps" id="lycurgus-cup-f1" data-n="4"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">Why the colour flips</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Why the colour flips"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" class="wx-svg" role="img" aria-labelledby="lycurgus-cup-f1-t"><title id="lycurgus-cup-f1-t">Why the Lycurgus Cup changes colour</title><defs><marker id="lycurgus-cup-f1-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" class="wx-line"/></marker><marker id="lycurgus-cup-f1-a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" class="wx-line wx-s2"/></marker><marker id="lycurgus-cup-f1-a3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" class="wx-line wx-s3"/></marker><marker id="lycurgus-cup-f1-a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" class="wx-line wx-s4"/></marker></defs><path d="M315,150 L315.9,159.2 L316.7,168.3 L317.5,177.5 L318.2,186.7 L318.7,195.8 L319.2,205 L319.5,214.2 L319.6,223.3 L319.5,232.5 L319.2,241.7 L318.7,250.8 L318,260 L317.1,269.2 L315.9,278.3 L314.5,287.5 L312.9,296.7 L311.1,305.8 L309.2,315 L307.1,324.2 L304.8,333.3 L301.7,342.5 L294.5,351.7 L283.4,360.8 L268.8,370 L171.2,370 L156.6,360.8 L145.5,351.7 L138.3,342.5 L135.2,333.3 L132.9,324.2 L130.8,315 L128.9,305.8 L127.1,296.7 L125.5,287.5 L124.1,278.3 L122.9,269.2 L122,260 L121.3,250.8 L120.8,241.7 L120.5,232.5 L120.4,223.3 L120.5,214.2 L120.8,205 L121.3,195
