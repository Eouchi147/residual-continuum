" rx="10" ry="7" class="wx-inkfill wx-o80"/><line x1="302" y1="58" x2="302" y2="444" class="wx-line wx-s6" style="stroke-width:3"/><polygon points="302,34 308,58 296,58" class="wx-bronze wx-edge"/></g><rect x="30" y="420" width="90" height="6" class="wx-inkfill"/><text x="30" y="442" class="wx-t-s">0</text><text x="120" y="442" class="wx-t-s" text-anchor="middle">0.5 m</text><text x="30" y="380" class="wx-t-m">most figures</text><text x="30" y="394" class="wx-t-m">c. 1.75–2 m</text><text x="30" y="408" class="wx-t-m">tall</text><g class="wx-st wx-hide" data-only="1"><text x="430" y="64" class="wx-t-h">1 · Plinth and legs</text><text x="430" y="88" class="wx-t">A square clay plinth. The legs are</text><text x="430" y="104" class="wx-t">solid clay pillars, strong enough</text><text x="430" y="120" class="wx-t">to carry the hollow body above.</text><circle cx="490" cy="220" r="34" class="wx-rock wx-edge"/><text x="490" y="274" class="wx-t-m" text-anchor="middle">leg: solid</text><circle cx="610" cy="220" r="34" class="wx-rock wx-edge"/><circle cx="610" cy="220" r="26" class="wx-paper wx-edge-soft"/><text x="610" y="274" class="wx-t-m" text-anchor="middle">torso: hollow</text><text x="550" y="296" class="wx-t-s" text-anchor="middle">cross-sections, schematic</text></g><g class="wx-st wx-hide" data-only="2"><text x="430" y="64" class="wx-t-h">2 · A hollow torso</text><text x="430" y="88" class="wx-t">The body is built up from coils or</text><text x="430" y="104" class="wx-t">slabs of clay, like a big storage jar,</text><text x="430" y="120" class="wx-t">then smoothed and carved: armour</text><text x="430" y="136" class="wx-t">plates, belts, robe folds.</text><rect x="480" y="250" width="150" height="15" rx="7.5" class="wx-rock wx-edge"/><rect x="486" y="234" width="150" height="15" rx="7.5" class="wx-rock wx-edge"/><rect x="480" y="218" width="150" height="15" rx="7.5" class="wx-rock wx-edge"/><rect x="486" y="202" width="150" height="15" rx="7.5" class="wx-rock wx-edge"/><rect x="480" y="186" width="150" height="15" rx="7.5" class="wx-rock wx-edge"/><rect x="486" y="170" width="150" height="15" rx="7.5" class="wx-rock wx-edge"/><rect x="480" y="154" width="150" height="15" rx="7.5" class="wx-rock wx-edge"/></g><g class="wx-st wx-hide" data-only="3"><text x="430" y="64" class="wx-t-h">3 · Arms and hands</text><text x="430" y="88" class="wx-t">Arms are made separately and joined</text><text x="430" y="104" class="wx-t">with wet clay; hands, often moulded,</text><text x="430" y="120" class="wx-t">slot into the sleeves. Their poses</text><text x="430" y="136" class="wx-t">match the soldier's weapon.</text><path d="M494,204 Q524,184 566,190 Q606,198 618,236 L604,240 Q594,212 562,206 Q528,202 500,218 Z" class="wx-rock wx-edge"/><ellipse cx="616" cy="250" rx="12" ry="14" class="wx-rock wx-edge"/></g><g class="wx-st wx-hide" data-only="4"><text x="430" y="64" class="wx-t-h">4 · Moulded, then made personal</text><text x="430" y="88" class="wx-t">Heads come from two-part moulds (a</text><text x="430" y="104" class="wx-t">handful of basic types); ears, hair,</text><text x="430" y="120" class="wx-t">moustaches and expressions are</text><text x="430" y="136" class="wx-t">added and modelled by hand.</text><path d="M470,190 A40,48 0 0 1 470,286 Z" class="wx-stone2 wx-edge"/><path d="M466,196 A34,42 0 0 1 466,280 Z" class="wx-paper wx-edge-soft"/><path d="M560,190 A40,48 0 0 0 560,286 Z" class="wx-stone2 wx-edge"/><path d="M564,196 A34,42 0 0 0 564,280 Z" class="wx-paper wx-edge-soft"/><path d="M586,238 L610,238" class="wx-hl" marker-end="url(#terracotta-army-f1-aa)"/><ellipse cx="650" cy="238" rx="28" ry="36" class="wx-rock wx-edge"/><path d="M638,232 L646,232 M654,232 L662,232 M638,248 Q644,252 650,249 Q656,252 662,248 M645,256 L655,256" class="wx-line"/><ellipse cx="620" cy="240" rx="4" ry="8" class="wx-rock wx-edge"/><ellipse cx="680" cy="240" rx="4" ry="8" class="wx-rock wx-edge"/><text x="515" y="310" class="wx-t-m" text-anchor="middle">two-part mould</text><text x="650" y="310" class="wx-t-m" text-anchor="middle">finished face</text></g><g class="wx-st wx-hide" data-only="5"><text x="430" y="64" class="wx-t-h">5 · Firing and a signature</text><text x="430" y="88" class="wx-t">Fired hard at roughly 950–1,050 °C.</text><text x="430" y="104" class="wx-t">Many pieces carry the stamped or</text><text x="430" y="120" class="wx-t">incised name of a workshop foreman:</text><text x="430" y="136" class="wx-t">quality control you can still read.</text><path d="M490,300 L490,236 Q560,170 630,236 L630,300 Z" class="wx-stone2 wx-edge"/><path d="M520,300 L520,256 Q560,222 600,256 L600,300 Z" class="wx-paper wx-edge-soft"/><path d="M536,300 Q544,272 552,300 Z M556,300 Q566,262 576,300 Z M578,300 Q584,280 590,300 Z" class="wx-fire wx-pulse"/><text x="560" y="322" class="wx-t-m" text-anchor="middle">kiln (schematic)</text><line x1="292" y1="322" x2="424" y2="322" class="wx-thin"/><text x="420" y="340" class="wx-t-s" text-anchor="end">name stamp</text></g><g class="wx-st wx-hide" data-only="6"><text x="430" y="64" class="wx-t-h">6 · Lacquer, paint, weapons</text><text x="430" y="88" class="wx-t">Two coats of East Asian lacquer, then</text><text x="430" y="104" class="wx-t">mineral paints. Real bronze weapons</text><text x="430" y="120" class="wx-t">went into the hands.</text><circle cx="442" cy="190" r="9" class="wx-inkfill wx-edge"/><text x="460" y="194" class="wx-t">qi lacquer (base coats)</text><circle cx="442" cy="214" r="9" class="wx-c4 wx-edge"/><text x="460" y="218" class="wx-t">cinnabar red</text><circle cx="442" cy="238" r="9" class="wx-c5 wx-edge"/><text x="460" y="242" class="wx-t">Chinese purple</text><circle cx="442" cy="262" r="9" class="wx-c3 wx-edge"/><text x="460" y="266" class="wx-t">malachite green</text><circle cx="442" cy="286" r="9" class="wx-c2 wx-edge"/><text x="460" y="290" class="wx-t">azurite blue</text><circle cx="442" cy="310" r="9" class="wx-card wx-edge"/><text x="460" y="314" class="wx-t">bone white</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button><button type="button" class="wx-dot" data-k="6" aria-label="Step 6" aria-pressed="false">6</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 6.</b> A square clay plinth and solid clay legs, strong enough to carry the hollow body above.</p><ol class="wx-steplist"><li>A square clay plinth and solid clay legs, strong enough to carry the hollow body above.</li><li>The hollow torso is built up from coils or slabs of clay, then smoothed and carved with armour and robe folds.</li><li>Arms are made separately and joined with wet clay; moulded hands slot into the sleeves.</li><li>The head is pressed in a two-part mould, one of a handful of basic types, then ears, hair and expression are added by hand.</li><li>The figure is fired at roughly 950–1,050 °C. Many pieces carry the stamped or incised name of a workshop foreman.</li><li>Two coats of lacquer, then mineral paints such as cinnabar, malachite, azurite and Chinese purple; real bronze weapons go into the hands.</li></ol><figcaption>Solid legs, a hollow coil-built torso, separate arms and moulded heads with hand-modelled faces, then firing, lacquer, paint and a real bronze weapon. <span class="wx-src">Based on: Production sequence after Ledderose 2000, Portal 2007 and the Mausoleum Site Museum; firing range as commonly reported; pigments after Portal 2007. Schematic, figure height c. 1.8 m.</span></figcaption><p class="vh">A standing terracotta warrior builds up in six steps beside a panel of details. Step 1: a square plinth and two solid legs, with cross-sections contrasting a solid leg and a hollow torso. Step 2: a hollow armoured torso and robe, with a stack of clay coils. Step 3: arms and hands attached, with arrows. Step 4: the head with ears, topknot and moustache, beside a two-part mould and a finished face. Step 5: a small name stamp on the robe and a kiln with flames, fired at about 950 to 1,050 degrees. Step 6: the warrior painted in dark lacquer, purple robe, green trousers and blue sleeves, holding a bronze-tipped spear, with swatches of lacquer and mineral pigments.</p></figure><p>The legs are solid clay, strong enough to carry the weight above, and stand on a square plinth. The torsos are hollow, built up from coils or slabs like large storage jars, then smoothed and carved with armour plates, belts and robe folds. Arms were made separately and joined with wet clay; hands, often moulded, slot into the sleeves. Heads were pressed in two-part moulds, and scholars have identified a limited number of basic face types, around ten. Then came the personal touches: ears, hair, topknots, moustaches and expressions added and modelled by hand.</p><p>The result is uncanny. Walk along the ranks and you meet young men and old, stern faces and cheerful ones, different hairstyles and beard types. No two excavated faces are known to be identical. A computer-vision study of the warriors&#x27; ears in 2014, led by Andrew Bevan, found enough variation to suggest that individual figures were distinct, though whether they portray real individuals is another matter.</p><aside class="wcall"><b>How do we know? Reading the workshop marks</b><p>Many figures carry short stamped or incised inscriptions, often a personal name, sometimes with a place or workshop. Archaeologists have recorded the names of dozens of foremen. Some came from government workshops that also made roof tiles and drains; others seem to have been local potters. The marks served as quality control: if a piece failed, the state knew exactly who to hold responsible, and Qin law was not gentle.</p></aside><p>The figures were fired, probably at roughly 950 to 1,050 °C, which required large kilns and huge quantities of fuel. Some weigh well over 100 kg. Getting thousands of them into the pits without breakage was an achievement in itself.</p></section><section class="wsec" id="terracotta-army-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Real weapons, and a chrome myth</h3><p>The terracotta soldiers held real bronze weapons: swords, spears, halberds, crossbows and tens of thousands of arrowheads, more than 40,000 bronze items in all. Some carry dates between 245 and 228 BCE, inscribed with the names of officials responsible for their manufacture. A 2014 study by Marcos Martinón-Torres and colleagues showed that the arrowheads, bundled in groups of 100, were made in many small, parallel workshop cells rather than on one giant production line: an efficient, flexible system that could keep producing if one cell failed.</p><p>When archaeologists in the 1970s and 1980s found swords that still gleamed and detected chromium on some bronze surfaces, a story took off. Qin smiths, it was said, had invented chrome plating to prevent rust, two thousand years before it was patented in the West. It became a staple of documentaries and museum tours.</p><p>In 2019 a team from UCL and the Emperor Qin Shihuang&#x27;s Mausoleum Site Museum, led by Martinón-Torres, tested the idea properly. They analysed 464 bronze weapon parts. Only 37, about 8 percent, had detectable chromium, and it turned up mostly on fittings such as sword pommels, crossbow triggers and spear ferrules, not on blades or arrowheads. The pattern pointed to a source: the lacquer on the wooden hafts, scabbards and crossbow stocks, which contains chromium and had sat in contact with the metal for two millennia.</p><blockquote class="wpull"><p>The shine was not a lost anti-rust technology; it was good bronze in kind soil.</p></blockquote><p>Why, then, are so many weapons so well preserved? The team pointed to the burial environment. The loess soil is fine-grained and mildly alkaline, with a pH of about 8.1 to 8.5, low in organic matter, and it limits oxygen and moisture. Add tin-rich bronze, and you have metal that corrodes very slowly. It is a good example of how a romantic story can be tested with a portable X-ray fluorescence gun and some patience.</p></section><section class="wsec" id="terracotta-army-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>An army in colour</h3><p>Today the warriors are the colour of dust, but they were painted. Each figure was first coated with two layers of East Asian lacquer, the sap of the lacquer tree, known in Chinese as qi, which formed a dark, glossy base. Over it painters applied mineral pigments: red from cinnabar and iron oxides, green from malachite, blue from azurite, white from bone and a startling purple.</p><p>That purple, often called Chinese or Han purple, is a synthetic pigment, a barium copper silicate made by heating raw materials to high temperature. It is one of the earliest man-made pigments known, and its presence on the warriors shows how much chemistry went into their finishing.</p><p>The paint is fragile. When a figure is excavated, the lacquer, which has been damp for two thousand years, dries in Xi&#x27;an&#x27;s air and curls within seconds; it can flake off within minutes, taking the paint with it. Conservators from China and Germany have developed methods to consolidate the lacquer as it is uncovered, but much colour was lost in earlier excavations. This is one reason why archaeologists move slowly and why much of the army is still underground.</p><aside class="wcall"><b>What colour were they?</b><p>Surviving traces suggest bright, varied uniforms: robes in red, green, blue or purple; dark lacquered armour with coloured laces and rivets; pinkish faces with painted eyes and hair. Colours seem to vary between individuals rather than following a strict uniform code, which some scholars suggest may reflect soldiers supplying their own clothing, as letters from Qin soldiers asking their families for clothes imply. Reconstructions are informed guesses based on these traces.</p></aside></section><section class="wsec" id="terracotta-army-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>Rivers of mercury</h3><p>And then there is the tomb itself. Sima Qian&#x27;s description, written about a century after the burial, is one of the most extraordinary passages in ancient history. In his account, workers dug down through three layers of groundwater, sealed the chamber with bronze, and filled it with models of palaces and towers and rare treasures. Craftsmen set crossbows to shoot anyone who broke in. Mercury was made to flow in imitation of the hundred rivers, the Yangtze and the Yellow River, and the great sea; the heavens were depicted above and the earth below. Lamps were fuelled with the fat of &#x27;man-fish&#x27;, perhaps whales or seals, so they would burn for a long time. According to Sima Qian, the craftsmen who knew the tomb&#x27;s secrets were sealed inside.</p><p>How much of this is true? Nobody knows, because the burial chamber has never been opened. But there are intriguing hints. Geochemical surveys of the soil over the mound, beginning in the early 1980s, reported mercury concentrations well above the surrounding background, and remote-sensing work suggests a large underground chamber roughly where Sima Qian implies. Some researchers caution that later contamination could explain part of the signal, so the mercury rivers remain plausible rather than confirmed.</p><blockquote class="wpull"><p>The most famous tomb in China may also be one of the most toxic places to open.</p></blockquote><p>Chinese authorities have repeatedly decided not to excavate the chamber. The reasons are practical as well as cultural: there is currently no way to protect whatever lies inside, from painted lacquer to silk, once it meets the air, and mercury vapour would be a hazard to the excavators. The terracotta paint problem is a small-scale warning of what could be lost.</p></section><section class="wsec" id="terracotta-army-s8"><h3 class="wsec-h"><span class="wsec-n">08</span>Portraits, propaganda and patience</h3><p>The Terracotta Army still poses real questions. Were the warriors modelled on actual soldiers, or were their faces an artistic way of showing a vast, varied army? The workshop evidence suggests a system designed to produce variety from standard parts, which is not quite the same as portraiture. Who were the workers, and how many died? Burials of labourers found near the tomb, some with fragments of tiles inscribed with their names and home towns, give a grim glimpse of the human cost.</p><p>There are also questions about how the army fits into the wider complex. Each new pit, of acrobats, officials, bronze birds or stone armour, makes it clearer that the soldiers were only one part of an entire imperial world recreated underground. The army guards the approach; the emperor&#x27;s afterlife court lies deeper.</p><p>And there is the matter of patience. Excavation of pit 1 has continued in campaigns since the 1970s, and new figures still emerge, each needing years of conservation. Most of the army, and the emperor himself, remain in the ground. For once, the archaeologists&#x27; motto is not &#x27;dig faster&#x27; but &#x27;wait until we can do it properly&#x27;.</p><p>The First Emperor wanted to rule for ever. His dynasty lasted fifteen years. But the potters, painters and bronze-casters who built his army, whose names we can sometimes still read in the clay, have given us something he never intended: a portrait of the people of his empire, standing in their ranks, waiting.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">246 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Ying Zheng becomes king of Qin; work on his tomb begins</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">221 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Qin unifies China; the king becomes Qin Shi Huang, the First Emperor</span></li><li class="wtl-use" style="--i:2"><span class="wtl-y">210 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">The First Emperor dies and is buried</span></li><li class="wtl-loss" style="--i:3"><span class="wtl-y">206 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Qin collapses; pits looted and burned in the fighting that follows</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">94 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Sima Qian completes the Shiji, describing the tomb (c. 94 BCE)</span></li><li class="wtl-find" style="--i:5"><span class="wtl-y">1974 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Farmers digging a well find fragments; pit 1 located</span></li><li class="wtl-find" style="--i:6"><span class="wtl-y">1976 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Pits 2 and 3 identified</span></li><li class="wtl-find" style="--i:7"><span class="wtl-y">1980 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Two half-size bronze chariots found near the mound</span></li><li class="wtl-event" style="--i:8"><span class="wtl-y">1987 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Mausoleum inscribed as a UNESCO World Heritage Site</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">2014 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Arrowhead study reveals cellular workshop production</span></li><li class="wtl-study" style="--i:10"><span class="wtl-y">2019 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Chromium &#x27;anti-rust&#x27; myth tested and rejected</span></li></ol><figure class="wbars"><h4 class="wx-title">The army by the numbers (estimates)</h4><div class="wb-r" style="--w:100.0%;--i:0"><div class="wb-l">Soldiers, all pits<small>over</small></div><div class="wb-t"><i></i><span>8,000 count</span></div></div><div class="wb-r" style="--w:6.5%;--i:1"><div class="wb-l">Chariot horses</div><div class="wb-t"><i></i><span>520 count</span></div></div><div class="wb-r" style="--w:1.9%;--i:2"><div class="wb-l">Cavalry horses</div><div class="wb-t"><i></i><span>150 count</span></div></div><div class="wb-r" style="--w:1.6%;--i:3"><div class="wb-l">Chariots</div><div class="wb-t"><i></i><span>130 count</span></div></div><div class="wb-r" style="--w:1.5%;--i:4"><div class="wb-l">Figures in pit 3 (command post)</div><div class="wb-t"><i></i><span>68 count</span></div></div><figcaption>Source: Portal, J. (ed.) 2007, The First Emperor: China&#x27;s Terracotta Army, p. 167; pit 3 after the Mausoleum Site Museum</figcaption></figure><h3 class="sub-h wsub">The big debates</h3><div class="debate"><p class="debate-q">Did Qin smiths invent chrome plating?</p><div class="sides"><div class="side"><b>Yes: chromium was found on shiny weapons.</b><span>Early analyses in the 1970s–80s detected chromium on some well-preserved bronze surfaces.</span></div><div class="side"><b>No: the chromium came from lacquer.</b><span>Of 464 parts analysed in 2019, only c. 8% had chromium, concentrated on fittings in contact with lacquered wood; blades and arrowheads, the best-preserved items, had almost none.</span></div></div><p class="debate-why"><b>The bold claim:</b> Qin metalworkers deliberately chrome-plated bronze weapons to prevent corrosion.</p><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The distribution of chromium matches contact with chromium-rich lacquer, not deliberate treatment, and the best-preserved weapons do not carry it. The preservation is explained by alkaline, fine-grained soil and tin-rich bronze. The old claim was a reasonable guess from limited data that did not survive systematic testing.</p></div><div class="debate"><p class="debate-q">Are there really rivers of mercury in the tomb?</p><div class="sides"><div class="side"><b>Probably yes, in some form.</b><span>Sima Qian describes mercury rivers, and soil surveys over the mound have reported mercury well above background levels.</span></div><div class="side"><b>Not established.</b><span>The chamber is unopened; the soil signal could partly reflect later contamination, and &#x27;rivers&#x27; could be an exaggeration of a smaller installation.</span></div></div><p class="debate-why"><b>The bold claim:</b> The First Emperor&#x27;s tomb contains large quantities of mercury laid out as rivers and seas, as Sima Qian described.</p><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">An ancient written source and independent geochemical anomalies point the same way, which is more than most tomb legends can claim. But without excavation or less ambiguous remote sensing, the amount and arrangement of any mercury remain unknown.</p></div><div class="debate"><p class="debate-q">Is every warrior a portrait of a real soldier?</p><div class="sides"><div class="side"><b>Yes: the faces are individual.</b><span>No two faces are known to be identical, and a 2014 study of ear shapes found strong variation between figures.</span></div><div class="side"><b>Individual, but not necessarily portraits.</b><span>Heads come from a limited set of moulds with added features, a system designed to create variety efficiently; no text says real soldiers sat for them.</span></div></div><p class="debate-why"><b>The bold claim:</b> Each terracotta warrior is a portrait of a specific, real soldier.</p><div class="meter" style="--pos:41.7%" role="img" aria-label="Weight of evidence: Open question"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The individuality is real and deliberate, but individuality is not the same as likeness. The production evidence fits craftsmen varying standard parts to suggest a real, diverse army. Whether some sculptors worked from actual people is possible but cannot currently be demonstrated.</p></div><details class="srcs"><summary>Sources for this deep dive (9)</summary><ol><li>Martinón-Torres, M., Li, X., Xia, Y. et al. (2019). Surface chromium on Terracotta Army bronze weapons is neither an ancient anti-rust treatment nor the reason for their good preservation. Scientific Reports 9: 5289. <a href="https://doi.org/10.1038/s41598-019-40613-7" target="_blank" rel="noopener">doi:10.1038/s41598-019-40613-7</a></li><li>Martinón-Torres, M. et al. (2014). Forging the Qin Empire: Chinese imperial logistics and labour organization of the Terracotta Army&#x27;s arrowheads. Antiquity 88(340): 534-549.</li><li>Bevan, A. et al. (2014). Computer vision, archaeological classification and China&#x27;s terracotta warriors. Journal of Archaeological Science 49: 249-254.</li><li>Portal, J. (ed.) (2007). The First Emperor: China&#x27;s Terracotta Army. London: British Museum Press.</li><li>Ledderose, L. (2000). Ten Thousand Things: Module and Mass Production in Chinese Art. Princeton University Press.</li><li>Sima Qian. Shiji (Records of the Grand Historian), ch. 6, Basic Annals of the First Emperor of Qin; trans. B. Watson, Records of the Grand Historian: Qin Dynasty. Columbia University Press, 1993.</li><li>UNESCO World Heritage Centre. Mausoleum of the First Qin Emperor (inscribed 1987).</li><li>Emperor Qinshihuang&#x27;s Mausoleum Site Museum. Pits 1, 2 and 3: site descriptions.</li><li>Emperor Qinshihuang&#x27;s Mausoleum Site Museum and Bavarian State Office for the Preservation of Monuments: joint conservation programme on painted lacquer (1990s onwards).</li></ol></details><aside class="rc-cite" data-v="marvels" data-id="marvel-terracotta-army" data-t="The Terracotta Army"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Terracotta Army</i>. <span class="cite-u">https://residualcontinuum.com/#marvels/marvel-terracotta-army</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="marvel-moai-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Ahu Tongariki cropped.jpg" data-cap="The moai of Ahu Tongariki" data-big><figcaption></figcaption></figure><div class="sh-k">Rapa Nui, south-eastern Pacific</div><h2 class="sh-t" id="marvel-moai-st" tabindex="-1">The moai of Rapa Nui (Easter Island)</h2><p class="sh-s">Nearly a thousand stone ancestors, a quarry full of unfinished giants, and an oral tradition that said they walked. It seems they did.</p><div class="sh-v"><span class="vstamp vstamp--mys">Mystery <span class="pips" role="img" aria-label="Mystery level 1 of 5"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></span></span></div></div><div class="wquick"><h3 class="sub-h">The quick read</h3><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="962" >962</b><span class="ctr-u"> moai</span></div><div class="ctr-l">statues analysed in the 2025 walking study</div><div class="ctr-c">Lipo &amp; Hunt 2025</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="95" >95</b><span class="ctr-u"> %</span></div><div class="ctr-l">of moai carved from Rano Raraku tuff</div><div class="ctr-c">Van Tilburg inventory, summarised in Wikipedia &#x27;Moai&#x27;</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="21" >21</b><span class="ctr-u"> m</span></div><div class="ctr-l">length of El Gigante, the largest moai ever begun</div><div class="ctr-c">Wikipedia &#x27;Moai&#x27;</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="82" >82</b><span class="ctr-u"> t</span></div><div class="ctr-l">Paro, the tallest moai ever erected</div><div class="ctr-c">Wikipedia &#x27;Moai&#x27;</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="18" >18</b><span class="ctr-u"> people</span></div><div class="ctr-l">walked a 4.35 t replica 100 m in c. 40 minutes</div><div class="ctr-c">Lipo, Hunt &amp; Rapu Haoa 2013</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="3900" >3,900</b><span class="ctr-u"> people</span></div><div class="ctr-l">maximum population supported by rock gardens (±800)</div><div class="ctr-c">Davis et al. 2024</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="15" >15</b><span class="ctr-u"> genomes</span></div><div class="ctr-l">ancient Rapanui genomes showing no pre-contact collapse</div><div class="ctr-c">Moreno-Mayar et al. 2024</div></div></div><div class="stats"><div><b>nearly 1,000 known (962 in the 2025 3D study)</b><span>Statues</span></div><div><b>Rano Raraku volcanic tuff: about 95% of moai</b><span>Main quarry</span></div><div><b>c. 394 statues in varying states of completion</b><span>Still at the quarry</span></div><div><b>c. 4 m tall, c. 12.5 t</b><span>Average moai</span></div><div><b>Paro, almost 10 m, c. 82 t</b><span>Tallest erected</span></div><div><b>&#x27;El Gigante&#x27;, c. 21 m, unfinished</b><span>Largest ever begun</span></div><div><b>4.35 t replica, 18 people, 100 m in c. 40 min</b><span>Walking test (2012)</span></div><div><b>red scoria from Puna Pau, up to c. 13 t</b><span>Pukao (topknots)</span></div></div><p>Carvers shaped the statues directly out of the volcanic tuff of the Rano Raraku crater, using hand-held basalt picks, and freed them from the bedrock along a keel under the back. Finished statues were lowered down the slope and stood upright. Rapanui oral tradition says the moai &#x27;walked&#x27; to their platforms. Archaeologists Carl Lipo and Terry Hunt tested this: with ropes on both sides and one behind, a team rocked an upright replica from side to side so that it shuffled forward. Their 2025 analysis of 962 moai found that statues abandoned along the ancient roads have wide D-shaped bases and a forward lean that make this kind of walking stable, and that the roads, about 4.5 m wide and concave, would keep a rocking statue centred. Red stone topknots (pukao) from a separate quarry were probably rolled to the platforms and up ramps.</p><div class="flip" id="marvel-moai-flip"><div class="flip-in"><div class="flip-f"><b>The myth</b><p>The islanders chopped down every tree to roll statues on logs, their population crashed from over 15,000 into warfare and cannibalism (the &#x27;ecocide&#x27; story), and the moai were impossible to move without outside help.</p></div><div class="flip-b"><b>The reality</b><p>Ancient genomes published in 2024 show no population crash before European contact, and a 2024 satellite study of rock gardens suggests the island supported roughly 3,000 to 4,000 people, close to what Europeans saw in 1722. The island was deforested, probably with help from introduced rats, and a long drought from the mid-1500s coincided with changes in ritual. The catastrophic losses came after 1860, through slave raids and disease. The walking hypothesis explains transport without logs or outsiders, though scholars still debate details.</p></div></div><button type="button" class="flip-btn" aria-pressed="false" onclick="flip('marvel-moai-flip',this)">Flip it</button></div><div class="twist"><b>Wow</b><p>A roughly 4-tonne replica &#x27;walked&#x27; 100 m in about 40 minutes pulled by just 18 people, and statues abandoned on the roads have exactly the shapes you would carve if you meant them to walk.</p></div><div class="wmys"><span>Mystery meter</span><span class="pips" role="img" aria-label="Mystery level 1 of 5"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></span><small>Mostly solved</small></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">10 min read · 2,310 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The moai of Rapa Nui (Easter Island)"><button type="button" class="wtoc-i" data-go="moai-s1">A crater full of giants</button><button type="button" class="wtoc-i" data-go="moai-s2">Carving a moai</button><button type="button" class="wtoc-i" data-go="moai-s3">The statues that walked</button><button type="button" class="wtoc-i" data-go="moai-s4">Roads built for walking</button><button type="button" class="wtoc-i" data-go="moai-s5">Hats of red stone</button><button type="button" class="wtoc-i" data-go="moai-s5b">Standing up, and opening their eyes</button><button type="button" class="wtoc-i" data-go="moai-s6">The collapse that wasn&#x27;t</button><button type="button" class="wtoc-i" data-go="moai-s7">What really broke Rapa Nui</button><button type="button" class="wtoc-i" data-go="moai-s8">Myths, verdicts and open questions</button></nav></div><section class="wsec" id="moai-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A crater full of giants</h3><p>Climb the slope of Rano Raraku at dawn and the hillside is watching you. Heads rise out of the grass at every angle, some buried to the chin, some tilted as if listening. Above them, in the rock face itself, lie statues that were never finished: faces half cut, bodies still joined to the mountain along their backs. Around 394 moai remain here, in and around the quarry that supplied about 95 percent of all the statues on the island.</p><p>Rapa Nui is one of the most isolated inhabited places on Earth, a triangle of volcanic land about 2,000 km from the nearest inhabited island. Polynesian voyagers reached it around 1200 CE, give or take a century by current radiocarbon studies. Over the next few hundred years their descendants carved nearly a thousand moai, most between about 1250 and the 1500s, and set many of them on stone platforms, called ahu, around the coast, with their backs to the sea and their faces towards the land and the people.</p><blockquote class="wpull"><p>The moai are not faces of strangers. They are ancestors, set up to watch over their descendants.</p></blockquote><p>For three centuries, outsiders have asked two questions about them. How did people with no metal tools, no wheels and no large animals move statues weighing many tonnes? And what happened to the society that made them? In the past fifteen years, both answers have changed.</p></section><section class="wsec" id="moai-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Carving a moai</h3><p>Rano Raraku is an extinct volcano made of lapilli tuff, compacted volcanic ash that is soft enough to carve with stone tools yet firm enough to hold fine detail. Thousands of basalt picks, called toki, have been found around the quarry. Carvers outlined a statue on the rock face, cut channels along its sides, and shaped the face and front while the figure lay on its back. The back was left attached to the bedrock by a narrow keel, which was cut through last.</p><p>An average moai stands about 4 m tall with a base about 1.6 m wide and weighs around 12.5 t. Proportions are distinctive: a huge head, often around a third or more of the height, with a heavy brow, long nose, thin pressed lips and elongated ears. Arms run down the sides and the long-fingered hands meet over the belly. There are no legs; the figure ends at the hips.</p><p>Not all moai were small. Paro, the tallest ever erected, stood almost 10 m tall and weighed about 82 t; the heaviest erected statue, at Ahu Tongariki, is reported at around 86 t. And then there is El Gigante, still lying in the quarry: about 21 m long, with published weight estimates starting around 145 to 165 t and running higher. It was never finished, and it is hard to imagine it could ever have been moved.</p><figure class="photo wimg" data-img="Rano Raraku quarry.jpg" data-cap="Moai on the slopes of Rano Raraku, the quarry that supplied about 95 percent of the statues."><figcaption></figcaption></figure><figure class="wx wx--static" id="moai-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Moai anatomy and size</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Moai anatomy and size"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" class="wx-svg" role="img" aria-labelledby="moai-f2-t"><title id="moai-f2-t">Moai anatomy and size: an average moai, Paro on its ahu with pukao, and El Gigante, with a person</title><text x="20" y="24" class="wx-t-cap">Drawn to one scale · 20 px = 1 m</text><path d="M527.0,530.0 L530.0,345.2 C531.5,328.4 539.0,320.0 545.0,315.8 L545.0,185.6 L545.0,126.2 C545.0,114.9 549.9,110.0 561.2,110.0 L618.8,110.0 C630.1,110.0 635.0,114.9 635.0,126.2 L635.0,185.6 L635.0,315.8 C641.0,320.0 648.5,328.4 650.0,345.2 L653.0,530.0 Z" class="wx-sand wx-o40 wx-dash wx-grow" style="--d:6"/><path d="M554.0,181.4 L626.0,181.4 M590.0,185.6 L590.0,257.0 M575.0,265.4 L605.0,265.4 M545.0,194.0 C537.5,206.6 537.5,269.6 545.0,282.2 M635.0,194.0 C642.5,206.6 642.5,269.6 635.0,282.2 M545.0,353.6 C554.0,404.0 566.0,437.6 584.0,450.2 M635.0,353.6 C626.0,404.0 614.0,437.6 596.0,450.2" class="wx-guide"/><text x="590" y="92" class="wx-t-b" text-anchor="middle">El Gigante</text><text x="590" y="106" class="wx-t-s" text-anchor="middle">unfinished, still in the quarry;</text><text x="590" y="120" class="wx-t-s" text-anchor="middle">shown upright for comparison</text><path d="M680,110 L680,530 M674,110 h12 M674,530 h12" class="wx-dim wx-draw" pathLength="1" style="--d:8"/><text x="692" y="320" class="wx-t-n" transform="rotate(-90 692 320)" text-anchor="middle">c. 21 m</text><rect x="300" y="500" width="160" height="30" class="wx-stone3 wx-edge wx-grow" style="--d:1"/><path d="M300,515 L460,515 M332,500 v15 M372,500 v15 M412,500 v15 M352,515 v15 M392,515 v15 M432,515 v15" class="wx-thin"/><path d="M345.0,500.0 L346.7,412.0 C347.5,404.0 351.7,400.0 355.0,398.0 L355.0,336.0 L355.0,309.0 C355.0,302.7 357.7,300.0 364.0,300.0 L396.0,300.0 C402.3,300.0 405.0,302.7 405.0,309.0 L405.0,336.0 L405.0,398.0 C408.3,400.0 412.5,404.0 413.3,412.0 L415.0,500.0 Z" class="wx-stone2 wx-edge wx-grow" style="--d:2"/><path d="M360.0,334.0 L400.0,334.0 M380.0,336.0 L380.0,370.0 M371.7,374.0 L388.3,374.0 M355.0,340.0 C350.8,346.0 350.8,376.0 355.0,382.0 M405.0,340.0 C409.2,346.0 409.2,376.0 405.0,382.0 M355.0,416.0 C360.0,440.0 366.7,456.0 376.7,462.0 M405.0,416.0 C400.0,440.0 393.3,456.0 383.3,462.0" class="wx-thin"/><rect x="361" y="270" width="38" height="30" rx="5" class="wx-c1 wx-o80 wx-edge wx-pop" style="--d:4"/><text x="380" y="240" class="wx-t-b" text-anchor="middle">Paro</text><text x="380" y="256" class="wx-t-s" text-anchor="middle">tallest ever erected</text><path d="M476,500 L476,300 M470,500 h12 M470,300 h12" class="wx-dim wx-draw" pathLength="1" style="--d:5"/><text x="486" y="396" class="wx-t-n">c. 10 m</text><text x="486" y="412" class="wx-t-s">c. 82 t</text><path d="M134.0,530.0 L134.8,494.8 C135.1,491.6 137.0,490.0 138.6,489.2 L138.6,464.4 L138.6,454.1 C138.6,451.2 139.8,450.0 142.7,450.0 L157.3,450.0 C160.2,450.0 161.4,451.2 161.4,454.1 L161.4,464.4 L161.4,489.2 C163.0,490.0 164.9,491.6 165.2,494.8 L166.0,530.0 Z" class="wx-stone2 wx-edge wx-grow" style="--d:1"/><path d="M140.9,463.6 L159.1,463.6 M150.0,464.4 L150.0,478.0 M146.2,479.6 L153.8,479.6 M138.6,466.0 C136.7,468.4 136.7,480.4 138.6,482.8 M161.4,466.0 C163.3,468.4 163.3,480.4 161.4,482.8 M138.6,496.4 C140.9,506.0 143.9,512.4 148.5,514.8 M161.4,496.4 C159.1,506.0 156.1,512.4 151.5,514.8" class="wx-thin"/><circle cx="80" cy="499.5" r="3.5" class="wx-inkfill"/><path d="M80,503 L80,517 M80,517 L76,530 M80,517 L84,530 M80,507 L75,515 M80,507 L85,515" class="wx-line"/><text x="70" y="550" class="wx-t-s" text-anchor="middle">person</text><text x="70" y="564" class="wx-t-s" text-anchor="middle">1.7 m</text><text x="150" y="550" class="wx-t-b" text-anchor="middle">Average moai</text><text x="150" y="564" class="wx-t-s" text-anchor="middle">c. 4 m, c. 12.5 t</text><text x="380" y="550" class="wx-t-b" text-anchor="middle">Ahu</text><text x="380" y="564" class="wx-t-s" text-anchor="middle">stone platform (height approximate)</text><path d="M0,530 L720,530" class="wx-line"/><g class="wx-pop" style="--d:5"><text x="300" y="284" class="wx-t-b" text-anchor="end">Pukao (topknot)</text><text x="300" y="298" class="wx-t-s" text-anchor="end">red scoria, Puna Pau</text><path d="M304,280 L361,284" class="wx-thin"/></g><g class="wx-pop" style="--d:6"><text x="300" y="350" class="wx-t-b" text-anchor="end">Long ears</text><path d="M304,346 L351,350" class="wx-thin"/></g><g class="wx-pop" style="--d:7"><text x="300" y="380" class="wx-t-b" text-anchor="end">Deep brow, long nose</text><path d="M304,376 L372,340" class="wx-thin"/></g><g class="wx-pop" style="--d:8"><text x="300" y="430" class="wx-t-b" text-anchor="end">Arms and hands</text><text x="300" y="444" class="wx-t-s" text-anchor="end">meet at the belly</text><path d="M304,426 L360,450" class="wx-thin"/></g><text x="20" y="380" class="wx-t-s">Pukao reach c. 2 m</text><text x="20" y="394" class="wx-t-s">across and up to c. 13 t</text><text x="20" y="408" class="wx-t-s">(Hixon et al. 2018)</text><g class="wx-pop" style="--d:9"><rect x="20" y="574" width="100" height="6" class="wx-inkfill"/><rect x="120" y="574" width="100" height="6" class="wx-card wx-edge"/><text x="20" y="600" class="wx-t-s" text-anchor="middle">0</text><text x="120" y="600" class="wx-t-s" text-anchor="middle">5</text><text x="220" y="600" class="wx-t-s" text-anchor="middle">10 m</text></g></svg></div></div><figcaption>Drawn to one scale (20 px per metre): a person, an average moai, Paro on its ahu with a pukao, and the unfinished El Gigante shown upright for comparison. <span class="wx-src">Based on: Heights and weights from the moai inventory summarised in Wikipedia &#x27;Moai&#x27; (average c. 4 m and 12.5 t; Paro almost 10 m and 82 t; El Gigante c. 21 m); pukao size from Hixon et al. 2018. Ahu height and statue widths approximate.</span></figcaption><p class="vh">Scale drawing along one ground line. A 1.7 metre person stands beside an average moai about 4 metres tall. In the middle, Paro, almost 10 metres tall and about 82 tonnes, stands on a stone platform (ahu) with a red cylindrical pukao on its head; labels point to the pukao, long ears, deep brow and long nose, and the arms and hands meeting at the belly. On the right a dashed outline shows El Gigante, about 21 metres tall, unfinished in the quarry and drawn upright only for comparison. A note says pukao reach about 2 metres across and up to about 13 tonnes.</p></figure></section><section class="wsec" id="moai-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The statues that walked</h3><p>Ask how the moai reached their platforms and Rapanui tradition has an answer that sounds, at first, like poetry: they walked. One chant tells of an early ancestor who knew how to make statues walk. For much of the 20th century, visiting researchers treated this as a figure of speech and tried other methods: dragging statues on wooden sledges, lying face up or face down, or rolling them over logs. Several of those methods work in experiments. But they need lots of timber and lots of people, and they do not explain a curious fact: many statues abandoned along the old roads are lying in positions that do not fit dragging.</p><p>The walking idea was not new in the 2010s. In 1986 the Czech engineer Pavel Pavel, working with Thor Heyerdahl, rocked an upright moai forward with ropes on the island, but it was slow going and chipped the statue&#x27;s base, and many archaeologists remained sceptical. In 1998 Jo Anne Van Tilburg, who has spent decades documenting every moai on the island, led an experiment for the television series NOVA in which a replica lying on a wooden sledge was hauled over a track of rails. Both approaches worked, after a fashion. The question was which one matched the evidence left on the ground.</p><p>In 2012 archaeologists Carl Lipo and Terry Hunt, working with Rapanui archaeologist Sergio Rapu Haoa, built a concrete replica weighing 4.35 t, with the shape of a road moai. They tied three ropes around its head. Four people held each side rope and ten held a rope running back from the head. When the side teams pulled in turn, the statue rocked onto one edge of its base and swung the other side forward. The rear team kept it from toppling forward. Rock, swing, rock, swing: the statue shuffled ahead in a zigzag. In about 40 minutes the team moved it 100 m.</p><figure class="wx wx--steps" id="moai-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">How to walk a moai</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How to walk a moai"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" class="wx-svg" role="img" aria-labelledby="moai-f1-t"><title id="moai-f1-t">How a moai could walk: ropes, rocking, and a forward lean</title><defs><marker id="moai-f1-ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="wx-accfill"/></marker></defs><text x="20" y="24" class="wx-t-cap">Front view</text><text x="400" y="24" class="wx-t-cap">Side view</text><path d="M372,40 L372,380" class="wx-guide"/><path d="M20,360 L352,360 M392,360 L704,360" class="wx-line"/><g class="wx-st" data-s="1"><path d="M138,360 L140,272 C141,264 146,260 150,258 L150,196 C150,172 160,160 180,160 C200,160 210,172 210,196 L210,258 C214,260 219,264 220,272 L222,360 Z" class="wx-stone2 wx-edge"/><path d="M156,194 L204,194 M180,196 L180,230 M170,234 L190,234 M150,200 C145,206 1
