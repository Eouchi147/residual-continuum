th d="M231,456 L247,456" class="wx-line wx-st" data-s="5" marker-end="url(#damascus-steel-f1-ar)"/><path d="M472,456 L488,456" class="wx-line wx-st" data-s="6" marker-end="url(#damascus-steel-f1-ar)"/></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button><button type="button" class="wx-dot" data-k="6" aria-label="Step 6" aria-pressed="false">6</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 6.</b> Charge: iron pieces and carbon-rich plant matter are packed into a clay crucible.</p><ol class="wx-steplist"><li>Charge: iron pieces and carbon-rich plant matter are packed into a clay crucible.</li><li>Seal and fire: the mouth is sealed with clay and the crucibles are fired for up to about 24 hours, hot enough (probably above 1,300 °C) to melt the charge.</li><li>Slow cooling: the steel freezes into a cake of about 1.5% carbon. Tree-like dendrites trap trace vanadium between their arms.</li><li>Forge cool: the smith reheats only to a dull red, about 50–100 °C below the carbide-dissolving temperature, and hammers in many cycles.</li><li>Bands align: carbide particles re-form where the vanadium sits and gather into sheets, clear after six to eight cycles.</li><li>Etch: a light acid etch darkens the steel between the carbide sheets, revealing the watered pattern.</li></ol><figcaption>The wootz route in six steps. Each panel shows one stage; the pattern that appears in step 6 was seeded in the crucible in step 3. <span class="wx-src">Based on: Verhoeven, Pendray and Dauksch 1998; Srinivasan and Ranganathan 2004 (crucible practice); Juleff 2015 (Sri Lankan crucibles). Temperatures approximate.</span></figcaption><p class="vh">Six panels in two rows. Panel 1: a cutaway clay crucible charged with iron pieces and plant matter. Panel 2: sealed crucibles in a furnace with flames, fired for many hours above about 1,300 degrees Celsius. Panel 3: a small round steel cake cooling slowly, with tree-like dendrites inside. Panel 4: a bar being hammered on an anvil at dull red heat, about 50 to 100 degrees below the carbide-dissolving temperature. Panel 5: a magnified view where scattered carbide particles gather into parallel bands over six to eight cycles. Panel 6: a finished blade after etching, showing a wavy watered pattern.</p></figure><p>When the furnace cooled, the crucibles were broken open to release a cake of steel with about 1.5% carbon, roughly twice the carbon of a good modern kitchen knife. Nineteenth-century observers in Mysore described crucibles holding around 400 g of iron. Verhoeven and his colleagues put typical traded cakes at about 2.3 kg. Sri Lankan crucibles from Hattota Amune, dated to about 680–990 CE, are smaller still: narrow-necked flasks with a body only about 45 mm wide that could have produced little more than a button of steel.</p><p>Sri Lanka had another trick. On exposed ridges near Samanalawewa, Gill Juleff excavated rows of iron-smelting furnaces from the second half of the first millennium CE, built along the western edges of hills to catch the strong monsoon wind. Her experimental furnace, driven by nothing but the wind, produced high-carbon steel directly. Picture, perhaps, a line of glowing clay walls on a hillside during the monsoon, roaring without a single bellows. It is not wootz itself, but it shows how inventive South Asian iron-making was long before European industry.</p><p>Slow cooling mattered. As the melt solidified it grew tree-like crystals called dendrites, and the last liquid to freeze, between the dendrite arms, was enriched in trace elements. That invisible chemical striping, set in the crucible, was the seed of the pattern that would appear hundreds of kilometres away and months later on a finished blade.</p><aside class="wcall"><b>How do we know?</b><p>Three kinds of evidence meet here. Archaeologists have excavated crucible fragments and slag at sites such as the Knuckles range and Yodhawewa in Sri Lanka, Merv in Turkmenistan and Akhsiket in Uzbekistan. European travellers of the late 18th and 19th centuries watched the last Indian workshops operate. And metallurgists have sectioned surviving blades and ingots under the microscope to read the process backwards.</p></aside></section><section class="wsec" id="damascus-steel-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The long road to Damascus</h3><p>By the 9th century crucible steel was a Eurasian industry. At Merv, in today&#x27;s Turkmenistan, a 9th to early 10th-century workshop made steel by co-fusion, melting cast iron with wrought iron. In the Ferghana Valley, excavators at Akhsiket and Pap have found hundreds of thousands of crucible fragments from the 9th–12th centuries. At Chahak in southern Iran, Rahil Alipour, Thilo Rehren and Marcos Martinón-Torres found crucible steel containing about 1% chromium, apparently added on purpose, and linked it to a mysterious ingredient named in a recipe by the scholar al-Biruni.</p><p>Indian cakes kept moving west throughout. By the late 1600s, according to trade records summarised by Sharada Srinivasan and Srinivasa Ranganathan, tens of thousands of wootz ingots were being shipped from the Coromandel coast to Persia. Blades forged from them were sold in the markets of Damascus, and whether the city lent its name to the steel, or the name comes from an Arabic word for water, or from a smith called Damasqui whom al-Biruni mentions, is still debated.</p><p>The Arab philosopher al-Kindi, writing in the 9th century, already sorted swords by the steel they were made from, where they were forged and the look of their surface. The watered pattern was a trademark and a quality mark, and buyers learned to read it the way a modern wine buyer reads a label.</p><figure class="photo wimg" data-img="Watered pattern on sword blade2.Iran.JPG" data-cap="Watered pattern on an Iranian sword blade. The light and dark swirls are layers of carbide particles within the steel."><figcaption></figcaption></figure><p>A wootz cake was not easy to work. Steel with 1.5% carbon behaves very differently from the softer iron most smiths knew. Heated as hot as an ordinary bar, it could crack or crumble under the hammer, and 19th-century European smiths who tried it reported exactly that frustration. The Persian and Syrian masters succeeded because they worked it cooler and more patiently, drawing the cake out into a bar over many heats. That patience, it turns out, was not just a workaround. It was the very thing that made the pattern.</p></section><section class="wsec" id="damascus-steel-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Why the pattern appears</h3><p>For two centuries European scientists tried and failed to copy wootz. Michael Faraday analysed it in 1819 and concluded that aluminium was the secret, which turned out to be slag contamination. The breakthrough came from an unlikely partnership in the 1980s and 1990s: John Verhoeven, a materials scientist at Iowa State University, and Alfred Pendray, a Florida bladesmith who had spent years trying to forge patterned blades from small crucible ingots.</p><p>A quick primer helps. Steel is iron with a little carbon. Up to about 0.8% carbon, the carbon can be absorbed into a fine layered mixture called pearlite. Beyond that, the surplus forms cementite, an iron carbide that is extremely hard and rather brittle. In an ordinary high-carbon steel, cementite tends to form continuous networks around the grains, and the steel snaps. In a good wootz blade the cementite is broken up into separate particles, lined up in sheets and held in a tougher pearlite matrix: hard grit in a resilient binder, a little like gravel set in concrete.</p><p>Pendray could sometimes get a pattern and sometimes not, from ingots that looked identical. Chemical analysis of genuine old blades supplied the clue. Four swords first studied by the Swiss metallurgist Zschokke in 1924 contained between 50 and 270 parts per million of vanadium, with smaller contributions from elements such as molybdenum and manganese. When Pendray and Verhoeven added about 40 ppm or more of vanadium to their melts, the bands appeared reliably. Without it, they did not.</p><figure class="wx wx--static" id="damascus-steel-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">Inside the watered pattern</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Inside the watered pattern"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" class="wx-svg" role="img" aria-labelledby="damascus-steel-f2-t"><title id="damascus-steel-f2-t">Inside the watered pattern: from sabre to microstructure</title><clipPath id="damascus-steel-f2-bl"><path d="M130,92 Q420,98 666,34 Q430,74 130,74 Z"/></clipPath><path d="M130,92 Q420,98 666,34 Q430,74 130,74 Z" class="wx-metal wx-edge wx-pop"/><g clip-path="url(#damascus-steel-f2-bl)"><path d="M110,42 q9,5 18,0 q9,-5 18,0 q9,5 18,0 q9,-5 18,0 q9,5 18,0 q9,-5 18,0 q9,5 18,0 q9,-5 18,0 q9,5 18,0 q9,-5 18,0 q9,5 18,0 q9,-5 18,0 q9,5 18,0 q9,-5 18,0 q9,5 18,0 q9,-5 18,0 q9 le="--d:6" transform="rotate(-8 560.7 400.6)"/><ellipse cx="579.5" cy="403.4" rx="9.1" ry="3" class="wx-card wx-edge wx-pop" style="--d:6" transform="rotate(6 579.5 403.4)"/><ellipse cx="605.1" cy="403.4" rx="4.9" ry="3.2" class="wx-card wx-edge wx-pop" style="--d:6" transform="rotate(1 605.1 403.4)"/><ellipse cx="625.7" cy="402" rx="6.3" ry="4.2" class="wx-card wx-edge wx-pop" style="--d:6" transform="rotate(-13 625.7 402)"/><ellipse cx="316.4" cy="467" rx="4.4" ry="4.8" class="wx-card wx-edge wx-pop" style="--d:8" transform="rotate(7 316.4 467)"/><ellipse cx="335.3" cy="468.8" rx="6.1" ry="3.8" class="wx-card wx-edge wx-pop" style="--d:8" transform="rotate(-13 335.3 468.8)"/><ellipse cx="358.1" cy="457.8" rx="6.6" ry="3.3" class="wx-card wx-edge wx-pop" style="--d:8" transform="rotate(-8 358.1 457.8)"/><ellipse cx="378.8" cy="469" rx="4.8" ry="4.8" class="wx-card wx-edge wx-pop" style="--d:8" transform="rotate(15 378.8 469)"/><ellipse cx="402.5" cy="463.9" rx="8" ry="3.4" class="wx-card wx-edge wx-pop" style="--d:8" transform="rotate(-2 402.5 463.9)"/><ellipse cx="429.3" cy="460.4" rx="9.1" ry="5" class="wx-card wx-edge wx-pop" style="--d:8" transform="rotate(14 429.3 460.4)"/><ellipse cx="455.6" cy="456.6" rx="5.3" ry="4.8" class="wx-card wx-edge wx-pop" style="--d:8" transform="rotate(-7 455.6 456.6)"/><ellipse cx="481" cy="458.5" rx="8.7" ry="3.2" class="wx-card wx-edge wx-pop" style="--d:8" transform="rotate(14 481 458.5)"/><ellipse cx="505.3" cy="459.6" rx="8.9" ry="3.5" class="wx-card wx-edge wx-pop" style="--d:8" transform="rotate(14 505.3 459.6)"/><ellipse cx="534.4" cy="467.8" rx="9.1" ry="5.1" class="wx-card wx-edge wx-pop" style="--d:8" transform="rotate(2 534.4 467.8)"/><ellipse cx="560" cy="468" rx="8.7" ry="4.4" class="wx-card wx-edge wx-pop" style="--d:8" transform="rotate(-2 560 468)"/><ellipse cx="586" cy="467.1" rx="5.4" ry="4.8" class="wx-card wx-edge wx-pop" style="--d:8" transform="rotate(-3 586 467.1)"/><ellipse cx="605" cy="458.3" rx="4.5" ry="4.9" class="wx-card wx-edge wx-pop" style="--d:8" transform="rotate(-15 605 458.3)"/><ellipse cx="622" cy="469.7" rx="7.5" ry="3.1" class="wx-card wx-edge wx-pop" style="--d:8" transform="rotate(7 622 469.7)"/></g><rect x="316" y="196" width="316" height="250" class="wx-line"/><path d="M646,279.3 L646,340.6 M640,279.3 L652,279.3 M640,340.6 L652,340.6" class="wx-dim"/><text x="656" y="305.9" class="wx-t-n">c. 40–50</text><text x="656" y="321.9" class="wx-t-s">µm</text><text x="316" y="162" class="wx-t-b">Under the microscope</text><text x="316" y="180" class="wx-t-m">cementite (Fe3C) particles, c. 5–15 µm, in pearlite</text><rect x="328" y="420" width="84.1" height="20" rx="4" class="wx-card wx-o80"/><path d="M336,434 L404.1,434" class="wx-bold"/><text x="370.1" y="429" class="wx-t-s" text-anchor="middle">50 µm</text><text x="316" y="468" class="wx-t-s">Band spacing and particle sizes measured on genuine blades.</text><text x="316" y="486" class="wx-t-s">Carbon nanotubes reported in 2006 are c. 1,000× smaller still (nm).</text></svg></div></div><figcaption>Zooming from a whole sabre to the microstructure: the pattern is made of sheets of cementite particles in a pearlite matrix, spaced a few tens of micrometres apart. <span class="wx-src">Based on: Band spacing and particle sizes: Verhoeven, Pendray and Dauksch 1998 (Zschokke swords 7, 9 and 10). Blade proportions typical of Persian sabres. Nanotube note: Reibold et al. 2006.</span></figcaption><p class="vh">Top: a curved sabre about 85 centimetres long with a wavy pattern along the blade and a 10 centimetre scale bar. A circle magnifies a patch of the surface, about one centimetre across, showing light and dark swirls. A second, square inset magnifies the steel to the micrometre scale: rows of white oval cementite particles, each about 5 to 15 micrometres long, lie in bands about 40 to 50 micrometres apart in a finely striped pearlite matrix, with a 50 micrometre scale bar. A small note records the 2006 report of carbon nanotubes at the nanometre scale.</p></figure><p>The mechanism, set out by Verhoeven, Pendray and Dauksch in 1998, runs roughly like this. Vanadium segregates to the spaces between dendrite arms as the ingot freezes. During forging, the steel is heated to a dull red, about 50–100 °C below the temperature at which its carbides would fully dissolve, then hammered and allowed to cool. Each cycle, some carbide dissolves and then re-forms preferentially where the vanadium-rich regions are. After six to eight cycles, the particles have gathered into distinct sheets, and continued forging flattens the sheets parallel to the blade&#x27;s surface.</p><p>Grinding the finished blade cuts across those gently undulating sheets at shallow angles, which is why the surface shows curls and ripples rather than straight lines. Smiths could steer the look: filing grooves or drilling shallow holes before the final forging produced the &#x27;ladder&#x27; and &#x27;rose&#x27; patterns collectors love.</p><blockquote class="wpull"><p>A few dozen parts per million of vanadium, carried from the ore, decided whether a smith got a masterpiece or a plain grey blade.</p></blockquote></section><section class="wsec" id="damascus-steel-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Nanotubes in a sabre</h3><p>In November 2006 the journal Nature published a one-page report that went around the world. Marianne Reibold, Peter Paufler and colleagues at the Technical University of Dresden had dissolved a small sample from a 17th-century sabre, attributed to the smith Assad Ullah and supplied by the Bern Historical Museum, in hydrochloric acid and examined the residue with high-resolution transmission electron microscopy. They reported multiwalled carbon nanotubes, and elongated nanowires of cementite that the tubes may have encapsulated.</p><p>Headlines announced that medieval smiths had used nanotechnology. That is where a fair hearing becomes important. The finding is genuinely interesting: it shows that complex carbon nanostructures can form in an ordinary historical forging process, perhaps with trace metals acting as catalysts, as the authors suggested. But it was one sample from one blade, the method involved dissolving the steel before looking, and the paper did not test whether the nanostructures affect the pattern or the performance.</p><blockquote class="quote"><p>I doubt that they play any role in the unique banded microstructure that gives Damascus steels their beautiful surface patterns.</p><cite>John Verhoeven, quoted in Chemical &amp; Engineering News (November 2006)</cite></blockquote><p>Verhoeven also pointed out that similar nanostructures might be expected in pearlite, a constituent of countless ordinary steels. The honest verdict: nanotubes are a real observation awaiting replication and context, not the secret of the sword. The pattern is fully explained, at the scale you can see, by micrometre-sized carbide particles.</p><p>Keep the scales in mind. The carbide particles that draw the pattern are about 5–15 micrometres across, visible in an ordinary optical microscope. The reported nanotubes are roughly a thousand times smaller, measured in nanometres, and could only be seen after the steel around them had been dissolved away. They sit inside the story, not at the centre of it.</p></section><section class="wsec" id="damascus-steel-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Legends of the edge</h3><p>Some of the most famous stories about Damascus blades come from fiction. In Walter Scott&#x27;s 1825 novel The Talisman, Saladin slices a silk cushion and a floating veil with his scimitar, while Richard the Lionheart smashes an iron bar with his broadsword. The scene is memorable, but it is a novelist&#x27;s invention, and later retellings added gun barrels and rocks.</p><p>Real blades were superb for their time because they combined a very hard steel with enough toughness to survive combat. Carbide particles in a softer matrix can give an edge a fine, slightly serrated bite. Yet modern tests do not show magic. Metallurgist Larrin Thomas has summarised sharpening experiments in which crucible Damascus did not take a keener edge than good modern carbon steels, and cutting tests in which it did not clearly outlast them at comparable hardness.</p><ul class="wlist"><li>Plausible: wootz blades were harder and held an edge better than most contemporary iron and steel swords.</li><li>Legend: cutting through rifle barrels or stone without damage.</li><li>Fiction: Saladin&#x27;s floating silk, from Walter Scott&#x27;s novel.</li><li>Confusion: most modern &#x27;Damascus&#x27; knives are pattern-welded, made by forge-welding layers of different steels, a different and much older technique.</li></ul><p>The name itself added to the muddle. In the 19th century, gunmakers sold shotgun barrels as &#x27;Damascus&#x27; because they were twisted and forge-welded from strips of iron and steel, giving a patterned surface. Those barrels had nothing to do with crucible steel, and several failed under the pressure of modern smokeless powder, which is one reason the word &#x27;Damascus&#x27; drifted so far from its original meaning.</p></section><section class="wsec" id="damascus-steel-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>A lost art, found again</h3><p>The finest watered blades seem to end around 1750, and quality declined into the early 19th century. The last eyewitness account of traditional crucible steelmaking in Sri Lanka dates from 1903. Why did the art fade? Verhoeven and Pendray&#x27;s answer is careful and quite convincing: the Indian ore deposits that happened to carry the right trace elements were exhausted or became inaccessible, and when new sources arrived, the knowledge needed to exploit them had gone.</p><p>Other pressures probably helped. Cheap European steel and firearms changed what buyers wanted, and colonial disruption hit the small village industries that made crucible steel. None of this required a secret formula to vanish, only a chain of ore, crucible makers, traders and smiths to break.</p><p>Rediscovery came in stages. In Russia, Pavel Anosov produced patterned &#x27;bulat&#x27; steel in the 1830s and 1840s. In the 20th century, metallurgists recognised that the pattern came from carbide banding in hypereutectoid steel. And in the 1990s Pendray forged blades whose structure and pattern match museum originals closely enough to convince specialists.</p><aside class="wcall"><b>Fresh from the field</b><p>Recent work continues to widen the picture. The 2021 Chahak study showed that Persian crucible steelmakers used chromium centuries before modern alloy steels. A 2026 review by Chakravarty, Mondal and Mishra in the Indian Journal of History of Science surveys wootz production in India and argues for more systematic study of excavated crucibles and ingots.</p></aside></section><section class="wsec" id="damascus-steel-s8"><h3 class="wsec-h"><span class="wsec-n">08</span>What we still do not know</h3><p>The physics of the pattern is well understood, which is why the mystery level here is low. The open questions are historical. When exactly did crucible steelmaking begin? Kodumanal in Tamil Nadu, occupied from about the 3rd century BCE to the 3rd century CE, offers promising but still preliminary evidence. Were Indian, Sri Lankan and Central Asian crucible traditions invented separately or connected by trade? Which ore bodies supplied the vanadium, and did smiths recognise good sources by experience?</p><p>There is also the question of how much smiths understood. They certainly knew which cakes worked and which forging rhythm brought the pattern out, and some added ingredients on purpose, as the Chahak chromium shows. But they worked without any concept of carbides, dendrites or parts per million. Their knowledge lived in hands, eyes and apprenticeship, and that is exactly the kind of knowledge that can disappear within a generation.</p><blockquote class="wpull"><p>The secret was never one ingredient. It was an entire supply chain, from ore to crucible to hammer, and it broke.</p></blockquote><p>Stand in front of a watered blade in a museum case and you are looking at the fingerprints of that chain: a South Indian ore, a sealed clay pot, a long voyage west and hundreds of patient hammer blows at a dull red heat.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">300 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Possible early crucible processes at Kodumanal, Tamil Nadu (evidence still preliminary)</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">600 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Crucible steel made in Sri Lanka&#x27;s Knuckles range and at Yodhawewa (6th–10th centuries)</span></li><li class="wtl-use" style="--i:2"><span class="wtl-y">850 CE</span><span class="wtl-k">In use</span><span class="wtl-t">Al-Kindi classifies swords by steel and pattern; crucible steel made at Merv</span></li><li class="wtl-use" style="--i:3"><span class="wtl-y">1040 CE</span><span class="wtl-k">In use</span><span class="wtl-t">Al-Biruni describes crucible steel and a smith called Damasqui</span></li><li class="wtl-build" style="--i:4"><span class="wtl-y">1100 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Chahak, Iran: crucible steel with about 1% chromium</span></li><li class="wtl-loss" style="--i:5"><span class="wtl-y">1750 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Finest watered blades end; quality declines</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">1819 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Faraday and Stodart analyse wootz and wrongly credit aluminium</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">1841 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Pavel Anosov reproduces patterned &#x27;bulat&#x27; steel in Russia</span></li><li class="wtl-loss" style="--i:8"><span class="wtl-y">1903 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Last eyewitness account of crucible steelmaking in Sri Lanka (Coomaraswamy)</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">1998 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Verhoeven, Pendray and Dauksch show trace vanadium drives the banding</span></li><li class="wtl-study" style="--i:10"><span class="wtl-y">2006 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Reibold&#x27;s team reports carbon nanotubes in a 17th-century sabre</span></li><li class="wtl-study" style="--i:11"><span class="wtl-y">2021 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Chahak chromium steel published</span></li></ol><figure class="wbars"><h4 class="wx-title">Vanadium in genuine wootz blades compared with the banding threshold</h4><div class="wb-r" style="--w:14.8%;--i:0"><div class="wb-l">Approximate threshold for banding<small>Verhoeven&#x27;s estimate</small></div><div class="wb-t"><i></i><span>40 ppm</span></div></div><div class="wb-r" style="--w:18.5%;--i:1"><div class="wb-l">Zschokke sword 9<small>band spacing 50 µm</small></div><div class="wb-t"><i></i><span>50 ppm</span></div></div><div class="wb-r" style="--w:53.7%;--i:2"><div class="wb-l">Zschokke sword 7<small>band spacing 42 µm</small></div><div class="wb-t"><i></i><span>145 ppm</span></div></div><div class="wb-r" style="--w:100.0%;--i:3"><div class="wb-l">Zschokke sword 10<small>band spacing 46 µm</small></div><div class="wb-t"><i></i><span>270 ppm</span></div></div><figcaption>Source: Verhoeven, Pendray and Dauksch 1998, JOM 50(9), analyses of swords first studied by Zschokke in 1924</figcaption></figure><h3 class="sub-h wsub">The big debates</h3><div class="debate"><p class="debate-q">Do carbon nanotubes explain the blades&#x27; pattern or strength?</p><div class="sides"><div class="side"><b>Yes, they are part of the answer</b><span>Reibold et al. (2006) reported multiwalled carbon nanotubes and cementite nanowires in a 17th-century sabre and suggested they may help explain the banding and the steel&#x27;s properties.</span></div><div class="side"><b>No, not on present evidence</b><span>The pattern is fully accounted for by micrometre-scale carbide bands reproduced in modern experiments; the nanotube result comes from one sample, and Verhoeven doubted any role in the banding.</span></div></div><p class="debate-why"><b>The bold claim:</b> Medieval smiths used nanotechnology, and nanotubes are the secret of Damascus steel.</p><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The nanotube observation is real and worth replicating, but no study has linked it to the pattern, hardness or toughness of wootz blades. The banding mechanism is explained and reproduced without it, and the smiths had no way to know nanostructures existed, so calling it deliberate nanotechnology goes beyond the evidence.</p></div><div class="debate"><p class="debate-q">Why did the art of watered steel fade after about 1750?</p><div class="sides"><div class="side"><b>Ore ran out</b><span>Verhoeven and Pendray argue the Indian ores carrying the right trace elements were exhausted or became inaccessible, and later ores lacked them.</span></div><div class="side"><b>Markets and craft collapsed</b><span>Cheap imported steel, firearms and colonial-era disruption undermined village crucible industries and apprenticeship chains.</span></div></div><p class="debate-why"><b>The bold claim:</b> The loss of watered steel was caused by exhaustion of trace-element-rich ores combined with the loss of craft knowledge.</p><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The impurity mechanism makes ore chemistry a genuine bottleneck, and the timing fits the decline of Indian crucible industries. But nobody has yet traced specific ore bodies to specific blades, and economic and political changes almost certainly played a part, so this remains a well-grounded explanation rather than a settled one.</p></div><details class="srcs"><summary>Sources for this deep dive (13)</summary><ol><li>Verhoeven, J. D., Pendray, A. H. &amp; Dauksch, W. E. (1998). The key role of impurities in ancient Damascus steel blades. JOM 50(9): 58–64. <a href="https://doi.org/10.1007/s11837-998-0419-y" target="_blank" rel="noopener">doi:10.1007/s11837-998-0419-y</a></li><li>Verhoeven, J. D. (2001). The mystery of Damascus blades. Scientific American 284(1): 74–79. <a href="https://doi.org/10.1038/scientificamerican0101-74" target="_blank" rel="noopener">doi:10.1038/scientificamerican0101-74</a></li><li>Reibold, M., Paufler, P., Levin, A. A., Kochmann, W., Pätzke, N. &amp; Meyer, D. C. (2006). Carbon nanotubes in an ancient Damascus sabre. Nature 444: 286. <a href="https://doi.org/10.1038/444286a" target="_blank" rel="noopener">doi:10.1038/444286a</a></li><li>Reibold, M. et al. (2009). Discovery of nanotubes in ancient Damascus steel. In Physics and Engineering of New Materials (eds Do Tran Cat, A. Pucci &amp; K. Wandelt), Springer, 305–310. <a href="https://doi.org/10.1007/978-3-540-88201-5_35" target="_blank" rel="noopener">doi:10.1007/978-3-540-88201-5_35</a></li><li>Chemical &amp; Engineering News (2006). Ancient steel&#x27;s surprise ingredient (news report including comments by J. D. Verhoeven).</li><li>Feuerbach, A. (2006). Crucible Damascus steel: a fascination for almost 2,000 years. JOM 58(5): 48–50. <a href="https://doi.org/10.1007/s11837-006-0023-y" target="_blank" rel="noopener">doi:10.1007/s11837-006-0023-y</a></li><li>Juleff, G. (1996). An ancient wind-powered iron smelting technology in Sri Lanka. Nature 379: 60–63. <a href="https://doi.org/10.1038/379060a0" target="_blank" rel="noopener">doi:10.1038/379060a0</a></li><li>Juleff, G. (2015). Crucible steel at Hattota Amune, Sri Lanka, in the first millennium AD: archaeology and contextualisation. In Metals and Civilizations (eds S. Srinivasan, S. Ranganathan &amp; A. Giumlia-Mair), National Institute of Advanced Studies, Bangalore, 78–86.</li><li>Srinivasan, S. &amp; Ranganathan, S. (2004). India&#x27;s Legendary Wootz Steel: An Advanced Material of the Ancient World. National Institute of Advanced Studies and Indian Institute of Science, Bangalore.</li><li>Alipour, R., Rehren, Th. &amp; Martinón-Torres, M. (2021). Chromium crucible steel was first made in Persia. Journal of Archaeological Science 127: 105224. <a href="https://doi.org/10.1016/j.jas.2020.105224" target="_blank" rel="noopener">doi:10.1016/j.jas.2020.105224</a></li><li>Verhoeven, J. D., Pendray, A. H. &amp; Dauksch, W. E. (2004). The continuing study of Damascus steel: bars from the Alwar armory. JOM 56(9): 17–20. <a href="https://doi.org/10.1007/s11837-004-0193-4" target="_blank" rel="noopener">doi:10.1007/s11837-004-0193-4</a></li><li>Chakravarty, S., Mondal, S. &amp; Mishra, D. P. (2026). A critical review on wootz steel of India. Indian Journal of History of Science 61(1): 88–107. <a href="https://doi.org/10.1007/s43539-026-00207-5" target="_blank" rel="noopener">doi:10.1007/s43539-026-00207-5</a></li><li>Thomas, L. (2018). Five myths about Damascus steel. Knife Steel Nerds (review of historical and experimental literature).</li></ol></details><aside class="rc-cite" data-v="marvels" data-id="marvel-damascus-steel" data-t="Damascus (wootz) steel"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Damascus (wootz) steel</i>. <span class="cite-u">https://residualcontinuum.com/#marvels/marvel-damascus-steel</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="marvel-greek-fire-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="MadridSkylitzesFol34v.jpg" data-cap="Greek fire in the Madrid Skylitzes" data-big><figcaption></figcaption></figure><div class="sh-k">Constantinople and the Byzantine fleets</div><h2 class="sh-t" id="marvel-greek-fire-st" tabindex="-1">Greek fire</h2><p class="sh-s">A burning liquid sprayed from bronze tubes on warships saved Constantinople, then vanished so completely that its recipe is still unknown.</p><div class="sh-v"><span class="vstamp vstamp--mys">Mystery <span class="pips" role="img" aria-label="Mystery level 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span></span></div></div><div class="wquick"><h3 class="sub-h">The quick read</h3><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="672" >672</b><span class="ctr-u"> CE</span></div><div class="ctr-l">Kallinikos brings his &#x27;sea fire&#x27; to the Byzantines</div><div class="ctr-c">Theophanes, Chronographia</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="15" >15</b><span class="ctr-u"> m</span></div><div class="ctr-l">range of the burning jet in the 2002 reconstruction</div><div class="ctr-c">Haldon 2006</div></div><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="1000" >1,000</b><span class="ctr-u"> °C</span></div><div class="ctr-l">flame temperature reached in the reconstruction</div><div class="ctr-c">Haldon 2006</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="300" >300</b><span class="ctr-u"> men</span></div><div class="ctr-l">crew of a heavy dromon: 230 rowers and 70 marines</div><div class="ctr-c">Constantine VII, De ceremoniis; Pryor and Jeffreys 2006</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="31" >31</b><span class="ctr-u"> m</span></div><div class="ctr-l">estimated length of a 10th-century bireme dromon</div><div class="ctr-c">Pryor and Jeffreys 2006</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="0" >0</b><span class="ctr-u"> recipes</span></div><div class="ctr-l">surviving Byzantine recipes for the fire</div><div class="ctr-c">Haldon 2006; Partington 1960</div></div></div><div class="stats"><div><b>Kallinikos, an artificer from Heliopolis in Syria (Theophanes)</b><span>Credited inventor</span></div><div><b>Arab attacks on Constantinople, 670s CE</b><span>First recorded use</span></div><div><b>&#x27;sea fire&#x27;, &#x27;liquid fire&#x27;, &#x27;prepared fire&#x27;, &#x27;Roman fire&#x27;</b><span>Byzantine names</span></div><div><b>a bronze-clad siphon in the prow of a dromon; later also hand-held siphons and grenades</b><span>Delivery</span></div><div><b>c. 15 m (Haldon&#x27;s 2002 experiment)</b><span>Reconstructed range</span></div><div><b>over 1,000 °C</b><span>Reconstructed flame</span></div><div><b>none</b><span>Surviving recipe</span></div><div><b>light crude oil from the Black Sea and Caucasus region, perhaps thickened with resins</b><span>Probable base</span></div></div><p>No recipe survives, so everything here is inference from texts and experiments. Byzantine writers describe a liquid kept in the ships, heated, and projected through a bronze tube called a siphon, which could set enemy ships alight and kept burning on the water. John Haldon and Maurice Byrne proposed in 1977 that crude oil was heated in a sealed bronze tank, pressurised by a force pump, released through a valve and lit at the nozzle by a flame. In 2002 Haldon, with Andrew Lacey and Colin Hewes, built a working version with a double-cylinder bronze pump and light crude oil, and it threw a burning jet about 15 m.</p><div class="flip" id="marvel-greek-fire-flip"><div class="flip-in"><div class="flip-f"><b>The myth</b><p>Greek fire was a miracle chemical that water could not put out, perhaps an early napalm or gunpowder, and modern science has no idea what it was.</p></div><div class="flip-b"><b>The reality</b><p>Most historians think it was a petroleum-based liquid, perhaps thickened with resins, projected by a heated, pressurised siphon. That explains fire on water, a jet of flame and the thick smoke the sources describe. Sources say sand, strong vinegar or old urine could put it out. Gunpowder and saltpetre were unknown in the Mediterranean at the time. The exact recipe and apparatus remain genuinely unknown, and every reconstruction is an informed hypothesis.</p></div></div><button type="button" class="flip-btn" aria-pressed="false" onclick="flip('marvel-greek-fire-flip',this)">Flip it</button></div><div class="twist"><b>Wow</b><p>The secret was guarded so tightly, as an imperial monopoly on both the recipe and the trained crews, that the Byzantines themselves seem to have lost it before the empire fell.</p></div><div class="wmys"><span>Mystery meter</span><span class="pips" role="img" aria-label="Mystery level 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><small>Real open questions</small></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">10 min read · 2,117 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Greek fire"><button type="button" class="wtoc-i" data-go="greek-fire-s1">Fire that walked on water</button><button type="button" class="wtoc-i" data-go="greek-fire-s2">The refugee with a recipe</button><button type="button" class="wtoc-i" data-go="greek-fire-s3">Saving Constantinople, twice</button><button type="button" class="wtoc-i" data-go="greek-fire-s4">How the siphon may have worked</button><button type="button" class="wtoc-i" data-go="greek-fire-s5">Testing the idea with real fire</button><button type="button" class="wtoc-i" data-go="greek-fire-s6">What was in the tank?</button><button type="button" class="wtoc-i" data-go="greek-fire-s7">A secret too well kept</button><button type="button" class="wtoc-i" data-go="greek-fire-s8">What is still unknown</button></nav></div><section class="wsec" id="greek-fire-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Fire that walked on water</h3><p>Imagine rowing towards Constantinople in the 670s. The city&#x27;s sea walls are ahead, and a line of long, low warships slides out to meet you. At the bow of each, under a raised platform, a crew member aims a bronze tube. There is a roar, a gout of thick black smoke, and a jet of liquid fire arcs across the water, sticks to your hull and keeps burning on the sea around you. Throwing water on it only seems to spread it.</p><p>That is roughly what Byzantine and Arab sources describe, and it is why this weapon became a legend. Western crusaders later called it Greek fire. The Byzantines, who thought of themselves as Romans, had plainer names: sea fire, liquid fire, prepared fire, Roman fire.</p><blockquote class="wpull"><p>For five centuries, the most feared weapon at sea was a liquid, a pump and a crew trained to keep a secret.</p></blockquote><p>The mystery is not whether it existed. Dozens of passages across five centuries show that it did. The mystery is what exactly was in the tank, how it was pushed through the tube, and how a state could guard the answer so well that the answer died with it.</p></section><section class="wsec" id="greek-fire-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The refugee with a recipe</h3><p>The story begins with a single line in the Chronographia of Theophanes the Confessor, written in the early 9th century from older sources. Under the year corresponding to about 672 CE, he records the arrival of a refugee from the eastern provinces then under Arab rule.</p><blockquote class="quote"><p>At that time Kallinikos, an artificer from Heliopolis, fled to the Romans. He had devised a sea fire which ignited the Arab ships and burned them with all hands.</p><cite>Theophanes, Chronographia (entry for c. 672 CE), trans. Harry Turtledove (1982)</cite></blockquote><p>Context explains why a single engineer mattered so much. In the 630s and 640s the eastern Roman Empire had lost Syria, Palestine and Egypt, its richest provinces, to the new Arab state. By the 650s Arab fleets built in Syrian and Egyptian shipyards were raiding Cyprus, Rhodes and the Aegean coasts, and in 655 they defeated the imperial navy off the coast of Lycia. For the first time in centuries, Constantinople faced a serious enemy at sea. A weapon that could burn ships before they came alongside was worth a fortune.</p><p>Heliopolis here is the Syrian city now called Baalbek, not the one in Egypt. Theophanes calls Kallinikos an architect or artificer, a technical man, and the timing was perfect. The Umayyad Caliphate had been pushing into the Aegean and was preparing to attack the imperial capital itself.</p><p>It is worth being cautious about the inventor story. Incendiary weapons were old news: Assyrians, Greeks and Romans had all thrown burning pitch, sulphur and oil. Petroleum seeps were known around the Black Sea and in Mesopotamia. What seems to have been new was the combination of a particular fuel with a way of projecting it as a pressurised jet from a ship. Kallinikos may have brought the key idea, or later tradition may have pinned a gradual development on one memorable name.</p></section><section class="wsec" id="greek-fire-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Saving Constantinople, twice</h3><p>According to Theophanes, the emperor Constantine IV had large &#x27;cauldron-bearing&#x27; warships equipped with siphons, and fire played a decisive part in repelling Arab fleets that blockaded the city from a base at Cyzicus in the 670s. The traditional account describes a siege lasting from 674 to 678. Some historians, notably Marek Jankowiak, now argue that the &#x27;first siege&#x27; is a later reshaping of a shorter blockade in the late 660s. Either way, the fire entered the record as a city-saving weapon.</p><p>The second great test came in 717–718, when a huge Arab army and fleet besieged Constantinople by land and sea. Theophanes describes Byzantine ships attacking the enemy fleet with fire siphons and burning many vessels. Combined with a harsh winter, disease, supply failures and Bulgar attacks on the besiegers, the defence held, a turning point in the history of the eastern Mediterranean.</p><figure class="photo wimg" data-img="Greekfire-madridskylitzes1.jpg" data-cap="A Byzantine ship turns fire on a rebel vessel, from the 12th-century Madrid manuscript of John Skylitzes&#x27; chronicle. The illustration was made centuries after the events it shows."><figcaption></figcaption></figure><p>Later uses are scattered through the chronicles: against the rebel Thomas the Slav in the early 820s, against a Rus&#x27; fleet led by Prince Igor that attacked the Bosporus in 941, and against a Pisan fleet around 1099, described by the princess and historian Anna Komnene. By then the weapon had acquired theatre as well as power.</p><blockquote class="quote"><p>And the fire which was to be directed against the enemy through tubes he made to pass through the mouths of the beasts, so that it seemed as if the lions and the other similar monsters were vomiting the fire.</p><cite>Anna Komnene, Alexiad XI.10, trans. Elizabeth A. S. Dawes (1928)</cite></blockquote></section><section class="wsec" id="greek-fire-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>How the siphon may have worked</h3><p>The Byzantine word siphōn simply means a tube, and the sources never draw the machine. What they do give are clues. Emperor Leo VI&#x27;s military handbook, the Taktika, written around 900, instructs that a dromon should carry a siphon in its prow, sheathed in bronze, to shoot the prepared fire at the enemy, and it mentions a newer hand-held version. Other passages mention cauldrons, heat and the roar and smoke of discharge.</p><figure class="wx wx--steps" id="greek-fire-f1" data-n="6"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">How the siphon may have worked (reconstruction)</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How the siphon may have worked (reconstruction)"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" class="wx-svg" role="img" aria-labelledby="greek-fire-f1-t"><title id="greek-fire-f1-t">How a Greek fire siphon may have worked: a reconstruction</title><defs><marker id="greek-fire-f1-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1,1 L9,5 L1,9" class="wx-line"/></marker></defs><text x="20" y="24" class="wx-t-cap">Reconstruction after Haldon and Byrne 1977, Haldon 2006</text><t "wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button><button type="button" class="wx-dot" data-k="6" aria-label="Step 6" aria-pressed="false">6</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 6.</b> Load: crude oil, perhaps thickened with resin, fills a sealed bronze tank.</p><ol class="wx-steplist"><li>Load: crude oil, perhaps thickened with resin, fills a sealed bronze tank.</li><li>Heat: a small brazier warms the tank, thinning the oil and raising its vapour pressure.</li><li>Pump: two crewmen work a double-cylinder bronze force pump to build pressure.</li><li>Release: a valve opens and the oil surges along the pipe to the swivelling nozzle.</li><li>Ignite: a burning match at the nozzle lights the stream as it leaves.</li><li>Fire: a burning jet reaches about 15 m (in the 2002 test), spreading flame across the water.</li></ol><figcaption>A proposed apparatus based on Haldon and Byrne (1977) and Haldon&#x27;s 2002 working model. Dashed outlines mark parts whose form is guessed. <span class="wx-src">Based on: Haldon and Byrne 1977; Haldon 2006 (2002 reconstruction with A. Lacey and C. Hewes); Leo VI, Taktika 19. Layout and proportions are a reconstruction, not an excavated object.</span></figcaption><p class="vh">A side view of a reconstructed fire siphon. On the left, a sealed bronze tank sits over a small brazier. A two-cylinder force pump with a rocking handle feeds air or oil pressure into the tank. A pipe leads from the tank through a valve to a long bronze tube and a swivelling nozzle, where a small burning match ignites the liquid. In the final step a jet of burning oil arcs to the right, about 15 metres long in the reconstruction, drawn shortened. Labels mark each part as a reconstruction.</p></figure><p>The ship mattered as much as the pump. The standard 10th-century warship was the dromon, a long, narrow galley that John Pryor and Elizabeth Jeffreys reconstruct at about 31–32 m, with two banks of oars, 25 oars per bank on each side. A heavy dromon carried around 230 rowers and 70 marines. The main siphon sat in the bow under a raised fighting platform, and large ships may have carried extra siphons amidships. Low, fast and packed with men, the dromon could close to within range, fire, and back off before the enemy could grapple.</p><p>From these clues, John Haldon and Maurice Byrne argued in 1977 for a clever but physically simple system. Put crude oil in a sealed bronze tank. Warm it over a small fire so it thins and its vapour pressure rises. Add pressure with a force pump, the same kind of bronze pump Romans used for fire-fighting and water supply. Open a valve, and the liquid rushes along a pipe to a swivelling nozzle, where a small flame lights it as it leaves.</p><p>Every part of that system was within Byzantine reach. Double-cylinder force pumps are described by Hero of Alexandria and survive archaeologically from Roman sites. Bronze casting, valves and soldered pipes were ordinary technology. The genius, if the hypothesis is right, lay in combining them, and in training crews who could handle a pressurised tank of hot oil in the bow of a pitching wooden ship without incinerating themselves.</p><aside class="wcall"><b>How do we know?</b><p>We do not know for certain. The mechanism is reconstructed from a small set of texts, especially Leo VI&#x27;s Taktika, Theophanes, Anna Komnene and scattered references to cauldrons and bronze tubes, plus knowledge of Roman pumps. No siphon has ever been excavated. That is why the drawings here are marked as reconstructions, with dashed outlines where the design is guessed.</p></aside></section><section class="wsec" id="greek-fire-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Testing the idea with real fire</h3><p>In 2002, for a television documentary, Haldon worked with engineers Andrew Lacey and Colin Hewes to build a full working model. It had a cast bronze double-cylinder force pump worked by two people, an oil reservoir, bronze piping, simple one-way flap valves and a swivelling nozzle. Wooden pistons were wrapped in hemp and flax and sealed with tallow. For fuel they used light crude oil from Azerbaijan, geologically similar to sources the Byzantines could have reached around the Black Sea and Caucasus.</p><p>It worked. The apparatus threw a jet of burning oil about 15 m, with flame temperatures reported above 1,000 °C, far enough to reach a neighbouring ship without the two hulls touching. Smoke billowed and the burning liquid spread across water, just as the sources describe. The team also learned what could go wrong: the connecting pipes had to be protected, for instance by packing them in sand, so that flames could not creep back towards the tank.</p><figure class="wx wx--static" id="greek-fire-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">A dromon and the reach of its fire</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="A dromon and the reach of its fire"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" class="wx-svg" role="img" aria-labelledby="greek-fire-f2-t"><title id="greek-fire-f2-t">A dromon and the reach of its fire</title><text x="20" y="24" class="wx-t-cap">Reconstructed profile · heights and rig approximate</text><rect x="0" y="262" width="720" height="168" class="wx-water wx-o40"/><path d="M0,262 L720,262" class="wx-line wx-s2 wx-o60"/><path d="M10,276 L710,276" class="wx-flow wx-s2 wx-o40"/><path d="M36,210 Q42,234 66,236 L403.5
