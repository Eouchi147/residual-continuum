anchor="end">Right team pulls</text><text x="352" y="128" class="wx-t-s" text-anchor="end">the other side swings forward</text><path d="M138,352 q-8,-14 -18,-2" class="wx-hl" marker-end="url(#moai-f1-ah)"/><text x="138" y="376" class="wx-t-s" text-anchor="middle">left side lifts</text></g><g class="wx-st" data-s="1"><g transform="rotate(10 520 360)"><path d="M491,360 L493,262 C493,244 496,230 501,218 L502,172 C502,162 509,157 517,157 L529,159 L534,172 L543,178 L538,187 L541,200 L534,210 L536,226 C548,240 553,272 551,302 L549,360 Z" class="wx-stone2 wx-edge"/><path d="M513,192 L527,192 M504,178 l0,24 M506,276 C516,300 526,312 540,316" class="wx-thin"/></g><path d="M520,360 L520,170" class="wx-guide"/><path d="M520,190 A170,170 0 0,1 549.5,192.6" class="wx-dim"/><text x="600" y="100" class="wx-t-b">Leans forward</text><text x="600" y="116" class="wx-t-s">c. 5–15° on road moai</text><path d="M598,106 C570,110 548,140 553.5,188.6" class="wx-thin"/><circle cx="430.0" cy="288.0" r="6.0" class="wx-inkfill"/><path d="M430.0,295.0 L424.0,326.0 M424.0,326.0 L417.0,360.0 M424.0,326.0 L433.0,360.0 M429.0,304.0 L408.0,310.0" class="wx-line"/><path d="M533.2,181.6 C470,210 450,260 408.0,310.0" class="wx-line wx-s1"/><text x="400" y="386" class="wx-t-s">rear team</text><text x="400" y="400" class="wx-t-s">steadies and brakes</text><path d="M600,420 L690,420" class="wx-line" marker-end="url(#moai-f1-ah)"/><text x="600" y="410" class="wx-t-s">direction of travel</text><path d="M626,178 L626,238 C666,238 684,222 684,208 C684,194 666,178 626,178 Z" class="wx-stone wx-edge"/><path d="M686,208 l12,0" class="wx-thin" marker-end="url(#moai-f1-ah)"/><text x="600" y="166" class="wx-t-s">base, seen from above:</text><text x="600" y="258" class="wx-t-b">D-shaped base</text><text x="600" y="274" class="wx-t-s">wide, curved at the front</text></g><g class="wx-st wx-hide" data-only="3"><circle cx="541.9" cy="270.4" r="5" class="wx-accfill wx-pulse"/><path d="M541.9,270.4 L541.9,356" class="wx-hl" stroke-dasharray="3 4"/><text x="533.9" y="262.4" class="wx-t-s wx-halo" text-anchor="end">centre of mass</text><path d="M560,352 C574,338 592,338 606,352" class="wx-hl" marker-end="url(#moai-f1-ah)"/><text x="600" y="306" class="wx-t-b">A step forward</text><text x="600" y="322" class="wx-t-s">tipped on one edge, the</text><text x="600" y="336" class="wx-t-s">lean swings it ahead</text></g><g class="wx-st" data-s="5"><rect x="20" y="440" width="560" height="50" rx="4" class="wx-sand wx-edge-soft"/><path d="M20,465 L580,465" class="wx-guide"/><polyline points="40,457 80,473 120,457 160,473 200,457 240,473 280,457 320,473 360,457 400,473 440,457 480,473 520,457" class="wx-hl wx-draw" pathLength="1" style="--d:1"/><ellipse cx="40" cy="457" rx="5" ry="3.5" class="wx-accfill"/><ellipse cx="80" cy="473" rx="5" ry="3.5" class="wx-accfill"/><ellipse cx="120" cy="457" rx="5" ry="3.5" class="wx-accfill"/><ellipse cx="160" cy="473" rx="5" ry="3.5" class="wx-accfill"/><ellipse cx="200" cy="457" rx="5" ry="3.5" class="wx-accfill"/><ellipse cx="240" cy="473" rx="5" ry="3.5" class="wx-accfill"/><ellipse cx="280" cy="457" rx="5" ry="3.5" class="wx-accfill"/><ellipse cx="320" cy="473" rx="5" ry="3.5" class="wx-accfill"/><ellipse cx="360" cy="457" rx="5" ry="3.5" class="wx-accfill"/><ellipse cx="400" cy="473" rx="5" ry="3.5" class="wx-accfill"/><ellipse cx="440" cy="457" rx="5" ry="3.5" class="wx-accfill"/><ellipse cx="480" cy="473" rx="5" ry="3.5" class="wx-accfill"/><ellipse cx="520" cy="457" rx="5" ry="3.5" class="wx-accfill"/><path d="M594,440 L594,490 M588,440 h12 M588,490 h12" class="wx-dim"/><text x="606" y="462" class="wx-t-n">c. 4.5 m</text><text x="606" y="478" class="wx-t-s">concave road</text><text x="20" y="432" class="wx-t-s">zigzag progress along a moai road, seen from above</text></g><g class="wx-st wx-hide" data-only="5"><text x="20" y="518" class="wx-t-b">2012 field test: a 4.35 t replica, 18 people, 100 m in c. 40 minutes</text><text x="20" y="536" class="wx-t-s">ropes: four people on each side rope, ten on the rear rope (Lipo, Hunt and Rapu Haoa 2013)</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Three ropes are tied round the head: one to each side team and one to a team behind.</p><ol class="wx-steplist"><li>Three ropes are tied round the head: one to each side team and one to a team behind.</li><li>The left team pulls: the statue rocks onto its left edge and the right side lifts off the ground.</li><li>Because the statue leans forward on its D-shaped base, the lifted side swings ahead: a step.</li><li>The right team pulls: the statue rocks the other way and the other side steps forward.</li><li>Repeat: the statue zigzags along a concave road about 4.5 m wide; 18 people moved a 4.35 t replica 100 m in about 40 minutes.</li></ol><figcaption>Front and side views of the &#x27;walking&#x27; method tested by Lipo, Hunt and Rapu Haoa: ropes at both sides and behind, alternate rocking, and a forward lean that turns each rock into a step. <span class="wx-src">Based on: Lipo, Hunt &amp; Rapu Haoa 2013 (experiment, rope teams 4 + 4 + 10); Lipo &amp; Hunt 2025 (lean of c. 5–15°, D-shaped bases, road width c. 4.5 m). People roughly to scale for a c. 4 m statue.</span></figcaption><p class="vh">Two views of a moai being moved upright. Front view: an upright moai with ropes tied round its head running to a left team and a right team, and a third rope running back. When the left team pulls, the statue rocks onto its left edge and its right side lifts; when the right team pulls, the other side lifts and swings forward. Side view: the statue leans forward by about 5 to 15 degrees on a wide D-shaped base, with a rear team holding a rope to steady it; the centre of mass lies ahead of the base so each rock becomes a step. A plan view shows zigzag steps along a concave road about 4.5 metres wide.</p></figure><p>It only works because of the statue&#x27;s shape. Road moai, the ones left along the ancient routes from the quarry, have wide, D-shaped bases with a curved front edge, and they lean forward, by about 5 to 15 degrees from vertical. The lean puts the centre of mass ahead of the base, so each sideways rock tips the statue into a small step. Statues standing on the ahu look different: their bases were later reshaped so that they stand straight.</p></section><section class="wsec" id="moai-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Roads built for walking</h3><p>In 2025 Lipo and Hunt published a long reply to their critics in the Journal of Archaeological Science. They used 3D models of 962 moai and looked closely at the 62 statues found along the roads. The roads themselves, which run for more than 25 km out from Rano Raraku, are about 4.5 m wide and concave in cross-section, a little like a shallow gutter. A rocking statue walking along a concave road tends to drift back to the middle, which is exactly what you want when moving several tonnes of top-heavy stone.</p><p>Fallen road moai also fit. On downhill stretches most lie face down, as if they toppled forward; on uphill stretches most lie on their backs, as if they tipped backwards. Lipo and Hunt estimate speeds of roughly 0.3 km per hour and a journey of about 10 km in five or six working days for a typical statue. They argue that the evidence of shape, roads, fallen statues and experiment, together with the oral tradition, all points the same way.</p><p>The walking method also changes the labour question. Moving a statue upright takes no rollers and very little wood beyond rope fibre, and a crew of a few dozen people could do it in days rather than weeks. That fits a population of a few thousand far better than the old image of vast armies dragging statues across a stripped island. It also helps explain why the roads mattered so much: a smooth, gently concave track was the one piece of infrastructure the method really needed.</p><aside class="wcall"><b>How do we know?</b><p>Four independent lines of evidence support walking: the physical form of road moai (wide D-shaped bases and a forward lean); the shape of the roads; the positions of statues that fell in transit; and full-scale experiments with replicas. Critics, including researchers who have championed sledges or log rails, point out that a successful experiment shows a method was possible, not that it was the only one used, and that the largest statues pose problems for every method.</p></aside></section><section class="wsec" id="moai-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Hats of red stone</h3><p>Many moai on the ahu once wore pukao, massive cylinders of red volcanic scoria from the small crater of Puna Pau, about 12 km from Rano Raraku. They are often called hats, though many scholars read them as topknots of hair, and the colour red was sacred across Polynesia. The biggest reach about 2 m across and weigh up to around 13 t.</p><p>Getting a 13 t cylinder onto the head of a statue 10 m tall sounds absurd. In 2018 Sean Hixon, Carl Lipo, Ben McMorran and Terry Hunt studied the surviving pukao and argued that they were rolled from Puna Pau as rough cylinders, finished near the platforms, and rolled up earthen ramps to the top of the standing statues using a rope technique called parbuckling. The middle of a long rope is fixed at the top of the ramp, the two ends are wrapped around the cylinder, and pulling the ends makes the cylinder roll up the slope. By their calculations fewer than 15 people could move even the largest pukao this way.</p></section><section class="wsec" id="moai-s5b"><h3 class="wsec-h"><span class="wsec-n">06</span>Standing up, and opening their eyes</h3><p>Arriving at the coast was not the end of the journey. A statue had to be raised onto its ahu, a long platform of fitted stones, often with a paved ramp sloping down on the landward side and burial chambers inside. How it was lifted is less debated than how it travelled, because the method has been reproduced. In the mid-1950s, during Thor Heyerdahl&#x27;s expedition, a group of Rapanui men re-erected a toppled moai at Anakena using wooden poles as levers and stones packed underneath, raising it a few centimetres at a time until it tipped upright. Their method needed no machines, only patience, timber poles and a growing pile of rocks.</p><p>Once on the ahu, the statue changed. Its base was trimmed so that it stood straight rather than leaning forward, and, on many platform moai, deep eye sockets were carved into the face. Excavations at Anakena in the late 1970s recovered fragments of eyes made of white coral with pupils of dark stone, suggesting that some statues were given inlaid eyes at the moment they became active ancestors. Road moai, abandoned on the way, never received eye sockets.</p><p>This difference matters for the walking argument. It means the island has two kinds of moai with different shapes: the ones in transit, shaped for moving, and the ones in place, reshaped for standing and seeing. The same statue could be both, at different moments of its life.</p><figure class="photo wimg" data-img="Moai Rano raraku.jpg" data-cap="A moai head at Rano Raraku, buried to the shoulders by centuries of eroded soil from the quarry slope."><figcaption></figcaption></figure></section><section class="wsec" id="moai-s6"><h3 class="wsec-h"><span class="wsec-n">07</span>The collapse that wasn&#x27;t</h3><p>For decades, Rapa Nui was the world&#x27;s favourite cautionary tale. Made famous by Jared Diamond&#x27;s book Collapse (2005), the story went like this: islanders chopped down every tree to move statues, their population soared to 15,000 or more, then crashed into famine, war and cannibalism before Europeans arrived in 1722. The moai became symbols of self-destruction.</p><p>Recent evidence tells a different story. In June 2024, Dylan Davis and colleagues mapped rock gardens, the stone mulches the islanders used to grow sweet potatoes in poor, windy soils, using shortwave infrared satellite imagery and machine learning checked against ground surveys. They found rock gardens covering less than 0.76 km², under half of one percent of the island, far below earlier estimates of 4.3 to 21.1 km². Their model suggests a maximum population of about 3,900, give or take 800, close to the roughly 3,000 people that early European visitors described. Critics argue the mapping misses some gardens and other ways of farming, so the exact figure is debated.</p><p>Three months later came the genomes. J. Víctor Moreno-Mayar and colleagues sequenced 15 Rapanui individuals and found no genetic bottleneck in the 1600s. The population seems to have grown steadily until the 1860s. The same genomes carry around 10 percent Native American ancestry from contact sometime between about 1250 and 1430, centuries before Columbus.</p><p>The genomes also help answer a much older question. Rapanui have long had oral histories of voyaging, and Pacific peoples were among the greatest navigators in human history. The Native American ancestry suggests that either Rapanui sailed to South America and returned, or South Americans reached the island. Either way, this remote island was not sealed off from the world. It was the easternmost point of a vast Polynesian ocean of contact.</p><aside class="wcall"><b>Fresh from the field</b><p>In 2025 Robert Stein and colleagues published a sediment record from the island&#x27;s crater lakes showing a long, persistent drought beginning in the mid-1500s. It coincides with the decline of moai building and the rise of the Birdman ritual at Orongo, which intensified around 1600 to 1650. The authors conclude that the changes do not require warfare or demographic collapse; people reorganised around a drier island.</p></aside><figure class="photo wimg" data-img="Ahu Tongariki, los 15 moais.JPG" data-cap="The fifteen moai of Ahu Tongariki, re-erected in the 1990s after a 1960 tsunami scattered the fallen statues."><figcaption></figcaption></figure></section><section class="wsec" id="moai-s7"><h3 class="wsec-h"><span class="wsec-n">08</span>What really broke Rapa Nui</h3><p>None of this means the island&#x27;s history was gentle. The palm forests did disappear, cut and burned for farmland, with seeds eaten by the Polynesian rats that arrived with the first canoes. By the time Europeans came, the statue era was winding down and the moai were gradually toppled, until by the late 1860s none stood on its ahu. Why they fell is still discussed: conflict, deliberate ritual decommissioning, earthquakes and neglect have all been proposed.</p><p>The real catastrophe came from outside. In 1862 Peruvian slave raiders seized around a third of the population. Smallpox, carried back by the few survivors who were returned, followed. By 1877 only about 111 Rapanui are reported to have remained on the island. The &#x27;ecocide&#x27; story, with its blame on the islanders, did much to hide this history of violence done to them.</p><blockquote class="wpull"><p>The mystery was never really how the moai moved. It was why outsiders found it so hard to believe the islanders&#x27; own account.</p></blockquote></section><section class="wsec" id="moai-s8"><h3 class="wsec-h"><span class="wsec-n">09</span>Myths, verdicts and open questions</h3><p>The claim that the moai could not have been moved without outside help, whether from lost continents or visitors from elsewhere, has no evidence behind it. Every stage, from quarry to road to platform to pukao, has a documented, tested method using ropes, stone tools, earth ramps and people. The question is not whether the Rapanui could move moai. It is which of several workable techniques they used, and when.</p><ul class="wlist"><li>Walking statues: strong evidence, still debated in details, especially for the largest moai.</li><li>Ecocide-driven collapse before 1722: contradicted by genomes and population estimates.</li><li>Deforestation: real, with rats and farming both playing a part.</li><li>Why the moai were toppled: still an open question.</li></ul><p>Much remains unknown. How did Rapanui society organise the labour and food for statue building? What did individual moai mean to the lineages that raised them? How exactly did the transition to the Birdman ritual unfold? These questions are increasingly studied with Rapanui researchers and communities, who have their own long knowledge of the statues.</p><p>Stand again on the slope of Rano Raraku as the Sun comes up. The unfinished giants are still in the rock. Some of their brothers are still on the roads, face down where they fell on the way to their platforms, with the D-shaped bases and forward lean of statues that were meant to walk.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">1200 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Polynesian voyagers settle Rapa Nui (approximate)</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">1250 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Moai carving under way at Rano Raraku (approximate)</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">1340 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Contact with Native Americans, dated by genomes to c. 1250–1430</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">1550 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Long drought begins; moai construction declines</span></li><li class="wtl-use" style="--i:4"><span class="wtl-y">1625 CE</span><span class="wtl-k">In use</span><span class="wtl-t">Birdman ritual at Orongo intensifies (c. 1600–1650)</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">1722 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Jacob Roggeveen&#x27;s Dutch ships arrive on Easter Sunday</span></li><li class="wtl-loss" style="--i:6"><span class="wtl-y">1862 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Peruvian slave raids; epidemics follow</span></li><li class="wtl-loss" style="--i:7"><span class="wtl-y">1868 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">By now every moai on an ahu has been toppled</span></li><li class="wtl-loss" style="--i:8"><span class="wtl-y">1960 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Tsunami scatters the fallen moai of Ahu Tongariki</span></li><li class="wtl-event" style="--i:9"><span class="wtl-y">1995 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Rapa Nui National Park inscribed by UNESCO</span></li><li class="wtl-study" style="--i:10"><span class="wtl-y">2012 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Replica moai &#x27;walked&#x27; in a field experiment</span></li><li class="wtl-study" style="--i:11"><span class="wtl-y">2018 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Study shows pukao could be rolled up ramps</span></li><li class="wtl-study" style="--i:12"><span class="wtl-y">2024 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Genomes and rock-garden maps challenge the collapse story</span></li><li class="wtl-study" style="--i:13"><span class="wtl-y">2025 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">3D study of 962 moai supports the walking hypothesis</span></li></ol><figure class="wbars"><h4 class="wx-title">How many Rapanui? Estimates and counts</h4><div class="wb-r" style="--w:100.0%;--i:0"><div class="wb-l">Older &#x27;collapse&#x27; peak estimates (upper end)<small>crop-yield models</small></div><div class="wb-t"><i></i><span>17,500 people</span></div></div><div class="wb-r" style="--w:22.3%;--i:1"><div class="wb-l">Rock-garden estimate, Davis et al. 2024 (maximum)<small>±800</small></div><div class="wb-t"><i></i><span>3,900 people</span></div></div><div class="wb-r" style="--w:17.1%;--i:2"><div class="wb-l">Early European accounts (1722 onward)<small>c. 3,000–4,000</small></div><div class="wb-t"><i></i><span>3,000 people</span></div></div><div class="wb-r" style="--w:1.5%;--i:3"><div class="wb-l">After slave raids and epidemics (1877)<small>commonly cited count</small></div><div class="wb-t"><i></i><span>111 people</span></div></div><figcaption>Source: Davis et al. 2024 (Science Advances); Science News (2024) summary of earlier estimates; Binghamton University (2024); 1877 figure from standard histories</figcaption></figure><h3 class="sub-h wsub">The big debates</h3><div class="debate"><p class="debate-q">Did the moai walk?</p><div class="sides"><div class="side"><b>Yes, upright and rocking</b><span>Oral tradition; D-shaped bases and forward lean of road moai; concave roads c. 4.5 m wide; positions of fallen road statues; a 4.35 t replica moved 100 m in 40 minutes by 18 people.</span></div><div class="side"><b>Other or mixed methods</b><span>Sledge and log-rail experiments also work; experiments show what is possible, not what was actually done; the largest statues are problematic for any method.</span></div></div><p class="debate-why"><b>The bold claim:</b> Most moai were moved upright, rocked from side to side along prepared roads.</p><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Several independent lines of evidence, from statue shape and road design to fallen statues, experiments and tradition, agree with walking. Critics raise fair points about alternatives and about the giants, but no competing method explains the road moai&#x27;s shapes and fall positions as well.</p></div><div class="debate"><p class="debate-q">Did an &#x27;ecocide&#x27; collapse destroy Rapanui society before 1722?</p><div class="sides"><div class="side"><b>Yes, collapse</b><span>Deforestation, abandoned statues, and early estimates of a population of 15,000 or more that crashed before contact.</span></div><div class="side"><b>No collapse before contact</b><span>Genomes of 15 individuals show no 1600s bottleneck; rock gardens support only about 3,900 people at most; a drought record points to reorganisation, not ruin.</span></div></div><p class="debate-why"><b>The bold claim:</b> The islanders&#x27; own environmental destruction caused a population crash before Europeans arrived.</p><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Deforestation happened, but the claimed pre-contact population crash is contradicted by genetic evidence and by revised population estimates that match what Europeans saw in 1722. The demographic disaster came after 1862 with slave raids and disease. Details such as the exact population are still debated.</p></div><div class="debate"><p class="debate-q">Were the pukao rolled up ramps onto standing statues?</p><div class="sides"><div class="side"><b>Yes, parbuckled up ramps</b><span>Wear patterns and shapes of surviving pukao, remains of ramps, and physics showing 15 or fewer people could roll the largest ones.</span></div><div class="side"><b>Placed with the statue lying down</b><span>An older idea is that the pukao was fixed before the statue was raised, lifting both together.</span></div></div><p class="debate-why"><b>The bold claim:</b> Pukao were rolled up earthen ramps and placed on already-standing moai.</p><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The 2018 study fits the physical evidence and requires modest labour, but it is a reconstruction from the stones themselves. No direct record of the operation survives, and other methods cannot be fully excluded.</p></div><details class="srcs"><summary>Sources for this deep dive (12)</summary><ol><li>Lipo, C. P., Hunt, T. L. &amp; Rapu Haoa, S. (2013). The &#x27;walking&#x27; megalithic statues (moai) of Easter Island. Journal of Archaeological Science 40(6): 2859–2866. <a href="https://doi.org/10.1016/j.jas.2012.09.029" target="_blank" rel="noopener">doi:10.1016/j.jas.2012.09.029</a></li><li>Lipo, C. P. &amp; Hunt, T. L. (2025). The walking moai hypothesis: archaeological evidence, experimental validation, and response to critics. Journal of Archaeological Science 183: 106383. <a href="https://doi.org/10.1016/j.jas.2025.106383" target="_blank" rel="noopener">doi:10.1016/j.jas.2025.106383</a></li><li>Hixon, S. W., Lipo, C. P., McMorran, B. &amp; Hunt, T. L. (2018). The colossal hats (pukao) of monumental statues on Rapa Nui (Easter Island, Chile): analyses of pukao variability, transport, and emplacement. Journal of Archaeological Science. <a href="https://doi.org/10.1016/j.jas.2018.04.011" target="_blank" rel="noopener">doi:10.1016/j.jas.2018.04.011</a></li><li>Davis, D. S. et al. (2024). Island-wide characterization of agricultural production challenges the demographic collapse hypothesis for Rapa Nui (Easter Island). Science Advances 10(25): eado1459. <a href="https://doi.org/10.1126/sciadv.ado1459" target="_blank" rel="noopener">doi:10.1126/sciadv.ado1459</a></li><li>Moreno-Mayar, J. V. et al. (2024). Ancient Rapanui genomes reveal resilience and pre-European contact with the Americas. Nature 633: 389–397. <a href="https://doi.org/10.1038/s41586-024-07881-4" target="_blank" rel="noopener">doi:10.1038/s41586-024-07881-4</a></li><li>Stein, R. et al. (2025). Prolonged drought on Rapa Nui during the decline of megalithic monument construction. Communications Earth &amp; Environment 6: 865. <a href="https://doi.org/10.1038/s43247-025-02801-4" target="_blank" rel="noopener">doi:10.1038/s43247-025-02801-4</a></li><li>Diamond, J. (2005). Collapse: How Societies Choose to Fail or Succeed. New York: Viking.</li><li>Hunt, T. L. &amp; Lipo, C. P. (2011). The Statues That Walked: Unraveling the Mystery of Easter Island. New York: Free Press.</li><li>Van Tilburg, J. A. (1994). Easter Island: Archaeology, Ecology and Culture. London: British Museum Press.</li><li>Binghamton University News (2024). New methods estimate the size of Easter Island&#x27;s pre-contact population and debunk a persistent myth.</li><li>Science News (2024). A new study challenges the idea that Rapa Nui islanders caused an &#x27;ecocide&#x27;.</li><li>UNESCO World Heritage Centre. Rapa Nui National Park (inscribed 1995), property 715.</li></ol></details><aside class="rc-cite" data-v="marvels" data-id="marvel-moai" data-t="The moai of Rapa Nui (Easter Island)"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The moai of Rapa Nui (Easter Island)</i>. <span class="cite-u">https://residualcontinuum.com/#marvels/marvel-moai</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="marvel-nazca-lines-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Líneas de Nazca, Nazca, Perú, 2015-07-29, DD 52.JPG" data-cap="A Nazca geoglyph from the air" data-big><figcaption></figcaption></figure><div class="sh-k">Nazca and Palpa, Peru</div><h2 class="sh-t" id="marvel-nazca-lines-st" tabindex="-1">The Nazca Lines</h2><p class="sh-s">A hummingbird the length of a football pitch, drawn by moving stones, and 303 more figures found in one AI-assisted season.</p><div class="sh-v"><span class="vstamp vstamp--mys">Mystery <span class="pips" role="img" aria-label="Mystery level 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span></span></div></div><div class="wquick"><h3 class="sub-h">The quick read</h3><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="303" >303</b><span class="ctr-u"> figures</span></div><div class="ctr-l">new figurative geoglyphs found in the 2022–23 AI-assisted survey</div><div class="ctr-c">Sakai et al. 2024</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="430" >430</b><span class="ctr-u"> figures</span></div><div class="ctr-l">figurative geoglyphs known before, after almost a century of searching</div><div class="ctr-c">Sakai et al. 2024</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="93" >93</b><span class="ctr-u"> m</span></div><div class="ctr-l">length of the hummingbird, beak to tail</div><div class="ctr-c">published survey measurements</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="450" >450</b><span class="ctr-u"> km²</span></div><div class="ctr-l">area of the geoglyph pampas</div><div class="ctr-c">UNESCO; standard surveys</div></div><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="1300" >1,300</b><span class="ctr-u"> km</span></div><div class="ctr-l">combined length of the lines</div><div class="ctr-c">standard surveys</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="43" >43</b><span class="ctr-u"> m</span></div><div class="ctr-l">average distance of the small relief figures from ancient trails</div><div class="ctr-c">Sakai et al. 2024</div></div></div><div class="stats"><div><b>c. 450 km² of desert pampa</b><span>Area</span></div><div><b>c. 93 m beak to tail</b><span>Hummingbird</span></div><div><b>up to c. 370 m; straight lines run for kilometres</b><span>Largest figures</span></div><div><b>430 before 2022, plus 303 found in 2022–23</b><span>Figurative geoglyphs known</span></div><div><b>more than 1,300 km</b><span>Total length of lines</span></div><div><b>a few millimetres in a typical year</b><span>Rainfall</span></div><div><b>Lines and Geoglyphs of Nasca and Palpa, 1994</b><span>UNESCO</span></div></div><p>The Nazca pampa is covered with reddish-brown stones darkened by a coating of iron and manganese oxides, lying on paler, finer ground. To draw, people moved the dark stones aside and piled them along the edges, exposing a light line. Figures could be laid out from a small sketch with wooden stakes and cords, measuring out from a baseline or grid; a 1982 experiment by Joe Nickell and five relatives reproduced a 134 m condor in a Kentucky field this way. Line-type figures such as the hummingbird are drawn as a single continuous path. Smaller relief-type figures on slopes were made by clearing and heaping stones. The extremely dry, stable desert surface has preserved them for some two thousand years.</p><div class="flip" id="marvel-nazca-lines-flip"><div class="flip-in"><div class="flip-f"><b>The myth</b><p>The lines can only be seen from the air, so they must be runways or signals made for, or by, visitors from space.</p></div><div class="flip-b"><b>The reality</b><p>Many figures can be seen from nearby hills and foothills, and the small relief figures sit beside ancient footpaths where walkers would pass them. The lines are shallow scrapes in loose gravel, useless as runways. Excavated pottery, cairns and footpath networks tie them to the Paracas and Nasca cultures, and the leading interpretations involve water, fertility and ritual walking. Exactly what each figure meant remains debated.</p></div></div><button type="button" class="flip-btn" aria-pressed="false" onclick="flip('marvel-nazca-lines-flip',this)">Flip it</button></div><div class="twist"><b>Wow</b><p>An AI system trained on a few hundred known figures helped archaeologists find 303 new figurative geoglyphs in about six months of fieldwork, nearly doubling a total that had taken almost a century to build.</p></div><div class="wmys"><span>Mystery meter</span><span class="pips" role="img" aria-label="Mystery level 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><small>A few loose ends</small></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">10 min read · 2,281 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Nazca Lines"><button type="button" class="wtoc-i" data-go="nazca-lines-s1">Drawings you can walk</button><button type="button" class="wtoc-i" data-go="nazca-lines-s2">How to draw on a desert</button><button type="button" class="wtoc-i" data-go="nazca-lines-s3">The people of the pampa</button><button type="button" class="wtoc-i" data-go="nazca-lines-s4">Stakes, cords and a Kentucky condor</button><button type="button" class="wtoc-i" data-go="nazca-lines-s5">Maria Reiche, guardian of the lines</button><button type="button" class="wtoc-i" data-go="nazca-lines-s6">What were they for?</button><button type="button" class="wtoc-i" data-go="nazca-lines-s7">Runways for visitors?</button><button type="button" class="wtoc-i" data-go="nazca-lines-s8">Fresh from the field: 303 new figures</button><button type="button" class="wtoc-i" data-go="nazca-lines-s9">Fragile giants</button><button type="button" class="wtoc-i" data-go="nazca-lines-s10">What we still don&#x27;t know</button></nav></div><section class="wsec" id="nazca-lines-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Drawings you can walk</h3><p>On the high desert plain between the towns of Nazca and Palpa, about 400 km south of Lima, the ground is a flat sheet of dark stones stretching to the foothills of the Andes. It barely rains. There is almost nothing to hear except wind. Scratched into this surface, over some 450 km², are straight lines running for kilometres, great triangles and trapezoids, spirals, and animals: a monkey with a curled tail, a spider, a condor, a whale, and a hummingbird about 93 m from beak to tail.</p><p>They were made by the Paracas and Nasca peoples, roughly between 500 BCE and 500 CE, long before the Inca. They are called geoglyphs, drawings on the ground. Together, the lines add up to more than 1,300 km. UNESCO listed the Lines and Geoglyphs of Nasca and Palpa as a World Heritage Site in 1994, and they remain one of the most famous, and most misunderstood, archaeological sites on Earth.</p><p>Seen from the ground at midday, many lines almost vanish. Early in the morning or late in the afternoon, when the Sun is low, the slight dip of a cleared line and its stone borders catch shadows and the drawings spring out. That is one reason travellers crossed the pampa for centuries without describing the figures, and one reason the first systematic maps were made only in the 20th century.</p><blockquote class="wpull"><p>Nobody needed an aircraft to make them. They needed a sketch, some stakes and cord, and a lot of walking.</p></blockquote></section><section class="wsec" id="nazca-lines-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>How to draw on a desert</h3><p>The trick is contrast. The pampa is covered with a layer of small, angular stones. Over thousands of years, a thin skin of iron and manganese oxides, the so-called desert varnish, has darkened their exposed faces to a reddish brown. Beneath them lies paler, finer sediment. Pick up the dark stones along a strip, drop them at the edge, and a pale line appears. Do the same along a curve and you have drawn a figure.</p><figure class="wx wx--static" id="nazca-lines-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">A scrape in the stones, and how big it gets</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="A scrape in the stones, and how big it gets"><svg focusable="false" xmlns="http://www.w3 )" marker-end="url(#nazca-lines-f2-ahk)" d="M610,360 V569.9"/><path class="wx-guide" d="M524,358 H616 M524,571.9 H616"/><text class="wx-t-n" x="618" y="468.9">c. 93 m</text><text class="wx-t-m" x="500" y="378" text-anchor="end">hummingbird</text></g><g class="wx-pop" style="--d:12"><rect class="wx-inkfill" x="479.4" y="574" width="1.4" height="3.9"/><circle class="wx-hl" cx="480" cy="575.9" r="9"/><path class="wx-thin" d="M471,579.9 L420,607.9"/><text class="wx-t-b" x="416" y="611.9" text-anchor="end">a person, 1.7 m,</text><text class="wx-t-m" x="416" y="627.9" text-anchor="end">at the same scale</text></g><g><rect class="wx-inkfill" x="44" y="596" width="57.5" height="5"/><rect class="wx-paper wx-edge" x="101.5" y="596" width="57.5" height="5"/><text class="wx-t-s" x="167" y="602">50 m</text></g><text class="wx-t-s" x="696" y="322" text-anchor="end">Pitch: FIFA recommended size. Bird outline schematic.</text></svg></div></div><figcaption>Top: a section through a cleared line, with dark varnished stones pushed aside into low borders. Bottom: the hummingbird next to a football pitch and a person, all at the same scale. <span class="wx-src">Based on: Surface description after Aveni 2000 and standard site descriptions; pitch at FIFA&#x27;s recommended 105 × 68 m; hummingbird length c. 93 m. Section schematic.</span></figcaption><p class="vh">Top panel: a cross-section 4 metres wide, with a 50 centimetre scale bar. A layer of dark angular stones lies on pale fine sediment. In the middle a 1 metre wide strip has been cleared, exposing the pale ground in a shallow dip, and the removed stones are heaped as low borders on each side. Bottom panel: a football pitch 105 by 68 metres drawn to the same scale as the hummingbird outline, about 93 metres long, with a 50 metre scale bar and a tiny mark showing a 1.7 metre person, circled.</p></figure><p>The lines are shallow, generally described as only 10 to 15 cm deep, and widths vary from about 30 cm to more than a metre for figure outlines, with much wider cleared areas for the trapezoids. The removed stones often form low borders. Why have such fragile marks lasted two thousand years? Because the Nazca pampa is one of the driest places in the world, receiving only a few millimetres of rain in a typical year, and the stony surface is stable. The same stones that make the drawings possible also protect the ground from wind.</p><p>There are two broad kinds of figure. Line-type geoglyphs, like the hummingbird and the monkey, are big outlines drawn with a single continuous line on flat ground. Relief-type geoglyphs are smaller, usually on slopes, and were made by clearing and piling stones so the figure stands out as an area rather than an outline. Many of the relief-type figures, especially around Palpa, are thought to be older, from the Paracas period.</p></section><section class="wsec" id="nazca-lines-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The people of the pampa</h3><p>The first geoglyph makers belonged to the Paracas culture, famous for the richly embroidered textiles wrapped around mummy bundles on the Paracas peninsula to the north. Many of the hillside relief figures around Palpa, with their round-eyed human and animal forms, echo Paracas art. From roughly 100 BCE the Nasca culture took over the region. Nasca potters painted vessels in many colours with hummingbirds, monkeys, killer whales, spiders and mythical beings, many of the same subjects that appear on the pampa, and this shared imagery is one of the strongest links between the lines and their makers.</p><p>Nasca people farmed narrow river valleys in one of the driest regions on Earth. Water was everything. Near Nazca, underground aqueducts called puquios, with spiral access shafts, still bring groundwater to fields; many researchers attribute at least some of them to the Nasca, although their dating is debated. The same concern with water runs through Nasca art, ritual and, it seems, the lines themselves.</p></section><section class="wsec" id="nazca-lines-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Stakes, cords and a Kentucky condor</h3><p>How do you draw a 93 m bird accurately when you cannot see it whole from the ground? In 1982 the investigator Joe Nickell decided to find out. With five relatives, working in a field in Kentucky, he reproduced the Nazca condor at full size, about 134 m long. They used only tools that would have been available to the Nasca: a small drawing, wooden stakes and string. They plotted points by measuring from a baseline, joined them with cord, and marked the line. Photographs taken from the air showed a figure remarkably close to the original.</p><figure class="wx wx--steps" id="nazca-lines-f1" data-n="4"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">Making a geoglyph in four steps</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Making a geoglyph in four steps"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" class="wx-svg" role="img" aria-labelledby="nazca-lines-f1-t"><title id="nazca-lines-f1-t">How a Nazca geoglyph such as the hummingbird could be made with a sketch, stakes and cords, in four steps</title><defs><marker id="nazca-lines-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker><marker id="nazca-lines-f1-ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><rect class="wx-stone3 wx-o80" x="214" y="24" width="492" height="442" rx="6"/><path class="wx-line wx-o40" d="M333.2,264.2h0.4M397.1,290.1h0.4M520.8,56.4h0.4M224.4,391.5h0.4M343.5,129.7h0.4M699.9,232.1h0.4M622.8,234.7h0.4M527.3,93.4h0.4M525.3,404.7h0.4M471.2,349.7h0.4M543,55.8h0.4M585,284.5h0.4M363.8,41.5h0.4M636.9,233.2h0.4M5 227.7 L447.9,232.6 L455.3,222.8 L447.9,210.5 L447.9,193.4 L455.3,181.1 L465.1,178.7 Z"/><text class="wx-t-b" x="14" y="408">4 Walk it</text><text class="wx-t-m" x="14" y="424">one continuous line,</text><text class="wx-t-m" x="14" y="440">c. 93 m beak to tail</text></g><g><rect class="wx-paper" x="226" y="426" width="82.2" height="5"/><text class="wx-t-s wx-halo" x="314.2" y="432">20 m</text></g><text class="wx-t-s" x="14" y="462">Method after replication</text><text class="wx-t-s" x="14" y="476">tests (Nickell 1982).</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 4.</b> Sketch it small: draw the figure on a grid or as a set of reference points. No Nasca plans survive, so this step is inferred from replication tests.</p><ol class="wx-steplist"><li>Sketch it small: draw the figure on a grid or as a set of reference points. No Nasca plans survive, so this step is inferred from replication tests.</li><li>Stake it out: enlarge the drawing on the ground with wooden stakes and cords, measuring from a baseline or grid, as in Nickell&#x27;s 1982 test.</li><li>Clear the line: rake or carry away the dark, varnished stones along the cord and pile them at the edges. The pale ground beneath shows through.</li><li>Walk it: the finished hummingbird, about 93 m long, is a single continuous line that can be walked from end to end.</li></ol><figcaption>One tested way to draw a giant figure: sketch small, stake it out full size, clear the dark stones, then walk the finished line. People are drawn to scale in step 3. <span class="wx-src">Based on: Method after Nickell 1982 and other replication tests; hummingbird proportions simplified from published survey drawings (length c. 93 m).</span></figcaption><p class="vh">Left: a small hummingbird sketched on a grid. Right: the dark stony desert surface with a 20 metre scale bar. Step 2 adds an enlarged grid, wooden stakes at the outline&#x27;s corners, a baseline and measuring cords. Step 3 shows part of the outline cleared as a pale line, with two tiny people to scale. Step 4 shows the complete hummingbird, about 93 metres from beak to tail, as one continuous pale line with a moving dashed path to show walking.</p></figure><p>Nickell&#x27;s point was not that he knew the exact Nasca method, but that no exotic method was needed. Other researchers have suggested different techniques, such as sighting along stakes for straight lines and drawing arcs from a fixed stake with a cord, the way a gardener marks a round flowerbed. Traces of stakes have been reported at the ends of some lines. Several methods may have been used, and small teams working for days, not armies working for years, would have been enough for a single figure.</p><aside class="wcall"><b>How do we know?</b><p>Replications show what is possible, not what happened. The real evidence for the Nasca makers comes from pottery in Nasca styles found on and beside the lines, from the similarity of the figures to images on Nasca ceramics and textiles, from stone cairns and small structures at line ends, and from radiocarbon dates on associated material. Together they place most of the figures in the Paracas and Nasca periods.</p></aside></section><section class="wsec" id="nazca-lines-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Maria Reiche, guardian of the lines</h3><p>The lines were noted in the 1920s by the Peruvian archaeologist Toribio Mejía Xesspe, who described them as ceremonial paths. In June 1941 the American historian Paul Kosok, studying ancient irrigation, stood on the pampa at sunset on the southern winter solstice and watched the Sun go down near the end of one of the lines. He called the pampa the largest astronomy book in the world.</p><p>Kosok&#x27;s assistant, the German-born mathematician Maria Reiche (1903–1998), made the lines her life&#x27;s work. From the 1940s until her death she measured, mapped and swept them, living near the pampa, and argued that many lines pointed to astronomical events. She also fought to protect them from road building and agriculture. Much of the protection the lines enjoy today is due to her.</p><p>Her astronomical theory has fared less well. In the late 1960s the astronomer Gerald Hawkins tested line directions against the rising and setting points of the Sun, Moon and bright stars and found no more matches than chance would predict. Later work by Anthony Aveni and colleagues found that some lines relate to the Sun, especially around the time of year when water arrives in the rivers, but that astronomy cannot explain the whole system.</p></section><section class="wsec" id="nazca-lines-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What were they for?</h3><p>After decades of fieldwork, the leading interpretations share one theme: water. The Nazca region depends on rivers fed by rain in the Andes, and on underground water. Aveni&#x27;s teams found that many straight lines radiate from &#x27;line centres&#x27;, natural hills or mounds, often near water sources, and that lines tend to run towards the rivers. The anthropologist Johan Reinhard linked the lines to Andean traditions of mountain and water worship. David Johnson proposed that some lines mark underground water flowing along geological faults, an idea that remains debated.</p><p>A second theme is movement. The figures are drawn as single paths that can be walked from one end to the other. Broken pottery, often fine vessels deliberately smashed, lies along lines and at their ends, suggesting offerings. Clive Ruggles and Nicholas Saunders studied a huge labyrinth-like figure on the pampa, a single path several kilometres long that leads walkers in and back out, and argued that walking it was the point: the drawings were made to be experienced from the ground, by people moving through them in procession.</p><p>Some lines lead towards Cahuachi, a large Nasca ceremonial centre of adobe mounds by the Nazca river. Many researchers see the pampa as a ritual landscape tied to Cahuachi and to seasonal ceremonies for water and fertility. No single explanation covers every line, and there is no reason to expect one: the geoglyphs were made over nearly a thousand years.</p><p>Then there are the trapezoids and triangles, huge cleared areas that can stretch for hundreds of metres. They may have been gathering places, or spaces for ceremonies, or simply bigger versions of the paths. Aveni and others noted that many sit near line centres and that their narrow ends often point in the same direction as nearby watercourses. Excavations at their edges have found pottery and small stone structures, reinforcing the picture of places used, not just drawn.</p></section><section class="wsec" id="nazca-lines-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>Runways for visitors?</h3><p>In 1968 Erich von Däniken&#x27;s bestseller Chariots of the Gods? suggested that the long straight lines and trapezoids looked like an airfield, and that the figures were meant to be seen from the sky. The idea has been repeated on television ever since. It is easy to test.</p><p>Could anything land here? The lines are shallow scrapes in loose gravel over soft sediment; any heavy vehicle, as the 2018 truck incident showed, leaves deep ruts. Must they be seen from the air? No. Many figures can be seen from the surrounding hills, and the new relief figures sit right next to ancient footpaths. Could people make them without aerial guidance? Yes: replications with stakes and cords show it. And who made them? The pottery, the styles, the dates and the parallels with Nasca art all point to the people who lived there.</p><figure class="photo wimg" data-img="Nazca-lineas-astronauta-c01.jpg" data-cap="The hillside figure nicknamed &#x27;the astronaut&#x27;: a relief-type geoglyph on a slope, probably a human or owl-headed being."><figcaption></figcaption></figure><p>The hillside figure nicknamed &#x27;the astronaut&#x27; is a good example. It is a relief-type figure on a slope with a round head and big eyes, one hand raised. Similar round-eyed figures appear in Paracas and Nasca art. The nickname is modern; the figure is Andean.</p></section><section class="wsec" id="nazca-lines-s8"><h3 class="wsec-h"><span class="wsec-n">08</span>Fresh from the field: 303 new figures</h3><p>Finding new geoglyphs had been slow. By 2022, after almost a century of research, 430 figurative geoglyphs were known, and the historical discovery rate was only a handful per year. Yamagata University in Japan, which has run fieldwork at Nazca since 2004, teamed up with IBM Research to try a different approach: train an AI model on high-resolution aerial images of known figures, then let it flag candidates across the whole pampa.</p><p>The results, published by Masato Sakai and colleagues in PNAS in 2024, were dramatic. Checking the AI&#x27;s candidates on foot during about six months of field survey between September 2022 and February 2023, the team confirmed 303 new figurative geoglyphs, nearly doubling the total. The AI was especially good at spotting small relief-type figures that humans had overlooked on photographs. People still did the decisive work: every candidate had to be checked on the ground before it counted.</p><ul class="wlist"><li>Relief-type figures mostly show humans or things modified by humans: domesticated camelids, decapitated heads and people (81.6 per cent).</li><li>They lie on average 43 m from ancient footpaths that cross the pampa, well within viewing distance for walkers.</li><li>Large line-type figures mostly show wild animals (64 per cent), such as birds, monkeys and other wild creatures.</li><li>Line-type figures lie on average 34 m from the network of straight lines and trapezoids, suggesting community-level rituals.</li></ul><p>The authors conclude that the small relief figures were probably made and viewed by individuals or small groups travelling along the trails, perhaps as messages or markers, while the giant line figures were built and used by whole communities for ritual activities. That is a big step from guessing about purposes to testing them with distributions.</p><p>How does such an AI work? In simple terms, it is shown hundreds of image tiles containing known geoglyphs and many more without them, and learns the visual patterns of cleared lines and heaped stones. Run across the whole pampa, it ranks tiles by how likely they are to contain a figure. The archaeologists then study the top candidates and walk out to check them. In 2019 an earlier phase of the Yamagata and IBM collaboration had already announced 143 new figures, including one found with AI help, so the 2024 result is the product of years of refinement.</p></section><section class="wsec" id="nazca-lines-s9"><h3 class="wsec-h"><span class="wsec-n">09</span>Fragile giants</h3><p>The same simplicity that makes the lines easy to make makes them easy to damage. A footprint on the pampa can last for decades. In December 2014, activists placing a protest banner near the hummingbird left footprints across the fragile surface. In January 2018 a truck driver drove off the Pan-American Highway and across part of the site, scarring three straight lines. Informal settlements, mining and farming press against the edges of the protected zone.</p><p>Peru&#x27;s Ministry of Culture patrols the area and restricts access, and viewing towers beside the highway let visitors see some figures without walking on them. Overflights from the Nazca airfield show the big figures to tourists. The irony is gentle: the lines were probably made to be walked, and today the best way to protect them is not to walk on them at all.</p></section><section class="wsec" id="nazca-lines-s10"><h3 class="wsec-h"><span class="wsec-n">10</span>What we still don&#x27;t know</h3><p>We know how the lines were made and roughly when and by whom. We have good evidence that they were walked, that they were linked to water and ceremony, and that different kinds of figures served different audiences. What remains uncertain is the specific meaning of individual figures, how the choice of animals relates to Nasca beliefs, how labour was organised over centuries, and how many geoglyphs are still undiscovered. With AI surveys continuing, the count is likely to keep rising.</p><p>The next steps are already visible. Drone photography and high-resolution satellite images make it possible to monitor damage almost in real time. Excavations along the newly mapped trails could date the small relief figures more precisely and show who used the paths. Comparing the positions of figures with ancient settlements, cemeteries and water sources, now possible with far larger datasets, may finally show how the pampa worked as a whole: which figures belonged to which communities, and how the ritual landscape changed as the Nasca world changed. The questions that once invited fantasy are turning into questions that data can answer.</p><p>The Nazca Lines do not need visitors from elsewhere to be astonishing. They show a desert people turning an entire landscape into a place for ceremony, one line at a time, with a precision that still delights anyone who walks, or flies, above them.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">500 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Paracas people begin making geoglyphs (approx.)</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">100 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Nasca culture: the great line figures</span></li><li class="wtl-loss" style="--i:2"><span class="wtl-y">500 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Geoglyph making fades</span></li><li class="wtl-find" style="--i:3"><span class="wtl-y">1927 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Toribio Mejía Xesspe notes the lines</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">1941 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Paul Kosok sees a solstice sunset on a line</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1946 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Maria Reiche begins decades of mapping</span></li><li class="wtl-event" style="--i:6"><span class="wtl-y">1968 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Chariots of the Gods popularises &#x27;runways&#x27;</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">1982 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Nickell&#x27;s full-size condor replication</span></li><li class="wtl-event" style="--i:8"><span class="wtl-y">1994 CE</span><span class="wtl-k">Event</span><span class="wtl-t">UNESCO World Heritage listing</span></li><li class="wtl-loss" style="--i:9"><span class="wtl-y">2014 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Protest banner damages the hummingbird area</span></li><li class="wtl-loss" style="--i:10"><span class="wtl-y">2018 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Truck drives across three lines</span></li><li class="wtl-find" style="--i:11"><span class="wtl-y">2019 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Yamagata and IBM report 143 new figures</span></li><li class="wtl-find" style="--i:12"><span class="wtl-y">2024 CE</span><span class="wtl-k">Found</span><span class="wtl-t">PNAS: 303 new figures via AI survey</span></li></ol><figure class="wbars"><h4 class="wx-title">How big are the famous figures?</h4><div class="wb-r" style="--w:100.0%;--i:0"><div class="wb-l">Condor</div><div class="wb-t"><i></i><span>134 m</span></div></div><div class="wb-r" style="--w:69.4%;--i:1"><div class="wb-l">Hummingbird</div><div class="wb-t"><i></i><span>93 m</span></div></div><div class="wb-r" style="--w:69.4%;--i:2"><div class="wb-l">Monkey</div><div class="wb-t"><i></i><span>93 m</span></div></div><div class="wb-r" style="--w:67.2%;--i:3"><div class="wb-l">Line-type figures, average<small>approximate</small></div><div class="wb-t"><i></i><span>90 m</span></div></div><div class="wb-r" style="--w:35.1%;--i:4"><div class="wb-l">Spider</div><div class="wb-t"><i></i><span>47 m</span></div></div><div class="wb-r" style="--w:6.7%;--i:5"><div class="wb-l">Relief-type figures, average<small>approximate</small></div><div class="wb-t"><i></i><span>9 m</span></div></div><figcaption>Source: Published survey measurements of individual figures; averages after Sakai et al. 2024 (approximate)</figcaption></figure><h3 class="sub-h wsub">The big debates</h3><div class="debate"><p class="debate-q">Were the lines runways or signals for visitors from space?</p><div class="sides"><div class="side"><b>Yes: they look like airfields and are best seen from the air.</b><span>Von Däniken (1968) pointed to long straight lines and trapezoids resembling runways and figures seemingly designed to be viewed from above.</span></div><div class="side"><b>No: they are shallow ritual paths made by local people.</b><span>The surface is loose gravel on soft ground; many figures are visible from hills and trails; replication shows they can be made from the ground; Nasca pottery and styles tie them to local cultures (Aveni 2000; Sakai et al. 2024).</span></div></div><p class="debate-why"><b>The bold claim:</b> The Nazca Lines were made as runways or signals for extraterrestrial visitors.</p><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Every testable element fails: the ground cannot bear landings, aerial viewing is not needed, simple methods suffice, and the archaeology identifies the makers. The idea survives on television, not in the evidence.</p></div><div class="debate"><p class="debate-q">Were the lines an astronomical calendar?</p><div class="sides"><div class="side"><b>Yes: many lines point to celestial events.</b><span>Kosok saw a solstice sunset along a line in 1941; Reiche spent decades arguing for solar, lunar and stellar alignments.</span></div><div class="side"><b>Mostly no.</b><span>Hawkins&#x27;s tests found no more alignments than chance; Aveni&#x27;s work found some solar links, but most lines relate better to water, walking and line centres.</span></div></div><p class="debate-why"><b>The bold claim:</b> The main purpose of the Nazca Lines was to record astronomical alignments.</p><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">With hundreds of lines in every direction, some will point at something in the sky by chance. Statistical tests do not show a strong astronomical design, although a few lines may well have had solar meanings.</p></div><div class="debate"><p class="debate-q">Were the lines made for walking rituals linked to water?</p><div class="sides"><div class="side"><b>Yes: paths for ceremony.</b><span>Figures are single walkable lines; smashed pottery offerings lie along them; lines radiate from line centres towards water; figures relate to trails (Ruggles &amp; Saunders 2012; Sakai et al. 2024).</span></div><div class="side"><b>Only partly.</b><span>Some lines may have marked water sources, boundaries or routes; meanings likely changed over nearly a thousand years.</span></div></div><p class="debate-why"><b>The bold claim:</b> Nazca geoglyphs were made mainly for ritual walking connected to water and fertility.</p><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Several independent kinds of evidence point the same way, and the 2024 distribution study adds real data. But purposes surely varied between lines, periods and communities, so a single explanation should be held loosely.</p></div><details class="srcs"><summary>Sources for this deep dive (13)</summary><ol><li>Sakai, M., Sakurai, A., Lu, S., Olano, J., Albrecht, C. M., Hamann, H. F. &amp; Freitag, M. (2024). AI-accelerated Nazca survey nearly doubles the number of known figurative geoglyphs and sheds light on their purpose. PNAS 121(40): e2407652121. <a href="https://doi.org/10.1073/pnas.2407652121" target="_blank" rel="noopener">doi:10.1073/pnas.2407652121</a></li><li>Ruggles, C. &amp; Saunders, N. J. (2012). Desert labyrinth: lines, landscape and meaning at Nazca, Peru. Antiquity 86(334): 1126–1140. <a href="https://doi.org/10.1017/S0003598X00048298" target="_blank" rel="noopener">doi:10.1017/S0003598X00048298</a></li><li>Aveni, A. F. (ed.) (1990). The Lines of Nazca. Philadelphia: American Philosophical Society.</li><li>Aveni, A. F. (2000). Between the Lines: The Mystery of the Giant Ground Drawings of Ancient Nasca, Peru. Austin: University of Texas Press.</li><li>Nickell, J. (1983). The Nazca drawings revisited: creation of a full-sized duplicate. Skeptical Inquirer 7(3).</li><li>Kosok, P. &amp; Reiche, M. (1949). Ancient drawings on the desert of Peru. Archaeology 2(4).</li><li>Reiche, M. (1949). Mystery on the Desert. Lima (privately published).</li><li>Reinhard, J. (1985). The Nazca Lines: A New Perspective on their Origin and Meaning. Lima: Editorial Los Pinos.</li><li>Hawkins, G. S. (1969). Ancient Lines in the Peruvian Desert. Cambridge, MA: Smithsonian Astrophysical Observatory.</li><li>Johnson, D. W., Proulx, D. A. &amp; Mabee, S. B. (2002). The correlation between geoglyphs and subterranean water resources in the Río Grande de Nazca drainage. In H. Silverman &amp; W. Isbell (eds), Andean Archaeology II. New York: Springer. <a href="https://doi.org/10.1007/978-1-4615-0597-6_12" target="_blank" rel="noopener">doi:10.1007/978-1-4615-0597-6_12</a></li><li>Lambers, K. (2006). The Geoglyphs of Palpa, Peru: Documentation, Analysis, and Interpretation. Aichwald: Linden Soft.</li><li>UNESCO World Heritage Centre. Lines and Geoglyphs of Nasca and Palpa (inscribed 1994).</li><li>von Däniken, E. (1968). Erinnerungen an die Zukunft (English: Chariots of the Gods?). Düsseldorf: Econ.</li></ol></details><aside class="rc-cite" data-v="marvels" data-id="marvel-nazca-lines" data-t="The Nazca Lines"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Nazca Lines</i>. <span class="cite-u">https://residualcontinuum.com/#marvels/marvel-nazca-lines</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="marvel-damascus-steel-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Figure 4 - Damascus steel blade.PNG" data-cap="The watered pattern of a Damascus blade" data-big><figcaption></figcaption></figure><div class="sh-k">South India, Sri Lanka and Damascus</div><h2 class="sh-t" id="marvel-damascus-steel-st" tabindex="-1">Damascus (wootz) steel</h2><p class="sh-s">A steel cake from a sealed clay pot, hammered at dull red heat, became a blade that looks like flowing water.</p><div class="sh-v"><span class="vstamp vstamp--mys">Mystery <span class="pips" role="img" aria-label="Mystery level 1 of 5"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></span></span></div></div><div class="wquick"><h3 class="sub-h">The quick read</h3><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="1.5" data-dec="1">1.5</b><span class="ctr-u"> % carbon</span></div><div class="ctr-l">typical carbon content of wootz, about double a modern knife steel&#x27;s 0.6–0.8%</div><div class="ctr-c">Verhoeven, Pendray and Dauksch 1998</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="40" >40</b><span class="ctr-u"> ppm vanadium</span></div><div class="ctr-l">roughly the minimum trace of vanadium needed for strong banding</div><div class="ctr-c">Verhoeven, Pendray and Dauksch 1998</div></div><div class="ctr"><div class="ctr-v">30–<b class="ctr-n" data-v="50" >50</b><span class="ctr-u"> micrometres</span></div><div class="ctr-l">typical spacing of the carbide bands that make the pattern</div><div class="ctr-c">Verhoeven, Pendray and Dauksch 1998</div></div><div class="ctr"><div class="ctr-v">6–<b class="ctr-n" data-v="8" >8</b><span class="ctr-u"> forging cycles</span></div><div class="ctr-l">heating and hammering cycles before the bands become clear</div><div class="ctr-c">Verhoeven, Pendray and Dauksch 1998</div></div><div class="ctr"><div class="ctr-v">up to c. <b class="ctr-n" data-v="2.3" data-dec="1">2.3</b><span class="ctr-u"> kg</span></div><div class="ctr-l">weight of a large wootz ingot or &#x27;cake&#x27;</div><div class="ctr-c">Verhoeven, Pendray and Dauksch 1998</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="1" >1</b><span class="ctr-u"> % chromium</span></div><div class="ctr-l">deliberately added to crucible steel at Chahak, Iran, 10th–12th century</div><div class="ctr-c">Alipour, Rehren and Martinón-Torres 2021</div></div></div><div class="stats"><div><b>c. 1.5% (1.0–1.8% in analysed blades): ultra-high-carbon steel</b><span>Carbon content</span></div><div><b>vanadium from about 40 ppm upwards (50–270 ppm in tested blades)</b><span>Key trace elements</span></div><div><b>a few hundred grams to about 2.3 kg, solidified in a closed crucible</b><span>Ingot (&#x27;cake&#x27;)</span></div><div><b>c. 30–70 micrometres between carbide sheets</b><span>Band spacing</span></div><div><b>cementite (Fe3C), roughly 5–15 micrometres across</b><span>Carbide particles</span></div><div><b>many cycles at dull red heat, c. 50–100 °C below the carbide-dissolving temperature</b><span>Forging</span></div><div><b>c. 1750; poorer ones into the early 19th century</b><span>Best patterns made until</span></div></div><p>Smiths in South India and Sri Lanka packed iron and carbon-rich plant matter into clay crucibles, sealed them and fired them for many hours until the charge melted into a small cake of steel with about 1.5% carbon. The cakes were traded west, to Persia, Syria and Central Asia, where swordsmiths forged them slowly at a dull red heat, reheating and hammering again and again. Tiny traces of vanadium and similar elements, left in the steel from the original ore, made sheets of hard iron carbide particles line up during these cycles. Etching the finished blade in acid revealed those sheets as a shimmering &#x27;watered&#x27; pattern.</p><div class="flip" id="marvel-damascus-steel-flip"><div class="flip-in"><div class="flip-f"><b>The myth</b><p>Damascus steel was a lost magical recipe: blades sliced floating silk, cut through gun barrels, contained deliberate nanotechnology and still cannot be copied today.</p></div><div class="flip-b"><b>The reality</b><p>The blades were excellent for their time, not supernatural. The pattern comes from carbide banding caused by trace impurities, a mechanism Verhoeven, Pendray and Dauksch described in 1998 and used to forge convincing replicas. What faded after about 1750 was probably a supply of suitable ore and the craft knowledge around it. Carbon nanotubes reported in one 17th-century sabre in 2006 are interesting chemistry, but there is no evidence that they explain the pattern or the blade&#x27;s performance.</p></div></div><button type="button" class="flip-btn" aria-pressed="false" onclick="flip('marvel-damascus-steel-flip',this)">Flip it</button></div><div class="twist"><b>Wow</b><p>The pattern on a genuine wootz blade is not a surface decoration at all: it is the steel&#x27;s own microstructure, sheets of carbide particles spaced about 0.05 mm apart, made visible by a light etch.</p></div><div class="wmys"><span>Mystery meter</span><span class="pips" role="img" aria-label="Mystery level 1 of 5"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></span><small>Mostly solved</small></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">10 min read · 2,249 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Damascus (wootz) steel"><button type="button" class="wtoc-i" data-go="damascus-steel-s1">A blade that looks like running water</button><button type="button" class="wtoc-i" data-go="damascus-steel-s2">Steel from a sealed clay pot</button><button type="button" class="wtoc-i" data-go="damascus-steel-s3">The long road to Damascus</button><button type="button" class="wtoc-i" data-go="damascus-steel-s4">Why the pattern appears</button><button type="button" class="wtoc-i" data-go="damascus-steel-s5">Nanotubes in a sabre</button><button type="button" class="wtoc-i" data-go="damascus-steel-s6">Legends of the edge</button><button type="button" class="wtoc-i" data-go="damascus-steel-s7">A lost art, found again</button><button type="button" class="wtoc-i" data-go="damascus-steel-s8">What we still do not know</button></nav></div><section class="wsec" id="damascus-steel-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A blade that looks like running water</h3><p>Tilt a genuine Damascus sabre under a lamp and the steel seems to move. Pale threads curl across a darker ground, gathering into ripples, whorls and ladders, as if someone had frozen the surface of a stream. Medieval writers called it watered steel. Collectors in Europe called it damask, after the patterned silk. The swordsmiths of Persia and Syria who made it prized the pattern as a guarantee: you could not fake it by painting or engraving, because it was the metal itself.</p><p>That last point is what makes these blades a scientific story as well as a romantic one. The pattern is a map of the steel&#x27;s internal structure, sheets of hard iron carbide particles spaced roughly 30–70 micrometres apart, made visible by a light acid etch. To get those sheets you need an unusual steel, an unusual forging routine and, as it turned out, a pinch of an element nobody at the time knew existed.</p><blockquote class="wpull"><p>The pattern was not painted on. It was the steel showing its own skeleton.</p></blockquote><p>The raw material did not come from Damascus at all. It came, as small round cakes, from crucible workshops in South India and Sri Lanka, and it was known in the West by an English mangling of the South Indian word ukku, steel: wootz.</p></section><section class="wsec" id="damascus-steel-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Steel from a sealed clay pot</h3><p>Most iron in the ancient and medieval world was never melted. Smelters reduced ore in a furnace to a spongy bloom and hammered out the slag. Crucible steel was different and far harder to make. A smith packed pieces of iron into a small clay crucible together with carbon-rich plant matter, such as wood and leaves, sealed the mouth with clay and set a batch of crucibles in a furnace. Firings could last up to about 24 hours at temperatures that probably exceeded 1,300 °C, hot enough for the iron to soak up carbon and melt into liquid steel.</p><figure class="wx wx--steps" id="damascus-steel-f1" data-n="6"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">From crucible to watered blade</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="From crucible to watered blade"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" class="wx-svg" role="img" aria-labelledby="damascus-steel
