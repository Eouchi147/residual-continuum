"wx-st wx-hide" data-only="5"><line class="wx-line wx-s4 wx-dash" x1="170" y1="360" x2="170" y2="440"/><line class="wx-line wx-s4 wx-dash" x1="194" y1="360" x2="194" y2="440"/><line class="wx-line wx-s4 wx-dash" x1="218" y1="360" x2="218" y2="440"/><line class="wx-line wx-s4 wx-dash" x1="242" y1="360" x2="242" y2="440"/><line class="wx-line wx-s4 wx-dash" x1="266" y1="360" x2="266" y2="440"/><line class="wx-line wx-s4 wx-dash" x1="290" y1="360" x2="290" y2="440"/><line class="wx-line wx-s4 wx-dash" x1="314" y1="360" x2="314" y2="440"/><line class="wx-line wx-s4 wx-dash" x1="338" y1="360" x2="338" y2="440"/><line class="wx-line wx-s4 wx-dash" x1="362" y1="360" x2="362" y2="440"/><circle class="wx-c4" cx="230" cy="372" r="3.5"/><circle class="wx-c4" cx="300" cy="431" r="3.5"/><circle class="wx-c4" cx="380" cy="368" r="3.5"/><circle class="wx-c4" cx="450" cy="430" r="3.5"/><circle class="wx-c4" cx="505" cy="380" r="3.5"/><circle class="wx-c4" cx="270" cy="395" r="3.5"/><text class="wx-t-b wx-halo" x="360" y="350" text-anchor="middle">iron-rich bands (limonite, magnetite) gave radar 'ribs' and 'rivets'</text><text class="wx-t-s wx-halo" x="360" y="466" text-anchor="middle">'anchor stones' nearby are local andesite (Collins and Fasold 1996)</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Layers of sediment and volcanic debris lie flat on the slope.</p><ol class="wx-steplist"><li>Layers of sediment and volcanic debris lie flat on the slope.</li><li>Earth movements fold them into a trough that closes at both ends: a doubly plunging syncline.</li><li>Erosion planes off the fold. Seen from above, its tilted layers crop out as nested, pointed ovals.</li><li>Mud and debris flow downslope around the hard core, sharpening a boat-like outline about 164 m long.</li><li>Iron-rich layers produce the regular stripes and points that were read as ribs and rivets.</li></ol><figcaption>Tap through five stages to see how folding, erosion and slope movement can produce a boat-shaped outcrop, and what the site&#x27;s famous &#x27;ribs&#x27; and &#x27;rivets&#x27; are. <span class="wx-src">Based on: Collins and Fasold 1996 (syncline, limonite and magnetite, andesite anchor stones); Atabey 2025 as reported (landslide shaping). Geometry schematic, not to scale.</span></figcaption><p class="vh">Two panels, a cross-section above and a plan view below. Step 1: flat layers of sediment and volcanic debris. Step 2: the layers are folded into a trough, and the upper parts of the fold are shown dashed as eroded away. Step 3: seen from above, the tilted layers crop out as nested pointed ovals, with arrows showing the fold plunging at both ends. Step 4: mud and debris flow around the hard core, and a dimension line compares the 164 metre formation with 300 cubits of 52.4 centimetres, about 157 metres. Step 5: iron-rich bands and spots, limonite and magnetite, are shown as the stripes and points that radar and metal detectors read as ribs and rivets, and nearby anchor stones are labelled as local andesite.</p></figure><p>The layers of rock there were folded into a trough that closes at both ends, which geologists call a doubly plunging syncline. When erosion planes off such a fold, its tilted layers crop out as nested, pointed ovals, a shape that can look remarkably like a hull. Iron minerals, limonite and magnetite, concentrated along the steep layers and gave regular stripes on radar and hot spots for metal detectors. The large pierced &#x27;anchor stones&#x27; nearby turned out to be local andesite. A 1960 expedition had already dug into the formation and found only soil and rock. In 2025 the Turkish geological engineer Eşref Atabey reached a similar verdict, describing a natural feature shaped by landslide effects.</p></section><section class="wsec" id="durupinar-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The case for the Ark</h3><p>The site&#x27;s champion was Ron Wyatt, an American nurse anaesthetist and amateur archaeologist who visited from 1977. He argued that the size matched, that radar showed internal walls like bulkheads, that iron points marked rivets, and that the stones nearby were the drogues that steadied the drifting Ark. Turkey&#x27;s government took enough interest to designate the site and build a visitor centre in the late 1980s.</p><p>The size argument deserves a closer look, because it is the heart of the case. Cubits varied. With the common cubit of roughly 45 cm, Genesis&#x27;s 300 cubits come to about 135 m, well short of the formation. The match to about 157 m works only with the longer Egyptian royal cubit of about 52.4 cm, and Wyatt chose that cubit because Moses, the traditional author of Genesis, was raised in Egypt. That is a reasonable guess, but it is a choice made to fit. Natural folds come in every length, so a length that falls within about 5 per cent of one chosen value is a weak signature on its own.</p><p>The newest chapter began in 2021, when researchers from Ağrı İbrahim Çeçen University, Istanbul Technical University and Andrews University in the United States began sampling. In 2023 they reported rock and soil ages between roughly 5500 and 3000 BCE. Supporters saw a match with the age of Noah. The team&#x27;s results, however, have not yet appeared in a peer-reviewed paper, and the method has a basic limit: an age for soil tells you when that sediment formed or was last exposed, not whether a vessel ever lay there.</p><aside class="wcall"><b>How do we know?</b><p>The test for a wooden ship is simple in principle: wood, or its carbonised remains, and the shaped joints that hold planks together. Organic remains can be radiocarbon dated directly, and joinery is unmistakable. Neither has been published from Durupınar. Iron-rich layers, in contrast, are common in the local volcanic and sedimentary rocks.</p></aside></section><section class="wsec" id="durupinar-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>What time has hidden</h3><p>Honesty cuts both ways here. An ancient wooden vessel left on a mountainside would not be expected to survive for thousands of years, so the failure to find an Ark, at Durupınar or anywhere else, says very little about the flood accounts themselves. What the evidence does say is that this particular hillside is natural.</p><p>The mountain the Quran names has had far less attention than the one the Ark hunters chose. Cudi Dağı&#x27;s summit shrines, the ruins of its monastery and the pilgrim routes described by medieval writers have hardly been surveyed, partly because the border region has been a conflict zone for decades. Gertrude Bell and other travellers described a shrine on the summit early in the 20th century, and local people long made pilgrimage there. Whatever archaeology can say about the landing tradition is waiting on that mountain, not in the fold near Doğubayazıt.</p></section><section class="wsec" id="durupinar-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What would settle it</h3><p>For Durupınar, the tests are straightforward: publish the sample data in full, drill cores through the formation&#x27;s centre and its supposed hull lines, and look for wood or worked material. An independent survey comparing Durupınar with the natural folds around it would show whether it is unusual at all. The evidence so far, from mapping, digging and mineralogy, all points one way.</p><p>For the landing tradition, the most promising work is historical and archaeological: a careful survey of Cudi Dağı, where Berossus, the Syriac Christians and the Quran all seem to be looking, and of the texts that record pilgrimages there. That would not test a miracle. It would tell us how old and how continuous the memory of that mountain is.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">280 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Berossus places the ship in the Gordyaean mountains</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">93 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Josephus repeats the report</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">632 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Quran complete: the Ark settles on al-Judi</span></li><li class="wtl-loss" style="--i:3"><span class="wtl-y">776 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Monastery on Cudi Dağı destroyed by lightning</span></li><li class="wtl-find" style="--i:4"><span class="wtl-y">1948 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Rain and earthquakes expose the formation</span></li><li class="wtl-find" style="--i:5"><span class="wtl-y">1959 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Aerial photo on a Turkish mapping flight</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">1960 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Expedition digs and finds soil and rock</span></li><li class="wtl-event" style="--i:7"><span class="wtl-y">1977 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Ron Wyatt begins promoting the site</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">1996 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Collins and Fasold publish the geology</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">2025 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Atabey: a landslide-shaped natural feature</span></li></ol><details class="srcs"><summary>Sources for this case (10)</summary><ol><li>Collins L.G., Fasold D.F. (1996). Bogus &#x27;Noah&#x27;s Ark&#x27; from Turkey exposed as a common geologic structure. Journal of Geoscience Education 44: 439–444. <a href="https://doi.org/10.5408/1089-9995-44.4.439" target="_blank" rel="noopener">doi:10.5408/1089-9995-44.4.439</a></li><li>Bailey L.R. (1989). Noah: The Person and the Story in History and Tradition. Columbia: University of South Carolina Press.</li><li>Josephus, Antiquities of the Jews 1.93, trans. William Whiston (1737).</li><li>Abdel Haleem M.A.S. (trans.) (2004). The Qur&#x27;an: A New Translation. Oxford University Press.</li><li>The Holy Bible, New Revised Standard Version, Anglicised edition. Oxford University Press.</li><li>Zimansky P.E. (1985). Ecology and Empire: The Structure of the Urartian State. Chicago: Oriental Institute.</li><li>Bell G. (1911). Amurath to Amurath. London: Heinemann.</li><li>Atabey E. (2025). Geological assessment of the Durupınar formation, reported in Turkish media and professional forums (not peer reviewed).</li><li>Wyatt R. (1989). Discovered: Noah&#x27;s Ark. Nashville: World Bible Society.</li><li>Crouse B., Franz G. (2006). Mount Cudi: true mountain of Noah&#x27;s Ark. Bible and Spade 19(4).</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-durupinar" data-t="Where the Ark Came to Rest: Ararat, Judi, Durupınar"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Where the Ark Came to Rest: Ararat, Judi, Durupınar</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-durupinar</span> (updated 25 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-yu-xia-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="20260520 Bronze Jue from Erlitou.jpg" data-cap="A bronze jue from Erlitou" data-big><figcaption></figcaption></figure><div class="sh-k">Peoples of the Sacred Texts</div><h2 class="sh-t" id="case-yu-xia-st" tabindex="-1">Yu the Great and the Flood That Made a Dynasty</h2><p class="sh-s">Chinese tradition says a world-drowning flood was tamed by Yu, whose son founded the first dynasty. In 2016 geologists announced they had found the flood.</p><div class="sh-v"><span class="vstamp vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><p class="sh-claim"><b>What the stamp rates:</b> An outburst flood from Jishi Gorge around 1920 BCE lies behind the tradition of Yu&#x27;s flood and marks the beginning of the Xia dynasty.</p><p class="sh-claim"><b>The text's own words:</b> <span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span> <span class="sh-more">(line by line below)</span></p></div><p class="v4-q">Did a real megaflood around 1920 BCE lie behind Yu&#x27;s flood and the Xia?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Chinese tradition says Yu the Great tamed a flood and founded the first dynasty.</li><li>At Jishi Gorge a landslide once dammed the Yellow River, and the lake later burst.</li><li>Downstream at Lajia, people died suddenly in their houses; a bowl of 4,000-year-old noodles survived.</li><li>Other teams date the lake thousands of years earlier and read Lajia as an earthquake and mudflow.</li><li>A real flood with a real hypothesis behind it, still open.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Geology</span><span class="thr">Archaeology</span><span class="thr">Texts and scripts</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="400000" >400,000</b><span class="ctr-u"> m³/s</span></div><div class="ctr-l">estimated peak discharge of the Jishi outburst</div><div class="ctr-c">Wu et al. 2016</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="500" >500</b><span class="ctr-u"> times</span></div><div class="ctr-l">the Yellow River&#x27;s average discharge at that peak</div><div class="ctr-c">Wu et al. 2016</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="200" >200</b><span class="ctr-u"> m</span></div><div class="ctr-l">approximate height of the landslide dam above the river</div><div class="ctr-c">Wu et al. 2016</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="1922" >1,922</b><span class="ctr-u"> BCE</span></div><div class="ctr-l">proposed date of the outburst, ± 28 years</div><div class="ctr-c">Wu et al. 2016</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>An outburst flood from Jishi Gorge around 1920 BCE lies behind the tradition of Yu&#x27;s flood and marks the beginning of the Xia dynasty.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:41.7%" role="img" aria-label="Weight of evidence: Open question"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The flood itself is real geology, but its date and its link to Lajia are both under challenge. Zhang and colleagues place the Jishi lakes thousands of years earlier, and other teams read the Lajia deaths as an earthquake and mudflow event. Even if the date holds, a flood of the upper river is a long way, in space and in centuries, from the first texts about Yu and from Erlitou. A striking hypothesis with real evidence behind it, still genuinely open.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Chinese textbooks traditionally present the Xia as China&#x27;s first dynasty, often with the Chronology Project&#x27;s dates of about 2070–1600 BCE, which is more certain than the archaeology allows. Many Western surveys swing the other way and treat Yu as pure myth. The evidence sits in between: a genuine early state at Erlitou, a genuine megaflood, and no secure bridge between them yet.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>At Jishi Gorge on the upper Yellow River, a landslide once dammed the river and the lake behind it later burst; Wu and colleagues estimated a peak outburst of about 400,000 cubic metres per second.<small>Wu et al. 2016</small></li><li>At Lajia, downstream of the gorge, people died suddenly inside their houses, including an adult cradling a child; the site also preserved a bowl of millet noodles about 4,000 years old.<small>Wu et al. 2016; Lu et al. 2005</small></li><li>Yu&#x27;s flood work is an old tradition: a Western Zhou bronze vessel, the Sui Gong xu (c. 9th century BCE), already credits Yu with channelling the waters, centuries before the classic written accounts.<small>Sui Gong xu inscription</small></li><li>Erlitou in Henan, the leading archaeological candidate for a Xia capital, is radiocarbon dated to roughly 1750–1530 BCE, and no writing from that period names a Xia state.<small>Liu and Xu 2007</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>The flood&#x27;s date, 1922 ± 28 BCE, comes from the Lajia skeletons and assumes the flood killed them. Zhang and colleagues (2019) found two Jishi landslide lakes that drained about 6,300 and 5,600 years ago, far earlier.</li><li>Whether the Lajia disaster was caused by the outburst at all, or by an earthquake followed by local mudflows and flash floods, as several teams argue.</li><li>Whether an upper-river outburst could have destabilised the lower Yellow River some 2,000 km away for years, as Wu&#x27;s team proposed.</li><li>Whether the Xia was a real dynasty, a real but smaller polity, or a predecessor created by later writers, and whether Erlitou was its seat.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>No writing survives from China around 2000 BCE; the earliest readable texts, the Shang oracle bones, date from about 1250 BCE.</li><li>Any flood deposits on the North China Plain lie buried under metres of later Yellow River silt.</li><li>Large parts of Erlitou and other candidate Xia sites remain unexcavated.</li></ul></div></div><h3 class="sub-h wsub">How the traditions tell it</h3><div class="v4texts"><blockquote class="quote v4q"><span class="v4q-t">Chinese classic (Shujing, Canon of Yao) · Canon of Yao</span><p>In their vast extent they embrace the hills and overtop the great heights, threatening the heavens with their floods</p><cite>trans. James Legge (1865)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Chinese classic (Mencius) · Teng Wen Gong I</span><p>In the time of Yao, when the world had not yet been perfectly reduced to order, the vast waters, flowing out of their channels, made a universal inundation.</p><cite>trans. James Legge (1861)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Chinese classic (Mencius) · Teng Wen Gong I</span><p>During that time, Yu was eight years away from his home, and though he thrice passed the door of it, he did not enter.</p><cite>trans. James Legge (1861)</cite></blockquote></div><h3 class="sub-h wsub">In the text's own words</h3><p class="rd-rule">Each line rates only what the text itself says, not later dates, commentaries or modern identifications.</p><ul class="rds"><li class="rd"><p class="rd-s">In Yao&#x27;s time vast waters overtopped the hills, and Yu tamed them over years of labour (Shujing; Mencius).</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">A huge landslide-dam outburst on the Yellow River around 1920 BCE is well documented; linking it to Yu depends on dating and on reading the texts as history.</p></li></ul><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Most Western and many Chinese specialists treat Yu as a culture hero whose story gathers the long experience of living beside one of the world&#x27;s most flood-prone rivers. The Xia is taken seriously as a tradition, and Erlitou as a remarkable early state, but the link between the two rests on later texts. After 2016 several geological teams argued that the Jishi outburst is either much older than claimed or unconnected to the deaths at Lajia, so it cannot yet anchor the start of Chinese dynastic history.</p><ul><li>The Yellow River has flooded and shifted its course many times in recorded history; a flood-taming hero needs no single event.</li><li>The earliest text naming Yu is centuries younger than the proposed flood.</li><li>Lajia&#x27;s destruction shows signs of earthquake and mudflow.</li><li>Radiocarbon places Erlitou after 1750 BCE, not at 1900 BCE.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Wu&#x27;s team found the geological signature of a colossal event: a landslide dam in Jishi Gorge, lake sediments behind it, and outburst silts downstream at Lajia, where people died in their homes. Dating the victims gave 1922 ± 28 BCE. They argued that this outburst, one of the largest freshwater floods of the last 10,000 years, sent waters and silt far downstream, destabilising the Yellow River for years, and that the memory of this disaster became Yu&#x27;s flood. Its date would put the founding of the Xia around 1900 BCE, close to the rise of Erlitou.</p><ul><li>A real megaflood of the right size is recorded in the rocks of the Yellow River.</li><li>Lajia&#x27;s victims and the flood silts appear to be the same age.</li><li>A long period of unstable channels afterwards fits a story of years of dredging and channelling.</li></ul><div class="face-s"><b>Its strongest point</b><p>The legend&#x27;s centre of gravity is the Yellow River, and the rocks record a catastrophic outburst on that very river; at Lajia, flood-related sediments and suddenly killed households give a tie that was dated to around 1920 BCE.</p></div><p class="face-cr"><b>Credit</b> Wu Qinglong, David J. Cohen and colleagues (Science, 2016)</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Direct dating of the Jishi dam debris and outburst deposits (luminescence and radiocarbon), independent of the Lajia skeletons.</li><li>Cores from the lower Yellow River plain that find outburst silts or a channel change at about the proposed date.</li><li>A resolved stratigraphy at Lajia showing whether the victims died in an outburst flood or in quake-triggered mudflows.</li><li>Writing, or clearly Xia-linked inscriptions, from Erlitou or a contemporary site.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,169 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of Yu the Great and the Flood That Made a Dynasty"><button type="button" class="wtoc-i" data-go="yu-xia-s1">The man who passed his door three times</button><button type="button" class="wtoc-i" data-go="yu-xia-s2">The legend in its own terms</button><button type="button" class="wtoc-i" data-go="yu-xia-s3">The gorge that held a lake</button><button type="button" class="wtoc-i" data-go="yu-xia-s4">The pushback</button><button type="button" class="wtoc-i" data-go="yu-xia-s5">Dynasty, memory or both?</button><button type="button" class="wtoc-i" data-go="yu-xia-s6">What would settle it</button></nav></div><section class="wsec" id="yu-xia-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The man who passed his door three times</h3><p>Every Chinese schoolchild knows the story. In the age of the sage-king Yao, the waters rose until they covered the hills. Yao appointed a minister, Gun, to stop them, and Gun built dykes and walls. For nine years they failed. His son Yu took over and did the opposite: instead of blocking the water, he gave it somewhere to go, cutting channels, dredging rivers and leading the floods to the sea.</p><blockquote class="quote"><p>During that time, Yu was eight years away from his home, and though he thrice passed the door of it, he did not enter.</p><cite>Mencius, Teng Wen Gong I, trans. James Legge (1861)</cite></blockquote><p>Later tellings make it thirteen years. Either way the reward was the kingdom. Yu became ruler, and when he died the throne passed to his son Qi, which tradition counts as the start of the Xia, China&#x27;s first hereditary dynasty. For more than two thousand years, Chinese historians treated all this as history. In 2016 a team of geologists said they could put a date on it.</p></section><section class="wsec" id="yu-xia-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The legend in its own terms</h3><p>The fullest classical accounts are in the Shujing, the Classic of Documents, and in Sima Qian&#x27;s Shiji, written around 94 BCE. The Canon of Yao describes waters that embrace the hills and overtop the great heights. The Tribute of Yu then reads almost like an engineer&#x27;s survey: Yu divides the land into nine provinces, surveys mountains and rivers, and sets the tribute each region owes.</p><blockquote class="quote"><p>In their vast extent they embrace the hills and overtop the great heights, threatening the heavens with their floods</p><cite>Shujing, Canon of Yao, trans. James Legge (1865)</cite></blockquote><p>This is a different kind of flood story from Noah&#x27;s. There is no ark and no divine wrath: the hero is a worker who tames nature through patient labour and good government. The story is also old. A bronze vessel of the Western Zhou period, the Sui Gong xu, made around the 9th century BCE, opens by crediting Yu with dredging the rivers. So by about 900 BCE, Yu the flood-tamer was already a figure worth casting in bronze.</p><blockquote class="wpull"><p>No ark, no drowned world: in China the hero does not escape the flood, he engineers it away.</p></blockquote></section><section class="wsec" id="yu-xia-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The gorge that held a lake</h3><p>Wu Qinglong and colleagues, including the historian David Cohen, published their case in Science in August 2016. In Jishi Gorge, where the upper Yellow River cuts through mountains in Qinghai Province, they found the remains of a huge landslide that had blocked the river, sediments of the lake that filled behind it, and thick flood silts downstream.</p><p>Picture the scene they proposed, with the caution it deserves. Perhaps a spring earthquake shakes the gorge. A mountainside slides into the river and the water stops. Downstream, the familiar roar of the Yellow River falls silent while, upstream, a lake creeps back towards the Xunhua basin for months.</p><figure class="wx wx--steps" id="yu-xia-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">How a landslide lake becomes a megaflood</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How a landslide lake becomes a megaflood"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" class="wx-svg" role="img" aria-labelledby="yu-xia-f1-t"><title id="yu-xia-f1-t">Step-through long profile of the Yellow River at Jishi Gorge showing a landslide dam, the lake behind it, the outburst flood and the dating debate</title><defs><marker id="yu-xia-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker><marker id="yu-xia-f1-ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text class="wx-t-cap" x="24" y="28">Jishi Gorge, upper Yellow River · long profile, simplified</text><polygon class="wx-stone wx-o60" points="40,250 110,200 170,170 230,120 290,80 340,95 380,70 440,110 500,150 560,210 620,240 680,250 680,380 40,380"/><text class="wx-t-b" x="360" y="62" text-anchor="middle">Jishi Gorge</text><text class="wx-t-m wx-halo" x="90" y="236" text-anchor="middle">Xunhua basin</text><text class="wx-t-m wx-halo" x="630" y="232" text-anchor="middle">Guanting basin</text><polygon class="wx-rock wx-edge-soft" points="40,300 200,322 360,345 520,360 680,372 680,420 40,420"/><g class="wx-st wx-hide" data-only="1"><path class="wx-flow wx-s2" d="M40,294 L200,316 L360,339 L520,354 L680,366"/><text class="wx-t-s wx-halo" x="200" y="306">river flows east →</text></g><g class="wx-st wx-hide" data-only="2"><path class="wx-line wx-s2" d="M40,294 L200,316 L360,339"/></g><g class="wx-st wx-hide" data-only="3"><polygon class="wx-water wx-edge-soft" points="40,212 344,212 330,245 300,336.4 200,322 40,300"/><text class="wx-t-b wx-halo" x="64" y="250">lake fills behind the dam</text><text class="wx-t-s wx-halo" x="64" y="265">perhaps within 6–9 months</text></g><g class="wx-st wx-hide" data-only="4"><polygon class="wx-water2 wx-o60" points="40,262 340,262 358,250 366,250 400,300 430,329.6 520,330 680,348 680,372 520,360 360,345 200,322 40,300"/></g><g class="wx-st" data-s="2"><polygon class="wx-stone3 wx-edge" points="300,336.4 330,245 352,205 372,205 400,250 430,351.6"/></g><g class="wx-st wx-hide" data-only="2"><line class="wx-hl" x1="440" y1="130" x2="384" y2="188" marker-end="url(#yu-xia-f1-ah)"/><text class="wx-t-b wx-halo" x="452" y="118">landslide from the gorge wall</text><text class="wx-t-s wx-halo" x="452" y="132">(earthquake proposed)</text></g><g class="wx-st wx-hide" data-s="2"><line class="wx-dim" x1="420" y1="205" x2="420" y2="345.2"/><line class="wx-dim" x1="414" y1="205" x2="426" y2="205"/><line class="wx-dim" x1="414" y1="345.2" x2="426" y2="345.2"/><text class="wx-t-n wx-halo" x="430" y="270">c. 200 m</text></g><g class="wx-st wx-hide" data-s="4"><polygon class="wx-paper" points="352,205 372,205 366,250 358,250"/></g><g class="wx-st wx-hide" data-only="4"><path class="wx-flow wx-s2" d="M300,258 C340,256 360,262 400,290 C440,318 520,330 670,346"/><path class="wx-flow wx-s2" d="M300,270 C350,270 380,290 420,310 C470,330 560,344 670,358"/><text class="wx-t-b wx-halo" x="470" y="290">outburst: c. 400,000 m³/s</text><text class="wx-t-s wx-halo" x="470" y="305">(Wu et al. 2016 estimate)</text></g><g class="wx-st wx-hide" data-s="4"><polygon class="wx-sand wx-edge-soft" points="540,362 600,356 660,362 660,370 540,366"/></g><circle class="wx-accfill wx-pulse" cx="600" cy="362" r="5"/><line class="wx-thin" x1="600" y1="368" x2="600" y2="426"/><text class="wx-t-b" x="600" y="440" text-anchor="middle">Lajia village ruins</text><text class="wx-t-s" x="600" y="454" text-anchor="middle">bodies in houses, dated c. 1920 BCE</text><g class="wx-st wx-hide" data-only="5"><rect class="wx-card wx-edge-soft" x="40" y="90" width="230" height="70" rx="8"/><text class="wx-t-b wx-t-a" x="52" y="110">Wu et al. 2016</text><text class="wx-t-s" x="52" y="126">one dam, breached c. 1920 BCE;</text><text class="wx-t-s" x="52" y="140">same age as the Lajia deaths</text><rect class="wx-card wx-edge-soft" x="450" y="90" width="250" height="84" rx="8"/><text class="wx-t-b wx-t-a" x="462" y="110">Zhang et al. 2019</text><text class="wx-t-s" x="462" y="126">two lakes: c. 8,300–6,300 and</text><text class="wx-t-s" x="462" y="140">6,100–5,600 years ago; Lajia hit</text><text class="wx-t-s" x="462" y="154">by quakes and mudflows instead</text><path class="wx-dash" d="M270,125 C330,150 390,150 450,130"/><text class="wx-t-big wx-t-a" x="360" y="176" text-anchor="middle">?</text></g><text class="wx-t-s" x="40" y="440">Vertical scale much</text><text class="wx-t-s" x="40" y="454">exaggerated; not to scale</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> The Yellow River flows east through Jishi Gorge, between the Xunhua and Guanting basins.</p><ol class="wx-steplist"><li>The Yellow River flows east through Jishi Gorge, between the Xunhua and Guanting basins.</li><li>A landslide, perhaps set off by an earthquake, blocks the gorge with a dam roughly 200 m high.</li><li>A lake backs up behind the dam, perhaps within 6–9 months according to Wu et al.</li><li>The dam fails: an outburst of about 400,000 m³/s scours the gorge and spreads silts downstream to Lajia.</li><li>The dating debate: one flood in 1920 BCE (Wu et al. 2016) or two lakes gone thousands of years earlier (Zhang et al. 2019)?</li></ol><figcaption>Tap through the Jishi Gorge scenario proposed by Wu et al. (2016), then the dating debate. Heights are exaggerated to show the dam. <span class="wx-src">Based on: Wu et al. 2016 (dam, discharge, date); Zhang et al. 2019 (two lakes, luminescence and radiocarbon dates); Dong et al. 2017 and Huang et al. 2017 (Lajia critiques). Profile schematic, vertical scale exaggerated.</span></figcaption><p class="vh">A long profile of the upper Yellow River running left to right from the Xunhua basin through Jishi Gorge to the Guanting basin, where the Lajia village ruins are marked. Step 1: the river flows east through the gorge. Step 2: a landslide from the gorge wall, perhaps triggered by an earthquake, forms a dam about 200 metres high. Step 3: a lake fills behind the dam, perhaps within six to nine months. Step 4: the dam breaches and an outburst of about 400,000 cubic metres per second pours downstream, leaving silts near Lajia. Step 5: two labels compare Wu et al. 2016, one dam breached about 1920 BCE and matching the Lajia deaths, with Zhang et al. 2019, two lakes that drained 8,300 to 5,600 years ago, with Lajia hit by quakes and mudflows instead.</p></figure><p>Their reconstruction is dramatic. An earthquake, they suggested, brought down a mountainside and dammed the river, perhaps about 200 m high. Within months the lake overtopped and tore through, releasing something like 11–16 cubic kilometres of water. They estimated the peak at about 400,000 cubic metres per second, some 500 times the river&#x27;s average flow, which would make it one of the largest freshwater floods of the last 10,000 years.</p><p>The date came from Lajia, a Neolithic village of the Qijia culture in the Guanting basin downstream. Lajia is famous for a heartbreaking scene: skeletons in the houses, including an adult holding a child, apparently caught by sudden disaster. The site also gave the world a bowl of millet noodles about 4,000 years old. Radiocarbon dates on the victims gave 1922 ± 28 BCE. If the flood that buried Lajia was the outburst, the outburst happened then, and a disaster on this scale might have destabilised channels far downstream for years, exactly the world that Yu&#x27;s story describes.</p></section><section class="wsec" id="yu-xia-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The pushback</h3><p>The reply came quickly. In 2017 Science published comments from Han Jianfeng and from Huang Chunchang and colleagues, questioning both the dating and the link between the outburst and Lajia. Dong Guanghui&#x27;s team and others argued that the Lajia disaster was caused by an earthquake followed by local mudflows and flash floods, not by a lake bursting upstream. Wu&#x27;s team answered, and the debate went on.</p><p>The most direct challenge arrived in 2019. Zhang Yuzhu, Huang Chunchang and colleagues studied seven sediment profiles in the gorges using luminescence and radiocarbon dating. They found not one landslide lake but two: the first formed about 8,300 years ago and was gone by about 6,300 years ago; the second formed about 6,100 years ago and drained by about 5,600 years ago. Their title was blunt: no relation to China&#x27;s Great Flood and the Xia dynasty.</p><p>None of this means Wu&#x27;s team imagined the flood. Everyone agrees that landslides have dammed Jishi Gorge and that dammed lakes there have burst. The argument is about when, and about whether one particular flood touched one particular village. That matters, because the whole chain from rocks to legend to dynasty hangs on the Lajia dates. Remove that link and the Jishi outburst becomes a spectacular event from the deep Neolithic, thousands of years before anyone could have written about Yu.</p><aside class="wcall"><b>How do we know?</b><p>A flood date needs something the flood itself touched. Wu&#x27;s team dated bones of people they believed the flood killed, which ties the date to the Lajia disaster rather than directly to the dam. Zhang&#x27;s team dated the lake and dam sediments themselves, by luminescence (when grains last saw sunlight) and radiocarbon. When the two methods disagree by thousands of years, the key question becomes whether the Lajia deaths and the outburst belong together.</p></aside></section><section class="wsec" id="yu-xia-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Dynasty, memory or both?</h3><p>Even a perfectly dated flood would leave the second half of the claim open. Erlitou, near Luoyang in Henan, is the best archaeological candidate for a Xia capital: a planned centre with palaces, bronze workshops and the earliest known bronze ritual vessels in China. But radiocarbon places its main phases at roughly 1750–1530 BCE, and nothing written at Erlitou names it. The Xia–Shang–Zhou Chronology Project gave the Xia dates of about 2070–1600 BCE, which many archaeologists outside China regard as too precise.</p><p>Time has hidden much of the answer. The earliest readable Chinese writing, on Shang oracle bones, begins around 1250 BCE, centuries after the proposed flood. If earlier records existed on bamboo or silk, they have rotted. Any flood deposits on the lower plain lie under metres of later Yellow River silt, a river that has changed course again and again. What survives is a strong memory, a real early state and a real megaflood, without a secure thread tying them together.</p></section><section class="wsec" id="yu-xia-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What would settle it</h3><p>Three findings would move the needle. First, direct dates on the Jishi dam debris and the outburst silts themselves, from several laboratories, would show whether the flood happened around 1920 BCE or thousands of years earlier. Second, a detailed stratigraphy at Lajia would show whether its people died in an outburst flood or a quake-triggered mudflow. Third, cores from the lower Yellow River plain could reveal an outburst layer or a sudden channel change at the right time.</p><p>Until then the fairest reading honours both the story and the rocks. The Yellow River has always been dangerous, and a people who lived beside it remembered, above all, the ruler who made it safe. Whether one specific catastrophe in 1920 BCE started that memory is one of the most interesting open questions in early Chinese history.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">6,300 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">First Jishi landslide lake gone (Zhang et al.)</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">3,600 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Second Jishi lake gone (Zhang et al.)</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">2,070 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Traditional start of the Xia (Chronology Project)</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">1,922 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Proposed Jishi outburst (Wu et al.)</span></li><li class="wtl-build" style="--i:4"><span class="wtl-y">1,750 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Erlitou grows into a major centre</span></li><li class="wtl-build" style="--i:5"><span class="wtl-y">900 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Sui Gong xu bronze credits Yu</span></li><li class="wtl-event" style="--i:6"><span class="wtl-y">94 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Sima Qian&#x27;s Shiji tells the Xia story</span></li><li class="wtl-find" style="--i:7"><span class="wtl-y">2005 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Lajia noodles published</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2016 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Outburst flood paper in Science</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">2019 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Two older lakes: &#x27;no relation&#x27; to the Great Flood</span></li></ol><details class="srcs"><summary>Sources for this case (12)</summary><ol><li>Wu Q. et al. (2016). Outburst flood at 1920 BCE supports historicity of China&#x27;s Great Flood and the Xia dynasty. Science 353: 579–582. <a href="https://doi.org/10.1126/science.aaf0842" target="_blank" rel="noopener">doi:10.1126/science.aaf0842</a></li><li>Han J. (2017). Comment on &#x27;Outburst flood at 1920 BCE supports historicity of China&#x27;s Great Flood and the Xia dynasty&#x27;. Science 355: 1382. <a href="https://doi.org/10.1126/science.aal1369" target="_blank" rel="noopener">doi:10.1126/science.aal1369</a></li><li>Huang C.C. et al. (2017). Comment on &#x27;Outburst flood at 1920 BCE supports historicity of China&#x27;s Great Flood and the Xia dynasty&#x27;. Science 355: 1382. <a href="https://doi.org/10.1126/science.aak9657" target="_blank" rel="noopener">doi:10.1126/science.aak9657</a></li><li>Wu Q. et al. (2017). Response to Comments on &#x27;Outburst flood at 1920 BCE supports historicity of China&#x27;s Great Flood and the Xia dynasty&#x27;. Science 355: 1382. <a href="https://doi.org/10.1126/science.aal1325" target="_blank" rel="noopener">doi:10.1126/science.aal1325</a></li><li>Zhang Y. et al. (2019). Formation and evolution of the Holocene massive landslide-dammed lakes in the Jishixia Gorges along the upper Yellow River: No relation to China&#x27;s Great Flood and the Xia Dynasty. Quaternary Science Reviews 218: 267–280. <a href="https://doi.org/10.1016/j.quascirev.2019.06.011" target="_blank" rel="noopener">doi:10.1016/j.quascirev.2019.06.011</a></li><li>Dong G. et al. (2017). Paper on the relation between the Lajia disaster and the proposed outburst flood. Science China Earth Sciences.</li><li>Liu L., Xu H. (2007). Rethinking Erlitou: legend, history and Chinese archaeology. Antiquity 81: 886–901. <a href="https://doi.org/10.1017/S0003598X00095983" target="_blank" rel="noopener">doi:10.1017/S0003598X00095983</a></li><li>Lu H. et al. (2005). Millet noodles in Late Neolithic China. Nature 437: 967–968. <a href="https://doi.org/10.1038/437967a" target="_blank" rel="noopener">doi:10.1038/437967a</a></li><li>Legge J. (trans.) (1865). The Chinese Classics, Vol. III: The Shoo King. Hong Kong.</li><li>Legge J. (trans.) (1861). The Chinese Classics, Vol. II: The Works of Mencius. Hong Kong.</li><li>Liu L., Chen X. (2012). The Archaeology of China: From the Late Paleolithic to the Early Bronze Age. Cambridge University Press.</li><li>Sui Gong xu (Bin Gong xu) bronze inscription, Western Zhou, c. 9th century BCE; Poly Art Museum, Beijing.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-yu-xia" data-t="Yu the Great and the Flood That Made a Dynasty"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Yu the Great and the Flood That Made a Dynasty</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-yu-xia</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-iram-ubar-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Shisr (Ubar)9.jpg" data-cap="The ruins at Shisr, Oman" data-big><figcaption></figcaption></figure><div class="sh-k">Peoples of the Sacred Texts</div><h2 class="sh-t" id="case-iram-ubar-st" tabindex="-1">ʿĀd and Iram of the Pillars: The City Under the Sands</h2><p class="sh-s">The Quran remembers ʿĀd, a people of lofty pillars destroyed by a wind. In 1992 space radar led explorers to a fort that had fallen into the earth.</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> The fort at Shisr in Oman is Iram of the pillars, the city of the people of ʿĀd.</p><p class="sh-claim"><b>The text's own words:</b> <span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span> <span class="sh-more">(line by line below)</span></p></div><p class="v4-q">Was the fort at Shisr in Oman the lost Iram of the people of ʿĀd?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>The Quran remembers Iram of the pillars, city of the people of Ad, lost to the sands.</li><li>In the 1990s, satellite images of old caravan tracks led to a fort at Shisr in Oman, half swallowed by a sinkhole.</li><li>The fort is real, and its collapse is real, but its main phases are far younger than a people placed before Thamud.</li><li>No inscription names Iram or Ad, and the excavator concluded Ubar was a region, not this town.</li><li>Ad&#x27;s remains may lie elsewhere under the sands; at Shisr the identification awaits evidence.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Texts and scripts</span><span class="thr">Religion and myth</span></div></section><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The fort at Shisr in Oman is Iram of the pillars, the city of the people of ʿĀd.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Shisr is real, and the collapse into its sinkhole is real, but nothing ties it to Iram or ʿĀd. There is no inscription, the fort&#x27;s main phases are far younger than a people placed before Thamud, and the man who excavated it concluded that Ubar was a region, not this town. The identification rests on legend, tracks and a striking coincidence of ruin. It remains possible that ʿĀd&#x27;s remains lie elsewhere under the sands, but at Shisr the claim awaits evidence.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 3 of 6, leaning one way"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>leaning one way</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Scholarly works are cautious, but tourist signage and much of the 1992 press coverage announced &#x27;the lost city of Ubar&#x27; with a confidence the evidence never had. At the same time, dismissing ʿĀd as pure legend goes too far: Arabia&#x27;s greener past, its lost incense towns and its unsurveyed dunes leave real room for peoples that archaeology has simply not yet found.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Radar from the Space Shuttle (SIR-B, 1984) and Landsat and SPOT satellite images, processed at NASA&#x27;s Jet Propulsion Laboratory, showed old caravan tracks in southern Oman that helped guide ground expeditions in 1990–1992.<small>JPL 1992; Blom et al. 2007</small></li><li>Excavations directed by Juris Zarins at Shisr uncovered a fortified settlement with walls and towers around a well above a limestone cavern; part of the fort had collapsed into the resulting sinkhole.<small>Zarins 2001</small></li><li>Dhofar was a heartland of the frankincense trade; Shisr, the port of Khor Rori (Sumhuram), al-Baleed and the frankincense trees of Wadi Dawkah form UNESCO&#x27;s &#x27;Land of Frankincense&#x27; (inscribed 2000).<small>UNESCO World Heritage listing 1010</small></li><li>Arabia&#x27;s deserts were far greener in humid phases: lakes formed in the Rub&#x27; al-Khali during the early Holocene and in earlier interglacials.<small>McClure 1976; Rosenberg et al. 2011</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether Shisr was &#x27;Ubar&#x27; or &#x27;Iram&#x27; at all. Its excavator, Juris Zarins, concluded that Ubar was a region and a people, not a single town; the geologist H. Stewart Edgell called Shisr a small caravanserai.</li><li>The site&#x27;s age: early announcements spoke of roots around 3000 BCE, while later summaries place the fort mainly in the first millennium CE, with use continuing into the 15th–16th centuries.</li><li>What Iram was: a city, a tribe (with &#x27;pillars&#x27; as tent poles or tall people), or a place elsewhere, such as Wadi Rum in Jordan, where Nabataean-era inscriptions at the temple of al-Lat mention Iram.</li><li>When and why the fort collapsed: the expedition proposed c. 300–500 CE, by earthquake or by groundwater drawn from beneath it.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>No inscription naming Iram, ʿĀd or Ubar has been found at Shisr.</li><li>In the Quran&#x27;s sequence ʿĀd came before Thamud, who are attested by 715 BCE, so their remains, if found, should be far older than Shisr&#x27;s fort.</li><li>Moving dunes bury and uncover sites, and most of the Rub&#x27; al-Khali and the dune country of al-Ahqaf has never been systematically surveyed.</li></ul></div></div><h3 class="sub-h wsub">How the traditions tell it</h3><div class="v4texts"><blockquote class="quote v4q"><span class="v4q-t">Quran · 89:6–8</span><p>Have you [Prophet] considered how your Lord dealt with [the people] of &#x27;Ad, of Iram, [the city] of lofty pillars, whose like has never been made in any land,</p><cite>trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Quran · 46:21</span><p>Mention [Hud] of the tribe of Ad: he warned his people among the sand dunes</p><cite>trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Quran · 46:24–25</span><p>When they saw a cloud approaching their valley, they said, &#x27;This cloud will give us rain!&#x27; &#x27;No indeed! It is what you wanted to hasten: a storm-wind bearing a painful punishment which will destroy everything by its Lord&#x27;s command.&#x27; In the morning there was nothing to see except their [ruined] dwellings</p><cite>trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Quran · 69:6–8</span><p>Ad was destroyed by a furious wind that God let loose against them for seven consecutive nights, eight consecutive days, so that you could have seen its people lying dead like hollow palm-trunks. Can you see any trace of them now?</p><cite>trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote></div><h3 class="sub-h wsub">In the text's own words</h3><p class="rd-rule">Each line rates only what the text itself says, not later dates, commentaries or modern identifications.</p><ul class="rds"><li class="rd"><p class="rd-s">The people of ʿĀd lived among the sand dunes, al-Ahqaf, and Iram was a place of lofty pillars unlike any other (Quran 46:21; 89:6–8).</p><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span><p class="rd-n">No inscription yet names ʿĀd with certainty, and Iram has not been identified. Southern Arabia has drowned sites under moving dunes; the Shisr fort is one candidate among several.</p></li><li class="rd"><p class="rd-s">ʿĀd were destroyed by a furious wind over seven nights and eight days (Quran 69:6–7).</p><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span><p class="rd-n">Climate records show the Arabian interior drying sharply after the Holocene wet phase, and dust storms that bury settlements are real, but no single dated catastrophe has been linked to ʿĀd.</p></li></ul><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Archaeologists value Shisr as a real and important water stop on the frankincense routes, and the 1990s project as a milestone in remote sensing. Most doubt that it is the Iram of the Quran or the Ubar of later legend. No inscription names it, its fort is too young for a people whom the Quran places before Thamud, and even its excavator came to see Ubar as a region and a people rather than a city. Iram&#x27;s location, and whether it was a city or a tribe, remains unknown.</p><ul><li>Shisr is a real fortified well on an incense route, consistent with trade across the desert edge.</li><li>The fort&#x27;s main phases are much later than the setting of the ʿĀd story.</li><li>Other candidates for Iram exist, notably Wadi Rum in Jordan, with inscriptions that mention the name.</li><li>&#x27;Ubar&#x27; in medieval Arabic sources may be a region or a people rather than a town.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Clapp, a documentary filmmaker, spent years on the trail of Ubar, the fabled incense city that Arab tradition linked to Iram and to a proud people destroyed for their arrogance. He enlisted JPL&#x27;s radar scientists, the explorer Ranulph Fiennes, the lawyer George Hedges and the archaeologist Juris Zarins. Tracks seen from space converged on the Shisr area. At the well they found a fort with towers, imported goods from across the ancient world, and, strikingly, walls that had tumbled into a sinkhole, just as legend said the city had been swallowed.</p><ul><li>Ancient tracks seen from orbit lead to Shisr&#x27;s rare, reliable water.</li><li>The fort had towers, the most natural reading of &#x27;pillars&#x27; in stone.</li><li>Its partial collapse into the ground echoes the legend of a city that vanished suddenly.</li></ul><div class="face-s"><b>Its strongest point</b><p>The fort at Shisr sits where ancient caravan tracks seen from orbit converge on a rare, reliable water source, and part of it really did collapse into the earth, echoing Arabian legends of a proud city swallowed whole.</p></div><p class="face-cr"><b>Credit</b> Nicholas Clapp; Sir Ranulph Fiennes; George Hedges</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>An inscription at Shisr or nearby naming Iram, ʿĀd or Ubar.</li><li>A full radiocarbon and luminescence dating programme for the earliest layers around the Shisr well.</li><li>Systematic survey of the dune country of al-Ahqaf between Hadramawt and Dhofar, where the Quran places Hud&#x27;s warning.</li><li>Further excavation and epigraphic study at Wadi Rum, the main rival candidate for Iram.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,036 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of ʿĀd and Iram of the Pillars: The City Under the Sands"><button type="button" class="wtoc-i" data-go="iram-ubar-s1">The city the wind erased</button><button type="button" class="wtoc-i" data-go="iram-ubar-s2">ʿĀd in the Quran&#x27;s own words</button><button type="button" class="wtoc-i" data-go="iram-ubar-s3">Radar over the Empty Quarter</button><button type="button" class="wtoc-i" data-go="iram-ubar-s4">A fort that fell into the earth</button><button type="button" class="wtoc-i" data-go="iram-ubar-s5">Is it Iram?</button><button type="button" class="wtoc-i" data-go="iram-ubar-s6">A greener Arabia, and what the sands still hide</button></nav></div><section class="wsec" id="iram-ubar-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The city the wind erased</h3><p>In a short, thundering chapter of the Quran called al-Fajr, the Dawn, the listener is asked to remember what happened to three proud peoples. The first is ʿĀd.</p><blockquote class="quote"><p>Have you [Prophet] considered how your Lord dealt with [the people] of &#x27;Ad, of Iram, [the city] of lofty pillars, whose like has never been made in any land,</p><cite>Quran 89:6–8, trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><p>Iram of the pillars became one of the great lost cities of the Arab imagination. Medieval storytellers turned it into a city of gold and gems hidden in the deep desert. In 1930 the British explorer Bertram Thomas, crossing towards the Empty Quarter, was shown old tracks by his Bedouin guides and told they led to a city destroyed long ago for its wickedness. He seems to have coined the phrase later popularised as the Atlantis of the Sands, often wrongly credited to T. E. Lawrence.</p><p>Sixty years later, a filmmaker from Los Angeles would chase those tracks with the help of the Space Shuttle.</p></section><section class="wsec" id="iram-ubar-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>ʿĀd in the Quran&#x27;s own words</h3><p>The Quran tells the story of ʿĀd in several places, and it is worth hearing on its own terms before any spade goes in. ʿĀd were a strong, prosperous people who came before Thamud. God sent them a prophet from among themselves, Hud, who warned them to worship God alone. Surah al-Ahqaf, named after the sand dunes, says he warned them &#x27;among the sand dunes&#x27;. They mocked him and asked him to bring on the punishment he promised.</p><blockquote class="quote"><p>When they saw a cloud approaching their valley, they said, &#x27;This cloud will give us rain!&#x27; &#x27;No indeed! It is what you wanted to hasten: a storm-wind bearing a painful punishment which will destroy everything by its Lord&#x27;s command.&#x27; In the morning there was nothing to see except their [ruined] dwellings</p><cite>Quran 46:24–25, trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><p>Surah al-Haqqa adds that the wind blew for seven nights and eight days, and ends with a question that is also an archaeologist&#x27;s question: can you see any trace of them now? Muslim tradition generally located ʿĀd in southern Arabia, in the dune belt between Hadramawt and Oman, and a much-visited shrine in Wadi Hadramawt, Qabr Hud, is honoured as the prophet&#x27;s tomb. The text itself names a people and Iram, but not a map reference.</p><blockquote class="wpull"><p>The Quran ends ʿĀd&#x27;s story with an archaeologist&#x27;s question: can you see any trace of them now?</p></blockquote></section><section class="wsec" id="iram-ubar-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Radar over the Empty Quarter</h3><p>Nicholas Clapp became fascinated by the legend of Ubar, the incense city that later tradition linked to Iram. In 1981 he first approached NASA&#x27;s Jet Propulsion Laboratory about searching from space. In 1984 the Shuttle Challenger carried an imaging radar that could see through thin, dry sand, and JPL scientists including Ronald Blom and Charles Elachi helped read the results. Combined with Landsat and French SPOT satellite images, the data showed faint old tracks, the paths worn by centuries of camels, running across southern Oman.</p><p>The team was an adventure novelist&#x27;s cast: Clapp, the lawyer George Hedges, the explorer Sir Ranulph Fiennes and the archaeologist Juris Zarins. After expeditions in 1990 and 1991, attention settled on Shisr, a village with a well at the edge of the sands, where Wilfred Thesiger had noted a crude ruined fort in 1946. In February 1992 the New York Times carried the news: Ubar found.</p></section><section class="wsec" id="iram-ubar-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>A fort that fell into the earth</h3><p>What Zarins&#x27;s team uncovered was a genuine desert stronghold: walls and towers enclosing a well, with pottery and goods that spoke of long-distance trade. Frankincense, the resin of Boswellia sacra, grows in Dhofar&#x27;s hills and was carried by caravan and ship to Mesopotamia, Egypt and the Mediterranean. A fortified water point on the desert edge made sense on that trade.</p><figure class="wx wx--steps" id="iram-ubar-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">How a fort fell into the ground</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How a fort fell into the ground"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" class="wx-svg" role="img" aria-labelledby="iram-ubar-f1-t"><title id="iram-ubar-f1-t">Step-through cross-section of the Shisr fort in Oman showing a limestone cavern under a well, the fort built above it, falling groundwater and the collapse of part of the fort into a sinkhole</title><defs><marker id="iram-ubar-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker><marker id="iram-ubar-f1-ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text class="wx-t-cap" x="24" y="28">Shisr, Dhofar · how a fort fell into the ground (schematic section)</text><rect class="wx-sky" x="20" y="40" width="680" height="130"/><rect class="wx-stone wx-edge-soft" x="20" y="170" width="680" height="280"/><line class="wx-guide" x1="20" y1="230" x2="700" y2="230"/><line class="wx-guide" x1="20" y1="290" x2="700" y2="290"/><line class="wx-guide" x1="20" y1="350" x2="700" y2="350"/><line class="wx-guide" x1="20" y1="410" x2="700" y2="410"/><path class="wx-sand wx-edge-soft" d="M20,170 C60,150 90,146 130,160 C160,170 190,150 230,152 C260,154 280,166 300,170 Z"/><text class="wx-t-s wx-halo" x="120" y="196" text-anchor="middle">sand sheet of the Empty Quarter</text><path class="wx-sky wx-edge" d="M360,262 C360,215 420,205 460,208 C520,210 565,225 560,272 C558,322 520,344 460,344 C400,344 360,322 360,262 Z"/><path class="wx-sky" d="M378,170 L542,170 L552,228 C530,212 500,208 460,208 C420,205 392,212 366,232 Z"/><text class="wx-t-b wx-halo" x="590" y="39 x1="147" y1="151" x2="147" y2="162"/></g><text class="wx-t-s wx-halo" x="100" y="118" text-anchor="middle">incense caravans</text></g><g class="wx-st wx-hide" data-s="4"><polygon class="wx-stone3 wx-edge" points="372,320 420,300 446,330 400,344"/><polygon class="wx-stone3 wx-edge" points="440,334 476,296 520,312 500,344"/><polygon class="wx-stone3 wx-edge" points="505,340 540,300 552,318 530,342"/><polygon class="wx-stone3 wx-edge" points="380,262 412,240 420,276 390,292"/><polygon class="wx-stone2 wx-edge" points="452,280 470,240 488,247 470,288"/><polygon class="wx-stone3 wx-edge" points="424,300 448,262 466,272 444,306"/></g><g class="wx-st wx-hide" data-only="4"><line class="wx-hl" x1="430" y1="112" x2="440" y2="190" marker-end="url(#iram-ubar-f1-ah)"/><line class="wx-hl" x1="490" y1="112" x2="480" y2="190" marker-end="url(#iram-ubar-f1-ah)"/><text class="wx-t-b wx-halo" x="460" y="96" text-anchor="middle">roof gives way: part of the fort drops into the pit</text></g><g class="wx-st wx-hide" data-only="5"><path class="wx-sand wx-o80" d="M380,172 C420,196 500,196 540,172 L552,228 C520,240 400,240 366,232 Z"/><text class="wx-t-b wx-halo" x="460" y="96" text-anchor="middle">1991–92: walls and a tower found lying in the sinkhole</text><text class="wx-t-s wx-halo" x="460" y="112" text-anchor="middle">after long, reduced use of the site</text></g><text class="wx-t-s" x="700" y="466" text-anchor="end">Schematic, not to scale; based on excavation descriptions, not a survey.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> A limestone plateau at the edge of the sands: groundwater has dissolved a cavern, and a well reaches water.</p><ol class="wx-steplist"><li>A limestone plateau at the edge of the sands: groundwater has dissolved a cavern, and a well reaches water.</li><li>A walled fort with towers is built around the well; incense caravans gather here.</li><li>Water drawn for people, animals and fields lowers the water table; the cavern roof weakens and cracks.</li><li>The roof gives way and part of the fort falls into the new sinkhole (the expedition suggested c. 300–500 CE).</li><li>Sand drifts in. The site stays in reduced use for centuries; in 1991–92 excavators find walls and a tower lying in the pit.</li></ol><figcaption>Tap through five stages of the Shisr collapse as the excavators described it. Schematic, not to scale. <span class="wx-src">Based on: Zarins 2001 and Clapp 1998 (fort around the well, collapse into the sinkhole, proposed date); schematic geometry, not a survey drawing.</span></figcaption><p class="vh">A cross-section through a limestone plateau at the edge of the sand. Step 1: underground water has dissolved a cavern beneath the surface, and a well shaft reaches a pool at the water table. Step 2: a walled fort with towers is built around the well, and incense caravans approach from the dunes. Step 3: the water table falls as water is drawn, and cracks spread through the thinning cavern roof. Step 4: the roof gives way and part of the fort, including a tower, drops into the pit as tumbled blocks. Step 5: sand drifts into the sinkhole, and a label notes that in 1991 and 1992 excavators found walls and a tower lying in it after long, reduced use of the site.</p></figure><p>Then came the detail that made headlines. The fort had been built over a limestone cavern, the very cavity that held the water. At some point the roof gave way, and part of the fort, including a tower and wall, fell into the sinkhole. The expedition suggested this happened around 300–500 CE, perhaps triggered by an earthquake or by lowering groundwater as the well was drawn on. A city swallowed by the earth, as the legends said.</p><aside class="wcall"><b>How do we know?</b><p>Shuttle radar works best where sand is thin and very dry: microwaves pass through a thin cover and bounce off the harder surface below, while ancient tracks, compacted by generations of animals, reflect differently from the ground around them. Radar did not find the fort itself, which was too small to see. It showed where the old routes went.</p></aside></section><section class="wsec" id="iram-ubar-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Is it Iram?</h3><p>Here the story turns, and it is the excavator who turns it. Juris Zarins came to the view that Ubar was not a single town but a region and a people. The geologist H. Stewart Edgell argued that Shisr was a small caravanserai and that the Ubar legend was essentially mythical. Nigel Groom questioned the link to Ptolemy&#x27;s &#x27;Omanum Emporium&#x27;, which Fiennes had proposed.</p><p>The biggest problem is time. In the Quran&#x27;s sequence, ʿĀd came before Thamud, and Thamud appear in the annals of the Assyrian king Sargon II around 715 BCE. Shisr&#x27;s fort, in most later summaries, belongs mainly to the first millennium CE and was used into the Islamic period. Early press releases spoke of a settlement going back to about 3000 BCE, but the fortified town that fell into the sinkhole is far younger than any plausible date for ʿĀd.</p><p>Iram itself remains uncertain. Some commentators read it as the name of ʿĀd&#x27;s tribe or ancestor, with the &#x27;pillars&#x27; as tent poles or tall stature; others as a place. At Wadi Rum in southern Jordan, inscriptions at a Nabataean-era temple of the goddess al-Lat mention Iram, and some scholars think that a better candidate. None of these identifications is secure.</p></section><section class="wsec" id="iram-ubar-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>A greener Arabia, and what the sands still hide</h3><p>There is a deeper background that makes the story of a lost desert people more plausible than it first sounds. Arabia has not always been desert. Lake beds in the Rub&#x27; al-Khali record wet phases in the early Holocene, and older lakes date to earlier interglacials. When the monsoon reached further north, grassland, lakes and animals followed, and so did people. When it retreated, communities had to move, shrink or vanish.</p><p>Time and sand have hidden most of that story. Dunes migrate and bury; wind erases mudbrick; the dune country of al-Ahqaf, where the Quran places Hud&#x27;s warning, has hardly been surveyed. The absence of ʿĀd from the archaeological record is the absence of evidence in a place almost nobody has looked.</p><p>What would settle it? An inscription naming Iram or ʿĀd would change everything. So would systematic survey and dating in the dunes between Hadramawt and Dhofar, and further work at Wadi Rum. Shisr remains a remarkable place, a real incense fort that really did fall into the ground. It is simply not, on present evidence, the city of lofty pillars.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">1930 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Bertram Thomas hears of a lost city from Bedouin guides</span></li><li class="wtl-find" style="--i:1"><span class="wtl-y">1946 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Wilfred Thesiger notes a ruined fort at Shisr well</span></li><li class="wtl-study" style="--i:2"><span class="wtl-y">1984 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Shuttle radar images southern Oman</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">1990 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">First ground expedition</span></li><li class="wtl-find" style="--i:4"><span class="wtl-y">1992 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Discovery of &#x27;Ubar&#x27; announced</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">1998 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Clapp&#x27;s The Road to Ubar</span></li><li class="wtl-event" style="--i:6"><span class="wtl-y">2000 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Land of Frankincense on the World Heritage List</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2001 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Zarins: Ubar a region and people, not one town</span></li></ol><details class="srcs"><summary>Sources for this case (12)</summary><ol><li>Abdel Haleem M.A.S. (trans.) (2004). The Qur&#x27;an: A New Translation. Oxford University Press.</li><li>Clapp N. (1998). The Road to Ubar: Finding the Atlantis of the Sands. Boston: Houghton Mifflin.</li><li>Zarins J. (2001). The Land of Incense: Archaeological Work in the Governorate of Dhofar, Sultanate of Oman, 1990–1995. Sultan Qaboos University.</li><li>Blom R.G. et al. (2007). Southern Arabian desert trade routes, frankincense, myrrh, and the Ubar legend. In Wiseman J., El-Baz F. (eds), Remote Sensing in Archaeology. New York: Springer.</li><li>NASA Jet Propulsion Laboratory (1992). JPL technology and expertise key role in lost city discovery. News release, 5 February 1992.</li><li>Edgell H.S. (2004). The myth of the &#x27;Lost City of the Arabian Sands&#x27;. Proceedings of the Semi
