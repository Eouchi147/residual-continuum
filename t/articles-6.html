ding planes cut</text><text class="wx-t-m wx-halo" x="452" y="224">by upright joints</text></g><text class="wx-t-m wx-halo wx-pop" style="--d:5" x="48" y="82">Island shore</text><g class="wx-pop" style="--d:10"><path class="wx-dim" d="M676,110 V380 M670,110 H682 M670,170 H682 M670,230 H682 M670,290 H682 M670,350 H682"/><text class="wx-t-s" x="686" y="114">0 m</text><text class="wx-t-s" x="686" y="174">10</text><text class="wx-t-s" x="686" y="234">20</text><text class="wx-t-s" x="686" y="294">30</text><text class="wx-t-s" x="686" y="354">40</text></g><g class="wx-pop" style="--d:10"><rect class="wx-inkfill" x="470" y="420" width="30" height="6"/><rect class="wx-paper wx-edge" x="500" y="420" width="30" height="6"/><text class="wx-t-s" x="470" y="442" text-anchor="middle">0</text><text class="wx-t-s" x="530" y="442" text-anchor="middle">10 m</text></g><text class="wx-t-h" x="24" y="50">Twenty thousand years of rising sea</text><g class="wx-st wx-hide" data-only="1"><text class="wx-t-b wx-t-a wx-halo" x="612" y="366" text-anchor="end">20,000 years ago: sea c. 120 m</text><text class="wx-t-b wx-t-a wx-halo" x="612" y="382" text-anchor="end">lower, far off the drawing</text><path class="wx-line" d="M632,356 V386"/><path class="wx-inkfill" d="M626,382 L632,394 L638,382 Z"/></g><text class="wx-t-b wx-t-a wx-halo wx-st wx-hide" data-only="2" x="640" y="336" text-anchor="end">c. 10,500 years ago: sea 35–45 m lower</text><text class="wx-t-b wx-t-a wx-halo wx-st wx-hide" data-only="3" x="640" y="246" text-anchor="end">c. 9,500 years ago: sea reaches the base</text><text class="wx-t-b wx-t-a wx-halo wx-st wx-hide" data-only="4" x="640" y="138" text-anchor="end">c. 7,000 years ago: top terrace goes under</text><text class="wx-t-b wx-t-a wx-halo wx-st wx-hide" data-only="5" x="640" y="102" text-anchor="end">Today: top c. 5 m down, base c. 25 m</text><g class="wx-st wx-hide" data-s="5"><text class="wx-t" x="24" y="428">Kimura's later date (2,000–3,000 years ago)</text><text class="wx-t" x="24" y="444">would need c. 20 m of local sinking since.</text></g><text class="wx-t-s" x="24" y="470">Global sea-level curve after Lambeck et al. 2014; local uplift or subsidence not known precisely. Profile simplified.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> 20,000 years ago, at the height of the last Ice Age, the sea is about 120 m lower. The sandstone outcrop is a dry hillside above a coastal plain.</p><ol class="wx-steplist"><li>20,000 years ago, at the height of the last Ice Age, the sea is about 120 m lower. The sandstone outcrop is a dry hillside above a coastal plain.</li><li>About 10,500 years ago the sea is still roughly 35 to 45 m lower. The whole formation stands on dry land. Kimura&#x27;s first estimate put its builders about here.</li><li>About 9,500 years ago the rising sea reaches the base platform, now 25 m deep, and waves begin working on the lowest ledges.</li><li>About 7,000 years ago the top terrace, now 5 m deep, goes under. From here on the formation is entirely submarine.</li><li>Today the top lies about 5 m down and the base about 25 m. Kimura&#x27;s later date of 2,000 to 3,000 years ago would require about 20 m of local sinking since then.</li></ol><figcaption>Step through 20,000 years of rising sea over a simplified profile of the formation, drawn at true scale. Dates follow the global sea-level curve; local tectonic movement could shift them. <span class="wx-src">Based on: Depths after Schoch (1999) and Kimura&#x27;s surveys; geometry simplified from published profiles; sea level after the global curve of Lambeck et al. (2014), without a local tectonic correction.</span></figcaption><p class="vh">A side profile of the Yonaguni formation: an island shore on the left drops to a flat top terrace about 5 m below today&#x27;s sea level, then down a series of terraces, each following flat bedding planes and upright joints drawn as faint lines, to a base platform about 25 m deep. A depth ruler runs from 0 to 40 m on the right and a 10 m scale bar sits below. Step 1, 20,000 years ago: no water on the drawing, the sea is about 120 m lower. Step 2, about 10,500 years ago: the sea is 35 to 45 m lower and the formation is dry. Step 3, about 9,500 years ago: the water reaches the base. Step 4, about 7,000 years ago: the top terrace goes under. Step 5, today: the sea covers everything; a note says Kimura&#x27;s later date would need about 20 m of local sinking.</p></figure><aside class="wcall"><b>How do we know?</b><p>Sea-level history comes from dated corals, peats and shorelines around the world, combined with models of how the Earth&#x27;s crust responds as ice sheets melt. The global curve used here is that of Kurt Lambeck and colleagues (2014). Local movement matters too: the Ryukyu arc sits above an active subduction zone, so a particular stretch of coast may have risen or sunk by metres. For Yonaguni that local correction has not been measured precisely, so every date on the drawing is approximate.</p></aside></section><section class="wsec" id="yonaguni-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The case for a monument</h3><p>Kimura&#x27;s case, built over hundreds of dives, rests on the whole ensemble. He describes a main terrace with steps leading up to it, a straight channel he reads as a drainage ditch or road, two tall parallel slabs standing side by side, a &#x27;triangle pool&#x27;, and a rock he compares to a carved face. He has reported stones that look worked and incised marks that he compares with signs used later in the Ryukyus. In his view nature might make one of these features, but not all of them together in one place. His first estimate for the builders was about 10,000 years ago. At the Pacific Science Congress in Okinawa in 2007 he proposed instead that the site was shaped 2,000 to 3,000 years ago and later sank through earthquakes and subsidence.</p><p>Graham Hancock dived Yonaguni repeatedly while writing Underworld (2002), his survey of coastlines drowned at the end of the Ice Age. His position is more cautious than the popular image of it. He accepted that the core of the formation is natural rock and argued that people may have cut it back, levelled it and added to it, turning an outcrop into a place of ceremony. That reading, a natural feature improved by human hands, is how many undisputed sacred sites began.</p><p>The strongest part of the challengers&#x27; case is not a single right angle. It is context. People reached the Ryukyu islands at least 30,000 years ago, crossing open sea to do it. For most of the time they lived here, the coastline lay far below today&#x27;s. The site has been photographed and filmed, but it has never been excavated.</p></section><section class="wsec" id="yonaguni-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The case for nature</h3><p>Here the story takes a turn that surprises many readers. The most influential sceptic is himself a challenger of the mainstream. Robert Schoch, the Boston University geologist famous for arguing that the Great Sphinx is far older than Egyptologists allow, dived Yonaguni in 1997 and 1998. He came up convinced that it was most likely natural. The rocks, he wrote, contain numerous well-defined parallel bedding planes crossed by parallel joints, and it is along those natural fractures that the rectangular forms break away. Waves pounding the jointed sandstone as the sea rose would strip blocks off layer by layer, leaving steps and terraces behind.</p><p>Others agree. The German geologist Wolf Wichmann studied the site in 1999 and 2001 and found natural processes enough. Patrick Nunn, a geographer of Pacific coasts, notes the same step-and-terrace forms in the sandstone along Yonaguni&#x27;s dry shore. In 2020 a Japanese team led by Takayuki Ogata analysed the submarine topography and concluded that weathering and erosion acting on bedding and linear joints can explain the landform. The Japanese government does not list it as a heritage site.</p><blockquote class="wpull"><p>The most influential sceptic of the Yonaguni monument is Robert Schoch, the geologist who argues the Sphinx is thousands of years older than Egyptologists allow.</p></blockquote><p>The sceptics also point to what is missing. There are no coursed walls of separate blocks, no quarry debris laid out in a pattern, no dated charcoal, no tools found in place. The loose blocks lie where gravity dropped them. Kimura&#x27;s worked stones and marks have not been published in a way that other specialists can test.</p></section><section class="wsec" id="yonaguni-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>What the sea has hidden</h3><p>Even if the formation is natural, the bigger question behind it is a good one. The people who crossed to the Ryukyus 30,000 years ago were skilled mariners, and their beaches, camps and landing places now lie under tens of metres of water. On land, archaeologists have found their traces in caves on Okinawa and Ishigaki. Offshore, almost no one has looked, and a coast drowned by 100 m of rising sea is hard to search. Wood rots, hearths wash out, and currents like the Kuroshio scour the seabed clean.</p><aside class="wcall"><b>Fresh from the field</b><p>In 2019 a Japanese and Taiwanese team led by Yousuke Kaifu carved a 7.5 m dugout canoe from a single cedar trunk with replica stone-age tools and paddled it from eastern Taiwan across the Kuroshio to Yonaguni, 225 km in over 45 hours, navigating by sun, stars and swell. Published in Science Advances in 2025, the voyage shows that Ice Age people could have made exactly this crossing on purpose.</p></aside><p>So the Yonaguni debate has two layers. On the first, whether this particular rock was carved, the evidence leans heavily towards nature. On the second, whether drowned Ice Age coasts in this region held human settlements we have never seen, the answer is almost certainly yes, and the search has barely begun.</p></section><section class="wsec" id="yonaguni-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What would settle it</h3><p>Arguments from photographs will not end this. Digging will. The channels and lower terraces hold sediment that has sat there since the sea arrived. If people worked the rock while it was dry, their debris, flakes, charcoal and broken tools, should lie at the base of that sediment, and radiocarbon could date it. A complete 3D model of the formation, compared feature by feature with the same sandstone exposed on the island, would show whether anything underwater is truly unlike what waves make on land. Alleged tool marks can be sampled and examined under the microscope beside marks made by waves, boring shellfish and known tools.</p><ul class="wlist"><li>If dated tools or hearths turn up in the sediment: a human site, at least in part.</li><li>If the underwater forms match the dry-land outcrops in every respect and the sediments are sterile: a beautiful natural monument, and a clue to where not to look.</li><li>Either way: a measured local sea-level history for Yonaguni, which would pin down when each terrace was last dry.</li></ul><p>Until then, Yonaguni is best described as what it certainly is: one of the most striking underwater landscapes on Earth, on a coast that Ice Age sailors knew, still waiting for the excavation that could change its story.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">28,000 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">People are living in the Ryukyu islands</span></li><li class="wtl-loss" style="--i:1"><span class="wtl-y">7,500 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Rising sea reaches the base (global curve, approximate)</span></li><li class="wtl-loss" style="--i:2"><span class="wtl-y">5,000 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Top terrace goes under (approximate)</span></li><li class="wtl-find" style="--i:3"><span class="wtl-y">1986 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Diver Kihachiro Aratake spots the formation</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">1997 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Robert Schoch makes his first dives</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">2002 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Hancock&#x27;s Underworld brings it to a world audience</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2007 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Kimura proposes a date of 2,000–3,000 years ago</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2019 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Replica dugout canoe paddled from Taiwan to Yonaguni</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2020 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Topographic study reads the forms as erosion of bedding and joints</span></li></ol><details class="srcs"><summary>Sources for this case (9)</summary><ol><li>Lambeck K., Rouby H., Purcell A., Sun Y., Sambridge M. (2014). Sea level and global ice volumes from the Last Glacial Maximum to the Holocene. PNAS 111(43): 15296–15303. <a href="https://doi.org/10.1073/pnas.1411762111" target="_blank" rel="noopener">doi:10.1073/pnas.1411762111</a></li><li>Kaifu Y. et al. (2025). Paleolithic seafaring in East Asia: An experimental test of the dugout canoe hypothesis. Science Advances. <a href="https://doi.org/10.1126/sciadv.adv5507" target="_blank" rel="noopener">doi:10.1126/sciadv.adv5507</a></li><li>Schoch R. M. with McNally R. A. (1999). Voices of the Rocks: A Scientist Looks at Catastrophes and Ancient Civilizations. Harmony Books.</li><li>Hancock G. (2002). Underworld: Flooded Kingdoms of the Ice Age. Michael Joseph.</li><li>Kimura M. (2007). Presentation on the Yonaguni submarine structures, 21st Pacific Science Congress, Okinawa.</li><li>Ogata T. et al. (2020). Topographic analysis of the submarine landforms off Arakawabana, Yonaguni Island. E-journal GEO 15(1): 44–54 (in Japanese).</li><li>Nunn P. D. (2009). Vanished Islands and Hidden Continents of the Pacific. University of Hawai&#x27;i Press.</li><li>Pearson R. (2013). Ancient Ryukyu: An Archaeological Study of Island Communities. University of Hawai&#x27;i Press.</li><li>University of Tokyo (2025). Ancient canoe replica tests Paleolithic migration theory. Press release.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-yonaguni" data-t="Yonaguni: A Drowned Staircase Off Japan"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Yonaguni: A Drowned Staircase Off Japan</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-yonaguni</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-dwarka-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Dwarkadheesh temple.jpg" data-cap="The Dwarkadhish temple at Dwarka" data-big><figcaption></figcaption></figure><div class="sh-k">Impossible Megaliths</div><h2 class="sh-t" id="case-dwarka-st" tabindex="-1">Dwarka: Krishna&#x27;s City Under the Sea?</h2><p class="sh-s">The Mahabharata says the ocean swallowed Krishna&#x27;s golden city. Divers have found stones, anchors and a drowned mystery in the Gulf of Khambhat.</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> A city of great antiquity, from the age of the Mahabharata or earlier, lies submerged off Dwarka or in the Gulf of Khambhat.</p><p class="sh-claim"><b>The text's own words:</b> <span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span> <span class="sh-more">(line by line below)</span></p></div><p class="v4-q">Does a city from the age of the Mahabharata lie under the sea off Gujarat?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Off Dwarka in India, divers found dressed stone blocks and more than a hundred stone anchors under 3 to 16 metres of water.</li><li>The anchors are the types used by traders from early historic to medieval times: a long-lived harbour.</li><li>In the Gulf of Khambhat, sonar images of a &#x27;city&#x27; have never been tested by digging, and the finds were dredged without context.</li><li>A wood date there shows only that the drowned land surface is old.</li><li>A drowned harbour is real; a city from the age of the Mahabharata has not been shown.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Geology</span><span class="thr">Texts and scripts</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="16" >16</b><span class="ctr-u"> m</span></div><div class="ctr-l">depth of the deepest Dwarka offshore finds</div><div class="ctr-c">Gaur, Sundaresh and Tripati 2004</div></div><div class="ctr"><div class="ctr-v">up to <b class="ctr-n" data-v="40" >40</b><span class="ctr-u"> m</span></div><div class="ctr-l">depth of the Gulf of Khambhat features (30–40 m)</div><div class="ctr-c">NIOT reports</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="7500" >7,500</b><span class="ctr-u"> BCE</span></div><div class="ctr-l">approximate radiocarbon date of dredged Khambhat wood</div><div class="ctr-c">NIOT reports</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="1570" >1,570</b><span class="ctr-u"> BCE</span></div><div class="ctr-l">thermoluminescence date from Late Harappan Bet Dwarka</div><div class="ctr-c">Rao 1999</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>A city of great antiquity, from the age of the Mahabharata or earlier, lies submerged off Dwarka or in the Gulf of Khambhat.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Off Dwarka, the dated evidence points to a historic harbour: anchors of early historic to medieval types and blocks consistent with jetties, in water that was already sea by 1500 BCE. In the Gulf of Khambhat, the sonar images have not been tested by excavation, the finds were dredged without context, and the wood date shows only that the drowned land surface is old. A drowned ancient settlement there is geologically plausible, but it has not been demonstrated.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 3 of 6, leaning one way"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>leaning one way</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Standard accounts rightly reject the headline claims: no Mahabharata-era city has been dated under the sea. But they tend to say little about how poorly explored this coast is. The Gulf of Khambhat was dry land when early villages were spreading across the region, and no one has excavated its drowned surface. Dismissing Khambhat&#x27;s methods is fair; treating the whole drowned coast as empty is not.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Underwater surveys off Dwarka by the National Institute of Oceanography found dressed stone blocks, semicircular structures and well over a hundred stone anchors, at depths of roughly 3–16 m.<small>Gaur, Sundaresh and Tripati 2004, Current Science</small></li><li>The anchor types span from the early historic period to medieval times, the kinds used by Indian Ocean traders; the same authors read the site as a long-lived harbour.<small>Gaur, Sundaresh and Tripati 2004</small></li><li>Onshore excavations beneath and beside modern Dwarka found occupation going back about two thousand years; the nearby island of Bet Dwarka has a Late Harappan settlement with a thermoluminescence date of about 1570 BCE.<small>Deccan College 1963; ASI; Rao 1999</small></li><li>In 2001 the National Institute of Ocean Technology reported geometric features on sonar 30–40 m deep in the Gulf of Khambhat; a piece of dredged wood was later radiocarbon dated to roughly 7500–7200 BCE.<small>NIOT reports; announcement of 19 May 2001</small></li><li>Global sea level was roughly 30–40 m lower around 9,500 years ago and close to today&#x27;s level by about 1500 BCE.<small>Lambeck et al. 2014, PNAS</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether S. R. Rao&#x27;s offshore &#x27;fort walls&#x27; at Dwarka date to the 2nd millennium BCE, as he argued, or belong to a later harbour and jetty, as most later work suggests.</li><li>Whether the Gulf of Khambhat sonar images show human structures or natural features and sonar artefacts, and whether the dredged &#x27;artefacts&#x27; are worked objects or natural stones.</li><li>Whether the Mahabharata&#x27;s drowning of Dvaraka remembers a real coastal disaster, gradual erosion, or is a purely religious and literary image.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>No controlled underwater excavation of the Khambhat features has been published; all finds there were dredged, so nothing has a recorded layer or context.</li><li>Strong tidal currents and heavy silt in the Gulf of Khambhat bury and scour the seabed, and visibility is often near zero.</li><li>Results of the Archaeological Survey of India&#x27;s renewed underwater work at Dwarka, begun in 2025, have not yet been published.</li></ul></div></div><h3 class="sub-h wsub">How the traditions tell it</h3><div class="v4texts"><blockquote class="quote v4q"><span class="v4q-t">Mahabharata · Mausala Parva, section 7</span><p>After all the people had set out, the ocean, that home of sharks and alligators, flooded Dvaraka, which still teemed with wealth of every kind, with its waters.</p><cite>trans. Kisari Mohan Ganguli (1883–1896)</cite></blockquote></div><h3 class="sub-h wsub">In the text's own words</h3><p class="rd-rule">Each line rates only what the text itself says, not later dates, commentaries or modern identifications.</p><ul class="rds"><li class="rd"><p class="rd-s">After Krishna&#x27;s departure the ocean flooded Dvaraka (Mahabharata, Mausala Parva 7).</p><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span><p class="rd-n">Sea level and coastline change along Gujarat are real, and underwater stone structures off Dwarka are reported; none is securely dated to the Mahabharata age.</p></li></ul><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Most archaeologists accept that Dwarka has a real underwater archaeological record, but read it as the remains of a historic port: anchors lost or discarded by ships, jetty blocks and structures drowned by coastal erosion over the last two thousand years. For the Gulf of Khambhat they reject the &#x27;lost city&#x27; claim because nothing was excavated, the sonar images are open to other readings, and a radiocarbon date on dredged wood dates only the wood.</p><ul><li>Anchors are dropped from ships and belong under water; they cannot show a drowned city by themselves.</li><li>By around 1500 BCE the sea stood near today&#x27;s level, so structures at 10–16 m depth off Dwarka would already have been submerged unless the land sank.</li><li>Dredging mixes material from different depths and ages and destroys the context archaeologists need.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>S. R. Rao, the excavator of the Harappan port of Lothal, led the first marine archaeology at Dwarka from the 1980s and argued that the submerged walls and bastions were those of the Dvaraka of the Mahabharata, around the 15th century BCE. For the Gulf of Khambhat, NIOT geologist S. Badrinarayan and the writer Graham Hancock argued that the regular sonar patterns and dredged finds point to a settlement drowned at the end of the Ice Age, thousands of years older than the Indus cities.</p><ul><li>Bet Dwarka, a few kilometres away, really was occupied in the 2nd millennium BCE, so an early coastal settlement in the region is not in question.</li><li>The Khambhat seabed was dry land until roughly 9,000–10,000 years ago, exactly when farming villages were emerging in the wider region.</li><li>Wood from the Khambhat seabed dates to about 7500 BCE, showing the drowned land surface is that old.</li></ul><div class="face-s"><b>Its strongest point</b><p>Western India&#x27;s coast drowned under 100 m of rising sea after the Ice Age, and the Gulf of Khambhat was a broad river plain until about 9,000 years ago. People were surely living there. Nobody has yet excavated a single drowned site on it.</p></div><p class="face-cr"><b>Credit</b> S. R. Rao; S. Badrinarayan; Graham Hancock</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Controlled underwater excavation of any Khambhat feature, recording layers and dating material found in place.</li><li>Sediment cores through the Khambhat seabed to map the drowned land surface and look for occupation layers.</li><li>Scientific dating of mortar, wood or organic material sealed within the Dwarka offshore structures themselves.</li><li>Full publication of the ASI&#x27;s 2025 Dwarka survey with maps, depths and dates.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,121 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of Dwarka: Krishna&#x27;s City Under the Sea?"><button type="button" class="wtoc-i" data-go="dwarka-s1">The city the ocean took back</button><button type="button" class="wtoc-i" data-go="dwarka-s2">What the divers found off Dwarka</button><button type="button" class="wtoc-i" data-go="dwarka-s3">Reading the depth</button><button type="button" class="wtoc-i" data-go="dwarka-s4">The Gulf of Khambhat: a lost city at 40 m?</button><button type="button" class="wtoc-i" data-go="dwarka-s5">What the sea hides</button><button type="button" class="wtoc-i" data-go="dwarka-s6">What would settle it</button></nav></div><section class="wsec" id="dwarka-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The city the ocean took back</h3><p>On the western tip of the Saurashtra peninsula, where the Gomti creek meets the Arabian Sea, the tall spire of the Dwarkadhish temple rises over one of the holiest towns in India. Pilgrims come here because of Krishna. In the Mahabharata and the later Harivamsa and Bhagavata Purana, Krishna leads his Yadava people to the western sea and founds Dvaraka, the city of gates, splendid with gold and jewels. After his death, the tradition says, the sea took it back.</p><blockquote class="quote"><p>After all the people had set out, the ocean, that home of sharks and alligators, flooded Dvaraka, which still teemed with wealth of every kind, with its waters.</p><cite>Mahabharata, Mausala Parva, section 7, trans. Kisari Mohan Ganguli (1883–1896)</cite></blockquote><p>In the epic, the drowning happens as Arjuna leads the survivors away, the waves following behind them. It is one of the most vivid flood images in any sacred text, and it raises an obvious question. The coast of Gujarat really has changed. The sea around India stood far lower in the Ice Age and has eaten into this shore within recorded history. Could divers find Krishna&#x27;s city?</p></section><section class="wsec" id="dwarka-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What the divers found off Dwarka</h3><p>From the 1980s the archaeologist S. R. Rao, famous for excavating the Harappan port of Lothal, led marine surveys off Dwarka for the National Institute of Oceanography in Goa. His teams mapped lines of stone blocks and rounded structures in the shallow sea, which Rao read as the walls and bastions of a fortified city of around the 15th century BCE. His book The Lost City of Dvaraka (1999) made the case to the public, and the finds caused a sensation.</p><p>Later work by the same institute, led by A. S. Gaur, kept surveying and came to a more cautious view. The finds lie mostly between about 3 and 16 m deep. Among them are well over a hundred stone anchors, of types used by ships over a long span, from the early historic period into medieval times, including grapnel-style anchors known from Indian Ocean trade. Dressed blocks look more like the parts of jetties and landing stages than city walls. In 2004 the team summarised the site in Current Science as an ancient harbour, submerged largely through coastal erosion.</p><blockquote class="wpull"><p>Anchors are dropped from ships. Finding them on the seabed shows a busy harbour, not a drowned city.</p></blockquote><p>On land, excavations beside the temple in 1963 and later found occupation going back about two thousand years. On Bet Dwarka, an island in the bay, excavators found a Late Harappan settlement with a thermoluminescence date of about 1570 BCE. So people were living on this coast in the 2nd millennium BCE. What has not been found is a dated city of that age under the water.</p></section><section class="wsec" id="dwarka-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Reading the depth</h3><p>The simplest test of a drowned-city claim is the depth of the finds and the sea-level history. Step through the drawing to see how that works for both of Gujarat&#x27;s underwater claims.</p><figure class="wx wx--steps" id="dwarka-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">What the depth of a find can tell you</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="What the depth of a find can tell you"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" class="wx-svg" role="img" aria-labelledby="dwarka-f1-t"><title id="dwarka-f1-t">Depth profiles of the Dwarka offshore finds and the Gulf of Khambhat finds, compared with past sea levels</title><text class="wx-t-cap" x="24" y="24">Two underwater claims · schematic profiles, depth to scale</text><text class="wx-t-h" x="24" y="52">What the depth of a find can tell you</text><rect class="wx-water wx-o60" x="130" y="100" width="210" height="330"/><rect class="wx-water wx-o60" x="400" y="100" width="280" height="330"/><path class="wx-soil wx-edge" d="M60,88 H122 L130,100 L340,240 V430 H60 Z"/><path class="wx-soil wx-edge" d="M400,331 L470,352 L560,345 L640,366 L680,360 V430 H400 Z"/><path class="wx-line wx-s2 wx-draw" pathLength="1" d="M130,100 H340 M400,100 H680"/><path class="wx-card wx-edge" d="M76,88 V70 H96 V88 Z M80,70 L86,58 L92,70 Z"/><text class="wx-t-s wx-halo" x="66" y="112">Dwarka town</text><text class="wx-t-b" x="235" y="84" text-anchor="middle">Off Dwarka</text><text class="wx-t-s" x="235" y="96" text-anchor="middle">a few hundred m out</text><text class="wx-t-b" x="545" y="84" text-anchor="middle">Gulf of Khambhat</text><text class="wx-t-s" x="545" y="96" text-anchor="middle">a separate site, far to the east</text><path class="wx-dim" d="M704,100 V415 M698,100 H710 M698,170 H710 M698,240 H710 M698,310 H710 M698,380 H710"/><text class="wx-t-s" x="712" y="94" text-anchor="end">0 m</text><text class="wx-t-s" x="696" y="174" text-anchor="end">10</text><text class="wx-t-s" x="696" y="244" text-anchor="end">20</text><text class="wx-t-s" x="696" y="314" text-anchor="end">30</text><text class="wx-t-s" x="696" y="384" text-anchor="end">40 m</text><g class="wx-st" data-s="1"><path class="wx-stone3 wx-edge" d="M155.5,120 L161.5,106 L167.5,120 Z"/><circle class="wx-paper" cx="161.5" cy="112" r="1.8"/><path class="wx-stone3 wx-edge" d="M181.8,137.5 L187.8,123.5 L193.8,137.5 Z"/><circle class="wx-paper" cx="187.8" cy="129.5" r="1.8"/><path class="wx-stone3 wx-edge" d="M208.0,155 L214.0,141 L220.0,155 Z"/><circle class="wx-paper" cx="214.0" cy="147" r="1.8"/><path class="wx-stone3 wx-edge" d="M234.2,172.5 L240.2,158.5 L246.2,172.5 Z"/><circle class="wx-paper" cx="240.2" cy="164.5" r="1.8"/><path class="wx-stone3 wx-edge" d="M260.5,190 L266.5,176 L272.5,190 Z"/><circle class="wx-paper" cx="266.5" cy="182" r="1.8"/><path class="wx-stone3 wx-edge" d="M286.8,207.5 L292.8,193.5 L298.8,207.5 Z"/><circle class="wx-paper" cx="292.8" cy="199.5" r="1.8"/><rect class="wx-stone2 wx-edge" x="169.1" y="122.4" width="10" height="6"/><rect class="wx-stone2 wx-edge" x="196.4" y="140.6" width="10" height="6"/><rect class="wx-stone2 wx-edge" x="221.6" y="157.4" width="10" height="6"/><path class="wx-thin" d="M200,262 L224.5,167"/><text class="wx-t-b wx-halo" x="150" y="280">Blocks and stone anchors</text><text class="wx-t-m wx-halo" x="150" y="296">at c. 3–16 m deep</text><path class="wx-dash" d="M486,342 h24 v-12 h24 v12 h24 v-12 h24 v12 h24 v-12 h24 v12"/><path class="wx-thin" d="M430,392 L500,346"/><text class="wx-t-b wx-halo" x="410" y="406">Sonar "grid", dredged finds</text><text class="wx-t-m wx-halo" x="410" y="422">at 30–40 m</text></g><g class="wx-st wx-hide" data-s="2"><rect class="wx-water2 wx-o40" x="130" y="93" width="210" height="14"/><text class="wx-t-b wx-t-a wx-halo" x="72" y="340">c. 1500 BCE: sea within</text><text class="wx-t-m wx-halo" x="72" y="356">a few metres of today</text></g><g class="wx-st wx-hide" data-s="3"><text class="wx-t-b wx-t-a wx-halo" x="72" y="384">Anchors belong under water:</text><text class="wx-t-m wx-halo" x="72" y="400">types from early historic</text><text class="wx-t-m wx-halo" x="72" y="416">to medieval times</text></g><g class="wx-st wx-hide" data-s="4"><rect class="wx-paper wx-o80" x="400" y="101" width="280" height="237"/><path class="wx-hl" d="M400,338 H680"/><text class="wx-t-b wx-t-a wx-halo" x="540" y="280" text-anchor="middle">c. 9,500 years ago: sea c. 30–40 m</text><text class="wx-t-b wx-t-a wx-halo" x="540" y="296" text-anchor="middle">lower, the plain is dry land</text><rect class="wx-wood wx-edge" x="596" y="350" width="26" height="7" rx="3"/><path class="wx-thin" d="M609,358 L618,372"/><text class="wx-t-s wx-halo" x="600" y="384">wood, c. 7500 BCE</text></g><g class="wx-st wx-hide" data-s="5"><path class="wx-line" d="M470,160 V334"/><path class="wx-metal wx-edge" d="M458,334 h24 l-4,14 h-16 Z"/><text class="wx-t-b wx-halo" x="480" y="176">Dredged, not dug:</text><text class="wx-t-m wx-halo" x="480" y="192">no layers, no context</text></g><text class="wx-t-s" x="24" y="470">Depths after Gaur, Sundaresh and Tripati 2004 (Dwarka) and NIOT reports (Khambhat); sea levels approximate.</text><text class="wx-t-s" x="24" y="488">Horizontal distances not to scale.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Where the finds lie: blocks and stone anchors off Dwarka at about 3–16 m; sonar features and dredged finds in the Gulf of Khambhat at 30–40 m.</p><ol class="wx-steplist"><li>Where the finds lie: blocks and stone anchors off Dwarka at about 3–16 m; sonar features and dredged finds in the Gulf of Khambhat at 30–40 m.</li><li>Around 1500 BCE, the age often proposed for Krishna&#x27;s Dvaraka, the sea stood within a few metres of today, so the deeper Dwarka finds were already under water unless the land sank.</li><li>Anchors belong under water. Off Dwarka their types range from the early historic period to medieval times: the signature of a long-used harbour.</li><li>Around 9,500 years ago the sea was 30–40 m lower, so the Khambhat seabed was dry land. Wood dated to about 7500 BCE fits that drowned surface.</li><li>But the Khambhat finds were dredged, not excavated: without layers and context, a date on wood cannot show a city.</li></ol><figcaption>Step through two schematic seabed profiles, off Dwarka and in the Gulf of Khambhat, with depths to scale and past sea levels marked. <span class="wx-src">Based on: Depths after Gaur, Sundaresh and Tripati (2004) and NIOT reports; sea levels after Lambeck et al. (2014), approximate for this coast; horizontal distances schematic.</span></figcaption><p class="vh">Two side-by-side seabed profiles under a shared depth ruler from 0 to 40 m. Left, off Dwarka: the town and a temple on land, and a seabed sloping down to about 20 m, with small triangular stone anchors and blocks scattered between about 3 and 16 m deep. Right, the Gulf of Khambhat: a flat seabed at 33 to 38 m, with a dashed zigzag marking the sonar &#x27;grid&#x27;. Step 2 adds a thin band near the surface on the left: around 1500 BCE the sea was within a few metres of today. Step 3 notes that anchors belong under water, with types from early historic to medieval times. Step 4 draws a line at about 35 m on the right: 9,500 years ago the sea was 30 to 40 m lower, and a piece of wood dated about 7500 BCE lies on the old surface. Step 5 shows a dredge bucket: dredged, not dug, with no layers and no context.</p></figure><p>Around 1500 BCE, sea level along India&#x27;s west coast was close to today&#x27;s, within a few metres. That means structures lying 10 or 16 m deep off Dwarka would already have been under water then, unless the land itself has sunk or the shore has retreated a long way. Both have happened to some degree on this coast, which is why the question is not closed. But the anchors, which belong under water in any case, and the types of the blocks fit a harbour used over many centuries better than a Bronze Age city drowned in one event.</p></section><section class="wsec" id="dwarka-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The Gulf of Khambhat: a lost city at 40 m?</h3><p>The bigger claim came from the other side of the peninsula. On 19 May 2001 India&#x27;s education minister, Murli Manohar Joshi, announced that the National Institute of Ocean Technology, surveying pollution in the Gulf of Khambhat (Cambay), had found regular, geometric structures on sonar about 20 km off the coast, at depths of 30–40 m. Dredging brought up pottery fragments, stones that looked worked, bone, and a piece of wood. The wood was radiocarbon dated to roughly 7500–7200 BCE, some 9,500 years ago.</p><p>The implications were enormous: a settlement thousands of years older than the Indus cities, drowned by the rising sea. NIOT geologist S. Badrinarayan became its leading advocate, and Graham Hancock featured it prominently in his book Underworld (2002) as potential evidence of the flooded kingdoms of the Ice Age. The geology behind the idea is sound. At 30–40 m depth, the Khambhat seabed was dry land until roughly 9,000–10,000 years ago, a broad plain crossed by rivers.</p><aside class="wcall"><b>How do we know?</b><p>The critics&#x27; objections are about method, not imagination. Dredging scoops material from the seabed without recording where or in what layer it lay, so a potsherd and a piece of wood from the same bucket need not be the same age. The archaeologist D. P. Agrawal and others pointed out that a date on wood dates the tree, not any building. Some &#x27;artefacts&#x27; may be natural stones shaped by currents, and regular patterns on sonar can be produced by sediment waves and processing.</p></aside></section><section class="wsec" id="dwarka-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>What the sea hides</h3><p>Here the challengers&#x27; strongest point deserves full weight. When the Ice Age ended, the sea rose by about 120 m worldwide. Along western India that drowned a wide coastal shelf, including the whole Gulf of Khambhat, just as farming and settled life were spreading through the wider region. People must have lived on those plains, along those rivers. Their camps and villages are now under tens of metres of turbid water, swept by some of the strongest tides in the Indian Ocean. No one has yet carried out a controlled excavation of a single drowned site there.</p><p>That is a real gap in our picture of South Asian prehistory, and the Khambhat announcement, whatever its flaws, pointed at it. The fair conclusion is double. The specific claim of a planned city at 40 m remains untested and, as presented, is weakly supported. The broader idea that drowned settlements lie under the Gulf is geologically reasonable and archaeologically unexplored.</p><aside class="wcall"><b>Fresh from the field</b><p>In February 2025 the Archaeological Survey of India&#x27;s revived Underwater Archaeology Wing began new exploration off Dwarka and Bet Dwarka, led by Alok Tripathi, with a team of five that included three women archaeologists, following earlier ASI work there in 2005–2007. Its results have not yet been published.</p></aside></section><section class="wsec" id="dwarka-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What would settle it</h3><p>Dwarka&#x27;s offshore puzzle could be moved forward by dating material sealed inside the structures themselves, such as mortar, wood or charcoal, rather than objects lying on them. For Khambhat, the need is simpler and harder: dive, or core, and excavate. Sediment cores across the drowned plain would map its old land surface and show whether any occupation layers lie within it. A single excavated trench on one of the sonar features, with finds recorded in place and dated, would do more than two decades of argument.</p><p>For believers, Dvaraka&#x27;s sanctity does not depend on sonar. For history, the question is still open in an interesting way: not whether the Mahabharata&#x27;s golden city has been found, which it has not, but what the drowned coasts of Gujarat really hold.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">7,500 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Wood on the Khambhat plain, later drowned, is growing</span></li><li class="wtl-use" style="--i:1"><span class="wtl-y">1,570 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Late Harappan settlement on Bet Dwarka (TL date)</span></li><li class="wtl-study" style="--i:2"><span class="wtl-y">1963 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Deccan College excavates beside the Dwarkadhish temple</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">1983 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">S. R. Rao&#x27;s marine surveys off Dwarka under way</span></li><li class="wtl-find" style="--i:4"><span class="wtl-y">2001 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Gulf of Khambhat &#x27;lost city&#x27; announced</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">2002 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Dredged wood dated; Hancock&#x27;s Underworld features Khambhat</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2004 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">NIO team reads the Dwarka finds as an ancient harbour</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2007 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">ASI underwater work at Dwarka (2005–2007)</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2025 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">ASI begins new underwater exploration off Dwarka</span></li></ol><details class="srcs"><summary>Sources for this case (9)</summary><ol><li>Gaur A. S., Sundaresh, Tripati S. (2004). An ancient harbour at Dwarka: study based on the recent underwater explorations. Current Science 86(9): 1256–1260.</li><li>Rao S. R. (1999). The Lost City of Dvaraka. Aditya Prakashan.</li><li>Ansari Z. D., Mate M. S. (1966). Excavations at Dwarka. Deccan College Postgraduate and Research Institute, Poona.</li><li>Lambeck K., Rouby H., Purcell A., Sun Y., Sambridge M. (2014). Sea level and global ice volumes from the Last Glacial Maximum to the Holocene. PNAS 111(43): 15296–15303. <a href="https://doi.org/10.1073/pnas.1411762111" target="_blank" rel="noopener">doi:10.1073/pnas.1411762111</a></li><li>Hancock G. (2002). Underworld: Flooded Kingdoms of the Ice Age. Michael Joseph.</li><li>The Mahabharata, Mausala Parva, trans. K. M. Ganguli (1883–1896). Bharata Press, Calcutta.</li><li>Archaeological Survey of India / Ministry of Culture (2025). Underwater Archaeology Wing begins exploration off Dwarka. Press statements, February 2025.</li><li>Dubey K. M., Chaubey A. K., Gaur A. S., Joglekar M. V. (2023). Evolution of Ramasetu region as a link between India and Sri Lanka during the late Pleistocene and Holocene. Quaternary Research 111: 166–176. <a href="https://doi.org/10.1017/qua.2022.41" target="_blank" rel="noopener">doi:10.1017/qua.2022.41</a></li><li>Marine archaeology in the Gulf of Khambhat. Summary of NIOT survey methods, dates and criticisms (Wikipedia, accessed 2026).</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-dwarka" data-t="Dwarka: Krishna&#x27;s City Under the Sea?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Dwarka: Krishna&#x27;s City Under the Sea?</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-dwarka</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-rama-setu-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Adam&#x27;s bridge rama setu image by Landsat 7.png" data-cap="Adam&#x27;s Bridge seen by Landsat 7" data-big><figcaption></figcaption></figure><div class="sh-k">Impossible Megaliths</div><h2 class="sh-t" id="case-rama-setu-st" tabindex="-1">Rama Setu: A Bridge Built by an Army or by the Sea?</h2><p class="sh-s">A 30 km line of shoals joins India to Sri Lanka, just as the Ramayana says Rama&#x27;s army built one. What does the seabed say?</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> Adam&#x27;s Bridge is, in whole or in part, a human-built causeway.</p><p class="sh-claim"><b>The text's own words:</b> <span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span> <span class="sh-more">(line by line below)</span></p></div><p class="v4-q">Is Adam&#x27;s Bridge a human-made causeway, or a ridge built by the sea?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>A chain of shoals runs 48 kilometres between India and Sri Lanka, mostly a metre or three under water.</li><li>The Ramayana tells of a bridge built here by an army.</li><li>Satellite laser mapping in 2024 found a natural ridge: sand, beachrock and coral continuing the land tips.</li><li>During the Ice Age the strait was dry land with lakes; the sea flooded it around 8,500 years ago.</li><li>No placed stones or construction layers have been reported; a human addition on a natural core has never been tested.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Geology</span><span class="thr">Texts and scripts</span><span class="thr">Physics</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="30" >30</b><span class="ctr-u"> km</span></div><div class="ctr-l">core ridge from Dhanushkodi to Talaimannar</div><div class="ctr-c">Dandabathula et al. 2024</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="48" >48</b><span class="ctr-u"> km</span></div><div class="ctr-l">full chain of shoals from Pamban to Mannar</div><div class="ctr-c">Survey charts</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="8500" >8,500</b><span class="ctr-u"> years ago</span></div><div class="ctr-l">the sea began to flood the Palk Strait</div><div class="ctr-c">Dubey et al. 2023</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="1480" >1,480</b><span class="ctr-u"> CE</span></div><div class="ctr-l">storms break the last link, per temple records</div><div class="ctr-c">Ramanathaswamy temple records</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Adam&#x27;s Bridge is, in whole or in part, a human-built causeway.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">All published mapping and geophysics describe a natural ridge: a continuation of the land tips, built of sand, beachrock and coral, drowned by the post-glacial sea and partly re-exposed as sea level settled. No placed stones, construction layers or artefacts have been reported in peer-reviewed work. The ridge has never been systematically cored or excavated, so a human addition on a natural core has not been tested, but there is no positive evidence for one.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Scientific summaries say confidently that the ridge is natural, and the geology strongly supports that for its core. Where they go too far is in implying the question is fully closed: there is still no published, systematic dating of the ridge&#x27;s surface layers, and no excavation. &#x27;Natural ridge, no evidence of construction&#x27; is the honest wording, not &#x27;natural in every part, case closed&#x27;.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>A chain of limestone and sand shoals, sandbanks and small islands runs about 48 km from Pamban Island to Mannar Island; the core ridge between Dhanushkodi and Talaimannar is about 30 km long, mostly 1–3 m under water.<small>Survey of India charts; Dandabathula et al. 2024</small></li><li>Laser bathymetry from NASA&#x27;s ICESat-2 satellite mapped the ridge in detail in 2024 and found almost all of it submerged, interpreting it as a submarine continuation of the two land tips.<small>Dandabathula et al. 2024, Scientific Reports</small></li><li>Seismic profiling shows the Palk Strait was largely land, with freshwater lakes, during the last Ice Age; the sea began to flood it around 8,500 years ago, and from about 7,000 years ago it could not be crossed on foot.<small>Dubey et al. 2023, Quaternary Research</small></li><li>Records of the Ramanathaswamy temple at Rameswaram say storms broke a walkable link in 1480 CE.<small>Temple records, as cited in Adam&#x27;s Bridge literature</small></li><li>In 2007 the Archaeological Survey of India told the Supreme Court there was no historical proof that the bridge had been built; the government withdrew the affidavit within days after political protest.<small>Supreme Court proceedings, September 2007</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether any part of the ridge carries placed stones or other signs of human building, on top of its natural core.</li><li>How old the sand, beachrock and coral of the ridge are: no systematic radiometric dating of the ridge surface has been published in a peer-reviewed journal.</li><li>Whether the ridge was walkable at any time since people settled the coasts, and whether the 1480 temple record describes a true land bridge or a line of fordable shoals.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Drilling cores through the ridge with dated layers, which would show its internal structure and age.</li><li>Detailed diving surveys of the shoals for placed stones, tool marks or artefacts, published with maps.</li><li>Storms, currents and shifting sand constantly rebuild the surface, destroying or burying any delicate evidence.</li></ul></div></div><h3 class="sub-h wsub">How the traditions tell it</h3><div class="v4texts"><blockquote class="quote v4q"><span class="v4q-t">Ramayana · Valmiki Ramayana, Yuddha Kanda (Griffith Book VI, Canto XXII)</span><p>Then the great bridge of wondrous strength / Was built, a hundred leagues in length. / Rocks huge as autumn clouds bound fast / With cordage from the shore were cast</p><cite>trans. Ralph T. H. Griffith (1870–1874)</cite></blockquote></div><h3 class="sub-h wsub">In the text's own words</h3><p class="rd-rule">Each line rates only what the text itself says, not later dates, commentaries or modern identifications.</p><ul class="rds"><li class="rd"><p class="rd-s">An army built a bridge of rocks across the sea to Lanka (Valmiki Ramayana, Yuddha Kanda).</p><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span><p class="rd-n">Adam&#x27;s Bridge is a chain of shoals and sandbanks; studies so far read it as natural. A causeway laid on top of a natural ridge has not been tested by excavation.</p></li></ul><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Geologists read Adam&#x27;s Bridge as a natural ridge: a line of sand shoals and islands resting on older sediments and cemented beachrock, shaped by the meeting of currents from the Palk Bay and the Gulf of Mannar and by sea-level change since the Ice Age. Similar sand ridges and tombolos form on shallow coasts worldwide. No excavated construction features, dated artefacts or tool-worked stone have been reported from the ridge.</p><ul><li>Its sand, coral and beachrock are typical of natural carbonate shoals in warm shallow seas.</li><li>Satellite and seismic data show it continuing the two land tips, with a buried older landscape beneath.</li><li>Satellite images show the ridge&#x27;s shape, not who or what made it; NASA said its images cannot answer that.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>For many Hindus the ridge is Rama Setu, the bridge that the vanara engineer Nala built so that Rama&#x27;s army could cross to Lanka to rescue Sita. Advocates, including the politician Subramanian Swamy, who petitioned the Supreme Court to protect it, argue that the ridge&#x27;s straight, narrow course, its composition of stones and coral, and its position exactly where the Ramayana places the crossing point to an engineered causeway, perhaps built on top of a natural shoal. They opposed the Sethusamudram shipping canal, which would have cut through it.</p><ul><li>The ridge links India and Sri Lanka along the line the Ramayana describes, and it was reportedly walkable until 1480.</li><li>Some writers argue that boulders on the shoals sit on top of younger sand, which they read as stones carried in.</li><li>The epic describes floating stones, and pumice and porous coral do float, so the story may describe real materials.</li></ul><div class="face-s"><b>Its strongest point</b><p>The ridge sits exactly where an ancient epic says a crossing was built, and no one has yet cored or excavated it; a causeway built on top of a natural shoal would be hard to tell apart without digging.</p></div><p class="face-cr"><b>Credit</b> Rama Setu advocates, including Subramanian Swamy and petitioners in India&#x27;s Supreme Court</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Drill a line of cores along and across the ridge and date the layers by radiocarbon and luminescence.</li><li>A diving survey of the shoals, mapping any boulders and testing whether they rest on, or are embedded in, the natural beachrock.</li><li>Petrographic study of any &#x27;carried&#x27; stones to see whether they come from the ridge itself or from distant quarries.</li><li>Publication of dating results from the government-approved underwater studies of the ridge.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,199 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of Rama Setu: A Bridge Built by an Army or by the Sea?"><button type="button" class="wtoc-i" data-go="rama-setu-s1">A line across the sea</button><button type="button" class="wtoc-i" data-go="rama-setu-s2">What the seabed shows</button><button type="button" class="wtoc-i" data-go="rama-setu-s3">2007: when a shoal became a political storm</button><button type="button" class="wtoc-i" data-go="rama-setu-s4">The case for a causeway</button><button type="button" class="wtoc-i" data-go="rama-setu-s5">What time and the sea have hidden</button><button type="button" class="wtoc-i" data-go="rama-setu-s6">What would settle it</button></nav></div><section class="wsec" id="rama-setu-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A line across the sea</h3><p>Look at a satellite image of the narrow sea between India and Sri Lanka and you see something that looks drawn with a ruler: a pale, broken line of shoals running from the tip of Pamban Island to Mannar. Pilgrims at Rameswaram call it Rama Setu, Rama&#x27;s Bridge. Many maps call it Adam&#x27;s Bridge, after a tradition that Adam crossed here from Sri Lanka, whose Adam&#x27;s Peak bears a footprint revered by several faiths. Either way, the line invites the question: did someone build this?</p><p>In the Ramayana, the demon king Ravana carries Sita off to Lanka. Rama and his allies, the vanaras, reach the shore and face the sea. The ocean god advises that Nala, son of the divine craftsman Vishvakarma, can bridge it. The army hurls trees and rocks into the water and in five days the causeway is complete.</p><blockquote class="quote"><p>Then the great bridge of wondrous strength / Was built, a hundred leagues in length. / Rocks huge as autumn clouds bound fast / With cordage from the shore were cast</p><cite>Valmiki Ramayana, Yuddha Kanda (Book VI, Canto XXII), trans. Ralph T. H. Griffith (1870–1874)</cite></blockquote><p>The epic&#x27;s geography is poetic and its hundred leagues are far longer than the real strait. Scholars also note that the identification of Ravana&#x27;s Lanka with the island of Sri Lanka is not explicit in the earliest text and appears in inscriptions from later centuries. But the belief that this ridge is Rama&#x27;s bridge is centuries old, and in 2007 it became the centre of a national argument.</p></section><section class="wsec" id="rama-setu-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What the seabed shows</h3><p>The ridge is not a single wall but a chain of sandbanks, shoals and low sand islands, about 48 km from Pamban to Mannar, with a core ridge of about 30 km between Dhanushkodi and Talaimannar. Most of it lies 1–3 m under water. Beneath the loose sand are layers of beachrock and calcareous sandstone, sand cemented by carbonate close to sea level, and coral. India&#x27;s space agency has mapped more than a hundred small patch reefs along it.</p><p>In 2024 a team from India&#x27;s National Remote Sensing Centre used laser pulses from NASA&#x27;s ICESat-2 satellite, which can see a few metres into clear water, to build a detailed elevation model of the whole ridge. They found almost all of it submerged and interpreted it as the underwater continuation of the land at Dhanushkodi and Talaimannar, shaped by currents and sea-level change. A year earlier, a seismic study led by K. M. Dubey of the National Institute of Oceanography looked beneath the seabed and traced buried river channels and old land surfaces.</p><figure class="wx wx--steps" id="rama-setu-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">A ridge the sea drowned, then half gave back</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="A ridge the sea drowned, then half gave back"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 562" class="wx-svg" role="img" aria-labelledby="rama-setu-f1-t"><title id="rama-setu-f1-t">Schematic profile along Adam's Bridge from Dhanushkodi in India to Talaimannar in Sri Lanka, showing how the sea drowned and then partly exposed the ridge</title><text class="wx-t-cap" x="24" y="24">Adam's Bridge · schematic profile, vertical scale greatly exaggerated</text><text class="wx-t-h" x="24" y="52">A ridge the sea drowned, then half gave back</text><rect class="wx-water wx-o80 wx-st wx-hide" data-only="2" x="90" y="224.8" width="540" height="75.2"/><rect class="wx-water wx-o80 wx-st wx-hide" data-only="3" x="90" y="178" width="540" height="122"/><rect class="wx-water wx-o80 wx-st wx-hide" data-s="4" x="90" y="190" width="540" height="110"/><path class="wx-line wx-s2 wx-st wx-hide" data-only="2" d="M90,224.8 H630"/><path class="wx-line wx-s2 wx-st wx-hide" data-only="3" d="M90,178 H630"/><path class="wx-line wx-s2 wx-st wx-hide" data-s="4" d="M90,190 H630"/><path class="wx-soil wx-edge-soft" d="M60,206 L90,206 L96,251.0 L104,247.4 L112,243.8 L120,241.4 L128,240.8 L136,241.8 L144,243.1 L152,242.8 L160,237.6 L168,225.5 L176,212.6 L184,210.8 L192,221.0 L200,233.0 L208,240.8 L216,245.4 L224,247.9 L232,248.8 L240,250.9 L248,258.8 L256,270.0 L264,271.2 L272,262.1 L280,255.9 L288,255.2 L296,255.1 L304,253.4 L312,250.3 L320,247.1 L328,244.7 L336,242.0 L344,235.7 L352,225.6 L360,219.7 L368,224.3 L376,232.7 L384,236.6 L392,236.4 L400,236.2 L408,237.7 L416,241.6 L424,250.1 L432,263.6 L440,270.9 L448,262.4
