class="wx-edge-soft"/><line x1="504" y1="130" x2="510" y2="360" class="wx-edge-soft"/><line x1="514" y1="130" x2="520" y2="360" class="wx-edge-soft"/><line x1="524" y1="130" x2="530" y2="360" class="wx-edge-soft"/><line x1="534" y1="130" x2="540" y2="360" class="wx-edge-soft"/><line x1="544" y1="130" x2="550" y2="360" class="wx-edge-soft"/><line x1="554" y1="130" x2="560" y2="360" class="wx-edge-soft"/><line x1="564" y1="130" x2="570" y2="360" class="wx-edge-soft"/><line x1="574" y1="130" x2="580" y2="360" class="wx-edge-soft"/><line x1="584" y1="130" x2="590" y2="360" class="wx-edge-soft"/><line x1="594" y1="130" x2="600" y2="360" class="wx-edge-soft"/><line x1="604" y1="130" x2="610" y2="360" class="wx-edge-soft"/><line x1="614" y1="130" x2="620" y2="360" class="wx-edge-soft"/><line x1="624" y1="130" x2="630" y2="360" class="wx-edge-soft"/><line x1="634" y1="130" x2="640" y2="360" class="wx-edge-soft"/><line x1="644" y1="130" x2="650" y2="360" class="wx-edge-soft"/><line x1="654" y1="130" x2="660" y2="360" class="wx-edge-soft"/><line x1="664" y1="130" x2="670" y2="360" class="wx-edge-soft"/><line x1="674" y1="130" x2="680" y2="360" class="wx-edge-soft"/><ellipse cx="504" cy="150" rx="5" ry="3" class="wx-soil wx-edge-soft"/><ellipse cx="534" cy="190" rx="5" ry="3" class="wx-soil wx-edge-soft"/><ellipse cx="564" cy="160" rx="5" ry="3" class="wx-soil wx-edge-soft"/><ellipse cx="594" cy="210" rx="5" ry="3" class="wx-soil wx-edge-soft"/><ellipse cx="524" cy="240" rx="5" ry="3" class="wx-soil wx-edge-soft"/><ellipse cx="584" cy="270" rx="5" ry="3" class="wx-soil wx-edge-soft"/><ellipse cx="554" cy="300" rx="5" ry="3" class="wx-soil wx-edge-soft"/><ellipse cx="614" cy="180" rx="5" ry="3" class="wx-soil wx-edge-soft"/></g><polygon points="384,360 434,250 474,150 494,112 614,112 634,150 674,250 704,360" class="wx-line"/><g class="wx-pop" style="--d:6"><rect x="494" y="104" width="10" height="8" class="wx-stone2 wx-edge-soft"/><rect x="510" y="104" width="10" height="8" class="wx-stone2 wx-edge-soft"/><rect x="526" y="104" width="10" height="8" class="wx-stone2 wx-edge-soft"/><rect x="542" y="104" width="10" height="8" class="wx-stone2 wx-edge-soft"/><rect x="558" y="104" width="10" height="8" class="wx-stone2 wx-edge-soft"/><rect x="574" y="104" width="10" height="8" class="wx-stone2 wx-edge-soft"/><rect x="590" y="104" width="10" height="8" class="wx-stone2 wx-edge-soft"/><rect x="606" y="104" width="10" height="8" class="wx-stone2 wx-edge-soft"/></g><text x="394" y="60" class="wx-t-s">terraces of stone columns</text><text x="394" y="74" class="wx-t-b">last centuries BCE to 1st mill. CE</text><line x1="504" y1="78" x2="524" y2="102" class="wx-thin"/><text x="554" y="230" text-anchor="middle" class="wx-t-b wx-halo">natural andesite body</text><text x="554" y="246" text-anchor="middle" class="wx-t-s wx-halo">columns formed as lava cooled</text><text x="554" y="320" text-anchor="middle" class="wx-t-s wx-halo">soil and clay washed into cracks</text><g class="wx-pop" style="--d:9"><rect x="24" y="388" width="672" height="70" rx="10" class="wx-card wx-edge-soft"/><text x="40" y="410" class="wx-t-b">Same cores, two readings.</text><text x="40" y="428" class="wx-t-s">The dates came from soil between rocks, which the journal found was not tied to any reliably man-made</text><text x="40" y="444" class="wx-t-s">artefact or feature: it dates the soil, not a building. Vertical scale c. 7 px per m; shapes schematic.</text></g></svg></div></div><figcaption>Left, the layered pyramid proposed in the retracted 2023 paper. Right, the mainstream reading of the same cores: stone terraces on a natural andesite body. <span class="wx-src">Based on: Claimed phases from Natawidjaja et al. 2023 (retracted 2024) as reported; mainstream reading after published site descriptions and the retraction notice. Vertical scale approximate (cores to c. 30 m); widths and layer shapes schematic.</span></figcaption><p class="vh">Two cross-sections of the same hill side by side. Left, labelled claimed in 2023, paper retracted: bands from top to bottom marked terraces 2000–1100 BCE, 6000–5500 BCE, 7900–6100 BCE, and a large sculpted lava core 25,000–14,000 BCE, with dashed boxes labelled chambers and a dimension line for cores to about 30 m. Right, labelled mainstream reading: a small row of terrace stones on top of a grey natural andesite body filled with near-vertical columns, with small pockets of soil and clay in cracks. A box below explains that the dates came from soil between rocks, not tied to any reliably man-made artefact or feature, so they date the soil, not a building.</p></figure><aside class="wcall"><b>Fair to the challengers</b><p>The team&#x27;s geophysical work is extensive, and the questions they raise are legitimate: why are there voids, why is soil deep in the hill so old, and why do some columns lie in orderly rows? Natawidjaja also points to what he reads as tool marks and a carved stone. He and his co-authors disagree with the retraction and have invited researchers to examine the site.</p></aside></section><section class="wsec" id="gunung-padang-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Why the paper was retracted</h3><p>Soon after publication, archaeologists including Bill Farley of Southern Connecticut State University and Flint Dibble of Cardiff University raised concerns, and the publisher Wiley and the journal&#x27;s editors investigated. On 18 March 2024 the paper was retracted. The notice was blunt.</p><blockquote class="quote"><p>The radiocarbon dating was applied to soil samples that were not associated with any artifacts or features that could be reliably interpreted as anthropogenic or ‘man-made.’ Therefore, the interpretation that the site is an ancient pyramid built 9000 or more years ago is incorrect.</p><cite>Retraction notice, Archaeological Prospection (Wiley), March 2024</cite></blockquote><p>The logic is easy to see with an everyday example, one the blog Southeast Asian Archaeology used: dating the soil under the Eiffel Tower would not tell you when the tower was built. Soil accumulates, and carbon gets into it from roots, rotting plants and water seeping down cracks, long before or long after anything is built on top. To date construction, you need something people made or used, sealed in a construction layer: charcoal from a hearth, a tool, a posthole.</p><figure class="wx wx--steps" id="gunung-padang-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">From soil date to &#x27;oldest pyramid&#x27;</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="From soil date to &#x27;oldest pyramid&#x27;"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" class="wx-svg" role="img" aria-labelledby="gunung-padang-f2-t"><title id="gunung-padang-f2-t">How a soil date was read as a building date, and why the journal objected, in five steps</title><defs><marker id="gunung-padang-f2-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" class="wx-accfill"/></marker></defs><text x="24" y="24" class="wx-t-cap">A drill core, schematic</text><rect x="60" y="50" width="50" height="30" class="wx-stone2 wx-edge"/><rect x="60" y="80" width="50" height="80" class="wx-soil wx-edge"/><ellipse cx="74" cy="100" rx="9" ry="6" class="wx-rock wx-edge-soft"/><ellipse cx="96" cy="128" rx="10" ry="7" class="wx-rock wx-edge-soft"/><ellipse cx="78" cy="148" rx="8" ry="5" class="wx-rock wx-edge-soft"/><rect x="60" y="160" width="50" height="140" class="wx-rock wx-edge"/><rect x="60" y="196" width="50" height="6" class="wx-soil"/><rect x="60" y="236" width="50" height="8" class="wx-soil"/><rect x="60" y="276" width="50" height="5" class="wx-soil"/><rect x="60" y="300" width="50" height="90" class="wx-stone3 wx-edge"/><g class="wx-st" data-s="1"><path d="M85,36 L85,392" class="wx-flow wx-s2"/><circle cx="40" cy="44" r="9" class="wx-num"/><text x="40" y="48" text-anchor="middle" class="wx-numt">1</text><text x="124" y="64" class="wx-t-s">terrace stones, topsoil</text><text x="124" y="118" class="wx-t-s">rubble with soil</text><text x="124" y="186" class="wx-t-s">andesite columns,</text><text x="124" y="200" class="wx-t-s">clay in the cracks</text><text x="124" y="346" class="wx-t-s">massive andesite</text><text x="124" y="382" class="wx-t-b">Drill a core</text></g><g class="wx-st" data-s="2"><circle cx="85" cy="240" r="7" class="wx-glow wx-edge wx-pulse"/><path d="M96,240 L300,240" class="wx-hl" marker-end="url(#gunung-padang-f2-ar)"/><circle cx="318" cy="240" r="9" class="wx-num"/><text x="318" y="244" text-anchor="middle" class="wx-numt">2</text><text x="334" y="238" class="wx-t-b">Date the soil</text><text x="334" y="253" class="wx-t-s">radiocarbon on soil between rocks:</text><text x="334" y="267" class="wx-t-s">ages up to c. 27,000 years</text></g><g class="wx-st" data-s="3"><polygon points="560,146 620,76 680,146" class="wx-dash"/><polygon points="578,146 620,98 662,146" class="wx-c4 wx-o20"/><path d="M430,222 C470,180 520,160 556,150" class="wx-dash" marker-end="url(#gunung-padang-f2-ar)"/><circle cx="318" cy="72" r="9" class="wx-num"/><text x="318" y="76" text-anchor="middle" class="wx-numt">3</text><text x="334" y="70" class="wx-t-b">The paper's leap</text><text x="334" y="85" class="wx-t-s">soil age = when the layer</text><text x="334" y="99" class="wx-t-s">was built by people</text><text x="620" y="166" text-anchor="middle" class="wx-t-s">'oldest pyramid'</text></g><g class="wx-st" data-s="4"><line x1="480" y1="170" x2="512" y2="202" class="wx-bold wx-s4"/><line x1="512" y1="170" x2="480" y2="202" class="wx-bold wx-s4"/><circle cx="318" cy="300" r="9" class="wx-num"/><text x="318" y="304" text-anchor="middle" class="wx-numt">4</text><text x="334" y="298" class="wx-t-b">The objection (2024)</text><text x="334" y="313" class="wx-t-s">no artefact or feature reliably man-made in the</text><text x="334" y="327" class="wx-t-s">dated soil; carbon in soil can wash in or build up</text><text x="334" y="341" class="wx-t-s">long before or after anything is built</text></g><g class="wx-st" data-s="5"><rect x="306" y="360" width="394" height="64" rx="10" class="wx-card wx-edge-soft"/><circle cx="318" cy="378" r="9" class="wx-num"/><text x="318" y="382" text-anchor="middle" class="wx-numt">5</text><text x="334" y="382" class="wx-t-b">A test that would work</text><text x="334" y="398" class="wx-t-s">excavate; date charcoal, tools or hearths sealed</text><text x="334" y="412" class="wx-t-s">inside a construction layer</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Drill: cores are taken through the terraces into the hill.</p><ol class="wx-steplist"><li>Drill: cores are taken through the terraces into the hill.</li><li>Date: soil from between rocks at depth is radiocarbon-dated, giving ages up to about 27,000 years.</li><li>Leap: the paper treats the soil&#x27;s age as the age of a built layer, and so of a pyramid.</li><li>Objection: the dated soil had no artefact or feature reliably made by people; carbon in soil can accumulate before or after any building.</li><li>Better test: excavate and date charcoal, tools or hearths sealed inside a construction layer.</li></ol><figcaption>How a radiocarbon date on soil was turned into a construction date, and why the journal objected. <span class="wx-src">Based on: Natawidjaja et al. 2023 (method and ages); retraction notice, Archaeological Prospection 2024. Core layers simplified and not to scale.</span></figcaption><p class="vh">A schematic drill core on the left: terrace stones and topsoil at the top, rubble with soil, andesite columns with clay in the cracks, and massive andesite at the bottom. Step 1: the core is drilled. Step 2: soil between rocks at depth is radiocarbon-dated, giving ages up to about 27,000 years. Step 3: a dashed arrow leads to a dashed pyramid labelled oldest pyramid, the paper&#x27;s leap from soil age to building age. Step 4: a red cross over that arrow; the 2024 objection that no artefact or reliably man-made feature was in the dated soil, and soil carbon can build up before or after construction. Step 5: a box describing a test that would work: excavate and date charcoal, tools or hearths sealed inside a construction layer.</p></figure><p>Critics also pointed to the geology. Andesite columns crack into regular blocks as lava cools, and weathering and slope movement can tumble and stack them. Fine clay washing into the gaps between columns can look like mortar in a narrow core. None of this rules out human work at depth, but it means that orderly-looking columns and fill are what a natural lava body is expected to show.</p></section><section class="wsec" id="gunung-padang-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>What the hill may still hide</h3><p>None of this shows the interior is empty of human work; it means the evidence offered does not show it. The deep layers have been sampled only by narrow cores, never opened in a trench, and the 2014 excavations drew criticism from other archaeologists for how they were run. In a hot, wet climate, bone, wood and charcoal decay fast, so the traces that would settle the question may be scarce even if they exist. That is a real limit, and it cuts both ways: it weakens any confident claim that nothing is there.</p><p>Fresh from the field: in August 2025 Indonesia&#x27;s Ministry of Culture launched a new programme of excavation and restoration, led by the archaeologist Ali Akbar, one of the co-authors of the retracted paper, with a multidisciplinary team and more than a hundred local workers. By October 2025 the team reported collecting carbon samples from several terraces for dating. As of this writing we could not find peer-reviewed results from that work.</p></section><section class="wsec" id="gunung-padang-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What would settle it</h3><p>The test is straightforward to describe and hard to do well. Open a deep, stepped trench from the terraces into the hill, record every layer, invite independent specialists, and publish everything. If there is a built layer thousands of years old, it should contain things that people leave behind, such as charcoal from fires, flakes from stone tools, postholes, or surfaces that were walked on, and these can be dated directly. Luminescence dating can tell when a buried surface last saw sunlight.</p><p>Until then, Gunung Padang is a genuine megalithic site of early Southeast Asia, perched on a natural volcanic hill whose depths are only partly known. The 27,000-year pyramid is not ruled out by a trench that nobody has dug, but it is not supported by the evidence published so far, and the journal that printed it has said so.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-use" style="--i:0"><span class="wtl-y">100 CE</span><span class="wtl-k">In use</span><span class="wtl-t">Terraces in use (estimates from c. 100 BCE to 8th century CE)</span></li><li class="wtl-find" style="--i:1"><span class="wtl-y">1890 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Site first recorded; listed by Verbeek in 1891</span></li><li class="wtl-study" style="--i:2"><span class="wtl-y">1914 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">N. J. Krom describes the site</span></li><li class="wtl-find" style="--i:3"><span class="wtl-y">1979 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Rediscovered by local farmers</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">2014 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Declared a national site; contested excavations</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">2022 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Featured in Ancient Apocalypse</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2023 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Paper claims a 27,000-year-old pyramid</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2024 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Paper retracted by the journal</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2025 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Government-backed excavation and restoration begin</span></li></ol><details class="srcs"><summary>Sources for this case (9)</summary><ol><li>Natawidjaja, D. H., Bachtiar, A., Nurhandoko, B. E. B., Akbar, A., et al. (2023, retracted 2024). Geo-archaeological prospecting of Gunung Padang buried prehistoric pyramid in West Java, Indonesia. Archaeological Prospection. <a href="https://doi.org/10.1002/arp.1912" target="_blank" rel="noopener">doi:10.1002/arp.1912</a></li><li>Archaeological Prospection (2024). Retraction notice for Natawidjaja et al. 2023. Wiley, March 2024.</li><li>Natawidjaja, D. H. (2024). The unjust retraction of groundbreaking research: a call for academic integrity. Published on grahamhancock.com.</li><li>Tan, N. H. (2024). Retracted: controversial Gunung Padang cannot be &#x27;reliably interpreted&#x27;; and Lessons from the Gunung Padang retraction. Southeast Asian Archaeology.</li><li>Artnet News (2024). A controversial study on a &#x27;prehistoric pyramid&#x27; in Indonesia is retracted (reporting comments by Bill Farley and Flint Dibble).</li><li>Verbeek, R. D. M. (1891). Oudheden van Java: lijst der voornaamste overblijfselen uit den Hindoetijd op Java. Batavia.</li><li>Krom, N. J. (1914). Rapporten van den Oudheidkundigen Dienst in Nederlandsch-Indië. Batavia.</li><li>Hancock, G. (2022). Ancient Apocalypse, episode 1. Netflix.</li><li>Indonesia Sentinel (2025). Reports on the resumed excavation and restoration at Gunung Padang, August and October 2025.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-gunung-padang" data-t="Gunung Padang: The Pyramid That Was Retracted"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Gunung Padang: The Pyramid That Was Retracted</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-gunung-padang</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-yonaguni-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Yonaguni Monument Main Terrace.jpg" data-cap="Arakawabana, south coast of Yonaguni Island, Okinawa Prefecture, Japan" data-big><figcaption></figcaption></figure><div class="sh-k">Impossible Megaliths</div><h2 class="sh-t" id="case-yonaguni-st" tabindex="-1">Yonaguni: A Drowned Staircase Off Japan</h2><p class="sh-s">Giant flat terraces and sheer walls lie 5 to 25 m under the sea at Japan&#x27;s western edge. Carved by people, or split by nature?</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> The Yonaguni formation was cut or shaped by people while it stood on dry land.</p></div><p class="v4-q">Is the Yonaguni formation a drowned monument, or a natural sandstone outcrop?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Off Japan&#x27;s westernmost island, flat terraces and square corners rise from 25 metres of water like a staircase.</li><li>The formation is one piece of natural bedrock, not built from blocks.</li><li>Its steps follow the same bedding planes and joints that shape the dry coast nearby.</li><li>It was last dry land about 7,000 to 10,000 years ago, when people lived in these islands.</li><li>Erosion explains the forms; human use cannot be ruled out, but the site has never been excavated.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Geology</span><span class="thr">Archaeology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="25" >25</b><span class="ctr-u"> m</span></div><div class="ctr-l">depth of the base of the formation</div><div class="ctr-c">Schoch 1999; Kimura</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="5" >5</b><span class="ctr-u"> m</span></div><div class="ctr-l">depth of the highest terrace</div><div class="ctr-c">Schoch 1999; Kimura</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="20" >20</b><span class="ctr-u"> million years</span></div><div class="ctr-l">age of the sandstone it is cut into</div><div class="ctr-c">Yaeyama Group geology</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="225" >225</b><span class="ctr-u"> km</span></div><div class="ctr-l">paddled from Taiwan to Yonaguni in a replica dugout, 2019</div><div class="ctr-c">Kaifu et al. 2025</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The Yonaguni formation was cut or shaped by people while it stood on dry land.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The rock is natural bedrock, and its flat terraces and square corners follow bedding planes and joints that also shape the dry coast nearby. The best-published analysis finds erosion enough to explain the forms. Kimura&#x27;s worked stones and marks have not been independently studied in print. But the site has never been excavated, and people lived in the Ryukyus while it was dry, so human use cannot be ruled out. What is missing is evidence, not a reason to look.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Official bodies and most reference works state flatly that Yonaguni is natural. For the rock itself that confidence is earned. It is overconfident on the wider point: no one has excavated the terraces, the local sea-level history is only roughly known, and the drowned Ryukyu shelf, where Ice Age islanders surely camped, is almost untouched. &#x27;Natural outcrop&#x27; is well supported; &#x27;nothing human was ever here&#x27; is untested.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>The formation lies off Arakawabana on the south coast of Yonaguni, Japan&#x27;s westernmost inhabited island, about 110 km east of Taiwan. Its top is roughly 5 m below the surface and its base about 25 m.<small>Schoch 1999; Kimura&#x27;s surveys</small></li><li>It is cut into medium to very fine sandstones and mudstones of the Early Miocene Yaeyama Group, deposited about 20 million years ago, and it is joined to the bedrock rather than built from separate blocks.<small>Geological mapping of the Yaeyama Group; Ogata et al. 2020</small></li><li>Global sea level was about 120 m lower at the height of the last Ice Age and rose fastest between about 15,000 and 7,000 years ago; on the global curve the base of the formation was last dry roughly 9,000–10,000 years ago and the top roughly 7,000 years ago.<small>Lambeck et al. 2014, PNAS</small></li><li>People were living in the Ryukyu islands by about 30,000 years ago, and in 2019 a team paddled a replica dugout canoe 225 km from Taiwan to Yonaguni in over 45 hours.<small>Kaifu et al. 2025, Science Advances</small></li><li>Japan&#x27;s Agency for Cultural Affairs and Okinawa Prefecture do not list the formation as a cultural property.<small>Official heritage listings</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the right angles, flat terraces, &#x27;steps&#x27; and trench-like channels need human tools, or follow natural bedding planes and vertical joints in the sandstone.</li><li>Whether small finds Kimura reports (worked-looking stones, marks he compares to signs or script) were made by people and whether they belong to the formation at all.</li><li>How old any human use would be: Kimura first suggested about 10,000 years, later 2,000–3,000 years, a date that needs roughly 20 m of local sinking since then.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>No systematic excavation of the sediments on the terraces and in the channels, where tools, hearths or charcoal would sit if people worked here.</li><li>No peer-reviewed survey in an international journal that maps every feature and tool mark in three dimensions.</li><li>The drowned coastal plains of the Ryukyus, where Ice Age islanders would have lived, are almost entirely unexplored.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Most geologists and archaeologists who have looked read Yonaguni as a natural outcrop. The Yaeyama sandstone splits along flat bedding planes and straight vertical joints, and waves working on such rock produce terraces, ledges, right-angled corners and trenches. Similar shapes can be seen on dry land along the island&#x27;s coast. No securely worked tool marks, walls of separate blocks, dated artefacts or occupation layers have been published from the formation itself.</p><ul><li>The flat surfaces follow the natural bedding of the rock, and the vertical faces follow joint sets that run across the whole area.</li><li>A 2020 topographic study concluded the landform can be explained by weathering and erosion acting on bedding and joints.</li><li>Loose blocks lie where gravity dropped them, not in coursed walls.</li><li>Nothing from the site has been dated to a period of human work.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Masaaki Kimura, a marine geologist at the University of the Ryukyus, dived the site many times from the 1990s and mapped what he reads as a stepped monument with terraces, a road, a drainage channel, pillars and a stone &#x27;face&#x27;, and he reported worked stones and incised marks. Graham Hancock, who dived Yonaguni for his book Underworld (2002), argued that it may be a natural outcrop that people later cut back and shaped, a lost Ice Age coastal culture drowned by the rising sea.</p><ul><li>Some faces meet at sharp right angles and some terraces are strikingly flat and level.</li><li>Kimura reports features in one small area that he says nature does not normally group together: steps, channels, a &#x27;triangle pool&#x27; and two tall parallel slabs.</li><li>People were in the Ryukyus by 30,000 years ago, so an Ice Age presence on this coast is possible.</li></ul><div class="face-s"><b>Its strongest point</b><p>The islands were inhabited while this shoreline was dry land, and nobody has yet excavated the terraces or channels, so the absence of tools or hearths is an absence from places no one has dug.</p></div><p class="face-cr"><b>Credit</b> Masaaki Kimura; Graham Hancock</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Excavate the sediment trapped in the channels and on the lower terraces and look for tools, charcoal or bone that can be dated.</li><li>A full 3D photogrammetric model of the formation, compared feature by feature with dry-land outcrops of the same sandstone on the island.</li><li>Microscopic study of alleged tool marks on sampled surfaces, compared with marks made by waves, boring animals and known stone tools.</li><li>Measure the local vertical movement of the coast over the Holocene, to pin down exactly when each level was last dry.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">6 min read · 1,370 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of Yonaguni: A Drowned Staircase Off Japan"><button type="button" class="wtoc-i" data-go="yonaguni-s1">A staircase in the Kuroshio</button><button type="button" class="wtoc-i" data-go="yonaguni-s2">What the rock and the sea tell us</button><button type="button" class="wtoc-i" data-go="yonaguni-s3">The case for a monument</button><button type="button" class="wtoc-i" data-go="yonaguni-s4">The case for nature</button><button type="button" class="wtoc-i" data-go="yonaguni-s5">What the sea has hidden</button><button type="button" class="wtoc-i" data-go="yonaguni-s6">What would settle it</button></nav></div><section class="wsec" id="yonaguni-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A staircase in the Kuroshio</h3><p>In 1986 Kihachiro Aratake, a diving instructor on Yonaguni, went looking for hammerhead sharks off the island&#x27;s southern cape. What he found instead was stone: broad flat terraces dropping in giant steps into blue water, walls that met at crisp corners, and a narrow trench running between cliff-like faces. Yonaguni is the last island in the Japanese chain before Taiwan, swept by the warm, fast Kuroshio current. On a clear day the whole formation is visible from the surface, a pale stepped mass sinking from about 5 m to about 25 m.</p><p>Within a few years it had a name, the Yonaguni Monument, and a champion. Masaaki Kimura, a marine geologist at the University of the Ryukyus, began diving and mapping it and became convinced that he was looking at a building: a terraced platform, perhaps a castle or a ceremonial site, carved by people when the sea was lower and later drowned. The question it raises is exactly the one this site cares about. If Ice Age coastlines held cultures that we have never seen because the sea took them, where better to look than a place like this?</p><blockquote class="wpull"><p>If the sea swallowed the Ice Age coast, a drowned staircase at the edge of Japan is exactly where you would hope to find its builders.</p></blockquote></section><section class="wsec" id="yonaguni-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What the rock and the sea tell us</h3><p>Some things are not in dispute. The formation is not built of separate blocks hauled into place; it is part of the bedrock, cut into sandstones and mudstones of the Yaeyama Group, laid down on an ancient seabed about 20 million years ago. Those layers are flat and thin, and they are crossed by sets of vertical cracks, called joints, that run in straight lines across the area. That combination matters, because it is how nature makes shapes that look designed.</p><p>The other certainty is the sea. At the peak of the last Ice Age, about 20,000 years ago, so much water was locked in ice sheets that global sea level stood roughly 120 m lower than today. As the ice melted the sea rose, fastest between about 15,000 and 7,000 years ago. Read against the global curve, the base of the formation at about 25 m was last dry land roughly 9,000 to 10,000 years ago, and the top terrace at about 5 m went under roughly 7,000 years ago. The drawing below steps through that drowning.</p><figure class="wx wx--steps" id="yonaguni-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">How the sea drowned the Yonaguni formation</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How the sea drowned the Yonaguni formation"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" class="wx-svg" role="img" aria-labelledby="yonaguni-f1-t"><title id="yonaguni-f1-t">Profile of the Yonaguni formation with the sea rising over it from about 20,000 years ago to today</title><text class="wx-t-cap" x="24" y="20">Yonaguni formation · simplified profile, true scale</text><rect clas
