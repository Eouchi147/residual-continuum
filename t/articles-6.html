ebated</text><line class="wx-thin wx-pop" style="--d:11" x1="434" y1="95.8" x2="434" y2="52"/><circle class="wx-inkfill wx-pop" style="--d:11" cx="434" cy="99.8" r="3.5"/><text class="wx-t-s wx-halo wx-pop" style="--d:11" x="428" y="52" text-anchor="end">Lake Agassiz drains, 8.2 ka</text><text class="wx-t-m wx-halo wx-pop" style="--d:12" x="560" y="97.2" text-anchor="middle">Seas near today's level</text><text class="wx-t-m wx-halo wx-pop" style="--d:12" x="560" y="111.2" text-anchor="middle">for the last c. 6,000 years</text><path class="wx-guide" d="M500,305 L80,372 M680,305 L680,372"/><rect class="wx-card wx-edge-soft" x="80" y="372" width="600" height="112"/><text class="wx-t-cap" x="92" y="390">Zoom: the last 6,000 years, when the stories were written down</text><line class="wx-line" x1="92" y1="440" x2="668" y2="440"/><line class="wx-thin" x1="80" y1="436" x2="80" y2="444"/><line class="wx-thin" x1="180" y1="436" x2="180" y2="444"/><line class="wx-thin" x1="280" y1="436" x2="280" y2="444"/><line class="wx-thin" x1="380" y1="436" x2="380" y2="444"/><line class="wx-thin" x1="480" y1="436" x2="480" y2="444"/><line class="wx-thin" x1="580" y1="436" x2="580" y2="444"/><line class="wx-thin" x1="680" y1="436" x2="680" y2="444"/><circle class="wx-c4 wx-pop" style="--d:9" cx="190" cy="440" r="5"/><text class="wx-t-b wx-pop" style="--d:9" x="190" y="412" text-anchor="middle">Shuruppak flood silt</text><text class="wx-t-s wx-pop" style="--d:9" x="190" y="425" text-anchor="middle">c. 2900 BCE</text><circle class="wx-c4 wx-pop" style="--d:10" cx="290" cy="440" r="5"/><text class="wx-t-b wx-pop" style="--d:10" x="296" y="462" text-anchor="end">Jishi Gorge outburst</text><text class="wx-t-s wx-pop" style="--d:10" x="296" y="475" text-anchor="end">c. 1920 BCE</text><circle class="wx-accfill wx-pop" style="--d:11" cx="316" cy="440" r="5"/><text class="wx-t-b wx-pop" style="--d:11" x="310" y="412" text-anchor="start">Atrahasis tablets</text><text class="wx-t-s wx-pop" style="--d:11" x="310" y="425" text-anchor="start">c. 1640 BCE</text><circle class="wx-accfill wx-pop" style="--d:12" cx="390" cy="440" r="5"/><text class="wx-t-b wx-pop" style="--d:12" x="384" y="462" text-anchor="start">Yu on a Zhou bronze</text><text class="wx-t-s wx-pop" style="--d:12" x="384" y="475" text-anchor="start">c. 900 BCE</text><circle class="wx-accfill wx-pop" style="--d:13" cx="430" cy="440" r="5"/><text class="wx-t-b wx-pop" style="--d:13" x="444" y="412" text-anchor="start">Genesis; Shatapatha</text><text class="wx-t-s wx-pop" style="--d:13" x="444" y="425" text-anchor="start">1st millennium BCE</text><circle class="wx-accfill wx-pop" style="--d:14" cx="540" cy="440" r="5"/><text class="wx-t-b wx-pop" style="--d:14" x="534" y="462" text-anchor="start">The Quran</text><text class="wx-t-s wx-pop" style="--d:14" x="534" y="475" text-anchor="start">610–632 CE</text><text class="wx-t-s" x="92" y="502">Red: physical flood evidence · Bronze: texts. Curve simplified after Lambeck et al. 2014; local curves differ.</text></svg></div></div><figcaption>Global sea level since the height of the last Ice Age, with the great outburst floods, and a zoom on the last 6,000 years when the flood stories were first written down. <span class="wx-src">Based on: Sea-level curve simplified after Lambeck et al. 2014 (PNAS) with Meltwater Pulse 1A from Deschamps et al. 2012; Missoula dates from Waitt 1980; Black Sea dates from Ryan et al. 1997 and later revisions; Shuruppak from Schmidt 1931; Jishi from Wu et al. 2016.</span></figcaption><p class="vh">A chart of global sea level from 20,000 years ago to today. The line starts about 125 metres below today&#x27;s level, rises slowly, then jumps steeply around 14,600 years ago during Meltwater Pulse 1A, then climbs more steadily to near today&#x27;s level by about 6,000 years ago. Shaded bands mark the Missoula outburst floods between 15,000 and 13,000 years ago and the Younger Dryas cold snap. Markers show the drainage of Lake Agassiz 8,200 years ago and the debated dates for the Black Sea refill. A lower zoom lane covering the last 6,000 years marks the Shuruppak flood silt about 2900 BCE, the Jishi Gorge outburst about 1920 BCE, the Atrahasis tablets about 1640 BCE, Yu on a Zhou bronze about 900 BCE, Genesis and the Shatapatha Brahmana in the first millennium BCE, and the Quran in 610 to 632 CE.</p></figure><p>Twenty thousand years ago, so much water was locked in ice that the sea stood about 120 m lower than today. As the ice melted, the sea rose, sometimes in lurches. During Meltwater Pulse 1A, around 14,600 years ago, it climbed something like 14–25 m in a few centuries (the estimates vary), several centimetres a year, enough to move a shoreline by kilometres within a lifetime on a flat coast. The Persian Gulf, a broad river valley during the Ice Age, filled with sea over the following millennia.</p><p>On land, ice dams failed. In what is now Montana, Glacial Lake Missoula, holding up to about 2,184 cubic kilometres of water, burst out 40 or more times between about 15,000 and 13,000 years ago. Around 8,200 years ago the vast Lake Agassiz in North America drained into the ocean and chilled the North Atlantic. And in southern Iraq, the city of Shuruppak, which the Mesopotamian texts name as the flood hero&#x27;s home, lies over a flood deposit dated to about 2900 BCE. Flood layers at Ur and Kish fall at other dates, which fits repeated river floods rather than one deluge.</p><aside class="wcall"><b>How do we know?</b><p>Sea level is reconstructed from dated corals, drowned beaches and peat that grew only at the water&#x27;s edge. Deschamps and colleagues dated coral cores drilled off Tahiti to pin Meltwater Pulse 1A between about 14,650 and 14,310 years ago. Lambeck&#x27;s team combined thousands of such points into a global curve. Individual coasts differ, because land also rises and sinks as ice loads change.</p></aside></section><section class="wsec" id="flood-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The case for an Ice Age memory</h3><p>Here the challengers make their move, and it is not a weak one. Graham Hancock and Randall Carlson argue that the flood stories are too vivid, too universal and too specific about waters bursting from below and pouring from above to be only the memory of ordinary river floods. The end of the Ice Age, they point out, was the biggest environmental catastrophe people have ever lived through. Coasts, the richest places to live, were swallowed. Ice lakes emptied in torrents. The abrupt Younger Dryas cold snap, beginning about 12,900 years ago, threw the climate into reverse.</p><blockquote class="wpull"><p>Geologists once laughed at a man who said the Scablands were cut by a flood. They were wrong.</p></blockquote><p>They also have history on their side. When J Harlen Bretz argued in 1923 that Washington&#x27;s Channeled Scablands were carved by a colossal flood, the geological establishment resisted for decades. He was right. Catastrophe is not unscientific when the evidence is there.</p><p>The strongest support comes from an unexpected direction. In 2016 the geographer Patrick Nunn and the linguist Nicholas Reid matched Aboriginal Australian stories from 21 coastal places to shorelines that drowned as the sea rose after the Ice Age, some more than 7,000 years ago. If Australians could keep such memories for hundreds of generations, others might have too. William Ryan and Walter Pitman proposed one candidate: a sudden refill of the Black Sea from the Mediterranean, which they first dated to about 7,600 years ago.</p></section><section class="wsec" id="flood-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Where the argument gets harder</h3><p>The difficulty is the bridge. The Near Eastern flood family, the one that includes Genesis and the Quran, is written in the language of Mesopotamian river floods, and its hero comes from Shuruppak, a city with a real flood layer from around 2900 BCE. That is thousands of years after the great Ice Age pulses. The Black Sea catastrophe has itself been challenged: cores studied by Aksu, Hiscott, Görür and others suggest a gentler rise, and even Ryan and Pitman&#x27;s team moved their date.</p><p>Elsewhere, many flood stories were written down only after missionaries arrived, so a Noah-like detail may be borrowed rather than remembered. And floods are everywhere. A motif that any river valley can produce is weak evidence of a single shared source.</p><p>Time has also destroyed most of what could decide the matter. The people who watched the Ice Age coasts drown lived on land that now lies tens of metres under the sea, largely unexplored. Their stories, if they told them, passed from mouth to mouth for thousands of years before anyone could write. Absence of evidence on a seabed nobody has searched is very weak evidence of absence.</p></section><section class="wsec" id="flood-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What would settle it</h3><p>The most decisive evidence would come from the drowned shelves themselves. Settlements found under the Persian Gulf or the Sunda Shelf, overwhelmed by rapid sea rise, would show what people saw. Well-dated sediment cores from the Gulf floor could show how fast its valley flooded. A careful catalogue of flood stories recorded before missionary contact, each tested against its own region&#x27;s flood history, could show whether the motifs track local geology or something older and shared.</p><p>For now the fairest verdict holds two truths together. The texts&#x27; water was real: the people of the ancient Near East lived through floods that swept away cities, and their ancestors lived through the rise of a whole ocean. Whether the stories remember one, the other, or both remains open.</p><blockquote class="wpull"><p>The stories may be wrong about one sea covering the world, and still right that the world once drowned.</p></blockquote></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">12,650 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Meltwater Pulse 1A: seas jump c. 14–25 m</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">11,000 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Last of the Missoula outburst floods</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">10,900 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Younger Dryas cold snap begins</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">6,200 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Lake Agassiz drains; abrupt cold event</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">5,600 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Black Sea refill, Ryan and Pitman&#x27;s original date</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">2,900 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Flood silt at Shuruppak</span></li><li class="wtl-build" style="--i:6"><span class="wtl-y">1,640 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Atrahasis flood tablets copied</span></li><li class="wtl-find" style="--i:7"><span class="wtl-y">1872 CE</span><span class="wtl-k">Found</span><span class="wtl-t">George Smith reads the Gilgamesh flood tablet</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">1997 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Black Sea flood hypothesis published</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">2016 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Aboriginal sea-level memories paper</span></li></ol><figure class="fg fg-wide" id="fig-independence"><div class="fg-frame"><div class="fg-scroll"><div class="fg-d"><svg class="fg-svg" viewBox="0 0 620 330" role="img" preserveAspectRatio="xMidYMid meet" aria-labelledby="figin-t figin-d"><title id="figin-t">Ten traditions, four witnesses</title><desc id="figin-d">A diagram collapsing ten traditions into connected components by documented historical contact. Eight of them (Mesopotamian, Greek, Roman, Jewish, Christian, Islamic, Norse and Celtic) form a single connected literate complex and count as one witness. The East Asian stream counts as a partial witness. The Andean and Aboriginal Australian traditions are genuinely independent, and are also the two whose documentation is most compromised.</desc><g class="fg-g"><rect class="fg-stream" x="30" y="36" width="410" height="46" rx="11" style="--i:0"/><text class="fg-t fg-tlab" x="40" y="52" text-anchor="start">Near Eastern · Mediterranean · European</text><text class="fg-t fg-tsm" x="40" y="65" text-anchor="start">Mesopotamian · Greek · Roman · Jewish · Christian · Islamic · Norse · Celtic</text><text class="fg-t fg-tsm" x="40" y="77" text-anchor="start">one connected complex, counted eight times</text><rect class="fg-wt" x="464" y="48" width="96" height="13" rx="3.5" style="--i:0"/><text class="fg-t fg-tdim" x="568" y="58" text-anchor="start">1</text><rect class="fg-stream" x="30" y="104" width="410" height="34" rx="11" style="--i:1"/><text class="fg-t fg-tlab" x="40" y="120" text-anchor="start">East Asian</text><text class="fg-t fg-tsm" x="40" y="133" text-anchor="start">Japanese</text><text class="fg-t fg-tsm" x="40" y="145" text-anchor="start">continental Buddhist and Chinese channels</text><rect class="fg-wt" x="464" y="116" width="67.2" height="13" rx="3.5" style="--i:1"/><text class="fg-t fg-tdim" x="568" y="126" text-anchor="start">0.7</text><rect class="fg-stream" x="30" y="160" width="410" height="34" rx="11" style="--i:2"/><text class="fg-t fg-tlab" x="40" y="176" text-anchor="start">Andean</text><text class="fg-t fg-tsm" x="40" y="190" text-anchor="start">independent until 1532 · documented by its extirpators</text><rect class="fg-wt" x="464" y="172" width="96" height="13" rx="3.5" style="--i:2"/><text class="fg-t fg-tdim" x="568" y="182" text-anchor="start">1</text><rect class="fg-stream" x="30" y="216" width="410" height="34" rx="11" style="--i:3"/><text class="fg-t fg-tlab" x="40" y="232" text-anchor="start">Sahul</text><text class="fg-t fg-tsm" x="40" y="245" text-anchor="start">Aboriginal Australian</text><text class="fg-t fg-tsm" x="40" y="257" text-anchor="start">independent 50,000 yr · documented post-contact</text><rect class="fg-wt" x="464" y="228" width="96" height="13" rx="3.5" style="--i:3"/><text class="fg-t fg-tdim" x="568" y="238" text-anchor="start">1</text><text class="fg-t fg-tsm" x="464" y="34" text-anchor="start">effective witnesses</text><text class="fg-t fg-tsm" x="30" y="34" text-anchor="start">ten traditions</text><line class="fg-grid" x1="30" y1="280" x2="590" y2="280"/><text class="fg-t fg-tlab" x="464" y="298" text-anchor="start">3.7 of 10</text><text class="fg-t fg-tsm" x="30" y="298" text-anchor="start">effective sample after collapsing documented contact</text></g></svg></div><div class="fg-m"><svg class="fg-svg" viewBox="0 0 380 430" role="img" preserveAspectRatio="xMidYMid meet" aria-labelledby="figinm-t figinm-d"><title id="figinm-t">Ten traditions, four witnesses</title><desc id="figinm-d">A diagram collapsing ten traditions into connected components by documented historical contact. Eight of them (Mesopotamian, Greek, Roman, Jewish, Christian, Islamic, Norse and Celtic) form a single connected literate complex and count as one witness. The East Asian stream counts as a partial witness. The Andean and Aboriginal Australian traditions are genuinely independent, and are also the two whose documentation is most compromised.</desc><g class="fg-g"><rect class="fg-stream" x="30" y="36" width="320" height="46" rx="11" style="--i:0"/><text class="fg-t fg-tlab" x="40" y="52" text-anchor="start">Near Eastern · Mediterranean · European</text><text class="fg-t fg-tsm" x="40" y="65" text-anchor="start">Mesopotamian · Greek · Roman · Jewish · Christian · Islamic · Norse · Celtic</text><text class="fg-t fg-tsm" x="40" y="77" text-anchor="start">one connected complex, counted eight times</text><rect class="fg-wt" x="464" y="48" width="96" height="13" rx="3.5" style="--i:0"/><text class="fg-t fg-tdim" x="568" y="58" text-anchor="start">1</text><rect class="fg-stream" x="30" y="104" width="320" height="34" rx="11" style="--i:1"/><text class="fg-t fg-tlab" x="40" y="120" text-anchor="start">East Asian</text><text class="fg-t fg-tsm" x="40" y="133" text-anchor="start">Japanese</text><text class="fg-t fg-tsm" x="40" y="145" text-anchor="start">continental Buddhist and Chinese channels</text><rect class="fg-wt" x="464" y="116" width="67.2" height="13" rx="3.5" style="--i:1"/><text class="fg-t fg-tdim" x="568" y="126" text-anchor="start">0.7</text><rect class="fg-stream" x="30" y="160" width="320" height="34" rx="11" style="--i:2"/><text class="fg-t fg-tlab" x="40" y="176" text-anchor="start">Andean</text><text class="fg-t fg-tsm" x="40" y="190" text-anchor="start">independent until 1532 · documented by its extirpators</text><rect class="fg-wt" x="464" y="172" width="96" height="13" rx="3.5" style="--i:2"/><text class="fg-t fg-tdim" x="568" y="182" text-anchor="start">1</text><rect class="fg-stream" x="30" y="216" width="320" height="34" rx="11" style="--i:3"/><text class="fg-t fg-tlab" x="40" y="232" text-anchor="start">Sahul</text><text class="fg-t fg-tsm" x="40" y="245" text-anchor="start">Aboriginal Australian</text><text class="fg-t fg-tsm" x="40" y="257" text-anchor="start">independent 50,000 yr · documented post-contact</text><rect class="fg-wt" x="464" y="228" width="96" height="13" rx="3.5" style="--i:3"/><text class="fg-t fg-tdim" x="568" y="238" text-anchor="start">1</text><text class="fg-t fg-tsm" x="40" y="34" text-anchor="start">effective witnesses</text><text class="fg-t fg-tsm" x="30" y="34" text-anchor="start">ten traditions</text><line class="fg-grid" x1="30" y1="280" x2="590" y2="280"/><text class="fg-t fg-tlab" x="40" y="314" text-anchor="start">3.7 of 10</text><text class="fg-t fg-tsm" x="30" y="298" text-anchor="start">effective sample after collapsing documented contact</text></g></svg></div></div><div class="fg-photo" hidden></div></div><figcaption class="fg-cap"><span class="fg-num">Fig. 12</span><span class="fg-title">Ten traditions, fewer than four witnesses</span><span class="fg-note">A ten-row comparative table looks like ten independent confirmations. It is not. Mesopotamian demonology reaches Greece in the orientalising period, Judaism in the exile, Christianity by descent, Rome through Greek philosophy in Latin, and the Norse and Irish records exist only because Christian monks wrote them down. That is one witness. The structural irony is worth sitting with: independence of tradition and quality of documentation are inversely correlated across this whole dataset. Everything we have about Andean <i>huacas</i> was written by people who thought they were demons, and almost everything published about Australian ancestral beings passed through colonial ethnography. The two cleanest witnesses are the two we can least clearly hear.</span><span class="fg-src">Burkert, <i>The Orientalizing Revolution</i> (1992) · West, <i>The East Face of Helicon</i> (1997) · Henninger, <i>Geisterglaube bei den vorislamischen Arabern</i> (1963) · Macknight, <i>The Voyage to Marege'</i> (1976)</span></figcaption></figure><details class="srcs"><summary>Sources for this case (19)</summary><ol><li>Lambert W.G., Millard A.R. (1969). Atra-hasis: The Babylonian Story of the Flood. Oxford: Clarendon Press.</li><li>George A.R. (2003). The Babylonian Gilgamesh Epic: Introduction, Critical Edition and Cuneiform Texts. Oxford University Press.</li><li>Finkel I. (2014). The Ark Before Noah: Decoding the Story of the Flood. London: Hodder and Stoughton.</li><li>Lambeck K., Rouby H., Purcell A., Sun Y., Sambridge M. (2014). Sea level and global ice volumes from the Last Glacial Maximum to the Holocene. PNAS 111: 15296–15303. <a href="https://doi.org/10.1073/pnas.1411762111" target="_blank" rel="noopener">doi:10.1073/pnas.1411762111</a></li><li>Deschamps P. et al. (2012). Ice-sheet collapse and sea-level rise at the Bølling warming 14,600 years ago. Nature 483: 559–564. <a href="https://doi.org/10.1038/nature10902" target="_blank" rel="noopener">doi:10.1038/nature10902</a></li><li>Svensson A. et al. (2008). A 60 000 year Greenland stratigraphic ice core chronology. Climate of the Past 4: 47–57. <a href="https://doi.org/10.5194/cp-4-47-2008" target="_blank" rel="noopener">doi:10.5194/cp-4-47-2008</a></li><li>Ryan W.B.F. et al. (1997). An abrupt drowning of the Black Sea shelf. Marine Geology 138: 119–126. <a href="https://doi.org/10.1016/S0025-3227(97)00007-8" target="_blank" rel="noopener">doi:10.1016/S0025-3227(97)00007-8</a></li><li>Görür N. et al. (2001). Is the abrupt drowning of the Black Sea shelf at 7150 yr BP a myth? Marine Geology 176: 65–73. <a href="https://doi.org/10.1016/S0025-3227(01)00148-7" target="_blank" rel="noopener">doi:10.1016/S0025-3227(01)00148-7</a></li><li>Nunn P.D., Reid N.J. (2016). Aboriginal memories of inundation of the Australian coast dating from more than 7000 years ago. Australian Geographer 47: 11–47. <a href="https://doi.org/10.1080/00049182.2015.1077539" target="_blank" rel="noopener">doi:10.1080/00049182.2015.1077539</a></li><li>Lambeck K. (1996). Shoreline reconstructions for the Persian Gulf since the last glacial maximum. Earth and Planetary Science Letters 142: 43–57. <a href="https://doi.org/10.1016/0012-821X(96)00069-6" target="_blank" rel="noopener">doi:10.1016/0012-821X(96)00069-6</a></li><li>Bretz J H. (1923). The Channeled Scabland of the Columbia Plateau. Journal of Geology 31: 617–649.</li><li>Waitt R.B. (1980). About forty last-glacial Lake Missoula jökulhlaups through southern Washington. Journal of Geology 88: 653–679.</li><li>Schmidt E. (1931). Excavations at Fara, 1931. Museum Journal (University of Pennsylvania) 22: 193–245.</li><li>Wu Q. et al. (2016). Outburst flood at 1920 BCE supports historicity of China&#x27;s Great Flood and the Xia dynasty. Science 353: 579–582. <a href="https://doi.org/10.1126/science.aaf0842" target="_blank" rel="noopener">doi:10.1126/science.aaf0842</a></li><li>Mallowan M.E.L. (1964). Noah&#x27;s Flood reconsidered. Iraq 26: 62–82.</li><li>Eggeling J. (trans.) (1882). The Satapatha-Brahmana, Part I. Sacred Books of the East 12. Oxford: Clarendon Press.</li><li>Abdel Haleem M.A.S. (trans.) (2004). The Qur&#x27;an: A New Translation. Oxford University Press.</li><li>Dundes A. (ed.) (1988). The Flood Myth. Berkeley: University of California Press.</li><li>Hancock G. (2015). Magicians of the Gods. London: Coronet.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-flood" data-t="The Flood: One Story, Many Waters"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Flood: One Story, Many Waters</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-flood</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-durupinar-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Turecko Noemova archa (03).jpg" data-cap="The Durupınar formation, Turkey" data-big><figcaption></figcaption></figure><div class="sh-k">Peoples of the Sacred Texts</div><h2 class="sh-t" id="case-durupinar-st" tabindex="-1">Where the Ark Came to Rest: Ararat, Judi, Durupınar</h2><p class="sh-s">Genesis names the mountains of Ararat, the Quran names al-Judi. A boat-shaped hill near Mount Ararat claims to settle the question in stone.</p><div class="sh-v"><span class="vstamp vstamp--on vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg><span class="vs-tx"><span class="vs-on">Durupınar site:</span>Ruled out</span></span></div><p class="sh-claim"><b>What the stamp rates:</b> The Durupınar formation is the fossilised remains of Noah&#x27;s Ark.</p><p class="sh-claim"><b>The text's own words:</b> <span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span> <span class="sh-more">(line by line below)</span></p></div><p class="v4-q">Is the Durupınar formation the Ark, and where do the texts place the landing?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Near Mount Ararat a boat-shaped hill is said to be the petrified Ark.</li><li>Geologists who mapped it found folded, iron-stained layers of local rock; the &#x27;rivets&#x27; and &#x27;beams&#x27; are natural minerals.</li><li>Digging found soil and rock, and no wood or joinery has been published.</li><li>The oldest traditions, including the Quran&#x27;s al-Judi, point to a different range far to the south.</li><li>This verdict is about one hillside only; it says nothing about the flood accounts themselves.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Geology</span><span class="thr">Texts and scripts</span><span class="thr">Religion and myth</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="164" >164</b><span class="ctr-u"> m</span></div><div class="ctr-l">length of the Durupınar formation</div><div class="ctr-c">Collins and Fasold 1996</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="157" >157</b><span class="ctr-u"> m</span></div><div class="ctr-l">300 cubits of Genesis 6:15 with a 52.4 cm cubit</div><div class="ctr-c">Genesis 6:15</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="29" >29</b><span class="ctr-u"> km</span></div><div class="ctr-l">from the formation to Mount Ararat&#x27;s summit</div><div class="ctr-c">Collins and Fasold 1996</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="2089" >2,089</b><span class="ctr-u"> m</span></div><div class="ctr-l">height of Cudi Dağı, the traditional Mount Judi</div><div class="ctr-c">Turkish survey data</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The Durupınar formation is the fossilised remains of Noah&#x27;s Ark.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Geological mapping shows the boat shape is made of folded, iron-stained layers of local rock, and the features read as rivets, beams and anchors are natural minerals and local andesite. Excavation found soil and rock, and no wood or joinery has been published. Soil ages cannot date a vessel and remain unpublished in peer-reviewed form. This verdict concerns one hillside only. It says nothing about the flood accounts themselves, and the Quran&#x27;s al-Judi points to a different mountain altogether.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Geology references state firmly that Durupınar is natural, and the evidence supports that confidence. Where popular treatments fall short is on the texts: they often assume the Ark tradition always meant the high peak of Ararat. The older witnesses, including Berossus, the Syriac and Aramaic traditions and the Quran, point to the Cudi range, a point textbooks rarely mention.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Genesis 8:4 places the landing on &#x27;the mountains of Ararat&#x27;, a region rather than one peak: Ararat is the Hebrew form of Urartu, the kingdom around Lake Van in the 9th–6th centuries BCE.<small>Genesis 8:4; Bailey 1989</small></li><li>The Quran (11:44) names al-Judi. An older regional tradition put the landing in the Gordyaean or Qardu mountains south of Lake Van: Berossus (as quoted by Josephus), Syriac Christian writers and the Aramaic Targum all point there, to the range now called Cudi Dağı near Cizre.<small>Josephus, Antiquities 1.93; Bailey 1989</small></li><li>The peak called Mount Ararat (Ağrı Dağı, 5,137 m) became the favoured landing place later, in medieval Armenian and European tradition.<small>Bailey 1989</small></li><li>The Durupınar formation is about 164 m long, lies 29 km south of Ararat&#x27;s summit at roughly 2,000 m, was exposed after heavy rain and earthquakes in May 1948 and was photographed in 1959 on a Turkish mapping flight.<small>Collins and Fasold 1996</small></li><li>Geologists describe it as iron-rich (limonite and magnetite) layers in the steep limbs of a doubly plunging syncline; the nearby &#x27;anchor stones&#x27; are local andesite.<small>Collins and Fasold 1996</small></li><li>A 1960 expedition dug into the formation and found only soil and rock.<small>Collins and Fasold 1996</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Soil samples announced from 2023 by a Turkish and American university team gave ages of roughly 5500–3000 BCE. The results have not appeared in a peer-reviewed paper, and dating soil dates the soil, not a vessel.</li><li>Whether the final boat outline owes more to folding or to landslide and mudflow around a resistant core, as Eşref Atabey concluded in 2025. Both explanations are natural.</li><li>What &#x27;al-Judi&#x27; meant to its first hearers: the name of the Cudi range, or a word for a height, possibly related to a Syriac word for mounds or elevations.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>No wood, joinery, nails or artefacts from Durupınar have been published in any peer-reviewed study.</li><li>The summit shrines and monastery ruins of Cudi Dağı have hardly been surveyed, partly because the area has been a conflict zone for decades.</li><li>Timber exposed on a mountainside is not expected to survive thousands of years except in unusual conditions, so absence of a wooden ark anywhere says little about the text.</li></ul></div></div><h3 class="sub-h wsub">How the traditions tell it</h3><div class="v4texts"><blockquote class="quote v4q"><span class="v4q-t">Hebrew Bible · Genesis 8:4</span><p>and in the seventh month, on the seventeenth day of the month, the ark came to rest on the mountains of Ararat.</p><cite>NRSV, Anglicised edition</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Quran · 11:44</span><p>Then it was said, &#x27;Earth, swallow up your water, and sky, hold back,&#x27; and the water subsided, the command was fulfilled. The Ark settled on Mount Judi, and it was said, &#x27;Gone are those evildoing people!&#x27;</p><cite>trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Babylonian (Berossus, via Josephus) · Antiquities 1.93</span><p>It is said there is still some part of this ship in Armenia, at the mountain of the Cordyaeans; and that some people carry off pieces of the bitumen, which they take away, and use chiefly as amulets for the averting of mischiefs.</p><cite>Josephus quoting Berossus, trans. William Whiston (1737)</cite></blockquote></div><h3 class="sub-h wsub">In the text's own words</h3><p class="rd-rule">Each line rates only what the text itself says, not later dates, commentaries or modern identifications.</p><ul class="rds"><li class="rd"><p class="rd-s">The Ark came to rest on al-Judi (Quran 11:44); &#x27;on the mountains of Ararat&#x27; (Genesis 8:4).</p><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span><p class="rd-n">An old Mesopotamian and Syriac tradition places Judi at Cudi Dağı in southeast Turkey, the &#x27;mountain of the Cordyaeans&#x27; where Berossus said pieces of the ship were still carried off. Neither Cudi nor Ararat has been searched systematically for ancient timber. The Durupınar formation is a natural rock fold and is not on either mountain.</p></li></ul><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Geologists who have mapped the site describe Durupınar as a natural fold in local rock, shaped further by slope movement, with iron-rich layers that produced the regular lines seen on radar. Historians of the tradition note that Genesis names a region, Urartu, and that the oldest post-biblical traditions, and the Quran, point instead to the Cudi range far to the south. The high peak of Ararat and the Durupınar hill are later candidates.</p><ul><li>The &#x27;hull&#x27; is a pointed oval outcrop of tilted layers, a common shape where folds close at both ends.</li><li>Metal &#x27;rivets&#x27; and &#x27;deck beams&#x27; are concentrations of iron minerals in the rock.</li><li>The &#x27;drogue&#x27; or anchor stones are local andesite, not stones carried from Mesopotamia.</li><li>David Fasold, once the site&#x27;s leading promoter, co-wrote the 1996 paper that explained it as geology.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Ron Wyatt argued from 1977 that Durupınar is the petrified Ark. Its length matches Genesis&#x27;s 300 cubits if one uses the Egyptian royal cubit, it lies within the ancient land of Urartu, its radar scans show regular lines like bulkheads, metal detectors pick up regular iron points like rivets, and large pierced stones nearby resemble drogue anchors. Since 2021 a university team has taken rock and soil samples and reported ages between about 5500 and 3000 BCE, which supporters see as matching Noah&#x27;s era.</p><ul><li>The size fits: about 164 m against 300 cubits of about 52 cm, roughly 157 m.</li><li>The site is inside the Urartu region that Genesis actually names.</li><li>Regular subsurface patterns and iron points suggested built structure to early surveyors.</li></ul><div class="face-s"><b>Its strongest point</b><p>The formation&#x27;s length is close to the 300 cubits of Genesis 6:15 and it lies within the ancient land of Urartu, exactly the region Genesis names as the landing place.</p></div><p class="face-cr"><b>Credit</b> Ron Wyatt (1933–1999); researchers from Ağrı İbrahim Çeçen University, Istanbul Technical University and Andrews University (from 2021)</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Full, peer-reviewed publication of the 2021–2025 sample results, with sampling locations and methods.</li><li>Cores drilled through the formation&#x27;s centre and &#x27;hull&#x27; lines, examined for wood, carbonised timber or worked material.</li><li>An independent geophysical survey comparing Durupınar with the natural folds around it.</li><li>Archaeological survey of Cudi Dağı&#x27;s summit shrines, the focus of the oldest landing tradition.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">6 min read · 1,220 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Where the Ark Came to Rest: Ararat, Judi, Durupınar"><button type="button" class="wtoc-i" data-go="durupinar-s1">A ship in the hills</button><button type="button" class="wtoc-i" data-go="durupinar-s2">Two texts, two mountains</button><button type="button" class="wtoc-i" data-go="durupinar-s3">What the hillside is made of</button><button type="button" class="wtoc-i" data-go="durupinar-s4">The case for the Ark</button><button type="button" class="wtoc-i" data-go="durupinar-s5">What time has hidden</button><button type="button" class="wtoc-i" data-go="durupinar-s6">What would settle it</button></nav></div><section class="wsec" id="durupinar-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A ship in the hills</h3><p>In May 1948, after heavy rains and a run of earthquakes, a Kurdish shepherd on the slopes south of Mount Ararat saw something new: a long, pointed oval standing out from the hillside like the hull of a ship. Eleven years later, in 1959, a Turkish Air Force photograph taken on a mapping mission caught the same shape from above, and a Turkish army captain, İlhan Durupınar, drew attention to it. The name stuck.</p><p>The oval is about 164 m long. Genesis 6:15 gives the Ark as 300 cubits long, and with a cubit of about 52 cm that comes to about 157 m. Stand on the ridge above it today, where Turkey has built a small visitor centre, and it is easy to see why people have wondered. The mountains of Ararat, the land where Genesis says the Ark came to rest, are all around you.</p><p>But there is more than one sacred text in this story, and more than one mountain. Before weighing the hillside, it helps to ask where the traditions themselves put the landing.</p></section><section class="wsec" id="durupinar-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Two texts, two mountains</h3><blockquote class="quote"><p>and in the seventh month, on the seventeenth day of the month, the ark came to rest on the mountains of Ararat.</p><cite>Genesis 8:4, NRSV (Anglicised edition)</cite></blockquote><p>Genesis does not name a peak. It says the mountains of Ararat, and Ararat is the Hebrew form of Urartu, a kingdom centred on Lake Van that rivalled Assyria in the 9th to 6th centuries BCE. Its mountains covered a large part of what is now eastern Turkey, Armenia and north-western Iran.</p><p>Urartu is not a legend. Its kings left inscriptions in cuneiform, its capital Tushpa stood on the rock of Van, and Assyrian annals record wars against it. Anyone in the ancient Near East hearing &#x27;the mountains of Ararat&#x27; would have pictured the high, cold country beyond the Tigris headwaters, a natural place for a story&#x27;s ship to meet the first dry land.</p><blockquote class="quote"><p>The Ark settled on Mount Judi, and it was said, &#x27;Gone are those evildoing people!&#x27;</p><cite>Quran 11:44, trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><p>The Quran names al-Judi, and here the evidence for an old, specific tradition is warm and consistent. The Babylonian priest Berossus, writing around 280 BCE and quoted by Josephus, said remains of the ship could still be seen in the mountains of the Cordyaeans, where people scraped off its bitumen for amulets. Corduene, known in Syriac as Qardu, is the rugged country south of Lake Van. The Aramaic Targum and Syriac Christian writers placed the landing there too. A monastery stood on the mountain until lightning destroyed it in 776 CE, and the range still carries the name Cudi Dağı, the mountain of Judi, above the Tigris near Cizre.</p><figure class="wx wx--static" id="durupinar-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Where did the Ark come to rest?</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Where did the Ark come to rest?"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" class="wx-svg" role="img" aria-labelledby="durupinar-f1-t"><title id="durupinar-f1-t">Map of eastern Turkey and northern Iraq showing Mount Ararat, the Durupinar formation, Mount Judi near Cizre, Lake Van, the old kingdom of Urartu and the rivers Tigris, Euphrates and Aras</title><defs><marker id="durupinar-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker><marker id="durupinar-f1-ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><rect class="wx-card wx-edge-soft" x="30" y="40" width="660" height="492"/><text class="wx-t-cap" x="44" y="30">Where did the Ark come to rest? · the candidates</text><g class="wx-pop" style="--d:1"><ellipse class="wx-c6 wx-o20" cx="480" cy="190" rx="175" ry="112"/></g><ellipse class="wx-dash wx-s6 wx-pop" style="--d:1" cx="480" cy="190" rx="175" ry="112"/><text class="wx-t-cap wx-pop" style="--d:2" x="150" y="140">URARTU</text><text class="wx-t-s wx-pop" style="--d:2" x="150" y="154">the 'Ararat' of Genesis 8:4,</text><text class="wx-t-s wx-pop" style="--d:2" x="150" y="167">a kingdom, 9th–6th c. BCE</text><line class="wx-thin wx-pop" style="--d:2" x1="290" y1="160" x2="312" y2="170"/><polygon class="wx-water wx-edge-soft" points="384,191.4 424,181.3 464,191.4 488,226.8 464,246.9 432,236.8 400,241.9 376,221.7"/><polygon class="wx-water wx-edge-soft" points="624,262.1 656,282.3 672,322.7 656,363.1 632,353 616,312.6 608,282.3"/><text class="wx-t-s" x="432" y="213.6" text-anchor="middle">Lake Van</text><text class="wx-t-s" x="640" y="316.6" text- 8.2,352.2 387.2,336.9 396.2,352.2"/><circle class="wx-hl wx-pulse" cx="387.2" cy="345.9" r="18"/><text class="wx-t-b wx-pop" style="--d:9" x="411.2" y="337.9">Cudi Dağı (Mount Judi)</text><text class="wx-t-s wx-pop" style="--d:9" x="411.2" y="351.9">2,089 m · al-Judi of Quran 11:44;</text><text class="wx-t-s wx-pop" style="--d:9" x="411.2" y="364.9">Berossus' 'Gordyaean mountains'</text><text class="wx-t-cap wx-pop" style="--d:10" x="296" y="409.3" text-anchor="middle">CORDUENE</text><text class="wx-t-s wx-pop" style="--d:10" x="296" y="423.3" text-anchor="middle">Syriac Qardu</text><polygon class="wx-stone3 wx-edge wx-pop" style="--d:11" points="608,510.1 616,496.5 624,510.1"/><text class="wx-t-s wx-pop" style="--d:11" x="602" y="500.5" text-anchor="end">Pir Omar Gudrun, often</text><text class="wx-t-s wx-pop" style="--d:11" x="602" y="513.5" text-anchor="end">matched to Gilgamesh's Nimush</text><line class="wx-bold" x1="60" y1="505" x2="151" y2="505"/><line class="wx-line" x1="60" y1="499" x2="60" y2="511"/><line class="wx-line" x1="151" y1="499" x2="151" y2="511"/><text class="wx-t-s" x="106" y="497" text-anchor="middle">100 km</text><path class="wx-inkfill" d="M70,62 L76,80 L70,76 L64,80 Z"/><text class="wx-t-b" x="70" y="94" text-anchor="middle">N</text><text class="wx-t-s" x="52" y="525">Positions approximate; modern borders omitted.</text></svg></div></div><figcaption>The land of Urartu, which Genesis calls Ararat, with the three leading candidates: Mount Ararat, the Durupınar formation below it, and Cudi Dağı near Cizre, the Mount Judi of the older tradition and of Quran 11:44. <span class="wx-src">Based on: Coordinates from standard gazetteers; Urartu extent simplified from historical atlases; heights from Turkish survey data; traditions from Bailey 1989 and Josephus, Antiquities 1.93.</span></figcaption><p class="vh">Map of eastern Turkey and northern Iraq. A dashed shaded oval around Lake Van marks the old kingdom of Urartu, the Ararat of Genesis. In the north-east, a peak symbol marks Mount Ararat, 5,137 metres, with the Durupinar formation marked 29 kilometres to its south. The Aras river runs north of Ararat. In the south, a highlighted peak marks Cudi Dag, 2,089 metres, near the town of Cizre on the Tigris, labelled as al-Judi of Quran 11:44 and the Gordyaean mountains of Berossus, in the region of Corduene, Syriac Qardu. Further south-east a peak near Sulaymaniyah is labelled Pir Omar Gudrun, often matched to Mount Nimush of the Gilgamesh epic. A 100 kilometre scale bar and north arrow are shown.</p></figure><p>The high volcanic peak we call Mount Ararat, Ağrı Dağı at 5,137 m, became the favoured landing place later, in medieval Armenian and then European tradition. So the Quran&#x27;s al-Judi agrees with the oldest post-biblical witnesses, while the Genesis text itself names a region wide enough to include either.</p><blockquote class="wpull"><p>The Quran&#x27;s al-Judi agrees with the oldest witnesses we have: Berossus, the Aramaic Targum and the Syriac tradition.</p></blockquote></section><section class="wsec" id="durupinar-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>What the hillside is made of</h3><p>In 1996 the geologist Lorence Collins published a study of Durupınar with an unexpected co-author: David Fasold, a former merchant mariner who had been one of the site&#x27;s most energetic promoters and had surveyed it with ground-penetrating radar in 1985. Their conclusion was that the ship is geology.</p><figure class="wx wx--steps" id="durupinar-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">How rock can make a boat</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How rock can make a boat"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" class="wx-svg" role="img" aria-labelledby="durupinar-f2-t"><title id="durupinar-f2-t">Step-through showing how folding and eros
