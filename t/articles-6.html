es its first construction to the sixth century, and its architecture, iconography and metalwork belong to the Tiwanaku world. Its masons used a system of standard shapes, templates and careful finishing, and tied blocks together with bronze cramps poured into sockets. Architect Jean-Pierre Protzen and historian Stella Nair see precision and modular design, but no sign of machinery.</p><ul><li>Dates come from organic material in the construction fill, not from the stone.</li><li>The stones match known quarries: sandstone about 10 km away, andesite about 90 km away.</li><li>The cramp alloy belongs to the Tiwanaku sphere of the Middle Horizon, around AD 600–900.</li><li>Repeated profiles and multiple miniature models point to templates and planned mass production.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Arthur Posnansky, who studied Tiwanaku for decades, argued from the alignment of the Kalasasaya temple and old lake shorelines that the city was 11,000–17,000 years old. Graham Hancock revived that dating in Fingerprints of the Gods (1995). Popular television goes further and calls the H-blocks machined. Chemist Joseph Davidovits argues more narrowly that the sandstone and andesite were cast as an artificial stone, a geopolymer, which would explain sharp shapes without hard tools.</p><ul><li>The andesite pieces show flat faces, sharp inner right angles and drilled holes in a hard volcanic stone.</li><li>Identical profiles repeat across many blocks, as if made to one pattern.</li><li>No Tiwanaku stoneworking tools capable of this finish have been identified.</li><li>Davidovits reports unusual binder chemistry and organic carbon in the stone.</li></ul><div class="face-s"><b>Its strongest point</b><p>The andesite work combines crisp interior right angles, repeated identical profiles and fine flat surfaces in a hard volcanic stone, and no tool kit able to produce it has yet been found at Tiwanaku.</p></div><p class="face-cr"><b>Credit</b> Arthur Posnansky; Graham Hancock; Joseph Davidovits; Ancient Aliens presenters</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Find and date workshop debris at Pumapunku or the Copacabana quarries: hammerstones, abrasives, broken templates, with microwear that matches the finished surfaces.</li><li>Run independent petrographic tests comparing block thin sections with the quarry outcrops, to test the geopolymer claim.</li><li>Take further radiocarbon samples from sealed fills directly under the platform slabs.</li><li>Measure every surviving H-block with a common 3D survey, to show how identical they really are.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">6 min read · 1,217 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Puma Punku: The Lego Temple of the Andes"><button type="button" class="wtoc-i" data-go="puma-punku-s1">A kit of stone on the altiplano</button><button type="button" class="wtoc-i" data-go="puma-punku-s2">What is solid</button><button type="button" class="wtoc-i" data-go="puma-punku-s3">How Tiwanaku built a modular temple</button><button type="button" class="wtoc-i" data-go="puma-punku-s4">The case for a lost older builder</button><button type="button" class="wtoc-i" data-go="puma-punku-s5">Testing the claims</button><button type="button" class="wtoc-i" data-go="puma-punku-s6">What time destroyed, and what would settle it</button></nav></div><section class="wsec" id="puma-punku-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A kit of stone on the altiplano</h3><p>At almost 3,850 m, on the windswept plain south of Lake Titicaca, a field of broken stone looks like the aftermath of an explosion in a precision workshop. Red sandstone slabs as big as a lorry lie beside grey andesite blocks cut into H shapes, stepped niches and crosses, with flat faces, crisp inside corners and small drilled holes. Many pieces seem to repeat, as if they came from one mould. This is Pumapunku, the Gate of the Puma, part of the ancient city of Tiwanaku.</p><p>It is one of the most shared images of the internet&#x27;s lost-civilisation stories, often captioned as machined, impossible, or older than the Ice Age. The real questions are sharper and more interesting: how old is it, who planned such a modular system, and how did they cut hard volcanic stone so cleanly?</p><blockquote class="wpull"><p>Pumapunku is not a pile of impossible stones. It is a flat-pack temple whose instructions were lost.</p></blockquote></section><section class="wsec" id="puma-punku-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What is solid</h3><p>The platform itself is a large earthen and stone mound about 167 m by 117 m. Excavations by Alexei Vranich took organic material from the deepest layer of its fill and obtained a radiocarbon date that calibrates to about AD 536–600. Above it lie three main building phases and many repairs, the usual life of a temple used for centuries. Tiwanaku as a city was founded around the first or second century AD, peaked between about 500 and 1000, and dissolved around 1000, probably helped by a long drought.</p><p>The stones have known homes. The red sandstone of the great platform slabs came from a quarry about 10 km away; the largest slab is about 7.8 m long, 5.2 m wide and 1.1 m thick, roughly 131 tonnes. The finer andesite, used for gateways and the famous H-blocks, came from the Copacabana peninsula about 90 km away, most likely moved partly across the lake.</p><figure class="wx wx--static" id="puma-punku-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Two stones, two journeys</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Two stones, two journeys"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" class="wx-svg" role="img" aria-labelledby="puma-punku-f1-t"><title id="puma-punku-f1-t">Where Puma Punku's stones came from, and the largest sandstone slab to scale</title><defs><marker id="puma-punku-f1-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" class="wx-accfill"/></marker></defs><text x="20" y="24" class="wx-t-cap">Two stones, two journeys</text><text x="20" y="46" class="wx-t-s">Schematic map, southern Lake Titicaca</text><polygon points="24,70 150,58 222,104 232,168 196,204 150,214 110,196 60,156 26,118" class="wx-water wx-edge-soft"/><polygon points="208,226 252,212 292,236 286,272 246,284 210,262" class="wx-water wx-edge-soft"/><text x="118" y="128" text-anchor="middle" class="wx-t-cap">Lake Titicaca</text><text x="250" y="252" text-anchor="middle" class="wx-t-s">Wiñaymarka</text><circle cx="160" cy="230" r="5" class="wx-c2"/><text x="150" y="252" text-anchor="end" class="wx-t-b">Copacabana</text><text x="150" y="266" text-anchor="end" class="wx-t-s">andesite quarries</text><circle cx="300" cy="320" r="6" class="wx-accfill wx-pulse"/><text x="312" y="316" class="wx-t-b">Tiwanaku</text><text x="312" y="330" class="wx-t-s">c. 3,850 m</text><rect x="294" y="346" width="12" height="9" class="wx-c4"/><text x="286" y="360" text-anchor="end" class="wx-t-b">sandstone quarry</text><path d="M166,234 C196,244 214,256 232,270 C258,290 280,306 294,316" class="wx-hl wx-draw" pathLength="1" style="--d:2" marker-end="url(#puma-punku-f1-ar)"/><path d="M300,346 L300,330" class="wx-hl wx-s4" marker-end="url(#puma-punku-f1-ar)"/><text x="140" y="300" class="wx-t wx-halo">andesite: c. 90 km</text><text x="140" y="314" class="wx-t-s wx-halo">route by lake proposed</text><text x="212" y="384" class="wx-t wx-halo">sandstone: c. 10 km</text><rect x="30" y="404" width="36" height="4" class="wx-inkfill"/><text x="72" y="410" class="wx-t-s">c. 20 km</text><line x1="372" y1="40" x2="372" y2="414" class="wx-guide"/><g transform="translate(20,0)"><text x="368" y="46" class="wx-t-s">Largest slab, Plataforma Lítica · 1 m = 22 px</text><g class="wx-pop" style="--d:3"><rect x="380" y="80" width="171.6" height="114.4" class="wx-c4 wx-o40 wx-edge"/><text x="465.8" y="136" text-anchor="middle" class="wx-t-b">plan</text><text x="465.8" y="152" text-anchor="middle" class="wx-t-s">7.8 × 5.2 m</text></g><g class="wx-pop" style="--d:5"><rect x="380" y="276" width="171.6" height="24.2" class="wx-c4 wx-o40 wx-edge"/><line x1="372" y1="300.2" x2="640" y2="300.2" class="wx-line"/><text x="465.8" y="268" text-anchor="middle" class="wx-t-b">edge view</text><text x="560" y="292" class="wx-t-s">1.1 m</text><circle cx="610" cy="267.8" r="4.4" class="wx-inkfill"/><line x1="610" y1="272.2" x2="610" y2="286.6" class="wx-line"/><line x1="610" y1="286.6" x2="604.6" y2="300.2" class="wx-line"/><line x1="610" y1="286.6" x2="615.4" y2="300.2" class="wx-line"/><line x1="603" y1="277" x2="617" y2="277" class="wx-line"/><text x="624" y="286" class="wx-t-s">1.7 m</text></g><g class="wx-pop" style="--d:7"><text x="572" y="96" class="wx-t-n wx-t-a">c. 131 t</text><text x="572" y="113" class="wx-t-s">red sandstone</text><text x="572" y="136" class="wx-t-n">c. 85 t</text><text x="572" y="153" class="wx-t-s">the next largest</text><text x="380" y="222" class="wx-t-s">Andesite pieces (H-blocks, gateways) are</text><text x="380" y="236" class="wx-t-s">far smaller but far more finely worked.</text></g></g><rect x="400" y="372" width="44" height="4" class="wx-inkfill"/><rect x="444" y="372" width="44" height="4" class="wx-card wx-edge"/><text x="400" y="366" text-anchor="middle" class="wx-t-s">0</text><text x="488" y="366" text-anchor="middle" class="wx-t-s">4 m</text></svg></div></div><figcaption>Left, a schematic map of where Pumapunku&#x27;s stone came from. Right, the largest sandstone slab in plan and edge view at one scale with a person. <span class="wx-src">Based on: Slab dimensions and weights as published from Protzen &amp; Nair 2013 and earlier surveys; quarry distances from Ponce Sanginés 1970. Map is schematic; lake outline and positions simplified.</span></figcaption><p class="vh">Left panel: a simplified map of the southern part of Lake Titicaca with the smaller Wiñaymarka basin. A line runs from the andesite quarries at Copacabana to Tiwanaku, marked about 90 km, route by lake proposed; a short arrow from a sandstone quarry just south of Tiwanaku is marked about 10 km. A 20 km scale bar. Right panel: the largest slab drawn at 22 pixels per metre, 7.8 by 5.2 m in plan and 1.1 m thick in edge view, next to a 1.7 m person, labelled about 131 tonnes of red sandstone, with the next largest about 85 tonnes. A note says the andesite pieces are much smaller but far more finely worked.</p></figure><figure class="photo wimg" data-img="Puma Punku foundation plates.JPG" data-cap="Sandstone platform slabs at Pumapunku."><figcaption></figcaption></figure></section><section class="wsec" id="puma-punku-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>How Tiwanaku built a modular temple</h3><p>The most careful study of the stones is by the architect Jean-Pierre Protzen and the architectural historian Stella Nair, who measured and drew hundreds of pieces. They found that the andesite blocks follow standard profiles so closely that they could be swapped for one another, and that small stone models of the same designs exist in several copies. To them this points to templates and something like prefabrication: a design system in which parts were made to a pattern and assembled on site.</p><p>The H-blocks are the stars of the show. Each is a squat andesite piece whose front is cut into a stepped H, with recessed panels, sharp inner corners and a narrow groove. Set side by side they would have formed a continuous decorated wall or base, the same motif repeating like a frieze. Because the profile repeats so closely, a mason could have worked from a wooden or stone template, checking each face against it as the work went on. That is the likeliest explanation for the famous interchangeability, and it is also how later Andean builders are thought to have organised large projects: many hands, one pattern.</p><p>Tools are the gap. No stoneworking tool kit has been identified at Tiwanaku. Protzen and Nair tried reproducing a small andesite design with stone hammers and abrasives such as quartzite and hematite; bronze tools were nearly useless on the hard stone. Nair&#x27;s copy of one half-cross motif took about 40 hours, and she estimated an experienced mason might need 25. The hardest part was the perfectly flat inner surfaces, which is exactly what makes the originals so striking.</p><p>The metal tells a clearer story. Many blocks were tied across their joints with I-shaped cramps. Heather Lechtman of MIT analysed them and found a rare copper-arsenic-nickel bronze. At Pumapunku the cramps had been poured as molten metal straight into the carved sockets, while at the Akapana pyramid similar cramps were hammered from ingots. Pouring metal on a building site needs a crucible and a hot fire, and Tiwanaku metalworkers clearly had both.</p><figure class="wx wx--steps" id="puma-punku-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">Casting a cramp in place</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Casting a cramp in place"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" class="wx-svg" role="img" aria-labelledby="puma-punku-f2-t"><title id="puma-punku-f2-t">How an I-shaped metal cramp was cast in place across a joint, in five steps</title><text x="24" y="26" class="wx-t-cap">Top view of two blocks · schematic, not to scale</text><rect x="60" y="110" width="236" height="170" class="wx-stone2 wx-edge"/><rect x="300" y="110" width="236" height="170" class="wx-stone2 wx-edge"/><line x1="298" y1="96" x2="298" y2="296" class="wx-dash"/><text x="298" y="90" text-anchor="middle" class="wx-t-s">joint</text><text x="120" y="300" text-anchor="middle" class="wx-t-m">block A</text><text x="476" y="300" text-anchor="middle" class="wx-t-m">block B</text><g class="wx-st" data-s="1"><circle cx="40" cy="62" r="9" class="wx-num"/><text x="40" y="66" text-anchor="middle" class="wx-numt">1</text><text x="56" y="60" class="wx-t-b">Dress and set the blocks</text><text x="56" y="75" class="wx-t-s">flat faces, tight joint</text></g><g class="wx-st" data-s="2"><path d="M242,160 L262,160 L262,186 L334,186 L334,160 L354,160 L354,230 L334,230 L334,204 L262,204 L262,230 L242,230 Z" class="wx-paper wx-edge"/><circle cx="220" cy="336" r="9" class="wx-num"/><text x="220" y="340" text-anchor="middle" class="wx-numt">2</text><text x="236" y="334" class="wx-t-b">Carve an I-shaped socket</text><text x="236" y="349" class="wx-t-s">half in each block, across the joint</text><line x1="298" y1="322" x2="298" y2="236" class="wx-thin"/></g><g class="wx-st" data-s="3"><polygon points="600,164 612,196 660,196 672,164" class="wx-rock wx-edge"/><ellipse cx="636" cy="164" rx="36" ry="7" class="wx-fire wx-edge"/><path d="M608,214 Q618,200 626,214 Q636,198 646,214 Q656,200 664,214" class="wx-fire wx-o80 wx-pulse"/><rect x="596" y="214" width="80" height="10" class="wx-wood wx-edge-soft"/><circle cx="580" cy="62" r="9" class="wx-num"/><text x="580" y="66" text-anchor="middle" class="wx-numt">3</text><text x="596" y="60" class="wx-t-b">Melt the bronze</text><text x="596" y="75" class="wx-t-s">copper-arsenic-nickel,</text><text x="596" y="89" class="wx-t-s">in a crucible near the wall</text><text x="636" y="244" text-anchor="middle" class="wx-t-s">crucible</text></g><g class="wx-st wx-hide" data-only="4"><path d="M602,160 C560,130 420,130 346,176" class="wx-flow wx-s1"/></g><g class="wx-st" data-s="4"><path d="M242,160 L262,160 L262,186 L334,186 L334,160 L354,160 L354,230 L334,230 L334,204 L262,204 L262,230 L242,230 Z" class="wx-bronze wx-edge"/><circle cx="476" cy="336" r="9" class="wx-num"/><text x="476" y="340" text-anchor="middle" class="wx-numt">4</text><text x="492" y="334" class="wx-t-b">Pour</text><text x="492" y="349" class="wx-t-s">the metal takes the</text><text x="492" y="363" class="wx-t-s">exact shape of the socket</text></g><g class="wx-st wx-hide" data-s="5"><path d="M150,195 L200,195" class="wx-hl" /><path d="M446,195 L396,195" class="wx-hl" /><text x="120" y="176" text-anchor="middle" class="wx-t wx-halo">cannot slide apart</text><circle cx="40" cy="336" r="9" class="wx-num"/><text x="40" y="340" text-anchor="middle" class="wx-numt">5</text><text x="56" y="334" class="wx-t-b">Locked</text><text x="56" y="349" class="wx-t-s">cramps tie the joint;</text><text x="56" y="363" class="wx-t-s">most sockets are empty today</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Dress and set: two blocks are shaped with flat faces and placed with a tight joint.</p><ol class="wx-steplist"><li>Dress and set: two blocks are shaped with flat faces and placed with a tight joint.</li><li>Socket: an I-shaped socket is carved across the joint, half in each block.</li><li>Melt: copper-arsenic-nickel bronze is melted in a crucible on site.</li><li>Pour: the molten metal fills the socket and takes its exact shape (Lechtman 1998).</li><li>Locked: the cramp stops the blocks sliding apart; most were later pried out, leaving empty sockets.</li></ol><figcaption>How Tiwanaku builders tied blocks together with molten bronze, following Heather Lechtman&#x27;s analysis of the Pumapunku cramps. <span class="wx-src">Based on: Lechtman 1998 (alloy; cast in place at Pumapunku, cold-hammered at Akapana); Protzen &amp; Nair 2013. Schematic; socket proportions simplified and crucible form conjectural.</span></figcaption><p class="vh">Top view of two stone blocks meeting at a joint. Step 1: the blocks are dressed and set with a tight joint. Step 2: an I-shaped socket is carved across the joint, half in each block. Step 3: copper-arsenic-nickel bronze is melted in a crucible over a fire near the wall. Step 4: a stream of molten metal is poured into the socket, which fills with bronze in exactly its shape. Step 5: the cramp locks the blocks so they cannot slide apart; a note says most sockets are empty today.</p></figure></section><section class="wsec" id="puma-punku-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The case for a lost older builder</h3><p>Arthur Posnansky, an Austrian-born engineer who spent decades at Tiwanaku, argued that the nearby Kalasasaya temple was aligned to the solstice sunrise positions of a much earlier epoch, when the tilt of the Earth&#x27;s axis was slightly different. His calculation put the site at 11,000 to 17,000 years old, and he thought old lake shorelines supported it. Graham Hancock brought this dating to a wide audience in Fingerprints of the Gods (1995), setting Tiwanaku among the survivors of a forgotten age.</p><p>Television went further, presenting the H-blocks as products of power tools. A more technical challenge comes from the chemist Joseph Davidovits and colleagues, who in 2019 published papers in Materials Letters and Ceramics International arguing that both the sandstone and the andesite contain an artificial binder, a geopolymer, and even organic carbon. If true, the blocks were cast like concrete rather than carved, which would neatly explain the repetition.</p><aside class="wcall"><b>Fair to the challengers</b><p>The precision at Pumapunku is real, and mainstream writers once waved it away too quickly. The absence of any identified tool kit is a genuine hole in the standard story. Davidovits&#x27;s team also states their own limits: they cannot yet cleanly separate natural mineral growth from an artificial binder.</p></aside></section><section class="wsec" id="puma-punku-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Testing the claims</h3><p>Posnansky&#x27;s great age does not survive the evidence. His method depended on knowing exactly which solar events the builders targeted and how they marked them, and small errors in those assumptions change the answer by thousands of years. Radiocarbon from the construction fill, the Tiwanaku pottery, the gateway iconography shared across the city and the Middle Horizon cramp alloy all agree on the first millennium AD.</p><p>The geopolymer idea is testable and has not yet convinced geologists. The andesite pieces match the volcanic rock of the Copacabana quarries, and the sandstone matches its source. Independent labs have not replicated Davidovits&#x27;s results. Precision, meanwhile, is a question of method and time, not of age. A society that could organise thousands of workers, templates and cast bronze could also spend hundreds of hours on a single gateway.</p><p>Transport is less mysterious than it sounds. Most andesite pieces for the gateways and H-blocks weigh a few tonnes or less (the monolithic Gateway of the Sun elsewhere at Tiwanaku is usually put at about 10 t), and reed boats and rafts are still made on Lake Titicaca today. The heavy sandstone slabs travelled only about 10 km, by sledge and rope, a job for organised teams rather than machines. The hard part was never the moving. It was the months of patient finishing.</p></section><section class="wsec" id="puma-punku-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What time destroyed, and what would settle it</h3><p>Much of Pumapunku is simply gone. When the Spanish arrived, the chronicler Bernabé Cobo saw only one gateway and one window-like block still standing. In the centuries since, treasure hunters, church builders, house builders and railway engineers took stone, and most cramp sockets are now empty. A drone survey in 2016 showed the site covers about 17 hectares, of which only about 2 have been excavated, with two more buried platforms unexplored.</p><p>In a newer approach, Vranich has used 3D printed scale models of the scattered pieces to test how they fitted together, reassembling the temple like a puzzle. The next steps are clear. Find the workshops, with their broken hammerstones, abrasives and discarded templates. Run blind petrographic tests on block samples alongside quarry rock. Survey every H-block to the millimetre. Those results would tell us how Tiwanaku&#x27;s masons worked, which is the real mystery left at Pumapunku.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">110 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Tiwanaku founded (modelled date)</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">560 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Pumapunku platform begun (AD 536–600)</span></li><li class="wtl-use" style="--i:2"><span class="wtl-y">800 CE</span><span class="wtl-k">In use</span><span class="wtl-t">Tiwanaku at its height</span></li><li class="wtl-loss" style="--i:3"><span class="wtl-y">1000 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Tiwanaku state dissolves amid drought</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">1945 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Posnansky publishes his great-age thesis</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1998 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Lechtman shows cramps were cast in place</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2013 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Protzen and Nair publish The Stones of Tiahuanaco</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2019 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Davidovits team claims geopolymer stone</span></li></ol><details class="srcs"><summary>Sources for this case (13)</summary><ol><li>Vranich, A. (2006). The construction and reconstruction of ritual space at Tiwanaku, Bolivia (AD 500–1000). Journal of Field Archaeology 31(2): 121–136. <a href="https://doi.org/10.1179/009346906791071990" target="_blank" rel="noopener">doi:10.1179/009346906791071990</a></li><li>Vranich, A. (1999). Interpreting the Meaning of Ritual Spaces: The Temple Complex of Pumapunku, Tiwanaku, Bolivia. PhD thesis, University of Pennsylvania.</li><li>Vranich, A. (2018). Reconstructing ancient architecture at Tiwanaku, Bolivia: the potential and promise of 3D printing. Heritage Science 6: 65. <a href="https://doi.org/10.1186/s40494-018-0231-0" target="_blank" rel="noopener">doi:10.1186/s40494-018-0231-0</a></li><li>Protzen, J.-P. &amp; Nair, S. (1997). Who taught the Inca stonemasons their skills? A comparison of Tiahuanaco and Inca cut-stone masonry. Journal of the Society of Architectural Historians 56(2): 146–167. <a href="https://doi.org/10.2307/991281" target="_blank" rel="noopener">doi:10.2307/991281</a></li><li>Protzen, J.-P. &amp; Nair, S. (2000). On reconstructing Tiwanaku architecture. Journal of the Society of Architectural Historians 59(3): 358–371. <a href="https://doi.org/10.2307/991648" target="_blank" rel="noopener">doi:10.2307/991648</a></li><li>Protzen, J.-P. &amp; Nair, S. (2013). The Stones of Tiahuanaco: A Study of Architecture and Construction. Cotsen Institute of Archaeology Press, UCLA.</li><li>Lechtman, H. (1998). Architectural cramps at Tiwanaku: copper-arsenic-nickel bronze. In T. Rehren et al. (eds), Metallurgica Andina. Deutsches Bergbau-Museum, 77–92.</li><li>Ponce Sanginés, C. (1970). Acerca de la procedencia del material lítico de los monumentos de Tiwanaku. Academia Nacional de Ciencias de Bolivia.</li><li>Janusek, J. W. (2008). Ancient Tiwanaku. Cambridge University Press.</li><li>Posnansky, A. (1945). Tihuanacu: The Cradle of American Man. J. J. Augustin.</li><li>Hancock, G. (1995). Fingerprints of the Gods. Heinemann.</li><li>Davidovits, J., Huaman, L. &amp; Davidovits, R. (2019). Ancient geopolymer in South American monuments: SEM and petrographic evidence. Materials Letters 235: 120–124. <a href="https://doi.org/10.1016/j.matlet.2018.10.033" target="_blank" rel="noopener">doi:10.1016/j.matlet.2018.10.033</a></li><li>Davidovits, J., Huaman, L. &amp; Davidovits, R. (2019). Ancient organo-mineral geopolymer in South American monuments: organic matter in andesite stone. Ceramics International 45: 7385–7389. <a href="https://doi.org/10.1016/j.ceramint.2019.01.024" target="_blank" rel="noopener">doi:10.1016/j.ceramint.2019.01.024</a></li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-puma-punku" data-t="Puma Punku: The Lego Temple of the Andes"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Puma Punku: The Lego Temple of the Andes</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-puma-punku</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-sacsayhuaman-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Sacsayhuamán walls.jpg" data-cap="Sacsayhuamán, above Cusco, Peru" data-big><figcaption></figcaption></figure><div class="sh-k">Impossible Megaliths</div><h2 class="sh-t" id="case-sacsayhuaman-st" tabindex="-1">Sacsayhuamán: Walls That Fit Like a Jigsaw</h2><p class="sh-s">Stones of well over 100 tonnes, cut into many-sided shapes and fitted without mortar so tightly that a knife blade will not slip between them.</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> Sacsayhuamán&#x27;s megalithic zigzag walls were built by an older civilisation before the Inca.</p></div><p class="v4-q">Did the Incas build Sacsayhuamán&#x27;s giant walls, or inherit them?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Above Cusco, zigzag walls are built of stones up to 200 tonnes fitted like a jigsaw.</li><li>Some say an older civilisation built the giants and the Inca only added the small stones on top.</li><li>Spanish eyewitnesses describe an Inca work with 20,000 workers on rotation; quarries hold abandoned blocks and hammerstones.</li><li>The small stones went missing because the Spanish carried them off to build the city.</li><li>No pre-Inca megalithic phase has been dated; direct dates on the walls would close the question.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Engineering</span><span class="thr">Texts and scripts</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="3701" >3,701</b><span class="ctr-u"> m</span></div><div class="ctr-l">altitude of the site</div><div class="ctr-c">Bauer 2004</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="400" >400</b><span class="ctr-u"> m</span></div><div class="ctr-l">length of the longest zigzag wall</div><div class="ctr-c">published site descriptions</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="20000" >20,000</b><span class="ctr-u"> workers</span></div><div class="ctr-l">on rotation, according to Cieza de León</div><div class="ctr-c">Cieza de León 1553</div></div><div class="ctr"><div class="ctr-v">up to c. <b class="ctr-n" data-v="200" >200</b><span class="ctr-u"> t</span></div><div class="ctr-l">upper estimate for the largest stone</div><div class="ctr-c">published estimates, 120–200 t</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Sacsayhuamán&#x27;s megalithic zigzag walls were built by an older civilisation before the Inca.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Written testimony from the 1530s–1550s, the siege accounts, quarries with abandoned blocks, hammerstones and experiments all fit an Inca construction. The two-style pattern has a simpler explanation here: the Spanish carried off the smaller stones that sat above the giants. The Killke presence shows the hill was used earlier, but no pre-Inca megalithic phase has been dated. The thinness of direct radiocarbon dating on the walls themselves keeps this from being fully closed.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Guidebooks name Pachacuti as builder with confidence, but that attribution comes from Inca oral history recorded after the conquest, and direct dates on the walls are few. On the main point, Inca construction, the textbooks are well supported. On who began it, when, and how the largest stones were lifted, they sound surer than the evidence.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Three terraced zigzag walls, the longest about 400 m and the lowest about 6 m high, guard the hill above Cusco at 3,701 m.<small>published site descriptions; Bauer 2004</small></li><li>The largest stones are estimated at roughly 120 to 200 t; the range reflects assumptions about how far each block runs back into the wall.<small>various estimates, see Protzen 1986</small></li><li>Spanish eyewitnesses and early chroniclers describe the complex as an Inca work; Cieza de León (1553) reports 20,000 workers on rotation, 4,000 quarrying and 6,000 hauling with ropes of leather and fibre.<small>Cieza de León 1553</small></li><li>Experiments with hammerstones reproduce both the pitted surface texture and the tight fit of Inca masonry.<small>Protzen 1985, 1986</small></li><li>The hilltop was occupied before the Incas, from about AD 900, by people of the Killke culture.<small>Bauer 2004</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Exactly which Inca ruler began the walls and how many decades the work took.</li><li>How the biggest stones were lifted repeatedly for trial fitting.</li><li>Whether the Killke people left monumental walls that the Incas later rebuilt or enlarged.</li><li>Why some Inca-era sites show very large polygonal blocks at the base and smaller masonry above.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>After the 1536 siege the Spanish stripped the smaller dressed stones for colonial Cusco, leaving mainly the blocks too big to move.</li><li>The towers and halls on the summit survive only as foundations.</li><li>Detailed, published radiocarbon dates from the fill directly behind the great walls are scarce.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Sacsayhuamán was built by the Inca state in the fifteenth and early sixteenth centuries, traditionally begun under Pachacuti and continued by his successors, on a hill already used by the Killke culture. Chroniclers describe the labour system and the construction; Spanish soldiers fought over it in 1536. Architect Jean-Pierre Protzen showed that Inca masons shaped hard stone with hammerstones and fitted each block by repeated trial, pounding the high spots until the joint closed. The big limestone blocks came from outcrops close to the site, the finer andesite from quarries such as Rumiqolqa.</p><ul><li>Chroniclers from the 1550s describe the work as recent, with an organised rotating labour force.</li><li>Unfinished blocks, quarries and hammerstones match the finished walls in material and tool marks.</li><li>The smaller masonry that once topped the walls was removed by the Spanish, which makes the megalithic part look like a separate phase.</li><li>Masonry size varies with a building&#x27;s status and role across Inca sites.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Graham Hancock and researchers such as Jesús Gamarra and Brien Foerster argue that the greatest polygonal walls at Sacsayhuamán and other Andean sites belong to an older megalithic culture, and that the Incas built on top of foundations they inherited. They point to the contrast between giant, perfectly fitted blocks and smaller, rougher masonry above them, to local legends that credit the works to earlier beings, and to curved, glossy-looking surfaces that some read as softened or heated stone.</p><ul><li>Many sites show giant polygonal masonry at the base and smaller, cruder work above.</li><li>Andean traditions credit the great works to Viracocha and earlier ages, not only to the Incas.</li><li>Some surfaces look smooth and glazed, which is read as heat or chemical softening.</li><li>Chroniclers wrote decades after the work and relied on Inca informants.</li></ul><div class="face-s"><b>Its strongest point</b><p>Across Cusco and the Sacred Valley the largest, best-fitted polygonal blocks sit at the bottom of walls, with smaller and rougher masonry above, a pattern that looks more like later builders adding to older foundations than one project.</p></div><p class="face-cr"><b>Credit</b> Graham Hancock; Jesús Gamarra; Brien Foerster; stone-softening proponents</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Excavate and publish sealed foundation trenches of the megalithic walls, with pottery (Inca or Killke) and radiocarbon dates from the construction fill.</li><li>Match individual giant blocks to their quarry faces and compare tool marks with dated Inca blocks.</li><li>Test the &#x27;glazed&#x27; surfaces with microscopy and chemistry to separate natural polish, weathering and any heating.</li><li>Survey the summit foundations and the rubble below the walls to reconstruct the lost upper masonry.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,145 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Sacsayhuamán: Walls That Fit Like a Jigsaw"><button type="button" class="wtoc-i" data-go="sacsayhuaman-s1">The fortress of the jigsaw stones</button><button type="button" class="wtoc-i" data-go="sacsayhuaman-s2">What is solid</button><button type="button" class="wtoc-i" data-go="sacsayhuaman-s3">How to fit a giant</button><button type="button" class="wtoc-i" data-go="sacsayhuaman-s4">The case for older builders</button><button type="button" class="wtoc-i" data-go="sacsayhuaman-s5">What the Spanish took</button><button type="button" class="wtoc-i" data-go="sacsayhuaman-s6">What would settle it</button></nav></div><section class="wsec" id="sacsayhuaman-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The fortress of the jigsaw stones</h3><p>In May 1536 the Inca army of Manco Inca held the hill above Cusco and Spanish horsemen tried to storm it. Juan Pizarro, one of the conquistador brothers, was struck in the head by a stone as he attacked the walls and died of the wound. The walls he died at are still there: three great terraces zigzagging across the hill, built from limestone blocks so big and so tightly fitted that visitors have argued about them ever since.</p><p>Sacsayhuamán sits at 3,701 m, and its longest wall runs for about 400 m. The largest stones are estimated at somewhere between 120 and 200 tonnes; nobody can weigh them, and the estimate depends on how far each block extends back into the wall. Each stone has many sides, and each side meets its neighbour along a line that bends and turns without a gap. There is no mortar.</p><blockquote class="wpull"><p>The mystery is not that the joints are tight. It is how a builder fits a 100-tonne jigsaw piece without seeing its back.</p></blockquote></section><section class="wsec" id="sacsayhuaman-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What is solid</h3><p>People lived on this hill long before the Incas: pottery of the Killke culture shows occupation from about AD 900. The standing complex, though, is described by the first Spanish writers as Inca work. Pedro Cieza de León, writing in 1553, reported that 20,000 men were called up from the provinces on a rotating basis, with 4,000 breaking and quarrying stone and 6,000 hauling it with ropes of leather and plant fibre, while others dug foundations and cut timber.</p><p>Inca tradition credits the project to Pachacuti, the ruler who expanded the empire in the mid fifteenth century, with his successors continuing it. The complex was still being worked on in some form when the Spanish arrived. Its massive walls were only part of it: on the summit stood towers and halls, among them a round tower called Muyuqmarka, now reduced to foundations.</p><p>Garcilaso also retells a legend about the work: one enormous block, dragged towards the site by thousands of labourers, is said to have become too tired to go on, and was left where it stopped. Stories of a &#x27;tired stone&#x27; echo a physical fact seen at many Inca sites, where blocks abandoned on the road show that the work was done by haulage, step by step, and that sometimes it failed. Protzen counted dozens of such stones along the route from the quarries of Ollantaytambo.</p></section><section class="wsec" id="sacsayhuaman-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>How to fit a giant</h3><p>In the 1980s the Berkeley architect Jean-Pierre Protzen went to Inca quarries with a simple idea: try it. He picked up river cobbles of hard stone, the same kind found at the quarries, and pounded. A hammerstone of about 4 kg roughed out a face quickly; smaller ones of 200 to 600 g finished edges and corners. The pounding left exactly the pitted texture seen on Inca blocks.</p><p>For the fit he proposed, and tested on smaller blocks, a method of trial and error. The mason pounds a seat into the stones already in place, lowers the new stone onto it, and looks at where it touches, because the high spots crush to a fine dust. The stone is lifted, the marked spots pounded down, and the stone lowered again, until the joint closes along the face.</p><figure class="wx wx--steps" id="sacsayhuaman-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">Fitting a stone the Protzen way</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Fitting a stone the Protzen way"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" class="wx-svg" role="img" aria-labelledby="sacsayhuaman-f1-t"><title id="sacsayhuaman-f1-t">Fitting a polygonal stone by pounding and trial, in five steps</title><text x="24" y="24" class="wx-t-cap">Wall face, schematic · after Protzen's experiments</text><line x1="20" y1="360" x2="700" y2="360" class="wx-line"/><polygon points="80,360 80,262 150,250 230,262 280,240 280,360" class="wx-stone2 wx-edge"/><polygon points="280,360 280,240 340,230 420,236 470,250 476,360" class="wx-stone wx-edge"/><text x="180" y="316" text-anchor="middle" class="wx-t-m">in place</text><text x="378" y="310" text-anchor="middle" class="wx-t-m">in place</text><g class="wx-st" data-s="1"><polygon points="540,360 532,300 566,276 646,280 676,304 680,360" class="wx-stone3 wx-o60 wx-edge"/><ellipse cx="620" cy="250" rx="14" ry="10" class="wx-rock wx-edge wx-bob"/><circle cx="532" cy="206" r="9" class="wx-num"/><text x="532" y="210" text-anchor="middle" class="wx-numt">1</text><text x="548" y="204" class="wx-t-b">Rough out</text><text x="548" y="219" class="wx-t-s">hammerstone c. 4 kg</text><text x="548" y="233" class="wx-t-s">crushes the surface</text></g><g class="wx-st" data-s="2"><polyline points="150,250 230,262 280,240 340,230 420,236" class="wx-hl"/><circle cx="40" cy="386" r="9" class="wx-num"/><text x="40" y="390" text-anchor="middle" class="wx-numt">2</text><text x="56" y="384" class="wx-t-b">Shape the bed</text><text x="56" y="399" class="wx-t-s">pound a seat into the stones below</text></g><g class="wx-st wx-hide" data-only="3"><g transform="translate(0,-10)"><polygon points="150,250 230,262 280,240 340,230 420,236 430,170 380,130 220,126 160,160" class="wx-stone3 wx-o60 wx-edge"/></g><circle cx="230" cy="260" r="4" class="wx-fire wx-pulse"/><circle cx="340" cy="229" r="4" class="wx-fire wx-pulse"/><circle cx="418" cy="234" r="4" class="wx-fire wx-pulse"/></g><g class="wx-st" data-s="3"><circle cx="32" cy="56" r="9" class="wx-num"/><text x="32" y="60" text-anchor="middle" class="wx-numt">3</text><text x="48" y="60" class="wx-t-b">Trial fit</text><text x="48" y="75" class="wx-t-s">high spots crush</text><text x="48" y="89" class="wx-t-s">and show as dust</text></g><g class="wx-st wx-hide" data-only="4"><g transform="translate(0,-46)"><polygon points="150,250 230,262 280,240 340,230 420,236 430,170 380,130 220,126 160,160" class="wx-stone3 wx-o60 wx-edge"/><circle cx="230" cy="260" r="3" class="wx-fire"/><circle cx="340" cy="229" r="3" class="wx-fire"/></g><ellipse cx="300" cy="206" rx="7" ry="5" class="wx-rock wx-edge wx-bob"/><line x1="160" y1="60" x2="170" y2="84" class="wx-thin"/><line x1="400" y1="60" x2="390" y2="86" class="wx-thin"/><line x1="150" y1="56" x2="410" y2="56" class="wx-wood wx-bold"/></g><g class="wx-st" data-s="4"><circle cx="32" cy="146" r="9" class="wx-num"/><text x="32" y="150" text-anchor="middle" class="wx-numt">4</text><text x="48" y="150" class="wx-t-b">Lift, pound,</text><text x="48" y="165" class="wx-t-b">repeat</text><text x="48" y="180" class="wx-t-s">0.2–0.6 kg stones</text><text x="48" y="194" class="wx-t-s">for edges</text></g><g class="wx-st" data-s="5"><polygon points="150,250 230,262 280,240 340,230 420,236 430,170 380,130 220,126 160,160" class="wx-stone3 wx-edge"/><rect x="500" y="44" width="200" height="140" rx="10" class="wx-card wx-edge-soft"/><text x="514" y="64" class="wx-t-b">Joint, seen from the side</text><polygon points="514,176 526,112 536,112 600,124 600,176" class="wx-stone2 wx-edge"/><polygon points="526,112 531,80 600,80 600,112" class="wx-stone3 wx-edge"/><polygon points="536,112 600,112 600,124" class="wx-paper wx-edge-soft"/><line x1="514" y1="176" x2="531" y2="80" class="wx-hl"/><text x="608" y="110" class="wx-t-s">joint opens</text><text x="608" y="123" class="wx-t-s">behind</text><text x="608" y="136" class="wx-t-s">the face</text><text x="608" y="168" class="wx-t-s">face leans in</text><circle cx="490" cy="386" r="9" class="wx-num"/><text x="490" y="390" text-anchor="middle" class="wx-numt">5</text><text x="506" y="384" class="wx-t-b">Tight at the face</text><text x="506" y="399" class="wx-t-s">no mortar; the wall leans inward</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Rough out: a new block is pounded into shape with a hammerstone of about 4 kg.</p><ol class="wx-steplist"><li>Rough out: a new block is pounded into shape with a hammerstone of about 4 kg.</li><li>Shape the bed: masons pound a seat into the stones already in the wall.</li><li>Trial fit: the stone is lowered onto its seat; high spots crush and show as dust.</li><li>Lift, pound, repeat: the stone is raised, the marked spots pounded with smaller stones of 0.2–0.6 kg, and it is tried again.</li><li>Final fit: tight at the face, open behind it, with the wall leaning slightly inward.</li></ol><figcaption>How a many-sided stone can be fitted by pounding and trial, as reconstructed from Jean-Pierre Protzen&#x27;s experiments with hammerstones. <span class="wx-src">Based on: Protzen 1985 and 1986 (hammerstone weights, pounding, trial fitting, joints tight only near the face). Schematic; lifting method for the largest stones is not documented.</span></figcaption><p class="vh">A schematic wall face with two stones in place. Step 1: a rough block at the right is pounded with a hammerstone of about 4 kg. Step 2: the top edges of the stones in place are shaped into a seat for the next stone, highlighted. Step 3: the new stone is lowered onto the seat and touches only at a few high spots, marked as glowing dots. Step 4: the stone is lifted on a beam, and a small hammerstone of 0.2 to 0.6 kg pounds the marked spots; the process repeats. Step 5: the stone sits in its final place with a tight joint; an inset side view shows that the joint is tight only near the face and opens behind it, and that the face leans inward.</p></figure><p>Protzen also noticed something that matters for the mystery: on many Inca walls the perfect joint runs only a short way back from the face. Behind it, the faces of neighbouring stones pull apart. The builders made the fit where it shows and where it carries load. That makes the job far more practical, though lifting a stone of 100 tonnes or more several times for trial fits remains the hardest part to explain, and it has not been demonstrated at that scale.</p><aside class="wcall"><b>Built to shake</b><p>Inca walls lean slightly inward, doors and niches narrow towards the top, and the many-sided blocks lock into each other. Without mortar the stones can shift a little in an earthquake and settle back. When the 1950 earthquake damaged much of colonial Cusco, Inca walls such as those under the church of Santo Domingo came through largely intact.</p></aside></section><section class="wsec" id="sacsayhuaman-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The case for older builders</h3><p>Graham Hancock, in Fingerprints of the Gods (1995), wondered whether the Incas were the inheritors rather than the builders of the Andes&#x27; greatest walls. The Cusco researcher Jesús Gamarra and the writer Brien Foerster developed the idea: at site after site, they note, the largest and most perfectly fitted polygonal blocks sit at the bottom, while smaller, rougher masonry, clearly Inca, sits on top. To them that looks like two eras, a megalithic one and a later Inca one that repaired and built over it.</p><p>They add that Andean traditions credit the great works to Viracocha and to beings of earlier ages, and that the chroniclers wrote decades after the construction with Inca informants who had reasons to glorify their kings. Some go further, pointing to curved, glossy surfaces as signs of stone softened by heat or a lost chemical. The softening story is old: the explorer Percy Fawcett passed on a traveller&#x27;s tale of a plant juice that turned rock to paste, in the posthumous Exploration Fawcett (1953).</p><p>The strongest part of this case is the pattern itself. It is real, it is striking, and a visitor who sees giant stones below and rubble-like courses above is right to ask why.</p></section><section class="wsec" id="sacsayhuaman-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>What the Spanish took</h3><p>At Sacsayhuamán the answer is at least partly recorded. After the siege the complex became Cusco&#x27;s quarry. The mestizo historian Garcilaso de la Vega, who grew up in Cusco in the 1540s and 1550s, described it plainly.</p><blockquote class="quote"><p>They pulled down all the smooth masonry in the walls. There is indeed not a house in the city that has not been made of this stone.</p><cite>Garcilaso de la Vega, Royal Commentaries of the Incas (1609), trans. H. V. Livermore (University of Texas Press, 1966)</cite></blockquote><p>What stayed behind were the stones too big to move. The walls we see are a survivor&#x27;s selection, biased towards giants, and the smaller finer masonry that once completed them is scattered through colonial Cusco. Elsewhere, differences in masonry often track building function and status, and later repairs after earthquakes and conquest added cruder work on top of fine Inca foundations.</p><figure class="wx wx--static" id="sacsayhuaman-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">Three walls, and what was taken away</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Three walls, and what was taken away"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" class="wx-svg" role="img" aria-labelledby="sacsayhuaman-f2-t"><title id="sacsayhuaman-f2-t">Sacsayhuamán's three zigzag walls in plan and section, and what was taken away</title><text x="24" y="24" class="wx-t-cap">Schematic plan · salients simplified</text><rect x="60" y="176" width="600" height="30" class="wx-green wx-o20"/><text x="360" y="198" text-anchor="middle" class="wx-t-m">esplanade</text><polyline points="70.0,170 99.0,150 128.0,170 157.0,150 186.0,170 215.0,150 244.0,170 273.0,150 302.0,170 331.0,150 360.0,170 389.0,150 418.0,170 447.0,150 476.0,170 505.0,150 534.0,170 563.0,150 592.0,170 621.0,150 650.0,170" class="wx-bold wx-draw" pathLength="1" style="--d:1"/><polyline points="70.0,146 99.0,126 128.0,146 157.0,126 186.0,146 215.0,126 244.0,146 273.0,126 302.0,146 331.0,126 360.0,146 389.0,126 418.0,146 447.0,126 476.0,146 505.0,126 534.0,146 563.0,126 592.0,146 621.0,126 650.0,146" class="wx-line wx-draw" pathLength="1" style="--d:3"/><polyline points="70.0,124 99.0,104 128.0,124 157.0,104 186.0,124 215.0,104 244.0,124 273.0,104 302.0,124 331.0,104 360.0,124 389.0,104 418.0,124 447.0,104 476.0,124 505.0,104 534.0,124 563.0,104 592.0,124 621.0,104 650.0,124" class="wx-line wx-draw" pathLength="1" style="--d:5"/><g class="wx-pop" style="--d:7"><circle cx="360" cy="62" r="14" class="wx-dash"/><rect x="250" y="50" width="44" height="24" class="wx-dash"/><rect x="426" y="50" width="44" height="24" class="wx-dash"/><text x="496" y="60" class="wx-t-s">summit: towers and halls,</text><text x="496" y="74" class="wx-t-s">foundations only today</text></g><text x="60" y="100" class="wx-t-b wx-halo">three terraced walls</text><rect x="500" y="218" width="150" height="4" class="wx-inkfill"/><text x="500" y="214" class="wx-t-s">100 m</text><text x="60" y="222" class="wx-t-s">longest wall c. 400 m, built in angled salients</text><line x1="20" y1="240" x2="700" y2="240" class="wx-guide"/><text x="24" y="262" class="wx-t-cap">Schematic section · 1 m = 10 px · upper heights approximate</text><g transform="translate(0,60)"><polygon points="20,420 200,420 206,360 280,360 285,318 350,318 354,282 520,262 700,262 700,450 20,450" class="wx-soil wx-o60"/><polyline points="20,420 200,420 206,360 280,360 285,318 350,318 354,282 520,262 700,262" class="wx-line"/><line x1="200" y1="420" x2="206" y2="360" class="wx-hl"/><g class="wx-pop" style="--d:4"><rect x="540" y="200" width="70" height="62" class="wx-dash"/><text x="620" y="208" class="wx-t-s">towers: stone</text><text x="620" y="222" class="wx-t-s">carried off after</text><text x="620" y="236" class="wx-t-s">1536 (outline</text><text x="620" y="250" class="wx-t-s">conjectural)</text></g><g class="wx-pop" style="--d:6"><line x1="150" y1="330" x2="198" y2="386" class="wx-thin"/><text x="40" y="306" class="wx-t-b">lowest wall, c. 6 m</text><text x="40" y="321" class="wx-t-s">the giant polygonal stones</text><text x="360" y="352" class="wx-t-s">upper walls: smaller stones,</text><text x="360" y="366" class="wx-t-s">easier to haul away</text><line x1="356" y1="344" x2="320" y2="322" class="wx-thin"/></g><circle cx="178" cy="405.4" r="2.6" class="wx-inkfill"/><line x1="178" y1="408" x2="178" y2="414" class="wx-line"/><line x1="178" y1="414" x2="175" y2="420" class="wx-line"/><line x1="178" y1="414" x2="181" y2="420" class="wx-line"/><text x="150" y="442" class="wx-t-s">person 1.7 m</text><rect x="600" y="436" width="50" height="4" class="wx-inkfill"/><text x="656" y="442" class="wx-t-s">5 m</text></g></svg></div></div><figcaption>A schematic plan and section of the zigzag terraces. The giant stones of the lowest wall survived; much smaller masonry above, and the summit towers, were carried off after 1536. <span class="wx-src">Based on: Wall length and height from Hemming &amp; Ranney 1982 and Bauer 2004; removal of masonry from Garcilaso de la Vega 1609. Plan and section are schematic: the number of salients, terrace widths, upper wall heights and tower forms are approximate.</span></figcaption><p class="vh">Top: a schematic plan with three parallel zigzag walls above an esplanade, the longest about 400 m, with a 100 m scale bar; on the summit, dashed outlines of towers and halls marked as foundations only today. Bottom: a schematic section at 10 pixels per metre. From the esplanade on the left the ground steps up three terrace walls, the lowest about 6 m high and highlighted as the wall of giant polygonal stones; a 1.7 m person stands at its foot. Upper walls are labelled smaller stones, easier to haul away. On the summit a dashed tower outline is labelled as stone carried off after 1536, outline conjectural. A 5 m scale bar.</p></figure><p>As for softened stone, the blocks are ordinary limestone and andesite matching nearby outcrops, and unfinished blocks show every stage of pounding. Glossy patches are what polishing, handling and centuries of weathering produce. A paste-cast or melted stone should look different in a thin section, and no such evidence has been published.</p></section><section class="wsec" id="sacsayhuaman-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What would settle it</h3><p>The older-builder idea makes a clean prediction: the fill and foundation trenches behind the megalithic walls should contain pre-Inca material only, and date centuries or millennia earlier than the Inca courses above. Carefully published excavations of those trenches, with pottery and radiocarbon dates from sealed construction layers, would answer the question directly. So would matching individual giant blocks to their quarry faces.</p><p>Until then the evidence points to the Incas, with a Killke prelude that deserves more study. That does not shrink the achievement. A state without iron tools, wheels for hauling or writing organised tens of thousands of workers, moved blocks heavier than a railway locomotive, and fitted them like a puzzle that still survives earthquakes.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-use" style="--i:0"><span class="wtl-y">900 CE</span><span class="wtl-k">In use</span><span class="wtl-t">Killke occupation of the hilltop begins</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">1440 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Inca construction traditionally begun under Pachacuti</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">1536 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Siege of Cusco; Juan Pizarro killed storming the walls</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">1553 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Cieza de León describes the building effort</span></li><li class="wtl-loss" style="--i:4"><span class="wtl-y">1609 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Garcilaso records the stripping of the walls</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">1950 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Cusco earthquake: Inca walls largely survive</span></li><li class="wtl-event" style="--i:6"><span class="wtl-y">1983 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Cusco and Sacsayhuamán listed by UNESCO</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">1986 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Protzen publishes his stonemasonry experiments</span></li></ol><details class="srcs"><summary>Sources for this case (11)</summary><ol><li>Protzen, J.-P. (1985). Inca Quarrying and Stonecutting. Journal of the Society of Architectural Historians 44(2): 161–182.</li><li>Protzen, J.-P. (1986). Inca Stonemasonry. Scientific American 254(2): 94–105.</li><li>Protzen, J.-P. (1993). Inca Architecture and Construction at Ollantaytambo. Oxford University Press.</li><li>Cieza de León, P. (1553). Crónica del Perú. Seville; second part (El señorío de los Incas) on the building of Sacsayhuamán.</li><li>Garcilaso de la Vega (1609). Comentarios Reales de los Incas. Trans. H. V. Livermore as Royal Commentaries of the Incas, University of Texas Press, 1966.</li><li>Pizarro, P. (1571). Relación del descubrimiento y conquista de los reinos del Perú.</li><li>Bauer, B. S. (2004). Ancient Cuzco: Heartland of the Inca. University of Texas Press.</li><li>Hemming, J. &amp; Ranney, E. (1982). Monuments of the Incas. Little, Brown.</li><li>Hemming, J. (1970). The Conquest of the Incas. Macmillan.</li><li>Fawcett, P. H. (1953). Exploration Fawcett. Hutchinson.</li><li>Hancock, G. (1995). Fingerprints of the Gods. Heinemann.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-sacsayhuaman" data-t="Sacsayhuamán: Walls That Fit Like a Jigsaw"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Sacsayhuamán: Walls That Fit Like a Jigsaw</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-sacsayhuaman</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-stone-vases-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Saqqara pyramid ver 2.jpg" data-cap="Saqqara, Abydos and Hierakonpolis, Egypt" data-big><figcaption></figcaption></figure><div class="sh-k">Impossible Megaliths</div><h2 class="sh-t" id="case-stone-vases-st" tabindex="-1">Egypt&#x27;s Stone Vases: Too Perfect for Human Hands?</h2><p class="sh-s">Tens of thousands of hard-stone jars, some thin as eggshell, and a 3D scanner that set the internet alight. How were they made?</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> Some Predynastic Egyptian stone vessels show machine-tool precision that requires a lost advanced technology.</p></div><p class="v4-q">Were Egypt&#x27;s earliest stone vases made by hand, or by a lost machine?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Egyptians made tens of thousands of hard-stone vessels between about 4000 and 2700 BCE, over 40,000 under Djoser&#x27;s Step Pyramid alone.</li><li>Since 2023, 3D scans of some vases showed remarkable roundness, and some said only lathes could do it.</li><li>Most of those vases came from private collections with no known find-spot; fakes are common.</li><li>A 2025 peer-reviewed study of 19 museum vases found their surfaces match handmade work.</li><li>Egyptian art shows the tool: a weighted drill with a crescent stone bit. One vessel could take about 800 hours.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Engineering</span><span class="thr">Archaeology</span><span class="thr">Institutions</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="40000" >40,000</b><span class="ctr-u"> vessels</span></div><div class="ctr-l">found beneath the Step Pyramid</div><div class="ctr-c">Lacau &amp; Lauer 1959</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="800" >800</b><span class="ctr-u"> hours</span></div><div class="ctr-l">estimated to make one museum vessel</div><div class="ctr-c">Stocks 2003</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="19" >19</b><span class="ctr-u"> vessels</span></div><div class="ctr-l">Petrie Museum pieces in the 2025 scan study</div><div class="ctr-c">Fomitchev-Zamilov 2025</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="15" >15</b><span class="ctr-u"> µm</span></div><div class="ctr-l">smallest shape error claimed for a private vase</div><div class="ctr-c">Fomitchev-Zamilov, early 2025 claims</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Some Predynastic Egyptian stone vessels show machine-tool precision that requires a lost advanced technology.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The striking precision figures came mostly from vessels without known findspots, bought on the market, where modern copies and machine-made fakes are common. When the same measurement approach was applied to vessels with documented museum history, the 2025 peer-reviewed study found their outer surfaces matched modern handmade work, while machine-made pieces stood apart. Tomb scenes, tools, cores and experiments document a workable hand method. Until precise vessels come from recorded excavations, the lost-machine claim has nothing secure to stand on.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Museum labels state confidently that vessels were drilled and ground by hand, and the overall picture is well supported. But labels rarely say how few full-scale, timed replications of the hardest, thinnest pieces exist, or that precise measurement of the vessels only began recently. The mainstream is right on the method, and a little casual about the numbers.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Stone vessels were made in Egypt from the Predynastic period on, in basalt, granite, diorite, gneiss, breccia, serpentine and travertine among other stones.<small>Aston 1994</small></li><li>More than 40,000 stone vessels were found in galleries beneath Djoser&#x27;s Step Pyramid (c. 2670–2650 BCE); many are older and carry names of First and Second Dynasty kings such as Den, Semerkhet and Nynetjer.<small>Lacau &amp; Lauer 1959, 1965</small></li><li>Tomb scenes and the hieroglyph for &#x27;craft&#x27; show a weighted drill used to hollow stone vessels.<small>Davies 1943; Stocks 2003</small></li><li>Experiments with copper tubes, sand abrasive and stone borers reproduce the drilling marks and cores; Denys Stocks estimated about 800 hours for one museum vessel.<small>Stocks 2003</small></li><li>A 2025 peer-reviewed metrology study found that the outer surfaces of 19 Predynastic vessels in the Petrie Museum match modern handmade pieces, not machine-made ones.<small>Fomitchev-Zamilov 2025</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether some privately owned vessels scanned since 2023 are ancient at all, and if so how their best surfaces were achieved.</li><li>Whether a simple turntable or slow wheel was used to guide the shaping of the outside.</li><li>How long the finest thin-walled hard-stone pieces took, and how many specialists made them.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Many vessels were dug up in the nineteenth and early twentieth centuries without recording their exact findspots.</li><li>Workshops for the finest Early Dynastic hard-stone vessels are poorly known, and the tools themselves rarely survive.</li><li>Most of the vessels at the centre of the precision debate have no documented provenance at all.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Egyptologists see the vessels as the work of full-time specialists over more than a thousand years. The outside was shaped by pounding and grinding; the inside was drilled with a copper tube fed with sand, the core snapped out, and the belly widened with crescent or figure-of-eight stone borers on a forked, weighted shaft, the tool shown in tomb scenes and in the hieroglyph for craft. It was slow work: Denys Stocks estimated some 800 hours for a single vessel. Precision came from skill, patience and rotation, not from machine tools.</p><ul><li>Drill cores, borers and unfinished vessels show the stages of work.</li><li>The weighted crank drill appears in art from the Old Kingdom to the New Kingdom tomb of Rekhmire.</li><li>The largest excavated group, from the Step Pyramid, has secure royal contexts.</li><li>A handmade vessel can be highly symmetrical when it is rotated against a fixed tool for hundreds of hours.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>From 2023, engineers and enthusiasts began 3D-scanning Predynastic-style vessels, mostly from private collections, and reported symmetry and roundness to within thousandths of an inch. Adam Young of the Artifact Foundation promoted systematic scanning; Max Fomitchev-Zamilov reported shape errors as small as 15 microns on some vases; collector Matt Beall argued that copper and stone tools could not explain them and proposed lathes, perhaps with diamond tooling. If authentic and ancient, such pieces would imply a manufacturing capability not recognised for the period.</p><ul><li>Some scanned vases show outer and inner surfaces that are round and centred to within a few hundredths of a millimetre.</li><li>Hard stones such as granite and diorite are very difficult to shape with copper and sand.</li><li>The finest pieces seem to exceed what modern hand-carvers achieve.</li><li>Mainstream Egyptology had not measured the vessels with modern metrology before.</li></ul><div class="face-s"><b>Its strongest point</b><p>Precise 3D measurement of these vessels is genuinely new, and it has shown that some hard-stone pieces are far more symmetrical than most people assumed; the challengers forced a question the field had not asked with numbers.</p></div><p class="face-cr"><b>Credit</b> Adam Young and the Artifact Foundation; Max Fomitchev-Zamilov (early claims); Matt Beall; Christopher Dunn</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Scan a large sample of vessels from recorded excavations, such as the Step Pyramid galleries and early royal tombs at Abydos, blind, in independent labs, with the raw data released.</li><li>Examine tool marks inside vessels under the microscope to tell spiral lathe marks from the concentric grooves of a hand borer.</li><li>Make hard-stone replicas with copper tubes, sand and stone borers, time them, and scan them with the same equipment.</li><li>Trace the ownership history of the most precise private vessels, or set them aside as undated.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,149 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Egypt&#x27;s Stone Vases: Too Perfect for Human Hands?"><button type="button" class="wtoc-i" data-go="stone-vases-s1">A jar that went viral</button><button type="button" class="wtoc-i" data-go="stone-vases-s2">What is solid</button><button type="button" class="wtoc-i" data-go="stone-vases-s3">How the hand method works</button><button type="button" class="wtoc-i" data-go="stone-vases-s4">The challengers and their scanners</button><button type="button" class="wtoc-i" data-go="stone-vases-s5">The provenance problem, and a surprising result</button><button type="button" class="wtoc-i" data-go="stone-vases-s6">What an independent test needs</button></nav></div><section class="wsec" id="stone-vases-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A jar that went viral</h3><p>Hold a Predynastic Egyptian vase and the first surprise is the weight: dense grey-green stone, turned into something with a narrow neck, a swelling belly and walls in places only a few millimetres thick. The second surprise is the date. Many were made before writing, before the pyramids, more than 5,000 years ago. The third, for a growing online audience, arrived in 2023, when a privately owned rose granite vase was scanned with a structured-light scanner and presented as symmetrical to about a thousandth of an inch.</p><p>Videos followed, then a movement. Engineers and collectors began scanning more vessels, and claims grew bolder: surfaces round and centred to a few hundredths of a millimetre, better than modern industrial pottery, too good for copper and sand. For some, these jars became the clearest physical trace of a lost advanced civilisation, hidden in plain sight in museum cases.</p><blockquote class="wpull"><p>The vases are real, the skill is real, and the question is fair. Everything turns on which vases were measured.</p></blockquote></section><section class="wsec" id="stone-vases-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What is solid</h3><p>Stone vessels are one of the great crafts of early Egypt. They appear in Predynastic graves of the fourth millennium BCE and reach a peak in the First and Second Dynasties, in hard stones such as basalt, granite, diorite and gneiss as well as softer travertine and serpentine. When Djoser built his Step Pyramid at Saqqara around 2670–2650 BCE, he sealed more than 40,000 of them in galleries under its east side. Many were already antiques, inscribed with names of earlier kings such as Den, Semerkhet and Nynetjer.</p><p>The tool that made them is also known. The hieroglyph used to write &#x27;craft&#x27; shows a drill with a forked top and two weights, and tomb paintings, including the New Kingdom tomb of the vizier Rekhmire at Thebes, show craftsmen hollowing vessels with it. Excavations have produced drill cores, crescent and figure-of-eight stone borers, and unfinished vessels at every stage.</p><p>Why so many? Stone vessels held oils, perfumes, ointments and food offerings, and in the early dynasties they were status objects in their own right, buried by the hundred in royal and elite tombs at Abydos and Saqqara. A hard-stone jar was a statement of wealth because everyone knew how long it took. Djoser&#x27;s hoard reads like a royal attempt to gather and protect the treasures of earlier kings, perhaps rescued from their plundered or restored tombs, within his own monument.</p><figure class="wx wx--steps" id="stone-vases-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">Hollowing a stone vase by hand</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Hollowing a stone vase by hand"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" class="wx-svg" role="img" aria-labelledby="stone-vases-f1-t"><title id="stone-vases-f1-t">Hollowing a hard stone vase with a tube drill, sand and a weighted borer, in five steps</title><text x="24" y="24" class="wx-t-cap">Section through a vase blank · schematic</text><path d="M330,150 L390,150 L390,176 C430,190 470,220 470,262 C470,310 440,350 415,370 L305,370 C280,350 250,310 250,262 C250,220 290,190 330,176 Z" class="wx-stone3 wx-edge"/><line x1="220" y1="370" x2="500" y2="370" class="wx-line"/><g class="wx-st" data-s="1"><path d="M330,150 L390,150 L390,176 C430,190 470,220 470,262 C470,310 440,350 415,370 L305,370 C280,350 250,310 250,262 C250,220 290,190 330,176 Z" class="wx-hl"/><circle cx="32" cy="58" r="9" class="wx-num"/><text x="32" y="62" text-anchor="middle" class="wx-numt">1</text><text x="48" y="62" class="wx-t-b">Shape the outside</text><text x="48" y="77" class="wx-t-s">pound with hammerstones,</text><text x="48" y="91" class="wx-t-s">grind with sandstone</text></g><g class="wx-st wx-hide" data-only="2"><rect x="340" y="40" width="40" height="12" rx="3" class="wx-rock wx-edge"/><rect x="354" y="52" width="12" height="70" class="wx-wood wx-edge-soft"/><rect x="342" y="120" width="36" height="112" class="wx-bronze wx-o40"/><line x1="342" y1="120" x2="342" y2="232" class="wx-bold wx-s6"/><line x1="378" y1="120" x2="378" y2="232" class="wx-bold wx-s6"/><g class="wx-slide" style="--dx:40;--sp:1.2"><path d="M250,96 Q360,70 470,96" class="wx-bold wx-s6"/><line x1="250" y1="96" x2="470" y2="96" class="wx-thin"/></g><circle cx="340" cy="236" r="2" class="wx-sand wx-edge-soft"/><circle cx="346" cy="238" r="2" class="wx-sand wx-edge-soft"/><circle cx="374" cy="236" r="2" class="wx-sand wx-edge-soft"/><circle cx="380" cy="238" r="2" class="wx-sand wx-edge-soft"/></g><g class="wx-st" data-s="2"><circle cx="500" cy="118" r="9" class="wx-num"/><text x="500" y="122" text-anchor="middle" class="wx-numt">2</text><text x="516" y="122" class="wx-t-b">Tube drill and sand</text><text x="516" y="137" class="wx-t-s">a bow spins a copper tube;</text><text x="516" y="151" class="wx-t-s">dry quartz sand does the</text><text x="516" y="165" class="wx-t-s">cutting, the tube wears too</text></g><g class="wx-st" data-s="3"><rect x="342" y="150" width="36" height="84" class="wx-paper wx-edge"/><circle cx="32" cy="214" r="9" class="wx-num"/><text x="32" y="218" text-anchor="middle" class="wx-numt">3</text><text x="48" y="218" class="wx-t-b">Snap out the core</text><text x="48" y="233" class="wx-t-s">a clean hole through the neck</text></g><g class="wx-st" data-s="4"><path d="M342,150 L342,190 C320,200 282,226 282,264 C282,300 300,326 320,338 L400,338 C420,326 438,300 438,264 C438,226 400,200 378,190 L378,150 Z" class="wx-paper wx-edge"/></g><g class="wx-st wx-hide" data-only="4"><line x1="360" y1="36" x2="360" y2="260" class="wx-bold wx-s6"/><line x1="360" y1="60" x2="326" y2="44" class="wx-line"/><line x1="360" y1="60" x2="394" y2="44" class="wx-line"/><circle cx="318" cy="56" r="11" class="wx-rock wx-edge"/><circle cx="402" cy="56" r="11" class="wx-rock wx-edge"/><path d="M312,262 Q360,248 408,262 Q360,276 312,262 Z" class="wx-stone wx-edge wx-spin" style="-
