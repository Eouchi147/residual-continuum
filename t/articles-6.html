 L424,216.1 L432,229.6 L440,236.9 L448,228.4 L456,215.2 L464,209.3 L472,209.7 L480,212.7 L488,215.9 L496,216.4 L504,210.1 L512,197.8 L520,189.4 L528,193.3 L536,203.5 L544,211.1 L552,215.1 L560,217.0 L568,217.2 L576,215.6 L584,212.3 L592,208.4 L600,205.4 L608,204.2 L616,204.9 L624,206.7 L630,166 L660,166"/><text class="wx-t-b" x="60" y="152">Dhanushkodi</text><text class="wx-t-s" x="60" y="138">INDIA</text><text class="wx-t-b" x="660" y="152" text-anchor="end">Talaimannar</text><text class="wx-t-s" x="660" y="138" text-anchor="end">SRI LANKA</text><path class="wx-dim" d="M96,408 H624 M96,402 V414 M624,402 V414"/><text class="wx-t-n" x="360" y="428" text-anchor="middle">c. 30 km of shoals</text><g class="wx-pop" style="--d:4"><path class="wx-thin" d="M130,300 L150,212.8"/><text class="wx-t-m wx-halo" x="70" y="316">sand on top</text><path class="wx-thin" d="M320,300 L330,230.7"/><text class="wx-t-m wx-halo" x="250" y="316">beachrock, sandstone, coral</text><text class="wx-t-m wx-halo" x="500" y="316">older sediments</text></g><g class="wx-st" data-s="1"><text class="wx-t-b wx-t-a" x="24" y="456">20,000 years ago: dry land, lakes, sea c. 120 m lower</text></g><g class="wx-st" data-s="2"><text class="wx-t-b wx-t-a" x="24" y="474">c. 8,500 years ago: the sea starts flooding in</text></g><g class="wx-st" data-s="3"><text class="wx-t-b wx-t-a" x="24" y="492">c. 7,000 years ago: ridge drowned, boats needed</text></g><g class="wx-st" data-s="4"><text class="wx-t-b wx-t-a" x="24" y="510">from c. 5,000 years ago: sand cays re-emerge</text><circle class="wx-glow wx-edge" cx="180" cy="169.9" r="4"/><circle class="wx-glow wx-edge" cx="360" cy="179.7" r="4"/><circle class="wx-glow wx-edge" cx="520" cy="183.4" r="4"/></g><g class="wx-st" data-s="5"><text class="wx-t-b wx-t-a" x="24" y="528">1480 CE: storms break the last link (temple records)</text><path class="wx-hl" d="M260,236.5 V196"/><text class="wx-t-s wx-halo" x="260" y="268.5" text-anchor="middle">deeper gaps</text><g class="wx-pulse"><path class="wx-dash" d="M300,120 L310,184 M420,120 L420,184 M540,120 L530,184"/></g><text class="wx-t-s wx-halo" x="420" y="112" text-anchor="middle">ICESat-2 laser, 2024</text></g><text class="wx-t-s" x="24" y="556">Sea-level stages after Dubey et al. 2023; mapping after Dandabathula et al. 2024; layers and depths schematic.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> 20,000 years ago, at the height of the last Ice Age, the sea is about 120 m lower. The Palk Strait is land, with rivers and freshwater lakes.</p><ol class="wx-steplist"><li>20,000 years ago, at the height of the last Ice Age, the sea is about 120 m lower. The Palk Strait is land, with rivers and freshwater lakes.</li><li>About 8,500 years ago the rising sea starts to flood the strait, first through the lowest gaps.</li><li>By about 7,000 years ago the ridge is drowned. From now on the strait cannot be crossed on foot.</li><li>From about 5,000 years ago the sea settles slightly lower. Sand builds up on the cemented beachrock and small cays re-emerge.</li><li>Temple records say storms broke the last walkable link in 1480 CE. In 2024 ICESat-2&#x27;s laser mapped the ridge: almost all of it now lies under shallow water.</li></ol><figcaption>Step through the ridge&#x27;s history on a schematic profile from Dhanushkodi to Talaimannar. The vertical scale is greatly exaggerated; the ridge is about 30 km long and mostly 1–3 m deep. <span class="wx-src">Based on: Sea-level stages after Dubey et al. (2023); ridge length and submergence after Dandabathula et al. (2024); 1480 date from Rameswaram temple records. Layers, depths and vertical scale schematic.</span></figcaption><p class="vh">A long side profile of Adam&#x27;s Bridge between Dhanushkodi, India, on the left and Talaimannar, Sri Lanka, on the right, about 30 km. The ridge crest undulates with two deeper gaps, and below it are three layers: sand on top, beachrock, sandstone and coral in the middle, and older sediments beneath. Step 1: no water; a caption says 20,000 years ago the area was dry land with lakes and the sea about 120 m lower. Step 2: water fills only the lowest gaps as the sea floods in about 8,500 years ago. Step 3: water covers the whole ridge about 7,000 years ago. Step 4: the sea settles slightly lower and three sand cays, marked with yellow dots, re-emerge from about 5,000 years ago. Step 5: a marker shows the deeper gaps, a caption notes that storms broke the last link in 1480 CE, and dashed lines show ICESat-2 laser mapping in 2024.</p></figure><aside class="wcall"><b>How do we know?</b><p>Seismic profiling sends sound pulses into the seabed and records echoes from buried layers. Surfaces that were once dry land, eroded by rivers and weather, show up as sharp &#x27;unconformities&#x27; with channel shapes. Dubey and colleagues found three such surfaces and matched them to Ice Age low stands of the sea. Their reconstruction has the Palk Strait as a land of lakes during the last glacial peak, flooded from about 8,500 years ago and impassable on foot from about 7,000 years ago.</p></aside></section><section class="wsec" id="rama-setu-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>2007: when a shoal became a political storm</h3><p>Ships sailing between India&#x27;s west and east coasts must go right round Sri Lanka, because the Palk Strait and Adam&#x27;s Bridge are too shallow. In 2005 the Indian government approved the Sethusamudram Shipping Canal Project to dredge a channel through, cutting voyages by hundreds of kilometres. One proposed route cut across the ridge.</p><p>Protests followed. Political parties and religious groups said the canal would destroy a sacred structure built by Rama. In September 2007 the Archaeological Survey of India filed an affidavit in the Supreme Court saying there was no historical evidence that the bridge had been built by Rama. The reaction was so fierce that the government withdrew the affidavit within days. The project stalled and the route has never been dug. In later years the government told the court it would explore alternatives that avoided the ridge.</p><blockquote class="wpull"><p>The question of who built the ridge was never really about geology alone. It was about who has the authority to say what a sacred landscape is.</p></blockquote><p>Satellite images, including some from NASA, were widely shared as evidence of a man-made bridge. NASA itself responded that its images might be real, but the interpretation was not its own: remote sensing shows the shape of a feature, not whether humans made it.</p></section><section class="wsec" id="rama-setu-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The case for a causeway</h3><p>Advocates of Rama Setu, among them the politician Subramanian Swamy, who went to the Supreme Court to have the ridge protected, make a case in several parts. The ridge runs in a remarkably straight, narrow line between the two closest points of land. It lies exactly where the epic places the crossing. Temple records at Rameswaram say it could be walked until storms broke it in 1480. Some writers argue that boulders on the shoals sit on younger sand, which would suggest they were carried in rather than formed there, and in 2017 an American television promotion aired that argument to a large audience.</p><p>The most reasonable version of the idea does not require an army to have built 30 km of seabed. It proposes that people piled stones along an existing natural shoal to make a crossing easier, turning a line of fords into a causeway. That kind of improvement to a natural feature is common in human history, and it would be hard to detect from satellites alone. The claim that stones float also has a real basis: pumice and porous coral do float, and floating stones are displayed at temples in Rameswaram.</p></section><section class="wsec" id="rama-setu-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>What time and the sea have hidden</h3><p>The ridge is a restless place. Monsoon storms from both sides move sand constantly, cays appear and vanish, and cyclones reshape the shallows. Any small stone setting or trackway would be buried, scattered or rebuilt by nature within decades. At the same time, the most useful evidence, the internal structure and age of the ridge, lies below the surface and has never been cored along its length. No systematic radiometric dating of the ridge&#x27;s sand, beachrock and coral has yet been published in a peer-reviewed journal, and claims about rocks being older than the sand beneath them have not been published in a form others can check.</p><p>There is also a deeper human history here. People lived in Sri Lanka and southern India through the Ice Age, when the two were joined by land. Dubey and colleagues suggest that from the early Holocene, as the strait flooded, crossing would have needed boats or other aids. The ridge may well have been a landmark, a fishing ground and a fording route for thousands of years, sacred long before anyone wrote it down.</p></section><section class="wsec" id="rama-setu-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What would settle it</h3><p>The tests are straightforward, though costly and politically delicate. A line of drilled cores along and across the ridge, dated by radiocarbon on shells and coral and by luminescence on sand, would show how and when the ridge built up. A diving survey could map any boulders and test whether they are embedded in the natural beachrock, as natural blocks would be, or rest loose on sand as placed stones might. Petrographic analysis could show whether any stone came from far away. India&#x27;s authorities approved underwater study of the ridge in 2021; full publication of dated results would help everyone.</p><p>For now the evidence points one way: a natural ridge, drowned by the rising sea and partly returned by it. That does not diminish its meaning. For millions of people, Rama Setu is sacred because of what it represents, and that has never depended on who laid the stones.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">18,000 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Palk Strait is land with lakes; sea c. 120 m lower</span></li><li class="wtl-loss" style="--i:1"><span class="wtl-y">6,500 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">The sea begins to flood the strait</span></li><li class="wtl-loss" style="--i:2"><span class="wtl-y">5,000 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Ridge drowned; no crossing on foot</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">3,000 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Sand cays and islands begin to re-emerge</span></li><li class="wtl-loss" style="--i:4"><span class="wtl-y">1480 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Storms break the link, say temple records</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">2005 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Sethusamudram shipping canal approved</span></li><li class="wtl-event" style="--i:6"><span class="wtl-y">2007 CE</span><span class="wtl-k">Event</span><span class="wtl-t">ASI affidavit to the Supreme Court, then withdrawn</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2023 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Seismic study maps the drowned landscape beneath</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2024 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">ICESat-2 laser maps the ridge in detail</span></li></ol><details class="srcs"><summary>Sources for this case (9)</summary><ol><li>Dandabathula G. et al. (2024). Physical features of Adam&#x27;s Bridge interpreted from ICESat-2 based high-resolution digital bathymetric elevation model. Scientific Reports 14. <a href="https://doi.org/10.1038/s41598-024-65908-2" target="_blank" rel="noopener">doi:10.1038/s41598-024-65908-2</a></li><li>Dubey K. M., Chaubey A. K., Gaur A. S., Joglekar M. V. (2023). Evolution of Ramasetu region as a link between India and Sri Lanka during the late Pleistocene and Holocene. Quaternary Research 111: 166–176. <a href="https://doi.org/10.1017/qua.2022.41" target="_blank" rel="noopener">doi:10.1017/qua.2022.41</a></li><li>Valmiki. The Rámáyan of Válmíki, trans. R. T. H. Griffith (1870–1874). Book VI, Canto XXII: The Sea Bridge.</li><li>Lambeck K., Rouby H., Purcell A., Sun Y., Sambridge M. (2014). Sea level and global ice volumes from the Last Glacial Maximum to the Holocene. PNAS 111(43): 15296–15303. <a href="https://doi.org/10.1073/pnas.1411762111" target="_blank" rel="noopener">doi:10.1073/pnas.1411762111</a></li><li>Goldman R. P. (trans. and intro.) (1984). The Ramayana of Valmiki: An Epic of Ancient India, vol. 1. Princeton University Press.</li><li>Supreme Court of India. Proceedings on the Sethusamudram Shipping Canal Project and Rama Setu, 2007 onwards.</li><li>Space Applications Centre (ISRO). Coral reef mapping of the Gulf of Mannar and Adam&#x27;s Bridge.</li><li>NASA (2007). Statement on satellite images of Adam&#x27;s Bridge, as reported in the Indian press.</li><li>Adam&#x27;s Bridge. Summary of geology, temple records and the 2007 controversy (Wikipedia, accessed 2026).</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-rama-setu" data-t="Rama Setu: A Bridge Built by an Army or by the Sea?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Rama Setu: A Bridge Built by an Army or by the Sea?</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-rama-setu</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-ancient-astronauts-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Nazca-lineas-astronauta-c01.jpg" data-cap="The Nazca figure nicknamed &#x27;the astronaut&#x27;" data-big><figcaption></figcaption></figure><div class="sh-k">Impossible Megaliths</div><h2 class="sh-t" id="case-ancient-astronauts-st" tabindex="-1">Ancient Astronauts: Credit Where Credit Is Due</h2><p class="sh-s">Erich von Däniken sold tens of millions of books saying aliens helped. What the sites themselves hold points to human hands: logbooks, towns, tools and names.</p><div class="sh-v"><span class="vstamp vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><p class="sh-claim"><b>What the stamp rates:</b> Monuments such as the Giza pyramids, the Nazca lines and Pakal&#x27;s tomb lid required, or depict, help from extraterrestrial visitors.</p></div><p class="v4-q">Did ancient monuments need help from visitors from space?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>The idea: the pyramids, the Nazca lines and a Maya king&#x27;s tomb lid needed help from visitors from space.</li><li>At Giza we have the workers&#x27; town, their cemetery and a foreman&#x27;s logbook of hauling stone for a pyramid named for Khufu.</li><li>The Nazca lines were made by moving dark stones aside, and the designs match the pottery of the people who lived there.</li><li>The Pakal lid shows a named king in standard Maya imagery.</li><li>How some things were built is still debated, but the debate is between human methods; no trace of visitors has ever turned up.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Texts and scripts</span><span class="thr">Engineering</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="303" >303</b><span class="ctr-u"> geoglyphs</span></div><div class="ctr-l">new Nazca figures found with AI assistance in six months</div><div class="ctr-c">Sakai et al. 2024</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="683" >683</b><span class="ctr-u"> CE</span></div><div class="ctr-l">year Pakal of Palenque died, as recorded in his tomb</div><div class="ctr-c">Schele and Freidel 1990</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="4500" >4,500</b><span class="ctr-u"> years</span></div><div class="ctr-l">age of Merer&#x27;s logbook, the oldest inscribed papyri known</div><div class="ctr-c">Tallet 2017</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="1968" >1,968</b><span class="ctr-u"> </span></div><div class="ctr-l">Chariots of the Gods? first published (in German)</div><div class="ctr-c">von Däniken 1968</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Monuments such as the Giza pyramids, the Nazca lines and Pakal&#x27;s tomb lid required, or depict, help from extraterrestrial visitors.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">For each of the classic examples the evidence points directly to the human builders: Merer&#x27;s logbook, the Giza workers&#x27; town and harbour, the stone-clearing technique and pottery motifs of Nazca, and the named king and standard iconography of the Pakal lid. The alien readings require ignoring or misreading that evidence. Some construction methods are still debated, but those debates are between human techniques, and no physical trace of visitors has ever been found.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 6 of 6, presented as settled fact"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>presented as settled fact</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks are confident about who worked on these monuments, and on that point the direct evidence is strong. They are sometimes overconfident about how, and about when every phase began: the lifting of the Great Pyramid&#x27;s upper courses and the purpose of the Nazca lines are still argued among specialists, and diagrams of a single ramp can look more certain than they are. Saying so openly would take the wind out of alien claims, not feed them.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Papyri found in 2013 at Wadi al-Jarf on the Red Sea include the logbook of an official named Merer, recording his crew&#x27;s boat trips carrying limestone from the Tura quarries to Giza for Khufu&#x27;s pyramid.<small>Tallet 2017; Tallet and Lehner 2021</small></li><li>Excavations at Giza found a workers&#x27; town with bakeries and breweries and a cemetery of pyramid builders, and a now-buried Nile branch, the Ahramat, ran along the pyramid fields.<small>Lehner 1997; Ghoneim et al. 2024</small></li><li>The Nazca lines were made by clearing dark, weathered stones to expose paler ground; the designs match motifs on Nazca pottery, and an AI-assisted survey in 2024 added 303 new figurative geoglyphs, many small ones beside footpaths.<small>Aveni 1990; Sakai et al. 2024, PNAS</small></li><li>The Palenque sarcophagus lid names K&#x27;inich Janaab&#x27; Pakal, who died in 683 CE, and shows him at the entrance to the underworld beneath the World Tree, in standard Maya religious imagery.<small>Schele and Freidel 1990</small></li><li>Erich von Däniken&#x27;s Erinnerungen an die Zukunft (1968), published in English as Chariots of the Gods?, launched the modern ancient-astronaut idea; he died in January 2026 at the age of 90.<small>Publisher records; obituaries 2026</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Exactly how the upper courses of the Great Pyramid were raised: straight, spiral, zigzag or internal ramps, levers, or a combination.</li><li>What the Nazca lines were for: ritual walking, water and fertility rites, marking paths, or astronomy; several functions may have applied.</li><li>How some very hard stone objects and polygonal masonry walls were finished so precisely, and how long it took.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Most construction ramps, sledges, ropes and scaffolding were dismantled, reused or have decayed, so direct evidence of lifting methods is scarce.</li><li>No written Nazca or early Andean texts explain the lines; their builders had no known writing system.</li><li>Void spaces inside the Great Pyramid detected by muon imaging in 2017 and 2023 have not been entered or explained.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Archaeologists see no need for outside help. Each monument has a known culture, a date, a workforce, quarries, tools and, in Egypt and the Maya world, written records naming the people involved. The Great Pyramid was a massive state project with logistics we can now read in its own papyri. The Nazca lines were made by clearing stones, a technique within reach of small teams. Pakal&#x27;s lid is a masterpiece of Maya religious art with its own inscription. Where methods are still debated, the debate is about which human technique was used, not whether humans could do it.</p><ul><li>Every &#x27;mystery&#x27; in the original books has a documented human context.</li><li>The ancient-astronaut argument depends on underestimating ancient people, especially non-European ones.</li><li>No object of extraterrestrial manufacture has ever been found in an archaeological context.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Von Däniken argued that myths of gods descending from the sky remember real visitors, that ancient peoples lacked the tools or knowledge for their greatest works, and that some art shows spacecraft. His famous examples were the pyramids, the Nazca lines as landing strips, and the Pakal lid as an astronaut at the controls of a rocket. Zecharia Sitchin read Mesopotamian texts as describing a race of visitors from a hidden planet. The Ancient Aliens series carried these ideas to a new generation.</p><ul><li>Many cultures tell of gods or teachers who came from the sky and gave them knowledge.</li><li>Some ancient works are astonishing in scale or precision, and archaeologists cannot always show exactly how they were done.</li><li>The Nazca lines are best appreciated from the air, which seems odd for people who could not fly.</li></ul><div class="face-s"><b>Its strongest point</b><p>For several famous monuments, archaeologists still cannot demonstrate step by step how every part was built, and the scale of those achievements invites the question of whether we have underestimated the knowledge behind them.</p></div><p class="face-cr"><b>Credit</b> Erich von Däniken; Zecharia Sitchin; Giorgio A. Tsoukalos and the Ancient Aliens television series</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>An artefact of clearly non-human manufacture, found in a sealed and dated ancient context.</li><li>Direct archaeological evidence of the lifting methods used on the upper Great Pyramid, for example from the unexplored voids.</li><li>Experimental reproductions at full scale of disputed techniques, such as hardstone vessel finishing and polygonal wall fitting, published with time and labour costs.</li><li>A Nazca settlement or ritual context that fixes the purpose of a particular set of lines.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,052 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of Ancient Astronauts: Credit Where Credit Is Due"><button type="button" class="wtoc-i" data-go="ancient-astronauts-s1">The book that sent the gods into orbit</button><button type="button" class="wtoc-i" data-go="ancient-astronauts-s2">The workers&#x27; own records</button><button type="button" class="wtoc-i" data-go="ancient-astronauts-s3">Lines in the desert</button><button type="button" class="wtoc-i" data-go="ancient-astronauts-s4">The king who fell into the underworld</button><button type="button" class="wtoc-i" data-go="ancient-astronauts-s5">What is genuinely still unexplained</button><button type="button" class="wtoc-i" data-go="ancient-astronauts-s6">Why the credit matters</button></nav></div><section class="wsec" id="ancient-astronauts-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The book that sent the gods into orbit</h3><p>In 1968 a Swiss hotel manager named Erich von Däniken published a book called Erinnerungen an die Zukunft, &#x27;Memories of the Future&#x27;. In English it became Chariots of the Gods?, question mark included. Its argument was simple and exciting. Ancient peoples, he said, could not have built the pyramids, drawn giant figures in the Peruvian desert or carved certain images on their own. The gods who descended from the sky in their myths were real visitors from other worlds, and their technology left traces that archaeologists refused to see.</p><p>The book and its sequels sold in the tens of millions across dozens of languages, and its ideas spread through documentaries and, from 2009, the long-running television series Ancient Aliens. Von Däniken died in January 2026, aged 90, still convinced. His challenge deserves a fair answer, because the big question behind it is one this site cares about: have we underestimated the past? The answer, in his three most famous cases, is yes. But not in the way he meant.</p><blockquote class="wpull"><p>Von Däniken asked whether we had underestimated the ancients. We had. The mistake was to hand their achievements to someone else.</p></blockquote></section><section class="wsec" id="ancient-astronauts-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The workers&#x27; own records</h3><p>Start at Giza. The ancient-astronaut case said the Egyptians lacked the tools, organisation and know-how to raise the Great Pyramid. Since then, archaeology has filled in the human story in remarkable detail. Mark Lehner and Zahi Hawass excavated a whole town beside the pyramids, with bakeries, breweries, storerooms and houses, and a cemetery where pyramid builders were buried with honour, some with healed injuries showing they received medical care.</p><p>In 2013 Pierre Tallet&#x27;s team, digging at the ancient harbour of Wadi al-Jarf on the Red Sea, found the oldest inscribed papyri known. Among them is the logbook of an inspector named Merer. For months, day by day, he recorded his crew of about forty men sailing blocks of fine limestone from the quarries at Tura, across the Nile valley, to Giza for the casing of Khufu&#x27;s pyramid. In 2024 Eman Ghoneim and colleagues mapped a buried branch of the Nile, which they called the Ahramat branch, running along the edge of the desert beside dozens of pyramids, the waterway that made such deliveries possible.</p><aside class="wcall"><b>How do we know?</b><p>Merer&#x27;s diary is written in hieratic, the cursive form of Egyptian script, and dated to the later years of Khufu&#x27;s reign. It names the harbour at Giza, the quarry at Tura and the official in charge, Ankhhaf, Khufu&#x27;s half-brother. It is not a description of the pyramid; it is the paperwork of the project, which is exactly why it is so convincing.</p></aside></section><section class="wsec" id="ancient-astronauts-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Lines in the desert</h3><p>On the high desert plain between the Nazca and Ingenio rivers in southern Peru, hundreds of straight lines, trapezoids and spirals, and dozens of large animal and plant figures, have survived for up to two thousand years. Von Däniken suggested the long straight lines looked like runways for alien craft. The Nazca ground tells a simpler story. Its surface is a desert pavement of dark, weathered stones over paler silt and sand. Rake the stones aside and a pale line appears. Rain almost never falls, so the marks survive.</p><figure class="wx wx--steps" id="ancient-astronauts-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">How to draw a Nazca figure without leaving the ground</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How to draw a Nazca figure without leaving the ground"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" class="wx-svg" role="img" aria-labelledby="ancient-astronauts-f1-t"><title id="ancient-astronauts-f1-t">How a Nazca geoglyph can be made with a sketch, stakes, cord and a rake, in five steps</title><text class="wx-t-cap" x="24" y="24">Making a Nazca figure · schematic, not to scale</text><text class="wx-t-h" x="24" y="52">No runway required</text><g class="wx-st" data-s="1"><rect class="wx-sand" x="40" y="366" width="290" height="60"/><ellipse class="wx-stone3 wx-edge-soft" cx="43.2" cy="362.2" rx="4.6" ry="3.4"/><ellipse class="wx-stone3 wx-edge-soft" cx="52.6" cy="362.4" rx="4.6" ry="3.4"/><ellipse class="wx-stone3 wx-edge-soft" cx="62.4" cy="360.3" rx="4.6" ry="3.4"/><ellipse class="wx-stone3 wx-edge-soft" cx="69.5" cy="363.3" rx="4.6" ry="3.4"/><ellipse class="wx-stone3 wx-edge-soft" cx="79.3" cy="360.9" rx="4.6" ry="3.4"/><ellipse class="wx-stone3 wx-edge-soft" cx="90.5" cy="361.9" rx="4.6" ry="3.4"/><ellipse class="wx-stone3 wx-edge-soft" cx="99.0" cy="361.9" rx="4.6" ry="3.4"/><ellipse class="wx-stone3 wx-edge-soft" cx="107.4" cy="360.6" rx="4.6" ry="3.4"/><ellipse class="wx-stone3 wx-edge-soft" cx="116.4" cy="363.5" rx="4.6" ry="3.4"/><ellipse class="wx-stone3 wx-edge-soft" cx="125.1" cy="363.0" rx="4.6" ry="3.4"/><ellipse class="wx-stone3 wx-edge-soft" cx="134.5"  y="96">Sketch on a small grid</text></g><g class="wx-st" data-s="3"><path class="wx-guide" d="M420,84 V354 M420,84 H690 M465,84 V354 M420,129 H690 M510,84 V354 M420,174 H690 M555,84 V354 M420,219 H690 M600,84 V354 M420,264 H690 M645,84 V354 M420,309 H690 M690,84 V354 M420,354 H690 "/><path class="wx-dash" d="M555,84 L555,142.5 L429.0,129.0 L537.0,192.0 L537.0,255.0 L492.0,336.0 L555,300.0 L618.0,336.0 L573.0,255.0 L573.0,192.0 L681.0,129.0 L555,142.5"/><circle class="wx-wood wx-edge" cx="555" cy="84" r="4"/><circle class="wx-wood wx-edge" cx="555" cy="142.5" r="4"/><circle class="wx-wood wx-edge" cx="429.0" cy="129.0" r="4"/><circle class="wx-wood wx-edge" cx="537.0" cy="192.0" r="4"/><circle class="wx-wood wx-edge" cx="537.0" cy="255.0" r="4"/><circle class="wx-wood wx-edge" cx="492.0" cy="336.0" r="4"/><circle class="wx-wood wx-edge" cx="555" cy="300.0" r="4"/><circle class="wx-wood wx-edge" cx="618.0" cy="336.0" r="4"/><circle class="wx-wood wx-edge" cx="573.0" cy="255.0" r="4"/><circle class="wx-wood wx-edge" cx="573.0" cy="192.0" r="4"/><circle class="wx-wood wx-edge" cx="681.0" cy="129.0" r="4"/><path class="wx-hl" d="M204,172 C260,150 330,150 400,170"/><path class="wx-accfill" d="M400,170 l-10,-8 l2,12 Z"/><text class="wx-t-m wx-halo" x="300" y="146" text-anchor="middle">scale up with</text><text class="wx-t-m wx-halo" x="300" y="162" text-anchor="middle">stakes and cord</text></g><g class="wx-st" data-s="4"><path class="wx-line wx-halo" style="stroke-width:10" d="M555,84 L555,142.5 L429.0,129.0 L537.0,192.0 L537.0,255.0 L492.0,336.0 L555,300.0 L618.0,336.0 L573.0,255.0 L573.0,192.0 L681.0,129.0 L555,142.5"/><rect class="wx-paper" x="150" y="356" width="60" height="12"/><rect class="wx-sand" x="150" y="366" width="60" height="4"/><ellipse class="wx-stone3 wx-edge-soft" cx="146.0" cy="354.0" rx="4.6" ry="3.4"/><ellipse class="wx-stone3 wx-edge-soft" cx="152.0" cy="348.0" rx="4.6" ry="3.4"/><ellipse class="wx-stone3 wx-edge-soft" cx="141.0" cy="347.0" rx="4.6" ry="3.4"/><ellipse class="wx-stone3 wx-edge-soft" cx="214.0" cy="354.0" rx="4.6" ry="3.4"/><ellipse class="wx-stone3 wx-edge-soft" cx="208.0" cy="348.0" rx="4.6" ry="3.4"/><ellipse class="wx-stone3 wx-edge-soft" cx="219.0" cy="347.0" rx="4.6" ry="3.4"/><ellipse class="wx-stone3 wx-edge-soft" cx="147.0" cy="341.0" rx="4.6" ry="3.4"/><ellipse class="wx-stone3 wx-edge-soft" cx="213.0" cy="341.0" rx="4.6" ry="3.4"/><text class="wx-t-b wx-t-a" x="180" y="392" text-anchor="middle">rake stones aside</text><text class="wx-t-m" x="180" y="408" text-anchor="middle">the pale ground shows</text></g><g class="wx-st wx-hide" data-s="5"><path class="wx-flow wx-s4" d="M555,84 L555,142.5 L429.0,129.0 L537.0,192.0 L537.0,255.0 L492.0,336.0 L555,300.0 L618.0,336.0 L573.0,255.0 L573.0,192.0 L681.0,129.0 L555,142.5"/><text class="wx-t-b" x="420" y="396">One continuous line: a path</text><text class="wx-t-m" x="420" y="412">to walk, perhaps in procession</text></g><text class="wx-t-s" x="24" y="464">After Aveni 1990; Reinhard 1996; Sakai et al. 2024. Figure shape invented for illustration.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> The Nazca pampa is covered with dark, weathered stones lying on paler silt and sand. It almost never rains, so marks made here can last for centuries.</p><ol class="wx-steplist"><li>The Nazca pampa is covered with dark, weathered stones lying on paler silt and sand. It almost never rains, so marks made here can last for centuries.</li><li>Draw the design small, on a grid. The same motifs appear on Nazca pottery and textiles.</li><li>Scale it up on the ground with stakes and cord, copying the grid square by square. Remains of wooden stakes have been found at Nazca.</li><li>Rake the dark stones aside along the cord and pile them at the edges. The pale ground underneath forms the line.</li><li>Many figures are a single continuous line, a path that can be walked. Small figures found in 2024 sit beside footpaths, meant to be seen from the ground.</li></ol><figcaption>Step through one practical method: a small design on a grid, scaled up with stakes and cord, then cleared by raking aside the dark surface stones. The bird shape is invented for illustration. <span class="wx-src">Based on: Construction method after Aveni (1990) and Reinhard (1996); 2024 survey after Sakai et al. (2024). Figure shape, grid and proportions are illustrative, not a real geoglyph.</span></figcaption><p class="vh">Three panels. Bottom left, a cross-section of the Nazca desert: a layer of dark pebbles lying on pale silt and sand. Top left, a small bird-shaped design drawn on a six-by-six grid. Right, a larger dark desert patch with the same six-by-six grid scaled up. Step 1 shows the desert section. Step 2 shows the small sketch on its grid. Step 3 adds an arrow from the sketch to the large grid, where stakes mark each corner of the bird and a dashed cord joins them. Step 4 turns the outline into a pale, wide line and, in the section, a gap appears in the pebble layer with stones piled on either side and the note &#x27;rake stones aside, the pale ground shows&#x27;. Step 5 animates a moving dashed line along the figure and notes that it is one continuous path to walk, perhaps in procession.</p></figure><p>The designs match those on Nazca pottery and textiles. Remains of wooden stakes and piles of cleared stones show how lines were laid out and swept. Experiments have shown that small teams with stakes and cord can scale up a figure accurately in days. And the ground is too soft for any aircraft. In 2024 a team led by Masato Sakai used an AI model on aerial images to find 303 new figurative geoglyphs in six months, nearly doubling the known total. Many are small relief figures of people and domestic animals set beside footpaths, pointing to lines that were meant to be walked and seen from the ground, as parts of ritual and daily life.</p></section><section class="wsec" id="ancient-astronauts-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The king who fell into the underworld</h3><p>In 1952 the Mexican archaeologist Alberto Ruz Lhuillier, clearing a rubble-filled stairway inside the Temple of the Inscriptions at Palenque, reached a vaulted tomb. Inside lay a carved stone sarcophagus. Its lid shows a man reclining over a great open maw, with a cross-shaped tree rising above him topped by a bird. Von Däniken, viewing the lid sideways, saw an astronaut leaning forward at the controls of a rocket, with exhaust flames beneath.</p><p>Maya scholars, who from the 1970s onward learned to read Maya inscriptions, see something quite different and clearly labelled. The text around the lid names K&#x27;inich Janaab&#x27; Pakal, king of Palenque, born in 603 CE and died in 683 CE, and lists his ancestors. The &#x27;rocket&#x27; is the World Tree, the axis linking heavens, earth and underworld, a motif carved across the Maya world. The &#x27;flames&#x27; are the jaws of the underworld into which the dead king descends, to be reborn like the maize god. Read in its own language, the lid is a statement of royal death and resurrection, and one of the finest carvings of the ancient Americas.</p></section><section class="wsec" id="ancient-astronauts-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>What is genuinely still unexplained</h3><p>Dismissing aliens does not mean that every question is answered, and it is worth being honest about the real open problems, because they are more interesting than the myths.</p><ul class="wlist"><li>The Great Pyramid&#x27;s upper courses: no one knows for certain how the top third was built. Straight, spiral and internal ramp models all have supporters. In 2018 a steep ramp with post holes and stairs was found at the Hatnub alabaster quarries, showing one sophisticated Old Kingdom hauling system.</li><li>Hidden spaces: in 2017 muon imaging revealed a large void above the Grand Gallery, and in 2023 a corridor behind the north face was confirmed. Their purpose is unknown.</li><li>Precision in hard stone: some Egyptian stone vessels and Andean polygonal walls are finished with remarkable accuracy. Experimental work shows human methods (abrasives, pounding, repeated fitting), but full-scale time and labour costs are still argued.</li><li>Puma Punku&#x27;s standardised andesite blocks in Bolivia look machine-made to many visitors. Alexei Vranich&#x27;s 2018 3D-printed reconstruction suggests modular design with templates, a clever human solution.</li></ul><p>Other famous &#x27;anomalies&#x27; are simple misreadings. The &#x27;helicopter&#x27; at the temple of Seti I in Abydos is a palimpsest: hieroglyphs of one royal title were plastered and recarved with another, and the overlap looks like a machine. The Nazca &#x27;astronaut&#x27; is a figure with an owl-like face on a hillside, one of several human figures there.</p></section><section class="wsec" id="ancient-astronauts-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Why the credit matters</h3><p>Many archaeologists point out an uncomfortable pattern in ancient-astronaut writing: the monuments said to need outside help are overwhelmingly those built by Egyptians, Maya, Andean and other non-European peoples. The effect, whatever the intention, is to take their greatest achievements away from them. The evidence gives those achievements back: to Merer and his crew, to the Nazca families sweeping lines across the pampa, to the sculptors who carved Pakal&#x27;s lid.</p><p>Graham Hancock, often lumped together with von Däniken, explicitly rejects aliens and argues instead for a lost human civilisation, which is at least a claim about human ability. The question of what ancient people knew, and how much was lost, remains open and worth asking. The tests are the same as for any claim: an artefact of non-human manufacture in a sealed ancient layer would change everything. None has ever been found. Until one is, the credit belongs where the evidence puts it.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">2,560 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Great Pyramid built; Merer&#x27;s crew ships limestone</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">200 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Nazca lines being made (c. 400 BCE–600 CE)</span></li><li class="wtl-build" style="--i:2"><span class="wtl-y">683 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Pakal buried at Palenque</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">1941 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Paul Kosok begins studying the Nazca lines</span></li><li class="wtl-find" style="--i:4"><span class="wtl-y">1952 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Alberto Ruz Lhuillier opens Pakal&#x27;s tomb</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">1968 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Von Däniken&#x27;s Chariots of the Gods? published</span></li><li class="wtl-find" style="--i:6"><span class="wtl-y">2013 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Merer&#x27;s papyri found at Wadi al-Jarf</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2017 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Muon imaging finds the Great Pyramid&#x27;s &#x27;Big Void&#x27;</span></li><li class="wtl-find" style="--i:8"><span class="wtl-y">2024 CE</span><span class="wtl-k">Found</span><span class="wtl-t">AI survey adds 303 Nazca figures</span></li><li class="wtl-event" style="--i:9"><span class="wtl-y">2026 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Erich von Däniken dies, aged 90</span></li></ol><figure class="fg fg-wide" id="fig-costume"><div class="fg-frame"><div class="fg-scroll"><div class="fg-d"><svg class="fg-svg" viewBox="0 0 620 386" role="img" preserveAspectRatio="xMidYMid meet" aria-labelledby="figcs-t figcs-d"><title id="figcs-t">Reported form tracks contemporary technology</title><desc id="figcs-d">Six waves of anomalous aerial reports paired with the technology that had just become culturally salient at the time: airships in 1896 before powered flight, glowing spheres and rockets in the 1940s, discs immediately after a wire service coined the phrase flying saucer in 1947, black triangles as stealth planforms entered public awareness, and multi-rotor drones now.</desc><g class="fg-g"><line class="fg-spine" x1="300" y1="46" x2="300" y2="360"/><text class="fg-t fg-tlab" x="266" y="34" text-anchor="end">what was reported</text><text class="fg-t fg-tlab" x="334" y="34" text-anchor="start">what had just arrived</text><circle class="fg-dot" cx="300" cy="76" r="4" style="--i:0"/><text class="fg-t fg-tdim fg-tyear" x="300" y="96" text-anchor="middle">1896</text><text class="fg-t fg-tlab" x="278" y="74" text-anchor="end">airships</text><text class="fg-t fg-tsm" x="278" y="88" text-anchor="end">cigar hulls, pro lying saucer”</text><circle class="fg-dot" cx="300" cy="284" r="4" style="--i:4"/><text class="fg-t fg-tdim fg-tyear" x="300" y="304" text-anchor="middle">1985</text><text class="fg-t fg-tlab" x="278" y="282" text-anchor="end">black triangles</text><text class="fg-t fg-tsm" x="278" y="296" text-anchor="end">large, silent,</text><text class="fg-t fg-tsm" x="278" y="307" text-anchor="end">flat-bottomed</text><text class="fg-t fg-tsm" x="322" y="282" text-anchor="start">F-117 and B-2 make faceted and</text><text class="fg-t fg-tsm" x="322" y="293" text-anchor="start">flying-wing planforms public</text><circle class="fg-dot" cx="300" cy="336" r="4" style="--i:5"/><text class="fg-t fg-tdim fg-tyear" x="300" y="356" text-anchor="middle">2024</text><text class="fg-t fg-tlab" x="278" y="334" text-anchor="end">quadcopters</text><text class="fg-t fg-tsm" x="278" y="348" text-anchor="end">multi-rotor drones,</text><text class="fg-t fg-tsm" x="278" y="359" text-anchor="end">5,000+ reports</text><text class="fg-t fg-tsm" x="322" y="334" text-anchor="start">the age of the consumer drone</text></g></svg></div><div class="fg-m"><svg class="fg-svg" viewBox="0 0 380 470" role="img" preserveAspectRatio="xMidYMid meet" aria-labelledby="figcsm-t figcsm-d"><title id="figcsm-t">Reported form tracks contemporary technology</title><desc id="figcsm-d">Six waves of anomalous aerial reports paired with the technology that had just become culturally salient at the time: airships in 1896 before powered flight, glowing spheres and rockets in the 1940s, discs immediately after a wire service coined the phrase flying saucer in 1947, black triangles as stealth planforms entered public awareness, and multi-rotor drones now.</desc><g class="fg-g"><line class="fg-spine" x1="38" y1="46" x2="38" y2="444"/><text class="fg-t fg-tlab" x="60" y="34" text-anchor="start">what was reported, and what had just arrived</text><circle class="fg-dot" cx="38" cy="76" r="4" style="--i:0"/><text class="fg-t fg-tdim fg-tyear" x="38" y="92" text-anchor="middle">1896</text><text class="fg-t fg-tlab" x="60" y="74" text-anchor="start">airships</text><text class="fg-t fg-tsm" x="60" y="88" text-anchor="start">cigar hulls, propellers,</text><text class="fg-t fg-tsm" x="60" y="99" text-anchor="start">searchlights, human crews</text><text class="fg-t fg-tsm" x="60" y="110" text-anchor="start">powered flight expected</text><text class="fg-t fg-tsm" x="60" y="121" text-anchor="start">imminently: and not yet flown</text><circle class="fg-dot" cx="38" cy="150" r="4" style="--i:1"/><text class="fg-t fg-tdim fg-tyear" x="38" y="166" text-anchor="middle">1944</text><text class="fg-t fg-tlab" x="60" y="148" text-anchor="start">foo fighters</text><text class="fg-t fg-tsm" x="60" y="162" text-anchor="start">glowing spheres pacing</text><text class="fg-t fg-tsm" x="60" y="173" text-anchor="start">aircraft at night</text><text class="fg-t fg-tsm" x="60" y="184" text-anchor="start">secret enemy weapons assumed</text><text class="fg-t fg-tsm" x="60" y="195" text-anchor="start">, by both sides, of each other</text><circle class="fg-dot" cx="38" cy="224" r="4" style="--i:2"/><text class="fg-t fg-tdim fg-tyear" x="38" y="240" text-anchor="middle">1946</text><text class="fg-t fg-tlab" x="60" y="222" text-anchor="start">ghost rockets</text><text class="fg-t fg-tsm" x="60" y="236" text-anchor="start">fast, wingless,</text><text class="fg-t fg-tsm" x="60" y="247" text-anchor="start">rocket-shaped</text><text class="fg-t fg-tsm" x="60" y="258" text-anchor="start">captured V-2s feared to be</text><text class="fg-t fg-tsm" x="60" y="269" text-anchor="start">flying from Peenemünde</text><circle class="fg-dot" cx="38" cy="298" r="4" style="--i:3"/><text class="fg-t fg-tdim fg-tyear" x="38" y="314" text-anchor="middle">1947</text><text class="fg-t fg-tlab" x="60" y="296" text-anchor="start">discs</text><text class="fg-t fg-tsm" x="60" y="310" text-anchor="start">flat and circular,</text><text class="fg-t fg-tsm" x="60" y="321" text-anchor="start">within days</text><text class="fg-t fg-tsm" x="60" y="332" text-anchor="start">a wire service prints</text><text class="fg-t fg-tsm" x="60" y="343" text-anchor="start">“flying saucer”</text><circle class="fg-dot" cx="38" cy="372" r="4" style="--i:4"/><text class="fg-t fg-tdim fg-tyear" x="38" y="388" text-anchor="middle">1985</text><text class="fg-t fg-tlab" x="60" y="370" text-anchor="start">black triangles</text><text class="fg-t fg-tsm" x="60" y="384" text-anchor="start">large, silent,</text><text class="fg-t fg-tsm" x="60" y="395" text-anchor="start">flat-bottomed</text><text class="fg-t fg-tsm" x="60" y="406" text-anchor="start">F-117 and B-2 make faceted and</text><text class="fg-t fg-tsm" x="60" y="417" text-anchor="start">flying-wing planforms public</text><circle class="fg-dot" cx="38" cy="446" r="4" style="--i:5"/><text class="fg-t fg-tdim fg-tyear" x="38" y="462" text-anchor="middle">2024</text><text class="fg-t fg-tlab" x="60" y="444" text-anchor="start">quadcopters</text><text class="fg-t fg-tsm" x="60" y="458" text-anchor="start">multi-rotor drones,</text><text class="fg-t fg-tsm" x="60" y="469" text-anchor="start">5,000+ reports</text><text class="fg-t fg-tsm" x="60" y="480" text-anchor="start">the age of the consumer drone</text></g></svg></div></div><ol class="fg-key"><li><span class="fg-kn">1</span>1896–97: a craft with propellers, a searchlight and a crew, at the moment powered flight was expected and had not happened. One witness reported it pedal-powered</li><li><span class="fg-kn">2</span>1944–45: both sides reported them, and both sides assumed the other had built them. Neither had</li><li><span class="fg-kn">3</span>1946: around 2,000 Scandinavian reports, some 200 radar-verified. Thirty recovered fragments proved to be meteorite, coke and slag</li><li><span class="fg-kn">4</span>1947: Arnold's saucer simile described the motion. His own drawings show a crescent. The press printed the shape, and the shape is what people then saw</li><li><span class="fg-kn">5</span>1980s–90s: the Belgian wave's most famous photograph was confessed a hoax in 2011; the 10 p.m. Phoenix lights were confirmed A-10 flares</li><li><span class="fg-kn">6</span>2024–25: the joint federal investigation found “nothing anomalous”; one widely shared video was the constellation Orion</li></ol><div class="fg-photo" hidden></div></div><figcaption class="fg-cap"><span class="fg-num">Fig. 11</span><span class="fg-title">The costume changes; the encounter does not</span><span class="fg-note">Five repetitions of one pattern, each independently documented. This is the strongest single argument that the reported <i>form</i> of these objects is culturally supplied, and it is worth being exact about its reach. It establishes that morphology tracks expectation. It does not establish that nothing was seen. The Swedish Defence Staff, having explained most of two thousand reports, still recorded that “in some cases clear, unambiguous observations have been made that cannot be explained as natural phenomena, Swedish aircraft, or imagination.” The argument explains the costume. Whether it explains the body is a separate question, and this figure does not settle it.</span><span class="fg-src">Bloecher, <i>Report on the UFO Wave of 1947</i> (1967) · Kottmeyer, “The Saucer Error” (1993) · Peebles, <i>Watch the Skies!</i> (1994) · Swedish Defence Staff (1946) · Joint DoD/DHS/FAA/FBI statement, 16 Dec 2024</span></figcaption></figure><figure class="fg fg-wide" id="fig-disposition"><div class="fg-frame"><div class="fg-scroll"><svg class="fg-svg" viewBox="0 0 620 300" role="img" preserveAspectRatio="xMidYMid meet" aria-labelledby="figdp-t figdp-d"><title id="figdp-t">What unresolved means in the UAP case record</title><desc id="figdp-d">A bar showing the disposition of all 757 reports in AARO's fiscal year 2024 reporting period: 49 resolved, 243 recommended for closure, 444 placed in an archive for lacking sufficient data to analyse, and 21 judged to merit further analysis. The 444 are routinely counted as unexplained; the office's own definition makes them a statement about the data rather than about the object.</desc><g class="fg-g"><rect class="fg-seg" data-k="1" x="30" y="92" width="34.75" height="46" rx="4" style="--i:0"/><text class="fg-t fg-tseg" data-k="1" x="48.12" y="119" text-anchor="middle">49</text><rect class="fg-seg" data-k="1" x="66.25" y="92" width="178.26" height="46" rx="4" style="--i:1"/><text class="fg-t fg-tseg" data-k="1" x="156.13" y="119" text-anchor="middle">243</text><rect class="fg-seg" data-k="0" x="246.01" y="92" width="326.95" height="46" rx="4" style="--i:2"/><text class="fg-t fg-tseg" data-k="0" x="410.24" y="119" text-anchor="middle">444</text><rect class="fg-seg" data-k="2" x="574.46" y="92" width="14.04" height="46" rx="4" style="--i:3"/><text class="fg-t fg-tlab" x="30" y="74" text-anchor="start">AARO, FY2024: 757 reports received</text><rect class="fg-seg" data-k="1" x="30" y="170" width="11" height="11" rx="2.5"/><text class="fg-t fg-tsm" x="49" y="179" text-anchor="start">49: resolved</text><rect class="fg-seg" data-k="1" x="30" y="189" width="11" height="11" rx="2.5"/><text class="fg-t fg-tsm" x="49" y="198" text-anchor="start">243: recommended for closure</text><rect class="fg-seg" data-k="0" x="30" y="208" width="11" height="11" rx="2.5"/><text class="fg-t fg-tsm" x="49" y="217" text-anchor="start">444, archived, insufficient data</text><rect class="fg-seg" data-k="2" x="30" y="227" width="11" height="11" rx="2.5"/><text class="fg-t fg-tsm" x="49" y="236" text-anchor="start">21: merit further analysis</text><line class="fg-lead" x1="410.24" y1="138" x2="382" y2="250"/><g class="fg-co"><circle cx="382" cy="250" r="7.6"/><text x="382" y="253.1" text-anchor="middle">1</text></g><text class="fg-t fg-tsm" x="396" y="253" text-anchor="start">usually counted as “unexplained”</text><text class="fg-t fg-tsm" x="30" y="40" text-anchor="start">resolved cases were balloons, birds, drones, satellites and aircraft</text></g></svg></div><ol class="fg-key"><li><span class="fg-kn">1</span>AARO defines an archived case as one with “insufficient data to assess whether the performance characteristics of the underlying event are consistent with those of natural phenomena or exceed the known state-of-the-art.” That is a statement about the record, not about the object</li></ol><div class="fg-photo" hidden></div></div><figcaption class="fg-cap"><span class="fg-num">Fig. 10</span><span class="fg-title">What “unresolved” means in the case record</span><span class="fg-note">The four numbers sum to 757 exactly, which is a useful internal check on a literature where figures are often quoted loosely. The distinction that matters is the third bar. A case enters the archive because there is not enough data to analyse it, not because analysis was done and failed. Roughly a thousand of AARO's two thousand-odd cases sit there. The office's own director put the genuinely anomalous fraction at “less than single-digit percentages”. Both of the usual readings are wrong: “hundreds of cases defy explanation” inflates it, and “everything has been explained” is not claimed by anyone at AARO either.</span><span class="fg-src">AARO FY2024 Consolidated Annual Report (14 Nov 2024) · Kirkpatrick, NASA public meeting, 31 May 2023 · ODNI Preliminary Assessment (25 June 2021)</span></figcaption></figure><details class="srcs"><summary>Sources for this case (12)</summary><ol><li>von Däniken E. (1968). Erinnerungen an die Zukunft: Ungelöste Rätsel der Vergangenheit. Econ Verlag.</li><li>Tallet P. (2017). Les papyrus de la mer Rouge I: le journal de Merer. Institut français d&#x27;archéologie orientale.</li><li>Tallet P., Lehner M. (2021). The Red Sea Scrolls: How Ancient Papyri Reveal the Secrets of the Pyramids. Thames and Hudson.</li><li>Ghoneim E. et al. (2024). The Egyptian pyramid chain was built along the now abandoned Ahramat Nile Branch. Communications Earth and Environment 5. <a href="https://doi.org/10.1038/s43247-024-01379-7" target="_blank" rel="noopener">doi:10.1038/s43247-024-01379-7</a></li><li>Sakai M. et al. (2024). AI-accelerated Nazca survey nearly doubles the number of known figurative geoglyphs and sheds light on their purpose. PNAS 121(40): e2407652121. <a href="https://doi.org/10.1073/pnas.2407652121" target="_blank" rel="noopener">doi:10.1073/pnas.2407652121</a></li><li>Morishima K. et al. (2017). Discovery of a big void in Khufu&#x27;s Pyramid by observation of cosmic-ray muons. Nature 552: 386–390. <a href="https://doi.org/10.1038/nature24647" target="_blank" rel="noopener">doi:10.1038/nature24647</a></li><li>Vranich A. (2018). Reconstructing ancient architecture at Tiwanaku, Bolivia: the potential and promise of 3D printing. Heritage Science 6: 65. <a href="https://doi.org/10.1186/s40494-018-0231-0" target="_blank" rel="noopener">doi:10.1186/s40494-018-0231-0</a></li><li>Aveni A. F. (ed.) (1990). The Lines of Nazca. American Philosophical Society.</li><li>Reinhard J. (1996). The Nazca Lines: A New Perspective on their Origin and Meaning. Los Pinos.</li><li>Schele L., Freidel D. (1990). A Forest of Kings: The Untold Story of the Ancient Maya. William Morrow.</li><li>Lehner M. (1997). The Complete Pyramids. Thames and Hudson.</li><li>Feder K. L. (2020). Frauds, Myths, and Mysteries: Science and Pseudoscience in Archaeology, 10th ed. Oxford University Press.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-ancient-astronauts" data-t="Ancient Astronauts: Credit Where Credit Is Due"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Ancient Astronauts: Credit Where Credit Is Due</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-ancient-astronauts</span> (updated 28 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-flood-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="British Museum Flood Tablet 1.jpg" data-cap="The Flood Tablet, British Museum" data-big><figcaption></figcaption></figure><div class="sh-k">Peoples of the Sacred Texts</div><h2 class="sh-t" id="case-flood-st" tabindex="-1">The Flood: One Story, Many Waters</h2><p class="sh-s">Noah, Utnapishtim, Manu, Deucalion and Yu: humanity remembers a drowning. The rocks agree the water was real, but it came in many floods.</p><div class="sh-v"><span class="vstamp vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><p class="sh-claim"><b>What the stamp rates:</b> The world&#x27;s flood stories preserve a shared memory of the rising seas and outburst floods at the end of the last Ice Age.</p><p class="sh-claim"><b>The text's own words:</b> <span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span> <span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span> <span class="sh-more">(line by line below)</span></p></div><p class="v4-q">Do the world&#x27;s flood stories remember real floods, and which ones?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Flood stories are told across the world, and the oldest written ones are Mesopotamian, sharing a warned hero, a boat and released birds with Genesis.</li><li>A single flood covering all land in human times is contradicted by every continuous natural archive.</li><li>Yet the floods at the end of the Ice Age were real and enormous: seas rose 120 metres, and glacial lakes burst dozens of times.</li><li>Aboriginal stories show a memory of drowned coasts can last 7,000 years.</li><li>Some stories may remember those waters; a single shared origin is unproved, and the accounts in scripture are not what is rated.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Geology</span><span class="thr">Climate</span><span class="thr">Texts and scripts</span><span class="thr">Religion and myth</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="120" >120</b><span class="ctr-u"> m</span></div><div class="ctr-l">global sea-level rise since the Ice Age maximum</div><div class="ctr-c">Lambeck et al. 2014</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="20" >20</b><span class="ctr-u"> m</span></div><div class="ctr-l">sea-level jump in a few centuries during Meltwater Pulse 1A (estimates c. 14–25 m)</div><div class="ctr-c">Deschamps et al. 2012</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="40" >40</b><span class="ctr-u"> floods</span></div><div class="ctr-l">outbursts of Glacial Lake Missoula, c. 15,000–13,000 years ago</div><div class="ctr-c">Waitt 1980</div></div><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="7000" >7,000</b><span class="ctr-u"> years</span></div><div class="ctr-l">age of drowned coastlines remembered in Aboriginal Australian stories</div><div class="ctr-c">Nunn and Reid 2016</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The world&#x27;s flood stories preserve a shared memory of the rising seas and outburst floods at the end of the last Ice Age.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:41.7%" role="img" aria-label="Weight of evidence: Open question"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Two things are clear. A single flood covering all land in human times is contradicted by every continuous natural archive, and the post-glacial floods were real and enormous. The open question is the bridge between them. Nunn and Reid show that oral memory of drowned coasts can last 7,000 years in Australia, which makes the Ice Age reading possible. But the best-documented flood family, the Near Eastern one, is tied to Mesopotamian river floods, and most other traditions cannot be dated. Plausible in places, unproved as a shared origin.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks confidently file flood stories under local floods and literary borrowing, and for the Genesis and Mesopotamian family that is well supported. They have been too quick to assume that oral memory fades within a few centuries. Research on Aboriginal Australian traditions suggests otherwise, so the Ice Age reading deserves more than a footnote, even though it remains unproved.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>The oldest written flood stories are Mesopotamian: Ziusudra in Sumerian, Atrahasis (tablets copied c. 1646–1626 BCE) and Utnapishtim in Tablet XI of Gilgamesh. They share a warned hero, a boat, released birds and a sacrifice with Genesis 6–9.<small>Lambert and Millard 1969; George 2003</small></li><li>As the last Ice Age ended, global sea level rose by about 120 m. During Meltwater Pulse 1A, around 14,600 years ago, it rose roughly 14–25 m (estimates vary by study) in a few centuries.<small>Lambeck et al. 2014; Deschamps et al. 2012</small></li><li>Glacial Lake Missoula burst through its ice dam 40 or more times between about 15,000 and 13,000 years ago, scouring the Channeled Scablands of Washington State.<small>Bretz 1923; Waitt 1980</small></li><li>A flood deposit at Shuruppak, the city the Mesopotamian texts name as the flood hero&#x27;s home, dates to about 2900 BCE; flood layers at Ur and Kish fall at different dates.<small>Schmidt 1931; Mallowan 1964</small></li><li>No continuous natural archive (Greenland ice layers counted back some 60,000 years, tree rings, lake sediments) shows a single flood covering all land within human times.<small>Svensson et al. 2008</small></li><li>Oral traditions can carry landscape memories for thousands of years: Aboriginal Australian stories describe coastlines that drowned more than 7,000 years ago.<small>Nunn and Reid 2016</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the Black Sea refilled catastrophically from the Mediterranean (Ryan and Pitman: c. 7,600 years ago, later revised to c. 8,800) or rose gently, and whether any memory of it survives.</li><li>Why flood stories are so widespread: shared memory of the end of the Ice Age, many independent local floods, or later spread of one literary tradition (including missionary influence on recorded versions).</li><li>Whether the Younger Dryas cold snap began with a cosmic impact that also released floods, as the Comet Research Group argues; most specialists remain unconvinced.</li><li>Whether the Quranic flood should be read as universal or as confined to Noah&#x27;s own people; Muslim scholars have discussed both readings.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>The coastlines where Ice Age people most likely lived now lie up to about 120 m under water, and very little of that drowned land has been surveyed.</li><li>Everything before writing is lost: we meet the flood stories only after about 2000 BCE, long after the great deglacial floods.</li><li>Many flood stories from the Americas, Africa and the Pacific were written down after contact with missionaries, which makes their pre-contact form hard to recover.</li></ul></div></div><h3 class="sub-h wsub">How the traditions tell it</h3><div class="v4texts"><blockquote class="quote v4q"><span class="v4q-t">Hebrew Bible · Genesis 7:11</span><p>on that day all the fountains of the great deep burst forth, and the windows of the heavens were opened.</p><cite>NRSV, Anglicised edition</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Quran · 54:11–12</span><p>So We opened the gates of the sky with torrential water, burst the earth with gushing springs: the waters met for a preordained purpose.</p><cite>trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Quran · 11:44</span><p>Then it was said, &#x27;Earth, swallow up your water, and sky, hold back,&#x27; and the water subsided, the command was fulfilled. The Ark settled on Mount Judi, and it was said, &#x27;Gone are those evildoing people!&#x27;</p><cite>trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Vedic (Shatapatha Brahmana) · 1.8.1.6</span><p>The flood then swept away all these creatures, and Manu alone remained here.</p><cite>trans. Julius Eggeling (1882)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Chinese (Shujing, Canon of Yao) · Canon of Yao</span><p>In their vast extent they embrace the hills and overtop the great heights, threatening the heavens with their floods</p><cite>trans. James Legge (1865)</cite></blockquote></div><h3 class="sub-h wsub">In the text's own words</h3><p class="rd-rule">Each line rates only what the text itself says, not later dates, commentaries or modern identifications.</p><ul class="rds"><li class="rd"><p class="rd-s">A flood of rain from the sky and water bursting from the ground destroyed Noah&#x27;s people (Quran 54:11–12; 11:44; Genesis 7:11).</p><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span><p class="rd-n">The Quran names a people, not the whole world, and gives no date. Catastrophic floods that wiped out whole communities are well recorded: flood layers at Ur, Kish and Shuruppak, meltwater outbursts and rising seas at the end of the Ice Age.</p></li><li class="rd"><p class="rd-s">The waters rose above all the high mountains under the whole heaven (Genesis 7:19–20).</p><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span><p class="rd-n">Read as one worldwide flood a few thousand years ago, the geological record does not allow it. Many Jewish and Christian readers take &#x27;the earth&#x27; here as the known land, which returns the question to the regional reading above.</p></li></ul><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Most historians and geologists read the flood stories as the literature of peoples who lived beside dangerous water. The Near Eastern versions form one family: Genesis and the later traditions share plot details with Mesopotamian tablets that are centuries older. Elsewhere, flood tales arise independently wherever rivers, coasts and tsunamis threaten, which is almost everywhere. Geology rules out a single flood that covered all land within human history, but it records plenty of big regional floods that could have seeded memories.</p><ul><li>Southern Iraq is a flat floodplain where one great Tigris or Euphrates flood could erase a city&#x27;s known world.</li><li>The Mesopotamian flood tablets predate the written Genesis account and share distinctive details such as the birds released to find land.</li><li>Flood stories cluster where floods are common, so their spread needs no single event.</li><li>Ice cores, tree rings and lake sediments show no break for a planet-wide deluge.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>The end of the Ice Age was the greatest age of floods humans ever lived through. Seas rose about 120 m, ice-dammed lakes burst in torrents larger than all the world&#x27;s rivers combined, and coastal plains where people lived vanished within lifetimes. Hancock and Carlson argue that the flood myths, with their fountains of the deep, rains from heaven and survivors carrying knowledge to high ground, remember this real catastrophe, perhaps sharpened by the abrupt Younger Dryas cold. Ryan and Pitman proposed the Black Sea&#x27;s sudden refill as one specific memory.</p><ul><li>Rapid pulses of sea-level rise drowned coastlines that were the best places to live during the Ice Age.</li><li>J Harlen Bretz&#x27;s catastrophic Missoula floods were dismissed for decades before geologists accepted them, a warning against ruling out big floods.</li><li>Oral traditions demonstrably preserve memories of drowned coasts over thousands of years.</li></ul><div class="face-s"><b>Its strongest point</b><p>Nunn and Reid (2016) matched 21 Aboriginal Australian stories to coastlines drowned by post-glacial sea rise more than 7,000 years ago, showing that memories of rising seas can survive in oral tradition far longer than historians once assumed.</p></div><p class="face-cr"><b>Credit</b> Graham Hancock; Randall Carlson; William Ryan and Walter Pitman</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Underwater archaeology on drowned shelves (the Persian Gulf basin, Sundaland, the Black Sea shelf) that finds settlements overwhelmed by rapid sea rise.</li><li>Well-dated sediment cores from the Persian Gulf floor showing exactly when and how fast it flooded.</li><li>A catalogue of flood stories recorded before missionary contact, coded by motif and tested against each region&#x27;s own flood history.</li><li>New Bosporus and Black Sea shelf cores that settle whether the refill was a torrent or a slow rise.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">6 min read · 1,385 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of The Flood: One Story, Many Waters"><button type="button" class="wtoc-i" data-go="flood-s1">A tablet that made a man undress</button><button type="button" class="wtoc-i" data-go="flood-s2">How each tradition tells it</button><button type="button" class="wtoc-i" data-go="flood-s3">What the rocks remember</button><button type="button" class="wtoc-i" data-go="flood-s4">The case for an Ice Age memory</button><button type="button" class="wtoc-i" data-go="flood-s5">Where the argument gets harder</button><button type="button" class="wtoc-i" data-go="flood-s6">What would settle it</button></nav></div><section class="wsec" id="flood-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A tablet that made a man undress</h3><p>London, 1872. George Smith, a self-taught assistant at the British Museum, is reading a clay tablet from the ruins of Nineveh when he finds a ship stranded on a mountain and a dove sent out to look for land. A colleague later recalled that Smith was so excited he began to take off his clothes. He had found a Babylonian flood story, older than any written copy of Genesis, and it told almost the same tale.</p><p>That shock has never quite worn off. A god or gods decide to end the world with water. One righteous man is warned. He builds a vessel, loads his family and living creatures, rides out the deluge, sends out birds, lands on a mountain and offers thanks. The Babylonians called him Utnapishtim or Atrahasis, the Sumerians Ziusudra. The Hebrew Bible calls him Noah, and the Quran Nuh. In India, Manu is warned by a fish. In Greece, Deucalion and Pyrrha survive in a chest. In China the story turns: Yu the Great does not escape the flood, he tames it.</p><blockquote class="quote"><p>on that day all the fountains of the great deep burst forth, and the windows of the heavens were opened.</p><cite>Genesis 7:11, NRSV (Anglicised edition)</cite></blockquote><p>So the question at the heart of this case is simple and enormous. Are these stories memories? And if so, of what?</p></section><section class="wsec" id="flood-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>How each tradition tells it</h3><p>The Mesopotamian versions are the oldest on clay. Atrahasis survives on tablets copied around 1646–1626 BCE. The gods send the flood because noisy humanity disturbs their rest, and the wise god Ea warns his favourite to tear down his house and build a boat. In a tablet published by Irving Finkel of the British Museum in 2014, the boat is a giant round coracle of rope and bitumen, a very Mesopotamian vessel.</p><p>Genesis gives the flood a moral cause, human violence, and describes it as universal: the waters covered all the high mountains under the whole heaven. The Quran tells the story in several places, and its emphasis is different again. Nuh is sent to his own people and preaches to them for a very long time. They mock him as he builds, and the flood comes when the command arrives. Surah Hud (11:25–49) gives the most detailed account, from the building of the Ark to its landing on al-Judi, and Surah Nuh (71) is devoted to his preaching.</p><blockquote class="quote"><p>So We opened the gates of the sky with torrential water, burst the earth with gushing springs: the waters met for a preordained purpose.</p><cite>Quran 54:11–12, trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><p>Because the Quran frames Nuh&#x27;s mission as being to his people (71:1), Muslim scholars have long discussed whether the flood covered the whole earth or the land of those people. Many classical commentators took it as universal; others, especially in modern times, read it as regional. The text itself can carry either reading, which matters, because a regional flood is exactly what geology can test.</p><p>Beyond the Near East, the Shatapatha Brahmana tells how Manu raised a small fish that grew huge and towed his ship to a northern mountain. Greek writers told of Deucalion. The Chinese Classic of Documents describes waters that overtop the hills, which Yu drains over thirteen years by cutting channels. The skeleton is shared, the flesh is local.</p></section><section class="wsec" id="flood-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>What the rocks remember</h3><p>Geology gives a firm answer to one version of the question. There is no sign of a single flood that covered every continent within human times. Greenland&#x27;s ice holds annual layers counted back some 60,000 years without a break, and trees, lakes and cave deposits tell the same story. But the rocks record something almost as dramatic: an age of floods.</p><figure class="wx wx--static" id="flood-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Twenty thousand years of rising water</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Twenty thousand years of rising water"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 512" class="wx-svg" role="img" aria-labelledby="flood-f1-t"><title id="flood-f1-t">Global sea level over the last 20,000 years with the major floods, and a lower lane showing when the written flood stories appear</title><defs>
