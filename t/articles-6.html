<script type="text/x-tpl" id="case-ooparts-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Ica stones3.JPG" data-cap="One of the engraved Ica stones, Peru" data-big><figcaption></figcaption></figure><div class="sh-k">Mysteries of the Earth</div><h2 class="sh-t" id="case-ooparts-st" tabindex="-1">Out-of-Place Artefacts: Impossible Objects on Trial</h2><p class="sh-s">A hammer in stone, a spark plug in a geode, grooved spheres three billion years old. What happened when each impossible object was tested?</p><div class="sh-v"><span class="vstamp vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><p class="sh-claim"><b>What the stamp rates:</b> At least one of these objects is a manufactured artefact older than humankind.</p></div><p class="v4-q">Are there manufactured objects older than humankind?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Objects said to be impossibly old: metal spheres in 3-billion-year-old rock, a hammer in stone, a spark plug in a &#x27;geode&#x27;.</li><li>The spheres are natural mineral concretions; only the rock around them is old.</li><li>The hammer matches late-1800s American hammers and was never documented in a dated layer.</li><li>The &#x27;geode&#x27; is a 1920s Champion spark plug inside a rusty lump.</li><li>No object of this kind has ever been found in place in a dated layer, which is what the claim would need.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Geology</span><span class="thr">Chemistry</span><span class="thr">Archaeology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="3" >3</b><span class="ctr-u"> billion years</span></div><div class="ctr-l">age of the rock around the Klerksdorp spheres</div><div class="ctr-c">Heinrich 2008</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="500000" >500,000</b><span class="ctr-u"> years</span></div><div class="ctr-l">age once claimed for the Coso spark plug</div><div class="ctr-c">Stromberg &amp; Heinrich 2004</div></div><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="11000" >11,000</b><span class="ctr-u"> stones</span></div><div class="ctr-l">in Cabrera&#x27;s collection by the late 1970s</div><div class="ctr-c">Polidoro 2002</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="3.3" data-dec="1">3.3</b><span class="ctr-u"> million years</span></div><div class="ctr-l">age of the oldest known stone tools</div><div class="ctr-c">Harmand et al. 2015</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>At least one of these objects is a manufactured artefact older than humankind.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">For each object tested, the evidence points the other way. The Klerksdorp spheres are natural mineral concretions, and their age is real only because the rock is old. The London hammer and the Coso spark plug are recognisable modern products inside young concretions, with no documented link to ancient strata. The Ica dinosaur stones were carved in the twentieth century, as a carver described and investigators examined. No object in this group has been found in place in a dated layer, which is what the claim would require.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks mostly ignore out-of-place artefacts, and scientists who mention them treat the ordinary explanations as settled. On the specific objects here, that confidence matches the evidence. The gap is one of manner: objects went untested for years while their fame grew, and the silence let the claims run. Showing the tests, as for the Coso plug, has done more than dismissal ever did.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>The Klerksdorp spheres come from pyrophyllite deposits near Ottosdal, South Africa, about 3 billion years old; they are hematite and wollastonite concretions with Mohs hardness of about 4–5, not nickel-steel.<small>Heinrich 2008</small></li><li>The London hammer, found in 1936 near London, Texas, is embedded in a limey concretion and matches the style of American hammers of the late nineteenth century; it was never documented in a dated rock layer.<small>Kuban; Heinrich</small></li><li>The Coso artefact, found in 1961 near Olancha, California, was identified from X-rays as a 1920s Champion spark plug inside an iron-rich concretion, not a geode.<small>Stromberg &amp; Heinrich 2004</small></li><li>Basilio Uschuya, a farmer from the Ica region, said he carved many Ica stones, copying dinosaurs from comics and magazines and ageing them with dung and shoe polish; a 1977 BBC Horizon programme examined the engravings.<small>Polidoro 2002; BBC 1977</small></li><li>The oldest known stone tools date to about 3.3 million years ago, and Homo sapiens to about 300,000 years ago.<small>Harmand et al. 2015; Hublin et al. 2017</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether every Ica stone is modern, since engraved stones may also have been made in pre-Hispanic times; the dinosaur scenes, though, match twentieth-century images of dinosaurs.</li><li>What the so-called Baghdad battery jars were for, which remains unknown, though they are about 2,000 years old, not prehistoric.</li><li>How mainstream science should respond to anomaly claims: ignore them, or test each one publicly.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Most famous out-of-place objects were never found in a recorded excavation, so their original position in the rock is lost for good.</li><li>Several claimed anomalies survive only as stories, photographs or lost specimens that cannot be retested.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Geologists and archaeologists who examined these objects found ordinary explanations. Concretions, hard nodules of minerals cemented around a core, form in years to millions of years and can trap anything from a fossil to a spark plug. The Klerksdorp spheres are ancient but natural; the London hammer and the Coso object are modern tools caught in young concretions; the Ica dinosaur stones were carved in the twentieth century. None came from a recorded position in dated rock, which is the one thing that could make an object genuinely out of place.</p><ul><li>Concretions can grow around modern objects within decades or centuries.</li><li>Style dating identifies the hammer and the spark plug as nineteenth- and twentieth-century products.</li><li>Mineral analysis shows the spheres are soft, porous iron and calcium minerals with internal radial structure.</li><li>A carver demonstrated how the Ica stones were made.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>The challengers argue that science filters its evidence. Objects that do not fit the accepted timeline, they say, are dismissed or ignored rather than studied, so the record looks tidier than it is. Michael Cremo and Richard Thompson catalogued hundreds of reported anomalies in Forbidden Archeology, arguing for a much longer human past. Carl Baugh presented the London hammer as a pre-Flood relic, and the physician Javier Cabrera assembled thousands of Ica stones he believed showed an ancient humanity that lived alongside dinosaurs.</p><ul><li>Scientific timelines of human ability have been pushed back many times, from stone tools to seafaring to art.</li><li>Some anomalies were reported by miners and quarrymen in the nineteenth century, before modern hoaxing motives.</li><li>Dismissal without examination breeds suspicion; several objects were only tested decades after they became famous.</li></ul><div class="face-s"><b>Its strongest point</b><p>The mainstream has been wrong about the age of human abilities before: stone tools now reach back 3.3 million years, older than the genus Homo was thought to be. Anomalies deserve testing, not ridicule.</p></div><p class="face-cr"><b>Credit</b> Ivan T. Sanderson (coined &#x27;OOPArt&#x27;); Michael Cremo and Richard Thompson (Forbidden Archeology, 1993); Carl Baugh; Javier Cabrera</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>An object found in place, in a recorded excavation, within a dated rock layer, with the layer undisturbed around it.</li><li>Independent laboratory analysis of material, manufacturing traces and any organic parts that can be radiocarbon dated.</li><li>Publication of the find with photographs of its position before removal, and access for other researchers.</li><li>For the Ica stones, microscopic study of the grooves for modern tool marks and for weathering inside the cuts.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,156 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Out-of-Place Artefacts: Impossible Objects on Trial"><button type="button" class="wtoc-i" data-go="ooparts-s1">Objects that should not exist</button><button type="button" class="wtoc-i" data-go="ooparts-s2">The spheres from three billion years ago</button><button type="button" class="wtoc-i" data-go="ooparts-s3">A hammer and a spark plug in stone</button><button type="button" class="wtoc-i" data-go="ooparts-s4">The Ica stones</button><button type="button" class="wtoc-i" data-go="ooparts-s5">The challengers&#x27; best argument</button><button type="button" class="wtoc-i" data-go="ooparts-s6">What is genuinely strange</button><button type="button" class="wtoc-i" data-go="ooparts-s7">What would settle it</button></nav></div><section class="wsec" id="ooparts-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Objects that should not exist</h3><p>Imagine splitting a rock on a hillside and finding a machine part inside. That is the scene behind a small group of famous objects that the naturalist Ivan Sanderson called out-of-place artefacts, or OOParts: things that seem to be in the wrong time. A hammer sealed in stone in Texas. A spark plug in a &#x27;geode&#x27; in California. Grooved metal-looking spheres mined from rock three billion years old in South Africa. Engraved stones from Peru showing people riding dinosaurs.</p><p>Each looked, at first, like a crack in the story of the human past. If a manufactured object were truly found inside rock older than humankind, the whole timeline of our species would need rewriting. The stakes are high, and that is exactly why each object has to be tested, one by one.</p><blockquote class="wpull"><p>One genuine tool sealed in ancient rock would change everything. That is why the question deserves a real test, not a sneer.</p></blockquote></section><section class="wsec" id="ooparts-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The spheres from three billion years ago</h3><p>Miners working pyrophyllite, a soft rock sold as &#x27;wonderstone&#x27;, near Ottosdal in South Africa have long found small spheres and discs, some with a groove or ridge running round them like the equator on a globe. The rock around them is about three billion years old, formed long before any complex life. Stories grew: the spheres were nickel-steel, harder than steel, balanced to within a hundred-thousandth of an inch, and one in a museum case was said to turn by itself.</p><p>Tested, the stories fell away. The spheres are made of hematite and wollastonite, with Mohs hardness of about 4 to 5, softer than steel. Broken open, they show a radial internal structure like other mineral concretions. The grooves follow fine layers in the original volcanic sediment, where growth slowed. The museum curator, Roelf Marx, explained that vibrations from blasting in local mines shook the display case. The spheres really are about three billion years old; they are also entirely natural.</p></section><section class="wsec" id="ooparts-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>A hammer and a spark plug in stone</h3><p>In 1936 Max and Emma Hahn picked up a rock with a piece of wood sticking out near London, Texas. When it was later broken open, it held an iron hammerhead on a partly coalified handle. Carl Baugh of the Creation Evidence Museum acquired it and presented it as a relic from before the Flood, arguing that the rock was Cretaceous or older.</p><p>But the hammer was never documented in place in a rock layer; it was a loose stone. Its shape matches American miners&#x27; hammers of the late nineteenth century. And the rock is a concretion of the kind that forms around objects in mineral-rich water. The Coso artefact, found by three rockhounds near Olancha, California, in 1961, told the same story more clearly. The finders thought it a geode, and an unnamed geologist was said to have estimated its age at 500,000 years. X-rays showed a porcelain insulator, a metal core and a spring, and spark plug collectors recognised a 1920s Champion plug, of the type used in Ford Model T and Model A engines.</p><p>A cousin of these finds is the Meister print. In 1968 a collector named William Meister split a slab of Cambrian shale near Antelope Spring, Utah, roughly 500 million years old, and found a shape like a sandal print with trilobites inside it. The geologist William Lee Stokes examined it and concluded it was a natural spall, a flake that breaks away along joints in the rock, and that the shape lacks the features a real footprint pressed into soft mud would show.</p><figure class="wx wx--steps" id="ooparts-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">How a modern tool ends up in stone</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How a modern tool ends up in stone"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" class="wx-svg" role="img" aria-labelledby="ooparts-f2-t"><title id="ooparts-f2-t">How a modern object ends up inside a rock: a concretion forms in years to centuries</title><text x="24" y="26" class="wx-t-cap">A creek bed in section · schematic</text><rect x="20" y="250" width="680" height="120" class="wx-sand"/><rect x="20" y="224" width="680" height="26" class="wx-water wx-o60"/><path d="M20,224 L700,224" class="wx-flow wx-s2"/><rect x="20" y="320" width="680" height="50" class="wx-rock wx-o60"/><text x="690" y="350" text-anchor="end" class="wx-t-s">older bedrock with fossils</text><g class="wx-st wx-hide" data-s="3"><ellipse cx="300" cy="280" rx="62" ry="30" class="wx-stone2 wx-edge"/></g><g class="wx-st wx-hide" data-s="4"><ellipse cx="300" cy="280" rx="72" ry="36" class="wx-stone3 wx-edge"/><ellipse cx="300" cy="280" rx="62" ry="30" class="wx-stone2"/><path d="M245,266 a5,5 0 1,1 10,0 Z" class="wx-paper wx-edge-soft"/><path d="M335,300 a5,5 0 1,1 10,0 Z" class="wx-paper wx-edge-soft"/><path d="M275,306 a5,5 0 1,1 10,0 Z" class="wx-paper wx-edge-soft"/></g><g class="wx-st" data-s="1"><rect x="260" y="277" width="70" height="7" rx="2" class="wx-wood wx-edge"/><rect x="328" y="268" width="16" height="24" rx="2" class="wx-metal wx-edge"/><circle cx="32" cy="58" r="9" class="wx-num"/><text x="32" y="62" text-anchor="middle" class="wx-numt">1</text><text x="48" y="62" class="wx-t-b">An object is lost</text><text x="48" y="77" class="wx-t-s">a tool drops into a creek bed</text></g><g class="wx-st" data-s="2"><path d="M220,232 L226,262" class="wx-thin wx-s2"/><path d="M242,232 L248,262" class="wx-thin wx-s2"/><path d="M264,232 L270,262" class="wx-thin wx-s2"/><path d="M286,232 L292,262" class="wx-thin wx-s2"/><path d="M308,232 L314,262" class="wx-thin wx-s2"/><path d="M330,232 L336,262" class="wx-thin wx-s2"/><path d="M352,232 L358,262" class="wx-thin wx-s2"/><path d="M374,232 L380,262" class="wx-thin wx-s2"/><circle cx="232" cy="118" r="9" class="wx-num"/><text x="232" y="122" text-anchor="middle" class="wx-numt">2</text><text x="248" y="122" class="wx-t-b">Mineral-rich water soaks in</text><text x="248" y="137" class="wx-t-s">iron rusts; dissolved lime seeps</text></g><g class="wx-st" data-s="3"><circle cx="472" cy="58" r="9" class="wx-num"/><text x="472" y="62" text-anchor="middle" class="wx-numt">3</text><text x="488" y="62" class="wx-t-b">A hard shell grows</text><text x="488" y="77" class="wx-t-s">minerals cement the sand</text><text x="488" y="91" class="wx-t-s">around it, in years to centuries</text></g><g class="wx-st" data-s="4"><circle cx="472" cy="138" r="9" class="wx-num"/><text x="472" y="142" text-anchor="middle" class="wx-numt">4</text><text x="488" y="142" class="wx-t-b">It looks ancient</text><text x="488" y="157" class="wx-t-s">fossils eroded from older rock</text><text x="488" y="171" class="wx-t-s">can end up in the shell</text></g><g class="wx-st wx-hide" data-only="5"><line x1="306" y1="240" x2="294" y2="320" class="wx-bold wx-s4"/></g><g class="wx-st" data-s="5"><circle cx="32" cy="350" r="9" class="wx-num wx-halo"/><text x="32" y="354" text-anchor="middle" class="wx-numt">5</text><text x="48" y="354" class="wx-t-b wx-halo">Cracked open: a modern tool "in stone"</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> An object is lost: a tool drops into a creek bed.</p><ol class="wx-steplist"><li>An object is lost: a tool drops into a creek bed.</li><li>Mineral-rich groundwater soaks the sediment; the iron starts to rust.</li><li>Minerals cement the sand into a hard shell, in years to centuries.</li><li>The nodule looks ancient; fossils eroded from older rock can end up in it.</li><li>Someone cracks it open: a modern tool &#x27;in stone&#x27;.</li></ol><figcaption>Concretions can form around lost objects in years to centuries, which is why a rock around an object says nothing about its age. <span class="wx-src">Based on: Concretion formation as described by Heinrich 2008 and Stromberg &amp; Heinrich 2004. Schematic, not to scale.</span></figcaption><p class="vh">A section through a creek bed with flowing water above sand and older fossil-bearing bedrock below. Step 1: a hammer lies in the sand. Step 2: thin lines show mineral-rich water soaking down around it. Step 3: a pale oval shell of cemented sand forms around the hammer. Step 4: the shell thickens and darkens, with small fossil shells caught in it, labelled it looks ancient. Step 5: a red crack splits the nodule, labelled cracked open, a modern tool in stone.</p></figure><aside class="wcall"><b>How do we know?</b><p>A concretion is a hard lump that forms when minerals dissolved in groundwater precipitate around a core, cementing the surrounding sand or mud. Iron objects help, because rust releases iron that cements quickly. Under the right conditions a solid shell can form in decades. So a rock around an object gives no age by itself; only the undisturbed layer it was found in can do that.</p></aside></section><section class="wsec" id="ooparts-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The Ica stones</h3><p>In 1966 the Peruvian physician Javier Cabrera received an engraved stone as a birthday present. By the late 1970s he had more than 11,000, and eventually many more: grey andesite boulders scratched with scenes of people using telescopes, performing heart surgery and hunting dinosaurs. Cabrera believed they recorded an ancient humanity with advanced knowledge that lived alongside the great reptiles.</p><p>The source was closer to home. Basilio Uschuya, a farmer from the region, said he carved the stones, copying images from comics and magazines, and aged them by baking them in dung and rubbing them with shoe polish. Selling genuine antiquities was illegal in Peru, which gave him a reason to insist they were modern. A 1977 BBC Horizon programme examined the stones, and later observers noted that the dinosaurs look like mid-twentieth-century reconstructions, with upright postures and dragging tails that palaeontologists have since abandoned. Engraved stones may also exist from earlier periods in Peru; the dinosaur stones are what the modern evidence explains.</p></section><section class="wsec" id="ooparts-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The challengers&#x27; best argument</h3><p>The strongest case for taking OOParts seriously is not about any single object. It is that science has repeatedly underestimated our ancestors. Stone tools from Lomekwi in Kenya, published in 2015, date to about 3.3 million years ago, older than the genus Homo was thought to be. Human arrival in the Americas, the age of seafaring and the minds of Neanderthals have all been revised. Michael Cremo and Richard Thompson argued in Forbidden Archeology that anomalous finds were filtered out of the record because they did not fit.</p><figure class="wx wx--static" id="ooparts-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">Claimed age versus tested age</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Claimed age versus tested age"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" class="wx-svg" role="img" aria-labelledby="ooparts-f1-t"><title id="ooparts-f1-t">Claimed age versus tested age for four famous out-of-place artefacts, on a logarithmic scale</title><defs><marker id="ooparts-f1-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" class="wx-accfill"/></marker></defs><text x="24" y="26" class="wx-t-cap">Years ago · logarithmic scale</text><line x1="150" y1="370" x2="690" y2="370" class="wx-line"/><line x1="150.0" y1="370" x2="150.0" y2="376" class="wx-line"/><line x1="210.0" y1="370" x2="210.0" y2="376" class="wx-line"/><text x="210.0" y="392" text-anchor="middle" class="wx-t-s">100</text><line x1="270.0" y1="370" x2="270.0" y2="376" class="wx-line"/><line x1="330.0" y1="370" x2="330.0" y2="376" class="wx-line"/><text x="330.0" y="392" text-anchor="middle" class="wx-t-s">10,000</text><line x1="390.0" y1="370" x2="390.0" y2="376" class="wx-line"/><line x1="450.0" y1="370" x2="450.0" y2="376" class="wx-line"/><text x="450.0" y="392" text-anchor="middle" class="wx-t-s">1 million</text><line x1="510.0" y1="370" x2="510.0" y2="376" class="wx-line"/><line x1="570.0" y1="370" x2="570.0" y2="376" class="wx-line"/><text x="570.0" y="392" text-anchor="middle" class="wx-t-s">100 million</text><line x1="630.0" y1="370" x2="630.0" y2="376" class="wx-line"/><line x1="690.0" y1="370" x2="690.0" y2="376" class="wx-line"/><text x="690.0" y="392" text-anchor="middle" class="wx-t-s">10 billion</text><line x1="418.6" y1="56" x2="418.6" y2="370" class="wx-guide"/><text x="414.6" y="52" text-anchor="end" class="wx-t-s">Homo sapiens, c. 300,000</text><line x1="481.1" y1="64" x2="481.1" y2="370" class="wx-guide"/><text x="485.1" y="68" class="wx-t-s">first stone tools, 3.3 million</text><text x="24" y="114" class="wx-t-b">Coso artefact</text><g class="wx-pop" style="--d:2"><circle cx="431.9" cy="110" r="6" class="wx-paper wx-edge"/><text x="431.9" y="98" text-anchor="middle" class="wx-t-s">claimed</text></g><path d="M421.9,110 L220.0,110" class="wx-hl wx-draw" pathLength="1" style="--d:4" marker-end="url(#ooparts-f1-ar)"/><g class="wx-pop" style="--d:8"><circle cx="210.0" cy="110" r="6" class="wx-accfill"/><text x="210.0" y="130" class="wx-t-s">a 1920s Champion spark plug</text></g><text x="24" y="176" class="wx-t-b">London hammer</text><g class="wx-pop" style="--d:5"><line x1="570.0" y1="172" x2="609.2" y2="172" class="wx-bold wx-s4"/><circle cx="570.0" cy="172" r="6" class="wx-paper wx-edge"/><text x="570.0" y="160" text-anchor="middle" class="wx-t-s">claimed</text></g><path d="M560.0,172 L230.6,172" class="wx-hl wx-draw" pathLength="1" style="--d:7" marker-end="url(#ooparts-f1-ar)"/><g class="wx-pop" style="--d:11"><circle cx="220.6" cy="172" r="6" class="wx-accfill"/><text x="220.6" y="192" class="wx-t-s">19th-century style iron hammer</text></g><text x="24" y="238" class="wx-t-b">Ica stones</text><g class="wx-pop" style="--d:8"><circle cx="559.2" cy="234" r="6" class="wx-paper wx-edge"/><text x="559.2" y="222" text-anchor="middle" class="wx-t-s">claimed</text></g><path d="M549.2,234 L204.4,234" class="wx-hl wx-draw" pathLength="1" style="--d:10" marker-end="url(#ooparts-f1-ar)"/><g class="wx-pop" style="--d:14"><circle cx="194.4" cy="234" r="6" class="wx-accfill"/><text x="194.4" y="254" class="wx-t-s">engraved in the 1960s–70s</text></g><text x="24" y="300" class="wx-t-b">Klerksdorp spheres</text><g class="wx-pop" style="--d:11"><circle cx="658.6" cy="296" r="6" class="wx-c3"/><text x="648.6" y="300" text-anchor="end" class="wx-t-s">rock really c. 3 billion years old;</text><text x="648.6" y="314" text-anchor="end" class="wx-t-s">spheres are natural concretions</text></g><circle cx="160" cy="416" r="5" class="wx-paper wx-edge"/><text x="170" y="420" class="wx-t-s">claimed age</text><circle cx="260" cy="416" r="5" class="wx-accfill"/><text x="270" y="420" class="wx-t-s">age after testing</text><circle cx="390" cy="416" r="5" class="wx-c3"/><text x="400" y="420" class="wx-t-s">genuinely old, but natural</text></svg></div></div><figcaption>On a logarithmic scale, each claim jumps back hundreds of thousands to hundreds of millions of years; testing brings the objects back to the last two centuries, or shows them to be natural. <span class="wx-src">Based on: Claims as reported by Stromberg &amp; Heinrich 2004 (Coso), Kuban (London hammer), Polidoro 2002 (Ica); Heinrich 2008 (Klerksdorp); Harmand et al. 2015 and Hublin et al. 2017 (reference lines). Positions approximate.</span></figcaption><p class="vh">A horizontal logarithmic axis runs from 10 years to 10 billion years ago, with dotted reference lines at about 300,000 years for Homo sapiens and 3.3 million years for the first stone tools. Three rows show an open circle for the claimed age and an arrow back to a filled circle for the tested age: the Coso artefact from 500,000 years to about 100 years, a 1920s Champion spark plug; the London hammer from a red bar spanning about 100 to 450 million years to about 150 years, a nineteenth-century style iron hammer; the Ica stones from about 66 million years to about 55 years, engraved in the 1960s and 70s. A fourth row places the Klerksdorp spheres at about 3 billion years with a green circle, labelled rock really about 3 billion years old, spheres are natural concretions.</p></figure><p>That argument deserves respect as a warning. But each revision in that list came from finds in place, in dated layers, published and retested. The OOParts on this page failed at exactly that step. Their lesson is not that anomalies are always false, but that the test must be the same for a surprising find as for an ordinary one.</p></section><section class="wsec" id="ooparts-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What is genuinely strange</h3><p>Some ancient objects really are out of place in our expectations, if not in time. The Antikythera mechanism, a geared bronze calculator of the second or first century BCE, was studied with X-ray CT in 2006 and turned out more complex than anything known for over a thousand years afterwards. The clay jars called the Baghdad battery, about 2,000 years old, have no agreed purpose; proposals range from storage for sacred scrolls to a mild electric current. These are real puzzles, but about the past of known peoples, not about objects older than humanity.</p><p>Time has taken what might have settled older claims. Most reported anomalies were found by miners or passers-by, with nobody recording where in the rock they lay. Some survive only as newspaper stories or lost specimens that can never be tested.</p></section><section class="wsec" id="ooparts-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle it</h3><p>A true out-of-place artefact would look like this: an object exposed in place during a recorded excavation, sealed within an undisturbed, dated layer, photographed before removal, analysed in independent laboratories and open to other researchers. No example meeting that standard is known. Until one appears, the verdict on these famous objects is clear, and their real value is as case studies in how to test a wonderful claim.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-find" style="--i:0"><span class="wtl-y">1936 CE</span><span class="wtl-k">Found</span><span class="wtl-t">London hammer found near London, Texas</span></li><li class="wtl-find" style="--i:1"><span class="wtl-y">1961 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Coso artefact found near Olancha, California</span></li><li class="wtl-find" style="--i:2"><span class="wtl-y">1966 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Javier Cabrera receives his first Ica stone</span></li><li class="wtl-find" style="--i:3"><span class="wtl-y">1968 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Meister &#x27;shoe print&#x27; split from Cambrian shale</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">1977 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">BBC Horizon examines the Ica stones</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1993 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Cremo and Thompson publish Forbidden Archeology</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2004 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Coso object identified as a 1920s spark plug</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2008 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Klerksdorp spheres described as concretions</span></li></ol><details class="srcs"><summary>Sources for this case (11)</summary><ol><li>Heinrich, P. V. (2008). The mysterious &#x27;spheres&#x27; of Ottosdal, South Africa. Reports of the National Center for Science Education 28(1).</li><li>Stromberg, P. &amp; Heinrich, P. V. (2004). The Coso artifact. Reports of the National Center for Science Education 24(2).</li><li>Kuban, G. J. The London hammer: an alleged out-of-place artifact. TalkOrigins Archive.</li><li>Polidoro, M. (2002). Notes on a strange world: Ica stones: yabba-dabba-do! Skeptical Inquirer 26(5).</li><li>Stokes, W. L. (1986). Alleged human footprint from Middle Cambrian strata, Millard County, Utah. Journal of Geological Education 34(3): 187–190.</li><li>Cremo, M. A. &amp; Thompson, R. L. (1993). Forbidden Archeology: The Hidden History of the Human Race. Bhaktivedanta Institute.</li><li>Cabrera Darquea, J. (1976). El mensaje de las piedras grabadas de Ica. Lima.</li><li>Harmand, S., Lewis, J. E., Feibel, C. S., et al. (2015). 3.3-million-year-old stone tools from Lomekwi 3, West Turkana, Kenya. Nature 521: 310–315. <a href="https://doi.org/10.1038/nature14464" target="_blank" rel="noopener">doi:10.1038/nature14464</a></li><li>Hublin, J.-J., Ben-Ncer, A., Bailey, S. E., et al. (2017). New fossils from Jebel Irhoud, Morocco and the pan-African origin of Homo sapiens. Nature 546: 289–292. <a href="https://doi.org/10.1038/nature22336" target="_blank" rel="noopener">doi:10.1038/nature22336</a></li><li>Freeth, T., Bitsakis, Y., Moussas, X., et al. (2006). Decoding the ancient Greek astronomical calculator known as the Antikythera Mechanism. Nature 444: 587–591. <a href="https://doi.org/10.1038/nature05357" target="_blank" rel="noopener">doi:10.1038/nature05357</a></li><li>Keyser, P. T. (1993). The purpose of the Parthian galvanic cells: a first-century A.D. electric battery used for analgesia. Journal of Near Eastern Studies 52(2): 81–98. <a href="https://doi.org/10.1086/373610" target="_blank" rel="noopener">doi:10.1086/373610</a></li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-ooparts" data-t="Out-of-Place Artefacts: Impossible Objects on Trial"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Out-of-Place Artefacts: Impossible Objects on Trial</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-ooparts</span> (updated 25 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-baalbek-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Temple of Jupiter, West wall, Trilithon, Baalbek 20572.JPG" data-cap="Baalbek, Beqaa Valley, Lebanon" data-big><figcaption></figcaption></figure><div class="sh-k">Impossible Megaliths</div><h2 class="sh-t" id="case-baalbek-st" tabindex="-1">Baalbek: The Heaviest Stones Ever Moved</h2><p class="sh-s">Three blocks of about 800 tonnes each sit in a temple wall, and a bigger one still lies in the quarry. Who cut them, and when?</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> The trilithon and the quarry monoliths were cut and placed by a civilisation far older than Roman Heliopolis.</p></div><p class="v4-q">Did Roman builders move Baalbek&#x27;s giant blocks, or did they inherit them?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>At Baalbek in Lebanon, three blocks of about 800 tonnes each sit in a Roman temple wall, and bigger ones lie in the quarry nearby.</li><li>They are the heaviest stones ever moved by people.</li><li>The quarry sits at the edge of the Roman town, the blocks match the Roman podium, and the temple was finished by about 60 CE.</li><li>Nothing physical points to an older civilisation; what is missing is a sealed layer dug from under the blocks themselves.</li><li>Who moved them is a strong inference, not yet a direct date; how they moved them is the open question.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Engineering</span><span class="thr">Archaeology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="800" >800</b><span class="ctr-u"> t</span></div><div class="ctr-l">each trilithon block</div><div class="ctr-c">Adam 1977</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="1650" >1,650</b><span class="ctr-u"> t</span></div><div class="ctr-l">block found in the quarry in 2014</div><div class="ctr-c">Abdul Massih 2015; DAI</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="144" >144</b><span class="ctr-u"> people</span></div><div class="ctr-l">on six capstans in Adam&#x27;s haulage model</div><div class="ctr-c">Adam 1977</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="19.9" data-dec="1">19.9</b><span class="ctr-u"> m</span></div><div class="ctr-l">height of the Temple of Jupiter&#x27;s columns</div><div class="ctr-c">Wiegand 1921–1925</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The trilithon and the quarry monoliths were cut and placed by a civilisation far older than Roman Heliopolis.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Everything physical links the megaliths to the Roman project: the quarry at the edge of the Roman town, monoliths cut to the same length class, a podium plan that encloses an older terrace of ordinary blocks, and a temple finished by about AD 60. The silence of Roman writers is real but weak evidence, because most building records from the empire are lost. What is missing is a published sealed deposit under the trilithon itself, which would move this from strong inference to direct dating. No positive evidence for an older megalithic culture has been found.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Guidebooks present the trilithon as plainly Roman, and the architectural case is strong. But the dating rests mainly on planning and building sequence, not on dated finds sealed beneath the three blocks, and nobody knows exactly how they were lifted. Textbooks are right on the main point and slightly overconfident on the details, which are inferred rather than recorded.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Each of the three trilithon blocks is about 19 m long, 4.3 m high and 3.6 m deep, roughly 800 t of limestone, laid on a course of blocks of about 300 t each.<small>Adam 1977; Ruprechtsberger 1999</small></li><li>Three even larger monoliths lie in the Hajjar al-Hibla quarry about 800–900 m from the temple: c. 1,000 t, c. 1,240 t and the block found in 2014, estimated at c. 1,650 t.<small>Abdul Massih 2015</small></li><li>The Temple of Jupiter on this podium was largely complete by about AD 60, a date fixed by an inscription on the building.<small>Lohmann 2010</small></li><li>Beneath the Roman temple lies an earlier, pre-Roman T-shaped terrace built of ordinary-sized masonry, whose own temple was never finished or was removed.<small>Lohmann 2010</small></li><li>Tell Baalbek itself was inhabited from the Pre-Pottery Neolithic onwards, thousands of years before any temple.<small>DAI deep trench; van Ess 2008</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Exactly when in the Roman building programme the trilithon course was laid, and whether it belongs to the first plan or a later enlargement.</li><li>How the blocks were raised onto the course below them: earth ramps, timber cribbing, lifting towers, or a mix.</li><li>Why the quarry monoliths were abandoned: flaws and cracks, a change of plan, or the end of funding.</li><li>Whether the three giant blocks copy a local pre-Roman tradition of monumental building, or were a purely Roman ambition.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>No building accounts, contracts or letters about the podium survive; Roman records of the project are lost.</li><li>The temple intended for the pre-Roman terrace has left almost no architectural remains.</li><li>Large parts of the quarry, and the deep layers of the tell under the sanctuary, have never been excavated.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Baalbek became the Roman colony of Heliopolis around 16–15 BCE, and the sanctuary of Jupiter Heliopolitanus grew over the next two centuries. Architectural study by the German Archaeological Institute (DAI) places the giant podium in the early Roman master plan, wrapped around an older, smaller pre-Roman terrace. The trilithon course was part of a podium that was never completed, and the quarry monoliths match its length, which suggests they were cut for the same unfinished scheme. Roman engineers had capstans, pulleys, levers and huge labour forces, and Jean-Pierre Adam calculated that a few hundred people could have dragged each block.</p><ul><li>The blocks come from a quarry at the edge of the Roman town, slightly uphill of the temple.</li><li>The older terrace found beneath the podium is built of normal-sized blocks, not megaliths.</li><li>The quarry blocks are about 20 m long, the same class of length as the trilithon: spares or the next phase.</li><li>Heavy transport is well attested in the Roman world, from Egyptian obelisks of several hundred tonnes to temple columns.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Graham Hancock, in Magicians of the Gods (2015), asks whether the megalithic lower courses at Baalbek could be older than the Roman temple set on top of them. The giant blocks are unlike anything else in Roman architecture, their weathering and style differ from the finer masonry above, and no Roman author boasts of moving the heaviest stones ever placed in a building. Earlier, Zecharia Sitchin cast the platform as a landing place of ancient gods. The milder version of the idea, that Romans reused or enlarged an older megalithic structure, deserves a fair test.</p><ul><li>No ancient text records the transport of the trilithon, though Romans recorded lesser feats.</li><li>The trilithon course has no parallel in any other Roman temple podium.</li><li>The megalithic courses look more weathered than the Roman masonry above them.</li></ul><div class="face-s"><b>Its strongest point</b><p>Romans recorded engineering feats with pride, yet not one inscription or author mentions moving 800-tonne blocks, the heaviest ever set in a building. That silence is odd, and it leaves the dating resting on architecture rather than on a written record.</p></div><p class="face-cr"><b>Credit</b> Graham Hancock; Zecharia Sitchin; many independent researchers</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Publish a full excavation of the foundation trench under and in front of the trilithon course, with any pottery, coins or tools sealed beneath the blocks.</li><li>Excavate the quarry floor around the 2014 block and date sealed debris such as pottery, lamps and broken tools.</li><li>Compare tool marks and quarry cut patterns on the trilithon with dated Roman blocks and with the quarry monoliths.</li><li>Map how the trilithon course bonds with the Roman podium and with the pre-Roman terrace inside it.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">6 min read · 1,210 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Baalbek: The Heaviest Stones Ever Moved"><button type="button" class="wtoc-i" data-go="baalbek-s1">Three stones in a wall</button><button type="button" class="wtoc-i" data-go="baalbek-s2">What is solid</button><button type="button" class="wtoc-i" data-go="baalbek-s3">The Roman story, with numbers</button><button type="button" class="wtoc-i" data-go="baalbek-s4">The case for an older Baalbek</button><button type="button" class="wtoc-i" data-go="baalbek-s5">What time has hidden</button><button type="button" class="wtoc-i" data-go="baalbek-s6">What would settle it</button></nav></div><section class="wsec" id="baalbek-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Three stones in a wall</h3><p>Walk along the west side of the great temple platform at Baalbek and the wall suddenly changes scale. Above a course of blocks that would already be the biggest in most buildings sit three stones, end to end, each about 19 m long and taller than two people. Each weighs around 800 tonnes. Since at least the early Byzantine period they have been called the Trilithon, the three stones, and for centuries travellers have asked the same question: who could lift that?</p><p>A short walk south, in the old quarry at the edge of town, the puzzle grows. The Stone of the Pregnant Woman, about 20 m long and roughly 1,000 tonnes, still lies at a tilt, partly attached to the bedrock. Next to it a second block of about 1,240 tonnes was rediscovered in the 1990s. In 2014 a team led by Jeanine Abdul Massih of the Lebanese University, working with the German Archaeological Institute (DAI), exposed a third: some 19.6 m long, 6 m wide and at least 5.5 m high, estimated at about 1,650 tonnes. It is the largest dressed block known from the ancient world.</p><figure class="wx wx--static" id="baalbek-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">The Baalbek megaliths to scale</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The Baalbek megaliths to scale"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" class="wx-svg" role="img" aria-labelledby="baalbek-f1-t"><title id="baalbek-f1-t">The Baalbek megaliths drawn to one scale with a lorry and a person</title><text x="24" y="28" class="wx-t-cap">Side views at one scale · 1 m = 16 px</text><g><rect x="60" y="64" width="305.6" height="68.8" class="wx-stone2 wx-edge wx-growx" style="--d:1"/><line x1="60" y1="132.8" x2="365.6" y2="132.8" class="wx-line"/><g class="wx-pop" style="--d:3"><circle cx="44" cy="109.6" r="3.2" class="wx-inkfill"/><line x1="44" y1="113" x2="44" y2="123.6" class="wx-line"/><line x1="44" y1="123.6" x2="40" y2="132.8" class="wx-line"/><line x1="44" y1="123.6" x2="48" y2="132.8" class="wx-line"/><line x1="39" y1="117" x2="49" y2="117" class="wx-line"/></g><g class="wx-pop" style="--d:4"><text x="400" y="84" class="wx-t-b">Trilithon block (one of three)</text><text x="400" y="101" class="wx-t-s">c. 19.1 × 4.3 × 3.6 m, limestone</text><text x="400" y="122" class="wx-t-n wx-t-a">c. 800 t each</text><text x="498" y="122" class="wx-t-s">≈ 20 loaded 40 t lorries</text></g></g><g><rect x="60" y="164" width="328" height="68.8" class="wx-stone wx-edge wx-growx" style="--d:3"/><line x1="60" y1="232.8" x2="388" y2="232.8" class="wx-line"/><g class="wx-pop" style="--d:6"><text x="410" y="184" class="wx-t-b">Stone of the Pregnant Woman</text><text x="410" y="201" class="wx-t-s">c. 20.3–20.8 × 4 × 4.2–4.3 m, in the quarry</text><text x="410" y="222" class="wx-t-n wx-t-a">c. 1,000 t</text><text x="484" y="222" class="wx-t-s">never moved</text></g></g><g><rect x="60" y="264" width="313.6" height="88" class="wx-stone3 wx-edge wx-growx" style="--d:5"/><line x1="60" y1="352" x2="373.6" y2="352" class="wx-dash"/><line x1="60" y1="352" x2="60" y2="364" class="wx-dash"/><line x1="373.6" y1="352" x2="373.6" y2="364" class="wx-dash"/><text x="216.8" y="376" text-anchor="middle" class="wx-t-s">base still in the rock: at least 5.5 m high</text><g class="wx-pop" style="--d:8"><text x="400" y="284" class="wx-t-b">Block found in 2014 (DAI)</text><text x="400" y="301" class="wx-t-s">c. 19.6 × 6 × 5.5+ m</text><text x="400" y="322" class="wx-t-n wx-t-a">c. 1,650 t (estimate)</text><text x="400" y="339" class="wx-t-s">the largest dressed block known from antiquity</text></g></g><g class="wx-pop" style="--d:9"><rect x="60" y="403" width="212" height="53" rx="2" class="wx-card wx-edge"/><path d="M276,456 L276,424 L292,412 L322,412 L324,456 Z" class="wx-card wx-edge"/><rect x="296" y="418" width="18" height="12" class="wx-sky wx-edge-soft"/><circle cx="84" cy="460" r="7" class="wx-inkfill"/><circle cx="104" cy="460" r="7" class="wx-inkfill"/><circle cx="236" cy="460" r="7" class="wx-inkfill"/><circle cx="256" cy="460" r="7" class="wx-inkfill"/><circle cx="306" cy="460" r="7" class="wx-inkfill"/><line x1="40" y1="467" x2="380" y2="467" class="wx-line"/><circle cx="352" cy="443.8" r="3.2" class="wx-inkfill"/><line x1="352" y1="447.2" x2="352" y2="457.8" class="wx-line"/><line x1="352" y1="457.8" x2="348" y2="467" class="wx-line"/><line x1="352" y1="457.8" x2="356" y2="467" class="wx-line"/><line x1="347" y1="451" x2="357" y2="451" class="wx-line"/><text x="400" y="428" class="wx-t-b">Articulated lorry</text><text x="400" y="445" class="wx-t-s">16.5 m long, c. 4 m high, 40 t loaded</text><text x="400" y="462" class="wx-t-s">person 1.7 m</text></g><g><rect x="60" y="494" width="80" height="5" class="wx-inkfill"/><rect x="140" y="494" width="80" height="5" class="wx-card wx-edge"/><text x="60" y="488" text-anchor="middle" class="wx-t-s">0</text><text x="140" y="488" text-anchor="middle" class="wx-t-s">5</text><text x="220" y="488" text-anchor="middle" class="wx-t-s">10 m</text></g></svg></div></div><figcaption>One trilithon block, the Stone of the Pregnant Woman and the block found in 2014, drawn at one scale beside a 16.5 m lorry and a person. <span class="wx-src">Based on: Block dimensions and weights from Adam 1977, Ruprechtsberger 1999 and Abdul Massih 2015; 2014 block weight is the DAI estimate (other sources give c. 1,500 t). Lorry is a generic 16.5 m articulated vehicle.</span></figcaption><p class="vh">Side views of three huge rectangular blocks stacked in rows at one scale of 16 pixels per metre. Top: a trilithon block about 19.1 by 4.3 m, around 800 tonnes, the weight of about 20 loaded lorries, with a small person beside it. Middle: the Stone of the Pregnant Woman, about 20.5 by 4.3 m, around 1,000 tonnes, never moved. Bottom: the block found in 2014, about 19.6 by 6 m and at least 5.5 m high, around 1,650 tonnes, with its base still in the rock. Below them a 16.5 m articulated lorry and a 1.7 m person look small. A scale bar shows 10 m.</p></figure><blockquote class="wpull"><p>The question is not whether people could move 800 tonnes. It is which people, and when.</p></blockquote></section><section class="wsec" id="baalbek-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What is solid</h3><p>Some things here are not in doubt. The blocks are local limestone, cut in the Hajjar al-Hibla quarry about 800 to 900 m from the sanctuary, and the quarry sits slightly higher than the temple, so the route runs gently downhill. The Temple of Jupiter that stands on the podium was one of the largest the Romans built, with 54 columns nearly 20 m tall, and an inscription shows it was largely finished by about AD 60.</p><p>The site is also far older than Rome. A deep trench at the edge of the temple platform pushed the first settlement of Tell Baalbek back to the Pre-Pottery Neolithic, and early Bronze Age pottery lies in its layers. This was a sacred and inhabited hill for thousands of years before anyone carved a column.</p><aside class="wcall"><b>How do we know?</b><p>The DAI&#x27;s architectural survey, led in this part by Daniel Lohmann, traced the building phases stone by stone. Under the Roman temple they identified a pre-Roman foundation wall belonging to a T-shaped terrace, at least 5 m above the old tell surface. Its temple was apparently never completed. Crucially, that older terrace is built of ordinary blocks, and the Roman podium with its giant courses was wrapped around it.</p></aside></section><section class="wsec" id="baalbek-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The Roman story, with numbers</h3><p>In the mainstream account, Baalbek became the Roman colony of Heliopolis around 16–15 BCE, probably settled by veterans of Augustus&#x27;s legions. The colonists and their patrons launched a master plan to turn the old sanctuary into a showpiece of the East, and the podium with its trilithon was part of it. The plan was never fully carried out: the podium lacks courses it was designed to have, and the quarry monoliths, cut to the same 20 m class of length, look like blocks for the next stage that never left.</p><p>Could Roman engineers have moved them? The French architect Jean-Pierre Adam worked it through in 1977. Dragging a block on a well-prepared timber track needs a pull of roughly one tenth of its weight. He modelled capstans with six bars and four men on each bar, 24 people per machine, turning a drum that wound hemp cables through pulleys. Six such capstans, 144 people, give about 78 tonnes of pull, enough for an 800-tonne block with some margin.</p><figure class="wx wx--steps" id="baalbek-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">How an 800 tonne block could be moved</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How an 800 tonne block could be moved"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" class="wx-svg" role="img" aria-labelledby="baalbek-f2-t"><title id="baalbek-f2-t">Moving an 800 tonne block from the quarry to the podium, in five steps</title><defs><marker id="baalbek-f2-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" class="wx-accfill"/></marker></defs><text x="24" y="24" class="wx-t-cap">Profile · blocks and podium at 1 m = 8 px · route shortened</text><polygon points="0,300 36,300 36,338 204,338 204,300 200,300 236,316 720,316 720,440 0,440" class="wx-soil wx-o60"/><polyline points="0,300 36,300 36,338 204,338 204,300 200,300 236,316 720,316" class="wx-line"/><text x="120" y="358" text-anchor="middle" class="wx-t-m">Quarry (Hajjar al-Hibla)</text><text x="300" y="336" text-anchor="middle" class="wx-t-s">route c. 800–900 m, gently downhill</text><rect x="540" y="282" width="172" height="34" class="wx-stone wx-edge"/><line x1="597" y1="282" x2="597" y2="316" class="wx-edge-soft"/><line x1="654" y1="282" x2="654" y2="316" class="wx-edge-soft"/><text x="626" y="336" text-anchor="middle" class="wx-t-m">Temple of Jupiter podium</text><text x="626" y="350" text-anchor="middle" class="wx-t-s">lower course, blocks c. 300–350 t</text><g class="wx-st wx-hide" data-only="1"><rect x="44" y="302" width="152" height="34.4" class="wx-stone2 wx-edge"/><line x1="44" y1="336.4" x2="196" y2="336.4" class="wx-hl"/></g><g class="wx-st" data-s="1"><circle cx="32" cy="164" r="9" class="wx-num"/><text x="32" y="168" text-anchor="middle" class="wx-numt">1</text><text x="48" y="168" class="wx-t-b">Cut in the quarry</text><text x="48" y="184" class="wx-t-s">trenches around the block,</text><text x="48" y="198" class="wx-t-s">then split from the bedrock</text></g><g class="wx-st wx-hide" data-only="2"><rect x="44" y="255.6" width="152" height="34.4" class="wx-stone2 wx-edge"/><rect x="44" y="290" width="152" height="7" class="wx-wood wx-edge-soft"/><rect x="28" y="284" width="14" height="16" class="wx-wood wx-edge-soft"/><rect x="198" y="284" width="14" height="16" class="wx-wood wx-edge-soft"/><line x1="50" y1="292" x2="10" y2="246" class="wx-bold wx-s6"/><line x1="190" y1="292" x2="226" y2="250" class="wx-bold wx-s6"/></g><g class="wx-st" data-s="2"><circle cx="32" cy="384" r="9" class="wx-num"/><text x="32" y="388" text-anchor="middle" class="wx-numt">2</text><text x="48" y="388" class="wx-t-b">Lever and crib</text><text x="48" y="404" class="wx-t-s">levers lift one end a little at a time;</text><text x="48" y="418" class="wx-t-s">timber cribs hold the gain; a sledge slides under</text></g><g class="wx-st wx-hide" data-only="3"><rect x="226" y="274.6" width="152" height="34.4" class="wx-stone2 wx-edge"/><rect x="226" y="309" width="152" height="7" class="wx-wood wx-edge-soft"/><path d="M380,312 L520,312" class="wx-flow wx-s1" marker-end="url(#baalbek-f2-ar)"/><text x="450" y="302" text-anchor="middle" class="wx-t-s wx-halo">ropes to capstans</text></g><g class="wx-st" data-s="3"><rect x="236" y="40" width="268" height="150" rx="10" class="wx-card wx-edge-soft"/><circle cx="236" cy="46" r="9" class="wx-num"/><text x="236" y="50" text-anchor="middle" class="wx-numt">3</text><text x="252" y="64" class="wx-t-b">Haul with capstans (Adam 1977)</text><text x="252" y="81" class="wx-t-s">6 capstans × 24 men = 144 men</text><text x="252" y="95" class="wx-t-s">pull c. 78 t, about a tenth of the weight</text><rect x="252" y="134" width="76" height="14.4" class="wx-stone2 wx-edge"/><text x="290" y="166" text-anchor="middle" class="wx-t-s">block, plan</text><line x1="328" y1="141" x2="400" y2="118" class="wx-thin"/><line x1="328" y1="141" x2="440" y2="118" class="wx-thin"/><line x1="328" y1="141" x2="480" y2="118" class="wx-thin"/><line x1="328" y1="141" x2="400" y2="164" class="wx-thin"/><line x1="328" y1="141" x2="440" y2="164" class="wx-thin"/><line x1="328" y1="141" x2="480" y2="164" class="wx-thin"/><g class="wx-spin" style="--sp:9"><circle cx="400" cy="118" r="5" class="wx-wood wx-edge"/><line x1="386" y1="118" x2="414" y2="118" class="wx-line"/><line x1="400" y1="104" x2="400" y2="132" class="wx-line"/></g><g class="wx-spin" style="--sp:9"><circle cx="440" cy="118" r="5" class="wx-wood wx-edge"/><line x1="426" y1="118" x2="454" y2="118" class="wx-line"/><line x1="440" y1="104" x2="440" y2="132" class="wx-line"/></g><g class="wx-spin" style="--sp:9"><circle cx="480" cy="118" r="5" class="wx-wood wx-edge"/><line x1="466" y1="118" x2="494" y2="118" class="wx-line"/><line x1="480" y1="104" x2="480" y2="132" class="wx-line"/></g><g class="wx-spin" style="--sp:9"><circle cx="400" cy="164" r="5" class="wx-wood wx-edge"/><line x1="386" y1="164" x2="414" y2="164" class="wx-line"/><line x1="400" y1="150" x2="400" y2="178" class="wx-line"/></g><g class="wx-spin" style="--sp:9"><circle cx="440" cy="164" r="5" class="wx-wood wx-edge"/><line x1="426" y1="164" x2="454" y2="164" class="wx-line"/><line x1="440" y1="150" x2="440" y2="178" class="wx-line"/></g><g class="wx-spin" style="--sp:9"><circle cx="480" cy="164" r="5" class="wx-wood wx-edge"/><line x1="466" y1="164" x2="494" y2="164" class="wx-line"/><line x1="480" y1="150" x2="480" y2="178" class="wx-line"/></g></g><g class="wx-st" data-s="4"><polygon points="400,316 540,282 540,316" class="wx-sand wx-edge-soft"/></g><g class="wx-st wx-hide" data-only="4"><g transform="rotate(-13.7 470 299)"><rect x="394" y="257.6" width="152" height="34.4" class="wx-stone2 wx-edge"/><rect x="394" y="292" width="152" height="7" class="wx-wood wx-edge-soft"/></g></g><g class="wx-st" data-s="4"><circle cx="336" cy="384" r="9" class="wx-num"/><text x="336" y="388" text-anchor="middle" class="wx-numt">4</text><text x="352" y="388" class="wx-t-b">Up an earth ramp</text><text x="352" y="404" class="wx-t-s">the quarry sits a little higher than the</text><text x="352" y="418" class="wx-t-s">temple, so only a short final climb</text></g><g class="wx-st wx-hide" data-only="5"><polygon points="400,316 540,282 540,316" class="wx-paper"/><polygon points="400,316 540,282 540,316" class="wx-dash"/><text x="480" y="332" text-anchor="middle" class="wx-t-s">ramp dug away</text></g><g class="wx-st" data-s="5"><rect x="552" y="247.6" width="152" height="34.4" class="wx-stone2 wx-edge"/><line x1="552" y1="247.6" x2="704" y2="247.6" class="wx-hl"/><circle cx="552" cy="164" r="9" class="wx-num"/><text x="552" y="168" text-anchor="middle" class="wx-numt">5</text><text x="568" y="168" class="wx-t-b">Set with levers</text><text x="568" y="184" class="wx-t-s">nudged tight against</text><text x="568" y="198" class="wx-t-s">its neighbour, 19 m long</text><line x1="600" y1="206" x2="620" y2="244" class="wx-thin"/></g><rect x="610" y="404" width="80" height="4" class="wx-inkfill"/><text x="610" y="398" class="wx-t-s">10 m</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Cut in the quarry: trenches are cut around the block, which is then split from the bedrock about 800–900 m from the temple.</p><ol class="wx-steplist"><li>Cut in the quarry: trenches are cut around the block, which is then split from the bedrock about 800–900 m from the temple.</li><li>Lever and crib: levers raise one end a little at a time while timber cribs hold each gain, until a sledge can slide underneath.</li><li>Haul: six capstans with 24 people each (144 in all) give about 78 t of pull, roughly a tenth of the block&#x27;s weight, enough on a greased timber track.</li><li>Ramp: the quarry lies slightly higher than the temple, so a short earth ramp brings the block up to the top of the lower course.</li><li>Set: levers nudge the block tight against its neighbour, and the ramp is dug away.</li></ol><figcaption>A reconstruction of one plausible sequence, from quarry to podium, using methods and numbers from Jean-Pierre Adam&#x27;s 1977 study. Blocks and podium at one scale; the route is shortened. <span class="wx-src">Based on: Adam 1977 (capstan model: 6 capstans × 24 people, c. 78 t of pull); quarry distance and relative height from Abdul Massih 2015 and the Baalbek Stones survey literature. The ramp and lever sequence is a reconstruction, not a recorded method.</span></figcaption><p class="vh">Profile from the quarry on the left to the temple podium on the right. Step 1: a block lies in a quarry pit, cut free on its sides. Step 2: levers and timber cribs raise it onto a sledge. Step 3: the block on its sledge is hauled along a timber track by ropes; an inset plan shows six capstans, each worked by 24 people, 144 in all, pulling about 78 tonnes, a tenth of the block&#x27;s weight. Step 4: an earth ramp rises to the top of the lower course of the podium and the block is dragged up it. Step 5: the block sits on the podium course, set with levers, and the ramp is dug away.</p></figure><p>Lifting is the harder part, because each trilithon block sits on a course several metres above the ground. The simplest method needs no machines at all: an earth ramp, levers and timber cribbing, raising one end a little at a time. Because the quarry lies higher than the temple, the final climb was modest. None of this is recorded at Baalbek, so it remains reconstruction, but the forces are well within the reach of organised muscle.</p><p>There are useful comparisons. Roman emperors shipped Egyptian obelisks of several hundred tonnes across the Mediterranean and raised them in Rome. In 1770, without steam power, Russian workers moved the Thunder Stone, a granite boulder of roughly 1,250 tonnes, several kilometres overland to St Petersburg using capstans and a track of metal balls. Baalbek&#x27;s blocks are bigger, but not a different kind of problem.</p></section><section class="wsec" id="baalbek-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The case for an older Baalbek</h3><p>Graham Hancock visited Baalbek for Magicians of the Gods (2015) and asked the obvious question in the other direction. If the Romans did this, why did they never boast about it? Roman writers celebrated aqueducts, bridges and obelisk ships, yet no inscription or author mentions the heaviest stones ever placed in a building. The trilithon is also unique: no other Roman temple podium, anywhere in the empire, uses blocks remotely this size. To many visitors the giant courses look more weathered and differently finished than the crisp masonry above.</p><p>Hancock&#x27;s suggestion is cautious: perhaps the Romans built on and enlarged a much older megalithic platform, as later builders often reused sacred ground. Others go further. Zecharia Sitchin&#x27;s The Stairway to Heaven (1980) made the platform a landing place for ancient gods, and online videos describe the blocks as beyond any known technology.</p><blockquote class="wpull"><p>The older-foundation idea makes a clear prediction: somewhere under the Roman podium there should be megalithic work that predates it.</p></blockquote><p>That prediction has been partly tested, and so far it points the other way. When the DAI looked for what lay beneath the Roman temple, it found an older terrace, exactly as the challengers might hope, but built of ordinary blocks and dated to the pre-Roman centuries, not to deep prehistory. The megaliths sit in the Roman shell around it. Weathering is a weak clock, because stones low in a wall take more water, salt and impact than stones higher up.</p></section><section class="wsec" id="baalbek-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>What time has hidden</h3><p>The silence of the sources cuts less deep than it seems. Almost no Roman building accounts survive for any provincial temple, and the town&#x27;s archives are lost. Baalbek was later a fortress, a quarry for its own stones and a battleground, and much of the sanctuary was rebuilt and robbed. The pre-Roman temple has nearly vanished. Large parts of the quarry have never been dug, and the 2014 block was only found because excavators went looking below ground level.</p><p>Political instability in Lebanon has also limited fieldwork for long periods, and the deep layers of the tell beneath the platform are barely sampled. It is fair to say that Baalbek has not given up all its history, and that the lack of a written record of the trilithon leaves room for questions.</p></section><section class="wsec" id="baalbek-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What would settle it</h3><p>The cleanest answer would come from the ground directly under the trilithon course. Pottery, coins or broken tools sealed in the foundation trench, beneath or against the giant blocks, would date their placing. A fully published excavation of that trench, together with the podium&#x27;s bonding to the older terrace, would turn a strong architectural argument into a direct date.</p><p>The quarry offers a second test. Debris around the 2014 block, from lamps to tool fragments, can date when the monoliths were being worked, and the cut marks can be compared with dated Roman blocks. On present evidence the Romans are by far the best candidates. But the question is a good one, and Baalbek deserves the excavations that would close it.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-use" style="--i:0"><span class="wtl-y">8,000 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Tell Baalbek already inhabited (Pre-Pottery Neolithic)</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">100 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Pre-Roman T-shaped terrace built; its temple never completed</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">15 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Roman colony of Heliopolis founded</span></li><li class="wtl-build" style="--i:3"><span class="wtl-y">60 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Temple of Jupiter largely complete</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">1898 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">German expedition begins recording the sanctuary</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1996 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Linz team measures the Stone of the Pregnant Woman</span></li><li class="wtl-find" style="--i:6"><span class="wtl-y">2014 CE</span><span class="wtl-k">Found</span><span class="wtl-t">DAI and Lebanese team uncover a c. 1,650 t block</span></li></ol><details class="srcs"><summary>Sources for this case (10)</summary><ol><li>Adam, J.-P. (1977). À propos du trilithon de Baalbek: le transport et la mise en œuvre des mégalithes. Syria 54(1/2): 31–63. <a href="https://doi.org/10.3406/syria.1977.6623" target="_blank" rel="noopener">doi:10.3406/syria.1977.6623</a></li><li>Abdul Massih, J. (2015). The Megalithic Quarry of Baalbek: Sector III, the Megaliths of Ḥajjar al-Ḥibla. Journal of Eastern Mediterranean Archaeology and Heritage Studies 3(4): 313–329. <a href="https://doi.org/10.5325/jeasmedarcherstu.3.4.0313" target="_blank" rel="noopener">doi:10.5325/jeasmedarcherstu.3.4.0313</a></li><li>Lohmann, D. (2010). Giant Strides towards Monumentality: The Architecture of the Jupiter Sanctuary in Baalbek/Heliopolis. Bollettino di Archeologia On Line, special volume: 22–29.</li><li>Ruprechtsberger, E. M. (1999). Vom Steinbruch zum Jupitertempel von Heliopolis/Baalbek (Libanon). Linzer Archäologische Forschungen 30: 7–56.</li><li>van Ess, M. (ed.) (2008). Baalbek/Heliopolis: Results of Archaeological and Architectural Research 2002–2005. Bulletin d&#x27;Archéologie et d&#x27;Architecture Libanaises, Hors-Série IV.</li><li>Wiegand, T. (ed.) (1921–1925). Baalbek: Ergebnisse der Ausgrabungen und Untersuchungen in den Jahren 1898 bis 1905. 3 vols. Berlin and Leipzig.</li><li>Adam, J.-P. &amp; Mathews, A. (1999). Roman Building: Materials and Techniques. Routledge.</li><li>Coulton, J. J. (1974). Lifting in Early Greek Architecture. Journal of Hellenic Studies 94: 1–19.</li><li>Hancock, G. (2015). Magicians of the Gods. Coronet.</li><li>Sitchin, Z. (1980). The Stairway to Heaven. Avon Books.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-baalbek" data-t="Baalbek: The Heaviest Stones Ever Moved"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Baalbek: The Heaviest Stones Ever Moved</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-baalbek</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-puma-punku-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Puma Punku H profile wall.JPG" data-cap="Tiwanaku, La Paz Department, Bolivia" data-big><figcaption></figcaption></figure><div class="sh-k">Impossible Megaliths</div><h2 class="sh-t" id="case-puma-punku-st" tabindex="-1">Puma Punku: The Lego Temple of the Andes</h2><p class="sh-s">Crisp right angles, repeated H-shaped blocks and metal cast into the stone at 3,850 m: Puma Punku looks like a kit. Who made the kit?</p><div class="sh-v"><span class="vstamp vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><p class="sh-claim"><b>What the stamp rates:</b> Puma Punku was built long before Tiwanaku, perhaps around 15,000 BCE, by a lost advanced culture.</p></div><p class="v4-q">Is Puma Punku a Tiwanaku temple, or the ruin of something far older?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Puma Punku in Bolivia has stone blocks cut so precisely they look machine-made, and a slab of 131 tonnes.</li><li>Some say it was built around 15,000 BCE by a lost culture.</li><li>Radiocarbon from the oldest fill of the platform gives 536 to 600 CE, and the pottery and designs are Tiwanaku.</li><li>The old date rested on assuming what one building was aligned to; small errors swing it by thousands of years.</li><li>The precision is real; it is a question about technique, not age.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Engineering</span><span class="thr">Astronomy</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="131" >131</b><span class="ctr-u"> t</span></div><div class="ctr-l">largest sandstone slab</div><div class="ctr-c">Protzen &amp; Nair 2013</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="90" >90</b><span class="ctr-u"> km</span></div><div class="ctr-l">from the andesite quarries</div><div class="ctr-c">Ponce Sanginés 1970</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="536" >536</b><span class="ctr-u"> CE</span></div><div class="ctr-l">earliest calibrated date for the platform fill</div><div class="ctr-c">Vranich 1999</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="40" >40</b><span class="ctr-u"> hours</span></div><div class="ctr-l">to copy one small andesite design by hand</div><div class="ctr-c">Protzen &amp; Nair 2013</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Puma Punku was built long before Tiwanaku, perhaps around 15,000 BCE, by a lost advanced culture.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Several independent lines agree on the first millennium AD: radiocarbon from the platform&#x27;s oldest fill (AD 536–600), Tiwanaku pottery and iconography, gateway designs shared with the rest of Tiwanaku, and a cramp alloy that belongs to the Middle Horizon. Posnansky&#x27;s great age rested on assuming what the Kalasasaya was aligned to, and small errors in that assumption swing the date by thousands of years. The precision is real and impressive, but it is a question about technique, not age.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">On the date, textbooks are right to sound sure. On how the andesite was worked they sound more certain than the evidence allows: no tools have been identified, experiments are few, and the modular system is still being studied. The mainstream has also tended to undersell how striking the standardisation is, which leaves room for more dramatic stories.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Radiocarbon from the lowest construction fill of the Pumapunku platform dates its first building to about AD 536–600, with three main building phases and repairs after that.<small>Vranich 1999, 2006</small></li><li>The largest slab, of red sandstone, measures about 7.8 × 5.2 × 1.1 m and weighs about 131 t; the sandstone came from a quarry about 10 km away.<small>Ponce Sanginés 1970; Protzen &amp; Nair 2013</small></li><li>The finely worked andesite pieces came from the Copacabana peninsula, about 90 km away across or around Lake Titicaca.<small>Ponce Sanginés 1970</small></li><li>Blocks were tied with I-shaped cramps of a rare copper-arsenic-nickel bronze; at Pumapunku they were cast in place in carved sockets.<small>Lechtman 1998</small></li><li>Andesite H-blocks and gateway fragments repeat standard profiles closely enough to be interchangeable, and miniature stone models exist in several copies.<small>Protzen &amp; Nair 2002, 2013</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Which tools and abrasives shaped the andesite: no tool kit has been identified at the site.</li><li>How the andesite was moved 90 km: by reed boats or rafts across the lake, overland, or both.</li><li>What the finished temple looked like, since the stones were scattered and many removed.</li><li>Whether the platform stones are natural rock or a cast geopolymer, as Joseph Davidovits argues.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Centuries of stone robbing for churches, houses and railway ballast, plus treasure hunting, removed much of the building.</li><li>Only about 2 of the site&#x27;s roughly 17 hectares have been excavated, and two buried platforms remain unexplored.</li><li>Tiwanaku left no written records, so the builders&#x27; own plans and names are unknown.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Pumapunku is one of the great ceremonial platforms of Tiwanaku, the highland city by Lake Titicaca that flourished from about AD 500 to 1000. Radiocarbon dat
