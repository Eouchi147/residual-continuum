-sp:3"/><line x1="360" y1="36" x2="390" y2="30" class="wx-line"/></g><g class="wx-st" data-s="4"><circle cx="500" cy="232" r="9" class="wx-num"/><text x="500" y="236" text-anchor="middle" class="wx-numt">4</text><text x="516" y="236" class="wx-t-b">Undercut with a borer</text><text x="516" y="251" class="wx-t-s">a crescent stone bit on a</text><text x="516" y="265" class="wx-t-s">forked shaft, weighted by</text><text x="516" y="279" class="wx-t-s">two stones, grinds the belly</text></g><g class="wx-st" data-s="5"><path d="M342,150 L342,190 C320,200 282,226 282,264 C282,300 300,326 320,338 L400,338 C420,326 438,300 438,264 C438,226 400,200 378,190 L378,150 Z" class="wx-hl"/><circle cx="32" cy="398" r="9" class="wx-num"/><text x="32" y="402" text-anchor="middle" class="wx-numt">5</text><text x="48" y="402" class="wx-t-b">Grind and polish, inside and out</text><text x="48" y="417" class="wx-t-s">finer sand, then polishing stones</text><text x="520" y="398" class="wx-t-n wx-t-a">c. 800 hours</text><text x="520" y="414" class="wx-t-s">Stocks's estimate, one museum vase</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Shape the outside: the blank is pounded with hammerstones and ground with sandstone.</p><ol class="wx-steplist"><li>Shape the outside: the blank is pounded with hammerstones and ground with sandstone.</li><li>Tube drill: a bow spins a copper tube; dry quartz sand under it does the cutting.</li><li>Core out: the central core is snapped out, leaving a hole through the neck.</li><li>Undercut: a crescent stone borer on a forked, weighted shaft grinds the belly wider than the neck.</li><li>Finish: inside and outside are ground and polished; about 800 hours for one vessel (Stocks).</li></ol><figcaption>The sequence reconstructed from tomb scenes, finds of cores and borers, and Denys Stocks&#x27;s experiments. <span class="wx-src">Based on: Stocks 2003 (tube drilling with sand, stone borers, time estimate); tool form after the &#x27;craft&#x27; hieroglyph and tomb scenes such as Rekhmire (Davies 1943). Schematic, not to scale.</span></figcaption><p class="vh">A section through a bulbous vase blank. Step 1: the outer shape is pounded and ground. Step 2: a bow spins a vertical shaft with a copper tube at its tip, drilling down through the neck while dry quartz sand, shown as small grains, does the cutting. Step 3: the core is removed, leaving a straight hole through the neck. Step 4: a forked shaft weighted by two stones carries a crescent-shaped stone bit into the vessel and grinds the belly wider than the neck. Step 5: the inside and outside are ground and polished; a label gives about 800 hours, Stocks&#x27;s estimate for one museum vessel.</p></figure></section><section class="wsec" id="stone-vases-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>How the hand method works</h3><p>The engineer and experimental archaeologist Denys Stocks spent years reproducing Egyptian stoneworking. His sequence begins with shaping the outside by pounding and grinding. A copper tube, spun by a bow, then drills down through the neck; the copper does not cut the stone, the dry quartz sand under it does, and the tube wears away steadily as it goes. The central core is snapped out, leaving a clean hole.</p><p>The hard part is the belly, which is wider than the neck. For this the craftsman used a borer: a crescent-shaped stone bit fixed to a forked shaft, pressed down by two heavy stones tied to the top and swung back and forth. Changing bits widened the cavity step by step until the walls were thin. Finally everything was ground and polished with finer abrasives. Stocks estimated that one vessel in the Manchester Museum would have taken about 800 hours, roughly three months of one specialist&#x27;s work.</p><aside class="wcall"><b>How do we know?</b><p>Three kinds of evidence meet. Art shows the weighted drill in use, from the Old Kingdom to the New Kingdom. Archaeology supplies the borers, the cores and unfinished pieces. Experiments show that copper tubes with sand, and stone borers, cut granite and softer stones and leave the same kinds of marks.</p></aside></section><section class="wsec" id="stone-vases-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The challengers and their scanners</h3><p>The precision case is new because the measurements are new. Adam Young of the Artifact Foundation argued that the vessels had never been measured properly and set out to scan them. Max Fomitchev-Zamilov of the research company Maximus Energy reported shape errors as small as 15 microns on some vases, and the collector Matt Beall, presenting a collection of 85 vessels in 2025, called the copper-and-stone explanation absurd and suggested lathes, perhaps with diamond tools.</p><p>Their strongest point deserves credit. Nobody in mainstream Egyptology had put these objects through modern metrology, and some hard-stone pieces do look astonishingly regular. The argument echoes the engineer Christopher Dunn, whose books have long claimed signs of machining in Egyptian stonework. And the logic is sound as far as it goes: if such numbers held for authentic ancient pieces, the story of early Egyptian technology would need rewriting.</p><figure class="wx wx--static" id="stone-vases-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">What &#x27;precision&#x27; means for a vase</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="What &#x27;precision&#x27; means for a vase"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" class="wx-svg" role="img" aria-labelledby="stone-vases-f2-t"><title id="stone-vases-f2-t">What precision means for a stone vase: roundness, centring and the size of the claimed errors</title><text x="24" y="24" class="wx-t-cap">Two measures of a round object · errors exaggerated</text><circle cx="100" cy="150" r="62" class="wx-guide"/><path d="M166,150 C168,182 140,200 120,214 C92,222 66,204 48,190 C30,166 44,138 42,120 C56,94 90,80 118,92 C150,100 160,124 166,150 Z" class="wx-stone3 wx-o60 wx-edge"/><text x="100" y="240" text-anchor="middle" class="wx-t-b">Circularity</text><text x="100" y="256" text-anchor="middle" class="wx-t-s">how round one slice is</text><circle cx="250" cy="150" r="62" class="wx-stone3 wx-o60 wx-edge"/><circle cx="264" cy="144" r="40" class="wx-paper wx-edge"/><circle cx="250" cy="150" r="3" class="wx-inkfill"/><circle cx="264" cy="144" r="3" class="wx-accfill wx-pulse"/><line x1="250" y1="150" x2="264" y2="144" class="wx-hl"/><text x="250" y="240" text-anchor="middle" class="wx-t-b">Concentricity</text><text x="250" y="256" text-anchor="middle" class="wx-t-s">do inner and outer</text><text x="250" y="270" text-anchor="middle" class="wx-t-s">share one centre?</text><line x1="350" y1="44" x2="350" y2="300" class="wx-guide"/><text x="380" y="60" class="wx-t-b">How small is small?</text><text x="380" y="76" class="wx-t-s">log scale, 10 µm to 1 mm</text><line x1="420" y1="280" x2="420" y2="100" class="wx-bold wx-draw" pathLength="1" style="--d:1"/><line x1="414" y1="280.0" x2="428" y2="280.0" class="wx-line"/><text x="436" y="284.0" class="wx-t-s wx-pop" style="--d:2">10 µm</text><line x1="414" y1="264.2" x2="428" y2="264.2" class="wx-line"/><text x="436" y="268.2" class="wx-t-b wx-t-a wx-pop" style="--d:3">claimed best: 15 µm</text><line x1="414" y1="243.6" x2="428" y2="243.6" class="wx-line"/><text x="436" y="247.6" class="wx-t-s wx-pop" style="--d:4">0.001 inch = 25.4 µm</text><line x1="414" y1="203.9" x2="428" y2="203.9" class="wx-line"/><text x="436" y="207.9" class="wx-t-s wx-pop" style="--d:5">human hair, c. 70 µm</text><line x1="414" y1="190.0" x2="428" y2="190.0" class="wx-line"/><text x="436" y="194.0" class="wx-t-s wx-pop" style="--d:6">paper, c. 100 µm</text><line x1="414" y1="100.0" x2="428" y2="100.0" class="wx-line"/><text x="436" y="104.0" class="wx-t-s wx-pop" style="--d:7">1 mm</text><rect x="24" y="316" width="672" height="92" rx="10" class="wx-card wx-edge-soft"/><text x="40" y="340" class="wx-t-b">What the 2025 peer-reviewed scan found (Fomitchev-Zamilov)</text><text x="40" y="360" class="wx-t-s">19 Petrie Museum vessels with known history vs 25 modern machine-made and 24 modern handmade vases.</text><text x="40" y="377" class="wx-t-s">Outside surfaces of the ancient vessels match the handmade group; machine-made pieces form a separate cluster.</text><text x="40" y="394" class="wx-t-s">Insides are rounder, nearly machine-like, but poorly centred: a pattern unlike either modern group.</text></svg></div></div><figcaption>Two ways to measure a round object, a log scale for the sizes involved, and the result of the 2025 peer-reviewed scan study. <span class="wx-src">Based on: Fomitchev-Zamilov 2025, npj Heritage Science 13: 659 (sample sizes and findings); 15 µm claim as reported in 2025 press coverage. Hair and paper thicknesses are typical values. Error shapes are illustrative, not data.</span></figcaption><p class="vh">Left: two cross-sections with exaggerated errors. Circularity shows a lumpy outline against a perfect dashed circle, labelled how round one slice is. Concentricity shows an inner circle whose centre is offset from the outer one, labelled do inner and outer share one centre. Right: a logarithmic scale from 10 micrometres to 1 millimetre, marking the claimed best error of 15 micrometres, one thousandth of an inch at 25.4 micrometres, a human hair at about 70 micrometres, paper at about 100 micrometres, and 1 millimetre. Below, a box summarises the 2025 study: 19 Petrie Museum vessels compared with 25 machine-made and 24 handmade modern vases; the ancient outer surfaces match the handmade group, and their insides are rounder but poorly centred.</p></figure></section><section class="wsec" id="stone-vases-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The provenance problem, and a surprising result</h3><p>Here the case runs into the oldest rule in archaeology: an object without a findspot cannot date itself. Most of the star vessels in the precision debate came from private collections and the antiquities market. Egypt has banned the sale and export of antiquities since its 1983 law, so pieces in circulation have uncertain histories, and modern Egyptian workshops make stone vessels, some of them on lathes. A perfect machine-made vase would be exactly what a modern workshop produces.</p><p>There is a second trap. Precision numbers depend on how a scan is processed: which surface points are kept, how a best-fit shape is chosen, and whether a chipped or weathered area is excluded. Two teams can scan the same vase and report different figures in good faith. That is why measurement protocols, control objects and raw data matter as much as the headline number.</p><p>Fresh from the field: in December 2025 Fomitchev-Zamilov himself published a peer-reviewed study in npj Heritage Science. He scanned 19 Predynastic vessels from the Petrie Museum in London, which have documented histories, alongside 25 modern machine-made and 24 modern handmade vases, and measured roundness and centring. The machine-made vases formed their own tight cluster. The ancient vessels&#x27; outer surfaces matched the modern handmade group; their insides were rounder but poorly centred, a pattern unlike either modern group. He also used the method to flag some private pieces as probably modern.</p><blockquote class="wpull"><p>When the vessels with known histories were measured, they looked handmade. That is what good science looks like: the test was proposed by a challenger and he published the answer.</p></blockquote></section><section class="wsec" id="stone-vases-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What an independent test needs</h3><p>The question is not closed, because the most precise claims concern vessels outside the study. A decisive test would scan a large set of vessels from recorded excavations, such as the Step Pyramid galleries and the early royal tombs at Abydos, in independent laboratories, blind to origin, with the raw scans released. Microscopes inside the vessels could separate the spiral marks a lathe leaves from the concentric grooves of a hand borer.</p><p>Replication should be scanned too: hard-stone vases made with copper tubes, sand and stone borers, timed and measured with the same equipment. Until an ultra-precise vessel turns up in a sealed, dated context, the lost-machine idea remains unsupported. Meanwhile the real achievement is plain to see: thousands of hours of patient, skilled work, repeated tens of thousands of times, in the first great age of Egyptian craft.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">3,800 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Predynastic stone vessels in Naqada graves</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">3,000 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Early Dynastic royal vessels in hard stone</span></li><li class="wtl-use" style="--i:2"><span class="wtl-y">2,660 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Djoser stores over 40,000 vessels in his pyramid</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">1,450 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Vessel drilling painted in the tomb of Rekhmire</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">2003 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Stocks publishes stoneworking experiments</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">2023 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Private vases scanned; precision claims spread</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2025 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Peer-reviewed metrology study of Petrie vessels</span></li></ol><details class="srcs"><summary>Sources for this case (10)</summary><ol><li>Fomitchev-Zamilov, M. (2025). A metrological method for manufacturing quality assessment and classification of ancient Egyptian stone vessels. npj Heritage Science 13: 659. <a href="https://doi.org/10.1038/s40494-025-02196-7" target="_blank" rel="noopener">doi:10.1038/s40494-025-02196-7</a></li><li>Stocks, D. A. (2003). Experiments in Egyptian Archaeology: Stoneworking Technology in Ancient Egypt. Routledge.</li><li>Aston, B. G. (1994). Ancient Egyptian Stone Vessels: Materials and Forms. Studien zur Archäologie und Geschichte Altägyptens 5, Heidelberger Orientverlag.</li><li>Aston, B. G., Harrell, J. A. &amp; Shaw, I. (2000). Stone. In P. T. Nicholson &amp; I. Shaw (eds), Ancient Egyptian Materials and Technology. Cambridge University Press, 5–77.</li><li>Lacau, P. &amp; Lauer, J.-P. (1959, 1965). La Pyramide à degrés IV–V: Inscriptions gravées sur les vases. Institut français d&#x27;archéologie orientale.</li><li>Petrie, W. M. F. (1937). Stone and Metal Vases. British School of Archaeology in Egypt.</li><li>Davies, N. de G. (1943). The Tomb of Rekh-mi-Rēʿ at Thebes. Metropolitan Museum of Art.</li><li>Wilkinson, T. A. H. (1999). Early Dynastic Egypt. Routledge.</li><li>Ancient Origins (2025). Do 6,000-year-old artifacts reveal the use of lost machinery in Predynastic Egypt? (report on the Beall collection and Fomitchev-Zamilov&#x27;s scans).</li><li>The Archaeologist (2023). Scanning a Predynastic granite vase to 1000th of an inch (report of the 2023 structured-light scan).</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-stone-vases" data-t="Egypt&#x27;s Stone Vases: Too Perfect for Human Hands?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Egypt&#x27;s Stone Vases: Too Perfect for Human Hands?</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-stone-vases</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-serapeum-boxes-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Serapeum Burial Vault Reconstruction.png" data-cap="Serapeum of Saqqara, Egypt" data-big><figcaption></figcaption></figure><div class="sh-k">Impossible Megaliths</div><h2 class="sh-t" id="case-serapeum-boxes-st" tabindex="-1">The Serapeum Boxes: Tombs for Bulls, or Something Older?</h2><p class="sh-s">Two dozen granite and basalt boxes of 60 tonnes or more, sunk in the dark under Saqqara. Were they really made for sacred bulls?</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> The Serapeum boxes were machined to modern precision by a lost technology and are older than the Apis burials.</p></div><p class="v4-q">Who made the Serapeum&#x27;s giant boxes, when, and how precisely?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>The Serapeum at Saqqara is the burial place of the Apis bulls, sacred animals of Memphis, used for about 1,400 years.</li><li>Its Greater Vaults hold 24 granite and basalt boxes; one box and lid weigh about 62 tonnes.</li><li>Engineer Christopher Dunn reported inside faces flat and square like machine-shop work, and argued the boxes are older than the bull cult.</li><li>Several boxes carry the names of kings of the 6th to 4th centuries BCE, when the vaults were in use.</li><li>The precision claim rests on a few spot checks; full laser scans of all 24 would settle it.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Engineering</span><span class="thr">Archaeology</span><span class="thr">Religion and myth</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="24" >24</b><span class="ctr-u"> boxes</span></div><div class="ctr-l">remain in the Greater Vaults</div><div class="ctr-c">Mariette 1857</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="62" >62</b><span class="ctr-u"> t</span></div><div class="ctr-l">box and lid together, one measured example</div><div class="ctr-c">Linant de Bellefonds, as reported</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="1400" >1,400</b><span class="ctr-u"> years</span></div><div class="ctr-l">of Apis burials at the site</div><div class="ctr-c">Dodson 2005</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="350" >350</b><span class="ctr-u"> m</span></div><div class="ctr-l">of tunnels in the Greater Vaults</div><div class="ctr-c">published site plans</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The Serapeum boxes were machined to modern precision by a lost technology and are older than the Apis burials.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Several boxes carry the names of Late Period kings, and the galleries, stelae and burial records form a dated sequence from the seventh century BCE onwards. The precision claim rests on spot checks with a 6-inch straightedge at a few places inside one or two boxes, never published as full measurements. Flat faces can be produced by hand lapping, and Late Period workshops made other superbly finished hard-stone sarcophagi. No box has been shown to be older than its gallery.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Guidebooks say simply that the boxes held bulls. That is well supported, but the confident tone hides real unknowns: we have no record of how boxes and lids were installed, no complete metrology survey, and little direct evidence of what each uninscribed box contained. The textbooks are right on who and when, and vague on how.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>The Serapeum was the burial place of the Apis bulls of Memphis for about 1,400 years, from Amenhotep III (14th century BCE) to the end of the Ptolemaic period.<small>Mariette 1857; Dodson 2005</small></li><li>The Greater Vaults were begun under Psamtik I (664–610 BCE) and extended under the Ptolemies; 24 stone boxes remain in them.<small>Mariette 1857</small></li><li>One box measured by Linant de Bellefonds is about 3.85 m long and 2.3 m wide, with a body of about 38 t and a lid of about 24 t.<small>as reported from Linant de Bellefonds</small></li><li>Some boxes carry royal inscriptions: Amasis II (red granite), Cambyses II (inscribed lid) and Khababash (year 2, c. 336 BCE).<small>Mariette 1857</small></li><li>Hundreds of stelae from the site record Apis burials and visits, many dated to regnal years.<small>Malinine, Posener &amp; Vercoutter 1968</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>How flat and square the inner surfaces really are, since no full independent survey of all boxes has been published.</li><li>Exactly how the boxes were hollowed and how the lids were set on them underground.</li><li>Whether any uninscribed box is older than the gallery it stands in.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>The Greater Vault boxes were robbed in antiquity; their original contents are largely lost.</li><li>No written account of how the boxes were made or installed survives.</li><li>Early excavation in the 1850s was poorly recorded by modern standards, and many finds were dispersed.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Egyptologists read the Serapeum as the catacomb of the Apis, the living sacred bull of Memphis. Each bull was mummified at death and buried with state ceremony. The Greater Vaults were cut from the time of Psamtik I, and the giant boxes belong to the Late and Ptolemaic periods, several dated by inscriptions of Amasis, Cambyses and Khababash, others by their position in a gallery that grew over time. Granite came from Aswan by river; hard-stone working with pounders, copper saws and drills fed with sand, and lapping with abrasive, can produce flat polished faces.</p><ul><li>Inscribed boxes date to the sixth and fourth centuries BCE.</li><li>Stelae record individual Apis burials by year and ruler.</li><li>Late Period workshops made other finely finished hard-stone sarcophagi for kings and officials.</li><li>Flat granite surfaces can be produced by lapping with sand, the same principle once used for engineering surface plates.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Engineer Christopher Dunn visited the Serapeum in 1995 with a 6-inch precision straightedge and square. He reported inside faces so flat that no light showed under the edge, and corners square to his instruments, comparable to surface plates in a modern machine shop. In Lost Technologies of Ancient Egypt (2010) he argued that such accuracy points to machine tools. Others add that the boxes were found empty, that some look better made than the crude Ptolemaic cartouches on them, and that they may be far older than the bull cult.</p><ul><li>Inner surfaces measured flat to his straightedge, rated to 0.0002 inch (about 5 µm).</li><li>Lids of about 25–30 t sit tightly on their boxes in cramped chambers.</li><li>Some inscriptions are crude compared with the stonework.</li><li>No complete bull burial was found in the Greater Vault boxes.</li></ul><div class="face-s"><b>Its strongest point</b><p>Moving and hollowing sixty-tonne granite boxes, then setting lids of more than 20 t on them inside narrow underground chambers, is extraordinary work, and no ancient record tells us how it was done.</p></div><p class="face-cr"><b>Credit</b> Christopher Dunn; independent researchers and video makers</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Publish full 3D laser scans of all 24 boxes by independent metrologists, with raw data, to replace spot checks with complete surfaces.</li><li>Study tool marks on the inner walls, floors and corners under magnification and compare them with dated Late Period sarcophagi.</li><li>Date mortar, plaster and debris in the chamber sealing walls, and the fill beneath the boxes.</li><li>Test lapping by hand on granite and measure the flatness achieved with the same instruments.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,139 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Serapeum Boxes: Tombs for Bulls, or Something Older?"><button type="button" class="wtoc-i" data-go="serapeum-boxes-s1">Boxes in the dark</button><button type="button" class="wtoc-i" data-go="serapeum-boxes-s2">What is solid</button><button type="button" class="wtoc-i" data-go="serapeum-boxes-s3">The challenge: surface-plate flatness</button><button type="button" class="wtoc-i" data-go="serapeum-boxes-s4">Testing the claims</button><button type="button" class="wtoc-i" data-go="serapeum-boxes-s5">How to move a sixty-tonne box</button><button type="button" class="wtoc-i" data-go="serapeum-boxes-s6">What would settle it</button></nav></div><section class="wsec" id="serapeum-boxes-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Boxes in the dark</h3><p>In 1850 the young French archaeologist Auguste Mariette saw the head of a sphinx sticking out of the sand at Saqqara. He followed an avenue of sphinxes to a buried temple, and in November 1851 he broke into a vast tunnel cut into the rock. Along it, in side chambers to left and right, stood enormous polished boxes of granite and basalt, each big enough to park a small car in, their lids pushed aside by robbers long before.</p><p>The Serapeum is one of the most atmospheric places in Egypt, and one of the most argued about online. Visitors walk a lit gallery past boxes weighing sixty tonnes and more, set into chambers barely wider than they are, and ask two questions. How did anyone get them in there? And were they really made to hold the bodies of bulls?</p><figure class="wx wx--static" id="serapeum-boxes-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">The Greater Vaults and one box to scale</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The Greater Vaults and one box to scale"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" class="wx-svg" role="img" aria-labelledby="serapeum-boxes-f1-t"><title id="serapeum-boxes-f1-t">Schematic plan of the Greater Vaults of the Serapeum and one granite box drawn to scale</title><text x="24" y="24" class="wx-t-cap">Greater Vaults · schematic plan, chambers simplified</text><rect x="40" y="102" width="530" height="22" class="wx-sand wx-edge wx-growx" style="--d:1"/><rect x="90" y="72" width="26" height="30" class="wx-card wx-edge-soft"/><rect x="96" y="78" width="14" height="18" class="wx-stone3 wx-edge wx-pop" style="--d:2"/><rect x="90" y="124" width="26" height="30" class="wx-card wx-edge-soft"/><rect x="96" y="130" width="14" height="18" class="wx-stone3 wx-edge wx-pop" style="--d:3"/><rect x="130" y="72" width="26" height="30" class="wx-card wx-edge-soft"/><rect x="136" y="78" width="14" height="18" class="wx-stone3 wx-edge wx-pop" style="--d:4"/><rect x="130" t><polygon points="20,106 40,106 40,120 20,120" class="wx-stone wx-edge-soft"/><text x="24" y="60" class="wx-t-s">entrance</text><line x1="30" y1="64" x2="30" y2="102" class="wx-thin"/><line x1="20" y1="226" x2="700" y2="226" class="wx-guide"/><text x="24" y="250" class="wx-t-cap">One box to scale · 1 m = 40 px</text><g class="wx-grow" style="--d:3"><rect x="60" y="339.2" width="154" height="92.8" class="wx-stone3 wx-edge"/></g><g class="wx-pop" style="--d:6"><rect x="56" y="300" width="162" height="39.2" class="wx-stone2 wx-edge"/></g><g class="wx-grow" style="--d:4"><rect x="270" y="339.2" width="92.8" height="92.8" class="wx-stone3 wx-edge"/><rect x="286" y="351" width="60.8" height="81" class="wx-paper wx-o60 wx-edge-soft"/></g><g class="wx-pop" style="--d:7"><rect x="266" y="300" width="100.8" height="39.2" class="wx-stone2 wx-edge"/></g><line x1="20" y1="432" x2="440" y2="432" class="wx-line"/><text x="137" y="454" text-anchor="middle" class="wx-t-s">side, c. 3.85 m long</text><text x="316" y="454" text-anchor="middle" class="wx-t-s">end, c. 2.3 m wide</text><text x="316" y="395" text-anchor="middle" class="wx-t-s">cavity</text><text x="316" y="408" text-anchor="middle" class="wx-t-s">(approx.)</text><circle cx="410" cy="370.5" r="7" class="wx-inkfill"/><line x1="410" y1="377.5" x2="410" y2="404" class="wx-line"/><line x1="410" y1="404" x2="400" y2="432" class="wx-line"/><line x1="410" y1="404" x2="420" y2="432" class="wx-line"/><line x1="396" y1="386" x2="424" y2="386" class="wx-line"/><text x="410" y="356" text-anchor="middle" class="wx-t-s">1.7 m</text><g class="wx-pop" style="--d:9"><text x="470" y="310" class="wx-t-b">Lid</text><text x="470" y="326" class="wx-t-n wx-t-a">c. 24 t</text><text x="530" y="326" class="wx-t-s">about 1 m thick</text><text x="470" y="372" class="wx-t-b">Box</text><text x="470" y="388" class="wx-t-n wx-t-a">c. 38 t</text><text x="530" y="388" class="wx-t-s">granite or basalt</text><text x="470" y="418" class="wx-t-s">total c. 60–70 t; one example</text><text x="470" y="432" class="wx-t-s">measured by Linant de Bellefonds</text></g><rect x="600" y="456" width="40" height="4" class="wx-inkfill"/><text x="646" y="462" class="wx-t-s">1 m</text></svg></div></div><figcaption>A schematic plan of the Greater Vaults with side chambers and boxes, and one measured box drawn to scale next to a person. <span class="wx-src">Based on: Box dimensions and weights: the example measured by Linant de Bellefonds as reported in the standard descriptions; body height taken as c. 2.3 m. Plan after Mariette&#x27;s published plan, simplified; chamber number and spacing are schematic. Tunnel length from published site descriptions.</span></figcaption><p class="vh">Top: a schematic plan of a long gallery entered from the left, with side chambers on both sides, each holding a small rectangle for a stone box, and later side galleries at the right end. Labels: main gallery begun under Psamtik I, extended under the Ptolemies, tunnels about 350 m in total, 24 boxes remain. Bottom: one box at 40 pixels per metre in side view, about 3.85 m long, and end view, about 2.3 m wide, with an approximate cavity, and a lid on each. A 1.7 m person stands beside them, reaching below the top of the box. Labels: lid about 24 tonnes and about 1 m thick; box about 38 tonnes, granite or basalt; total about 60–70 tonnes.</p></figure></section><section class="wsec" id="serapeum-boxes-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What is solid</h3><p>The Apis was a living sacred bull kept at Memphis, the herald of the god Ptah. When it died it was mummified and buried with state ceremony, and a new Apis was sought. Bulls were buried at Saqqara from the reign of Amenhotep III in the fourteenth century BCE, first in separate tombs. Prince Khaemwaset, a son of Ramesses II, opened a shared gallery, the Lesser Vaults. The Greater Vaults, with the giant boxes, were begun under Psamtik I (664–610 BCE) and extended under the Ptolemies until the tunnels ran to about 350 m.</p><p>Twenty-four boxes remain there, of red and grey granite, basalt and similar hard stones. One measured by the engineer Linant de Bellefonds is about 3.85 m long and 2.3 m wide, with a body of about 38 tonnes and a lid of about 24. Some carry royal names: a red granite box of Amasis II, a grey granite box of the Persian king Cambyses with an inscribed lid, and one of the short-lived ruler Khababash, dated to his second year, about 336 BCE. Hundreds of stelae left by priests and visitors record burials of individual bulls by year and reign.</p><p>The site was also a place of pilgrimage. Above ground an avenue of sphinxes, probably laid out under Nectanebo I in the fourth century BCE, led to the temple, and Greek and Egyptian visitors left dedications for centuries. Under the Ptolemies the cult of Apis merged with Osiris into the god Serapis, whose name the whole complex still carries. A bull burial was a national event, attended by priests from across Egypt, and its date was worth recording in stone.</p><aside class="wcall"><b>How do we know?</b><p>The dating does not rest on one clue. Royal inscriptions on boxes, stelae dated to regnal years, the growth of the galleries from the older Lesser Vaults outward, and burial goods in the earlier tombs, including canopic jars and bovine bones, fit together into one sequence of Apis burials across fourteen centuries.</p></aside></section><section class="wsec" id="serapeum-boxes-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The challenge: surface-plate flatness</h3><p>In 1995 the American engineer Christopher Dunn, a machinist by training, climbed into a box with a broken corner carrying a 6-inch precision straightedge rated to 0.0002 inch, about 5 microns. Laid against the inner wall, he reported, it showed no light, whichever way he turned it. A precision square seemed to sit true between lid and wall. He compared the surfaces to the surface plates used to calibrate machine-shop tools, and in Lost Technologies of Ancient Egypt (2010) argued that only machining could explain them.</p><p>Others have gone further. Because the Greater Vault boxes were found without intact bull mummies, some suggest they were never bull coffins at all, that they are older than the tunnels and were reused, or that the rough royal cartouches on a few were later additions to much finer stonework. The strongest part of this case is simple: the logistics are staggering, and nobody wrote down how it was done.</p><blockquote class="wpull"><p>A 6-inch straightedge can tell you a patch is flat. It cannot tell you a box is.</p></blockquote></section><section class="wsec" id="serapeum-boxes-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Testing the claims</h3><p>Dunn&#x27;s check was real but small: a few placements of a short straightedge inside one or two boxes, never published as a full survey. A surface can be locally flat in many places and still wander over its whole area, and other boxes show visibly uneven faces and rounded interior corners. Flatness itself is not a machine signature. Engineering surface plates were traditionally made by lapping, rubbing surfaces together with abrasive until the high spots wear away, which is a hand method that Egyptians used on hard stone with quartz sand.</p><p>The dating evidence also runs one way. Boxes with the names of Amasis, Cambyses and Khababash sit in the same gallery system as the uninscribed ones, and the gallery itself was cut in the Late Period. Late Period workshops made other superbly finished hard-stone sarcophagi for kings and officials. The absence of intact bulls in the Greater Vaults is what ancient robbery predicts: the lids were pushed aside precisely so robbers could reach the valuables inside.</p><p>There is a fair point buried in the challenge, though. Mainstream accounts rarely discuss the boxes as engineering at all, and the only published measurements of their surfaces come from a challenger with a straightedge. That is a gap Egyptology created, and one it could close with a week of modern scanning.</p></section><section class="wsec" id="serapeum-boxes-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>How to move a sixty-tonne box</h3><p>The engineering is still impressive. Granite boxes came from Aswan, probably roughed out at the quarry to save weight, then floated some 900 km downstream on barges. Egyptians routinely moved heavier loads: Hatshepsut&#x27;s standing obelisk at Karnak weighs roughly 300 tonnes. At Saqqara a box would be dragged on a sledge over a timber track, down into the gallery and along it, hauled with ropes by teams of workers.</p><figure class="wx wx--steps" id="serapeum-boxes-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">From Aswan to a side chamber</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="From Aswan to a side chamber"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" class="wx-svg" role="img" aria-labelledby="serapeum-boxes-f2-t"><title id="serapeum-boxes-f2-t">From Aswan to a Serapeum chamber: how a granite box could be made, moved and installed, in five steps</title><defs><marker id="serapeum-boxes-f2-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" class="wx-accfill"/></marker></defs><text x="24" y="24" class="wx-t-cap">Journey (schematic) · gallery plan, widths approximate</text><rect x="20" y="44" width="190" height="370" rx="10" class="wx-card wx-edge-soft"/><path d="M180,60 C165,120 195,170 172,230 C155,290 190,340 176,400" class="wx-bold wx-s2 wx-o40"/><path d="M180,60 C165,120 195,170 172,230 C155,290 190,340 176,400" class="wx-flow wx-s2 wx-flow-r"/><circle cx="180" cy="62" r="5" class="wx-accfill"/><text x="168" y="66" text-anchor="end" class="wx-t-b">Saqqara</text><circle cx="176" cy="398" r="5" class="wx-c4"/><text x="164" y="402" text-anchor="end" class="wx-t-b">Aswan</text><text x="44" y="236" class="wx-t-s">Nile, c. 900 km</text><text x="44" y="250" class="wx-t-s">downstream</text><g class="wx-st" data-s="1"><rect x="44" y="350" width="40" height="22" class="wx-c4 wx-o60 wx-edge"/><rect x="50" y="354" width="28" height="14" class="wx-paper wx-edge-soft"/><circle cx="32" cy="304" r="9" class="wx-num"/><text x="32" y="308" text-anchor="middle" class="wx-numt">1</text><text x="44" y="308" class="wx-t-b">Quarry, hollow</text><text x="44" y="324" class="wx-t-s">pounders, saws,</text><text x="44" y="338" class="wx-t-s">tube drills, sand</text></g><g class="wx-st" data-s="2"><g class="wx-bob"><path d="M150,150 L200,150 L192,162 L158,162 Z" class="wx-wood wx-edge"/><rect x="162" y="140" width="24" height="10" class="wx-c4 wx-o60 wx-edge"/></g><circle cx="32" cy="140" r="9" class="wx-num"/><text x="32" y="144" text-anchor="middle" class="wx-numt">2</text><text x="44" y="144" class="wx-t-b">By barge</text><text x="44" y="160" class="wx-t-s">with the current</text></g><rect x="250" y="130" width="450" height="80" class="wx-sand wx-o60 wx-edge"/><text x="262" y="124" class="wx-t-s">gallery (plan)</text><rect x="420" y="210" width="120" height="150" class="wx-sand wx-o40 wx-edge"/><text x="480" y="378" text-anchor="middle" class="wx-t-s">side chamber</text><g class="wx-st wx-hide" data-only="3"><rect x="270" y="135.2" width="115.5" height="69.6" class="wx-stone3 wx-edge"/><line x1="268" y1="208" x2="390" y2="208" class="wx-wood wx-bold"/><path d="M388,170 L470,170" class="wx-flow wx-s1" marker-end="url(#serapeum-boxes-f2-ar)"/></g><g class="wx-st" data-s="3"><circle cx="264" cy="72" r="9" class="wx-num"/><text x="264" y="76" text-anchor="middle" class="wx-numt">3</text><text x="280" y="70" class="wx-t-b">Down the gallery</text><text x="280" y="85" class="wx-t-s">on a sledge over a timber</text><text x="280" y="99" class="wx-t-s">track, hauled with ropes</text></g><g class="wx-st wx-hide" data-only="4"><rect x="445.2" y="160" width="69.6" height="115.5" class="wx-stone3 wx-edge"/><line x1="430" y1="290" x2="450" y2="262" class="wx-bold wx-s6"/><line x1="530" y1="290" x2="510" y2="262" class="wx-bold wx-s6"/></g><g class="wx-st" data-s="4"><circle cx="564" cy="236" r="9" class="wx-num"/><text x="564" y="240" text-anchor="middle" class="wx-numt">4</text><text x="580" y="234" class="wx-t-b">Turn and push</text><text x="580" y="249" class="wx-t-s">levers swing it</text><text x="580" y="263" class="wx-t-s">into the chamber</text></g><g class="wx-st" data-s="5"><rect x="445.2" y="232" width="69.6" height="115.5" class="wx-stone3 wx-edge"/><rect x="449.2" y="236" width="61.6" height="107.5" class="wx-stone2 wx-edge-soft"/><line x1="420" y1="212" x2="540" y2="212" class="wx-hl"/><circle cx="564" cy="306" r="9" class="wx-num"/><text x="564" y="310" text-anchor="middle" class="wx-numt">5</text><text x="580" y="304" class="wx-t-b">Burial and lid</text><text x="580" y="319" class="wx-t-s">the Apis inside, lid</text><text x="580" y="333" class="wx-t-s">slid on, chamber sealed</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Quarry and hollow: at Aswan the box is cut and hollowed with dolerite pounders, copper saws and tube drills fed with sand.</p><ol class="wx-steplist"><li>Quarry and hollow: at Aswan the box is cut and hollowed with dolerite pounders, copper saws and tube drills fed with sand.</li><li>By barge: the box floats about 900 km down the Nile to Memphis.</li><li>Down the gallery: on a sledge over a timber track, hauled with ropes.</li><li>Turn and push: levers and rollers swing it sideways into its chamber.</li><li>Burial: the mummified Apis is placed inside, the lid slid on and the chamber walled up.</li></ol><figcaption>One plausible sequence for making, moving and installing a box, reconstructed from Egyptian practice elsewhere. No ancient text records the method. <span class="wx-src">Based on: Reconstruction based on Arnold 1991 and Stocks 2003 (hard-stone working and haulage) and Klemm &amp; Klemm 2008 (Aswan granite). Gallery and chamber widths approximate; box plan at c. 30 px per metre.</span></figcaption><p class="vh">Left: a schematic strip of the Nile with Aswan at the bottom and Saqqara at the top, about 900 km downstream. Step 1: at Aswan a granite block is quarried and hollowed with pounders, copper saws, tube drills and sand. Step 2: the box travels downstream on a barge. Right: a plan of a gallery with a side chamber. Step 3: the box on a sledge is hauled down the gallery over a timber track. Step 4: levers swing the box into the side chamber. Step 5: the box sits in the chamber with its lid on, the Apis inside, and the chamber mouth sealed.</p></figure><p>The tight part is the turn into a side chamber. Levers, rollers and patient work can swing a box sideways a few centimetres at a time. How the lids were placed is less clear: they may have been set on props or sand and lowered after the burial. No ancient text describes the method, and the answer is reconstruction. It is honest to say that this remains an open engineering question, not a mystery beyond human reach.</p></section><section class="wsec" id="serapeum-boxes-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What would settle it</h3><p>The Serapeum reopened in 2012 after a decade of conservation, and since 2020 a mission has worked to stabilise the older galleries. That creates an opportunity. A full, independent 3D scan of all 24 boxes, inside and out, with raw data released, would replace a quarter century of anecdotes with numbers. Tool marks inside the boxes, compared under magnification with dated Late Period sarcophagi, would show how the surfaces were finished.</p><p>Dating mortar and debris in the chamber sealing walls, and the fill beneath the boxes, would test the idea of reuse. Until then, the evidence strongly supports the Late Period and Ptolemaic date and the Apis burials. The boxes deserve their fame as one of the heaviest and most precise stone projects of ancient Egypt, carried out by people whose working notes are lost.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-use" style="--i:0"><span class="wtl-y">1,370 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">First known Apis burials, under Amenhotep III</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">1,250 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Khaemwaset founds the Lesser Vaults</span></li><li class="wtl-build" style="--i:2"><span class="wtl-y">612 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Greater Vaults in use under Psamtik I</span></li><li class="wtl-build" style="--i:3"><span class="wtl-y">550 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Box inscribed for Amasis II</span></li><li class="wtl-build" style="--i:4"><span class="wtl-y">336 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Khababash, year 2: a burial box inscribed</span></li><li class="wtl-loss" style="--i:5"><span class="wtl-y">30 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Last documented Apis burials</span></li><li class="wtl-find" style="--i:6"><span class="wtl-y">1851 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Mariette enters the Greater Vaults</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">1995 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Dunn measures a box with a straightedge</span></li><li class="wtl-event" style="--i:8"><span class="wtl-y">2012 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Reopened after conservation</span></li></ol><details class="srcs"><summary>Sources for this case (9)</summary><ol><li>Mariette, A. (1857). Le Sérapéum de Memphis. Gide, Paris.</li><li>Malinine, M., Posener, G. &amp; Vercoutter, J. (1968). Catalogue des stèles du Sérapéum de Memphis. Imprimerie nationale, Paris.</li><li>Vercoutter, J. (1962). Textes biographiques du Sérapéum de Memphis. Champion, Paris.</li><li>Dodson, A. (2005). Bull cults. In S. Ikram (ed.), Divine Creatures: Animal Mummies in Ancient Egypt. American University in Cairo Press.</li><li>Thompson, D. J. (2012). Memphis under the Ptolemies. 2nd edn, Princeton University Press.</li><li>Arnold, D. (1991). Building in Egypt: Pharaonic Stone Masonry. Oxford University Press.</li><li>Klemm, R. &amp; Klemm, D. D. (2008). Stones and Quarries in Ancient Egypt. British Museum Press.</li><li>Stocks, D. A. (2003). Experiments in Egyptian Archaeology: Stoneworking Technology in Ancient Egypt. Routledge.</li><li>Dunn, C. (2010). Lost Technologies of Ancient Egypt: Advanced Engineering in the Temples of the Pharaohs. Bear &amp; Company.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-serapeum-boxes" data-t="The Serapeum Boxes: Tombs for Bulls, or Something Older?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Serapeum Boxes: Tombs for Bulls, or Something Older?</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-serapeum-boxes</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-gunung-padang-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Situs Gunung Padang.jpg" data-cap="Gunung Padang, Cianjur, West Java, Indonesia" data-big><figcaption></figcaption></figure><div class="sh-k">Impossible Megaliths</div><h2 class="sh-t" id="case-gunung-padang-st" tabindex="-1">Gunung Padang: The Pyramid That Was Retracted</h2><p class="sh-s">A hilltop of stone terraces in Java was hailed in 2023 as a 27,000-year-old pyramid. Then the paper was withdrawn. What is really in the hill?</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> Gunung Padang contains a human-built pyramid whose construction began around 27,000 years ago.</p></div><p class="v4-q">Is there a human-made structure tens of thousands of years old inside Gunung Padang?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Gunung Padang in Java is a hill with five stone terraces built from natural rock columns.</li><li>A 2023 paper said a human-built pyramid inside it began 27,000 years ago; the journal retracted it in 2024.</li><li>The dates came from soil between rocks, with no tools, hearths or bones in the dated layers.</li><li>Columnar rock forms naturally as lava cools, so arranged-looking columns are not proof of building.</li><li>The visible terraces date to roughly the last 2,500 years; an older phase inside is not ruled out, just not shown.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Geology</span><span class="thr">Archaeology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="885" >885</b><span class="ctr-u"> m</span></div><div class="ctr-l">above sea level</div><div class="ctr-c">national heritage site records</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="370" >370</b><span class="ctr-u"> steps</span></div><div class="ctr-l">andesite stairway to the terraces</div><div class="ctr-c">national heritage site records</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="27000" >27,000</b><span class="ctr-u"> years</span></div><div class="ctr-l">age claimed in 2023, retracted in 2024</div><div class="ctr-c">Natawidjaja et al. 2023</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="5" >5</b><span class="ctr-u"> terraces</span></div><div class="ctr-l">on the hilltop</div><div class="ctr-c">site surveys</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Gunung Padang contains a human-built pyramid whose construction began around 27,000 years ago.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The claim rests on radiocarbon dates from soil between rocks, with no tools, hearths, bones or unambiguous construction features in the dated layers. That is why the journal retracted the paper. Columnar andesite forms naturally, so arranged-looking columns are not in themselves evidence of building. The interior has not been excavated, so an older human phase cannot be ruled out, but nothing yet shows one. The evidence for the visible terraces supports a date within the last 2,500 years or so.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Mainstream statements that the hill is natural and the terraces are late are reasonable, but they rest on cores and surface work rather than a deep excavation, and the terrace dates themselves vary by centuries. The confident dismissal is a little ahead of the digging. Still, the burden lies with the extraordinary claim, and it has not met it.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Gunung Padang is a megalithic site of five stone terraces at about 885 m above sea level, reached by a stairway of some 370 andesite steps.<small>national heritage site records</small></li><li>The terraces are built of natural columnar andesite, stone that forms long prisms as lava cools, taken from the hill and its surroundings.<small>site surveys; Yondri</small></li><li>Archaeologists date the surface terraces to roughly the last centuries BCE to the first millennium CE; published estimates range from the 2nd to the 8th century CE for main use.<small>Yondri; Simanjuntak</small></li><li>A 2023 paper in Archaeological Prospection claimed construction began 27,000–16,000 years ago; the journal retracted it in March 2024.<small>Natawidjaja et al. 2023; retraction notice 2024</small></li><li>The retraction stated that the dated soil samples were not associated with any artefacts or features reliably interpreted as man-made.<small>Archaeological Prospection 2024</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether any layer below the visible terraces is artificial, as Natawidjaja&#x27;s team maintains.</li><li>What the geophysical anomalies read as &#x27;chambers&#x27; really are: cavities, loose rubble or natural features.</li><li>How old the terraces themselves are, since estimates span most of a millennium.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>No deep, fully published archaeological excavation has tested the interior of the hill.</li><li>Tropical rain and acid soils destroy bone, wood and charcoal quickly, so early organic traces may not survive.</li><li>Results of the government-backed excavation begun in 2025 had not been published in a peer-reviewed form when this was written.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Gunung Padang is an important megalithic sanctuary built by people in West Java, probably in the late first millennium BCE and early first millennium CE, on top of a natural hill of volcanic rock. The builders used prismatic andesite columns that form naturally as lava cools, which is why the stones look shaped. The hill&#x27;s interior, as far as cores show, is the andesite body itself with weathered rubble and soil in its cracks. Radiocarbon dates on that soil date the soil, not a building, and no artefacts from Ice Age people have been found in it.</p><ul><li>Columnar jointing is a common natural feature of andesite and basalt.</li><li>The dated deep samples were soil, with no associated tools, hearths or bones.</li><li>Organic carbon in soil can be older or younger than any structure above it.</li><li>No Ice Age settlement has been found at or near the site.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Geologist Danny Hilman Natawidjaja and colleagues combined drill cores, seismic tomography, ground-penetrating radar and electrical imaging and argued that Gunung Padang is a multi-phase pyramid. In their model, a natural lava hill was sculpted between about 25,000 and 14,000 BCE, built over around 7900–6100 and 6000–5500 BCE, and topped by the visible terraces around 2000–1100 BCE, with large cavities inside. Graham Hancock made the site the opening story of his Netflix series Ancient Apocalypse (2022) as possible evidence of a lost Ice Age civilisation.</p><ul><li>Cores show arranged columns with fine fill between them, which they read as mortar.</li><li>Soil sealed between rock layers deep in the hill gives ages far older than the surface.</li><li>Geophysics shows voids; one borehole lost about 32,000 litres of drilling water.</li><li>The authors say soil within construction layers is a standard way to date them.</li></ul><div class="face-s"><b>Its strongest point</b><p>Cores and geophysics do show layered, disturbed material and voids beneath the terraces, and soil deep in the hill is thousands of years older than the surface; if any of those deeper layers is artificial, Gunung Padang would be older than any known monument.</p></div><p class="face-cr"><b>Credit</b> Danny Hilman Natawidjaja; Graham Hancock</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Excavate a deep, stepped trench through the terraces into the hill, fully recorded and published, with independent specialists on site.</li><li>Date charcoal, tools, hearths or other human traces sealed inside a construction layer, not bulk soil.</li><li>Use optically stimulated luminescence to date when buried surfaces last saw daylight.</li><li>Test the &#x27;chambers&#x27; directly with a borehole camera or excavation, and publish the raw geophysical data.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,099 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Gunung Padang: The Pyramid That Was Retracted"><button type="button" class="wtoc-i" data-go="gunung-padang-s1">A pyramid in the rainforest?</button><button type="button" class="wtoc-i" data-go="gunung-padang-s2">What is solid</button><button type="button" class="wtoc-i" data-go="gunung-padang-s3">The 27,000-year claim</button><button type="button" class="wtoc-i" data-go="gunung-padang-s4">Why the paper was retracted</button><button type="button" class="wtoc-i" data-go="gunung-padang-s5">What the hill may still hide</button><button type="button" class="wtoc-i" data-go="gunung-padang-s6">What would settle it</button></nav></div><section class="wsec" id="gunung-padang-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A pyramid in the rainforest?</h3><p>The first episode of Graham Hancock&#x27;s Netflix series Ancient Apocalypse, released in November 2022, opens on a green hill in West Java. At the top, five terraces are paved and walled with long, angular stones, stacked like firewood, reached by a stairway of some 370 steps. Beside Hancock stands the Indonesian geologist Danny Hilman Natawidjaja, who believes the hill is not a hill at all but a pyramid, and that its oldest parts were built during the last Ice Age.</p><p>A year later, in October 2023, Natawidjaja and eleven colleagues published that claim in a peer-reviewed journal, Archaeological Prospection. Headlines around the world announced the oldest pyramid on Earth, perhaps 27,000 years old. Five months after that, the journal retracted the paper. Gunung Padang is now a case study in how a real site, real data and a very big claim can come apart.</p><blockquote class="wpull"><p>The terraces are real and ancient. The question is what lies beneath them, and how to date it.</p></blockquote></section><section class="wsec" id="gunung-padang-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What is solid</h3><p>Gunung Padang, a name often translated as &#x27;mountain of light&#x27;, sits at about 885 m above sea level in Cianjur Regency. It was first recorded by a Dutch visitor in 1890 and listed by the geologist Rogier Verbeek the following year; the archaeologist N. J. Krom described it in 1914. Local farmers drew fresh attention to it in 1979, and it became a national site in 2014.</p><p>The terraces are built from prisms of andesite, 1 to 3 m long with three to six sides. Such columns form naturally when lava cools and cracks, and the hill itself is made of this rock, so the builders had an abundant supply of ready-shaped stone. Indonesian archaeologists place the megalithic sanctuary in roughly the last centuries BCE to the first millennium CE: Lutfi Yondri has argued for the 2nd to 5th centuries CE, while Harry Truman Simanjuntak suggested the 6th to 8th centuries. Either way it is a major prehistoric monument of Southeast Asia.</p><p>Walk the terraces and the site&#x27;s purpose feels clear even without a written record. The stones mark out enclosures, paths and small platforms, oriented roughly towards the volcano Gede-Pangrango to the north. Megalithic terraced sanctuaries like this, built for gatherings and ancestor rites, are known elsewhere in the Sundanese and wider Austronesian world. Some of the columns are said to ring when struck, and local tradition treats the hill as a sacred place to this day.</p></section><section class="wsec" id="gunung-padang-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The 27,000-year claim</h3><p>Natawidjaja&#x27;s team spent years drilling cores and imaging the hill with seismic waves, radar and electrical resistivity. They reported layers under the terraces that looked organised: columns set in rows, fine material between them that they read as mortar, and zones that behaved like cavities. In one borehole, about 32,000 litres of drilling water vanished into the hill.</p><p>They then radiocarbon-dated soil from between the rocks at different depths and built a sequence. A natural lava hill, they proposed, was first sculpted between about 25,000 and 14,000 BCE; new layers were added around 7900–6100 BCE and 6000–5500 BCE; and the terraces visible today were built around 2000–1100 BCE. If right, it would be older than Göbekli Tepe by more than ten thousand years, and would place skilled builders in Java at the height of the Ice Age.</p><figure class="wx wx--static" id="gunung-padang-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Same hill, two readings</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Same hill, two readings"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" class="wx-svg" role="img" aria-labelledby="gunung-padang-f1-t"><title id="gunung-padang-f1-t">Gunung Padang in cross-section: the layers claimed in 2023 compared with the mainstream reading</title><defs><clipPath id="gunung-padang-f1-cl"><polygon points="24,360 74,250 114,150 134,112 254,112 274,150 314,250 344,360"/></clipPath><clipPath id="gunung-padang-f1-cr"><polygon points="384,360 434,250 474,150 494,112 614,112 634,150 674,250 704,360"/></clipPath></defs><text x="24" y="26" class="wx-t-cap">Claimed in 2023 (paper retracted)</text><text x="384" y="26" class="wx-t-cap">Mainstream reading</text><line x1="364" y1="16" x2="364" y2="400" class="wx-guide"/><g clip-path="url(#gunung-padang-f1-cl)"><rect x="24" y="112" width="320" height="18" class="wx-
