<script type="text/x-tpl" id="marvel-great-pyramid-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Giza Great Pyramid of Khufu (9793885004).jpg" data-cap="The Great Pyramid of Khufu" data-big><figcaption></figcaption></figure><div class="sh-k">Giza, Egypt</div><h2 class="sh-t" id="marvel-great-pyramid-st" tabindex="-1">The Great Pyramid of Giza</h2><p class="sh-s">Six million tonnes of stone, one surviving boatman&#x27;s diary, and a muon scanner still finding rooms nobody knew about.</p><div class="sh-v"><span class="vstamp vstamp--mys">Mystery <span class="pips" role="img" aria-label="Mystery level 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span></span></div></div><div class="wquick"><h3 class="sub-h">The quick read</h3><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="146.6" data-dec="1">146.6</b><span class="ctr-u"> m</span></div><div class="ctr-l">original height, the tallest human-made structure for about 3,800 years</div><div class="ctr-c">Petrie 1883; Lehner 1997</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="2300000" >2,300,000</b><span class="ctr-u"> blocks</span></div><div class="ctr-l">estimated stone blocks</div><div class="ctr-c">Lehner 1997</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="40" >40</b><span class="ctr-u"> boatmen</span></div><div class="ctr-l">in Merer&#x27;s crew, shipping Tura limestone</div><div class="ctr-c">Tallet 2017</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="64" >64</b><span class="ctr-u"> km</span></div><div class="ctr-l">length of the buried Ahramat Nile branch beside the pyramid fields</div><div class="ctr-c">Ghoneim et al. 2024</div></div><div class="ctr"><div class="ctr-v">≥ <b class="ctr-n" data-v="30" >30</b><span class="ctr-u"> m</span></div><div class="ctr-l">minimum length of the Big Void found by muons</div><div class="ctr-c">Morishima et al. 2017</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="20" >20</b><span class="ctr-u"> cm</span></div><div class="ctr-l">largest difference between the four base sides</div><div class="ctr-c">Cole 1925</div></div></div><div class="stats"><div><b>c. 146.6 m (now c. 138.5 m)</b><span>Original height</span></div><div><b>c. 230.3 m; the four sides differ by about 20 cm</b><span>Base side</span></div><div><b>c. 51.8°</b><span>Slope</span></div><div><b>c. 2.3 million (an estimate, not a count)</b><span>Estimated blocks</span></div><div><b>c. 6 million tonnes</b><span>Estimated mass</span></div><div><b>c. 40 boatmen; 2–3 round trips every 10 days</b><span>Merer&#x27;s crew</span></div><div><b>at least 30 m long, above the Grand Gallery</b><span>Big Void (2017)</span></div><div><b>c. 9 m long, c. 2 x 2 m in section</b><span>North Face Corridor (2023)</span></div></div><p>The best evidence comes from the builders&#x27; own paperwork. Papyri found in 2013 at Wadi al-Jarf, Egypt&#x27;s oldest known harbour, include the logbook of an inspector named Merer, whose crew of about 40 men shipped white Tura limestone to Giza in Khufu&#x27;s 27th year along canals into a harbour basin. A 2024 study mapped a buried Nile branch, the Ahramat, running past 31 pyramids, so boats could reach close to the building sites. Most core blocks were quarried on the plateau itself, a short haul from the pyramid. Sledges dragged over wetted sand, levers, ropes and ramps are well attested. The exact layout of the ramps used for the upper courses is still debated, and so is how the heaviest granite beams were lifted about 43 m to the King&#x27;s Chamber. Recent engineering models, such as counterweights sliding inside the Grand Gallery (2025) or ramps built into the pyramid&#x27;s edges (2026), are published by their authors as hypotheses to be tested.</p><div class="flip" id="marvel-great-pyramid-flip"><div class="flip-in"><div class="flip-f"><b>The myth</b><p>The pyramid is too precise for Bronze Age tools, and satellite radar has revealed a hidden complex of shafts and chambers under Giza that points to a lost civilisation.</p></div><div class="flip-b"><b>The reality</b><p>Quarries, tool marks, workers&#x27; settlements and cemeteries, bakeries and Merer&#x27;s logbook document an organised Egyptian workforce. The radar paper on Khufu&#x27;s pyramid was retracted by Remote Sensing in August 2026 over methodological flaws and statistical errors, and the larger underground claims of 2025 were never published for peer review. The genuine voids found by muon imaging (2017, 2023) are real but modest, and their purpose is still open.</p></div></div><button type="button" class="flip-btn" aria-pressed="false" onclick="flip('marvel-great-pyramid-flip',this)">Flip it</button></div><div class="twist"><b>Wow</b><p>Merer&#x27;s papyri, among the oldest inscribed papyri known, were written while the pyramid was being finished, so we can read the work diary of a man who shipped its casing stones.</p></div><div class="wmys"><span>Mystery meter</span><span class="pips" role="img" aria-label="Mystery level 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><small>A few loose ends</small></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">11 min read · 2,340 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Great Pyramid of Giza"><button type="button" class="wtoc-i" data-go="great-pyramid-s1">A diary from the building site</button><button type="button" class="wtoc-i" data-go="great-pyramid-s2">A mountain, measured</button><button type="button" class="wtoc-i" data-go="great-pyramid-s3">Inside the mountain</button><button type="button" class="wtoc-i" data-go="great-pyramid-s4">Merer&#x27;s river road</button><button type="button" class="wtoc-i" data-go="great-pyramid-s5">From quarry to course</button><button type="button" class="wtoc-i" data-go="great-pyramid-s6">The people who built it</button><button type="button" class="wtoc-i" data-go="great-pyramid-s7">Seeing through stone</button><button type="button" class="wtoc-i" data-go="great-pyramid-s8">Radar, a retraction and an underground city</button><button type="button" class="wtoc-i" data-go="great-pyramid-s9">What we still do not know</button></nav></div><section class="wsec" id="great-pyramid-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A diary from the building site</h3><p>In 2013, in a cave gallery on the Red Sea coast at Wadi al-Jarf, a French and Egyptian team led by Pierre Tallet lifted out bundles of papyrus that had been sealed away for about 4,500 years. Some were accounts. The best preserved were a logbook kept by an inspector called Merer, who ran a crew of roughly 40 boatmen in the 27th year of King Khufu. Day after day, in tidy columns, Merer noted where the crew slept, where they loaded, and where they delivered.</p><p>What they carried was fine white limestone from the quarries at Tura, across the river from Giza. What they delivered it to was Akhet Khufu, &#x27;Horizon of Khufu&#x27;, the name of the king&#x27;s pyramid. The entries mention a harbour basin and a stop called She-Khufu, and they name Khufu&#x27;s half-brother Ankhhaf as the senior official in charge of the work. By Tallet&#x27;s reading, the crew made two or three round trips about every ten days.</p><blockquote class="wpull"><p>The oldest inscribed papyri we have are not hymns or laws. They are a boatman&#x27;s timesheets from the Great Pyramid.</p></blockquote><p>That is the right place to start, because the Great Pyramid is often presented as a riddle with no witnesses. It has witnesses. They were paid in bread and beer, and at least one of them kept a diary.</p></section><section class="wsec" id="great-pyramid-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>A mountain, measured</h3><p>When Flinders Petrie surveyed Giza between 1880 and 1882, he treated the pyramid like a laboratory instrument. His numbers, refined by J. H. Cole&#x27;s survey of 1925, still frame everything: a square base about 230.3 m on a side, an original height of about 146.6 m, and faces rising at about 51.8°. The four sides differ in length by only about 20 cm, and they are aligned to the cardinal points to within a few arcminutes. Today the top 8 m or so are missing and the height is about 138.5 m.</p><p>The volume is about 2.6 million cubic metres. Divide by a typical block and you get the famous figure of about 2.3 million blocks, with a total mass near 6 million tonnes. Treat both as engineering estimates rather than counts: nobody has tallied the blocks, the core contains rubble and uneven fill, and the granite beams over the King&#x27;s Chamber are far heavier than the average core block of a tonne or two.</p><p>How did they find north so precisely without a compass? Several methods would work. Egyptologist Kate Spence proposed in 2000 that surveyors waited for two circumpolar stars to line up vertically, then dropped a plumb line; because the stars drift slowly over centuries, her idea also offered a way to date the pyramids. Others have shown that simple sun-shadow methods, tracking the tip of a vertical rod through a day, can reach similar accuracy. Nobody knows which one Khufu&#x27;s surveyors used, but none requires anything more exotic than patience, cord and a clear sky.</p><p>For about 3,800 years it was the tallest thing people had built, until the spire of Lincoln Cathedral in England rose higher around 1311 CE. It was already an antique, more than 2,000 years old, when Greek writers put it on their list of wonders.</p><aside class="wcall"><b>How do we know the height?</b><p>The capstone and the top courses are gone, so the original apex is reconstructed. Surveyors measure the surviving casing stones at the base to find the true slope, then extend the four faces upward until they meet. Because the angle is known from real casing blocks still in place on the north side, the uncertainty in the reconstructed height is small, well under a metre.</p></aside></section><section class="wsec" id="great-pyramid-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Inside the mountain</h3><p>The interior is surprisingly small: a few narrow passages and three main chambers inside six million tonnes of stone. The original entrance sits about 17 m up the north face. From it a passage runs down at about 26.5° through the masonry and into the bedrock, ending in a rough, unfinished chamber about 30 m below the base. Partway down, an ascending passage branches upward, once blocked by granite plugs, and opens into the Grand Gallery, a corbelled hall about 46.7 m long and 8.6 m high.</p><figure class="wx wx--static" id="great-pyramid-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Inside the Great Pyramid, to scale</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Inside the Great Pyramid, to scale"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 570" class="wx-svg" role="img" aria-labelledby="great-pyramid-f1-t"><title id="great-pyramid-f1-t">North to south section through the Great Pyramid, drawn to scale from Petrie's survey, showing its passages, chambers, shafts and the voids found by muon imaging</title><defs><marker id="great-pyramid-f1-dot" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="5" markerHeight="5"><circle cx="3" cy="3" r="2.4" class="wx-accfill"/></marker></defs><text x="20" y="26" class="wx-t-cap">Section, north (left) to south (right)</text><rect x="16" y="400" width="688" height="108" class="wx-rock wx-o60"/><text x="24" y="500" class="wx-t-cap">Bedrock of the Giza plateau</text><polygon points="72.0,400.0 344.0,53.8 375.8,53.8 647.8,400.0" class="wx-stone"/><polyline points="344.0,53.8 359.9,33 x-halo">Ascending passage</text></g><g class="wx-pop" style="--d:12"><text x="130" y="474" text-anchor="start" class="wx-t wx-halo">Descending passage, 26.5°</text></g><g class="wx-pop" style="--d:13"><line x1="382.0" y1="481.0" x2="383.2" y2="470.0" class="wx-thin"/><text x="386" y="485" text-anchor="start" class="wx-t wx-halo">Subterranean chamber</text><text x="386" y="499" text-anchor="start" class="wx-t-s wx-halo">unfinished, c. 30 m below the base</text></g><g class="wx-pop" style="--d:12"><line x1="326.0" y1="428.0" x2="282.0" y2="425.0" class="wx-thin"/><text x="330" y="432" text-anchor="start" class="wx-t wx-halo">Well shaft</text></g><g class="wx-pop" style="--d:13"><line x1="426.0" y1="352.0" x2="366.4" y2="340.0" class="wx-thin"/><text x="430" y="356" text-anchor="start" class="wx-t wx-halo">Queen's Chamber</text></g><g class="wx-pop" style="--d:14"><line x1="426.0" y1="296.0" x2="391.6" y2="285.0" class="wx-thin"/><text x="430" y="300" text-anchor="start" class="wx-t wx-halo">King's Chamber</text><text x="430" y="314" text-anchor="start" class="wx-t-s wx-halo">granite; floor c. 43 m up</text></g><g class="wx-pop" style="--d:14"><line x1="562.0" y1="210.0" x2="391.6" y2="257.5" class="wx-thin"/><text x="566" y="214" text-anchor="start" class="wx-t wx-halo">Five relieving</text><text x="566" y="228" text-anchor="start" class="wx-t-s wx-halo">chambers above</text></g><g class="wx-pop" style="--d:15"><line x1="496.0" y1="172.0" x2="486.5" y2="195.0" class="wx-thin"/><text x="500" y="176" text-anchor="start" class="wx-t wx-halo">King's Chamber shafts</text><text x="500" y="190" text-anchor="start" class="wx-t-s wx-halo">run out to both faces</text></g><g class="wx-pop" style="--d:15"><line x1="576.0" y1="292.0" x2="487.7" y2="243.4" class="wx-thin"/><text x="580" y="296" text-anchor="start" class="wx-t wx-halo">Queen's Chamber</text><text x="580" y="310" text-anchor="start" class="wx-t-s wx-halo">shafts end at stone</text><text x="580" y="324" text-anchor="start" class="wx-t-s wx-halo">'doors' c. 60 m in</text></g><line x1="359.9" y1="33.5" x2="690" y2="33.5" class="wx-guide"/><line x1="684" y1="33.5" x2="684" y2="400" class="wx-dim"/><line x1="679" y1="33.5" x2="689" y2="33.5" class="wx-dim"/><line x1="679" y1="400" x2="689" y2="400" class="wx-dim"/><text x="676" y="37.5" text-anchor="end" class="wx-t-n">146.6 m</text><text x="676" y="51.5" text-anchor="end" class="wx-t-s">original height</text><text x="381.9" y="53.8" class="wx-t-s wx-halo">top 8 m now missing</text><line x1="72" y1="524" x2="647.8" y2="524" class="wx-dim"/><line x1="72" y1="518" x2="72" y2="530" class="wx-dim"/><line x1="647.8" y1="518" x2="647.8" y2="530" class="wx-dim"/><text x="359.5" y="540" text-anchor="middle" class="wx-t-n">230.3 m base</text><text x="619.0" y="394" text-anchor="end" class="wx-t-s">51.8°</text><path d="M621.8,400 A26,26 0 0 1 631.7,379.6" class="wx-thin"/><g><rect x="72" y="552" width="62.5" height="5" class="wx-inkfill"/><rect x="134.5" y="552" width="62.5" height="5" class="wx-paper wx-edge"/><text x="72" y="548" class="wx-t-s">0</text><text x="197.0" y="548" text-anchor="middle" class="wx-t-s">50 m</text></g><line x1="690" y1="400" x2="690" y2="395.8" class="wx-bold"/><line x1="690" y1="392" x2="690" y2="378" class="wx-thin"/><text x="700" y="372" text-anchor="end" class="wx-t-s">1.7 m person</text></svg></div></div><figcaption>A north to south section with the passages, chambers and shafts drawn at their surveyed angles and heights. The voids found by muon imaging are shown in red, dashed where their shape is uncertain. <span class="wx-src">Based on: Petrie 1883 and Cole 1925 (overall dimensions); passage angles and chamber sizes after Petrie as summarised in Lehner 1997; Big Void position after Morishima et al. 2017; North Face Corridor after Procureur et al. 2023. The chambers are not all in one vertical plane (the entrance is about 7 m east of the axis), so this is a composite section.</span></figcaption><p class="vh">Scale cross-section of the Great Pyramid, north on the left. From an entrance about 17 m up the north face, the descending passage runs down at 26.5 degrees into bedrock to an unfinished subterranean chamber about 30 m below the base. The ascending passage rises to the Grand Gallery, 46.7 m long and 8.6 m high. A level passage leads to the Queen&#x27;s Chamber on the midline. At the top of the gallery is the granite King&#x27;s Chamber, about 43 m up, with five relieving chambers above. Two shafts from the King&#x27;s Chamber reach the faces; two from the Queen&#x27;s Chamber end at stone doors. A dashed red band above the gallery marks the Big Void, and a small one behind the entrance marks the North Face Corridor. Scale bar 50 m; base 230.3 m; original height 146.6 m.</p></figure><p>A level passage leads from the foot of the gallery to the so-called Queen&#x27;s Chamber, sitting exactly on the pyramid&#x27;s north to south midline. At the top of the gallery lies the King&#x27;s Chamber, lined with Aswan granite and holding an empty lidless granite sarcophagus. Above it, five low compartments separated by huge granite beams, the &#x27;relieving chambers&#x27;, spread the weight of the masonry overhead. Workers&#x27; graffiti painted inside them include Khufu&#x27;s name, one of the direct links between the monument and its king.</p><p>Four narrow shafts complicate the picture. The two from the King&#x27;s Chamber run all the way out to the faces. The two from the Queen&#x27;s Chamber stop some 60 m in, at small stone slabs with copper pins, first reached by Rudolf Gantenbrink&#x27;s robot in 1993. Their purpose, whether for the king&#x27;s spirit, for the stars, or for the builders, is still argued over.</p></section><section class="wsec" id="great-pyramid-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Merer&#x27;s river road</h3><p>Merer&#x27;s logbook turns a mystery of logistics into a timetable. Casing stone was loaded at Tura, floated across the Nile and along a canal, and delivered to a harbour near the building site. Each round trip took about four days. Tallet estimates each boat carried about 30 blocks of 2 to 3 tonnes, on the order of 200 blocks a month for one crew. Granite for the King&#x27;s Chamber came from Aswan, more than 900 km upstream by river, and would have travelled the same way.</p><p>In 2024 a team led by Eman Ghoneim added the missing landscape. Using radar satellite imagery, geophysical surveys and deep sediment cores, they traced a buried branch of the Nile, which they named the Ahramat (&#x27;pyramids&#x27;) branch, about 64 km long and 200 to 700 m wide, running along the desert edge from Lisht to Giza. Thirty-one pyramids, built over about a thousand years, line its banks, and many causeways end at valley temples that would have stood near its water.</p><blockquote class="wpull"><p>The pyramids were not built in the middle of nowhere. They were built on a waterfront that has since dried up and disappeared under fields and sand.</p></blockquote><p>The Ahramat study does not settle every detail. Water levels changed from season to season and from century to century, and the exact course of the channel in Khufu&#x27;s reign is still being refined. But together with Merer&#x27;s harbour basin it fits a simple, practical picture: move heavy stone by water whenever you can, and drag it only for the last stretch.</p></section><section class="wsec" id="great-pyramid-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>From quarry to course</h3><p>Most of the pyramid did not travel far at all. The core blocks were cut from quarries on the Giza plateau itself, just south of the pyramid, where the cut faces and the channels left around half-freed blocks are still visible. Quarrymen used copper chisels, stone pounders and wooden levers to separate blocks along their natural beds.</p><figure class="wx wx--steps" id="great-pyramid-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">From quarry to course</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="From quarry to course"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" class="wx-svg" role="img" aria-labelledby="great-pyramid-f2-t"><title id="great-pyramid-f2-t">From quarry to course: how a block reached the Great Pyramid, in five steps</title><defs><marker id="great-pyramid-f2-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" class="wx-accfill"/></marker></defs><g transform="translate(0,-50)"><rect x="0" y="290" width="720" height="62" class="wx-sand"/><rect x="0" y="352" width="720" height="60" class="wx-water"/><line x1="0" y1="290" x2="720" y2="290" class="wx-line"/><line x1="0" y1="352" x2="720" y2="352" class="wx-thin"/><text x="14" y="404" class="wx-t-cap">Canal and harbour basin</text><text x="706" y="306" text-anchor="end" class="wx-t-cap">Giza plateau</text><polygon points="440,290 565,131 690,290" class="wx-guide"/><polygon points="440,290 510.8,200 619.2,200 690,290" class="wx-stone2 wx-edge"/><line x1="447.9" y1="280" x2="682.1" y2="280" class="wx-thin wx-o60"/><line x1="455.7" y1="270" x2="674.3" y2="270" class="wx-thin wx-o60"/><line x1="463.6" y1="260" x2="666.4" y2="260" class="wx-thin wx-o60"/><line x1="471.4" y1="250" x2="658.6" y2="250" class="wx-thin wx-o60"/><line x1="479.3" y1="240" x2="650.7" y2="240" class="wx-thin wx-o60"/><line x1="487.2" y1="230" x2="642.8" y2="230" class="wx-thin wx-o60"/><line x1="495.0" y1="220" x2="635.0" y2="220" class="wx-thin wx-o60"/><line x1="502.9" y1="210" x2="627.1" y2="210" class="wx-thin wx-o60"/><text x="565" y="118" text-anchor="middle" class="wx-t-s">finished form</text><g class="wx-st" data-s="1"><path d="M28,290 L28,334 L96,334 L96,316 L176,316 L176,290 Z" class="wx-paper wx-edge"/><rect x="104" y="294" width="46" height="22" class="wx-stone wx-edge"/><li e wx-edge"/><rect x="306" y="354" width="34" height="18" class="wx-stone wx-edge"/><line x1="370" y1="372" x2="392" y2="398" class="wx-line"/><line x1="244" y1="372" x2="228" y2="398" class="wx-line"/></g><path d="M300,346 C300,330 290,318 278,306" class="wx-hl" marker-end="url(#great-pyramid-f2-ar)"/></g><g class="wx-st" data-s="4"><polygon points="440,290 472,290 612,247 606,233" class="wx-sand wx-edge"/><polygon points="606,233 612,247 540,208 522,200" class="wx-sand wx-edge"/><line x1="456" y1="290" x2="609" y2="240" class="wx-guide"/><rect x="548" y="243" width="16" height="10" class="wx-stone wx-edge" transform="rotate(-17.4 556 248)"/><path d="M200,286 C300,296 380,296 446,290" class="wx-hl" marker-end="url(#great-pyramid-f2-ar)"/></g><g class="wx-st wx-hide" data-s="5"><polygon points="440,290 565,131 690,290" class="wx-stone wx-edge"/><polygon points="557,141 565,131 573,141" class="wx-accfill"/><line x1="447.9" y1="280" x2="682.1" y2="280" class="wx-guide"/><line x1="457.3" y1="268" x2="672.7" y2="268" class="wx-guide"/><line x1="466.7" y1="256" x2="663.3" y2="256" class="wx-guide"/><line x1="476.2" y1="244" x2="653.8" y2="244" class="wx-guide"/><line x1="485.6" y1="232" x2="644.4" y2="232" class="wx-guide"/><line x1="495.0" y1="220" x2="635.0" y2="220" class="wx-guide"/><line x1="504.5" y1="208" x2="625.5" y2="208" class="wx-guide"/><line x1="513.9" y1="196" x2="616.1" y2="196" class="wx-guide"/><line x1="523.3" y1="184" x2="606.7" y2="184" class="wx-guide"/><line x1="532.8" y1="172" x2="597.2" y2="172" class="wx-guide"/><line x1="542.2" y1="160" x2="587.8" y2="160" class="wx-guide"/><line x1="551.6" y1="148" x2="578.4" y2="148" class="wx-guide"/></g><g class="wx-st" data-s="1"><circle cx="30" cy="220" r="9" class="wx-num"/><text x="30" y="224" text-anchor="middle" class="wx-numt">1</text><text x="44" y="224" text-anchor="start" class="wx-t-b wx-halo">Quarry</text><text x="44" y="239" text-anchor="start" class="wx-t-s wx-halo">core blocks cut on the plateau</text></g><g class="wx-st" data-s="2"><circle cx="222" cy="190" r="9" class="wx-num"/><text x="222" y="194" text-anchor="middle" class="wx-numt">2</text><text x="236" y="194" text-anchor="start" class="wx-t-b wx-halo">Sledge on wet sand</text><text x="236" y="209" text-anchor="start" class="wx-t-s wx-halo">water stiffens the sand</text></g><g class="wx-st" data-s="3"><circle cx="410" cy="330" r="9" class="wx-num"/><text x="410" y="334" text-anchor="middle" class="wx-numt">3</text><text x="424" y="334" text-anchor="start" class="wx-t-b wx-halo">Boat and canal</text><text x="424" y="349" text-anchor="start" class="wx-t-s wx-halo">casing stone from Tura</text></g><g class="wx-st" data-s="4"><circle cx="444" cy="150" r="9" class="wx-num"/><text x="444" y="154" text-anchor="middle" class="wx-numt">4</text><text x="430" y="154" text-anchor="end" class="wx-t-b wx-halo">Ramp</text><text x="430" y="169" text-anchor="end" class="wx-t-s wx-halo">layout still debated</text></g><g class="wx-st" data-s="5"><circle cx="590" cy="84" r="9" class="wx-num"/><text x="590" y="88" text-anchor="middle" class="wx-numt">5</text><text x="604" y="88" text-anchor="start" class="wx-t-b wx-halo">Casing</text><text x="604" y="103" text-anchor="start" class="wx-t-s wx-halo">dressed top down</text></g></g><text x="14" y="22" class="wx-t-cap">Quarry to course, schematic (not to scale)</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Quarry: most core blocks were cut from the plateau just south of the pyramid, separated by trenches and levered free.</p><ol class="wx-steplist"><li>Quarry: most core blocks were cut from the plateau just south of the pyramid, separated by trenches and levered free.</li><li>Sledge on wet sand: water poured ahead of the sledge stiffens the sand; experiments show it can roughly halve the pull.</li><li>Boats and canal: Merer&#x27;s crew brought white Tura limestone across the Nile to a harbour basin at the foot of the plateau.</li><li>Ramps: blocks went up ramps against the growing pyramid. Their layout (straight, zigzag or wrapping) is still debated.</li><li>Casing: fine white limestone was dressed smooth, probably from the top down as the ramps came away.</li></ol><figcaption>How a block probably reached its place, from the evidence of quarries, paintings, papyri and experiments. The ramp layout is drawn as one option among several. <span class="wx-src">Based on: Lehner 1997; Tallet 2017 and Tallet and Lehner 2021 (Merer); Fall et al. 2014 (wet sand); Hatnub ramp reports 2018. Not to scale.</span></figcaption><p class="vh">Schematic landscape in five steps. Step 1: a stepped quarry pit cut into the Giza plateau, with a block freed by trenches and a worker with a lever. Step 2: a block on a wooden sledge dragged by a team with ropes while a man pours water on the sand ahead. Step 3: a boat carrying white casing blocks in a canal and harbour basin below the plateau. Step 4: a ramp zigzagging up the face of the half-built pyramid with a block on it. Step 5: the finished pyramid with its smooth white casing and capstone.</p></figure><p>Blocks were dragged on wooden sledges. A Middle Kingdom tomb painting of the official Djehutihotep shows a colossal statue on a sledge with a man pouring water onto the sand in front of it. In 2014 physicists at the University of Amsterdam tested why. Adding the right amount of water to desert sand makes it stiffer, so the sledge stops ploughing a ridge ahead of itself; in their experiments the pulling force needed could drop by about half. Too much water, and the benefit disappears.</p><p>Ramps are where the evidence thins. Remains of construction ramps survive at several Egyptian pyramids, and in 2018 a team working at the Hatnub alabaster quarry reported a steep ramp flanked by staircases and post holes, dated by inscriptions to Khufu&#x27;s reign, which may have used a pulley-like system of posts and ropes. But for the Great Pyramid itself, whether the builders used one long straight ramp, ramps zigzagging up a face, a ramp wrapping around the pyramid, or some combination, is still debated. An internal spiral ramp, proposed by architect Jean-Pierre Houdin, has not been confirmed by any scan.</p><p>The hardest lifts were not the millions of ordinary blocks but a few dozen granite beams roofing the King&#x27;s Chamber and the relieving chambers above it, carried from Aswan and raised more than 40 m. How exactly they were manoeuvred into place, perhaps by levering them up a few centimetres at a time on timber packing, perhaps by dragging them up a ramp while the pyramid was still low around them, is not recorded. The beams themselves carry the evidence of the struggle: several have cracked under the load, and some cracks in the chambers above appear to have been plastered over in antiquity, perhaps by the builders themselves.</p><p>The final skin was fine white Tura limestone, cut so that the outer face could be dressed smooth, probably from the top down as the ramps were removed. Almost all of it is gone. After earthquakes in the 14th century, Cairo&#x27;s builders treated the pyramid as a convenient quarry, and only a few casing blocks remain in place at the base of the north face.</p></section><section class="wsec" id="great-pyramid-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>The people who built it</h3><p>About 400 m south of the Sphinx, beyond a massive stone boundary wall about 200 m long known as the Wall of the Crow, archaeologists led by Mark Lehner have excavated a planned settlement called Heit el-Ghurab since 1988. It has long galleries that may have housed rotating work gangs, bakeries with bread moulds, storerooms, and a large administrative building. Seal impressions date most of it to Khufu&#x27;s successors Khafre and Menkaure, so it tells us how the Giza project was run in general, even if Khufu&#x27;s own camp is less well preserved.</p><p>The menu was generous. Zooarchaeologist Richard Redding&#x27;s estimate, based on the animal bones, is that the town consumed on the order of 11 cattle and 37 sheep or goats a day, supplied by herds raised on estates in the Delta. On the slope above, Zahi Hawass&#x27;s team found from 1990 the tombs of workers and overseers, with titles such as &#x27;overseer of the side of the pyramid&#x27;. Some skeletons show healed fractures and even an amputation, signs of medical care.</p><blockquote class="quote"><p>Of this oppression there passed ten years while the causeway was made by which they drew the stones ... For the making of the pyramid itself there passed a period of twenty years.</p><cite>Herodotus, Histories 2.124, trans. G. C. Macaulay (1890)</cite></blockquote><p>Herodotus visited Egypt about 2,000 years after Khufu and repeated the local story that the king drove 100,000 men in three-month shifts. The idea that slaves built the pyramids comes mostly from later retellings. The archaeology points instead to a mixed workforce: a permanent core of skilled builders, supported by larger rotating crews drafted from the provinces, fed and housed by the state. Most published estimates of the number on site at any one time range from about 10,000 to 25,000.</p></section><section class="wsec" id="great-pyramid-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>Seeing through stone</h3><p>Every minute, each square metre of the Earth&#x27;s surface is crossed by about ten thousand muons, heavy cousins of the electron made when cosmic rays hit the upper atmosphere. Stone absorbs some of them. Place detectors inside or beside a pyramid and count the muons arriving from each direction: where more get through than expected, there is less stone in the way, which means a void.</p><p>The ScanPyramids project, launched in 2015 by Cairo University and the HIP Institute, used three independent detector technologies from Nagoya University, the Japanese laboratory KEK and the French agency CEA. In 2017 they reported in Nature a &#x27;Big Void&#x27; above the Grand Gallery, at least 30 m long, with a cross-section similar to the gallery&#x27;s. All three methods saw it. Its shape, slope and purpose are unknown; it could be one space or several.</p><p>A second, smaller anomaly lay just behind the great limestone chevrons above the original entrance. In 2023 a paper in Nature Communications characterised this North Face Corridor as about 9 m long with a cross-section of about 2 by 2 m, and a thin endoscope pushed through a joint in the masonry showed a real, empty, gabled corridor. A 2025 study in Scientific Reports combined radar, ultrasound and electrical imaging to confirm its size and position.</p><aside class="wcall"><b>Fresh from the field</b><p>The North Face Corridor was photographed in February 2023 and independently confirmed by multi-method imaging in 2025. Most engineers suspect it helped relieve the load over the entrance, much as the chevrons do, but nobody has yet been inside it. The Big Void remains unvisited, and no drilling has been approved.</p></aside></section><section class="wsec" id="great-pyramid-s8"><h3 class="wsec-h"><span class="wsec-n">08</span>Radar, a retraction and an underground city</h3><p>Not every scan survives scrutiny. In 2022 Filippo Biondi and Corrado Malanga published a paper in the journal Remote Sensing claiming that a satellite radar technique had revealed undiscovered internal structures in the Great Pyramid. In 2025 the same researchers announced, at a press event rather than in a journal, far larger claims: vertical shafts and chambers reaching hundreds of metres beneath the neighbouring pyramid of Khafre. The story went viral as an &#x27;underground city&#x27;.</p><p>Specialists in ground-penetrating radar objected from the start. Radar at the frequencies used by these satellites is absorbed and scattered by the first metres of rock; archaeological radar expert Lawrence Conyers put it bluntly, saying it is physically impossible for the signal to pass through the pyramid, reflect off internal structures and return to the satellite. No raw data or peer-reviewed paper supported the Khafre claims.</p><p>On 10 August 2026 Remote Sensing retracted the 2022 paper. The notice says an investigation by the editorial office and board &#x27;confirmed serious methodological flaws and statistical errors that were deemed to undermine the scientific conclusions&#x27;. The authors disagreed with the decision. The retraction does not touch the muon results, which were produced by three independent teams using a method with a long record, from Luis Alvarez&#x27;s scan of Khafre&#x27;s pyramid in the 1960s to modern volcano imaging.</p><blockquote class="wpull"><p>A good anomaly survives a second team, a second method and a peer review. The Big Void did. The underground city did not.</p></blockquote></section><section class="wsec" id="great-pyramid-s9"><h3 class="wsec-h"><span class="wsec-n">09</span>What we still do not know</h3><p>The broad story is well supported: a 4th Dynasty king, a state that could feed and organise many thousands of workers, local quarries, river transport, sledges, levers and ramps. What remains open is the fine print.</p><ul class="wlist"><li>How the upper third was built: which ramp layout, or mix of ramps and lifting from the courses, carried blocks above about 100 m.</li><li>How the granite beams of the King&#x27;s Chamber, some estimated at 25 to 80 tonnes, were raised about 43 m or more.</li><li>What the Big Void is: a second gallery, a construction space, a relieving structure, or several of these.</li><li>Why the Queen&#x27;s Chamber shafts were sealed with small pinned slabs, and what lies a few metres beyond them.</li><li>How long it took. Herodotus&#x27;s twenty years and the length of Khufu&#x27;s reign make a range of about 20 to 27 years plausible, but there is no direct record of the start date.</li></ul><p>The honest mystery rating is low, around 2 out of 5. The pyramid is astonishing, but its builders left their tools, their towns, their graves, their graffiti and their paperwork. Every new instrument has so far made the human story more detailed, not less likely.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">2,589 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Khufu&#x27;s reign begins (conventional date)</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">2,563 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Year 27: Merer&#x27;s crew ships Tura limestone to Giza</span></li><li class="wtl-build" style="--i:2"><span class="wtl-y">2,560 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Pyramid essentially complete</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">440 BCE</span><span class="wtl-k">Studied</span><span class="wtl-t">Herodotus records Egyptian stories about the builders</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">820 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Robbers&#x27; tunnel cut into the north face (traditionally al-Ma&#x27;mun)</span></li><li class="wtl-loss" style="--i:5"><span class="wtl-y">1303 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Earthquake loosens the casing; its stones are later stripped for Cairo</span></li><li class="wtl-find" style="--i:6"><span class="wtl-y">1872 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Waynman Dixon finds a cedar fragment, a ball and a hook in the Queen&#x27;s Chamber shafts</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">1880 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Petrie begins his precise survey (published 1883)</span></li><li class="wtl-find" style="--i:8"><span class="wtl-y">1990 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Workers&#x27; cemetery found; Heit el-Ghurab town excavated from 1988</span></li><li class="wtl-find" style="--i:9"><span class="wtl-y">2013 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Merer&#x27;s papyri found at Wadi al-Jarf</span></li><li class="wtl-find" style="--i:10"><span class="wtl-y">2017 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Muon imaging reveals the Big Void</span></li><li class="wtl-study" style="--i:11"><span class="wtl-y">2020 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">The cedar fragment, rediscovered in Aberdeen, is dated to c. 3341 to 3094 BCE</span></li><li class="wtl-find" style="--i:12"><span class="wtl-y">2023 CE</span><span class="wtl-k">Found</span><span class="wtl-t">North Face Corridor measured and seen by endoscope</span></li><li class="wtl-find" style="--i:13"><span class="wtl-y">2024 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Ahramat Nile branch mapped beside 31 pyramids</span></li><li class="wtl-study" style="--i:14"><span class="wtl-y">2025 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Counterweight and pulley model for the construction published</span></li><li class="wtl-study" style="--i:15"><span class="wtl-y">2026 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Radar &#x27;hidden structures&#x27; paper retracted</span></li><li class="wtl-study" style="--i:16"><span class="wtl-y">2026 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Edge-ramp construction model published</span></li></ol><figure class="wbars"><h4 class="wx-title">Original heights of major Old Kingdom pyramids</h4><div class="wb-r" style="--w:42.6%;--i:0"><div class="wb-l">Djoser (Saqqara)<small>step pyramid</small></div><div class="wb-t"><i></i><span>62.5 m</span></div></div><div class="wb-r" style="--w:62.8%;--i:1"><div class="wb-l">Meidum<small>approximate; later collapsed</small></div><div class="wb-t"><i></i><span>92 m</span></div></div><div class="wb-r" style="--w:71.6%;--i:2"><div class="wb-l">Bent Pyramid (Dahshur)<small>approximate</small></div><div class="wb-t"><i></i><span>105 m</span></div></div><div class="wb-r" style="--w:71.6%;--i:3"><div class="wb-l">Red Pyramid (Dahshur)<small>approximate</small></div><div class="wb-t"><i></i><span>105 m</span></div></div><div class="wb-r" style="--w:100.0%;--i:4"><div class="wb-l">Khufu (Giza)<small>original</small></div><div class="wb-t"><i></i><span>146.6 m</span></div></div><div class="wb-r" style="--w:97.9%;--i:5"><div class="wb-l">Khafre (Giza)<small>original</small></div><div class="wb-t"><i></i><span>143.5 m</span></div></div><div class="wb-r" style="--w:44.3%;--i:6"><div class="wb-l">Menkaure (Giza)<small>original, approximate</small></div><div class="wb-t"><i></i><span>65 m</span></div></div><figcaption>Source: Lehner 1997, The Complete Pyramids (rounded; published figures vary by a metre or two)</figcaption></figure><h3 class="sub-h wsub">The big debates</h3><div class="debate"><p class="debate-q">Is the Great Pyramid far older than Khufu?</p><div class="sides"><div class="side"><b>Yes: the pharaohs inherited older monuments and claimed them. Graham Hancock and Robert Bauval link the layout of the Giza pyramids to the stars of Orion&#x27;s belt as they stood around 10,500 BCE, and point out that no burial and no formal royal inscription was ever found inside.</b><span>The Orion correlation (Bauval and Gilbert 1994; Hancock 1995); the empty granite box in the King&#x27;s Chamber; the Inventory Stela, a text of the 7th century BCE that says Khufu found older temples at Giza.</span></div><div class="side"><b>No: it was built in Khufu&#x27;s reign, around 2560 BCE, perhaps a little earlier.</b><span>Merer&#x27;s logbook from Khufu&#x27;s 27th year, recording limestone shipped to the pyramid; work-gang names that include Khufu&#x27;s, painted on blocks in relieving chambers first entered in 1837; radiocarbon dates from organic matter in the mortar, all in the 3rd millennium BCE; the builders&#x27; town and cemeteries; and the run of earlier pyramids built by his father Sneferu.</span></div></div><p class="debate-why"><b>The bold claim:</b> The Great Pyramid was built thousands of years before Khufu, around 10,500 BCE.</p><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Several independent lines point to Khufu&#x27;s reign: a dated logbook from the building project, crew marks inside chambers nobody entered until 1837, radiocarbon on the mortar and the settlement of the builders. The mortar dates do run on average a century or more older than the historical chronology, which most specialists put down to old wood burned for fuel, so a somewhat earlier date remains open. A cedar fragment found inside in 1872 was dated in 2020 to about 3341 to 3094 BCE, some 500 years before Khufu; old or reused timber is the likely reason, but it is one more date that runs early. None of the measured dates comes near 10,500 BCE. What is still unknown is how the upper courses and the heaviest granite beams were raised.</p></div><div class="debate"><p class="debate-q">Did satellite radar reveal hidden structures inside and beneath the Giza pyramids?</p><div class="sides"><div class="side"><b>Yes: the radar images show shafts, corridors and chambers far larger than the known interior.</b><span>Biondi and Malanga 2022 (Remote Sensing) and their 2025 press announcement about Khafre&#x27;s pyramid.</span></div><div class="side"><b>No: the method cannot see that deep, and the published analysis failed review.</b><span>Radar at these frequencies is absorbed within the first metres of rock; the 2022 paper was retracted in August 2026 for methodological flaws and statistical errors; the 2025 claims were never peer reviewed.</span></div></div><p class="debate-why"><b>The bold claim:</b> Satellite radar has revealed a hidden complex of shafts and chambers inside and beneath the Giza pyramids.</p><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The one peer-reviewed paper behind the claim has been retracted by its journal after an investigation, and the larger claims were never submitted to review or released as data. The physics is also against it: satellite radar does not penetrate hundreds of metres of limestone. The real voids detected inside the pyramid come from muon imaging, a different method confirmed by three teams.</p></div><div class="debate"><p class="debate-q">How were the upper courses built?</p><div class="sides"><div class="side"><b>External ramps: straight, zigzagging up a face, or wrapping around the pyramid.</b><span>Ramp remains at other pyramids and quarries, including the Khufu-era Hatnub ramp with staircases and post holes; the practical need for access to every course.</span></div><div class="side"><b>An internal spiral ramp inside the pyramid, proposed by Jean-Pierre Houdin.</b><span>A notch high on one edge and microgravity data interpreted by Houdin; no internal ramp has been seen in muon scans so far.</span></div><div class="side"><b>Machines inside the pyramid: counterweights sliding down the Grand Gallery and Ascending Passage, working the Antechamber like a pulley (Scheuring 2025); or ramps built into the edges by leaving out perimeter blocks (Rosell Roig 2026).</b><span>Engineering and computer models published in npj Heritage Science. The 2025 author calls the system hypothetical until the Big Void is better known; the 2026 simulation gives about 14 to 21 years of work on site and treats its match with the muon data as a lead, not a confirmation.</span></div></div><p class="debate-why"><b>The bold claim:</b> Khufu&#x27;s builders raised the top of the pyramid using an internal spiral ramp.</p><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">External ramps of various layouts are attested in Egyptian building, and some combination of them remains the leading explanation, although the exact layout at Khufu&#x27;s pyramid is unknown. The internal ramp idea is ingenious and testable, but the muon surveys that found the Big Void and the North Face Corridor have not reported the spiral it predicts. Two newer models (2025, 2026) move the machinery inside or into the edges of the pyramid; both are testable, and neither has been confirmed. No text from the time describes the method.</p></div><div class="debate"><p class="debate-q">What is the Big Void?</p><div class="sides"><div class="side"><b>A construction feature: a relieving space, a second gallery used during building, or a void left by the building method.</b><span>Its position above the Grand Gallery and its similar size and slope; the pyramid already has relieving chambers and chevrons.</span></div><div class="side"><b>A hidden chamber, perhaps holding burial goods.</b><span>The size of the void and the absence of any known access.</span></div></div><p class="debate-why"><b>The bold claim:</b> The Big Void is a sealed treasure chamber.</p><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The muon data show only that there is a large volume with less stone, at least 30 m long. They cannot show contents, and the physicists who found it stress that it may be several spaces and may be inclined or horizontal. A structural purpose linked to the Grand Gallery is the most economical guess, but only a camera or future imaging can decide.</p></div><details class="srcs"><summary>Sources for this deep dive (23)</summary><ol><li>Petrie, W. M. F. (1883). The Pyramids and Temples of Gizeh. Field &amp; Tuer, London.</li><li>Cole, J. H. (1925). Determination of the Exact Size and Orientation of the Great Pyramid of Giza. Survey of Egypt Paper 39. Cairo.</li><li>Lehner, M. (1997). The Complete Pyramids. Thames &amp; Hudson.</li><li>Lehner, M. &amp; Hawass, Z. (2017). Giza and the Pyramids. Thames &amp; Hudson.</li><li>Spence, K. (2000). Ancient Egyptian chronology and the astronomical orientation of pyramids. Nature 408: 320-324. <a href="https://doi.org/10.1038/35042510" target="_blank" rel="noopener">doi:10.1038/35042510</a></li><li>Tallet, P. &amp; Marouard, G. (2014). The Harbor of Khufu on the Red Sea Coast at Wadi al-Jarf, Egypt. Near Eastern Archaeology 77(1): 4-14. <a href="https://doi.org/10.5615/neareastarch.77.1.0004" target="_blank" rel="noopener">doi:10.5615/neareastarch.77.1.0004</a></li><li>Tallet, P. (2017). Les papyrus de la mer Rouge I: le journal de Merer (Papyrus Jarf A et B). IFAO, Cairo.</li><li>Tallet, P. &amp; Lehner, M. (2021). The Red Sea Scrolls: How Ancient Papyri Reveal the Secrets of the Pyramids. Thames &amp; Hudson.</li><li>Ghoneim, E. et al. (2024). The Egyptian pyramid chain was built along the now abandoned Ahramat Nile Branch. Communications Earth &amp; Environment 5: 233. <a href="https://doi.org/10.1038/s43247-024-01379-7" target="_blank" rel="noopener">doi:10.1038/s43247-024-01379-7</a></li><li>Fall, A. et al. (2014). Sliding friction on wet and dry sand. Physical Review Letters 112: 175502. <a href="https://doi.org/10.1103/PhysRevLett.112.175502" target="_blank" rel="noopener">doi:10.1103/PhysRevLett.112.175502</a></li><li>Morishima, K. et al. (2017). Discovery of a big void in Khufu&#x27;s Pyramid by observation of cosmic-ray muons. Nature 552: 386-390. <a href="https://doi.org/10.1038/nature24647" target="_blank" rel="noopener">doi:10.1038/nature24647</a></li><li>Procureur, S. et al. (2023). Precise characterization of a corridor-shaped structure in Khufu&#x27;s Pyramid by observation of cosmic-ray muons. Nature Communications 14: 1144. <a href="https://doi.org/10.1038/s41467-023-36351-0" target="_blank" rel="noopener">doi:10.1038/s41467-023-36351-0</a></li><li>Schumacher, T. et al. (2025). Confirmation of the ScanPyramids North Face Corridor in the Great Pyramid of Giza using multi-modal image fusion from three non-destructive testing techniques. Scientific Reports 15: 9275. <a href="https://doi.org/10.1038/s41598-025-91115-8" target="_blank" rel="noopener">doi:10.1038/s41598-025-91115-8</a></li><li>Remote Sensing (2026). Retraction: Biondi, F. &amp; Malanga, C., Synthetic Aperture Radar Doppler Tomography Reveals Details of Undiscovered High-Resolution Internal Structure of the Great Pyramid of Giza (Remote Sens. 2022, 14, 5231). Remote Sensing 18(16): 2679. <a href="https://doi.org/10.3390/rs18162679" target="_blank" rel="noopener">doi:10.3390/rs18162679</a></li><li>Retraction Watch (31 August 2026). Journal retracts paper claiming network of corridors inside the Great Pyramid of Giza.</li><li>Herodotus, Histories, Book 2, trans. G. C. Macaulay (1890). Macmillan.</li><li>Scheuring, S. A. (2025). Construction of the Great Pyramid with pulley-like systems using counter-weights on sliding-ramps. npj Heritage Science 13. <a href="https://doi.org/10.1038/s40494-025-02018-w" target="_blank" rel="noopener">doi:10.1038/s40494-025-02018-w</a></li><li>Rosell Roig, V. L. (2026). A computational framework for evaluating an edge-integrated, multi-ramp construction model of the Great Pyramid of Giza. npj Heritage Science. <a href="https://doi.org/10.1038/s40494-026-02405-x" target="_blank" rel="noopener">doi:10.1038/s40494-026-02405-x</a></li><li>University of Aberdeen (2020). Missing 5,000-year-old piece of Great Pyramid puzzle discovered in cigar box in Aberdeen. News release, 16 December 2020.</li><li>Bonani, G., Haas, H., Hawass, Z., Lehner, M. et al. (2001). Radiocarbon dates of Old and Middle Kingdom monuments in Egypt. Radiocarbon 43(3): 1297-1320.</li><li>Dash, G. (2017). Occam&#x27;s Egyptian razor: the equinox and the alignment of the pyramids. Journal of Ancient Egyptian Architecture 2.</li><li>Vyse, H. (1840-42). Operations Carried On at the Pyramids of Gizeh in 1837. 3 vols. James Fraser, London.</li><li>Hancock, G. (1995). Fingerprints of the Gods. Heinemann, London.</li></ol></details><aside class="rc-cite" data-v="marvels" data-id="marvel-great-pyramid" data-t="The Great Pyramid of Giza"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Great Pyramid of Giza</i>. <span class="cite-u">https://residual-continuum.vercel.app/#marvels/marvel-great-pyramid</span> (updated 25 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="marvel-gobekli-tepe-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Göbekli Tepe, Urfa.jpg" data-cap="The enclosures of Göbekli Tepe" data-big><figcaption></figcaption></figure><div class="sh-k">Şanlıurfa, Türkiye</div><h2 class="sh-t" id="marvel-gobekli-tepe-st" tabindex="-1">Göbekli Tepe</h2><p class="sh-s">Stone giants with arms, belts and fox pelts, raised on a hilltop by people who had never seen a clay pot.</p><div class="sh-v"><span class="vstamp vstamp--mys">Mystery <span class="pips" role="img" aria-label="Mystery level 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span></span></div></div><div class="wquick"><h3 class="sub-h">The quick read</h3><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="5.5" data-dec="1">5.5</b><span class="ctr-u"> m</span></div><div class="ctr-l">height of the central pillars of Enclosure D</div><div class="ctr-c">DAI Göbekli Tepe project</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="11" >11</b><span class="ctr-u"> pillars</span></div><div class="ctr-l">set into the ring wall of Enclosure D</div><div class="ctr-c">Haklay &amp; Gopher 2020</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="19.25" data-dec="2">19.25</b><span class="ctr-u"> m</span></div><div class="ctr-l">side of the triangle linking the centres of Enclosures B, C and D</div><div class="ctr-c">Haklay &amp; Gopher 2020</div></div><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="7000" >7,000</b><span class="ctr-u"> artefacts</span></div><div class="ctr-l">grinding stones and related tools analysed</div><div class="ctr-c">Dietrich L. et al. 2019</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="300" >300</b><span class="ctr-u"> m</span></div><div class="ctr-l">diameter of the artificial mound</div><div class="ctr-c">DAI Göbekli Tepe project</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="46" >46</b><span class="ctr-u"> km</span></div><div class="ctr-l">to its sister site Karahan Tepe</div><div class="ctr-c">Karul 2021</div></div></div><div class="stats"><div><b>built from c. 9600 BCE, abandoned c. 8000 BCE</b><span>Age</span></div><div><b>c. 5.5 m (P18 and P31, Enclosure D)</b><span>Tallest pillars</span></div><div><b>c. 8–10 t for the largest</b><span>Pillar weight</span></div><div><b>c. 14 m across inside, 11 pillars in the ring wall plus 2 central</b><span>Enclosure D</span></div><div><b>c. 300 m across, 15 m high, about 9 ha</b><span>Mound</span></div><div><b>a small fraction, roughly a tenth</b><span>Excavated so far</span></div><div><b>none</b><span>Pottery, metal, writing</span></div></div><p>The builders quarried hard limestone on the plateau beside the site, cutting T-shaped slabs out of bedrock with flint and stone tools; an unfinished pillar still lies in one quarry. Pillars were moved a short way, set into sockets or low pedestals, and linked by rubble walls and stone benches into round to oval enclosures. The biggest, Enclosure D, has two central pillars about 5.5 m tall and eleven more set into its ring wall. Reliefs of arms, hands, belts and fox-pelt loincloths turn the pillars into stylised human figures, surrounded by foxes, boars, snakes, vultures and scorpions. More than 7,000 grinding-stone artefacts show that cereals were processed on site in bulk, probably to feed work parties. Rainwater cisterns and domestic buildings suggest people also lived here.</p><div class="flip" id="marvel-gobekli-tepe-flip"><div class="flip-in"><div class="flip-f"><b>The myth</b><p>A lost advanced civilisation built Göbekli Tepe, buried it on purpose to hide it, and carved a star map of a comet catastrophe on the Vulture Stone.</p></div><div class="flip-b"><b>The reality</b><p>Every find so far (flint tools, animal bones, grinding stones, houses, cisterns) fits a community of late hunter-gatherers on the threshold of farming. The excavators now think much of the fill slid in from higher slopes rather than being dumped in one ritual burial. The comet reading of Pillar 43 is a published hypothesis that the excavation team and most archaeologists reject, mainly because its date sits centuries before the oldest dates for Enclosure D. The real open questions are what the images meant and how the work was organised.</p></div></div><button type="button" class="flip-btn" aria-pressed="false" onclick="flip('marvel-gobekli-tepe-flip',this)">Flip it</button></div><div class="twist"><b>Wow</b><p>Its builders had no pottery, no metal and no farm animals, yet they raised 5.5 m stone figures some 7,000 years before the first Egyptian pyramid.</p></div><div class="wmys"><span>Mystery meter</span><span class="pips" role="img" aria-label="Mystery level 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><small>Real open questions</small></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">11 min read · 2,396 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Göbekli Tepe"><button type="button" class="wtoc-i" data-go="gobekli-tepe-s1">A hill with a navel</button><button type="button" class="wtoc-i" data-go="gobekli-tepe-s2">Rings of stone: Enclosures A to D</button><button type="button" class="wtoc-i" data-go="gobekli-tepe-s3">Stone people and a zoo of carvings</button><button type="button" class="wtoc-i" data-go="gobekli-tepe-s4">How to make a T-pillar</button><button type="button" class="wtoc-i" data-go="gobekli-tepe-s5">Not alone: the Stone Hills</button><button type="button" class="wtoc-i" data-go="gobekli-tepe-s6">How old, exactly? The trouble with fill</button><button type="button" class="wtoc-i" data-go="gobekli-tepe-s7">Buried on purpose? Maybe not</button><button type="button" class="wtoc-i" data-go="gobekli-tepe-s8">A temple on a hill, or a village?</button><button type="button" class="wtoc-i" data-go="gobekli-tepe-s9">The comet on the Vulture Stone</button><button type="button" class="wtoc-i" data-go="gobekli-tepe-s10">What we still don&#x27;t know</button></nav></div><section class="wsec" id="gobekli-tepe-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A hill with a navel</h3><p>Stand on the limestone ridge above the Harran plain on a spring morning and the wind carries the smell of wheat fields. Beneath a modern canopy, a ring of grey stone figures faces inwards towards two taller ones. They have no faces. They do have arms: long, bent arms carved in low relief down their sides, with hands whose fingers meet over the belly. Below the hands, a belt. Hanging from the belt, a fox pelt, tail down.</p><p>These figures were raised around 11,500 years ago. That is roughly 7,000 years before the first Egyptian pyramid and more than 6,000 years before the first stones went up at Stonehenge. The people who raised them had no pottery, no metal, no writing and, as far as the animal bones show, no domesticated livestock. They hunted gazelle and wild cattle, and they harvested wild or barely domesticated cereals.</p><p>The Turkish name, Göbekli Tepe, means roughly Potbelly Hill or Hill of the Navel. A 1963 survey by the Universities of Chicago and Istanbul noticed the mound and its broken limestone slabs, but took them for a medieval cemetery. In 1994 the German archaeologist Klaus Schmidt looked again, recognised the T-shaped slabs as Stone Age pillars, and began excavating in 1995 with the German Archaeological Institute (DAI) and the Şanlıurfa Museum. Thirty years later, only a small fraction of the 300 m mound has been dug.</p><blockquote class="wpull"><p>Its builders had no pottery, no metal and no writing, yet they carved 5.5 m stone people with hands, belts and fox pelts.</p></blockquote></section><section class="wsec" id="gobekli-tepe-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Rings of stone: Enclosures A to D</h3><p>The famous part of the site is a cluster of big round to oval buildings that the excavators label with letters. Enclosures A, B, C and D sit in the main excavation area, and geophysical survey suggests more lie unexcavated in the mound. Each follows the same recipe: a wall of rubble stone, T-shaped pillars set into that wall at intervals with their narrow faces turned inwards, stone benches running between them, and a pair of larger pillars standing free in the middle.</p><p>Enclosure D is the best preserved and the most spectacular. Its interior is about 14 m across at its widest, according to the architectural analysis by Gil Haklay and Avi Gopher. Eleven pillars stand in the ring wall. The central pair, known as Pillars 18 and 31, reach about 5.5 m and are thought to weigh around 8 to 10 tonnes each. They stand in low pedestals cut out of the bedrock, roughly 20 to 30 cm high.</p><figure class="wx wx--static" id="gobekli-tepe-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Enclosure D, the best-preserved ring</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Enclosure D, the best-preserved ring"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" class="wx-svg" role="img" aria-labelledby="gobekli-tepe-f1-t"><title id="gobekli-tepe-f1-t">Simplified plan of Enclosure D at Gobekli Tepe with its two central pillars, ring of pillars, scale bar and a person for scale</title><defs><marker id="gobekli-tepe-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker><marker id="gobekli-tepe-f1-ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text class="wx-t-cap" x="24" y="30">Enclosure D · simplified plan</text><path class="wx-stone2 wx-edge-soft wx-pop" style="--d:0" fill-rule="evenodd" d="M78,292 A184,170 0 1 0 446,292 A184,170 0 1 0 78,292 Z M122,292 A140,126 0 1 0 402,292 A140,126 0 1 0 122,292 Z"/><path class="wx-thin wx-pop" style="--d:1" d="M411.2,280.1h0.5 M354,401.1h0.5 M326.5,159.5h0.5 M177.6,155.2h0.5 M109.3,278.7h0.5 M226.6,429.4h0.5 M394.5,228.5h0.5 M432.8,256.3h0.5 M111.2,217.1h0.5 s="wx-pop" style="--d:6.2"><rect class="wx-stone3 wx-edge" x="116.6" y="279.4" width="9" height="34" transform="rotate(268 121.1 296.4)"/></g><g class="wx-pop" style="--d:6.6"><rect class="wx-accfill wx-edge" x="135.4" y="211.5" width="9" height="34" transform="rotate(300 139.9 228.5)"/></g><g class="wx-pop" style="--d:7.0"><rect class="wx-stone3 wx-edge" x="191.3" y="162.9" width="9" height="34" transform="rotate(332 195.8 179.9)"/></g><g class="wx-pop" style="--d:8"><g transform="rotate(-12 224 296)"><rect class="wx-stone wx-edge-soft" x="214" y="268" width="20" height="56" rx="2"/><rect class="wx-stone3 wx-edge" x="219.5" y="276" width="9" height="40"/></g></g><g class="wx-pop" style="--d:8"><g transform="rotate(-12 300 296)"><rect class="wx-stone wx-edge-soft" x="290" y="268" width="20" height="56" rx="2"/><rect class="wx-stone3 wx-edge" x="295.5" y="276" width="9" height="40"/></g></g><text class="wx-t-b wx-halo wx-pop" style="--d:8" x="224" y="344" text-anchor="middle">P31</text><text class="wx-t-b wx-halo wx-pop" style="--d:8" x="300" y="344" text-anchor="middle">P18</text><g class="wx-pop" style="--d:9"><path class="wx-guide" d="M122,90 V292 M402,90 V292"/><path class="wx-dim" marker-start="url(#gobekli-tepe-f1-ahk)" marker-end="url(#gobekli-tepe-f1-ahk)" d="M124,96 H400"/><text class="wx-t wx-halo" x="262" y="89" text-anchor="middle">c. 14 m across inside (max.)</text></g><g class="wx-pop" style="--d:15"><path class="wx-thin" d="M480,166 L399.4,213.6"/><circle class="wx-inkfill" cx="399.4" cy="213.6" r="2"/><text class="wx-t-b" x="486" y="170">Ring wall of rubble stone</text><text class="wx-t-m" x="486" y="186">with a low bench inside</text></g><g class="wx-pop" style="--d:16"><path class="wx-thin" d="M480,232 L405.8,322.5"/><circle class="wx-inkfill" cx="405.8" cy="322.5" r="2"/><text class="wx-t-b" x="486" y="236">11 T-pillars in the wall,</text><text class="wx-t-m" x="486" y="252">faces turned inwards</text></g><g class="wx-pop" style="--d:17"><path class="wx-thin" d="M480,298 L308,290"/><circle class="wx-inkfill" cx="308" cy="290" r="2"/><text class="wx-t-b" x="486" y="302">Twin central pillars</text><text class="wx-t-m" x="486" y="318">P18 and P31: c. 5.5 m tall,</text><text class="wx-t-m" x="486" y="334">set in low bedrock pedestals</text></g><g class="wx-pop" style="--d:11"><path class="wx-thin" d="M92,142 L132.8,225"/><text class="wx-t-b wx-t-a" x="24" y="128">P43, the</text><text class="wx-t-b wx-t-a" x="24" y="144">"Vulture Stone"</text></g><g class="wx-pop" style="--d:11"><path class="wx-line" d="M686,78 V44"/><path class="wx-inkfill" d="M686,36 L680,50 L692,50 Z"/><text class="wx-t-b" x="686" y="94" text-anchor="middle">N</text></g><g class="wx-pop" style="--d:11"><rect class="wx-inkfill" x="40" y="520" width="20" height="6"/><rect class="wx-paper wx-edge" x="60" y="520" width="20" height="6"/><rect class="wx-inkfill" x="80" y="520" width="20" height="6"/><rect class="wx-paper wx-edge" x="100" y="520" width="20" height="6"/><rect class="wx-inkfill" x="120" y="520" width="20" height="6"/><rect class="wx-line" x="40" y="520" width="100" height="6"/><text class="wx-t-s" x="40" y="542" text-anchor="middle">0</text><text class="wx-t-s" x="140" y="542" text-anchor="middle">5 m</text></g><g class="wx-pop" style="--d:10"><text class="wx-t-cap" x="500" y="398">Same scale, side view</text><path class="wx-line" d="M500,520 H700"/></g><g class="wx-grow" style="--d:10"><rect class="wx-stone wx-edge-soft" x="546" y="514" width="52" height="6"/><path class="wx-stone3 wx-edge" d="M560,514 V426 H544 V404 H584 V514 Z"/><path class="wx-thin" d="M581,432 C566,452 564,470 563,476"/><path class="wx-thin" d="M560,480 H584 M560,485 H584"/></g><g class="wx-pop" style="--d:11"><path class="wx-dim" marker-start="url(#gobekli-tepe-f1-ahk)" marker-end="url(#gobekli-tepe-f1-ahk)" d="M530,406 V518"/><text class="wx-t-n wx-halo" x="524" y="466" text-anchor="end">5.5 m</text><text class="wx-t-s" x="572" y="536" text-anchor="middle">P18</text></g><g class="wx-pop" style="--d:12"><circle class="wx-line" cx="640" cy="489.1" r="3.1"/><path class="wx-line" d="M640,492.1 L640,504 M635.2,520 L640,504 L644.8,520 M634.2,501.6 L640,494.8 L645.8,501.6"/></g><text class="wx-t-s wx-pop" style="--d:12" x="640" y="536" text-anchor="middle">1.7 m</text><text class="wx-t-s" x="24" y="566">Simplified after DAI excavation plans and Haklay &amp; Gopher 2020; pillar positions approximate.</text></svg></div></div><figcaption>A simplified plan of Enclosure D with its ring wall, benches, eleven wall pillars and the two central giants, plus a side view of Pillar 18 next to a person at the same scale. <span class="wx-src">Based on: Haklay &amp; Gopher 2020 (dimensions and pillar count); DAI project publications (pillar heights, pedestals). Positions of wall pillars simplified.</span></figcaption><p class="vh">Plan view of an oval stone enclosure about 14 metres across inside. A thick rubble ring wall has a low bench along its inner face and eleven narrow rectangular pillars set into it, each pointing towards the centre. The pillar in the north-west, P43, the Vulture Stone, is highlighted. In the middle stand two pillars, P31 and P18, on low pedestals. A 5 metre scale bar and a north arrow are shown. An inset side view compares the 5.5 metre T-shaped Pillar 18 with a 1.7 metre person.</p></figure><p>Haklay and Gopher noticed something else. If you mark the centre points of Enclosures B, C and D on a plan, they form an almost perfect equilateral triangle with sides of about 19.25 m, accurate to within about 1.5 per cent. They argue that the three buildings were planned together as one project, perhaps laid out with cords and pegs. Not everyone agrees that the pattern was intended, but the precision is striking, and it hints at design decisions made before the first pillar was raised.</p><p>Were the enclosures roofed? The question matters for everything from how they felt inside to whether anyone could watch the sky from within. The DAI team has argued that at least some of the buildings were probably roofed, pointing to the benches, the inward-facing pillars and later, smaller buildings with clear roof supports. Others see them as open-air. The honest answer is that the evidence for roofs is indirect.</p></section><section class="wsec" id="gobekli-tepe-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Stone people and a zoo of carvings</h3><p>The T-shape is not decoration: it is a body. The horizontal top is a head seen from the side, and the shaft is a torso. On the two central pillars of Enclosure D, the carvers made this explicit. Arms run down the broad sides, bent at the elbow, and the hands meet on the front just above a belt. The belts carry symbols, and from each hangs a fox pelt, carved so clearly that the fur and tail are recognisable. Most researchers read the central pairs as supernatural beings or ancestors rather than portraits of individual people.</p><figure class="photo wimg" data-img="Göbekli Tepe Pilar Arm and Fox.JPG" data-cap="An arm and a leaping fox carved on a Göbekli Tepe pillar."><figcaption></figcaption></figure><p>Around these stone figures swarms an entire bestiary. Foxes leap across the shafts. Wild boars, snakes, cranes, vultures, aurochs, wild asses and scorpions appear in low and high relief. Snakes often flow downwards. The choice is not random: dangerous, carrion-eating or night-active animals dominate, and the domestic, the gentle and the edible are rare. Wild cattle and gazelle, which were eaten here in large numbers, appear far less often than foxes.</p><p>Pillar 43 in Enclosure D, nicknamed the Vulture Stone, is the densest of all. On its upper front sits a large vulture with a circle beside one outstretched wing. Around it are smaller birds, a scorpion, a snake and, near the top, three rectangular objects with handles that visitors love to call handbags. At the bottom is a headless human figure with an erect phallus. Headless figures and carved human skulls at the site hint at a concern with the dead and with heads, a theme that returns at nearby sites.</p></section><section class="wsec" id="gobekli-tepe-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>How to make a T-pillar</h3><p>The raw material was right underfoot. The ridge is made of hard, flat-bedded limestone, and quarry traces on the plateau around the enclosures show where pillars were outlined, trenched and levered free. Schmidt described an unfinished pillar still lying in its bedrock bed, reported as around 7 m long. It shows the method: mark the outline, cut a channel around it with stone and flint tools, then split the slab off along a natural bedding plane.</p><figure class="wx wx--steps" id="gobekli-tepe-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">From bedrock to stone figure</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="From bedrock to stone figure"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" class="wx-svg" role="img" aria-labelledby="gobekli-tepe-f2-t"><title id="gobekli-tepe-f2-t">How a T-pillar was quarried, moved, raised and carved at Gobekli Tepe, in five steps</title><defs><marker id="gobekli-tepe-f2-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker><marker id="gobekli-tepe-f2-ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><polygon class="wx-stone wx-o80" points="0,332 720,332 720,284 0,284" /><rect class="wx-rock" x="0" y="332" width="720" height="70"/><path class="wx-edge-soft" d="M0,349H720M0,368H720M0,386H720"/><path class="wx-line" d="M0,332H720"/><path class="wx-guide" d="M296,402 V272"/><text class="wx-t-cap" x="16" y="422">Quarry on the limestone
