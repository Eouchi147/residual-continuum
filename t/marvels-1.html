l8,-5 z" class="wx-stone2 wx-edge"/><text x="560" y="452" class="wx-t">Tongue and groove</text></g></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> A sarsen arrives on timber rails beside a pit with one sloping side and stakes along its steep back.</p><ol class="wx-steplist"><li>A sarsen arrives on timber rails beside a pit with one sloping side and stakes along its steep back.</li><li>Levered forward, the stone tips and slides base-first down the slope into the pit.</li><li>Teams haul it upright with ropes, perhaps over a timber frame, and pack the pit with stones and rammed chalk.</li><li>The lintel is raised, perhaps on a timber crib built up layer by layer, perhaps up an earth ramp.</li><li>The lintel&#x27;s mortises drop over the uprights&#x27; tenons; neighbouring lintels lock with tongue-and-groove joints.</li></ol><figcaption>A likely sequence, reconstructed from excavated stoneholes and experiments. The crib method for the lintel is one of two proposals. Drawn at one scale with a 1.7 m person. <span class="wx-src">Based on: Stonehole profiles after Cleal et al. 1995; dimensions of circle uprights (c. 4.1 m above ground, 2.1 m wide, 1.1 m thick) and lintels (c. 3.2 m long, 0.8 m thick) from standard surveys; raising methods as proposed in the experimental literature.</span></figcaption><p class="vh">Five-step cutaway drawn at one scale beside a 1.7 m person, with chalk below ground. Step 1: a sarsen about 5.4 m long lying on timber rails beside a pit with a sloping side and timber stakes at its steep back. Step 2: levered forward, the stone tips and slides base-first down the slope into the pit. Step 3: the stone stands upright against the stakes, hauled by ropes over a timber A-frame, with packing stones in the pit. Step 4: two uprights about 4.1 m high with two tenons each; a lintel rests on a crib of crossed logs beside them and is levered across. Step 5: the lintel sits on the uprights, its mortises over the tenons, with an inset showing mortise-and-tenon and tongue-and-groove joints.</p></figure><p>Lintels posed the harder problem: lifting a stone of about 7 tonnes more than 4 m and setting it precisely. Two methods are usually proposed: an earth ramp, or a timber crib, a platform of crossed logs raised one layer at a time while the stone was levered up after it. The crib needs far less material and has been demonstrated experimentally, but there is no direct evidence for either.</p><p>What is certain is how the stones were locked together. Each lintel has two hollows, mortises, that fit over knobs, tenons, left projecting from the tops of the uprights. Neighbouring lintels in the outer circle join end to end with tongue-and-groove joints. These are carpenters&#x27; joints, translated into stone, a strong hint that the builders thought about their monument in terms of timber structures like the great wooden circles nearby.</p><p>The builders also cared how it looked from one particular direction. A laser scan of every stone surface, carried out for English Heritage in 2011 and 2012, showed that the stones facing someone walking up the Avenue from the northeast, towards the solstice view, were dressed most finely, while faces seen less often were left rougher. The monument was designed to be approached along its axis.</p></section><section class="wsec" id="stonehenge-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>Durrington Walls and the living</h3><p>Stonehenge was not an isolated temple on an empty plain. About 3 km to the northeast lies Durrington Walls, a huge henge enclosure. Excavations between 2004 and 2007 found the remains of houses dating to around 2500 BCE, the time the sarsens went up, and enormous quantities of animal bone and pottery.</p><p>The pig bones are especially telling. Most pigs were killed at around nine months old, which, given spring births, puts the feasts in midwinter. Isotope studies published in 2019 show that pigs and cattle were brought to the feasts from across Britain, some probably from as far as Scotland. Parker Pearson has argued that Durrington, with its timber circles, was a place for the living and Stonehenge, in stone, a place for the ancestors, the two linked by the River Avon and their avenues. That interpretation is influential but not universally accepted.</p><p>Where the Avenue meets the River Avon, excavators in 2009 found the stoneholes of a small circle of about 25 stones, nicknamed Bluestonehenge. Its stones seem to have been removed around 2400 BCE, perhaps taken up the Avenue and added to Stonehenge itself. Monuments in this landscape were not fixed: they were dismantled, moved and combined, as if the stones themselves carried histories worth keeping.</p><p>The wider landscape keeps producing surprises. In 2020, geophysical survey revealed a ring of large pits, more than 20 of them, surrounding Durrington Walls on a circle about 2 km across, dug around 2500 BCE. Their purpose is unknown.</p></section><section class="wsec" id="stonehenge-s8"><h3 class="wsec-h"><span class="wsec-n">08</span>Magic, glaciers and computers</h3><p>In the 1130s the chronicler Geoffrey of Monmouth told how the wizard Merlin brought a stone circle called the Giants&#x27; Dance from Ireland by his arts. Oddly, the legend of stones moved from the far west to Salisbury Plain has a grain of truth in it; only the magic and the Irish address are wrong.</p><p>The Druids arrived in the story much later. In the 17th and 18th centuries John Aubrey and William Stukeley linked Stonehenge to the Druid priests described by Julius Caesar, and the connection stuck. But the Druids belong to the Iron Age, roughly 2,000 years after the sarsens were raised. Modern Druid and pagan groups who gather at the stones for the solstice are part of the monument&#x27;s long afterlife, not its origin, and English Heritage now opens the site to them on the longest and shortest days.</p><p>A more serious rival to human transport is ice. Some geologists have argued since the 1970s that glaciers carried the bluestones most of the way to Salisbury Plain. The evidence has turned against this: there are no scattered Welsh erratics across Wiltshire, the quarries at Carn Goedog and Craig Rhos-y-felin show human extraction, and the Altar Stone modelling rules out a glacial route from Scotland.</p><p>In 1965 the astronomer Gerald Hawkins proposed in Stonehenge Decoded that the monument was an astronomical computer, with the Aubrey Holes used to predict eclipses. Archaeologists, notably Richard Atkinson in a paper he titled &#x27;Moonshine on Stonehenge&#x27;, pointed out that the features Hawkins used belonged to different centuries and that many alignments occur by chance in any complex site. The solstice axis is real and deliberate; a Neolithic eclipse calculator is not supported.</p></section><section class="wsec" id="stonehenge-s9"><h3 class="wsec-h"><span class="wsec-n">09</span>What is still unknown</h3><ul class="wlist"><li>The exact routes of the bluestones and the Altar Stone, and whether boats were used for part of either journey.</li><li>Whether the bluestones stood first in a circle in Wales. Excavations at Waun Mawn, published in 2021, were presented as a dismantled &#x27;original Stonehenge&#x27;, but that reading has been strongly challenged.</li><li>Whether the sarsen circle was ever complete. Parchmarks seen in the dry summer of 2013 suggest missing stones once stood, but not every hole has been dated.</li><li>Where the two non-West Woods sarsens came from.</li><li>What the monument meant: a temple of the sun, a monument to the ancestors, a place of healing, or several of these at different times.</li></ul><p>The mystery rating is 2 out of 5. The how is increasingly well understood and the where is now known in startling detail. The why, as with most prehistoric monuments, may never be fully recoverable. But the builders&#x27; choices, a line to the solstice sun, stones hauled from three corners of Britain, joints copied from carpentry, tell us they were organised, ambitious and deeply connected to one another.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">3,000 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Stage 1: ditch, bank and Aubrey Holes; first burials</span></li><li class="wtl-use" style="--i:1"><span class="wtl-y">2,995 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Cow later buried at the entrance raised partly in Wales (tooth dated c. 2995–2900 BCE)</span></li><li class="wtl-build" style="--i:2"><span class="wtl-y">2,500 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Stage 2: sarsen circle and trilithons raised</span></li><li class="wtl-use" style="--i:3"><span class="wtl-y">2,480 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Durrington Walls settlement and midwinter feasts</span></li><li class="wtl-build" style="--i:4"><span class="wtl-y">2,300 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Stage 3: the Avenue built towards the River Avon</span></li><li class="wtl-build" style="--i:5"><span class="wtl-y">2,100 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Stage 4: bluestones rearranged into circle and oval</span></li><li class="wtl-build" style="--i:6"><span class="wtl-y">1,600 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Stage 5: Y and Z Holes dug; last major activity</span></li><li class="wtl-event" style="--i:7"><span class="wtl-y">1136 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Geoffrey of Monmouth credits Merlin with moving the stones</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">1740 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Stukeley records the axis on midsummer sunrise</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">1958 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Restoration; a core drilled from Stone 58 is taken away</span></li><li class="wtl-find" style="--i:10"><span class="wtl-y">2019 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Bluestone quarries dated; Stone 58 core returned</span></li><li class="wtl-find" style="--i:11"><span class="wtl-y">2020 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Sarsens sourced to West Woods</span></li><li class="wtl-find" style="--i:12"><span class="wtl-y">2024 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Altar Stone traced to northeast Scotland</span></li><li class="wtl-study" style="--i:13"><span class="wtl-y">2026 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Ice modelling: glaciers could not have delivered the Altar Stone to Salisbury Plain</span></li></ol><figure class="wbars"><h4 class="wx-title">How far the stones travelled</h4><div class="wb-r" style="--w:3.6%;--i:0"><div class="wb-l">Sarsens (West Woods, Wiltshire)<small>most of the 52 surviving sarsens</small></div><div class="wb-t"><i></i><span>25 km</span></div></div><div class="wb-r" style="--w:32.9%;--i:1"><div class="wb-l">Bluestones (Preseli Hills, Wales)<small>Carn Goedog, Craig Rhos-y-felin and other outcrops</small></div><div class="wb-t"><i></i><span>230 km</span></div></div><div class="wb-r" style="--w:100.0%;--i:2"><div class="wb-l">Altar Stone (northeast Scotland)<small>straight line; any real route longer</small></div><div class="wb-t"><i></i><span>700 km</span></div></div><figcaption>Source: Nash et al. 2020; Parker Pearson et al. 2019; Clarke et al. 2024</figcaption></figure><h3 class="sub-h wsub">The big debates</h3><div class="debate"><p class="debate-q">Did glaciers or people bring the far-travelled stones?</p><div class="sides"><div class="side"><b>Glaciers: ice sheets carried the bluestones, and perhaps the Altar Stone, much of the way.</b><span>Britain was glaciated repeatedly; some geologists (e.g. Kellaway, Brian John) argue the Preseli quarries are natural features.</span></div><div class="side"><b>People: the stones were deliberately quarried and hauled.</b><span>Excavated quarries with wedges, platforms and dated hearths; no trail of Welsh erratics across southern England; 2026 ice modelling finds no glacial route for the Altar Stone into southern England.</span></div></div><p class="debate-why"><b>The bold claim:</b> Ice, not people, delivered the Welsh bluestones and the Scottish Altar Stone to Salisbury Plain.</p><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The glacial hypothesis was reasonable before the quarries were found. It now faces human-made quarry features dated to the right period, the absence of erratics where the ice would have dropped them, and modelling showing no glacier could carry the Altar Stone south from Scotland. Human transport is the far stronger explanation.</p></div><div class="debate"><p class="debate-q">Was Stonehenge an astronomical computer?</p><div class="sides"><div class="side"><b>Yes: many alignments, and the 56 Aubrey Holes could track eclipse cycles.</b><span>Gerald Hawkins, Stonehenge Decoded (1965); Fred Hoyle&#x27;s later eclipse model.</span></div><div class="side"><b>Only partly: the solstice axis is deliberate; the rest is over-reading.</b><span>The features used date to different centuries; chance alignments are common in complex sites; the Aubrey Holes held cremations and possibly stones.</span></div></div><p class="debate-why"><b>The bold claim:</b> Stonehenge was a Neolithic computer for predicting eclipses.</p><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The midsummer sunrise and midwinter sunset axis is solid and was built into every stage. But the eclipse-computer idea combines features that never existed together and relies on alignments that could arise by chance. Nothing in the excavated evidence requires or supports it.</p></div><div class="debate"><p class="debate-q">Was there an &#x27;original Stonehenge&#x27; in Wales?</p><div class="sides"><div class="side"><b>Yes: the bluestones first stood in a circle at Waun Mawn in Preseli before being moved.</b><span>Parker Pearson et al. 2021 reported empty stoneholes in an arc about 110 m across, the same diameter as Stonehenge&#x27;s enclosure.</span></div><div class="side"><b>Not shown: Waun Mawn was a smaller, incomplete arrangement unrelated to Stonehenge.</b><span>Later critiques question the dating, the reconstructed diameter and whether some holes are stoneholes at all.</span></div></div><p class="debate-why"><b>The bold claim:</b> The bluestones stood as a complete stone circle at Waun Mawn before being moved to Stonehenge.</p><div class="meter" style="--pos:41.7%" role="img" aria-label="Weight of evidence: Open question"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The Waun Mawn excavations found real stoneholes in the right region, and the idea fits the Welsh links shown by cremations and the cow tooth. But the dating is loose, the circle is incomplete, and specialists disagree strongly about the reconstruction. It remains an interesting hypothesis.</p></div><details class="srcs"><summary>Sources for this deep dive (15)</summary><ol><li>Darvill, T., Marshall, P., Parker Pearson, M. &amp; Wainwright, G. (2012). Stonehenge remodelled. Antiquity 86: 1021-1040. <a href="https://doi.org/10.1017/S0003598X00048225" target="_blank" rel="noopener">doi:10.1017/S0003598X00048225</a></li><li>Cleal, R. M. J., Walker, K. E. &amp; Montague, R. (1995). Stonehenge in its Landscape: Twentieth-Century Excavations. English Heritage.</li><li>Nash, D. J. et al. (2020). Origins of the sarsen megaliths at Stonehenge. Science Advances 6(31): eabc0133. <a href="https://doi.org/10.1126/sciadv.abc0133" target="_blank" rel="noopener">doi:10.1126/sciadv.abc0133</a></li><li>Parker Pearson, M. et al. (2015). Craig Rhos-y-felin: a Welsh bluestone megalith quarry for Stonehenge. Antiquity 89: 1331-1352. <a href="https://doi.org/10.15184/aqy.2015.177" target="_blank" rel="noopener">doi:10.15184/aqy.2015.177</a></li><li>Parker Pearson, M. et al. (2019). Megalith quarries for Stonehenge&#x27;s bluestones. Antiquity 93(367): 45-62. <a href="https://doi.org/10.15184/aqy.2018.111" target="_blank" rel="noopener">doi:10.15184/aqy.2018.111</a></li><li>Parker Pearson, M. et al. (2021). The original Stonehenge? A dismantled stone circle in the Preseli Hills of west Wales. Antiquity 95: 85-103. <a href="https://doi.org/10.15184/aqy.2020.239" target="_blank" rel="noopener">doi:10.15184/aqy.2020.239</a></li><li>Clarke, A. J. I. et al. (2024). A Scottish provenance for the Altar Stone of Stonehenge. Nature 632: 570-575. <a href="https://doi.org/10.1038/s41586-024-07652-1" target="_blank" rel="noopener">doi:10.1038/s41586-024-07652-1</a></li><li>Ness of Brodgar Project (2024). Stonehenge Altar Stone was &#x27;not sourced from Mainland Orkney&#x27; says new research.</li><li>Clarke, A. J. I. et al. (2026). From Highlands to Henge: Refining the Provenance and Transport Pathways of Stonehenge&#x27;s Altar Stone. Journal of Quaternary Science. <a href="https://doi.org/10.1002/jqs.70080" target="_blank" rel="noopener">doi:10.1002/jqs.70080</a></li><li>Snoeck, C. et al. (2018). Strontium isotope analysis on cremated human remains from Stonehenge support links with west Wales. Scientific Reports 8: 10790. <a href="https://doi.org/10.1038/s41598-018-28969-8" target="_blank" rel="noopener">doi:10.1038/s41598-018-28969-8</a></li><li>Madgwick, R. et al. (2019). Multi-isotope analysis reveals that feasts in the Stonehenge environs and across Wessex drew people and animals from throughout Britain. Science Advances 5(3): eaau6078. <a href="https://doi.org/10.1126/sciadv.aau6078" target="_blank" rel="noopener">doi:10.1126/sciadv.aau6078</a></li><li>Evans, J. et al. (2025). Isotope study of a Neolithic cattle tooth from Stonehenge. Journal of Archaeological Science (August 2025); summarised in UCL News, 22 August 2025.</li><li>Parker Pearson, M. (2012). Stonehenge: Exploring the Greatest Stone Age Mystery. Simon &amp; Schuster.</li><li>Atkinson, R. J. C. (1966). Moonshine on Stonehenge. Antiquity 40: 212-216.</li><li>Hawkins, G. S. (1965). Stonehenge Decoded. Doubleday.</li></ol></details><aside class="rc-cite" data-v="marvels" data-id="marvel-stonehenge" data-t="Stonehenge"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Stonehenge</i>. <span class="cite-u">https://residual-continuum.vercel.app/#marvels/marvel-stonehenge</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="marvel-antikythera-mechanism-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Antikythera Fragment A (Front).webp" data-cap="Fragment A of the Antikythera mechanism" data-big><figcaption></figcaption></figure><div class="sh-k">Antikythera shipwreck, Greece</div><h2 class="sh-t" id="marvel-antikythera-mechanism-st" tabindex="-1">The Antikythera Mechanism</h2><p class="sh-s">A shoebox of bronze gears that turned days into Moon phases, eclipses and Olympic years, two thousand years ago.</p><div class="sh-v"><span class="vstamp vstamp--mys">Mystery <span class="pips" role="img" aria-label="Mystery level 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span></span></div></div><div class="wquick"><h3 class="sub-h">The quick read</h3><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="82" >82</b><span class="ctr-u"> fragments</span></div><div class="ctr-l">surviving pieces in Athens</div><div class="ctr-c">National Archaeological Museum, Athens</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="30" >30</b><span class="ctr-u"> gears</span></div><div class="ctr-l">surviving bronze gearwheels</div><div class="ctr-c">Freeth et al. 2006</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="223" >223</b><span class="ctr-u"> teeth</span></div><div class="ctr-l">on the main wheel b1 and on the Saros turntable e3</div><div class="ctr-c">Freeth et al. 2006</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="1.6" data-dec="1">1.6</b><span class="ctr-u"> mm</span></div><div class="ctr-l">average spacing of the hand-cut teeth</div><div class="ctr-c">Freeth et al. 2006</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="69" >69</b><span class="ctr-u"> gears</span></div><div class="ctr-l">in the 2021 reconstruction of the whole machine</div><div class="ctr-c">Freeth et al. 2021</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="354" >354</b><span class="ctr-u"> holes</span></div><div class="ctr-l">most likely count in the calendar ring</div><div class="ctr-c">Woan &amp; Bayley 2024</div></div></div><div class="stats"><div><b>82</b><span>Surviving fragments</span></div><div><b>30, hand-cut bronze with triangular teeth</b><span>Surviving gears</span></div><div><b>c. 13 cm across, 223 teeth</b><span>Largest gear (b1)</span></div><div><b>c. 34 × 18 × 9 cm (reconstruction)</b><span>Case</span></div><div><b>Metonic (19 yr), Saros (18 yr), Callippic, Exeligmos, Games</b><span>Back dials</span></div><div><b>most likely 354 holes, a lunar year (2020–2024 studies)</b><span>Calendar hole ring</span></div><div><b>c. 70–60 BCE, about 45 m deep</b><span>Shipwreck</span></div></div><p>A craftsman cut some 30 or more bronze gears by hand, with small triangular teeth about 1.6 mm apart, and mounted them in a wooden case with dials front and back. Turning a crank on the side drove the big main wheel, b1, once round for each year. Trains of gears with carefully chosen tooth counts turned that year into the motion of the Moon around the zodiac, the phase of the Moon, 19-year and 18-year calendar and eclipse cycles, and the four-year cycle of the Panhellenic games. A pin-and-slot pair of gears reproduced the Moon&#x27;s changing speed, following a theory of Hipparchos. X-ray computed tomography in 2005 revealed hidden tooth counts and thousands of letters of inscribed instructions.</p><div class="flip" id="marvel-antikythera-mechanism-flip"><div class="flip-in"><div class="flip-f"><b>The myth</b><p>Nothing like it existed for more than a thousand years, so it must be out-of-place technology, from time travellers, aliens or a vanished super-civilisation.</p></div><div class="flip-b"><b>The reality</b><p>It fits a documented Greek tradition. Cicero describes geared bronze spheres attributed to Archimedes and Posidonius, and the Mechanism&#x27;s inscriptions use Greek astronomical terms and Babylonian-derived cycles. What is extraordinary is its survival, since bronze was usually melted down. Open questions remain: who made it, where, exactly when, and how the lost planetary display worked.</p></div></div><button type="button" class="flip-btn" aria-pressed="false" onclick="flip('marvel-antikythera-mechanism-flip',this)">Flip it</button></div><div class="twist"><b>Wow</b><p>Its gears modelled the Moon speeding up and slowing down along its orbit, using a pin sliding in a slot on a slowly rotating turntable, about two thousand years before modern clockwork.</p></div><div class="wmys"><span>Mystery meter</span><span class="pips" role="img" aria-label="Mystery level 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><small>A few loose ends</small></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">10 min read · 2,237 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Antikythera Mechanism"><button type="button" class="wtoc-i" data-go="antikythera-mechanism-s1">A lump of bronze from the sea</button><button type="button" class="wtoc-i" data-go="antikythera-mechanism-s2">Seventy years of squinting</button><button type="button" class="wtoc-i" data-go="antikythera-mechanism-s3">2005: seeing inside the stone</button><button type="button" class="wtoc-i" data-go="antikythera-mechanism-s4">Turn the crank, move the Moon</button><button type="button" class="wtoc-i" data-go="antikythera-mechanism-s5">The back of the box: calendars and eclipses</button><button type="button" class="wtoc-i" data-go="antikythera-mechanism-s6">A cosmos on the front</button><button type="button" class="wtoc-i" data-go="antikythera-mechanism-s7">Fresh from the field: counting holes</button><button type="button" class="wtoc-i" data-go="antikythera-mechanism-s8">Out of place? Not really</button><button type="button" class="wtoc-i" data-go="antikythera-mechanism-s9">Who made it, and when?</button><button type="button" class="wtoc-i" data-go="antikythera-mechanism-s10">What we still don&#x27;t know</button></nav></div><section class="wsec" id="antikythera-mechanism-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A lump of bronze from the sea</h3><p>In 1900 a boat of sponge divers from the island of Symi, blown off course by a storm, took shelter at Antikythera, a small island between the Peloponnese and Crete. One diver, Elias Stadiatis, went down about 45 m and came back, in the story told ever since, babbling about a heap of dead naked people on the seabed. They were bronze and marble statues. The captain, Dimitrios Kontos, reported the find, and in 1900 and 1901 the divers, supported by the Greek navy, raised statues, glass, pottery and coins in one of the first large underwater excavations in history.</p><p>Among the finds was a corroded lump of bronze and wood, not much bigger than a shoebox. It split into pieces as it dried. In May 1902, the archaeologist Valerios Stais noticed a gearwheel in one of them. A gearwheel, from a ship that coins and pottery date to around 70 to 60 BCE.</p><p>The ship itself was a large merchant vessel carrying luxury goods from the Greek east, probably towards Italy, where wealthy Romans collected Greek art. Its cargo included bronze and marble statues, fine glassware, jewellery and pottery. The Mechanism may have been part of that cargo, or a possession of someone on board. Either way, it was already old and perhaps already repaired when the ship went down, which helps explain why dating its making is so difficult.</p><blockquote class="wpull"><p>A gearwheel, from a ship that sank more than two thousand years ago. It took a century to understand what it was for.</p></blockquote></section><section class="wsec" id="antikythera-mechanism-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Seventy years of squinting</h3><p>The fragments were too fragile to take apart and too corroded to read easily. Early scholars, including the philologist Albert Rehm, guessed that it was an astronomical calculator, but the details were out of reach. The first person to make real progress was the historian of science Derek de Solla Price. From 1951 he studied the fragments, and in 1971 he worked with the Greek radiologist Charalampos Karakalos to make X-ray and gamma-ray images. His 1974 monograph, Gears from the Greeks, counted teeth, proposed a gear train and argued that the device was a calendar computer.</p><p>Price got many things right and some things wrong. In the 1990s and 2000s Michael Wright, then a curator at the Science Museum in London, working first with Allan Bromley, used linear tomography to see layers inside the fragments. Wright corrected parts of Price&#x27;s scheme, identified the Moon-phase display and built a working model, completed in 2002, that included a speculative display of the planets. Each generation saw a little deeper into the corroded blocks.</p></section><section class="wsec" id="antikythera-mechanism-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>2005: seeing inside the stone</h3><p>The breakthrough came from new machines. In 2005 the Antikythera Mechanism Research Project, a collaboration of British and Greek scientists and the National Archaeological Museum in Athens, brought two instruments to the museum. A high-energy X-ray computed tomography scanner built by the company X-Tek produced 3D slices through every fragment. A reflectance imaging dome developed at Hewlett-Packard photographed the surfaces under light from many angles, making faint letters on the corroded plates legible.</p><p>The results, published by Tony Freeth and colleagues in Nature in 2006, were spectacular. The team counted teeth on gears hidden deep inside the fragments, confirmed the purpose of the back dials, and doubled the amount of inscription that could be read. The text turned out to be a user&#x27;s manual in Greek, naming the dials, the planets and the cycles. At least 30 gears survive, most in the largest fragment. The biggest, the four-spoked main wheel called b1, is about 13 cm across and carried 223 teeth, each a little triangle about 1.6 mm from the next, cut by hand.</p></section><section class="wsec" id="antikythera-mechanism-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Turn the crank, move the Moon</h3><p>Imagine holding the box. On its side is a crank. Turning it drives b1, and one full turn of b1 is one year: a pointer on the front moves the Sun once around the zodiac and a day-by-day calendar. From b1 a train of smaller gears speeds the motion up. The tooth counts tell the story: 64 teeth drive 38, then 48 drive 24, then 127 drive 32. Multiply it out and the result is 254 turns for every 19 turns of b1. That is the number of times the Moon goes around the zodiac in 19 years, a ratio the Babylonians knew well.</p><figure class="wx wx--steps" id="antikythera-mechanism-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">From crank to Moon phase</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="From crank to Moon phase"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" class="wx-svg" role="img" aria-labelledby="antikythera-mechanism-f1-t"><title id="antikythera-mechanism-f1-t">How turning the crank of the Antikythera Mechanism moves the Moon pointer and shows the Moon's phase, in five steps</title><defs><marker id="antikythera-mechanism-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker><marker id="antikythera-mechanism-f1-ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><g class="wx-st" data-s="1"><g class="wx-spin" style="--sp:60"><path class="wx-bronze wx-edge" fill-rule="evenodd" d="M263.6,196 L265.1,197.4 L263.5,198.8 L265.1,200.3 L263.4,201.6 L264.9,203.1 L263.2,204.4 L264.7,206 L262.9,207.2 L264.3,208.8 L262.6,210 L263.9,211.6 L262.1,212.7 L263.5,214.4 L261.6,215.5 L262.9,217.2 L261,218.2 L262.3,220 L260.4,221 L261.5,222.8 L259.6,223.7 L260.8,225.5 L258.8,226.4 L259.9,228.2 L257.9,229 L258.9,230.9 L256.9,231.7 L257.9,233.6 L255.9,234.3 L256.8,236.2 L254.8,236.8 L255.7,238.8 L253.6,239.4 L254.4,241.3 L25 s the great main wheel b1 (223 teeth). One full turn of b1 is one year, and the Sun pointer moves once round the zodiac.</p><ol class="wx-steplist"><li>Turn the crank: it drives the great main wheel b1 (223 teeth). One full turn of b1 is one year, and the Sun pointer moves once round the zodiac.</li><li>The speed-up train b2 → c → d → e2 multiplies the rate by 254/19, about 13.37: the Moon&#x27;s laps of the zodiac per year. The Moon pointer now moves.</li><li>On the back, the big turntable e3 (223 teeth) carries the gears k1 and k2 round once in about 8.88 years, following the slow turning of the Moon&#x27;s orbit.</li><li>Pin and slot: k1 and k2 sit on slightly offset axes, so k2 alternately gains and loses a little. The Moon pointer speeds up and slows down, as in Hipparchos&#x27;s lunar theory.</li><li>Moon phase: a differential compares Moon and Sun and turns a half-dark ball on the Moon pointer to show the phase.</li></ol><figcaption>Five steps through the lunar gearing. Gear sizes are drawn to scale by tooth count, but the parts are spread out so each can be seen; the e3 turntable really sits behind b1. <span class="wx-src">Based on: Tooth counts and turntable period from Freeth et al. 2006; phase display after Wright 2006 and Freeth et al. 2021. Layout simplified.</span></figcaption><p class="vh">Step 1: a crank turns the large four-spoked main wheel b1, 223 teeth, once per year, and the Sun pointer moves on a zodiac dial. Step 2: gears b2, c, d and e2 appear, with tooth counts 64 to 38, 48 to 24 and 127 to 32, giving 254 over 19, about 13.37 turns a year, and a Moon pointer appears. Step 3: a large turntable e3 with 223 teeth carries gears k1 and k2 and turns once in about 8.88 years. Step 4: a close-up shows a pin on k1 sliding in a slot in k2 on slightly offset axes, making the Moon speed up and slow down. Step 5: a half-dark ball on the Moon pointer turns to show the phase.</p></figure><p>But the Moon does not travel at a steady speed. It moves faster when nearer to Earth and slower when farther away. The Greek astronomer Hipparchos, in the 2nd century BCE, modelled this with circles. The Mechanism models it with metal. Two gears, k1 and k2, sit face to face on slightly different axes. A pin on k1 slides in a slot in k2, so k2 runs a little ahead, then a little behind. Both ride on a large turntable, e3, which turns once in about 8.88 years, matching the slow swing of the Moon&#x27;s orbit. The result, carried back to the front, is a Moon pointer that speeds up and slows down.</p><aside class="wcall"><b>Cut by hand</b><p>No machine tools were involved. The gears were cut from thin bronze sheet, and the teeth were almost certainly marked out and filed by hand. Dividing a circle into exactly 223 equal teeth by eye is hard; CT scans show small irregularities in spacing and shape, the fingerprints of a human maker. The calendar holes, by contrast, were placed with astonishing care.</p></aside><p>Finally, a small differential compares the motion of the Moon with that of the Sun and turns a little ball, half dark and half silvery, set in the Moon pointer. As the Moon moves away from the Sun, the ball turns to show a waxing crescent, a half, a full disc. It is a Moon-phase display on a hand-cranked machine from the Hellenistic world.</p></section><section class="wsec" id="antikythera-mechanism-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The back of the box: calendars and eclipses</h3><p>The back of the Mechanism carried two large spiral dials, one above the other. A pointer with a small follower tracked each spiral groove, stepping outwards turn by turn like the needle on a record.</p><figure class="wx wx--static" id="antikythera-mechanism-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">The dials, front and back</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The dials, front and back"><svg focusable="false" thin" d="M342,160 L358,160"/><path class="wx-thin" d="M342,160 L342,176"/><path class="wx-thin" d="M342,160 L326,160"/></g><g class="wx-pop" style="--d:8"><circle class="wx-paper wx-edge" cx="380" cy="160" r="16"/><path class="wx-thin" d="M380,160 L380,144"/><path class="wx-thin" d="M380,160 L396,160"/><path class="wx-thin" d="M380,160 L380,176"/><path class="wx-thin" d="M380,160 L364,160"/></g><g class="wx-pop" style="--d:9"><circle class="wx-paper wx-edge" cx="361" cy="334" r="22"/><path class="wx-thin" d="M361,334 L361,312"/><path class="wx-thin" d="M361,334 L380.1,345"/><path class="wx-thin" d="M361,334 L341.9,345"/></g><path class="wx-bold" d="M361,160 L283.9,132"/><circle class="wx-accfill wx-edge" cx="295.2" cy="136.1" r="3.4"/><path class="wx-bold" d="M361,334 L420.8,283.9"/><circle class="wx-accfill wx-edge" cx="411.6" cy="291.6" r="3.4"/><g class="wx-pop" style="--d:7"><path class="wx-thin" d="M478,66 L441.8,130.6"/><circle class="wx-inkfill" cx="441.8" cy="130.6" r="2"/><text class="wx-t-b" x="482" y="70">Metonic spiral</text><text class="wx-t-m" x="482" y="86">235 months in 5 turns</text><text class="wx-t-m" x="482" y="102">= 19 years</text></g><g class="wx-pop" style="--d:8"><path class="wx-thin" d="M478,136 L336,150"/><circle class="wx-inkfill" cx="336" cy="150" r="2"/><text class="wx-t-b" x="482" y="140">Games dial: 4 years</text><text class="wx-t-m" x="482" y="156">Olympia, Isthmia, Nemea,</text><text class="wx-t-m" x="482" y="172">Pythia, Naa, Halieia</text></g><g class="wx-pop" style="--d:9"><path class="wx-thin" d="M478,202 L388,166"/><circle class="wx-inkfill" cx="388" cy="166" r="2"/><text class="wx-t-b" x="482" y="206">Callippic dial</text><text class="wx-t-m" x="482" y="222">76 years (4 × 19)</text></g><g class="wx-pop" style="--d:10"><path class="wx-thin" d="M478,314 L430.3,294"/><circle class="wx-inkfill" cx="430.3" cy="294" r="2"/><text class="wx-t-b" x="482" y="318">Saros spiral</text><text class="wx-t-m" x="482" y="334">223 months in 4 turns</text><text class="wx-t-m" x="482" y="350">= 18 years 11 days;</text><text class="wx-t-m" x="482" y="366">eclipse glyphs in 51 cells</text></g><g class="wx-pop" style="--d:11"><path class="wx-thin" d="M478,408 L371,342"/><circle class="wx-inkfill" cx="371" cy="342" r="2"/><text class="wx-t-b" x="482" y="412">Exeligmos dial</text><text class="wx-t-m" x="482" y="428">3 Saros = 54 years</text><text class="wx-t-m" x="482" y="444">(whole days)</text></g><g class="wx-pop" style="--d:11"><text class="wx-t-b" x="24" y="464.0">Front face</text><text class="wx-t-m" x="24" y="481.0">zodiac ring, and a calendar ring of 365 days; the ring of</text><text class="wx-t-m" x="24" y="497.0">holes beneath it most likely held 354 (2020–2024 studies)</text><text class="wx-t-m" x="24" y="513.0">Sun and Moon pointers (spinning here), Moon phase ball</text><text class="wx-t-m" x="24" y="529.0">planet rings: 2021 reconstruction (dashed)</text><text class="wx-t-m" x="24" y="545.0">main wheel b1, c. 13 cm across, turns just behind</text><text class="wx-t-m" x="24" y="561.0">plates above and below: instructions, star calendar</text></g><g><rect class="wx-inkfill" x="482" y="500" width="55" height="5"/><rect class="wx-paper wx-edge" x="537" y="500" width="55" height="5"/><text class="wx-t-s" x="482" y="518" text-anchor="middle">0</text><text class="wx-t-s" x="592" y="518" text-anchor="middle">10 cm</text><text class="wx-t-m" x="482" y="542">Case c. 34 × 18 × 9 cm</text><text class="wx-t-m" x="482" y="558">(reconstruction)</text></g><text class="wx-t-s" x="482" y="592">After Freeth et al. 2006, 2008, 2021.</text><text class="wx-t-s" x="482" y="606">Glyph dots schematic.</text></svg></div></div><figcaption>The front showed the zodiac, a calendar and (in the 2021 reconstruction) planet rings; the back carried the Metonic and Saros spirals with smaller dials inside. The Sun and Moon pointers and the main wheel spin here to show the idea. <span class="wx-src">Based on: Freeth et al. 2006, 2008 and 2021; case size from published reconstructions. Eclipse glyph positions and planet rings schematic.</span></figcaption><p class="vh">Two tall rectangles show the front and back faces of the case, about 34 by 18 centimetres, with a 10 centimetre scale bar. The front has inscribed plates above and below a round dial with a calendar ring, a zodiac ring and dashed planet rings, plus a Sun pointer and a Moon pointer with a half-dark ball; the main wheel is shown faintly behind. The back has an upper spiral of five turns divided into 235 cells with two small subsidiary dials inside, labelled Games and Callippic, and a lower spiral of four turns divided into 223 cells with dots for eclipse glyphs and an Exeligmos dial in the centre.</p></figure><ul class="wlist"><li>Upper dial, Metonic: 235 lunar months in a five-turn spiral, equal to 19 years. It let the user keep a lunar calendar in step with the solar year. The month names on it are Corinthian, a clue to where the owner lived or the maker learned his trade.</li><li>Inside it, the Games dial: a four-sector dial naming the Panhellenic games, including Olympia, Isthmia, Nemea and Pythia, plus smaller festivals such as the Naa and the Halieia (Freeth et al. 2008).</li><li>Also inside the Metonic dial, a Callippic dial for the 76-year cycle, four Metonic cycles with one day removed.</li><li>Lower dial, Saros: 223 lunar months in a four-turn spiral, about 18 years and 11 days. Glyphs in 51 of the cells predict 38 lunar and 27 solar eclipses, some with the hour and, in later readings of the inscriptions, even the expected colour.</li><li>Inside it, the Exeligmos dial: three Saros cycles, 54 years and about a month, which brings eclipses back at nearly the same time of day.</li></ul><p>The eclipse predictions are Babylonian in origin, based on long records of past eclipses, but written in Greek and cut into bronze. The Mechanism is a meeting of two traditions: Babylonian arithmetic cycles and Greek geometric models, packed into a portable box.</p><p>How would someone use it? Turn the crank until the front pointers show today&#x27;s date. Then look at the back: the Metonic pointer shows which month of the 19-year cycle you are in, and the Games dial tells you which festival falls this year. Keep turning, and when the Saros pointer reaches a cell with a glyph, the inscription tells you to expect an eclipse that month, whether of Sun or Moon, and at about what hour. It was a calendar, an almanac and an eclipse forecaster in one.</p></section><section class="wsec" id="antikythera-mechanism-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>A cosmos on the front</h3><p>The front dial is the most damaged part and the most debated. The inscriptions clearly mention the planets, and one fragment includes a list of synodic events for Venus and Mercury. But no planetary gears survive. In 2021 Freeth and colleagues at University College London published a full reconstruction, the Model of the Cosmos. They propose concentric rings on the front, displaying the Moon, the lunar nodes, Mercury, Venus, the Sun, Mars, Jupiter and Saturn, with little index letters marking events such as stationary points and greatest elongations.</p><p>To drive the planets they needed accurate period relations that could be built from reasonably sized gears. The inscriptions contain the numbers 462 and 442, which the team identifies as periods for Venus and Saturn: 289 synodic cycles in 462 years for Venus and 427 in 442 years for Saturn, relations they argue could have been derived with ancient Greek methods. Their model has 69 gears in all, 34 of them in the lost planetary system in front of b1. It fits inside the case and accounts for surviving clues, such as features on the spokes of b1 and an unexplained gear in one fragment.</p><aside class="wcall"><b>How do we know?</b><p>Much of the front is reconstruction, and the drawing marks it that way with dashed rings. The inscriptions tell us what was displayed; the surviving holes and bearings constrain where gears could sit; and the period relations must match ancient astronomy. Within those limits there could be more than one solution, so the 2021 model is a strong, carefully argued proposal rather than a recovered original.</p></aside></section><section class="wsec" id="antikythera-mechanism-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>Fresh from the field: counting holes</h3><p>Beneath the movable calendar ring on the front lies a ring of small holes, into which pins held the ring in place. Only part of it survives. How many holes were there? The calendar ring is marked with Egyptian month names and 365 days, so many assumed 365 holes. In 2020 a team led by Chris Budiselic measured the surviving holes on CT scans and argued statistically for about 354, the length of a lunar year.</p><p>In 2024 the Glasgow physicists Graham Woan and Joseph Bayley reanalysed the data with methods borrowed from gravitational-wave astronomy. Their best estimate is about 355, or 354 if holes near fractures are excluded; 360 is strongly disfavoured and 365 is implausible under their model. They also found the holes were placed with remarkable care: the radial scatter of their positions is only about 0.028 mm around a circle about 77 mm in radius. If the result holds, the Mechanism tracked a lunar calendar as well as the Egyptian solar one.</p><p>Other recent work adds healthy caution. A 2025 preprint by Esteban Szigety and Gustavo Arenas simulated the effect of the irregular, hand-cut triangular teeth and suggested that, as found, the gear train would have tended to jam or produce errors. That does not mean the device failed; it means the surviving, distorted fragments may not show the original precision, and that the maker was working at the edge of what hand tools allowed. A peer-reviewed response will be worth watching.</p></section><section class="wsec" id="antikythera-mechanism-s8"><h3 class="wsec-h"><span class="wsec-n">08</span>Out of place? Not really</h3><p>Because nothing comparable survives from antiquity, the Mechanism is a favourite of the ancient-mystery shelf. The argument goes like this: gearing of this complexity did not appear again for more than a thousand years, so it must come from outside history. Let us test that.</p><p>First, written sources describe such devices. Cicero, writing in the 1st century BCE, tells in On the Republic (1.21–22) how the general Marcellus brought home from captured Syracuse a bronze sphere made by Archimedes that showed the motions of the Sun, Moon and planets, and even eclipses. In On the Nature of the Gods (2.88) he mentions a similar sphere made by his teacher Posidonius on Rhodes. Second, the Mechanism is written in Greek, uses Greek astronomical terms, follows Hipparchos&#x27;s lunar theory and uses Babylonian cycles known from cuneiform tablets. Third, its manufacture shows the marks of hand work: slightly irregular teeth, repairs and adjustments.</p><p>Why don&#x27;t more survive? Because bronze was valuable and routinely melted down for reuse. The Mechanism escaped only because it sank. Its uniqueness is a fact about survival, not about origin.</p><p>The tradition did not vanish entirely either. A small geared sundial-calendar from the Byzantine world, about 1,500 years old and now in the Science Museum in London, shows that the idea of driving astronomical displays with gears survived in simpler forms. Medieval scholars in the Persian and Arabic-speaking world described geared calendars, and European astronomical clocks took the idea to new heights from the 14th century. The Antikythera Mechanism is the earliest and most complex known survivor of a long line, not an isolated miracle.</p></section><section class="wsec" id="antikythera-mechanism-s9"><h3 class="wsec-h"><span class="wsec-n">09</span>Who made it, and when?</h3><p>The Corinthian month names point to a place that used a Corinthian-style calendar, such as Corinth&#x27;s colonies in northwest Greece or Syracuse in Sicily, the city of Archimedes. The Games dial includes the Naa, held at Dodona in Epirus, which supports a northwestern Greek connection for the user. Others have linked the astronomy to Rhodes, where Hipparchos worked and Posidonius later built his sphere. These ideas are not mutually exclusive: a device could be designed in one tradition and made or set for use in another.</p><p>The date is also debated. Letter forms and the ship&#x27;s cargo suggest the 2nd or early 1st century BCE. In 2014 Christián Carman and James Evans argued from the eclipse predictor that its cycle begins in 205 BCE. A 2022 study by Aristeidis Voulgaris and colleagues proposed a starting date in 178 BCE. Neither date tells us when it was built, only the moment its calendar was set to start.</p></section><section class="wsec" id="antikythera-mechanism-s10"><h3 class="wsec-h"><span class="wsec-n">10</span>What we still don&#x27;t know</h3><p>We know what most of it did. We do not know who made it, or for whom: a rich collector, a teacher, a temple? We do not know exactly how the planetary display worked, because those gears are lost. We do not know how accurate it was in use, or how many similar devices existed. And divers returning to the wreck since 2014 have found more objects, so small pieces of the story may still be lying on the seabed.</p><p>There is also the question of accuracy. The Mechanism&#x27;s cycles are excellent over years, but its Babylonian-style models were not perfect, and any hand-made gear train accumulates small errors. A user would probably reset it from time to time against the sky or a calendar, much as we still adjust clocks. Future scans with even higher resolution may tell us more about wear on the teeth, which would show how much it was actually used.</p><p>What the Mechanism shows is simpler and more human: a Greek craftsman with files, saws and a head full of Babylonian and Greek astronomy built a pocket model of the sky, and it took twentieth- and twenty-first-century X-ray machines to read what he had written on it.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">150 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Made, probably 2nd century BCE (debated)</span></li><li class="wtl-loss" style="--i:1"><span class="wtl-y">65 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Ship sinks off Antikythera</span></li><li class="wtl-find" style="--i:2"><span class="wtl-y">1900 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Sponge divers find the wreck</span></li><li class="wtl-find" style="--i:3"><span class="wtl-y">1901 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Fragments raised with the statues</span></li><li class="wtl-find" style="--i:4"><span class="wtl-y">1902 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Valerios Stais spots a gearwheel</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1974 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Price, Gears from the Greeks</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2002 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Michael Wright&#x27;s working model</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2005 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">CT scans and surface imaging</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2006 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Freeth et al., Nature: the gearing decoded</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">2008 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Games dial and eclipse glyphs read</span></li><li class="wtl-study" style="--i:10"><span class="wtl-y">2021 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Model of the Cosmos (front display)</span></li><li class="wtl-study" style="--i:11"><span class="wtl-y">2024 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Hole count points to a lunar calendar</span></li></ol><figure class="wbars"><h4 class="wx-title">Cycles built into the gears</h4><div class="wb-r" style="--w:100.0%;--i:0"><div class="wb-l">Callippic cycle<small>4 Metonic cycles</small></div><div class="wb-t"><i></i><span>76 years</span></div></div><div class="wb-r" style="--w:71.2%;--i:1"><div class="wb-l">Exeligmos<small>3 Saros cycles</small></div><div class="wb-t"><i></i><span>54.1 years</span></div></div><div class="wb-r" style="--w:25.0%;--i:2"><div class="wb-l">Metonic cycle<small>235 lunar months</small></div><div class="wb-t"><i></i><span>19 years</span></div></div><div class="wb-r" style="--w:23.7%;--i:3"><div class="wb-l">Saros eclipse cycle<small>223 lunar months</small></div><div class="wb-t"><i></i><span>18.03 years</span></div></div><div class="wb-r" style="--w:11.7%;--i:4"><div class="wb-l">Lunar anomaly turntable (e3)<small>one turn</small></div><div class="wb-t"><i></i><span>8.88 years</span></div></div><div class="wb-r" style="--w:5.3%;--i:5"><div class="wb-l">Games (Olympiad) dial</div><div class="wb-t"><i></i><span>4 years</span></div></div><figcaption>Source: Freeth et al. 2006, 2008</figcaption></figure><h3 class="sub-h wsub">The big debates</h3><div class="debate"><p class="debate-q">Is the Mechanism out-of-place technology?</p><div class="sides"><div class="side"><b>Yes: too advanced for its time.</b><span>No comparable geared device survives from antiquity, and similar complexity reappears in European astronomical clocks only in the medieval period.</span></div><div class="side"><b>No: it belongs to a Greek tradition.</b><span>Cicero describes geared spheres by Archimedes and Posidonius; the inscriptions are Greek; the gearing follows Hipparchos&#x27;s lunar theory and Babylonian cycles; hand-work marks and errors are visible.</span></div></div><p class="debate-why"><b>The bold claim:</b> The Antikythera Mechanism could not have been made by ancient Greeks.</p><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Every part of the device is explained by known Greek and Babylonian astronomy and by hand tools of the period. Written sources describe similar instruments, and bronze recycling explains why so few survive. Its rarity is a survival accident, not evidence of an outside origin.</p></div><div class="debate"><p class="debate-q">Did the front show all five known planets?</p><div class="sides"><div class="side"><b>Yes: a full cosmos.</b><span>The inscriptions name the planets and list their synodic events; the 2021 model fits 34 planetary gears in front of b1 using ancient-style period relations (Freeth et al. 2021).</span></div><div class="side"><b>Unproven: the gears are lost.</b><span>No planetary gear survives; alternative layouts are possible, and the 2021 relations are reconstructed rather than read directly from surviving teeth.</span></div></div><p class="debate-why"><b>The bold claim:</b> The Mechanism displayed the positions of Mercury, Venus, Mars, Jupiter and Saturn.</p><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The inscriptions make a planetary display very likely, and the 2021 model shows that it could fit. But without surviving planetary gears, the exact design remains a reconstruction.</p></div><div class="debate"><p class="debate-q">Did the calendar ring count a 354-day lunar year?</p><div class="sides"><div class="side"><b>Yes: about 354 holes.</b><span>Two statistical analyses of hole positions on CT scans favour c. 354–355 holes; 360 is strongly disfavoured and 365 implausible (Budiselic et al. 2020; Woan &amp; Bayley 2024).</span></div><div class="side"><b>Not certain.</b><span>Only part of the ring survives, the fragments are distorted, and the visible calendar scale uses 365 Egyptian days.</span></div></div><p class="debate-why"><b>The bold claim:</b> The hidden ring of holes under the calendar ring had about 354 holes.</p><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Independent analyses using different statistical methods converge on about 354. The result depends on assumptions about how regularly the holes were spaced, but the precision of the surviving holes supports those assumptions.</p></div><details class="srcs"><summary>Sources for this deep dive (13)</summary><ol><li>Freeth, T. et al. (2006). Decoding the ancient Greek astronomical calculator known as the Antikythera Mechanism. Nature 444: 587–591. <a href="https://doi.org/10.1038/nature05357" target="_blank" rel="noopener">doi:10.1038/nature05357</a></li><li>Freeth, T., Jones, A., Steele, J. M. &amp; Bitsakis, Y. (2008). Calendars with Olympiad display and eclipse prediction on the Antikythera Mechanism. Nature 454: 614–617. <a href="https://doi.org/10.1038/nature07130" target="_blank" rel="noopener">doi:10.1038/nature07130</a></li><li>Freeth, T. et al. (2021). A model of the Cosmos in the ancient Greek Antikythera Mechanism. Scientific Reports 11: 5821. <a href="https://doi.org/10.1038/s41598-021-84310-w" target="_blank" rel="noopener">doi:10.1038/s41598-021-84310-w</a></li><li>Price, D. de S. (1974). Gears from the Greeks. The Antikythera Mechanism: a calendar computer from ca. 80 B.C. Transactions of the American Philosophical Society 64(7). <a href="https://doi.org/10.2307/1006146" target="_blank" rel="noopener">doi:10.2307/1006146</a></li><li>Wright, M. T. (2006). The Antikythera Mechanism and the early history of the moon-phase display. Antiquarian Horology 29(3): 319–329.</li><li>Jones, A. (2017). A Portable Cosmos: Revealing the Antikythera Mechanism, Scientific Wonder of the Ancient World. New York: Oxford University Press.</li><li>Carman, C. C. &amp; Evans, J. (2014). On the epoch of the Antikythera mechanism and its eclipse predictor. Archive for History of Exact Sciences 68: 693–774. <a href="https://doi.org/10.1007/s00407-014-0145-5" target="_blank" rel="noopener">doi:10.1007/s00407-014-0145-5</a></li><li>Budiselic, C. et al. (2020). Calendar ring hole-count analysis of the Antikythera Mechanism. Horological Journal, December 2020.</li><li>Woan, G. &amp; Bayley, J. (2024). An improved calendar ring hole-count for the Antikythera Mechanism: a fresh analysis. arXiv:2403.00040; Horological Journal 2024. <a href="https://doi.org/10.48550/arXiv.2403.00040" target="_blank" rel="noopener">doi:10.48550/arXiv.2403.00040</a></li><li>Szigety, E. G. &amp; Arenas, G. F. (2025). The impact of triangular-toothed gears on the functionality of the Antikythera Mechanism. arXiv:2504.00327 (preprint). <a href="https://doi.org/10.48550/arXiv.2504.00327" target="_blank" rel="noopener">doi:10.48550/arXiv.2504.00327</a></li><li>Voulgaris, A. et al. (2022). The initial calibration date of the Antikythera Mechanism after the Saros spiral mechanical apokatastasis. Almagest.</li><li>Cicero, De re publica 1.21–22 and De natura deorum 2.88 (descriptions of the spheres of Archimedes and Posidonius).</li><li>National Archaeological Museum, Athens. The Antikythera Mechanism, collection and exhibition information.</li></ol></details><aside class="rc-cite" data-v="marvels" data-id="marvel-antikythera-mechanism" data-t="The Antikythera Mechanism"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Antikythera Mechanism</i>. <span class="cite-u">https://residual-continuum.vercel.app/#marvels/marvel-antikythera-mechanism</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="marvel-seven-wonders-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Colossus of Rhodes.jpg" data-cap="The Colossus of Rhodes as imagined in the 16th century" data-big><figcaption></figcaption></figure><div class="sh-k">Mediterranean and Mesopotamia</div><h2 class="sh-t" id="marvel-seven-wonders-st" tabindex="-1">The Seven Wonders of the Ancient World</h2><p class="sh-s">A Greek tourist&#x27;s bucket list of seven sights: one still stands, five left ruins, and one may never have existed where it was said to be.</p><div class="sh-v"><span class="vstamp vstamp--mys">Mystery <span class="pips" role="img" aria-label="Mystery level 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span></span></div></div><div class="wquick"><h3 class="sub-h">The quick read</h3><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="7" >7</b><span class="ctr-u"> wonders</span></div><div class="ctr-l">on the canonical list</div><div class="ctr-c">Antipater of Sidon, Greek Anthology 9.58</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="1" >1</b><span class="ctr-u"> standing</span></div><div class="ctr-l">still standing today, the oldest of them</div><div class="ctr-c">Clayton and Price 1988</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="56" >56</b><span class="ctr-u"> years</span></div><div class="ctr-l">that the Colossus of Rhodes stood before an earthquake toppled it</div><div class="ctr-c">Pliny, Natural History 34.41</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="127" >127</b><span class="ctr-u"> columns</span></div><div class="ctr-l">in the rebuilt Temple of Artemis at Ephesus</div><div class="ctr-c">Pliny, Natural History 36.95</div></div><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="3300" >3,300</b><span class="ctr-u"> pieces</span></div><div class="ctr-l">architectural fragments catalogued underwater at Alexandria</div><div class="ctr-c">Empereur and CEAlex surveys since 1994</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="0" >0</b><span class="ctr-u"> texts</span></div><div class="ctr-l">known Babylonian texts that describe the Hanging Gardens</div><div class="ctr-c">Dalley 2013</div></div></div><div class="stats"><div><b>1 of 7 (the Great Pyramid)</b><span>Still standing</span></div><div><b>about 2,300 years apart (c. 2560 to c. 280 BCE)</b><span>Oldest to newest</span></div><div><b>Great Pyramid, c. 146.6 m; Pharos c. 100 m or more</b><span>Tallest</span></div><div><b>Colossus of Rhodes, stood 56 years (Pliny)</b><span>Shortest-lived</span></div><div><b>127 columns, each 60 Roman feet (c. 18 m), per Pliny</b><span>Temple of Artemis</span></div><div><b>none known</b><span>Babylonian texts describing the Gardens</span></div></div><p>The list itself was a Greek creation: a canon of theamata, &#x27;things to be seen&#x27;, not an official ranking, and its membership shifted before settling on the familiar seven. The wonders span 2,300 years and very different techniques: a mountain of cut limestone in Egypt, marble temples and tombs in western Anatolia, a gold and ivory statue at Olympia, a colossal bronze on Rhodes, and a stone tower with a fire at its summit at Alexandria. For the Hanging Gardens, Assyriologist Stephanie Dalley argues that the Greek accounts describe Sennacherib&#x27;s palace garden at Nineveh, watered by canals and aqueducts, rather than a garden at Babylon.</p><div class="flip" id="marvel-seven-wonders-flip"><div class="flip-in"><div class="flip-f"><b>The myth</b><p>The Colossus straddled the harbour of Rhodes, the Pharos had a mirror that burned enemy ships, and the Hanging Gardens were built by Nebuchadnezzar for a homesick queen.</p></div><div class="flip-b"><b>The reality</b><p>Six wonders are well attested by ruins, excavated fragments, coins or reliable descriptions. The straddling Colossus comes from medieval and Renaissance imagination, and the burning mirror from later legend. The Gardens are the true puzzle: no Babylonian text mentions them, and whether they stood at Babylon, at Nineveh, or mainly in Greek literature is still debated.</p></div></div><button type="button" class="flip-btn" aria-pressed="false" onclick="flip('marvel-seven-wonders-flip',this)">Flip it</button></div><div class="twist"><b>Wow</b><p>Divers in Alexandria&#x27;s Eastern Harbour have catalogued more than 3,300 architectural pieces since 1994, including granite blocks weighing 49 to 60 tonnes that probably fell from the Pharos.</p></div><div class="wmys"><span>Mystery meter</span><span class="pips" role="img" aria-label="Mystery level 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><small>Real open questions</small></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">10 min read · 2,165 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Seven Wonders of the Ancient World"><button type="button" class="wtoc-i" data-go="seven-wonders-s1">A bucket list, written in verse</button><button type="button" class="wtoc-i" data-go="seven-wonders-s2">Who chose the seven?</button><button type="button" class="wtoc-i" data-go="seven-wonders-s3">The survivor: the Great Pyramid</button><button type="button" class="wtoc-i" data-go="seven-wonders-s4">The garden nobody can find</button><button type="button" class="wtoc-i" data-go="seven-wonders-s5">Zeus at Olympia: a god too big for his house</button><button type="button" class="wtoc-i" data-go="seven-wonders-s6">Artemis at Ephesus: the wonder that burned</button><button type="button" class="wtoc-i" data-go="seven-wonders-s7">The tomb that named all tombs</button><button type="button" class="wtoc-i" data-go="seven-wonders-s8">The Colossus did not straddle anything</button><button type="button" class="wtoc-i" data-go="seven-wonders-s9">The Pharos: a lighthouse that named all lighthouses</button><button type="button" class="wtoc-i" data-go="seven-wonders-s10">What remains uncertain</button></nav></div><section class="wsec" id="seven-wonders-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A bucket list, written in verse</h3><p>Some time around or before 100 BCE, a poet from Sidon named Antipater wrote a short epigram that reads like a travel boast. He had seen the great sights of his world, he says, and then he saw one more that outshone them all. His poem is one of the earliest surviving lists of what we now call the Seven Wonders.</p><blockquote class="quote"><p>I have set eyes on the wall of lofty Babylon on which is a road for chariots, and the statue of Zeus by the Alpheus, and the hanging gardens, and the colossus of the Sun, and the huge labour of the high pyramids, and the vast tomb of Mausolus; but when I saw the house of Artemis that mounted to the clouds, those other marvels lost their brilliancy.</p><cite>Antipater of Sidon, Greek Anthology 9.58, trans. W. R. Paton (1917)</cite></blockquote><p>Notice two things. First, Antipater&#x27;s seven include the walls of Babylon, not the lighthouse of Alexandria; the list was not yet fixed. Second, he is not ranking engineering. He is describing theamata, &#x27;things to be seen&#x27;, the must-sees of a Greek-speaking traveller in the world opened up by Alexander&#x27;s conquests.</p><figure class="wx wx--static" id="seven-wonders-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">The seven at one scale</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The seven at one scale"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" class="wx-svg" role="img" aria-labelledby="seven-wonders-f1-t"><title id="seven-wonders-f1-t">The Seven Wonders of the Ancient World drawn side by side at one scale, with a 1.7 m person</title><defs><clipPath id="seven-wonders-f1-clip"><rect x="0" y="0" width="720" height="380"/></clipPath></defs><text x="16" y="24" class="wx-t-cap">All seven at one scale · dashed = reconstruction</text><line x1="0" y1="207.0" x2="720" y2="207.0" class="wx-guide"/><text x="292" y="203.0" class="wx-t-s">50 m</text><line x1="0" y1="132.0" x2="720" y2="132.0" class="wx-guide"/><text x="292" y="128.0" class="wx-t-s">100
