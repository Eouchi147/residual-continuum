02 247,207.4 243.2,202" class="wx-paper wx-edge-soft"/><polygon points="253.6,210 256.4,214 253.6,218 250.8,214" class="wx-paper wx-edge-soft"/><polygon points="260.8,225.4 264,230 260.8,234.6 257.6,230" class="wx-paper wx-edge-soft"/><polygon points="265,237.2 268.3,242 265,246.8 261.7,242" class="wx-paper wx-edge-soft"/><polygon points="269.2,248.6 273,254 269.2,259.4 265.4,254" class="wx-paper wx-edge-soft"/><polygon points="270.4,265.6 273.8,270.4 270.4,275.2 267,270.4" class="wx-paper wx-edge-soft"/><polygon points="268,278.7 271,283 268,287.3 265,283" class="wx-paper wx-edge-soft"/><polygon points="265.6,291.2 268.7,295.6 265.6,300 262.5,295.6" class="wx-paper wx-edge-soft"/><polygon points="268.4,309.4 271.1,313.2 268.4,317 265.7,313.2" class="wx-paper wx-edge-soft"/><polygon points="275,321.6 278.8,327 275,332.4 271.2,327" class="wx-paper wx-edge-soft"/><polygon points="281.6,335.3 285.4,340.8 281.6,346.3 277.8,340.8" class="wx-paper wx-edge-soft"/><polygon points="288,355.3 290.8,359.2 288,363.1 285.2,359.2" class="wx-paper wx-edge-soft"/><polygon points="291,369.4 293.5,373 291,376.6 288.5,373" class="wx-paper wx-edge-soft"/><polygon points="294,382.8 296.8,386.8 294,390.8 291.2,386.8" class="wx-paper wx-edge-soft"/></g><path d="M193,56 L207,100 L231,142 L243,182 L265,222 L279,262 L271,304 L293,350 L303,396" class="wx-st wx-hide wx-hl" data-only="5"/><line x1="118" y1="408" x2="118" y2="384" class="wx-thin"/><text x="60" y="424" class="wx-t-m">mortar: lime + volcanic ash</text><line x1="434.4" y1="111.6" x2="486" y2="70" class="wx-thin"/><line x1="304" y1="236" x2="486" y2="270" class="wx-thin"/><text x="494" y="74" class="wx-t-m">aggregate: tuff, brick</text><text x="494" y="274" class="wx-t-b">lime clast</text><text x="494" y="290" class="wx-t-s">mm to cm across</text><g class="wx-st wx-hide" data-only="1"><text x="494" y="116" class="wx-t-h">1 · A lime clast</text><text x="494" y="142" class="wx-t">A white lump of lime left by hot</text><text x="494" y="159" class="wx-t">mixing. It is porous and brittle:</text><text x="494" y="176" class="wx-t">a stored reservoir of calcium.</text></g><g class="wx-st wx-hide" data-only="2"><text x="494" y="116" class="wx-t-h">2 · A crack opens</text><text x="494" y="142" class="wx-t">The mortar cracks. The crack runs</text><text x="494" y="159" class="wx-t">through the weak clast, exposing</text><text x="494" y="176" class="wx-t">fresh, reactive lime.</text></g><g class="wx-st wx-hide" data-only="3"><text x="494" y="116" class="wx-t-h">3 · Water gets in</text><text x="494" y="142" class="wx-t">Rain, groundwater or seawater</text><text x="494" y="159" class="wx-t">seeps into the crack, as it would</text><text x="494" y="176" class="wx-t">into any concrete.</text></g><g class="wx-st wx-hide" data-only="4"><text x="494" y="116" class="wx-t-h">4 · Calcium dissolves</text><text x="494" y="142" class="wx-t">Water dissolves calcium from the</text><text x="494" y="159" class="wx-t">clast and carries a calcium-rich</text><text x="494" y="176" class="wx-t">solution along the crack.</text><text x="494" y="204" class="wx-t-n wx-t-a">Ca(OH)₂ → Ca²⁺ + 2 OH⁻</text></g><g class="wx-st wx-hide" data-only="5"><text x="494" y="116" class="wx-t-h">5 · The crack seals</text><text x="494" y="142" class="wx-t">Calcium recrystallises as calcium</text><text x="494" y="159" class="wx-t">carbonate (or reacts with the ash)</text><text x="494" y="176" class="wx-t">and plugs the gap.</text><text x="494" y="204" class="wx-t-n wx-t-a">Ca²⁺ + CO₃²⁻ → CaCO₃</text></g><text x="494" y="340" class="wx-t-s">Lab test (Seymour et al. 2023):</text><text x="494" y="354" class="wx-t-s">cracks c. 0.5 mm wide stopped</text><text x="494" y="368" class="wx-t-s">leaking within weeks; lime-free</text><text x="494" y="382" class="wx-t-s">controls kept leaking.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> A lime clast, left over from hot mixing, sits in the mortar: a porous, brittle lump of calcium-rich material.</p><ol class="wx-steplist"><li>A lime clast, left over from hot mixing, sits in the mortar: a porous, brittle lump of calcium-rich material.</li><li>A crack opens. Because the clast is weak, the crack tends to run through it, exposing fresh, reactive lime.</li><li>Water seeps into the crack, as it would into any concrete.</li><li>The water dissolves calcium from the clast and spreads a calcium-rich solution along the crack.</li><li>The calcium recrystallises as calcium carbonate (or reacts with the volcanic ash) and seals the crack. In lab tests, cracks about 0.5 mm wide stopped leaking within weeks.</li></ol><figcaption>Magnified schematic of hot-mixed Roman mortar: a brittle lime clast becomes the calcium source that reseals a crack. <span class="wx-src">Based on: Seymour et al. 2023 (Science Advances); Vaserman et al. 2025 (Nature Communications). Schematic, not to scale.</span></figcaption><p class="vh">A magnified block of grey-beige mortar studded with darker aggregate pieces and one large white lime clast. Step 1 highlights the clast. Step 2 adds a dark crack that runs from top to bottom through the clast. Step 3 fills the crack with blue water. Step 4 shows orange calcium ions spreading from the clast along the crack. Step 5 shows the crack filled with white calcium carbonate crystals and marked as sealed. A side panel gives the chemistry for each step.</p></figure><p>Here is the clever part. Because the clasts are weak and brittle, a crack running through the concrete tends to pass through them. Water that later enters the crack meets a fresh, high-surface-area reservoir of calcium, dissolves some of it, and carries a calcium-rich solution along the crack. That calcium can then recrystallise as calcium carbonate, or react with the volcanic ash, sealing the gap.</p><p>The team tested the idea with modern mixes. They made concrete with and without quicklime, cracked the samples, re-mated the halves with a gap of about 0.5 mm and ran water through them at 10 to 30 litres an hour. Over one to three weeks the flow through the lime-clast samples fell to practically zero; the controls kept leaking throughout the 30-day test. It is a laboratory result on modern analogues, not a measurement on an ancient wall, but it shows the mechanism works.</p></section><section class="wsec" id="roman-concrete-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>A building site frozen in 79 CE</h3><p>Stand in a half-finished house at Pompeii in the summer of 79 CE. Walls are being rebuilt, perhaps after earthquake damage. Blocks of yellow tuff brought from the Naples area are stacked up, broken roof tiles have been set aside for recycling, and amphorae have been reused to hold lime. Then Vesuvius erupts and everything stops.</p><p>That is roughly what archaeologists found at a house in Regio IX, insula 10, excavated in recent years. In a study published in Nature Communications in December 2025, E. Vaserman, James Weaver, Admir Masic and colleagues from MIT and the Pompeii Archaeological Park analysed the site&#x27;s materials. Among them were piles of dry, premixed lime and volcanic ash, with fragments of quicklime several millimetres across, ready to be wetted and used. The team also recovered tools such as bronze and iron plumb bobs and balance scales, and found the site organised into separate storage areas for tiles, tuff and premixed mortar.</p><aside class="wcall"><b>Fresh from the field</b><p>The Pompeii study (Vaserman et al. 2025) gives the first direct archaeological snapshot of hot mixing in progress: dry lime and ash blended in advance, with quicklime fragments that match the lime clasts seen in finished Roman walls. It also shows that what a Roman architect wrote and what a Roman crew did were not necessarily the same thing. Vitruvius describes slaked lime; this crew was, it seems, working with quicklime.</p></aside><p>One site cannot tell us how every Roman builder worked for six centuries. What it does is turn hot mixing from an inference, based on textures under a microscope, into something you can see sitting on a building site. It also underlines a theme of this whole story: the most useful evidence is often in the mess, not in the manuals.</p></section><section class="wsec" id="roman-concrete-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>Why your concrete cracks and theirs sometimes does not</h3><p>In 1824 an English bricklayer, Joseph Aspdin, patented Portland cement, named for its resemblance to Portland stone. It is made by firing limestone and clay at around 1,450 °C into clinker, then grinding it with gypsum. Mixed with sand, gravel and water it forms concrete that is strong, fast and cheap, and when steel bars are cast inside to handle tension, you can build bridges and towers the Romans could only dream of.</p><p>That same design creates the weak point. Steel rusts, and rust takes up more room than the steel it came from. Once water and salts reach the reinforcement, it expands, cracks the concrete from the inside and lets in more water. Jackson has put it bluntly: in the sea, much of our construction would be &#x27;a mass of corroding steel&#x27; long before two thousand years had passed. Roman concrete, with no steel inside, never faced that problem.</p><ul class="wlist"><li>Strength: modern structural concrete is generally much stronger in compression than Roman mortars. Rome built massive walls because it had to.</li><li>Durability: Roman mixes keep reacting with water; lime clasts can reseal cracks; there is no steel to corrode.</li><li>Carbon: Portland clinker needs around 1,450 °C against roughly 900 °C for Roman lime, and cement production is responsible for about 8% of global CO₂ emissions (Lehne and Preston, Chatham House, 2018).</li><li>Speed: Portland concrete sets and gains strength quickly and predictably, which modern construction schedules depend on.</li></ul><p>That is why engineers are interested. Nobody plans to build skyscrapers from tuff and lime, but Roman-inspired additives, such as volcanic ash replacing part of the Portland cement, or lime clasts added to encourage self-healing, could make some modern concretes last longer and emit less carbon. Several research groups are now testing such blends, including for structures that must survive in seawater.</p></section><section class="wsec" id="roman-concrete-s8"><h3 class="wsec-h"><span class="wsec-n">08</span>Busting the super-concrete myth</h3><p>Every few years a headline announces that scientists have &#x27;finally cracked&#x27; the secret of Roman concrete, as if it were a lost formula locked in a vault. The reality is less mysterious and more interesting. The recipe was never lost: Vitruvius wrote it down, and ROMACONS mixed and cast it in the sea in 2004. What researchers have been uncovering is why particular mixes behave the way they do, and how Roman practice varied.</p><p>There is also a survivor&#x27;s bias. We see the Roman concrete that lasted: the Pantheon, harbour piers, aqueduct cores. We do not see the countless Roman structures that cracked, slumped or were quarried away. Some Roman builders cut corners, some local ashes were poor pozzolans, and plenty of Roman buildings needed repairs within decades. The surviving examples are a filtered sample of the best-built and best-placed.</p><p>Open questions remain. How common was hot mixing across the empire, and did recipes differ between regions, periods and building types? How much of the durability of harbour concrete comes from the ash, how much from the lime, how much from the placement method? And can the slow, centuries-long reactions that help Roman concrete be sped up enough to be useful to engineers who cannot wait two thousand years for results?</p><blockquote class="wpull"><p>The recipe was never lost. What we are learning is why the best Roman mixes still work.</p></blockquote><p>What is not in doubt is the core lesson. The Romans built with materials that kept reacting with their surroundings, and they sometimes left in &#x27;flaws&#x27; that turned out to be features. For a civilisation that produced some of history&#x27;s great engineers, it is fitting that their humblest ingredient, a pinch of white lime in a grey mortar, is still teaching us something.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">150 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Lime and volcanic-ash mortars spread in Campania and Rome</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">50 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Formwork timber in a harbour pila at Baia dates to c. 50 BCE</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">25 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Vitruvius writes De architectura, with the 2 : 1 marine recipe</span></li><li class="wtl-build" style="--i:3"><span class="wtl-y">22 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Herod&#x27;s harbour at Caesarea built with imported Italian ash</span></li><li class="wtl-loss" style="--i:4"><span class="wtl-y">79 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Vesuvius buries a Pompeii building site mid-job; Pliny praises &#x27;the dust of Puteoli&#x27;</span></li><li class="wtl-build" style="--i:5"><span class="wtl-y">125 CE</span><span class="wtl-k">Built</span><span class="wtl-t">The Pantheon&#x27;s concrete dome completed</span></li><li class="wtl-event" style="--i:6"><span class="wtl-y">1824 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Joseph Aspdin patents Portland cement</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2002 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">ROMACONS begins coring Roman harbours (to 2009)</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2017 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Seawater-grown tobermorite and phillipsite described in marine concrete</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">2023 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Hot mixing and self-healing lime clasts tested</span></li><li class="wtl-find" style="--i:10"><span class="wtl-y">2025 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Unfinished Pompeii site shows dry premixed lime and ash</span></li></ol><figure class="wbars"><h4 class="wx-title">Longest sides of some Roman harbour concrete blocks</h4><div class="wb-r" style="--w:100.0%;--i:0"><div class="wb-l">Nisida pila, Bay of Naples</div><div class="wb-t"><i></i><span>15.2 m</span></div></div><div class="wb-r" style="--w:98.7%;--i:1"><div class="wb-l">Caesarea, North Breakwater block<small>c. 15 × 11.5 × 2 m</small></div><div class="wb-t"><i></i><span>15 m</span></div></div><div class="wb-r" style="--w:73.0%;--i:2"><div class="wb-l">Portus Iulius, outer pila</div><div class="wb-t"><i></i><span>11.1 m</span></div></div><div class="wb-r" style="--w:68.4%;--i:3"><div class="wb-l">Secca Fumosa pila</div><div class="wb-t"><i></i><span>10.4 m</span></div></div><div class="wb-r" style="--w:59.2%;--i:4"><div class="wb-l">Average of c. 50 measured pilae<small>average c. 9 × 7 m</small></div><div class="wb-t"><i></i><span>9 m</span></div></div><div class="wb-r" style="--w:13.2%;--i:5"><div class="wb-l">ROMACONS test pila, Brindisi 2004<small>modern reconstruction</small></div><div class="wb-t"><i></i><span>2 m</span></div></div><figcaption>Source: Oleson et al., ROMACONS field reports (Baia 2006; Caesarea 2005); ROMACONS experimental pila 2004; Ports Antiques survey of pilae</figcaption></figure><h3 class="sub-h wsub">The big debates</h3><div class="debate"><p class="debate-q">Is Roman concrete simply better than modern concrete?</p><div class="sides"><div class="side"><b>Yes: it lasts far longer.</b><span>Harbour structures have survived about 2,000 years in seawater, where modern reinforced concrete can degrade within decades.</span></div><div class="side"><b>No: it is a different material with different strengths.</b><span>Roman mortars are weaker in compression and slower to gain strength; their durability comes from reactive ash, lime clasts and the absence of corroding steel, plus survivor bias.</span></div></div><p class="debate-why"><b>The bold claim:</b> Roman concrete is stronger than modern concrete.</p><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">In raw strength, modern structural concrete generally wins by a wide margin. What the best Roman concretes have is longevity in particular settings, especially the sea, thanks to chemistry that keeps working and the lack of steel reinforcement. &#x27;Better&#x27; depends on the job; &#x27;stronger&#x27; is simply not what the evidence shows.</p></div><div class="debate"><p class="debate-q">Did Roman builders routinely hot-mix with quicklime?</p><div class="sides"><div class="side"><b>Yes: the clasts and the Pompeii site point that way.</b><span>Lime clast textures at Privernum indicate high-temperature reactions, and the Pompeii building site had dry premixed lime and ash with quicklime fragments.</span></div><div class="side"><b>Not yet shown to be universal.</b><span>Vitruvius and Pliny describe slaked lime, and the direct evidence comes from a small number of sites and periods.</span></div></div><p class="debate-why"><b>The bold claim:</b> Hot mixing with quicklime was a common Roman technique, not a one-off.</p><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Two independent lines of evidence, microscopic textures and an actual building site, fit hot mixing, and lime clasts are common in Roman mortars. But sampling is still limited, and Roman practice varied across a huge empire and six centuries. The claim is well supported for some sites; its generality is still being tested.</p></div><div class="debate"><p class="debate-q">Is Roman concrete a lost secret?</p><div class="sides"><div class="side"><b>Yes: modern science cannot reproduce it.</b><span>Popular articles regularly describe the recipe as lost or mysterious.</span></div><div class="side"><b>No: the recipe survives and has been reproduced.</b><span>Vitruvius records the mix; ROMACONS cast a Vitruvian pila at sea in 2004; labs have made hot-mixed, self-healing analogues.</span></div></div><p class="debate-why"><b>The bold claim:</b> The Roman recipe is a lost secret that modern science cannot reproduce.</p><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The ingredients and proportions are documented in ancient texts and have been replicated. What is new is an understanding of the mechanisms, such as seawater-grown minerals and self-healing lime clasts. That is ordinary science filling in details, not the recovery of a lost formula.</p></div><details class="srcs"><summary>Sources for this deep dive (12)</summary><ol><li>Seymour, L. M., Maragh, J., Sabatini, P., Di Tommaso, M., Weaver, J. C. &amp; Masic, A. (2023). Hot mixing: Mechanistic insights into the durability of ancient Roman concrete. Science Advances 9(1): eadd1602. <a href="https://doi.org/10.1126/sciadv.add1602" target="_blank" rel="noopener">doi:10.1126/sciadv.add1602</a></li><li>Vaserman, E., Weaver, J. C., Hayhow, C., Bergmann, K., Grifa, C., Scalesse, R., Amoretti, V., Russo, A., Iovino, G., Zuchtriegel, G. &amp; Masic, A. (2025). An unfinished Pompeian construction site reveals ancient Roman building technology. Nature Communications 16: 10847. <a href="https://doi.org/10.1038/s41467-025-66634-7" target="_blank" rel="noopener">doi:10.1038/s41467-025-66634-7</a></li><li>Jackson, M. D. et al. (2017). Phillipsite and Al-tobermorite mineral cements produced through low-temperature water-rock reactions in Roman marine concrete. American Mineralogist 102(7): 1435-1450. <a href="https://doi.org/10.2138/am-2017-5993CCBY" target="_blank" rel="noopener">doi:10.2138/am-2017-5993CCBY</a></li><li>Jackson, M. D. et al. (2013). Unlocking the secrets of Al-tobermorite in Roman seawater concrete. American Mineralogist 98(10): 1669-1687. <a href="https://doi.org/10.2138/am.2013.4484" target="_blank" rel="noopener">doi:10.2138/am.2013.4484</a></li><li>Jackson, M. D., Oleson, J. P., Moon, J., Zhang, Y., Chen, H. &amp; Gudmundsson, M. T. (2018). Extreme durability in ancient Roman concretes. American Ceramic Society Bulletin 97(5): 22-28.</li><li>Brandon, C. J., Hohlfelder, R. L., Jackson, M. D. &amp; Oleson, J. P. (2014). Building for Eternity: The History and Technology of Roman Concrete Engineering in the Sea. Oxford: Oxbow Books.</li><li>Oleson, J. P., Brandon, C., Cramer, S. M., Cucitore, R., Gotti, E. &amp; Hohlfelder, R. L. (2004). The ROMACONS Project: a contribution to the historical and engineering analysis of hydraulic concrete in Roman maritime structures. International Journal of Nautical Archaeology 33(2): 199-229.</li><li>ROMACONS field reports: Caesarea 2005; Baia and Portus Iulius 2006; experimental pila, Brindisi 2004. University of Victoria (J. P. Oleson).</li><li>Vitruvius. The Ten Books on Architecture, trans. M. H. Morgan. Cambridge, MA: Harvard University Press, 1914 (2.6.1; 5.12.2-3).</li><li>Pliny the Elder. Natural History, Book 35, trans. H. Rackham. Loeb Classical Library, 1952 (35.166).</li><li>Lehne, J. &amp; Preston, F. (2018). Making Concrete Change: Innovation in Low-carbon Cement and Concrete. London: Chatham House.</li><li>Lancaster, L. C. (2005). Concrete Vaulted Construction in Imperial Rome: Innovations in Context. Cambridge University Press.</li></ol></details><aside class="rc-cite" data-v="marvels" data-id="marvel-roman-concrete" data-t="Roman concrete"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Roman concrete</i>. <span class="cite-u">https://residual-continuum.vercel.app/#marvels/marvel-roman-concrete</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="marvel-pantheon-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Oculus photographed in fisheye by Victor Grigas, Pantheon, Rome.tif" data-cap="The Pantheon&#x27;s oculus" data-big><figcaption></figcaption></figure><div class="sh-k">Rome, Italy</div><h2 class="sh-t" id="marvel-pantheon-st" tabindex="-1">The Pantheon dome</h2><p class="sh-s">A 43.3 m concrete dome with a hole in the top, standing unreinforced for nineteen centuries: Rome&#x27;s boldest engineering bet still pays out.</p><div class="sh-v"><span class="vstamp vstamp--mys">Mystery <span class="pips" role="img" aria-label="Mystery level 1 of 5"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></span></span></div></div><div class="wquick"><h3 class="sub-h">The quick read</h3><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="43.3" data-dec="1">43.3</b><span class="ctr-u"> m</span></div><div class="ctr-l">dome diameter, equal to its height above the floor</div><div class="ctr-c">Wilson Jones 2003</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="140" >140</b><span class="ctr-u"> coffers</span></div><div class="ctr-l">in 5 rings of 28</div><div class="ctr-c">MacDonald 1976</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="4535" >4,535</b><span class="ctr-u"> t</span></div><div class="ctr-l">estimated mass of the dome</div><div class="ctr-c">Mark &amp; Hutchinson 1986</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="1.2" data-dec="1">1.2</b><span class="ctr-u"> m</span></div><div class="ctr-l">shell thickness at the oculus, from c. 6.4 m at the base</div><div class="ctr-c">Mark &amp; Hutchinson 1986</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="60" >60</b><span class="ctr-u"> t</span></div><div class="ctr-l">each Egyptian granite column in the portico</div><div class="ctr-c">Wilson Jones 2003</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="1900" >1,900</b><span class="ctr-u"> years</span></div><div class="ctr-l">as the world&#x27;s largest unreinforced concrete dome</div><div class="ctr-c">Marder &amp; Wilson Jones 2015</div></div></div><div class="stats"><div><b>43.3 m (usually equated with 150 Roman feet)</b><span>Dome diameter</span></div><div><b>43.3 m: a perfect sphere fits inside</b><span>Floor to top of dome</span></div><div><b>c. 8.3–8.9 m across, open to the sky</b><span>Oculus</span></div><div><b>c. 6.4 m at the base to c. 1.2 m at the oculus</b><span>Dome thickness</span></div><div><b>c. 4,535 tonnes (Mark &amp; Hutchinson 1986)</b><span>Dome mass</span></div><div><b>140, in 5 rings of 28</b><span>Coffers</span></div><div><b>16 granite shafts, c. 11.9 m tall, c. 60 t each</b><span>Portico columns</span></div><div><b>c. 7.5 m high, 4.45 m wide</b><span>Bronze doors</span></div></div><p>A ring foundation carries a cylindrical drum about 6 m thick, hollowed by niches and threaded with brick relieving arches that channel loads into eight solid piers. On top, the dome was laid in horizontal courses of unreinforced concrete over a huge timber centering. The builders graded the aggregate by height: dense travertine low down, then tuff and brick, and finally light tuff and volcanic scoria or pumice near the top, so the concrete gets lighter as it rises. The shell thins from about 6 m at its base to about 1.2 m at the oculus, whose rim of upright tiles acts as a compression ring. Stepped rings outside add weight to the haunches, and 140 sunken coffers inside remove it where it is least useful.</p><div class="flip" id="marvel-pantheon-flip"><div class="flip-in"><div class="flip-f"><b>The myth</b><p>The Pantheon stands because of a secret Roman super-concrete that modern engineers cannot explain.</p></div><div class="flip-b"><b>The reality</b><p>Its survival is well understood: a thick drum, graded lightweight concrete, a thinning shell, stepped rings and a compression ring at the oculus keep the forces in compression. The dome cracked early along its meridians and now works partly like a ring of arches. Continuous use and maintenance helped too. What remains uncertain are the details of its formwork, its construction sequence and who designed it.</p></div></div><button type="button" class="flip-btn" aria-pressed="false" onclick="flip('marvel-pantheon-flip',this)">Flip it</button></div><div class="twist"><b>Wow</b><p>Its 43.3 m dome has been the largest unreinforced concrete dome in the world for about 1,900 years, and it has a hole almost 9 m wide in the top.</p></div><div class="wmys"><span>Mystery meter</span><span class="pips" role="img" aria-label="Mystery level 1 of 5"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></span><small>Mostly solved</small></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">10 min read · 2,276 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Pantheon dome"><button type="button" class="wtoc-i" data-go="pantheon-s1">A hole in the sky</button><button type="button" class="wtoc-i" data-go="pantheon-s2">Agrippa&#x27;s name, Hadrian&#x27;s building</button><button type="button" class="wtoc-i" data-go="pantheon-s3">A sphere in a cylinder</button><button type="button" class="wtoc-i" data-go="pantheon-s4">Heavy at the bottom, light at the top</button><button type="button" class="wtoc-i" data-go="pantheon-s5">Cracks, rings and a keystone made of air</button><button type="button" class="wtoc-i" data-go="pantheon-s6">Building the impossible centering</button><button type="button" class="wtoc-i" data-go="pantheon-s7">Temple, church, tomb, time machine</button><button type="button" class="wtoc-i" data-go="pantheon-s8">What we still do not know</button></nav></div><section class="wsec" id="pantheon-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A hole in the sky</h3><p>Walk out of the bright, noisy Piazza della Rotonda, between granite columns as thick as tree trunks, through bronze doors taller than a two-storey house, and the city goes quiet. You are standing inside a sphere. The floor is a disc 43.3 m across; the dome above rises so that its top is exactly 43.3 m over your head. If you could inflate a giant ball in here, it would just touch the floor and kiss the roof.</p><p>At the very top there is no roof at all. The oculus, a round opening about 8.3 to 8.9 m across depending on who measures it, is the building&#x27;s only window. On a sunny day a disc of light, sharp-edged as a spotlight, crawls slowly across the coffers and down the walls. On a rainy day the rain falls straight in, and drains away through small holes in a floor that slopes gently to shed water.</p><blockquote class="wpull"><p>Nineteen centuries on, no one has built a larger unreinforced concrete dome.</p></blockquote><p>This is the Pantheon, rebuilt in the early 2nd century CE and in continuous use ever since, first as a temple and, from 609, as a church. It is probably the best-preserved major building of ancient Rome. How a structure this bold, made of concrete with no steel inside, has survived earthquakes, lightning, looting and nearly two thousand winters is a story of clever geometry, careful material choices and a couple of lucky breaks.</p></section><section class="wsec" id="pantheon-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Agrippa&#x27;s name, Hadrian&#x27;s building</h3><p>Look up at the porch and the inscription seems to settle the question of authorship: M·AGRIPPA·L·F·COS·TERTIVM·FECIT, &#x27;Marcus Agrippa, son of Lucius, consul for the third time, made this&#x27;. Agrippa, Augustus&#x27; right-hand man, did build a Pantheon here around 27 to 25 BCE. But that building burned in 80 CE, was restored under Domitian, and burned again after a lightning strike in 110. What stands today is a complete rebuild.</p><p>For a long time it was credited to Hadrian, who became emperor in 117. Then archaeologists looked at the bricks. Roman brickyards often stamped their products with the names of owners, managers or consuls, which makes them datable. Lise Hetland&#x27;s 2007 study and Mark Wilson Jones&#x27; later work showed that nearly all the stamps in the building are late Trajanic or early Hadrianic, pointing to construction starting around 114 CE, under Trajan, and finishing under Hadrian, with dedication around 125 to 128.</p><blockquote class="quote"><p>At Rome he restored the Pantheon, the Voting-enclosure, the Basilica of Neptune, very many temples, the Forum of Augustus, the Baths of Agrippa, and dedicated all of them in the names of their original builders.</p><cite>Historia Augusta, Life of Hadrian 19.10, trans. D. Magie (Loeb, 1921)</cite></blockquote><p>So the inscription is a courtesy, not a lie: Hadrian, according to his ancient biographer, liked to put the original builders&#x27; names on the monuments he restored. It is also a neat reminder to read ancient labels with care. Who actually designed the new Pantheon is unknown. Hadrian was a keen amateur architect; Trajan&#x27;s great engineer Apollodorus of Damascus has been suggested; the brick stamps make a Trajanic start likely, but no document names the architect.</p></section><section class="wsec" id="pantheon-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>A sphere in a cylinder</h3><p>The plan is disarmingly simple: a rectangular porch, a transitional block, and a round hall, the rotunda. The rotunda is a drum whose interior height to the springing of the dome equals the dome&#x27;s radius, 21.65 m, so the hemisphere on top completes a perfect sphere. The drum wall is about 6.4 m thick, but it is not solid. It is carved into seven great niches plus the entrance bay, and threaded with hidden chambers and brick arches.</p><figure class="wx wx--static" id="pantheon-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Section through the rotunda</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Section through the rotunda"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 590" class="wx-svg" role="img" aria-labelledby="pantheon-f1-t"><title id="pantheon-f1-t">Section through the Pantheon rotunda showing the inscribed sphere and graded concrete</title><defs><marker id="pantheon-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" class="wx-inkfill"/></marker><marker id="pantheon-f1-aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" class="wx-accfill"/></marker><marker id="pantheon-f1-am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" class="wx-c2"/></marker><clipPath id="pantheon-f1-clip"><path d="M503.2,500 L554.4,500 L5 8,326.8 L501.2,326.8" class="wx-dim" marker-start="url(#pantheon-f1-ah)" marker-end="url(#pantheon-f1-ah)"/><text x="260" y="319.8" class="wx-t-n wx-halo" text-anchor="middle">43.3 m</text><path d="M330,498 L330,155.6" class="wx-dim" marker-start="url(#pantheon-f1-ah)" marker-end="url(#pantheon-f1-ah)"/><text x="338" y="440" class="wx-t-n wx-halo">43.3 m</text><text x="338" y="455" class="wx-t-s wx-halo">floor to oculus</text><path d="M294.8,135.6 L365.2,135.6" class="wx-dim" marker-start="url(#pantheon-f1-ah)" marker-end="url(#pantheon-f1-ah)"/><text x="330" y="113.6" class="wx-t-b" text-anchor="middle">oculus c. 8.3–8.9 m</text><text x="330" y="127.6" class="wx-t-s" text-anchor="middle">open to the sky</text><line x1="290" y1="152.4" x2="200" y2="112" class="wx-thin"/><text x="196" y="108" class="wx-t-m" text-anchor="end">c. 1.2 m thick at the rim</text><path d="M106.6,436 L155.8,436" class="wx-dim" marker-start="url(#pantheon-f1-ah)" marker-end="url(#pantheon-f1-ah)"/><text x="20" y="414" class="wx-t-m">drum wall</text><text x="20" y="428" class="wx-t-m">c. 6.4 m</text><line x1="115" y1="234.4" x2="84" y2="204.4" class="wx-thin"/><text x="20" y="200.4" class="wx-t-b">step rings</text><line x1="179.9" y1="231.2" x2="219.9" y2="267.2" class="wx-thin"/><text x="221.9" y="279.2" class="wx-t wx-halo">coffers: 5 rings</text><text x="221.9" y="293.2" class="wx-t wx-halo">of 28</text><g class="wx-pop" style="--d:16"><circle cx="210" cy="488.2" r="1.8" class="wx-inkfill"/><path d="M210,489.9 L210,493.6 M208.2,500 L210,493.6 L211.8,500 M207.8,493.3 L210,490.6 L212.2,493.3" class="wx-bold"/></g><text x="210" y="482" class="wx-t-s" text-anchor="middle">person</text><line x1="538" y1="518" x2="575" y2="518" class="wx-thin wx-pop" style="--d:2"/><g class="wx-pop" style="--d:2"><text x="580" y="515" class="wx-t-b">travertine</text><text x="580" y="529" class="wx-t-b">(foundation ring)</text></g><line x1="544.8" y1="452" x2="575" y2="452" class="wx-thin wx-pop" style="--d:4"/><g class="wx-pop" style="--d:4"><text x="580" y="449" class="wx-t">travertine</text><text x="580" y="463" class="wx-t">+ tuff</text></g><line x1="544.8" y1="365.4" x2="575" y2="365.4" class="wx-thin wx-pop" style="--d:6"/><g class="wx-pop" style="--d:6"><text x="580" y="369.4" class="wx-t">tuff + brick</text></g><line x1="544.8" y1="291.8" x2="575" y2="291.8" class="wx-thin wx-pop" style="--d:8"/><g class="wx-pop" style="--d:8"><text x="580" y="295.8" class="wx-t">brick</text></g><line x1="504.2" y1="228.4" x2="575" y2="228.4" class="wx-thin wx-pop" style="--d:10"/><g class="wx-pop" style="--d:10"><text x="580" y="225.4" class="wx-t">brick + light</text><text x="580" y="239.4" class="wx-t">tuff</text></g><line x1="432.8" y1="168" x2="575" y2="168" class="wx-thin wx-pop" style="--d:12"/><g class="wx-pop" style="--d:12"><text x="580" y="165" class="wx-t-b">light tuff +</text><text x="580" y="179" class="wx-t-b">pumice / scoria</text></g><rect x="20" y="560" width="80" height="6" class="wx-inkfill"/><rect x="20" y="560" width="40" height="6" class="wx-card wx-edge"/><text x="20" y="580" class="wx-t-s">0</text><text x="100" y="580" class="wx-t-s" text-anchor="middle">10 m</text><text x="700" y="580" class="wx-t-s" text-anchor="end">aggregate zones simplified from Mark and Hutchinson 1986; Lancaster 2005</text></svg></div></div><figcaption>The interior would hold a sphere 43.3 m across. The concrete grows lighter as it rises, from travertine at the foundations to light tuff and pumice at the crown. <span class="wx-src">Based on: Geometry after Wilson Jones 2003 and Mark &amp; Hutchinson 1986 (diameter 43.3 m, drum wall c. 6.4 m, exterior drum c. 30.4 m, oculus c. 8.3–8.9 m, shell c. 1.2 m at the rim); aggregate zones simplified from Mark &amp; Hutchinson 1986 and Lancaster 2005; densities as summarised from Mark &amp; Hutchinson. Step rings and coffers schematic.</span></figcaption><p class="vh">Cross-section of the Pantheon rotunda drawn to scale. A thick cylindrical drum carries a hemispherical dome with an opening at the top. A dashed circle 43.3 m across fits exactly inside, touching the floor and the top of the dome. The walls and dome are shaded in six horizontal bands from dark to light, labelled travertine (foundation ring), travertine plus tuff, tuff plus brick, brick, brick plus light tuff, and light tuff plus pumice or scoria. Step rings climb the outside of the dome, coffers are cut into its inner surface, and dimension lines give 43.3 m for both diameter and height, c. 6.4 m for the drum wall and c. 8.3–8.9 m for the oculus. A tiny person stands on the floor for scale.</p></figure><p>From outside, the dome looks surprisingly low. That is because the drum wall rises well above the springing, to about 30 m, wrapping the heavy lower part of the dome. Above that, a series of stepped rings climbs the outside of the shell before it smooths into the gentle cap around the oculus. You see the sphere only from inside, which is precisely the point.</p><p>The numbers are round in Roman terms. The diameter is usually equated with 150 Roman feet and the oculus with 30, and the portico columns were cut as 40-foot shafts. The building is a statement about geometry and the cosmos as much as about engineering. The ancient historian Cassius Dio, writing about Agrippa&#x27;s earlier building, suggested the name came either from the many gods whose statues it held or because its vaulted roof resembled the heavens. Both readings fit the building we have.</p><p>Why a sphere? Roman architects inherited from Greek geometry a deep respect for the circle and the sphere as the most perfect of forms, and Vitruvius opens his discussion of temple design with the proportions of the human body inscribed in a circle and a square. A building whose interior is literally a sphere, lit from a single point at its summit, turns that ideal into something you can walk inside. It is also, conveniently, a form that concrete can achieve and cut stone cannot easily match: a single continuous shell poured course by course, without a forest of internal supports.</p></section><section class="wsec" id="pantheon-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Heavy at the bottom, light at the top</h3><p>A dome is an arch spun around a vertical axis. Its weight pushes down, and near the base it also pushes outwards, trying to burst the ring it sits on. Unreinforced concrete handles squeezing very well but copes badly with being pulled apart. The Pantheon&#x27;s designers attacked the problem from several directions at once, and the most elegant is the concrete itself.</p><p>They graded the aggregate, the chunks of stone set into the mortar, by weight. In the foundation ring they used dense travertine. In the lower drum, travertine and tuff; higher up, tuff and broken brick; then brick; and in the upper dome, light tuff and volcanic scoria or pumice, some of it apparently brought from the Vesuvius region. Estimates of the concrete&#x27;s density fall from about 1,600 kg per cubic metre at the dome&#x27;s base to about 1,350 near the oculus. Modern normal concrete is around 2,400.</p><p>It makes a big difference. In their 1986 structural study, Robert Mark and Paul Hutchinson found that if the dome had been built with heavy concrete throughout, the stresses in it would have been substantially higher, by their estimate some 80 percent. Instead, their model gives peak tensile stresses of only about 0.13 MPa, small enough for Roman concrete to tolerate in much of the structure.</p><aside class="wcall"><b>How do we know what is inside?</b><p>Nobody has sliced the Pantheon in half. The aggregate zones come from places where the concrete is exposed: damaged areas, openings in the upper drum, repairs, and observations made during restorations since the 19th century. They have been summarised by Mark and Hutchinson (1986), Lynne Lancaster (2005) and Mark Wilson Jones (2003, 2015). The exact heights of each zone are approximate, which is why diagrams, including ours, show them simplified.</p></aside><p>The shell thins as it rises, from about 6 m at its base to about 1.2 m at the oculus. Inside, 140 coffers in five rings of 28 step back into the concrete. They are decorative, originally perhaps with bronze rosettes, but they also cut out dead weight. And the coffers shrink as they rise, a trick of perspective that makes the dome seem even higher than it is.</p></section><section class="wsec" id="pantheon-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Cracks, rings and a keystone made of air</h3><p>Here is a surprising fact: the Pantheon&#x27;s dome is cracked, and has been for a very long time. Mark and Hutchinson showed that the lower part of the dome is under hoop tension, a stretching force around its circumference. Unreinforced concrete cannot hold much of that, so the dome cracked along its meridians, like the segments of an orange, probably soon after it was built. Wilson Jones has traced cracks in the rotunda up to about 7 cm wide.</p><figure class="wx wx--steps" id="pantheon-f2" data-n="7"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">How the dome carries its load</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How the dome carries its load"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" class="wx-svg" role="img" aria-labelledby="pantheon-f2-t"><title id="pantheon-f2-t">How the Pantheon dome carries its load, step by step</title><defs><marker id="pantheon-f2-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" class="wx-inkfill"/></marker><marker id="pantheon-f2-aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" class="wx-accfill"/></marker><marker id="pantheon-f2-am" viewBox="0 0 10 10" refX="8" refY="5" mark
