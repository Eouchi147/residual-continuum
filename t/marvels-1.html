"M194.5,205 L190.6,197.1 L200.3,186.2 L208.6,189.3 Z" class="wx-accfill wx-o60"/><path d="M213,185.1 L211.2,177.6 L219.9,170.4 L227,173.6 Z" class="wx-accfill wx-o60"/></g><g class="wx-st wx-hide" data-only="4"><line x1="426" y1="158" x2="572" y2="158" class="wx-thin"/><text x="576" y="155" class="wx-t">crown:</text><text x="576" y="170" class="wx-t">c. 1,350 kg/m³,</text><text x="576" y="185" class="wx-t">pumice and</text><text x="576" y="200" class="wx-t">light tuff</text><text x="240" y="292.8" class="wx-t wx-t-a wx-halo">coffers remove</text><text x="240" y="307.8" class="wx-t wx-t-a wx-halo">dead weight</text></g><g class="wx-st wx-hide" data-s="5"><rect x="287.8" y="133.6" width="7" height="9.6" class="wx-accfill"/><rect x="365.2" y="133.6" width="7" height="9.6" class="wx-accfill"/></g><g class="wx-st wx-hide" data-only="5"><path d="M234.8,116.4 L282.8,132.4" class="wx-hl" marker-end="url(#pantheon-f2-aa)"/><path d="M425.2,116.4 L377.2,132.4" class="wx-hl" marker-end="url(#pantheon-f2-aa)"/><text x="330" y="86.4" class="wx-t wx-t-a wx-halo" text-anchor="middle">compression ring:</text><text x="330" y="101.4" class="wx-t wx-t-a wx-halo" text-anchor="middle">squeezed from all sides</text></g><g class="wx-st wx-hide" data-s="6"><path d="M110.4,418 A20.8,20.8 0 0 1 152,418" class="wx-line wx-s1" style="stroke-width:4;stroke-dasharray:3 2"/><path d="M110.4,346 A20.8,20.8 0 0 1 152,346" class="wx-line wx-s1" style="stroke-width:4;stroke-dasharray:3 2"/><path d="M508,418 A20.8,20.8 0 0 1 549.6,418" class="wx-line wx-s1" style="stroke-width:4;stroke-dasharray:3 2"/><path d="M508,346 A20.8,20.8 0 0 1 549.6,346" class="wx-line wx-s1" style="stroke-width:4;stroke-dasharray:3 2"/></g><g class="wx-st wx-hide" data-only="6"><path d="M110.4,430 L110.4,513.2" class="wx-hl" marker-end="url(#pantheon-f2-aa)"/><path d="M152,430 L152,513.2" class="wx-hl" marker-end="url(#pantheon-f2-aa)"/><path d="M508,430 L508,513.2" class="wx-hl" marker-end="url(#pantheon-f2-aa)"/><path d="M549.6,430 L549.6,513.2" class="wx-hl" marker-end="url(#pantheon-f2-aa)"/><text x="580" y="300" class="wx-t wx-t-a">brick relieving</text><text x="580" y="315" class="wx-t wx-t-a">arches steer</text><text x="580" y="330" class="wx-t wx-t-a">loads into</text><text x="580" y="345" class="wx-t wx-t-a">solid piers</text></g><text x="330" y="129.2" class="wx-t-s" text-anchor="middle">oculus</text><text x="529.2" y="538" class="wx-t-s" text-anchor="middle">foundation ring</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button><button type="button" class="wx-dot" data-k="6" aria-label="Step 6" aria-pressed="false">6</button><button type="button" class="wx-dot" data-k="7" aria-label="Step 7" aria-pressed="false">7</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 7.</b> Every part of the dome pushes down, and near its base a dome also tries to spread outwards. Unreinforced concrete resists squeezing well but cracks easily when pulled.</p><ol class="wx-steplist"><li>Every part of the dome pushes down, and near its base a dome also tries to spread outwards. Unreinforced concrete resists squeezing well but cracks easily when pulled.</li><li>The lower dome cracked along its meridians early on, so it now behaves partly like a ring of arches leaning on each other. Their thrust lines stay inside the concrete all the way down into the thick drum.</li><li>The step rings add weight to the haunches, pushing the thrust down into the drum instead of outwards.</li><li>Coffers and ever-lighter aggregate cut the weight where it matters most: near the crown, concrete of about 1,350 kg/m³ against about 1,600 at the base.</li><li>Around the oculus, a ring of tiles set on edge is squeezed from all sides and works like a keystone for every arch at once.</li><li>In the 6 m thick drum, brick relieving arches steer the loads around the niches into solid piers and down to the ring foundation.</li><li>The oculus is the only window. Through the day a disc of sunlight crawls across the coffers and walls; around noon on 21 April it lights the entrance (Hannah &amp; Magli 2011).</li></ol><figcaption>Weight, cracks, step rings, light concrete, a compression ring and a massive drum work together to keep the dome in compression. <span class="wx-src">Based on: Structural behaviour after Mark &amp; Hutchinson 1986 and Wilson Jones 2003; densities as summarised from Mark &amp; Hutchinson; sunlight after Hannah &amp; Magli 2011. Schematic.</span></figcaption><p class="vh">Simplified section of the Pantheon rotunda shown in seven steps. Step 1: arrows show the dome&#x27;s weight pressing down and the base trying to spread outwards. Step 2: curved thrust lines run from the crown through the dome and straight down inside the thick drum to the foundation, with a small plan view showing radial meridian cracks. Step 3: the step rings are highlighted with arrows pressing down on the haunches. Step 4: the coffers and the light upper concrete are highlighted. Step 5: arrows squeeze the tile ring around the oculus. Step 6: brick relieving arches appear in the drum with arrows leading down to the foundation. Step 7: a beam of sunlight enters through the oculus and swings slowly across the interior.</p></figure><p>Hoop tension is easy to picture if you think of a wooden barrel. Squeeze the top of a dome and its lower part wants to bulge outwards, just as barrel staves would spring apart without their iron hoops. Later dome builders added literal hoops: Brunelleschi in Florence and the builders of St Peter&#x27;s in Rome buried chains of stone, timber or iron in their domes to hold them in. The Pantheon has no such chains. Its builders relied instead on sheer mass in the drum and haunches, and, whether by design or luck, on a shape that could crack without losing its balance.</p><p>Cracking sounds alarming, but it changed how the dome works rather than destroying it. With the lower part split into wedges, the dome behaves partly like a ring of arches leaning against each other and sharing a common crown. For that to be stable, the line of thrust in each arch has to stay inside the masonry all the way down to the ground. The heavy haunches, loaded by the step rings, and the massive drum make sure it does.</p><p>At the top, where you might expect a keystone, there is a hole. The oculus is edged with a ring of tiles set on edge, in several courses, and originally a bronze cornice. Squeezed from all sides by the leaning segments, the ring works in compression, rather like the keystone of every arch at once. Leaving the top open also removes the heaviest, most awkward part of any dome, the crown.</p><blockquote class="wpull"><p>Where every other dome needs a keystone, the Pantheon has a ring of tiles around empty air.</p></blockquote><p>In the drum, relieving arches of brick, visible in places on the exterior wall, span over the niches and steer the loads into eight solid piers. Beneath it all, a ring foundation of heavy concrete spreads the weight into the soft ground of the Campus Martius, which settled unevenly and may explain some of the cracking.</p></section><section class="wsec" id="pantheon-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Building the impossible centering</h3><p>The concrete had to be laid on something while it set. For a 43 m dome that means timber centering on a colossal scale, and none of it survives. How it was arranged is one of the building&#x27;s real unknowns.</p><p>One influential proposal, by Wilson Jones, imagines a doughnut-shaped timber tower about 11.5 m across rising from the floor to carry the thin upper shell, while the thick lower courses were laid on lighter formwork spanning between the drum and the tower. The lower dome&#x27;s horizontal courses could partly support themselves as they were built, like a corbelled vault, which would reduce the load on the timber. Concrete was probably carried up in baskets, and the builders may have used the step rings as working platforms.</p><p>The porch holds another puzzle. Its sixteen columns have monolithic shafts of Egyptian granite, grey from Mons Claudianus in the Eastern Desert and pink from Aswan, each about 11.9 m tall including base and capital and weighing about 60 tonnes. Oddly, the pediment of the porch does not quite fit the transitional block behind it, and there is a ghostly second pediment higher up. Wilson Jones has argued that the design called for 50-foot shafts, which never arrived, and that the builders had to make do with 40-foot ones, lowering the porch. It is an attractive hypothesis, though not the only explanation offered.</p><ul class="wlist"><li>Travertine, tuff and brick came from quarries and brickyards around Rome.</li><li>Light volcanic scoria for the upper dome likely came from the Bay of Naples region.</li><li>The granite column shafts were quarried in Egypt and shipped across the Mediterranean and up the Tiber.</li><li>The dome&#x27;s outer surface was covered in gilded bronze tiles, later replaced with lead.</li></ul></section><section class="wsec" id="pantheon-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>Temple, church, tomb, time machine</h3><p>The Pantheon survived partly because it never stopped being useful. In 609 Pope Boniface IV, with permission from the Byzantine emperor Phocas, consecrated it as the church of Santa Maria ad Martyres. A building in use is a building that gets repaired.</p><p>It did not escape unharmed. In 663 the Byzantine emperor Constans II stripped the gilded bronze tiles from the roof. In the 1620s Pope Urban VIII, of the Barberini family, removed bronze beams from the porch roof, much of it reportedly for cannon; a Roman wit coined the line &#x27;what the barbarians did not do, the Barberini did&#x27;. The great bronze doors, about 7.5 m high, are often described as ancient, though they have been repaired many times and their exact date is still debated.</p><p>The building became a burial place for artists and kings. Raphael was laid to rest here in 1520, and two kings of united Italy lie here too. Its design echoed down the centuries, in Renaissance churches, in Thomas Jefferson&#x27;s Rotunda at the University of Virginia and in countless libraries and banks.</p><aside class="wcall"><b>Chasing the sun</b><p>Robert Hannah and Giulio Magli (2011) tracked the disc of light from the oculus through the year. At noon at the equinoxes it falls on the band where the dome springs from the drum; around 21 April, the traditional birthday of Rome, it lights the entrance. They argue the building worked as a symbolic sundial linking the emperor, the sun and time, while stressing that it was not a precise astronomical instrument.</p></aside></section><section class="wsec" id="pantheon-s8"><h3 class="wsec-h"><span class="wsec-n">08</span>What we still do not know</h3><p>The Pantheon is not a mystery in the sense that we cannot explain why it stands. Structural models, material studies and centuries of observation give a coherent answer: sound geometry, graded concrete, a heavy drum and a design that tolerates cracking. Recent chemistry on Roman mortars, including the self-healing lime clasts found in hot-mixed concrete elsewhere, may add a little to the story, but so far nobody has sampled the dome&#x27;s concrete in that detail.</p><p>The genuine unknowns are human. We do not know the architect&#x27;s name. We do not know exactly how the centering was built, how long the dome took, or how the building site was organised. We do not know for sure what stood in the niches, or how the interior was originally lit and decorated beyond what survives. And the sun effects, though real and beautiful, leave open how much was planned and how much is a happy consequence of a round hole in a round roof.</p><blockquote class="wpull"><p>The engineering is well understood. The people who built it remain almost entirely nameless.</p></blockquote><p>Stand under the oculus and look up. The light that falls on your face travelled 150 million km from the sun and passed through a hole cut on purpose in a concrete shell poured nineteen centuries ago. The builders could not have known their dome would outlast the empire, the gods it was built for and the language of its inscription. But they built as if they did.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">25 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Agrippa builds the first Pantheon (c. 27–25 BCE)</span></li><li class="wtl-loss" style="--i:1"><span class="wtl-y">80 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Fire; Domitian restores the building</span></li><li class="wtl-loss" style="--i:2"><span class="wtl-y">110 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Struck by lightning and burned again</span></li><li class="wtl-build" style="--i:3"><span class="wtl-y">114 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Rebuilding begins under Trajan, dated by brick stamps</span></li><li class="wtl-build" style="--i:4"><span class="wtl-y">126 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Completed under Hadrian and dedicated (c. 125–128)</span></li><li class="wtl-use" style="--i:5"><span class="wtl-y">202 CE</span><span class="wtl-k">In use</span><span class="wtl-t">Septimius Severus and Caracalla record a restoration</span></li><li class="wtl-use" style="--i:6"><span class="wtl-y">609 CE</span><span class="wtl-k">In use</span><span class="wtl-t">Consecrated as the church of Santa Maria ad Martyres</span></li><li class="wtl-loss" style="--i:7"><span class="wtl-y">663 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Emperor Constans II strips the gilded bronze roof tiles</span></li><li class="wtl-use" style="--i:8"><span class="wtl-y">1520 CE</span><span class="wtl-k">In use</span><span class="wtl-t">Raphael buried inside</span></li><li class="wtl-loss" style="--i:9"><span class="wtl-y">1625 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Urban VIII removes the portico&#x27;s bronze beams</span></li><li class="wtl-study" style="--i:10"><span class="wtl-y">1986 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Mark and Hutchinson&#x27;s structural model explains the cracks</span></li><li class="wtl-study" style="--i:11"><span class="wtl-y">2007 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Hetland dates the start to Trajan&#x27;s reign from brick stamps</span></li></ol><figure class="wbars"><h4 class="wx-title">Some great domes and their spans</h4><div class="wb-r" style="--w:100.0%;--i:0"><div class="wb-l">Florence Cathedral (1436, brick)</div><div class="wb-t"><i></i><span>45.5 m</span></div></div><div class="wb-r" style="--w:95.2%;--i:1"><div class="wb-l">Pantheon, Rome (c. 126, concrete)</div><div class="wb-t"><i></i><span>43.3 m</span></div></div><div class="wb-r" style="--w:91.2%;--i:2"><div class="wb-l">St Peter&#x27;s, Rome (1590, masonry)</div><div class="wb-t"><i></i><span>41.5 m</span></div></div><div class="wb-r" style="--w:68.1%;--i:3"><div class="wb-l">Hagia Sophia, Istanbul (562, brick)</div><div class="wb-t"><i></i><span>31 m</span></div></div><div class="wb-r" style="--w:47.3%;--i:4"><div class="wb-l">&#x27;Temple of Mercury&#x27;, Baiae (1st century BCE)</div><div class="wb-t"><i></i><span>21.5 m</span></div></div><figcaption>Source: Spans rounded from standard architectural references (Mainstone; Wilson Jones 2003); interior diameters, approximate</figcaption></figure><h3 class="sub-h wsub">The big debates</h3><div class="debate"><p class="debate-q">Was the Pantheon built to catch the sun on special days?</p><div class="sides"><div class="side"><b>Yes: the light marks meaningful dates.</b><span>Hannah and Magli show the noon light marks the dome&#x27;s springing at the equinoxes and lights the entrance around 21 April, Rome&#x27;s founding day, fitting imperial sun symbolism.</span></div><div class="side"><b>Not necessarily: any round oculus makes moving light.</b><span>No ancient text describes such alignments, the building faces roughly north for urban reasons, and dates near 21 April span several days of lit doorway.</span></div></div><p class="debate-why"><b>The bold claim:</b> The oculus and entrance were deliberately designed so the sun lights the doorway on Rome&#x27;s birthday.</p><div class="meter" style="--pos:41.7%" role="img" aria-label="Weight of evidence: Open question"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The light effects are real and measurable, and they fit what we know about Roman solar and imperial symbolism. But intention is hard to demonstrate without a text, and some effects would follow from almost any domed rotunda with an oculus facing this direction. It remains an attractive, arguable interpretation.</p></div><div class="debate"><p class="debate-q">Did Hadrian design the Pantheon himself?</p><div class="sides"><div class="side"><b>Yes: Hadrian was an architect-emperor.</b><span>Ancient sources describe his passion for architecture, and he designed parts of his villa at Tivoli and the Temple of Venus and Roma.</span></div><div class="side"><b>Unlikely or unknown: the project began under Trajan.</b><span>Brick stamps indicate a start around 114, three years before Hadrian&#x27;s accession; Apollodorus of Damascus has been suggested, but no source names the architect.</span></div></div><p class="debate-why"><b>The bold claim:</b> Hadrian personally designed the Pantheon.</p><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The brick-stamp evidence places the start of construction under Trajan, and there is no ancient statement that Hadrian drew up the design. He finished and dedicated the building, and may have influenced it, but authorship of the design remains unknown.</p></div><div class="debate"><p class="debate-q">Was the porch meant to be taller?</p><div class="sides"><div class="side"><b>Yes: 50-foot columns were planned.</b><span>The mismatched pediments and the proportions of the transitional block fit a design for 50-foot shafts later reduced to 40-foot ones (Wilson Jones).</span></div><div class="side"><b>Other explanations are possible.</b><span>The irregularities could reflect design changes for other reasons or a separate building phase, and no document records a shortage of columns.</span></div></div><p class="debate-why"><b>The bold claim:</b> The Pantheon&#x27;s porch was built lower than planned because giant 50-foot columns failed to arrive.</p><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The architectural clues are real and the hypothesis explains several awkward details at once. It depends on reconstructing a lost intention, and alternatives exist, so it is best treated as a strong idea rather than an established fact.</p></div><details class="srcs"><summary>Sources for this deep dive (11)</summary><ol><li>Mark, R. &amp; Hutchinson, P. (1986). On the Structure of the Roman Pantheon. The Art Bulletin 68(1): 24-34. <a href="https://doi.org/10.1080/00043079.1986.10788309" target="_blank" rel="noopener">doi:10.1080/00043079.1986.10788309</a></li><li>Hetland, L. M. (2007). Dating the Pantheon. Journal of Roman Archaeology 20: 95-112. <a href="https://doi.org/10.1017/S1047759400005328" target="_blank" rel="noopener">doi:10.1017/S1047759400005328</a></li><li>Marder, T. A. &amp; Wilson Jones, M. (eds) (2015). The Pantheon: From Antiquity to the Present. Cambridge University Press.</li><li>Wilson Jones, M. (2003). Principles of Roman Architecture. New Haven: Yale University Press.</li><li>Lancaster, L. C. (2005). Concrete Vaulted Construction in Imperial Rome: Innovations in Context. Cambridge University Press.</li><li>MacDonald, W. L. (1976). The Pantheon: Design, Meaning, and Progeny. Cambridge, MA: Harvard University Press.</li><li>Hannah, R. &amp; Magli, G. (2011). The role of the sun in the Pantheon&#x27;s design and meaning. Numen 58(4): 486-513.</li><li>Historia Augusta, Life of Hadrian, trans. D. Magie. Loeb Classical Library, 1921.</li><li>Cassius Dio, Roman History 53.27, trans. E. Cary. Loeb Classical Library, 1917.</li><li>Seymour, L. M. et al. (2023). Hot mixing: Mechanistic insights into the durability of ancient Roman concrete. Science Advances 9(1): eadd1602. <a href="https://doi.org/10.1126/sciadv.add1602" target="_blank" rel="noopener">doi:10.1126/sciadv.add1602</a></li><li>Mainstone, R. J. (2001). Developments in Structural Form. 2nd ed. Oxford: Architectural Press.</li></ol></details><aside class="rc-cite" data-v="marvels" data-id="marvel-pantheon" data-t="The Pantheon dome"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Pantheon dome</i>. <span class="cite-u">https://residual-continuum.vercel.app/#marvels/marvel-pantheon</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="marvel-great-wall-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Great Wall of China July 2006.JPG" data-cap="The Great Wall" data-big><figcaption></figcaption></figure><div class="sh-k">Northern China</div><h2 class="sh-t" id="marvel-great-wall-st" tabindex="-1">The Great Wall of China</h2><p class="sh-s">Not one wall but dozens, built over two thousand years from tamped earth, reeds, stone and brick, and 21,196 km of it survives.</p><div class="sh-v"><span class="vstamp vstamp--mys">Mystery <span class="pips" role="img" aria-label="Mystery level 1 of 5"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></span></span></div></div><div class="wquick"><h3 class="sub-h">The quick read</h3><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="21196" >21,196</b><span class="ctr-u"> km</span></div><div class="ctr-l">of wall, trench and barrier, all dynasties</div><div class="ctr-c">State Administration of Cultural Heritage 2012</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="8852" >8,852</b><span class="ctr-u"> km</span></div><div class="ctr-l">in the Ming system alone</div><div class="ctr-c">Ming survey 2009</div></div><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="43000" >43,000</b><span class="ctr-u"> sites</span></div><div class="ctr-l">wall sections, towers, trenches and forts recorded</div><div class="ctr-c">State Administration of Cultural Heritage 2012</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="300000" >300,000</b><span class="ctr-u"> people</span></div><div class="ctr-l">under Meng Tian building the Qin wall, per Sima Qian</div><div class="ctr-c">Shiji ch. 88</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="13" >13</b><span class="ctr-u"> cm</span></div><div class="ctr-l">typical rammed-earth layer (range c. 10–16 cm)</div><div class="ctr-c">Ge et al. 2026</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="67" >67</b><span class="ctr-u"> %</span></div><div class="ctr-l">of sampled rammed-earth sections covered by biocrust</div><div class="ctr-c">Cao et al. 2023</div></div></div><div class="stats"><div><b>c. 21,196 km</b><span>All walls, all dynasties (2012 survey)</span></div><div><b>c. 8,852 km, incl. trenches and natural barriers</b><span>Ming wall system (2009 survey)</span></div><div><b>over 43,000 walls, trenches, towers and forts</b><span>Sites recorded (2012)</span></div><div><b>c. 7.5–7.8 m high, c. 6.5 m wide at base, c. 5.8 m at top</b><span>Badaling (Ming, built 1505 onwards)</span></div><div><b>c. 10–16 cm each</b><span>Rammed-earth layers (Ming, NW China)</span></div><div><b>c. 3 arcseconds; the eye resolves c. 60</b><span>Angular width from 400 km orbit</span></div><div><b>c. 67% of sampled rammed-earth sections</b><span>Biocrust cover (2023 study)</span></div></div><p>The Great Wall is a family of walls built, abandoned and rebuilt by many states and dynasties. Most of it is rammed earth: damp local soil tipped between wooden boards and pounded with rammers into dense layers a hand&#x27;s breadth thick, lift after lift. In the deserts of Gansu, Han dynasty builders layered gravel and sand with reeds and tamarisk branches. The famous walls around Beijing are Ming work of the 15th and 16th centuries: a cut-stone footing, skins of fired brick set in lime mortar, and a core of earth and rubble, topped by a paved walkway, crenellated battlements and brick watchtowers. Some Ming masonry used lime mortar mixed with sticky rice soup, whose starch helps produce a tougher, more water-resistant binder.</p><div class="flip" id="marvel-great-wall-flip"><div class="flip-in"><div class="flip-f"><b>The myth</b><p>The Great Wall is one continuous wall, and the only human-made object you can see from the Moon.</p></div><div class="flip-b"><b>The reality</b><p>It is a network of many walls, trenches, towers and forts of different ages, with gaps where mountains and rivers did the job. From low Earth orbit a wall 5–9 m wide is far below the resolving power of the naked eye and blends into the landscape; China&#x27;s first astronaut, Yang Liwei, reported in 2003 that he could not see it. From the Moon, some 384,000 km away, no individual human structure is visible to the eye.</p></div></div><button type="button" class="flip-btn" aria-pressed="false" onclick="flip('marvel-great-wall-flip',this)">Flip it</button></div><div class="twist"><b>Wow</b><p>Much of the surviving rammed-earth wall is wrapped in a living skin of mosses, lichens and cyanobacteria, and a 2023 study found this biocrust makes the earth several times more resistant to erosion.</p></div><div class="wmys"><span>Mystery meter</span><span class="pips" role="img" aria-label="Mystery level 1 of 5"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></span><small>Mostly solved</small></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">10 min read · 2,220 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Great Wall of China"><button type="button" class="wtoc-i" data-go="great-wall-s1">A wall that is really a crowd</button><button type="button" class="wtoc-i" data-go="great-wall-s2">From rival states to the First Emperor</button><button type="button" class="wtoc-i" data-go="great-wall-s3">Built from dirt: the art of rammed earth</button><button type="button" class="wtoc-i" data-go="great-wall-s4">The Ming make it monumental</button><button type="button" class="wtoc-i" data-go="great-wall-s5">Sticky rice and lime</button><button type="button" class="wtoc-i" data-go="great-wall-s6">Smoke by day, fire by night</button><button type="button" class="wtoc-i" data-go="great-wall-s7">Can you see it from the Moon?</button><button type="button" class="wtoc-i" data-go="great-wall-s8">A living skin and an uncertain future</button></nav></div><section class="wsec" id="great-wall-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A wall that is really a crowd</h3><p>Climb the steep brick steps at Badaling on a winter morning, when the tour buses have not yet arrived, and the wall does what every photograph promises. It rolls over the ridges like a grey dragon, tower after tower, until it vanishes into the haze. It is easy to believe you are looking at a single, continuous structure running from the sea to the desert.</p><p>You are not. The Great Wall is not one wall but dozens, built, abandoned, reused and rebuilt by many states and dynasties over more than two thousand years. In 2012 China&#x27;s State Administration of Cultural Heritage finished a national survey and put the total length of all walls, trenches and natural barriers from all periods at 21,196 km, recording more than 43,000 individual sites: wall sections, towers, forts and passes. That is a little over half the circumference of the Earth, but it is spread across northern China in overlapping lines, spurs and loops, not one neat line.</p><blockquote class="wpull"><p>The Great Wall is less a single monument than a two-thousand-year argument about where the frontier should be.</p></blockquote><p>Most of it is not the brick-and-stone wall of postcards. It is earth: pounded soil, gravel, reeds and branches. The brick parts near Beijing are the latest and grandest chapter, built by the Ming dynasty in the 15th and 16th centuries. To understand the wall, you have to start much earlier, and much lower down, with a pile of dirt and a wooden board.</p><p>Even the name hints at this. In Chinese the wall is Changcheng, simply &#x27;the long wall&#x27;, or Wanli Changcheng, &#x27;the long wall of ten thousand li&#x27;. A li is a traditional unit of distance of roughly half a kilometre, and &#x27;ten thousand&#x27; in Chinese often means &#x27;countless&#x27; rather than an exact figure. The name was never a survey measurement; it was a way of saying &#x27;endless&#x27;. Modern surveyors, armed with GPS and satellite imagery, have now given that poetic phrase a number, and the number turned out to be even bigger than the poets implied.</p></section><section class="wsec" id="great-wall-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>From rival states to the First Emperor</h3><p>Long before China was one country, its rival states walled their borders, against each other as much as against outsiders. The earliest such walls date back to around the 7th century BCE. When the state of Qin conquered its rivals in 221 BCE, its king became the First Emperor, and he sent his general Meng Tian north against the Xiongnu, the powerful nomadic confederation of the steppe.</p><p>According to the historian Sima Qian, writing about a century later in the Shiji (chapter 88), Meng Tian commanded some 300,000 men and built a wall that followed the lie of the land, using mountains and passes, from Lintao in the west to Liaodong in the east, a distance of more than 10,000 li. Much of this &#x27;Qin wall&#x27; linked and extended older state walls. Sima Qian&#x27;s numbers are those of a historian, not an auditor, but archaeology confirms long stretches of Qin earthwork across the north.</p><p>The cost in lives is remembered too. Chinese folklore tells of Meng Jiangnü, whose husband was conscripted to build the wall and died there; her weeping, the story goes, brought a section crashing down to reveal his bones. It is a legend, not a record, but it captures how the wall was experienced by the families of the conscripts: as a place people were sent and did not come back from.</p><p>The Han dynasty, which followed Qin, pushed walls and beacon towers far to the west, through the Gansu corridor towards Dunhuang and beyond, to protect the trade routes later known as the Silk Road. Some of their walls still stand, in places where no one would expect earth to survive two thousand years.</p></section><section class="wsec" id="great-wall-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Built from dirt: the art of rammed earth</h3><p>The technique behind most of the Great Wall is called hangtu, rammed earth, and it has been used in China since the Neolithic. It needs no kiln, no quarry and no mortar, only soil, timber and a lot of muscle. Builders set up two parallel lines of boards held by posts and ties, tipped a layer of damp local soil between them, and pounded it with rammers until it was dense and hard. Then they added another layer, and another. When the boards were full, they were lifted and the next &#x27;lift&#x27; began.</p><figure class="wx wx--steps" id="great-wall-f1" data-n="6"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">Building a rammed-earth wall</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Building a rammed-earth wall"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 456" class="wx-svg" role="img" aria-labelledby="great-wall-f1-t"><title id="great-wall-f1-t">How a rammed-earth section of the Great Wall was built</title><defs><marker id="great-wall-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" class="wx-inkfill"/></marker><marker id="great-wall-f1-aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" class="wx-accfill"/></marker><marker id="great-wall-f1-am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" class="wx-c2"/></marker></defs><text x="20" y="26" class="wx-t-cap">Building a rammed-earth wall, one lift at a time</text><rect x="20" y="420.0" width="680" height="16" class="wx-soil wx-o60"/><line x1="20" y1="420.0" x2="700" y2="420.0" class="wx-line"/><polygon points="50,420 350,420 275,120 125,120" class="wx-guide"/><text x="200" y="110" class="wx-t-s" text-anchor="middle">finished profile (walls vary, often 5–8 m tall)</text><g class="wx-st wx-hide" data-s="6"><polygon points="50,420 350,420 275,120 125,120" class="wx-soil edge"/></g><g class="wx-st wx-hide" data-only="1"><line x1="344.0" y1="404.0" x2="374" y2="380.0" class="wx-thin"/><text x="380" y="376" class="wx-t">wooden boards, stacked</text><text x="380" y="391" class="wx-t">and held by posts</text><line x1="349.0" y1="368.0" x2="374" y2="320.0" class="wx-thin"/><text x="380" y="316" class="wx-t">rope or pole ties</text><text x="380" y="331" class="wx-t">stop the boards bursting</text></g><g class="wx-st wx-hide" data-only="2"><text x="380" y="360" class="wx-t">loose, damp local soil,</text><text x="380" y="375" class="wx-t">often sieved, tipped in</text></g><g class="wx-st wx-hide" data-only="4"><text x="380" y="360" class="wx-t">layer on layer until</text><text x="380" y="375" class="wx-t">the boards are full</text></g><g class="wx-st wx-hide" data-only="5"><text x="380" y="360" class="wx-t">boards lifted and</text><text x="380" y="375" class="wx-t">re-tied for the next lift</text></g><g class="wx-st wx-hide" data-only="6"><line x1="326" y1="330.0" x2="374" y2="330.0" class="wx-thin"/><text x="380" y="326" class="wx-t">biocrust of mosses, lichens</text><text x="380" y="341" class="wx-t">and cyanobacteria on</text><text x="380" y="356" class="wx-t">exposed faces</text><line x1="250" y1="270.0" x2="374" y2="270.0" class="wx-thin"/><text x="380" y="266" class="wx-t">layer lines still show</text><text x="380" y="281" class="wx-t">in weathered walls</text></g><g class="wx-st wx-hide" data-s="3"><rect x="420" y="56" width="270" height="164" rx="10" class="wx-card wx-edge-soft"/><text x="432" y="76" class="wx-t-b">Zoom: two rammed layers</text><rect x="432" y="152" width="160" height="52" class="wx-stone2 wx-o60 wx-edge-soft"/><path d="M442,152 Q453.7,165.2 465.4,152" class="wx-paper wx-edge-soft"/><path d="M472.1,152 Q484.1,164.2 496.2,152" class="wx-paper wx-edge-soft"/><path d="M502.4,152 Q518.1,163.8 533.8,152" class="wx-paper wx-edge-soft"/><path d="M540,152 Q558,172.6 576,152" class="wx-paper wx-edge-soft"/><rect x="432" y="100" width="160" height="52" class="wx-soil wx-edge-soft"/><path d="M442,100 Q458.6,116.5 475.2,100" class="wx-paper wx-edge-soft"/><path d="M480,100 Q491.8,110.6 503.7,100" class="wx-paper wx-edge-soft"/><path d="M513.2,100 Q529.8,120.4 546.5,100" class="wx-paper wx-edge-soft"/><path d="M550.6,100 Q566.8,115.4 582.9,100" class="wx-paper wx-edge-soft"/><path d="M600,152 L600,204" class="wx-dim" marker-start="url(#great-wall-f1-ah)" marker-end="url(#great-wall-f1-ah)"/><text x="608" y="174" class="wx-t-n">10–16 cm</text><text x="608" y="188" class="wx-t-n">per layer</text><text x="608" y="110" class="wx-t-s">tamper pits</text><text x="608" y="123" class="wx-t-s">6–9 cm across</text></g><text x="700" y="446" class="wx-t-s" text-anchor="end">layers drawn thicker than real; zoom after Ge et al. 2026</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button><button type="button" class="wx-dot" data-k="6" aria-label="Step 6" aria-pressed="false">6</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 6.</b> Set up the formwork: wooden boards held by posts, tied across so they do not burst.</p><ol class="wx-steplist"><li>Set up the formwork: wooden boards held by posts, tied across so they do not burst.</li><li>Tip in a layer of loose, damp local soil, often sieved to remove stones.</li><li>Pound it with rammers until it is dense. Layers end up about 10–16 cm thick, pocked with tamper pits 6–9 cm across.</li><li>Repeat, layer on layer, until the boards are full.</li><li>Lift the boards, tie them again and start the next lift. The wall grows in bands.</li><li>The finished wall tapers upwards. Its layer lines still show where it weathers, and biocrusts of mosses, lichens and cyanobacteria often cover its faces.</li></ol><figcaption>Wooden boards, damp soil and thousands of rammer blows: most of the Great Wall was built this way, one lift at a time. <span class="wx-src">Based on: Method after standard descriptions of hangtu; layer and tamper-pit sizes from Ge et al. 2026 (15 Ming sites, NW China); biocrust after Cao et al. 2023. Schematic; layers drawn thicker than real.</span></figcaption><p class="vh">A section through a rammed-earth wall under construction, with a dashed outline of the finished tapered wall. Step 1 shows wooden boards held by posts and a rope tie on bare ground. Step 2 shows loose soil being tipped from a basket between the boards. Step 3 shows a worker with a rammer compacting the first layer, with a zoom panel of two rammed layers 10 to 16 cm thick marked by tamper pits 6 to 9 cm across. Step 4 shows four compacted layers filling the boards. Step 5 shows the boards lifted and re-tied above the finished lift. Step 6 shows the completed tapered wall with fine layer lines and a green biocrust on its faces.</p></figure><p>How thick were the layers? A 2026 study by Chengrui Ge and colleagues used 3D scanning at 15 Ming rammed-earth sites in Gansu, Qinghai and Shaanxi. They measured layers between about 10.4 and 15.6 cm thick, still marked with the small round pits left by rammer heads 5.8 to 9.4 cm across. Those pits are the fingerprints of individual workers&#x27; blows, preserved for five hundred years.</p><aside class="wcall"><b>Fresh from the field</b><p>Ge et al. (2026, Coatings) combined field 3D scanning, soil analysis and compression tests at 15 Ming Great Wall sites across five climate zones in north-west China. They found that both the source of the soil and the ramming technique, such as layer thickness and the density of tamper pits, influenced how strong the finished earth is. Local builders adapted the method to local dirt.</p></aside><p>In the Gobi, even soil was scarce. Along the Han frontier near Dunhuang and Yumen Pass, builders stacked layers of gravel and sand between mats of reeds and tamarisk branches, a kind of desert plywood. The plants bound the gravel together and the dry climate preserved them. Walls of this type, more than two thousand years old, still stand several metres high.</p></section><section class="wsec" id="great-wall-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The Ming make it monumental</h3><p>The wall most visitors walk on is the youngest. The Ming dynasty came to power in 1368 after expelling the Mongol Yuan, and for decades relied more on garrisons and campaigns than on walls. That changed after 1449, when a Ming emperor was captured by the Oirat Mongols at Tumu. Defence became the priority, and walls became policy.</p><p>In 1474 the official Yu Zijun built a wall around the Ordos region about 1,100 km long, with roughly 40,000 men. Over the following century the lines around the capital were doubled and tripled. In the 1560s and 1570s the generals Qi Jiguang and Tan Lun began building hollow brick watchtowers on the walls near Beijing, where soldiers could shelter and store weapons; plans for some 3,000 were scaled back to about 1,200. The 2009 survey of the Ming system measured about 8,852 km in total: 6,260 km of built wall, 360 km of trenches and 2,233 km of natural barriers such as steep ridges and rivers.</p><figure class="wx wx--static" id="great-wall-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">Section through a Ming brick wall</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Section through a Ming brick wall"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 556" class="wx-svg" role="img" aria-labelledby="great-wall-f2-t"><title id="great-wall-f2-t">Section through a Ming brick wall of the Badaling type</title><defs><marker id="great-wall-f2-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" class="wx-inkfill"/></marker><marker id="great-wall-f2-aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" class="wx-accfill"/></marker><marker id="great-wall-f2-am" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 Z" class="wx-c2"/></marker></defs><text x="20" y="26" class="wx-t-cap">A Ming brick wall in section (Badaling type)</text><text x="20" y="44" class="wx-t-s">typical dimensions; details vary from stretch to stretch</text><rect x="20" y="486.0" width="680" height="20" class="wx-soil wx-o60"/><line x1="20" y1="486.0" x2="700" y2="486.0" class="wx-line"/><g class="wx-grow" style="--d:3"><polygon points="234.2,438 425.8,438 414,186 246,186" class="wx-soil wx-edge-soft"/><polygon points="377.3,341.2 375.3,346.5 368.7,344.5 366.4,341.7 370.2,339.2" class="wx-stone3 wx-o60"/><polygon points="377.5,409.8 380.6,411.4 378.9,415.4 374.4,414.3 375.3,410.5" class="wx-stone3 wx-o60"/><polygon points="409.5,361.4 406.1,359.3 407.4,354.5 415.1,354.9 414.9,360.7" class="wx-stone3 wx-o60"/><polygon points="405.9,205.9 408,206.9 407.1,208.9 404.2,210.1 403.5,206.6" class="wx-stone3 wx-o60"/><polygon points="377,316.5 378.7,318.7 378.5,321.2 374.4,320.4 374.3,318.5 line x1="486" y1="174" x2="528" y2="174" class="wx-thin"/><text x="528" y="360" class="wx-t-n">c. 7.5–7.8 m</text><text x="528" y="376" class="wx-t-n">high</text><path d="M200,520.0 L460,520.0" class="wx-dim" marker-start="url(#great-wall-f2-ah)" marker-end="url(#great-wall-f2-ah)"/><text x="330" y="538" class="wx-t-n" text-anchor="middle">base c. 6.5 m</text><path d="M214,90 L446,90" class="wx-dim" marker-start="url(#great-wall-f2-ah)" marker-end="url(#great-wall-f2-ah)"/><text x="330" y="82" class="wx-t-n" text-anchor="middle">top c. 5.8 m</text><line x1="222" y1="126" x2="128" y2="108" class="wx-thin"/><text x="20" y="94" class="wx-t">battlement,</text><text x="20" y="108" class="wx-t">c. 1.7 m, with</text><text x="20" y="122" class="wx-t">loophole</text><line x1="223" y1="286" x2="128" y2="244" class="wx-thin"/><text x="20" y="237" class="wx-t">fired-brick skin</text><text x="20" y="251" class="wx-t">in lime mortar</text><line x1="267.8" y1="356" x2="128" y2="332" class="wx-thin"/><text x="20" y="325" class="wx-t">core: rammed</text><text x="20" y="339" class="wx-t">earth and rubble</text><line x1="220.9" y1="466" x2="128" y2="424" class="wx-thin"/><text x="20" y="417" class="wx-t">cut stone</text><text x="20" y="431" class="wx-t">footing</text><text x="20" y="502" class="wx-t-cap">NORTH (outer)</text><line x1="435" y1="140" x2="584" y2="94" class="wx-thin"/><text x="590" y="90" class="wx-t">inner parapet</text><text x="590" y="104" class="wx-t">c. 1 m</text><line x1="474" y1="182" x2="584" y2="182" class="wx-thin"/><text x="590" y="178" class="wx-t">stone</text><text x="590" y="192" class="wx-t">waterspout</text><text x="700" y="502" class="wx-t-cap" text-anchor="end">SOUTH (inner)</text><text x="378" y="116" class="wx-t-s wx-halo" text-anchor="end">person</text><text x="378" y="128" class="wx-t-s wx-halo" text-anchor="end">1.7 m</text><rect x="20" y="534.0" width="80" height="6" class="wx-inkfill"/><rect x="20" y="534.0" width="40" height="6" class="wx-card wx-edge"/><text x="20" y="554" class="wx-t-s">0</text><text x="100" y="554" class="wx-t-s" text-anchor="middle">2 m</text></svg></div></div><figcaption>Stone footing, brick skins in lime mortar and a core of rammed earth and rubble, topped by a paved walkway between a battlement and a parapet. <span class="wx-src">Based on: Dimensions after the Encyclopedia of China entry for Badaling (c. 7.5 m high, 6.5 m base, 5.8 m top) and published figures of 7.8 m; parapet heights approximate; construction after Liu et al. 2024 and standard descriptions.</span></figcaption><p class="vh">Scaled cross-section of a Ming wall of the Badaling type. A footing of three courses of cut stone sits on the ground. Above it, two tapering skins of fired brick enclose a core of rammed earth and rubble. The wall is about 6.5 m wide at the base, 5.8 m at the top and 7.5 to 7.8 m high. On top, a paved walkway runs between a tall battlement with a loophole on the north side and a lower parapet on the south side. A stone waterspout projects from the south face with water dripping from it. A 1.7 m person stands on the walkway and a 2 m scale bar gives the size.</p></figure><p>A Ming wall of the Badaling type, built from 1505 onwards, is a layered machine. Its base is cut stone. Its outer skins are fired brick set in lime mortar. Its core is rammed earth and rubble. On top runs a paved walkway, around 7.5 to 7.8 m above the ground, wide enough, as guides like to say, for five horses abreast. On the northern side a crenellated battlement with loopholes shields defenders; on the southern side a lower parapet stops people falling off; stone spouts throw rainwater clear of the wall&#x27;s face.</p><p>The builders did not pick easy ground. Near Beijing the Ming wall deliberately follows ridgelines, climbing slopes so steep that the walkway turns into staircases, because the crest of a mountain is the hardest place to attack. Bricks were fired in kilns close to the wall and carried up by people, carts and, according to local tradition, goats and donkeys with panniers. Some Ming bricks carry moulded inscriptions naming the military unit that made them and the year, a reminder that the wall was built by soldiers and conscripts organised like an army, stretch by stretch, with each unit answerable for its own section.</p><figure class="photo wimg" data-img="The Great Wall of China at Jinshanling-edit.jpg" data-cap="The Ming wall at Jinshanling, north-east of Beijing, with its brick watchtowers."><figcaption></figcaption></figure></section><section class="wsec" id="great-wall-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Sticky rice and lime</h3><p>One ingredient in some Ming masonry sounds like a kitchen joke: rice. For centuries Chinese builders added soup made from glutinous, or sticky, rice to lime mortar for tombs, pagodas and city walls. In 2010 the chemists Yang, Zhang and Ma published an analysis of such mortars in Accounts of Chemical Research and explained why it works.</p><p>The key is amylopectin, a branched starch that makes sticky rice sticky. As lime mortar hardens, calcium hydroxide reacts with carbon dioxide to form calcium carbonate crystals. Amylopectin acts as an inhibitor, controlling how those crystals grow so that they stay small and pack into a compact microstructure. The result is an organic-inorganic composite: calcium carbonate held in an organic framework. In their tests, sticky rice-lime mortar was stronger, more stable and more compatible with old masonry than plain lime, and it has since been tried in restoration work.</p><blockquote class="wpull"><p>The mortar in some Ming walls is a composite material, part mineral and part rice pudding.</p></blockquote><p>The researchers trace the technique back about 1,500 years, and it is well documented in Ming and Qing construction. Whether a particular stretch of the Great Wall used it depends on local practice and budgets, so it is best described as a Ming technique used in some walls, not a universal ingredient.</p></section><section class="wsec" id="great-wall-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Smoke by day, fire by night</h3><p>A wall on its own stops very little. What made the Great Wall work was the system around it: garrisons, forts at the passes, and chains of beacon towers within sight of one another. Han dynasty documents on wooden strips, found at frontier posts in Gansu, record signals, patrols and rations in striking detail, showing a bureaucracy that ran along the wall as well as behind it.</p><p>Under the Ming, signals combined smoke or fire with cannon shots, so that the size of a raid could be passed along the line. One Ming code, as it is usually summarised, used one fire and one shot for a band of up to about 100 raiders, rising step by step to five fires and five shots for 10,000 or more. Beacon fuel included firewood, hay and sulphur; stories that wolf dung was burned for its dense smoke are popular, though the phrase &#x27;wolf smoke&#x27; may be as much literary as literal.</p><ul class="wlist"><li>Beacon towers stood on high ground, in sight of the next tower along the line.</li><li>Forts guarded passes such as Jiayuguan in the west and Shanhaiguan by the sea.</li><li>Watchtowers on the wall itself sheltered soldiers, weapons and supplies.</li><li>Ditches and natural barriers filled the gaps where building a wall made no sense.</li></ul><p>Did it work? Sometimes. The walls slowed raiders, channelled them towards defended passes and bought time for armies to gather. But large, determined forces broke through repeatedly, and in 1644 the Manchu Qing entered China through Shanhaiguan after a Ming general opened the gate. A wall is only as strong as the politics behind it.</p></section><section class="wsec" id="great-wall-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>Can you see it from the Moon?</h3><p>No. It is one of the most persistent myths about any monument, and it was born long before anyone went to space. The English antiquary William Stukeley suggested in 1754 that the wall might be visible from the Moon; the idea was repeated in popular books and in Ripley&#x27;s Believe It or Not! in the 1930s and has been in school textbooks ever since.</p><p>The physics is simple. The Moon is about 384,000 km away; at that distance a wall a few metres wide is hopelessly small. Even from the International Space Station, about 400 km up, a wall 6 m wide subtends roughly 3 arcseconds, while the human eye can resolve details down to about 60 arcseconds (1 arcminute), as the optometrist Norberto López-Gil pointed out in 2008. Worse, the wall is built of local earth and stone and blends into the landscape around it. Highways, airports and city lights, which are wider or brighter, are far easier to spot.</p><aside class="wcall"><b>What astronauts say</b><p>In 2003 Yang Liwei, China&#x27;s first astronaut, said he looked for the wall from orbit and could not see it. Photographs taken from the space station with long camera lenses have picked out sections of it under ideal lighting, but that is the camera doing the seeing. The honest summary: invisible from the Moon, and not visible to the naked eye from orbit under normal conditions.</p></aside><p>The myth survives because it is a lovely idea: one human creation so vast it registers on a cosmic scale. The truth is more interesting. The wall&#x27;s greatness is not in its width but in its length, its age and the millions of people who built, guarded and lived along it.</p></section><section class="wsec" id="great-wall-s8"><h3 class="wsec-h"><span class="wsec-n">08</span>A living skin and an uncertain future</h3><p>Rammed earth has one great enemy: water. Rain washes it, wind scours it and frost cracks it. Large stretches of the Great Wall have eroded to shapeless mounds, and people have long carted away bricks and earth for their own buildings. Yet some rammed-earth sections have survived remarkably well. A 2023 study suggested one reason.</p><p>Yousong Cao, Bo Xiao and colleagues sampled eight Ming rammed-earth sections along some 600 km of the wall in north-western China. They found that about two-thirds of the surfaces they sampled were covered in biocrusts: thin living skins of cyanobacteria, mosses and lichens that bind soil particles together. Compared with bare rammed earth, crusted samples were less porous and less erodible and, in some tests, around three times as mechanically stable. Moss-dominated crusts in semi-arid areas protected the earth better than crusts in more arid ones.</p><p>That challenges a common conservation instinct, which is to scrape plants off ancient walls. For rammed earth, at least, the living skin may be doing more good than harm. A 2025 follow-up in Current Biology catalogued the diverse microbial community in these crusts, and researchers are now debating where the line lies between protective and harmful growth.</p><p>The wall&#x27;s future depends on choices like that, and on tourism, road building, climate and money. It became a UNESCO World Heritage Site in 1987. The best-known stretches are heavily restored; many remote sections are crumbling quietly. The Great Wall has always been a work in progress. It still is.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">650 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Rival states begin building border walls (7th century BCE onwards)</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">214 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Qin links and extends walls under Meng Tian after unification</span></li><li class="wtl-build" style="--i:2"><span class="wtl-y">110 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Han walls and beacons push west through the Gansu corridor</span></li><li class="wtl-build" style="--i:3"><span class="wtl-y">1381 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Ming wall at Shanhaiguan built</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">1449 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Tumu disaster: the Ming emperor is captured, and wall-building becomes policy</span></li><li class="wtl-build" style="--i:5"><span class="wtl-y">1474 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Yu Zijun&#x27;s c. 1,100 km Ordos wall, built by c. 40,000 men</span></li><li class="wtl-build" style="--i:6"><span class="wtl-y">1505 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Badaling pass and wall built</span></li><li class="wtl-build" style="--i:7"><span class="wtl-y">1569 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Qi Jiguang and Tan Lun begin hollow brick watchtowers near Beijing</span></li><li class="wtl-event" style="--i:8"><span class="wtl-y">1644 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Qing forces pass Shanhaiguan; the Ming falls</span></li><li class="wtl-event" style="--i:9"><span class="wtl-y">1754 CE</span><span class="wtl-k">Event</span><span class="wtl-t">William Stukeley starts the &#x27;visible from the Moon&#x27; idea</span></li><li class="wtl-event" style="--i:10"><span class="wtl-y">1987 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Inscribed on the UNESCO World Heritage List</span></li><li class="wtl-study" style="--i:11"><span class="wtl-y">2003 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Yang Liwei reports he could not see the wall from orbit</span></li><li class="wtl-study" style="--i:12"><span class="wtl-y">2012 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">National survey measures 21,196 km of walls</span></li><li class="wtl-study" style="--i:13"><span class="wtl-y">2023 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Biocrusts shown to protect rammed-earth walls</span></li></ol><figure class="wbars"><h4 class="wx-title">How long is the Great Wall?</h4><div class="wb-r" style="--w:100.0%;--i:0"><div class="wb-l">All walls, all dynasties</div><div class="wb-t"><i></i><span>21,196 km</span></div></div><div class="wb-r" style="--w:41.8%;--i:1"><div class="wb-l">Ming system, total</div><div class="wb-t"><i></i><span>8,852 km</span></div></div><div class="wb-r" style="--w:29.5%;--i:2"><div class="wb-l">Ming built walls</div><div class="wb-t"><i></i><span>6,260 km</span></div></div><div class="wb-r" style="--w:10.5%;--i:3"><div class="wb-l">Ming natural barriers (hills, rivers)</div><div class="wb-t"><i></i><span>2,233 km</span></div></div><div class="wb-r" style="--w:1.7%;--i:4"><div class="wb-l">Ming trenches</div><div class="wb-t"><i></i><span>360 km</span></div></div><div class="wb-r" style="--w:1.5%;--i:5"><div class="wb-l">Hadrian&#x27;s Wall, for comparison</div><div class="wb-t"><i></i><span>117 km</span></div></div><figcaption>Source: State Administration of Cultural Heritage survey (2012); Ming Great Wall survey (2009); Hadrian&#x27;s Wall: c. 80 Roman miles (English Heritage)</figcaption></figure><h3 class="sub-h wsub">The big debates</h3><div class="debate"><p class="debate-q">Can you see the Great Wall from space?</p><div class="sides"><div class="side"><b>Yes: it is so long it must be visible.</b><span>The claim appears in popular books from the 18th century onwards, and cameras on the space station have photographed it.</span></div><div class="side"><b>No, not with the naked eye.</b><span>From 400 km a 6 m wall spans about 3 arcseconds, far below the eye&#x27;s c. 60 arcsecond limit; astronauts including Yang Liwei report not seeing it; from the Moon it is thousands of times smaller still.</span></div></div><p class="debate-why"><b>The bold claim:</b> The Great Wall is the only human-made structure visible to the naked eye from the Moon.</p><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Simple optics rules it out: the wall is far too narrow and too similar in colour to its surroundings. From the Moon no individual structure is visible to the eye at all. From low orbit, wider and brighter features such as highways, airports and city lights are much easier to see, and the wall appears only in zoomed photographs.</p></div><div class="debate"><p class="debate-q">Did the wall keep invaders out?</p><div class="sides"><div class="side"><b>Yes: it worked as a system.</b><span>Walls, beacons and forts slowed raids, channelled attackers towards defended passes and gave armies warning.</span></div><div class="side"><b>No: it was repeatedly breached.</b><span>Nomadic armies broke through many times; the Mongols conquered all of China in the 13th century and the Qing entered through Shanhaiguan in 1644.</span></div></div><p class="debate-why"><b>The bold claim:</b> The Great Wall was an effective barrier that kept northern invaders out of China.</p><div class="meter" style="--pos:50.0%" role="img" aria-label="Weight of evidence: Mixed record"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Against small raids the wall system often worked, which is why dynasties kept investing in it. Against large, organised armies, or when defenders changed sides, it did not. Its success depended on garrisons, supplies and politics more than on masonry.</p></div><div class="debate"><p class="debate-q">Are workers buried inside the wall?</p><div class="sides"><div class="side"><b>Yes: it is &#x27;the longest cemetery on Earth&#x27;.</b><span>Huge numbers of conscripts died building it, and legends such as Meng Jiangnü&#x27;s tell of bones inside the wall.</span></div><div class="side"><b>Deaths yes, bodies in the fill no.</b><span>Workers who died were most likely buried near camps; human remains built into the rammed-earth or brick fill have not been documented as a practice.</span></div></div><p class="debate-why"><b>The bold claim:</b> The bodies of dead workers were built into the fabric of the wall.</p><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The deaths were real and the suffering is well recorded, but the specific idea that bodies were used as fill or deliberately entombed in the wall rests on folklore. Human remains would weaken rammed earth, and archaeological documentation of such a practice is lacking.</p></div><details class="srcs"><summary>Sources for this deep dive (12)</summary><ol><li>State Administration of Cultural Heritage, China (2012). Results of the national Great Wall resources survey (21,196.18 km). Reported by Xinhua and China.org.cn, 6 June 2012.</li><li>Yang, F., Zhang, B. &amp; Ma, Q. (2010). Study of Sticky Rice-Lime Mortar Technology for the Restoration of Historical Masonry Construction. Accounts of Chemical Research 43(6): 936-944. <a href="https://doi.org/10.1021/ar9001944" target="_blank" rel="noopener">doi:10.1021/ar9001944</a></li><li>Cao, Y., Xiao, B. et al. (2023). Biocrusts protect the Great Wall of China from erosion. Science Advances 9(49): eadk5892. <a href="https://doi.org/10.1126/sciadv.adk5892" target="_blank" rel="noopener">doi:10.1126/sciadv.adk5892</a></li><li>Ge, C., Cui, K., Wen, X. &amp; Xu, P. (2026). Compressive Properties of Rammed Earth at Ming Great Wall Sites in Northwest China: Effects of Material Sourcing and Rammed Technology. Coatings 16(5): 580. <a href="https://doi.org/10.3390/coatings16050580" target="_blank" rel="noopener">doi:10.3390/coatings16050580</a></li><li>Liu, L. et al. (2024). Experimental test and mechanism analysis of soil crust erosion resistance of rammed earth Great Wall in rainy season. Scientific Reports 14: 9069. <a href="https://doi.org/10.1038/s41598-024-59706-z" target="_blank" rel="noopener">doi:10.1038/s41598-024-59706-z</a></li><li>The Great Wall of China harbors a diverse and protective biocrust microbiome (2025). Current Biology.</li><li>López-Gil, N. (2008). Is it Really Possible to See the Great Wall of China from Space with a Naked Eye? Journal of Optometry 1(1): 3-4. <a href="https://doi.org/10.3921/joptom.2008.3" target="_blank" rel="noopener">doi:10.3921/joptom.2008.3</a></li><li>Sima Qian. Shiji (Records of the Grand Historian), ch. 88, Biography of Meng Tian; trans. B. Watson, Records of the Grand Historian: Qin Dynasty. Columbia University Press, 1993.</li><li>Waldron, A. (1990). The Great Wall of China: From History to Myth. Cambridge University Press.</li><li>Lovell, J. (2006). The Great Wall: China Against the World, 1000 BC–AD 2000. London: Atlantic Books.</li><li>Encyclopedia of China Publishing House / Berkshire Publishing (2017). Badaling (Great Wall). ECPH China.</li><li>UNESCO World Heritage Centre. The Great Wall (inscribed 1987).</li></ol></details><aside class="rc-cite" data-v="marvels" data-id="marvel-great-wall" data-t="The Great Wall of China"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Great Wall of China</i>. <span class="cite-u">https://residual-continuum.vercel.app/#marvels/marvel-great-wall</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script>
