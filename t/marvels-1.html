>columns c. 18 m</text></g><g class="wx-pop" style="--d:11"><line x1="497" y1="286" x2="497" y2="332" class="wx-thin"/><text x="497" y="346" text-anchor="middle" class="wx-t-b">Zeus, Olympia</text><text x="497" y="360" text-anchor="middle" class="wx-t-s">statue c. 12 m</text></g><g class="wx-pop" style="--d:12"><line x1="557" y1="286" x2="557" y2="298" class="wx-thin"/><text x="557" y="312" text-anchor="middle" class="wx-t-b">Mausoleum</text><text x="557" y="326" text-anchor="middle" class="wx-t-s">c. 45 m</text></g><g class="wx-pop" style="--d:13"><line x1="611" y1="286" x2="611" y2="332" class="wx-thin"/><text x="611" y="346" text-anchor="middle" class="wx-t-b">Colossus</text><text x="611" y="360" text-anchor="middle" class="wx-t-s">c. 33 m</text></g><g class="wx-pop" style="--d:14"><line x1="666" y1="286" x2="666" y2="298" class="wx-thin"/><text x="666" y="312" text-anchor="middle" class="wx-t-b">Pharos</text><text x="666" y="326" text-anchor="middle" class="wx-t-s">c. 100 m or more</text></g></svg></div></div><figcaption>Heights from the best available estimates. Only the pyramid is measured; the others are reconstructions, drawn dashed. The pyramid is cut off on the left. <span class="wx-src">Based on: Petrie 1883 (pyramid); Pliny, Natural History 34.41 (Colossus, 70 cubits), 36.30-31 (Mausoleum, 140 feet), 36.95 (Artemis columns, 60 feet); Diodorus 2.10 (Gardens, 50 cubits for the uppermost gallery); al-Balawi via modern summaries (Pharos base c. 30 m); Clayton and Price 1988. Widths and details are schematic.</span></figcaption><p class="vh">Silhouettes of the Seven Wonders standing on one ground line at the same scale, with guide lines at 50, 100 and 150 m. From left: the Great Pyramid, 146.6 m, partly cut off; the Hanging Gardens as dashed green terraces about 25 m high, labelled place unknown; the Temple of Artemis with columns about 18 m; the Statue of Zeus, about 12 m, seated inside a dashed temple outline; the Mausoleum, about 45 m; the Colossus of Rhodes, about 33 m, standing on land; and the Pharos, about 100 m or more. A 1.7 m person is a tiny mark between the Temple of Artemis and Zeus.</p></figure><p>Drawn together at one scale, the seven make an odd family. One is a geometric mountain. Two are temples or tombs, two are colossal statues, one is a tower and one is a garden nobody can find. Their ages span 2,300 years, so that the Great Pyramid was already an antiquity older than the Pharos is to us when Antipater wrote.</p></section><section class="wsec" id="seven-wonders-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Who chose the seven?</h3><p>Nobody, exactly. Greek writers had compiled lists of marvels since at least the 3rd century BCE; the scholar-poet Callimachus is said to have written one, now lost. A short treatise On the Seven Wonders survives under the name of Philo of Byzantium, although scholars doubt it is by the famous engineer of that name and date it much later. Its list matches Antipater&#x27;s, and the manuscript breaks off before the last entry.</p><p>Seven was a satisfying, sacred-feeling number, and the choices reflect a Greek view of the world: six of the seven stood in lands ruled by Greek-speaking kings after Alexander, and the seventh was in Egypt, which Greeks had long admired. The Pharos only displaced the walls of Babylon in later lists, and the canonical modern seven became standard in the Renaissance, when artists such as Maarten van Heemskerck engraved them as a set.</p><blockquote class="wpull"><p>The Seven Wonders are less a verdict on ancient engineering than a snapshot of what Greek tourists thought worth the trip.</p></blockquote></section><section class="wsec" id="seven-wonders-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The survivor: the Great Pyramid</h3><p>The oldest wonder is the only one still standing. Built for Khufu around 2560 BCE, the Great Pyramid rose about 146.6 m on a base about 230 m square, the tallest human-made structure for roughly 3,800 years. We know unusually much about how it was built, from the quarries on the Giza plateau, the settlement of its workers, and even the logbook of a boatman named Merer who shipped its white casing stone. It has its own deep dive in this collection, so here it serves as the yardstick: every other wonder in the drawing above is measured against it.</p></section><section class="wsec" id="seven-wonders-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The garden nobody can find</h3><p>The Hanging Gardens are the wonder that most resists evidence. The earliest known mention comes from Berossus, a Babylonian priest writing in Greek around 290 BCE, quoted centuries later by Josephus: Nebuchadnezzar II, he says, built a &#x27;hanging paradise&#x27; for a wife from Media who missed her mountains. Later Greek and Roman writers describe terraces on vaulted galleries, deep soil for large trees, and machines lifting water from the river.</p><blockquote class="quote"><p>The park extended four plethra on each side, and since the approach to the garden sloped like a hillside and the several parts of the structure rose from one another tier on tier, the appearance of the whole resembled that of a theatre.</p><cite>Diodorus Siculus, Library of History 2.10, trans. C. H. Oldfather (1933)</cite></blockquote><p>The trouble is Babylon itself. Nebuchadnezzar left many inscriptions about his building works, and none mentions a garden. Robert Koldewey, who excavated the city from 1899 to 1917, identified a vaulted building in the Southern Palace as the substructure of the Gardens. Tablets found there turned out to record oil rations for foreign captives, including Jehoiachin, king of Judah, which suggests storerooms rather than a garden.</p><p>In 1994, and at book length in 2013, Stephanie Dalley of Oxford proposed a bold solution. The Gardens were real, she argues, but they stood at Nineveh, more than 400 km to the north, in the palace of the Assyrian king Sennacherib around 700 BCE. Sennacherib boasted of a garden that was a wonder for all peoples, fed by a canal system that included a stone aqueduct at Jerwan about 280 m long, and he describes casting great bronze devices to raise water, which Dalley reads as early water screws. A relief from Nineveh shows a garden planted on terraces and arches, fed by an aqueduct. Later Greek writers, she suggests, confused Assyrian Nineveh with Babylon.</p><p>Critics answer that Greek sources consistently say Babylon, that no garden structure has been excavated at Nineveh either, and that parts of Babylon near the river remain unexplored. Some think the Gardens were mainly a literary creation. The honest position is uncertainty: a real Mesopotamian royal garden probably lies behind the legend, but where, and how much it resembled the descriptions, is open.</p></section><section class="wsec" id="seven-wonders-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Zeus at Olympia: a god too big for his house</h3><p>Around 435 BCE the Athenian sculptor Pheidias made a seated Zeus for the god&#x27;s temple at Olympia, the sanctuary of the Olympic Games. Its core was a wooden framework covered with ivory for the skin and gold for the robes. Modern estimates put it at about 12 m high, inside a temple only about 20 m tall. Ancient visitors found it overwhelming, and slightly too big.</p><blockquote class="quote"><p>The artist is thought to have missed the proper symmetry, for he showed Zeus seated but almost touching the roof with his head, thus making the impression that if Zeus arose and stood erect he would unroof the temple.</p><cite>Strabo, Geography 8.3.30, trans. H. L. Jones (1927)</cite></blockquote><p>Keeping such a statue alive took maintenance. The traveller Pausanias, writing in the 2nd century CE, says the floor in front of it was paved with black stone and edged to hold a shallow pool of olive oil, which helped protect the ivory from the damp of the Olympian valley. He also records that the descendants of Pheidias held the hereditary job of cleaning the statue. A wonder, in other words, came with a staff.</p><p>The statue is gone, but its workshop was found. German excavators in the 1950s uncovered a building at Olympia with the same dimensions as the temple&#x27;s inner chamber, containing tools, fragments of ivory and glass, and clay moulds used to shape the golden drapery. A small black-glazed jug from the site is inscribed on its base &#x27;I belong to Pheidias&#x27;. Few ancient artists can be tied to a workshop so directly.</p><p>The end is less certain. The sanctuary declined after pagan festivals were banned in the late 4th century CE. One Byzantine tradition says the statue was taken to Constantinople and destroyed in a palace fire around 475 CE; another has it perishing with the temple at Olympia. Either way, nothing of it is known to survive.</p></section><section class="wsec" id="seven-wonders-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Artemis at Ephesus: the wonder that burned</h3><p>Antipater&#x27;s favourite was the Temple of Artemis at Ephesus, on the coast of modern Turkey. The first great marble temple there was begun around 550 BCE with gifts from Croesus, the fabulously rich king of Lydia. In 356 BCE a man named Herostratus set it on fire, by later accounts simply to make his name immortal. Ancient writers liked to add that it burned on the night Alexander the Great was born.</p><p>The Ephesians rebuilt it on the same plan and even larger. Pliny the Elder gives its size as 425 by 225 Roman feet, with 127 columns each 60 feet high, 36 of them carved with figures at the base. That makes a building about 125 m long and columns about 18 m tall. Damaged by Gothic raiders in the 260s CE and later quarried, it vanished into a marsh.</p><p>The English engineer John Turtle Wood searched for it for six years before finding its pavement in 1869, some 6 m below the surface. In 1904 and 1905 David Hogarth dug beneath the earliest levels and found a foundation deposit of small electrum coins, among the oldest coins in the world. Today a single column, reassembled from fragments, stands in a pond where storks nest.</p></section><section class="wsec" id="seven-wonders-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>The tomb that named all tombs</h3><p>Mausolus, a Persian-appointed ruler of Caria in southwest Anatolia, died in 353 BCE. His wife and sister Artemisia completed the tomb he had begun at his capital, Halicarnassus (modern Bodrum). Pliny says it was designed by the architects Satyros and Pytheos and decorated by four famous sculptors, Scopas, Bryaxis, Timotheus and Leochares, one on each side. It stood 140 Roman feet high by Pliny&#x27;s account, about 41 m, and modern reconstructions range up to about 45 m: a tall podium, a ring of columns, a stepped pyramid roof and, on top, a four-horse chariot.</p><p>It was grand enough to give its name to every monumental tomb since. Earthquakes had damaged it by the Middle Ages, and between the 1490s and 1520s the Knights of St John reused its stones and burned its marble for lime while building their Castle of St Peter in Bodrum. In 1856 and 1857 Charles Newton excavated the site and shipped surviving sculptures to the British Museum, including two colossal figures long nicknamed Mausolus and Artemisia.</p></section><section class="wsec" id="seven-wonders-s8"><h3 class="wsec-h"><span class="wsec-n">08</span>The Colossus did not straddle anything</h3><p>In 305 BCE the city of Rhodes survived a year-long siege by Demetrius, nicknamed the Besieger. To give thanks to their sun god Helios, the Rhodians sold the siege machines he abandoned and commissioned the sculptor Chares of Lindos to make a colossal bronze statue. It took 12 years.</p><blockquote class="quote"><p>This statue, fifty-six years after it was erected, was thrown down by an earthquake; but even as it lies, it excites our wonder and admiration. Few men can clasp the thumb in their arms, and its fingers are larger than most statues.</p><cite>Pliny the Elder, Natural History 34.41, trans. J. Bostock and H. T. Riley (1855)</cite></blockquote><p>Pliny gives its height as 70 cubits, about 33 m, a little shorter than the Statue of Liberty from heel to head. It fell in the earthquake of about 226 BCE, and according to Strabo an oracle warned the Rhodians not to raise it again. The pieces lay where they fell for roughly 800 years. A Byzantine chronicler says that in the 650s CE they were sold to a merchant who carried the bronze away on 900 camels.</p><p>How do you build a bronze giant? Pliny noticed that the broken limbs of the fallen statue gaped open and that large stones could be seen inside, which he took to be ballast used to steady it. The treatise attributed to Philo describes the figure being raised in place, course by course, with a mound of earth heaped around it as it grew, so that the workers were always on the ground. In 1956 the metalwork specialist Herbert Maryon argued that the skin was more probably made of hammered bronze plates fixed to an iron framework than of huge cast sections. The details are reconstruction, but a stone-weighted core inside an iron and bronze shell is the most widely accepted picture.</p><p>The famous image of the Colossus with one foot on each side of the harbour entrance comes from medieval travellers&#x27; tales and Renaissance engravings, not from ancient sources. It is also impossible as engineering: legs spread across a harbour mouth could not have carried a statue of that weight in bronze, and when it fell it would have blocked the port. Most scholars place it on land, either near the harbour or in the sanctuary of Helios; its exact site has not been found.</p></section><section class="wsec" id="seven-wonders-s9"><h3 class="wsec-h"><span class="wsec-n">09</span>The Pharos: a lighthouse that named all lighthouses</h3><p>The youngest wonder rose on the island of Pharos at the entrance to Alexandria&#x27;s harbour, completed around 280 BCE under the early Ptolemies. Pliny credits its design to Sostratus of Cnidus and says it cost 800 talents. It stood for over 1,500 years, long enough to be measured by Arab travellers. Al-Balawi, visiting in 1166, gave the base as about 30 m a side and described the octagonal and cylindrical stages above it.</p><figure class="wx wx--steps" id="seven-wonders-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">Building the Pharos, tier by tier</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Building the Pharos, tier by tier"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" class="wx-svg" role="img" aria-labelledby="seven-wonders-f2-t"><title id="seven-wonders-f2-t">The Pharos of Alexandria built up tier by tier: square base, octagon, cylinder, fire and statue</title><text x="16" y="24" class="wx-t-cap">Pharos of Alexandria · reconstruction</text><rect x="0" y="564" width="720" height="36" class="wx-water"/><path d="M0,578 C120,572 240,584 360,576 S600,582 720,574" class="wx-flow wx-s2"/><polygon points="86.8,568 99.7,556 280.3,556 297.5,568" class="wx-rock wx-edge"/><line x1="99.7" y1="556" x2="280.3" y2="556" class="wx-line"/><g class="wx-st wx-hide" data-s="4"><polygon points="190.0,169.0 0,119.0 0,219.0" class="wx-glow wx-o40 wx-sweep" style="--a:14;transform-origin:190.0px 169.0px"/></g><g class="wx-st" data-s="1"><rect x="125.5" y="310.9" width="129.0" height="245.1" class="wx-stone wx-edge"/><rect x="125.5" y="304.5" width="129.0" height="6.4" class="wx-stone2 wx-edge"/><rect x="155.3" y="521.6" width="5" height="9" class="wx-inkfill wx-o60"/><rect x="187.5" y="521.6" width="5" height="9" class="wx-inkfill wx-o60"/><rect x="219.7" y="521.6" width="5" height="9" class="wx-inkfill wx-o60"/><rect x="155.3" y="491.5" width="5" height="9" class="wx-inkfill wx-o60"/><rect x="187.5" y="491.5" width="5" height="9" class=" /><rect x="176.3" y="151.8" width="5" height="21.5" class="wx-inkfill wx-o80"/><rect x="187.5" y="151.8" width="5" height="21.5" class="wx-inkfill wx-o80"/><rect x="198.7" y="151.8" width="5" height="21.5" class="wx-inkfill wx-o80"/><path d="M169.4,143.2 L190.0,134.6 L210.6,143.2 Z" class="wx-stone2 wx-edge"/></g><g class="wx-st wx-hide" data-s="4"><circle cx="190.0" cy="169.0" r="10" class="wx-glow wx-o60 wx-pulse"/><path d="M185.0,177.6 q5,-14 5,-16 q4,8 5,16 z" class="wx-fire"/></g><g class="wx-st" data-s="5"><rect x="184.8" y="128.2" width="10.3" height="6.4" class="wx-stone2 wx-edge"/><path d="M187.0,128.2 L188.0,113.1 L186.0,112.2 L186.5,107.1 L193.5,107.1 L198.0,98.1 L194.0,112.2 L192.0,113.1 L193.0,128.2 Z" class="wx-bronze wx-edge"/><circle cx="190.0" cy="103.2" r="3.2" class="wx-bronze wx-edge"/></g><line x1="267.4" y1="556" x2="267.4" y2="548.7" class="wx-bold"/><circle cx="267.4" cy="546.7" r="1.8" class="wx-inkfill"/><text x="273.9" y="552" class="wx-t-s wx-halo">1.7 m</text><rect x="16" y="586" width="86.0" height="5" class="wx-paper wx-edge"/><rect x="16" y="586" width="43.0" height="5" class="wx-inkfill"/><text x="108.0" y="592" class="wx-t-s wx-halo">20 m</text><line x1="78.2" y1="100.2" x2="78.2" y2="556" class="wx-dim"/><line x1="69.6" y1="100.2" x2="86.8" y2="100.2" class="wx-dim"/><line x1="69.6" y1="556" x2="86.8" y2="556" class="wx-dim"/><text x="73.9" y="319.5" text-anchor="end" class="wx-t-n" >c. 100 m</text><text x="73.9" y="333.5" text-anchor="end" class="wx-t-s">or more</text><g class="wx-st" data-s="1"><line x1="258.5" y1="427.0" x2="354" y2="427.0" class="wx-thin"/><circle cx="364" cy="427.0" r="9" class="wx-num"/><text x="364" y="431.0" text-anchor="middle" class="wx-numt">1</text><text x="378" y="431.0" class="wx-t-b wx-halo">Square base</text><text x="378" y="446.0" class="wx-t-s wx-halo">c. 30 m a side (al-Balawi, 1166)</text><text x="378" y="460.0" class="wx-t-s wx-halo">internal ramp, rooms and windows</text></g><g class="wx-st" data-s="2"><line x1="229.3" y1="246.4" x2="354" y2="246.4" class="wx-thin"/><circle cx="364" cy="246.4" r="9" class="wx-num"/><text x="364" y="250.4" text-anchor="middle" class="wx-numt">2</text><text x="378" y="250.4" class="wx-t-b wx-halo">Octagonal tier</text><text x="378" y="265.4" class="wx-t-s wx-halo">c. 16 m across</text></g><g class="wx-st" data-s="3"><line x1="212.7" y1="153.9" x2="354" y2="153.9" class="wx-thin"/><circle cx="364" cy="153.9" r="9" class="wx-num"/><text x="364" y="157.9" text-anchor="middle" class="wx-numt">3</text><text x="378" y="157.9" class="wx-t-b wx-halo">Cylindrical lantern</text><text x="378" y="172.9" class="wx-t-s wx-halo">c. 8.7 m in diameter</text></g><g class="wx-st" data-s="4"><line x1="206.9" y1="169.0" x2="354" y2="212.0" class="wx-thin"/><circle cx="364" cy="212.0" r="9" class="wx-num"/><text x="364" y="216.0" text-anchor="middle" class="wx-numt">4</text><text x="378" y="216.0" class="wx-t-b wx-halo">Fire by night</text><text x="378" y="231.0" class="wx-t-s wx-halo">accounts also mention a mirror by day</text></g><g class="wx-st" data-s="5"><line x1="211.2" y1="108.8" x2="354" y2="108.8" class="wx-thin"/><circle cx="364" cy="108.8" r="9" class="wx-num"/><text x="364" y="112.8" text-anchor="middle" class="wx-numt">5</text><text x="378" y="112.8" class="wx-t-b wx-halo">Statue on top</text><text x="378" y="127.8" class="wx-t-s wx-halo">Zeus or Poseidon, per Roman coins</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Square base: a tower about 30 m a side, with an internal ramp, rooms and windows (al-Balawi, 1166).</p><ol class="wx-steplist"><li>Square base: a tower about 30 m a side, with an internal ramp, rooms and windows (al-Balawi, 1166).</li><li>Octagonal tier: a narrower eight-sided stage about 16 m across.</li><li>Cylindrical top: a round lantern about 8.7 m in diameter.</li><li>Fire and mirror: a fire burned at night; medieval writers also describe a mirror reflecting sunlight by day.</li><li>Statue: Roman coins show a figure on the summit, probably Zeus or Poseidon. Total height c. 100 m or more.</li></ol><figcaption>A reconstruction of the lighthouse after medieval Arab descriptions and Roman coins. Tier widths follow al-Balawi; tier heights are proportioned after classic reconstructions and are uncertain. <span class="wx-src">Based on: Al-Balawi (1166) as summarised in modern studies; Thiersch 1909 reconstruction for proportions; Alexandrian coins; Empereur 1998. Heights of the individual tiers are estimates.</span></figcaption><p class="vh">Elevation of the Pharos of Alexandria on a rocky base above the sea, with a 20 m scale bar and a 1.7 m person. Step 1: a tall square tier about 30 m wide with rows of windows. Step 2: an octagonal tier about 16 m across. Step 3: a cylindrical lantern about 8.7 m in diameter with openings. Step 4: a fire in the lantern, with a pale beam sweeping out over the sea. Step 5: a statue on the summit. A dimension line gives the total height as about 100 m or more.</p></figure><p>Why build it so tall? The Egyptian coast around Alexandria is low, flat and lined with shoals, and a sailor approaching from the open Mediterranean had almost nothing to steer by. A tower visible from far out at sea by day, and marked by a fire at night, turned a dangerous approach into a routine one for the grain ships that fed the Mediterranean world. It was a monument, but also very practical infrastructure.</p><p>The tower&#x27;s three stages, a square base, an octagonal middle and a round top, are a pattern repeated in minarets and later lighthouses. A fire burned at the summit at night, and several medieval accounts speak of a great mirror by day. Roman coins of Alexandria show a statue on top, identified as Zeus or Poseidon. Estimates of the total height cluster around 100 m, with Arab accounts implying about 103 to 118 m.</p><p>Earthquakes brought it down in stages: one in 956 toppled the top, a severe one in 1303 wrecked it, and by the mid-14th century the traveller Ibn Battuta found it too ruined to enter. In 1477 the Mamluk sultan Qaitbay built a fort on the site, using its stones. Since 1994, divers led by Jean-Yves Empereur have mapped the seabed beside the fort, finding granite blocks of 49 to 60 tonnes, sphinxes, obelisks and colossal Ptolemaic statues. In 2025, parts of the entrance and foundation paving were lifted for a project to rebuild the tower digitally.</p><aside class="wcall"><b>Words that survived</b><p>The Pharos outlived its stones in language. The French phare, Italian and Spanish faro and Portuguese farol all mean lighthouse and all come from the name of the island. The Mausoleum did the same for tombs. Two of the seven are ruins, but they are still in our dictionaries.</p></aside></section><section class="wsec" id="seven-wonders-s10"><h3 class="wsec-h"><span class="wsec-n">10</span>What remains uncertain</h3><ul class="wlist"><li>Where the Hanging Gardens were, if they were one real place: Babylon, Nineveh, or partly a literary composite.</li><li>The exact pose and location of the Colossus of Rhodes.</li><li>The Pharos&#x27;s exact height and the true nature of its famous &#x27;mirror&#x27;.</li><li>The fate of Pheidias&#x27;s Zeus after Olympia.</li></ul><p>The mystery rating for the set is 3 out of 5, and almost all of that comes from the Gardens. For the other six, the evidence ranges from very good (the pyramid, the Mausoleum sculptures, the Pharos blocks) to decent (the Colossus, known mainly from texts). Together they show what ancient builders prized: height, costly materials, famous artists, and above all the power to make a visitor stop and stare.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">2,560 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Great Pyramid completed for Khufu</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">690 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Sennacherib&#x27;s palace garden at Nineveh (Dalley&#x27;s candidate)</span></li><li class="wtl-build" style="--i:2"><span class="wtl-y">590 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Nebuchadnezzar II rebuilds Babylon (traditional Gardens date)</span></li><li class="wtl-build" style="--i:3"><span class="wtl-y">550 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Archaic Temple of Artemis begun with Croesus&#x27; support</span></li><li class="wtl-build" style="--i:4"><span class="wtl-y">435 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Pheidias makes the Zeus at Olympia (c. 435 BCE)</span></li><li class="wtl-loss" style="--i:5"><span class="wtl-y">356 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Herostratus burns the Temple of Artemis</span></li><li class="wtl-build" style="--i:6"><span class="wtl-y">350 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Mausoleum at Halicarnassus under construction</span></li><li class="wtl-build" style="--i:7"><span class="wtl-y">280 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Colossus of Rhodes and Pharos of Alexandria completed (approx.)</span></li><li class="wtl-loss" style="--i:8"><span class="wtl-y">226 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Earthquake topples the Colossus</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">100 BCE</span><span class="wtl-k">Studied</span><span class="wtl-t">Antipater of Sidon&#x27;s epigram lists the wonders (approx.)</span></li><li class="wtl-loss" style="--i:10"><span class="wtl-y">1303 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Earthquake wrecks the Pharos</span></li><li class="wtl-loss" style="--i:11"><span class="wtl-y">1494 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Knights of St John reuse Mausoleum stone for Bodrum castle</span></li><li class="wtl-find" style="--i:12"><span class="wtl-y">1869 CE</span><span class="wtl-k">Found</span><span class="wtl-t">J. T. Wood locates the Temple of Artemis</span></li><li class="wtl-find" style="--i:13"><span class="wtl-y">1994 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Underwater survey of the Pharos site begins</span></li></ol><figure class="wbars"><h4 class="wx-title">Heights of the wonders, best estimates</h4><div class="wb-r" style="--w:100.0%;--i:0"><div class="wb-l">Great Pyramid<small>measured (original)</small></div><div class="wb-t"><i></i><span>146.6 m</span></div></div><div class="wb-r" style="--w:68.2%;--i:1"><div class="wb-l">Pharos of Alexandria<small>estimate; Arab accounts imply 103 to 118 m</small></div><div class="wb-t"><i></i><span>100 m</span></div></div><div class="wb-r" style="--w:30.7%;--i:2"><div class="wb-l">Mausoleum<small>Pliny&#x27;s 140 feet</small></div><div class="wb-t"><i></i><span>45 m</span></div></div><div class="wb-r" style="--w:22.5%;--i:3"><div class="wb-l">Colossus of Rhodes<small>70 cubits (Pliny)</small></div><div class="wb-t"><i></i><span>33 m</span></div></div><div class="wb-r" style="--w:12.3%;--i:4"><div class="wb-l">Temple of Artemis columns<small>60 feet (Pliny)</small></div><div class="wb-t"><i></i><span>18 m</span></div></div><div class="wb-r" style="--w:8.2%;--i:5"><div class="wb-l">Statue of Zeus<small>modern estimate, seated</small></div><div class="wb-t"><i></i><span>12 m</span></div></div><figcaption>Source: Petrie 1883; Pliny, Natural History 34.41, 36.30-31, 36.95; Clayton and Price 1988. The Hanging Gardens are omitted because no reliable height exists.</figcaption></figure><h3 class="sub-h wsub">The big debates</h3><div class="debate"><p class="debate-q">Were the Hanging Gardens really at Nineveh?</p><div class="sides"><div class="side"><b>Yes: the Greek accounts describe Sennacherib&#x27;s garden at Nineveh.</b><span>Sennacherib&#x27;s inscriptions on his garden, canals, Jerwan aqueduct and bronze water-raising devices; a Nineveh relief of an irrigated terraced garden; the silence of Babylonian texts (Dalley 1994, 2013).</span></div><div class="side"><b>No, or not shown: the Gardens were at Babylon, or largely literary.</b><span>Every classical source names Babylon; Berossus was a Babylonian; no garden structure has been excavated at Nineveh; parts of Babylon remain unexcavated.</span></div></div><p class="debate-why"><b>The bold claim:</b> The Hanging Gardens of Babylon were actually Sennacherib&#x27;s gardens at Nineveh.</p><div class="meter" style="--pos:41.7%" role="img" aria-label="Weight of evidence: Open question"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Dalley&#x27;s case is careful and fits the Assyrian texts and images well, and it explains the Babylonian silence. But it relies on the Greek writers having confused two cities, and there is no excavated garden at Nineveh to confirm it. Leading specialists remain divided.</p></div><div class="debate"><p class="debate-q">Did the Colossus straddle the harbour?</p><div class="sides"><div class="side"><b>Yes: it stood astride the harbour mouth, with ships sailing between its legs.</b><span>Medieval travellers&#x27; stories and Renaissance engravings such as van Heemskerck&#x27;s.</span></div><div class="side"><b>No: it stood on land.</b><span>No ancient source describes the pose; bronze legs spread across a harbour mouth could not carry the load; a fall would have blocked the harbour; ancient accounts describe the statue lying on the ground for centuries.</span></div></div><p class="debate-why"><b>The bold claim:</b> The Colossus of Rhodes stood with one foot on each side of the harbour entrance.</p><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The image appears more than a thousand years after the statue fell. Ancient writers who saw its fallen pieces never mention a harbour pose, and the engineering of a 33 m bronze with its legs spread over open water does not work. Its exact site and pose are unknown, but a straddle is ruled out.</p></div><div class="debate"><p class="debate-q">Could the Pharos&#x27;s mirror burn ships?</p><div class="sides"><div class="side"><b>Yes: a great mirror focused sunlight to set enemy ships on fire.</b><span>Medieval Arab and later European legends about the Pharos mirror.</span></div><div class="side"><b>No: at most a polished surface to reflect daylight or firelight as a signal.</b><span>No ancient source mentions the weapon; focusing enough sunlight to ignite a ship at sea from a tower would need an enormous, precisely curved mirror aimed at a moving target.</span></div></div><p class="debate-why"><b>The bold claim:</b> The Pharos of Alexandria carried a mirror that burned enemy ships at sea.</p><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The mirror is reported only in medieval accounts written long after the tower had been damaged, and the burning story belongs to the same legendary tradition as Archimedes&#x27; death ray. A reflector for signalling is plausible; a ship-burning weapon has no evidence behind it.</p></div><details class="srcs"><summary>Sources for this deep dive (15)</summary><ol><li>Clayton, P. A. &amp; Price, M. J. (eds) (1988). The Seven Wonders of the Ancient World. Routledge.</li><li>Antipater of Sidon, Greek Anthology 9.58, in The Greek Anthology, vol. 3, trans. W. R. Paton (1917). Loeb Classical Library.</li><li>Pliny the Elder, Natural History, trans. J. Bostock &amp; H. T. Riley (1855). Books 34 and 36.</li><li>Strabo, Geography, vol. 4, trans. H. L. Jones (1927). Loeb Classical Library.</li><li>Diodorus Siculus, Library of History, vol. 1, trans. C. H. Oldfather (1933). Loeb Classical Library.</li><li>Dalley, S. (1994). Nineveh, Babylon and the Hanging Gardens: cuneiform and classical sources reconciled. Iraq 56: 45-58. <a href="https://doi.org/10.2307/4200384" target="_blank" rel="noopener">doi:10.2307/4200384</a></li><li>Dalley, S. (2013). The Mystery of the Hanging Garden of Babylon: An Elusive World Wonder Traced. Oxford University Press.</li><li>Reade, J. (2000). Alexander the Great and the Hanging Gardens of Babylon. Iraq 62: 195-217.</li><li>Jacobsen, T. &amp; Lloyd, S. (1935). Sennacherib&#x27;s Aqueduct at Jerwan. Oriental Institute Publications 24. University of Chicago Press.</li><li>Mallwitz, A. &amp; Schiering, W. (1964). Die Werkstatt des Pheidias in Olympia. Olympische Forschungen 5. De Gruyter.</li><li>Wood, J. T. (1877). Discoveries at Ephesus. Longmans, Green &amp; Co.</li><li>Jeppesen, K. et al. (1981-2004). The Maussolleion at Halikarnassos. Reports of the Danish Archaeological Expedition to Bodrum. Jutland Archaeological Society.</li><li>Maryon, H. (1956). The Colossus of Rhodes. Journal of Hellenic Studies 76: 68-86.</li><li>Empereur, J.-Y. (1998). Alexandria Rediscovered. British Museum Press.</li><li>Thiersch, H. (1909). Pharos: Antike, Islam und Occident. Teubner, Leipzig.</li></ol></details><aside class="rc-cite" data-v="marvels" data-id="marvel-seven-wonders" data-t="The Seven Wonders of the Ancient World"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Seven Wonders of the Ancient World</i>. <span class="cite-u">https://residual-continuum.vercel.app/#marvels/marvel-seven-wonders</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="marvel-roman-concrete-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="2015-Heerlen, Thermenmuseum, Romeins beton (retouched).png" data-cap="A piece of Roman concrete" data-big><figcaption></figcaption></figure><div class="sh-k">Roman Mediterranean</div><h2 class="sh-t" id="marvel-roman-concrete-st" tabindex="-1">Roman concrete</h2><p class="sh-s">Harbour piers that have sat in seawater for 2,000 years, and white lumps once dismissed as sloppy mixing that may be tiny repair kits.</p><div class="sh-v"><span class="vstamp vstamp--mys">Mystery <span class="pips" role="img" aria-label="Mystery level 1 of 5"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></span></span></div></div><div class="wquick"><h3 class="sub-h">The quick read</h3><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="2" >2</b><span class="ctr-u"> : 1</span></div><div class="ctr-l">volcanic ash to lime, Vitruvius&#x27; recipe for sea work</div><div class="ctr-c">Vitruvius 5.12.2, trans. Morgan 1914</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="0.5" data-dec="1">0.5</b><span class="ctr-u"> mm</span></div><div class="ctr-l">wide cracks that resealed in lab tests</div><div class="ctr-c">Seymour et al. 2023</div></div><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="200" >200</b><span class="ctr-u"> °C</span></div><div class="ctr-l">local temperatures inside hot-mixed mortar</div><div class="ctr-c">Seymour et al. 2023</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="35000" >35,000</b><span class="ctr-u"> m³</span></div><div class="ctr-l">of concrete in Herod&#x27;s harbour at Caesarea</div><div class="ctr-c">ROMACONS Caesarea report 2005</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="1450" >1,450</b><span class="ctr-u"> °C</span></div><div class="ctr-l">to make Portland clinker, vs c. 900 °C for Roman lime</div><div class="ctr-c">Jackson et al. 2018</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="8" >8</b><span class="ctr-u"> %</span></div><div class="ctr-l">of global CO₂ emissions come from cement today</div><div class="ctr-c">Lehne &amp; Preston 2018</div></div></div><div class="stats"><div><b>2 parts volcanic ash to 1 part lime</b><span>Vitruvius&#x27; marine recipe</span></div><div><b>c. 2,000 years in seawater (Bay of Naples, 1st century BCE)</b><span>Oldest cored harbour concrete</span></div><div><b>white lumps, millimetres to centimetres across</b><span>Lime clasts</span></div><div><b>cracks c. 0.5 mm wide stopped leaking within weeks</b><span>Healing test (2023)</span></div><div><b>lime c. 900 °C vs Portland clinker c. 1,450 °C</b><span>Kiln temperature</span></div><div><b>c. 8% today</b><span>Cement&#x27;s share of global CO₂</span></div><div><b>dry premixed lime and ash piles, frozen by the eruption of 79 CE</b><span>Pompeii building site (2025)</span></div></div><p>Roman builders burned limestone into quicklime, then combined it with volcanic ash (pozzolana) and chunks of rock or broken brick. Instead of pouring a fluid slurry, they laid the mortar and tamped the aggregate in by hand, layer by layer, behind timber formwork or brick facings. Evidence from Privernum and from an unfinished house at Pompeii suggests many crews used &#x27;hot mixing&#x27;: quicklime blended dry with ash and only then wetted, which releases heat, speeds setting and leaves behind white, calcium-rich lime clasts. For harbours, the lime and ash mortar was lowered into flooded wooden forms and set underwater. Over centuries, seawater percolating through the concrete dissolved some of the volcanic material and grew new interlocking minerals, including aluminous tobermorite and phillipsite.</p><div class="flip" id="marvel-roman-concrete-flip"><div class="flip-in"><div class="flip-f"><b>The myth</b><p>Roman concrete is a lost super-material, stronger than anything we can make, whose secret recipe modern science cannot crack.</p></div><div class="flip-b"><b>The reality</b><p>The basic recipe was written down by Vitruvius and has been reproduced in the lab and at sea. Roman concrete is weaker in compression than modern structural concrete. Its real advantages are chemical: volcanic ash that keeps reacting, lime clasts that can reseal cracks, and no steel inside to rust. The open questions are about details, such as how widespread hot mixing was and how recipes varied from site to site.</p></div></div><button type="button" class="flip-btn" aria-pressed="false" onclick="flip('marvel-roman-concrete-flip',this)">Flip it</button></div><div class="twist"><b>Wow</b><p>A breakwater poured around 50 BCE in the Bay of Naples still stands, and inside it crystals that are hard to make even in a modern lab have been growing out of seawater.</p></div><div class="wmys"><span>Mystery meter</span><span class="pips" role="img" aria-label="Mystery level 1 of 5"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></span><small>Mostly solved</small></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">11 min read · 2,411 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Roman concrete"><button type="button" class="wtoc-i" data-go="roman-concrete-s1">The lumps everybody ignored</button><button type="button" class="wtoc-i" data-go="roman-concrete-s2">Dust from Puteoli</button><button type="button" class="wtoc-i" data-go="roman-concrete-s3">Pouring stone into the sea</button><button type="button" class="wtoc-i" data-go="roman-concrete-s4">Crystals that grow out of seawater</button><button type="button" class="wtoc-i" data-go="roman-concrete-s5">Hot mixing and the crack that heals itself</button><button type="button" class="wtoc-i" data-go="roman-concrete-s6">A building site frozen in 79 CE</button><button type="button" class="wtoc-i" data-go="roman-concrete-s7">Why your concrete cracks and theirs sometimes does not</button><button type="button" class="wtoc-i" data-go="roman-concrete-s8">Busting the super-concrete myth</button></nav></div><section class="wsec" id="roman-concrete-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The lumps everybody ignored</h3><p>Pick up a fist-sized chunk of Roman concrete and you will see grey volcanic grit, dark nuggets of rock, perhaps a red sliver of broken tile. Look closer and you will also see white specks, some as small as a grain of rice, some the size of a pea. For more than a century, archaeologists and engineers glanced at these lime clasts and shrugged. They looked like the Roman equivalent of lumps in gravy: evidence that someone in a hurry had not stirred the mortar properly.</p><p>That shrug turned out to be a mistake. In 2023 a team led by Admir Masic at MIT studied samples from a city wall at Privernum, south-east of Rome, and argued that the white lumps were not sloppiness but a signature. They were the leftovers of a particular way of making mortar, and they may be part of the reason so much Roman concrete is still standing. Two years later the same group walked onto a Roman building site at Pompeii that had been abandoned mid-job in 79 CE, and found the raw materials still sitting in piles.</p><blockquote class="wpull"><p>The white specks that looked like lazy mixing may be a built-in repair kit, waiting centuries for a crack.</p></blockquote><p>This is the story of a material that built harbours, aqueducts, markets and the largest unreinforced concrete dome on Earth. It is also a story about how much you can learn by taking old claims, and old lumps, seriously. Roman concrete is not magic, and it is not simply &#x27;stronger&#x27; than ours. But it does things modern concrete struggles with, and chemists are only now working out how.</p></section><section class="wsec" id="roman-concrete-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Dust from Puteoli</h3><p>The Romans did not invent lime mortar; builders around the Mediterranean had burned limestone for centuries. Heat limestone to around 900 °C and it gives off carbon dioxide and turns into quicklime, a caustic white powder. Add water and it becomes slaked lime, which slowly hardens again by soaking up carbon dioxide from the air. That is fine for plaster, but it sets slowly and never under water.</p><p>The breakthrough came from the volcanic landscape around the Bay of Naples. Mix lime with the right volcanic ash and the ash&#x27;s glassy, silica- and alumina-rich particles react with the lime to form a hard binder, even in wet conditions. The Romans called the best of it pulvis Puteolanus, the dust of Puteoli (modern Pozzuoli), and we still call such materials pozzolans. By the 2nd century BCE builders in Campania and Rome were using lime and ash mortars packed with chunks of tuff, the soft volcanic stone the region is made of.</p><blockquote class="quote"><p>There is also a kind of powder which from natural causes produces astonishing results. ... This substance, when mixed with lime and rubble, not only lends strength to buildings of other kinds, but even when piers of it are constructed in the sea, they set hard under water.</p><cite>Vitruvius, De architectura 2.6.1, trans. M. H. Morgan (1914)</cite></blockquote><p>Vitruvius, writing in the 20s BCE, even gives a recipe for marine work: take the powder from the country between Cumae and the promontory of Minerva and mix it &#x27;in the proportion of two to one&#x27;, two parts ash to one of lime. A century later Pliny the Elder, who would die in the eruption of 79 CE, sounded almost indignant that such a humble material should be so powerful. Who could marvel enough, he asked, that the dust of the hills of Puteoli, once submerged, &#x27;turns into a single mass of stone that withstands the attacks of the waves and becomes stronger every day&#x27; (Natural History 35.166, trans. H. Rackham, 1952).</p><p>It is worth noticing how the Romans actually built with it. Modern concrete is poured as a fluid and flows around steel bars. Roman builders usually laid a bed of stiff mortar, then set fist-sized pieces of stone or brick into it, called caementa, and tamped them down, course after course. On land the concrete core was often hidden behind a facing of brick or small stone blocks. The word &#x27;cement&#x27; comes from those rubble chunks, not from the binder.</p></section><section class="wsec" id="roman-concrete-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Pouring stone into the sea</h3><p>The boldest use of the new material was in harbours. Between 2002 and 2009 the Roman Maritime Concrete Study (ROMACONS), led by Christopher Brandon, Robert Hohlfelder, Marie Jackson and John Peter Oleson, drilled cores out of Roman piers, breakwaters and pilae (free-standing concrete blocks) at sites from Italy to Israel, Egypt, Crete and Turkey. They found blocks of remarkable size. Off Nisida in the Bay of Naples one pila has sides of up to 15.2 m and stands over 9.5 m tall. At Portus Iulius, the naval harbour Agrippa built in the 30s BCE, the outer pila measures about 10 by 10 m and more than 6 m high.</p><figure class="wx wx--static" id="roman-concrete-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Section through a Roman harbour pila</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Section through a Roman harbour pila"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" class="wx-svg" role="img" aria-labelledby="roman-concrete-f2-t"><title id="roman-concrete-f2-t">Section through a Roman harbour pila under construction</title><defs><marke class="wx-t wx-halo">basket of mortar,</text><text x="566" y="290" class="wx-t wx-halo">lowered and tipped</text><line x1="500.0" y1="343.5" x2="560" y2="343.5" class="wx-thin"/><text x="566" y="339.5" class="wx-t wx-halo">tuff chunks tamped</text><text x="566" y="354.5" class="wx-t wx-halo">into lime + volcanic</text><text x="566" y="369.5" class="wx-t wx-halo">ash mortar</text><text x="566" y="438" class="wx-t-m">set under water:</text><text x="566" y="453" class="wx-t-m">no drying needed</text><path d="M552,209.2 L552,418.0" class="wx-dim" marker-start="url(#roman-concrete-f2-ah)" marker-end="url(#roman-concrete-f2-ah)"/><line x1="550.0" y1="209.2" x2="560" y2="209.2" class="wx-thin"/><text x="566" y="213.2" class="wx-t-n">over 6 m</text><path d="M190.0,478.0 L530.0,478.0" class="wx-dim" marker-start="url(#roman-concrete-f2-ah)" marker-end="url(#roman-concrete-f2-ah)"/><line x1="190.0" y1="466.0" x2="190.0" y2="484.0" class="wx-thin"/><line x1="530.0" y1="466.0" x2="530.0" y2="484.0" class="wx-thin"/><text x="360" y="496" class="wx-t-n" text-anchor="middle">c. 10 m</text><rect x="26" y="494" width="170" height="6" class="wx-inkfill"/><rect x="26" y="494" width="85" height="6" class="wx-card wx-edge"/><text x="26" y="516" class="wx-t-s">0</text><text x="196" y="516" class="wx-t-s" text-anchor="middle">5 m</text><text x="694" y="516" class="wx-t-s" text-anchor="end">layer bands drawn simplified</text></svg></div></div><figcaption>Mortar of lime and volcanic ash was lowered into a flooded timber form and tuff chunks were tamped in, layer by layer, until the block rose above the sea. <span class="wx-src">Based on: Dimensions after the Portus Iulius outer pila (sides 9.6–11.1 m, over 6 m high) and ROMACONS field reports (Oleson et al. 2006; Brandon et al. 2014); placement method after the 2004 Brindisi experiment. Layer bands simplified.</span></figcaption><p class="vh">Cross-section of a square concrete block, about 10 m wide, standing on the seabed in about 5 m of water. Timber posts driven into the seabed hold a lining of planks on both sides. Inside, seven horizontal bands of mortar packed with tuff chunks rise from the seabed; a dashed outline shows later layers reaching over 6 m. Seawater fills the rest of the form. A worker stands on a timber platform above; a rope from an A-frame lowers a basket of mortar into the water. Dimension lines and a 5 m scale bar give the size.</p></figure><p>How do you place concrete in the sea? Vitruvius describes driving a cofferdam of oak stakes with ties between them into the water, and the cores and timber impressions show several solutions in practice. In one common approach, the &#x27;flooded form&#x27;, a box of posts and planks was built on the seabed and the mortar was simply lowered into the seawater inside it, where it set without ever drying out. At Caesarea in Judaea, Herod&#x27;s engineers went further, building double-walled wooden boxes about 11 by 15 by 4 m on shore, towing them out and sinking them, and casting barge-shaped forms full of concrete. One block from the North Breakwater measures roughly 15 by 11.5 by 2 m.</p><p>Caesarea is also a lesson in logistics. The ROMACONS team estimates the harbour needed around 35,000 cubic metres of concrete, and the volcanic ash in it came from the Bay of Naples, shipped across roughly 2,000 km of sea. Timber from a pila at Baia has been radiocarbon dated to about 50 BCE, so some of these structures have been sitting in salt water for two thousand years.</p><aside class="wcall"><b>How do we know? Building a pila the Roman way</b><p>In 2004 the ROMACONS team built a test pila in the harbour of Brindisi: a wooden form about 2 by 2 by 2 m, in water about 1.7 m deep. They mixed two parts pozzolana from Bacoli with one part lime using seawater, lowered the mortar in wicker baskets with trip lines, laid it in layers about 20 cm thick and threw tuff chunks in by hand, tamping as they went. About 8 m³ of concrete took 273 person-hours. Cores drilled later let them compare their block with the ancient ones.</p></aside></section><section class="wsec" id="roman-concrete-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Crystals that grow out of seawater</h3><p>Modern concrete does not love the sea. Salt water attacks the cement paste and, above all, the steel reinforcement inside it. Roman harbour concrete seems to have made peace with its environment instead, and Marie Jackson&#x27;s team at the University of Utah has spent years working out why.</p><p>In 2013 they reported aluminous tobermorite, a rare layered calcium silicate mineral, in the lime-rich parts of a breakwater from the Baianus Sinus in the Bay of Naples. Tobermorite is prized in engineering because its crystals are strong and platy, but making it synthetically usually requires high temperatures. In 2017, working on cores from the Baianus Sinus and Portus Neronis breakwaters and a pier at Portus Cosanus in Tuscany, they reported something stranger: tobermorite and a zeolite mineral called phillipsite had also grown later, at ordinary seawater temperatures, inside pores, in cracks and in the altered edges of volcanic crystals and pumice.</p><p>Their interpretation is a slow, continuous reaction. Seawater percolates through the concrete, dissolves some of the volcanic glass and minerals, and the resulting alkaline fluids precipitate new, interlocking crystals. In other words, the sea that should be destroying the structure appears to be feeding it. Jackson&#x27;s team has pointed out that this is what Pliny described: a mass of stone &#x27;stronger every day&#x27;. He meant it as rhetoric, but the chemistry is now consistent with him.</p><blockquote class="wpull"><p>The sea that should be destroying the pier appears to be feeding it, one crystal at a time.</p></blockquote><p>It is important not to overstate this. The new minerals are observed in a handful of sampled structures, and &#x27;growing crystals&#x27; is not the same as a measured increase in strength over centuries. The work does suggest, though, that the volcanic ash was not just a filler. It was a reactive ingredient that kept working long after the builders went home.</p></section><section class="wsec" id="roman-concrete-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Hot mixing and the crack that heals itself</h3><p>Back on dry land, the Privernum samples posed a different question: what are the white lime clasts? Vitruvius and Pliny both talk about lime that has been slaked (soaked in water) before use, and scholars long assumed Roman builders worked the same way. If you start with well-slaked lime paste, you should not get chunky white lumps.</p><p>Linda Seymour, Admir Masic and colleagues mapped the clasts with electron microscopy and Raman spectroscopy and found textures that point to high temperatures. Their proposal, published in Science Advances in 2023, is &#x27;hot mixing&#x27;: quicklime, not only slaked lime, was mixed with the ash and aggregate, and then water was added. Quicklime reacts violently with water, heating the whole batch by roughly 55–60 °C and, locally, to more than 200 °C. That heat speeds up setting, allows chemical reactions that would not happen in a cold mix, and leaves behind brittle, porous nodules of calcium-rich material: the lime clasts.</p><figure class="wx wx--steps" id="roman-concrete-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">How a lime clast heals a crack</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How a lime clast heals a crack"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" class="wx-svg" role="img" aria-labelledby="roman-concrete-f1-t"><title id="roman-concrete-f1-t">How a lime clast heals a crack in Roman concrete</title><text x="40" y="22" class="wx-t-cap">Inside a cracked Roman mortar, magnified (schematic)</text><rect x="40" y="56" width="43
