 686.5,201.5 686.5,222.4 680.8,222.4 680.8,306" /><path class="wx-line" d="M678.9,226.2 Q676.2,250.9 663.7,262.3"/><path class="wx-thin" d="M663.7,263.2 h-4 M663.7,266.2 h-4"/><path class="wx-bold" d="M658,268.9 L680.8,268.9"/><path class="wx-c6 wx-o60 wx-edge-soft" d="M665.4,270.9 L673.4,270.9 Q674.4,283.9 671.4,291.9 L669.4,297.9 L667.4,291.9 Q664.4,283.9 665.4,270.9 Z"/><g ><circle class="wx-line" cx="701" cy="292.9" r="2.9"/><path class="wx-line" d="M701,295.8 L701,307 M696.5,322 L701,307 L705.5,322 M695.6,304.7 L701,298.3 L706.4,304.7"/></g><path class="wx-bold" d="M696,304 L687,298"/><path class="wx-thin" d="M670.2,250.9 L606,150"/><text class="wx-t-s" x="603" y="150" text-anchor="end">arm</text><path class="wx-thin" d="M658,268.9 L606,196"/><text class="wx-t-s" x="603" y="199" text-anchor="end">belt</text><path class="wx-thin" d="M666.4,281.9 L606,236"/><text class="wx-t-s" x="603" y="240" text-anchor="end">fox pelt</text></g><text class="wx-t-s wx-st" data-s="4" x="522" y="362" text-anchor="middle">pedestal with socket</text><g><rect class="wx-inkfill" x="16" y="390" width="19" height="5"/><rect class="wx-paper wx-edge" x="35" y="390" width="19" height="5"/><text class="wx-t-s" x="60" y="396">2 m (front edge)</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Mark and trench: on the limestone plateau beside the site, workers outline a T-shaped slab and cut a channel around it with flint and stone tools.</p><ol class="wx-steplist"><li>Mark and trench: on the limestone plateau beside the site, workers outline a T-shaped slab and cut a channel around it with flint and stone tools.</li><li>Split it free: the rock&#x27;s natural flat bedding helps. Wedges and wooden levers probably lifted the slab off its bed.</li><li>Haul: the quarries lie on the same plateau, only a short way off, so ropes, rollers or sledges and many hands could move a pillar of up to about 10 t.</li><li>Raise: the foot goes into a socket in a pedestal and the top is hauled upright with ropes and props. This is a proposed method, not a recorded one.</li><li>Carve: arms, hands, belts and fox-pelt loincloths in low relief turn the pillar into a stylised figure. Some carving may have happened before raising.</li></ol><figcaption>Tap through the five stages: quarrying, splitting, hauling, raising and carving. Steps 3 and 4 show likely methods; no ropes or levers survive. <span class="wx-src">Based on: Pillar dimensions from DAI publications; quarry evidence as described by Schmidt 2012; transport and raising methods are inferences.</span></figcaption><p class="vh">A strip drawing of the limestone plateau from quarry on the left to enclosure on the right. Step 1: a T-shaped outline is trenched into the bedrock by workers. Step 2: the slab is levered up along a bedding plane. Step 3: the pillar lies on wooden rollers and is pulled by people with ropes. Step 4: the pillar is tipped upright into a socket in a pedestal, with a prop and ropes. Step 5: the pillar stands upright with carved arm, belt and fox pelt while a person carves it.</p></figure><p>Moving and raising a 10-tonne stone without metal or the wheel sounds heroic, but the distances were short, because the quarries lie on the same plateau. Ropes, wooden levers, rollers or sledges and a few dozen people would have been enough, though no ropes or sledges survive and the exact method is inferred rather than observed. The central pillars were then stood in their pedestals. Whether the reliefs were carved before or after raising is unclear; some details, like the hands wrapping around onto the front face, look easier to finish with the pillar upright.</p><p>Who fed the workers? Here the evidence is unusually concrete. A 2019 study led by Laura Dietrich analysed more than 7,000 grinding-stone artefacts from the site, including almost 3,400 handstones. Most were standardised tools worn in ways typical of grinding cereals. The authors argue that large quantities of porridge, bread-like food and possibly beer were produced for work feasts. An earlier study found large stone vessels with residues that might come from fermentation, though that reading is still debated.</p><aside class="wcall"><b>How do we know?</b><p>The pillar method comes from three kinds of evidence: quarry scars and an unfinished pillar on the plateau, tool marks on the stones themselves, and comparison with experiments and with megalith building recorded by ethnographers. The feasting idea comes from the grinding tools, the animal bones (huge numbers of gazelle, plus aurochs and wild boar) and the lack of storage buildings. Each strand is indirect; together they make a coherent picture.</p></aside></section><section class="wsec" id="gobekli-tepe-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Not alone: the Stone Hills</h3><p>For two decades Göbekli Tepe looked unique. It is not. Across the Şanlıurfa region, surveys and excavations now recognise a family of about a dozen contemporary sites with T-shaped pillars, grouped since 2021 under the name Taş Tepeler, the Stone Hills. Nevalı Çori, excavated in the 1980s and 1990s before a reservoir drowned it, had T-pillars with arms. Karahan Tepe, about 46 km to the east, may be even more startling.</p><p>At Karahan Tepe, excavations led by Necmi Karul of Istanbul University since 2019 uncovered Structure AB, a room about 7 by 6 m cut partly into the bedrock. Ten of its eleven pillars were left standing out of the living rock as the room was carved around them, and they are shaped like phalluses. On the west wall, a human head with a beard and thick lips emerges from the rock, gazing towards the entrance steps. Next door, the larger Structure AD is about 23 m across.</p><p>In 2023 the team also reported a seated human statue about 2.3 m tall with a V-shaped collar motif, echoing the famous Urfa Man statue found in the city in 1993. The effect of these finds is to turn Göbekli Tepe from a lonely miracle into the best-known member of a regional culture, with shared images, shared building habits and, perhaps, shared ceremonies.</p></section><section class="wsec" id="gobekli-tepe-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>How old, exactly? The trouble with fill</h3><p>Dating Göbekli Tepe is harder than it sounds. Radiocarbon needs something that was once alive: bone, charcoal, seeds. The enclosures, however, are full of debris, and debris moves. Material in the fill can be older than the building (if it was scraped up from an earlier rubbish layer) or younger (if it sifted in later). The DAI team has found cases of inverse stratigraphy, where younger samples lie deeper than older ones.</p><p>The most direct dates come from organic material trapped in the wall plaster of the enclosures, since plaster was applied while the building was in use. One sample from Enclosure D gave 9984 ± 42 radiocarbon years, which calibrates to 9745–9314 cal BCE at 95 per cent probability. Charcoal from deep soundings in the same enclosure clusters between about 9660 and 9310 cal BCE. So Enclosure D was probably built and used in the mid to late 10th millennium BCE, and filled in later, in the 9th.</p><p>The exact figures will keep moving as more samples are dated, and it is worth holding the headline number loosely. What is not in doubt is the order of magnitude: these buildings belong to the earliest Neolithic, the period when people in this region were starting to cultivate cereals but had not yet become full-time farmers.</p></section><section class="wsec" id="gobekli-tepe-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>Buried on purpose? Maybe not</h3><p>Klaus Schmidt, who died in 2014, believed the enclosures had been deliberately backfilled when they went out of use, a ritual burial that sealed them for millennia. The idea was elegant and it spread widely, including into claims that the site was hidden on purpose.</p><p>After Schmidt&#x27;s death, the team under Lee Clare re-examined the deposits. In a 2020 summary of the 2015–2019 work, Clare describes fill made of limestone rubble, flint and bone that seems to have slid into the buildings from higher knolls and slopes, mixing older and younger material. Moritz Kinzel and Clare argue that repeated slope slides damaged the enclosures during their use and that the builders repaired, reinforced and remodelled them. On this reading, the burial was gradual and partly accidental.</p><p>There is a twist. At Karahan Tepe, Karul describes fill that stayed inside the building, went in by stages, and was capped with large flat stones, one measuring about 2.65 by 1.65 m. That looks intentional. So deliberate burial may have been a real practice in the Stone Hills, even if Göbekli Tepe&#x27;s own enclosures were largely filled by nature and time.</p></section><section class="wsec" id="gobekli-tepe-s8"><h3 class="wsec-h"><span class="wsec-n">08</span>A temple on a hill, or a village?</h3><p>Schmidt called Göbekli Tepe a mountain sanctuary, a place where scattered hunter-gatherer bands met for ceremonies and feasts but where nobody lived. The phrase &quot;the world&#x27;s first temple&quot; still appears on posters. The newer evidence is less tidy and more interesting.</p><p>Excavations since 2015 have found domestic buildings around the enclosures, first round to oval ones and, from about 8700 BCE, rectangular ones. They have found hearths, tool-making debris, the grinding stones mentioned above, and a system for catching rain. Channels cut into the rock plateau fed rock-cut cisterns; one large rock-cut pit, possibly a cistern, is about 8 m across and 2.8 m deep. On a dry limestone hill with no spring, water storage suggests people stayed for long periods, perhaps year round.</p><ul class="wlist"><li>Domestic buildings: round to oval in the earliest phase, rectangular later (Clare 2020).</li><li>Rainwater harvesting: rock-cut channels and cisterns on the plateau.</li><li>Food processing: thousands of grinding tools, often on roofs and terraces (Dietrich L. et al. 2019).</li><li>Fresh from the field (August 2026): geophysical survey reported by Karul&#x27;s team detected several large buildings near the enclosures whose layouts suggest dwellings.</li></ul><p>None of this makes the enclosures ordinary. They still look like special buildings, used for gatherings and rituals. But the picture has shifted from a lonely temple visited by nomads to a settlement with monumental communal buildings at its heart. That shift matters for the big story of the Neolithic, because it means that settling down, building big and experimenting with farming happened together, feeding one another.</p></section><section class="wsec" id="gobekli-tepe-s9"><h3 class="wsec-h"><span class="wsec-n">09</span>The comet on the Vulture Stone</h3><p>In 2017 the chemical engineer Martin Sweatman and Dimitrios Tsikritsis proposed a bold reading of Pillar 43. Matching the animals to star patterns, they argued that the vulture, scorpion and other creatures form a sky map, and that the circle by the vulture&#x27;s wing marks the Sun at a particular solstice. Their result: a date stamp of 10,950 BCE, give or take 250 years, which they linked to a proposed comet impact at the start of the Younger Dryas cold period. The headless man, they suggested, symbolises catastrophe and death.</p><p>The excavation team replied the same year in the same journal, and further critiques followed. The main problems are easy to state. First, the proposed date is roughly 700 to 1,000 years older than the oldest radiocarbon dates for Enclosure D, so the pillar would record an event that happened centuries before the building existed. Second, matching animals to constellations is very flexible: with more than 60 carved pillars to choose from, and freedom to decide which animal is which star group, patterns can be found almost anywhere. Third, the scene ignores parts of the pillar, such as the headless figure&#x27;s phallus, that fit poorly with a message of death.</p><p>The Younger Dryas impact hypothesis itself remains contested among earth scientists, which is a separate debate. But the specific claim that Pillar 43 records a comet strike has not persuaded the archaeologists who work at the site or the wider field. Sweatman has kept developing the astronomical reading, most recently in a 2024 paper extending it to Karahan Tepe, so the debate is alive in print. Still, it remains an interpretation with a clear problem of dates, not an established finding.</p><blockquote class="wpull"><p>The proposed comet date sits centuries before the oldest dates for the building that carries it.</p></blockquote></section><section class="wsec" id="gobekli-tepe-s10"><h3 class="wsec-h"><span class="wsec-n">10</span>What we still don&#x27;t know</h3><p>Göbekli Tepe no longer needs to be a mystery to be astonishing. We know roughly when it was built, from what stone, with what tools, and what its builders ate. The unknowns are the deep ones. What did the stone figures represent: gods, ancestors, founding heroes? Why foxes, and why so many dangerous animals? How were work parties organised without chiefs that we can see in burials or houses? Were the enclosures roofed? And how many more lie under the mound and under the other Stone Hills?</p><p>Roughly nine tenths of the mound has not been excavated, and the Taş Tepeler project is only a few years old. The next surprises will probably come from the ordinary layers, the houses, hearths and rubbish, which tell us how people lived around their stone giants.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">9,600 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">First monumental enclosures begin</span></li><li class="wtl-use" style="--i:1"><span class="wtl-y">9,500 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Enclosure D in use (wall-plaster date)</span></li><li class="wtl-build" style="--i:2"><span class="wtl-y">8,700 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Smaller rectangular buildings take over</span></li><li class="wtl-loss" style="--i:3"><span class="wtl-y">8,000 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Site abandoned</span></li><li class="wtl-find" style="--i:4"><span class="wtl-y">1963 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Noted in a Chicago-Istanbul survey</span></li><li class="wtl-find" style="--i:5"><span class="wtl-y">1994 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Klaus Schmidt recognises the pillars</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">1995 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Excavations begin (DAI and Şanlıurfa Museum)</span></li><li class="wtl-event" style="--i:7"><span class="wtl-y">2017 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Vulture Stone comet claim and rebuttal</span></li><li class="wtl-event" style="--i:8"><span class="wtl-y">2018 CE</span><span class="wtl-k">Event</span><span class="wtl-t">UNESCO World Heritage Site</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">2020 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Fill reinterpreted as slope slides</span></li><li class="wtl-study" style="--i:10"><span class="wtl-y">2021 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Taş Tepeler project widens the picture</span></li><li class="wtl-find" style="--i:11"><span class="wtl-y">2026 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Geophysics hints at large dwellings</span></li></ol><figure class="wbars"><h4 class="wx-title">When monumental building began: approximate start dates</h4><div class="wb-r" style="--w:100.0%;--i:0"><div class="wb-l">Göbekli Tepe, Enclosure D<small>wall-plaster date, 9745–9314 cal BCE</small></div><div class="wb-t"><i></i><span>9,500 years BCE</span></div></div><div class="wb-r" style="--w:100.0%;--i:1"><div class="wb-l">Karahan Tepe<small>10th millennium BCE, approximate</small></div><div class="wb-t"><i></i><span>9,500 years BCE</span></div></div><div class="wb-r" style="--w:74.7%;--i:2"><div class="wb-l">Çatalhöyük (town)<small>approximate</small></div><div class="wb-t"><i></i><span>7,100 years BCE</span></div></div><div class="wb-r" style="--w:26.9%;--i:3"><div class="wb-l">Great Pyramid of Khufu<small>approximate</small></div><div class="wb-t"><i></i><span>2,560 years BCE</span></div></div><div class="wb-r" style="--w:26.3%;--i:4"><div class="wb-l">Stonehenge sarsen circle<small>approximate</small></div><div class="wb-t"><i></i><span>2,500 years BCE</span></div></div><figcaption>Source: Dietrich et al. 2013; Karul 2021; standard chronologies for Çatalhöyük, Giza and Stonehenge</figcaption></figure><h3 class="sub-h wsub">The big debates</h3><div class="debate"><p class="debate-q">Does Pillar 43 record a comet impact around 10,950 BCE?</p><div class="sides"><div class="side"><b>Yes: the carvings are a star map with a date.</b><span>Sweatman and Tsikritsis (2017) match the animals to constellations and read the scene as the sky at a solstice around 10,950 BCE, linked to a proposed Younger Dryas comet impact.</span></div><div class="side"><b>No: dates and method do not support it.</b><span>The proposed date is 700–1,000 years older than the oldest radiocarbon dates for Enclosure D; animal-to-constellation matching is highly flexible; and the reading ignores parts of the pillar (Notroff et al. 2017).</span></div></div><p class="debate-why"><b>The bold claim:</b> Pillar 43 is a record of a comet strike at the start of the Younger Dryas.</p><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The idea is specific and testable, which is to its credit, but it fails the most basic test: the carving would predate the building that carries it by centuries. Pattern matching between carved animals and star groups allows many possible fits, and no independent evidence at the site points to an impact. Unless older dates for Enclosure D emerge, the comet reading has no receipts.</p></div><div class="debate"><p class="debate-q">Were the enclosures deliberately buried?</p><div class="sides"><div class="side"><b>Yes: a ritual backfilling.</b><span>Schmidt saw uniform rubble fill with bones and tools as intentional burial at the end of use. At Karahan Tepe, fill in stages capped by large slabs looks deliberate (Karul 2021).</span></div><div class="side"><b>Mostly no: slope slides and gradual infill.</b><span>Clare (2020) and Kinzel and Clare (2020) describe mixed older and younger debris that slid in from higher ground, with repairs during use, and inverse stratigraphy in radiocarbon samples.</span></div></div><p class="debate-why"><b>The bold claim:</b> Göbekli Tepe&#x27;s enclosures were intentionally buried in a single ritual act.</p><div class="meter" style="--pos:41.7%" role="img" aria-label="Weight of evidence: Open question"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The current excavation team favours natural slope slides plus gradual filling for Göbekli Tepe itself, and the mixed dates support that. Yet intentional filling is well attested at Karahan Tepe and at other Neolithic sites, so some deliberate closing of buildings cannot be ruled out. The single-burial version looks weaker than it did in the 2000s.</p></div><div class="debate"><p class="debate-q">Did people live at Göbekli Tepe, or only gather there?</p><div class="sides"><div class="side"><b>A sanctuary only.</b><span>Schmidt&#x27;s original model: no houses, a ceremonial centre visited by hunter-gatherer groups for feasts and building work.</span></div><div class="side"><b>A settlement with monumental buildings.</b><span>Domestic buildings, rock-cut cisterns, thousands of grinding tools and 2026 geophysical hints of large dwellings (Clare 2020; Dietrich L. et al. 2019).</span></div></div><p class="debate-why"><b>The bold claim:</b> People lived at Göbekli Tepe for long periods, not only visited it.</p><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Houses, water storage and bulk food processing are hard to explain for a site used only for brief gatherings. What remains unclear is how many people lived there, for how much of the year, and whether the enclosures and houses were in use at exactly the same time.</p></div><details class="srcs"><summary>Sources for this deep dive (15)</summary><ol><li>Schmidt, K. (2012). Göbekli Tepe: A Stone Age Sanctuary in South-Eastern Anatolia. Berlin: ex oriente.</li><li>Haklay, G. &amp; Gopher, A. (2020). Geometry and architectural planning at Göbekli Tepe, Turkey. Cambridge Archaeological Journal 30(2): 343–357. <a href="https://doi.org/10.1017/S0959774319000660" target="_blank" rel="noopener">doi:10.1017/S0959774319000660</a></li><li>Dietrich, O., Köksal-Schmidt, Ç., Kürkçüoğlu, C., Notroff, J. &amp; Schmidt, K. (2013). Establishing a radiocarbon sequence for Göbekli Tepe: state of research and new data. Neo-Lithics 1/13: 36–41.</li><li>Dietrich, O. &amp; Schmidt, K. (2010). A radiocarbon date from the wall plaster of Enclosure D of Göbekli Tepe. Neo-Lithics 2/10: 82–83.</li><li>Dietrich, O., Heun, M., Notroff, J., Schmidt, K. &amp; Zarnkow, M. (2012). The role of cult and feasting in the emergence of Neolithic communities: new evidence from Göbekli Tepe. Antiquity 86(333): 674–695. <a href="https://doi.org/10.1017/S0003598X00047840" target="_blank" rel="noopener">doi:10.1017/S0003598X00047840</a></li><li>Dietrich, L. et al. (2019). Cereal processing at Early Neolithic Göbekli Tepe, southeastern Turkey. PLOS ONE 14(5): e0215214. <a href="https://doi.org/10.1371/journal.pone.0215214" target="_blank" rel="noopener">doi:10.1371/journal.pone.0215214</a></li><li>Clare, L. (2020). Göbekli Tepe, Turkey. A brief summary of research at a new World Heritage Site (2015–2019). e-Forschungsberichte des DAI 2020(2): 1–13. <a href="https://doi.org/10.34780/efb.v0i2.1012" target="_blank" rel="noopener">doi:10.34780/efb.v0i2.1012</a></li><li>Kinzel, M. &amp; Clare, L. (2020). Monumental: compared to what? A perspective from Göbekli Tepe. In A. B. Gebauer et al. (eds), Monumentalising Life in the Neolithic. Oxford: Oxbow. <a href="https://doi.org/10.2307/j.ctv13pk66m.7" target="_blank" rel="noopener">doi:10.2307/j.ctv13pk66m.7</a></li><li>Karul, N. (2021). Buried buildings at Pre-Pottery Neolithic Karahantepe. Türk Arkeoloji ve Etnografya Dergisi 82: 21–31.</li><li>Sweatman, M. B. &amp; Tsikritsis, D. (2017). Decoding Göbekli Tepe with archaeoastronomy: what does the fox say? Mediterranean Archaeology and Archaeometry 17(1): 233–250. <a href="https://doi.org/10.5281/zenodo.400780" target="_blank" rel="noopener">doi:10.5281/zenodo.400780</a></li><li>Sweatman, M. B. (2024). Representations of calendars and time at Göbekli Tepe and Karahan Tepe support an astronomical interpretation of their symbolism. Time and Mind 17(3–4): 191–247. (A contested interpretation.) <a href="https://doi.org/10.1080/1751696X.2024.2373876" target="_blank" rel="noopener">doi:10.1080/1751696X.2024.2373876</a></li><li>Notroff, J., Dietrich, O., Dietrich, L., Lelek Tvetmarken, C., Kinzel, M., Schlindwein, J., Sönmez, D. &amp; Clare, L. (2017). More than a vulture: a response to Sweatman and Tsikritsis. Mediterranean Archaeology and Archaeometry 17(2): 57–74.</li><li>Tepe Telegrams (DAI research blog). How old is it? Dating Göbekli Tepe (2016) and site overview pages.</li><li>UNESCO World Heritage Centre (2018). Göbekli Tepe. World Heritage List.</li><li>Archaeology Magazine (20 August 2026). Dwellings detected near monuments at Göbekli Tepe (news report).</li></ol></details><aside class="rc-cite" data-v="marvels" data-id="marvel-gobekli-tepe" data-t="Göbekli Tepe"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Göbekli Tepe</i>. <span class="cite-u">https://residual-continuum.vercel.app/#marvels/marvel-gobekli-tepe</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="marvel-stonehenge-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Summer Solstice Sunrise over Stonehenge 2005.jpg" data-cap="Midsummer sunrise at Stonehenge" data-big><figcaption></figcaption></figure><div class="sh-k">Salisbury Plain, England</div><h2 class="sh-t" id="marvel-stonehenge-st" tabindex="-1">Stonehenge</h2><p class="sh-s">Stones from three corners of Britain, a sightline to the solstice sun, and a monument that its builders kept rebuilding for fifteen centuries.</p><div class="sh-v"><span class="vstamp vstamp--mys">Mystery <span class="pips" role="img" aria-label="Mystery level 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span></span></div></div><div class="wquick"><h3 class="sub-h">The quick read</h3><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="700" >700</b><span class="ctr-u"> km</span></div><div class="ctr-l">distance travelled by the Altar Stone from northeast Scotland</div><div class="ctr-c">Clarke et al. 2024</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="230" >230</b><span class="ctr-u"> km</span></div><div class="ctr-l">from the Preseli bluestone quarries in Wales</div><div class="ctr-c">Parker Pearson et al. 2019</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="25" >25</b><span class="ctr-u"> km</span></div><div class="ctr-l">from West Woods, source of most sarsens</div><div class="ctr-c">Nash et al. 2020</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="50" >50</b><span class="ctr-u"> of 52</span></div><div class="ctr-l">sarsens chemically matched to one source</div><div class="ctr-c">Nash et al. 2020</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="1500" >1,500</b><span class="ctr-u"> years</span></div><div class="ctr-l">of building and rebuilding</div><div class="ctr-c">Darvill et al. 2012</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="56" >56</b><span class="ctr-u"> holes</span></div><div class="ctr-l">in the ring of Aubrey Holes</div><div class="ctr-c">Darvill et al. 2012</div></div></div><div class="stats"><div><b>c. 3000–1500 BCE, in five main stages</b><span>In use</span></div><div><b>30 uprights, c. 4.1 m high, c. 33 m across</b><span>Sarsen circle</span></div><div><b>trilithon uprights up to c. 7 m above ground; sarsens typically c. 25 t</b><span>Largest stones</span></div><div><b>West Woods, c. 25 km north (50 of 52 tested)</b><span>Sarsen source</span></div><div><b>Preseli Hills, Wales, c. 230 km</b><span>Bluestone source</span></div><div><b>c. 6 t sandstone from northeast Scotland, c. 700 km</b><span>Altar Stone</span></div><div><b>midsummer sunrise to midwinter sunset</b><span>Axis</span></div></div><p>Stonehenge grew in stages over about 1,500 years. A circular ditch and bank came first around 3000 BCE, with a ring of 56 pits, the Aubrey Holes. Around 2500 BCE the great sarsen circle and five trilithons were raised, and the smaller Welsh bluestones were set up and later rearranged several times. Geochemistry has matched most sarsens to West Woods, about 25 km north, and bluestones to outcrops in the Preseli Hills of Wales. In 2024 mineral dating showed the 6-tonne Altar Stone came from northeast Scotland. The stones were shaped with stone hammers, raised with levers, ropes and timber, and locked together with joints borrowed from carpentry.</p><div class="flip" id="marvel-stonehenge-flip"><div class="flip-in"><div class="flip-f"><b>The myth</b><p>The stones are too heavy and far-travelled for Neolithic farmers, so Merlin brought them by magic from Ireland, or glaciers dumped them conveniently nearby.</p></div><div class="flip-b"><b>The reality</b><p>Quarries with stone wedges and hearths have been excavated in Preseli, and radiocarbon dates place quarrying around 3000 BCE. Mineral fingerprinting ties the sarsens, bluestones and Altar Stone to specific sources, and ice-sheet modelling rules out a glacial delivery of the Altar Stone. People moved them, using sledges, ropes and perhaps boats and cattle. The routes and the monument&#x27;s full meaning remain uncertain.</p></div></div><button type="button" class="flip-btn" aria-pressed="false" onclick="flip('marvel-stonehenge-flip',this)">Flip it</button></div><div class="twist"><b>Wow</b><p>The Altar Stone at the heart of Stonehenge travelled about 700 km from northeast Scotland, farther than any other known megalith in Neolithic Britain.</p></div><div class="wmys"><span>Mystery meter</span><span class="pips" role="img" aria-label="Mystery level 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><small>A few loose ends</small></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">11 min read · 2,336 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Stonehenge"><button type="button" class="wtoc-i" data-go="stonehenge-s1">Sunrise on the longest day</button><button type="button" class="wtoc-i" data-go="stonehenge-s2">Fifteen centuries of rebuilding</button><button type="button" class="wtoc-i" data-go="stonehenge-s3">The sarsens: a 25 km drag</button><button type="button" class="wtoc-i" data-go="stonehenge-s4">The bluestones: from Wales, on purpose</button><button type="button" class="wtoc-i" data-go="stonehenge-s5">The Altar Stone: 700 km from Scotland</button><button type="button" class="wtoc-i" data-go="stonehenge-s6">Raising a trilithon</button><button type="button" class="wtoc-i" data-go="stonehenge-s7">Durrington Walls and the living</button><button type="button" class="wtoc-i" data-go="stonehenge-s8">Magic, glaciers and computers</button><button type="button" class="wtoc-i" data-go="stonehenge-s9">What is still unknown</button></nav></div><section class="wsec" id="stonehenge-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Sunrise on the longest day</h3><p>Stand in the middle of Stonehenge before dawn on the summer solstice and look northeast, out through the gap in the great ring. The sun comes up close to the Heel Stone, a lone sarsen outside the circle, and its first light runs straight down the monument&#x27;s axis to the centre. Turn around and you face the opposite direction, where the sun sets at midwinter. The whole design is threaded on that one line.</p><p>That alignment is one of the few things about Stonehenge nobody seriously disputes. Almost everything else, who built it, how, from what, and why, has been argued over for centuries. What has changed in the last decade is the quality of the receipts. Chemistry, mineral dating, isotopes in teeth and radiocarbon have turned a romantic ruin into one of the best-documented prehistoric monuments in the world, and the story they tell is more remarkable than the legends.</p><p>Since 1986 Stonehenge and the nearby circles of Avebury have been a UNESCO World Heritage Site, part of a landscape packed with hundreds of burial mounds, earthworks and ritual monuments. Understanding the stones means reading that whole landscape, and some of the most important evidence of the last twenty years has come from outside the circle.</p><blockquote class="wpull"><p>Stonehenge was not built once. It was built, rebuilt and rearranged for about fifteen centuries, like a cathedral that never stopped being renovated.</p></blockquote></section><section class="wsec" id="stonehenge-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Fifteen centuries of rebuilding</h3><p>The standard framework, published by Timothy Darvill, Peter Marshall, Mike Parker Pearson and Geoff Wainwright in 2012, divides the site into five stages. Around 3000 BCE, people dug a circular ditch about 110 m across, piled the chalk into a bank inside it, and dug a ring of 56 pits now called the Aubrey Holes after the 17th-century antiquary John Aubrey. Cremated remains of many people were buried in and around them, making early Stonehenge one of the largest cemeteries of its time in Britain.</p><figure class="wx wx--static" id="stonehenge-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Stonehenge in plan, stage by stage</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Stonehenge in plan, stage by stage"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 590" class="wx-svg" role="img" aria-labelledby="stonehenge-f1-t"><title id="stonehenge-f1-t">Plan of Stonehenge with its building stages and the solstice axis, with an enlarged plan of the stone settings</title><defs><clipPath id="stonehenge-f1-clip"><rect x="8" y="40" width="400" height="420"/></clipPath></defs><text x="16" y="24" class="wx-t-cap">Site plan</text><text x="420" y="24" class="wx-t-cap">The stones, enlarged</text><g><line x1="30" y1="78" x2="30" y2="50" class="wx-line"/><path d="M26,56 L30,46 L34,56 Z" class="wx-inkfill"/><tex 32" class="wx-t-b">Stage 1</text><text x="34" y="547" class="wx-t-s">c. 3000 BCE</text><text x="34" y="561" class="wx-t-s">ditch, Aubrey Holes</text></g><g class="wx-pop" style="--d:9"><rect x="157" y="522" width="12" height="12" class="wx-c2"/><text x="175" y="532" class="wx-t-b">Stage 2</text><text x="175" y="547" class="wx-t-s">c. 2500 BCE</text><text x="175" y="561" class="wx-t-s">sarsens, trilithons</text></g><g class="wx-pop" style="--d:10"><rect x="298" y="522" width="12" height="12" class="wx-c3"/><text x="316" y="532" class="wx-t-b">Stage 3</text><text x="316" y="547" class="wx-t-s">c. 2300 BCE</text><text x="316" y="561" class="wx-t-s">the Avenue</text></g><g class="wx-pop" style="--d:11"><rect x="439" y="522" width="12" height="12" class="wx-c5"/><text x="457" y="532" class="wx-t-b">Stages 2–4</text><text x="457" y="547" class="wx-t-s">c. 2500–2000 BCE</text><text x="457" y="561" class="wx-t-s">bluestones reset</text></g><g class="wx-pop" style="--d:12"><rect x="580" y="522" width="12" height="12" class="wx-c8"/><text x="598" y="532" class="wx-t-b">Stage 5</text><text x="598" y="547" class="wx-t-s">c. 1600 BCE</text><text x="598" y="561" class="wx-t-s">Y and Z Holes</text></g></svg></div></div><figcaption>The site plan on the left shows the earthwork, Aubrey Holes, Station Stones, Heel Stone and Avenue on the solstice axis; the enlarged plan on the right shows the stone settings as designed around 2500 to 2000 BCE. <span class="wx-src">Based on: Darvill et al. 2012 (stages and dates); Cleal, Walker and Montague 1995 (site plan); stone positions simplified and schematic; axis azimuth c. 50° east of north.</span></figcaption><p class="vh">Two plans. Left: the site plan with north up, showing the circular ditch and bank about 110 m across with entrances to the northeast and south, the ring of 56 Aubrey Holes, four Station Stones on a rectangle, dotted rings of Y and Z Holes, the stone circle in the centre, the Heel Stone outside the northeast entrance, and the Avenue running northeast. A line through the centre marks the solstice axis, midsummer sunrise to the northeast and midwinter sunset to the southwest. A 50 m scale bar. Right: an enlarged plan of the stones with a 10 m scale bar, showing the ring of 30 sarsen uprights about 33 m across, the bluestone circle inside it, the horseshoe of five trilithons open to the northeast, the inner bluestone horseshoe, and the Altar Stone lying across the axis. A key colours the five building stages.</p></figure><p>The Aubrey Holes may have held more than bones. When one of them, Aubrey Hole 7, was re-excavated in 2008, the chalk at its base was crushed as if by the weight of a standing stone. Many archaeologists now think the first bluestones stood in this outer ring around 3000 BCE, five centuries before they were moved into the centre. If so, the Welsh stones were there from the very beginning, and the monument started life as a stone circle and cemetery together.</p><p>Around 2500 BCE came the transformation that gives the site its silhouette: a circle of 30 sarsen uprights, each about 4.1 m high, capped by a continuous ring of lintels, with a horseshoe of five giant trilithons inside it, open towards the midsummer sunrise. The smaller bluestones were set up in arrangements that changed several times over the next five centuries. Around 2300 BCE the Avenue, a pair of banks and ditches, was laid out from the entrance towards the River Avon, about 2.8 km away. The last major work, rings of pits called the Y and Z Holes, dates to around 1600 BCE.</p><aside class="wcall"><b>How do we know the dates?</b><p>Radiocarbon dating of antler picks left in the ditch and stoneholes, of cremated bone, and of animal bones gives the construction dates. The 2012 framework combined dozens of dates with the order in which features cut through one another. Individual stages still carry uncertainties of a century or more.</p></aside></section><section class="wsec" id="stonehenge-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The sarsens: a 25 km drag</h3><p>The big stones are sarsen, a very hard silcrete that forms in blocks across southern England. For a long time the Marlborough Downs, about 25 to 30 km north, were assumed to be the source, but nobody could test it. The breakthrough came from an unlikely place. During restoration in 1958, a core was drilled through Stone 58, one of the trilithon uprights, and one of the workers kept it. In 2019, Robert Phillips returned it for study.</p><p>In 2020 a team led by geomorphologist David Nash published the results in Science Advances. Using portable X-ray fluorescence, they showed that 50 of the 52 surviving sarsens share a common chemistry. Analysis of the core matched it to sarsen at West Woods, about 25 km north of Stonehenge. Two stones differ and came from somewhere else, still unknown.</p><p>The core itself was a small revelation. Sarsen turns out to be almost pure quartz: sand grains cemented together by more quartz, which makes it one of the hardest and most durable building stones in Britain. That explains both why the stones have survived four and a half thousand years of weather and why shaping them was such hard work. Every flat face and curve was produced by pounding with hand-held mauls of the same material.</p><p>The sarsens were not simply found and dropped into place. They were dressed with hammerstones, sometimes to remarkably fine finishes, and shaped with subtle refinements: the uprights taper, and the lintels are curved in plan so that together they form a true circle. A sarsen upright of the outer circle weighs about 25 tonnes; the largest trilithon stones are heavier. Moving them 25 km over the rolling chalk probably meant sledges on timber rails, ropes and large, well-fed teams.</p></section><section class="wsec" id="stonehenge-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The bluestones: from Wales, on purpose</h3><p>The smaller stones, about 80 originally of which 43 survive, are a mixed family of volcanic and igneous rocks called bluestones, and they are not local at all. Since the 1920s geologists have traced them to the Preseli Hills in southwest Wales, about 230 km away. Since 2011 excavations by Parker Pearson and colleagues have found the actual quarries: Carn Goedog, source of the spotted dolerite, and Craig Rhos-y-felin, source of a distinctive rhyolite.</p><p>At both outcrops the rock forms natural pillars. The quarry workers left stone wedges driven into the joints, hearths, and artificial stone platforms at the foot of the outcrop where a freed pillar could be lowered onto a sledge. Radiocarbon dates from the quarries cluster around 3400 to 3000 BCE, around the time of Stonehenge&#x27;s first stage. Typical pillars were about 4 m long and weighed around 2 tonnes.</p><p>Why go so far? One answer comes from the dead. Isotope analysis of cremated bone from the first stage, published in 2018, found that about 10 of 25 individuals had not lived locally in the last years of their lives, and their values are consistent with west Wales. Stonehenge seems to have been, from the beginning, a meeting place of distant communities, and the stones may have carried ancestral meaning from home.</p><aside class="wcall"><b>Fresh from the field</b><p>In 2025 a team led by Jane Evans and Mike Parker Pearson analysed a cow&#x27;s tooth buried at Stonehenge&#x27;s south entrance around 3000 BCE. Lead and other isotopes show the animal spent part of its life on older Palaeozoic rocks like those of Wales, suggesting cattle, and perhaps cattle pulling sledges, came east with the bluestones.</p></aside></section><section class="wsec" id="stonehenge-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The Altar Stone: 700 km from Scotland</h3><p>At the centre of the monument lies a fallen slab of greenish sandstone about 4.9 m long and weighing about 6 tonnes, partly buried under two collapsed sarsens. Since the 1920s it had been assumed to come from Wales, like the bluestones. In 2024, a team led by Anthony Clarke of Curtin University dated tiny zircon, apatite and rutile grains inside fragments of it. Their ages matched the Old Red Sandstone of the Orcadian Basin in northeast Scotland, not Wales.</p><p>The distance is about 700 km in a straight line and at least 750 km by any realistic route, over mountains and rivers, or around the coast by sea. A follow-up study in 2024 ruled out Mainland Orkney itself, pointing to the Scottish mainland. In 2026, Clarke&#x27;s team tested whether ice could have done the work. Their modelling suggests Ice Age glaciers might have carried it part of the way, perhaps as far as Dogger Bank in what is now the North Sea, but that no ice route reached southern England, so people still had to move it hundreds of kilometres, probably in stages combining overland hauling with river or coastal transport.</p><blockquote class="wpull"><p>A six-tonne slab from the far north of Britain lies at the heart of a monument on the south coast plains. That is a statement about connections, not just muscle.</p></blockquote><p>How would you move it? No Neolithic boat big enough has been found in Britain, but the absence of evidence is not surprising, since plank or hide boats rarely survive. By land, a sledge on timber rails over some 750 km of hills, bogs and rivers would have taken many months and a relay of communities along the way. Either route implies alliances stretching the length of the island, and a reason strong enough to make the effort worthwhile.</p><p>It also rewrites our picture of Neolithic Britain. Communities in Orkney, Wales and Wessex shared pottery styles, house designs and monument ideas around 3000 BCE; the Altar Stone shows they also shared enough trust and organisation to move a large sacred stone across the length of the island.</p></section><section class="wsec" id="stonehenge-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Raising a trilithon</h3><p>No Neolithic engineer left instructions, but excavated stoneholes preserve some of the method. Several have one sloping side, a ramp down which the base of a stone could slide, and a steep opposite face where it would come to rest. Once the stone had tipped into the hole, teams hauling on ropes, perhaps over a timber frame, pulled it upright, and the hole was packed with rammed chalk and broken stone.</p><figure class="wx wx--steps" id="stonehenge-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">Raising a sarsen and its lintel</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Raising a sarsen and its lintel"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" class="wx-svg" role="img" aria-labelledby="stonehenge-f2-t"><title id="stonehenge-f2-t">How a sarsen upright and its lintel were probably raised, in five steps</title><defs><marker id="stonehenge-f2-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,1 L9,5 L0,9 z" class="wx-accfill"/></marker></defs><text x="16" y="24" class="wx-t-cap">Raising a sarsen upright and lintel · one scale</text><g transform="translate(0,-50)"><rect x="0" y="320" width="720" height="52" class="wx-soil"/><path d="M0,320 L200,320 L268,356 L300,356 L300,320 L720,320" class="wx-line"/><path d="M200,320 L268,356 L300,356 L300,320 Z" class="wx-paper"/><path d="M200,320 L268,356 L300,356 L300,320" class="wx-line"/><text x="16" y="362" class="wx-t-cap">Chalk</text><circle cx="46.0" cy="277.0" r="5.0" class="wx-inkfill"/><path d="M46.0,282.0 L46.0,298.4 M38.0,320 L46.0,298.4 L54.0,320" class="wx-line"/><text x="46" y="266" text-anchor="middle" class="wx-t-s">1.7 m</text><g class="wx-st" data-s="1"><line x1="296" y1="306" x2="296" y2="358" class="wx-line wx-s6" style="stroke-width:3px"/><line x1="300" y1="306" x2="300" y2="358" class="wx-line wx-s6" style="stroke-width:3px"/><line
