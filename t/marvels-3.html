<script type="text/x-tpl" id="marvel-great-zimbabwe-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Western Entrance to the Great Enclosure - Great Zimbabwe II (46698655045).jpg" data-cap="The Great Enclosure at Great Zimbabwe" data-big><figcaption></figcaption></figure><div class="sh-k">Near Masvingo, Zimbabwe</div><h2 class="sh-t" id="marvel-great-zimbabwe-st" tabindex="-1">Great Zimbabwe</h2><p class="sh-s">A royal city of granite built without a drop of mortar, and a century-long lie about who built it.</p><div class="sh-v"><span class="vstamp vstamp--mys">Mystery <span class="pips" role="img" aria-label="Mystery level 1 of 5"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></span></span></div></div><div class="wquick"><h3 class="sub-h">The quick read</h3><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="250" >250</b><span class="ctr-u"> m</span></div><div class="ctr-l">length of the Great Enclosure&#x27;s outer wall</div><div class="ctr-c">Britannica; Zimbabwe Field Guide</div></div><div class="ctr"><div class="ctr-v">up to c. <b class="ctr-n" data-v="11" >11</b><span class="ctr-u"> m</span></div><div class="ctr-l">maximum height of the outer wall</div><div class="ctr-c">Britannica</div></div><div class="ctr"><div class="ctr-v">nearly <b class="ctr-n" data-v="1000000" >1,000,000</b><span class="ctr-u"> blocks</span></div><div class="ctr-l">granite blocks in the outer wall (estimate)</div><div class="ctr-c">Zimbabwe Field Guide (2025)</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="8" >8</b><span class="ctr-u"> birds</span></div><div class="ctr-l">carved soapstone birds known from the site</div><div class="ctr-c">Bent 1891, via Wikipedia &#x27;Zimbabwe Bird&#x27;</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="722" >722</b><span class="ctr-u"> ha</span></div><div class="ctr-l">total area of the site</div><div class="ctr-c">Chirikure et al. 2017; Wikipedia</div></div><div class="ctr"><div class="ctr-v">nearly <b class="ctr-n" data-v="80" >80</b><span class="ctr-u"> m</span></div><div class="ctr-l">length of the chevron band atop the outer wall</div><div class="ctr-c">Zimbabwe Field Guide (2025)</div></div></div><div class="stats"><div><b>c. 7.2 km² (Hill Complex, Great Enclosure, valley ruins)</b><span>Site area</span></div><div><b>c. 250 m long, up to c. 11 m high</b><span>Great Enclosure wall</span></div><div><b>up to c. 5 m at the base, tapering upward</b><span>Wall thickness</span></div><div><b>nearly 1 million blocks, c. 5,000 m³ (estimate)</b><span>Stones in the outer wall</span></div><div><b>c. 9–10 m tall, c. 5.5 m across, solid</b><span>Conical tower</span></div><div><b>none</b><span>Mortar used</span></div><div><b>8 known, c. 40 cm tall on columns</b><span>Soapstone birds</span></div><div><b>older estimates up to c. 18,000; recent work suggests far fewer</b><span>Population</span></div></div><p>The builders used the local granite, which naturally peels off its domed outcrops in flat sheets. By heating a rock surface with fire and letting it cool quickly, perhaps helped by water, they could make sheets split away on purpose. The slabs broke at right angles into brick-like blocks, which were trimmed with hammerstones and laid in level courses without any mortar. The best walls have two carefully fitted faces and a core of rubble, and both faces lean inward as they rise, a slope called batter that makes a tall dry-stone wall stable. Near the top of the Great Enclosure, blocks set on edge form a decorative chevron band. A Bayesian analysis of radiocarbon dates (Chirikure et al. 2013) suggests walling began in the late 12th or early 13th century and peaked in the 14th and 15th.</p><div class="flip" id="marvel-great-zimbabwe-flip"><div class="flip-in"><div class="flip-f"><b>The myth</b><p>Great Zimbabwe was built by Phoenicians, Arabs or the Queen of Sheba, because, colonial writers claimed, Africans could not have built it.</p></div><div class="flip-b"><b>The reality</b><p>Excavations by David Randall-MacIver (1905) and Gertrude Caton-Thompson (1929), and all later research, show that it was built by the ancestors of the Shona-speaking people of the region. Pottery, house remains, architecture and radiocarbon dates all fit local development. The foreign-builder claims served colonial politics, and Rhodesian authorities pressured archaeologists into keeping them alive into the 1970s.</p></div></div><button type="button" class="flip-btn" aria-pressed="false" onclick="flip('marvel-great-zimbabwe-flip',this)">Flip it</button></div><div class="twist"><b>Wow</b><p>The Great Enclosure is the largest single ancient structure in sub-Saharan Africa: nearly a million granite blocks stacked into a wall up to about 11 m high, held together only by weight, gravity and good fitting.</p></div><div class="wmys"><span>Mystery meter</span><span class="pips" role="img" aria-label="Mystery level 1 of 5"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></span><small>Mostly solved</small></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">10 min read · 2,248 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Great Zimbabwe"><button type="button" class="wtoc-i" data-go="great-zimbabwe-s1">Into the passage</button><button type="button" class="wtoc-i" data-go="great-zimbabwe-s2">A city in three parts</button><button type="button" class="wtoc-i" data-go="great-zimbabwe-s3">Walls without mortar</button><button type="button" class="wtoc-i" data-go="great-zimbabwe-s4">The Great Enclosure and its tower</button><button type="button" class="wtoc-i" data-go="great-zimbabwe-s5">Gold, cattle and the Indian Ocean</button><button type="button" class="wtoc-i" data-go="great-zimbabwe-s6">Birds of soapstone</button><button type="button" class="wtoc-i" data-go="great-zimbabwe-s7">A century of denial</button><button type="button" class="wtoc-i" data-go="great-zimbabwe-s8">Censorship in Rhodesia</button><button type="button" class="wtoc-i" data-go="great-zimbabwe-s9">What we still don&#x27;t know</button></nav></div><section class="wsec" id="great-zimbabwe-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Into the passage</h3><p>Step through the north entrance of the Great Enclosure and the world narrows. On your left and right, two walls of grey granite rise far above your head, their faces made of thousands of neat, flat blocks, each about the size of a large book. The corridor between them, the Parallel Passage, is so tight in places that two people can barely pass. It curves, and curves, and then opens onto a small court where a solid cone of stone, taller than a three-storey house, stands in silence.</p><p>This is Great Zimbabwe, in the south-east of the modern country that took its name from it. Between about 1200 and 1450 CE it was the capital of a wealthy state on the Zimbabwe plateau, whose rulers controlled cattle, farmland and gold, and traded, through coastal towns, with the Indian Ocean world. Its builders used no mortar at all. The name itself is usually explained as coming from Shona words meaning &#x27;houses of stone&#x27;.</p><blockquote class="wpull"><p>For more than half a century, the most remarkable thing about Great Zimbabwe was not how it was built, but how hard outsiders tried to deny who built it.</p></blockquote><p>Today the answer is settled. What remains open is more interesting: how many people lived here, how its society was organised, and why its rulers eventually moved on.</p></section><section class="wsec" id="great-zimbabwe-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>A city in three parts</h3><p>Great Zimbabwe covers roughly 7.2 km² of hills and valleys. Archaeologists usually describe three main areas. The Hill Complex crowns a steep granite ridge above the valley, its walls woven between huge natural boulders; it was the earliest area to be occupied, from around 1000 CE, and is often interpreted as a royal and ritual centre. Below it lies the Great Enclosure, the largest and most famous structure. Around and between them sprawl the valley ruins, smaller walled compounds and the remains of many houses.</p><p>The houses themselves were not stone. People lived in round buildings of daga, a hard mix of clay and gravel, many of them finely finished with moulded steps and platforms. The stone walls did not hold up roofs. They defined space: who could go where, what could be seen, and by whom. In that sense the walls are architecture of power, a language of entrances, screens and passages.</p><figure class="photo wimg" data-img="The Great Zimbabwe Hill Complex.jpg" data-cap="The Hill Complex, where walls are built between and onto the natural granite boulders of the ridge."><figcaption></figcaption></figure><p>When was it all built? The site was dug over so carelessly in the colonial period that the chronology was muddled for decades. In 2013 Shadreck Chirikure and colleagues combined radiocarbon dates with dated imported objects in a Bayesian model. Their result: stone walling probably began in the late 12th or early 13th century and peaked in the 14th and 15th, overlapping with the older centre of Mapungubwe to the south rather than simply following it.</p></section><section class="wsec" id="great-zimbabwe-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Walls without mortar</h3><p>Great Zimbabwe&#x27;s builders had an unusual gift from geology. The region&#x27;s granite forms great bare domes, sometimes called whalebacks, and as the rock is heated by day and cooled by night over thousands of years, it peels off in curved sheets, a process called exfoliation. Those sheets split naturally into slabs of fairly even thickness. Accounts of the builders&#x27; method describe them speeding this up by lighting fires on the rock surface for hours and then cooling it quickly, perhaps with water, so that sheets cracked away where they wanted them.</p><figure class="wx wx--steps" id="great-zimbabwe-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">From granite outcrop to dry-stone wall</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="From granite outcrop to dry-stone wall"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" class="wx-svg" role="img" aria-labelledby="great-zimbabwe-f1-t"><title id="great-zimbabwe-f1-t">Building a dry-stone wall from exfoliated granite</title><text x="20" y="24" class="wx-t-cap">From outcrop to wall</text><text x="384" y="24" class="wx-t-cap">Wall section and face · c. 30 px = 1 m</text><path d="M0,420 L720,420" class="wx-line"/><path d="M20,420 C60,330 120,292 180,290 C240,292 300,330 340,420 Z" class="wx-rock wx-edge"/><path d="M60,372 C100,330 140,316 180,314 C220,316 260,330 300,372" class="wx-thin wx-o60"/><path d="M42,396 C90,350 140,336 180,336 C220,336 270,350 318,396" class="wx-thin wx-o40"/><text x="180" y="366" class="wx-t-s wx-halo" text-anchor="middle">granite outcrop ('whaleback')</text><g class="wx-st wx-hide" data-only="1"><path d="M150,292 L210,292 M156,286 L204,296 M158,296 L202,286" class="wx-line wx-s6" style="stroke-width:3"/><path d="M160,290 C160,279.0 166,274.6 166,268 C168,276.8 173,279.0 172,290 Z" class="wx-fire wx-o80 wx-pulse" style="--d:0"/><path d="M174,290 C174,274.0 180,267.6 180,258 C182,270.8 187,274.0 186,290 Z" class="wx-fire wx-o80 wx-pulse" style="--d:1"/><path d="M188,290 C188,280.0 194,276.0 194,270 C196,278.0 201,280.0 200,290 Z" class="wx-fire wx-o80 wx-pulse" style="--d:2"/><path d="M168,290 C168,282.0 174,278.8 174,274 C176,280.4 181,282.0 180,290 Z" class="wx-fire wx-o80 wx-pulse" style="--d:3"/><path d="M182,290 C182,281.0 188,277.4 188,272 C190,279.2 195,281.0 194,290 Z" class="wx-f wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> A fire is built on a bare granite outcrop to heat the rock surface.</p><ol class="wx-steplist"><li>A fire is built on a bare granite outcrop to heat the rock surface.</li><li>As the rock cools, a sheet splits away along the granite&#x27;s natural exfoliation layers.</li><li>Hammerstones split the slabs at right angles into brick-like blocks.</li><li>Blocks are laid in level courses without mortar: two faces with a rubble core, both leaning inward as the wall rises.</li><li>Blocks set on edge form a chevron band near the top, nearly 80 m long on the Great Enclosure.</li></ol><figcaption>How exfoliating granite became a mortarless wall: heat, split, trim, lay battered courses, decorate. The wall section and face are drawn at about 30 px per metre. <span class="wx-src">Based on: Wall height (up to c. 10–11 m) and base thickness (c. 5 m) from Britannica and the Zimbabwe Field Guide; construction techniques after Summers as summarised by the Zimbabwe Field Guide; exfoliation method from standard accounts. Top thickness approximate.</span></figcaption><p class="vh">Left: a domed granite outcrop with a fire on its surface, then a curved sheet of rock splitting away, then rectangular blocks stacked on the ground beside a hammerstone. Right: a cross-section of a dry-stone wall up to about 10 to 11 metres high and about 5 metres thick at the base, with two faces of coursed blocks leaning inward and a rubble core, beside a 1.7 metre person; and an elevation of the wall face with level courses and a zigzag chevron band near the top.</p></figure><p>Because the granite also tends to break at right angles to those layers, the slabs could be split with hammerstones into brick-like blocks. The masons laid them in courses, each row resting on the one below. In the best walls, such as the outer wall of the Great Enclosure, the courses are remarkably level and the blocks carefully chosen for thickness. The wall is really three walls in one: an outer face and an inner face of fitted blocks, with a rubble core packed between them.</p><p>The secret of height without mortar is batter. Both faces lean inward as the wall rises, so the wall is thick at the base, up to about 5 m on the Great Enclosure, and much thinner near the top. The weight of every course presses down and slightly inward, locking the stones together. The archaeologist Roger Summers listed the builders&#x27; refinements: levelled foundation trenches, a carefully laid first course, strict selection of facing blocks, level coursing, a consistent batter that suggests the use of a plumb line, and decorative patterns.</p><p>Great Zimbabwe was not alone. Across the plateau and beyond, many smaller stone-walled centres were built in the same tradition, which archaeologists call the Zimbabwe Culture. Later sites pushed the decoration further. At Naletale, built centuries later, the walls carry bands of check, dentelle, cord, herringbone and chevron patterns, made by alternating pale granite with reddish-brown banded ironstone. Seen together, these sites show a building tradition that evolved over generations, with its own rules, its own aesthetics and its own experts.</p><aside class="wcall"><b>How do we know?</b><p>Much of the method can be read from the walls themselves: tool marks, the sizes and shapes of blocks, the rubble cores exposed where walls have collapsed, and unfinished sections. The heating technique is supported by the way local granite behaves and by later traditions, but no direct archaeological &#x27;fire site&#x27; links a particular quarry to a particular wall. Architectural historians have also classified walls into styles, from rougher early work to the finely coursed walls of the peak.</p></aside></section><section class="wsec" id="great-zimbabwe-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The Great Enclosure and its tower</h3><p>The Great Enclosure is a vast, roughly elliptical ring. Its outer wall is about 250 m long and rises to about 11 m at its highest (some surveys give about 9.6 m for the tallest surviving stretch), with an average nearer 7 m. It contains around 5,000 m³ of stone, by one estimate nearly a million blocks. Along the top of part of the wall runs a band of chevrons nearly 80 m long, made by setting blocks at angles, about 9 m above the ground.</p><figure class="wx wx--static" id="great-zimbabwe-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">Plan of the Great Enclosure</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Plan of the Great Enclosure"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 570" class="wx-svg" role="img" aria-labelledby="great-zimbabwe-f2-t"><title id="great-zimbabwe-f2-t">Simplified plan of the Great Enclosure with the conical tower and parallel passage, plus a height comparison</title><text x="20" y="24" class="wx-t-cap">Great Enclosure · simplified plan · 5 px = 1 m</text><path d="M40,64 L40,40 M34,50 L40,40 L46,50" class="wx-line"/><text x="40" y="78" class="wx-t-b" text-anchor="middle">N</text><ellipse cx="270" cy="290" rx="224" ry="159" class="wx-sand wx-o60"/><path d="M246.0,125.9 L248.9,125.7 L251.8,125.5 L254.8,125.4 L257.7,125.2 L260.6,125.1 L263.6,125.1 L266.5,125.0 L269.5,125.0 L272.4,125.0 L275.4,125.0 L278.3,125.1 L281.2,125.2 L284.2,125.3 L287.1,125.5 L290.0,125.6 L293.0,125.8 L295.9,126.0 L298.8,126.3 L age</text><text x="455.3" y="241.8" class="wx-t-s wx-halo" text-anchor="end">narrow, between two high walls</text><text x="80.1" y="167.5" class="wx-t-b" text-anchor="end">Outer wall</text><text x="80.1" y="181.5" class="wx-t-s" text-anchor="end">c. 250 m long</text><text x="226.2" y="109.8" class="wx-t-s wx-halo" text-anchor="middle">entrance</text><text x="437.0" y="153.9" class="wx-t-s wx-halo" text-anchor="middle">entrance</text><text x="19.4" y="313.5" class="wx-t-s wx-halo" text-anchor="middle">entrance</text><path d="M40,489 L500,489 M40,483 v12 M500,483 v12" class="wx-dim"/><text x="270" y="507" class="wx-t-n" text-anchor="middle">c. 90 m (approximate)</text><g class="wx-pop" style="--d:11"><rect x="20" y="540" width="100" height="6" class="wx-inkfill"/><rect x="120" y="540" width="100" height="6" class="wx-card wx-edge"/><text x="20" y="562" class="wx-t-s" text-anchor="middle">0</text><text x="120" y="562" class="wx-t-s" text-anchor="middle">20</text><text x="220" y="562" class="wx-t-s" text-anchor="middle">40 m</text></g><rect x="544" y="80" width="170" height="258" rx="10" class="wx-card wx-edge-soft"/><text x="556" y="102" class="wx-t-cap">Heights · 12 px = 1 m</text><path d="M552,300 L706,300" class="wx-line"/><polygon points="556,300 616,300 594.4,168 577.6,168" class="wx-stone2 wx-edge wx-grow" style="--d:4"/><text x="586.0" y="148.0" class="wx-t-s" text-anchor="middle">outer wall,</text><text x="586.0" y="162.0" class="wx-t-s" text-anchor="middle">up to c. 11 m</text><path d="M636,300 C638,228 644,192 647,186.0 L691.0,186.0 C694.0,192 700.0,228 702.0,300 Z" class="wx-stone3 wx-edge wx-grow" style="--d:6"/><text x="669.0" y="166.0" class="wx-t-s" text-anchor="middle">conical tower,</text><text x="669.0" y="180.0" class="wx-t-s" text-anchor="middle">c. 9–10 m</text><circle cx="627" cy="282.6" r="3" class="wx-inkfill"/><path d="M627,285.6 L627,292 M627,292 L624,300 M627,292 L630,300" class="wx-line"/><text x="586" y="318" class="wx-t-s" text-anchor="middle">base c. 5 m</text><text x="627" y="332" class="wx-t-s" text-anchor="middle">person 1.7 m</text></svg></div></div><figcaption>A simplified plan at 5 px per metre, with the outer wall drawn as an ellipse of about 250 m perimeter; positions of inner features are approximate. The inset compares heights. <span class="wx-src">Based on: Outer wall length c. 250 m and height up to c. 11 m (Britannica); base thickness c. 5 m, chevron band c. 80 m and Enclosure 1 c. 21 m (Zimbabwe Field Guide); tower c. 9–10 m by c. 5.5 m (Wikipedia; Studio Matrx). The ellipse (c. 92 × 66 m) is fitted to the 250 m perimeter; layout simplified from published plans.</span></figcaption><p class="vh">Simplified plan of the Great Enclosure: a thick, roughly elliptical outer wall about 90 metres across and about 250 metres long, with three entrances. Along the eastern side an inner wall runs parallel to the outer wall, forming the narrow Parallel Passage, which leads to the solid Conical Tower, about 5.5 metres across, and a smaller tower. A dashed circle marks Enclosure 1, about 21 metres across, and dashed lines mark inner walls and hut platforms. A dotted line outside the eastern wall marks the approximate position of the chevron band, about 80 metres long. An inset shows the outer wall up to about 11 metres high and 5 metres thick at the base, the conical tower about 9 to 10 metres tall, and a 1.7 metre person.</p></figure><p>Inside, walls divide the space into smaller enclosures, including an older circular one about 21 m across, and platforms where daga houses stood. The Parallel Passage runs between the outer wall and an inner wall along the eastern side and leads to the Conical Tower: about 9 to 10 m tall and about 5.5 m across at the base, solid all the way through. Colonial treasure hunters dug under and into it looking for a hidden chamber. There is none.</p><p>Look closely at the base of the outer wall and you find another sign of careful engineering: drains. Six original outlets pass through the wall on its north-eastern side, five of them roofed with stone and one originally spanned with wooden beams. A dry-stone wall that traps rainwater behind it builds up pressure and can burst outwards. Letting the water through was as important as stacking the stones well, and it is one reason so much of the wall still stands after more than 600 years of summer storms.</p><p>What the tower meant is still debated. Some scholars have compared it to a grain bin, a symbol of a ruler&#x27;s role in distributing food; others have read it in terms of Shona symbolism of male authority or ancestral power. The Enclosure as a whole has been interpreted as a royal residence, the home of a ruler&#x27;s senior wife, or a place for initiation. None of these readings can be tested directly, and they may not exclude one another.</p><figure class="photo wimg" data-img="Wall of the great enclosure, Great Zimbabwe.JPG" data-cap="The outer wall of the Great Enclosure, showing its level, mortarless courses of granite blocks."><figcaption></figcaption></figure></section><section class="wsec" id="great-zimbabwe-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Gold, cattle and the Indian Ocean</h3><p>Great Zimbabwe&#x27;s wealth rested first on cattle and farming, and then on a long-distance trade that tied the interior to the coast. Gold from the Zimbabwe plateau travelled to ports such as Sofala on the Mozambique coast, and from there along the Swahili trading network to Kilwa and across the Indian Ocean. In return came luxury goods, some of which ended up buried at Great Zimbabwe.</p><ul class="wlist"><li>Chinese celadon and other porcelain, among the most prestigious ceramics of the age.</li><li>Persian glazed pottery.</li><li>Thousands of glass beads from the Indian Ocean trade.</li><li>Copper ingots from centres to the north, and locally worked gold, iron and copper.</li><li>Coins of Sultan al-Hasan ibn Sulaiman of Kilwa (reigned c. 1310–1333), whose currency is reported to have circulated as far as Great Zimbabwe.</li></ul><p>These objects matter in two ways. They show a city plugged into a trade network that reached China, and they helped archaeologists date the site, because many imports can be dated from where they were made. Yet they also fed a myth: for colonial writers, fine imports were proof of foreign presence. In reality they are what you would expect to find in the capital of an African state that exported gold.</p></section><section class="wsec" id="great-zimbabwe-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Birds of soapstone</h3><p>Among the most striking finds are eight carved soapstone birds, each about 40 cm tall, mounted on columns more than 90 cm high. They are unique to Great Zimbabwe. They combine bird and human features, with lips in place of beaks, and scholars generally read them as emblems of royal or ancestral authority, perhaps linked to birds as messengers.</p><p>Their modern history mirrors the site&#x27;s. In 1889 the hunter Willi Posselt removed one and sold it to Cecil Rhodes, who displayed it at Groote Schuur, his house in Cape Town. Others were taken to South Africa and Germany. South Africa returned four in 1981, a year after Zimbabwe&#x27;s independence, and Germany returned a pedestal fragment in 2003. Today the bird appears on Zimbabwe&#x27;s flag, coat of arms and currency.</p><aside class="wcall"><b>Fresh from the field</b><p>In April 2026 South Africa returned the last soapstone bird held there, the one that had stood in Cecil Rhodes&#x27;s former bedroom at Groote Schuur, together with ancestral human remains, in a handover ceremony led by the South African Minister of Sport, Arts and Culture, Gayton McKenzie, just before Zimbabwe&#x27;s 46th independence anniversary.</p></aside><figure class="photo wimg" data-img="Soapstone birds on pedestals.jpg" data-cap="Soapstone birds from Great Zimbabwe on their carved columns."><figcaption></figcaption></figure></section><section class="wsec" id="great-zimbabwe-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>A century of denial</h3><p>When the German explorer Karl Mauch reached the ruins in 1871, he decided they were a copy of the Queen of Sheba&#x27;s palace, partly because he thought a wooden beam was cedar from Lebanon. It was local sandalwood. In 1891 Theodore Bent, backed by Cecil Rhodes&#x27;s British South Africa Company, excavated finds that were clearly local, including pottery and iron tools, yet still concluded that a &#x27;northern race&#x27; from Arabia had built the city. His successor Richard Hall went further, stripping away between about 1 and 3.7 m of layered deposits in the name of clearing out later &#x27;native&#x27; occupation, and destroying much of the evidence that could have answered the question.</p><p>The idea that Africans could not have built Great Zimbabwe was useful to colonial settlers: it made the land&#x27;s past someone else&#x27;s and its present occupation look like a restoration. Science, when it arrived, disagreed. In 1905 the British Association sent the Egyptologist David Randall-MacIver, who found the houses &#x27;unquestionably African in every detail&#x27; and medieval in date. In 1929 the association sent Gertrude Caton-Thompson, who dug carefully where earlier diggers had not reached. Her conclusion, published in 1931, used the language of her time.</p><blockquote class="quote"><p>Examination of all the existing evidence, gathered from every quarter, still can produce not one single item that is not in accordance with the claim of Bantu origin and medieval date.</p><cite>Gertrude Caton-Thompson, The Zimbabwe Culture: Ruins and Reactions (Oxford: Clarendon Press, 1931)</cite></blockquote><p>Every later study, using radiocarbon dating, ceramic sequences, house forms and oral history, has confirmed that the builders were the ancestors of the Shona-speaking peoples of the region.</p></section><section class="wsec" id="great-zimbabwe-s8"><h3 class="wsec-h"><span class="wsec-n">08</span>Censorship in Rhodesia</h3><p>You might expect that to have ended the argument. It did not. After white-minority Rhodesia declared independence in 1965, the government was uncomfortable with a great African city at the heart of the country&#x27;s heritage. Official guidebooks and displays were pressured to present the builders&#x27; identity as an open question or to promote foreign origins. Archaeologists working in the country later described being told to be very careful with the press and experiencing censorship as a routine part of their work.</p><p>Peter Garlake, the Inspector of Monuments from 1964, whose research showed clearly that Great Zimbabwe was an African achievement, was forced out of the country in 1970; his book Great Zimbabwe appeared in 1973. The veteran archaeologist Roger Summers also left. For the liberation movements, the site became a powerful symbol, and when the country won majority rule in 1980 it took the name Zimbabwe and put the soapstone bird on its flag.</p><blockquote class="wpull"><p>Few archaeological sites have been fought over so openly, or have lent their name to a nation.</p></blockquote></section><section class="wsec" id="great-zimbabwe-s9"><h3 class="wsec-h"><span class="wsec-n">09</span>What we still don&#x27;t know</h3><p>How many people lived here? Older estimates of up to about 18,000 at the peak are still widely quoted. In 2017 Chirikure and colleagues rebuilt the calculation from house counts and Shona household sizes. If every settled area was occupied at the same time, they estimate only about 2,800 to 4,800 people, and they argue that the total over the site&#x27;s whole occupation is unlikely to have exceeded about 10,000. Others think these figures are too low. Either way, the monumental scale reflects organisation and prestige more than a vast population.</p><p>How was the city organised? One influential model reads the site as a single royal capital, with the king on the hill and royal wives in the valley. Chirikure and Innocent Pikirayi have argued instead that successive rulers each built their own centre, so that the Hill, the Great Enclosure and the valley compounds represent different reigns more than different functions.</p><p>And why did it decline in the 15th century? Suggestions include shifts in the gold trade routes northward, exhaustion of grazing, firewood and soils, political fragmentation, and, in recent work by Pikirayi, climate change and falling groundwater. Power moved on to other states, such as Mutapa in the north and Torwa, centred at Khami, in the south-west. The granite walls, needing no mortar and no repairs, simply stayed standing, and they are still standing now.</p><p>There is also the everyday work of keeping the site alive. Dry-stone walls bulge and fall when roots, water or shifting foundations disturb them, and early diggers weakened some sections by tunnelling under them. Conservators today monitor and rebuild collapsing stretches using the original techniques, and archaeologists increasingly work with local communities, for whom Great Zimbabwe is not only a monument but a sacred place connected to ancestors. The questions researchers ask are changing too: less about who built the walls, which is settled, and more about the lives of the people who lived around them.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-use" style="--i:0"><span class="wtl-y">1000 CE</span><span class="wtl-k">In use</span><span class="wtl-t">Farmers and herders occupy the granite hill</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">1200 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Stone walling begins (late 12th or early 13th century)</span></li><li class="wtl-use" style="--i:2"><span class="wtl-y">1320 CE</span><span class="wtl-k">In use</span><span class="wtl-t">Gold trade to the coast; Kilwa coins of al-Hasan ibn Sulaiman circulate</span></li><li class="wtl-loss" style="--i:3"><span class="wtl-y">1450 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Decline begins; power shifts to other states</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">1552 CE</span><span class="wtl-k">Event</span><span class="wtl-t">João de Barros reports a great stone fortress inland</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">1871 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Karl Mauch visits and credits the Queen of Sheba</span></li><li class="wtl-loss" style="--i:6"><span class="wtl-y">1889 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Willi Posselt removes a soapstone bird, later sold to Cecil Rhodes</span></li><li class="wtl-event" style="--i:7"><span class="wtl-y">1891 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Theodore Bent digs and credits a &#x27;northern race&#x27;</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">1905 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Randall-MacIver finds the buildings African and medieval</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">1929 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Caton-Thompson&#x27;s excavations confirm local origin</span></li><li class="wtl-event" style="--i:10"><span class="wtl-y">1970 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Archaeologist Peter Garlake forced out of Rhodesia</span></li><li class="wtl-event" style="--i:11"><span class="wtl-y">1980 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Independent Zimbabwe takes its name from the site</span></li><li class="wtl-event" style="--i:12"><span class="wtl-y">1986 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Inscribed as a UNESCO World Heritage Site</span></li><li class="wtl-find" style="--i:13"><span class="wtl-y">2026 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Last soapstone bird returned from South Africa</span></li></ol><figure class="wbars"><h4 class="wx-title">How many people lived at Great Zimbabwe?</h4><div class="wb-r" style="--w:100.0%;--i:0"><div class="wb-l">Older peak estimates<small>widely repeated</small></div><div class="wb-t"><i></i><span>18,000 people</span></div></div><div class="wb-r" style="--w:55.6%;--i:1"><div class="wb-l">Whole occupation, 800 years (upper bound)<small>Chirikure et al. 2017</small></div><div class="wb-t"><i></i><span>10,000 people</span></div></div><div class="wb-r" style="--w:26.8%;--i:2"><div class="wb-l">If all areas were occupied at once (high)<small>Chirikure et al. 2017</small></div><div class="wb-t"><i></i><span>4,823 people</span></div></div><div class="wb-r" style="--w:15.3%;--i:3"><div class="wb-l">If all areas were occupied at once (low)<small>Chirikure et al. 2017</small></div><div class="wb-t"><i></i><span>2,756 people</span></div></div><figcaption>Source: Chirikure et al. 2017 (PLOS ONE 12(6): e0178335); older estimates as summarised there and in Wikipedia</figcaption></figure><h3 class="sub-h wsub">The big debates</h3><div class="debate"><p class="debate-q">Who built Great Zimbabwe?</p><div class="sides"><div class="side"><b>Foreign builders</b><span>19th-century claims of Phoenicians, Arabs or the Queen of Sheba, based on imported goods, a misidentified timber and assumptions about African ability.</span></div><div class="side"><b>Local African builders</b><span>Pottery, daga houses, architecture, radiocarbon dates and oral history all fit ancestral Shona communities; Randall-MacIver (1905), Caton-Thompson (1929) and all later research agree.</span></div></div><p class="debate-why"><b>The bold claim:</b> Great Zimbabwe was built by foreigners rather than by local Africans.</p><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Every line of archaeological evidence points to local builders, and the foreign-origin idea was sustained by colonial politics, not data. Imported goods show trade, not foreign architects. This question has been closed by evidence since at least 1929.</p></div><div class="debate"><p class="debate-q">How many people lived at Great Zimbabwe?</p><div class="sides"><div class="side"><b>A large city</b><span>Older estimates of up to c. 18,000 people at the peak, based on the site&#x27;s size and the density of house remains.</span></div><div class="side"><b>Far fewer</b><span>Chirikure et al. (2017) estimate c. 2,800–4,800 if all areas were occupied at once, and under c. 10,000 across the whole occupation.</span></div></div><p class="debate-why"><b>The bold claim:</b> Great Zimbabwe held about 18,000 people at its height.</p><div class="meter" style="--pos:41.7%" role="img" aria-label="Weight of evidence: Open question"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Population estimates depend on how many houses were occupied at the same time and on household sizes, and much of the evidence was destroyed by early digging. The recent lower figures are carefully argued but disputed. The peak population is genuinely uncertain.</p></div><div class="debate"><p class="debate-q">Why did Great Zimbabwe decline?</p><div class="sides"><div class="side"><b>Trade and politics</b><span>Gold trade routes shifted north towards the Zambezi, and new states such as Mutapa and Torwa rose.</span></div><div class="side"><b>Environment</b><span>Pressure on grazing, soils and firewood, and proposed climate change with falling groundwater (Pikirayi).</span></div></div><p class="debate-why"><b>The bold claim:</b> A single cause, such as environmental exhaustion, explains the decline.</p><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Several factors are plausible and may have worked together, but no single cause has decisive evidence behind it. Dating of the decline itself is also imprecise, which makes it hard to tie to particular droughts or trade shifts.</p></div><details class="srcs"><summary>Sources for this deep dive (14)</summary><ol><li>Chirikure, S., Pollard, M., Manyanga, M. &amp; Bandama, F. (2013). A Bayesian chronology for Great Zimbabwe: re-threading the sequence of a vandalised monument. Antiquity 87(337): 854–872. <a href="https://doi.org/10.1017/S0003598X00049516" target="_blank" rel="noopener">doi:10.1017/S0003598X00049516</a></li><li>Chirikure, S. &amp; Pikirayi, I. (2008). Inside and outside the dry stone walls: revisiting the material culture of Great Zimbabwe. Antiquity 82(318). <a href="https://doi.org/10.1017/S0003598X00097726" target="_blank" rel="noopener">doi:10.1017/S0003598X00097726</a></li><li>Chirikure, S. et al. (2017). What was the population of Great Zimbabwe (CE1000–1800)? PLOS ONE 12(6): e0178335. <a href="https://doi.org/10.1371/journal.pone.0178335" target="_blank" rel="noopener">doi:10.1371/journal.pone.0178335</a></li><li>Caton-Thompson, G. (1931). The Zimbabwe Culture: Ruins and Reactions. Oxford: Clarendon Press.</li><li>Randall-MacIver, D. (1906). Mediaeval Rhodesia. London: Macmillan.</li><li>Garlake, P. S. (1973). Great Zimbabwe. London: Thames &amp; Hudson.</li><li>Pikirayi, I. (2001). The Zimbabwe Culture: Origins and Decline of Southern Zambezian States. Walnut Creek: AltaMira Press.</li><li>Huffman, T. N. (1996). Snakes and Crocodiles: Power and Symbolism in Ancient Zimbabwe. Johannesburg: Witwatersrand University Press.</li><li>Pikirayi, I. et al. (2023). The Conundrum of Great Zimbabwe. Journal of Urban Archaeology 7. <a href="https://doi.org/10.1484/J.JUA.5.133452" target="_blank" rel="noopener">doi:10.1484/J.JUA.5.133452</a></li><li>Mukwende, T. (2025). Great Zimbabwe. Heilbrunn Timeline of Art History, The Metropolitan Museum of Art.</li><li>PBS NOVA. Mysteries of Great Zimbabwe (article and interview).</li><li>Zimbabwe Field Guide (2025). The Great Enclosure at Great Zimbabwe in photographs; Zimbabwe&#x27;s dry-stone buildings. zimfieldguide.com.</li><li>Department of Sport, Arts and Culture, South Africa (2026). Handover of the Zimbabwe Soapstone Bird and ancestral human remains.</li><li>UNESCO World Heritage Centre. Great Zimbabwe National Monument, property 364.</li></ol></details><aside class="rc-cite" data-v="marvels" data-id="marvel-great-zimbabwe" data-t="Great Zimbabwe"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Great Zimbabwe</i>. <span class="cite-u">https://residual-continuum.vercel.app/#marvels/marvel-great-zimbabwe</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="marvel-qanats-yakhchal-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Yakhchal of Yazd province.jpg" data-cap="A yakhchal ice house in Yazd province" data-big><figcaption></figcaption></figure><div class="sh-k">Iranian plateau</div><h2 class="sh-t" id="marvel-qanats-yakhchal-st" tabindex="-1">Qanats and yakhchal ice houses</h2><p class="sh-s">Hand-dug rivers that run uphill of nothing, and mud domes that kept winter&#x27;s ice through a 40 °C desert summer.</p><div class="sh-v"><span class="vstamp vstamp--mys">Mystery <span class="pips" role="img" aria-label="Mystery level 1 of 5"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></span></span></div></div><div class="wquick"><h3 class="sub-h">The quick read</h3><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="33" >33</b><span class="ctr-u"> km</span></div><div class="ctr-l">length of the Qasabeh qanat at Gonabad</div><div class="ctr-c">UNESCO nomination figures via Wikipedia (33,113 m)</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="427" >427</b><span class="ctr-u"> shafts</span></div><div class="ctr-l">vertical wells along the Qasabeh qanat</div><div class="ctr-c">UNESCO nomination figures via Wikipedia</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="300" >300</b><span class="ctr-u"> m</span></div><div class="ctr-l">reported depth of Gonabad&#x27;s mother well</div><div class="ctr-c">Jamshidipour, Geoconservation Research</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="11" >11</b><span class="ctr-u"> qanats</span></div><div class="ctr-l">inscribed by UNESCO as &#x27;The Persian Qanat&#x27; (2016)</div><div class="ctr-c">UNESCO World Heritage Centre</div></div><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="270000" >270,000</b><span class="ctr-u"> km</span></div><div class="ctr-l">of qanat tunnel in Iran (estimate)</div><div class="ctr-c">Manuel, Lightfoot &amp; Fattahi 2018</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="12" >12</b><span class="ctr-u"> mm</span></div><div class="ctr-l">of ice in one night at best, modelled for Meybod</div><div class="ctr-c">Pochee, Gunstone &amp; Wilton 2017</div></div></div><div class="stats"><div><b>c. 33 km long, 427 shafts</b><span>Qasabeh qanat, Gonabad</span></div><div><b>reported at c. 300 m deep (some sources give more)</b><span>Its mother well</span></div><div><b>c. 1:1,000–1:1,500; longer qanats almost level</b><span>Typical gradient</span></div><div><b>commonly c. 20–35 m</b><span>Shaft spacing</span></div><div><b>c. 50,000 in use mid-20th century; c. 22,000–37,000 today (estimates)</b><span>Qanats in Iran</span></div><div><b>11 qanats inscribed in 2016</b><span>UNESCO &#x27;The Persian Qanat&#x27;</span></div><div><b>c. 15 m high over a pit c. 5 m deep</b><span>Meybod yakhchal dome</span></div><div><b>c. 12 mm a night (Pochee et al. 2017)</b><span>Best modelled ice growth</span></div></div><p>A qanat is a gently sloping tunnel dug by hand into an alluvial fan until it reaches groundwater, which then flows out by gravity to a village and its fields. Specialist diggers first sank a &#x27;mother well&#x27; to find the water table, surveyed a line down to the chosen outlet, and then dug the tunnel from the outlet uphill, sinking a vertical access shaft every 20 to 35 m or so to remove spoil and let in air. A yakhchal used the same desert physics in reverse. In winter, water was let into a long, shallow pond shaded from the sun by a high east–west wall. On clear, dry nights the water lost heat to the cold sky by radiation and by evaporation, and a thin layer froze. Workers broke it up and packed it, insulated with straw, into a deep pit beneath a thick domed roof, where it could last into summer.</p><div class="flip" id="marvel-qanats-yakhchal-flip"><div class="flip-in"><div class="flip-f"><b>The myth</b><p>Persian yakhchals made ice in the blazing desert summer using a lost ancient refrigeration technology, with a secret mortar of egg whites and goat hair.</p></div><div class="flip-b"><b>The reality</b><p>Ice was made in winter and stored for summer. Clear desert nights, radiative cooling, evaporation and a shade wall made freezing possible; a massive dome, a deep pit, straw and a meltwater drain slowed the melt. The mortar, sarooj, is a lime-based plaster; colourful recipes circulate, but the physics does not depend on them. Qanats are equally well understood. What remains uncertain is when and where they were first invented.</p></div></div><button type="button" class="flip-btn" aria-pressed="false" onclick="flip('marvel-qanats-yakhchal-flip',this)">Flip it</button></div><div class="twist"><b>Wow</b><p>Iran&#x27;s qanats have been estimated to add up to more than 270,000 km of hand-dug tunnel, enough to wrap around the equator more than six times.</p></div><div class="wmys"><span>Mystery meter</span><span class="pips" role="img" aria-label="Mystery level 1 of 5"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></span><small>Mostly solved</small></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">10 min read · 2,304 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Qanats and yakhchal ice houses"><button type="button" class="wtoc-i" data-go="qanats-yakhchal-s1">Ice on a desert afternoon</button><button type="button" class="wtoc-i" data-go="qanats-yakhchal-s2">A river you cannot see</button><button type="button" class="wtoc-i" data-go="qanats-yakhchal-s3">The diggers and the dig</button><button type="button" class="wtoc-i" data-go="qanats-yakhchal-s4">The giant of Gonabad</button><button type="button" class="wtoc-i" data-go="qanats-yakhchal-s5">How old is the idea?</button><button type="button" class="wtoc-i" data-go="qanats-yakhchal-s6">Freezing water with the night sky</button><button type="button" class="wtoc-i" data-go="qanats-yakhchal-s7">A dome built to keep the cold in</button><button type="button" class="wtoc-i" data-go="qanats-yakhchal-s8">Myths that melt on contact</button><button type="button" class="wtoc-i" data-go="qanats-yakhchal-s9">Running dry, and what we still don&#x27;t know</button></nav></div><section class="wsec" id="qanats-yakhchal-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Ice on a desert afternoon</h3><p>Imagine a July afternoon in Yazd, in the heart of the Iranian plateau. The air shimmers above mud-brick roofs, summer temperatures here occasionally pass 40 °C, and the nearest permanent river is far away. Yet a few centuries ago you could have bought a cold drink cooled with ice. The ice was not shipped from mountains. It had been made locally, months earlier, on winter nights, and kept in a building that looks like a giant beehive.</p><p>That building is a yakhchal, literally an &#x27;ice pit&#x27;. And the water that filled its freezing pond usually came from something even more remarkable: a qanat, a tunnel dug by hand for kilometres through gravel and silt, tapping groundwater under the foot of the mountains and leading it out, by gravity alone, to a village that would otherwise be dust.</p><blockquote class="wpull"><p>Two technologies, one idea: in a desert, patience and physics can do the work of pumps and refrigerators.</p></blockquote><p>Neither is mysterious. Both are superb. This is the story of how they work, how we know, and which of the tales told about them hold up.</p></section><section class="wsec" id="qanats-yakhchal-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>A river you cannot see</h3><p>Much of the Iranian plateau is ringed by mountains that catch rain and snow. Meltwater and runoff pour down into the basins below, and where they leave the mountains they drop enormous fans of gravel, sand and silt, called alluvial fans. Some water sinks into these fans and moves slowly downhill underground. Near the mountains, the water table can be reached by digging; further out onto the plain it sits deep below the surface.</p><p>Here is the trick. The ground surface of the fan slopes steeply, but the water table slopes much more gently. So if you dig a tunnel that is almost level, starting out on the plain and heading uphill into the fan, it gets deeper and deeper below the surface until, eventually, it pierces the water table. Water seeps into the upper section of the tunnel and flows down its gentle slope and out into the daylight, where the ground surface has come down to meet it. No pump, no power, no moving parts. As long as the aquifer is recharged, the qanat flows day and night.</p><aside class="wcall"><b>The gentle slope</b><p>Get the slope wrong and a qanat fails. Too steep and the fast water scours the tunnel floor and collapses the walls; too flat and it silts up. In shorter qanats the gradient typically falls between about 1 in 1,000 and 1 in 1,500, according to standard summaries; the longest are almost level. For a tunnel 1 km long, that is a drop of well under a metre, achieved by eye, cord and water level, underground.</p></aside></section><section class="wsec" id="qanats-yakhchal-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The diggers and the dig</h3><p>Qanats were dug by specialists, the muqannis, whose skills passed down through families. The work began with the most important gamble: the mother well. At the head of the fan, the diggers sank a trial shaft to find the water table and test whether it held enough water. If the mother well hit a good flow, the qanat was worth building.</p><figure class="wx wx--steps" id="qanats-yakhchal-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">How a qanat is dug</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How a qanat is dug"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" class="wx-svg" role="img" aria-labelledby="qanats-yakhchal-f1-t"><title id="qanats-yakhchal-f1-t">How a qanat is dug: mother well, access shafts and a gently sloping tunnel</title><text x="20" y="22" class="wx-t-cap">Long section · vertical scale greatly exaggerated</text><path d="M0,303 L110,285 L720,118 L720,430 L0,430 Z" class="wx-soil"/><path d="M720,196 L610,212 C540,226 470,246 420,266 C360,288 300,312 200,338 L0,368 L0,430 L720,430 Z" class="wx-water wx-o80"/><path d="M720,196 L610,212 C540,226 470,246 420,266 C360,288 300,312 200,338 L0,368" class="wx-line wx-s2 wx-o60"/><text x="700" y="224" class="wx-t-s wx-halo" text-anchor="end">water table</text><text x="690" y="420" class="wx-t-s" text-anchor="end">water-bearing gravels (aquifer)</text><path d="M540,168 L600,84 L636,112 L684,56 L720,76 L720,118 Z" class="wx-rock wx-edge-soft"/><path d="M0,303 L110,285 L720,118" class="wx-line"/><text x="62" y="326" class="wx-t-m wx-halo" text-anchor="middle">alluvial fan</text><rect x="28" y="285.4" width="16" height="13" class="wx-stone wx-edge-soft"/><rect x="50" y="281.8" width="16" height="13" class="wx-stone wx-edge-soft"/><rect x="74" y="277.9" width="16" height="13" class="wx-stone wx-edge-soft"/><text x="54" y="262" class="wx-t-s wx-halo" text-anchor="middle">village</text><g class="wx-pop" style="--d:2"><rect x="20" y="36" width="250" height="62" rx="8" class="wx-card wx-edge-soft"/><text x="32" y="54" class="wx-t-cap">Record holder: Qasabeh, Gonabad</text><text x="32" y="72" class="wx-t-s">c. 33 km long lass="wx-paper wx-edge-soft"/><path d="M148,273.3 q6,-9 10,-1 M162,270.3 q6,-8 11,2" class="wx-line wx-o80"/></g><g class="wx-st" data-s="3"><rect x="207.5" y="257.6" width="5" height="25.2" class="wx-paper wx-edge-soft"/><path d="M198,259.6 q6,-9 10,-1 M212,256.6 q6,-8 11,2" class="wx-line wx-o80"/></g><g class="wx-st" data-s="3"><rect x="257.5" y="243.9" width="5" height="37.3" class="wx-paper wx-edge-soft"/><path d="M248,245.9 q6,-9 10,-1 M262,242.9 q6,-8 11,2" class="wx-line wx-o80"/></g><g class="wx-st" data-s="3"><rect x="307.5" y="230.2" width="5" height="49.4" class="wx-paper wx-edge-soft"/><path d="M298,232.2 q6,-9 10,-1 M312,229.2 q6,-8 11,2" class="wx-line wx-o80"/></g><path d="M110,286 L335,278.8" class="wx-bold wx-st" data-s="3"/><g class="wx-st wx-hide" data-only="3"><path d="M298,230.2 L302,208.2 M322,230.2 L318,208.2 M298,208.2 L322,208.2" class="wx-line"/><circle cx="310" cy="208.2" r="4" class="wx-wood wx-edge"/><path d="M310,208.2 L310,260.2" class="wx-thin"/><rect x="306" y="260.2" width="8" height="7" class="wx-wood"/><text x="294" y="204.2" class="wx-t-s wx-halo" text-anchor="end">windlass lifts the spoil</text></g><g class="wx-st" data-s="3"><circle cx="130" cy="366" r="9" class="wx-num"/><text x="130" y="370" class="wx-numt" text-anchor="middle">3</text><text x="146" y="370" class="wx-t-b wx-halo">Tunnel dug from the outlet uphill</text><text x="146" y="386" class="wx-t-s wx-halo">seepage drains out behind the diggers</text></g><g class="wx-st" data-s="4"><rect x="357.5" y="216.6" width="5" height="61.4" class="wx-paper wx-edge-soft"/><path d="M348,218.6 q6,-9 10,-1 M362,215.6 q6,-8 11,2" class="wx-line wx-o80"/></g><g class="wx-st" data-s="4"><rect x="407.5" y="202.9" width="5" height="73.5" class="wx-paper wx-edge-soft"/><path d="M398,204.9 q6,-9 10,-1 M412,201.9 q6,-8 11,2" class="wx-line wx-o80"/></g><g class="wx-st" data-s="4"><rect x="457.5" y="189.2" width="5" height="85.6" class="wx-paper wx-edge-soft"/><path d="M448,191.2 q6,-9 10,-1 M462,188.2 q6,-8 11,2" class="wx-line wx-o80"/></g><g class="wx-st" data-s="4"><rect x="507.5" y="175.5" width="5" height="97.7" class="wx-paper wx-edge-soft"/><path d="M498,177.5 q6,-9 10,-1 M512,174.5 q6,-8 11,2" class="wx-line wx-o80"/></g><g class="wx-st" data-s="4"><rect x="557.5" y="161.8" width="5" height="109.8" class="wx-paper wx-edge-soft"/><path d="M548,163.8 q6,-9 10,-1 M562,160.8 q6,-8 11,2" class="wx-line wx-o80"/></g><path d="M335,278.8 L610,270" class="wx-bold wx-st" data-s="4"/><g class="wx-st" data-s="4"><circle cx="444" cy="366" r="9" class="wx-num"/><text x="444" y="370" class="wx-numt" text-anchor="middle">4</text><text x="460" y="370" class="wx-t-b wx-halo">Shaft by shaft to the mother well</text><text x="460" y="386" class="wx-t-s wx-halo">upper part collects groundwater</text></g><g class="wx-st" data-s="5"><path d="M606,270 L110,286" class="wx-flow wx-s2"/><path d="M110,286 C90,290 70,292 40,297" class="wx-flow wx-s2"/><ellipse cx="118" cy="296" rx="0" ry="0" class="wx-green"/><path d="M0,304 L24,300 L24,294 L0,298 Z M92,289 L108,286.5 L108,281 L92,283.5 Z" class="wx-green"/><circle cx="120" cy="248" r="9" class="wx-num"/><text x="120" y="252" class="wx-numt" text-anchor="middle">5</text><text x="20" y="214" class="wx-t-b">Water arrives by gravity</text><text x="20" y="230" class="wx-t-s">no pumps, day and night</text><path d="M120,257 L112,280" class="wx-thin"/></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> A mother well is sunk at the head of the fan to find the water table and test the flow.</p><ol class="wx-steplist"><li>A mother well is sunk at the head of the fan to find the water table and test the flow.</li><li>The line is surveyed down to the outlet and access shafts are marked every c. 20–35 m.</li><li>Diggers start at the outlet and tunnel uphill, so seepage drains out behind them; spoil goes up the shafts.</li><li>Shaft by shaft the tunnel reaches the mother well; its upper section lies below the water table and collects water.</li><li>Water flows out by gravity, day and night, to the village and its fields.</li></ol><figcaption>A long section through an alluvial fan, with the vertical scale greatly exaggerated: the tunnel is dug from the outlet uphill to meet the mother well. <span class="wx-src">Based on: After standard qanat descriptions (Manuel, Lightfoot &amp; Fattahi 2018; UNESCO nomination figures for Qasabeh); gradient and shaft spacing from standard summaries. Vertical scale exaggerated.</span></figcaption><p class="vh">Long section through an alluvial fan sloping down from mountains on the right to a village on the left, with the water table below. Step 1 shows a mother well sunk at the head of the fan into the water table. Step 2 marks a line of access shafts along the surface and a planned gentle slope. Step 3 shows the tunnel being dug from the outlet near the village uphill, with a windlass lifting spoil at a shaft. Step 4 completes the tunnel shaft by shaft to the mother well, its upper part below the water table. Step 5 shows water flowing by gravity out to the village fields.</p></figure><p>Next came the survey. Working back down the fan to the place where the water should emerge, near the fields, the team marked out a line and worked out the depth each point along it must reach so that the tunnel would descend gently all the way. Along this line they sank vertical shafts, commonly every 20 to 35 m or so. The shafts let the diggers go down and come up, brought in air, and gave a way to haul out the spoil, which was dumped around each shaft mouth. That is why a qanat seen from the air looks like a line of craters marching across the desert.</p><p>Then the tunnel itself was dug, and here the order matters. The muqannis started at the outlet and worked uphill, towards the mother well. Any water that seeped in during digging drained out behind them rather than flooding the face they were working on. Each short stretch linked one shaft to the next. Spoil went up the shafts in buckets hauled by a windlass. The tunnels were usually just big enough for a person to crouch and dig; where the ground was soft, they could be lined with hoops of fired clay.</p><p>Keeping direction underground, with no compass readings to rely on, was a matter of sightlines. Each new shaft was sunk on the surveyed line, so every short stretch of tunnel had a fixed target: the bottom of the next shaft. Traditional accounts describe diggers using lamps to keep a straight line between shafts, and many tunnels show small kinks where two headings met slightly off. The result is not a perfectly straight pipe but a string of carefully joined segments, each one checked against the gentle fall that the whole system depends on.</p><p>It was dangerous work in darkness, bad air and loose gravel, and it never really ended. Qanats need regular cleaning and repair, and a family of muqannis might maintain the same channels for generations.</p></section><section class="wsec" id="qanats-yakhchal-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The giant of Gonabad</h3><p>In 2016 UNESCO inscribed eleven Iranian qanats together on the World Heritage List as &#x27;The Persian Qanat&#x27;. The most famous is the Qasabeh qanat at Gonabad, in Khorasan in the north-east. Figures published with the nomination put it at 33,113 m long with 427 wells. Its mother well is widely reported as around 300 m deep. A few sources give larger figures, and its discharge is quoted at around 160 litres per second in one recent geotourism study, so treat the exact numbers as reported values, not measurements you can check on a single page.</p><p>Its age is also a matter of claim rather than measurement. Local tradition and many published accounts place its origin in the Achaemenid period, around 2,500 years ago. That is plausible for the region, but dating a tunnel that has been cleaned out and repaired for centuries is hard. What is certain is that it still delivers water to Gonabad.</p><figure class="photo wimg" data-img="Ancient water clock used in qanat of gonabad 2500 years ago.JPG" data-cap="A traditional water clock of the kind used at Gonabad to divide qanat water fairly between farmers. The age in the file name is a local claim."><figcaption></figcaption></figure><p>Sharing that water was an institution in itself. Across Iran, a qanat&#x27;s flow was divided among shareholders by time. One traditional method used a water clock: a bowl with a small hole, floated in a larger vessel, that sank at a steady rate. Each sinking marked a unit of time, and each farmer received a set number of units. Disputes over water were settled by counting bowls.</p></section><section class="wsec" id="qanats-yakhchal-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>How old is the idea?</h3><p>The Greek historian Polybius, writing in the 2nd century BCE, preserved a memory of Persian water policy while describing a campaign in the Iranian plateau. He explains that the local wells and underground channels had been dug at great cost because the Persians had offered a generous reward.</p><blockquote class="quote"><p>They say that at the time when the Persians were the rulers of Asia they gave to those who conveyed a supply of water to places previously unirrigated the right of cultivating the land for five generations</p><cite>Polybius, Histories 10.28.3, trans. W. R. Paton, Loeb Classical Library (1925)</cite></blockquote><p>That points to the Achaemenid Persian empire (c. 550 to 330 BCE) as a great age of qanat building, and Achaemenid-period qanats are known well beyond Iran, including in the oases of Egypt&#x27;s Western Desert during the reign of Darius I. But the invention itself may be older. In 2015 Morteza Fattahi published optically stimulated luminescence dates for spoil heaps of the Miam qanat in north-east Iran that suggest construction around 3,600 to 4,300 years ago. It is a single study of a single system, and luminescence dates on reworked spoil can be tricky to interpret, so the claim is intriguing rather than settled.</p><p>Other scholars argue that qanat-like systems arose independently in several places, including south-eastern Arabia, where the similar aflaj of Oman have their own long history. Most agree that the technique spread along with Persian and later Islamic-era states, reaching North Africa, Spain, Central Asia and western China, where the karez of Turpan still flow.</p></section><section class="wsec" id="qanats-yakhchal-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Freezing water with the night sky</h3><p>Now to the ice. The Iranian plateau has a gift for anyone who wants to make it: winter nights that are clear, still and very dry. Everything warm glows in infrared light, and a pond is no exception. On a cloudy or humid night, the sky sends a lot of that energy back. On a clear, dry night it sends back much less, because there is little water vapour overhead, and the pond&#x27;s surface can cool below the air temperature around it. Add evaporation, which carries heat away as water turns to vapour in dry air, and a shallow sheet of water can freeze even when the air above it is a little above 0 °C.</p><p>Iran&#x27;s ice makers maximised that effect. A yakhchal complex typically had a long, shallow pond or set of channels running east–west, and along its south side a tall wall, often around 10 m high and sometimes up to about 15 m. In winter the Sun at noon stands low in the southern sky, around 35 degrees above the horizon at Yazd&#x27;s latitude, so the wall kept the pond in shadow for most or all of the day. By night the pond saw the whole sky.</p><figure class="wx wx--static" id="qanats-yakhchal-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">Inside a yakhchal</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Inside a yakhchal"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" class="wx-svg" role="img" aria-labelledby="qanats-yakhchal-f2-t"><title id="qanats-yakhchal-f2-t">Cross-section of a yakhchal: shade wall, freezing pond, dome and ice pit</title><defs><marker id="qanats-yakhchal-f2-ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" class="wx-c7"/></marker></defs><text x="20" y="22" class="wx-t-cap">Section, south to north · after the Meybod yakhchal</text><g class="wx-pop" style="--d:1"><circle cx="240" cy="48" r="1.8" class="wx-inkfill wx-pulse" style="--d:0"/><circle cx="262" cy="90" r="1.8" class="wx-inkfill wx-pulse" style="--d:1"/><circle cx="300" cy="40" r="1.8" class="wx-inkfill wx-pulse" style="--d:2"/><circle cx="352" cy="58" r="1.8" class="wx-inkfill wx-pulse" style="--d:3"/><circle cx="380" cy="100" r="1.8" class="wx-inkfill wx-pulse" style="--d:4"/><circle cx="420" cy="44" r="1.8" class="wx-inkfill wx-pulse" style="--d:0"/><circle cx="200" cy="110" r="1.8" class="wx-inkfill wx-pulse" s
