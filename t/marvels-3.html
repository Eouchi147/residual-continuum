671,321 671,324 671,327 671,330" class="wx-stone3 wx-edge"/><rect x="616" y="118" width="68" height="14" class="wx-stone2 wx-edge"/><path d="M616 118l-22 14M684 118l22 14" class="wx-line"/><text x="650" y="108" class="wx-t-b" text-anchor="middle">set upright</text></g><g class="wx-st wx-hide" data-only="1"><circle class="wx-num" cx="36" cy="34" r="9"/><text x="36" y="37.8" class="wx-numt" text-anchor="middle">1</text><text x="54" y="38" class="wx-t-b wx-t-a">Rough out</text><text x="28" y="60" class="wx-t">Quarry a block of soft chloritic schist</text><text x="28" y="76" class="wx-t">and chip it roughly round with chisels.</text></g><g class="wx-st wx-hide" data-only="2"><circle class="wx-num" cx="36" cy="34" r="9"/><text x="36" y="37.8" class="wx-numt" text-anchor="middle">2</text><text x="54" y="38" class="wx-t-b wx-t-a">Mount</text><text x="28" y="60" class="wx-t">Set iron pivots in the ends and hang the</text><text x="28" y="76" class="wx-t">blank horizontally in a timber frame.</text></g><g class="wx-st wx-hide" data-only="3"><circle class="wx-num" cx="36" cy="34" r="9"/><text x="36" y="37.8" class="wx-numt" text-anchor="middle">3</text><text x="54" y="38" class="wx-t-b wx-t-a">Spin</text><text x="28" y="60" class="wx-t">A rope wrapped round the shaft is pulled</text><text x="28" y="76" class="wx-t">in turn: the stone turns one way, then back.</text></g><g class="wx-st wx-hide" data-only="4"><circle class="wx-num" cx="36" cy="34" r="9"/><text x="36" y="37.8" class="wx-numt" text-anchor="middle">4</text><text x="54" y="38" class="wx-t-b wx-t-a">Cut</text><text x="28" y="60" class="wx-t">A hard iron tool on a rest shaves rings and</text><text x="28" y="76" class="wx-t">bells; a cut-out template checks the profile.</text></g><g class="wx-st wx-hide" data-only="5"><circle class="wx-num" cx="36" cy="34" r="9"/><text x="36" y="37.8" class="wx-numt" text-anchor="middle">5</text><text x="54" y="38" class="wx-t-b wx-t-a">Polish</text><text x="28" y="60" class="wx-t">Fine sand, water and cloth while it turns</text><text x="28" y="76" class="wx-t">give the glassy, light-catching finish.</text></g><g class="wx-st wx-hide" data-only="6"><circle class="wx-num" cx="36" cy="34" r="9"/><text x="36" y="37.8" class="wx-numt" text-anchor="middle">6</text><text x="54" y="38" class="wx-t-b wx-t-a">Erect</text><text x="28" y="60" class="wx-t">Stand the shaft on its square base and</text><text x="28" y="76" class="wx-t">crown it with brackets and figures.</text></g><text x="28" y="398" class="wx-t-cap">Reconstruction</text><text x="28" y="414" class="wx-t-s">No Hoysala lathe survives. Method inferred from the pillars and from traditional Indian strap lathes; sizes indicative.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button><button type="button" class="wx-dot" data-k="6" aria-label="Step 6" aria-pressed="false">6</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 6.</b> Rough out: quarry a block of soft chloritic schist and chip it roughly round with chisels.</p><ol class="wx-steplist"><li>Rough out: quarry a block of soft chloritic schist and chip it roughly round with chisels.</li><li>Mount: fix iron pivots in the ends and hang the blank horizontally in a strong timber frame.</li><li>Spin: a rope wrapped round the shaft is pulled in turn, so the stone turns one way, then back.</li><li>Cut: a hard iron tool on a rest shaves rings and bells; a cut-out template checks the profile.</li><li>Polish: fine sand, water and cloth applied while it turns give the glassy, light-catching finish.</li><li>Erect: stand the shaft on its square base and crown it with brackets and carved figures.</li></ol><figcaption>A reconstruction of how a Hoysala-style pillar could be turned on a hand-powered lathe. No lathe survives, so the frame and rope are based on traditional Indian strap lathes. <span class="wx-src">Based on: Reconstruction based on descriptions of lathe-turned Hoysala pillars (Foekema 1996; Kamath 2001; Sastri 1955) and on traditional hand-powered strap lathes; sizes indicative only.</span></figcaption><p class="vh">Six-step reconstruction. A worker chips a block of schist into a rough shaft. The shaft is hung horizontally between iron pivots in a timber frame. Two workers pull a rope wrapped around it so it spins one way then the other. A turner rests an iron tool on a wooden rest and cuts rings and bell shapes, checking them against a profile template. The shaft is polished with sand, water and cloth. Finally the finished pillar stands upright on a square base with a bracket on top.</p></figure><p>Picture, then, a strong timber frame with two iron pivots. A roughly rounded shaft of schist is hung between them. Hand-powered lathes of this general kind, where a rope or strap wrapped around the work is pulled one way and then the other, were used by Indian wood-turners into modern times; the stone turns back and forth rather than continuously, and the turner cuts on the forward stroke. With a hard iron tool steadied on a rest, the turner shaves the spinning stone into rings and bells, checking the profile against a cut-out template. Fine sand and water on a cloth, applied as the shaft turns, bring up the shine.</p><p>This is a reconstruction, and we should be clear about its limits. No Hoysala lathe survives, no inscription describes one, and we found no published study of tool marks on the pillars. A few scholars argue that expert carvers could achieve round forms by hand, using templates and guides. The lathe explanation remains the most economical, because turning produces exactly the concentric rings and repeated profiles we see, and it requires nothing that 12th-century India did not have.</p><p>The theory also makes predictions that someone could check. A turned shaft should carry fine, continuous scratches running around its circumference, not along it, from the tool and the polishing grit. Its cross-sections should be true circles along the whole length, while any flutes or star points would have been cut afterwards by hand and should vary slightly from one to the next. And the pivot holes that held the shaft would have been hidden inside the joints with the base and capital. A close photographic study of the pillars, ideally with 3D scanning, could test each of these ideas.</p><aside class="wcall"><b>Real stone boxes, turned</b><p>India does have genuine precision stone boxes: Buddhist relic caskets. In 1898 W. C. Peppé opened a stupa at Piprahwa, near the Nepal border, and found a massive stone coffer holding small vases of soapstone and crystal, with around 1,800 gems and pieces of jewellery. Soapstone caskets of this period, and many later ones from Gandhara, appear to have been turned on lathes, with snug-fitting lids. In 2025 the Indian government stopped a planned Sotheby&#x27;s sale of Piprahwa gems, and they were returned to India that July.</p></aside></section><section class="wsec" id="india-stone-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Manuals, masters and signatures</h3><p>Precision in Indian temple building did not depend on machines. It depended on systems. Sanskrit treatises on architecture and sculpture, such as the Mayamata and the Manasara, set out proportional rules: a building or an image is laid out in units, and every part is a fixed multiple of those units. Master builders, called sthapatis and sutradharas, carried these rules in memory and in practice, together with measuring cords, rods and templates. A pillar made to such a scheme will match its neighbours because they were drawn from the same rule, not because a computer controlled the cutter.</p><p>The Hoysala craftsmen were proud of their work and often signed it. Names such as Mallitamma and Dasoja appear on sculptures at Belur and elsewhere, a small reminder that these &#x27;impossible&#x27; objects were made by particular people with reputations to protect. Like Kailasa at Ellora or the rock-cut temples of Mamallapuram, the Hoysala temples belong to a long Indian tradition of astonishing stonework made by known methods.</p></section><section class="wsec" id="india-stone-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>How precise is &#x27;precise&#x27;?</h3><p>The heart of the viral claim is precision: the boxes and pillars are said to be accurate to the fraction of a millimetre, like modern machined parts. That is a testable claim, so we went looking for the test. We could not find a published laser scan, a metrology survey or even a set of careful hand measurements of the flatness of the Barabar walls or the roundness of the Hoysala pillars. Without numbers, &#x27;perfect&#x27; means &#x27;looks perfect in a photograph&#x27;.</p><figure class="wx wx--static" id="india-stone-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">How precise is &#x27;precise&#x27;?</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How precise is &#x27;precise&#x27;?"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" class="wx-svg" role="img" aria-labelledby="india-stone-f2-t"><title id="india-stone-f2-t">How precise is precise? Ancient stonework and modern machining on one scale</title><text x="24" y="30" class="wx-t-cap">Deviation or tolerance, millimetres (log scale)</text><line x1="250" y1="70" x2="250" y2="410" class="wx-guide"/><text x="250" y="60" class="wx-t-s" text-anchor="middle">0.001</text><line x1="338" y1="70" x2="338" y2="410" class="wx-guide"/><text x="338" y="60" class="wx-t-s" text-anchor="middle">0.01</text><line x1="426" y1="70" x2="426" y2="410" class="wx-guide"/><text x="426" y="60" class="wx-t-s" text-anchor="middle">0.1</text><line x1="514" y1="70" x2="514" y2="410" class="wx-guide"/><text x="514" y="60" class="wx-t-s" text-anchor="middle">1</text><line x1="602" y1="70" x2="602" y2="410" class="wx-guide"/><text x="602" y="60" class="wx-t-s" text-anchor="middle">10</text><line x1="690" y1="70" x2="690" y2="410" class="wx-guide"/><text x="690" y="60" class="wx-t-s" text-anchor="middle">100</text><g class="wx-pop" style="--d:1"><text x="24" y="96" class="wx-t-b">Granite surface plate (lab)</text><text x="24" y="110" class="wx-t-s">flatness, a few µm</text><line x1="250" y1="98" x2="250" y2="98" class="wx-dim"/><rect x="250" y="92" width="42" height="12" rx="6" class="wx-c2"/><text x="712" y="102" class="wx-t-s" text-anchor="end">today</text></g><g class="wx-pop" style="--d:2"><text x="24" y="136" class="wx-t-b">Precision CNC machining</text><text x="24" y="150" class="wx-t-s">typical tight tolerance</text><line x1="250" y1="138" x2="311.5" y2="138" class="wx-dim"/><circle cx="311.5" cy="138" r="6.5" class="wx-c2"/><text x="712" y="142" class="wx-t-s" text-anchor="end">today</text></g><g class="wx-pop" style="--d:3"><text x="24" y="176" class="wx-t-b">What the eye can see</text><text x="24" y="190" class="wx-t-s">at 25 cm, about 0.1 mm</text><line x1="250" y1="178" x2="426" y2="178" class="wx-dim"/><circle cx="426" cy="178" r="6.5" class="wx-c7"/><text x="712" y="182" class="wx-t-s" text-anchor="end">you</text></g><g class="wx-pop" style="--d:4"><text x="24" y="216" class="wx-t-b">ISO 2768 'fine', 120–400 mm</text><text x="24" y="230" class="wx-t-s">default workshop tolerance</text><line x1="250" y1="218" x2="452.5" y2="218" class="wx-dim"/><circle cx="452.5" cy="218" r="6.5" class="wx-c2"/><text x="712" y="222" class="wx-t-s" text-anchor="end">today</text></g><g class="wx-pop" style="--d:5"><text x="24" y="256" class="wx-t-b">Great Pyramid casing</text><text x="24" y="270" class="wx-t-s">straightness over 1.9 m (Petrie)</text><line x1="250" y1="258" x2="461" y2="258" class="wx-dim"/><circle cx="461" cy="258" r="6.5" class="wx-c1"/><text x="712" y="262" class="wx-t-s" text-anchor="end">Egypt, c. 2560 BCE</text></g><g class="wx-pop" style="--d:6"><text x="24" y="296" class="wx-t-b">Great Pyramid casing joints</text><text x="24" y="310" class="wx-t-s">mean joint gap (Petrie)</text><line x1="250" y1="298" x2="487.5" y2="298" class="wx-dim"/><circle cx="487.5" cy="298" r="6.5" class="wx-c1"/><text x="712" y="302" class="wx-t-s" text-anchor="end">Egypt, c. 2560 BCE</text></g><g class="wx-pop" style="--d:7"><text x="24" y="336" class="wx-t-b">Khufu's granite coffer</text><text x="24" y="350" class="wx-t-s">13′ out of square ≈ 7.6 mm over 2 m</text><line x1="250" y1="338" x2="591.5" y2="338" class="wx-dim"/><circle cx="591.5" cy="338" r="6.5" class="wx-c1"/><text x="712" y="342" class="wx-t-s" text-anchor="end">Egypt, c. 2560 BCE</text></g><g class="wx-pop" style="--d:9"><text x="24" y="376" class="wx-t-b wx-t-a">Hoysala pillars, Barabar walls</text><text x="24" y="390" class="wx-t-s">no published measurement</text><rect x="364.5" y="368" width="279.5" height="20" rx="10" class="wx-accfill wx-o20"/><rect x="364.5" y="368" width="279.5" height="20" rx="10" class="wx-dash"/><text x="504.2" y="382" class="wx-t-b wx-t-a" text-anchor="middle">?   unmeasured   ?</text></g><text x="24" y="452" class="wx-t-s">Different measures (flatness, straightness, squareness) are mixed: read orders of magnitude, not exact comparisons.</text></svg></div></div><figcaption>Published figures for ancient Egyptian stonework and modern machining on one logarithmic scale. The Indian objects have no published measurements, so they appear as an honest question mark. <span class="wx-src">Based on: Petrie (1883) for the Great Pyramid casing and coffer; ISO 2768-1 for general tolerances; typical figures for surface plates and CNC machining; visual acuity of about one arcminute.</span></figcaption><p class="vh">A horizontal logarithmic scale from 0.001 to 100 millimetres. Rows show a laboratory granite surface plate at a few micrometres, precision CNC machining at about 0.005 mm, the limit of the naked eye at about 0.1 mm, the ISO 2768 fine workshop tolerance of 0.2 mm, the Great Pyramid casing straightness of 0.25 mm and joints of 0.5 mm measured by Petrie, and Khufu&#x27;s granite coffer about 7.6 mm out of square. A final dashed band for the Hoysala pillars and Barabar walls spans a wide range and is labelled unmeasured.</p></figure><p>For comparison, the best-measured ancient precision stonework is at Giza. In the 1880s Flinders Petrie measured the Great Pyramid&#x27;s casing blocks and found their faces departed from a straight line by an average of about 0.25 mm over 1.9 m, with joints about 0.5 mm wide. He also found Khufu&#x27;s granite coffer &#x27;not finely wrought&#x27;, its corners out of square by 13 minutes of arc, about 7.6 mm across 2 m. Those are superb results for hand work, and they are still hundreds of times coarser than a modern precision machine, which works to around 0.005 mm.</p><p>The naked eye is a poor judge of this. At reading distance it can resolve about 0.1 mm; across a room, far less. So a pillar that is round to within a millimetre will look flawless, and a polished wall that bows by a few millimetres over several metres will look perfectly flat, especially when it is reflecting light. That is not a trick; it is how human perception works, and it is why measurement matters.</p></section><section class="wsec" id="india-stone-s8"><h3 class="wsec-h"><span class="wsec-n">08</span>Verdicts, and what is still unknown</h3><p>Put the claims side by side with the evidence and a clear picture emerges. The Barabar Caves are dated by the donors&#x27; own inscriptions, one of them was abandoned half-finished, and their famous polish appears on other hand-carved Mauryan works. The Hoysala pillars are almost certainly the product of hand-powered lathes turning a soft, cooperative stone. None of it needs lasers or lost machinery, and the idea that it does is best treated as busted.</p><ul class="wlist"><li>Unknown: the exact abrasives and burnishers used for Mauryan polish, and how long each wall took.</li><li>Unknown: the design of the Hoysala lathes, and whether every round pillar was turned or some were carved by hand.</li><li>Unknown: how precise any of these surfaces really are, because nobody has published measurements.</li><li>Known: who paid for Barabar, roughly when, and that the work was done in stages by people with iron tools.</li></ul><p>That third unknown is an invitation. A few hours with a modern 3D scanner in Karan Chaupar or in the hall at Halebidu would settle the precision question for good, one way or the other. Whatever the numbers show, they will tell the story of craftspeople who knew their stone intimately and had the patience to make it sing.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">257 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Ashoka dedicates Barabar caves to the Ajivikas (his 12th year)</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">250 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Karan Chaupar inscription, Ashoka&#x27;s 19th year</span></li><li class="wtl-build" style="--i:2"><span class="wtl-y">230 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Dasharatha dedicates the Nagarjuni caves nearby</span></li><li class="wtl-build" style="--i:3"><span class="wtl-y">1117 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Chennakeshava temple at Belur begun</span></li><li class="wtl-build" style="--i:4"><span class="wtl-y">1121 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Hoysaleswara temple at Halebidu begun</span></li><li class="wtl-find" style="--i:5"><span class="wtl-y">1898 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Peppé opens the Piprahwa stupa and its stone coffer</span></li><li class="wtl-event" style="--i:6"><span class="wtl-y">1924 CE</span><span class="wtl-k">Event</span><span class="wtl-t">E. M. Forster fictionalises Barabar as the &#x27;Marabar Caves&#x27;</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">1996 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Foekema&#x27;s guide catalogues Hoysala lathe-turned pillars</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2007 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Harry Falk re-reads the Karan Chaupar inscription</span></li><li class="wtl-event" style="--i:9"><span class="wtl-y">2023 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Hoysala temples inscribed by UNESCO</span></li><li class="wtl-event" style="--i:10"><span class="wtl-y">2025 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Piprahwa gems withdrawn from auction and returned to India</span></li></ol><h3 class="sub-h wsub">The big debates</h3><div class="debate"><p class="debate-q">Were the Barabar caves made with lost machine technology?</p><div class="sides"><div class="side"><b>Yes: the geometry and polish are too perfect for hand tools.</b><span>Viral posts describe the rooms as perfectly symmetrical, &#x27;machined&#x27; boxes with mirror walls cut into some of the hardest rock there is.</span></div><div class="side"><b>No: they show a hand process, dated by inscriptions.</b><span>Ashoka&#x27;s and Dasharatha&#x27;s inscriptions date the caves; the unfinished Lomas Rishi cave has an uncompleted vault and lumps of rock left on its floor; the same Mauryan polish appears on hand-worked sandstone pillars and sculpture.</span></div></div><p class="debate-why"><b>The bold claim:</b> The Barabar caves required machine tools or lost high technology.</p><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Nothing at Barabar requires more than iron tools, abrasives and a great deal of labour, and the unfinished cave shows the work stopped mid-process, which is exactly what hand work looks like. No measurement shows machine tolerances. The details of the polishing recipe are not documented, but &#x27;we do not know the recipe&#x27; is very different from &#x27;humans could not do it&#x27;.</p></div><div class="debate"><p class="debate-q">Were Hoysala pillars really turned on a lathe?</p><div class="sides"><div class="side"><b>Yes: they are circular, ringed and repeated in a way only turning produces.</b><span>Historians from Sastri (1955) to Foekema (1996) and Kamath (2001) describe them as lathe-turned; their concentric rings and bell shapes suit a rotating workpiece in soft stone.</span></div><div class="side"><b>Not established: they may have been carved by hand with templates.</b><span>No Hoysala lathe or written description of one survives, and skilled carvers can produce round forms by hand with guides and templates.</span></div></div><p class="debate-why"><b>The bold claim:</b> The shafts of the round Hoysala pillars were turned on large lathes.</p><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The shapes and surface patterns fit turning well, hand-powered lathes were familiar in India, and chloritic schist is soft enough to turn with iron tools. But the argument rests on the look of the pillars, not on a surviving machine, text or tool-mark study, so it stays plausible rather than strong.</p></div><div class="debate"><p class="debate-q">Are the pillars and boxes made to machine-shop tolerances?</p><div class="sides"><div class="side"><b>Yes: they look flawless, so they must be precise to a fraction of a millimetre.</b><span>Videos compare pillar circles and cave corners to modern machined parts and describe them as perfect.</span></div><div class="side"><b>Unknown: nobody has measured them.</b><span>We found no published laser scan or metrology of the pillars or the Barabar walls. The eye can only judge to about 0.1 mm at close range and much less across a room.</span></div></div><p class="debate-why"><b>The bold claim:</b> Indian &#x27;stone boxes&#x27; and pillars match modern machining tolerances.</p><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">A tolerance is a number, and no number has been published. Until someone scans the objects, claims of machine-level precision rest on photographs and impressions. The best-measured ancient comparison, Petrie&#x27;s survey of Giza, found fine but clearly hand-made accuracy, which is what we should expect here too.</p></div><details class="srcs"><summary>Sources for this deep dive (13)</summary><ol><li>Falk, H. (2006). Aśokan Sites and Artefacts: A Source-Book with Bibliography. Philipp von Zabern, Mainz.</li><li>Gupta, S. P. (1980). The Roots of Indian Art. B. R. Publishing, Delhi.</li><li>Foekema, G. (1996). Complete Guide to Hoysala Temples. Abhinav Publications, New Delhi.</li><li>Kamath, S. U. (2001). A Concise History of Karnataka. Jupiter Books, Bangalore.</li><li>Sastri, K. A. N. (1955). A History of South India. Oxford University Press.</li><li>Hardy, A. (1995). Indian Temple Architecture: Form and Transformation. IGNCA and Abhinav Publications.</li><li>Dagens, B. (trans.) (1994). Mayamata: An Indian Treatise on Housing, Architecture and Iconography. IGNCA and Motilal Banarsidass.</li><li>Acharya, P. K. (1933–34). Architecture of Manasara (translation). Oxford University Press.</li><li>Petrie, W. M. F. (1883). The Pyramids and Temples of Gizeh. Field and Tuer, London.</li><li>ISO 2768-1:1989. General tolerances, Part 1: Tolerances for linear and angular dimensions. International Organization for Standardization.</li><li>Peppé, W. C. (1898). The Piprahwa Stupa, containing relics of Buddha. Journal of the Royal Asiatic Society (July 1898).</li><li>UNESCO World Heritage Centre (2023). Sacred Ensembles of the Hoysalas (List no. 1670).</li><li>Kasdorf, K. (2013). Forming Dōrasamudra: Temples of the Hoysaḷa Capital in Context. PhD dissertation, Columbia University.</li></ol></details><aside class="rc-cite" data-v="marvels" data-id="marvel-india-stone" data-t="India&#x27;s &#x27;impossible&#x27; stone boxes and pillars"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>India&#x27;s &#x27;impossible&#x27; stone boxes and pillars</i>. <span class="cite-u">https://residual-continuum.vercel.app/#marvels/marvel-india-stone</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="marvel-russia-stones-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Саблинские пещеры, Ленинградская область.jpg" data-cap="The Sablino caves near St Petersburg: flat-roofed tunnels left by 19th-century sand mining" data-big><figcaption></figcaption></figure><div class="sh-k">Gornaya Shoria, Siberia and Sablino, near St Petersburg</div><h2 class="sh-t" id="marvel-russia-stones-st" tabindex="-1">Russia&#x27;s &#x27;cut stone&#x27; mountains and caves</h2><p class="sh-s">Giant &#x27;megalith&#x27; blocks on a Siberian mountain and glassy, flat-walled caves look cut by someone. Geology and old mining records tell a different story.</p><div class="sh-v"><span class="vstamp vstamp--mys">Mystery <span class="pips" role="img" aria-label="Mystery level 1 of 5"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></span></span></div></div><div class="wquick"><h3 class="sub-h">The quick read</h3><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="1570" >1,570</b><span class="ctr-u"> m</span></div><div class="ctr-l">height of Mount Mustag, a granite peak in Gornaya Shoria</div><div class="ctr-c">Russian Wikipedia, Gornaya Shoria</div></div><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="25" >25</b><span class="ctr-u"> km</span></div><div class="ctr-l">length of the Mustag granite massif</div><div class="ctr-c">Russian Wikipedia, Gornaya Shoria</div></div><div class="ctr"><div class="ctr-v">often <b class="ctr-n" data-v="3" >3</b><span class="ctr-u"> sets</span></div><div class="ctr-l">of joints at roughly right angles, typical in granite</div><div class="ctr-c">Pollard and Aydin 1988</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="6500" >6,500</b><span class="ctr-u"> m</span></div><div class="ctr-l">of hand-dug passages in Sablino&#x27;s longest sand-mine cave</div><div class="ctr-c">Kovalyov 2017</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="0.1" data-dec="1">0.1</b><span class="ctr-u"> mm</span></div><div class="ctr-l">thickness of the polished slip zone on a fault</div><div class="ctr-c">Siman-Tov et al. 2013</div></div><div class="ctr"><div class="ctr-v">down to <b class="ctr-n" data-v="0.01" data-dec="2">0.01</b><span class="ctr-u"> µm</span></div><div class="ctr-l">size of the smallest grains that make a fault mirror</div><div class="ctr-c">Siman-Tov et al. 2013</div></div></div><div class="stats"><div><b>1,570 m, part of a granite massif over 25 km long</b><span>Mount Mustag, Gornaya Shoria</span></div><div><b>from expeditions in 2013, worldwide in 2014</b><span>Viral &#x27;megalith&#x27; photos</span></div><div><b>sand mines dug from the early 1800s to the mid 1900s</b><span>Sablino caves</span></div><div><b>c. 6,500 m (Levoberezhnaya)</b><span>Longest Sablino cave</span></div><div><b>c. 0.1 mm thick</b><span>Slip zone on a polished fault</span></div><div><b>c. 0.01–1 µm</b><span>Grain size on a fault mirror</span></div></div><p>Nobody built the Shoria blocks: they were split by nature. Granite crystallises from magma kilometres underground. As it cools and is squeezed by tectonic forces, it cracks in sets of nearly flat, parallel fractures called joints, often in three directions at roughly right angles. When uplift and erosion bring the granite to the surface, the release of weight opens more cracks parallel to the ground. Frost, water and roots then widen the joints until the rock stands as stacks of straight-sided blocks, known as tors, with rubble fields below. Flat, shiny cave and mine walls have two usual origins: people digging along easy layers, as in the Sablino sand mines near St Petersburg, or natural fault surfaces, called slickensides, polished when blocks of rock ground past each other.</p><div class="flip" id="marvel-russia-stones-flip"><div class="flip-in"><div class="flip-f"><b>The myth</b><p>A Siberian mountain hides a colossal wall of cut granite blocks, some said to weigh thousands of tonnes, built by a lost civilisation; smooth, flat-walled Russian caves were cut by advanced machines.</p></div><div class="flip-b"><b>The reality</b><p>The Shoria &#x27;megaliths&#x27; match natural granite jointing and weathering seen on mountains worldwide, and no tool marks, quarries or archaeology accompany them. The best-known flat-walled caves near St Petersburg are documented 19th and 20th century sand mines. Mirror-smooth natural rock faces are slickensides, polished by fault movement; geologists have measured how they form down to the scale of nanometres.</p></div></div><button type="button" class="flip-btn" aria-pressed="false" onclick="flip('marvel-russia-stones-flip',this)">Flip it</button></div><div class="twist"><b>Wow</b><p>A fault surface can be polished to a mirror by an earthquake: grinding crushes grains to less than a thousandth of a millimetre, finer than a wavelength of light, so the rock reflects like glass.</p></div><div class="wmys"><span>Mystery meter</span><span class="pips" role="img" aria-label="Mystery level 1 of 5"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></span><small>Mostly solved</small></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">9 min read · 2,070 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Russia&#x27;s &#x27;cut stone&#x27; mountains and caves"><button type="button" class="wtoc-i" data-go="russia-stones-s1">The mountain that looks built</button><button type="button" class="wtoc-i" data-go="russia-stones-s2">What the claims actually say</button><button type="button" class="wtoc-i" data-go="russia-stones-s3">A granite mountain in Siberia</button><button type="button" class="wtoc-i" data-go="russia-stones-s4">How granite breaks into bricks</button><button type="button" class="wtoc-i" data-go="russia-stones-s5">Testing the &#x27;megalith&#x27; idea</button><button type="button" class="wtoc-i" data-go="russia-stones-s6">Why our eyes see walls</button><button type="button" class="wtoc-i" data-go="russia-stones-s7">Caves with flat ceilings</button><button type="button" class="wtoc-i" data-go="russia-stones-s8">Mirror walls: rock polished by earthquakes</button><button type="button" class="wtoc-i" data-go="russia-stones-s9">A field guide: nature, miners or masons?</button><button type="button" class="wtoc-i" data-go="russia-stones-s10">Verdicts, and what is still open</button></nav></div><section class="wsec" id="russia-stones-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The mountain that looks built</h3><p>The photographs are genuinely startling. On a forested ridge in southern Siberia, huge grey blocks of granite stand in rows, their faces flat, their edges straight, their corners close to right angles. Some sit on top of others like courses of a wall. A person standing beside them comes up to the knee of the lowest block. It is very easy to look at these pictures and think: someone cut and stacked these.</p><p>That is exactly what happened in 2013 and 2014, when images from the mountains of Gornaya Shoria, also called Mount Shoria, in Kemerovo Oblast began to spread across the internet as &#x27;the Siberian megaliths&#x27;. Around the same time, a second family of images took off: long, flat-roofed passages and glassy, smooth rock walls inside Russian caves and hills, offered as proof of ancient tunnelling machines. The site owner&#x27;s shorthand for all this, &#x27;Russian mountain geological anomalies: seemingly smooth-cut rocks inside deep caves&#x27;, captures both.</p><blockquote class="wpull"><p>Nature is a surprisingly good stonemason. The trick is knowing what her tool marks look like.</p></blockquote><p>This deep dive takes both sets of claims seriously, tests them against geology and history, and gives a verdict on each. Spoiler: the rocks are real and remarkable, and the most likely explanations are natural or industrial rather than ancient. But the way they got that way is a better story than any lost civilisation.</p></section><section class="wsec" id="russia-stones-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What the claims actually say</h3><p>It helps to be precise about what we are testing, because the viral versions are often vague about places. After searching, we matched the phrase to three things.</p><ul class="wlist"><li>The Gornaya Shoria &#x27;megaliths&#x27;: photographs from expeditions in 2013 associated with the Russian writer Georgy Sidorov, showing giant blocks on granite peaks, especially around Mount Mustag near the ski village of Sheregesh. Posts described blocks with flat surfaces, straight corners and sharp edges, some claimed to weigh thousands of tonnes, and some compared the stacks to the polygonal stone walls of Peru.</li><li>Flat-walled &#x27;ancient tunnels&#x27;: images of long, square-edged passages with level ceilings, many of which trace to the Sablino caves and similar workings south of St Petersburg.</li><li>Mirror-smooth walls inside caves and mines: glossy, flat rock faces, sometimes finely scratched, presented as evidence of cutting and polishing.</li></ul><p>We could not trace every image to a single site, and some circulate with no location at all. We also could not verify the tonnages quoted for the Shoria blocks; they appear to be estimates from photographs. Where a claim is specific enough to test, we test it. Where it is not, we say so.</p></section><section class="wsec" id="russia-stones-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>A granite mountain in Siberia</h3><p>Gornaya Shoria is a mountainous, heavily forested region in the south of Kemerovo Oblast, where the ranges of the Altai, the Kuznetsk Alatau and the Salair ridge meet. Its peaks rise to about 1,630 m. Mount Mustag, at 1,570 m, is the heart of a large granite massif that runs for more than 25 km from southwest to northeast. Russian reference works describe how weathering has shaped its summits into forms that look like camel humps and the towers of medieval castles.</p><p>That description matters. Long before anyone called them megaliths, the blocky crags of Mustag were known as a natural landscape of weathered granite. Mountains like this exist across Siberia and around the world, and geologists have been explaining them for well over a century. The explanation starts deep underground.</p><p>Gornaya Shoria is also a place of long, snowy winters, taiga forest and steep, rocky summits above the tree line, which is exactly the setting in which frost shatters exposed rock most effectively. The same summits are visited by hikers and skiers, which is partly why the photographs exist at all.</p></section><section class="wsec" id="russia-stones-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>How granite breaks into bricks</h3><p>Granite forms when a large body of molten rock, a magma, cools and crystallises slowly, kilometres below the surface. As it cools, it contracts. Later it is squeezed and stretched by the movements of the Earth&#x27;s crust. Rock is strong in compression but weak in tension, so it cracks. The cracks are not random: they form in families of roughly parallel, roughly flat fractures called joints, and in granite there are often three families at close to right angles to one another.</p><figure class="wx wx--steps" id="russia-stones-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">How a mountain splits into giant &#x27;blocks&#x27;</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How a mountain splits into giant &#x27;blocks&#x27;"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" class="wx-svg" role="img" aria-labelledby="russia-stones-f1-t"><title id="russia-stones-f1-t">How a granite mountain splits into giant blocks that look cut</title><g class="wx-st wx-hide" data-only="1"><polygon points="40,110 670,110 670,245.1 659.5,244.2 649,243.1 638.5,241.8 628,240.4 617.5,238.8 607,237.1 596.5,235.1 586,233 575.5,230.7 565,228.1 554.5,225.5 544,222.6 533.5,219.6 523,216.5 512.5,213.2 502,210 491.5,206.6 481,203.3 470.5,200.1 460,196.9 449.5,193.9 439,191.1 428.5,188.5 418,186.2 407.5,184.2 397,182.6 386.5,181.3 376,180.5 365.5,180.1 355,180 344.5,180.5 334,181.3 323.5,182.5 313,184.2 302.5,186.1 292,188.4 281.5,191 271,193.8 260.5,196.8 250,199.9 239.5,203.2 229,206.5 218.5,209.8 208,213.1 197.5,216.3 187,219.4 176.5,222.5 166,225.3 155.5,228 145,230.5 134.5,232.9 124,235 113.5,237 103,238.8 92.5,240.4 82,241.8 71.5,243 61,244.1 50.5,245.1 40,245.9" class="wx-soil wx-edge-soft"/></g><g class="wx-st wx-hide" data-only="2"><polygon points="40,110 670,110 670,245.1 659.5,244.2 649,243.1 638.5,241.8 628,240.4 617.5,238.8 607,237.1  class="wx-stone2 wx-edge"/><rect x="252" y="228" width="48" height="32" rx="5" class="wx-stone2 wx-edge"/><rect x="426" y="232" width="40" height="28" rx="5" class="wx-stone2 wx-edge"/><rect x="470" y="248" width="34" height="24" rx="6" class="wx-stone2 wx-edge" transform="rotate(14 487.0 260.0)"/><rect x="512" y="262" width="30" height="22" rx="6" class="wx-stone2 wx-edge" transform="rotate(-10 527.0 273.0)"/><rect x="200" y="250" width="32" height="22" rx="6" class="wx-stone2 wx-edge" transform="rotate(-12 216.0 261.0)"/><rect x="160" y="262" width="28" height="20" rx="6" class="wx-stone2 wx-edge" transform="rotate(8 174.0 272.0)"/><g class="wx-line"><circle cx="560" cy="270.3" r="1.3"/><path d="M560 271.5V276.4M560 276.4L558.3 283M560 276.4L561.7 283M557.9 275.4L560 272.6L562.1 275.4"/></g><text x="360" y="140" class="wx-t-b wx-t-a" text-anchor="middle">a tor: blocks that look quarried and stacked</text><text x="560" y="310" class="wx-t-s" text-anchor="middle">person</text><text x="170" y="300" class="wx-t-s" text-anchor="middle">fallen blocks</text></g><g class="wx-st wx-hide" data-only="1"><circle class="wx-num" cx="36" cy="34" r="9"/><text x="36" y="37.8" class="wx-numt" text-anchor="middle">1</text><text x="54" y="38" class="wx-t-b wx-t-a">Deep and hot</text><text x="28" y="60" class="wx-t">A body of granite magma cools slowly</text><text x="28" y="76" class="wx-t">under kilometres of older rock.</text></g><g class="wx-st wx-hide" data-only="2"><circle class="wx-num" cx="36" cy="34" r="9"/><text x="36" y="37.8" class="wx-numt" text-anchor="middle">2</text><text x="54" y="38" class="wx-t-b wx-t-a">Cracking</text><text x="28" y="60" class="wx-t">Shrinking as it cools, and squeezed by</text><text x="28" y="76" class="wx-t">tectonic forces, it cracks in sets of joints.</text></g><g class="wx-st wx-hide" data-only="3"><circle class="wx-num" cx="36" cy="34" r="9"/><text x="36" y="37.8" class="wx-numt" text-anchor="middle">3</text><text x="54" y="38" class="wx-t-b wx-t-a">Unloading</text><text x="28" y="60" class="wx-t">Uplift and erosion strip the cover; relieved</text><text x="28" y="76" class="wx-t">of weight, sheet joints open near the top.</text></g><g class="wx-st wx-hide" data-only="4"><circle class="wx-num" cx="36" cy="34" r="9"/><text x="36" y="37.8" class="wx-numt" text-anchor="middle">4</text><text x="54" y="38" class="wx-t-b wx-t-a">Weathering</text><text x="28" y="60" class="wx-t">Water freezes and thaws in the joints,</text><text x="28" y="76" class="wx-t">roots pry, and the cracks slowly widen.</text></g><g class="wx-st wx-hide" data-only="5"><circle class="wx-num" cx="36" cy="34" r="9"/><text x="36" y="37.8" class="wx-numt" text-anchor="middle">5</text><text x="54" y="38" class="wx-t-b wx-t-a">Blocks</text><text x="28" y="60" class="wx-t">Loose rock is carried off. Straight-sided</text><text x="28" y="76" class="wx-t">blocks remain, stacked like masonry.</text></g><text x="28" y="432" class="wx-t-s">Schematic, not to scale: steps 1–4 span kilometres and millions of years; step 5 shows an outcrop tens of metres high.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Deep and hot: a body of granite magma cools slowly under kilometres of older rock.</p><ol class="wx-steplist"><li>Deep and hot: a body of granite magma cools slowly under kilometres of older rock.</li><li>Cracking: shrinking as it cools and squeezed by tectonic forces, the granite cracks in sets of joints, often at roughly right angles.</li><li>Unloading: uplift and erosion strip away the cover; relieved of weight, sheet joints open parallel to the surface.</li><li>Weathering: water freezes and thaws in the joints, roots pry, and the cracks slowly widen.</li><li>Blocks: loose rock is carried off, leaving straight-sided blocks stacked like masonry, a tor, with fallen blocks below.</li></ol><figcaption>The natural recipe for &#x27;megaliths&#x27;: granite, cracks in sets, unloading and weathering. Schematic and not to scale. <span class="wx-src">Based on: General model of joint formation and tor development after Linton (1955), Pollard and Aydin (1988), Twidale (1982) and Migoń (2006); schematic, not to scale.</span></figcaption><p class="vh">Five-step schematic cross-section. Step 1: a body of granite magma cools under kilometres of older rock. Step 2: vertical joints crack the granite, and an inset cube shows three joint sets at roughly right angles. Step 3: uplift and erosion remove the cover, and curved sheet joints open parallel to the surface. Step 4: frost, water and roots widen the cracks near the surface. Step 5: loose rock has been removed, leaving a tor of straight-sided blocks stacked like masonry, with fallen blocks on the slopes and a tiny person for scale.</p></figure><p>When uplift and erosion eventually strip away the kilometres of rock above, the granite is relieved of an enormous weight. It expands slightly and opens another set of cracks, sheet joints, roughly parallel to the ground surface. Now the rock is divided into boxes: two sets of vertical joints and one set of horizontal ones make blocks that can be almost perfectly rectangular. In the classic analysis by the geographer David Linton in 1955, deep weathering along these joints, followed by removal of the loosened material, leaves the sound cores standing as tors.</p><p>In a cold climate like southern Siberia&#x27;s, frost does much of the work. Water seeps into the joints, freezes and expands, levering the blocks apart a fraction at a time, winter after winter. Roots do the same. Blocks that lose their support slide or topple and collect on the slopes below as block fields, known in Russian as kurums. What remains on the summit looks like stacked masonry, because in a sense it is: masonry laid by the joints.</p><aside class="wcall"><b>Why the faces are flat</b><p>A joint is a clean break that grew as a single fracture, often over many metres. When two blocks separate along it, both faces are nearly flat, and because the joint sets cross at close to right angles, the corners are close to square. Nature does not need to &#x27;cut&#x27; a flat face; it only needs to open one that is already there. Look closely at such faces and you often see subtle ribs and plume-like markings that record how the crack spread, a signature quite unlike chisel or saw marks.</p></aside></section><section class="wsec" id="russia-stones-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Testing the &#x27;megalith&#x27; idea</h3><p>How could we tell a natural tor from a ruined wall? Archaeologists and geologists would ask a few simple questions. Are the blocks still attached to bedrock, or were they moved? Are there tool marks, drill holes or wedge sockets? Is there mortar, or blocks deliberately shaped to fit their neighbours? Is there a quarry nearby, with waste flakes and abandoned pieces? Are there artefacts, hearths or burials that can be dated?</p><p>For the Shoria blocks, the answers available in the public record are all negative or unknown. We found no published report of tool marks, quarries, fitted joints, mortar or datable artefacts, and no peer-reviewed study of the outcrops at all. Meanwhile, everything that is visible in the photographs, the flat faces, square corners, stacked &#x27;courses&#x27; and toppled blocks, is exactly what jointed granite produces. In jointed granite anywhere, it is common to find blocks that have split but not yet moved apart, the natural process caught halfway.</p><p>The weight claims deserve a quick sanity check too. Granite weighs about 2.6–2.7 tonnes per cubic metre. A block 20 m long, 6 m high and 6 m deep would weigh around 1,900 tonnes. That sounds like an argument for giant machines until you remember that the block did not need to be lifted: jointed blocks are usually where they formed, and gravity alone moves the ones that fall.</p><blockquote class="wpull"><p>A natural block does not need to be lifted into place. It was always there; the rock around it left.</p></blockquote></section><section class="wsec" id="russia-stones-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Why our eyes see walls</h3><p>There is a reason these photos fool so many people, and it is not gullibility. Human brains are tuned to spot straight lines and right angles, because in everyday life those features almost always mean people made something. Buildings, furniture and roads are rectangular; trees, clouds and hills are not. So when nature produces a right angle, we notice, and we reach for a builder.</p><p>Photographs make it harder. Without a familiar object in the frame, scale collapses: a two-metre block and a twenty-metre block can look identical. Moss and lichen soften the rough fracture textures that would give the game away, and a wide-angle lens exaggerates the straightness of nearby edges. Choosing the most wall-like angle, and leaving out the chaotic jumble a few metres to the side, finishes the illusion.</p><p>The same thing has happened elsewhere. In Rockwall, Texas, buried sandstone dikes, sheets of sand that filled ancient cracks and hardened, were long claimed to be a buried man-made wall; geologists explain them as natural. The basalt columns of the Giant&#x27;s Causeway in Northern Ireland are so regular that legend credited them to a giant. Off Yonaguni in Japan, stepped underwater sandstone terraces are still argued over, although most geologists read them as natural jointing. Russia&#x27;s Shoria blocks belong to a large, worldwide family of rocks that look built.</p></section><section class="wsec" id="russia-stones-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>Caves with flat ceilings</h3><p>The second set of images shows passages with level ceilings and square-cut walls, sometimes stretching into the dark for hundreds of metres. Many of the most photogenic come from the Sablino caves, on the Tosna and Sablinka rivers south of St Petersburg, now a popular nature park. They are not ancient. They were dug by miners.</p><p>From the early 1800s to the middle of the 20th century, the region&#x27;s pale, soft quartz sandstone was mined for glass-making. A 2017 survey of bat roosts in the Leningrad region&#x27;s artificial caves lists the Sablino group among them and gives the longest, Levoberezhnaya, a length of about 6,500 m. Miners dug the soft sand with hand tools and left the firmer layer above as a natural roof, which is why the ceilings are so often flat. Elsewhere in the region, similar galleries were cut to quarry good building limestone.</p><p>Russia also has spectacular natural caves, such as the Kungur Ice Cave in the Urals, surveyed by the cartographer Semyon Remezov in 1703 and open to visitors since 1914. Caves dissolved in layered, soluble rock often have flat ceilings too, because the water follows bedding planes, the natural boundaries between layers. Flatness in a cave, in other words, has at least two ordinary causes: miners following a layer, or water following one.</p></section><section class="wsec" id="russia-stones-s8"><h3 class="wsec-h"><span class="wsec-n">08</span>Mirror walls: rock polished by earthquakes</h3><p>The most beautiful &#x27;impossible&#x27; surfaces are the glossy ones: rock faces so smooth they reflect a torch beam, marked with fine parallel scratches. These are slickensides, and they are one of the classic sights of structural geology. A slickenside forms on a fault, where two blocks of rock grind past each other, either in sudden earthquake slips or in slow creep. The scratches, called slickenlines, run parallel to the direction of movement.</p><figure class="photo wimg" data-img="Fairview Fault mirror at Dixie Valley Nevada.jpg" data-cap="A fault mirror at Dixie Valley, Nevada, USA: rock polished smooth by movement along a fault, with no tool involved."><figcaption></figcaption></figure><figure class="wx wx--static" id="russia-stones-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">Why some rock walls shine like polished stone</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Why some rock walls shine like polished stone"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" class="wx-svg" role="img" aria-labelledby="russia-stones-f2-t"><title id="russia-stones-f2-t">Why fault surfaces can shine like polished stone: a slickenside explained at three scales</title><text x="24" y="30" class="wx-t-cap">1 · What you see on the hillside or in a cave</text><polygon points="40,110 330,60 350,380 60,420" class="wx-rock wx-edge wx-pop" style="--d:1"/><polygon points="90,150 300,112 318,300 110,340" class="wx-sky wx-o80 wx-pop" style="--d:2"/><line x1="70" y1="138" x2="92" y2="408" class="wx-thin wx-draw" pathLength="1" style="--d:3"/><line x1="88.5" y1="134.6" x2="110.5" y2="404.6" class="wx-thin wx-draw" pathLength="1" style="--d:4"/><line x1="106.9" y1="131.2" x2="128.9" y2="401.2" class="wx-thin wx-draw" pathLength="1" style="--d:5"/><line x " class="wx-inkfill wx-o40"/><circle cx="469.2" cy="380" r="1" class="wx-inkfill wx-o40"/><circle cx="473.6" cy="387" r="1" class="wx-inkfill wx-o40"/><circle cx="478" cy="381" r="1" class="wx-inkfill wx-o40"/><circle cx="482.4" cy="388" r="1" class="wx-inkfill wx-o40"/><circle cx="486.8" cy="382" r="1" class="wx-inkfill wx-o40"/><circle cx="491.2" cy="376" r="1" class="wx-inkfill wx-o40"/><circle cx="495.6" cy="383" r="1" class="wx-inkfill wx-o40"/><circle cx="500" cy="377" r="1" class="wx-inkfill wx-o40"/><circle cx="504.4" cy="384" r="1" class="wx-inkfill wx-o40"/><circle cx="508.8" cy="378" r="1" class="wx-inkfill wx-o40"/><circle cx="513.2" cy="385" r="1" class="wx-inkfill wx-o40"/><circle cx="517.6" cy="379" r="1" class="wx-inkfill wx-o40"/><circle cx="522" cy="386" r="1" class="wx-inkfill wx-o40"/><circle cx="526.4" cy="380" r="1" class="wx-inkfill wx-o40"/><circle cx="530.8" cy="387" r="1" class="wx-inkfill wx-o40"/><circle cx="535.2" cy="381" r="1" class="wx-inkfill wx-o40"/><circle cx="539.6" cy="388" r="1" class="wx-inkfill wx-o40"/><circle cx="544" cy="382" r="1" class="wx-inkfill wx-o40"/><circle cx="548.4" cy="376" r="1" class="wx-inkfill wx-o40"/><circle cx="552.8" cy="383" r="1" class="wx-inkfill wx-o40"/><circle cx="557.2" cy="377" r="1" class="wx-inkfill wx-o40"/><circle cx="561.6" cy="384" r="1" class="wx-inkfill wx-o40"/><circle cx="566" cy="378" r="1" class="wx-inkfill wx-o40"/><circle cx="570.4" cy="385" r="1" class="wx-inkfill wx-o40"/><circle cx="574.8" cy="379" r="1" class="wx-inkfill wx-o40"/><circle cx="579.2" cy="386" r="1" class="wx-inkfill wx-o40"/><circle cx="583.6" cy="380" r="1" class="wx-inkfill wx-o40"/><circle cx="588" cy="387" r="1" class="wx-inkfill wx-o40"/><circle cx="592.4" cy="381" r="1" class="wx-inkfill wx-o40"/><circle cx="596.8" cy="388" r="1" class="wx-inkfill wx-o40"/><circle cx="601.2" cy="382" r="1" class="wx-inkfill wx-o40"/><circle cx="605.6" cy="376" r="1" class="wx-inkfill wx-o40"/><circle cx="610" cy="383" r="1" class="wx-inkfill wx-o40"/><circle cx="614.4" cy="377" r="1" class="wx-inkfill wx-o40"/><circle cx="618.8" cy="384" r="1" class="wx-inkfill wx-o40"/><circle cx="623.2" cy="378" r="1" class="wx-inkfill wx-o40"/><circle cx="627.6" cy="385" r="1" class="wx-inkfill wx-o40"/><circle cx="632" cy="379" r="1" class="wx-inkfill wx-o40"/><circle cx="636.4" cy="386" r="1" class="wx-inkfill wx-o40"/><circle cx="640.8" cy="380" r="1" class="wx-inkfill wx-o40"/><circle cx="645.2" cy="387" r="1" class="wx-inkfill wx-o40"/><circle cx="649.6" cy="381" r="1" class="wx-inkfill wx-o40"/><circle cx="654" cy="388" r="1" class="wx-inkfill wx-o40"/><circle cx="658.4" cy="382" r="1" class="wx-inkfill wx-o40"/><circle cx="662.8" cy="376" r="1" class="wx-inkfill wx-o40"/><circle cx="667.2" cy="383" r="1" class="wx-inkfill wx-o40"/><circle cx="671.6" cy="377" r="1" class="wx-inkfill wx-o40"/><circle cx="676" cy="384" r="1" class="wx-inkfill wx-o40"/><circle cx="680.4" cy="378" r="1" class="wx-inkfill wx-o40"/><circle cx="684.8" cy="385" r="1" class="wx-inkfill wx-o40"/><circle cx="689.2" cy="379" r="1" class="wx-inkfill wx-o40"/><circle cx="693.6" cy="386" r="1" class="wx-inkfill wx-o40"/><line x1="431" y1="372" x2="699" y2="372" class="wx-hl"/><text x="566" y="386" class="wx-t-b wx-halo" text-anchor="middle">slip zone, c. 0.1 mm thick</text><text x="430" y="466" class="wx-t-m">Grinding crushes grains to nanometre size</text><text x="430" y="481" class="wx-t-m">(0.01–1 µm), finer than light waves:</text><text x="430" y="496" class="wx-t-m">the surface reflects like polished stone.</text><g><rect x="610" y="296" width="20" height="5" class="wx-inkfill"/><rect x="630" y="296" width="20" height="5" class="wx-card wx-edge"/><text x="650" y="305" class="wx-t-s" dx="30" text-anchor="middle">0.2 mm</text></g></svg></div></div><figcaption>A slickenside at three scales: the exposed surface with a person, a section across the fault, and the microscopic slip zone where grinding makes a mirror. <span class="wx-src">Based on: Slip-zone thickness and nanograin sizes from Siman-Tov et al. (2013); fault-mirror processes also after Kirkpatrick et al. (2013) and Fossen (2016). Proportions of panel 1 are illustrative.</span></figcaption><p class="vh">Panel 1 shows a large tilted rock face with a glossy band and many parallel grooves, called slickenlines, running in the direction of slip marked by an arrow; a 1.7 metre person stands beside it. Panel 2 is a section in which two blocks of rock move past each other along an inclined fault plane, one up and one down. Panel 3 magnifies the contact: coarse rock grains on both sides and between them a thin slip zone about 0.1 millimetres thick filled with tiny grains, with a 0.2 millimetre scale bar.</p></figure><p>Why do they shine? In 2013 Shalev Siman-Tov and colleagues examined naturally polished &#x27;fault mirrors&#x27; under electron microscopes. They found that the shiny layer is only about a tenth of a millimetre thick and made of grains crushed down to nanometre sizes, from about 0.01 to 1 micrometre. Grains that small are finer than the wavelength of visible light, so the surface behaves optically like a polished one. The same year, James Kirkpatrick and colleagues showed that some fault mirrors formed from a silica gel produced during slip, which later hardened into a glassy film.</p><p>Fault surfaces are often exposed in mines, quarries and caves, because water and miners both tend to follow weaknesses in the rock, and a fault is a ready-made weakness. When a cave passage runs along a fault plane, one wall may be a slickenside: dead flat, glossy and striped with grooves. To someone who has never seen one, it looks like the work of a machine. To a geologist it is a fossil earthquake.</p><p>Slickensides are also useful. Because the grooves record the direction of slip, and tiny steps on the surface record which way each side moved, geologists use them to reconstruct how faults behaved, including the direction of past earthquake ruptures. A polished, striped wall is not a riddle to be explained away; it is a data sheet. Reading it tells you which way the mountain moved, and sometimes roughly how fast.</p></section><section class="wsec" id="russia-stones-s9"><h3 class="wsec-h"><span class="wsec-n">09</span>A field guide: nature, miners or masons?</h3><p>Next time a &#x27;cut stone&#x27; photo crosses your screen, a few questions will usually sort it out.</p><ul class="wlist"><li>Do the flat faces continue into the solid rock around them? Then they are probably joints, not cut blocks.</li><li>Are the scratches parallel, long and all in one direction on a glossy face? That points to a slickenside, not a tool.</li><li>Do the cuts show short, repeated strokes, drill holes or wedge sockets? That points to human work, and usually a date can be found.</li><li>Is there a record of mining or quarrying nearby? In Russia, many &#x27;ancient tunnels&#x27; have well-documented industrial histories.</li><li>Are there artefacts, foundations or quarry waste? Their absence does not rule out people, but their presence would be the real evidence.</li></ul><p>None of this takes away from the wonder. A granite mountain that splits itself into giant bricks, and an earthquake that polishes a cave wall to a mirror, are marvels in their own right, and they have far more to teach than a story about builders who left no trace.</p></section><section class="wsec" id="russia-stones-s10"><h3 class="wsec-h"><span class="wsec-n">10</span>Verdicts, and what is still open</h3><p>The Sablino tunnels are documented sand mines: that claim is busted. Mirror-smooth rock faces have a well-measured natural explanation in fault slip: also busted as evidence of machines. The Shoria &#x27;megaliths&#x27; are the most interesting case. Everything we can see fits natural jointing and weathering of a known granite massif, and nothing specific to human building has been reported, so the man-made idea has no receipts. But we should be honest that no geologist appears to have published a detailed study of these particular outcrops.</p><p>That is a gap worth filling, and it would not be hard. A field survey measuring the orientations of the block faces, looking for fracture markings and tool marks, and dating the exposure of the surfaces could settle the question and would make a fine student project. Until then, the most reasonable reading is the one the mountain itself suggests: these are granite blocks made by cooling, cracking and cold, on a timescale that makes any human wall look very young indeed.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-study" style="--i:0"><span class="wtl-y">1703 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Semyon Remezov surveys the Kungur Ice Cave, a natural karst cave</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">1810 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Quartz sand mining for glass under way near Sablino (early 1800s)</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">1914 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Kungur Ice Cave opens to visitors</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">1950 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Sand mining in the Leningrad region caves ends (mid 1900s)</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">1955 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">D. L. Linton&#x27;s classic paper on how granite tors form</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1988 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Pollard and Aydin review a century of research on rock joints</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2013 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Nanograins shown to make fault mirrors (Siman-Tov et al.)</span></li><li class="wtl-event" style="--i:7"><span class="wtl-y">2013 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Expedition photos of Shoria &#x27;megaliths&#x27; begin to circulate</span></li><li class="wtl-event" style="--i:8"><span class="wtl-y">2014 CE</span><span class="wtl-k">Event</span><span class="wtl-t">The Shoria photos go viral worldwide</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">2017 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Bat survey documents the Leningrad region&#x27;s man-made caves</span></li></ol><h3 class="sub-h wsub">The big debates</h3><div class="debate"><p class="debate-q">Are the Gornaya Shoria &#x27;megaliths&#x27; man-made?</p><div class="sides"><div class="side"><b>Yes: the blocks are too large, flat and square to be natural.</b><span>Photos from 2013 expeditions associated with the Russian writer Georgy Sidorov show huge granite blocks with straight edges and flat faces stacked in wall-like rows; posts claimed some weighed thousands of tonnes.</span></div><div class="side"><b>No: they are jointed granite outcrops, like tors on mountains worldwide.</b><span>Mount Mustag is part of a large granite massif known for castle-like weathering forms. Granite commonly splits along three sets of joints at near right angles, producing exactly such blocks; no tool marks, quarries, ramps or datable artefacts have been reported.</span></div></div><p class="debate-why"><b>The bold claim:</b> The Shoria blocks are the remains of a giant wall built by a lost civilisation.</p><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Everything visible in the photos has a well-understood natural explanation, and nothing specific to human building, such as tool marks, mortar, quarries or settlements, has been documented. We found no peer-reviewed study of these particular outcrops, so the natural explanation rests on general geology rather than a site survey, but the burden of evidence lies with the extraordinary claim, and it has not been met.</p></div><div class="debate"><p class="debate-q">Were Russia&#x27;s smooth-walled &#x27;ancient tunnels&#x27; cut by lost technology?</p><div class="sides"><div class="side"><b>Yes: the flat ceilings and straight walls look machined.</b><span>Photos of long, square-edged passages with flat roofs circulate as evidence of ancient tunnelling machines.</span></div><div class="side"><b>No: the best-known examples are recent mines.</b><span>Caves in the Leningrad region, including the Sablino group, were dug for quartz sand for glass-making from the early 1800s to the mid 1900s (Kovalyov 2017); flat roofs follow the firmer rock above the sand.</span></div></div><p class="debate-why"><b>The bold claim:</b> Flat-walled caves near St Petersburg are ancient high-tech tunnels.</p><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">These passages are documented industrial workings, well within living memory of the region&#x27;s history, and are now even studied as bat roosts. Their shapes are exactly what miners create when they dig soft sand beneath a firmer layer. Unless a specific image can be traced to somewhere else, this claim fails.</p></div><div class="debate"><p class="debate-q">Can nature make a mirror-smooth rock face?</p><div class="sides"><div class="side"><b>No: only cutting and polishing make a rock shine.</b><span>Glossy, flat faces inside caves and mines are presented as proof of tools or machines.</span></div><div class="side"><b>Yes: fault movement polishes rock.</b><span>Slickensides form when rocks grind past each other; laboratory and field studies show slip zones about 0.1 mm thick made of nanometre-sized grains that reflect light like a mirror (Siman-Tov et al. 2013; Kirkpatrick et al. 2013).</span></div></div><p class="debate-why"><b>The bold claim:</b> A mirror-smooth rock face in a cave must have been cut and polished by people.</p><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Natural fault mirrors are well documented and their physics has been measured, including the grain sizes that cause the shine. Their scratches, called slickenlines, run parallel to the direction of slip, a tell-tale sign that distinguishes them from tool marks. Some shiny surfaces in mines are human-made, but shine alone says nothing about who, or what, made it.</p></div><details class="srcs"><summary>Sources for this deep dive (10)</summary><ol><li>Pollard, D. D., and Aydin, A. (1988). Progress in understanding jointing over the past century. Geological Society of America Bulletin 100: 1181–1204. <a href="https://doi.org/10.1130/0016-7606(1988)100&lt;1181:PIUJOT&gt;2.3.CO;2" target="_blank" rel="noopener">doi:10.1130/0016-7606(1988)100&lt;1181:PIUJOT&gt;2.3.CO;2</a></li><li>Linton, D. L. (1955). The Problem of Tors. The Geographical Journal 121(4): 470–487. <a href="https://doi.org/10.2307/1791756" target="_blank" rel="noopener">doi:10.2307/1791756</a></li><li>Siman-Tov, S., Aharonov, E., Sagy, A., and Emmanuel, S. (2013). Nanograins form carbonate fault mirrors. Geology 41: 703–706. <a href="https://doi.org/10.1130/G34087.1" target="_blank" rel="noopener">doi:10.1130/G34087.1</a></li><li>Kirkpatrick, J. D., Rowe, C. D., White, J. C., and Brodsky, E. E. (2013). Silica gel formation during fault slip: Evidence from the rock record. Geology 41(9): 1015–1018. <a href="https://doi.org/10.1130/G34483.1" target="_blank" rel="noopener">doi:10.1130/G34483.1</a></li><li>Kovalyov, D. N. (2017). Hibernacula of Myotis bats in artificial caves in the Leningrad Region. Russian Journal of Theriology 16(1): 94–109. <a href="https://doi.org/10.15298/rusjtheriol.16.1.09" target="_blank" rel="noopener">doi:10.15298/rusjtheriol.16.1.09</a></li><li>Fossen, H. (2016). Structural Geology, 2nd edition. Cambridge University Press.</li><li>Twidale, C. R. (1982). Granite Landforms. Elsevier, Amsterdam.</li><li>Migoń, P. (2006). Granite Landscapes of the World. Oxford University Press.</li><li>Davis, G. H., Reynolds, S. J., and Kluth, C. F. (2012). Structural Geology of Rocks and Regions, 3rd edition. Wiley.</li><li>Russian Wikipedia contributors. &#x27;Gornaya Shoria&#x27; (Горная Шория): relief and the Mustag granite massif. Accessed 2026.</li></ol></details><aside class="rc-cite" data-v="marvels" data-id="marvel-russia-stones" data-t="Russia&#x27;s &#x27;cut stone&#x27; mountains and caves"><b class="cite-k">Cite this page</b><p class="c
