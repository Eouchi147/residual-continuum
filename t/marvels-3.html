0,200 516,152 L524,152 C550,200 608,310 616,380 Z" class="wx-stone2 wx-edge"/><path d="M405,330 L635,330 M418,290 L622,290 M436,250 L604,250 M458,210 L582,210 M484,172 L556,172" class="wx-thin wx-o40"/><path d="M486,244 C470,290 468,340 480,400" class="wx-flow wx-s7" marker-end="url(#qanats-yakhchal-f2-ah)"/><path d="M554,244 C570,290 572,340 560,400" class="wx-flow wx-s7" marker-end="url(#qanats-yakhchal-f2-ah)"/><text x="520" y="312" class="wx-t-s wx-halo" text-anchor="middle">cold air</text><text x="520" y="326" class="wx-t-s wx-halo" text-anchor="middle">sinks, pools</text><path d="M520,134 L520,112" class="wx-flow wx-s4 wx-o60"/><text x="506" y="120" class="wx-t-s" text-anchor="end">top opening</text><g class="wx-pop" style="--d:4"><text x="572" y="62" class="wx-t-b">Thick dome</text><text x="572" y="78" class="wx-t-s">mud brick with lime-based</text><text x="572" y="92" class="wx-t-s">sarooj plaster; walls c. 2 m</text><text x="572" y="106" class="wx-t-s">thick at the base, c. 0.5 m</text><text x="572" y="120" class="wx-t-s">near the top</text><path d="M600,126 C606,160 604,190 592,214" class="wx-thin"/></g><path d="M705,140 L705,380 M699,140 h12 M699,380 h12 M705,380 L705,460 M699,460 h12" class="wx-dim wx-draw" pathLength="1" style="--d:3"/><path d="M530,140 L711,140 M612,460 L711,460" class="wx-guide"/><text x="698" y="300" class="wx-t-n" text-anchor="end">c. 15 m</text><text x="698" y="424" class="wx-t-n" text-anchor="end">c. 5 m</text><text x="698" y="438" class="wx-t-s" text-anchor="end">pit</text><rect x="80" y="220" width="20" height="160" class="wx-stone3 wx-edge wx-grow" style="--d:1"/><path d="M68,220 L68,380 M62,220 h12 M62,380 h12" class="wx-dim"/><text x="60" y="304" class="wx-t-n" text-anchor="middle" transform="rotate(-90 60 304)">c. 10 m</text><text x="20" y="408" class="wx-t-b">Shade wall</text><text x="20" y="424" class="wx-t-s">runs east–west;</text><text x="20" y="438" class="wx-t-s">up to c. 15 m</text><polygon points="100,220 332,380 100,380" class="wx-rock wx-o40"/><circle cx="26" cy="169" r="12" class="wx-glow wx-pulse"/><path d="M38,177 L332,380" class="wx-hl wx-o80" stroke-dasharray="5 5"/><text x="20" y="140" class="wx-t-cap">By day</text><text x="20" y="154" class="wx-t-s">low winter sun, c. 35° at noon</text><rect x="112" y="378" width="192" height="6" class="wx-water2 wx-pulse"/><text x="160" y="408" class="wx-t-b">Shallow freezing pond</text><text x="160" y="424" class="wx-t-s">in the wall's shadow all day;</text><text x="160" y="438" class="wx-t-s">filled a few cm at a time</text><path d="M140,374 q6,-9 0,-18 q-6,-9 0,-18 q6,-9 0,-18 q-6,-9 0,-18" class="wx-flow wx-s2" style="--d:0"/><path d="M190,374 q6,-9 0,-18 q-6,-9 0,-18 q6,-9 0,-18 q-6,-9 0,-18" class="wx-flow wx-s2" style="--d:1"/><path d="M240,374 q6,-9 0,-18 q-6,-9 0,-18 q6,-9 0,-18 q-6,-9 0,-18" class="wx-flow wx-s2" style="--d:2"/><path d="M290,374 q6,-9 0,-18 q-6,-9 0,-18 q6,-9 0,-18 q-6,-9 0,-18" class="wx-flow wx-s2" style="--d:3"/><text x="160" y="226" class="wx-t-b wx-halo">Heat radiates to the sky</text><text x="160" y="242" class="wx-t-s wx-halo">so a skin of ice forms, even when</text><text x="160" y="256" class="wx-t-s wx-halo">the air is a little above 0 °C</text><g class="wx-pop" style="--d:6"><circle cx="362" cy="356.5" r="3.2" class="wx-inkfill"/><path d="M362,360 L362,370 M362,370 L359,380 M362,370 L365,380 M362,363 L357,371 M362,363 L367,371" class="wx-line"/><text x="362" y="344" class="wx-t-s" text-anchor="middle">1.7 m</text></g><g class="wx-pop" style="--d:7"><rect x="20" y="482" width="80" height="6" class="wx-inkfill"/><rect x="100" y="482" width="80" height="6" class="wx-card wx-edge"/><text x="20" y="502" class="wx-t-s" text-anchor="middle">0</text><text x="100" y="502" class="wx-t-s" text-anchor="middle">5</text><text x="180" y="502" class="wx-t-s" text-anchor="middle">10 m</text></g></svg></div></div><figcaption>Section of an ice house after the Meybod yakhchal, at about 16 px per metre: the shade wall keeps the pond in shadow by day, the clear sky freezes it by night, and the dome and pit store the ice. <span class="wx-src">Based on: Dome height, pit depth and wall thickness from Max Fordham LLP and Pochee et al. 2017 (Meybod); shade wall height from standard descriptions (often c. 10 m, up to c. 15 m); noon sun angle computed for c. 32° N at the winter solstice. Dome base width and pond width approximate.</span></figcaption><p class="vh">Cross-section drawn to scale with a 10 metre scale bar. On the left, a shade wall about 10 metres high casts a long shadow from a low winter sun at about 35 degrees over a shallow pond. Wavy arrows rise from the pond towards a starry night sky, showing heat radiating away. On the right a conical mud-brick dome about 15 metres high, with walls about 2 metres thick at the base and a small top opening, covers a pit about 5 metres deep packed with ice blocks under straw, with a meltwater drain. Arrows show cold air sinking into the pit. A 1.7 metre person stands between pond and dome.</p></figure><p>Harvesting was brisk, cold work. Before dawn, before the low Sun could creep over the wall, workers cracked the new ice, lifted out the slabs and carried them across to the ice house, often only a short walk away. Then the pond was flooded again for the next night. A good cold spell could fill a store; a mild winter could leave a town short of ice all summer. Ice was a seasonal harvest, as dependent on the weather as wheat.</p><p>In 2017 building engineers Pochee, Gunstone and Wilton modelled the pond at Meybod, near Yazd, using real weather data. In the coldest week their model has the pond losing about 60 watts per square metre to the sky by radiation and about 20 by evaporation, against small gains from the ground and the air. Letting in about 10 cm of water each evening and harvesting whatever froze, the model gives at best about 12 mm of ice in a night, and roughly 49 m³ over a season from a pond of about 416 m². Workers on real ice ponds probably flooded thin layers repeatedly and built up thicker sheets over several nights, then broke them up and carried the slabs to the store.</p><aside class="wcall"><b>How do we know?</b><p>Pochee and colleagues built a physical model of heat flow in and out of the pond and fed it hourly weather records for Yazd. Their model only allows freezing at or below 0 °C at the surface, so it is conservative. Separate physics explains why the surface itself can drop below the air temperature. The numbers are estimates for one site, not records kept by ice makers, which is why we quote ranges.</p></aside></section><section class="wsec" id="qanats-yakhchal-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>A dome built to keep the cold in</h3><p>Making ice is half the problem; keeping it for six months is the other. The store was a deep pit, at Meybod about 5 m deep, covered by a tall conical dome of mud brick, about 15 m high there and around 18 m at one ice house in Kerman. The walls are enormously thick at the bottom, about 2 m, thinning to around half a metre near the top. Their outside was finished with sarooj, a traditional lime-based plaster valued for being water-resistant. Popular articles list egg whites and goat hair among its ingredients; recipes varied, and the documented core is lime mixed with materials such as clay and ash.</p><ul class="wlist"><li>Thermal mass: thick earthen walls take a long time to warm up, damping the summer heat.</li><li>Depth: the pit sits in the ground, which stays much cooler than the summer air.</li><li>Cold air stays low: dense cold air pools in the pit instead of escaping.</li><li>Insulation: layers of straw or chaff between and over the ice slow melting.</li><li>Drainage: meltwater is led away, because standing water melts ice fast.</li></ul><p>Many domes have a small opening at the top. It is often described as a vent that lets warm air out, and some yakhchals were paired with windcatchers, the tall towers that funnel breezes into buildings across the region. Pochee&#x27;s team suggested that at Meybod the opening may mainly have been a rooflight, to let workers see inside. Both functions are plausible, and different ice houses may have worked differently.</p><figure class="photo wimg" data-img="Zarisf Yakhchāl-Kerman-ID3510- یخچال زریسف-کرمان.jpg" data-cap="The Zarisf ice house at Kerman, with its stepped conical dome."><figcaption></figcaption></figure><blockquote class="wpull"><p>A yakhchal is a battery for cold: charged on winter nights, slowly spent through the summer.</p></blockquote></section><section class="wsec" id="qanats-yakhchal-s8"><h3 class="wsec-h"><span class="wsec-n">08</span>Myths that melt on contact</h3><p>The most common myth, repeated in countless social-media posts, is that yakhchals made ice in summer. They did not. They stored winter ice. That is still an impressive feat, and it needs no lost technology.</p><p>The second myth is about age. You will often read that yakhchals date back to 400 BCE. That figure travels widely but is poorly sourced, and the ice houses that survive are mostly a few centuries old; Meybod&#x27;s is reported to be about 400 years old, and some were still in use in the 1960s. Ice storage in pits is ancient and widespread, so older Iranian versions are likely, but the famous domes you can visit today are not Achaemenid.</p><p>A third misunderstanding is that qanats somehow make water. They do not create it; they collect groundwater that the mountains supply. That matters, because it means qanats can run dry when the aquifer is drained, which is exactly what is happening now.</p></section><section class="wsec" id="qanats-yakhchal-s9"><h3 class="wsec-h"><span class="wsec-n">09</span>Running dry, and what we still don&#x27;t know</h3><p>Qanats balanced supply and demand almost automatically: they can only deliver what the aquifer gives. Modern pumped wells are different, and since the mid-20th century they have drawn down water tables across Iran. Around 50,000 qanats are thought to have been in use in the middle of the 20th century; estimates for recent years range from about 22,000 to about 37,000 working systems. When the water table falls below a qanat&#x27;s tunnel, the qanat simply stops. Researchers such as Mark Manuel, Dale Lightfoot and Morteza Fattahi argue that the old systems offer lessons in sustainable groundwater use that modern pumping has forgotten.</p><p>Open questions remain. Where and when was the first qanat dug, and was it invented once or several times? How far do the new luminescence dates push back the technique? How much ice did real yakhchals produce in a typical winter, and how long did it last? Answering them needs more dating, more surveys and more of the knowledge still held by the last generation of muqannis.</p><p>Meanwhile, in Gonabad, water that fell as snow on the mountains years ago still comes out of the ground at the end of a tunnel dug by hand. It is one of the oldest working machines in the world, and it has no moving parts at all.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">2,000 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Miam qanat, NE Iran: luminescence dates of 3.6–4.3 thousand years ago (one study)</span></li><li class="wtl-use" style="--i:1"><span class="wtl-y">500 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Achaemenid era: qanats spread widely, including to Egypt&#x27;s Western Desert</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">150 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Polybius records Persian rewards for bringing water to dry land</span></li><li class="wtl-build" style="--i:3"><span class="wtl-y">1600 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Approximate age of the Meybod yakhchal (reported c. 400 years old)</span></li><li class="wtl-use" style="--i:4"><span class="wtl-y">1950 CE</span><span class="wtl-k">In use</span><span class="wtl-t">c. 50,000 qanats still in use across Iran</span></li><li class="wtl-loss" style="--i:5"><span class="wtl-y">1960 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Some yakhchals still in use as mechanical refrigeration spreads</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2015 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Luminescence dating of the Miam qanat published</span></li><li class="wtl-event" style="--i:7"><span class="wtl-y">2016 CE</span><span class="wtl-k">Event</span><span class="wtl-t">UNESCO inscribes 11 qanats as &#x27;The Persian Qanat&#x27;</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2017 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Engineers model how much ice a yakhchal pond could make</span></li></ol><figure class="wbars"><h4 class="wx-title">Where a freezing pond&#x27;s heat goes on a winter night (coldest week, modelled)</h4><div class="wb-r" style="--w:100.0%;--i:0"><div class="wb-l">Radiated to the night sky<small>heat loss</small></div><div class="wb-t"><i></i><span>60 W/m²</span></div></div><div class="wb-r" style="--w:33.3%;--i:1"><div class="wb-l">Carried off by evaporation<small>heat loss</small></div><div class="wb-t"><i></i><span>20 W/m²</span></div></div><div class="wb-r" style="--w:13.3%;--i:2"><div class="wb-l">Conducted up from the ground<small>heat gain</small></div><div class="wb-t"><i></i><span>8 W/m²</span></div></div><div class="wb-r" style="--w:1.7%;--i:3"><div class="wb-l">Exchanged with the air (convection)<small>small</small></div><div class="wb-t"><i></i><span>1 W/m²</span></div></div><figcaption>Source: Pochee, Gunstone &amp; Wilton 2017 (PLEA), model of the Meybod yakhchal pond</figcaption></figure><h3 class="sub-h wsub">The big debates</h3><div class="debate"><p class="debate-q">Were qanats invented once, in Iran?</p><div class="sides"><div class="side"><b>Yes, Iranian origin</b><span>The densest and longest systems are on the Iranian plateau; Polybius links them to Persian policy; luminescence dates from the Miam qanat suggest great age.</span></div><div class="side"><b>Several inventions</b><span>Similar systems in south-eastern Arabia (aflaj) have their own early history; the principle is simple enough to be discovered more than once.</span></div></div><p class="debate-why"><b>The bold claim:</b> The qanat was invented on the Iranian plateau and spread from there.</p><div class="meter" style="--pos:41.7%" role="img" aria-label="Weight of evidence: Open question"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Iran is clearly the heartland of the technology and the Achaemenid state spread it widely. But early dates rest on few studies, qanats are hard to date, and parallel development in Arabia is a serious possibility. The origin question is open.</p></div><div class="debate"><p class="debate-q">Did yakhchals make ice in summer?</p><div class="sides"><div class="side"><b>Yes</b><span>Popular posts describe &#x27;ancient desert refrigerators&#x27; producing ice in the heat.</span></div><div class="side"><b>No, they stored winter ice</b><span>Descriptions of the ice ponds, shade walls and storage pits, and thermal models of Meybod, all show ice made on winter nights and kept for summer.</span></div></div><p class="debate-why"><b>The bold claim:</b> Persian yakhchals produced ice during the summer.</p><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Everything about the design points to winter freezing and seasonal storage. The shade walls and ponds only work on cold, clear nights, and the dome and pit are built to slow melting. Storing ice for months in a hot desert is the real achievement.</p></div><div class="debate"><p class="debate-q">Could the ponds freeze on nights above 0 °C?</p><div class="sides"><div class="side"><b>Yes, sometimes</b><span>Radiative cooling to a clear, dry sky and evaporation can pull a water surface below the air temperature.</span></div><div class="side"><b>Mostly on frosty nights</b><span>The Meybod model conservatively assumes freezing at 0 °C and still finds useful ice only in the coldest weeks; Yazd winters do drop below freezing.</span></div></div><p class="debate-why"><b>The bold claim:</b> Yakhchal ponds could make ice even when the night air was slightly above freezing.</p><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The physics is well established and explains why desert ice ponds worked so well. How often this happened at real sites is not documented, and most production probably came on nights that were cold anyway. The mechanism is sound; its practical share is uncertain.</p></div><details class="srcs"><summary>Sources for this deep dive (10)</summary><ol><li>Manuel, M., Lightfoot, D. &amp; Fattahi, M. (2018). The sustainability of ancient water control techniques in Iran: an overview. Water History 10(1): 13–30. <a href="https://doi.org/10.1007/s12685-017-0200-7" target="_blank" rel="noopener">doi:10.1007/s12685-017-0200-7</a></li><li>Fattahi, M. (2015). OSL dating of the Miam Qanat (KĀRIZ) system in NE Iran. Journal of Archaeological Science 59. <a href="https://doi.org/10.1016/j.jas.2015.04.006" target="_blank" rel="noopener">doi:10.1016/j.jas.2015.04.006</a></li><li>Pochee, H., Gunstone, S. &amp; Wilton, V. (2017). New insight on passive ice making and seasonal storage of the Iranian yakhchal and their potential for contemporary applications. PLEA 2017, Edinburgh.</li><li>Max Fordham LLP. The physics of freezing at the Iranian yakhchal. maxfordham.com (journal article).</li><li>UNESCO World Heritage Centre. The Persian Qanat (property 1506), inscribed 2016.</li><li>Polybius. The Histories, Vol. IV (Books 9–15), trans. W. R. Paton. Loeb Classical Library, Harvard University Press (1925).</li><li>Jamshidipour, A. Evaluation of geotourism for Gonabad Qasabeh qanat. Geoconservation Research, OICC Press.</li><li>Mostafaeipour, A. (2010). Historical background, productivity and technical issues of qanats. Water History 2(1): 61–80. <a href="https://doi.org/10.1007/s12685-010-0018-z" target="_blank" rel="noopener">doi:10.1007/s12685-010-0018-z</a></li><li>English, P. W. (1968). The origin and spread of qanats in the Old World. Proceedings of the American Philosophical Society 112(3): 170–181.</li><li>Wulff, H. E. (1968). The qanats of Iran. Scientific American 218(4): 94–105.</li></ol></details><aside class="rc-cite" data-v="marvels" data-id="marvel-qanats-yakhchal" data-t="Qanats and yakhchal ice houses"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Qanats and yakhchal ice houses</i>. <span class="cite-u">https://residual-continuum.vercel.app/#marvels/marvel-qanats-yakhchal</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="marvel-kailasa-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Kailasa temple overview, Ellora.jpg" data-cap="The Kailasa temple at Ellora, cut down into the basalt hillside" data-big><figcaption></figcaption></figure><div class="sh-k">Ellora, Maharashtra, India</div><h2 class="sh-t" id="marvel-kailasa-st" tabindex="-1">Kailasa Temple, Ellora</h2><p class="sh-s">A whole temple, bridges and elephants included, carved downward out of one basalt hillside with hammers and chisels.</p><div class="sh-v"><span class="vstamp vstamp--mys">Mystery <span class="pips" role="img" aria-label="Mystery level 1 of 5"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></span></span></div></div><div class="wquick"><h3 class="sub-h">The quick read</h3><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="82" >82</b><span class="ctr-u"> m</span></div><div class="ctr-l">length of the excavated court, 46 m wide</div><div class="ctr-c">published site plans</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="32.6" data-dec="1">32.6</b><span class="ctr-u"> m</span></div><div class="ctr-l">height of the temple above the court</div><div class="ctr-c">published site measurements</div></div><div class="ctr"><div class="ctr-v">up to <b class="ctr-n" data-v="200000" >200,000</b><span class="ctr-u"> t</span></div><div class="ctr-l">of basalt removed, upper end of the usual estimate</div><div class="ctr-c">Britannica</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="250" >250</b><span class="ctr-u"> cutters</span></div><div class="ctr-l">enough to do it in about 5.5 years, by one scholar&#x27;s count</div><div class="ctr-c">Dhavalikar</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="17" >17</b><span class="ctr-u"> years</span></div><div class="ctr-l">length of Krishna I&#x27;s reign, the source of the &#x27;18 years&#x27; claim</div><div class="ctr-c">Rashtrakuta chronology</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="66" >66</b><span class="ctr-u"> million years</span></div><div class="ctr-l">age of the Deccan basalt it is cut from</div><div class="ctr-c">Schoene et al. 2019</div></div></div><div class="stats"><div><b>c. 82 × 46 m at its base</b><span>Excavated court</span></div><div><b>c. 32.6 m</b><span>Temple height above the court</span></div><div><b>c. 50 × 33 m (Britannica)</b><span>Main temple footprint</span></div><div><b>c. 150,000–200,000 t (Britannica); other figures vary widely</b><span>Rock removed</span></div><div><b>Deccan Traps basalt, erupted c. 66 million years ago</b><span>Rock</span></div><div><b>Rashtrakuta king Krishna I (r. c. 756–773 CE)</b><span>Patron</span></div><div><b>1983, as part of the Ellora Caves</b><span>UNESCO World Heritage</span></div></div><p>Kailasa was not built at all: it was subtracted. Workers first cut two deep trenches, and a third at the back, into a sloping basalt hillside, leaving a free-standing block roughly the size of the finished temple. Then they carved that block from the top down, shaping the tower first and working downward through roofs, halls and walls, so they never needed scaffolding to reach the crown. Inside they hollowed out a sanctum and pillared halls; outside they left rock bridges, two tall pillars and life-size elephants standing in the court. Finally they cut galleries into the surrounding cliff. Evidence from unfinished work across Ellora shows the sequence: pointed picks and chisels removed most of the stone, flat chisels shaped details, and abrasives finished the surfaces. The work is credited to King Krishna I, and it probably continued under later kings.</p><div class="flip" id="marvel-kailasa-flip"><div class="flip-in"><div class="flip-f"><b>The myth</b><p>The temple removed 400,000 tonnes of rock in only 18 years, which would mean 5 tonnes an hour nonstop; no debris has ever been found; so lasers, lost technology or visitors from elsewhere must have been involved.</p></div><div class="flip-b"><b>The reality</b><p>The tonnage is inflated by roughly a factor of two, the 18 years is simply the length of one king&#x27;s reign, and the arithmetic is well within reach of a few hundred skilled workers. Tool marks, unfinished caves at the same site and a clear top-down sequence all point to hand work in iron. What remains unknown is the exact time taken, the size of the crews, and where all the rubble ended up.</p></div></div><button type="button" class="flip-btn" aria-pressed="false" onclick="flip('marvel-kailasa-flip',this)">Flip it</button></div><div class="twist"><b>Wow</b><p>The whole temple is one piece of rock. Every pillar, bridge, elephant and shrine is still attached to the hill it was cut from; nothing was brought in and assembled.</p></div><div class="wmys"><span>Mystery meter</span><span class="pips" role="img" aria-label="Mystery level 1 of 5"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></span><small>Mostly solved</small></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">10 min read · 2,110 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Kailasa Temple, Ellora"><button type="button" class="wtoc-i" data-go="kailasa-s1">A temple that was never built</button><button type="button" class="wtoc-i" data-go="kailasa-s2">A king, a copper plate and an astonished architect</button><button type="button" class="wtoc-i" data-go="kailasa-s3">The rock: a stack of ancient lava</button><button type="button" class="wtoc-i" data-go="kailasa-s4">How to carve a temple downward</button><button type="button" class="wtoc-i" data-go="kailasa-s5">The pit and the temple, measured</button><button type="button" class="wtoc-i" data-go="kailasa-s6">Testing the viral claims</button><button type="button" class="wtoc-i" data-go="kailasa-s7">What the builders knew</button><button type="button" class="wtoc-i" data-go="kailasa-s8">What we still do not know</button></nav></div><section class="wsec" id="kailasa-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A temple that was never built</h3><p>Walk through the low rock gateway of Cave 16 at Ellora and the cliff opens into a canyon. In front of you, filling a pit about 82 m long and 46 m wide, stands a complete Hindu temple: tower, pillared hall, porch, a shrine for the bull Nandi, two stone flagpoles and a pair of life-size elephants. Above your head rock bridges leap from one building to the next. The walls of the pit rise sheer on three sides, pierced by galleries full of gods.</p><p>Then the penny drops. None of it was built. There are no joints, no mortar, no stacked blocks. Every part of the Kailasa temple is still attached to the hill it was carved from. The sculptors did not add stone; they took it away, starting at the top of the hill and working down until what remained was a temple. It is one of the largest single pieces of carved rock anywhere, and it is about 1,250 years old.</p><blockquote class="wpull"><p>Kailasa is architecture by subtraction: every pillar, bridge and elephant is still part of the mountain.</p></blockquote><p>The name refers to Mount Kailasa in the Himalaya, the abode of the god Shiva, and the temple is dedicated to him. It sits among 34 cave temples and monasteries cut into a two-kilometre stretch of cliff at Ellora in Maharashtra, carved between about 600 and 1000 CE by Buddhist, Hindu and Jain communities side by side. That mix of faiths, sharing one hillside for four centuries, is part of why UNESCO listed Ellora as a World Heritage Site in 1983.</p></section><section class="wsec" id="kailasa-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>A king, a copper plate and an astonished architect</h3><p>No building account survives for Kailasa. What we have is praise. The Rashtrakuta dynasty ruled much of the Deccan from the mid 700s, and later inscriptions credit its king Krishna I, who reigned from about 756 to 773 CE, with a marvellous temple at Elapura, the old name of Ellora. The best-known passage comes from a set of copper plates issued at Baroda in 812 CE, about forty years after Krishna&#x27;s death.</p><blockquote class="quote"><p>The architect builder of which (...) was himself suddenly struck with astonishment, saying &#x27;Oh, how was it that I built it!&#x27;</p><cite>Baroda copper-plate grant, 812 CE; English translation as quoted by G. H. Malandra, Unfolding a Mandala (1993), p. 10</cite></blockquote><p>The line is a poet&#x27;s flourish, but it tells us two useful things. People at the time already saw the temple as a wonder, and they remembered a human architect, not a miracle. A later story, told in a Marathi text called the Katha-Kalpataru, adds a charming legend: a queen vowed not to eat until she had seen the top of a new temple, so the architect, named Kokasa, began carving at the summit so that the crown would be finished first. Inscriptions do not mention Kokasa, and the tale is best read as folklore. Yet it captures, perfectly, how Kailasa was actually made.</p><p>Did Krishna I finish it? Probably not all of it. Art historians since Hermann Goetz in 1952 have picked out later additions in the side shrines and galleries, and some think the project began under his predecessor Dantidurga. Encyclopaedia Britannica suggests work on the whole complex spread over roughly a century. The famous &#x27;eighteen years&#x27; comes from the length of one reign, not from any record of when the chisels stopped.</p></section><section class="wsec" id="kailasa-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The rock: a stack of ancient lava</h3><p>Ellora&#x27;s cliff is part of the Deccan Traps, one of the largest outpourings of lava in Earth&#x27;s history. Around 66 million years ago, close to the time the dinosaurs died out, eruptions in western India laid down lava flow on lava flow until the pile was locally more than a kilometre thick. Precise uranium-lead and argon dating published in 2019 by two teams, led by Blair Schoene and Courtney Sprain, places most of the eruptions within about a million years around that extinction.</p><p>The result, after tens of millions of years of erosion, is a landscape of flat-topped hills with stepped sides, each step roughly one lava flow. Basalt is hard, with a density of about 2.8–3.0 tonnes per cubic metre, but the dense, fine-grained interiors of thick flows carve cleanly and hold crisp detail. The west-facing scarp at Ellora gave the carvers a ready-made vertical face to start from, and a gentle slope behind it into which Kailasa&#x27;s pit could be sunk. A 2023 paper by the volcanologist Hetu Sheth treats Ajanta and Ellora as geological heritage in their own right, not just as art.</p><aside class="wcall"><b>How hard is basalt to cut?</b><p>Fresh basalt is roughly as hard as steel on the scratch scale, so a hammer and chisel do not slice it; they break it. A pointed tool driven into the rock splits off chips and flakes along tiny cracks. That is slow, but it is predictable, and it needs only good iron tools, a forge to keep re-sharpening them, and a lot of patient hands. Nothing at Kailasa requires a harder cutting edge than that.</p></aside></section><section class="wsec" id="kailasa-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>How to carve a temple downward</h3><p>The method is written into the monument. First the carvers marked the outline of the temple and its court on the sloping hilltop. Then they cut trenches down into the rock along the two long sides and across the back, broad enough to work in and to haul spoil out through the open western end. As the trenches deepened, a huge block was left standing in the middle, isolated from the cliff on three sides.</p><figure class="wx wx--steps" id="kailasa-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">How to carve a temple downward</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How to carve a temple downward"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" class="wx-svg" role="img" aria-labelledby="kailasa-f1-t"><title id="kailasa-f1-t">Carving Kailasa from the top down, in a north-south section</title><polyline points="199,168 199,392 521,392 521,168" class="wx-guide"/><g class="wx-st wx-hide" data-only="1"><polygon points="20,168 199,168 199,231 244.5,231 244.5,168 475.5,168 475.5,231 521,231 521,168 700,168 700,428.4 20,428.4" class="wx-rock wx-edge"/></g><g class="wx-st wx-hide" data-only="2"><polygon points="20,168 199,168 199,392 244.5,392 244.5,168 475.5,168 475.5,392 521,392 521,168 700,168 700,428.4 20,428.4" class="wx-rock wx-edge"/></g><g class="wx-st wx-hide" data-s="3"><polygon points="20,168 199,168 199,392 521,392 521,168 700,168 700,428.4 20,428.4" class="wx-rock wx-edge"/></g><g class="wx-st wx-hide" data-only="3"><polygon points="244.5,392 244.5,273 475.5,273 475.5,392" class="wx-rock wx-edge"/></g><g class="wx-st" data-s="3"><polygon points="307.5,273 314.5,238 325,203 >Carve the elephant frieze and sculpture;</text><text x="28" y="76" class="wx-t">cut galleries into the pit walls.</text></g><text x="698" y="30" class="wx-t-cap" text-anchor="end">Section, looking east</text><text x="560" y="44" class="wx-t-s" text-anchor="end">Deccan basalt</text><g><rect x="628" y="56" width="35" height="5" class="wx-inkfill"/><rect x="663" y="56" width="35" height="5" class="wx-card wx-edge"/><text x="628" y="74" class="wx-t-s" text-anchor="middle">0</text><text x="698" y="74" class="wx-t-s" text-anchor="middle">10 m</text></g><text x="560" y="60" class="wx-t-s" text-anchor="end">schematic</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Mark out the plan on the hilltop and cut two trenches down into the basalt; rubble is broken up and carried away.</p><ol class="wx-steplist"><li>Mark out the plan on the hilltop and cut two trenches down into the basalt; rubble is broken up and carried away.</li><li>Deepen the trenches to courtyard level, leaving a free-standing block of living rock.</li><li>Shape the tower from the top down, so the crown can be finished without scaffolding.</li><li>Work downward: walls, roofs and the 8 m plinth; hollow out the sanctum and halls from inside.</li><li>Finish the sculpture, including the elephant frieze, and cut galleries into the pit walls.</li></ol><figcaption>A north–south section through the temple, looking east, showing the order of work suggested by the monument itself and by unfinished caves at Ellora. <span class="wx-src">Based on: Sequence after Dehejia&#x27;s analysis of unfinished work at Ellora and Dhavalikar (2003); court width c. 46 m and temple height 32.6 m from published measurements; profile schematic.</span></figcaption><p class="vh">Five-step cross-section of a basalt hillside. Step 1: two shallow trenches are cut into the flat hilltop while workers carry rubble away. Step 2: the trenches reach courtyard level, about 46 metres apart at their outer edges, isolating a block of rock. Step 3: the tower is shaped from the top of the block first, reaching 32.6 metres above the court. Step 4: walls, roof and plinth are cut and a hollow sanctum is opened inside. Step 5: an elephant frieze is carved on the plinth and galleries are cut into the pit walls. A person and a 10 metre scale bar give scale.</p></figure><p>Next came the clever part. Instead of shaping the block from the bottom up, the carvers began at its top, cutting the pyramidal tower over the sanctum first. Working from the top down meant nobody ever needed scaffolding to reach the crown; the unworked rock below was their platform. As each level was finished they lowered the working floor and moved on to the next: the roofs of the halls, their walls and windows, and finally the plinth, about 8 m high, with its frieze of elephants and lions that seem to carry the whole temple on their backs.</p><p>Interior spaces were tunnelled in: the sanctum, the pillared hall and its porches. The carvers left rock bridges spanning the gaps between gateway, Nandi shrine and main temple, and freed two tall pillars and two elephants in the court. Last of all, they cut multi-storey galleries into the surrounding cliff and filled them with sculpture. A mistake could not be glued back; the whole plan had to be fixed in advance, down to the position of each pillar.</p><p>How do we know the order? Partly from the logic of the monument: the tower&#x27;s crown could only have been reached comfortably this way. Mostly from Ellora&#x27;s many unfinished caves and panels, which freeze the process at different stages. The art historian Vidya Dehejia describes three sets of tools: a pointed axe or pointed chisel, which removed roughly 85 per cent of the stone and left long parallel grooves; flat and rounded chisels for shaping; and abrasives for the finish. In unfinished panels, upper portions are often complete while lower ones are untouched, the same top-down logic scaled down to a single wall.</p></section><section class="wsec" id="kailasa-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The pit and the temple, measured</h3><p>Numbers help here, and the drawing below lays them out. The court is about 82 m long and 46 m wide at its base. The main temple occupies roughly 50 by 33 m, according to Britannica, and its tower rises about 32.6 m above the court floor, about the height of a ten-storey building. The back wall of the pit is roughly as high as the tower, because the hillside rises toward the east; the front, where the gateway stands, is much lower.</p><figure class="wx wx--static" id="kailasa-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">The pit and the temple, measured</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The pit and the temple, measured"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" class="wx-svg" role="img" aria-labelledby="kailasa-f2-t"><title id="kailasa-f2-t">Plan and long section op" style="--d:14"><circle class="wx-num" cx="368.2" cy="181.8" r="9"/><text x="368.2" y="185.6" class="wx-numt" text-anchor="middle">6</text></g><g class="wx-pop" style="--d:14"><circle class="wx-num" cx="508" cy="250" r="9"/><text x="508" y="253.8" class="wx-numt" text-anchor="middle">6</text><text x="524" y="254.5" class="wx-t">sanctum and tower (vimana)</text></g><g class="wx-pop" style="--d:15"><circle class="wx-num" cx="290" cy="296.8" r="9"/><text x="290" y="300.6" class="wx-numt" text-anchor="middle">7</text></g><g class="wx-pop" style="--d:15"><circle class="wx-num" cx="508" cy="276" r="9"/><text x="508" y="279.8" class="wx-numt" text-anchor="middle">7</text><text x="524" y="280.5" class="wx-t">galleries cut into the pit walls</text></g><text x="499" y="92" class="wx-t-cap">Left in the living rock</text><text x="28" y="350" class="wx-t-cap">Long section, looking north</text><polygon points="32.4,483.6 60,483.6 60,548 437.2,548 437.2,396.2 464.8,396.2 464.8,566.4 32.4,566.4" class="wx-rock wx-edge-soft"/><polyline points="60,483.6 244,428.4 437.2,396.2" class="wx-dash"/><text x="248.6" y="399.4" class="wx-t-s" text-anchor="middle">original hilltop (approximate)</text><g class="wx-grow" style="--d:3"><rect x="60" y="492.8" width="36.8" height="55.2" class="wx-stone2 wx-edge"/><rect x="133.6" y="488.2" width="41.4" height="59.8" class="wx-stone2 wx-edge"/><rect x="188.8" y="511.2" width="230" height="36.8" class="wx-stone wx-edge"/><rect x="202.6" y="474.4" width="119.6" height="36.8" class="wx-stone2 wx-edge"/><polygon points="326.8,511.2 326.8,469.8 336,446.8 345.2,423.8 356.7,406.3 368.2,398 379.7,406.3 391.2,423.8 400.4,446.8 409.6,469.8 409.6,511.2" class="wx-stone3 wx-edge"/><rect x="96.8" y="506.6" width="36.8" height="6.4" class="wx-stone wx-edge"/><rect x="175" y="506.6" width="13.8" height="6.4" class="wx-stone wx-edge"/></g><g class="wx-line"><circle cx="115.2" cy="540.9" r="0.7"/><path d="M115.2 541.6V544.3M115.2 544.3L114.3 548M115.2 544.3L116.1 548M114 543.8L115.2 542.2L116.4 543.8"/></g><text x="121.2" y="546" class="wx-t-s">1.7 m</text><g class="wx-pop" style="--d:8"><line x1="425.7" y1="548" x2="425.7" y2="398" class="wx-dim"/><line x1="368.2" y1="398" x2="425.7" y2="398" class="wx-guide"/><text x="474" y="488.2" class="wx-t-n">32.6 m</text><text x="474" y="504.2" class="wx-t-s">tower above the court</text><line x1="193.4" y1="548" x2="193.4" y2="511.2" class="wx-dim"/><text x="197.1" y="533.6" class="wx-t-s">8 m</text></g><polyline points="428,488.2 469.4,488.2" class="wx-thin"/><g class="wx-pop" style="--d:12"><text x="500" y="378" class="wx-t-cap">Rock removed</text><text x="500" y="398" class="wx-t-b wx-t-a">c. 150,000–200,000 t</text><text x="500" y="413" class="wx-t-s">(Britannica). Our own check from the</text><text x="500" y="426" class="wx-t-s">pit size: c. 45,000–100,000 m³</text><text x="500" y="439" class="wx-t-s">of basalt, 2.8–2.9 t per m³</text></g><g><rect x="560" y="566" width="46" height="5" class="wx-inkfill"/><rect x="606" y="566" width="46" height="5" class="wx-card wx-edge"/><text x="560" y="584" class="wx-t-s" text-anchor="middle">0</text><text x="652" y="584" class="wx-t-s" text-anchor="middle">20 m</text></g><text x="700" y="594" class="wx-t-s" text-anchor="end">Layout schematic; main dimensions as published</text></svg></div></div><figcaption>Plan and long section of Cave 16. Everything drawn in colour inside the court is part of the same rock as the cliff around it. <span class="wx-src">Based on: Court c. 82 × 46 m and height 32.6 m from published site measurements; temple footprint c. 50 × 33 m from Britannica; plinth c. 8 m from MAP Academy; positions of minor elements schematic.</span></figcaption><p class="vh">Upper half: a plan of the rectangular excavated court, about 82 by 46 metres, surrounded by rock. Numbered markers show the gateway in the western rock screen, rock bridges, the Nandi shrine, pillars and elephants, the main temple of about 50 by 33 metres, the sanctum and tower at its eastern end, and galleries cut into the pit walls. Lower half: a long section looking north showing the gateway, Nandi shrine and bridges, the main temple on an 8 metre plinth and the tower rising 32.6 metres above the court, with a dashed line for the approximate original hilltop and a 1.7 metre person for scale. A note gives rock removed as about 150,000 to 200,000 tonnes.</p></figure><p>How much rock came out? Encyclopaedia Britannica gives 150,000–200,000 tonnes, and that is a sensible order of magnitude. We can check it ourselves. The court covers about 3,770 m². If the original hilltop stood on average 20–33 m above today&#x27;s floor, the pit held about 75,000–125,000 m³ of basalt. Subtract the temple, shrines, pillars and elephants that were left standing, perhaps 25,000–30,000 m³, and roughly 45,000–100,000 m³ was removed. At 2.85 tonnes per cubic metre that is about 130,000–285,000 tonnes.</p><p>Other figures in circulation spread far wider, from about 32,000 tonnes (a conversion of &#x27;400,000 cubic feet&#x27;) to &#x27;over 2 million tonnes&#x27;. The spread says more about copying than about the rock. None of these numbers comes from a published survey of the pit, and the height of the original hill is itself an estimate, so treat every tonnage, including ours, as rough.</p></section><section class="wsec" id="kailasa-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Testing the viral claims</h3><p>Kailasa is a favourite of videos and posts about lost technology. The claims usually run like this: 400,000 tonnes of rock were removed in 18 years; that is 22,222 tonnes a year, 60 tonnes a day, or 5 tonnes every hour; no one could do that with hand tools; and no debris has ever been found. Some go further and suggest lasers, sound, or help from somewhere beyond Earth. These are fair questions to ask. Here is what the evidence says.</p><ul class="wlist"><li>The tonnage: 400,000 tonnes has no traceable source. Published estimates and simple geometry give about half that.</li><li>The time: 18 years is the approximate length of Krishna I&#x27;s reign, not a recorded construction period. The work probably continued after him.</li><li>The rate: M. K. Dhavalikar estimated that a cutter can remove about 4 cubic feet of basalt a day. At that rate 250 cutters would remove about 57,000 m³, around 160,000 tonnes, in 5.5 years.</li><li>The tools: tool marks, unfinished caves and a top-down sequence are exactly what hand work leaves behind. A laser strong enough to cut basalt melts it into glass; no glassy surfaces are reported.</li><li>The debris: nobody has surveyed for it. Broken basalt makes good fill and building stone, and twelve centuries of reuse would scatter it widely.</li></ul><p>The arithmetic is the heart of it. Five tonnes an hour sounds impossible for one person, but it was never one person. Spread across a few hundred workers, it is a couple of wheelbarrow loads each per day. Crews of that size were well within the means of a dynasty that commanded much of the Deccan.</p><blockquote class="wpull"><p>Five tonnes an hour sounds impossible for one person. It was never one person.</p></blockquote><p>What about the idea that the cuts are too precise for hand work? No published survey has measured the flatness or squareness of Kailasa&#x27;s walls, so &#x27;impossible precision&#x27; is an impression, not a measurement. What the site does offer is the kind of evidence hand work leaves: tool grooves, sculpture finished to different degrees, and at Ellora as a whole, passages and panels abandoned half-cut. A machine-made monument would have no reason to look like that.</p></section><section class="wsec" id="kailasa-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What the builders knew</h3><p>If Kailasa needs no mysterious technology, it still needed extraordinary skill. The design had to be complete before the first cut, with every hall, stair and window in the right place inside a block of rock that could not be seen into. The masons clearly had long experience: Ellora&#x27;s earlier Buddhist and Hindu caves, up to a century and a half older, show generations learning how the basalt breaks, how deep a hall can be cut before the roof becomes risky, and how to keep a vertical face true over tens of metres.</p><p>The temple&#x27;s form follows the southern Indian, or Dravida, style, with a stepped pyramidal tower, and it resembles structural temples built in stone blocks in the Kannada country, such as the Virupaksha temple at Pattadakal. Kailasa, in other words, translated a building type that already existed in assembled masonry into a single carved monolith, keeping its proportions while turning every joint into solid rock.</p><p>Kailasa is not alone, which is another quiet argument against any need for special technology. A century earlier, carvers at Mamallapuram on the Tamil coast had freed whole small temples, the so-called rathas, from granite outcrops. In Ethiopia, the churches of Lalibela were cut downward into volcanic rock in much the same way some four to five centuries later, and at Petra in Jordan, facades were carved into sandstone cliffs from the top down. Wherever people had good rock, good iron and a reason, they discovered the same method.</p><p>Picture the site at its busiest, and the picture is probably right in outline if not in detail. Teams of cutters work the trench floors with pointed tools, while others carry baskets of chips up ramps and out through the western end. Smiths keep charcoal forges burning to re-sharpen hundreds of blunted points each day. On the rising block, master sculptors, perhaps working from drawings or a small model, begin to release the tower from the top. The noise, the dust and the heat must have been enormous.</p><p>It was also a working temple, painted and plastered. Traces of paint still cling to ceilings in the galleries and porches. Imagine the court bright with colour, the smell of lamps and incense, and the sound of chisels still ringing from somewhere along the cliff, because at Ellora carving did not stop for centuries.</p></section><section class="wsec" id="kailasa-s8"><h3 class="wsec-h"><span class="wsec-n">08</span>What we still do not know</h3><p>The honest gaps are real, but they are ordinary historical gaps. We do not know how long the main temple took, how many people worked on it, or how they were organised and paid. We do not know exactly which parts belong to Krishna I and which to his successors. We do not know where the spoil went, because nobody has looked systematically. A careful laser scan and tool-mark study of the whole pit, like those now done at other rock-cut sites, could answer some of these questions.</p><p>What is not in doubt is how it was done. Kailasa is what happens when a powerful court, a deep tradition of rock carving and a cooperative lava flow meet. It is astonishing because humans made it, with iron, patience and a plan. The architect in the copper-plate poem had every reason to be amazed at himself.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">600 CE</span><span class="wtl-k">Built</span><span class="wtl-t">First cave temples cut into the Ellora cliff</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">756 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Krishna I becomes Rashtrakuta king (c. 756)</span></li><li class="wtl-build" style="--i:2"><span class="wtl-y">773 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Krishna I&#x27;s reign ends; work continues after him</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">812 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Baroda copper plates praise the temple at Elapura</span></li><li class="wtl-build" style="--i:4"><span class="wtl-y">850 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Later additions and side shrines (9th century)</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1880 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Fergusson and Burgess publish The Cave Temples of India</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">1952 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Hermann Goetz&#x27;s study of Kailasa&#x27;s chronology</span></li><li class="wtl-event" style="--i:7"><span class="wtl-y">1983 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Ellora Caves inscribed as a UNESCO World Heritage Site</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2019 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Deccan Traps eruptions dated precisely to c. 66 million years ago</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">2023 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Geologists publish the volcanic geoheritage of Ajanta and Ellora</span></li></ol><figure class="wbars"><h4 class="wx-title">One temple, many numbers: published figures for rock removed</h4><div class="wb-r" style="--w:8.0%;--i:0"><div class="wb-l">&#x27;400,000 cubic feet&#x27; (artnet)<small>converted at 2.85 t per m³</small></div><div class="wb-t"><i></i><span>32,000 tonnes</span></div></div><div class="wb-r" style="--w:37.5%;--i:1"><div class="wb-l">Britannica, low end</div><div class="wb-t"><i></i><span>150,000 tonnes</span></div></div><div class="wb-r" style="--w:40.0%;--i:2"><div class="wb-l">Implied by Dhavalikar&#x27;s labour sum<small>250 cutters × 4 ft³ a day × 5.5 years</small></div><div class="wb-t"><i></i><span>160,000 tonnes</span></div></div><div class="wb-r" style="--w:50.0%;--i:3"><div class="wb-l">Britannica, high end</div><div class="wb-t"><i></i><span>200,000 tonnes</span></div></div><div class="wb-r" style="--w:52.5%;--i:4"><div class="wb-l">Our geometric check, midpoint<small>range c. 130,000–285,000</small></div><div class="wb-t"><i></i><span>210,000 tonnes</span></div></div><div class="wb-r" style="--w:60.0%;--i:5"><div class="wb-l">&#x27;3 million cubic feet&#x27; (web articles)<small>converted at 2.85 t per m³</small></div><div class="wb-t"><i></i><span>240,000 tonnes</span></div></div><div class="wb-r" style="--w:100.0%;--i:6"><div class="wb-l">Viral posts: &#x27;400,000 tonnes&#x27;<small>no source given</small></div><div class="wb-t"><i></i><span>400,000 tonnes</span></div></div><figcaption>Source: Britannica (&#x27;Kailasa&#x27;); Dhavalikar via published summaries; artnet (2024); our calculation from an 82 × 46 m court, 20–33 m deep, less the rock left standing. A further claim of &#x27;over 2 million tonnes&#x27; is left off the scale.</figcaption></figure><h3 class="sub-h wsub">The big debates</h3><div class="debate"><p class="debate-q">Could it really be carved by hand in about 18 years?</p><div class="sides"><div class="side"><b>No: the numbers are impossible.</b><span>Viral posts divide 400,000 tonnes by 18 years and get about 60 tonnes a day, or 5 tonnes an hour around the clock, which sounds absurd for hammers and chisels.</span></div><div class="side"><b>Yes: the real numbers are modest for a royal workforce.</b><span>Using a more realistic 150,000–200,000 tonnes and Dhavalikar&#x27;s rate of about 4 cubic feet of basalt per cutter per day, around 250 cutters could remove it in roughly 5.5 years; even with a larger crew for sculpture and haulage, 18 years is comfortable.</span></div></div><p class="debate-why"><b>The bold claim:</b> Kailasa could not have been carved with hand tools in the time available.</p><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The claim rests on an inflated tonnage and on reading a king&#x27;s reign as a measured construction time. Worked through with published rates, the job needs hundreds of skilled workers for years, not miracles, and the tool marks and unfinished work at Ellora show exactly how it was done. How long it actually took is unknown, but hand work fits every piece of evidence.</p></div><div class="debate"><p class="debate-q">Was it finished in a single reign?</p><div class="sides"><div class="side"><b>Largely yes: Krishna I conceived and executed the main temple.</b><span>The Baroda copper plates of 812 CE credit Krishnaraja with the temple at Elapura, and the main monument is stylistically unified.</span></div><div class="side"><b>No: work spread over generations.</b><span>Scholars from Goetz (1952) onward identify later additions in the side shrines and galleries, and some think the project began under Krishna&#x27;s predecessor Dantidurga.</span></div></div><p class="debate-why"><b>The bold claim:</b> The whole Kailasa complex was completed within Krishna I&#x27;s reign.</p><div class="meter" style="--pos:41.7%" role="img" aria-label="Weight of evidence: Open question"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The inscription is a later tribute, not a building account, and it gives no dates for the work. Stylistic dating of individual parts differs between scholars. The core temple may be largely Krishna I&#x27;s, but the complex as seen today almost certainly includes later work.</p></div><div class="debate"><p class="debate-q">Where did all the rock go?</p><div class="sides"><div class="side"><b>It vanished, so it was not removed by hand.</b><span>Popular videos say no debris heaps exist near Ellora and treat that as a sign of unknown technology.</span></div><div class="side"><b>It was carried away and used or spread out.</b><span>Broken basalt is useful fill and building stone; over 1,200 years a few tens of thousands of cubic metres could be spread across fields, roads and villages, and the cliff opens to the plain in front of the caves.</span></div></div><p class="debate-why"><b>The bold claim:</b> The absence of visible spoil heaps shows the rock was removed by some unknown method.</p><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">No survey has looked for Kailasa&#x27;s spoil, so &#x27;no debris&#x27; is an absence of study, not evidence. Vanishing rubble would need a mechanism of its own, and none is offered, while reuse of quarry waste is routine at every ancient site. This one remains a genuine small gap in our knowledge, not a mystery requiring new physics.</p></div><details class="srcs"><summary>Sources for this deep dive (12)</summary><ol><li>Sheth, H. (2023). The Volcanic Geoheritage of the Ajanta and Ellora Caves, Central Deccan Traps, India. Geoheritage 15: 39. <a href="https://doi.org/10.1007/s12371-023-00809-w" target="_blank" rel="noopener">doi:10.1007/s12371-023-00809-w</a></li><li>Schoene, B., Eddy, M. P., Samperton, K. M., et al. (2019). U-Pb constraints on pulsed eruption of the Deccan Traps across the end-Cretaceous mass extinction. Science 363: 862–866. <a href="https://doi.org/10.1126/science.aau2422" target="_blank" rel="noopener">doi:10.1126/science.aau2422</a></li><li>Sprain, C. J., Renne, P. R., Vanderkluysen, L., et al. (2019). The eruptive tempo of Deccan volcanism in relation to the Cretaceous-Paleogene boundary. Science 363: 866–870. <a href="https://doi.org/10.1126/science.aav1446" target="_blank" rel="noopener">doi:10.1126/science.aav1446</a></li><li>Goetz, H. (1952). The Kailasa of Ellora and the Chronology of Rashtrakuta Art. Artibus Asiae 15(1/2): 84–107. <a href="https://doi.org/10.2307/3248615" target="_blank" rel="noopener">doi:10.2307/3248615</a></li><li>Dhavalikar, M. K. (2003). Ellora. Oxford University Press (Monumental Legacy series).</li><li>Malandra, G. H. (1993). Unfolding a Mandala: The Buddhist Cave Temples at Ellora. State University of New York Press.</li><li>Owen, L. (2012). Carving Devotion in the Jain Caves at Ellora. Brill.</li><li>Dehejia, V. Chapter in D. Klein and A. Klein (eds), Ellora: Cross-fertilization of Style in Buddhist, Hindu and Jain Cave Temples. Mapin Publishing (excerpted in Scroll.in).</li><li>Fergusson, J., and Burgess, J. (1880). The Cave Temples of India. W. H. Allen, London.</li><li>Encyclopaedia Britannica. &#x27;Kailasa&#x27; (Hindu temple, Ellora). Online edition, accessed 2026.</li><li>MAP Academy Encyclopedia of Art. &#x27;Kailasanatha Temple&#x27;, excerpted in ThePrint (2023).</li><li>UNESCO World Heritage Centre. Ellora Caves (List no. 243), inscribed 1983.</li></ol></details><aside class="rc-cite" data-v="marvels" data-id="marvel-kailasa" data-t="Kailasa Temple, Ellora"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Kailasa Temple, Ellora</i>. <span class="cite-u">https://residual-continuum.vercel.app/#marvels/marvel-kailasa</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="marvel-ollantaytambo-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Ollantaytambo Sun Temple 06.jpg" data-cap="Stone blocks at the Temple of the Sun, Ollantaytambo" data-big><figcaption></figcaption></figure><div class="sh-k">Sacred Valley, Peru</div><h2 class="sh-t" id="marvel-ollantaytambo-st" tabindex="-1">Ollantaytambo and the Temple of the Sun</h2><p class="sh-s">Six pink monoliths hauled down a mountain, across a river and up a ramp, and left unfinished when the empire that ordered them fell.</p><div class="sh-v"><span class="vstamp vstamp--mys">Mystery <span class="pips" role="img" aria-label="Mystery level 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span></span></div></div><div class="wquick"><h3 class="sub-h">The quick read</h3><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="4" >4</b><span class="ctr-u"> km</span></div><div class="ctr-l">from the Kachiqhata quarries to the temple</div><div class="ctr-c">Protzen 1985</div></div><div class="ctr"><div class="ctr-v">up to <b class="ctr-n" data-v="900" >900</b><span class="ctr-u"> m</span></div><div class="ctr-l">height of the quarries above the valley floor</div><div class="ctr-c">Protzen 1985</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="250" >250</b><span class="ctr-u"> m</span></div><div class="ctr-l">length of the steepest slide, at about 40°</div><div class="ctr-c">Protzen 1985</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="80" >80</b><span class="ctr-u"> blocks</span></div><div class="ctr-l">abandoned along the quarry ramps</div><div class="ctr-c">Protzen 1985</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="6" >6</b><span class="ctr-u"> monoliths</span></div><div class="ctr-l">in the unfinished wall of the Temple of the Sun</div><div class="ctr-c">Protzen 1993</div></div><div class="ctr"><div class="ctr-v">≤ <b class="ctr-n" data-v="90" >90</b><span class="ctr-u"> minutes</span></div><div class="ctr-l">for Protzen to dress three faces of a test block with hammerstones</div><div class="ctr-c">Protzen 1985</div></div></div><div class="stats"><div><b>c. 2,792 m</b><span>Town elevation</span></div><div><b>Kachiqhata, c. 4 km away across the Urubamba</b><span>Quarry</span></div><div><b>c. 700–900 m above the valley floor</b><span>Quarry height</span></div><div><b>pink rhyolite, tallest c. 4 m high</b><span>Six monoliths</span></div><div><b>roughly 40–50 t, estimated from its dimensions</b><span>Largest block</span></div><div><b>c. 80 along the quarry ramps (Protzen)</b><span>Abandoned blocks</span></div><div><b>1537: Manco Inca floods the plain and repels the Spanish</b><span>Battle</span></div></div><p>Inca quarrymen worked giant rockfalls of pink rhyolite on the Kachiqhata mountainside across the river, 700 to 900 m above the valley floor, selecting blocks rather than cutting them from bedrock. They roughed the blocks with hammerstones, then moved them down a network of ramps and slides, across the valley floor and the Urubamba, and up a long ramp to the Temple Hill. Polished patches on the stones show that they were dragged. At the temple, masons dressed and fitted them by pounding with hammerstones of different sizes, trying each stone against its neighbour until the joint was tight. Dozens of blocks were abandoned on the way, and the temple was never finished.</p><div class="flip" id="marvel-ollantaytambo-flip"><div class="flip-in"><div class="flip-f"><b>The myth</b><p>The monoliths are too precise and too heavy for the Incas; they were made by a lost, older civilisation using machines or a secret liquid that softened stone.</p></div><div class="flip-b"><b>The reality</b><p>The quarry, the transport route, dozens of abandoned blocks in every stage of work, the hammerstones and the drag marks tie the monoliths to Inca builders. Jean-Pierre Protzen&#x27;s experiments showed that hammerstones alone can dress and fit this kind of stone quickly and precisely. The temple is Inca work that was interrupted, not a relic of an older age.</p></div></div><button type="button" class="flip-btn" aria-pressed="false" onclick="flip('marvel-ollantaytambo-flip',this)">Flip it</button></div><div class="twist"><b>Wow</b><p>Protzen found that the quarrymen did not quarry in the usual sense: they walked through a gigantic rockfall and picked blocks of the size they needed, then sent some of them down a slide about 250 m long at roughly 40°.</p></div><div class="wmys"><span>Mystery meter</span><span class="pips" role="img" aria-label="Mystery level 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><small>A few loose ends</small></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">10 min read · 2,227 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Ollantaytambo and the Temple of the Sun"><button type="button" class="wtoc-i" data-go="ollantaytambo-s1">Six pink giants on a hill</button><button type="button" class="wtoc-i" data-go="ollantaytambo-s2">A royal estate in the Sacred Valley</button><button type="button" class="wtoc-i" data-go="ollantaytambo-s3">The quarry in the sky</button><button type="button" class="wtoc-i" data-go="ollantaytambo-s4">Tired stones and a river</button><button type="button" class="wtoc-i" data-go="ollantaytambo-s5">The Wall of the Six Monoliths</button><button type="button" class="wtoc-i" data-go="ollantaytambo-s6">How to fit a 40-tonne jigsaw</button><button type="button" class="wtoc-i" data-go="ollantaytambo-s7">Testing the viral claims</button><button type="button" class="wtoc-i" data-go="ollantaytambo-s8">1537: the flood at Ollantaytambo</button><button type="button" class="wtoc-i" data-go="ollantaytambo-s9">What is still unknown</button></nav></div><section class="wsec" id="ollantaytambo-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Six pink giants on a hill</h3><p>Climb the long stairway of terraces above the town of Ollantaytambo and you reach a strange, broken place. At the top, facing the valley, stand six huge slabs of pink stone set side by side like the pages of a book, the tallest about 4 m high. Between them run thin vertical strips of the same stone. Around them lie blocks that were never placed, half-shaped stones and the outlines of a building that was never completed.</p><figure class="photo wimg" data-img="Ollantaytambo Sun Temple 05.jpg" data-cap="Fitted stonework at the Temple of the Sun, Ollantaytambo."><figcaption></figcaption></figure><p>This is the so-called Temple of the Sun, and the wall of six monoliths is one of the most photographed pieces of stonework in the Americas. It is also one of the most argued over online, where it often appears as evidence of a lost civilisation, of machines or of stone melted into shape. The real story is better: an imperial building project, a quarry in the sky, a river to cross, and an unfinished job left behind by the collapse of an empire.</p><blockquote class="wpull"><p>The monoliths of Ollantaytambo are not a mystery that the Incas inherited. They are a building site that the Incas never got to finish.</p></blockquote></section><section class="wsec" id="ollantaytambo-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>A royal estate in the Sacred Valley</h3><p>Ollantaytambo lies at about 2,792 m in the Urubamba valley, some 72 km by road northwest of Cusco, where the valley narrows towards the forests of the Amazon side. Around the middle of the 15th century the Inca ruler Pachacuti took the area and made it part of his personal estate. His builders reshaped the whole valley: they straightened fields into terraces, dug irrigation channels, and laid out a new town.</p><p>The name is a mix of legend and function. A tambo was an Inca waystation on the road network, a place of lodging and storage. Ollantay is the hero of a Quechua drama, known from manuscripts of the 18th century, about a general who falls in love with the daughter of Pachacuti and rebels when the match is forbidden. Whatever the play owes to older oral tradition, it attached a romantic rebel to a town whose real history already included one.</p><p>That town still exists. Its core follows an orthogonal grid of narrow streets, and its blocks are divided into kanchas, walled compounds in which one-room buildings face a shared courtyard. Families still live inside Inca walls and draw water from Inca channels, which makes Ollantaytambo one of the best-preserved Inca towns anywhere.</p><p>Water was part of the design. Stone channels still run along the streets, and below the Temple Hill a carved fountain known as the Baño de la Ñusta, the &#x27;princess&#x27;s bath&#x27;, shows how Inca builders turned plumbing into ornament. The same skill with channels and sluices would matter enormously in 1537.</p><p>On the steep mountain of Pinkuylluna, opposite the Temple Hill, stand the qollqa, stone storehouses built high on the slope where the wind is cold and constant. Their builders gave them ventilation to keep the harvest of the valley terraces dry and cool. Below the temple, the great stairway of terraces is faced with fine cut stone instead of rough fieldstone: this was farmland, but also royal display.</p></section><section class="wsec" id="ollantaytambo-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The quarry in the sky</h3><p>The pink stone of the temple comes from Kachiqhata, a mountainside on the other side of the Urubamba about 4 km southwest of the town. In the 1980s the architect Jean-Pierre Protzen of the University of California, Berkeley, spent seasons mapping it. The quarries lie 700 to 900 m above the valley floor, in three main areas, amid enormous rockfalls beneath granitic cliffs.</p><p>The stone is a pinkish volcanic rock with visible crystals, usually described as rhyolite or porphyry; Protzen&#x27;s first paper called the coarse variety a red granite. Whatever the label, it is hard, heavy and brittle enough to fracture predictably, which made it ideal for pounding into shape but punishing to transport. A cubic metre weighs roughly 2.5 tonnes.</p><blockquote class="quote"><p>The Incas did not practice quarrying in the proper sense.</p><cite>Jean-Pierre Protzen, &#x27;Inca Quarrying and Stonecutting&#x27;, Journal of the Society of Architectural Historians 44 (1985)</cite></blockquote><p>Instead of cutting blocks out of solid bedrock, the quarrymen went through a giant rockfall and chose blocks that were close to the size and shape they wanted, then roughed them out where they lay. From the quarries, a network of roads, ramps and slides led down the mountain. Protzen measured ramps 4 to 8 m wide at gentle slopes of 8 to 12 degrees, the sort of gradient a team can control with ropes. One route was far more dramatic: a slide dropping about 250 m at about 40 degrees, at the bottom of which four abandoned blocks still lie.</p><figure class="wx wx--steps" id="ollantaytambo-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">From quarry to temple</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="From quarry to temple"><svg f
