,173 250,211 300,243 360,285 412,327 452,327" class="wx-bold wx-s6 wx-draw" pathLength="1" style="--d:2"/><line x1="152" y1="110" x2="196" y2="176" class="wx-hl" style="stroke-width:4px"/><line x1="246" y1="124" x2="180" y2="144" class="wx-thin"/><text x="252" y="112" class="wx-t-b wx-halo">Ramps and a steep slide</text><text x="252" y="126" class="wx-t-s wx-halo">ramps 8–12°, 4–8 m wide; one slide</text><text x="252" y="139" class="wx-t-s wx-halo">drops c. 250 m at c. 40°</text><circle cx="238" cy="108" r="9" class="wx-num"/><text x="238" y="112" text-anchor="middle" class="wx-numt">2</text></g><g class="wx-st" data-s="3"><rect x="292" y="232" width="14" height="8" class="wx-c8 wx-edge"/><rect x="372" y="288" width="14" height="8" class="wx-c8 wx-edge"/><rect x="424" y="318" width="14" height="8" class="wx-c8 wx-edge"/><rect x="520" y="318" width="14" height="8" class="wx-c8 wx-edge"/><text x="330" y="386" text-anchor="middle" class="wx-t-b wx-halo">Tired stones</text><text x="330" y="400" text-anchor="middle" class="wx-t-s wx-halo">blocks abandoned en route</text><line x1="330" y1="372" x2="376" y2="298" class="wx-thin"/><text x="470" y="276" text-anchor="middle" class="wx-t wx-halo">River crossing:</text><text x="470" y="290" text-anchor="middle" class="wx-t-s wx-halo">method unknown</text><circle cx="404" cy="272" r="9" class="wx-num"/><text x="404" y="276" text-anchor="middle" class="wx-numt">3</text></g><g class="wx-st" data-s="4"><polyline points="540,330 604,318 668,304" class="wx-bold wx-s6"/><path d="M560,316 L650,298" class="wx-flow wx-s1" marker-end="url(#ollantaytambo-f1-ar)"/><text x="524" y="262" class="wx-t-b wx-halo">Hauled up the ramp</text><text x="524" y="276" class="wx-t-s wx-halo">to Temple Hill</text><circle cx="508" cy="258" r="9" class="wx-num"/><text x="508" y="262" text-anchor="middle" class="wx-numt">4</text></g><rect x="670" y="290" width="5" height="12" class="wx-c8 wx-edge-soft"/><rect x="676" y="290" width="5" height="12" class="wx-c8 wx-edge-soft"/><rect x="682" y="290" width="5" height="12" class="wx-c8 wx-edge-soft"/><rect x="688" y="290" width="5" height="12" class="wx-c8 wx-edge-soft"/><rect x="694" y="290" width="5" height="12" class="wx-c8 wx-edge-soft"/><rect x="700" y="290" width="5" height="12" class="wx-c8 wx-edge-soft"/><text x="704" y="340" text-anchor="end" class="wx-t-s">Temple of the Sun</text><g class="wx-st wx-hide" data-s="5"><line x1="690" y1="288" x2="660" y2="222" class="wx-thin"/><rect x="452" y="44" width="256" height="178" rx="10" class="wx-card wx-edge-soft"/><text x="466" y="66" class="wx-t-b">Dress and fit with hammerstones</text><polygon points="470,196 470,110 520,92 596,98 598,196" class="wx-c8 wx-o60 wx-edge"/><circle cx="486" cy="120" r="1.6" class="wx-inkfill wx-o40"/><circle cx="500" cy="134" r="1.6" class="wx-inkfill wx-o40"/><circle cx="520" cy="114" r="1.6" class="wx-inkfill wx-o40"/><circle cx="540" cy="128" r="1.6" class="wx-inkfill wx-o40"/><circle cx="560" cy="112" r="1.6" class="wx-inkfill wx-o40"/><circle cx="576" cy="126" r="1.6" class="wx-inkfill wx-o40"/><circle cx="490" cy="152" r="1.6" class="wx-inkfill wx-o40"/><circle cx="514" cy="160" r="1.6" class="wx-inkfill wx-o40"/><circle cx="538" cy="146" r="1.6" class="wx-inkfill wx-o40"/><circle cx="566" cy="158" r="1.6" class="wx-inkfill wx-o40"/><circle cx="584" cy="144" r="1.6" class="wx-inkfill wx-o40"/><circle cx="500" cy="178" r="1.6" class="wx-inkfill wx-o40"/><circle cx="530" cy="182" r="1.6" class="wx-inkfill wx-o40"/><circle cx="560" cy="176" r="1.6" class="wx-inkfill wx-o40"/><ellipse cx="628" cy="104" rx="20" ry="14" class="wx-stone3 wx-edge wx-bob"/><ellipse cx="652" cy="150" rx="9" ry="7" class="wx-stone3 wx-edge wx-bob" style="--d:3"/><text x="610" y="134" class="wx-t-s">c. 4 kg: rough work</text><text x="610" y="176" class="wx-t-s">0.2–0.6 kg:</text><text x="610" y="189" class="wx-t-s">edges, finish</text><text x="466" y="212" class="wx-t-s">Pounding, not cutting (Protzen)</text><circle cx="446" cy="50" r="9" class="wx-num"/><text x="446" y="54" text-anchor="middle" class="wx-numt">5</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Quarry: blocks of pink rhyolite are chosen from a giant rockfall 700 to 900 m above the valley and roughed out where they lie.</p><ol class="wx-steplist"><li>Quarry: blocks of pink rhyolite are chosen from a giant rockfall 700 to 900 m above the valley and roughed out where they lie.</li><li>Down the mountain: ramps 4 to 8 m wide at 8 to 12°, and one slide of about 250 m at about 40°.</li><li>Across the valley: blocks are dragged over the floor and across the Urubamba; how the river was crossed is unknown. Some blocks were abandoned.</li><li>Up the ramp: teams haul the blocks up a long ramp to the Temple Hill.</li><li>Dress and fit: masons pound the stones to shape with hammerstones, testing each fit and pounding again.</li></ol><figcaption>A profile across the Urubamba valley from the Kachiqhata quarries to the Temple Hill. Heights are exaggerated about two times so the route is visible. <span class="wx-src">Based on: Protzen 1985 and 1993 (quarry height and distance, ramp widths and slopes, the slide, abandoned blocks, hammerstones and experiments). Terrain simplified; heights exaggerated about 2x.</span></figcaption><p class="vh">Profile of the valley with a 1 km scale bar and a 200 m vertical bar, heights exaggerated about two times. Step 1: pink blocks in a rockfall high on the Kachiqhata mountainside, 700 to 900 m above the valley. Step 2: a road runs down the slope, with a steep slide of about 250 m at about 40 degrees highlighted. Step 3: abandoned &#x27;tired stones&#x27; along the route and on the valley floor; the Urubamba river channel labelled &#x27;method unknown&#x27; for the crossing. Step 4: a ramp rising to the Temple Hill with an arrow showing blocks hauled up. Step 5: an inset of a pink block with pitting and two hammerstones, about 4 kg for rough work and 0.2 to 0.6 kg for finishing.</p></figure><p>Along the whole ramp system Protzen counted about 80 abandoned blocks. Most are the coarse pink stone used in the temple; a few are a finer grey stone from another part of the quarry. Some are barely roughed, some carefully shaped, which is exactly what you would expect from a working quarry that stopped suddenly.</p></section><section class="wsec" id="ollantaytambo-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Tired stones and a river</h3><p>Local people call the blocks left along the route piedras cansadas, &#x27;tired stones&#x27;: stones that, the story goes, grew too tired to continue their journey. Several lie on the valley floor and on the long ramp that climbs to the Temple Hill from the river. They are the best evidence of how the monoliths travelled, because they were abandoned mid-journey with their marks still on them.</p><p>Many of the building blocks at Ollantaytambo carry patches that are highly polished on some faces and edges, while the rest of the surface shows the pitted texture left by hammerstones. Protzen interpreted the polish as wear from dragging over the ground, so the stones were slid rather than rolled. The ramps themselves represent a huge investment: moving large volumes of earth and rock to build the roads, slides and the final ramp was a project in its own right.</p><p>How the blocks crossed the Urubamba is not known. The river is broad and fast in the rainy season. One popular idea is that the builders diverted it temporarily so that stones could be dragged across its bed; another is that they crossed in the dry season at a prepared ford. No excavation has yet confirmed either, so this stage is drawn with a question mark.</p><aside class="wcall"><b>A back-of-the-envelope haul</b><p>Our rough illustration, not a published figure: dragging a 40-tonne block on a prepared surface, with a sliding friction of perhaps 0.2 to 0.3, needs a pull of about 80 to 120 kilonewtons on the flat. If each person pulls steadily with around 0.3 to 0.5 kilonewtons, that means roughly 150 to 400 people, and more on a slope. Large, but well within what an Inca labour draft could muster.</p></aside><p>The last leg was uphill. A long ramp rises from the valley floor to the Temple Hill, aimed straight at the unfinished temple. Hauling a block of several tens of tonnes up it would have required large teams on ropes and levers, and the Inca state could supply them through mit&#x27;a, the labour service owed by subject communities.</p></section><section class="wsec" id="ollantaytambo-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The Wall of the Six Monoliths</h3><p>The six monoliths form a wall about 11 m long. The largest, by one published measurement, is about 4.3 m tall including the part set into the ground, about 2.1 m wide and about 1.8 m thick, which puts its weight in the range of 40 to 50 tonnes. The others are only a little smaller. Their faces are smoothed but not flat; each carries the gentle bulge typical of fine Inca masonry.</p><figure class="wx wx--static" id="ollantaytambo-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">The Wall of the Six Monoliths</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The Wall of the Six Monoliths"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" class="wx-svg" role="img" aria-labelledby="ollantaytambo-f2-t"><title id="ollantaytambo-f2-t">Elevation of the Wall of the Six Monoliths at Ollantaytambo with thin fillet slabs between the stones and a person for scale</title><text x="16" y="24" class="wx-t-cap">Wall of the Six Monoliths · approximate elevation</text><rect x="0" y="318" width="720" height="14" class="wx-soil"/><line x1="0" y1="318" x2="720" y2="318" class="wx-line"/><g class="wx-grow" style="--d:0"><rect x="70" y="296" width="41.2" height="22" rx="3" class="wx-stone wx-edge"/><rect x="113.2" y="296" width="31.6" height="22" rx="3" class="wx-stone wx-edge"/><rect x="146.8" y="296" width="50.8" height="22" rx="3" class="wx-stone wx-edge"/><rect x="199.60" y="296" width="36.4" height="22" rx="3" class="wx-stone wx-edge"/><rect x="238.00" y="296" width="46.0" height="22" rx="3" class="wx-stone wx-edge"/><rect x="286.0" y="296" width="34.0" height="22" rx="3" class="wx-stone wx-edge"/><rect x="322.0" y="296" width="55.6" height="22" rx="3" class="wx-stone wx-edge"/><rect x="379.6" y="296" width="41.2" height="22" rx="3" class="wx-stone wx-edge"/><rect x="422.8" y="296" width="36.4" height="22" rx="3" class="wx-stone wx-edge"/><rect x="461.20" y="296" width="48.4" height="22" rx="3" class="wx-stone wx-edge"/><rect x="511.6" y="296" width="43.6" height="22" rx="3" class="wx-stone wx-edge"/><rect x="557.2" y="296" width="38.8" height="22" rx="3" class="wx-stone wx-edge"/><rect x="598.0" y="296" width="31.6" height="22" rx="3" class="wx-stone wx-edge"/></g><polygon points="76.0,296.0 76.0,134.0 82.0,128.0 152.0,125.0 160.0,138.0 160.0,296.0" cl ="6" class="wx-c8 wx-edge"/><ellipse cx="508.0" cy="201.0" rx="8" ry="6" class="wx-c8 wx-edge"/><ellipse cx="581.9" cy="256.4" rx="8" ry="6" class="wx-c8 wx-edge"/><path d="M379.4,195.4 h8 v-8 h8 v-8 h16 v8 h8 v8 h8" class="wx-line wx-o60"/><circle cx="40" cy="242.4" r="6" class="wx-inkfill"/><path d="M40,248.4 L40,279.6 M31,318 L40,279.6 L49,318 M30,258.0 L40,248.4 L50,258.0" class="wx-line"/><text x="40" y="230.4" text-anchor="middle" class="wx-t-s">1.7 m</text><line x1="645.6" y1="104.0" x2="645.6" y2="296" class="wx-dim"/><line x1="303.0" y1="104.0" x2="651.6" y2="104.0" class="wx-guide"/><text x="651.6" y="200.0" class="wx-t-n">c. 4 m</text><text x="651.6" y="214.0" class="wx-t-s">tallest</text><line x1="76" y1="344" x2="620.8" y2="344" class="wx-dim"/><line x1="76" y1="338" x2="76" y2="350" class="wx-dim"/><line x1="620.8" y1="338" x2="620.8" y2="350" class="wx-dim"/><text x="348.4" y="362" text-anchor="middle" class="wx-t-s">c. 11 m of monoliths (widths approximate)</text><g class="wx-pop" style="--d:13"><line x1="165.8" y1="158.0" x2="116.0" y2="80.0" class="wx-thin"/><text x="96" y="58" text-anchor="start" class="wx-t wx-halo">Fillets</text><text x="96" y="72" text-anchor="start" class="wx-t-s wx-halo">thin slabs between the monoliths</text></g><g class="wx-pop" style="--d:14"><line x1="508.0" y1="195.0" x2="490.0" y2="80.0" class="wx-thin"/><text x="470" y="58" text-anchor="start" class="wx-t wx-halo">Knobs left on the faces</text><text x="470" y="72" text-anchor="start" class="wx-t-s wx-halo">for handling, or dressing never finished</text></g><g class="wx-pop" style="--d:14"><line x1="403.4" y1="197.4" x2="320.0" y2="382.0" class="wx-thin"/><text x="300" y="396" text-anchor="start" class="wx-t wx-halo">Worn stepped relief</text></g><g class="wx-pop" style="--d:15"><line x1="560.0" y1="306.0" x2="520.0" y2="382.0" class="wx-thin"/><text x="500" y="396" text-anchor="start" class="wx-t wx-halo">Lower course of smaller stones</text></g><g class="wx-pop" style="--d:15"><line x1="130.0" y1="256.0" x2="96.0" y2="382.0" class="wx-thin"/><text x="76" y="396" text-anchor="start" class="wx-t wx-halo">Pink rhyolite from Kachiqhata</text></g></svg></div></div><figcaption>An approximate elevation of the six pink rhyolite monoliths with the thin fillet slabs between them, drawn at one scale with a 1.7 m person. <span class="wx-src">Based on: Tallest stone c. 4 m above its base (overall c. 4.3 by 2.1 by 1.8 m as published); widths of the other stones and fillets estimated from photographs and approximate; after Protzen 1993.</span></figcaption><p class="vh">Front elevation of six tall pink stone slabs standing side by side on a lower course of smaller stones, with narrow darker fillet slabs between each pair. The tallest, third from left, is about 4 m high; the row is about 11 m long. Several slabs carry small rounded knobs, and the fourth shows a faint stepped relief. A 1.7 m stick figure stands at the left, reaching well under half the height of the stones.</p></figure><p>Two details make the wall unusual. First, the monoliths are separated by thin fillets, narrow vertical slabs of the same stone fitted into the joints. The technique is not known anywhere else in Inca architecture. Second, several stones still carry projecting knobs, and one bears a worn relief of stepped motifs. Knobs of this kind appear on other Inca walls and may have helped workers handle the blocks, or they may simply be dressing that was never finished.</p><p>The fillets may also have been a practical trick. Fitting two 40-tonne neighbours directly against each other, by the lift-and-pound method, would be slow and risky. One attractive interpretation is that the builders set each monolith close to its neighbour and then shaped the thin fillets to fill the remaining gap, so the giant stones never needed a perfect mutual fit. It is an engineering reading of the evidence, not a recorded fact, but it would explain why the technique appears on this wall of exceptionally large stones.</p><p>Some scholars have compared the fillets and the stepped design with the stonework of the Lake Titicaca region, where the much older city of Tiwanaku had used fitted slabs and stepped motifs. Because the Incas routinely moved skilled workers around their empire, masons from the Titicaca basin may have worked here. It is a reasonable hypothesis, but no document confirms it.</p><aside class="wcall"><b>How do we know it was unfinished?</b><p>Blocks lie around the Temple Hill in every stage of preparation, some half-dressed, some with sockets cut for neighbours that never arrived. The walls stop abruptly, and abandoned blocks sit along the ramps and at the quarry. Protzen&#x27;s survey concluded that the complex was still being built when work was abandoned, most likely during the upheavals of the Spanish invasion in the 1530s.</p></aside></section><section class="wsec" id="ollantaytambo-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>How to fit a 40-tonne jigsaw</h3><p>Inca joints are famously tight: you often cannot slip a knife blade between two stones. The question is how builders without iron tools or wheels achieved it. Protzen&#x27;s answer came from trying. At Kachiqhata and at the Rumiqolqa quarry near Cusco he found hammerstones, rounded cobbles of a hard quartz-rich sandstone, probably collected from the river below. He picked up similar ones and started pounding.</p><p>With a hammerstone of about 4 kg he could rough out a face of an andesite block quickly, and with smaller stones of 200 to 600 g he could finish edges and corners. Dressing three faces and cutting five edges of his test block took no more than 90 minutes. The pounding crushes tiny amounts of rock with every blow and leaves exactly the pitted texture seen on Inca stones.</p><blockquote class="quote"><p>Through repeated fitting and pounding, one can achieve a fit as close as one wishes.</p><cite>Jean-Pierre Protzen, &#x27;Inca Quarrying and Stonecutting&#x27;, Journal of the Society of Architectural Historians 44 (1985)</cite></blockquote><p>The fitting method was trial and error. The mason pounded a hollow in the stone already in place, lowered the next stone onto it to see where it touched, marked the high spots, lifted it away and pounded again. Protzen did not test this on a 40-tonne monolith; lifting such a stone repeatedly for trial fits is the hardest part to explain, and it may have involved levers, earth ramps and timber cribbing. The method is well demonstrated; the logistics at this scale are inferred.</p><p>Inca builders used several masonry styles for different purposes: rough fieldstone set in clay for storehouses and terraces, neat rectangular courses for fine buildings, and interlocking polygonal blocks for the most prestigious walls. The monoliths belong to the most ambitious end of that range. Their faces bulge slightly and their edges are sunk, a finish that catches the light and makes each joint read as a crisp line.</p></section><section class="wsec" id="ollantaytambo-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>Testing the viral claims</h3><p>Online, Ollantaytambo is often paired with Saqsaywaman and Machu Picchu as proof of something older than the Incas. The claims come in three forms, and each can be tested.</p><ul class="wlist"><li>Precision beyond Inca ability. The fit of the joints is excellent, but Protzen&#x27;s experiments show hammerstones produce the same precision and the same surface texture. The faces are not machined flat; they bulge gently, as pounded surfaces do.</li><li>A lost older civilisation. The monoliths share their stone with Inca-era quarries, their transport route with abandoned blocks in mid-journey, and their unfinished state with the moment Inca rule collapsed. No separate, older building campaign of this scale has been identified at the site.</li><li>Softened or cast stone. The blocks are ordinary rhyolite matching the Kachiqhata outcrops, with natural crystals intact; rough blocks at the quarry and on the ramps show the same stone before shaping. A block cast from a paste or softened by a plant juice would not look like this.</li></ul><p>None of this makes the work less astonishing. Selecting blocks from a mountainside rockfall, sliding them down 700 m, dragging them across a valley and up a ramp, and then fitting them to a hairline with stones held in the hand is an extraordinary achievement. It just happens to be a human one, with its tools and half-finished pieces still lying on the ground.</p><p>Why do the alternative stories spread so easily? Partly because the stones are genuinely hard to imagine being moved, and partly because the photographs rarely show the context: the quarry across the river, the ramps, the abandoned blocks. Seen alone, a perfect joint looks like magic. Seen with its building site, it looks like work.</p></section><section class="wsec" id="ollantaytambo-s8"><h3 class="wsec-h"><span class="wsec-n">08</span>1537: the flood at Ollantaytambo</h3><p>In 1536 the Inca ruler Manco Inca, installed as a puppet by the Spanish, rebelled and laid siege to Cusco. When the siege failed he withdrew to Ollantaytambo and fortified it. In January 1537 Hernando Pizarro led about 100 Spaniards, 70 of them on horseback, and a large force of native allies down the valley to capture him.</p><p>They met a defended town. Warriors on the high terraces showered the attackers with arrows, sling stones and boulders, and the Incas released water through channels they had prepared in advance, flooding the plain below the town. According to the accounts, the water rose to the horses&#x27; girths, and cavalry, the Spaniards&#x27; decisive weapon, became useless. Pizarro ordered a retreat that turned into a rout.</p><p>It was one of the few Inca victories of the conquest, and it showed that the water engineering of a royal estate could also be a weapon. It did not last. Spanish reinforcements arrived, and Manco withdrew to the remote forests of Vilcabamba, where an independent Inca state held out until 1572. By then the monoliths on the Temple Hill had stood unfinished for a generation.</p></section><section class="wsec" id="ollantaytambo-s9"><h3 class="wsec-h"><span class="wsec-n">09</span>What is still unknown</h3><p>Today Ollantaytambo is best known to travellers as the place where trains leave for Machu Picchu. Many visitors pass through in an hour. Those who stay find an Inca town still in use, a hillside of terraces, storehouses on the opposite mountain, and a quarry trail on the far side of the river where the tired stones still lie, waiting for a journey that ended in the 1530s.</p><ul class="wlist"><li>How the monoliths crossed the Urubamba: diversion, a dry-season ford, or something else.</li><li>When exactly the temple was begun, and under which ruler.</li><li>What the finished building was meant to look like, and whether &#x27;Temple of the Sun&#x27; is the right name.</li><li>Who the masons were, and whether the fillet technique came from the Titicaca region.</li><li>How the heaviest stones were lifted for trial fitting.</li></ul><p>The mystery rating is 2 out of 5. The main outline, from the quarry to the wall, is well documented by fieldwork and experiment. What remains open are the specific engineering choices and the plans that the builders took with them when their world was overturned.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">1440 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Pachacuti conquers the valley (approx.) and makes it a royal estate</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">1450 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Town grid, terraces and irrigation laid out (approx.)</span></li><li class="wtl-build" style="--i:2"><span class="wtl-y">1500 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Temple of the Sun under construction (date uncertain)</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">1532 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Spanish invasion begins at Cajamarca</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">1536 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Manco Inca&#x27;s rebellion; siege of Cusco</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">1537 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Battle of Ollantaytambo: the plain is flooded, the Spanish repelled</span></li><li class="wtl-loss" style="--i:6"><span class="wtl-y">1540 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Ollantaytambo granted in encomienda to Hernando Pizarro</span></li><li class="wtl-loss" style="--i:7"><span class="wtl-y">1572 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Fall of the last Inca stronghold at Vilcabamba</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">1985 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Protzen publishes his quarry and stonecutting study</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">1993 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Protzen&#x27;s monograph on Ollantaytambo</span></li></ol><h3 class="sub-h wsub">The big debates</h3><div class="debate"><p class="debate-q">Were the monoliths made by a civilisation older than the Incas?</p><div class="sides"><div class="side"><b>Yes: the megalithic masonry is older and the Incas built on top of it.</b><span>The size and precision of the blocks; contrasts between megalithic and smaller Inca-style masonry at the site.</span></div><div class="side"><b>No: they are Inca work, interrupted.</b><span>The Kachiqhata quarries, transport ramps and dozens of abandoned blocks in mid-journey; the unfinished state of the temple matching the collapse of Inca rule; hammerstone techniques shown experimentally to produce the same results (Protzen 1985, 1993).</span></div></div><p class="debate-why"><b>The bold claim:</b> The Temple of the Sun monoliths were built by a lost civilisation before the Incas.</p><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Differences in masonry size reflect the function and status of different buildings, a pattern well known across Inca sites. Everything about the monoliths, from the quarry to the ramps to the tired stones and the tool marks, fits one interrupted Inca building campaign. No evidence of a separate, earlier megalithic culture at the site has been published.</p></div><div class="debate"><p class="debate-q">Was the stone softened or cast?</p><div class="sides"><div class="side"><b>Yes: the builders used a plant extract or a geopolymer paste to mould the stone.</b><span>Traveller legends of a liquid that softens rock; the tight, curved joints.</span></div><div class="side"><b>No: the stone is natural rhyolite shaped by pounding.</b><span>The blocks match the quarry outcrops, including natural crystals; unfinished blocks show every stage of pounding; Protzen reproduced the texture and the fit with hammerstones.</span></div></div><p class="debate-why"><b>The bold claim:</b> Inca masons softened or cast the stone of the monoliths instead of carving it.</p><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The claim makes a testable prediction: the stone should look artificial and differ from the quarry. It does not. The monoliths are rhyolite identical to Kachiqhata rock, and the quarry, the ramps and the abandoned blocks record the stones before and during shaping. The curved joints are exactly what trial-and-error pounding produces.</p></div><div class="debate"><p class="debate-q">Did the Incas divert the Urubamba to move the stones?</p><div class="sides"><div class="side"><b>Yes: the river was temporarily moved so that blocks could be dragged across its bed.</b><span>The route from the quarry meets the river opposite the temple ramp; the Incas were skilled hydraulic engineers.</span></div><div class="side"><b>Unknown: the blocks may have crossed in the dry season or by other means.</b><span>No dated diversion works linked to the crossing have been published.</span></div></div><p class="debate-why"><b>The bold claim:</b> The Incas diverted the Urubamba River so the monoliths could be dragged across its bed.</p><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The idea is plausible for a state that reshaped rivers and flooded a battlefield on demand, but plausibility is not evidence. Until diversion works or other traces of the crossing are found and dated, the method remains an open question.</p></div><details class="srcs"><summary>Sources for this deep dive (10)</summary><ol><li>Protzen, J.-P. (1993). Inca Architecture and Construction at Ollantaytambo. Oxford University Press.</li><li>Protzen, J.-P. (1985). Inca Quarrying and Stonecutting. Journal of the Society of Architectural Historians 44(2): 161ff.</li><li>Protzen, J.-P. (1986). Inca Stonemasonry. Scientific American 254(2): 94-105.</li><li>Hemming, J. (1970). The Conquest of the Incas. Macmillan.</li><li>Hyslop, J. (1990). Inka Settlement Planning. University of Texas Press.</li><li>Gasparini, G. &amp; Margolies, L. (1980). Inca Architecture. Indiana University Press.</li><li>Rowe, J. H. (1946). Inca Culture at the Time of the Spanish Conquest. In Handbook of South American Indians, vol. 2. Smithsonian Institution.</li><li>Pizarro, P. (1571). Relación del descubrimiento y conquista de los reinos del Perú (eyewitness account of the 1537 battle).</li><li>Hanzalová, K. &amp; Pavelka, K. (2014). New knowledge in determining the astronomical orientation of Incas object in Ollantaytambo, Peru. International Archives of the Photogrammetry, Remote Sensing and Spatial Information Sciences XL-5: 273-278.</li><li>Protzen, J.-P. &amp; Nair, S. (2013). The Stones of Tiahuanaco: A Study of Architecture and Construction. Cotsen Institute of Archaeology Press.</li></ol></details><aside class="rc-cite" data-v="marvels" data-id="marvel-ollantaytambo" data-t="Ollantaytambo and the Temple of the Sun"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Ollantaytambo and the Temple of the Sun</i>. <span class="cite-u">https://residual-continuum.vercel.app/#marvels/marvel-ollantaytambo</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="marvel-sefar-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Great god of Sefar.jpg" data-cap="The &#x27;Great God of Sefar&#x27;, a Round Head painting in the Tassili n&#x27;Ajjer" data-big><figcaption></figcaption></figure><div class="sh-k">Tassili n&#x27;Ajjer, Algeria</div><h2 class="sh-t" id="marvel-sefar-st" tabindex="-1">Sefar, the Painted Rock City</h2><p class="sh-s">A maze of sandstone streets in the Sahara whose walls remember hippos, cattle herds and a giant with raised arms.</p><div class="sh-v"><span class="vstamp vstamp--mys">Mystery <span class="pips" role="img" aria-label="Mystery level 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span></span></div></div><div class="wquick"><h3 class="sub-h">The quick read</h3><div class="ctrs"><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="15000" >15,000</b><span class="ctr-u"> images</span></div><div class="ctr-l">paintings and engravings recorded across Tassili n&#x27;Ajjer</div><div class="ctr-c">UNESCO World Heritage List</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="72000" >72,000</b><span class="ctr-u"> km²</span></div><div class="ctr-l">area of the World Heritage property</div><div class="ctr-c">UNESCO World Heritage List</div></div><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="3" >3</b><span class="ctr-u"> m</span></div><div class="ctr-l">height of the Great God of Sefar</div><div class="ctr-c">Coulson; field photographs</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="9500" >9,500</b><span class="ctr-u"> years ago</span></div><div class="ctr-l">approximate start of the Round Head paintings</div><div class="ctr-c">Soukopova 2012</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="5500" >5,500</b><span class="ctr-u"> years ago</span></div><div class="ctr-l">approximate end of the African Humid Period in many records</div><div class="ctr-c">deMenocal et al. 2000</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="16" >16</b><span class="ctr-u"> months</span></div><div class="ctr-l">length of Henri Lhote&#x27;s 1956–57 copying expedition</div><div class="ctr-c">Lhote 1958</div></div></div><div class="stats"><div><b>Tassili n&#x27;Ajjer, inscribed 1982 (72,000 km²)</b><span>World Heritage</span></div><div><b>over 15,000 paintings and engravings (UNESCO)</b><span>Rock art on the plateau</span></div><div><b>mostly above c. 1,500 m</b><span>Plateau altitude</span></div><div><b>Round Heads, c. 9,500–7,500 years ago (debated)</b><span>Oldest painted style</span></div><div><b>painted figure more than 3 m tall</b><span>Great God of Sefar</span></div><div><b>c. 5,500 years ago in many records, earlier or later by region</b><span>Green Sahara ends</span></div></div><p>Nobody built Sefar&#x27;s streets. The Tassili plateau is layered sandstone cut by vertical cracks called joints. Over hundreds of thousands of years, water in wetter periods and wind in dry ones widened the joints into corridors, leaving blocks and towers that look like the houses of a ruined city. Where a softer layer near the base eroded faster, overhangs formed. Those shelters kept rain and harsh sun off their walls, and people painted them with red and yellow ochres and white clays, repeatedly, for thousands of years. Hunters painted the huge, ghostly Round Head figures; later herders painted cattle and daily life; later still came horses, chariots and camels, a sequence that tracks the drying of the Sahara.</p><div class="flip" id="marvel-sefar-flip"><div class="flip-in"><div class="flip-f"><b>The myth</b><p>The round-headed figures are astronauts in space helmets, painted by people who had seen visitors from another world; one is even called a Martian god.</p></div><div class="flip-b"><b>The reality</b><p>The Round Head paintings belong to a long, coherent tradition of human figures with masks, headdresses, body paint and bows, often in ritual scenes, painted by Holocene hunter-gatherers. The &#x27;Martian&#x27; label was a nickname coined by Henri Lhote&#x27;s 1950s expedition and later adopted by ancient-astronaut writers. Nothing in the paintings or the archaeology needs outside visitors. The real puzzles are dating and meaning.</p></div></div><button type="button" class="flip-btn" aria-pressed="false" onclick="flip('marvel-sefar-flip',this)">Flip it</button></div><div class="twist"><b>Wow</b><p>The walls of a waterless desert show hippos, elephants, giraffes and herds of cattle, a picture book of the Green Sahara painted by people who watched it change.</p></div><div class="wmys"><span>Mystery meter</span><span class="pips" role="img" aria-label="Mystery level 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><small>Real open questions</small></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">10 min read · 2,260 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Sefar, the Painted Rock City"><button type="button" class="wtoc-i" data-go="sefar-s1">A city that nobody built</button><button type="button" class="wtoc-i" data-go="sefar-s2">Streets carved by rain and wind</button><button type="button" class="wtoc-i" data-go="sefar-s3">The Round Heads</button><button type="button" class="wtoc-i" data-go="sefar-s4">When the Sahara was green</button><button type="button" class="wtoc-i" data-go="sefar-s5">Five chapters on the rock</button><button type="button" class="wtoc-i" data-go="sefar-s6">The end of the rains</button><button type="button" class="wtoc-i" data-go="sefar-s7">How do you date a painting?</button><button type="button" class="wtoc-i" data-go="sefar-s8">Lhote&#x27;s copies and the fake Egyptians</button><button type="button" class="wtoc-i" data-go="sefar-s9">Martians on the wall?</button><button type="button" class="wtoc-i" data-go="sefar-s10">A fragile gallery</button><button type="button" class="wtoc-i" data-go="sefar-s11">What we still don&#x27;t know</button></nav></div><section class="wsec" id="sefar-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A city that nobody built</h3><p>Walk into Sefar and you seem to be entering a town. Narrow lanes run between dark walls, open into little squares, turn corners and dead-end at blank facades. There are alleys, arcades and porches. There are no doors, no roofs and no masons&#x27; marks: the whole city is sandstone, shaped by water and wind on a plateau more than 1,500 m above the Sahara floor in southeastern Algeria.</p><p>Sefar lies on the Tassili n&#x27;Ajjer, a sandstone tableland whose name is usually translated as plateau of rivers. The irony is plain: today it is one of the driest places on Earth. Yet the walls of Sefar&#x27;s shelters are crowded with paintings of people swimming or dancing, herds of cattle with dappled hides, giraffes, elephants and a figure more than 3 m tall with its arms raised, towering over a group of smaller people. UNESCO inscribed the Tassili n&#x27;Ajjer as a World Heritage Site in 1982, citing more than 15,000 paintings and engravings across 72,000 km² of plateau. Sefar is one of its densest concentrations.</p><blockquote class="wpull"><p>Nobody laid out these streets. The city is sandstone, and its builders were rain, wind and time.</p></blockquote></section><section class="wsec" id="sefar-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Streets carved by rain and wind</h3><p>The secret of the rock city is geometry. The Tassili sandstone was laid down as horizontal beds hundreds of millions of years ago, then cracked by earth movements into vertical fractures called joints. Joints usually come in sets that cross one another, like the lines of a grid. When rain was more plentiful, water ran down the cracks and dissolved and loosened the grains along them; in dry times, wind scoured the loose sand away. Each crack slowly widened into a slot, the slot into a corridor, and the corridor into a street.</p><figure class="wx wx--static" id="sefar-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">How the rock streets and shelters formed</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How the rock streets and shelters formed"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" class="wx-svg" role="img" aria-labelledby="sefar-f2-t"><title id="sefar-f2-t">Cross-section of the Tassili sandstone at Sefar showing how joints widen into rock streets and how undercut soft layers make painted shelters</title><defs><marker id="sefar-f2-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker><marker id="sefar-f2-ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker><clipPath id="sefar-f2-t1"><polygon points="20,356 20,150 60,140 140,138 186,146 186,356"/></clipPath><clipPath id="sefar-f2-t2"><polygon points="196,356 196,150 240,142 300,156 300,322 284,326 284,346 300,350 300,356"/></clipPath><clipPath id="sefar-f2-t3"><polygon points="380,356 380,350 396,346 396,326 380,322 382,170 420,160 468,172 470,318 432,326 432,350 470,354 470,356"/></clipPath><cl /><path d="M-7,-34 L7,-34 L5,-14 L-5,-14 Z"/><path d="M-5,-15 L-8,0 L-4,0 L-1,-14 Z M5,-15 L8,0 L4,0 L1,-14 Z"/><path d="M-9,-30 L-15,-44 L-12,-45 L-5,-33 Z M9,-30 L15,-44 L12,-45 L5,-33 Z"/></g></g></g><g class="wx-pop" style="--d:8"><g transform="translate(292 344) scale(0.3 0.3)"><g class="wx-c1"><circle cx="0" cy="-43" r="8"/><path d="M-7,-34 L7,-34 L5,-14 L-5,-14 Z"/><path d="M-5,-15 L-8,0 L-4,0 L-1,-14 Z M5,-15 L8,0 L4,0 L1,-14 Z"/><path d="M-9,-30 L-15,-44 L-12,-45 L-5,-33 Z M9,-30 L15,-44 L12,-45 L5,-33 Z"/></g></g></g><g class="wx-pop" style="--d:9"><circle class="wx-line" cx="500" cy="337.4" r="1.8"/><path class="wx-line" d="M500,339.3 L500,346.4 M497.1,356 L500,346.4 L502.9,356 M496.5,345 L500,340.9 L503.5,345"/></g><g class="wx-pop" style="--d:5"><g ><circle class="wx-num" cx="29" cy="26" r="9"/><text class="wx-numt" x="29" y="30" text-anchor="middle">1</text></g><text class="wx-t-b" x="43" y="30">A joint: a crack</text><text class="wx-t-m" x="43" y="46">through the beds</text><path class="wx-thin" d="M43,52 L93,170"/><circle class="wx-inkfill" cx="93" cy="170" r="2"/></g><g class="wx-pop" style="--d:6"><g ><circle class="wx-num" cx="129" cy="74" r="9"/><text class="wx-numt" x="129" y="78" text-anchor="middle">2</text></g><text class="wx-t-b" x="143" y="78">Water and wind</text><text class="wx-t-m" x="143" y="94">widen the crack</text><path class="wx-thin" d="M143,100 L191,190"/><circle class="wx-inkfill" cx="191" cy="190" r="2"/></g><g class="wx-pop" style="--d:7"><g ><circle class="wx-num" cx="309" cy="26" r="9"/><text class="wx-numt" x="309" y="30" text-anchor="middle">3</text></g><text class="wx-t-b" x="323" y="30">A rock 'street'</text><text class="wx-t-m" x="323" y="46">with a sand floor</text><path class="wx-thin" d="M323,52 L340,344"/><circle class="wx-inkfill" cx="340" cy="344" r="2"/></g><g class="wx-pop" style="--d:8"><g ><circle class="wx-num" cx="421" cy="74" r="9"/><text class="wx-numt" x="421" y="78" text-anchor="middle">4</text></g><text class="wx-t-b" x="435" y="78">Soft bed undercut:</text><text class="wx-t-m" x="435" y="94">a painted shelter</text><path class="wx-thin" d="M435,100 L446,334"/><circle class="wx-inkfill" cx="446" cy="334" r="2"/></g><g class="wx-pop" style="--d:9"><g ><circle class="wx-num" cx="569" cy="26" r="9"/><text class="wx-numt" x="569" y="30" text-anchor="middle">5</text></g><text class="wx-t-b" x="583" y="30">Last stage:</text><text class="wx-t-m" x="583" y="46">a lone pillar</text><path class="wx-thin" d="M583,52 L596,240"/><circle class="wx-inkfill" cx="596" cy="240" r="2"/></g><g class="wx-pop" style="--d:10"><path class="wx-thin" d="M612,218 L632,196"/><text class="wx-t-s wx-halo" x="634" y="170">dark desert</text><text class="wx-t-s wx-halo" x="634" y="184">varnish on</text><text class="wx-t-s wx-halo" x="634" y="198">exposed rock</text></g><g class="wx-pop" style="--d:11"><text class="wx-t-s wx-halo" x="24" y="336" >softer layer</text><path class="wx-thin" d="M84,332 L108,334"/></g><text class="wx-t-s wx-halo" x="512" y="350">1.7 m</text><text class="wx-t-cap" x="30" y="380">Sandstone plateau</text><g class="wx-pop" style="--d:11"><rect class="wx-card wx-edge-soft" x="634" y="236" width="80" height="94" rx="6"/><text class="wx-t-s" x="674" y="251" text-anchor="middle">from above</text><rect class="wx-stone2 wx-edge-soft" x="644" y="260" width="17" height="17" rx="3"/><rect class="wx-stone2 wx-edge-soft" x="665" y="260" width="17" height="17" rx="3"/><rect class="wx-stone2 wx-edge-soft" x="686" y="260" width="17" height="17" rx="3"/><rect class="wx-stone2 wx-edge-soft" x="644" y="281" width="17" height="17" rx="3"/><rect class="wx-stone2 wx-edge-soft" x="665" y="281" width="17" height="17" rx="3"/><rect class="wx-stone2 wx-edge-soft" x="686" y="281" width="17" height="17" rx="3"/><rect class="wx-stone2 wx-edge-soft" x="644" y="302" width="17" height="17" rx="3"/><rect class="wx-stone2 wx-edge-soft" x="665" y="302" width="17" height="17" rx="3"/><rect class="wx-stone2 wx-edge-soft" x="686" y="302" width="17" height="17" rx="3"/></g><g><rect class="wx-inkfill" x="30" y="470" width="60" height="5"/><rect class="wx-paper wx-edge" x="90" y="470" width="60" height="5"/><text class="wx-t-s" x="30" y="488" text-anchor="middle">0</text><text class="wx-t-s" x="150" y="488" text-anchor="middle">10 m</text></g><text class="wx-t-s" x="200" y="475">Schematic section: bed thicknesses and tower heights vary across the plateau.</text></svg></div></div><figcaption>From left to right, five stages of erosion: a hairline joint, a widened slot, a rock street, an undercut shelter and a lone pillar. Crossing joint sets make the street grid seen from above. <span class="wx-src">Based on: Schematic, based on general sandstone weathering processes described for the Tassili (UNESCO; NASA Earth Observatory). Heights and bed thicknesses are illustrative, not measured at Sefar.</span></figcaption><p class="vh">A cross-section through layered sandstone with a person 1.7 metres tall for scale and a 10 metre scale bar. On the left, an intact block has a thin vertical crack. Next, a narrow slot with water running down it. Then a corridor with a sand floor between two towers. A tower&#x27;s base is cut back where a softer layer eroded, forming an overhang with small painted figures on its back wall. On the right stands a lone pillar with a narrowed base. Tops of the rock are darkened by desert varnish. An inset shows a grid of rock blocks seen from above.</p></figure><p>Two more details made Sefar a gallery. First, not all beds are equally hard. Where a softer layer lies near the base of a tower, it erodes faster than the stone above it, and an overhang forms. These overhangs are the rock shelters where paintings survive, because they keep the worst of the rain and sun off the walls. Second, exposed rock surfaces darken with desert varnish, a thin coating of clay and iron and manganese oxides, so the city looks almost black from outside while its sheltered walls stay pale enough to paint on.</p><p>The plateau also shelters survivors. In its gorges, pools called gueltas hold water all year, and an isolated population of West African crocodiles lived in some of them into the 20th century. A few hundred ancient Saharan cypresses, Cupressus dupreziana, still grow on the plateau, relics of a greener past.</p></section><section class="wsec" id="sefar-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The Round Heads</h3><p>The oldest painted style at Sefar is named after its most obvious feature. The human figures have round, featureless heads, often without faces, and bodies that range from tiny to gigantic. Some float, some seem to dance, some carry bows, some wear what look like masks, horns or feathered headdresses. Many are painted in red ochre with white or yellow details. The researcher who has studied them most closely, Jitka Soukopova, dates the main phase to roughly 9,500 to 7,500 years ago and attributes it to hunter-gatherers.</p><p>The most famous Round Head painting is the Great God of Sefar. A huge figure, more than 3 m tall by most accounts, stands with arms raised and a curious head shape. To its left, women raise their arms towards it; nearby, another woman appears heavily pregnant. The name is modern, of course. We do not know whether the painters saw it as a god, a spirit, an ancestor or a person in ritual costume. But the composition, with a giant approached by smaller figures making the same gesture, reads strongly as a scene of veneration.</p><p>Soukopova and others have noticed that Round Head paintings cluster in shelters close to places where water collected and that some scenes may show rain-making or water rituals. Others emphasise masks and possible trance experiences. These are interpretations. What is solid is that the Round Heads are a coherent artistic tradition, found across the central Sahara from the Tassili to the Acacus in Libya and the Djado in Niger, and that Sefar holds some of its greatest works.</p><p>Making the paint was itself a craft. Red, yellow and brown ochres are iron-rich earths that can be ground on a stone and mixed with water and probably a binder; white came from clays such as kaolin. Grinding stones stained with pigment are known from Saharan sites. Some Round Head figures are outlined and then filled with flat colour, others decorated with fine dots and stripes that may represent body painting, scarification or clothing. The painters worked on uneven, sloping ceilings, sometimes several metres long, which probably meant planning, perhaps ladders or platforms, and a good deal of patience.</p></section><section class="wsec" id="sefar-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>When the Sahara was green</h3><p>Why would anyone paint hippos in the Sahara? Because they lived there. From roughly 14,800 to 5,500 years ago, in the marine record analysed by Peter deMenocal and colleagues, stronger summer monsoon rains pushed deep into North Africa. This was the African Humid Period. Lakes filled basins that are now salt flats, rivers flowed off the Tassili and other highlands, and grassland and scattered woodland spread across what is now sand and gravel.</p><p>The driver was astronomical, and it had nothing to do with visitors. Small, regular changes in Earth&#x27;s orbit made northern summers slightly more intense around 10,000 years ago, strengthening the West African monsoon. Feedbacks from vegetation and lakes probably amplified the effect. Rudolph Kuper and Stefan Kröpelin, drawing on hundreds of radiocarbon dates, showed that people moved into the eastern Sahara as it greened and moved out again as it dried.</p><figure class="wx wx--steps" id="sefar-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">The Sahara greening and drying, told through the art</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The Sahara greening and dryi
