ener">doi:10.1088/0004-637X/783/2/130</a></li><li>Herschel W. (1783). On the proper motion of the Sun and solar system. Philosophical Transactions of the Royal Society 73: 247–283.</li><li>Tarduno J.A. et al. (2010). Geodynamo, solar wind, and magnetopause 3.4 to 3.45 billion years ago. Science 327: 1238–1240. <a href="https://doi.org/10.1126/science.1183445" target="_blank" rel="noopener">doi:10.1126/science.1183445</a></li><li>Dubin A.E., Patapoutian A. (2010). Nociceptors: the sensors of the pain pathway. Journal of Clinical Investigation 120: 3760–3772. <a href="https://doi.org/10.1172/JCI42843" target="_blank" rel="noopener">doi:10.1172/JCI42843</a></li><li>Christ S.E., Van Essen D.C., Watson J.M., Brubaker L.E., McDermott K.B. (2009). The contributions of prefrontal cortex and executive control to deception. Cerebral Cortex 19: 1557–1566. <a href="https://doi.org/10.1093/cercor/bhn189" target="_blank" rel="noopener">doi:10.1093/cercor/bhn189</a></li><li>Friedman J., Barrett S.C.H. (2009). Wind of change: new insights on the ecology and evolution of pollination and mating in wind-pollinated plants. Annals of Botany 103: 1515–1527. <a href="https://doi.org/10.1093/aob/mcp035" target="_blank" rel="noopener">doi:10.1093/aob/mcp035</a></li><li>Tengberg M. (2012). Beginnings and early history of date palm garden cultivation in the Middle East. Journal of Arid Environments 86: 139–147. <a href="https://doi.org/10.1016/j.jaridenv.2011.11.022" target="_blank" rel="noopener">doi:10.1016/j.jaridenv.2011.11.022</a></li><li>Méndez de Torres L. (1586). Tractado breve de la cultivación y cura de las colmenas. Alcalá; Butler C. (1609). The Feminine Monarchie. Oxford; Swammerdam J. (1737). Biblia Naturae, Leiden (dissections of 1673).</li></ol></details><aside class="rc-cite" data-v="faiths" data-id="faith-islam" data-t="Islam"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Islam</i>. <span class="cite-u">https://residualcontinuum.com/#faiths/faith-islam</span> (updated 28 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="faith-sikhism-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Golden Temple (Harmandir Sahib), Amritsar.jpg" data-cap="Harmandir Sahib, the Golden Temple, Amritsar" data-big><figcaption></figcaption></figure><div class="sh-k">Punjab</div><h2 class="sh-t" id="faith-sikhism-st" tabindex="-1">Sikhism</h2><p class="sh-s">A faith born in Punjab around 1500 whose Gurus compiled their own scripture, so manuscripts from their lifetimes still survive today.</p><div class="sh-v"><span class="vstamp vstamp--when">15th–17th century CE</span></div></div><div class="f-facts"><div><span>Began</span><b>Punjab: Talwandi (Nankana Sahib), Sultanpur Lodhi and Kartarpur</b><small>c. 1500 CE (Guru Nanak, 1469–1539)</small></div><div><span>Followers today</span><b>about 25–30 million worldwide (20.8 million in India)</b><small>Census of India, 2011, for India; worldwide range from reference works, not a Pew count</small></div></div><h3 class="sub-h wsub">In its own words</h3><blockquote class="quote f-own"><p>There is one Creator, Ik Onkar, whose Name is Truth, without fear and without enmity, timeless, unborn, self-existent, known through the Guru&#x27;s grace. Guru Nanak and the nine Gurus who followed him revealed the divine Word, gurbani, which now lives as the eternal Guru in the Guru Granth Sahib and in the community of the Khalsa. Liberation from the round of rebirth comes by God&#x27;s grace, through remembering the Name (Nam simran), earning an honest living (kirat karni) and sharing with others (vand chhakna), not through empty ritual, caste or withdrawal from the world. All people are equal before God, and a householder&#x27;s life of service (seva) is the true path.</p><cite>How a follower might put it, in our words</cite></blockquote><h3 class="sub-h wsub">What it teaches and claims</h3><p class="rd-rule">Claims about God, revelation, the soul or miracles are matters of faith and are not rated. Claims about people, places, events and texts are weighed on the evidence.</p><ul class="rds"><li class="rd"><p class="rd-s">Guru Nanak received the divine Word and his mission during an experience in the Vein river at Sultanpur, around 1499.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">Told in the janamsakhis, the traditional life stories of Guru Nanak. The revelation is a matter of faith. Nanak&#x27;s time at Sultanpur Lodhi in the service of the Lodi administration is accepted by historians in outline. <span class="cite">Janamsakhi traditions; McLeod 1968</span></p></li><li class="rd"><p class="rd-s">The Guru Granth Sahib is the living, eternal Guru.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">The central belief of Sikh practice: the scripture is treated as a living Guru, installed, consulted and honoured. A matter of faith, not rated. The historical act of vesting guruship in the scripture is weighed separately below. <span class="cite">Grewal 1990</span></p></li><li class="rd"><p class="rd-s">Guru Nanak lived from 1469 to 1539 and founded a community at Kartarpur on the Ravi.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">The dates are traditional but widely accepted, and Nanak&#x27;s own hymns survive in manuscripts copied about 30 years after his death. The janamsakhis mix legend with memory, so details of his life are less secure than the outline. <span class="cite">McLeod 1968; Mann 1996</span></p></li><li class="rd"><p class="rd-s">Guru Nanak travelled as far as Mecca and Baghdad.</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">The janamsakhis describe long journeys (udasis) east, south, north and west. Nanak&#x27;s hymns show wide knowledge of Hindu and Muslim practice, but independent evidence for the western journeys is thin, and a claimed commemorative inscription in Baghdad is disputed. <span class="cite">McLeod 1968</span></p></li><li class="rd"><p class="rd-s">Guru Arjan compiled the Adi Granth and installed it at Harmandir Sahib in 1604.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">Supported by tradition, by the dated Kartarpur manuscript and by closely related early copies. Few ancient scriptures have their compilation so securely placed in time, by name and by place. <span class="cite">Mann 2001; Pashaura Singh 2000</span></p></li><li class="rd"><p class="rd-s">Guru Arjan was executed on the orders of the Mughal emperor Jahangir in 1606.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">Recorded in Sikh tradition and, independently, in Jahangir&#x27;s own memoir, which names Arjan and describes the order against him. The motives and the manner of death are told differently in the two sources. <span class="cite">Jahangirnama, trans. W. M. Thackston (1999)</span></p></li><li class="rd"><p class="rd-s">Guru Gobind Singh created the Khalsa at Anandpur on Vaisakhi, 1699.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">Central to Sikh memory and accepted by historians. Most detailed accounts of the day were written decades later, so the event is secure while particular details, such as the exact words spoken, are less certain. <span class="cite">Grewal 1990; McLeod 1989</span></p></li><li class="rd"><p class="rd-s">In 1708, before his death at Nanded, Guru Gobind Singh declared the scripture to be the Guru.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">The transfer of guruship to the Granth and the community is recorded in 18th-century Sikh sources and has been practised ever since. Some historians debate how the doctrine was expressed at the time; the faith meaning is not rated. <span class="cite">Grewal 1990; Oxford Handbook of Sikh Studies 2014</span></p></li></ul><h3 class="sub-h wsub">History, weighed</h3><ul class="rds"><li class="rd"><p class="rd-s">The Goindval pothis were compiled under Guru Amar Das around 1570–72.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">These manuscript volumes, traditionally written by Sahans Ram, contain hymns of the first three Gurus and of several bhagats arranged by musical mode. Gurinder Singh Mann&#x27;s study of their dates and contents shows they were a major source for the 1604 compilation. They remain in private family custody and have been studied mostly from photographs. <span class="cite">Mann 1996</span></p></li><li class="rd"><p class="rd-s">The Kartarpur Bir is the original 1604 volume prepared under Guru Arjan.</p><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span><p class="rd-n">Kept by the Sodhi family of Kartarpur, it is widely accepted by Sikhs and many scholars as the 1604 manuscript. Examinations have noted several scribal hands and corrections, and access for independent physical study has been limited, so some details remain debated. <span class="cite">Mann 2001; Pashaura Singh 2000</span></p></li><li class="rd"><p class="rd-s">Manuscript 1245 at Guru Nanak Dev University is an early draft of the Adi Granth made before 1604.</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">Some scholars date it to about 1599 and see it as evidence of the scripture&#x27;s growth before Guru Arjan&#x27;s final edition; others doubt that date or its significance. The debate became heated in the 1990s and remains open. <span class="cite">Pashaura Singh 2000; Mann 2001</span></p></li><li class="rd"><p class="rd-s">The additional material in the Banno recension was part of Guru Arjan&#x27;s scripture.</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">The Banno Bir, a 17th-century line of copies, includes passages absent from the Kartarpur volume. Mainstream Sikh authority regards them as unauthorised additions; scholars debate whether they entered by copying errors, local practice or deliberate expansion. <span class="cite">Mann 2001</span></p></li><li class="rd"><p class="rd-s">The foundation stone of Harmandir Sahib was laid by the Sufi saint Mian Mir in 1589.</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">A cherished story of friendship between faiths. The shrine&#x27;s construction under Guru Arjan in the late 16th century is well established, but the Mian Mir episode appears only in sources written long afterwards, so it cannot be confirmed. <span class="cite">Grewal 1990</span></p></li><li class="rd"><p class="rd-s">Guru Tegh Bahadur was executed in Delhi in 1675 on Aurangzeb&#x27;s orders.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">A central event of Sikh history, commemorated at Gurdwara Sis Ganj in Delhi. Sikh sources are detailed; contemporary Mughal records say little, and a fuller Persian account comes in the 18th century. The event itself is accepted by historians. <span class="cite">Grewal 1990</span></p></li><li class="rd"><p class="rd-s">The janamsakhis are reliable biographies of Guru Nanak.</p><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span><p class="rd-n">W. H. McLeod&#x27;s 1968 analysis found that these life stories, written from the 17th century onward, mix a probable core of real events with legend and devotional teaching. Others argue McLeod was too sceptical. Individual episodes must be weighed case by case. <span class="cite">McLeod 1968</span></p></li></ul><h3 class="sub-h wsub">The texts and what survives of them</h3><p class="rd-rule">The textual record measures what survives and how close it is to the original. It says nothing about whether a text is true or inspired.</p><section class="txt"><h4 class="txt-h">Guru Granth Sahib (Adi Granth)</h4><ol class="jr" aria-label="How Guru Granth Sahib (Adi Granth) reached us"><li class="jr-s"><span>Composed</span><b>c. 1500–1675 CE (hymns of Guru Nanak to Guru Tegh Bahadur); compiled 1604; final recension c. 1706</b></li><li class="jr-gap jr-gap--none"><span>copies survive from within the period of composition</span></li><li class="jr-s"><span>Oldest surviving copy</span><b>c. 1570–72 CE</b><small>The Goindval pothis</small></li><li class="jr-s jr-today"><span>Today</span><b>Read in the language of its source</b></li></ol><div class="rec"><div class="rec-r"><span>Closeness to the source</span><span class="rec-b" role="img" aria-label="Closeness to the source: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Source&#x27;s own language</span><span class="rec-b" role="img" aria-label="Source&#x27;s own language: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Gap to oldest copy</span><span class="rec-b" role="img" aria-label="Gap to oldest copy: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Early witnesses</span><span class="rec-b" role="img" aria-label="Early witnesses: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Stability of the text</span><span class="rec-b" role="img" aria-label="Stability of the text: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Documented history</span><span class="rec-b" role="img" aria-label="Documented history: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-tot"><span>Textual record</span><b>28<small>/30</small></b></div></div><p class="rec-why">Gap 5: the oldest witnesses fall within the period of composition. Language 5: the Gurus&#x27; own languages and script survive in daily use. Witnesses 5: many 17th-century manuscripts from several places. Stability 4: variants are small, apart from the Banno additions and early drafts. Documented 4: compilation is well recorded, but the handling of the Kartarpur volume and the status of early drafts are debated, so not 5. Source 5: the Gurus&#x27; own hymns, collected under the third Guru and compiled by the fifth Guru, Arjan, in 1604; some pages are thought to be in a Guru&#x27;s own hand.</p><dl class="txt-dl"><div><dt>Language of the text</dt><dd>Old Punjabi, Braj, Lahnda, Sant Bhasha and other north Indian idioms with Persian vocabulary, in Gurmukhi script</dd></div><div><dt>Composed</dt><dd>c. 1500–1675 CE (hymns of Guru Nanak to Guru Tegh Bahadur); compiled 1604; final recension c. 1706</dd></div><div><dt>Handed down</dt><dd>Hymns were sung in congregation (kirtan) set to ragas, as they still are. Unusually, the Gurus themselves wrote down and collected hymns from the start, so the oral and written traditions ran side by side.</dd></div><div><dt>Fixed in writing</dt><dd>Earlier collections, the Goindval pothis (c. 1570–72), fed into the Adi Granth compiled by Guru Arjan with the scribe Bhai Gurdas and installed at Harmandir Sahib in 1604. Guru Gobind Singh added Guru Tegh Bahadur&#x27;s hymns in the Damdama recension (c. 1706) and in 1708 declared the scripture the Guru. The standard printed text has 1,430 pages (angs).</dd></div><div><dt>Oldest surviving copy</dt><dd>The Goindval pothis, c. 1570–72 CE (dates recorded in the volumes and scribal evidence (Mann 1996))</dd></div><div><dt>Oldest complete copy</dt><dd>Kartarpur Bir (Adi Granth of Guru Arjan), 1604 CE</dd></div><div><dt>Early witnesses</dt><dd>Dozens of manuscripts survive from the 17th century, including the Goindval pothis, the Kartarpur Bir, copies in the Banno line and many copies of the Damdama recension, spread across Punjab and beyond (Mann 2001).</dd></div></dl><div class="face"><div class="face-c face-m"><span class="face-k">How the tradition sees its text</span><p>The Gurus spoke the divine Word and took care to record it. Guru Arjan compiled the Adi Granth to separate authentic gurbani from imitations, and the Kartarpur volume is his original. Guru Gobind Singh completed it at Damdama and made it the eternal Guru, and the text has been kept without change since, down to the page layout.</p></div><div class="face-c face-x"><span class="face-k">What manuscript scholarship shows</span><p>Scholars agree the record is exceptionally good: manuscripts survive from within the Gurus&#x27; lifetimes, compiled by the Gurus themselves. Debates concern details, such as early drafts like MS 1245, the history of the Kartarpur volume, and the Banno additions, not the substance of the text, which is very stable.</p></div></div><h5 class="txt-sub">Documented changes, variants and revisions</h5><ul class="txt-ch"><li>The Goindval pothis show hymns being gathered and arranged by raga a generation before 1604; their order and contents differ in places from the Adi Granth (Mann 1996).</li><li>In 1604 Guru Arjan selected hymns of the first five Gurus and of saints including Kabir, Namdev, Ravidas and Sheikh Farid, and arranged them by raga and author (Pashaura Singh 2000).</li><li>The Banno recension adds passages not found in the Kartarpur volume; mainstream Sikh authority regards them as unauthorised (Mann 2001).</li><li>In the Damdama recension (c. 1706) Guru Gobind Singh added the hymns and couplets of his father, Guru Tegh Bahadur, completing the text now in use.</li><li>Printed editions from the late 19th century, and the standard 1,430-page layout, fixed the modern text; scholars catalogue small spelling variants among manuscripts.</li></ul></section><h3 class="sub-h wsub">Through time</h3><ol class="ftl"><li><span class="ftl-y">1469</span><b>Birth of Guru Nanak</b><span>Born at Talwandi, now Nankana Sahib in Pakistan.</span></li><li><span class="ftl-y">c. 1499</span><b>Revelation at Sultanpur</b><span>Nanak&#x27;s experience in the Vein river begins his mission (tradition).</span></li><li><span class="ftl-y">c. 1520s</span><b>Kartarpur founded</b><span>Nanak settles on the Ravi and forms a community of householder disciples.</span></li><li><span class="ftl-y">1539</span><b>Death of Guru Nanak</b><span>Guruship passes to Guru Angad, not to Nanak&#x27;s sons.</span></li><li><span class="ftl-y">c. 1570–72</span><b>Goindval pothis</b><span>Hymns collected under Guru Amar Das.</span></li><li><span class="ftl-y">1604</span><b>Adi Granth installed</b><span>Guru Arjan&#x27;s compilation is placed in Harmandir Sahib, Amritsar.</span></li><li><span class="ftl-y">1606</span><b>Execution of Guru Arjan</b><span>Put to death at Lahore on Jahangir&#x27;s orders; noted in the emperor&#x27;s memoir.</span></li><li><span class="ftl-y">1675</span><b>Execution of Guru Tegh Bahadur</b><span>Beheaded in Delhi under Aurangzeb.</span></li><li><span class="ftl-y">1699</span><b>The Khalsa</b><span>Guru Gobind Singh creates the Khalsa at Anandpur on Vaisakhi.</span></li><li><span class="ftl-y">c. 1706</span><b>Damdama recension</b><span>Guru Tegh Bahadur&#x27;s hymns are added to the scripture.</span></li><li><span class="ftl-y">1708</span><b>The scripture becomes Guru</b><span>Guru Gobind Singh dies at Nanded after vesting guruship in the Granth and the community.</span></li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">6 min read · 1,311 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Sikhism"><button type="button" class="wtoc-i" data-go="sikhism-s1">A scripture edited by its prophets</button><button type="button" class="wtoc-i" data-go="sikhism-s2">Guru Nanak and the tradition&#x27;s own account</button><button type="button" class="wtoc-i" data-go="sikhism-s3">A scripture that witnessed its age</button><button type="button" class="wtoc-i" data-go="sikhism-s4">From pothis to Granth</button><button type="button" class="wtoc-i" data-go="sikhism-s5">The Tenth Guru and the Guru Granth</button><button type="button" class="wtoc-i" data-go="sikhism-s6">What historians still debate</button><button type="button" class="wtoc-i" data-go="sikhism-s7">Why this record matters</button></nav></div><section class="wsec" id="sikhism-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A scripture edited by its prophets</h3><p>For most of the world&#x27;s scriptures, historians spend their careers trying to close a gap: centuries of silence between the founder and the oldest surviving copy. Sikhism is different. Its scripture was collected by the Gurus themselves, and manuscripts made in their lifetimes survive in Punjab today. The distance between composition and the oldest written witness is measured in years, not centuries. Few religious traditions of any age can say as much, and that makes Sikhism a valuable test case for how well written records can preserve a teaching when the teachers take charge of the writing.</p><p>Sikhism is also young by the standards of this section. Its founder, Guru Nanak, was born in 1469, and the tradition took its classical form over the next two and a half centuries under ten human Gurus. Today there are about 25 to 30 million Sikhs, most of them in Punjab and across a large diaspora.</p><blockquote class="wpull"><p>The distance between composition and the oldest written witness is measured in years, not centuries.</p></blockquote></section><section class="wsec" id="sikhism-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Guru Nanak and the tradition&#x27;s own account</h3><p>Sikh tradition tells how Nanak, working as a storekeeper at Sultanpur Lodhi, went to bathe in the Vein river and disappeared for three days. He returned with a message: there is no Hindu and no Muslim, only the one God before whom all are equal. He travelled widely, sang his hymns with the Muslim musician Mardana, and in his later years settled at Kartarpur on the Ravi, where disciples farmed, worshipped and ate together in a community kitchen, the langar. Before his death in 1539 he passed the guruship not to his sons but to a disciple, Angad. Nine more human Gurus followed.</p><p>These stories come to us through the janamsakhis, lives of the Guru written down from the 17th century onward. In 1968 the historian W. H. McLeod analysed them and concluded that they combine a core of probable fact with miracle stories and teaching tales. Many Sikh scholars thought him too sceptical, and the debate continues. What is not in doubt is the voice of the hymns themselves, which survive in manuscripts copied within about thirty years of Nanak&#x27;s death.</p><blockquote class="quote"><p>Ik Onkar, Satnam, Karta Purakh, Nirbhau, Nirvair, Akal Murat, Ajuni, Saibhang, Gur Prasad.</p><cite>The Mul Mantar, opening words of the Guru Granth Sahib (page 1), transliterated. A literal gloss: One Creator; Truth by Name; the Maker; without fear; without hatred; of timeless form; unborn; self-existent; known by the Guru&#x27;s grace.</cite></blockquote></section><section class="wsec" id="sikhism-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>A scripture that witnessed its age</h3><p>The hymns are not only devotional poetry; some are eyewitness history. A group of Guru Nanak&#x27;s compositions, known as the Babarvani, laments the violence of Babur&#x27;s invasions of Punjab in the 1520s, the campaigns that founded the Mughal empire. They describe the suffering of ordinary people, including women of both Hindu and Muslim families, in a town traditionally identified as Saidpur, today&#x27;s Eminabad. Babur&#x27;s own memoir describes his raids into Punjab in these years, though it has a gap for part of the early 1520s, so a Mughal conqueror and a Punjabi poet describe the same era from opposite sides.</p><p>The scripture is also a record of the religious landscape of north India. Alongside the Gurus it includes verses by bhagats from several centuries and backgrounds: Kabir the weaver of Benares, Namdev the tailor-saint of Maharashtra, Ravidas the leatherworker, and the Sufi Sheikh Farid, who lived about three centuries before Nanak. Its languages range from old Punjabi to Braj and the mixed idiom of the wandering saints, with Persian and Arabic words, all written in the Gurmukhi script the Gurus promoted. A separate collection, the Dasam Granth, is traditionally attributed to Guru Gobind Singh; its authorship is debated, and it does not have the status of the Guru Granth Sahib.</p></section><section class="wsec" id="sikhism-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>From pothis to Granth</h3><p>The first great collection was made in the time of the third Guru, Amar Das, at Goindval on the Beas. The Goindval pothis, a set of manuscript volumes dated to about 1570–72, gather hymns of the first three Gurus and of several bhagats, the Hindu and Muslim saints whose verses the Gurus honoured, arranged by the musical mode in which they were to be sung. Gurinder Singh Mann&#x27;s study of these volumes in the 1990s showed how much of the later scripture&#x27;s structure was already in place.</p><p>The fifth Guru, Arjan, completed the task. Working with the scholar and scribe Bhai Gurdas, he gathered the hymns of the first five Gurus and of saints including Kabir, Namdev, Ravidas and Sheikh Farid, and arranged them by raga and author. In 1604 the finished volume, the Adi Granth, was installed in the newly built Harmandir Sahib at Amritsar, today&#x27;s Golden Temple. The tradition explains his motive clearly: imitations of the Gurus&#x27; hymns were circulating, and an authorised book would separate true gurbani from false.</p><aside class="wcall"><b>How do we know?</b><p>A manuscript known as the Kartarpur Bir, kept by the Sodhi family of Kartarpur, is regarded by Sikhs and many scholars as Guru Arjan&#x27;s 1604 volume. Scholars who have examined it or its photographs describe several scribal hands and corrections, which fits a working editorial copy. Related manuscripts, the older Goindval pothis and other early copies, allow its contents to be checked. Few scriptures anywhere can be compared with a copy made under the direction of the person who compiled it.</p></aside></section><section class="wsec" id="sikhism-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The Tenth Guru and the Guru Granth</h3><p>The 17th century brought conflict with Mughal power. Guru Arjan was executed at Lahore in 1606, an event recorded not only by Sikhs but in the emperor Jahangir&#x27;s own memoir. The ninth Guru, Tegh Bahadur, was beheaded in Delhi in 1675. His son, Guru Gobind Singh, created the Khalsa, the order of initiated Sikhs, at Anandpur on Vaisakhi in 1699.</p><p>Around 1706, at Damdama Sahib, Guru Gobind Singh prepared a final recension of the scripture, adding his father&#x27;s hymns and couplets; this Damdama recension is the text in use today. Then, in 1708 at Nanded in the Deccan, shortly before his death, he ended the line of human Gurus and vested guruship in the scripture and the community. From that moment the book was not simply a record of the Gurus&#x27; words: it became the Guru, the Guru Granth Sahib. Its standard printed form has 1,430 pages, and a copy is installed and read in every gurdwara.</p></section><section class="wsec" id="sikhism-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What historians still debate</h3><p>Because the record is so rich, debates focus on details that would be invisible for older scriptures. A manuscript at Guru Nanak Dev University, MS 1245, has been dated by some scholars to about 1599 and read as an early draft showing how hymns were revised before the 1604 edition; others dispute that date and interpretation, and the question sparked a heated controversy in the 1990s. The Banno Bir, a 17th-century line of copies, contains extra passages that mainstream Sikh authority rejects. The physical history of the Kartarpur volume, which has been in private hands for centuries, has also been discussed.</p><ul class="wlist"><li>How far the janamsakhis preserve reliable memories of Guru Nanak&#x27;s travels.</li><li>Whether MS 1245 and similar manuscripts are drafts of the scripture or later copies.</li><li>How the Banno additions entered part of the manuscript tradition.</li><li>The exact wording and circumstances of the 1708 transfer of guruship.</li></ul></section><section class="wsec" id="sikhism-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>Why this record matters</h3><p>Set beside the other traditions on this site, the Guru Granth Sahib is a rare case in which the tradition&#x27;s own account and manuscript scholarship largely agree. Both say the Gurus composed the hymns, that they were gathered in stages from around 1570, compiled by Guru Arjan in 1604 and completed by Guru Gobind Singh around 1706. Disagreements concern early drafts and later additions at the margins, not the heart of the text. Its languages and script are still read and sung every day.</p><p>The later history of the text is also well documented. For about two centuries the scripture was copied by hand, and scribes in different places produced copies that differ mostly in spelling and small details. From the second half of the 19th century printed editions spread, and in the 20th century a standard page layout of 1,430 pages became universal, so that a reference to a given page points to the same words in every gurdwara in the world. Few scriptures have such a uniform modern text with such a short and visible path back to their authors.</p><p>It also offers a lesson for reading older scriptures. Even here, with autograph-era manuscripts, there are drafts, variant copies and debated additions. Where older texts show larger variation after centuries of copying, that is what the Sikh case would lead us to expect, and it is a reason to value each tradition&#x27;s early witnesses, not to dismiss them.</p></section><details class="srcs"><summary>Sources for this tradition (14)</summary><ol><li>Office of the Registrar General and Census Commissioner, India (2011). Census of India 2011: Religion data (C-1 tables).</li><li>Mann G. S. (1996). The Goindval Pothis: The Earliest Extant Source of the Sikh Canon. Harvard Oriental Series 51. Harvard University Press.</li><li>Mann G. S. (2001). The Making of Sikh Scripture. Oxford University Press, New York.</li><li>Singh, Pashaura (2000). The Guru Granth Sahib: Canon, Meaning and Authority. Oxford University Press, New Delhi.</li><li>McLeod W. H. (1968). Guru Nanak and the Sikh Religion. Clarendon Press, Oxford.</li><li>McLeod W. H. (1989). Who Is a Sikh? The Problem of Sikh Identity. Clarendon Press, Oxford.</li><li>Grewal J. S. (1990). The Sikhs of the Punjab. The New Cambridge History of India II.3. Cambridge University Press.</li><li>Singh, Pashaura, Fenech L. E. (eds) (2014). The Oxford Handbook of Sikh Studies. Oxford University Press.</li><li>Jahangir. The Jahangirnama: Memoirs of Jahangir, Emperor of India, trans. W. M. Thackston (1999). Freer Gallery of Art and Arthur M. Sackler Gallery, Smithsonian Institution, with Oxford University Press.</li><li>Shackle C., Mandair A.-P. S. (trans. and eds) (2005). Teachings of the Sikh Gurus: Selections from the Sikh Scriptures. Routledge.</li><li>Nesbitt E. (2016). Sikhism: A Very Short Introduction. 2nd ed. Oxford University Press.</li><li>Oberoi H. (1994). The Construction of Religious Boundaries: Culture, Identity and Diversity in the Sikh Tradition. University of Chicago Press.</li><li>Babur. The Baburnama: Memoirs of Babur, Prince and Emperor, trans. W. M. Thackston (1996). Freer Gallery of Art and Arthur M. Sackler Gallery, Smithsonian Institution, with Oxford University Press.</li><li>Wikipedia. Guru Granth Sahib; Sikhism (accessed September 2026).</li></ol></details><aside class="rc-cite" data-v="faiths" data-id="faith-sikhism" data-t="Sikhism"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Sikhism</i>. <span class="cite-u">https://residualcontinuum.com/#faiths/faith-sikhism</span> (updated 25 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="faith-bahai-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Bahá&#x27;í Shrine of the Bab in Haifa, Israel.jpg" data-cap="The Shrine of the Báb on Mount Carmel, Haifa" data-big><figcaption></figcaption></figure><div class="sh-k">Iran and the Ottoman Empire</div><h2 class="sh-t" id="faith-bahai-st" tabindex="-1">Bahá&#x27;í Faith</h2><p class="sh-s">The youngest tradition on this site, whose founders&#x27; writings survive in their own hands or their secretaries&#x27;, with almost no gap at all.</p><div class="sh-v"><span class="vstamp vstamp--when">1844–1892 CE</span></div></div><div class="f-facts"><div><span>Began</span><b>Shiraz and Tehran, Iran; later Baghdad, Edirne and Acre</b><small>1844 (the Báb&#x27;s declaration) and 1863 (Bahá&#x27;u&#x27;lláh&#x27;s declaration)</small></div><div><span>Followers today</span><b>about 8 million</b><small>World Religion Database, 2020 estimate (8.5 million); the Universal House of Justice also gives about eight million (2020)</small></div></div><h3 class="sub-h wsub">In its own words</h3><blockquote class="quote f-own"><p>God is one, unknowable in essence, and has made Himself known through a series of Messengers, among them Abraham, Moses, Zoroaster, Krishna, the Buddha, Jesus and Muhammad, who taught one unfolding religion suited to each age. In 1844 the Báb announced that a new day had dawned, and Bahá&#x27;u&#x27;lláh, the Glory of God, is the Messenger for this age, promised in the scriptures of the past. His teachings call for the unity of humankind: the oneness of God, of religion and of humanity, the equality of women and men, harmony of science and religion, universal education and the end of prejudice. The earth is but one country, and its peoples are called to build a just and peaceful world.</p><cite>How a follower might put it, in our words</cite></blockquote><h3 class="sub-h wsub">What it teaches and claims</h3><p class="rd-rule">Claims about God, revelation, the soul or miracles are matters of faith and are not rated. Claims about people, places, events and texts are weighed on the evidence.</p><ul class="rds"><li class="rd"><p class="rd-s">Bahá&#x27;u&#x27;lláh is the Manifestation of God for this age, promised by earlier religions.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">The central belief of the Bahá&#x27;í Faith, grounded in Bahá&#x27;u&#x27;lláh&#x27;s own writings and in readings of earlier scriptures. It concerns revelation and is not rated. <span class="cite">Kitáb-i-Íqán; Kitáb-i-Aqdas</span></p></li><li class="rd"><p class="rd-s">The Báb was an independent Messenger of God and the herald of Bahá&#x27;u&#x27;lláh.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">Bahá&#x27;ís honour the Báb as a Manifestation in his own right. Followers of Subh-i Azal, a rival Bábí leader, read his writings differently. A religious claim, not rated. <span class="cite">Persian Bayán; Saiedi 2008</span></p></li><li class="rd"><p class="rd-s">God is one, the religions are one in origin, and humanity is one.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">The three &#x27;onenesses&#x27; that summarise Bahá&#x27;í teaching. They concern the divine and the moral order, so they are not rated here. <span class="cite">Gleanings CXVII; Smith 2008</span></p></li><li class="rd"><p class="rd-s">Bahá&#x27;u&#x27;lláh first became aware of his mission in the Síyáh-Chál dungeon of Tehran in 1852.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">The imprisonment itself is historical: Bábís were jailed after an attempt on the Shah&#x27;s life in August 1852. The experience of revelation Bahá&#x27;u&#x27;lláh later described is a matter of faith. <span class="cite">Bahá&#x27;u&#x27;lláh, Epistle to the Son of the Wolf; Cole 1998</span></p></li><li class="rd"><p class="rd-s">The Báb announced his mission to Mullá Husayn in Shiraz in May 1844.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">Early Bábí and later Bahá&#x27;í sources agree on the event and the evening of 22–23 May 1844. Its details come from followers, but the rapid rise of the Bábí movement from 1844 is well documented in Persian and European sources. <span class="cite">Amanat 1989; MacEoin 1992</span></p></li><li class="rd"><p class="rd-s">The founders&#x27; writings survive in their original form, unlike earlier scriptures.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">The Báb&#x27;s and Bahá&#x27;u&#x27;lláh&#x27;s writings were recorded in their lifetimes, often by their own hands or trusted secretaries, and many originals are held in Haifa. Independent scholars have limited access to those archives, and no full critical editions have been published. <span class="cite">MacEoin 1992; Smith 2008</span></p></li><li class="rd"><p class="rd-s">Bahá&#x27;u&#x27;lláh wrote to the kings and rulers of his time, calling them to justice.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">Tablets addressed to Napoleon III, Queen Victoria, Pope Pius IX, Tsar Alexander II and Nasir al-Din Shah survive in Bahá&#x27;í collections and early copies. Whether each letter was delivered is less certain; the Shah&#x27;s courier Badí&#x27; was executed in 1869. <span class="cite">Smith 2008; Cole 1998</span></p></li><li class="rd"><p class="rd-s">Bahá&#x27;u&#x27;lláh&#x27;s writings foretold specific political events.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">Bahá&#x27;ís read passages, such as the tablet to Napoleon III, as prophecies that were fulfilled. Whether they are prophecy is a matter of faith; the dates of the tablets and events can be checked separately. <span class="cite">Taherzadeh 1974–87</span></p></li></ul><h3 class="sub-h wsub">History, weighed</h3><ul class="rds"><li class="rd"><p class="rd-s">The Báb was executed by firing squad in Tabriz on 9 July 1850.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">The execution is recorded by Persian court chronicles, by European diplomats in Iran and by Bábí and Bahá&#x27;í sources. Details of the scene differ between accounts, but the date and place are secure. <span class="cite">Momen 1981; Amanat 1989</span></p></li><li class="rd"><p class="rd-s">Thousands of Bábís were killed in the upheavals of 1848–1852.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">Armed conflicts at Shaykh Tabarsi, Nayriz and Zanjan, and the massacre after the attempt on the Shah in 1852, are described by Persian chronicles and Western observers. Estimates of the total run to several thousand; exact numbers are uncertain. <span class="cite">Amanat 1989; Momen 1981</span></p></li><li class="rd"><p class="rd-s">Bahá&#x27;u&#x27;lláh was exiled from Iran to Baghdad (1853), Constantinople and Edirne (1863) and Acre (1868).</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">Persian and Ottoman government records, consular reports and Bahá&#x27;í sources agree on this chain of banishments. He remained a prisoner or under restriction in and around Acre until his death in 1892. <span class="cite">Momen 1981; Cole 1998</span></p></li><li class="rd"><p class="rd-s">Bahá&#x27;u&#x27;lláh composed the Kitáb-i-Aqdas in Acre around 1873.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">The date comes from Bahá&#x27;í tradition and the text&#x27;s contents. A copy dated January 1887 in the hand of the transcriber Zaynu&#x27;l-Muqarrabín is in the British Library, and the book was printed in Bombay in 1890–91 at Bahá&#x27;u&#x27;lláh&#x27;s direction. <span class="cite">Kitáb-i-Aqdas (1992), introduction; British Library</span></p></li><li class="rd"><p class="rd-s">The Cambridge orientalist E. G. Browne met Bahá&#x27;u&#x27;lláh near Acre in April 1890.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">Browne published his description in 1891, and his papers and manuscript collection at Cambridge University Library are open to researchers. He is the only Western scholar known to have left an account of meeting Bahá&#x27;u&#x27;lláh. <span class="cite">Browne 1891</span></p></li><li class="rd"><p class="rd-s">The Báb&#x27;s remains were hidden for decades and interred on Mount Carmel in 1909.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">Bahá&#x27;í accounts describe the remains being moved secretly within Iran and brought to Palestine; &#x27;Abdu&#x27;l-Bahá interred them in the Shrine of the Báb in March 1909. The shrine is part of a UNESCO World Heritage Site inscribed in 2008. <span class="cite">Smith 2008; UNESCO 2008</span></p></li><li class="rd"><p class="rd-s">Bahá&#x27;ís in Iran have faced systematic persecution since 1979, with more than 200 killed.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">United Nations special rapporteurs, human rights organisations and Iranian government documents record executions, imprisonments, confiscations and exclusion from universities. The figure of over 200 killed after 1979 is widely cited in UN and NGO reports. <span class="cite">UN Special Rapporteur reports; Smith 2008</span></p></li></ul><h3 class="sub-h wsub">The texts and what survives of them</h3><p class="rd-rule">The textual record measures what survives and how close it is to the original. It says nothing about whether a text is true or inspired.</p><section class="txt"><h4 class="txt-h">The Kitáb-i-Aqdas (The Most Holy Book)</h4><ol class="jr" aria-label="How The Kitáb-i-Aqdas (The Most Holy Book) reached us"><li class="jr-s"><span>Composed</span><b>c. 1873 CE, Acre</b></li><li class="jr-gap jr-gap--none"><span>copies survive from within the period of composition</span></li><li class="jr-s"><span>Oldest surviving copy</span><b>from c. 1873</b><small>Manuscripts of the Kitáb-i-Aqdas in the International Bahá&#x27;í Archives, including copies made and reviewed in Bahá&#x27;u&#x27;lláh&#x27;s lifetime</small></li><li class="jr-s jr-today"><span>Today</span><b>Read in the language of its source</b></li></ol><div class="rec"><div class="rec-r"><span>Closeness to the source</span><span class="rec-b" role="img" aria-label="Closeness to the source: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Source&#x27;s own language</span><span class="rec-b" role="img" aria-label="Source&#x27;s own language: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Gap to oldest copy</span><span class="rec-b" role="img" aria-label="Gap to oldest copy: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Early witnesses</span><span class="rec-b" role="img" aria-label="Early witnesses: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Stability of the text</span><span class="rec-b" role="img" aria-label="Stability of the text: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Documented history</span><span class="rec-b" role="img" aria-label="Documented history: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-tot"><span>Textual record</span><b>28<small>/30</small></b></div></div><p class="rec-why">Gap 5: copies exist from the author&#x27;s lifetime. Language 5: written in Arabic by Bahá&#x27;u&#x27;lláh himself, and that Arabic survives. Witnesses 4: many early copies, but the main archive is not open for full independent study. Stability 4: known copies agree closely, but without a published critical edition this is not independently measured, which some scholars would score lower. Documented 5: composition, copying, printing and translation are all well recorded. Source 5: the author&#x27;s own text, written and authenticated in his lifetime.</p><dl class="txt-dl"><div><dt>Language of the text</dt><dd>Arabic</dd></div><div><dt>Composed</dt><dd>c. 1873 CE, Acre</dd></div><div><dt>Handed down</dt><dd>Not an oral text. Bahá&#x27;u&#x27;lláh&#x27;s words were taken down by his secretary in rapid &#x27;revelation writing&#x27; and then written out in fair copies that he reviewed.</dd></div><div><dt>Fixed in writing</dt><dd>Circulated in manuscript from the 1870s; printed in Bombay in 1890–91 at Bahá&#x27;u&#x27;lláh&#x27;s direction. The authorised English translation, with Bahá&#x27;u&#x27;lláh&#x27;s &#x27;Questions and Answers&#x27; and notes, was published by the Universal House of Justice in 1992.</dd></div><div><dt>Oldest surviving copy</dt><dd>Manuscripts of the Kitáb-i-Aqdas in the International Bahá&#x27;í Archives, including copies made and reviewed in Bahá&#x27;u&#x27;lláh&#x27;s lifetime, from c. 1873 (handwriting and ownership history, as reported by the Bahá&#x27;í World Centre; the earliest independently catalogued copy is dated January 1887 (British Library))</dd></div><div><dt>Early witnesses</dt><dd>Originals and early copies at the Bahá&#x27;í World Centre, the 1887 Zaynu&#x27;l-Muqarrabín copy in the British Library, other 19th-century copies in Iranian and Western collections, and the Bombay printing of 1890–91 authorised by the author.</dd></div></dl><div class="face"><div class="face-c face-m"><span class="face-k">How the tradition sees its text</span><p>Bahá&#x27;ís regard the Aqdas as the charter of Bahá&#x27;u&#x27;lláh&#x27;s world order. Because it was written down under his eye, reviewed by him and preserved in his lifetime, they see its text as authentic in a way that earlier scriptures, transmitted over centuries, could not be. Authentication is the work of the Universal House of Justice&#x27;s Research Department.</p></div><div class="face-c face-x"><span class="face-k">What manuscript scholarship shows</span><p>Scholars agree the Aqdas is securely dated and attributed, with copies close to the author&#x27;s lifetime. The main limit is access: the Haifa originals are not published in facsimile or critical edition, so independent comparison relies on copies such as the British Library manuscript, which has been described as highly accurate.</p></div></div><h5 class="txt-sub">Documented changes, variants and revisions</h5><ul class="txt-ch"><li>Bahá&#x27;u&#x27;lláh added answers to believers&#x27; questions about the book&#x27;s laws, gathered as &#x27;Questions and Answers&#x27;, which the 1992 edition publishes alongside the text as authoritative supplement (Kitáb-i-Aqdas 1992).</li><li>An unauthorised English translation by Earl Elder and William Miller appeared in 1961; the Bahá&#x27;í authorities issued a synopsis in 1973 and the authorised full translation only in 1992.</li><li>Bahá&#x27;u&#x27;lláh delayed wide circulation of the text for some years after 1873, and some of its laws were to be applied gradually, as the 1992 notes explain (Kitáb-i-Aqdas 1992).</li></ul></section><section class="txt"><h4 class="txt-h">The Kitáb-i-Íqán (The Book of Certitude)</h4><ol class="jr" aria-label="How The Kitáb-i-Íqán (The Book of Certitude) reached us"><li class="jr-s"><span>Composed</span><b>January 1861 CE (some sources say 1862), Baghdad</b></li><li class="jr-gap "><span>about 21 years with no surviving copy</span></li><li class="jr-s"><span>Oldest surviving copy</span><b>c. 1882</b><small>Bombay lithograph edition by the Afnán family (earliest dated printed witness; earlier manuscript copies are held in Haifa and other collections)</small></li><li class="jr-s jr-today"><span>Today</span><b>Read in the language of its source</b></li></ol><div class="rec"><div class="rec-r"><span>Closeness to the source</span><span class="rec-b" role="img" aria-label="Closeness to the source: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Source&#x27;s own language</span><span class="rec-b" role="img" aria-label="Source&#x27;s own language: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Gap to oldest copy</span><span class="rec-b" role="img" aria-label="Gap to oldest copy: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Early witnesses</span><span class="rec-b" role="img" aria-label="Early witnesses: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Stability of the text</span><span class="rec-b" role="img" aria-label="Stability of the text: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Documented history</span><span class="rec-b" role="img" aria-label="Documented history: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-tot"><span>Textual record</span><b>27<small>/30</small></b></div></div><p class="rec-why">Gap 5: author-supervised copies and printed editions within about 20 years. Language 5: written in Persian by Bahá&#x27;u&#x27;lláh himself, and that Persian survives. Witnesses 4: many 19th-century copies, though not published as a set. Stability 4: variation is limited and mostly the author&#x27;s own corrections. Documented 4: the revision history is recorded by Bahá&#x27;í sources, but manuscript-by-manuscript study is not yet public. Source 5: the author&#x27;s own text, with copies he supervised and corrected.</p><dl class="txt-dl"><div><dt>Language of the text</dt><dd>Persian, with Arabic quotations</dd></div><div><dt>Composed</dt><dd>January 1861 CE (some sources say 1862), Baghdad</dd></div><div><dt>Handed down</dt><dd>Written in about two days and two nights in answer to questions from a maternal uncle of the Báb, according to Bahá&#x27;í accounts.</dd></div><div><dt>Fixed in writing</dt><dd>Circulated in manuscript; Bahá&#x27;u&#x27;lláh wrote a tablet about scribal errors in circulating copies and oversaw authoritative master copies. First printed by the Báb&#x27;s relatives in Bombay around 1882, with a second lithograph in 1893; Shoghi Effendi&#x27;s English translation (1931) is the standard one.</dd></div><div><dt>Oldest surviving copy</dt><dd>Bombay lithograph edition by the Afnán family (earliest dated printed witness; earlier manuscript copies are held in Haifa and other collections), c. 1882 (printed edition, date of publication)</dd></div><div><dt>Early witnesses</dt><dd>Many 19th-century manuscripts in Bahá&#x27;í archives and private and library collections, the author-supervised master copies, and the lithographs of c. 1882 and 1893.</dd></div></dl><div class="face"><div class="face-c face-m"><span class="face-k">How the tradition sees its text</span><p>Bahá&#x27;ís regard the Íqán as Bahá&#x27;u&#x27;lláh&#x27;s key doctrinal work on the unity of the Messengers and the meaning of prophecy. Its text is authoritative in the form approved by Bahá&#x27;u&#x27;lláh, including the corrections he made, and preserved by the institutions of the Faith.</p></div><div class="face-c face-x"><span class="face-k">What manuscript scholarship shows</span><p>Scholars such as Christopher Buck accept the date and authorship and treat the Íqán as a sophisticated commentary on Quranic themes. The documented corrections show a text revised by its author, which is unusual among scriptures. As with the Aqdas, there is no published critical edition of the manuscripts.</p></div></div><h5 class="txt-sub">Documented changes, variants and revisions</h5><ul class="txt-ch"><li>Quranic verses that Bahá&#x27;u&#x27;lláh had quoted inexactly were brought into line with the Quran in later editions, at his own instruction.</li><li>Bahá&#x27;u&#x27;lláh corrected scribal errors that had crept into circulating manuscripts and had master copies prepared, a documented revision within the author&#x27;s lifetime.</li><li>English versions changed markedly: Ali-Kuli Khan&#x27;s 1904 &#x27;Book of Ighan&#x27; was replaced by Shoghi Effendi&#x27;s more literary 1931 translation, now the authorised one.</li></ul></section><section class="txt"><h4 class="txt-h">The Persian Bayán (the Báb)</h4><ol class="jr" aria-label="How The Persian Bayán (the Báb) reached us"><li class="jr-s"><span>Composed</span><b>1847–1848 CE, Mákú (unfinished)</b></li><li class="jr-gap jr-gap--none"><span>copies survive from within the period of composition</span></li><li class="jr-s"><span>Oldest surviving copy</span><b>1847–1848</b><small>Siyyid Husayn Yazdí&#x27;s original manuscript of the Báb&#x27;s dictation</small></li><li class="jr-s jr-today"><span>Today</span><b>Read in the language of its source</b></li></ol><div class="rec"><div class="rec-r"><span>Closeness to the source</span><span class="rec-b" role="img" aria-label="Closeness to the source: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Source&#x27;s own language</span><span class="rec-b" role="img" aria-label="Source&#x27;s own language: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Gap to oldest copy</span><span class="rec-b" role="img" aria-label="Gap to oldest copy: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Early witnesses</span><span class="rec-b" role="img" aria-label="Early witnesses: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Stability of the text</span><span class="rec-b" role="img" aria-label="Stability of the text: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Documented history</span><span class="rec-b" role="img" aria-label="Documented history: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-tot"><span>Textual record</span><b>24<small>/30</small></b></div></div><p class="rec-why">Gap 5: the original dictation copy dates from the time of composition. Language 5: dictated in Persian by the Báb, and that Persian survives. Witnesses 3: dozens of copies exist but only a handful have been studied and compared. Stability 3: without a critical edition, the extent of variants is unknown, and factional disputes raise the question. Documented 3: composition is recorded, but the copying history is not well studied. Source 5: the Báb&#x27;s own dictation, taken down by his secretary as he spoke.</p><dl class="txt-dl"><div><dt>Language of the text</dt><dd>Persian</dd></div><div><dt>Composed</dt><dd>1847–1848 CE, Mákú (unfinished)</dd></div><div><dt>Handed down</dt><dd>Dictated by the Báb in prison to his secretary, Siyyid Husayn Yazdí, who wrote down the verses as they were spoken, according to the sources summarised by MacEoin.</dd></div><div><dt>Fixed in writing</dt><dd>Planned in 19 &#x27;unities&#x27; of 19 chapters each, it breaks off in the ninth unity. The Báb said it would be completed by &#x27;Him whom God shall make manifest&#x27;. Copied by Bábís in Iran; A.-L.-M. Nicolas published a French translation in 1911–14.</dd></div><div><dt>Oldest surviving copy</dt><dd>Siyyid Husayn Yazdí&#x27;s original manuscript of the Báb&#x27;s dictation, 1847–1848 (ownership history, as reported in MacEoin&#x27;s survey of Bábí sources (1992))</dd></div><div><dt>Early witnesses</dt><dd>MacEoin&#x27;s survey lists about 49 manuscripts of the Persian Bayán; E. G. Browne began collating six from Cambridge, London, St Petersburg and Paris but did not finish.</dd></div></dl><div class="face"><div class="face-c face-m"><span class="face-k">How the tradition sees its text</span><p>Bahá&#x27;ís honour the Persian Bayán as the Báb&#x27;s chief work, whose laws were superseded by the Kitáb-i-Aqdas and whose promises they see fulfilled in Bahá&#x27;u&#x27;lláh. The original dictation manuscript is preserved by the Bahá&#x27;í World Centre as a sacred trust.</p></div><div class="face-c face-x"><span class="face-k">What manuscript scholarship shows</span><p>Scholars accept the date and authorship. The text survives in many 19th-century copies, but they have never been collated in a published critical edition, and the rivalry between Bábí factions makes careful comparison important. The existence of the original dictation copy, if studied, could settle most questions.</p></div></div><h5 class="txt-sub">Documented changes, variants and revisions</h5><ul class="txt-ch"><li>The book was left unfinished at the ninth unity, and Bahá&#x27;ís and Azalís (followers of Subh-i Azal) read its promise of completion in opposite ways (MacEoin 1992).</li><li>After the Bábí community split in the 1860s, both factions copied Bábí texts and each has accused the other of suppression or interpolation in some works; no critical edition of the Bayán exists (MacEoin 1992).</li><li>The Báb&#x27;s own script is almost unpointed, which MacEoin notes makes unambiguous readings of his texts extremely difficult to establish.</li></ul></section><h3 class="sub-h wsub">Through time</h3><ol class="ftl"><li><span class="ftl-y">1817</span><b>Birth of Bahá&#x27;u&#x27;lláh</b><span>Mírzá Husayn-&#x27;Alí Núrí is born in Tehran on 12 November.</span></li><li><span class="ftl-y">1844</span><b>The Báb&#x27;s declaration</b><span>Siyyid &#x27;Alí-Muhammad of Shiraz announces his mission to Mullá Husayn.</span></li><li><span class="ftl-y">1847–1848</span><b>The Persian Bayán</b><span>The imprisoned Báb dictates his chief work at Mákú.</span></li><li><span class="ftl-y">1850</span><b>Execution of the Báb</b><span>The Báb is shot by firing squad in Tabriz on 9 July.</span></li><li><span class="ftl-y">1852</span><b>The Síyáh-Chál</b><span>Bahá&#x27;u&#x27;lláh is imprisoned in the Tehran dungeon; he later describes his first intimation of revelation there.</span></li><li><span class="ftl-y">1853</span><b>Exile to Baghdad</b><span>Bahá&#x27;u&#x27;lláh is banished from Iran with his family.</span></li><li><span class="ftl-y">1861</span><b>Kitáb-i-Íqán</b><span>The Book of Certitude is written in Baghdad.</span></li><li><span class="ftl-y">1863</span><b>Ridván</b><span>Bahá&#x27;u&#x27;lláh declares his mission in the Garden of Ridván before leaving Baghdad for Constantinople and Edirne.</span></li><li><span class="ftl-y">1868</span><b>Acre</b><span>Bahá&#x27;u&#x27;lláh is exiled to the Ottoman prison city of Acre.</span></li><li><span class="ftl-y">c. 1873</span><b>Kitáb-i-Aqdas</b><span>The Most Holy Book is written in Acre.</span></li><li><span class="ftl-y">1892</span><b>Death of Bahá&#x27;u&#x27;lláh</b><span>He dies at Bahjí on 29 May; &#x27;Abdu&#x27;l-Bahá becomes head of the Faith.</span></li><li><span class="ftl-y">1992</span><b>Authorised Aqdas in English</b><span>The Universal House of Justice publishes the full authorised translation.</span></li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">6 min read · 1,243 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Bahá&#x27;í Faith"><button type="button" class="wtoc-i" data-go="bahai-s1">The shortest gap on this site</button><button type="button" class="wtoc-i" data-go="bahai-s2">The Báb: a gate in Shiraz</button><button type="button" class="wtoc-i" data-go="bahai-s3">Bahá&#x27;u&#x27;lláh: prison, exile and a torrent of words</button><button type="button" class="wtoc-i" data-go="bahai-s4">How the words were written</button><button type="button" class="wtoc-i" data-go="bahai-s5">The Most Holy Book, from 1873 to 1992</button><button type="button" class="wtoc-i" data-go="bahai-s6">Where the record is debated</button><button type="button" class="wtoc-i" data-go="bahai-s7">What remains open</button></nav></div><section class="wsec" id="bahai-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The shortest gap on this site</h3><p>Most of the scriptures on this site cross centuries, sometimes millennia, between the moment of composition and the oldest copy we can hold. The Bahá&#x27;í Faith is different. Its founders lived in the age of steamships and consular reports; their words were written down as they spoke them, many originals survive, and the gap between composition and the oldest surviving copy is close to zero. For a project that rates texts by how well their record has been kept, the Bahá&#x27;í writings are a benchmark of what a very short gap looks like, and a reminder that a short gap does not answer every question.</p><p>The Bahá&#x27;í Faith has about eight million followers according to the World Religion Database (2020) and its own governing body, the Universal House of Justice, with communities in almost every country. Its world centre is on Mount Carmel in Haifa and near Acre, in Israel, where the shrines of its founders stand amid terraced gardens inscribed by UNESCO as a World Heritage Site in 2008.</p><aside class="wcall"><b>Faith and history on this page</b><p>Claims about God, revelation and the station of the Báb and Bahá&#x27;u&#x27;lláh are matters of faith and are not rated. Claims about events, dates, exiles and manuscripts are rated on the evidence. The texts are scored only on how well their record survives, never on whether their teaching is true.</p></aside></section><section class="wsec" id="bahai-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The Báb: a gate in Shiraz</h3><p>On the evening of 22 May 1844, in Shiraz, a young merchant named Siyyid &#x27;Alí-Muhammad told a visiting scholar, Mullá Husayn, that he was the Báb, the &#x27;Gate&#x27; to the hidden Twelfth Imam expected in Shi&#x27;i Islam. His claim soon grew larger: he presented himself as the bearer of a new revelation, with new laws and a new holy book. Within a few years his followers, the Bábís, numbered by some estimates in the tens of thousands, and the Persian state and clergy moved against them.</p><p>The Báb spent most of his remaining years in prison, first at Mákú and then at Chihríq in the far northwest of Iran. There he dictated a flood of writings, among them the Persian Bayán, planned in 19 sections of 19 chapters but left unfinished. His secretary, Siyyid Husayn Yazdí, wrote down the verses as he spoke, and, according to Denis MacEoin&#x27;s survey of Bábí sources, that original dictation copy is now kept in the Bahá&#x27;í archives in Haifa. On 9 July 1850 the Báb was executed by firing squad in Tabriz, an event recorded by Persian chroniclers and European diplomats alike. Bábí uprisings and their suppression cost several thousand lives.</p></section><section class="wsec" id="bahai-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Bahá&#x27;u&#x27;lláh: prison, exile and a torrent of words</h3><p>Among the Báb&#x27;s followers was a Tehran nobleman, Mírzá Husayn-&#x27;Alí Núrí, who took the title Bahá&#x27;u&#x27;lláh, &#x27;the Glory of God&#x27;. After Bábís attempted to kill the Shah in 1852, he was thrown into the Síyáh-Chál, an underground dungeon, where, he later wrote, he first became aware of his mission. Released and exiled, he spent the rest of his life as a prisoner of two empires: Baghdad from 1853, Constantinople and Edirne from 1863, and from 1868 the Ottoman prison city of Acre. In 1863, before leaving Baghdad, he declared to companions that he was the one the Báb had foretold.</p><p>In April 1890 the Cambridge scholar Edward Granville Browne was admitted to see him at the mansion of Bahjí, near Acre, and left one of the most quoted descriptions in the study of religion.</p><blockquote class="quote"><p>The face of him on whom I gazed I can never forget, though I cannot describe it.</p><cite>E. G. Browne, A Traveller&#x27;s Narrative (Cambridge University Press, 1891), introduction</cite></blockquote><p>Bahá&#x27;u&#x27;lláh died at Bahjí in 1892. His son &#x27;Abdu&#x27;l-Bahá, then his great-grandson Shoghi Effendi, led the community, and since 1963 it has been governed by the elected Universal House of Justice.</p></section><section class="wsec" id="bahai-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>How the words were written</h3><p>Bahá&#x27;u&#x27;lláh rarely wrote his major works himself. He dictated, often at great speed, to his secretary Mírzá Áqá Ján, who developed a rapid shorthand called &#x27;revelation writing&#x27;. These drafts were then written out in fair copies, which Bahá&#x27;u&#x27;lláh reviewed and approved. Trusted transcribers such as Zaynu&#x27;l-Muqarrabín made further copies known for their accuracy. By one estimate cited in Bahá&#x27;í sources, more than 7,000 of perhaps 15,000 tablets have been collected, and the Bahá&#x27;í World Centre holds the revelation drafts and many transcriptions in the International Bahá&#x27;í Archives in Haifa.</p><p>The record also includes a deliberate loss. Mírzá Áqá Ján reported that in Baghdad Bahá&#x27;u&#x27;lláh ordered a great quantity of verses destroyed and thrown into the river, because he judged that people were not ready for them. Few scriptures include a founder&#x27;s own decision about what not to keep.</p><blockquote class="quote"><p>The earth is but one country, and mankind its citizens.</p><cite>Bahá&#x27;u&#x27;lláh, Gleanings from the Writings of Bahá&#x27;u&#x27;lláh CXVII, trans. Shoghi Effendi (1935)</cite></blockquote><blockquote class="wpull"><p>Here the question is not whether an original survives, but who may study it.</p></blockquote></section><section class="wsec" id="bahai-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The Most Holy Book, from 1873 to 1992</h3><p>The Kitáb-i-Aqdas, written in Arabic in Acre around 1873, contains the laws and institutions of the new faith. Bahá&#x27;u&#x27;lláh answered believers&#x27; questions about it in a supplementary text, and in 1890–91 had it printed in Bombay. A copy in the hand of Zaynu&#x27;l-Muqarrabín, dated January 1887, is in the British Library, which describes his copies as highly regarded for their accuracy. That gives us an independently accessible witness only fourteen years after composition.</p><blockquote class="quote"><p>The first duty prescribed by God for His servants is the recognition of Him Who is the Dayspring of His Revelation and the Fountain of His laws.</p><cite>Bahá&#x27;u&#x27;lláh, The Kitáb-i-Aqdas, paragraph 1 (Bahá&#x27;í World Centre, 1992)</cite></blockquote><p>The English story is longer. Scholars Earl Elder and William Miller published an unauthorised translation in 1961 through the Royal Asiatic Society. The Bahá&#x27;í authorities issued a synopsis in 1973 and the full authorised translation, with notes and the &#x27;Questions and Answers&#x27;, only in 1992. The long delay reflects the care the community gives to authorised translation, and also shows that for most readers the text reached them through a translation more than a century after it was written.</p></section><section class="wsec" id="bahai-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Where the record is debated</h3><p>A short gap does not end all debate. After the Báb&#x27;s death the Bábí community divided between Bahá&#x27;u&#x27;lláh and his half-brother Subh-i Azal, whom many Bábís had recognised as leader. The two factions, Bahá&#x27;ís and Azalís, copied the same early texts and each has accused the other of suppressing or altering some writings. E. G. Browne, who corresponded with both sides, became involved in a bitter controversy over an early Bábí history. Denis MacEoin&#x27;s 1992 survey lists dozens of manuscripts of the Báb&#x27;s works and stresses that critical editions are still lacking.</p><p>There is also the question of access. The originals held in Haifa are, in the tradition&#x27;s view, the best witnesses of all; but they have not been published in facsimile or critical editions, so outside scholars cannot yet test every reading. Bahá&#x27;í scholars, and academics such as Nader Saiedi and Juan Cole, have nevertheless produced detailed studies, and the documented history of revisions, such as Bahá&#x27;u&#x27;lláh correcting Quranic quotations in the Kitáb-i-Íqán, is unusually open about how the texts were shaped.</p><p>One feature of the tradition limits disputes over meaning, if not over wording. Bahá&#x27;u&#x27;lláh named his son &#x27;Abdu&#x27;l-Bahá as the authorised interpreter of his writings, and &#x27;Abdu&#x27;l-Bahá in turn appointed Shoghi Effendi. Their interpretations, and Shoghi Effendi&#x27;s English translations, which set the elevated style most English readers know, are treated as authoritative. Historians note that this chain of appointed interpreters is itself carefully documented in the founders&#x27; wills and letters, one more way in which this young faith recorded its own formation.</p></section><section class="wsec" id="bahai-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What remains open</h3><p>The Bahá&#x27;í record raises a new kind of question for this site. For ancient texts we ask whether any early copy survives. Here the early copies exist, and the open question is when they will be available for full scholarly comparison. Publication of facsimiles or critical editions of the Aqdas, the Íqán and the Bayán would allow scholars to measure the stability of the text directly, and to settle the old factional disputes. Until then, the Bahá&#x27;í writings stand as the best-documented scriptural origins on this site, recorded within living memory and still, in part, waiting to be read by outside eyes.</p></section><details class="srcs"><summary>Sources for this tradition (17)</summary><ol><li>Bahá&#x27;u&#x27;lláh (1992). The Kitáb-i-Aqdas: The Most Holy Book. Haifa: Bahá&#x27;í World Centre.</li><li>Bahá&#x27;u&#x27;lláh (1931). The Kitáb-i-Íqán: The Book of Certitude. Trans. Shoghi Effendi. New York: Bahá&#x27;í Publishing Committee.</li><li>Bahá&#x27;u&#x27;lláh (1935). Gleanings from the Writings of Bahá&#x27;u&#x27;lláh. Trans. Shoghi Effendi. New York: Bahá&#x27;í Publishing Committee.</li><li>MacEoin, Denis (1992). The Sources for Early Bābī Doctrine and History: A Survey. Leiden: Brill.</li><li>Amanat, Abbas (1989). Resurrection and Renewal: The Making of the Babi Movement in Iran, 1844–1850. Ithaca: Cornell University Press.</li><li>Momen, Moojan (ed.) (1981). The Bábí and Bahá&#x27;í Religions, 1844–1944: Some Contemporary Western Accounts. Oxford: George Ronald.</li><li>Browne, Edward Granville (ed. and trans.) (1891). A Traveller&#x27;s Narrative Written to Illustrate the Episode of the Bab. Cambridge: Cambridge University Press.</li><li>Smith, Peter (2008). An Introduction to the Baha&#x27;i Faith. Cambridge: Cambridge University Press.</li><li>Cole, Juan R. I. (1998). Modernity and the Millennium: The Genesis of the Baha&#x27;i Faith in the Nineteenth-Century Middle East. New York: Columbia University Press.</li><li>Saiedi, Nader (2008). Gate of the Heart: Understanding the Writings of the Báb. Waterloo: Wilfrid Laurier University Press.</li><li>Buck, Christopher (1995). Symbol and Secret: Qur&#x27;an Commentary in Bahá&#x27;u&#x27;lláh&#x27;s Kitáb-i Íqán. Los Angeles: Kalimát Press.</li><li>Taherzadeh, Adib (1974–1987). The Revelation of Bahá&#x27;u&#x27;lláh. 4 vols. Oxford: George Ronald.</li><li>Nicolas, A.-L.-M. (1911–1914). Le Béyân persan. 4 vols. Paris: Geuthner.</li><li>Elder, Earl E. and Miller, William McE. (trans.) (1961). Al-Kitáb al-Aqdas or The Most Holy Book. London: Royal Asiatic Society.</li><li>UNESCO World Heritage Centre (2008). &#x27;Bahá&#x27;i Holy Places in Haifa and the Western Galilee&#x27;.</li><li>Johnson, Todd M. and Grim, Brian J. (eds). World Religion Database. Leiden: Brill (2020 estimates).</li><li>British Library. Manuscript of the Kitáb-i-Aqdas in the hand of Zaynu&#x27;l-Muqarrabín, dated January 1887 (as described in British Library notes on its Bahá&#x27;í manuscripts).</li></ol></details><aside class="rc-cite" data-v="faiths" data-id="faith-bahai" data-t="Bahá&#x27;í Faith"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Bahá&#x27;í Faith</i>. <span class="cite-u">https://residualcontinuum.com/#faiths/faith-bahai</span> (updated 25 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside
