ed by his rivals as well as his followers, and that its community took unusual care both to preserve its scriptures and to record honestly where the chain of memory broke. Those admissions do not weaken the tradition as a historical witness. They make it more trustworthy.</p></section><details class="srcs"><summary>Sources for this tradition (14)</summary><ol><li>Office of the Registrar General and Census Commissioner, India (2011). Census of India 2011: Religion data (C-1 tables).</li><li>Dundas P. (2002). The Jains. 2nd ed. Routledge, London.</li><li>Jaini P. S. (1979). The Jaina Path of Purification. University of California Press, Berkeley.</li><li>Jacobi H. (trans.) (1884). Jaina Sutras, Part I: The Akaranga Sutra and the Kalpa Sutra. Sacred Books of the East 22. Clarendon Press, Oxford.</li><li>Jacobi H. (trans.) (1895). Jaina Sutras, Part II: The Uttaradhyayana Sutra and the Sutrakritanga Sutra. Sacred Books of the East 45. Clarendon Press, Oxford.</li><li>Guy J. (2012). Jain Manuscript Painting. Heilbrunn Timeline of Art History, Metropolitan Museum of Art, New York.</li><li>Jayaswal K. P., Banerji R. D. (1929–30). The Hathigumpha inscription of Kharavela. Epigraphia Indica 20: 71–89.</li><li>Salomon R. (1998). Indian Epigraphy: A Guide to the Study of Inscriptions in Sanskrit, Prakrit, and the Other Indo-Aryan Languages. Oxford University Press.</li><li>Bühler G. (1892–1894). New Jaina inscriptions from Mathura; Further Jaina inscriptions from Mathura. Epigraphia Indica 1 and 2.</li><li>Folkert K. W. (1993). Scripture and Community: Collected Essays on the Jains. Scholars Press, Atlanta.</li><li>Jambuvijaya, Muni (ed.) (2000). A Catalogue of Manuscripts in Jaisalmer Jain Bhandaras. Motilal Banarsidass, Delhi.</li><li>Wiley K. L. (2004). Historical Dictionary of Jainism. Scarecrow Press, Lanham.</li><li>Umasvati. That Which Is: Tattvartha Sutra, trans. Nathmal Tatia (1994). HarperCollins, San Francisco.</li><li>Wikipedia. Jain Agamas; Satkhandagama; Hathigumpha inscription; Mahavira (accessed September 2026).</li></ol></details><aside class="rc-cite" data-v="faiths" data-id="faith-jainism" data-t="Jainism"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Jainism</i>. <span class="cite-u">https://residualcontinuum.com/#faiths/faith-jainism</span> (updated 25 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="faith-buddhism-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Buddha Sakyamuni on the Rummindei pillar of Ashoka.jpg" data-cap="Ashoka&#x27;s pillar inscription at Lumbini naming the Buddha Sakyamuni" data-big><figcaption></figcaption></figure><div class="sh-k">Ganges plain, India</div><h2 class="sh-t" id="faith-buddhism-st" tabindex="-1">Buddhism</h2><p class="sh-s">The teaching of a wandering sage of the Ganges plain, carried for centuries in memory, then written on birch bark, palm leaf and even gold.</p><div class="sh-v"><span class="vstamp vstamp--when">5th century BCE</span></div></div><div class="f-facts"><div><span>Began</span><b>Lumbini (birth), Bodh Gaya (awakening), Sarnath and the middle Ganges plain</b><small>5th century BCE (exact dates debated)</small></div><div><span>Followers today</span><b>about 324 million</b><small>Pew Research Center, 2020 estimate (published June 2025)</small></div></div><h3 class="sub-h wsub">In its own words</h3><blockquote class="quote f-own"><p>Life as we ordinarily live it is marked by dukkha, a deep unsatisfactoriness. The Buddha, &#x27;the awakened one&#x27;, saw its cause and its cure and taught them as the Four Noble Truths: there is suffering; it arises from craving; it can cease; and the Noble Eightfold Path of right view, intention, speech, action, livelihood, effort, mindfulness and concentration leads to its cessation. Nothing is permanent and there is no unchanging self to cling to. Beings are reborn according to their karma until they awaken to nirvana, the peace beyond craving. The path is a middle way between indulgence and self-torment. We take refuge in the Buddha, in the Dharma he taught and in the Sangha that lives it.</p><cite>How a follower might put it, in our words</cite></blockquote><h3 class="sub-h wsub">What it teaches and claims</h3><p class="rd-rule">Claims about God, revelation, the soul or miracles are matters of faith and are not rated. Claims about people, places, events and texts are weighed on the evidence.</p><ul class="rds"><li class="rd"><p class="rd-s">Siddhartha Gautama attained awakening under a tree at Bodh Gaya and became the Buddha.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">The awakening itself is a matter of faith and inner experience. The place is historical: Bodh Gaya has been venerated at least since the Maurya period, when a stone seat (the Vajrasana) is thought to have been set up there. <span class="cite">Majjhima Nikaya 26; Gethin 1998</span></p></li><li class="rd"><p class="rd-s">Siddhartha Gautama was a real teacher who lived and taught in the middle Ganges plain.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">Nearly all historians accept this. The early discourses name real places and rulers, Ashoka honoured his birthplace about two centuries later, and rival traditions such as the Jains knew of him. No contemporary inscription or object names him. <span class="cite">Gethin 1998; Lumbini pillar inscription</span></p></li><li class="rd"><p class="rd-s">He was born at Lumbini, in the Shakya lands at the foot of the Himalaya.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">Ashoka&#x27;s pillar at Lumbini, rediscovered in 1896, states that the Buddha Shakyamuni was born here. Excavations under the Maya Devi temple found earlier structures, reported as pre-Mauryan (Coningham et al. 2013). <span class="cite">Lumbini pillar inscription; Coningham et al. 2013</span></p></li><li class="rd"><p class="rd-s">The Buddha lived c. 563–483 BCE, or 624–544 BCE by the Theravada reckoning.</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">Both dates come from later chronicles. Many scholars now prefer a &#x27;short chronology&#x27; placing his death around 400 BCE, roughly 480–400 BCE for his life. The Göttingen symposium edited by Heinz Bechert reached no consensus. <span class="cite">Bechert 1991–1997; Cousins 1996</span></p></li><li class="rd"><p class="rd-s">Beings are reborn according to karma, and nirvana ends the cycle.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">A core teaching, shared in different forms with Hindu and Jain thought and set out in the Buddha&#x27;s first discourse at Sarnath. It concerns what happens beyond death, so it is a matter of faith and is not rated. <span class="cite">Samyutta Nikaya 56.11 (the first discourse)</span></p></li><li class="rd"><p class="rd-s">The teachings were recited together at a First Council in Rajagriha soon after the Buddha&#x27;s death.</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">All the monastic codes of the early schools tell a version of this story, which suggests an old tradition. Many scholars doubt that a single meeting fixed the canon as it now stands. <span class="cite">Cullavagga 11; Gethin 1998</span></p></li><li class="rd"><p class="rd-s">The Pali Canon was first written down in Sri Lanka in the 1st century BCE.</p><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span><p class="rd-n">Reported by the Sri Lankan chronicles (Dipavamsa, Mahavamsa), compiled in the 4th and 5th centuries CE. It fits the wider evidence that Buddhists were writing texts in Gandhara by the 1st century CE, but no manuscript of that age from Sri Lanka survives. <span class="cite">Dipavamsa 20.20–21; Collins 1990</span></p></li><li class="rd"><p class="rd-s">Buddhas appeared before Gautama, and Maitreya will come in the future.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">A matter of faith. The belief itself is old: Ashoka recorded enlarging the stupa of an earlier Buddha, Konakamana, at Nigali Sagar in the 3rd century BCE. <span class="cite">Nigali Sagar pillar inscription</span></p></li></ul><h3 class="sub-h wsub">History, weighed</h3><ul class="rds"><li class="rd"><p class="rd-s">The emperor Ashoka ruled most of South Asia in the 3rd century BCE and promoted the Buddha&#x27;s Dhamma.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">Dozens of rock and pillar edicts in Brahmi, Kharoshthi, Greek and Aramaic, spread from Afghanistan to Karnataka, record his remorse after the Kalinga war, his support for the Sangha and his pilgrimages. They are the oldest securely dated Buddhist evidence, c. 268–232 BCE. <span class="cite">Hultzsch 1925; Falk 2006</span></p></li><li class="rd"><p class="rd-s">In one edict Ashoka recommends named Buddhist texts to monks, nuns and lay followers.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">The Calcutta-Bairat (Bhabru) edict lists seven passages of the Dhamma. Scholars have matched several titles to discourses in the surviving canons, though some identifications are debated. It shows that recognised texts existed in the 3rd century BCE. <span class="cite">Hultzsch 1925; Norman 1983</span></p></li><li class="rd"><p class="rd-s">The Lumbini birthplace was a sacred site before Ashoka&#x27;s visit.</p><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span><p class="rd-n">Under the brick temples at Lumbini, Coningham&#x27;s team found post-holes of a timber structure around an open centre, perhaps once holding a tree, dated by radiocarbon and luminescence to the 6th century BCE. One well-dated excavation is strong evidence, but the dating of the earliest phase and its function await further work. <span class="cite">Coningham et al. 2013</span></p></li><li class="rd"><p class="rd-s">Kapilavastu, the Buddha&#x27;s home town, lay at Tilaurakot in Nepal (or at Piprahwa in India).</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">Both sites claim the name. Tilaurakot is a fortified town near Lumbini; at Piprahwa, excavators in the 1970s reported seals naming Kapilavastu from a monastery. Neither identification is agreed, partly because the dates of the finds are debated. <span class="cite">Coningham and Young 2015</span></p></li><li class="rd"><p class="rd-s">The Piprahwa vase holds relics of the Buddha enshrined by his Shakya kinsmen.</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">The soapstone vase found by W. C. Peppé in 1898 bears a Brahmi inscription usually read as naming relics of the Buddha of the Shakyas. Its date (just after the Buddha&#x27;s death, or Ashokan and later) and exact reading are debated. In 2025 a planned auction of Piprahwa gems was halted after India objected, and the gems returned to India. <span class="cite">Peppé 1898; Falk 2006</span></p></li><li class="rd"><p class="rd-s">Buddhist scriptures were being written down in Gandhara by the 1st century CE.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">Birch-bark scrolls in Gandhari, written in Kharoshthi script, reached the British Library in 1994 and date to the first half of the 1st century CE; the Senior, Bajaur and Schøyen collections add more, some dated by radiocarbon. They are the oldest Buddhist manuscripts known. <span class="cite">Salomon 1999; Allon et al. 2006</span></p></li><li class="rd"><p class="rd-s">Mahayana sutras were already circulating in the 1st century CE.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">A Gandhari manuscript of the Perfection of Wisdom in 8,000 Lines from the Split Collection is radiocarbon dated to 47–147 CE, and Lokakshema translated the same sutra into Chinese around 179 CE. How much earlier the Mahayana began is still debated. <span class="cite">Falk and Karashima 2012</span></p></li></ul><h3 class="sub-h wsub">The texts and what survives of them</h3><p class="rd-rule">The textual record measures what survives and how close it is to the original. It says nothing about whether a text is true or inspired.</p><section class="txt"><h4 class="txt-h">The Pali Canon (Tipitaka)</h4><ol class="jr" aria-label="How The Pali Canon (Tipitaka) reached us"><li class="jr-s"><span>Composed</span><b>c. 5th–1st century BCE (oral; core discourses earliest, Abhidhamma later)</b></li><li class="jr-gap jr-gap--long"><span>about 830 years with no surviving copy</span></li><li class="jr-s"><span>Oldest surviving copy</span><b>8th or 9th century CE</b><small>Vinaya fragment from Nepal (National Archives, Kathmandu)</small></li><li class="jr-s jr-today"><span>Today</span><b>Read in a sister language or form of its source&#x27;s speech</b></li></ol><div class="rec"><div class="rec-r"><span>Closeness to the source</span><span class="rec-b" role="img" aria-label="Closeness to the source: 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><b>2</b></div><div class="rec-r"><span>Source&#x27;s own language</span><span class="rec-b" role="img" aria-label="Source&#x27;s own language: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Gap to oldest copy</span><span class="rec-b" role="img" aria-label="Gap to oldest copy: 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><b>2</b></div><div class="rec-r"><span>Early witnesses</span><span class="rec-b" role="img" aria-label="Early witnesses: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Stability of the text</span><span class="rec-b" role="img" aria-label="Stability of the text: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Documented history</span><span class="rec-b" role="img" aria-label="Documented history: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-tot"><span>Textual record</span><b>17<small>/30</small></b></div></div><p class="rec-why">Gap 2: about 830 years from the writing down to the oldest fragment. Language 3: the Buddha&#x27;s words survive in Pali, a sister dialect of the eastern Prakrit he most likely spoke, not his own speech; the Theravada tradition holds that Pali is his language. Witnesses 3: many regional manuscripts, but few early ones. Stability 4: manuscripts agree closely; differences with other schools are larger. Documented 3: the chronicles name the stages, but they were written centuries later. Source 2: recited by his disciples from the first council onward, but only written down about four centuries after his death.</p><dl class="txt-dl"><div><dt>Language of the text</dt><dd>Pali, a Middle Indo-Aryan literary language</dd></div><div><dt>Composed</dt><dd>c. 5th–1st century BCE (oral; core discourses earliest, Abhidhamma later)</dd></div><div><dt>Handed down</dt><dd>Memorised and chanted by specialist reciters (bhanakas), each group responsible for one collection; repetition, lists and formulas built into the text helped memory.</dd></div><div><dt>Fixed in writing</dt><dd>Written on palm leaf at the Aloka cave (Aluvihare), Sri Lanka, under King Vattagamani Abhaya in the 1st century BCE, according to the Dipavamsa and Mahavamsa. Buddhaghosa&#x27;s 5th-century CE commentaries show a text very close to today&#x27;s. Modern standard editions: Pali Text Society (Roman script, from 1877) and the Sixth Council edition (Burma, 1954–56).</dd></div><div><dt>Oldest surviving copy</dt><dd>Vinaya fragment from Nepal (National Archives, Kathmandu), 8th or 9th century CE (palaeography (von Hinüber 1991))</dd></div><div><dt>Early witnesses</dt><dd>Very few Pali manuscripts older than the 15th century survive; most are from the 18th and 19th centuries, because palm leaf decays in tropical climates. They come from Sri Lanka, Burma, Thailand, Laos and Cambodia, giving several regional lines. Parallel versions of many discourses survive in Gandhari, Sanskrit, Chinese and Tibetan.</dd></div></dl><div class="face"><div class="face-c face-m"><span class="face-k">How the tradition sees its text</span><p>Theravada holds that at the First Council Ananda recited the discourses and Upali the monastic rules, and that the canon was carried to Sri Lanka in Ashoka&#x27;s time and faithfully kept by reciters until it was written down at Aluvihare. Pali is identified with Magadhi, the Buddha&#x27;s own speech, so the canon is his word in his language.</p></div><div class="face-c face-x"><span class="face-k">What manuscript scholarship shows</span><p>Scholars see Pali as a literary Middle Indic language with western features, close to but probably not identical with the Buddha&#x27;s eastern dialect. The core discourses share much with other schools&#x27; parallels and preserve early material. The text has been stable since at least the 5th century CE, but its earlier growth is inferred, and physical witnesses are late.</p></div></div><h5 class="txt-sub">Documented changes, variants and revisions</h5><ul class="txt-ch"><li>The chronicles say the canon was written down in the 1st century BCE because memorised knowledge was at risk during famine and war; no manuscript from that time survives (Collins 1990).</li><li>The canon contains material of different ages: the Abhidhamma and some texts such as the Buddhavamsa and Apadana are widely judged later than the core discourses (Norman 1983).</li><li>Buddhaghosa&#x27;s commentaries of the 5th century CE record some variant readings but show a canon already largely fixed (von Hinüber 1996).</li><li>Comparison with Gandhari and Chinese parallels shows the same teachings in different wording and order, so the Pali is one school&#x27;s version rather than the only early form (Salomon 2018).</li><li>The Sixth Council edition (1954–56) standardised readings from Burmese manuscripts; the Sri Lankan, Thai and Pali Text Society editions differ mostly in spelling and small readings.</li></ul></section><section class="txt"><h4 class="txt-h">Gandhari Buddhist texts (the Gandharan scrolls)</h4><ol class="jr" aria-label="How Gandhari Buddhist texts (the Gandharan scrolls) reached us"><li class="jr-s"><span>Composed</span><b>Early discourses and verses going back to c. 5th–2nd century BCE, in the Gandhari versions copied in the 1st–3rd centuries CE</b></li><li class="jr-gap "><span>about 125 years with no surviving copy</span></li><li class="jr-s"><span>Oldest surviving copy</span><b>first half of the 1st century CE</b><small>British Library Kharoshthi scrolls (Or. 14915), including the Gandhari Rhinoceros Sutra</small></li><li class="jr-s jr-today"><span>Today</span><b>Read in a sister language or form of its source&#x27;s speech</b></li></ol><div class="rec"><div class="rec-r"><span>Closeness to the source</span><span class="rec-b" role="img" aria-label="Closeness to the source: 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><b>2</b></div><div class="rec-r"><span>Source&#x27;s own language</span><span class="rec-b" role="img" aria-label="Source&#x27;s own language: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Gap to oldest copy</span><span class="rec-b" role="img" aria-label="Gap to oldest copy: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Early witnesses</span><span class="rec-b" role="img" aria-label="Early witnesses: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Stability of the text</span><span class="rec-b" role="img" aria-label="Stability of the text: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Documented history</span><span class="rec-b" role="img" aria-label="Documented history: 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><b>2</b></div><div class="rec-tot"><span>Textual record</span><b>17<small>/30</small></b></div></div><p class="rec-why">Gap 4: roughly 125 years or more, depending on when each text was composed. Language 3: Gandhari is a sister dialect of the Buddha&#x27;s speech, not his own, and survives only in these finds. Witnesses 3: hundreds of fragments, but from one region and incomplete. Stability 3: parallels match in content, differ in wording and order. Documented 2: little is known of who compiled or buried them. Source 2: recited teachings written down centuries after the Buddha, by communities far from where he taught.</p><dl class="txt-dl"><div><dt>Language of the text</dt><dd>Gandhari Prakrit in Kharoshthi script (original lost)</dd></div><div><dt>Composed</dt><dd>Early discourses and verses going back to c. 5th–2nd century BCE, in the Gandhari versions copied in the 1st–3rd centuries CE</dd></div><div><dt>Handed down</dt><dd>The Gandharan communities, including the Dharmaguptaka school named on pots holding the British Library scrolls, received the teachings orally and translated them into their own Prakrit.</dd></div><div><dt>Fixed in writing</dt><dd>Written on birch-bark scrolls in the 1st century CE and after. The tradition died out with Buddhism in the north-west, so there is no later standard text; many scrolls were buried in pots, perhaps as ritual disposal of worn copies (Salomon 1999).</dd></div><div><dt>Oldest surviving copy</dt><dd>British Library Kharoshthi scrolls (Or. 14915), including the Gandhari Rhinoceros Sutra, first half of the 1st century CE (palaeography and associated inscriptions (Salomon 1999); related collections dated by radiocarbon (Allon et al. 2006))</dd></div><div><dt>Early witnesses</dt><dd>Several hundred fragments in the British Library, Senior, Bajaur, Schøyen, Split and Library of Congress collections, all from greater Gandhara and mostly fragmentary. A fragment of the Split Collection has been reported with an earlier radiocarbon range, which awaits wider confirmation.</dd></div></dl><div class="face"><div class="face-c face-m"><span class="face-k">How the tradition sees its text</span><p>There is no living Gandhari tradition today. The communities that wrote these scrolls regarded them as the Buddha&#x27;s word in their own tongue. Buddhists of many schools have welcomed the finds as confirmation that the teachings they recite were circulating in writing within a few centuries of the Buddha.</p></div><div class="face-c face-x"><span class="face-k">What manuscript scholarship shows</span><p>These are the oldest Buddhist manuscripts known and the oldest surviving manuscripts from South Asia. They show that early Buddhist texts were close in content across schools but not word-for-word identical, and that Mahayana texts were copied beside older material by the 1st century CE.</p></div></div><h5 class="txt-sub">Documented changes, variants and revisions</h5><ul class="txt-ch"><li>The Gandhari Rhinoceros Sutra contains most of the verses of the Pali Khaggavisana-sutta but in a different order, showing that verse collections were arranged differently in different schools (Salomon 2000).</li><li>Sutras in the Senior collection parallel discourses of the Pali Samyutta Nikaya, with similar content and differing wording, a sign of a shared early core (Salomon 2018).</li><li>Many scrolls were re-copied from older worn manuscripts before burial, so they record a writing tradition already in progress in the early 1st century CE (Salomon 1999).</li></ul></section><section class="txt"><h4 class="txt-h">Mahayana sutras (example: the Perfection of Wisdom in 8,000 Lines)</h4><ol class="jr" aria-label="How Mahayana sutras (example: the Perfection of Wisdom in 8,000 Lines) reached us"><li class="jr-s"><span>Composed</span><b>c. 1st century BCE–1st century CE for the earliest layers, expanded afterwards</b></li><li class="jr-gap jr-gap--none"><span>copies survive from within the period of composition</span></li><li class="jr-s"><span>Oldest surviving copy</span><b>47–147 CE (two-sigma range; about 75 CE)</b><small>Gandhari Prajnaparamita manuscript, Split Collection</small></li><li class="jr-s jr-today"><span>Today</span><b>Read in translation from its source&#x27;s language</b></li></ol><div class="rec"><div class="rec-r"><span>Closeness to the source</span><span class="rec-b" role="img" aria-label="Closeness to the source: 1 of 5"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></span><b>1</b></div><div class="rec-r"><span>Source&#x27;s own language</span><span class="rec-b" role="img" aria-label="Source&#x27;s own language: 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><b>2</b></div><div class="rec-r"><span>Gap to oldest copy</span><span class="rec-b" role="img" aria-label="Gap to oldest copy: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Early witnesses</span><span class="rec-b" role="img" aria-label="Early witnesses: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Stability of the text</span><span class="rec-b" role="img" aria-label="Stability of the text: 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><b>2</b></div><div class="rec-r"><span>Documented history</span><span class="rec-b" role="img" aria-label="Documented history: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-tot"><span>Textual record</span><b>18<small>/30</small></b></div></div><p class="rec-why">Gap 5: the oldest manuscript may be within a century of composition. Language 2: the sutra presents itself as the Buddha&#x27;s words, but it survives in Gandhari and Sanskrit forms composed centuries after him, not in his own speech. Witnesses 4: Gandhari, Chinese, Sanskrit and Tibetan lines. Stability 2: the text grew substantially. Documented 4: dated Chinese translations record the stages unusually well. Source 1: tradition attributes it to the Buddha; historians date its composition to around the 1st century BCE and its authors are unknown.</p><dl class="txt-dl"><div><dt>Language of the text</dt><dd>Gandhari, later Buddhist Sanskrit</dd></div><div><dt>Composed</dt><dd>c. 1st century BCE–1st century CE for the earliest layers, expanded afterwards</dd></div><div><dt>Handed down</dt><dd>Recited and preached, but Mahayana sutras also praise the copying and worship of the written book itself, a sign that writing mattered to them from early on.</dd></div><div><dt>Fixed in writing</dt><dd>Never fixed once for all. Successive Chinese translations (Lokakshema c. 179 CE, then others up to Xuanzang in the 7th century) record a text that grew over time, and longer Perfection of Wisdom sutras were built around it.</dd></div><div><dt>Oldest surviving copy</dt><dd>Gandhari Prajnaparamita manuscript, Split Collection, 47–147 CE (two-sigma range; about 75 CE) (radiocarbon (Falk and Karashima 2012))</dd></div><div><dt>Early witnesses</dt><dd>The Gandhari Split manuscript (1st century CE); a sequence of dated Chinese translations from 179 CE; Sanskrit manuscripts from Nepal and Bengal from about the late 10th century CE; Tibetan translations from the 9th century.</dd></div></dl><div class="face"><div class="face-c face-m"><span class="face-k">How the tradition sees its text</span><p>Mahayana Buddhists regard the sutras as the Buddha&#x27;s teaching, some given to advanced disciples and bodhisattvas and revealed more widely when people were ready; one well-known story says Nagarjuna recovered the Perfection of Wisdom from the realm of the nagas. How and when they appeared is a matter of faith.</p></div><div class="face-c face-x"><span class="face-k">What manuscript scholarship shows</span><p>Most scholars date the first Mahayana sutras to about the 1st century BCE or 1st century CE, several centuries after the Buddha. The Split manuscript shows the Perfection of Wisdom existed in writing by the late 1st century CE, and the Chinese translations let its later growth be traced step by step.</p></div></div><h5 class="txt-sub">Documented changes, variants and revisions</h5><ul class="txt-ch"><li>The Gandhari manuscript is recognisably the same text as the later Sanskrit sutra but shorter and differently worded in places (Falk and Karashima 2012).</li><li>Chinese translations made over five centuries show the sutra gaining passages, and larger Perfection of Wisdom texts were built by layering new material onto it.</li><li>Its language moved from Gandhari into Sanskrit, with vocabulary and spelling adjusted in the process.</li></ul></section><h3 class="sub-h wsub">Through time</h3><ol class="ftl"><li><span class="ftl-y">c. 480–400 BCE</span><b>Life of the Buddha (short chronology)</b><span>Many scholars&#x27; estimate; traditional dates are about a century or more earlier.</span></li><li><span class="ftl-y">c. 268–232 BCE</span><b>Reign of Ashoka</b><span>Edicts across the subcontinent promote the Dhamma; Buddhist missions spread.</span></li><li><span class="ftl-y">c. 250 BCE</span><b>Ashoka at Lumbini</b><span>Twenty years after his consecration Ashoka visits the birthplace and sets up a pillar.</span></li><li><span class="ftl-y">1st century BCE</span><b>Pali Canon written down</b><span>Sri Lankan chronicles report the canon committed to writing at Aluvihare.</span></li><li><span class="ftl-y">1st century CE</span><b>Gandharan scrolls</b><span>The oldest surviving Buddhist manuscripts are copied in Gandhari on birch bark.</span></li><li><span class="ftl-y">c. 75 CE</span><b>Perfection of Wisdom manuscript</b><span>The Split Collection Gandhari manuscript (radiocarbon 47–147 CE).</span></li><li><span class="ftl-y">c. 179 CE</span><b>First Chinese Mahayana translation</b><span>Lokakshema translates the Perfection of Wisdom in 8,000 Lines.</span></li><li><span class="ftl-y">5th century CE</span><b>Buddhaghosa</b><span>Commentaries on the Pali Canon written in Sri Lanka.</span></li><li><span class="ftl-y">8th or 9th century CE</span><b>Oldest Pali manuscript</b><span>A Vinaya fragment later found in Nepal.</span></li><li><span class="ftl-y">1896</span><b>Lumbini pillar rediscovered</b><span>The inscription naming the Buddha&#x27;s birthplace is read again.</span></li><li><span class="ftl-y">1994</span><b>British Library scrolls</b><span>The Gandharan birch-bark scrolls reach the British Library.</span></li><li><span class="ftl-y">2013</span><b>Lumbini excavations published</b><span>Coningham and colleagues report an early timber shrine under the Maya Devi temple.</span></li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">6 min read · 1,274 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Buddhism"><button type="button" class="wtoc-i" data-go="buddhism-s1">A teacher on the road</button><button type="button" class="wtoc-i" data-go="buddhism-s2">The tradition&#x27;s own account</button><button type="button" class="wtoc-i" data-go="buddhism-s3">Stone before parchment: Ashoka</button><button type="button" class="wtoc-i" data-go="buddhism-s4">Birch bark in a clay pot</button><button type="button" class="wtoc-i" data-go="buddhism-s5">The Pali Canon: late leaves, early voices</button><button type="button" class="wtoc-i" data-go="buddhism-s6">What is still open</button></nav></div><section class="wsec" id="buddhism-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A teacher on the road</h3><p>Around the 5th century BCE, in the river towns of the middle Ganges, a man of the Shakya clan gave up his inheritance, wandered as an ascetic and, by his own account, woke up. For some forty-five years afterwards he walked from town to town teaching what he had seen. He wrote nothing. His followers remembered his words, repeated them together, and passed them on for several centuries before anyone put them on bark or leaf. Today Buddhism has about 324 million followers by Pew Research Center&#x27;s 2020 estimate, and its scriptures fill many shelves in Pali, Sanskrit, Chinese and Tibetan.</p><p>That makes Buddhism a fascinating case for anyone who treats religious texts as historical records. It has one of the widest spreads of early witnesses of any Asian tradition, and some of its oldest manuscripts were found only in the last thirty years.</p><blockquote class="wpull"><p>He wrote nothing. His followers remembered his words and passed them on for centuries before anyone wrote them on bark or leaf.</p></blockquote></section><section class="wsec" id="buddhism-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The tradition&#x27;s own account</h3><p>Buddhist tradition tells the story this way. Soon after the Buddha&#x27;s death, five hundred awakened monks met at Rajagriha. Ananda, the Buddha&#x27;s attendant, recited the discourses from memory, each beginning &#x27;Thus have I heard&#x27;, and Upali recited the monastic rules. The community chanted them together and so fixed them. A second council a century later settled disputes over discipline. In the Theravada account the canon then travelled to Sri Lanka with Ashoka&#x27;s son Mahinda, was kept by groups of reciters, and in the 1st century BCE, when famine and war threatened the chain of memory, was written down on palm leaf at the Aloka cave, today&#x27;s Aluvihare.</p><p>Mahayana Buddhists add a further layer: sutras such as the Perfection of Wisdom and the Lotus Sutra, which they understand as the Buddha&#x27;s deeper teaching, preserved and revealed when people were ready to receive them. These are matters of faith, and they are not weighed here. What can be weighed is the physical trail the texts left behind.</p></section><section class="wsec" id="buddhism-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Stone before parchment: Ashoka</h3><p>The oldest firm evidence for Buddhism is not a manuscript but stone. The emperor Ashoka, who ruled most of South Asia from about 268 to 232 BCE, cut his edicts into rocks and pillars from Afghanistan to Karnataka. In them he describes his remorse after conquering Kalinga, his support for the monastic order, and his pilgrimages. One edict, found at Bairat, recommends seven named passages of the Dhamma to monks, nuns and lay people, so recognised texts already existed. Another pillar records that he enlarged the stupa of an earlier Buddha, Konakamana. And at Lumbini, a pillar rediscovered in 1896 gives what reads like a pilgrim&#x27;s certificate.</p><blockquote class="quote"><p>When king Devanampriya Priyadarsin had been anointed twenty years, he came himself and worshipped (this spot) because the Buddha Sakyamuni was born here. (He) both caused to be made a stone bearing a horse (?) and caused a stone pillar to be set up, (in order to show) that the Blessed one was born here.</p><cite>Lumbini (Rummindei) pillar inscription of Ashoka, c. 250 BCE, trans. E. Hultzsch, Inscriptions of Asoka (Corpus Inscriptionum Indicarum I, 1925)</cite></blockquote><p>In 2013 a team led by Robin Coningham reported excavations beneath the Maya Devi temple at Lumbini. Under the Mauryan brick shrine they found post-holes of an earlier timber structure around an open centre, perhaps once holding a tree, and dated it by radiocarbon and optically stimulated luminescence to the 6th century BCE. If the dating holds, the spot was sacred before Ashoka and perhaps within living memory of the Buddha. It is one well-published excavation rather than a settled consensus, but it is a striking fit between tradition and trowel.</p></section><section class="wsec" id="buddhism-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Birch bark in a clay pot</h3><p>In 1994 the British Library acquired a clay pot and a bundle of fragile birch-bark scrolls from the region of ancient Gandhara, in today&#x27;s Pakistan and Afghanistan. Richard Salomon and colleagues identified them as Buddhist texts in the Gandhari language, written in Kharoshthi script in the first half of the 1st century CE. They were, and remain, among the oldest Buddhist manuscripts known, and among the oldest manuscripts from South Asia of any kind. More followed: the Senior collection, with sutras paralleling the Pali Samyutta Nikaya; the Bajaur collection, found in 1999; the Schøyen fragments; and the Split Collection, whose Perfection of Wisdom manuscript is radiocarbon dated to 47–147 CE.</p><p>What do they show? That by the 1st century CE Buddhists in the north-west were writing their scriptures down, some two to four centuries after the Buddha by most reckonings. That these texts closely match the teachings preserved in Pali and Chinese, but not word for word: the Gandhari Rhinoceros Sutra has most of the verses of its Pali twin in a different order. And that Mahayana sutras were being copied alongside older material earlier than many scholars once assumed.</p><aside class="wcall"><b>How do we know?</b><p>Two methods date these finds. Palaeography, the study of how letter shapes changed over time, places the British Library scrolls in the early 1st century CE, supported by inscriptions on the pots. Radiocarbon dating of the bark itself, published for fragments in the Schøyen, Senior and Split collections, gives independent ranges in the 1st to 3rd centuries CE. The two methods broadly agree.</p></aside></section><section class="wsec" id="buddhism-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The Pali Canon: late leaves, early voices</h3><p>The Pali Canon is the only early Buddhist canon that survives complete in an Indian language. Its physical record is late: the oldest known Pali manuscript is a fragment of monastic rules from Nepal, dated by its script to the 8th or 9th century CE, and most manuscripts from Sri Lanka, Burma, Thailand, Laos and Cambodia were copied in the 18th and 19th centuries, because palm leaf rarely lasts longer in the tropics. Yet the commentaries of Buddhaghosa, written in the 5th century CE, quote and explain a canon almost identical to the one printed today, which suggests remarkable stability since then.</p><p>Before that point the record is reconstructed by comparison. Where the Pali discourses have parallels in the Chinese Agamas, the Gandhari scrolls and Sanskrit fragments from Central Asia, the shared core is likely old. Scholars generally see the Abhidhamma and some verse collections as later additions, and Pali itself as a literary language slightly different from the eastern dialect the Buddha probably spoke. The tradition&#x27;s identification of Pali with the Buddha&#x27;s own speech is therefore one point where it and most scholars differ.</p><p>The comparison is possible because the Buddha&#x27;s words travelled in many directions at once. Translators in China began rendering Indian Buddhist texts in the 2nd century CE, and by the early 5th century they had translated whole collections of discourses and monastic codes from Indian originals now lost, belonging to schools such as the Sarvastivada and Dharmaguptaka. When a discourse appears in Pali, in a Chinese Agama and in a Gandhari scroll, with the same teaching in slightly different words, historians can be fairly confident it goes back to a period before those schools separated. When a passage appears in only one of them, it may be a later addition, or simply a survival the others lost. This method cannot recover the Buddha&#x27;s exact words, but it can show which teachings were shared very early by communities that did not copy from one another.</p></section><section class="wsec" id="buddhism-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What is still open</h3><p>The Buddha&#x27;s dates remain uncertain. Theravada reckoning puts his death in 544 BCE, older Western handbooks in 483 BCE, and many specialists now prefer a date around 400 BCE; a major Göttingen symposium in the 1990s did not settle the question. The site of Kapilavastu, his home town, is claimed by both Tilaurakot in Nepal and Piprahwa in India. The Piprahwa relic vase, found in 1898 with an inscription that many read as naming relics of the Buddha, is still debated in its date and reading; in 2025 a planned auction of gems from that find was halted after the Indian government objected, and they returned to India.</p><ul class="wlist"><li>A securely dated inscription or manuscript from before Ashoka would transform the debate on the Buddha&#x27;s dates.</li><li>Further excavation at Lumbini, Tilaurakot and Piprahwa could test the early shrine and the location of Kapilavastu.</li><li>Publication of all Gandharan fragments, and more radiocarbon dates, would show how early and how widely the texts were written.</li></ul><p>The broad picture is nonetheless clear and, for a tradition that began in memory, strong. Its founder is anchored in place by an emperor&#x27;s inscription within about two centuries; its scriptures appear in writing within four centuries at most; and its many versions allow scholars to see both what was faithfully kept and what grew.</p></section><details class="srcs"><summary>Sources for this tradition (19)</summary><ol><li>Pew Research Center (2025). How the Global Religious Landscape Changed From 2010 to 2020. 9 June 2025.</li><li>Coningham R. A. E., Acharya K. P., Strickland K. M., Davis C. E., Manuel M. J., Simpson I. A., Sanderson D. C. W. et al. (2013). The earliest Buddhist shrine: excavating the birthplace of the Buddha, Lumbini (Nepal). Antiquity 87(338): 1104–1123. <a href="https://doi.org/10.1017/S0003598X00049899" target="_blank" rel="noopener">doi:10.1017/S0003598X00049899</a></li><li>Hultzsch E. (1925). Inscriptions of Asoka. Corpus Inscriptionum Indicarum I. Clarendon Press, Oxford.</li><li>Falk H. (2006). Asokan Sites and Artefacts: A Source-book with Bibliography. Philipp von Zabern, Mainz.</li><li>Bechert H. (ed.) (1991–1997). The Dating of the Historical Buddha / Die Datierung des historischen Buddha. 3 vols. Vandenhoeck and Ruprecht, Göttingen.</li><li>Cousins L. S. (1996). The dating of the historical Buddha: a review article. Journal of the Royal Asiatic Society, 3rd series, 6(1): 57–63. <a href="https://doi.org/10.1017/S1356186300014760" target="_blank" rel="noopener">doi:10.1017/S1356186300014760</a></li><li>Salomon R. (1999). Ancient Buddhist Scrolls from Gandhara: The British Library Kharosthi Fragments. University of Washington Press and British Library.</li><li>Salomon R. (2000). A Gandhari Version of the Rhinoceros Sutra: British Library Kharosthi Fragment 5B. Gandharan Buddhist Texts 1. University of Washington Press.</li><li>Salomon R. (2018). The Buddhist Literature of Ancient Gandhara: An Introduction with Selected Translations. Wisdom Publications.</li><li>Allon M., Salomon R., Jacobsen G., Zoppi U. (2006). Radiocarbon dating of Kharosthi fragments from the Schøyen and Senior manuscript collections. In J. Braarvig (ed.), Buddhist Manuscripts III. Hermes Publishing, Oslo: 279–291.</li><li>Falk H., Karashima S. (2012). A first-century Prajnaparamita manuscript from Gandhara: parivarta 1 (Texts from the Split Collection 1). Annual Report of the International Research Institute for Advanced Buddhology at Soka University 15: 19–61.</li><li>von Hinüber O. (1991). The Oldest Pali Manuscript: Four Folios of the Vinaya-Pitaka from the National Archives, Kathmandu. Akademie der Wissenschaften und der Literatur, Mainz.</li><li>von Hinüber O. (1996). A Handbook of Pali Literature. Walter de Gruyter, Berlin.</li><li>Norman K. R. (1983). Pali Literature. A History of Indian Literature VII.2. Otto Harrassowitz, Wiesbaden.</li><li>Collins S. (1990). On the very idea of the Pali canon. Journal of the Pali Text Society 15: 89–126.</li><li>Gethin R. (1998). The Foundations of Buddhism. Oxford University Press.</li><li>Coningham R., Young R. (2015). The Archaeology of South Asia: From the Indus to Asoka, c. 6500 BCE–200 CE. Cambridge University Press.</li><li>Peppé W. C. (1898). The Piprahwa stupa, containing relics of Buddha. Journal of the Royal Asiatic Society (July 1898).</li><li>Wikipedia. Gandharan Buddhist texts; Pali Canon; Lumbini pillar inscription (accessed September 2026).</li></ol></details><aside class="rc-cite" data-v="faiths" data-id="faith-buddhism" data-t="Buddhism"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Buddhism</i>. <span class="cite-u">https://residualcontinuum.com/#faiths/faith-buddhism</span> (updated 25 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="faith-confucianism-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="20230612 Dacheng Dian, Qufu Kongmiao.jpg" data-cap="The Hall of Great Achievement in the Temple of Confucius, Qufu" data-big><figcaption></figcaption></figure><div class="sh-k">China</div><h2 class="sh-t" id="faith-confucianism-st" tabindex="-1">Confucianism</h2><p class="sh-s">A teacher who called himself a transmitter of the ancients, and a tradition whose oldest books keep turning up, rewritten and surprising, in sealed tombs.</p><div class="sh-v"><span class="vstamp vstamp--when">6th–5th century BCE</span></div></div><div class="f-facts"><div><span>Began</span><b>State of Lu, around Qufu, Shandong, China</b><small>c. 551–479 BCE (the life of Confucius)</small></div><div><span>Followers today</span><b>not counted as a separate religion; its ethics and ancestral rites are shared widely across East Asia</b><small>Pew Research Center, The Global Religious Landscape (2012, 2010 data), which does not list Confucianism separately</small></div></div><h3 class="sub-h wsub">In its own words</h3><blockquote class="quote f-own"><p>Heaven gave human beings a nature capable of goodness, and our task is to cultivate it. The sage kings of old ruled by virtue and ritual, and Confucius, our first teacher, devoted his life to handing their way on. Learning never ends. We become fully human through ren, humaneness toward others, expressed in li, the rites and courtesies that order family and society. Honour your parents and ancestors, be loyal and sincere, and do not do to others what you would not want done to yourself. A ruler who is upright will be followed like the wind bending the grass. Harmony in the family is the root of harmony in the world.</p><cite>How a follower might put it, in our words</cite></blockquote><h3 class="sub-h wsub">What it teaches and claims</h3><p class="rd-rule">Claims about God, revelation, the soul or miracles are matters of faith and are not rated. Claims about people, places, events and texts are weighed on the evidence.</p><ul class="rds"><li class="rd"><p class="rd-s">Heaven (Tian) entrusted Confucius with a moral mission.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">In the Analects Confucius says that Heaven produced the virtue in him (7.23; 7.22 in Legge&#x27;s numbering) and that Heaven would not let the culture of Zhou perish (9.5). How Heaven acts is a religious claim and is not rated. <span class="cite">Analects 7.23, 9.5</span></p></li><li class="rd"><p class="rd-s">Human beings become good through learning, ritual and humaneness (ren).</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">An ethical and spiritual teaching about human nature, developed later in different directions by Mencius and Xunzi. It concerns values, not a physical event, so it is not rated here. <span class="cite">Analects 12.1; Mencius 2A.6</span></p></li><li class="rd"><p class="rd-s">Ancestors are to be served in death as in life through sacrifice and ritual.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">A religious and moral duty central to Chinese family life for over two thousand years. Whether the dead receive the offerings is a matter of faith, and not rated. <span class="cite">Analects 2.5, 3.12</span></p></li><li class="rd"><p class="rd-s">Confucius lived c. 551–479 BCE in the state of Lu and taught a circle of disciples.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">The Zuozhuan, the Analects, Mencius and Sima Qian&#x27;s Shiji all describe him. None is contemporary: the earliest date from about a century after his death. No object from his lifetime names him, but no serious scholar doubts he existed. <span class="cite">Shiji 47; Nylan 2001</span></p></li><li class="rd"><p class="rd-s">Confucius edited the Classics and wrote the Spring and Autumn Annals.</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">Mencius (4th century BCE) first says Confucius made the Annals. Most modern scholars think the Annals is a Lu court chronicle and that the Classics took shape over centuries, with Confucius at most a teacher of them. <span class="cite">Mencius 3B.9; Nylan 2001</span></p></li><li class="rd"><p class="rd-s">The Analects preserves Confucius&#x27;s own words, as remembered by his disciples.</p><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span><p class="rd-n">Manuscripts of about 300 BCE show that collections of his sayings circulated early, but the book as we have it was compiled over two centuries or more and fixed in the Han. Some sayings are probably early, others later additions. <span class="cite">Poli and Li 2024; Makeham 1996</span></p></li><li class="rd"><p class="rd-s">The Zhou founders, King Wen, King Wu and the Duke of Zhou, established the ritual order Confucius sought to restore.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">Western Zhou bronze inscriptions name Kings Wen and Wu, and the Li gui vessel records Wu&#x27;s conquest of Shang. The idealised &#x27;golden age&#x27; portrait is Confucian; the kings themselves are historical. <span class="cite">Li gui inscription; Shaughnessy 2006</span></p></li><li class="rd"><p class="rd-s">The sage kings Yao and Shun ruled China in an age of perfect virtue.</p><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span><p class="rd-n">Yao and Shun appear in later Zhou texts, not in any Shang or early Zhou inscription. Some archaeologists link the large late Neolithic town of Taosi to Yao&#x27;s traditions, but no writing confirms it. <span class="cite">Book of Documents, Yao dian; Nylan 2001</span></p></li></ul><h3 class="sub-h wsub">History, weighed</h3><ul class="rds"><li class="rd"><p class="rd-s">Confucius was born in 551 BCE (or 552) and died in 479 BCE.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">Sima Qian&#x27;s Shiji (c. 94 BCE) gives 551; the Gongyang and Guliang commentaries give 552. The death year, 479, is recorded in the Zuozhuan. These are traditional chronologies written centuries later, but they are consistent and fit the political history of Lu. <span class="cite">Shiji 47; Zuozhuan, Duke Ai 16</span></p></li><li class="rd"><p class="rd-s">Collections of Confucius&#x27;s sayings were circulating by about 300 BCE.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">The Anhui University &#x27;Zhongni said&#x27; manuscript (25 sayings, published 2022) and the Wangjiazui &#x27;Kongzi said&#x27; manuscript, both of about 300 BCE, contain Analects-like material. Only some of their sayings match the received Analects, which suggests many parallel collections. <span class="cite">Poli and Li 2024, doi 10.1017/eac.2024.9</span></p></li><li class="rd"><p class="rd-s">The First Emperor burned the Confucian classics in 213 BCE.</p><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span><p class="rd-n">Sima Qian reports the order a century later, with exemptions for medicine, divination and agriculture and copies kept in the imperial library. That library burned when Xianyang fell in 206 BCE. Michael Nylan and Martin Kern argue the story is exaggerated; the losses were real but their cause is debated. <span class="cite">Shiji 6; Kern 2010; Nylan 2001</span></p></li><li class="rd"><p class="rd-s">Under Emperor Wu of Han (r. 141–87 BCE) the Five Classics became the basis of state learning.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">The Hanshu records erudites for the Five Classics and the founding of the Imperial Academy (124 BCE). Historians now stress that this was a gradual process and that &#x27;Confucian victory&#x27; was less complete than later tradition claimed. <span class="cite">Hanshu 6, 88; Nylan 2001</span></p></li><li class="rd"><p class="rd-s">Official texts of the Classics, including the Analects, were carved in stone at Luoyang in 175–183 CE.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">The Xiping Stone Classics, overseen by Cai Yong, covered seven works on 46 stelae. They were mostly destroyed in the wars after the Han, but fragments survive and match the received texts closely. <span class="cite">Hou Hanshu; Kyoto University rubbings database</span></p></li><li class="rd"><p class="rd-s">The &#x27;Old Text&#x27; chapters of the Book of Documents are later reconstructions, not the lost originals.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">Mei Ze presented a 58-chapter Documents in 317 CE. Yan Ruoju (1636–1704) argued that the extra chapters were 3rd–4th century compositions, convincing most scholars. The Tsinghua manuscripts (c. 305 BCE) contain a &#x27;Yin gao&#x27; that does not match Mei Ze&#x27;s chapter of that name. <span class="cite">Elman 1984; Tsinghua slips vol. 1 (2010)</span></p></li><li class="rd"><p class="rd-s">Confucius was honoured with state sacrifices at Qufu from early Han times.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">The Shiji and Hanshu record that the founding Han emperor sacrificed at Confucius&#x27;s tomb in 195 BCE. The Qufu temple, cemetery and Kong family mansion, rebuilt many times, became a UNESCO World Heritage Site in 1994. <span class="cite">Shiji 47; UNESCO 1994</span></p></li><li class="rd"><p class="rd-s">The imperial civil examinations tested candidates on Confucian classics until 1905.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">From 1313 the Yuan dynasty made Zhu Xi&#x27;s commentaries on the Four Books the examination standard, continued by the Ming and Qing. The Qing court abolished the examinations in 1905. Archival records, exam papers and memoirs document the system in detail. <span class="cite">Elman 2000</span></p></li><li class="rd"><p class="rd-s">The Kong family descends in an unbroken male line from Confucius.</p><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span><p class="rd-n">The genealogy is one of the longest continuously kept in the world, and was revised in 2009. But over 2,500 years, adoptions, gaps and recorded disputes over the main line occurred. The family&#x27;s continuity is real; the unbroken biological line cannot be checked. <span class="cite">Kong family genealogy (2009 revision); Nylan and Wilson 2010</span></p></li></ul><h3 class="sub-h wsub">The texts and what survives of them</h3><p class="rd-rule">The textual record measures what survives and how close it is to the original. It says nothing about whether a text is true or inspired.</p><section class="txt"><h4 class="txt-h">The Analects (Lunyu)</h4><ol class="jr" aria-label="How The Analects (Lunyu) reached us"><li class="jr-s"><span>Composed</span><b>c. 479–250 BCE for most material; final form fixed in the Han dynasty</b></li><li class="jr-gap "><span>about 191 years with no surviving copy</span></li><li class="jr-s"><span>Oldest surviving copy</span><b>buried c. 59 BCE</b><small>Haihunhou Analects bamboo slips (possibly the lost Qi version), tomb of Liu He, Marquis of Haihun</small></li><li class="jr-s jr-today"><span>Today</span><b>Read in the language of its source</b></li></ol><div class="rec"><div class="rec-r"><span>Closeness to the source</span><span class="rec-b" role="img" aria-label="Closeness to the source: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Source&#x27;s own language</span><span class="rec-b" role="img" aria-label="Source&#x27;s own language: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Gap to oldest copy</span><span class="rec-b" role="img" aria-label="Gap to oldest copy: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Early witnesses</span><span class="rec-b" role="img" aria-label="Early witnesses: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Stability of the text</span><span class="rec-b" role="img" aria-label="Stability of the text: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Documented history</span><span class="rec-b" role="img" aria-label="Documented history: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-tot"><span>Textual record</span><b>23<small>/30</small></b></div></div><p class="rec-why">Gap 4: about 190 years from the end of the main composition period to the Haihunhou copy, less if the Han final form is counted. Language 5: Confucius&#x27;s sayings survive in the Classical Chinese in which his followers recorded them, the written form of his own language. Witnesses 4: several Han copies from different regions (including Korea), plus stone and Tang copies. Stability 4: many character variants but few changes of meaning. Documented 3: the Han editing is well recorded; the earlier stages are not. Source 3: Confucius wrote nothing; his sayings were recorded by disciples and their students and compiled over two or more generations.</p><dl class="txt-dl"><div><dt>Language of the text</dt><dd>Classical Chinese</dd></div><div><dt>Composed</dt><dd>c. 479–250 BCE for most material; final form fixed in the Han dynasty</dd></div><div><dt>Handed down</dt><dd>Sayings remembered and repeated by disciples and their students after Confucius&#x27;s death, then written on bamboo in several different collections.</dd></div><div><dt>Fixed in writing</dt><dd>Three Han versions existed: Lu (20 books), Qi (22 books) and an &#x27;Old Text&#x27; found in a wall of Confucius&#x27;s house (21 books). Zhang Yu (died 5 BCE) merged Lu and Qi into the text that became standard; Zheng Xuan (127–200 CE) edited it again with commentary.</dd></div><div><dt>Oldest surviving copy</dt><dd>Haihunhou Analects bamboo slips (possibly the lost Qi version), tomb of Liu He, Marquis of Haihun, buried c. 59 BCE (tomb context (death of Liu He, 59 BCE))</dd></div><div><dt>Oldest complete copy</dt><dd>Dingzhou Analects (620 slips, about half the received text), tomb of Liu Xiu, King of Zhongshan, buried c. 55 BCE</dd></div><div><dt>Early witnesses</dt><dd>Three Han bamboo copies (Haihunhou, Dingzhou, Pyongyang, all mid-1st century BCE), fragments of the Xiping stone text (175–183 CE), Tang-period copies from Dunhuang and Turfan with Zheng Xuan&#x27;s commentary, and the Tang Kaicheng stone classics (837 CE).</dd></div></dl><div class="face"><div class="face-c face-m"><span class="face-k">How the tradition sees its text</span><p>Traditional scholarship held that the Analects was compiled by Confucius&#x27;s disciples and their students soon after his death, and that it records his words faithfully. For two thousand years it was memorised by schoolchildren and examination candidates, and its wording was treated as settled from the Han onward.</p></div><div class="face-c face-x"><span class="face-k">What manuscript scholarship shows</span><p>Modern scholars see a layered book assembled over two centuries or more from many sayings collections, with the final form fixed only in the Han. Newly excavated manuscripts support early circulation of sayings but show that the selection and order varied. Since the Han, the text has been very stable.</p></div></div><h5 class="txt-sub">Documented changes, variants and revisions</h5><ul class="txt-ch"><li>Zhang Yu merged the Lu and Qi versions in the late 1st century BCE, dropping the two extra Qi books; his composite became the received text (Hanshu, Yiwenzhi).</li><li>The Dingzhou copy, damaged by fire soon after burial, differs from the received text in hundreds of characters, mostly graphic variants, and sometimes in passage division (van Els 2009).</li><li>Warring States sayings collections of c. 300 BCE share only some sayings with the received Analects, showing that the book was selected from a wider pool (Poli and Li 2024).</li></ul></section><section class="txt"><h4 class="txt-h">The Book of Documents (Shangshu)</h4><ol class="jr" aria-label="How The Book of Documents (Shangshu) reached us"><li class="jr-s"><span>Composed</span><b>late 11th century BCE (earliest chapters) to c. 300 BCE</b></li><li class="jr-gap jr-gap--none"><span>copies survive from within the period of composition</span></li><li class="jr-s"><span>Oldest surviving copy</span><b>c. 305 BCE (±30 years)</b><small>Tsinghua University bamboo manuscripts, including &#x27;Jinteng&#x27; and a &#x27;Yin gao&#x27;</small></li><li class="jr-s jr-today"><span>Today</span><b>Read in the language of its source</b></li></ol><div class="rec"><div class="rec-r"><span>Closeness to the source</span><span class="rec-b" role="img" aria-label="Closeness to the source: 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><b>2</b></div><div class="rec-r"><span>Source&#x27;s own language</span><span class="rec-b" role="img" aria-label="Source&#x27;s own language: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Gap to oldest copy</span><span class="rec-b" role="img" aria-label="Gap to oldest copy: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Early witnesses</span><span class="rec-b" role="img" aria-label="Early witnesses: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Stability of the text</span><span class="rec-b" role="img" aria-label="Stability of the text: 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><b>2</b></div><div class="rec-r"><span>Documented history</span><span class="rec-b" role="img" aria-label="Documented history: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-tot"><span>Textual record</span><b>21<small>/30</small></b></div></div><p class="rec-why">Gap 5 under the site&#x27;s rule: the Tsinghua copy falls within the composition period, though no Western Zhou copy of the earliest chapters survives. Language 5: the original Chinese survives. Witnesses 3: a handful of early manuscripts covering only some chapters. Stability 2: whole chapters were replaced and early versions differ. Documented 4: the forgery and editions are thoroughly studied. Some scholars question the Tsinghua slips because they were looted. Source 2: speeches attributed to ancient kings and ministers, many composed or reworked centuries later, and some chapters replaced by a later forgery.</p><dl class="txt-dl"><div><dt>Language of the text</dt><dd>Old and Classical Chinese</dd></div><div><dt>Composed</dt><dd>late 11th century BCE (earliest chapters) to c. 300 BCE</dd></div><div><dt>Handed down</dt><dd>Speeches and royal pronouncements, some possibly from Western Zhou archives, others composed later in their style; transmitted in writing and by teachers.</dd></div><div><dt>Fixed in writing</dt><dd>After the Qin, Fu Sheng recovered 29 chapters (the &#x27;New Text&#x27;). A longer &#x27;Old Text&#x27; attributed to Kong Anguo was lost. In 317 CE Mei Ze presented a 58-chapter version that became standard until Yan Ruoju showed its extra chapters to be later compositions.</dd></div><div><dt>Oldest surviving copy</dt><dd>Tsinghua University bamboo manuscripts, including &#x27;Jinteng&#x27; and a &#x27;Yin gao&#x27;, c. 305 BCE (±30 years) (radiocarbon (single date) and script; findspot unknown, acquired 2008)</dd></div><div><dt>Early witnesses</dt><dd>Warring States manuscripts (Tsinghua, and quotations in the Guodian &#x27;Ziyi&#x27;, c. 300 BCE) preserve a few chapters or passages; the Xiping stone classics (175–183 CE) survive in fragments; complete texts survive only from Tang times onward.</dd></div></dl><div class="face"><div class="face-c face-m"><span class="face-k">How the tradition sees its text</span><p>The Documents were long revered as records of the sage kings and early Zhou rulers, edited by Confucius himself into a hundred chapters. For centuries the whole 58-chapter text, including the Old Text chapters, was treated as authentic and memorised for the examinations.</p></div><div class="face-c face-x"><span class="face-k">What manuscript scholarship shows</span><p>Scholars accept that some New Text chapters preserve genuine early Zhou speeches, among the oldest Chinese prose. Others were composed in the Warring States period. The Old Text chapters are widely held to be later compositions, a conclusion that newly found manuscripts have reinforced.</p></div></div><h5 class="txt-sub">Documented changes, variants and revisions</h5><ul class="txt-ch"><li>Mei Ze&#x27;s 317 CE edition added about 25 &#x27;Old Text&#x27; chapters that Yan Ruoju (17th century) and most later scholars regard as 3rd–4th century CE compositions (Elman 1984).</li><li>The Tsinghua &#x27;Jinteng&#x27; differs in wording and details from the received chapter of the same name, showing that Warring States versions varied (Shaughnessy 2006; Tsinghua vol. 1).</li><li>Tang scholars in the 8th century replaced older character forms with standard script, an official modernisation of the text&#x27;s spelling.</li></ul></section><h3 class="sub-h wsub">Through time</h3><ol class="ftl"><li><span class="ftl-y">c. 1046 BCE</span><b>Zhou conquest</b><span>King Wu defeats the Shang, an event recorded on the bronze Li gui. Confucius later idealises the early Zhou.</span></li><li><span class="ftl-y">551 BCE</span><b>Birth of Confucius</b><span>Kong Qiu is born in the state of Lu, by Sima Qian&#x27;s date (552 in other sources).</span></li><li><span class="ftl-y">479 BCE</span><b>Death of Confucius</b><span>He dies in Lu; tradition says his disciples mourned at his grave for three years.</span></li><li><span class="ftl-y">c. 300 BCE</span><b>Sayings on bamboo</b><span>Collections such as the &#x27;Zhongni said&#x27; manuscript are buried in southern tombs.</span></li><li><span class="ftl-y">213 BCE</span><b>The book burning</b><span>Sima Qian reports the Qin order to burn private copies of the Odes and Documents.</span></li><li><span class="ftl-y">124 BCE</span><b>Imperial Academy</b><span>Emperor Wu of Han founds an academy teaching the Five Classics.</span></li><li><span class="ftl-y">c. 59–55 BCE</span><b>Analects in the tombs</b><span>Copies are buried with Liu He at Haihun and Liu Xiu at Dingzhou.</span></li><li><span class="ftl-y">175–183 CE</span><b>Classics in stone</b><span>The Xiping Stone Classics are set up at the imperial academy in Luoyang.</span></li><li><span class="ftl-y">317 CE</span><b>A new Documents</b><span>Mei Ze presents a 58-chapter Book of Documents to the Eastern Jin court.</span></li><li><span class="ftl-y">1313 CE</span><b>The Four Books</b><span>Zhu Xi&#x27;s commentaries on the Four Books become the examination standard.</span></li><li><span class="ftl-y">1905 CE</span><b>Exams abolished</b><span>The Qing court ends the civil examinations.</span></li><li><span class="ftl-y">1973–2022 CE</span><b>The tombs speak</b><span>Dingzhou (1973), Guodian (1993), Tsinghua (2008), Haihunhou (2011) and Anhui University (published 2022) manuscripts reshape the history of the texts.</span></li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">6 min read · 1,260 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Confucianism"><button type="button" class="wtoc-i" data-go="confucianism-s1">A transmitter, not a maker</button><button type="button" class="wtoc-i" data-go="confucianism-s2">The man behind the sayings</button><button type="button" class="wtoc-i" data-go="confucianism-s3">How the Analects was made</button><button type="button" class="wtoc-i" data-go="confucianism-s4">Bamboo in the tombs</button><button type="button" class="wtoc-i" data-go="confucianism-s5">Did the First Emperor burn the classics?</button><button type="button" class="wtoc-i" data-go="confucianism-s6">A forgery that lasted thirteen centuries</button><button type="button" class="wtoc-i" data-go="confucianism-s7">What remains open</button></nav></div><section class="wsec" id="confucianism-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A transmitter, not a maker</h3><p>Confucius did not claim to found anything. He said he was passing on what the ancients had already taught, and for two and a half thousand years his followers took him at his word. The tradition he started is sometimes called a philosophy, sometimes a religion; it has temples, sacrifices, a reverence for Heaven and a cult of ancestors, but no creed to sign and no church to join. Pew Research Center does not count Confucians as a separate religious group, because Confucian ethics and ancestral rites are woven into the lives of hundreds of millions of people who may also call themselves Buddhist, Daoist, Christian or nothing at all.</p><blockquote class="quote"><p>The Master said, &#x27;A transmitter and not a maker, believing in and loving the ancients, I venture to compare myself with our old P&#x27;ang.&#x27;</p><cite>Analects 7.1, trans. James Legge, The Chinese Classics, vol. 1 (1861)</cite></blockquote><p>That self-description turns out to be a good guide to the texts. The Confucian classics are layered works, gathered, edited and re-edited over centuries. What makes this tradition exciting for historians is that in the last fifty years its oldest copies have been coming out of the ground, in sealed tombs, on bamboo and silk, and they do not always say what the printed books say.</p><aside class="wcall"><b>Faith and history on this page</b><p>Claims about Heaven, virtue and the ancestors are matters of faith and ethics and are not rated. Claims about Confucius&#x27;s life, the making of the books and the events around them are rated on the evidence. The texts are scored only on how well their record survives, never on whether their teaching is true.</p></aside></section><section class="wsec" id="confucianism-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The man behind the sayings</h3><p>Kong Qiu, known as Kongzi or Master Kong, was born in the small state of Lu in what is now Shandong, in 551 BCE by Sima Qian&#x27;s reckoning or 552 by others. He served briefly and unhappily in government, travelled among rival courts hoping for a ruler who would put his ideas into practice, and spent most of his life teaching. He died in 479 BCE.</p><p>The evidence for this life is real but indirect. The Analects, the Zuozhuan chronicle, the book of Mencius and Sima Qian&#x27;s great biography, written about four centuries later, all describe him. They do not always agree, and Sima Qian&#x27;s story of 3,000 students, 72 of whom mastered the arts, has the round numbers of legend. But the core of a teacher in Lu with a circle of named disciples fits everything we know of the period, and the site rates it as strong evidence.</p><blockquote class="wpull"><p>The core is secure: a teacher in Lu, a circle of disciples, and a legacy that outgrew every empire that honoured it.</p></blockquote></section><section class="wsec" id="confucianism-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>How the Analects was made</h3><p>The Analects is not a book Confucius wrote. It is a collection of short sayings and scenes, most beginning &#x27;The Master said&#x27;. Tradition holds that his disciples compiled it; modern scholars think it grew over two centuries or more. By the Han dynasty there were three versions: one from Lu in 20 books, one from Qi in 22, and an &#x27;Old Text&#x27; copy in 21 books, said to have been found hidden in a wall of Confucius&#x27;s own house. Around the end of the 1st century BCE a tutor to the emperor, Zhang Yu, merged the Lu and Qi versions, and his composite became the ancestor of every printed Analects today.</p><p>In 2022 Anhui University published a bamboo manuscript of about 300 BCE containing 25 sayings of &#x27;Zhongni&#x27;, Confucius&#x27;s courtesy name. Maddalena Poli and Yumeng Li, studying it alongside a similar manuscript from Wangjiazui, found that only some of its sayings have parallels in transmitted literature, and those are scattered rather than concentrated in the Analects. The picture that emerges is of many collections of the Master&#x27;s sayings in circulation, from which the Analects was one selection that won.</p><blockquote class="quote"><p>Tsze-kung asked, saying, &#x27;Is there one word which may serve as a rule of practice for all one&#x27;s life?&#x27; The Master said, &#x27;Is not RECIPROCITY such a word? What you do not want done to yourself, do not do to others.&#x27;</p><cite>Analects 15.23, trans. James Legge (1861)</cite></blockquote></section><section class="wsec" id="confucianism-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Bamboo in the tombs</h3><p>In 1973 archaeologists opened a Han tomb at Dingzhou in Hebei, probably that of Liu Xiu, King of Zhongshan, who died in 55 BCE. Robbers had set a fire inside long ago. Among the charred objects were 620 bamboo slips carrying 7,576 characters of the Analects, about half the received text. The slips were further damaged in the 1976 Tangshan earthquake before they could be fully studied, and the text was published only in 1997. Even so, it gives us an Analects older than any other complete edition by centuries.</p><p>Two more Han copies followed: one from a tomb near Pyongyang in North Korea, closely guarded and published only in part, and one from the spectacular tomb of Liu He, the deposed emperor who became Marquis of Haihun, who died in 59 BCE. Scholars have suggested the Haihun slips may preserve part of the lost Qi version, including a chapter title that the received text lacks. Three copies, buried within a few years of one another, from the Chinese heartland, the southeast and the Korean peninsula: that is an unusually rich early record.</p><aside class="wcall"><b>Fresh from the field</b><p>The Anhui University &#x27;Zhongni said&#x27; manuscript (published 2022) and the Haihunhou slips (excavated 2011–2016, still being published) are changing the story of how the Analects formed. Poli and Li&#x27;s 2024 study in Early China argues that &#x27;Analects-like materials&#x27; circulated by about 300 BCE in several forms. Expect more revisions as the Haihunhou texts appear.</p></aside></section><section class="wsec" id="confucianism-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Did the First Emperor burn the classics?</h3><p>Every Chinese schoolchild learns that in 213 BCE the First Emperor of Qin burned the books and in 212 BCE buried scholars alive. The story comes from Sima Qian, writing about a century later under the Han dynasty, which had every reason to paint the Qin darkly. His own account includes important limits: books on medicine, divination, agriculture and forestry were exempt, and official copies were kept in the imperial library. That library was destroyed when rebel armies burned the Qin capital in 206 BCE.</p><p>Scholars such as Michael Nylan and Martin Kern have questioned how much the burning mattered. Qin and early Han writers quote the classics freely, which would be hard if they had vanished. Losses were real, and the Han spoke constantly of recovering texts from walls and old scholars&#x27; memories. The site rates the traditional story as a mixed record: an order probably existed, but the war of 206 BCE may have done more damage than the decree.</p></section><section class="wsec" id="confucianism-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>A forgery that lasted thirteen centuries</h3><p>The most dramatic alteration in the Confucian canon con
