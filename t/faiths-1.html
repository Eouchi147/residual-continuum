<script type="text/x-tpl" id="faith-hinduism-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="1500-1200 BCE Rigveda, manuscript page sample i, Mandala 1, Hymn 1 (Sukta 1), Adhyaya 1, lines 1.1.1 to 1.1.9, Sanskrit, Devanagari.jpg" data-cap="The opening hymn of the Rigveda in a later Devanagari manuscript" data-big><figcaption></figcaption></figure><div class="sh-k">South Asia</div><h2 class="sh-t" id="faith-hinduism-st" tabindex="-1">Hinduism</h2><p class="sh-s">A family of traditions with no single founder, carrying hymns memorised syllable by syllable for over three thousand years, beside epics and Puranas that kept growing.</p><div class="sh-v"><span class="vstamp vstamp--when">from the 2nd millennium BCE</span></div></div><div class="f-facts"><div><span>Began</span><b>North-western South Asia: the Punjab and the upper Ganges plain</b><small>c. 1500 BCE onward (Vedic period); no single founding date or founder</small></div><div><span>Followers today</span><b>about 1.2 billion</b><small>Pew Research Center, 2020 estimate (published June 2025)</small></div></div><h3 class="sub-h wsub">In its own words</h3><blockquote class="quote f-own"><p>Sanatana Dharma, the eternal way, holds that reality is ultimately one: Brahman, the ground of all that exists, which the Upanishads teach is not different from the deepest self, the atman. The Vedas are shruti, &#x27;what was heard&#x27; by ancient seers, not the work of any human author. Every living being passes through many births shaped by karma, the fruit of its actions, until liberation (moksha) ends the cycle. There are many paths to that goal: knowledge, loving devotion to God in forms such as Vishnu, Shiva or the Goddess, selfless action, and meditation. Dharma, the right order of things and each person&#x27;s duty within it, holds the cosmos and society together, and whenever it declines it is renewed.</p><cite>How a follower might put it, in our words</cite></blockquote><h3 class="sub-h wsub">What it teaches and claims</h3><p class="rd-rule">Claims about God, revelation, the soul or miracles are matters of faith and are not rated. Claims about people, places, events and texts are weighed on the evidence.</p><ul class="rds"><li class="rd"><p class="rd-s">The Vedas are shruti: eternal truths &#x27;heard&#x27; by the rishis rather than composed by people.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">Central to Vedic orthodoxy; the Mimamsa school argued that the Vedas have no author at all. This is a matter of faith. Historians ask a different question: when, where and by whom the hymns were first recited. <span class="cite">Mimamsa Sutra; Flood 1996</span></p></li><li class="rd"><p class="rd-s">Brahman, the one reality, is known by many names.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">Already voiced in the Rigveda (&#x27;To what is One, sages give many a title&#x27;) and developed in the Upanishads. A theological claim, not rated. <span class="cite">Rigveda 1.164.46, trans. R. T. H. Griffith (1896)</span></p></li><li class="rd"><p class="rd-s">The self is reborn through many lives according to karma until liberation.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">First set out clearly in the oldest Upanishads and shared, in different forms, with Buddhism and Jainism. A matter of faith. <span class="cite">Brihadaranyaka Upanishad 4.4; Chandogya Upanishad 5.10 (trans. Olivelle 1998)</span></p></li><li class="rd"><p class="rd-s">Krishna, an avatar of Vishnu, taught the Bhagavad Gita to Arjuna on the battlefield of Kurukshetra.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">The divine identity of Krishna is a matter of faith. The Gita as a text is historical: it forms chapters 23–40 of the Bhishma Parvan of the Mahabharata and is usually dated to the last centuries BCE or the first centuries CE. <span class="cite">Mahabharata 6.23–40; BORI UNESCO nomination 2024</span></p></li><li class="rd"><p class="rd-s">The Rigveda was composed in north-western South Asia in the second half of the 2nd millennium BCE.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">Its rivers are those of the Punjab and its language is closely related to the Avestan of Iran. A treaty between the Hittites and the Mitanni kingdom (c. 1380 BCE) invokes Mitra, Varuna, Indra and the Nasatyas, a close Vedic parallel. Most scholars place the core at c. 1500–1200 BCE. <span class="cite">Witzel 1995; Jamison and Brereton 2014</span></p></li><li class="rd"><p class="rd-s">The Vedic hymns have been handed down orally with extraordinary accuracy.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">Several recitation modes check each other word by word, and lineages far apart in India recite essentially the same text, including its pitch accents. UNESCO proclaimed Vedic chanting a masterpiece of intangible heritage in 2003 and inscribed it in 2008. <span class="cite">UNESCO ICH 00062; Staal 1986</span></p></li><li class="rd"><p class="rd-s">The Mahabharata remembers a real war among the Kuru clans at Kurukshetra.</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">The Kuru realm of the late Vedic period is well attested, and its region matches Painted Grey Ware sites. A specific great battle has left no identified archaeological trace, and the epic&#x27;s scale reflects centuries of retelling. <span class="cite">Witzel 1995; Lal 1954–55</span></p></li><li class="rd"><p class="rd-s">The Kurukshetra war took place in 3102 BCE, at the start of the Kali Yuga.</p><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span><p class="rd-n">3102 BCE is the epoch used by the astronomer Aryabhata (499 CE); the Aihole inscription of Pulakeshin II (634 CE) implies about 3137 BCE. Nothing yet found links a war to those centuries, and the epic&#x27;s political geography fits the Iron Age Kuru and Panchala world. <span class="cite">Aihole inscription; Wikipedia &#x27;Mahabharata&#x27; (accessed 2026)</span></p></li><li class="rd"><p class="rd-s">Krishna&#x27;s city of Dvaraka stood on the Gujarat coast and was swallowed by the sea.</p><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span><p class="rd-n">Underwater surveys off Dwarka found stone anchors and dressed blocks, mostly of historic date; Bet Dwarka has a Late Harappan settlement. No drowned city matching the epic has been identified, though the coast has changed and survey is incomplete. <span class="cite">Gaur, Sundaresh and Tripati 2004</span></p></li></ul><h3 class="sub-h wsub">History, weighed</h3><ul class="rds"><li class="rd"><p class="rd-s">The ancestral language of Vedic Sanskrit reached South Asia from outside, carried by migrants in the 2nd millennium BCE.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">Vedic is a sister of Avestan and belongs with the Indo-European languages of the steppe and Iran. Ancient DNA shows steppe-related ancestry entering South Asia in the 2nd millennium BCE (Narasimhan et al. 2019), absent from the one sequenced Harappan genome from Rakhigarhi (Shinde et al. 2019). Genes are not languages, and some Indian scholars favour an indigenous origin, but the combined evidence points to arrival. <span class="cite">Narasimhan et al. 2019; Shinde et al. 2019</span></p></li><li class="rd"><p class="rd-s">Elements of later Hindu religion go back to the Indus (Harappan) civilisation.</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">Suggestive links include the seated figure on the so-called Pashupati seal, fire altars at Kalibangan, ritual bathing at Mohenjo-daro and the later sanctity of the pipal tree. The Indus script is undeciphered, and critics note that the &#x27;proto-Shiva&#x27; reading of the seal is uncertain. The question is open. <span class="cite">Parpola 2015; Srinivasan 1984</span></p></li><li class="rd"><p class="rd-s">The Sarasvati praised in the Rigveda was the Ghaggar-Hakra, a great Himalayan river along which the Harappan cities grew.</p><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span><p class="rd-n">Many Harappan sites do cluster along the dry Ghaggar-Hakra valley. But sediment dating shows the Sutlej abandoned that valley shortly after about 8,000 years ago, so Harappan towns grew beside a former channel fed by monsoon streams, not a glacier-fed giant. The Rigvedic Sarasvati may be a memory of this river, or of the Helmand in Afghanistan (Avestan Haraxvaiti). <span class="cite">Singh et al. 2017; Giosan et al. 2012</span></p></li><li class="rd"><p class="rd-s">A Kuru kingdom, the heartland of the Mahabharata story, existed in the late Vedic period.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">Late Vedic texts describe the Kurus as the leading power around Kurukshetra and the Yamuna and Ganges doab, c. 1200–500 BCE. Painted Grey Ware settlements of this period fit the same region. The kingdom is not named in contemporary inscriptions, which do not yet exist in India. <span class="cite">Witzel 1995</span></p></li><li class="rd"><p class="rd-s">Hastinapura, the Kuru capital, was washed away by the Ganges, as the Puranas report.</p><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span><p class="rd-n">B. B. Lal&#x27;s excavations at Hastinapur (1950–52) found that the Painted Grey Ware settlement ended with a heavy flood that cut away part of the mound. The Puranas say King Nichakshu moved the capital to Kaushambi after the Ganges carried Hastinapura away. The match is suggestive, not exact. <span class="cite">Lal 1954–55</span></p></li><li class="rd"><p class="rd-s">The Mahabharata grew over many centuries rather than being composed at one time.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">The epic itself mentions a shorter &#x27;Bharata&#x27; of 24,000 verses; the Pune critical edition found whole passages missing from some regional traditions, and an early Central Asian list of the epic&#x27;s books (the Spitzer manuscript) lacks sections present today. Most scholars date the bulk to c. 400 BCE–400 CE. <span class="cite">Sukthankar 1933; Ali et al. 2022</span></p></li><li class="rd"><p class="rd-s">Rama&#x27;s bridge (Rama Setu, Adam&#x27;s Bridge) is a human-built causeway.</p><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span><p class="rd-n">Seismic and satellite surveys describe the shoals as a natural ridge of sand and limestone, flooded as sea level rose after about 8,500 years ago. No construction has been identified. The site remains sacred, and its natural origin does not settle questions of faith. <span class="cite">Dubey et al. 2023; Dandabathula et al. 2024</span></p></li></ul><h3 class="sub-h wsub">The texts and what survives of them</h3><p class="rd-rule">The textual record measures what survives and how close it is to the original. It says nothing about whether a text is true or inspired.</p><section class="txt"><h4 class="txt-h">Rigveda Samhita</h4><ol class="jr" aria-label="How Rigveda Samhita reached us"><li class="jr-s"><span>Composed</span><b>c. 1500–1000 BCE (scholarly estimate; core family books c. 1500–1200 BCE)</b></li><li class="jr-gap jr-gap--long"><span>about 2,464 years with no surviving copy</span></li><li class="jr-s"><span>Oldest surviving copy</span><b>1464 CE</b><small>Oldest dated Rigveda manuscript at the Bhandarkar Oriental Research Institute (No. 5/1882–83)</small></li><li class="jr-s jr-today"><span>Today</span><b>Read in the language of its source</b></li></ol><div class="rec"><div class="rec-r"><span>Closeness to the source</span><span class="rec-b" role="img" aria-label="Closeness to the source: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Source&#x27;s own language</span><span class="rec-b" role="img" aria-label="Source&#x27;s own language: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Gap to oldest copy</span><span class="rec-b" role="img" aria-label="Gap to oldest copy: 1 of 5"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></span><b>1</b></div><div class="rec-r"><span>Early witnesses</span><span class="rec-b" role="img" aria-label="Early witnesses: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Stability of the text</span><span class="rec-b" role="img" aria-label="Stability of the text: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Documented history</span><span class="rec-b" role="img" aria-label="Documented history: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-tot"><span>Textual record</span><b>21<small>/30</small></b></div></div><p class="rec-why">Gap 1: the oldest dated manuscripts are about 2,400 years after composition; this measures writing only, and the oral safeguards are unusually strong, which is why stability scores 5. Language 5: still recited in the Vedic Sanskrit in which the hymns were composed. Witnesses 3: many manuscripts, but all medieval or modern, plus living oral lineages. Documented 3: the arrangement and the padapatha are known in outline, but not who fixed the collection or when. Some scholars would score the oral record higher on witnesses. Source 4: the hymns are the composers&#x27; own words, attributed to named seer families, and were learned by heart word for word rather than retold.</p><dl class="txt-dl"><div><dt>Language of the text</dt><dd>Vedic Sanskrit</dd></div><div><dt>Composed</dt><dd>c. 1500–1000 BCE (scholarly estimate; core family books c. 1500–1200 BCE)</dd></div><div><dt>Handed down</dt><dd>Composed and handed down orally within priestly families. Students learn the continuous text (samhitapatha) together with the word-by-word padapatha, the paired kramapatha and the interlaced jata and ghana modes, which cross-check every word. Still chanted today; UNESCO proclaimed the tradition in 2003 and inscribed it in 2008.</dd></div><div><dt>Fixed in writing</dt><dd>Arranged into ten books (mandalas) around the older family books 2–7; the padapatha is credited to the grammarian Shakalya. Only the Shakala recension survives complete. Writing came late, and the tradition long treated the recited text, not manuscripts, as authoritative.</dd></div><div><dt>Oldest surviving copy</dt><dd>Oldest dated Rigveda manuscript at the Bhandarkar Oriental Research Institute (No. 5/1882–83), 1464 CE (scribal date in the manuscript, as given in the UNESCO Memory of the World nomination (2007))</dd></div><div><dt>Early witnesses</dt><dd>Dozens of Rigveda manuscripts survive, all from the 2nd millennium CE, in Sharada, Devanagari and other scripts; BORI holds 30, one on birch bark, inscribed on UNESCO&#x27;s Memory of the World register in 2007. The oldest known Vedic manuscripts of any kind, copies of the Vajasaneyi Samhita from Nepal and western Tibet, date to about 1150 CE (Witzel and Wu 2019). Living recitation lineages act as independent witnesses.</dd></div></dl><div class="face"><div class="face-c face-m"><span class="face-k">How the tradition sees its text</span><p>The Vedas are eternal and authorless, &#x27;heard&#x27; by the rishis. Their power lies in exact sound, so every syllable and pitch accent must be kept. Teacher-to-pupil recitation, checked through several patterns, is the true text; a manuscript is at best an aid to memory. On this view the Rigveda heard today is the Rigveda of the seers.</p></div><div class="face-c face-x"><span class="face-k">What manuscript scholarship shows</span><p>Scholars agree that the oral safeguards worked remarkably well: the surviving recension is internally consistent and regional lineages agree closely. The text was fixed in the 1st millennium BCE with a few pronunciation updates. There are no written witnesses from antiquity, so fidelity before the padapatha stage is inferred from metre and comparison with Avestan, not checked against copies.</p></div></div><h5 class="txt-sub">Documented changes, variants and revisions</h5><ul class="txt-ch"><li>The hymns were collected from separate poet families and arranged into ten books; Books 1 and 10 are widely judged younger than the family books 2–7 (Jamison and Brereton 2014).</li><li>The padapatha fixed one word-by-word analysis of the text; in a few places modern scholars think it misreads what the poets meant (Jamison and Brereton 2014).</li><li>The metre shows that some words were once pronounced with more syllables than the recited text now has, so small modernisations of pronunciation entered before the text was frozen (van Nooten and Holland 1994).</li><li>Other recensions (shakhas) of the Rigveda, such as the Bashkala, are known mainly from reports and fragments; only the Shakala text survives complete (Witzel 1997).</li></ul></section><section class="txt"><h4 class="txt-h">Mahabharata (including the Bhagavad Gita)</h4><ol class="jr" aria-label="How Mahabharata (including the Bhagavad Gita) reached us"><li class="jr-s"><span>Composed</span><b>c. 400 BCE–400 CE, grown in layers (scholarly estimate)</b></li><li class="jr-gap jr-gap--long"><span>about 976 years with no surviving copy</span></li><li class="jr-s"><span>Oldest surviving copy</span><b>c. 1376 CE</b><small>Sharada-script Bhagavad Gita manuscript, BORI MS 425/1875–76 (the Gita portion only)</small></li><li class="jr-s jr-today"><span>Today</span><b>Read in the language of its source</b></li></ol><div class="rec"><div class="rec-r"><span>Closeness to the source</span><span class="rec-b" role="img" aria-label="Closeness to the source: 1 of 5"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></span><b>1</b></div><div class="rec-r"><span>Source&#x27;s own language</span><span class="rec-b" role="img" aria-label="Source&#x27;s own language: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Gap to oldest copy</span><span class="rec-b" role="img" aria-label="Gap to oldest copy: 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><b>2</b></div><div class="rec-r"><span>Early witnesses</span><span class="rec-b" role="img" aria-label="Early witnesses: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Stability of the text</span><span class="rec-b" role="img" aria-label="Stability of the text: 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><b>2</b></div><div class="rec-r"><span>Documented history</span><span class="rec-b" role="img" aria-label="Documented history: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-tot"><span>Textual record</span><b>17<small>/30</small></b></div></div><p class="rec-why">Gap 2: about 1,000 years from the end of composition to the oldest dated copy of any part (the Gita). Language 5: Sanskrit survives in use. Witnesses 4: hundreds of manuscripts from all regions, but late. Stability 2: recensions differ by whole episodes. Documented 3: the critical edition documents variation superbly, but who added what, and when, is inferred. Source 1: attributed to the sage Vyasa, but the epic grew over many centuries and its many authors are unknown.</p><dl class="txt-dl"><div><dt>Language of the text</dt><dd>Sanskrit (epic Sanskrit)</dd></div><div><dt>Composed</dt><dd>c. 400 BCE–400 CE, grown in layers (scholarly estimate)</dd></div><div><dt>Handed down</dt><dd>Began as bardic recitation; the epic frames itself as a chain of retellings, from Vyasa to Vaishampayana to the bard Ugrashravas. Performers kept reciting it for centuries alongside written copies.</dd></div><div><dt>Fixed in writing</dt><dd>No single standard text in antiquity: northern and southern recensions diverged. The Bhandarkar Oriental Research Institute&#x27;s critical edition (Pune, 1919–1966, first general editor V. S. Sukthankar) compared manuscripts from across India to reconstruct the oldest recoverable form, in 19 volumes.</dd></div><div><dt>Oldest surviving copy</dt><dd>Sharada-script Bhagavad Gita manuscript, BORI MS 425/1875–76 (the Gita portion only), c. 1376 CE (dating given by BORI in its UNESCO Memory of the World nomination (2024))</dd></div><div><dt>Early witnesses</dt><dd>Hundreds of manuscripts in many regional scripts, mostly from the 16th–19th centuries. The oldest copy used for the critical edition dates to the mid-16th century (Ali et al. 2022). Older indirect witnesses: the Spitzer manuscript from Central Asia (early centuries CE), which lists the epic&#x27;s books, and verses quoted in copper-plate land grants of the 5th and early 6th centuries.</dd></div></dl><div class="face"><div class="face-c face-m"><span class="face-k">How the tradition sees its text</span><p>The sage Vyasa composed the epic, dictating it, in a well-known later addition, to Ganesha, and it was recited at the snake sacrifice of King Janamejaya. It is called the fifth Veda. Devotees regard the Gita as Krishna&#x27;s own words. Regional versions are all honoured, and the differences are not usually seen as a problem.</p></div><div class="face-c face-x"><span class="face-k">What manuscript scholarship shows</span><p>The Mahabharata is a layered work that grew between roughly 400 BCE and 400 CE and kept changing in regional traditions. The Pune critical edition shows which passages are widely shared and which are regional additions. It remains a reconstruction: no manuscript earlier than the 14th century is known for any part of it.</p></div></div><h5 class="txt-sub">Documented changes, variants and revisions</h5><ul class="txt-ch"><li>The epic describes an earlier &#x27;Bharata&#x27; of 24,000 verses, while the full vulgate runs to roughly 100,000 couplets by traditional count; scholars read this as growth by addition over centuries (Mahabharata 1.1).</li><li>The Spitzer manuscript&#x27;s list of books lacks sections present today, suggesting they were added or reorganised later (Franco 2004–2005, as summarised by Ali et al. 2022).</li><li>Northern and southern recensions differ in wording, order and whole episodes; the critical edition moved many passages found only in some regions to footnotes and appendices (Sukthankar 1933).</li><li>Some scholars, notably Madeleine Biardeau, argued that seeking one archetype is artificial for a living oral epic, so the critical text is itself a scholarly construction.</li></ul></section><section class="txt"><h4 class="txt-h">The Puranas (example: the Skandapurana)</h4><ol class="jr" aria-label="How The Puranas (example: the Skandapurana) reached us"><li class="jr-s"><span>Composed</span><b>Puranas c. 3rd–10th century CE and later; the original Skandapurana c. 6th–8th century CE (estimates vary)</b></li><li class="jr-gap jr-gap--none"><span>copies survive from within the period of composition</span></li><li class="jr-s"><span>Oldest surviving copy</span><b>c. 810 CE</b><small>Palm-leaf Skandapurana manuscript from Nepal</small></li><li class="jr-s jr-today"><span>Today</span><b>Read in the language of its source</b></li></ol><div class="rec"><div class="rec-r"><span>Closeness to the source</span><span class="rec-b" role="img" aria-label="Closeness to the source: 1 of 5"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></span><b>1</b></div><div class="rec-r"><span>Source&#x27;s own language</span><span class="rec-b" role="img" aria-label="Source&#x27;s own language: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Gap to oldest copy</span><span class="rec-b" role="img" aria-label="Gap to oldest copy: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Early witnesses</span><span class="rec-b" role="img" aria-label="Early witnesses: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Stability of the text</span><span class="rec-b" role="img" aria-label="Stability of the text: 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><b>2</b></div><div class="rec-r"><span>Documented history</span><span class="rec-b" role="img" aria-label="Documented history: 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><b>2</b></div><div class="rec-tot"><span>Textual record</span><b>18<small>/30</small></b></div></div><p class="rec-why">Gap 5: the Nepal manuscript of c. 810 CE may be within decades of composition; if the text is 6th century the gap is nearer 250 years (score 4). Language 5. Witnesses 3: a handful of early copies. Stability 2: the early copies agree reasonably, but later texts under the same name are different works. Documented 2: authors and stages of expansion are unknown. This row is one example; other Puranas have no early witness at all. Source 1: authors and stages of expansion are unknown.</p><dl class="txt-dl"><div><dt>Language of the text</dt><dd>Sanskrit</dd></div><div><dt>Composed</dt><dd>Puranas c. 3rd–10th century CE and later; the original Skandapurana c. 6th–8th century CE (estimates vary)</dd></div><div><dt>Handed down</dt><dd>Puranas were recited in public by bards (sutas) and pandits, and presented as stories told by one narrator to another.</dd></div><div><dt>Fixed in writing</dt><dd>Never centrally standardised. Scribes and communities expanded Puranas for centuries. The large &#x27;Skanda Purana&#x27; printed since the colonial era is a compilation of sections (khandas) very different from the early text preserved in Nepal.</dd></div><div><dt>Oldest surviving copy</dt><dd>Palm-leaf Skandapurana manuscript from Nepal, c. 810 CE (dated colophon, read as 810 or 811 CE (Adriaensen, Bakker and Isaacson 1998))</dd></div><div><dt>Early witnesses</dt><dd>A few early Nepalese manuscripts preserve the old Skandapurana and underpin the Groningen critical edition (from 1998). Across all the Puranas, manuscripts number in the thousands, most from the last 500 years (Rocher 1986).</dd></div></dl><div class="face"><div class="face-c face-m"><span class="face-k">How the tradition sees its text</span><p>The Puranas are attributed to Vyasa and called &#x27;ancient lore&#x27;, a Veda for everyone including those not taught the Vedas. Their variety is often explained as the same truths retold for different ages and places. Many devotees read the printed editions as authoritative without concern for manuscript age.</p></div><div class="face-c face-x"><span class="face-k">What manuscript scholarship shows</span><p>The Puranas are living texts, composed and recomposed from the Gupta period onward. The Nepalese Skandapurana is a rare case where a copy survives from within a century or two of composition, and it shows how much a text of that name later changed.</p></div></div><h5 class="txt-sub">Documented changes, variants and revisions</h5><ul class="txt-ch"><li>The early Skandapurana preserved in Nepal is largely different from the later printed &#x27;Skanda Purana&#x27;, a far larger work assembled from sections added over centuries (Adriaensen, Bakker and Isaacson 1998).</li><li>Ludo Rocher observed that Purana manuscripts vary strongly by region and period, and that many printed editions rest on one or a few manuscripts (Rocher 1986).</li><li>The classical definition of a Purana&#x27;s five topics (creation, re-creation, genealogies, ages of Manu, dynasties) fits only part of the surviving texts, a sign of reshaping over time (Rocher 1986).</li></ul></section><h3 class="sub-h wsub">Through time</h3><ol class="ftl"><li><span class="ftl-y">c. 2600–1900 BCE</span><b>Mature Indus civilisation</b><span>Cities such as Mohenjo-daro and Harappa flourish; some later religious themes are argued, not shown, to have roots here.</span></li><li><span class="ftl-y">c. 1500–1200 BCE</span><b>Rigveda family books</b><span>The core hymns are composed in the Punjab and passed on orally.</span></li><li><span class="ftl-y">c. 1380 BCE</span><b>Mitanni treaty</b><span>A Hittite and Mitanni treaty invokes Mitra, Varuna, Indra and the Nasatyas, gods also named in the Rigveda.</span></li><li><span class="ftl-y">c. 1200–500 BCE</span><b>Later Vedic age</b><span>The other Vedas, the Brahmanas and the Kuru kingdom; Painted Grey Ware settlements in the Ganges and Yamuna doab.</span></li><li><span class="ftl-y">c. 700–500 BCE</span><b>Oldest Upanishads</b><span>The Brihadaranyaka and Chandogya Upanishads set out atman, Brahman, karma and rebirth.</span></li><li><span class="ftl-y">c. 400 BCE–400 CE</span><b>The epics grow</b><span>The Mahabharata, with the Bhagavad Gita, and the Ramayana take shape over centuries.</span></li><li><span class="ftl-y">c. 300–1000 CE</span><b>The Puranas</b><span>Major Puranas are composed and collected, many in and after the Gupta period.</span></li><li><span class="ftl-y">c. 810 CE</span><b>Skandapurana copied in Nepal</b><span>One of the oldest dated Sanskrit religious manuscripts to survive.</span></li><li><span class="ftl-y">c. 1150 CE</span><b>Oldest known Veda manuscripts</b><span>Copies of the Vajasaneyi Samhita from Nepal and western Tibet (Witzel and Wu 2019).</span></li><li><span class="ftl-y">1464 CE</span><b>Oldest dated BORI Rigveda</b><span>The oldest dated of the 30 Rigveda manuscripts in Pune.</span></li><li><span class="ftl-y">1919–1966</span><b>Mahabharata critical edition</b><span>BORI, Pune, compares manuscripts from across India to reconstruct the epic&#x27;s oldest recoverable text.</span></li><li><span class="ftl-y">2003, 2007, 2008</span><b>UNESCO recognition</b><span>Vedic chanting proclaimed (2003) and inscribed (2008); BORI&#x27;s Rigveda manuscripts added to Memory of the World (2007).</span></li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">6 min read · 1,392 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Hinduism"><button type="button" class="wtoc-i" data-go="hinduism-s1">A library kept in the voice</button><button type="button" class="wtoc-i" data-go="hinduism-s2">How the tradition understands its own texts</button><button type="button" class="wtoc-i" data-go="hinduism-s3">How the hymns survived</button><button type="button" class="wtoc-i" data-go="hinduism-s4">Epics and Puranas: texts that kept growing</button><button type="button" class="wtoc-i" data-go="hinduism-s5">History inside the stories</button><button type="button" class="wtoc-i" data-go="hinduism-s6">What is still open</button></nav></div><section class="wsec" id="hinduism-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A library kept in the voice</h3><p>Picture a boy of eight in a Kerala courtyard or a Maharashtra pathashala, sitting cross-legged before his teacher, repeating a line until every syllable and every rise and fall of pitch is exact. He will spend years doing this. What he is learning was composed, by the best estimates of historians, well over three thousand years ago, before iron was common in India and long before anyone wrote it down. The Rigveda is one of the oldest religious texts still in daily use anywhere, and for most of its life it was never a book at all.</p><p>Hinduism is not a single religion with a founder, a founding date and one scripture. It is a vast family of traditions, schools and devotional paths that share a sacred history and recognise the Vedas as a source of authority, even when they rarely read them. That breadth makes its textual record unusually varied. Some of its texts were guarded with a precision that has impressed every scholar who studied them. Others were meant to grow, and did.</p><blockquote class="wpull"><p>For most of its life the Rigveda was never a book at all. It lived in trained memory, checked syllable by syllable.</p></blockquote></section><section class="wsec" id="hinduism-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>How the tradition understands its own texts</h3><p>Hindu tradition divides its scriptures into two kinds. Shruti, &#x27;what was heard&#x27;, means the Vedas: the four Samhitas of hymns and formulas, with their Brahmanas, Aranyakas and Upanishads. They are held to be eternal, perceived by the rishis rather than invented, and for the Mimamsa school they have no author at all, human or divine. Smriti, &#x27;what is remembered&#x27;, covers the epics, the Puranas, the law books and much else. Smriti texts are revered and often more widely loved, above all the Bhagavad Gita, but they are understood as human compositions in the service of eternal truth.</p><p>This distinction shapes how each kind of text was kept. Because the power of a Vedic hymn lies in its exact sound, changing a syllable was a serious fault. The epics and Puranas, by contrast, were stories to be told to new audiences, and the tradition accepted that tellers would expand and adapt them. Both attitudes are visible in the manuscripts historians study today.</p><blockquote class="quote"><p>They call him Indra, Mitra, Varuna, Agni, and he is heavenly nobly-winged Garutman. To what is One, sages give many a title they call it Agni, Yama, Matarisvan.</p><cite>Rigveda 1.164.46, trans. R. T. H. Griffith, The Hymns of the Rigveda (1896)</cite></blockquote></section><section class="wsec" id="hinduism-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>How the hymns survived</h3><p>The Vedic reciters built an error-checking system long before anyone thought of the phrase. The continuous text, the samhitapatha, runs words together according to the sound rules of Sanskrit. The padapatha separates every word in its basic form. The kramapatha recites overlapping pairs: word one and two, two and three, three and four. The jata and ghana patterns weave the words forwards and backwards in longer knots. A pupil who has mastered all of them cannot easily slip a word, because each pattern exposes errors in the others. UNESCO proclaimed this tradition of Vedic chanting a masterpiece of humanity&#x27;s intangible heritage in 2003 and inscribed it in 2008, noting that only a small number of the old recitation branches still survive.</p><p>Did it work? The strongest evidence is internal. Only one recension of the Rigveda, the Shakala, survives complete, and lineages separated by a thousand miles recite it with remarkable agreement, including accents that had stopped mattering in ordinary speech many centuries earlier. Metrical study shows a few small modernisations of pronunciation crept in before the text was frozen, which is itself a sign that later reciters did not rewrite the hymns wholesale.</p><aside class="wcall"><b>How do we know?</b><p>Writing came very late. The Bhandarkar Oriental Research Institute in Pune holds 30 Rigveda manuscripts, one on birch bark in Sharada script; the oldest dated one was copied in 1464 CE, and the collection joined UNESCO&#x27;s Memory of the World register in 2007. The oldest known Vedic manuscripts of any kind, copies of the White Yajurveda from Nepal and western Tibet, date to about 1150 CE. So for the Rigveda the gap between composition and the oldest written copy is well over two thousand years, and the case for its accuracy rests on the oral system, not on old parchment.</p></aside></section><section class="wsec" id="hinduism-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Epics and Puranas: texts that kept growing</h3><p>The Mahabharata is a different kind of survivor. It calls itself the story of the Bharatas, and it also tells us it once existed in a shorter form of 24,000 verses; the version most Indians know runs to about four times that. Between 1919 and 1966 scholars at the same Pune institute compared manuscripts from Kashmir to Kerala in order to separate what almost every tradition shares from what only some regions added. The result, the critical edition, is one of the great achievements of textual scholarship. It is also, as its critics note, a reconstruction of a text that may never have existed in a single fixed form.</p><p>The physical record is thin for the early centuries. A Central Asian manuscript in Berlin, the Spitzer manuscript from the early centuries CE, lists the epic&#x27;s books, and land grants on copper plates from the 5th and early 6th centuries quote its verses. The oldest actual copy used for the critical edition is from the mid-16th century, and a Kashmiri manuscript of the Bhagavad Gita in Pune is dated to about 1376 CE. As a recent study of India&#x27;s oldest manuscripts put it, on Indian soil outside the Himalayas nothing survives before the 11th century: heat, damp and insects destroyed palm leaf and birch bark, and texts survived by being recopied.</p><p>The Puranas show the same pattern more sharply. A palm-leaf Skandapurana copied in Nepal around 810 CE is one of the oldest dated Sanskrit religious manuscripts anywhere. When scholars edited it, they found it was largely a different work from the enormous &#x27;Skanda Purana&#x27; printed in modern India, which grew by adding whole sections over the centuries. Nothing in the tradition hides this: the Puranas were meant to be retold.</p></section><section class="wsec" id="hinduism-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>History inside the stories</h3><p>Taken as witnesses to the past, these texts preserve a surprising amount. The Rigveda&#x27;s rivers are those of the Punjab, and its gods Mitra, Varuna and Indra appear in a treaty between the Hittites and the kingdom of Mitanni in northern Syria around 1380 BCE, the kind of external anchor ancient texts rarely get. The later Vedic texts describe a Kuru kingdom around Kurukshetra, the stage of the Mahabharata, and archaeology finds a matching spread of Painted Grey Ware villages in that region in the early 1st millennium BCE. At Hastinapur, B. B. Lal found that the Painted Grey Ware town ended with a severe Ganges flood, which fits the Puranic report that the Kuru capital was moved to Kaushambi after the river swept Hastinapura away.</p><p>Other memories are harder to test. Many Harappan sites cluster along the dry Ghaggar-Hakra valley, which many identify with the Sarasvati, &#x27;best of rivers&#x27; in the Rigveda. Sediment dating has complicated the picture: the Sutlej, the glacier-fed river that once filled this valley, moved away about 8,000 years ago, so the Harappan towns grew beside a former channel fed by monsoon streams. The river may still be the Sarasvati of memory, perhaps remembered as greater than it was when the hymns were composed. Whether the Indus civilisation contributed yogic postures, a proto-Shiva or ritual bathing to later Hinduism is debated, and it cannot be settled until its script is read.</p><blockquote class="wpull"><p>Where the texts can be tested against the ground, they often point in the right direction, even when the scale has grown in the telling.</p></blockquote></section><section class="wsec" id="hinduism-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What is still open</h3><p>The dating of the Kurukshetra war is the best-known open question. Tradition, following the astronomer Aryabhata, puts it at 3102 BCE, and an inscription of Pulakeshin II in 634 CE implies a similar date. No archaeological layer of that age has yet been tied to the epic, and the kingdoms it describes fit the Iron Age. That is not a verdict on the story&#x27;s heart, which may preserve memories of real rivalries among Kuru clans. The drowned Dwarka off Gujarat is a similar case: divers have found anchors and stone blocks, and a Late Harappan settlement on Bet Dwarka, but not yet a city of Krishna&#x27;s age.</p><p>Ancient DNA has reopened an old argument about where the Vedic language came from. Most geneticists read the data as showing steppe-related migrants entering South Asia in the 2nd millennium BCE, a time that fits the Rigveda&#x27;s age; others in India argue for a homeland within the subcontinent. The strongest point of the tradition&#x27;s own account is not in doubt: whatever its ultimate origins, the Rigveda has been carried across more than three millennia with a care that few human records can match.</p><blockquote class="quote"><p>He, the first origin of this creation, whether he formed it all or did not form it, Whose eye controls this world in highest heaven, he verily knows it, or perhaps he knows not.</p><cite>Rigveda 10.129.7, trans. R. T. H. Griffith, The Hymns of the Rigveda (1896)</cite></blockquote></section><details class="srcs"><summary>Sources for this tradition (27)</summary><ol><li>Pew Research Center (2025). How the Global Religious Landscape Changed From 2010 to 2020. 9 June 2025.</li><li>UNESCO Intangible Cultural Heritage. Tradition of Vedic chanting (element 00062), proclaimed 2003, inscribed 2008.</li><li>UNESCO Memory of the World Register. Rigveda (India), nomination by the Bhandarkar Oriental Research Institute, inscribed 2007.</li><li>Bhandarkar Oriental Research Institute (2024). Bhagavadgita: five select manuscripts in Sarada script. UNESCO Memory of the World nomination form.</li><li>Jamison S. W., Brereton J. P. (trans.) (2014). The Rigveda: The Earliest Religious Poetry of India. 3 vols. Oxford University Press.</li><li>Griffith R. T. H. (trans.) (1896). The Hymns of the Rigveda. 2nd ed. E. J. Lazarus, Benares.</li><li>Witzel M. (1995). Early Sanskritization: origins and development of the Kuru state. Electronic Journal of Vedic Studies 1(4).</li><li>Witzel M. (1997). The development of the Vedic canon and its schools: the social and political milieu. In Inside the Texts, Beyond the Texts. Harvard Oriental Series, Opera Minora 2.</li><li>Witzel M., Wu Q. (2019). The Two Oldest Veda Manuscripts: Facsimile Edition of Vajasaneyi Samhita 1–20 from Nepal and Western Tibet (c. 1150 CE). Harvard Oriental Series. Harvard University Press.</li><li>van Nooten B. A., Holland G. B. (1994). Rig Veda: A Metrically Restored Text. Harvard Oriental Series 50. Harvard University Press.</li><li>Staal F. (1986). The Fidelity of Oral Tradition and the Origins of Science. North-Holland, Amsterdam.</li><li>Olivelle P. (trans.) (1998). The Early Upanisads: Annotated Text and Translation. Oxford University Press.</li><li>Ali M., van Putten M., Ohta A., Koser Akcapar S., Willis M. (2022). The oldest manuscripts from India and their histories: a 08.048" target="_blank" rel="noopener">doi:10.1016/j.cell.2019.08.048</a></li><li>Gaur A. S., Sundaresh, Tripati S. (2004). An ancient harbour at Dwarka: study based on the recent underwater explorations. Current Science 86(9): 1256–1260.</li><li>Dubey K. M., Chaubey A. K., Gaur A. S., Joglekar M. V. (2023). Evolution of Ramasetu region as a link between India and Sri Lanka during the late Pleistocene and Holocene. Quaternary Research 111: 166–176. <a href="https://doi.org/10.1017/qua.2022.41" target="_blank" rel="noopener">doi:10.1017/qua.2022.41</a></li><li>Dandabathula G. et al. (2024). Physical features of Adam&#x27;s Bridge interpreted from ICESat-2 based high-resolution digital bathymetric elevation model. Scientific Reports 14. <a href="https://doi.org/10.1038/s41598-024-65908-2" target="_blank" rel="noopener">doi:10.1038/s41598-024-65908-2</a></li></ol></details><aside class="rc-cite" data-v="faiths" data-id="faith-hinduism" data-t="Hinduism"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Hinduism</i>. <span class="cite-u">https://residualcontinuum.com/#faiths/faith-hinduism</span> (updated 25 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="faith-zoroastrianism-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Zoroastrian Fire Temple, Yazd 01.jpg" data-cap="The Zoroastrian fire temple at Yazd, Iran" data-big><figcaption></figcaption></figure><div class="sh-k">Eastern Iran</div><h2 class="sh-t" id="faith-zoroastrianism-st" tabindex="-1">Zoroastrianism</h2><p class="sh-s">One of the oldest living faiths, whose hymns were carried by memory for perhaps two thousand years before anyone wrote them down.</p><div class="sh-v"><span class="vstamp vstamp--when">c. 1500–500 BCE (date debated)</span></div></div><div class="f-facts"><div><span>Began</span><b>Eastern Iranian lands, possibly Bactria, Chorasmia or Sistan (exact region debated)</b><small>c. 1500–500 BCE (most scholars favour c. 1200–900 BCE)</small></div><div><span>Followers today</span><b>about 110,000–125,000</b><small>FEZANA demographic survey (Roshan Rivetna), 2012 estimate of 111,691–121,962</small></div></div><h3 class="sub-h wsub">In its own words</h3><blockquote class="quote f-own"><p>There is one wise Lord, Ahura Mazda, the creator of all that is good. The world is the scene of a real struggle between truth and order (asha) and the lie (druj), and every person takes part in it by choice. Zarathustra, the prophet, heard the Wise Lord and taught us to choose truth through good thoughts, good words and good deeds. Fire, clean water and the living earth are to be kept pure, because they are good creations. At the end of time evil will be defeated, the dead will rise, and the world will be made new and wonderful (frashokereti). Until then each of us helps that renewal by living rightly.</p><cite>How a follower might put it, in our words</cite></blockquote><h3 class="sub-h wsub">What it teaches and claims</h3><p class="rd-rule">Claims about God, revelation, the soul or miracles are matters of faith and are not rated. Claims about people, places, events and texts are weighed on the evidence.</p><ul class="rds"><li class="rd"><p class="rd-s">Ahura Mazda is the one uncreated, wise creator of all good things.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">The central teaching of the Gathas and of all later Zoroastrian theology. It is a statement about God, so it is not rated here. <span class="cite">Gathas, e.g. Yasna 44; Boyce 1979</span></p></li><li class="rd"><p class="rd-s">Zarathustra received revelation from Ahura Mazda and composed the Gathas.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">The revelation itself is a matter of faith. That the Gathas come from a single early poet is a separate historical question: most philologists accept a single composer, while a minority (notably Jean Kellens) treats Zarathustra as a figure the texts construct. <span class="cite">Yasna 28–34, 43–51, 53; Skjærvø 2011</span></p></li><li class="rd"><p class="rd-s">Zarathustra was a real person who lived in eastern Iran long before the Persian Empire.</p><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span><p class="rd-n">No inscription or object names him. The case rests on the Gathas&#x27; archaic language and their picture of a small pastoral society. Dates range from c. 1500 to c. 500 BCE; the traditional &#x27;258 years before Alexander&#x27; is widely judged too late. <span class="cite">Boyce 1979; Stausberg and Vevaina 2015</span></p></li><li class="rd"><p class="rd-s">The world is a battlefield between good and evil, and each person chooses a side.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">A moral and theological teaching. Yasna 30 describes two primal spirits and the choice between them, and later texts build a whole cosmic history on it. As a claim about the spiritual order of the world, it is not rated. <span class="cite">Yasna 30.3–5</span></p></li><li class="rd"><p class="rd-s">At death the soul crosses the Chinvat Bridge and is judged by its deeds.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">A teaching about the afterlife, first hinted at in the Gathas and developed in Young Avestan and Pahlavi texts, where the soul meets its own conscience at the bridge. It concerns the unseen world, so it is not rated. <span class="cite">Yasna 46.10–11; Arda Viraz Namag</span></p></li><li class="rd"><p class="rd-s">The Persian kings of the Achaemenid dynasty worshipped Ahura Mazda.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">Darius I names Auramazda repeatedly at Behistun (c. 520 BCE) and later kings continue to do so. Whether these kings were Zoroastrian in the full sense is a separate, debated question, because Zarathustra is never named in royal inscriptions. <span class="cite">Schmitt 1991; Kent 1953</span></p></li><li class="rd"><p class="rd-s">The Avesta was once far larger, and much of it was lost through conquest.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">The 9th–10th century Denkard summarises a 21-part Sasanian Avesta; only about a quarter of the passages it cites survive. Loss after the 7th-century Arab conquest is well supported; blaming Alexander for the loss is a later Persian tradition. <span class="cite">Denkard 8; Kellens, Encyclopaedia Iranica</span></p></li><li class="rd"><p class="rd-s">Parsi Zoroastrians descend from refugees who sailed from Iran to Gujarat.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">The Qissa-i Sanjan (written 1599) tells the story; genetic studies of Parsis find substantial Iranian ancestry. The arrival date (8th to 10th century) remains debated. <span class="cite">Qissa-i Sanjan; Stausberg and Vevaina 2015</span></p></li></ul><h3 class="sub-h wsub">History, weighed</h3><ul class="rds"><li class="rd"><p class="rd-s">The Gathas are among the oldest Iranian texts, composed around 1000 BCE give or take several centuries.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">Old Avestan is grammatically very close to the Sanskrit of the Rigveda, and the hymns describe a Bronze Age pastoral society with no cities or iron. Most scholars place them between c. 1500 and 900 BCE. A minority argues for later dates, around 600 BCE. Linguistic dating gives a range, not a year. <span class="cite">Humbach 1991; Skjærvø 2011</span></p></li><li class="rd"><p class="rd-s">Darius I credited his kingship to Ahura Mazda in the Behistun inscription, c. 520 BCE.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">The trilingual relief in western Iran (Old Persian, Elamite, Babylonian) survives on the cliff and was deciphered in the 19th century. It names Auramazda many times. It is the oldest securely dated text naming the Wise Lord, and a UNESCO World Heritage Site since 2006. <span class="cite">Schmitt 1991; UNESCO 2006</span></p></li><li class="rd"><p class="rd-s">The Achaemenid kings were followers of Zarathustra.</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">Kings name Ahura Mazda, and Herodotus (1.131–132) describes Magi and fire rites. But no Achaemenid inscription names Zarathustra, and the kings also honoured other gods. Scholars range from &#x27;yes, a form of Zoroastrianism&#x27; to &#x27;a related Iranian religion&#x27;. The evidence allows both readings. <span class="cite">Boyce 1979; Stausberg and Vevaina 2015</span></p></li><li class="rd"><p class="rd-s">Alexander the Great burned the Avesta at Persepolis.</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">Alexander&#x27;s army did burn Persepolis in 330 BCE, which is well attested. The claim that a master copy of the Avesta on ox hides was destroyed there comes from Pahlavi books written over a thousand years later. Most scholars doubt that a full written Avesta existed that early. <span class="cite">Arrian, Anabasis 3.18; Arda Viraz Namag 1</span></p></li><li class="rd"><p class="rd-s">The Avesta was first written down in the Sasanian period with a newly invented alphabet.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">The Avestan script, adapted from Pahlavi with many added vowel signs, was designed to record liturgical pronunciation. Its date is uncertain, usually placed in the 5th or 6th century CE. Karl Hoffmann and Johanna Narten reconstructed a single Sasanian archetype behind all surviving manuscripts. <span class="cite">Hoffmann and Narten 1989; Hintze, Göttingen</span></p></li><li class="rd"><p class="rd-s">Zoroastrianism was the state religion of the Sasanian Empire (224–651 CE).</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">Royal inscriptions, the 3rd-century inscriptions of the priest Kartir, coins showing fire altars and later Pahlavi literature all agree that the Sasanian crown supported a Mazdean priesthood, though other faiths were present in the empire. <span class="cite">Stausberg and Vevaina 2015</span></p></li><li class="rd"><p class="rd-s">Zoroastrian ideas of judgement, resurrection and angels influenced Judaism, Christianity and Islam.</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">Parallels are real, and Jews lived under Persian rule after 539 BCE. But dating the Zoroastrian sources is hard, and some shared ideas may have developed in parallel. This remains one of the most debated questions in the history of religion. <span class="cite">Boyce 1979; Stausberg and Vevaina 2015</span></p></li></ul><h3 class="sub-h wsub">The texts and what survives of them</h3><p class="rd-rule">The textual record measures what survives and how close it is to the original. It says nothing about whether a text is true or inspired.</p><section class="txt"><h4 class="txt-h">The Gathas and Old Avestan liturgy (Yasna 28–53)</h4><ol class="jr" aria-label="How The Gathas and Old Avestan liturgy (Yasna 28–53) reached us"><li class="jr-s"><span>Composed</span><b>c. 1500–900 BCE (debated; a minority argues for c. 600 BCE)</b></li><li class="jr-gap jr-gap--long"><span>about 2,223 years with no surviving copy</span></li><li class="jr-s"><span>Oldest surviving copy</span><b>1323 CE</b><small>Yasna with Pahlavi translation, copied by Mihrabān Kay-Khosrow at Cambay (Oxford, Bodleian, J2; Copenhagen, Royal Library, K5)</small></li><li class="jr-s jr-today"><span>Today</span><b>Read in the language of its source</b></li></ol><div class="rec"><div class="rec-r"><span>Closeness to the source</span><span class="rec-b" role="img" aria-label="Closeness to the source: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Source&#x27;s own language</span><span class="rec-b" role="img" aria-label="Source&#x27;s own language: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Gap to oldest copy</span><span class="rec-b" role="img" aria-label="Gap to oldest copy: 1 of 5"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></span><b>1</b></div><div class="rec-r"><span>Early witnesses</span><span class="rec-b" role="img" aria-label="Early witnesses: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Stability of the text</span><span class="rec-b" role="img" aria-label="Stability of the text: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Documented history</span><span class="rec-b" role="img" aria-label="Documented history: 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><b>2</b></div><div class="rec-tot"><span>Textual record</span><b>19<small>/30</small></b></div></div><p class="rec-why">Gap 1: over 2,000 years separate composition from the oldest written copy (1323), even on late dates for Zarathustra. Language 5: the Old Avestan text survives and is still recited. Witnesses 3: many manuscripts from two regions, but none earlier than the 14th century. Stability 4: variants are mostly spelling and pronunciation, all from one archetype. Documented 2: when and how the text was first written is inferred, not recorded. Some scholars would score stability 5 for the Gathas&#x27; metrical integrity. Source 4: most scholars accept the Gathas as Zarathustra&#x27;s own compositions or those of his first circle, preserved orally with great care.</p><dl class="txt-dl"><div><dt>Language of the text</dt><dd>Old Avestan</dd></div><div><dt>Composed</dt><dd>c. 1500–900 BCE (debated; a minority argues for c. 600 BCE)</dd></div><div><dt>Handed down</dt><dd>Transmitted orally by priests for perhaps two thousand years, memorised and recited in the daily Yasna ritual. Priests learned the sounds exactly, even as understanding of the old language faded.</dd></div><div><dt>Fixed in writing</dt><dd>Written down in the Sasanian period with the Avestan alphabet, created for the purpose (usually dated 5th–6th century CE). All surviving manuscripts descend from that Sasanian archetype, which is lost.</dd></div><div><dt>Oldest surviving copy</dt><dd>Yasna with Pahlavi translation, copied by Mihrabān Kay-Khosrow at Cambay (Oxford, Bodleian, J2; Copenhagen, Royal Library, K5), 1323 CE (colophon (scribe&#x27;s dated note))</dd></div><div><dt>Early witnesses</dt><dd>More than 300 Avestan manuscripts are catalogued (Hintze; Cantera), from an Indian (Parsi) and an Iranian branch; none of the complete ones is older than 1323 CE. A Sogdian-script fragment from Dunhuang (c. 800 CE or later) preserves one short Avestan prayer.</dd></div></dl><div class="face"><div class="face-c face-m"><span class="face-k">How the tradition sees its text</span><p>Zoroastrians hold that the Gathas are Zarathustra&#x27;s own words, received from Ahura Mazda and guarded without change by a hereditary priesthood that recited them daily. Much of the wider Avesta was lost through the invasions of Alexander and the Arabs, but the core liturgy, and above all the Gathas, survived because it was always in the priests&#x27; mouths.</p></div><div class="face-c face-x"><span class="face-k">What manuscript scholarship shows</span><p>Philologists largely agree that the Gathas are remarkably well preserved in sound and wording: their metre and archaic grammar survive, which would be unlikely after heavy editing. But the written record begins very late, the Sasanian archetype is lost, and the earliest complete copies are 14th century. Interpretation of the Gathas themselves is difficult and translations differ widely.</p></div></div><h5 class="txt-sub">Documented changes, variants and revisions</h5><ul class="txt-ch"><li>The Sasanian editors arranged the recited liturgy into a written book and invented a script for it, so the written form reflects Sasanian priestly pronunciation, not necessarily the composer&#x27;s (Hoffmann and Narten 1989).</li><li>A Middle Persian (Pahlavi) translation and commentary (Zand) was added in late Sasanian or early Islamic times; it often misreads the Old Avestan, showing understanding had faded (Skjærvø 2011).</li><li>The ritual order of the Yasna places the 17 Gathic hymns in five groups by metre, which probably reflects liturgical arrangement rather than order of composition (Humbach 1991).</li></ul></section><section class="txt"><h4 class="txt-h">Young Avesta: Yasna, Visperad, Vendidad and Yashts</h4><ol class="jr" aria-label="How Young Avesta: Yasna, Visperad, Vendidad and Yashts reached us"><li class="jr-s"><span>Composed</span><b>c. 900–400 BCE for most hymns; parts of the Vendidad possibly later</b></li><li class="jr-gap jr-gap--long"><span>about 1,723 years with no surviving copy</span></li><li class="jr-s"><span>Oldest surviving copy</span><b>1323–1324 CE</b><small>Vendidad with Pahlavi translation, copied by Mihrabān Kay-Khosrow (London, British Library, L4; Copenhagen, K1)</small></li><li class="jr-s jr-today"><span>Today</span><b>Read in the language of its source</b></li></ol><div class="rec"><div class="rec-r"><span>Closeness to the source</span><span class="rec-b" role="img" aria-label="Closeness to the source: 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><b>2</b></div><div class="rec-r"><span>Source&#x27;s own language</span><span class="rec-b" role="img" aria-label="Source&#x27;s own language: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Gap to oldest copy</span><span class="rec-b" role="img" aria-label="Gap to oldest copy: 1 of 5"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></span><b>1</b></div><div class="rec-r"><span>Early witnesses</span><span class="rec-b" role="img" aria-label="Early witnesses: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Stability of the text</span><span class="rec-b" role="img" aria-label="Stability of the text: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Documented history</span><span class="rec-b" role="img" aria-label="Documented history: 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><b>2</b></div><div class="rec-tot"><span>Textual record</span><b>16<small>/30</small></b></div></div><p class="rec-why">Gap 1: over 1,700 years between composition and the oldest dated copy. Language 5: the Avestan text survives and remains in liturgical use. Witnesses 3: many manuscripts, but all late and from two related branches. Stability 3: the copies descend from one archetype, but corruptions and ritual rearrangement give meaningful variants. Documented 2: the Denkard&#x27;s summary of the lost nasks helps, but the stages of editing are mostly inferred. Source 2: composed by later priests over centuries, and about three quarters of the Sasanian Avesta is lost.</p><dl class="txt-dl"><div><dt>Language of the text</dt><dd>Young Avestan (with Middle Persian translations)</dd></div><div><dt>Composed</dt><dd>c. 900–400 BCE for most hymns; parts of the Vendidad possibly later</dd></div><div><dt>Handed down</dt><dd>Recited by priests in ritual for many centuries before writing. Unlike the Gathas, some Young Avestan passages show grammatical errors that suggest they were composed or reworked by priests who no longer spoke the language.</dd></div><div><dt>Fixed in writing</dt><dd>Written in the Sasanian Avestan script as part of a great 21-part Avesta (nasks) described in the Denkard. After the Arab conquest most of this collection was lost; what survives is chiefly what stayed in daily and seasonal ritual use.</dd></div><div><dt>Oldest surviving copy</dt><dd>Vendidad with Pahlavi translation, copied by Mihrabān Kay-Khosrow (London, British Library, L4; Copenhagen, K1), 1323–1324 CE (colophon)</dd></div><div><dt>Early witnesses</dt><dd>Many manuscripts from India and Iran, mostly 16th–19th century, with a handful from the 14th century; Geldner&#x27;s standard edition (1886–96) drew on about 133 of them.</dd></div></dl><div class="face"><div class="face-c face-m"><span class="face-k">How the tradition sees its text</span><p>The priesthood regards the surviving Avesta as the remnant of a far larger sacred scripture, faithfully kept in ritual through centuries of persecution and migration, first in Iran and then among the Parsis of India, who copied the manuscripts that survive.</p></div><div class="face-c face-x"><span class="face-k">What manuscript scholarship shows</span><p>Scholars see a layered collection composed over several centuries, edited into written form under the Sasanians, then heavily reduced after the 7th century. The surviving ritual texts are generally reliable witnesses to the Sasanian archetype, but many passages are corrupt and the lost portions are known only from Pahlavi summaries.</p></div></div><h5 class="txt-sub">Documented changes, variants and revisions</h5><ul class="txt-ch"><li>Only about a quarter of the Avestan passages quoted by 9th–10th century commentators can be found in the surviving texts, so most of the Sasanian Avesta is lost (Kellens; Denkard 8).</li><li>The surviving books are ritual collections: the Vendidad was copied in a &#x27;Sade&#x27; form interleaved with the Yasna for the night ritual, a liturgical rearrangement (Cantera, Avestan Digital Archive).</li><li>Manuscripts copied by priests with limited grammar knowledge contain many corrupted forms; Geldner&#x27;s 19th-century edition normalised some of them, and new editions (Corpus Avesticum) are revising his text.</li></ul></section><h3 class="sub-h wsub">Through time</h3><ol class="ftl"><li><span class="ftl-y">c. 1500–900 BCE</span><b>The Gathas</b><span>Zarathustra&#x27;s hymns are composed in Old Avestan somewhere in eastern Iran, on most scholars&#x27; dating. Some place them later, around 600 BCE.</span></li><li><span class="ftl-y">c. 520 BCE</span><b>Behistun</b><span>Darius I carves his trilingual inscription crediting his kingship to Ahura Mazda.</span></li><li><span class="ftl-y">330 BCE</span><b>Persepolis burned</b><span>Alexander&#x27;s army burns the palaces of Persepolis. Later Zoroastrian tradition blames him for destroying the Avesta.</span></li><li><span class="ftl-y">224 CE</span><b>Sasanian Empire</b><span>Ardashir I founds a dynasty that supports a state Mazdean priesthood for four centuries.</span></li><li><span class="ftl-y">c. 5th–6th century CE</span><b>A script for the Avesta</b><span>Priests create the Avestan alphabet and write down the liturgy (date uncertain).</span></li><li><span class="ftl-y">651 CE</span><b>Arab conquest</b><span>The last Sasanian king dies; over the following centuries much of the written Avesta is lost.</span></li><li><span class="ftl-y">9th–10th century CE</span><b>Pahlavi books</b><span>The Denkard and Bundahishn summarise the lost 21-part Avesta and record priestly tradition.</span></li><li><span class="ftl-y">8th–10th century CE</span><b>Parsis in Gujarat</b><span>Refugees settle at Sanjan, on the date range given by scholars reading the Qissa-i Sanjan.</span></li><li><span class="ftl-y">1323 CE</span><b>Oldest dated manuscripts</b><span>The priest Mihrabān Kay-Khosrow copies the Yasna and Vendidad at Cambay.</span></li><li><span class="ftl-y">1771 CE</span><b>Europe reads the Avesta</b><span>Abraham Hyacinthe Anquetil-Duperron publishes the first European translation, based on Parsi manuscripts.</span></li><li><span class="ftl-y">1886–1896 CE</span><b>Geldner&#x27;s edition</b><span>Karl Friedrich Geldner publishes the standard critical edition, still in use today.</span></li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">6 min read · 1,238 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Zoroastrianism"><button type="button" class="wtoc-i" data-go="zoroastrianism-s1">A faith older than its books</button><button type="button" class="wtoc-i" data-go="zoroastrianism-s2">When did Zarathustra live?</button><button type="button" class="wtoc-i" data-go="zoroastrianism-s3">The Wise Lord on a Persian cliff</button><button type="button" class="wtoc-i" data-go="zoroastrianism-s4">How the Avesta was written, and how it was lost</button><button type="button" class="wtoc-i" data-go="zoroastrianism-s5">The manuscripts that survive</button><button type="button" class="wtoc-i" data-go="zoroastrianism-s6">What remains open</button></nav></div><section class="wsec" id="zoroastrianism-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A faith older than its books</h3><p>Imagine a hymn that is sung every day for two thousand years before anyone writes it down. That is the story Zoroastrian priests tell about the Gathas, seventeen short poems attributed to the prophet Zarathustra (Zoroaster to the Greeks). They were composed in Old Avestan, a language so archaic that it sits beside the Sanskrit of the Rigveda like a sibling. They were memorised, recited in ritual, and passed from priest to priest across empires, conquests and migrations.</p><p>Zoroastrianism is today one of the smallest world religions, with about 110,000 to 125,000 followers according to a 2012 FEZANA survey, most of them Parsis in India and Zoroastrians in Iran and the diaspora. Yet it once shaped the court religion of three Persian empires, and its ideas about a final judgement, a bridge the soul must cross and the renewal of the world have echoes far beyond Iran. Whether those echoes are inheritance or coincidence is one of the great open questions of religious history.</p><p>This page follows the site&#x27;s rule for every tradition: first the faith in its own words, then the historical record. Claims about Ahura Mazda, revelation and the afterlife are matters of faith and are not rated. Claims about people, places, dates and manuscripts are rated on the evidence, and the texts are scored only on how much of them survives and how close the surviving copies stand to the original, never on whether they are true.</p><blockquote class="wpull"><p>The Gathas are the rare case where memory, not parchment, carried a text across two thousand years.</p></blockquote></section><section class="wsec" id="zoroastrianism-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>When did Zarathustra live?</h3><p>No inscription, seal or grave names Zarathustra. Everything we know comes from the Gathas themselves and from much later tradition. That leaves a remarkable spread of dates. Greek writers such as Xanthus and Eudoxus placed him 6,000 years before Xerxes, which most scholars now read as a misunderstanding of Zoroastrian world-ages. Medieval Zoroastrian tradition put him &#x27;258 years before Alexander&#x27;, around the 6th century BCE, which fits the Persian kings but not the language of the hymns.</p><p>The philologists&#x27; argument runs the other way. Old Avestan is so close to Vedic Sanskrit that the two cannot have separated long before the Gathas were composed. The hymns speak of cattle, pastures and raiding, with no cities, no kings of the Persian kind and no iron. Mary Boyce argued for a date between about 1700 and 1000 BCE; most scholars today place the Gathas between about 1500 and 900 BCE, with a minority holding out for later. The honest summary is a range of several centuries, and the place is just as uncertain: Bactria, Chorasmia, Sistan and the Central Asian steppe all have supporters.</p><aside class="wcall"><b>How do we know?</b><p>Dating by language works like dating by accent. Old Avestan and Vedic Sanskrit share sounds, grammar and even whole poetic phrases. Since the Rigveda is usually dated c. 1500–1100 BCE, and the Gathas are at a similar stage of development, most linguists place them in the same broad era. The method gives a window of centuries, never a year, and it is open to challenge if the Rigveda&#x27;s own dates move.</p></aside></section><section class="wsec" id="zoroastrianism-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The Wise Lord on a Persian cliff</h3><p>The first time the Wise Lord appears in a text we can date to the year is on a cliff at Behistun in western Iran. Around 520 BCE Darius I had his victory over rivals carved in three languages beside a relief of himself and a winged figure. Again and again the text credits Ahuramazda for his throne.</p><blockquote class="quote"><p>Saith Darius the King: By the favor of Ahuramazda I am King; Ahuramazda bestowed the kingdom upon me.</p><cite>Behistun inscription, DB I §5, trans. R. G. Kent, Old Persian (American Oriental Society, 1953)</cite></blockquote><p>So the Wise Lord was worshipped at the Persian court by the late 6th century BCE. But here the record turns puzzling. Darius never names Zarathustra, and later kings also honour Mithra and Anahita. Herodotus describes Persian Magi and fire rites but not a prophet. Some historians see Achaemenid religion as an early, royal form of Zoroastrianism; others see a related Iranian religion that shared the Wise Lord without the prophet&#x27;s reform. Both readings fit the surviving evidence.</p></section><section class="wsec" id="zoroastrianism-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>How the Avesta was written, and how it was lost</h3><p>For most of its history, the Avesta existed only in memory. Priests learned the sounds precisely because a mispronounced prayer was thought to lose its power. When the Sasanian dynasty (224–651 CE) organised a state priesthood, someone designed a new alphabet, adapted from the Pahlavi script but with many extra vowel signs, to capture that exact pronunciation. The date is not recorded; scholars usually place it in the 5th or 6th century CE. The German scholars Karl Hoffmann and Johanna Narten showed that every surviving manuscript descends from one written Sasanian master copy, now lost.</p><p>That master Avesta was huge. The Denkard, a 9th–10th century encyclopedia in Middle Persian, describes it in 21 books (nasks) covering liturgy, law, cosmology and legend. Only a fraction survives: roughly a quarter of the Avestan passages quoted by those medieval commentators can be found in the texts we have. The rest disappeared after the Arab conquest of Iran in the 7th century, as the community shrank, priests fled, and only texts in daily ritual use kept being copied.</p><p>Zoroastrian tradition also blames Alexander, who burned Persepolis in 330 BCE. The burning is well attested. The idea that an Avesta written in gold on prepared ox hides perished there comes from books written over a thousand years later, and most historians doubt that a full written Avesta existed so early. Here the tradition may remember a real trauma, the fall of the Persian Empire, while placing the loss of the book too early.</p><blockquote class="wpull"><p>What survives is not the whole Avesta but the part the priests could never stop saying aloud.</p></blockquote></section><section class="wsec" id="zoroastrianism-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The manuscripts that survive</h3><p>The oldest dated Avestan manuscripts were copied in 1323 and 1324 CE by a single priest, Mihrabān Kay-Khosrow, working at Cambay in Gujarat. Two are copies of the Yasna with a Pahlavi translation, now in Oxford (J2) and Copenhagen (K5); two are copies of the Vendidad, in London (L4) and Copenhagen (K1). Their colophons give the dates and the scribe&#x27;s name. An older fragment, from Dunhuang in western China around 800 CE or later, preserves a single Avestan prayer written in the Sogdian script, a reminder of how far Iranian religion travelled along the Silk Road.</p><p>More than 300 Avestan manuscripts are now known, divided into an Indian branch, copied by Parsi priests, and an Iranian branch. Karl Friedrich Geldner used about 133 of them for his edition (1886–96), still the standard text. New projects, such as the Avestan Digital Archive and the Corpus Avesticum, are photographing hundreds of manuscripts and rethinking Geldner&#x27;s choices, especially by paying attention to how the texts were actually used in ritual.</p><ul class="wlist"><li>Strength of the record: the Gathas keep their metre and archaic grammar, which heavy editing would have destroyed.</li><li>Weakness of the record: the written tradition begins about two thousand years after composition, and its archetype is lost.</li><li>Loss: most of the Sasanian Avesta survives only as summaries in Pahlavi books.</li></ul></section><section class="wsec" id="zoroastrianism-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What remains open</h3><p>Three questions remain genuinely unsettled. First, Zarathustra&#x27;s date and homeland: a securely dated find naming him, or new linguistic anchors, would narrow a window that currently spans centuries. Second, the religion of the Achaemenid kings: more of the Persepolis Fortification Tablets, the Elamite administrative archive that records offerings to many gods including Ahura Mazda, are still being published. Third, the question of influence on the Abrahamic faiths, which depends on dating Zoroastrian ideas more precisely than the late manuscripts allow.</p><p>What is not in doubt is the tenacity of the tradition. A small priesthood carried a hymn book in memory through the rise and fall of empires, then copied it by hand in exile. The Gathas may be the finest example on Earth of oral preservation checked, much later, by writing. For a site that treats religions as the oldest way of keeping account of history, the Avesta is a humbling witness: fragile on parchment, astonishingly durable in the mouth.</p></section><details class="srcs"><summary>Sources for this tradition (15)</summary><ol><li>Boyce, Mary (1979). Zoroastrians: Their Religious Beliefs and Practices. London: Routledge.</li><li>Stausberg, Michael and Vevaina, Yuhan Sohrab-Dinshaw (eds) (2015). The Wiley Blackwell Companion to Zoroastrianism. Chichester: Wiley Blackwell. <a href="https://doi.org/10.1002/9781118785539" target="_blank" rel="noopener">doi:10.1002/9781118785539</a></li><li>Skjærvø, Prods Oktor (2011). The Spirit of Zoroastrianism. New Haven: Yale University Press.</li><li>Humbach, Helmut (1991). The Gāthās of Zarathus
