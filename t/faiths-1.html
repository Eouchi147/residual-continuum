hanism.</li><li>Darkness in a deep sea, wave above wave (24:40). Sunlight fades to nothing below about 1,000 metres, and the ocean&#x27;s density layers carry internal waves, hundreds of metres tall, beneath the surface waves. Established. The verse is a simile for deeds that come to nothing. Sailors and the pearl divers of the Gulf, who worked to about 20 metres, knew the sea darkens with depth; the wave-beneath-a-wave reading was proposed after oceanographers measured internal waves in the 20th century. Accurate; whether it was unknowable is the open part.</li><li>Mountains passing like clouds (27:88). The plates that carry mountains move, one to ten centimetres a year. Established. Almost all classical commentators, and the surrounding verses, place this scene on the Day of Judgement, when the mountains are set moving (81:3; 20:105). Plate tectonics as a reading dates from the 1970s.</li><li>Skins renewed to taste the punishment (4:56). Pain receptors are densest in the skin, and a full-thickness burn that destroys them can leave the burned area numb. Established. The verse describes the hereafter. That the skin is where burns hurt was known to every physician of antiquity, Galen included; the cellular detail is modern. The match is real; its novelty is the part that can be argued.</li><li>A lying, sinning forelock (96:15–16). Imaging studies find the prefrontal cortex, behind the forehead, at work in planning, self-control and deliberate deception; strong evidence, though no single &quot;lying centre&quot; exists. In Arabic, to seize someone by the forelock is to have them at your mercy, and the verse, about an opponent of the Prophet, uses the forelock for the man himself, as classical readers say. The neuroscience reading is a modern addition to the idiom.</li><li>The bee, in the feminine (16:68–69). The workers that build, forage and make honey are all female. Established. The verse&#x27;s commands to the bee are feminine. Arabic gives feminine agreement to many animal collectives, so the grammar alone does not settle what the first hearers understood; the ant of 27:18 speaks in the feminine too. In Europe the ruler was called a king until Luis Méndez de Torres (1586) and Charles Butler (1609) called her a queen, and Jan Swammerdam found her ovaries under the microscope in 1673.</li><li>Fertilising winds and plants in pairs (15:22; 20:53; 13:3). Wind carries the pollen of grasses, conifers, oaks and date palms, and many plants have separate sexes. Established. Date growers in Mesopotamia hand-pollinated female palms with male flowers from at least the third millennium BCE, the Code of Hammurabi mentions the practice, and the oases of Arabia had done the same for centuries before the Quran. Classical commentators read the winds as impregnating the clouds with rain, or the trees; both readings are old.</li></ul><p>Taken together, the record is mixed in an honest way. In every case the science named in these readings is sound, and nothing in the list contradicts the Quran. What varies is the second question. For the bee, the palm, the burning skin and the dark sea, the seventh century already knew the plain fact, or could have. For the sun, the mountains and the forelock, the match depends on giving an old word a meaning its first readers did not give it. For time and the sky, the likeness is real but general. Whether such matches show divine origin is a judgement of faith, on which believers and sceptics part company before any evidence is weighed, and this page does not rate it. It rates only what can be measured: accurate where checked, not shown to be unknowable, and still argued among Muslim scholars themselves.</p><blockquote class="wpull"><p>The verses are not on trial here. The modern claim about them is, and it is weighed the way every claim on this site is weighed.</p></blockquote></section><details class="srcs"><summary>Sources for this tradition (42)</summary><ol><li>Sadeghi B., Goudarzi M. (2012). Ṣan&#x27;ā&#x27; 1 and the origins of the Qur&#x27;ān. Der Islam 87(1–2): 1–129. <a href="https://doi.org/10.1515/islam-2011-0025" target="_blank" rel="noopener">doi:10.1515/islam-2011-0025</a></li><li>Sadeghi B., Bergmann U. (2010). The codex of a companion of the Prophet and the Qur&#x27;ān of the Prophet. Arabica 57(4): 343–436. <a href="https://doi.org/10.1163/157005810X504518" target="_blank" rel="noopener">doi:10.1163/157005810X504518</a></li><li>Motzki H. (2001). The collection of the Qur&#x27;ān: a reconsideration of Western views in light of recent methodological developments. Der Islam 78(1): 1–34. <a href="https://doi.org/10.1515/islm.2001.78.1.1" target="_blank" rel="noopener">doi:10.1515/islm.2001.78.1.1</a></li><li>Hilali A. (2017). The Sanaa Palimpsest: The Transmission of the Qur&#x27;an in the First Centuries AH. Oxford University Press, in association with the Institute of Ismaili Studies.</li><li>Van Putten M. (2019). &#x27;The Grace of God&#x27; as evidence for a written Uthmanic archetype: the importance of shared orthographic idiosyncrasies. Bulletin of the School of Oriental and African Studies 82(2): 271–288.</li><li>Déroche F. (2014). Qur&#x27;ans of the Umayyads: A First Overview. Brill.</li><li>Cook M. (2004). The stemma of the regional codices of the Koran. Graeco-Arabica 9–10: 89–104.</li><li>Sinai N. (2017). The Qur&#x27;an: A Historical-Critical Introduction. Edinburgh University Press.</li><li>Nasser S. H. (2013). The Transmission of the Variant Readings of the Qur&#x27;ān. Brill.</li><li>University of Birmingham (22 July 2015). Birmingham Qur&#x27;an manuscript dated among the oldest in the world. Press release; Cadbury Research Library, Mingana Collection.</li><li>Universität Tübingen (2014). Rare early Koran manuscript dated to the time of the Prophet&#x27;s companions (Ma VI 165). Press release; Corpus Coranicum, Berlin-Brandenburg Academy of Sciences.</li><li>Whelan E. (1998). Forgotten witness: evidence for the early codification of the Qur
