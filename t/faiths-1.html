htra and the Other Old Avestan Texts. Heidelberg: Carl Winter.</li><li>Hoffmann, Karl and Narten, Johanna (1989). Der Sasanidische Archetypus: Untersuchungen zu Schreibung und Lautgestalt des Avestischen. Wiesbaden: Reichert.</li><li>Hintze, Almut. &#x27;Introduction, Part 4: Avestan manuscripts&#x27;. Avestan grammar project, University of Göttingen (spw.uni-goettingen.de).</li><li>Encyclopaedia Iranica, &#x27;Codices Hafnienses&#x27; (Copenhagen Avestan and Pahlavi manuscripts K1, K5, K7).</li><li>Kellens, Jean (1987). &#x27;Avesta, the holy book of the Zoroastrians&#x27;. Encyclopaedia Iranica, vol. III.</li><li>Geldner, Karl Friedrich (1886–1896). Avesta: The Sacred Books of the Parsis. 3 vols. Stuttgart: Kohlhammer.</li><li>Cantera, Alberto (dir.). Avestan Digital Archive and Corpus Avesticum Berolinense (online manuscript images and editions).</li><li>Schmitt, Rüdiger (1991). The Bisitun Inscriptions of Darius the Great: Old Persian Text. Corpus Inscriptionum Iranicarum. London: SOAS.</li><li>Kent, Roland G. (1953). Old Persian: Grammar, Texts, Lexicon. 2nd ed. New Haven: American Oriental Society.</li><li>UNESCO World Heritage Centre (2006). &#x27;Bisotun&#x27;.</li><li>Rivetna, Roshan (2013). &#x27;The Zarathushti World: a 2012 demographic picture&#x27;. FEZANA Journal, Fall 2013.</li><li>Anquetil-Duperron, Abraham Hyacinthe (1771). Zend-Avesta, ouvrage de Zoroastre. Paris.</li></ol></details><aside class="rc-cite" data-v="faiths" data-id="faith-zoroastrianism" data-t="Zoroastrianism"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Zoroastrianism</i>. <span class="cite-u">https://residualcontinuum.com/#faiths/faith-zoroastrianism</span> (updated 25 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="faith-judaism-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Aleppo Codex (Deut).jpg" data-cap="The Aleppo Codex, a Masoretic Bible of the 10th century CE (Deuteronomy)" data-big><figcaption></figcaption></figure><div class="sh-k">Land of Israel</div><h2 class="sh-t" id="faith-judaism-st" tabindex="-1">Judaism</h2><p class="sh-s">One of the oldest living scriptural traditions, whose Hebrew texts can be checked against scrolls copied more than two thousand years ago.</p><div class="sh-v"><span class="vstamp vstamp--when">from c. 1200 BCE</span></div></div><div class="f-facts"><div><span>Began</span><b>Land of Israel (ancient Canaan), centred on Jerusalem</b><small>Israel attested c. 1208 BCE; rabbinic Judaism formed 1st–6th centuries CE</small></div><div><span>Followers today</span><b>about 14.8 million</b><small>Pew Research Center, 2020 estimate (report published June 2025)</small></div></div><h3 class="sub-h wsub">In its own words</h3><blockquote class="quote f-own"><p>Judaism begins with a covenant. The one God, creator of heaven and earth, chose Abraham and his descendants, brought the people of Israel out of slavery in Egypt, and at Mount Sinai gave them the Torah: a way of life, not only a book. &quot;Hear, O Israel: The LORD is our God, the LORD alone&quot; (Deuteronomy 6:4, NRSV). With the written Torah came an oral teaching that explains how to live it, handed from teacher to student and later set down in the Mishnah and the Talmud. To be Jewish is to belong to a people and to carry that covenant through history: to study, to keep the commandments, to pursue justice, to remember, and to hope for a world repaired, which many await in the days of the Messiah.</p><cite>How a follower might put it, in our words</cite></blockquote><h3 class="sub-h wsub">What it teaches and claims</h3><p class="rd-rule">Claims about God, revelation, the soul or miracles are matters of faith and are not rated. Claims about people, places, events and texts are weighed on the evidence.</p><ul class="rds"><li class="rd"><p class="rd-s">God made an everlasting covenant with Abraham and his descendants.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">The founding promise of Jewish scripture: land, descendants and a relationship with God. It is a matter of faith; whether Abraham himself can be traced in the historical record is weighed separately below. <span class="cite">Genesis 12:1–3; 15; 17 (NRSV)</span></p></li><li class="rd"><p class="rd-s">God gave the Torah to Moses at Mount Sinai.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">The heart of Jewish belief and practice. Rabbinic chronology places the giving of the Torah about 1313 BCE. Revelation is a matter of faith and is not rated here. <span class="cite">Exodus 19–20; Seder Olam Rabbah</span></p></li><li class="rd"><p class="rd-s">An Oral Torah was given alongside the written Torah and handed down teacher to student.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">Historians can follow the written record of this teaching from the Mishnah (c. 200 CE) onward; the belief that it reaches back to Sinai is held in faith. <span class="cite">Mishnah Avot 1:1</span></p></li><li class="rd"><p class="rd-s">Moses wrote down the whole Torah in the late 2nd millennium BCE.</p><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span><p class="rd-n">No inscription, manuscript or linguistic layer of the Torah has been traced that early; the oldest Hebrew writing is about 10th century BCE. Most critical scholars see a composite text finalised by c. 400 BCE. Traditional scholars reply that later scribes may have updated spelling and language. <span class="cite">Schmid 2012; Baden 2012; Talmud Bava Batra 14b–15a</span></p></li><li class="rd"><p class="rd-s">A people called Israel lived in Canaan by about 1200 BCE.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">The Merneptah Stele (c. 1208 BCE) names Israel as a people in Canaan, and hundreds of small highland villages appear in the same age. <span class="cite">Merneptah Stele, Egyptian Museum, Cairo; Dever 2003</span></p></li><li class="rd"><p class="rd-s">Kings of the house of David ruled Judah from Jerusalem.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">The Tel Dan Stele (9th century BCE) names a &quot;House of David&quot; beside a king of Israel; Assyrian records name later Judean kings such as Hezekiah. How large David&#x27;s own kingdom was remains debated. <span class="cite">Biran and Naveh 1993, 1995</span></p></li><li class="rd"><p class="rd-s">Babylon destroyed the First Temple and exiled Judah&#x27;s leaders in the early 6th century BCE.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">Babylonian chronicles, ration tablets naming King Jehoiachin, burn layers in Jerusalem and tablets from the Judean exile community agree with the biblical account in outline. <span class="cite">Weidner 1939; Pearce and Wunsch 2014</span></p></li><li class="rd"><p class="rd-s">Rome destroyed the Second Temple in 70 CE.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">Described by the eyewitness historian Josephus, commemorated on the Arch of Titus in Rome, and visible in the burnt houses and toppled stones of 1st-century Jerusalem. <span class="cite">Josephus, Jewish War 6</span></p></li><li class="rd"><p class="rd-s">A Messiah descended from David will come and bring an age of peace.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">Listed by Maimonides among his thirteen principles of faith, and understood in many different ways across Jewish movements. It is a hope about the future, not a historical claim. <span class="cite">Isaiah 11; Maimonides, Commentary on the Mishnah, Sanhedrin 10</span></p></li></ul><h3 class="sub-h wsub">History, weighed</h3><ul class="rds"><li class="rd"><p class="rd-s">Israel existed as a people in Canaan by about 1208 BCE.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">Pharaoh Merneptah&#x27;s victory stele lists Israel among defeated peoples of Canaan, written with the sign for a people rather than a city. It is the oldest known mention of Israel outside the Bible and fits the spread of new highland villages around 1200 BCE. <span class="cite">Hasel 1994; Pritchard 1969</span></p></li><li class="rd"><p class="rd-s">Kings of Israel and Judah named in the Bible appear in foreign records.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">Assyrian inscriptions name Omri, Ahab, Jehu, Hezekiah and others; the Moabite Mesha Stele (c. 840 BCE) names Omri, Israel and YHWH. The order and approximate dates fit the Books of Kings closely from the 9th century BCE onward. <span class="cite">Kurkh Monolith; Black Obelisk; Mesha Stele (Louvre); Sennacherib&#x27;s annals</span></p></li><li class="rd"><p class="rd-s">A dynasty known as the House of David ruled Judah by the 9th century BCE.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">The Aramaic Tel Dan Stele, found in 1993–94 and probably set up by Hazael of Damascus, reads &quot;bytdwd&quot;, most scholars say &quot;House of David&quot;. A minority read it differently because the words are not separated. It supports a remembered founder, not the details of his reign. <span class="cite">Biran and Naveh 1993, 1995</span></p></li><li class="rd"><p class="rd-s">David and Solomon ruled a large, wealthy united kingdom in the 10th century BCE.</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">Archaeologists divide. Finkelstein&#x27;s lower chronology sees 10th-century Jerusalem as a modest highland town; Mazar and Garfinkel point to Khirbet Qeiyafa and monumental building. Large-scale 10th-century copper mining in the Arabah shows the region was busier than once thought. <span class="cite">Finkelstein and Silberman 2001; Garfinkel and Ganor 2009</span></p></li><li class="rd"><p class="rd-s">Judah&#x27;s king and elite were exiled to Babylon in the 6th century BCE.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">Cuneiform ration lists from Babylon, dated around 592/591 BCE, name &quot;Ya&#x27;ukinu, king of the land of Yahudu&quot; and his sons. Tablets from a village called Al-Yahudu (&quot;Judah-town&quot;) record exiled families from 572 BCE onward. <span class="cite">Weidner 1939; Pearce and Wunsch 2014</span></p></li><li class="rd"><p class="rd-s">Abraham, Isaac and Jacob were historical individuals of the 2nd millennium BCE.</p><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span><p class="rd-n">No inscription or site names them. Some customs fit the 2nd millennium; other details, such as Philistines and domesticated camels in the stories, fit the 1st millennium better. Family figures of this kind rarely leave traces, so absence is weak evidence. <span class="cite">Finkelstein and Silberman 2001; Hoffmeier 1997</span></p></li><li class="rd"><p class="rd-s">The whole people of Israel, some 600,000 men plus families, left Egypt in the Late Bronze Age.</p><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span><p class="rd-n">No Egyptian record or Sinai campsite of that scale has been found. Semitic-speaking people did live in the Nile Delta, and many scholars think a smaller group&#x27;s memory may lie behind the story. See the Exodus case file. <span class="cite">Hoffmeier 1997; Levy, Schneider and Propp 2015</span></p></li><li class="rd"><p class="rd-s">Israel took Canaan in a swift military campaign led by Joshua.</p><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span><p class="rd-n">Hazor was burned in the 13th century BCE, which some excavators attribute to Israelites. But Jericho and Ai were largely unoccupied then, and most highland villages show continuity with Canaanite culture. The slower picture in the Book of Judges fits the evidence better. <span class="cite">Ben-Tor 1998; Kenyon 1957; Dever 2003</span></p></li><li class="rd"><p class="rd-s">The Hebrew Bible was invented wholesale in the Hellenistic age, with no older sources.</p><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span><p class="rd-n">Copies of Samuel and Exodus from about 250 BCE already show a long copying history, the Ketef Hinnom amulets carry the Priestly Blessing centuries earlier, and the Bible&#x27;s Iron Age kings match contemporary inscriptions. Much editing happened late; invention from nothing does not fit. <span class="cite">Barkay et al. 2004; Tov 2012</span></p></li></ul><h3 class="sub-h wsub">The texts and what survives of them</h3><p class="rd-rule">The textual record measures what survives and how close it is to the original. It says nothing about whether a text is true or inspired.</p><section class="txt"><h4 class="txt-h">The Hebrew Bible (Tanakh: Torah, Prophets, Writings)</h4><ol class="jr" aria-label="How The Hebrew Bible (Tanakh: Torah, Prophets, Writings) reached us"><li class="jr-s"><span>Composed</span><b>c. 10th–2nd century BCE (scholarly estimate; some poems may be older); tradition: Torah given c. 1313 BCE</b></li><li class="jr-gap jr-gap--none"><span>copies survive from within the period of composition</span></li><li class="jr-s"><span>Oldest surviving copy</span><b>late 7th–early 6th century BCE</b><small>Ketef Hinnom silver amulets (Priestly Blessing, Numbers 6:24–26)</small></li><li class="jr-s jr-today"><span>Today</span><b>Read in the language of its source</b></li></ol><div class="rec"><div class="rec-r"><span>Closeness to the source</span><span class="rec-b" role="img" aria-label="Closeness to the source: 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><b>2</b></div><div class="rec-r"><span>Source&#x27;s own language</span><span class="rec-b" role="img" aria-label="Source&#x27;s own language: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Gap to oldest copy</span><span class="rec-b" role="img" aria-label="Gap to oldest copy: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Early witnesses</span><span class="rec-b" role="img" aria-label="Early witnesses: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Stability of the text</span><span class="rec-b" role="img" aria-label="Stability of the text: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Documented history</span><span class="rec-b" role="img" aria-label="Documented history: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-tot"><span>Textual record</span><b>22<small>/30</small></b></div></div><p class="rec-why">Gap 5: the oldest witnesses (Ketef Hinnom c. 600 BCE, Qumran copies from c. 250 BCE) overlap the end of composition, though for the oldest books the wait for a full manuscript is centuries. Language 5: Hebrew and Aramaic, the languages in which the books were composed, still read aloud. Witnesses 4: hundreds of copies, but mostly fragmentary and from one region. Stability 3: variant editions before c. 100 CE; very stable after. Documented 3: the Masoretic stage is well recorded, earlier editing is reconstructed. Some scholars would score stability 4. Source 2: tradition holds that Moses wrote the Torah and the prophets spoke their books; historians see a collection composed, edited and compiled by many hands over centuries, so the tradition would score this 5.</p><dl class="txt-dl"><div><dt>Language of the text</dt><dd>Biblical Hebrew, with some chapters in Aramaic (Daniel, Ezra)</dd></div><div><dt>Composed</dt><dd>c. 10th–2nd century BCE (scholarly estimate; some poems may be older); tradition: Torah given c. 1313 BCE</dd></div><div><dt>Handed down</dt><dd>Stories, laws, songs and prophecies were told and taught long before they were written; scholars think many passages, like the Song of Deborah (Judges 5), began as oral poetry. Tradition holds the Torah was written by Moses from the start.</dd></div><div><dt>Fixed in writing</dt><dd>The consonantal text was standardised in the proto-Masoretic form by about the 1st century CE. The Masoretes of Tiberias (c. 7th–10th centuries CE) added vowel signs, accents and marginal notes; the Aleppo Codex is their model copy.</dd></div><div><dt>Oldest surviving copy</dt><dd>Ketef Hinnom silver amulets (Priestly Blessing, Numbers 6:24–26), late 7th–early 6th century BCE (palaeography and archaeological context (Barkay et al., 2004); a minority of scholars allow a later date)</dd></div><div><dt>Oldest complete copy</dt><dd>Leningrad Codex (Firkovich B 19 A), 1008 or 1009 CE</dd></div><div><dt>Early witnesses</dt><dd>About 220 biblical manuscripts among the roughly 800–900 Dead Sea Scrolls (c. 250 BCE–68 CE), covering every book except Esther, plus scrolls from Masada and other Judean Desert caves; the Greek Septuagint and the Samaritan Pentateuch as independent witnesses; thousands of Cairo Genizah fragments; and the medieval Masoretic codices (Aleppo c. 920–930, Leningrad 1008).</dd></div></dl><div class="face"><div class="face-c face-m"><span class="face-k">How the tradition sees its text</span><p>In Jewish tradition the Torah was given by God to Moses letter by letter, and scribes have guarded it with strict rules: a Torah scroll with a single wrong letter may not be read in public until corrected. The Prophets and Writings were written by prophets and sages under divine inspiration. Maimonides relied on the Aleppo Codex as the model for Torah scrolls.</p></div><div class="face-c face-x"><span class="face-k">What manuscript scholarship shows</span><p>Scholars read the Hebrew Bible as a library written, edited and collected over many centuries, from the Iron Age kingdoms to the 2nd century BCE. The Dead Sea Scrolls show that before the 1st century CE several text forms circulated together; one, the proto-Masoretic, became the standard. From then on the consonants were copied with striking care, as the agreement between Qumran, Masada and the medieval codices shows.</p></div></div><h5 class="txt-sub">Documented changes, variants and revisions</h5><ul class="txt-ch"><li>Several editions of some books circulated side by side: Qumran has a long Jeremiah matching the Masoretic text and a short one (4QJer-b, 4QJer-d) matching the Septuagint, roughly one-seventh shorter (Tov 2012).</li><li>The Great Isaiah Scroll (c. 150–100 BCE) differs from the Masoretic text in more than 2,600 places, mostly spelling, grammar and single words; the second Isaiah scroll from Cave 1 (1QIsa-b) is much closer to the medieval text.</li><li>The Samaritan Pentateuch differs from the Masoretic text in about 6,000 places, mostly spelling, and adds a commandment to build an altar on Mount Gerizim; it agrees with the Septuagint in about 1,900 of those places.</li><li>Between about the 7th and 10th centuries CE the Masoretes added vowels and accents, fixing pronunciation and meaning in places where the consonants alone allowed more than one reading.</li><li>The rabbis themselves recorded places where the written and the read text differ (ketiv and qere) and a traditional list of scribal corrections (tiqqune soferim).</li></ul></section><section class="txt"><h4 class="txt-h">The Mishnah</h4><ol class="jr" aria-label="How The Mishnah reached us"><li class="jr-s"><span>Composed</span><b>c. 70–220 CE; edited under Rabbi Judah ha-Nasi, c. 200 CE</b></li><li class="jr-gap jr-gap--long"><span>about 730 years with no surviving copy</span></li><li class="jr-s"><span>Oldest surviving copy</span><b>10th century CE</b><small>Cairo Genizah fragments</small></li><li class="jr-s jr-today"><span>Today</span><b>Read in the language of its source</b></li></ol><div class="rec"><div class="rec-r"><span>Closeness to the source</span><span class="rec-b" role="img" aria-label="Closeness to the source: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Source&#x27;s own language</span><span class="rec-b" role="img" aria-label="Source&#x27;s own language: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Gap to oldest copy</span><span class="rec-b" role="img" aria-label="Gap to oldest copy: 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><b>2</b></div><div class="rec-r"><span>Early witnesses</span><span class="rec-b" role="img" aria-label="Early witnesses: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Stability of the text</span><span class="rec-b" role="img" aria-label="Stability of the text: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Documented history</span><span class="rec-b" role="img" aria-label="Documented history: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-tot"><span>Textual record</span><b>20<small>/30</small></b></div></div><p class="rec-why">Gap 2: about 730 years from editing to the oldest fragments, a gap the tradition explains by centuries of formal memorisation. Language 5: studied daily in its original Hebrew. Witnesses 3: a handful of complete manuscripts plus many fragments. Stability 4: the branches differ in wording, not in content or order. Documented 3: tradition names the editor and chain; when it was written down is unknown. Source 3: the sayings of named sages over about two centuries, arranged by Judah ha-Nasi around 200 CE.</p><dl class="txt-dl"><div><dt>Language of the text</dt><dd>Mishnaic Hebrew</dd></div><div><dt>Composed</dt><dd>c. 70–220 CE; edited under Rabbi Judah ha-Nasi, c. 200 CE</dd></div><div><dt>Handed down</dt><dd>Taught orally by generations of sages called tannaim (literally &quot;repeaters&quot;), who memorised and recited it. Rabbinic teaching held that the Oral Torah should not be written down, and scholars still debate when the Mishnah itself was first committed to writing.</dd></div><div><dt>Fixed in writing</dt><dd>Edited by Rabbi Judah ha-Nasi around 200 CE in Galilee (Beit Shearim or Sepphoris). Copyists then transmitted a Palestinian and a Babylonian branch of the text; the first printed edition appeared in Naples in 1492.</dd></div><div><dt>Oldest surviving copy</dt><dd>Cairo Genizah fragments, 10th century CE (palaeography)</dd></div><div><dt>Oldest complete copy</dt><dd>Parma A (Biblioteca Palatina, Parma), nearly complete, late 11th century CE</dd></div><div><dt>Early witnesses</dt><dd>Many Cairo Genizah fragments from the 10th century on, and a few complete or near-complete manuscripts: Parma A (late 11th century), the Kaufmann manuscript in Budapest (medieval, usually preferred as the base of critical editions) and the Cambridge (Lowe) manuscript (c. 1465). The 6th–7th century Rehov synagogue mosaic is the oldest physical witness to rabbinic law, though not to the Mishnah&#x27;s own text.</dd></div></dl><div class="face"><div class="face-c face-m"><span class="face-k">How the tradition sees its text</span><p>Tradition teaches that the Oral Torah was given at Sinai together with the written Torah, and passed from Moses to Joshua, to the elders, to the prophets and to the Great Assembly (Avot 1:1). Rabbi Judah ha-Nasi arranged it in writing because persecution and dispersion threatened memory. The Mishnah is thus the faithful record of an older chain.</p></div><div class="face-c face-x"><span class="face-k">What manuscript scholarship shows</span><p>Historians agree the Mishnah was edited around 200 CE and gathers teachings of named sages from roughly the 1st and 2nd centuries CE, with some older material. They debate how much was written and how much memorised at first. With the earliest copies some seven centuries later, the text is checked by comparing the Palestinian and Babylonian families and the Talmuds&#x27; quotations.</p></div></div><h5 class="txt-sub">Documented changes, variants and revisions</h5><ul class="txt-ch"><li>Rabbi Judah ha-Nasi selected, arranged and in places rewrote earlier teachings; the Mishnah preserves named disagreements between sages rather than one voice (Strack and Stemberger 1996).</li><li>Two textual branches, Palestinian (Kaufmann, Parma A) and Babylonian (the Mishnah as quoted in the Talmud), differ in spelling, grammar and some wording.</li><li>Printed editions from 1492 onward absorbed Babylonian forms and later corrections; critical scholars prefer the Kaufmann manuscript as a base text.</li></ul></section><section class="txt"><h4 class="txt-h">The Babylonian Talmud (Bavli)</h4><ol class="jr" aria-label="How The Babylonian Talmud (Bavli) reached us"><li class="jr-s"><span>Composed</span><b>c. 220–600 CE: sages&#x27; discussions c. 220–500 CE, anonymous final editing to c. 600 or later</b></li><li class="jr-gap "><span>about 350 years with no surviving copy</span></li><li class="jr-s"><span>Oldest surviving copy</span><b>10th century CE, possibly 9th</b><small>Cairo Genizah fragments</small></li><li class="jr-s jr-today"><span>Today</span><b>Read in the language of its source</b></li></ol><div class="rec"><div class="rec-r"><span>Closeness to the source</span><span class="rec-b" role="img" aria-label="Closeness to the source: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Source&#x27;s own language</span><span class="rec-b" role="img" aria-label="Source&#x27;s own language: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Gap to oldest copy</span><span class="rec-b" role="img" aria-label="Gap to oldest copy: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Early witnesses</span><span class="rec-b" role="img" aria-label="Early witnesses: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Stability of the text</span><span class="rec-b" role="img" aria-label="Stability of the text: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Documented history</span><span class="rec-b" role="img" aria-label="Documented history: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-tot"><span>Textual record</span><b>20<small>/30</small></b></div></div><p class="rec-why">Gap 3: roughly 300–350 years from editing to the oldest fragments; if 9th-century dates hold, the score would be 4. Language 5: studied in its original Aramaic and Hebrew. Witnesses 3: few early copies, one complete manuscript, much lost to burning. Stability 3: real variation in wording and sequence. Documented 3: tradition names the closing sages, but the editorial stages are debated. Source 3: the recorded debates of named sages over several centuries, edited in stages.</p><dl class="txt-dl"><div><dt>Language of the text</dt><dd>Jewish Babylonian Aramaic and Hebrew</dd></div><div><dt>Composed</dt><dd>c. 220–600 CE: sages&#x27; discussions c. 220–500 CE, anonymous final editing to c. 600 or later</dd></div><div><dt>Handed down</dt><dd>Formed through oral study and recitation in the academies of Babylonia. Many scholars think it continued to be transmitted largely by memory after its editing, with written copies becoming common only in the geonic period (c. 7th–11th centuries).</dd></div><div><dt>Fixed in writing</dt><dd>No single editor is named. Tradition links its closing to Rav Ashi and Ravina (c. 500 CE), followed by additions by the Savoraim. The Soncino family printed tractates from 1483, and a complete Talmud was printed in Venice in 1520–1523, fixing the page layout used ever since.</dd></div><div><dt>Oldest surviving copy</dt><dd>Cairo Genizah fragments, 10th century CE, possibly 9th (palaeography)</dd></div><div><dt>Oldest complete copy</dt><dd>Munich Codex Hebraicus 95 (Bavarian State Library), 1342 CE (colophon), written in France</dd></div><div><dt>Early witnesses</dt><dd>Genizah fragments from the 9th–10th centuries, a few dozen substantial medieval manuscripts (the oldest dated one written in 1177), and a single complete copy, Munich Cod. hebr. 95 of 1342, listed in UNESCO&#x27;s Memory of the World. Public burnings, beginning in Paris in the 1240s, destroyed much of the medieval record.</dd></div></dl><div class="face"><div class="face-c face-m"><span class="face-k">How the tradition sees its text</span><p>The Talmud is the Oral Torah in its fullest written form: the Mishnah with the Gemara, the sages&#x27; discussion of it. Tradition credits Rav Ashi and Ravina with closing it and the geonim with passing it on faithfully. Its authority rests on an unbroken chain of study more than on any one manuscript, a chain still lived in daily Talmud learning.</p></div><div class="face-c face-x"><span class="face-k">What manuscript scholarship shows</span><p>Scholars agree the Bavli took shape in Sasanian Babylonia between about 200 and 600 CE, but debate who edited it and when its wording became fixed. Fragments and manuscripts show a text stable in content yet fluid in wording. Its long oral life, the loss of eastern manuscripts, and centuries of burning and censorship make its history harder to trace than the Bible&#x27;s.</p></div></div><h5 class="txt-sub">Documented changes, variants and revisions</h5><ul class="txt-ch"><li>Anonymous editors wove the sages&#x27; short rulings into long argued discussions; scholars such as David Weiss Halivni and Shamma Friedman date much of this framing after 500 CE.</li><li>Manuscripts differ in wording, word order and sometimes the order of arguments, forming regional families (Ashkenazi, Sephardi, Yemenite); Rabbinovicz&#x27;s Dikduke Soferim began recording these variants from the 1860s.</li><li>From the 16th century Christian censors deleted or altered passages judged hostile to Christianity, notably in the Basel edition (1578–1581); some were later restored from manuscripts.</li><li>The Vilna edition (1880–1886), the standard page today, follows the printed tradition rather than the oldest manuscripts.</li></ul></section><h3 class="sub-h wsub">Through time</h3><ol class="ftl"><li><span class="ftl-y">c. 1208 BCE</span><b>Israel in stone</b><span>Pharaoh Merneptah&#x27;s stele names Israel as a people in Canaan.</span></li><li><span class="ftl-y">c. 840 BCE</span><b>Kings in foreign records</b><span>The Mesha Stele names Omri and YHWH; soon after, the Tel Dan Stele names the House of David.</span></li><li><span class="ftl-y">c. 600 BCE</span><b>Silver scrolls</b><span>Two tiny silver amulets buried at Ketef Hinnom carry the Priestly Blessing of Numbers 6:24–26.</span></li><li><span class="ftl-y">587/586 BCE</span><b>The First Temple falls</b><span>Babylon destroys Jerusalem; Judah&#x27;s leaders are exiled, as ration tablets naming King Jehoiachin already show for 592/591 BCE.</span></li><li><span class="ftl-y">539 BCE</span><b>Return</b><span>Cyrus of Persia takes Babylon; exiles begin returning and the Temple is rebuilt.</span></li><li><span class="ftl-y">3rd century BCE</span><b>Torah in Greek</b><span>Jews of Alexandria translate the Torah into Greek, the start of the Septuagint.</span></li><li><span class="ftl-y">c. 250 BCE–68 CE</span><b>The Qumran scrolls</b><span>Scribes copy the manuscripts later hidden in the caves near Qumran, including the Great Isaiah Scroll.</span></li><li><span class="ftl-y">70 CE</span><b>The Second Temple falls</b><span>Rome destroys the Temple; study and prayer move to the centre of Jewish life.</span></li><li><span class="ftl-y">c. 200 CE</span><b>The Mishnah</b><span>Rabbi Judah ha-Nasi edits the Oral Torah into the Mishnah.</span></li><li><span class="ftl-y">c. 500–600 CE</span><b>The Babylonian Talmud</b><span>The sages&#x27; discussions in Babylonia are shaped into the Bavli.</span></li><li><span class="ftl-y">c. 920–930 CE</span><b>The Aleppo Codex</b><span>Scribes in Tiberias produce the model copy of the Masoretic Bible; about 40 percent is lost in 1947.</span></li><li><span class="ftl-y">1947</span><b>The caves speak</b><span>Bedouin shepherds find the first Dead Sea Scrolls in Qumran Cave 1.</span></li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">7 min read · 1,486 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Judaism"><button type="button" class="wtoc-i" data-go="judaism-s1">A people who kept their records</button><button type="button" class="wtoc-i" data-go="judaism-s2">The tradition&#x27;s own account</button><button type="button" class="wtoc-i" data-go="judaism-s3">Scrolls from the caves</button><button type="button" class="wtoc-i" data-go="judaism-s4">From many texts to one</button><button type="button" class="wtoc-i" data-go="judaism-s5">Who wrote the Torah?</button><button type="button" class="wtoc-i" data-go="judaism-s6">Stones that name the kings</button><button type="button" class="wtoc-i" data-go="judaism-s7">Where the record falls silent</button></nav></div><section class="wsec" id="judaism-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A people who kept their records</h3><p>Few peoples have carried their memory as far as the Jews. The same Hebrew words are read aloud in a synagogue in Buenos Aires this week and were copied onto leather in a desert cave more than two thousand years ago. Judaism is not only a faith in one God; it is a people&#x27;s long conversation with a text, and with the history that text describes.</p><p>That makes it a natural place to ask the questions this section asks of every tradition. What does the tradition say about its own scriptures? What survives, and how close is it to the first writing? And which of the historical events the texts describe can be checked in the ground, in foreign archives or in the scrolls themselves?</p><blockquote class="quote"><p>Hear, O Israel: The LORD is our God, the LORD alone.</p><cite>Deuteronomy 6:4, New Revised Standard Version (1989)</cite></blockquote><p>The answers are unusually rich, and in places unusually warm. Stones name Israel&#x27;s kings, Babylonian clerks record rations for an exiled king of Judah, and the scrolls from the Judean Desert let us watch the Bible&#x27;s text while it was still being copied by hand in the age of the Maccabees.</p></section><section class="wsec" id="judaism-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The tradition&#x27;s own account</h3><p>In Jewish teaching the Torah, the five books of Moses, was given by God at Sinai. Rabbinic chronology places the moment about 1313 BCE. Alongside the written Torah came an oral one: the explanations, laws and methods that tell a reader how to live the text. The Mishnah opens its tractate on the fathers with a chain of transmission.</p><blockquote class="quote"><p>Moses received the Law from Sinai and committed it to Joshua, and Joshua to the elders, and the elders to the Prophets; and the Prophets committed it to the men of the Great Synagogue.</p><cite>Mishnah Avot 1:1, trans. Herbert Danby (Oxford, 1933)</cite></blockquote><p>The Prophets and the Writings, the other two parts of the Tanakh, were written by prophets and sages, and the tradition credits the sages with deciding which books belonged. Scribal law is strict: a Torah scroll with a single wrong or missing letter may not be read in public until it is corrected. The medieval scholar Maimonides named one manuscript, the codex later known as the Aleppo Codex, as the model for copyists.</p><p>The Talmud itself is candid about details. It records a view that Joshua wrote the last eight verses of Deuteronomy, which describe Moses&#x27;s death, and it lists places where the written consonants and the traditional reading differ. The tradition, in other words, has long paid close attention to its own text.</p></section><section class="wsec" id="judaism-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Scrolls from the caves</h3><p>In 1947 Bedouin shepherds entered a cave near Qumran, above the Dead Sea, and found jars holding leather scrolls. Over the next decade eleven caves gave up the remains of roughly 800 to 900 manuscripts. About 220 of them are copies of biblical books, covering every book of the Hebrew Bible except Esther. They were copied between about 250 BCE and 68 CE, a thousand years before the oldest complete Hebrew Bibles then known.</p><p>The star is the Great Isaiah Scroll (1QIsa-a): seventeen sheets of parchment, about 7.3 metres long, holding all 66 chapters of Isaiah in 54 columns. Palaeography places it around 150–100 BCE, and two radiocarbon tests gave calibrated ranges between 356 and 103 BCE. Set beside the Leningrad Codex of 1008 CE, it differs in more than 2,600 places, but most are spelling, grammar or single words. A reader of one can follow the other line by line.</p><aside class="wcall"><b>How do we know?</b><p>Dates for the scrolls come from three independent methods: the evolving shapes of Hebrew letters (palaeography), radiocarbon tests on the parchment, and the archaeology of Qumran, which was destroyed by Roman troops around 68 CE. In 2025 a team led by Mladen Popović combined radiocarbon dates with an AI model of handwriting called Enoch; it placed a Daniel fragment (4Q114) at about 230–160 BCE, possibly within the lifetime of the book&#x27;s author. Handwriting dates remain estimates, not certainties.</p></aside><p>Older still are two tiny silver amulets from a burial cave at Ketef Hinnom in Jerusalem, found in 1979 by Gabriel Barkay&#x27;s team. Unrolled and re-read with modern imaging in 2004, they carry a version of the Priestly Blessing that Jewish congregations still hear today.</p><blockquote class="quote"><p>The LORD bless you and keep you; the LORD make his face to shine upon you, and be gracious to you; the LORD lift up his countenance upon you, and give you peace.</p><cite>Numbers 6:24–26, New Revised Standard Version (1989)</cite></blockquote><p>Most scholars date the amulets to the late 7th or early 6th century BCE, before Babylon destroyed Jerusalem, which would make them the oldest known texts that also appear in the Bible. A minority, noting the damaged script, allow a later date.</p></section><section class="wsec" id="judaism-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>From many texts to one</h3><p>The scrolls held a surprise. Before the 1st century CE, the Bible&#x27;s text was not yet single. Beside copies close to the later Masoretic text, Qumran had copies resembling the Hebrew behind the Greek Septuagint, and copies close to the Samaritan Pentateuch. Jeremiah existed in a long edition and in a short one about one-seventh shorter. Scholars such as Emanuel Tov and Eugene Ulrich describe a period of textual plurality.</p><p>The Septuagint, begun in Alexandria in the 3rd century BCE when Greek-speaking Jews translated the Torah, is therefore a witness to Hebrew texts that differed in places from the later standard. The Samaritan Pentateuch, kept by the Samaritan community to this day, differs from the Masoretic text in about 6,000 places, mostly spelling, and adds a command to build an altar on Mount Gerizim.</p><blockquote class="wpull"><p>The Dead Sea Scrolls show both things at once: a text still in motion, and a line of copying so careful that the motion almost stops.</p></blockquote><p>After about 100 CE the picture changes. Biblical scrolls from Masada, sealed before the fortress fell in 73 or 74 CE, and from the Bar Kokhba caves are almost all proto-Masoretic. A charred scroll from En-Gedi, read without unrolling by virtual imaging in 2016, gave the opening of Leviticus in consonants identical to the medieval text. Between about the 7th and 10th centuries CE the Masoretes of Tiberias added vowels, accents and notes. Their finest work, the Aleppo Codex (c. 920–930), lost about 40 percent of its leaves after the synagogue holding it was burned in 1947. The Leningrad Codex, copied in Cairo in 1008 or 1009, is the oldest complete Hebrew Bible and the base of modern scholarly editions.</p></section><section class="wsec" id="judaism-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Who wrote the Torah?</h3><p>Here tradition and critical scholarship part ways, and both deserve a fair hearing. Tradition holds that Moses wrote the Torah at God&#x27;s word. Since the 19th century, and especially Julius Wellhausen&#x27;s Prolegomena (1883), many scholars have read it as woven from sources: the documentary hypothesis named four, known as J, E, D and P.</p><p>Today the field is more varied. Neo-documentarians such as Joel Baden still defend four continuous sources. Many European scholars prefer a supplementary or fragmentary model, in which smaller blocks of tradition were joined and expanded by Priestly and non-Priestly editors. Most agree that the Torah reached something close to its present form in the Persian period, around the 5th century BCE, while containing older material.</p><ul class="wlist"><li>Arguments scholars give for a composite text: doublets (two creation accounts, two versions of the flood), different names for God, different legal codes, and Hebrew that fits the 1st millennium BCE.</li><li>Arguments traditional scholars give: the doublets may be deliberate literary design, language can be updated by later scribes without new composition, and a single revealed source explains the Torah&#x27;s unity.</li><li>What the evidence can settle: dates of copies and language. What it cannot settle: whether the text is revealed. That remains a matter of faith.</li></ul></section><section class="wsec" id="judaism-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Stones that name the kings</h3><p>When the biblical story reaches the kingdoms of Israel and Judah, the outside record begins to answer back. Pharaoh Merneptah&#x27;s victory stele, around 1208 BCE, lists Israel as a people in Canaan. In the 9th century BCE the Mesha Stele of Moab names Omri, king of Israel, and the Aramaic Tel Dan Stele mentions a &quot;House of David&quot;. Assyrian scribes name Ahab, Jehu and Hezekiah, and Sennacherib boasts of shutting Hezekiah up in Jerusalem &quot;like a bird in a cage&quot;.</p><p>The exile is especially well lit. Tablets excavated near Babylon&#x27;s Ishtar Gate, published by Ernst Weidner in 1939 and now in Berlin, list oil rations for &quot;Ya&#x27;ukinu, king of the land of Yahudu&quot; and his sons around 592/591 BCE, the same Jehoiachin whom the Book of Kings says was taken to Babylon and later given a daily allowance. Tablets from Al-Yahudu, &quot;Judah-town&quot;, published by Laurie Pearce and Cornelia Wunsch in 2014, record exiled families buying, renting and naming children with the divine name from 572 BCE onward.</p><aside class="wcall"><b>Where tradition and evidence meet</b><p>From about the 9th century BCE onward, the Books of Kings and the foreign records agree on names, order and rough dates to a degree that surprised early 20th-century sceptics. The closer the biblical account comes to the time it was written down, the more often archaeology finds its people.</p></aside></section><section class="wsec" id="judaism-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>Where the record falls silent</h3><p>Further back, the evidence thins. No inscription names Abraham, Isaac or Jacob, which is unsurprising for pastoral families. No Egyptian record describes an exodus of 600,000 men with their families, and no campsite of that scale has been found in Sinai, although Semitic-speaking people certainly lived in the Nile Delta. Many scholars think a smaller group&#x27;s memory may lie behind the story. Of the conquest, Hazor was burned in the 13th century BCE, but Jericho and Ai were largely empty then.</p><p>Time has worked against the evidence. Papyrus and leather rot in most of the Levant, Jerusalem has been rebuilt and fought over dozens of times, and the Temple Mount cannot be excavated. Much that could settle these questions may never be found; some may still lie in unexcavated mounds or in Egyptian archives not yet read.</p><p>What the record does show is striking enough. The Jewish scriptures are among the best-documented ancient texts on earth, with copies reaching back to within centuries, sometimes decades, of their last editing. The tradition&#x27;s claim that it guarded its text with great care is, for the last two thousand years at least, strongly supported by the manuscripts themselves.</p></section><details class="srcs"><summary>Sources for this tradition (24)</summary><ol><li>Tov E. (2012). Textual Criticism of the Hebrew Bible, 3rd ed. Fortress Press.</li><li>Ulrich E. (1999). The Dead Sea Scrolls and the Origins of the Bible. Eerdmans.</li><li>Barkay G., Vaughn A. G., Lundberg M. J., Zuckerman B. (2004). The amulets from Ketef Hinnom: a new edition and evaluation. Bulletin of the American Schools of Oriental Research 334: 41–71.</li><li>Popović M. et al. (2025). Dating ancient manuscripts using radiocarbon and AI-based writing style analysis. PLOS ONE 20(6): e0323185. <a href="https://doi.org/10.1371/journal.pone.0323185" target="_blank" rel="noopener">doi:10.1371/journal.pone.0323185</a></li><li>Seales W. B. et al. (2016). From damage to discovery via virtual unwrapping: reading the scroll from En-Gedi. Science Advances 2(9): e1601247. <a href="https://doi.org/10.1126/sciadv.1601247" target="_blank" rel="noopener">doi:10.1126/sciadv.1601247</a></li><li>Biran A., Naveh J. (1993). An Aramaic stele fragment from Tel Dan. Israel Exploration Journal 43: 81–98; (1995) The Tel Dan inscription: a new fragment. IEJ 45: 1–18.</li><li>Hasel M. G. (1994). Israel in the Merneptah Stela. Bulletin of the American Schools of Oriental Research 296: 45–61.</li><li>Weidner E. F. (1939). Jojachin, König von Juda, in babylonischen Keilschrifttexten. In Mélanges syriaques offerts à M. René Dussaud, vol. 2, 923–935. Geuthner.</li><li>Pearce L. E., Wunsch C. (2014). Documents of Judean Exiles and West Semites in Babylonia in the Collection of David Sofer. CDL Press.</li><li>Pritchard J. B. (ed.) (1969). Ancient Near Eastern Texts Relating to the Old Testament, 3rd ed. Princeton University Press.</li><li>Finkelstein I., Silberman N. A. (2001). The Bible Unearthed. Free Press.</li><li>Dever W. G. (2003). Who Were the Early Israelites and Where Did They Come From? Eerdmans.</li><li>Hoffmeier J. K. (1997). Israel in Egypt: The Evidence for the Authenticity of the Exodus Tradition. Oxford University Press.</li><li>Schmid K. (2012). The Old Testament: A Literary History. Fortress Press.</li><li>Baden J. S. (2012). The Composition of the Pentateuch: Renewing the Documentary Hypothesis. Yale University Press.</li><li>Wellhausen J. (1883). Prolegomena zur Geschichte Israels. Reimer.</li><li>Strack H. L., Stemberger G. (1996). Introduction to the Talmud and Midrash, 2nd ed. Fortress Press.</li><li>Danby H. (trans.) (1933). The Mishnah. Oxford University Press.</li><li>UNESCO Memory of the World. The Munich Manuscript of the Babylonian Talmud (Bayerische Staatsbibliothek, Cod. hebr. 95).</li><li>Israel Museum, Jerusalem. The Great Isaiah Scroll and the Aleppo Codex, Shrine of the Book collection pages.</li><li>Garfinkel Y., Ganor S. (2009). Khirbet Qeiyafa, vol. 1: Excavation Report 2007–2008. Israel Exploration Society.</li><li>Ben-Tor A. (1998). The fall of Canaanite Hazor: the &#x27;who&#x27; and &#x27;when&#x27; questions. In Gitin S., Mazar A., Stern E. (eds), Mediterranean Peoples in Transition. Israel Exploration Society.</li><li>Kenyon K. M. (1957). Digging Up Jericho. Ernest Benn.</li><li>Levy T. E., Schneider T., Propp W. H. C. (eds) (2015). Israel&#x27;s Exodus in Transdisciplinary Perspective. Springer.</li></ol></details><aside class="rc-cite" data-v="faiths" data-id="faith-judaism" data-t="Judaism"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Judaism</i>. <span class="cite-u">https://residualcontinuum.com/#faiths/faith-judaism</span> (updated 25 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="faith-jainism-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Hathigumpha inscription (2020).jpg" data-cap="The Hathigumpha inscription of King Kharavela, Udayagiri, Odisha" data-big><figcaption></figcaption></figure><div class="sh-k">Ganges plain, India</div><h2 class="sh-t" id="faith-jainism-st" tabindex="-1">Jainism</h2><p class="sh-s">A path of radical non-violence taught by twenty-four &#x27;ford-makers&#x27;, whose scriptures were remembered, partly lost, and finally written down at Valabhi.</p><div class="sh-v"><span class="vstamp vstamp--when">6th–5th century BCE (Mahavira)</span></div></div><div class="f-facts"><div><span>Began</span><b>Videha and Magadha (modern Bihar), middle Ganges plain</b><small>Mahavira, 6th–5th century BCE; Parshva perhaps 8th–7th century BCE</small></div><div><span>Followers today</span><b>about 4.5 million in India (roughly 4–5 million worldwide)</b><small>Census of India, 2011 (4.45 million); worldwide range from reference works, not a Pew count</small></div></div><h3 class="sub-h wsub">In its own words</h3><blockquote class="quote f-own"><p>The universe is eternal and uncreated. Every living being, down to plants and the smallest creatures, has a soul (jiva) that is by nature perfect in knowledge and bliss, but is weighed down by karma, a fine matter that clings to it through passion and harm. Liberation comes through the Three Jewels: right faith, right knowledge and right conduct. Above all, conduct means ahimsa, non-violence in thought, word and deed, together with truthfulness, not stealing, chastity and non-possession. In each cycle of time twenty-four Tirthankaras, &#x27;ford-makers&#x27;, cross the river of rebirth and show others the way; Mahavira is the twenty-fourth of our age. Souls that are freed, the siddhas, rest for ever at the summit of the universe.</p><cite>How a follower might put it, in our words</cite></blockquote><h3 class="sub-h wsub">What it teaches and claims</h3><p class="rd-rule">Claims about God, revelation, the soul or miracles are matters of faith and are not rated. Claims about people, places, events and texts are weighed on the evidence.</p><ul class="rds"><li class="rd"><p class="rd-s">The universe is eternal, has no creator, and turns through endless cycles of time.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">A foundational Jain teaching about the nature of the cosmos. It concerns metaphysics rather than a datable event, so it is a matter of faith and is not rated. <span class="cite">Tattvartha Sutra; Jaini 1979</span></p></li><li class="rd"><p class="rd-s">Twenty-four Tirthankaras teach in each half-cycle; Rishabha, the first of our age, lived an immensely long time ago.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">The earlier Tirthankaras are given lifespans and heights beyond any historical measure, placing them in sacred rather than historical time. A matter of faith; only the last two can be studied as historical figures. <span class="cite">Kalpasutra; Dundas 2002</span></p></li><li class="rd"><p class="rd-s">Mahavira (Vardhamana) was a real teacher and a contemporary of the Buddha.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">Jain texts describe his life, and early Buddhist discourses independently name a rival teacher, Nigantha Nataputta, with Jain doctrines. Two separate traditions agreeing is strong evidence, though no contemporary inscription names him. <span class="cite">Acaranga Sutra; Samannaphala Sutta (Digha Nikaya 2)</span></p></li><li class="rd"><p class="rd-s">Parshva, the 23rd Tirthankara, was a historical teacher who lived about 250 years before Mahavira.</p><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span><p class="rd-n">Jain texts describe followers of Parshva meeting Mahavira&#x27;s disciples, and Buddhist texts attribute a &#x27;fourfold restraint&#x27; to the Niganthas, which Jains associate with Parshva. Historians often accept him as real, of the 8th or 7th century BCE. <span class="cite">Uttaradhyayana 23; Dundas 2002</span></p></li><li class="rd"><p class="rd-s">Mahavira attained nirvana in 527 BCE.</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">This is the traditional Svetambara date; Digambaras differ. Because Mahavira and the Buddha were contemporaries, many scholars move him about a century later, c. 480–425 BCE, in line with the short chronology for the Buddha. <span class="cite">Dundas 2002; Wikipedia &#x27;Mahavira&#x27; (accessed 2026)</span></p></li><li class="rd"><p class="rd-s">Souls that reach omniscience (kevala jnana) are liberated and never return to rebirth.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">The goal of Jain practice. It describes the fate of the soul beyond death, a matter of faith that the site does not rate. <span class="cite">Tattvartha Sutra 10</span></p></li><li class="rd"><p class="rd-s">The canon was gathered from monks&#x27; memories at Pataliputra after a famine and written down at Valabhi in 453 or 466 CE.</p><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span><p class="rd-n">This Svetambara account is detailed and self-critical, admitting losses and variants, which scholars find credible in outline. Its sources were written long after the events, so the dates are traditional rather than independently confirmed. <span class="cite">Dundas 2002; Jaini 1979</span></p></li><li class="rd"><p class="rd-s">The deepest part of the teaching, the Purvas in the twelfth Anga, has been lost.</p><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span><p class="rd-n">Both main sects agree the Drstivada and its fourteen Purvas no longer survive, and no manuscript of them has ever been found. The admission of loss by both traditions is itself an unusual and valuable piece of textual history. <span class="cite">Dundas 2002</span></p></li><li class="rd"><p class="rd-s">The Svetambara canon is not the original, which was entirely lost by about the 2nd century CE (Digambara view).</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">A dispute within the tradition. Scholars note that the oldest Svetambara texts, such as the first book of the Acaranga, have very archaic language and metre, so they likely preserve early material, but also contain much later layers. <span class="cite">Jaini 1979; Jacobi 1884</span></p></li></ul><h3 class="sub-h wsub">History, weighed</h3><ul class="rds"><li class="rd"><p class="rd-s">Jainism had royal patronage in Kalinga (Odisha) by about the 1st century BCE.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">The Hathigumpha inscription of King Kharavela at Udayagiri, seventeen lines of Prakrit in Brahmi, opens with a Jain salutation to the Arhats and Siddhas and records gifts to ascetics. Its date is argued between the 2nd century BCE and the early 1st century CE, and parts are badly damaged. <span class="cite">Jayaswal and Banerji 1929–30; Salomon 1998</span></p></li><li class="rd"><p class="rd-s">A Jina image had been taken from Kalinga by a Nanda king and was brought back by Kharavela.</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">Several scholars read line 12 of the inscription this way, which would put Jina worship in the 4th century BCE. The passage is damaged, and others read the &#x27;Kalinga Jina&#x27; as a sacred object or seat rather than a statue. The reading remains open. <span class="cite">Salomon 1998; Wikipedia &#x27;Hathigumpha inscription&#x27; (accessed 2026)</span></p></li><li class="rd"><p class="rd-s">Monastic lineages recorded in the Kalpasutra were active at Mathura in the early centuries CE.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">Excavations at Kankali Tila in Mathura produced Jain stupa remains, images and votive tablets from about the 2nd century BCE to the 2nd century CE. Georg Bühler showed that their donor inscriptions name groups (ganas, kulas, sakhas) matching the list of teachers in the Kalpasutra. <span class="cite">Bühler 1892–1894; Dundas 2002</span></p></li><li class="rd"><p class="rd-s">The emperor Chandragupta Maurya became a Jain monk and died at Shravanabelagola in Karnataka.</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">A Digambara tradition, supported by inscriptions at Shravanabelagola written many centuries after his time, links Chandragupta with the teacher Bhadrabahu and a southward migration during famine. Greek and Indian sources of the Maurya period are silent; historians remain divided. <span class="cite">Dundas 2002; Jaini 1979</span></p></li><li class="rd"><p class="rd-s">The Svetambara and Digambara division began with a famine-driven migration to the south in the 4th century BCE.</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">The two sects tell different stories and give different dates: Digambaras link it to Bhadrabahu&#x27;s migration, Svetambaras to a dispute about 609 years after Mahavira. Inscriptions suggest distinct groups by the early centuries CE, and the split was probably gradual. <span class="cite">Dundas 2002</span></p></li><li class="rd"><p class="rd-s">Jain monastic libraries (bhandaras) preserved palm-leaf manuscripts from the 11th century onward.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">The libraries of Jaisalmer, Patan and other towns in western India hold some of the oldest dated manuscripts in South Asia, including an Oghaniryukti dated 1060 CE; the 12th-century king Kumarapala founded libraries at Patan. These collections are catalogued and studied today. <span class="cite">Guy 2012; Wikipedia &#x27;Jain Agamas&#x27; (accessed 2026)</span></p></li></ul><h3 class="sub-h wsub">The texts and what survives of them</h3><p class="rd-rule">The textual record measures what survives and how close it is to the original. It says nothing about whether a text is true or inspired.</p><section class="txt"><h4 class="txt-h">The Jain Agamas (Svetambara canon)</h4><ol class="jr" aria-label="How The Jain Agamas (Svetambara canon) reached us"><li class="jr-s"><span>Composed</span><b>c. 4th century BCE (oldest layers) to the 5th century CE (writing down)</b></li><li class="jr-gap "><span>about 594 years with no surviving copy</span></li><li class="jr-s"><span>Oldest surviving copy</span><b>1060 CE (Vikrama 1117)</b><small>Palm-leaf manuscript of the Oghaniryukti (a canonical text of the Murtipujaka list)</small></li><li class="jr-s jr-today"><span>Today</span><b>Read in its source&#x27;s language, updated in places</b></li></ol><div class="rec"><div class="rec-r"><span>Closeness to the source</span><span class="rec-b" role="img" aria-label="Closeness to the source: 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><b>2</b></div><div class="rec-r"><span>Source&#x27;s own language</span><span class="rec-b" role="img" aria-label="Source&#x27;s own language: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Gap to oldest copy</span><span class="rec-b" role="img" aria-label="Gap to oldest copy: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Early witnesses</span><span class="rec-b" role="img" aria-label="Early witnesses: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Stability of the text</span><span class="rec-b" role="img" aria-label="Stability of the text: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Documented history</span><span class="rec-b" role="img" aria-label="Documented history: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-tot"><span>Textual record</span><b>19<small>/30</small></b></div></div><p class="rec-why">Gap 3: about 600 years from the writing down at Valabhi to the oldest dated copy, and far longer from the oldest layers. Language 4: Ardhamagadhi, the language tradition says Mahavira preached in, survives, updated in places. Witnesses 4: many manuscripts, mostly from one region. Stability 3: recorded variants and sectarian canons differ. Documented 3: tradition names councils and editors, but the sources are late. Digambaras would score the whole canon&#x27;s authenticity lower. Source 2: Mahavira&#x27;s teaching was passed down orally for about a thousand years before being written down at Valabhi; Digambaras hold that the original canon was lost.</p><dl class="txt-dl"><div><dt>Language of the text</dt><dd>Ardhamagadhi Prakrit</dd></div><div><dt>Composed</dt><dd>c. 4th century BCE (oldest layers) to the 5th century CE (writing down)</dd></div><div><dt>Handed down</dt><dd>Mahavira&#x27;s teachings, organised by his chief disciples (ganadharas) into twelve Angas, were memorised by monks. Svetambara tradition records that famines repeatedly broke the chain, and that councils at Pataliputra (c. 3rd century BCE) and later at Mathura and Valabhi (early 4th century CE) re-assembled what monks remembered.</dd></div><div><dt>Fixed in writing</dt><dd>Written down at the council of Valabhi under Devarddhigani Ksamasramana, 980 or 993 years after Mahavira&#x27;s nirvana (453 or 466 CE by the traditional count). The twelfth Anga, the Drstivada, was declared lost. Murtipujaka Svetambaras accept 45 texts; Sthanakavasis and Terapanthis accept 32. Digambaras reject this canon altogether.</dd></div><div><dt>Oldest surviving copy</dt><dd>Palm-leaf manuscript of the Oghaniryukti (a canonical text of the Murtipujaka list), 1060 CE (Vikrama 1117) (dated colophon (Guy 2012, Metropolitan Museum of Art))</dd></div><div><dt>Early witnesses</dt><dd>Thousands of manuscripts survive in the Jain libraries of Gujarat and Rajasthan, with palm-leaf copies from the 11th century and paper copies from the 14th century onward. Almost all early witnesses come from western India, and none is older than about 600 years after Valabhi.</dd></div></dl><div class="face"><div class="face-c face-m"><span class="face-k">How the tradition sees its text</span><p>The truths the Tirthankaras teach are eternal. Mahavira&#x27;s words were arranged by his disciples into the Angas. Svetambaras hold that most of this survived through careful councils and was faithfully written at Valabhi, with honest admission of what was lost. Digambaras hold that the original Angas and Purvas were lost entirely, and that only partial knowledge passed through Dharasena to Puspadanta and Bhutabali.</p></div><div class="face-c face-x"><span class="face-k">What manuscript scholarship shows</span><p>The canon has layers spanning perhaps eight centuries. Its oldest parts, such as the first book of the Acaranga and Sutrakrtanga, are archaic in language and metre and among the oldest Indian texts after the Vedic corpus. No manuscript earlier than the 11th century survives, and the pre-Valabhi text is reconstructed from internal evidence and Mathura inscriptions.</p></div></div><h5 class="txt-sub">Documented changes, variants and revisions</h5><ul class="txt-ch"><li>Loss: every Svetambara lineage agrees that the twelfth Anga, the Drstivada containing the fourteen Purvas, was lost, so the canon itself admits it is incomplete (Dundas 2002).</li><li>Variants: tradition says the Valabhi editors noted readings from a separate recitation lineage rather than erasing them, so recorded variants are part of the canon&#x27;s own history (Dundas 2002).</li><li>Language: the Ardhamagadhi of the canon shows later western Prakrit features, so its dialect was updated during transmission; the oldest passages keep more archaic forms (Jacobi 1884).</li><li>Canon size differs by sect: Murtipujakas accept 45 texts, while Sthanakavasis and Terapanthis, who reject image worship, accept 32 (Wikipedia &#x27;Jain Agamas&#x27;).</li><li>Digambaras use instead the Satkhandagama and Kasayapahuda (c. 2nd century CE) with the 9th-century Dhavala and Jayadhavala commentaries, preserved in palm-leaf manuscripts at Mudabidri.</li></ul></section><h3 class="sub-h wsub">Through time</h3><ol class="ftl"><li><span class="ftl-y">c. 8th–7th century BCE</span><b>Parshva</b><span>The 23rd Tirthankara, dated by historians to about this time; tradition places him earlier.</span></li><li><span class="ftl-y">c. 599–527 BCE</span><b>Mahavira (traditional dates)</b><span>Many scholars prefer c. 480–425 BCE, as a contemporary of the Buddha.</span></li><li><span class="ftl-y">c. 3rd century BCE</span><b>Council of Pataliputra</b><span>After a long famine, monks gather to recite the eleven Angas from memory (tradition).</span></li><li><span class="ftl-y">c. 1st century BCE</span><b>Hathigumpha inscription</b><span>King Kharavela of Kalinga opens his record with a Jain salutation.</span></li><li><span class="ftl-y">c. 2nd century BCE–2nd century CE</span><b>Mathura&#x27;s Jain stupa</b><span>Kankali Tila images and inscriptions name monastic groups found in the Kalpasutra.</span></li><li><span class="ftl-y">c. 2nd century CE</span><b>Satkhandagama</b><span>Composed by Puspadanta and Bhutabali, the oldest Digambara scripture.</span></li><li><span class="ftl-y">early 4th century CE</span><b>Councils at Mathura and Valabhi</b><span>Two separate recitations of the canon (tradition).</span></li><li><span class="ftl-y">453 or 466 CE</span><b>Canon written at Valabhi</b><span>Devarddhigani Ksamasramana presides over the writing down of the Svetambara canon.</span></li><li><span class="ftl-y">838 CE</span><b>Jayadhavala completed</b><span>The great Digambara commentary is finished under the Rashtrakuta king Amoghavarsha.</span></li><li><span class="ftl-y">1060 CE</span><b>Oghaniryukti manuscript</b><span>Among the oldest dated Jain palm-leaf manuscripts.</span></li><li><span class="ftl-y">12th century</span><b>Libraries at Patan</b><span>King Kumarapala founds Jain manuscript libraries in his capital.</span></li><li><span class="ftl-y">1884</span><b>First English translations</b><span>Hermann Jacobi translates the Acaranga and Kalpasutra for Sacred Books of the East.</span></li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">6 min read · 1,228 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Jainism"><button type="button" class="wtoc-i" data-go="jainism-s1">A religion that admits its losses</button><button type="button" class="wtoc-i" data-go="jainism-s2">The ford-makers</button><button type="button" class="wtoc-i" data-go="jainism-s3">A world the texts remember</button><button type="button" class="wtoc-i" data-go="jainism-s4">Memory, famine and three councils</button><button type="button" class="wtoc-i" data-go="jainism-s5">Evidence in stone</button><button type="button" class="wtoc-i" data-go="jainism-s6">The libraries of the desert</button><button type="button" class="wtoc-i" data-go="jainism-s7">What is still open</button></nav></div><section class="wsec" id="jainism-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A religion that admits its losses</h3><p>Most scriptural traditions insist that nothing essential has been lost. Jainism is unusual. Both of its great branches openly say that the deepest part of Mahavira&#x27;s teaching, the fourteen Purvas, vanished long ago, and they disagree about how much of the rest survived. For a historian that candour is precious. It means the tradition has kept a record of its own gaps, and it invites us to compare that record with inscriptions, manuscripts and the witness of neighbouring religions.</p><p>Jainism is small in numbers, about 4.5 million people in the 2011 Census of India, but its influence on Indian thought, art and commerce is large, and its ethic of ahimsa, non-violence toward every living being, is among the most demanding moral codes any religion has asked of its followers.</p><blockquote class="wpull"><p>Both branches openly say the deepest part of Mahavira&#x27;s teaching vanished long ago. For a historian, that candour is precious.</p></blockquote></section><section class="wsec" id="jainism-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The ford-makers</h3><p>In the Jain view time turns like a wheel, rising and declining through vast ages without beginning or end. In each half-turn twenty-four Tirthankaras appear, &#x27;makers of the ford&#x27; across the river of rebirth. They are not gods and did not create anything; they are human beings who conquered their own passions, reached omniscience and taught the way. The first of our age, Rishabha, lived an unimaginably long time ago. The last two, Parshva and Mahavira, stand at the edge of recorded history.</p><p>Mahavira, born Vardhamana into a warrior clan near Vaishali, left home at about thirty, practised severe austerities for twelve years, reached omniscience and taught for three decades. Jain tradition dates his death to 527 BCE; many historians place it about a century later. Either way, he was active in the same towns and at the same time as the Buddha, and the Buddhist discourses describe a rival teacher, Nigantha Nataputta, whose doctrines are recognisably Jain. That independent notice from a competing tradition is one of the strongest pieces of evidence for any founder in ancient India.</p><blockquote class="quote"><p>The Arhats and Bhagavats of the past, present, and future, all say thus, speak thus, declare thus, explain thus: all breathing, existing, living, sentient creatures should not be slain, nor treated with violence, nor abused, nor tormented, nor driven away.</p><cite>Acaranga Sutra 1.4.1, trans. Hermann Jacobi, Jaina Sutras Part I, Sacred Books of the East 22 (1884)</cite></blockquote></section><section class="wsec" id="jainism-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>A world the texts remember</h3><p>Jain scriptures set Mahavira&#x27;s life in a real political landscape. They name King Shrenika of Magadha and his son Kunika, the rulers known to Buddhist texts as Bimbisara and Ajatashatru, and they describe the Licchavi confederacy of Vaishali, a clan republic that Buddhist sources also portray. The two traditions were rivals and did not copy each other&#x27;s stories, so when both describe the same kings, cities and tensions between Magadha and Vaishali, historians gain an independent check on the world of the 5th century BCE.</p><p>The texts also preserve memories of an older Jain community. The Uttaradhyayana describes a meeting between Keshi, a monk in the line of Parshva who wore clothes and kept four vows, and Gautama, Mahavira&#x27;s disciple, who kept five; the two reconcile their practice. Such a story reads less like invention than like a community remembering how two groups of followers came together. The branches differ on details of Mahavira&#x27;s own life too: Svetambaras say he married and had a daughter, and that his embryo was transferred from a Brahmin mother to Queen Trishala, while Digambaras reject both accounts.</p></section><section class="wsec" id="jainism-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Memory, famine and three councils</h3><p>According to Svetambara tradition, Mahavira&#x27;s words were arranged by his chief disciples into twelve Angas and learned by heart. Then came famine. Around the time of the Maurya empire a twelve-year famine scattered the monks, and when they reassembled at Pataliputra they could piece together eleven Angas but not the twelfth, the Drstivada, because the only monk who knew it, Bhadrabahu, was away. Centuries later two more recitations, at Mathura and at Valabhi, tried again. Finally, at a second council at Valabhi in Gujarat, 980 or 993 years after Mahavira by the traditional count (453 or 466 CE), the teacher Devarddhigani Ksamasramana had the surviving canon written down, noting where recitation lineages disagreed.</p><p>Digambara Jains tell the story differently. For them the original Angas and Purvas were lost completely by about the 2nd century CE. What survived was partial knowledge, which the teacher Dharasena passed to two monks, Puspadanta and Bhutabali, who composed the Satkhandagama, the oldest Digambara scripture. Its vast commentary, the Dhavala, and the related Jayadhavala, completed in 838 CE, survived in palm-leaf manuscripts guarded at Mudabidri in Karnataka and were only transcribed and published in the 20th century.</p><aside class="wcall"><b>How do we know?</b><p>The council story comes from Jain sources written long after the events, so its dates are traditional. But its shape is credible: it admits losses and variant readings, which later editors had no motive to invent. Scholars also find that the language and metre of texts such as the first book of the Acaranga are older than the rest of the canon, which is what we would expect if a genuinely old core was preserved and later material added around it.</p></aside></section><section class="wsec" id="jainism-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Evidence in stone</h3><p>Before any Jain manuscript, there are inscriptions. In a cave at Udayagiri near Bhubaneswar, King Kharavela of Kalinga had a seventeen-line Prakrit inscription carved, probably in the 1st century BCE. It opens with a salutation to the Arhats and Siddhas, the same words that begin the Jain Namokar prayer today, and records the king&#x27;s gifts to ascetics. A damaged line appears to say that Kharavela brought back a &#x27;Jina of Kalinga&#x27; carried off long before by a Nanda king; if that reading holds, Jina worship would reach back to the 4th century BCE, but scholars disagree about the passage.</p><p>At Kankali Tila in Mathura, 19th-century excavators uncovered the remains of a Jain stupa with images and votive tablets dating from about the 2nd century BCE to the 2nd century CE. The Indologist Georg Bühler noticed that the donors&#x27; inscriptions name monastic groups, the ganas, kulas and sakhas, which also appear in the list of elders in the Kalpasutra, a Svetambara text. The scripture and the stones independently record the same institutions, an encouraging sign that the tradition&#x27;s memory of its own lineages is sound.</p></section><section class="wsec" id="jainism-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>The libraries of the desert</h3><p>The Jain community built some of the finest manuscript libraries in Asia. In the 12th century King Kumarapala founded libraries at Patan, and the underground vaults of Jaisalmer, in the dry Thar desert, preserved palm-leaf manuscripts that would have rotted elsewhere. Among them is a copy of the Oghaniryukti dated 1060 CE, one of the oldest dated Jain manuscripts and among the oldest dated manuscripts of any kind from India outside the Himalaya. Copying a scripture was itself a meritorious act, and wealthy lay families commissioned richly painted copies of the Kalpasutra, many of which are now in museums. In recent decades Jain monks and scholars have catalogued these holdings, among them Muni Jambuvijaya&#x27;s catalogue of the Jaisalmer collections, and many are being digitised, which will make comparison of early copies far easier.</p><p>Still, the gap is real. Roughly six hundred years separate the writing down at Valabhi from the oldest surviving copies, and the oldest layers of the canon may be seven or eight centuries older than Valabhi. The manuscripts also come overwhelmingly from western India, so scholars cannot compare independent lines from different regions as they can for the Pali Canon.</p></section><section class="wsec" id="jainism-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What is still open</h3><ul class="wlist"><li>Mahavira&#x27;s dates: 527 BCE by tradition, perhaps a century later by many scholars.</li><li>Whether Parshva was a historical founder whose community Mahavira reformed, as Jain sources suggest.</li><li>How much of the Svetambara canon preserves Mahavira&#x27;s own teaching, and how much was added before Valabhi.</li><li>Whether Chandragupta Maurya ended his life as a Jain monk, as later Digambara inscriptions say.</li></ul><p>What can be said with confidence is that Jainism is among the oldest living religions of India, that its founder is attest
