>The centre of Christian belief, defined in the creeds of Nicaea (325) and Constantinople (381). It concerns the nature of God and is a matter of faith, not rated here. <span class="cite">John 1:1–14; Nicene Creed</span></p></li><li class="rd"><p class="rd-s">Jesus rose bodily from the dead on the third day.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">Historians can establish that within a few years of his death, his followers proclaimed that they had seen him alive: Paul records this around 55 CE. The resurrection itself is a matter of faith. <span class="cite">1 Corinthians 15:3–8 (NRSV)</span></p></li><li class="rd"><p class="rd-s">Jesus was born of a virgin, Mary.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">Told in Matthew and Luke and affirmed in the creeds. As a miracle it lies outside what historical methods can test, so it is not rated. <span class="cite">Matthew 1:18–25; Luke 1:26–38</span></p></li><li class="rd"><p class="rd-s">Jesus of Nazareth was a Jewish teacher from Galilee, crucified in Jerusalem under Pontius Pilate.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">Attested by Paul&#x27;s letters, the Gospels, the Roman historian Tacitus and the Jewish historian Josephus. Almost all historians, whatever their beliefs, accept it. <span class="cite">Tacitus, Annals 15.44; Josephus, Antiquities 18.63–64, 20.200</span></p></li><li class="rd"><p class="rd-s">The four Gospels were written by Matthew, Mark, Luke and John.</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">The Gospels are anonymous in their text. Papias (early 2nd century) links Mark and Matthew to named authors, and Irenaeus (c. 180) names all four. Scholars divide: many accept Mark and Luke, fewer accept apostolic authorship of Matthew and John. <span class="cite">Eusebius, Church History 3.39; Irenaeus, Against Heresies 3.1</span></p></li><li class="rd"><p class="rd-s">Paul wrote letters to early churches within about 20–30 years of the crucifixion.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">Seven letters (Romans, 1–2 Corinthians, Galatians, Philippians, 1 Thessalonians, Philemon) are accepted as Paul&#x27;s by nearly all scholars and are dated c. 50–60 CE. Six more carry his name but their authorship is debated. <span class="cite">Ehrman 2012; Metzger and Ehrman 2005</span></p></li><li class="rd"><p class="rd-s">The New Testament we read today is substantially the text first written in the 1st century.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">Thousands of manuscripts let scholars reconstruct the early text closely. Most variants are spelling or word order, but a few passages, such as Mark 16:9–20 and John 7:53–8:11, are later additions to the earliest copies. <span class="cite">Metzger and Ehrman 2005; Nestle-Aland 28th ed. (2012)</span></p></li><li class="rd"><p class="rd-s">Christ will return to judge the living and the dead.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">A hope about the future expressed in the creeds and in Paul&#x27;s earliest letter. It is a matter of faith and cannot be tested historically. <span class="cite">1 Thessalonians 4:13–18; Apostles&#x27; Creed</span></p></li></ul><h3 class="sub-h wsub">History, weighed</h3><ul class="rds"><li class="rd"><p class="rd-s">Jesus of Nazareth existed as a historical person.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">Paul, writing in the 50s CE, met Jesus&#x27;s brother James and his disciple Peter. Josephus (c. 93 CE) mentions &quot;the brother of Jesus, who was called Christ&quot;, and Tacitus (c. 116 CE) records his execution. Independent sources of this kind are more than exist for most 1st-century Galileans. <span class="cite">Galatians 1:18–19; Josephus, Antiquities 20.200; Ehrman 2012</span></p></li><li class="rd"><p class="rd-s">Jesus was baptised by John the Baptist.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">Josephus independently describes John as a popular preacher executed by Herod Antipas. Historians think the Gospels would not have invented a baptism that seemed to place Jesus under John, so the event is widely accepted. <span class="cite">Josephus, Antiquities 18.116–119; Meier 1991</span></p></li><li class="rd"><p class="rd-s">Jesus was crucified under Pontius Pilate, prefect of Judea from c. 26 to 36 CE.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">Tacitus names Pilate as the official who executed Christus. The Pilate Stone, found at Caesarea Maritima in 1961, confirms Pilate as &quot;prefect of Judea&quot;. Crucifixion was a standard Roman punishment for rebels and slaves. <span class="cite">Tacitus, Annals 15.44; Pilate Stone, Israel Museum</span></p></li><li class="rd"><p class="rd-s">Figures around Jesus, such as Caiaphas, Herod Antipas and Gallio, were real officials.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">An ossuary inscribed with the name Caiaphas was found in Jerusalem in 1990; Herod Antipas appears in Josephus and on coins; an inscription at Delphi dates Gallio&#x27;s governorship of Achaia to about 51–52 CE, anchoring Paul&#x27;s stay in Corinth (Acts 18). <span class="cite">Josephus, Antiquities 18; Delphi Gallio inscription</span></p></li><li class="rd"><p class="rd-s">Nero punished Christians in Rome after the fire of 64 CE.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">Tacitus describes the persecution in detail about fifty years later, and Suetonius mentions punishments of Christians under Nero. Early Christian tradition places the deaths of Peter and Paul in Rome in this period. <span class="cite">Tacitus, Annals 15.44; Suetonius, Nero 16</span></p></li><li class="rd"><p class="rd-s">James, the brother of Jesus, was executed in Jerusalem around 62 CE.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">Josephus reports that the high priest Ananus had James stoned during a gap between Roman governors. Most scholars accept this passage as authentic, unlike parts of Josephus&#x27;s longer paragraph on Jesus. <span class="cite">Josephus, Antiquities 20.197–203</span></p></li><li class="rd"><p class="rd-s">A Roman census under Quirinius took place while Herod the Great still ruled, at Jesus&#x27;s birth.</p><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span><p class="rd-n">Quirinius was real and did hold a census of Judea, but Josephus dates it to 6 CE, about ten years after Herod&#x27;s death in c. 4 BCE. Roman provincial censuses did require registration. Some scholars propose a translation or an earlier registration; most see a chronological tension. <span class="cite">Luke 2:1–5; Josephus, Antiquities 18.1–2; Brown 1977</span></p></li><li class="rd"><p class="rd-s">Jesus never existed and was invented as a myth decades later.</p><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span><p class="rd-n">Paul&#x27;s letters, written within about twenty years of the crucifixion by a man who knew Jesus&#x27;s brother, and independent notices in Josephus and Tacitus contradict a late invention. Nearly all historians, including sceptical ones, reject the idea. <span class="cite">Ehrman 2012; Galatians 1:19</span></p></li></ul><h3 class="sub-h wsub">The texts and what survives of them</h3><p class="rd-rule">The textual record measures what survives and how close it is to the original. It says nothing about whether a text is true or inspired.</p><section class="txt"><h4 class="txt-h">The New Testament</h4><ol class="jr" aria-label="How The New Testament reached us"><li class="jr-s"><span>Composed</span><b>c. 50–100 CE; some scholars date 2 Peter and the Pastoral Letters into the early 2nd century</b></li><li class="jr-gap "><span>about 50 years with no surviving copy</span></li><li class="jr-s"><span>Oldest surviving copy</span><b>c. 125–175 CE (proposals range from c. 100 to after 200)</b><small>Papyrus 52 (Rylands Library Papyrus P52), John 18:31–33, 37–38</small></li><li class="jr-s jr-today"><span>Today</span><b>Read in translation from its source&#x27;s language</b></li></ol><div class="rec"><div class="rec-r"><span>Closeness to the source</span><span class="rec-b" role="img" aria-label="Closeness to the source: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Source&#x27;s own language</span><span class="rec-b" role="img" aria-label="Source&#x27;s own language: 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><b>2</b></div><div class="rec-r"><span>Gap to oldest copy</span><span class="rec-b" role="img" aria-label="Gap to oldest copy: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Early witnesses</span><span class="rec-b" role="img" aria-label="Early witnesses: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Stability of the text</span><span class="rec-b" role="img" aria-label="Stability of the text: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Documented history</span><span class="rec-b" role="img" aria-label="Documented history: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-tot"><span>Textual record</span><b>22<small>/30</small></b></div></div><p class="rec-why">Gap 5: P52 is dated within about 50–75 years of John&#x27;s Gospel, and P46 (c. 200) contains most of Paul&#x27;s letters; on Nongbri&#x27;s later dating the gap would still be near 100 years. Language 2: Jesus taught mainly in Aramaic, but his words survive only in Greek translation apart from a handful of Aramaic phrases (such as &#x27;Talitha cum&#x27; and &#x27;Eloi, Eloi, lema sabachthani&#x27;); Paul&#x27;s letters are in Paul&#x27;s own Greek, but Paul is not the source of the teaching. Witnesses 5: thousands, from several regions. Stability 4: mostly minor variants, but a few whole passages. Documented 3: the authors and early copying are poorly recorded, the canon&#x27;s later stages well recorded. Some scholars would score stability 3. Source 3: Jesus wrote nothing; Paul&#x27;s letters come about 20 to 30 years after him from a man who did not know him in life, and the Gospels, anonymous in their earliest form, about 40 to 70 years after.</p><dl class="txt-dl"><div><dt>Language of the text</dt><dd>Koine Greek (Jesus himself taught mainly in Aramaic)</dd></div><div><dt>Composed</dt><dd>c. 50–100 CE; some scholars date 2 Peter and the Pastoral Letters into the early 2nd century</dd></div><div><dt>Handed down</dt><dd>Jesus&#x27;s sayings and deeds were first passed on by word of mouth, in Aramaic and then Greek, for about 20 to 40 years before the Gospels were written. Paul quotes some of these traditions as already fixed formulas (1 Corinthians 11 and 15).</dd></div><div><dt>Fixed in writing</dt><dd>No single act of standardisation. Letters and Gospels circulated singly, then in collections from the 2nd century. The 27-book list first appears in Athanasius&#x27;s Festal Letter of 367 CE; Byzantine scribes gradually made the text more uniform; Erasmus printed the Greek in 1516.</dd></div><div><dt>Oldest surviving copy</dt><dd>Papyrus 52 (Rylands Library Papyrus P52), John 18:31–33, 37–38, c. 125–175 CE (proposals range from c. 100 to after 200) (palaeography (Roberts 1935; Orsini and Clarysse 2012; Nongbri 2005))</dd></div><div><dt>Oldest complete copy</dt><dd>Codex Sinaiticus, c. 330–360 CE</dd></div><div><dt>Early witnesses</dt><dd>More than 5,700 catalogued Greek manuscripts in the Kurzgefasste Liste of the Institute for New Testament Textual Research, Münster (CSNTM, 2022), including roughly 140–150 papyri, 320–340 majuscules, over 2,900 minuscules and about 2,500 lectionaries. Most pre-300 papyri come from Egypt. Early translations (Latin, Syriac, Coptic) and quotations by early writers add further witnesses.</dd></div></dl><div class="face"><div class="face-c face-m"><span class="face-k">How the tradition sees its text</span><p>Christians hold that the apostles and their companions wrote under the inspiration of the Holy Spirit, and that the church received rather than created the canon, recognising the books already used in worship. Many traditions teach that God has providentially preserved the text through the church, so that no doctrine depends on a disputed reading.</p></div><div class="face-c face-x"><span class="face-k">What manuscript scholarship shows</span><p>Textual scholars reconstruct the early text from thousands of manuscripts, early translations and quotations, a richer record than for any other ancient Greek book. Early copyists were not always professionals, and the 2nd century saw real fluidity. Modern critical editions such as Nestle-Aland mark the few passages that are later additions and list significant variants in the notes.</p></div></div><h5 class="txt-sub">Documented changes, variants and revisions</h5><ul class="txt-ch"><li>Mark 16:9–20, the longer ending, is absent from Codex Sinaiticus and Codex Vaticanus; Eusebius and Jerome noted that many copies they knew ended at 16:8.</li><li>John 7:53–8:11, the woman caught in adultery, is absent from P66, P75, Sinaiticus and Vaticanus; it first appears in Greek in Codex Bezae (c. 400) and in other places in some manuscripts.</li><li>The Comma Johanneum (1 John 5:7–8, on the Father, Word and Spirit) comes from Latin tradition; it is in only a handful of late Greek manuscripts and entered Erasmus&#x27;s third edition in 1522.</li><li>The &#x27;Western&#x27; text of Acts in Codex Bezae is nearly a tenth longer than other forms, with many added phrases and details (Metzger 1994).</li><li>Byzantine scribes from about the 5th to 9th centuries harmonised parallel passages and smoothed grammar, producing the majority text behind the King James Version (1611).</li></ul></section><section class="txt"><h4 class="txt-h">The Old Testament in Greek (Septuagint)</h4><ol class="jr" aria-label="How The Old Testament in Greek (Septuagint) reached us"><li class="jr-s"><span>Composed</span><b>Torah translated in Alexandria in the 3rd century BCE; other books through the 2nd and 1st centuries BCE</b></li><li class="jr-gap jr-gap--none"><span>copies survive from within the period of composition</span></li><li class="jr-s"><span>Oldest surviving copy</span><b>2nd century BCE</b><small>Rylands Papyrus 458 (Deuteronomy)</small></li><li class="jr-s jr-today"><span>Today</span><b>Read in translation from its source&#x27;s language</b></li></ol><div class="rec"><div class="rec-r"><span>Closeness to the source</span><span class="rec-b" role="img" aria-label="Closeness to the source: 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><b>2</b></div><div class="rec-r"><span>Source&#x27;s own language</span><span class="rec-b" role="img" aria-label="Source&#x27;s own language: 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><b>2</b></div><div class="rec-r"><span>Gap to oldest copy</span><span class="rec-b" role="img" aria-label="Gap to oldest copy: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Early witnesses</span><span class="rec-b" role="img" aria-label="Early witnesses: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Stability of the text</span><span class="rec-b" role="img" aria-label="Stability of the text: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Documented history</span><span class="rec-b" role="img" aria-label="Documented history: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-tot"><span>Textual record</span><b>20<small>/30</small></b></div></div><p class="rec-why">Gap 5: Greek fragments survive from within the translation period itself. Language 2: a Greek translation of Hebrew and Aramaic scriptures; the Hebrew source survives separately, in the Hebrew Bible row. Witnesses 5: many early copies from Egypt and Judea. Stability 3: several revisions and recensions. Documented 3: the revisers are named, the first translators only in legend. Source 2: made by unnamed translators in Egypt, centuries after the Hebrew books were composed.</p><dl class="txt-dl"><div><dt>Language of the text</dt><dd>Koine Greek, translated from Hebrew and Aramaic; a few books, such as the Wisdom of Solomon, composed in Greek</dd></div><div><dt>Composed</dt><dd>Torah translated in Alexandria in the 3rd century BCE; other books through the 2nd and 1st centuries BCE</dd></div><div><dt>Handed down</dt><dd>A written translation from the start. The Letter of Aristeas tells of 72 Jewish scholars sent from Jerusalem to translate the Law for King Ptolemy II; scholars regard the story as legendary but the Alexandrian setting as likely.</dd></div><div><dt>Fixed in writing</dt><dd>Never fixed in one form. Jewish revisers (Aquila, Symmachus, Theodotion) brought it closer to the Hebrew in the 2nd century CE; Origen compared versions in his Hexapla (3rd century); Christian recensions followed. The Eastern Orthodox churches still read it; Jerome&#x27;s Latin Vulgate (c. 382–405) translated most of the Old Testament from Hebrew instead.</dd></div><div><dt>Oldest surviving copy</dt><dd>Rylands Papyrus 458 (Deuteronomy), 2nd century BCE (palaeography)</dd></div><div><dt>Oldest complete copy</dt><dd>Codex Vaticanus (Vat. gr. 1209), nearly complete Old and New Testament, c. 300–350 CE</dd></div><div><dt>Early witnesses</dt><dd>Greek fragments from Qumran (such as 4QLXXLev-a) and the Minor Prophets scroll from Nahal Hever (late 1st century BCE), many Egyptian papyri, and the great codices Vaticanus, Sinaiticus (4th century) and Alexandrinus (5th century), with hundreds of later manuscripts.</dd></div></dl><div class="face"><div class="face-c face-m"><span class="face-k">How the tradition sees its text</span><p>The first Christians, writing in Greek, quoted the scriptures mostly in the Septuagint, and the Eastern churches treat it as inspired scripture in its own right. The Catholic Church, through the Latin Vulgate, and Protestant churches, through translation from the Hebrew, both receive the same Old Testament story with different book lists and wording.</p></div><div class="face-c face-x"><span class="face-k">What manuscript scholarship shows</span><p>Scholars value the Septuagint as the oldest translation of the Hebrew Bible and a witness to Hebrew texts older than the Masoretic standard, confirmed when Qumran yielded Hebrew copies matching it. It is a collection of translations by different hands, literal in some books and free in others, and revised repeatedly, so its earliest form is reconstructed, not simply read.</p></div></div><h5 class="txt-sub">Documented changes, variants and revisions</h5><ul class="txt-ch"><li>The Septuagint was translated from Hebrew texts that sometimes differed from the later Masoretic text; its Jeremiah is about one-seventh shorter and arranged differently (Tov 2012).</li><li>It contains books and additions not in the Hebrew canon, such as Tobit, Judith, Sirach, 1–2 Maccabees and Greek additions to Esther and Daniel; Catholic and Orthodox Bibles keep them, Protestant Bibles do not.</li><li>Jewish revisers in the 1st and 2nd centuries CE, visible in the kaige revision of the Nahal Hever scroll, corrected the Greek toward the Hebrew.</li><li>Origen&#x27;s Hexapla and later recensions mixed readings from different Greek versions, so the original translation must be reconstructed, as in the Göttingen Septuagint.</li></ul></section><h3 class="sub-h wsub">Through time</h3><ol class="ftl"><li><span class="ftl-y">c. 28–30 CE</span><b>John and Jesus</b><span>John the Baptist preaches by the Jordan; Jesus begins teaching in Galilee.</span></li><li><span class="ftl-y">c. 30–33 CE</span><b>The crucifixion</b><span>Jesus is crucified in Jerusalem under Pontius Pilate; his followers proclaim him risen.</span></li><li><span class="ftl-y">c. 50 CE</span><b>The first Christian text</b><span>Paul writes 1 Thessalonians, probably the oldest surviving Christian writing.</span></li><li><span class="ftl-y">64 CE</span><b>Nero&#x27;s persecution</b><span>After the great fire, Christians in Rome are executed, as Tacitus later reports.</span></li><li><span class="ftl-y">c. 70 CE</span><b>The first Gospel</b><span>Mark&#x27;s Gospel is written, most scholars think around the time of the Temple&#x27;s destruction.</span></li><li><span class="ftl-y">c. 80–100 CE</span><b>Matthew, Luke, John</b><span>The other Gospels and Acts are written, drawing on Mark and other sources.</span></li><li><span class="ftl-y">c. 116 CE</span><b>A Roman witness</b><span>Tacitus records that Christus was executed under Pontius Pilatus.</span></li><li><span class="ftl-y">c. 125–175 CE</span><b>The oldest fragment</b><span>P52, a scrap of John&#x27;s Gospel, is copied in Egypt.</span></li><li><span class="ftl-y">c. 200 CE</span><b>Books of papyrus</b><span>P46 (Paul&#x27;s letters) and P66 (John) are copied; P75 (Luke and John) follows around 175–225.</span></li><li><span class="ftl-y">c. 330–360 CE</span><b>Complete Bibles</b><span>Codex Vaticanus and Codex Sinaiticus are produced, the oldest near-complete Christian Bibles.</span></li><li><span class="ftl-y">367 CE</span><b>The 27 books</b><span>Athanasius of Alexandria lists exactly the 27 books of today&#x27;s New Testament.</span></li><li><span class="ftl-y">1516</span><b>The printed Greek</b><span>Erasmus publishes the first printed Greek New Testament to reach the market.</span></li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">6 min read · 1,270 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Christianity"><button type="button" class="wtoc-i" data-go="christianity-s1">A faith built on a life</button><button type="button" class="wtoc-i" data-go="christianity-s2">How the church understands its books</button><button type="button" class="wtoc-i" data-go="christianity-s3">The earliest pages</button><button type="button" class="wtoc-i" data-go="christianity-s4">Where the copies disagree</button><button type="button" class="wtoc-i" data-go="christianity-s5">Translated from the start</button><button type="button" class="wtoc-i" data-go="christianity-s6">Which books? The making of the canon</button><button type="button" class="wtoc-i" data-go="christianity-s7">Jesus in the historical record</button></nav></div><section class="wsec" id="christianity-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A faith built on a life</h3><p>Christianity rests on a claim about a person. Its scriptures are not mainly laws or poems but reports: letters written to young communities and four accounts of what one Galilean teacher said and did, how he died and what his followers said happened next. That makes the historical questions unusually close to the heart of the faith, and Christians have argued about them in the open for two centuries.</p><p>The questions here are the same ones asked of every tradition. How does the tradition understand its texts? What survives, in what language, and how close to the first writing? And which historical claims can be checked against other evidence?</p><blockquote class="quote"><p>Since many have undertaken to set down an orderly account of the events that have been fulfilled among us, just as they were handed on to us by those who from the beginning were eyewitnesses and servants of the word, I too decided, after investigating everything carefully from the very first, to write an orderly account for you, most excellent Theophilus.</p><cite>Luke 1:1–3, New Revised Standard Version (1989)</cite></blockquote><p>Luke&#x27;s opening is itself a statement of method: sources, eyewitnesses, careful investigation. It is a good place to start.</p></section><section class="wsec" id="christianity-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>How the church understands its books</h3><p>For Christians, the Bible has two parts. The Old Testament is the scripture of Israel, read in the light of Jesus. The New Testament gathers 27 writings from the first generations of believers: four Gospels, the Acts of the Apostles, 21 letters and the Revelation to John. The church teaches that these were written under the inspiration of the Holy Spirit and that the church recognised them because they were already read in worship and traced to the apostles.</p><p>Traditions differ in the details. Catholic and Orthodox Bibles include books from the Greek Old Testament, such as Tobit and the Maccabees, that Protestant Bibles leave out. The Syriac Peshitta long omitted 2 Peter, 2 and 3 John, Jude and Revelation, and the Ethiopian church keeps a broader canon that includes 1 Enoch and Jubilees. The core, though, has been shared since the 4th century.</p></section><section class="wsec" id="christianity-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The earliest pages</h3><p>The oldest Christian writings are Paul&#x27;s letters, written in Greek to communities he founded around the eastern Mediterranean between about 50 and 60 CE. In one of them he passes on a summary he says he had received, very likely within a few years of the crucifixion.</p><blockquote class="quote"><p>For I handed on to you as of first importance what I in turn had received: that Christ died for our sins in accordance with the scriptures, and that he was buried, and that he was raised on the third day in accordance with the scriptures.</p><cite>1 Corinthians 15:3–4, New Revised Standard Version (1989)</cite></blockquote><p>Most scholars date Mark&#x27;s Gospel to about 70 CE, Matthew and Luke to about 80–90, and John to about 90–100. None of the original documents survives; none of any ancient book does. What survives are copies, and here the New Testament is unusually rich. A scrap of papyrus the size of a credit card, P52 in the John Rylands Library in Manchester, holds a few lines of John 18. It is usually dated by handwriting to about 125–175 CE, though Brent Nongbri has shown that the handwriting alone allows a later date.</p><p>By about 200 CE the evidence widens: P46, a papyrus book of Paul&#x27;s letters split between Dublin and Michigan; P66, a nearly complete copy of John; and P75, holding much of Luke and John, now in the Vatican Library. In the 4th century come the great parchment Bibles, Codex Vaticanus and Codex Sinaiticus, the second containing the oldest complete New Testament. Altogether more than 5,700 Greek manuscripts are catalogued.</p><aside class="wcall"><b>How do we know?</b><p>Most early New Testament papyri are dated by palaeography, comparing handwriting with dated documents, because radiocarbon testing would destroy precious material. Palaeography gives ranges of 50 to 100 years or more. Scholars such as Pasquale Orsini, Willy Clarysse and Brent Nongbri have argued that some famous papyri were dated too early and too precisely, so this site gives the wider ranges.</p></aside></section><section class="wsec" id="christianity-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Where the copies disagree</h3><p>Copying by hand produces differences, and the New Testament&#x27;s many copies record hundreds of thousands of them. Most are trivial: spelling, word order, a dropped article. A few matter, and modern Bibles mark them openly in brackets or footnotes.</p><ul class="wlist"><li>Mark 16:9–20. The oldest complete manuscripts, Sinaiticus and Vaticanus, end Mark at 16:8, with the women fleeing the empty tomb in fear. The familiar longer ending is missing there, and early writers such as Eusebius knew copies without it.</li><li>John 7:53–8:11. The story of the woman caught in adultery, with the line about casting the first stone, is absent from P66, P75, Sinaiticus and Vaticanus. Many scholars think it is an old story that found its way into John later.</li><li>1 John 5:7–8, the Comma Johanneum. A sentence naming the Father, the Word and the Holy Spirit appears in Latin writers from the late 4th century and in later Latin Bibles, but in only a handful of late Greek manuscripts. Erasmus added it in 1522 and the King James Version kept it.</li><li>Acts. The form of Acts in Codex Bezae is nearly a tenth longer than the other forms, with added details that may reflect a 2nd-century revision.</li></ul><blockquote class="wpull"><p>The New Testament has more variants than any ancient book because it has more copies than any ancient book.</p></blockquote><p>Scholars disagree about what this means. Bart Ehrman stresses that early copyists sometimes changed the text for theological reasons. Others, such as the editors of the Nestle-Aland edition, stress how rarely those changes affect meaning and how securely the early text can be reconstructed. Both points can be true at once.</p></section><section class="wsec" id="christianity-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Translated from the start</h3><p>Christianity is a translated faith in a way few others are. Jesus taught mainly in Aramaic, the everyday language of Galilee, yet the Gospels were written in Greek. Only a few of his Aramaic words survive in the text, such as &quot;Talitha cum&quot; (Mark 5:41) and his cry from the cross (Mark 15:34). His teaching reaches us, from the beginning, through translation.</p><p>The first Christians read the Hebrew scriptures mostly in Greek, in the Septuagint made by Jews in Alexandria. By the 2nd century the Gospels were being put into Latin, Syriac and Coptic. Jerome&#x27;s Latin Vulgate, begun in 382 CE, became the Bible of the Western church for a thousand years. Erasmus printed the Greek New Testament in 1516, and the translations of the Reformation, from Luther&#x27;s German (1522) to the King James Version (1611), rested on the late Byzantine Greek text he used. Modern translations rest on the older manuscripts found since then.</p></section><section class="wsec" id="christianity-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Which books? The making of the canon</h3><p>No council in the 1st century issued a list. Around 140 CE Marcion, whom other Christians rejected, proposed a canon of one edited Gospel and ten letters of Paul, and the wider church began to define its own. The Muratorian fragment, a list of accepted books, is usually dated to the late 2nd century, though some scholars argue for the 4th. Some writings, such as Hebrews, James, 2 Peter and Revelation, were debated for generations.</p><p>In 367 CE Athanasius, bishop of Alexandria, listed exactly the 27 books of today&#x27;s New Testament, and councils at Hippo (393) and Carthage (397) confirmed the list for North Africa. The canon, in other words, is a well-documented historical process, in which believers see the church recognising what God had given.</p><p>Other early Christian writings were left out. In 1945 farmers near Nag Hammadi in Egypt found a jar of 4th-century Coptic books, among them the Gospel of Thomas, a collection of sayings attributed to Jesus. Greek fragments of Thomas found earlier at Oxyrhynchus date to around 200 CE. Scholars debate whether some of its sayings are as early as those in the canonical Gospels; most date the collection as a whole to the 2nd century. These finds show how varied early Christian writing was, and why the question of which books belonged mattered so much to the communities that decided it.</p></section><section class="wsec" id="christianity-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>Jesus in the historical record</h3><p>Outside the New Testament, the earliest references to Jesus come from writers who had no reason to promote him. Josephus, a Jewish historian writing around 93 CE, mentions James as the brother of Jesus &quot;who was called Christ&quot;; a longer paragraph about Jesus in his work is widely thought to contain later Christian additions around an authentic core. The Roman historian Tacitus, writing around 116 CE, explains who the Christians were.</p><blockquote class="quote"><p>Christus, from whom the name had its origin, suffered the extreme penalty during the reign of Tiberius at the hands of one of our procurators, Pontius Pilatus.</p><cite>Tacitus, Annals 15.44, trans. A. J. Church and W. J. Brodribb (1876)</cite></blockquote><p>In 1961 archaeologists at Caesarea Maritima found a limestone block naming Pontius Pilate as prefect of Judea, the clearest inscription naming him from his own lifetime. An ossuary inscribed with the name of Caiaphas, the high priest of the Gospels, turned up in a Jerusalem tomb in 1990, and an inscription at Delphi dates the Roman governor Gallio, before whom Acts sets Paul on trial, to about 51–52 CE. Together, these sources support what nearly all historians accept: Jesus lived, was baptised by John, gathered followers in Galilee, and was crucified in Jerusalem under Pilate around 30–33 CE.</p><p>Other matters stay open. The birth stories in Matthew and Luke differ from each other, and Luke&#x27;s census under Quirinius sits uneasily with Josephus&#x27;s date of 6 CE. Miracles and the resurrection lie beyond what historians can test; they remain, as they began, matters of faith. What the historical record does show is that the faith&#x27;s founding documents are close in time to their events and exceptionally well preserved.</p></section><details class="srcs"><summary>Sources for this tradition (20)</summary><ol><li>Metzger B. M., Ehrman B. D. (2005). The Text of the New Testament: Its Transmission, Corruption, and Restoration, 4th ed. Oxford University Press.</li><li>Metzger B. M. (1994). A Textual Commentary on the Greek New Testament, 2nd ed. Deutsche Bibelgesellschaft.</li><li>Metzger B. M. (1987). The Canon of the New Testament: Its Origin, Development, and Significance. Oxford University Press.</li><li>Aland K., Aland B. (1989). The Text of the New Testament, 2nd ed. Eerdmans.</li><li>Nestle-Aland (2012). Novum Testamentum Graece, 28th ed. Deutsche Bibelgesellschaft.</li><li>Nongbri B. (2005). The use and abuse of P52: papyrological pitfalls in the dating of the Fourth Gospel. Harvard Theological Review 98(1): 23–48.</li><li>Orsini P., Clarysse W. (2012). Early New Testament manuscripts and their dates: a critique of theological palaeography. Ephemerides Theologicae Lovanienses 88: 443–474.</li><li>Roberts C. H. (1935). An Unpublished Fragment of the Fourth Gospel in the John Rylands Library. Manchester University Press.</li><li>Hurtado L. W. (2006). The Earliest Christian Artifacts: Manuscripts and Christian Origins. Eerdmans.</li><li>Center for the Study of New Testament Manuscripts (2022). Manuscripts 101: GA numbers. csntm.org; Institut für Neutestamentliche Textforschung, Kurzgefasste Liste (online).</li><li>Ehrman B. D. (2012). Did Jesus Exist? The Historical Argument for Jesus of Nazareth. HarperOne.</li><li>Meier J. P. (1991). A Marginal Jew: Rethinking the Historical Jesus, vol. 1. Doubleday.</li><li>Sanders E. P. (1993). The Historical Figure of Jesus. Allen Lane.</li><li>Brown R. E. (1977). The Birth of the Messiah. Doubleday.</li><li>Tacitus, Annals, trans. A. J. Church and W. J. Brodribb (1876). Macmillan.</li><li>Josephus, Jewish Antiquities, trans. W. Whiston (1737); Loeb edition trans. L. H. Feldman (1965).</li><li>Israel Museum, Jerusalem. The Pilate Inscription, Caesarea Maritima (found 1961).</li><li>Jobes K. H., Silva M. (2015). Invitation to the Septuagint, 2nd ed. Baker Academic.</li><li>Tov E. (2012). Textual Criticism of the Hebrew Bible, 3rd ed. Fortress Press.</li><li>British Library, Leipzig University Library, National Library of Russia, St Catherine&#x27;s Monastery. Codex Sinaiticus Project (codexsinaiticus.org).</li></ol></details><aside class="rc-cite" data-v="faiths" data-id="faith-christianity" data-t="Christianity"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Christianity</i>. <span class="cite-u">https://residualcontinuum.com/#faiths/faith-christianity</span> (updated 25 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="faith-islam-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Birmingham Quran manuscript.jpg" data-cap="The Birmingham Quran leaves, radiocarbon-dated 568–645 CE" data-big><figcaption></figcaption></figure><div class="sh-k">Arabia</div><h2 class="sh-t" id="faith-islam-st" tabindex="-1">Islam</h2><p class="sh-s">A faith founded on a recited book, whose earliest surviving pages were written within decades of the Prophet&#x27;s lifetime, perhaps within it.</p><div class="sh-v"><span class="vstamp vstamp--when">7th century CE</span></div></div><div class="f-facts"><div><span>Began</span><b>Mecca and Medina, Arabia</b><small>610–632 CE</small></div><div><span>Followers today</span><b>about 2.0 billion (25.6 percent of the world&#x27;s population)</b><small>Pew Research Center, 2020 estimate (report published June 2025)</small></div></div><h3 class="sub-h wsub">In its own words</h3><blockquote class="quote f-own"><p>Islam means submission to God, the One, who has no partner and no equal. God sent prophets to every people, among them Noah, Abraham, Moses and Jesus, and sent Muhammad as the last of them, a mercy to the worlds. Over some 23 years God revealed the Quran to him in clear Arabic: guidance for all humanity, recited in prayer and carried in the hearts of believers. A Muslim bears witness that there is no god but God and that Muhammad is His messenger, prays five times a day, gives to those in need, fasts in Ramadan and, if able, makes the pilgrimage to Mecca. Life is a trust, and every soul will return to God and answer for what it did on the Day of Judgement.</p><cite>How a follower might put it, in our words</cite></blockquote><h3 class="sub-h wsub">What it teaches and claims</h3><p class="rd-rule">Claims about God, revelation, the soul or miracles are matters of faith and are not rated. Claims about people, places, events and texts are weighed on the evidence.</p><ul class="rds"><li class="rd"><p class="rd-s">The Quran is the word of God, revealed to Muhammad through Gabriel (Jibril) over about 23 years.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">The foundation of Islam. Historians can study when and how the text was written down; the claim that it is God&#x27;s own speech is a matter of faith and is not rated. <span class="cite">Quran 96:1–5; 26:192–195</span></p></li><li class="rd"><p class="rd-s">Muhammad is the last prophet in a line that includes Abraham, Moses and Jesus.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">Islam sees itself as the restoration of the faith of Abraham, not a new religion. Prophethood is a matter of faith; Muhammad&#x27;s life as a historical person is rated below. <span class="cite">Quran 33:40; 3:84</span></p></li><li class="rd"><p class="rd-s">God has promised to protect the Quran from corruption.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">Muslims understand this verse as a divine guarantee. The historical record of the text, which can be tested, is set out in the text record below and is kept separate from this promise. <span class="cite">Quran 15:9</span></p></li><li class="rd"><p class="rd-s">Muhammad lived in Mecca and Medina and led a community of believers in the early 7th century.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">Christian writers mention him from the 630s onward, Arabic documents and coins name him by the 680s, and a dated calendar counting from his emigration is in use by 643 CE. <span class="cite">Hoyland 1997; PERF 558</span></p></li><li class="rd"><p class="rd-s">The Quran was written down and standardised under Caliph Uthman around 650 CE.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">Radiocarbon-dated manuscripts from the mid-7th century, almost all matching the Uthmanic consonantal text, fit the tradition&#x27;s account well. Details of the process and its exact date are still discussed. <span class="cite">Sadeghi and Goudarzi 2012; Déroche 2014</span></p></li><li class="rd"><p class="rd-s">The Kaaba in Mecca was built by Abraham and Ishmael.</p><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span><p class="rd-n">Mecca&#x27;s sanctuary cannot be excavated and no pre-Islamic inscription describes its founding. The tradition may preserve old memory, but no physical evidence has been found either way. <span class="cite">Quran 2:127</span></p></li><li class="rd"><p class="rd-s">Muhammad was carried by night from Mecca to Jerusalem and ascended through the heavens.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">The Night Journey and Ascension (al-Isra wa al-Miraj) are central to Muslim devotion and to Jerusalem&#x27;s place in Islam. They are matters of faith, not rated here. <span class="cite">Quran 17:1; Sahih al-Bukhari 3887</span></p></li><li class="rd"><p class="rd-s">The hadith collections preserve Muhammad&#x27;s words and deeds through reliable chains of narrators.</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">Muslim scholarship built a rigorous system for testing narrators. Western scholars since Goldziher and Schacht have doubted many chains; later work traces some material to the late 7th century. Reliability varies report by report. <span class="cite">Brown 2009; Motzki 2002</span></p></li><li class="rd"><p class="rd-s">The Quran&#x27;s descriptions of the natural world are signs of its divine origin.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">Verses on the sky, the sea, bees and plants are read by believers as signs (ayat). Whether they show divine origin is a matter of faith and is not rated. What the science says, and what the 7th century already knew, are weighed in the history list and in the deep dive. <span class="cite">Quran 41:53; 21:32; 16:68–69</span></p></li></ul><h3 class="sub-h wsub">History, weighed</h3><ul class="rds"><li class="rd"><p class="rd-s">Writers outside Islam mention Muhammad within a few years of his death.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">A Syriac chronicle by Thomas the Presbyter (c. 640) records a battle in 634 CE between the Romans and &quot;the Tayyaye of Muhammad&quot; near Gaza. The Greek Doctrina Jacobi (c. 634) and the Armenian history of Sebeos (c. 660s) speak of a prophet among the Arabs. <span class="cite">Hoyland 1997; British Library Add. MS 14,643</span></p></li><li class="rd"><p class="rd-s">A calendar counting from Muhammad&#x27;s emigration to Medina (622 CE) was in use by 643 CE.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">A Greek-Arabic papyrus receipt from Egypt (PERF 558, Vienna) is dated in year 22 of the new era, April 643 CE. A rock inscription near al-Hijr names the death of Caliph Umar in year 24 (644 CE). <span class="cite">Hoyland 1997; Zuhayr inscription</span></p></li><li class="rd"><p class="rd-s">Portions of the Quran were written down within a few decades of 632 CE.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">The Birmingham leaves (radiocarbon 568–645 CE), the Tübingen fragment (649–675 CE) and the Sana&#x27;a palimpsest (before 669 CE) are written in early Hijazi script. Radiocarbon dates the animal&#x27;s death, not the writing, so dates can run early. <span class="cite">University of Birmingham 2015; Universität Tübingen 2014</span></p></li><li class="rd"><p class="rd-s">A single standard text of the Quran was established in the mid-7th century.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">Nearly all early manuscripts share the Uthmanic consonantal skeleton, including shared spelling quirks that suggest one written archetype (Van Putten 2019). The Sana&#x27;a lower text shows other forms existed before, as tradition reports. <span class="cite">Van Putten 2019; Sadeghi and Goudarzi 2012</span></p></li><li class="rd"><p class="rd-s">The Dome of the Rock (691–692 CE) carries Quranic text and names Muhammad as God&#x27;s messenger.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">Its dated mosaic inscription, commissioned by Caliph Abd al-Malik, contains passages matching the Quran on the oneness of God and on Jesus, with small adaptations for the setting. It is the earliest securely dated long Quranic text. <span class="cite">Grabar 2006; Whelan 1998</span></p></li><li class="rd"><p class="rd-s">The Quran was only canonised around 800 CE, as John Wansbrough proposed.</p><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span><p class="rd-n">Wansbrough (1977) argued the text took final shape in 8th- and 9th-century Iraq. The 7th-century manuscripts and the Dome of the Rock inscription contradict so late a date, and most scholars, including sceptical ones, now accept an early standard text. <span class="cite">Wansbrough 1977; Sinai 2017</span></p></li><li class="rd"><p class="rd-s">The traditional biographies (sira) accurately record the details of Muhammad&#x27;s life.</p><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span><p class="rd-n">The earliest full biography, by Ibn Ishaq (d. c. 767), survives in the edition of Ibn Hisham (d. 833). Some core material goes back to Urwa ibn al-Zubayr (d. c. 712); many details, dates and numbers cannot be checked independently. <span class="cite">Görke and Schoeler 2008; Donner 2010</span></p></li><li class="rd"><p class="rd-s">Companions of the Prophet kept codices that differed from the Uthmanic text.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">Muslim sources report codices of Ibn Mas&#x27;ud and Ubayy ibn Ka&#x27;b with different wording and surah order. The Sana&#x27;a lower text is a physical example of a non-Uthmanic text of this kind, in close agreement with those reports. <span class="cite">Sadeghi and Bergmann 2010</span></p></li><li class="rd"><p class="rd-s">The Quran states scientific facts that no one could have known in the 7th century.</p><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span><p class="rd-n">Verse by verse, the science in each popular reading is sound and the text is not contradicted by it. For the bee, the date palm, the burning skin and the dark sea, the plain fact was already known in antiquity; for the sun, the mountains and the forelock, the match rests on giving an old word a modern sense. Muslim scholars are themselves divided on the method. <span class="cite">Guessoum 2008; Bigliardi 2017; see the deep dive</span></p></li></ul><h3 class="sub-h wsub">The texts and what survives of them</h3><p class="rd-rule">The textual record measures what survives and how close it is to the original. It says nothing about whether a text is true or inspired.</p><section class="txt"><h4 class="txt-h">The Quran</h4><ol class="jr" aria-label="How The Quran reached us"><li class="jr-s"><span>Composed</span><b>610–632 CE (revelation, in tradition and in most historians&#x27; view)</b></li><li class="jr-gap jr-gap--none"><span>copies survive from within the period of composition</span></li><li class="jr-s"><span>Oldest surviving copy</span><b>568–645 CE</b><small>Birmingham Quran manuscript (Mingana 1572a)</small></li><li class="jr-s jr-today"><span>Today</span><b>Read in the language of its source</b></li></ol><div class="rec"><div class="rec-r"><span>Closeness to the source</span><span class="rec-b" role="img" aria-label="Closeness to the source: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Source&#x27;s own language</span><span class="rec-b" role="img" aria-label="Source&#x27;s own language: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Gap to oldest copy</span><span class="rec-b" role="img" aria-label="Gap to oldest copy: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Early witnesses</span><span class="rec-b" role="img" aria-label="Early witnesses: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Stability of the text</span><span class="rec-b" role="img" aria-label="Stability of the text: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Documented history</span><span class="rec-b" role="img" aria-label="Documented history: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-tot"><span>Textual record</span><b>28<small>/30</small></b></div></div><p class="rec-why">Gap 5: 7th-century manuscripts overlap the lifetimes of the first hearers. Language 5: recited by Muhammad in Arabic, and preserved, recited and studied in that same Arabic; translations are treated as interpretations. Witnesses 5: dozens of 7th- and 8th-century manuscripts from several regions, though most are partial, so some would score 4. Stability 4: Uthmanic copies agree closely and readings stay within one skeleton, but the Sana&#x27;a lower text shows earlier wording differences. Documented 4: the tradition records each stage in detail; some details are debated. Source 5: the Prophet&#x27;s own recitation, memorised by those who heard it, written down in his lifetime (tradition), gathered within about two years of his death and standardised within about twenty.</p><dl class="txt-dl"><div><dt>Language of the text</dt><dd>Classical Arabic</dd></div><div><dt>Composed</dt><dd>610–632 CE (revelation, in tradition and in most historians&#x27; view)</dd></div><div><dt>Handed down</dt><dd>Recited aloud from the first revelation and memorised by many Companions; tradition reports that passages were also written during Muhammad&#x27;s life on parchment, palm stalks, bone and stone. Memorisation through certified chains of teachers (ijaza) continues today, and many believers know the whole text by heart.</dd></div><div><dt>Fixed in writing</dt><dd>Tradition: gathered into one written copy under Abu Bakr (c. 632–634) by Zayd ibn Thabit; standard copies made under Caliph Uthman c. 650 and sent to the main cities, with other codices destroyed. Dots and vowel signs added from the late 7th to the 8th century; seven canonical readings defined by Ibn Mujahid (d. 936); the Cairo edition of 1924 standardised the printed text in the Hafs reading.</dd></div><div><dt>Oldest surviving copy</dt><dd>Birmingham Quran manuscript (Mingana 1572a), 568–645 CE (radiocarbon, 95.4 percent probability (University of Oxford Radiocarbon Accelerator Unit, 2015))</dd></div><div><dt>Early witnesses</dt><dd>Corpus Coranicum counts more than 60 fragments with over 2,000 folios from before 800 CE, from Sana&#x27;a, Fustat, Damascus and elsewhere. 7th-century witnesses include the Birmingham leaves (part of the same codex as Paris BnF Arabe 328c), the Tübingen fragment (649–675 CE), the Sana&#x27;a palimpsest, and the Codex Parisino-petropolitanus, which preserves roughly 45 percent of the text.</dd></div></dl><div class="face"><div class="face-c face-m"><span class="face-k">How the tradition sees its text</span><p>Muslims hold the Quran to be the word of God, revealed in Arabic and protected by God&#x27;s promise (15:9). Its preservation rests first on memory, an unbroken chain of reciters back to the Prophet, checked against the written codex compiled by the Companions. The accepted readings are understood as revealed ways of reciting the same text, not as corruption.</p></div><div class="face-c face-x"><span class="face-k">What manuscript scholarship shows</span><p>Radiocarbon and palaeography place many Quran fragments in the 7th century, and the consonantal text of nearly all early manuscripts matches the Uthmanic standard, supporting standardisation around 650 CE. The Sana&#x27;a lower text shows that other textual forms circulated before then. Scholars still debate the Abu Bakr collection, the exact date of the archetype, and how to calibrate early radiocarbon dates.</p></div></div><h5 class="txt-sub">Documented changes, variants and revisions</h5><ul class="txt-ch"><li>Tradition reports that Uthman&#x27;s commission standardised the text and had other codices burned, including some linked to Ibn Mas&#x27;ud and Ubayy ibn Ka&#x27;b that reportedly differed in wording and surah order.</li><li>The Sana&#x27;a palimpsest&#x27;s lower text (parchment before 669 CE by radiocarbon) is a non-Uthmanic text with added, missing and different words and a different surah order (Sadeghi and Goudarzi 2012).</li><li>Early manuscripts write the consonantal skeleton (rasm) with few dots; dotting and vowel signs developed from the late 7th century, traditionally linked to Abu al-Aswad al-Du&#x27;ali and reforms under al-Hajjaj.</li><li>Canonical readings (qira&#x27;at) differ within one skeleton, for example maliki or maaliki (&quot;King&quot; or &quot;Master&quot;) in 1:4; the Hafs reading dominates today, Warsh in North and West Africa.</li><li>Uthman&#x27;s regional copies reportedly differed in a few dozen small points, often a single letter; these are listed in early Muslim scholarship and traced in early manuscripts (Cook 2004).</li></ul></section><section class="txt"><h4 class="txt-h">Sahih al-Bukhari (Hadith)</h4><ol class="jr" aria-label="How Sahih al-Bukhari (Hadith) reached us"><li class="jr-s"><span>Composed</span><b>compiled c. 830–846 CE from reports of Muhammad&#x27;s words and deeds (610–632 CE)</b></li><li class="jr-gap "><span>about 139 years with no surviving copy</span></li><li class="jr-s"><span>Oldest surviving copy</span><b>c. 970–1000 CE (360–390 AH)</b><small>Early manuscript published by Alphonse Mingana (1936)</small></li><li class="jr-s jr-today"><span>Today</span><b>Read in its source&#x27;s language, updated in places</b></li></ol><div class="rec"><div class="rec-r"><span>Closeness to the source</span><span class="rec-b" role="img" aria-label="Closeness to the source: 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><b>2</b></div><div class="rec-r"><span>Source&#x27;s own language</span><span class="rec-b" role="img" aria-label="Source&#x27;s own language: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Gap to oldest copy</span><span class="rec-b" role="img" aria-label="Gap to oldest copy: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Early witnesses</span><span class="rec-b" role="img" aria-label="Early witnesses: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Stability of the text</span><span class="rec-b" role="img" aria-label="Stability of the text: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Documented history</span><span class="rec-b" role="img" aria-label="Documented history: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-tot"><span>Textual record</span><b>21<small>/30</small></b></div></div><p class="rec-why">Gap 4: about 140 years from compilation to the oldest known manuscript; the reports themselves had already travelled about two centuries through chains of narrators, which this score does not measure. Language 4: preserved in Arabic, the Prophet&#x27;s language, though scholars of hadith accepted reports passed on by meaning as well as word for word. Witnesses 3: few copies before the 12th century. Stability 4: transmissions differ in minor wording and counts. Documented 4: the compiler and transmitters are well recorded, partly in admiring biographies. Source 2: reports of the Prophet&#x27;s words and deeds, carried through chains of narrators and compiled about two centuries after his death; the tradition&#x27;s chain criticism weighs each report.</p><dl class="txt-dl"><div><dt>Language of the text</dt><dd>Classical Arabic</dd></div><div><dt>Composed</dt><dd>compiled c. 830–846 CE from reports of Muhammad&#x27;s words and deeds (610–632 CE)</dd></div><div><dt>Handed down</dt><dd>Hadith were memorised and narrated through chains of named transmitters (isnad) for about two centuries, alongside written notebooks kept by some early scholars. Al-Bukhari is said to have examined hundreds of thousands of reports and chosen only those whose chains he judged sound.</dd></div><div><dt>Fixed in writing</dt><dd>Completed around 846 CE in Bukhara and taught mainly through his student al-Firabri (d. 932). The 13th-century scholar al-Yunini collated the main transmissions; the Ottoman Sultaniyya edition printed in Cairo in the 1890s, based on his work, is the standard text.</dd></div><div><dt>Oldest surviving copy</dt><dd>Early manuscript published by Alphonse Mingana (1936), c. 970–1000 CE (360–390 AH) (palaeography and transmission notes)</dd></div><div><dt>Oldest complete copy</dt><dd>Manuscript in the Süleymaniye Library, Istanbul, copied in al-Andalus, 1155 CE (colophon)</dd></div><div><dt>Early witnesses</dt><dd>A few partial manuscripts from the 10th–11th centuries and many complete copies from the 12th century onward, from al-Andalus to Central Asia, most carrying notes of who taught the book to whom. The standard count is 7,563 numbered reports with repetitions, about 2,602 without.</dd></div></dl><div class="face"><div class="face-c face-m"><span class="face-k">How the tradition sees its text</span><p>Sunni Muslims regard Sahih al-Bukhari as the most authentic book after the Quran, a judgement formed over the following centuries. Each report comes with its chain of named narrators, and generations of scholars examined each narrator&#x27;s memory, honesty and contact with his teachers. Shia Muslims rely on their own hadith collections and chains.</p></div><div class="face-c face-x"><span class="face-k">What manuscript scholarship shows</span><p>Western scholars have debated hadith since Ignaz Goldziher (1890) and Joseph Schacht (1950), who argued that many chains were projected back in time. Harald Motzki and others, comparing chains and wording together, have traced some material to the late 7th century. Bukhari&#x27;s book itself is well preserved; how far each report reaches back to Muhammad remains open.</p></div></div><h5 class="txt-sub">Documented changes, variants and revisions</h5><ul class="txt-ch"><li>Al-Bukhari chose a small fraction of the reports he gathered and arranged them under chapter headings that express his own legal judgements.</li><li>The transmissions of his students differ slightly in wording and in the number of reports; al-Yunini recorded these differences in the 13th century.</li><li>Counts vary between editions (7,563 in Muhammad Fuad Abdul Baqi&#x27;s numbering, other totals elsewhere) because of how repeated and partial reports are counted.</li><li>Al-Daraqutni (d. 995) questioned the chains of some reports; Ibn Hajar (d. 1449) answered in his great commentary, Fath al-Bari.</li></ul></section><h3 class="sub-h wsub">Through time</h3><ol class="ftl"><li><span class="ftl-y">c. 570 CE</span><b>Birth in Mecca</b><span>Muhammad is born in Mecca, according to tradition in the Year of the Elephant.</span></li><li><span class="ftl-y">610 CE</span><b>The first revelation</b><span>In a cave on Mount Hira, Muhammad receives the first verses: &quot;Recite in the name of your Lord who created&quot; (96:1).</span></li><li><span class="ftl-y">622 CE</span><b>The Hijra</b><span>Muhammad and his followers emigrate to Medina; the Islamic calendar counts from this year.</span></li><li><span class="ftl-y">632 CE</span><b>Death of the Prophet</b><span>Muhammad dies in Medina; tradition says Abu Bakr soon has the Quran gathered into one copy.</span></li><li><span class="ftl-y">634 CE</span><b>A Syriac witness</b><span>A battle near Gaza between the Romans and &quot;the Tayyaye of Muhammad&quot; is recorded by Thomas the Presbyter.</span></li><li><span class="ftl-y">643 CE</span><b>A dated papyrus</b><span>A receipt from Egypt, PERF 558, is dated in year 22 of the new Islamic era.</span></li><li><span class="ftl-y">568–645 CE</span><b>The Birmingham leaves</b><span>Radiocarbon range for the parchment of two Quran leaves now in Birmingham.</span></li><li><span class="ftl-y">c. 650 CE</span><b>The Uthmanic codex</b><span>Caliph Uthman sends standard copies of the Quran to the main cities, in tradition&#x27;s account.</span></li><li><span class="ftl-y">691–692 CE</span><b>The Dome of the Rock</b><span>Abd al-Malik&#x27;s shrine in Jerusalem is completed, with the earliest securely dated long Quranic inscription.</span></li><li><span class="ftl-y">c. 846 CE</span><b>Sahih al-Bukhari</b><span>Al-Bukhari completes his collection of authenticated hadith.</span></li><li><span class="ftl-y">1924</span><b>The Cairo edition</b><span>Al-Azhar scholars publish the printed Quran in the Hafs reading that became the world standard.</span></li><li><span class="ftl-y">2015</span><b>Birmingham dated</b><span>Oxford radiocarbon results place the Birmingham leaves among the oldest known Quran manuscripts.</span></li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">9 min read · 1,910 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Islam"><button type="button" class="wtoc-i" data-go="islam-s1">A book meant to be recited</button><button type="button" class="wtoc-i" data-go="islam-s2">The tradition&#x27;s account of the collection</button><button type="button" class="wtoc-i" data-go="islam-s3">Parchment and radiocarbon</button><button type="button" class="wtoc-i" data-go="islam-s4">A text beneath the text</button><button type="button" class="wtoc-i" data-go="islam-s5">Dots, vowels and readings</button><button type="button" class="wtoc-i" data-go="islam-s6">The hadith: sayings and their chains</button><button type="button" class="wtoc-i" data-go="islam-s7">Muhammad in the eyes of others</button><button type="button" class="wtoc-i" data-go="islam-s8">Verses and the sciences</button></nav></div><section class="wsec" id="islam-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A book meant to be recited</h3><p>The word qur&#x27;an means recitation. Before it was ever a book, the Quran was a voice: verses spoken by Muhammad in Mecca and Medina over some 23 years, repeated by his followers, recited in prayer. Muslim tradition remembers the first words he received, in a cave above Mecca around 610 CE, as a command to recite.</p><blockquote class="quote"><p>Recite in the name of your Lord who created.</p><cite>Quran 96:1, trans. Sahih International (1997)</cite></blockquote><p>That origin shapes everything about how Muslims understand their scripture. The Quran is held to be God&#x27;s own speech, in Arabic, and it lives first in memory. Children learn to recite it; many believers know the whole text by heart, and teachers pass on their recitation through certified chains that reach back, in the tradition&#x27;s account, to the Prophet himself. Written copies serve the recitation, not the other way round.</p><p>The same questions apply here as to every tradition. What does the tradition say about how its scripture was kept? What survives on parchment and stone, and how close does it come to the Prophet&#x27;s lifetime? And what can be said about the historical Muhammad from sources outside the tradition? On several of these points, the answers are unusually strong.</p></section><section class="wsec" id="islam-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The tradition&#x27;s account of the collection</h3><p>According to reports preserved in Sahih al-Bukhari and other collections, parts of the Quran were written down during Muhammad&#x27;s lifetime by scribes such as Zayd ibn Thabit. After his death in 632, many reciters died in battle, and Umar urged Abu Bakr, the first caliph, to gather the whole text. Zayd gathered it from what had been written on palm stalks, thin stones and other materials, and from the memories of those who knew it by heart; the resulting sheets later passed to Umar&#x27;s daughter Hafsa.</p><p>Around 650 CE, the third caliph, Uthman, hearing that believers in different provinces recited differently, ordered a committee led by Zayd to produce standard copies from Hafsa&#x27;s sheets. The copies went to cities such as Kufa, Basra and Damascus, and other codices were to be destroyed. The tradition also remembers that some Companions kept their own codices: that of Ibn Mas&#x27;ud is said to have lacked the first and last two surahs and to have differed in wording in places.</p><blockquote class="quote"><p>Indeed, it is We who sent down the message [i.e., the Qur&#x27;an], and indeed, We will be its guardian.</p><cite>Quran 15:9, trans. Sahih International (1997)</cite></blockquote><p>This is a remarkably detailed account for a 7th-century text, and it is candid about variation. It names the people involved, gives reasons, and admits that other copies once existed. That candour makes it testable.</p></section><section class="wsec" id="islam-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Parchment and radiocarbon</h3><p>In 2015 the University of Birmingham announced that two parchment leaves in its Mingana collection, containing parts of Surahs 18 to 20, had been radiocarbon dated at Oxford to between 568 and 645 CE with 95.4 percent probability. The range overlaps the Prophet&#x27;s lifetime. The leaves belong to the same codex as sixteen leaves in the Bibliothèque nationale de France in Paris.</p><p>Birmingham is not alone. A manuscript in Tübingen (Ma VI 165), containing Surah 17:35 to 36:57, was dated in 2014 to 649–675 CE. The Corpus Coranicum project in Berlin counts more than 60 fragments, with over 2,000 folios, from before 800 CE. Their consonantal text agrees with the standard Quran with very few exceptions.</p><aside class="wcall"><b>How do we know?</b><p>Radiocarbon measures when the animal whose skin became the parchment died, not when the ink went on, and parchment could be stored for years. Specialists such as François Déroche have urged caution, noting that radiocarbon results for some dated Quran manuscripts come out earlier than their written dates. Palaeography, the study of the script and page layout, provides a second, independent check, and here it also points to the 7th century.</p></aside><p>One recent finding is quietly striking. Marijn van Putten (2019) showed that early manuscripts share the same odd spellings of particular phrases in the same places, such as a special spelling of &quot;the grace of God&quot; in some verses but not others. Oral copying would not preserve such quirks. They suggest that the manuscripts descend from a single written archetype, as the account of Uthman&#x27;s copies describes.</p><blockquote class="wpull"><p>On the question of when the Quran&#x27;s text was fixed, tradition and manuscript science point to the same few decades.</p></blockquote></section><section class="wsec" id="islam-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>A text beneath the text</h3><p>In 1972, workers repairing the Great Mosque of Sana&#x27;a in Yemen found a cache of old parchment. Among the pages was a palimpsest: a Quran whose first text had been washed off and written over. Under ultraviolet light the lower text can be read. Its upper text is the standard Quran; its lower text is not.</p><p>One leaf, radiocarbon dated for Behnam Sadeghi and Uwe Bergmann (2010), gave 578–669 CE at 95 percent probability. Sadeghi and Mohsen Goudarzi (2012) edited the lower text and found words and phrases added, missing or replaced, and surahs in an order unlike the standard one, while the verses within each surah largely match. Asma Hilali, who edited the pages in 2017, counted dozens of non-spelling variants and suggested the pages may reflect teaching or practice copies.</p><p>Here the manuscript evidence and the tradition meet in an unexpected way. Muslim sources had always said that Companions&#x27; codices differed before Uthman&#x27;s standard. The Sana&#x27;a lower text looks like exactly such a codex. Sadeghi and Goudarzi argued that comparing it with the standard text supports the view that the Uthmanic version preserves the Prophet&#x27;s recitation with high accuracy, and that the surahs had taken their shape in his lifetime.</p></section><section class="wsec" id="islam-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Dots, vowels and readings</h3><p>Early Arabic writing was a skeleton. Several letters shared one shape, told apart by dots, and short vowels were not written at all. The earliest Quran manuscripts use dots sparingly. Tradition credits Abu al-Aswad al-Du&#x27;ali (d. c. 688) with the first vowel marks and places a fuller system of dotting under the governor al-Hajjaj (694–714); al-Khalil ibn Ahmad (d. c. 786) created the vowel signs used today.</p><p>Because the skeleton allows more than one reading in places, several recognised ways of reciting it grew up, each carried by a chain of teachers. In the 10th century the scholar Ibn Mujahid defined seven canonical readers; later scholars accepted ten. Most readings differ in small points, such as whether the opening surah calls God &quot;King&quot; (maliki) or &quot;Master&quot; (maaliki) of the Day of Judgement. Today most printed Qurans follow the reading of Hafs from Asim, fixed in the Cairo edition of 1924; the reading of Warsh from Nafi is used across much of North and West Africa.</p><p>For Muslims, these readings are part of the revelation, not errors that crept in. For historians, they are a well-documented record of how a consonantal text was vocalised. Both descriptions can be held at once.</p></section><section class="wsec" id="islam-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>The hadith: sayings and their chains</h3><p>Beside the Quran stands a second body of text: the hadith, reports of what Muhammad said and did, each with a chain (isnad) of named narrators. Muhammad ibn Isma&#x27;il al-Bukhari (810–870) is said to have travelled widely, examined hundreds of thousands of reports and chosen only a few thousand for his Sahih, completed around 846. Sunni Muslims regard it, with the collection of his contemporary Muslim, as the most authentic body of hadith.</p><p>Its oldest known manuscript, published by Alphonse Mingana in 1936, dates from around 970–1000 CE, and the oldest complete copy was finished in al-Andalus in 1155. The book itself is well preserved. The harder question is how far each report reaches back. Ignaz Goldziher and Joseph Schacht argued that many chains were created later to give legal opinions authority. Harald Motzki, comparing chains and wording together, traced some material to the late 7th century, and Jonathan Brown has shown how carefully Muslim critics themselves tested narrators.</p><aside class="wcall"><b>Where tradition and evidence meet</b><p>Muslim hadith criticism and modern historical criticism both ask the same question: who reported this, and could they have known? They differ mainly on how much trust the chains deserve. Reliability varies from report to report, which is why this site rates the collections as an open question rather than a single verdict.</p></aside></section><section class="wsec" id="islam-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>Muhammad in the eyes of others</h3><p>Some of the earliest references to Muhammad come from people who did not follow him. A Syriac chronicle by Thomas the Presbyter, copied in a manuscript of 724 now in the British Library, records a battle in February 634 between the Romans and &quot;the Tayyaye of Muhammad&quot; twelve miles east of Gaza. The Greek Doctrina Jacobi, written around 634, speaks of a prophet who had appeared among the Saracens. The Armenian historian Sebeos, in the 660s, describes a merchant named Mahmet who preached the God of Abraham to the Arabs.</p><p>Documents and stones add dates. A Greek-Arabic papyrus from Egypt, PERF 558, is dated in year 22 of the new era, April 643 CE. A rock inscription near al-Hijr, signed by a man named Zuhayr, is dated to the year Umar died, 24 (644 CE). Coins struck in the 680s carry the phrase &quot;Muhammad is the messenger of God&quot;, and the Dome of the Rock in Jerusalem, completed in 691–692, bears a long mosaic inscription quoting the Quran.</p><blockquote class="quote"><p>Say, &quot;He is Allah, [who is] One, Allah, the Eternal Refuge. He neither begets nor is born, Nor is there to Him any equivalent.&quot;</p><cite>Quran 112:1–4, trans. Sahih International (1997); phrases from this surah appear in the Dome of the Rock inscription</cite></blockquote><p>In the 1970s some scholars, notably John Wansbrough and, in a different way, Patricia Crone and Michael Cook, argued that the Quran and the traditional story took shape much later than Muslims believe. Their questions sharpened the field, but the 7th-century manuscripts and inscriptions have since pushed the text back to the time tradition gives it. Debate continues over the details of Muhammad&#x27;s biography, first written down more than a century after his death. On the survival of the Quran&#x27;s text itself, the evidence and the tradition&#x27;s account now largely agree.</p></section><section class="wsec" id="islam-s8"><h3 class="wsec-h"><span class="wsec-n">08</span>Verses and the sciences</h3><p>Since the 1970s a popular literature, often called i&#x27;jaz ilmi, &quot;the scientific miracle&quot;, has gathered verses of the Quran that seem to describe what science found only centuries later: a protected sky, a moving sun, a dark deep sea, mountains that drift. The French physician Maurice Bucaille&#x27;s The Bible, the Qur&#x27;an and Science (1976) carried the idea around the world; today it fills books, television and countless short videos.</p><p>The idea has an old root and old critics inside the tradition itself. Al-Ghazali (d. 1111) wrote that the Quran holds the seeds of all the sciences. Al-Shatibi (d. 1388) warned against reading into the text sciences its first hearers would not have recognised. The argument continues: some Muslim scientists, among them the astrophysicist Nidhal Guessoum, hold that the verses about nature invite reflection rather than laboratory claims, and that tying scripture to today&#x27;s theories risks binding it to tomorrow&#x27;s corrections.</p><aside class="wcall"><b>What is weighed here</b><p>That the Quran is God&#x27;s word is a matter of faith and is not rated. Two other things can be checked: what the science says now, and whether the knowledge in each verse was available in seventh-century Arabia. Those are questions about nature and about history, and they are weighed below, verse by verse.</p></aside><ul class="wlist"><li>A protected ceiling (21:32). The atmosphere and the magnetic field do shield the Earth: meteors burn up, the ozone layer absorbs ultraviolet, the solar wind is turned aside. Established. Classical commentators read the guarded roof as a sky held up without pillars and kept from devils, as verses 15:17 and 37:7 say; the shielding reading is modern.</li><li>The sun runs to its resting place (36:38). The Sun does move: about 18 kilometres a second relative to its stellar neighbours, toward a point in Hercules called the solar apex, and about 240 kilometres a second around the centre of the Milky Way, toward Cygnus. Established. The word mustaqarr means a fixed course, an appointed term or a resting place; early readers took it as the sun&#x27;s daily setting or its final end, and a Companion&#x27;s codex is reported to have read &quot;with no resting place&quot;. That the sun moves was not news in the 7th century, when every astronomer watched it travel the zodiac; its motion among the stars was first shown by William Herschel in 1783.</li><li>A day like a thousand years (22:47; 32:5), a day of fifty thousand (70:4). Time does run at different rates for observers at different speeds or depths in gravity: atomic clocks flown around the world in 1972 and the corrections built into GPS show it daily. Established. The verses speak of God&#x27;s day and of the Day of Judgement, with two different figures, and classical readers took them as the vastness of divine time or the length of that Day. Dilation depends on speed and gravity, which the verses do not mention; the likeness is one of theme, not of mec
