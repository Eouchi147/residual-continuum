cerns the Book of Documents, a collection of royal speeches and records. After the Qin, a scholar named Fu Sheng recovered 29 chapters. In 317 CE a court official, Mei Ze, presented a much longer version of 58 chapters, claiming it as the long-lost &#x27;Old Text&#x27;. It became the official text, carved in stone and memorised for the examinations for over a thousand years.</p><p>In the 17th century the scholar Yan Ruoju showed, by close study of language, quotations and anachronisms, that the extra chapters were compositions of the 3rd or 4th century CE. Most scholars were persuaded. In 2008 a looted collection of Warring States bamboo slips, acquired by Tsinghua University and radiocarbon dated to about 305 BCE, added fresh evidence: it contains a text titled &#x27;Yin gao&#x27; that does not match Mei Ze&#x27;s chapter of that name. It is a striking example of scholarship inside a tradition correcting that tradition&#x27;s own text.</p><blockquote class="wpull"><p>Confucian scholars themselves exposed the forged chapters, using the tradition&#x27;s own tools of close reading.</p></blockquote></section><section class="wsec" id="confucianism-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What remains open</h3><p>How many sayings in the Analects go back to Confucius himself remains debated; E. Bruce and A. Taeko Brooks argued for strata added over two centuries, while others see a more unified early core. The full publication of the Haihunhou slips may tell us what the lost Qi version contained. And the Tsinghua and other collections with no recorded findspot, though widely accepted, remind us that the market in looted manuscripts complicates the evidence. What seems clear is that the Confucian record, like Confucius himself, is a transmitter: layered, edited and remarkably persistent.</p></section><details class="srcs"><summary>Sources for this tradition (17)</summary><ol><li>Poli, Maddalena and Li, Yumeng (2024). &#x27;New Manuscript Evidence on the Formation of the Analects: The Warring States Anhui University *Zhongni Said and the Wangjiazui *Kongzi Said&#x27;. Early China 47. <a href="https://doi.org/10.1017/eac.2024.9" target="_blank" rel="noopener">doi:10.1017/eac.2024.9</a></li><li>van Els, Paul (2009). &#x27;Dingzhou: The Story of an Unfortunate Tomb&#x27;. Asiatische Studien / Études Asiatiques 63 (4): 909–941.</li><li>Chu, Daqing (2025). &#x27;A brief overview of the unearthed Analects documents in East Asia over the past 50 years&#x27;. SAGE Journals. <a href="https://doi.org/10.1177/25138502241273900" target="_blank" rel="noopener">doi:10.1177/25138502241273900</a></li><li>Makeham, John (1996). &#x27;The Formation of Lunyu as a Book&#x27;. Monumenta Serica 44: 1–24.</li><li>Brooks, E. Bruce and Brooks, A. Taeko (1998). The Original Analects: Sayings of Confucius and His Successors. New York: Columbia University Press.</li><li>Nylan, Michael (2001). The Five &#x27;Confucian&#x27; Classics. New Haven: Yale University Press.</li><li>Nylan, Michael and Wilson, Thomas (2010). Lives of Confucius: Civilization&#x27;s Greatest Sage Through the Ages. New York: Doubleday.</li><li>Kern, Martin (2010). &#x27;Early Chinese literature, beginnings through Western Han&#x27;. In The Cambridge History of Chinese Literature, vol. 1. Cambridge University Press.</li><li>Elman, Benjamin A. (1984). From Philosophy to Philology: Intellectual and Social Aspects of Change in Late Imperial China. Cambridge, MA: Harvard University Press.</li><li>Elman, Benjamin A. (2000). A Cultural History of Civil Examinations in Late Imperial China. Berkeley: University of California Press.</li><li>Shaughnessy, Edward L. (2006). Rewriting Early Chinese Texts. Albany: SUNY Press.</li><li>Li Xueqin (ed.) (2010). Qinghua daxue cang Zhanguo zhujian (Warring States bamboo slips in the Tsinghua University collection), vol. 1. Shanghai: Zhongxi shuju.</li><li>Hunter, Michael (2017). Confucius Beyond the Analects. Leiden: Brill.</li><li>Legge, James (1861). The Chinese Classics, vol. 1: Confucian Analects, The Great Learning, and The Doctrine of the Mean. Hong Kong and London.</li><li>Sima Qian, Shiji (Records of the Grand Historian), ch. 47 &#x27;Kongzi shijia&#x27;, c. 94 BCE.</li><li>UNESCO World Heritage Centre (1994). &#x27;Temple and Cemetery of Confucius and the Kong Family Mansion in Qufu&#x27;.</li><li>Pew Research Center (2012). The Global Religious Landscape. Washington, DC.</li></ol></details><aside class="rc-cite" data-v="faiths" data-id="faith-confucianism" data-t="Confucianism"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Confucianism</i>. <span class="cite-u">https://residualcontinuum.com/#faiths/faith-confucianism</span> (updated 25 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="faith-daoism-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Mawangdui Silk Texts 1.JPG" data-cap="Silk manuscripts from the Mawangdui tombs, buried in 168 BCE" data-big><figcaption></figcaption></figure><div class="sh-k">China</div><h2 class="sh-t" id="faith-daoism-st" tabindex="-1">Daoism</h2><p class="sh-s">A short, enigmatic book about the Way, whose oldest copies emerged from Chinese tombs and showed the text was still taking shape.</p><div class="sh-v"><span class="vstamp vstamp--when">4th century BCE onward (traditionally 6th century BCE)</span></div></div><div class="f-facts"><div><span>Began</span><b>Central and southern China; Laozi&#x27;s traditional birthplace is Ku county in Chu (modern Luyi, Henan)</b><small>texts c. 4th–3rd century BCE; organised religion from 142 CE</small></div><div><span>Followers today</span><b>no reliable separate count; Daoist rites form part of the Chinese folk religion that Pew counts at about 405 million people worldwide across all folk religions</b><small>Pew Research Center, The Global Religious Landscape (2012, 2010 estimate)</small></div></div><h3 class="sub-h wsub">In its own words</h3><blockquote class="quote f-own"><p>Before Heaven and Earth there was the Dao, the Way, nameless and formless, from which all things arise and to which they return. The Way cannot be grasped by words; it is known by stillness, simplicity and letting things take their natural course (wu wei). Water is our teacher: soft and yielding, it overcomes the hard. Lord Lao, who is the Dao made manifest, taught this Way and revealed it again to the first Celestial Master. Through ritual, meditation, ethical living and the cultivation of breath and inner energy, we harmonise body, community and cosmos, honour the immortals and the gods of heaven and earth, and return to the Way.</p><cite>How a follower might put it, in our words</cite></blockquote><h3 class="sub-h wsub">What it teaches and claims</h3><p class="rd-rule">Claims about God, revelation, the soul or miracles are matters of faith and are not rated. Claims about people, places, events and texts are weighed on the evidence.</p><ul class="rds"><li class="rd"><p class="rd-s">The Dao is the nameless source and pattern of all things.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">The foundational teaching of the Daodejing&#x27;s first chapter and of all later Daoism. It concerns the ultimate nature of reality and is not rated. <span class="cite">Daodejing 1, 25, 42</span></p></li><li class="rd"><p class="rd-s">Living by non-forcing action (wu wei), simplicity and humility brings harmony.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">An ethical and spiritual teaching expressed through images of water, the uncarved block and the infant. It describes how to live, not a historical event, so it is not rated. <span class="cite">Daodejing 8, 28, 37</span></p></li><li class="rd"><p class="rd-s">Lord Lao, the deified Laozi, revealed a new covenant to Zhang Daoling in 142 CE.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">The founding revelation of the Celestial Masters. The revelation is a matter of faith; the existence of the movement in 2nd-century Sichuan is a historical question rated below. <span class="cite">Kohn 2000; Kleeman 2016</span></p></li><li class="rd"><p class="rd-s">Through cultivation of breath, diet, alchemy and virtue, a person may attain long life and transcendence.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">Teachings on longevity and immortality, developed by Ge Hong (c. 283–343) and later inner alchemy. The spiritual goal is not rated here. <span class="cite">Ge Hong, Baopuzi; Kohn 2000</span></p></li><li class="rd"><p class="rd-s">Laozi was a real archivist at the Zhou court and an older contemporary of Confucius.</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">Sima Qian (c. 94 BCE) could not decide between three candidates, Li Er, Lao Laizi and the Grand Historian Dan. Some scholars think a historical Lao Dan is plausible; others treat Laozi as a legendary figure attached to a compiled book. <span class="cite">Shiji 63; Kohn 2000</span></p></li><li class="rd"><p class="rd-s">Laozi wrote the Daodejing for the keeper of the western pass before vanishing.</p><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span><p class="rd-n">The story appears first in the Shiji, some three centuries after the setting. No early source confirms it, and the manuscript evidence points to a text assembled over time rather than written in one sitting. <span class="cite">Shiji 63; Henricks 2000</span></p></li><li class="rd"><p class="rd-s">The Celestial Masters movement arose in Sichuan in the 2nd century CE.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">Official histories describe Zhang Daoling&#x27;s grandson Zhang Lu ruling a religious community in Hanzhong, and Celestial Master liturgy survives in early medieval texts. The precise date of 142 CE comes from the tradition itself. <span class="cite">Sanguozhi 8; Kleeman 2016</span></p></li><li class="rd"><p class="rd-s">The Tang emperors descended from Laozi.</p><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span><p class="rd-n">The Tang imperial Li family claimed Laozi (surnamed Li in the Shiji) as its ancestor and honoured him with imperial titles. The claim served political legitimacy; no genealogy links them. <span class="cite">Kohn 2000</span></p></li></ul><h3 class="sub-h wsub">History, weighed</h3><ul class="rds"><li class="rd"><p class="rd-s">Written Daodejing material existed by about 300 BCE.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">Tomb 1 at Guodian, Hubei, excavated in 1993 and dated to about 300 BCE by tomb type and grave goods, held three bundles of bamboo slips with material matching 31 of the 81 received chapters, about two-fifths of the text. <span class="cite">Allan and Williams 2000; Henricks 2000</span></p></li><li class="rd"><p class="rd-s">The Daodejing was composed by a single author in the 6th century BCE.</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">The traditional view. The Guodian bundles contain only part of the text in a different order, and the complete Mawangdui copies appear only about 130 years later. Many scholars see a compilation that grew through the 4th and 3rd centuries BCE; some still defend an earlier core. <span class="cite">Henricks 2000; Allan and Williams 2000</span></p></li><li class="rd"><p class="rd-s">Complete copies of the Daodejing were buried at Mawangdui in 168 BCE.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">Tomb 3 at Mawangdui, Changsha, sealed in 168 BCE, held two silk copies (A and B). Both place the De section before the Dao section, reversing the received order. Copy A does not avoid the personal name of the first Han emperor, suggesting it was copied before about 195 BCE. <span class="cite">Henricks 1989</span></p></li><li class="rd"><p class="rd-s">Confucius met Laozi and asked him about ritual.</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">The meeting is reported in the Zhuangzi, the Liji and the Shiji, and it was a favourite scene in Han stone reliefs. All sources are centuries later and served different agendas; the meeting may be a legend illustrating the two teachings. <span class="cite">Shiji 63; Liji, &#x27;Zengzi wen&#x27;</span></p></li><li class="rd"><p class="rd-s">Zhang Lu ruled a Celestial Master community in Hanzhong from about 191 to 215 CE.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">The Sanguozhi and Hou Hanshu describe Zhang Lu&#x27;s administration, with libationer officials, free lodging for travellers and confession of sins, until he submitted to Cao Cao in 215. Independent official histories agree on the outline. <span class="cite">Sanguozhi 8; Kleeman 2016</span></p></li><li class="rd"><p class="rd-s">The Han court offered sacrifices to Laozi as a deity in 165–166 CE.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">The Hou Hanshu records Emperor Huan&#x27;s envoys sacrificing at Laozi&#x27;s reputed birthplace and a palace sacrifice. Bian Shao&#x27;s &#x27;Inscription for Laozi&#x27; (165 CE), preserved in later collections, presents Laozi as a cosmic being. <span class="cite">Hou Hanshu 7; Seidel 1969</span></p></li><li class="rd"><p class="rd-s">A Yuan dynasty edict of 1281 ordered Daoist scriptures burned, except the Daodejing.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">After court debates between Buddhists and Daoists, Khubilai Khan ordered the destruction of Daoist texts and printing blocks, sparing the Daodejing. Many works of the earlier canon were lost, a gap still visible in the Ming canon. <span class="cite">Schipper and Verellen 2004</span></p></li><li class="rd"><p class="rd-s">The Ming Daoist Canon of 1445 preserves about 1,500 texts.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">The Zhengtong Daozang, printed in the Zhengtong reign with a supplement of 1607, survives in several sets and modern reprints. Schipper and Verellen&#x27;s companion catalogues and dates its contents, which range from Han to Ming. <span class="cite">Schipper and Verellen 2004</span></p></li></ul><h3 class="sub-h wsub">The texts and what survives of them</h3><p class="rd-rule">The textual record measures what survives and how close it is to the original. It says nothing about whether a text is true or inspired.</p><section class="txt"><h4 class="txt-h">The Daodejing (Laozi)</h4><ol class="jr" aria-label="How The Daodejing (Laozi) reached us"><li class="jr-s"><span>Composed</span><b>c. 5th–3rd century BCE (traditionally 6th century BCE by Laozi)</b></li><li class="jr-gap jr-gap--none"><span>copies survive from within the period of composition</span></li><li class="jr-s"><span>Oldest surviving copy</span><b>c. 300 BCE</b><small>Guodian Laozi, bundles A, B and C (bamboo slips), Guodian tomb 1, Jingmen</small></li><li class="jr-s jr-today"><span>Today</span><b>Read in the language of its source</b></li></ol><div class="rec"><div class="rec-r"><span>Closeness to the source</span><span class="rec-b" role="img" aria-label="Closeness to the source: 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><b>2</b></div><div class="rec-r"><span>Source&#x27;s own language</span><span class="rec-b" role="img" aria-label="Source&#x27;s own language: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Gap to oldest copy</span><span class="rec-b" role="img" aria-label="Gap to oldest copy: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Early witnesses</span><span class="rec-b" role="img" aria-label="Early witnesses: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Stability of the text</span><span class="rec-b" role="img" aria-label="Stability of the text: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Documented history</span><span class="rec-b" role="img" aria-label="Documented history: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-tot"><span>Textual record</span><b>23<small>/30</small></b></div></div><p class="rec-why">Gap 5: the Guodian slips fall inside the likely composition period. Language 5: the Classical Chinese text survives and is used. Witnesses 5: several early copies on bamboo and silk from different tombs, plus many later ones. Stability 3: order, chapter 19 and many lines differ in wording. Documented 3: Han and later editions are known, but the formation before 300 BCE is inferred. Some scholars would score gap lower if they date the core to the 6th century BCE. Source 2: tradition credits Laozi, whose historicity is debated; the text looks like a compilation of sayings that took shape by about 300 BCE.</p><dl class="txt-dl"><div><dt>Language of the text</dt><dd>Classical Chinese</dd></div><div><dt>Composed</dt><dd>c. 5th–3rd century BCE (traditionally 6th century BCE by Laozi)</dd></div><div><dt>Handed down</dt><dd>Rhymed, aphoristic verses probably circulated orally and in small written collections before being gathered; the Guodian bundles may show that stage.</dd></div><div><dt>Fixed in writing</dt><dd>Complete by the Mawangdui copies (before 168 BCE), in &#x27;De then Dao&#x27; order. The received 81-chapter text descends from Han and later editions, especially those associated with Heshang Gong and Wang Bi (226–249 CE).</dd></div><div><dt>Oldest surviving copy</dt><dd>Guodian Laozi, bundles A, B and C (bamboo slips), Guodian tomb 1, Jingmen, c. 300 BCE (tomb typology and grave goods (Chu tomb before 278 BCE))</dd></div><div><dt>Oldest complete copy</dt><dd>Mawangdui Laozi A (silk), Mawangdui tomb 3, Changsha, copied c. 200–195 BCE, buried 168 BCE</dd></div><div><dt>Early witnesses</dt><dd>Guodian (c. 300 BCE, about two-fifths of the text), two Mawangdui silk copies (before 168 BCE), a nearly complete Western Han bamboo copy acquired by Peking University in 2009 (findspot unknown), Dunhuang manuscripts and Tang stone steles, plus the Heshang Gong, Wang Bi and Fu Yi editions.</dd></div></dl><div class="face"><div class="face-c face-m"><span class="face-k">How the tradition sees its text</span><p>Daoist tradition holds that Laozi, an elder sage of the Zhou court who was later revered as a manifestation of the Dao, wrote the book of about five thousand characters as he departed westward. Its words are recited in ritual and treated as scripture; different editions are respected rather than ranked.</p></div><div class="face-c face-x"><span class="face-k">What manuscript scholarship shows</span><p>Scholars see a text that grew in stages. By about 300 BCE parts existed in collections that differ in order and some key lines from the received text; within a century full versions circulated. Variants are meaningful but mostly modest: the book&#x27;s core ideas are present in the oldest copies.</p></div></div><h5 class="txt-sub">Documented changes, variants and revisions</h5><ul class="txt-ch"><li>The Mawangdui copies put chapters 38–81 (De) before chapters 1–37 (Dao), the reverse of the received text; the 81-chapter division is a later editorial arrangement (Henricks 1989).</li><li>Received chapter 19 urges abandoning &#x27;sageliness&#x27; and &#x27;humaneness and righteousness&#x27;; the Guodian version targets knowledge, argument and artifice instead, which many read as a later anti-Confucian edit (Henricks 2000).</li><li>Guodian groups the material in three bundles in a different order from any later edition, and part of chapter 64 appears twice, in slightly different wording (Allan and Williams 2000).</li><li>Rudolf Wagner showed that the transmitted &#x27;Wang Bi&#x27; text was partly altered by later copyists and no longer matches the wording Wang Bi&#x27;s own commentary explains (Wagner 2003).</li></ul></section><section class="txt"><h4 class="txt-h">The Zhuangzi</h4><ol class="jr" aria-label="How The Zhuangzi reached us"><li class="jr-s"><span>Composed</span><b>c. 4th–2nd century BCE (inner chapters often attributed to Zhuang Zhou, c. 369–286 BCE)</b></li><li class="jr-gap "><span>about 35 years with no surviving copy</span></li><li class="jr-s"><span>Oldest surviving copy</span><b>buried c. 165 BCE</b><small>Han bamboo fragments from Shuanggudui, Fuyang (tomb of the Marquis of Ruyin)</small></li><li class="jr-s jr-today"><span>Today</span><b>Read in the language of its source</b></li></ol><div class="rec"><div class="rec-r"><span>Closeness to the source</span><span class="rec-b" role="img" aria-label="Closeness to the source: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Source&#x27;s own language</span><span class="rec-b" role="img" aria-label="Source&#x27;s own language: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Gap to oldest copy</span><span class="rec-b" role="img" aria-label="Gap to oldest copy: 5 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i></span><b>5</b></div><div class="rec-r"><span>Early witnesses</span><span class="rec-b" role="img" aria-label="Early witnesses: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Stability of the text</span><span class="rec-b" role="img" aria-label="Stability of the text: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Documented history</span><span class="rec-b" role="img" aria-label="Documented history: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-tot"><span>Textual record</span><b>23<small>/30</small></b></div></div><p class="rec-why">Gap 5: Han fragments fall within about 35 years of the likely end of composition, though they cover little of the book. Language 5: the original Chinese survives. Witnesses 3: a handful of early fragments, Tang manuscripts and the Kōzanji copy. Stability 4: surviving witnesses of Guo Xiang&#x27;s edition agree closely. Documented 3: Guo Xiang&#x27;s cut is recorded, but what he removed is mostly unknown. Source 3: the inner chapters may be Zhuang Zhou&#x27;s own; the rest were added by followers, and a later editor cut the book from 52 to 33 chapters.</p><dl class="txt-dl"><div><dt>Language of the text</dt><dd>Classical Chinese</dd></div><div><dt>Composed</dt><dd>c. 4th–2nd century BCE (inner chapters often attributed to Zhuang Zhou, c. 369–286 BCE)</dd></div><div><dt>Handed down</dt><dd>Stories, dialogues and anecdotes associated with Zhuang Zhou and later followers, written down and collected over about two centuries.</dd></div><div><dt>Fixed in writing</dt><dd>The Han imperial bibliography lists 52 chapters. Around 300 CE Guo Xiang edited the book into 33 chapters (7 inner, 15 outer, 11 miscellaneous), discarding material he judged spurious; only his edition survives.</dd></div><div><dt>Oldest surviving copy</dt><dd>Han bamboo fragments from Shuanggudui, Fuyang (tomb of the Marquis of Ruyin), buried c. 165 BCE (tomb context)</dd></div><div><dt>Early witnesses</dt><dd>A short parallel passage in the Guodian slips (c. 300 BCE), Han bamboo fragments from Fuyang and Zhangjiashan, Tang manuscripts from Dunhuang covering about twelve chapters of Guo Xiang&#x27;s edition (British Library, BnF), and the Kōzanji manuscript in Kyoto, a close copy of a 7th-century annotated edition.</dd></div></dl><div class="face"><div class="face-c face-m"><span class="face-k">How the tradition sees its text</span><p>Daoists honour Zhuangzi as the second great classic after the Daodejing; in 742 the Tang court gave it the title &#x27;True Scripture of Southern Florescence&#x27;. The inner chapters are regarded as Zhuang Zhou&#x27;s own work and the rest as the writings of his school.</p></div><div class="face-c face-x"><span class="face-k">What manuscript scholarship shows</span><p>Most scholars accept that the inner chapters share a distinctive style and may be the earliest layer, though some question even that. The outer and miscellaneous chapters come from several schools. Guo Xiang&#x27;s editing means the surviving book is a selection, but his edition has been stable since the Tang.</p></div></div><h5 class="txt-sub">Documented changes, variants and revisions</h5><ul class="txt-ch"><li>Guo Xiang reduced a 52-chapter book to 33 chapters around 300 CE, so about a third of the Han-era material is lost except for scattered quotations in other works (Graham 1981).</li><li>Lu Deming&#x27;s 7th-century glossary records several rival editions of different lengths, all now lost except Guo Xiang&#x27;s (Graham 1981).</li><li>Early works such as the Huainanzi and later encyclopedias quote Zhuangzi passages that are not in the received text, the &#x27;lost fragments&#x27; of the pre-Guo Xiang book.</li></ul></section><h3 class="sub-h wsub">Through time</h3><ol class="ftl"><li><span class="ftl-y">6th century BCE (traditional)</span><b>Laozi</b><span>Tradition places Laozi as an archivist of the Zhou court and elder contemporary of Confucius.</span></li><li><span class="ftl-y">c. 369–286 BCE</span><b>Zhuang Zhou</b><span>The thinker from Song whose name the Zhuangzi bears.</span></li><li><span class="ftl-y">c. 300 BCE</span><b>Guodian</b><span>A Chu tutor is buried with bamboo slips holding the oldest known Daodejing material.</span></li><li><span class="ftl-y">168 BCE</span><b>Mawangdui</b><span>Tomb 3 at Changsha is sealed with two complete silk copies of the Laozi.</span></li><li><span class="ftl-y">c. 94 BCE</span><b>Sima Qian&#x27;s biography</b><span>The Shiji gives three possible identities for Laozi and the story of the western pass.</span></li><li><span class="ftl-y">142 CE</span><b>Celestial Masters</b><span>By tradition, Lord Lao reveals a new covenant to Zhang Daoling in Sichuan.</span></li><li><span class="ftl-y">165–166 CE</span><b>Imperial sacrifice</b><span>Emperor Huan of Han offers sacrifices to Laozi as a deity.</span></li><li><span class="ftl-y">c. 226–249 CE</span><b>Wang Bi</b><span>The young philosopher writes the commentary that shapes the most-read edition.</span></li><li><span class="ftl-y">c. 300 CE</span><b>Guo Xiang</b><span>The Zhuangzi is edited down from 52 to 33 chapters.</span></li><li><span class="ftl-y">1281 CE</span><b>Burning under the Yuan</b><span>Khubilai Khan orders Daoist texts destroyed, sparing the Daodejing.</span></li><li><span class="ftl-y">1445 CE</span><b>Ming Daoist Canon</b><span>The Zhengtong Daozang is printed, preserving about 1,500 texts.</span></li><li><span class="ftl-y">1973 and 1993 CE</span><b>The tombs open</b><span>Mawangdui and then Guodian yield manuscripts that transform the study of the Laozi.</span></li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">6 min read · 1,267 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Daoism"><button type="button" class="wtoc-i" data-go="daoism-s1">Five thousand characters</button><button type="button" class="wtoc-i" data-go="daoism-s2">Who was Laozi?</button><button type="button" class="wtoc-i" data-go="daoism-s3">The tutor&#x27;s tomb at Guodian</button><button type="button" class="wtoc-i" data-go="daoism-s4">Silk from Mawangdui</button><button type="button" class="wtoc-i" data-go="daoism-s5">Zhuangzi and the editor&#x27;s knife</button><button type="button" class="wtoc-i" data-go="daoism-s6">From book to religion</button><button type="button" class="wtoc-i" data-go="daoism-s7">What remains open</button></nav></div><section class="wsec" id="daoism-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Five thousand characters</h3><p>The Daodejing is one of the most translated books on Earth, yet it is only about five thousand Chinese characters long. Its first lines warn that the Way cannot be captured in words, and then it spends 81 short chapters trying anyway, with images of water, valleys, infants and uncarved wood. From this small book, and from the wilder, funnier Zhuangzi, grew a whole religious tradition with priests, temples, a canon of about 1,500 texts and a pantheon of immortals.</p><blockquote class="quote"><p>The Tao that can be trodden is not the enduring and unchanging Tao. The name that can be named is not the enduring and unchanging name.</p><cite>Daodejing 1, trans. James Legge, The Texts of Taoism, Sacred Books of the East 39 (1891)</cite></blockquote><p>For historians, the Daodejing is special for another reason. Its oldest copies were not preserved by libraries but sealed in tombs, and the tombs have been opened in our lifetime. They let us watch a sacred book in the act of taking shape.</p><aside class="wcall"><b>Faith and history on this page</b><p>Teachings about the Dao, Lord Lao and immortality are matters of faith and are not rated. Claims about Laozi&#x27;s life, the dates of texts and events in Daoist history are rated on the evidence. The texts are scored only on how well their record survives, never on whether their teaching is true.</p></aside></section><section class="wsec" id="daoism-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Who was Laozi?</h3><p>The name Laozi simply means &#x27;Old Master&#x27;. Our earliest biography, in Sima Qian&#x27;s Shiji of about 94 BCE, is refreshingly honest about its uncertainty. It says Laozi was Li Er, an archivist of the Zhou court whom Confucius once visited; then it adds that some say he was Lao Laizi, a contemporary of Confucius who wrote a book in 15 parts; and others that he was Dan, a grand historian of the 4th century BCE. It ends with the famous scene: seeing the Zhou in decline, Laozi rode west, and at the frontier pass the keeper Yinxi begged him to write down his teaching, which he did in two parts, of some five thousand characters, before vanishing.</p><p>Modern scholars are divided. Some think a historical Lao Dan, perhaps a court ritualist, is plausible, especially since the Liji, a ritual classic, has Confucius quoting him on funeral customs. Others think &#x27;Laozi&#x27; is a name attached to a compiled book, as happened with many early Chinese texts. The site rates Laozi&#x27;s historicity as an open question: the tradition is early and widespread, but the only biography was already unsure two thousand years ago.</p><blockquote class="wpull"><p>Even the first biographer of Laozi, writing two thousand years ago, admitted he did not know who Laozi was.</p></blockquote></section><section class="wsec" id="daoism-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The tutor&#x27;s tomb at Guodian</h3><p>In October 1993, archaeologists working at Guodian near Jingmen in Hubei, after robbers had broken into a small tomb, found about 800 bamboo slips in the burial chamber. The tomb dates to around 300 BCE, before the Qin army took the nearby Chu capital in 278 BCE. A lacquer cup in the grave bears an inscription usually read as &#x27;teacher of the eastern palace&#x27;, which suggests the dead man tutored a crown prince.</p><p>Among the slips were three bundles, labelled A, B and C by scholars, with material matching 31 chapters of the Daodejing, around two-fifths of the received text, in an order found in no later edition. Other bundles held Confucian writings, a reminder that the labels &#x27;Daoist&#x27; and &#x27;Confucian&#x27; were not yet sharply drawn. One difference caught the world&#x27;s attention. Received chapter 19 tells rulers to &#x27;abandon humaneness and cast off righteousness&#x27;, words that sound like an attack on Confucian virtues. At Guodian the same passage targets knowledge, argument and artifice instead. Robert Henricks and others suggest that the sharper anti-Confucian wording was added later, as the schools became rivals.</p><aside class="wcall"><b>How do we know?</b><p>The Guodian tomb has no dated inscription. Its date comes from tomb construction, pottery and bronze types that match other Chu tombs of the late 4th to early 3rd century BCE, and from the historical fact that Chu elite burials in this area ended after the Qin conquest of 278 BCE. A date of about 300 BCE is widely accepted, give or take a few decades.</p></aside></section><section class="wsec" id="daoism-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Silk from Mawangdui</h3><p>Twenty years earlier, in 1973, a family tomb of the Marquis of Dai at Mawangdui in Changsha had yielded one of the great finds of the century. Tomb 3, sealed in 168 BCE, contained a library on silk: medical texts, maps, astronomical charts and two complete copies of the Laozi. Copy A was written in an older script and does not avoid the personal name of the first Han emperor, which suggests it was copied before about 195 BCE; copy B does avoid it and is somewhat later.</p><p>Both copies put the second half of the received book, the &#x27;De&#x27; or virtue chapters, first, so that the title would be Dedaojing. The wording is recognisably the same book, but with thousands of small differences in characters and particles, and some lines that change the sense. Together with Guodian, Mawangdui shows that by the early Han the Daodejing was complete in content, but its order and precise wording were still flexible.</p><blockquote class="wpull"><p>The tombs show a sacred book that was already itself, but not yet fixed.</p></blockquote></section><section class="wsec" id="daoism-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Zhuangzi and the editor&#x27;s knife</h3><p>The Zhuangzi takes the Daodejing&#x27;s paradoxes and turns them into stories: cooks who carve oxen without dulling their knives, giant birds, talking skulls, and the man who dreamt he was a butterfly.</p><blockquote class="quote"><p>Formerly, I, Kwang Kau, dreamt that I was a butterfly, a butterfly flying about, feeling that it was enjoying itself.</p><cite>Zhuangzi, ch. 2, trans. James Legge, The Texts of Taoism, Sacred Books of the East 39 (1891)</cite></blockquote><p>The Han imperial library catalogued a Zhuangzi in 52 chapters. Around 300 CE the scholar Guo Xiang cut it to 33, removing material he considered spurious or trivial. His edition was so successful that all others vanished. Short Han fragments from Fuyang and Zhangjiashan, Tang manuscripts from Dunhuang and a medieval copy kept at the Kōzanji temple in Kyoto let us check Guo Xiang&#x27;s text, and they agree well. But roughly a third of the older book is gone, known only through quotations in other works.</p></section><section class="wsec" id="daoism-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>From book to religion</h3><p>By the 2nd century CE Laozi was being worshipped. The Hou Hanshu records sacrifices to him by Emperor Huan in 165 and 166 CE, and in Sichuan a movement called the Way of the Celestial Masters traced its founding to a revelation from Lord Lao to Zhang Daoling in 142 CE. Zhang&#x27;s grandson Zhang Lu ran a religious community in Hanzhong for about a quarter of a century, until he submitted to the warlord Cao Cao in 215. Official histories describe its officers, its free inns for travellers and its practice of confessing sins, one of the earliest organised religious communities in Chinese history.</p><p>Over the following centuries Daoist scriptures multiplied, and scholars such as Lu Xiujing (5th century) catalogued them into a canon. The record then suffered a blow: in 1281, after court debates with Buddhists, Khubilai Khan ordered Daoist texts and printing blocks burned, sparing only the Daodejing. The Ming canon printed in 1445 preserved what survived, about 1,500 works, and remains the foundation of Daoist studies today.</p><p>Two great orders carry the tradition today. The Zhengyi order, married priests who perform rituals for local communities, claims descent from the Celestial Masters. The Quanzhen order, monastic and celibate, was founded by Wang Chongyang (1113–1170) in the 12th century and is headquartered at the White Cloud Temple in Beijing. Both recite the Daodejing, and both treat the ancient book and its later scriptures as a living, ritual text rather than a museum piece.</p></section><section class="wsec" id="daoism-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What remains open</h3><p>Was there a historical Laozi? When did the Daodejing reach its full form, and was Guodian an early stage or a selection from an already complete book? Scholars still argue both sides of that last question: Guodian may be an anthology drawn from a longer text, or evidence of growth. The Peking University Han copy, acquired from the antiquities market in 2009, adds another witness but carries the uncertainty of any object without a recorded findspot. What the tombs have made clear is that Daoism&#x27;s founding book, like the Way it describes, was fluid before it was fixed.</p></section><details class="srcs"><summary>Sources for this tradition (14)</summary><ol><li>Henricks, Robert G. (1989). Lao-Tzu: Te-Tao Ching. A New Translation Based on the Recently Discovered Ma-wang-tui Texts. New York: Ballantine.</li><li>Henricks, Robert G. (2000). Lao Tzu&#x27;s Tao Te Ching: A Translation of the Startling New Documents Found at Guodian. New York: Columbia University Press.</li><li>Allan, Sarah and Williams, Crispin (eds) (2000). The Guodian Laozi: Proceedings of the International Conference, Dartmouth College, May 1998. Berkeley: Society for the Study of Early China.</li><li>Wagner, Rudolf G. (2003). A Chinese Reading of the Daodejing: Wang Bi&#x27;s Commentary on the Laozi with Critical Text and Translation. Albany: SUNY Press.</li><li>Kohn, Livia (ed.) (2000). Daoism Handbook. Leiden: Brill.</li><li>Schipper, Kristofer and Verellen, Franciscus (eds) (2004). The Taoist Canon: A Historical Companion to the Daozang. Chicago: University of Chicago Press.</li><li>Kleeman, Terry F. (2016). Celestial Masters: History and Ritual in Early Daoist Communities. Cambridge, MA: Harvard University Asia Center.</li><li>Seidel, Anna (1969). La divinisation de Lao tseu dans le taoïsme des Han. Paris: École française d&#x27;Extrême-Orient.</li><li>Graham, A. C. (1981). Chuang-tzu: The Inner Chapters. London: Allen and Unwin.</li><li>Legge, James (1891). The Texts of Taoism. Sacred Books of the East, vols 39–40. Oxford: Clarendon Press.</li><li>Sima Qian, Shiji (Records of the Grand Historian), ch. 63 &#x27;Laozi Han Fei liezhuan&#x27;, c. 94 BCE.</li><li>Hubei sheng Jingmen shi bowuguan (1998). Guodian Chu mu zhujian (Bamboo slips from the Chu tomb at Guodian). Beijing: Wenwu chubanshe.</li><li>Hunan Provincial Museum, Changsha. Mawangdui Han tombs collection (silk manuscripts from tomb 3).</li><li>Pew Research Center (2012). The Global Religious Landscape. Washington, DC.</li></ol></details><aside class="rc-cite" data-v="faiths" data-id="faith-daoism" data-t="Daoism"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Daoism</i>. <span class="cite-u">https://residualcontinuum.com/#faiths/faith-daoism</span> (updated 25 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="faith-shinto-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Naiku Ise-jingu Grand Shrine 01.JPG" data-cap="The Inner Shrine (Naiku) at Ise" data-big><figcaption></figcaption></figure><div class="sh-k">Japan</div><h2 class="sh-t" id="faith-shinto-st" tabindex="-1">Shinto</h2><p class="sh-s">A way of the kami lived through shrines, festivals and purification, whose first books were written a thousand years after its roots.</p><div class="sh-v"><span class="vstamp vstamp--when">Yayoi period onward; chronicles of 712 and 720 CE</span></div></div><div class="f-facts"><div><span>Began</span><b>Japanese archipelago; Ise, Izumo and Okinoshima among the oldest sacred centres</b><small>roots in the Yayoi period (c. 300 BCE–250 CE); first texts 712–720 CE</small></div><div><span>Followers today</span><b>about 88 million reported by Shinto organisations (membership overlaps heavily with Buddhism; few Japanese describe themselves personally as Shinto in surveys)</b><small>Agency for Cultural Affairs, Japan, Religious Yearbook (Shūkyō Nenkan), 2020 figures</small></div></div><h3 class="sub-h wsub">In its own words</h3><blockquote class="quote f-own"><p>The world is full of kami: the sun, great trees, mountains, rivers, the spirits of ancestors and all that inspires awe. We meet them at shrines, in festivals and in the rhythm of the seasons, offering thanks, rice, sake and music. Life is fundamentally good; what harms it is pollution and disorder, which are washed away by purification (harae) so that we return to a bright and sincere heart (makoto). The sun kami Amaterasu is honoured at Ise, and the ancient stories of the Kojiki and Nihon Shoki tell how the kami shaped these islands. Shinto is not so much believed as practised: it is the way of living gratefully with the kami.</p><cite>How a follower might put it, in our words</cite></blockquote><h3 class="sub-h wsub">What it teaches and claims</h3><p class="rd-rule">Claims about God, revelation, the soul or miracles are matters of faith and are not rated. Claims about people, places, events and texts are weighed on the evidence.</p><ul class="rds"><li class="rd"><p class="rd-s">Kami are present in nature, in sacred places and in the spirits of ancestors.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">The heart of Shinto practice, expressed through shrines, rituals and festivals rather than a written creed. As a claim about the spiritual world it is not rated. <span class="cite">Breen and Teeuwen 2010</span></p></li><li class="rd"><p class="rd-s">The kami Izanagi and Izanami brought forth the islands of Japan and many other kami.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">The creation account of the Kojiki and Nihon Shoki, told with several variant versions. It is sacred narrative about origins and is not rated as geology or history. <span class="cite">Kojiki I; Nihon Shoki I</span></p></li><li class="rd"><p class="rd-s">The imperial family descends from the sun goddess Amaterasu.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">Divine descent is a matter of faith. Emperor Hirohito&#x27;s 1946 rescript renounced the idea of the emperor as a &#x27;living god&#x27;, though the rescript&#x27;s meaning is debated. The early human line is rated below. <span class="cite">Kojiki I–II; Imperial Rescript, 1 January 1946</span></p></li><li class="rd"><p class="rd-s">Purification removes pollution and restores a bright, sincere heart.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">Rituals of harae and misogi are central to Shinto worship, from shrine visits to the great purification rites held twice a year. The spiritual effect is not rated. <span class="cite">Engishiki norito; Breen and Teeuwen 2010</span></p></li><li class="rd"><p class="rd-s">Emperor Jimmu founded the Japanese realm in 660 BCE.</p><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span><p class="rd-n">No state existed in Yamato in the 7th century BCE; Japan was then at the Jōmon to Yayoi transition. The date appears to have been calculated backward using the sexagenary cycle. Jimmu himself is rated below as a separate question. <span class="cite">Nihon Shoki III; Brownlee 1997</span></p></li><li class="rd"><p class="rd-s">The Kojiki preserves oral traditions that the court reciter Hieda no Are had memorised.</p><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span><p class="rd-n">The preface says Emperor Tenmu had Hieda no Are memorise imperial genealogies and old tales, which Ō no Yasumaro wrote down in 712. No independent record confirms the reciter, but the account fits the book&#x27;s archaic language. <span class="cite">Kojiki preface; Philippi 1968</span></p></li><li class="rd"><p class="rd-s">The sacred mirror of Amaterasu is kept at the Inner Shrine of Ise.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n">The mirror, one of the three imperial regalia, has never been displayed or studied. Its presence and nature are matters of faith and tradition, not open to historical checking. <span class="cite">Nihon Shoki VI; Ise Jingū</span></p></li><li class="rd"><p class="rd-s">Ise&#x27;s shrines have been rebuilt every 20 years since the late 7th century.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">Shrine and court records trace the Shikinen Sengū to the reign of Empress Jitō (690 or 692 CE, sources differ). The cycle was interrupted for more than a century during the civil wars of the 15th–16th centuries. The 62nd rebuilding took place in 2013. <span class="cite">Ise Jingū; Breen and Teeuwen 2010</span></p></li></ul><h3 class="sub-h wsub">History, weighed</h3><ul class="rds"><li class="rd"><p class="rd-s">The Kojiki was completed and presented to Empress Genmei in 712.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">The date rests on the book&#x27;s own preface. The Shoku Nihongi, the official history of the period, does not mention the Kojiki, which led some scholars since the Edo period to suspect a later preface. Most accept 712, because the text preserves archaic spelling distinctions that later forgers would hardly have known. <span class="cite">Philippi 1968; Brownlee 1997</span></p></li><li class="rd"><p class="rd-s">The Nihon Shoki was completed in 720 under Prince Toneri.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">The Shoku Nihongi records the presentation of the chronicle in 30 volumes with a genealogy in 720. Court lectures on it began the next year, and a 9th-century manuscript of one volume survives. <span class="cite">Shoku Nihongi; Aston 1896</span></p></li><li class="rd"><p class="rd-s">Emperor Jimmu was a historical ruler.</p><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span><p class="rd-n">No evidence of Jimmu has been found, and most scholars regard him as legendary; his story may reflect memories of eastward movements in the Yayoi period. Emperor Kinmei (6th century) is generally taken as the first verifiable ruler, and Sujin as possibly historical. <span class="cite">Brownlee 1997; Kidder 2007</span></p></li><li class="rd"><p class="rd-s">A queen called Himiko ruled a polity in Japan in the 3rd century CE.</p><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span><p class="rd-n">The Chinese Wei zhi (late 3rd century) describes Himiko, queen of Yamatai, and her embassy of 239 CE. The Nihon Shoki quotes this Chinese record under Empress Jingū. Where Yamatai lay, in Kyushu or in the Nara basin, remains unsettled. <span class="cite">Wei zhi, &#x27;Account of the Wa&#x27;; Kidder 2007</span></p></li><li class="rd"><p class="rd-s">Ritual offerings to kami were made on Okinoshima island from the 4th to the 9th century.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">Excavations found ritual sites with mirrors, weapons, jewellery and imports from Korea, China and Persia, about 80,000 objects now designated National Treasures. They show state-level kami worship long before the chronicles. UNESCO listed the site in 2017. <span class="cite">UNESCO 2017; Munakata Taisha</span></p></li><li class="rd"><p class="rd-s">The main hall of Izumo Taisha was once far taller than today&#x27;s building.</p><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span><p class="rd-n">Tradition speaks of a hall about 48 metres high. In 2000 excavators found giant pillar bases made of three bundled cedar trunks, probably from a 13th-century rebuilding, which supports a very tall raised structure. The traditional height is not confirmed. <span class="cite">Shimane Museum of Ancient Izumo</span></p></li><li class="rd"><p class="rd-s">The great keyhole tombs are the graves of the emperors named in the chronicles.</p><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span><p class="rd-n">The Imperial Household Agency assigns tombs such as the Daisen Kofun to named emperors (here Nintoku) and restricts excavation. Archaeologists often question the attributions, and some dates do not fit. Access has widened slightly since 2008, but the key evidence remains unexcavated. <span class="cite">Kidder 2007; Farris 1998</span></p></li><li class="rd"><p class="rd-s">Shinto was reorganised as a state institution from 1868 and separated from the state in 1945.</p><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span><p class="rd-n">Meiji-era edicts separated kami from buddhas in 1868 and built a national shrine system. The Allied Shinto Directive of December 1945 ended state support. Both are thoroughly documented in government records. <span class="cite">Breen and Teeuwen 2010</span></p></li></ul><h3 class="sub-h wsub">The texts and what survives of them</h3><p class="rd-rule">The textual record measures what survives and how close it is to the original. It says nothing about whether a text is true or inspired.</p><section class="txt"><h4 class="txt-h">The Kojiki (Record of Ancient Matters)</h4><ol class="jr" aria-label="How The Kojiki (Record of Ancient Matters) reached us"><li class="jr-s"><span>Composed</span><b>711–712 CE (from older oral traditions and court records)</b></li><li class="jr-gap "><span>about 659 years with no surviving copy</span></li><li class="jr-s"><span>Oldest surviving copy</span><b>1371–1372 CE</b><small>Shinpukuji-bon Kojiki, copied by the monk Ken&#x27;yu</small></li><li class="jr-s jr-today"><span>Today</span><b>Read in its source&#x27;s language, updated in places</b></li></ol><div class="rec"><div class="rec-r"><span>Closeness to the source</span><span class="rec-b" role="img" aria-label="Closeness to the source: 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><b>2</b></div><div class="rec-r"><span>Source&#x27;s own language</span><span class="rec-b" role="img" aria-label="Source&#x27;s own language: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Gap to oldest copy</span><span class="rec-b" role="img" aria-label="Gap to oldest copy: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Early witnesses</span><span class="rec-b" role="img" aria-label="Early witnesses: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Stability of the text</span><span class="rec-b" role="img" aria-label="Stability of the text: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Documented history</span><span class="rec-b" role="img" aria-label="Documented history: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-tot"><span>Textual record</span><b>19<small>/30</small></b></div></div><p class="rec-why">Gap 3: about 660 years from 712 to the Shinpukuji-bon. Language 4: written in Chinese characters in a mixed style that keeps Japanese names, songs and many Japanese readings. Witnesses 3: a handful of medieval copies in two lines. Stability 4: the copies agree closely apart from characters and readings. Documented 3: the preface describes the compilation, but no independent record confirms it, and its authenticity has been questioned by a minority. Source 2: compiled in 712 from court records and the recitation of Hieda no Are, setting down myths and genealogies told for centuries; Shinto has no single founder.</p><dl class="txt-dl"><div><dt>Language of the text</dt><dd>Old Japanese written in Chinese characters (mixed Chinese style with phonetic songs)</dd></div><div><dt>Composed</dt><dd>711–712 CE (from older oral traditions and court records)</dd></div><div><dt>Handed down</dt><dd>According to the preface, Emperor Tenmu (r. 673–686) had the court attendant Hieda no Are memorise the imperial genealogies and ancient tales so that errors in clan records could be corrected.</dd></div><div><dt>Fixed in writing</dt><dd>Ō no Yasumaro wrote the material down at Empress Genmei&#x27;s order and presented it in the first month of 712, in three books: the age of the kami, and the reigns from Jimmu to Suiko.</dd></div><div><dt>Oldest surviving copy</dt><dd>Shinpukuji-bon Kojiki, copied by the monk Ken&#x27;yu, 1371–1372 CE (colophons (copyist&#x27;s dated notes))</dd></div><div><dt>Early witnesses</dt><dd>The manuscripts fall into two broad lines, one linked to Ise and one to the Urabe family of court scholars. The Shinpukuji-bon is the oldest; the other copies date from the late 14th century onward.</dd></div></dl><div class="face"><div class="face-c face-m"><span class="face-k">How the tradition sees its text</span><p>Shinto tradition treats the Kojiki as the most venerable record of the age of the kami and of the imperial line, faithfully set down from the memory of Hieda no Are. Since Motoori Norinaga, it has been read as the purest expression of ancient Japanese spirit, less coloured by Chinese learning than the Nihon Shoki.</p></div><div class="face-c face-x"><span class="face-k">What manuscript scholarship shows</span><p>Scholars read the Kojiki as an early 8th-century court compilation that preserves genuinely old myths, songs and genealogies, arranged to legitimise the ruling house. The text is well preserved in wording but survives only in copies made more than six centuries later, and parts of its reading remain disputed.</p></div></div><h5 class="txt-sub">Documented changes, variants and revisions</h5><ul class="txt-ch"><li>Yasumaro&#x27;s mixed script, using characters for both meaning and sound, had to be reconstructed into readable Japanese; Motoori Norinaga&#x27;s Kojiki-den (1764–1798) set the standard reading, and modern readings still differ (Philippi 1968).</li><li>The preface itself says the work aimed to &#x27;correct errors&#x27; in clan traditions, so the compilers selected and shaped the material to support the Yamato court&#x27;s genealogy (Kojiki preface).</li><li>Because the official history Shoku Nihongi never mentions the Kojiki, some scholars have argued that the preface was added later; most reject this on linguistic grounds (Brownlee 1997).</li></ul></section><section class="txt"><h4 class="txt-h">The Nihon Shoki (Chronicles of Japan)</h4><ol class="jr" aria-label="How The Nihon Shoki (Chronicles of Japan) reached us"><li class="jr-s"><span>Composed</span><b>681–720 CE (commissioned under Tenmu, completed 720)</b></li><li class="jr-gap "><span>about 130 years with no surviving copy</span></li><li class="jr-s"><span>Oldest surviving copy</span><b>9th century CE</b><small>Tanaka copy of the Nihon Shoki, volume 10 (reign of Emperor Ōjin)</small></li><li class="jr-s jr-today"><span>Today</span><b>Read in a sister language or form of its source&#x27;s speech</b></li></ol><div class="rec"><div class="rec-r"><span>Closeness to the source</span><span class="rec-b" role="img" aria-label="Closeness to the source: 2 of 5"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></span><b>2</b></div><div class="rec-r"><span>Source&#x27;s own language</span><span class="rec-b" role="img" aria-label="Source&#x27;s own language: 3 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></span><b>3</b></div><div class="rec-r"><span>Gap to oldest copy</span><span class="rec-b" role="img" aria-label="Gap to oldest copy: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Early witnesses</span><span class="rec-b" role="img" aria-label="Early witnesses: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Stability of the text</span><span class="rec-b" role="img" aria-label="Stability of the text: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-r"><span>Documented history</span><span class="rec-b" role="img" aria-label="Documented history: 4 of 5"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></span><b>4</b></div><div class="rec-tot"><span>Textual record</span><b>21<small>/30</small></b></div></div><p class="rec-why">Gap 4: about a century and a half from 720 to the 9th-century Tanaka copy (dated by handwriting, so the gap could be under 100 years). Language 3: written in Classical Chinese, not the Japanese in which the traditions were told, although the songs are kept in Japanese phonetic characters. Witnesses 4: several Heian manuscripts of separate volumes. Stability 4: variants are mostly glosses and name forms. Documented 4: the commission, completion and court lectures are recorded in official histories. Source 2: a court chronicle compiled in 720 from older records and variant tellings, which it often quotes side by side.</p><dl class="txt-dl"><div><dt>Language of the text</dt><dd>Classical Chinese (with Japanese songs in phonetic characters)</dd></div><div><dt>Composed</dt><dd>681–720 CE (commissioned under Tenmu, completed 720)</dd></div><div><dt>Handed down</dt><dd>Draws on clan traditions, court records kept since the 6th century, temple records and Korean (Baekje) histories that no longer survive; it cites alternative versions word for word.</dd></div><div><dt>Fixed in writing</dt><dd>Completed in 30 volumes with a genealogy under the supervision of Prince Toneri and presented in 720. From 721 onward, court lectures produced Japanese readings and glosses, added to manuscripts over the following centuries.</dd></div><div><dt>Oldest surviving copy</dt><dd>Tanaka copy of the Nihon Shoki, volume 10 (reign of Emperor Ōjin), 9th century CE (palaeography (early Heian calligraphic style))</dd></div><div><dt>Early witnesses</dt><dd>Several Heian-period manuscripts of individual volumes, beginning with the 9th-century Tanaka copy, and complete copies from the medieval period onward, notably those transmitted by the Urabe family.</dd></div></dl><div class="face"><div class="face-c face-m"><span class="face-k">How the tradition sees its text</span><p>The Nihon Shoki has been honoured since the 8th century as Japan&#x27;s first official history, lectured on at court and cited as the authoritative account of the kami and the emperors. Shinto scholars of the medieval period wrote extensive commentaries on its &#x27;age of the kami&#x27; volumes.</p></div><div class="face-c face-x"><span class="face-k">What manuscript scholarship shows</span><p>Historians treat the Nihon Shoki as a crucial source whose reliability grows as it approaches its own time: the 7th-century volumes are valuable history, the 5th–6th century ones mix records with legend, and the earliest reigns are largely constructed. Its textual transmission is comparatively good.</p></div></div><h5 class="txt-sub">Documented changes, variants and revisions</h5><ul class="txt-ch"><li>The chronicle quotes variant traditions side by side (&#x27;aru fumi&#x27;, &#x27;one document says&#x27;), so editorial choices are visible in the text itself (Aston 1896).</li><li>Its early chronology is stretched: reigns of implausible length and a founding year of 660 BCE, apparently set by counting sexagenary cycles back from 601 CE (Brownlee 1997).</li><li>The Tanaka copy has no reading marks and some names differ from later copies, showing that later manuscripts added glosses and small changes (Nara National Museum).</li></ul></section><h3 class="sub-h wsub">Through time</h3><ol class="ftl"><li><span class="ftl-y">c. 300 BCE–250 CE</span><b>Yayoi period</b><span>Rice farming and bronze ritual objects spread; the roots of kami worship are traced to this age.</span></li><li><span class="ftl-y">660 BCE (traditional)</span><b>Jimmu</b><span>The Nihon Shoki&#x27;s date for the first emperor&#x27;s accession, now regarded as a later calculation.</span></li><li><span class="ftl-y">239 CE</span><b>Queen Himiko</b><span>Chinese records describe an embassy from Himiko, ruler of Yamatai, to the Wei court.</span></li><li><span class="ftl-y">4th–9th century CE</span><b>Okinoshima</b><span>State rituals leave tens of thousands of offerings on a sacred island.</span></li><li><span class="ftl-y">690 or 692 CE</span><b>First Ise rebuilding</b><span>Empress Jitō carries out the first recorded Shikinen Sengū.</span></li><li><span class="ftl-y">712 CE</span><b>Kojiki</b><span>Ō no Yasumaro presents the Record of Ancient Matters to Empress Genmei.</span></li><li><span class="ftl-y">720 CE</span><b>Nihon Shoki</b><span>Prince Toneri completes the Chronicles of Japan.</span></li><li><span class="ftl-y">1371–1372 CE</span><b>Shinpukuji-bon</b><span>The monk Ken&#x27;yu copies the oldest surviving Kojiki manuscript.</span></li><li><span class="ftl-y">1764–1798 CE</span><b>Kojiki-den</b><span>Motoori Norinaga completes his 44-volume study, reviving the Kojiki.</span></li><li><span class="ftl-y">1868 CE</span><b>Kami and buddhas separated</b><span>Meiji edicts separate Shinto from Buddhism and begin State Shinto.</span></li><li><span class="ftl-y">1945 CE</span><b>Shinto Directive</b><span>The Allied occupation ends state sponsorship of Shinto.</span></li><li><span class="ftl-y">2013 CE</span><b>62nd rebuilding</b><span>The Ise shrines are rebuilt again; the next rebuilding is due in 2033.</span></li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The deep dive</span><span class="wdeep-m">6 min read · 1,246 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Shinto"><button type="button" class="wtoc-i" data-go="shinto-s1">A religion of places before books</button><button type="button" class="wtoc-i" data-go="shinto-s2">The two chronicles</button><button type="button" class="wtoc-i" data-go="shinto-s3">From memory to manuscript</button><button type="button" class="wtoc-i" data-go="shinto-s4">An emperor in 660 BCE</button><button type="button" class="wtoc-i" data-go="shinto-s5">Shrines as records</button><button type="button" class="wtoc-i" data-go="shinto-s6">When Shinto was remade</button><button type="button" class="wtoc-i" data-go="shinto-s7">What remains open</button></nav></div><section class="wsec" id="shinto-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A religion of places before books</h3><p>Most religions on this site begin with a founder or a scripture. Shinto begins with places: a mountain, a waterfall, an island, a great tree tied with a straw rope. It has no founder and no single sacred book. It is practised more than it is professed, through shrine visits, seasonal festivals, purification and prayers of thanks to the kami, the sacred powers present in nature, ancestors and awe-inspiring things. Shinto organisations reported about 88 million members to Japan&#x27;s Agency for Cultural Affairs for 2020, yet many of the same people also count as Buddhists, and in surveys few Japanese call themselves &#x27;Shinto&#x27; at all.</p><p>That makes Shinto a fascinating test case for this site&#x27;s question about records. Its roots are older than writing in Japan, traced by archaeologists to the Yayoi period, when rice farming and bronze ritual objects spread across the islands. Its first books, the Kojiki of 712 and the Nihon Shoki of 720, were written by a royal court that already had a thousand years of traditions behind it.</p><aside class="wcall"><b>Faith and history on this page</b><p>Claims about the kami, divine descent and purification are matters of faith and are not rated. Claims about emperors, dates, shrines and manuscripts are rated on the evidence. The chronicles are scored only on how well their text survives, never on whether their sacred stories are true.</p></aside></section><section class="wsec" id="shinto-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The two chronicles</h3><p>The Kojiki, &#x27;Record of Ancient Matters&#x27;, opens with the age of the kami: the first deities appearing in the Plain of High Heaven, the divine pair Izanagi and Izanami bringing forth the islands, the sun goddess Amaterasu hiding in a cave and being coaxed out with a mirror and dancing. It then turns into a genealogy of rulers from Jimmu to Empress Suiko in the early 7th century.</p><blockquote class="quote"><p>The names of the Deities that were born in the Plain of High Heaven when the Heaven and Earth began were the Deity Master-of-the-August-Centre-of-Heaven, next the High-August-Producing-Wondrous Deity, next the Divine-Producing-Wondrous-Deity.</p><cite>Kojiki I.1, trans. Basil Hall Chamberlain (1882)</cite></blockquote><p>Eight years later came the Nihon Shoki, &#x27;Chronicles of Japan&#x27;, written in formal Classical Chinese for a readership that included the courts of China and Korea. It covers similar ground at greater length and, unusually, quotes alternative versions of its myths side by side, introduced with the phrase &#x27;one document says&#x27;. For a historian that is a gift: the compilers show us the variety of traditions they were choosing from.</p><blockquote class="quote"><p>Of old, Heaven and Earth were not yet separated, and the In and Yo not yet divided.</p><cite>Nihon Shoki I, trans. W. G. Aston, Nihongi (1896)</cite></blockquote></section><section class="wsec" id="shinto-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>From memory to manuscript</h3><p>The Kojiki&#x27;s preface tells how it was made. Emperor Tenmu, worried that clan records were full of errors, had a court attendant named Hieda no Are, remarkable for memory, learn the imperial genealogies and ancient tales by heart. After Tenmu&#x27;s death the project stalled, until Empress Genmei ordered Ō no Yasumaro to write down what Hieda no Are recited. He presented the result in the first month of 712. Writing Japanese in Chinese characters was still an experiment, and Yasumaro mixed characters used for meaning with characters used for sound.</p><p>No copy from the 8th century survives. The oldest Kojiki is the Shinpukuji-bon, copied by a Buddhist monk named Ken&#x27;yu in 1371 and 1372 and now a National Treasure kept at the Ōsu Kannon temple in Nagoya. That is a gap of about 660 years. The Nihon Shoki fares better: the Nara National Museum holds the Tanaka copy of volume 10, dated by its calligraphy to the 9th century, perhaps within about a century of the original. It has no reading marks and a few names in older forms, a sign that later copies added glosses.</p><blockquote class="wpull"><p>The oldest Kojiki is younger than the Nihon Shoki&#x27;s oldest page by about five centuries.</p></blockquote></section><section class="wsec" id="shinto-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>An emperor in 660 BCE</h3><p>The Nihon Shoki dates the accession of the first emperor, Jimmu, to 660 BCE, a date still celebrated on 11 February as National Foundation Day. Historians have long noted that the year is a xin-you year in the sixty-year cycle and appears to have been chosen by counting cycles back from 601 CE, a year of reform under Prince Shōtoku. The first emperors are given reigns of many decades and lifespans over a century.</p><p>Archaeology shows no kingdom in the Nara basin in the 7th century BCE. Japan was then at the transition from the Jōmon to the Yayoi period, a world of villages. The site therefore rates a realm founded in 660 BCE as ruled out by the evidence, and Jimmu&#x27;s existence as awaiting discovery. That does not make the story empty. Scholars such as Kenneth Henshall suggest that the tale of Jimmu&#x27;s march east from Kyushu may carry a memory of real migrations of Yayoi people, and the chronicles become steadily more reliable as they approach the 6th and 7th centuries, where they can be checked against Chinese and Korean records.</p><aside class="wcall"><b>How do we know?</b><p>The Chinese Wei zhi, written in the late 3rd century, describes a Japanese queen named Himiko and an embassy she sent in 239 CE. The Nihon Shoki quotes this Chinese record under its Empress Jingū, while Korean events it records in the same reigns fall about 120 years, two sixty-year cycles, earlier than Korean histories date them. Comparing dates with Chinese and Korean sources is how historians calibrate the chronicles.</p></aside></section><section class="wsec" id="shinto-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Shrines as records</h3><p>Where the books are late, the ground speaks. On Okinoshima, a small island in the strait between Japan and Korea, excavations uncovered ritual sites used from the 4th to the 9th century, with about 80,000 offerings including bronze mirrors, iron weapons, gold rings and even Persian glass. UNESCO inscribed the island and its associated sites in 2017. They show that kami worship was a matter of state ritual centuries before the chronicles were written.</p><p>At Izumo, tradition held that the great shrine once stood about 48 metres tall on towering pillars. Many doubted it until 2000, when excavators found pillar bases made of three bundled cedar trunks, each bundle about three metres across, probably from a 13th-century rebuilding. And at Ise, the shrines of Amaterasu and the food goddess Toyouke are rebuilt beside their old sites every twenty years, a custom recorded from the reign of Empress Jitō in the late 7th century. The 62nd rebuilding took place in 2013. The buildings are young; the design they preserve may be among the oldest in Japan.</p><blockquote class="wpull"><p>Ise keeps an ancient design alive by never letting the building grow old.</p></blockquote></section><section class="wsec" id="shinto-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>When Shinto was remade</h3><p>For most of Japanese history, kami and buddhas were worshipped together, often at the same sites. In the 18th century the scholar Motoori Norinaga spent 34 years on his Kojiki-den, a monumental study that set out to recover a pure ancient Japanese way free of Chinese and Buddhist influence. His work, and the nativist school behind it, helped inspire the Meiji government after 1868 to separate kami from buddhas and to create a state-supported Shinto that taught the divine origin of the emperor. After defeat in 1945, the Allied Shinto Directive ended state sponsorship.</p><p>This history matters for the record, because much of what people think of as &#x27;ancient Shinto&#x27; was organised and standardised in the modern period. Historians such as Kuroda Toshio have argued that Shinto as a distinct, separate religion took shape late. Others stress the continuity of shrines, rites and kami across fifteen centuries. The evidence supports both: old practices, newly framed.</p></section><section class="wsec" id="shinto-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What remains open</h3><p>Where was Himiko&#x27;s Yamatai, in northern Kyushu or in the Nara basin? Who lies in the great keyhole tombs, most of which the Imperial Household Agency still guards from excavation? How much of the Kojiki&#x27;s myth was ancient and how much shaped in the 7th century to support the ruling house? Opening the imperial tombs would answer more questions about early Japan than any other single step. Until then, Shinto&#x27;s record rests on late manuscripts, well-dated shrine archaeology and a living practice that may be its most faithful witness of all.</p></section><details class="srcs"><summary>Sources for this tradition (15)</summary><ol><li>Chamberlain, Basil Hall (1882). Ko-ji-ki or Records of Ancient Matters. Transactions of the Asiatic Society of Japan, supplement to vol. 10.</li><li>Aston, W. G. (1896). Nihongi: Chronicles of Japan from the Earliest Times to A.D. 697. London: Kegan Paul, Trench, Trübner.</li><li>Philippi, Donald L. (1968). Kojiki. Tokyo: University of Tokyo Press.</li><li>Breen, John and Teeuwen, Mark (2010). A New History of Shinto. Chichester: Wiley-Blackwell.</li><li>Brownlee, John S. (1997). Japanese Historians and the National Myths, 1600–1945: The Age of the Gods and Emperor Jinmu. Vancouver: UBC Press.</li><li>Kidder, J. Edward (2007). Himiko and Japan&#x27;s Elusive Chiefdom of Yamatai. Honolulu: University of Hawai&#x27;i Press.</li><li>Farris, William Wayne (1998). Sacred Texts and Buried Treasures: Issues in the Historical Archaeology of Ancient Japan. Honolulu: University of Hawai&#x27;i Press.</li><li>Kuroda Toshio (1981). &#x27;Shinto in the History of Japanese Religion&#x27;. Journal of Japanese Studies 7 (1): 1–21.</li><li>Henshall, Kenneth G. (2012). A History of Japan: From Stone Age to Superpower. 3rd ed. Basingstoke: Palgrave Macmillan.</li><li>Nara National Museum / e-Museum (National Institutes for Cultural Heritage). &#x27;Chronicles of Japan (Nihon shoki), Vol. 10&#x27; (Tanaka copy), National Treasure.</li><li>UNESCO World Heritage Centre (2017). &#x27;Sacred Island of Okinoshima and Associated Sites in the Munakata Region&#x27;.</li><li>Shimane Museum of Ancient Izumo. Exhibits and reports on the Izumo Taisha pillar excavations (2000).</li><li>Jingū Shichō (Ise Jingū). Official information on the Shikinen Sengū.</li><li>Agency for Cultural Affairs, Japan. Shūkyō Nenkan (Religious Yearbook), 2021 edition (2020 figures).</li><li>Motoori Norinaga (1764–1798). Kojiki-den. 44 vols.</li></ol></details><aside class="rc-cite" data-v="faiths" data-id="faith-shinto" data-t="Shinto"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Shinto</i>. <span class="cite-u">https://residualcontinuum.com/#faiths/faith-shinto</span> (updated 25 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="faith-christianity-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Codex Sinaiticus Matthew 6,4-32.JPG" data-cap="Codex Sinaiticus, a 4th-century Greek Bible (Matthew 6)" data-big><figcaption></figcaption></figure><div class="sh-k">Galilee and Jerusalem</div><h2 class="sh-t" id="faith-christianity-st" tabindex="-1">Christianity</h2><p class="sh-s">A faith centred on one life, recorded in Greek writings whose earliest surviving copies come within a century or two of their writing.</p><div class="sh-v"><span class="vstamp vstamp--when">1st century CE</span></div></div><div class="f-facts"><div><span>Began</span><b>Galilee and Jerusalem, Roman Judea</b><small>c. 28–33 CE (Jesus&#x27;s ministry); churches spread from the 30s CE</small></div><div><span>Followers today</span><b>about 2.3 billion</b><small>Pew Research Center, 2020 estimate (report published June 2025)</small></div></div><h3 class="sub-h wsub">In its own words</h3><blockquote class="quote f-own"><p>Christians believe that the God of Israel, creator of all things, came among us in Jesus of Nazareth. Jesus taught, healed and proclaimed the kingdom of God; he was crucified under Pontius Pilate, and on the third day God raised him from the dead. Through his death and resurrection, sin is forgiven and death defeated, and all who trust in him are welcomed as God&#x27;s children. God is one, known as Father, Son and Holy Spirit. The church, the community of believers, gathers to worship, to share bread and wine as Jesus commanded, to love neighbours and enemies, and to wait in hope for Christ&#x27;s return, when all things will be made new. The scriptures of Israel and the writings of the apostles together bear witness to him.</p><cite>How a follower might put it, in our words</cite></blockquote><h3 class="sub-h wsub">What it teaches and claims</h3><p class="rd-rule">Claims about God, revelation, the soul or miracles are matters of faith and are not rated. Claims about people, places, events and texts are weighed on the evidence.</p><ul class="rds"><li class="rd"><p class="rd-s">Jesus is the Son of God, and God is one in three persons: Father, Son and Holy Spirit.</p><span class="vd vd--faith"><svg class="i" aria-hidden="true"><use href="#i8"/></svg>Matter of faith</span><p class="rd-n"
