="wx-t-cap" x="20" y="26">AROUND 4,200 YEARS AGO (c. 2200 BCE)</text><text class="wx-st wx-hide wx-t-cap wx-t-a" data-only="1" x="700" y="26" text-anchor="end">THE RECORDS</text><text class="wx-st wx-hide wx-t-cap wx-t-a" data-only="2" x="700" y="26" text-anchor="end">THE SOCIETIES</text><text class="wx-st wx-hide wx-t-cap wx-t-a" data-only="3" x="700" y="26" text-anchor="end">THE CAVEATS</text><circle class="wx-fire wx-edge-soft" cx="28" cy="341.6" r="5.5"/><text class="wx-t-s" x="40" y="345.6">drier or dustier record</text><circle class="wx-water2 wx-edge" cx="200" cy="341.6" r="5.5"/><text class="wx-t-s" x="212" y="345.6">wetter record</text><text class="wx-t-s" x="20" y="365.6">Also recorded far outside this map, e.g. in an ice core from Mount Logan, Canada. Positions approximate.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 3.</b> The records: dust, silt, low Nile floods and a weaker monsoon around 4,200 years ago.</p><ol class="wx-steplist"><li>The records: dust, silt, low Nile floods and a weaker monsoon around 4,200 years ago.</li><li>The societies: Akkad, Egypt&#x27;s Old Kingdom, the Indus cities and Liangzhu.</li><li>The caveats: different timings, a flood not a drought in China, and states already under strain.</li></ol><figcaption>Where the climate shift is recorded, which societies fell, and why the picture is less tidy than a single global drought. <span class="wx-src">Based on: Coastlines: Natural Earth 1:110m. Records after Weiss et al. 1993, Cullen et al. 2000, Thompson et al. 2002, Stanley et al. 2003, Berkelhammer et al. 2012, Dixit et al. 2014, Carolin et al. 2019 and Zhang et al. 2021.</span></figcaption><p class="vh">A map from West Africa to China. Step one marks climate records: Tell Leilan in Syria with windblown silt, Gol-e Zard cave in Iran with a dust peak, a Gulf of Oman core with a dust spike, low Nile floods, weaker monsoon in the Indus region, the Mawmluh Cave stalagmite in India, Kilimanjaro&#x27;s dust layer, and Liangzhu in China marked as wetter. Step two names the societies: the Akkadian empire, Egypt&#x27;s Old Kingdom, the Indus cities and Liangzhu. Step three adds caveats: some towns carried on, Egypt was already fragmenting, the Indus decline came about 300 years later, Liangzhu fell earlier to floods, and the use of one stalagmite as a world standard was criticised.</p></figure></section><section class="wsec" id="age-09-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>A golden spike in a cave</h3><p>In 2018 the International Union of Geological Sciences made the event official. The Holocene, our current epoch, was divided into three ages, and the youngest, the Meghalayan, begins 4,250 years before 2000 CE. Its reference point is a layer in a stalagmite from Mawmluh Cave in Meghalaya, northeast India, where oxygen isotopes record a weakening of the monsoon. An ice core from Mount Logan in Canada serves as a backup.</p><aside class="wcall"><b>How do we know?</b><p>Stalagmites grow in thin layers from dripping cave water. The ratio of oxygen isotopes in each layer tracks rainfall, and tiny amounts of uranium decaying into thorium date the layers, often to within a few decades. Dust, pollen and lake levels add independent lines. When several of these move together in different places, a regional event becomes hard to doubt.</p></aside><p>Not everyone was happy. Some scientists criticised building a worldwide time boundary on one stalagmite and on an event that looks different from place to place. Jessica Tierney and others have argued that studies sometimes lumped together droughts and wet spells centuries apart and called them one event.</p></section><section class="wsec" id="age-09-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Egypt: when the Nile ran low</h3><p>Egypt&#x27;s Old Kingdom ended around 2181 BCE, after the very long reign of Pepi II. Sediments from the Nile delta suggest weak floods at this time, and tomb inscriptions of provincial governors from the following decades boast of feeding their people during famines. The most vivid, in the tomb of Ankhtifi at Mo&#x27;alla, claims that all of Upper Egypt was starving. Egyptologists note that such boasts were a standard way for a governor to praise himself, but the theme is persistent.</p><p>Here care is needed with a famous text. The Admonitions of Ipuwer, a lament of a land turned upside down, contains the line usually translated as &#x27;the river is blood&#x27;. It was long read as an eyewitness account of this collapse, and some writers have linked it to the plagues of the Exodus. But the only copy, Papyrus Leiden I 344, was written around 1250 BCE, and scholars such as Harco Willems and Stephen Quirke date its composition no earlier than the late 12th Dynasty, centuries after the Old Kingdom fell. It is best read as literature about chaos, perhaps shaped by memory of this age, not as a report from it.</p></section><section class="wsec" id="age-09-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Not one switch, but many stresses</h3><p>The strongest objection to a single global megadrought is timing. The Indus cities did not fall around 2200 BCE. They thinned out gradually from about 1900 BCE, as people moved east toward the Ganga plain and into smaller villages, perhaps as monsoon rivers became less reliable. Liangzhu, in the Yangtze delta, collapsed around 2300 BCE, and a 2021 cave study points to extreme rainfall and flooding, not drought. In Egypt, provincial governors had been growing more powerful for generations.</p><p>The geographer Karl Butzer argued that collapse happens when environmental shocks hit societies that have lost the ability to adapt: rigid elites, overstretched armies, broken trade. By that reading, the 4.2 kiloyear event was the hammer, but the empires were already cracked. Harvey Weiss&#x27;s challenge was right in forcing climate into the story. The critics are right that climate alone does not write it.</p><blockquote class="wpull"><p>The drought was real. Whether it toppled empires depended on how brittle each empire already was.</p></blockquote></section><section class="wsec" id="age-09-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What we still cannot see</h3><p>Much of this age is invisible. Village houses of mud brick have melted back into the plain, and most excavations target the big mounds. The absolute dates of the Akkadian kings shift by decades depending on which chronology is used. Few climate archives sit right beside the sites whose fate they are asked to explain, so the link is often a matter of &#x27;about the same time, some hundreds of kilometres away&#x27;.</p><ul class="wlist"><li>More stalagmite and lake records beside the collapsed sites themselves, especially in Syria, Egypt and Sindh.</li><li>Radiocarbon series from the final floors of many towns, not just a few famous ones, to test whether abandonment was sudden and simultaneous.</li><li>Ancient DNA and isotopes from cemeteries before and after, to see who moved and who stayed.</li></ul><p>Old stories of cities destroyed by wind and drought, from Mesopotamia to Arabia, may carry distant echoes of ages like this. The Iram case looks at one of them.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">2,334 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Sargon founds the Akkadian empire (middle chronology)</span></li><li class="wtl-loss" style="--i:1"><span class="wtl-y">2,300 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Liangzhu&#x27;s capital abandoned after extreme rains</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">2,250 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Meghalayan Age begins (4,250 years before 2000 CE)</span></li><li class="wtl-loss" style="--i:3"><span class="wtl-y">2,200 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Tell Leilan abandoned; dust peaks in Iran and the Gulf of Oman</span></li><li class="wtl-loss" style="--i:4"><span class="wtl-y">2,181 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Egypt&#x27;s Old Kingdom ends</span></li><li class="wtl-loss" style="--i:5"><span class="wtl-y">2,154 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Last effective Akkadian rule (approx.)</span></li><li class="wtl-build" style="--i:6"><span class="wtl-y">2,112 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Third Dynasty of Ur founded</span></li><li class="wtl-build" style="--i:7"><span class="wtl-y">2,055 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Egypt reunited: the Middle Kingdom</span></li><li class="wtl-loss" style="--i:8"><span class="wtl-y">1,900 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Indus cities begin to empty</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">2018 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Meghalayan Age formally ratified</span></li></ol><h3 class="sub-h wsub">Go deeper</h3><div class="links-row"><button type="button" onclick="openItem('articles','case-exodus')">Moses, Pharaoh and the Sea That Stepped Back <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-iram-ubar')">ʿĀd and Iram of the Pillars <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-babel')">The Tower of Babel Stood in Babylon <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-yu-xia')">Yu the Great and the Flood That Made a Dynasty <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-great-pyramid')">Great Pyramid <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-stonehenge')">Stonehenge <span aria-hidden="true">→</span></button></div><details class="srcs"><summary>Sources for this age (17)</summary><ol><li>Weiss, H. et al. (1993). The genesis and collapse of third millennium north Mesopotamian civilization. Science 261: 995–1004. <a href="https://doi.org/10.1126/science.261.5124.995" target="_blank" rel="noopener">doi:10.1126/science.261.5124.995</a></li><li>Cullen, H. M. et al. (2000). Climate change and the collapse of the Akkadian empire: evidence from the deep sea. Geology 28: 379–382.</li><li>Carolin, S. A. et al. (2019). Precise timing of abrupt increase in dust activity in the Middle East coincident with 4.2 ka social change. PNAS 116: 67–72. <a href="https://doi.org/10.1073/pnas.1808103115" target="_blank" rel="noopener">doi:10.1073/pnas.1808103115</a></li><li>Walker, M. et al. (2018). Formal ratification of the subdivision of the Holocene Series/Epoch (Quaternary System/Period). Episodes 41: 213–223. <a href="https://doi.org/10.18814/epiiugs/2018/018016" target="_blank" rel="noopener">doi:10.18814/epiiugs/2018/018016</a></li><li>Walker, M. et al. (2019). Subdividing the Holocene Series/Epoch: formalization of stages/ages and subseries/subepochs. Journal of Quaternary Science 34: 173–186. <a href="https://doi.org/10.1002/jqs.3097" target="_blank" rel="noopener">doi:10.1002/jqs.3097</a></li><li>Berkelhammer, M. et al. (2012). An abrupt shift in the Indian monsoon 4000 years ago. In: Climates, Landscapes, and Civilizations. AGU Geophysical Monograph 198: 75–87.</li><li>Dixit, Y., Hodell, D. A. &amp; Petrie, C. A. (2014). Abrupt weakening of the summer monsoon in northwest India ~4100 yr ago. Geology 42: 339–342.</li><li>Bini, M. et al. (2019). The 4.2 ka BP Event in the Mediterranean region: an overview. Climate of the Past 15: 555–577. <a href="https://doi.org/10.5194/cp-15-555-2019" target="_blank" rel="noopener">doi:10.5194/cp-15-555-2019</a></li><li>Stanley, J.-D. et al. (2003). Short contribution: Nile flow failure at the end of the Old Kingdom, Egypt: strontium isotopic and petrologic evidence. Geoarchaeology 18: 395–402.</li><li>Thompson, L. G. et al. (2002). Kilimanjaro ice core records: evidence of Holocene climate change in tropical Africa. Science 298: 589–593. <a href="https://doi.org/10.1126/science.1073198" target="_blank" rel="noopener">doi:10.1126/science.1073198</a></li><li>Zhang, H. et al. (2021). Collapse of the Liangzhu and other Neolithic cultures in the lower Yangtze region in response to climate change. Science Advances 7: eabi9275. <a href="https://doi.org/10.1126/sciadv.abi9275" target="_blank" rel="noopener">doi:10.1126/sciadv.abi9275</a></li><li>Giosan, L. et al. (2012). Fluvial landscapes of the Harappan civilization. PNAS 109: E1688–E1694. <a href="https://doi.org/10.1073/pnas.1112743109" target="_blank" rel="noopener">doi:10.1073/pnas.1112743109</a></li><li>Butzer, K. W. (2012). Collapse, environment, and society. PNAS 109: 3632–3639. <a href="https://doi.org/10.1073/pnas.1114845109" target="_blank" rel="noopener">doi:10.1073/pnas.1114845109</a></li><li>Railsback, L. B. et al. (2018). The timing, two-pulsed nature, and variable climatic expression of the 4.2 ka event: a review and new high-resolution stalagmite data from Namibia. Quaternary Science Reviews 186.</li><li>Shaw, I. (ed.) (2000). The Oxford History of Ancient Egypt. Oxford University Press.</li><li>Enmarch, R. (2008). A World Upturned: Commentary on and Analysis of The Dialogue of Ipuwer and the Lord of All. Oxford University Press / British Academy.</li><li>Black, J. A. et al. The Cursing of Agade (c.2.1.5). The Electronic Text Corpus of Sumerian Literature, University of Oxford.</li></ol></details></div></script><script type="text/x-tpl" id="age-10-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Lion Gate, Mycenae, 201510.jpg" data-cap="The Lion Gate at Mycenae" data-big><figcaption></figcaption></figure><div class="sh-k">c. 3,600–3,150 years ago</div><h2 class="sh-t" id="age-10-st" tabindex="-1">The Bronze Age World and its Collapse</h2><p class="sh-s">Kings called each other &#x27;brother&#x27;, ships carried copper from Cyprus and tin from Central Asia, then in about fifty years almost all of it burned.</p><div class="sh-v"><span class="vstamp vstamp--phase" style="--vc:var(--carnelian)"><span aria-hidden="true">▼</span>Fall</span></div></div><p class="v4-q">What brought down the first globalised world?</p><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="10" >10</b><span class="ctr-u"> tonnes</span></div><div class="ctr-l">of copper in 354 ingots aboard the Uluburun ship</div><div class="ctr-c">Pulak 1998</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="3" >3</b><span class="ctr-u"> years</span></div><div class="ctr-l">of severe drought in Anatolia, c. 1198–1196 BCE</div><div class="ctr-c">Manning et al. 2023</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="400" >400</b><span class="ctr-u"> years</span></div><div class="ctr-l">without writing in Greece after the palaces fell</div><div class="ctr-c">Cline 2014</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="382" >382</b><span class="ctr-u"> tablets</span></div><div class="ctr-l">in the Amarna letters, the great powers&#x27; diplomatic mail</div><div class="ctr-c">Moran 1992</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="1177" >1,177</b><span class="ctr-u"> BCE</span></div><div class="ctr-l">approximate year of Ramesses III&#x27;s battle with the Sea Peoples</div><div class="ctr-c">Cline 2014</div></div></div><div class="rf"><div class="rf-c rf-up"><h3 class="rf-h"><span aria-hidden="true">▲</span> What rose</h3><ul><li>Minoan palaces on Crete, with frescoes, plumbing and the undeciphered Linear A script</li><li>Mycenaean Greece, with fortress palaces and Linear B, the oldest written Greek</li><li>The Hittite empire in Anatolia and Egypt&#x27;s New Kingdom, which signed one of the world&#x27;s oldest surviving peace treaties</li><li>A &#x27;club of great powers&#x27; (Egypt, Hatti, Babylon, Mitanni, Assyria) linked by letters, marriages and gifts</li><li>A long-distance trade network that moved copper, tin, glass, ivory and ebony across the eastern Mediterranean</li></ul></div><div class="rf-c rf-down"><h3 class="rf-h"><span aria-hidden="true">▼</span> What fell or was lost</h3><ul><li>The Hittite empire and its capital Hattusa, abandoned in the early 12th century BCE</li><li>The Mycenaean palaces, from Pylos to Mycenae, and with them Greek writing for about 400 years</li><li>Ugarit, a rich port city on the Syrian coast, destroyed around 1185 BCE and never reoccupied</li><li>Troy VIIa, destroyed by fire around 1180 BCE</li><li>Egypt&#x27;s empire in Canaan, lost in the decades after Ramesses III&#x27;s wars</li></ul></div></div><h3 class="sub-h wsub">What drove it</h3><div class="trigs"><div class="trig"><b>Multi-year drought</b><span>Tree rings from Gordion in Anatolia show three consecutive very dry years around 1198–1196 BCE, just as the Hittite state failed (Manning et al. 2023); pollen from Cyprus and Syria also points to drying (Kaniewski et al. 2013).</span></div><div class="trig"><b>Raiders and migrants</b><span>Ramesses III&#x27;s temple at Medinet Habu records land and sea battles in his 8th year (c. 1177 BCE) against the &#x27;Sea Peoples&#x27;; letters from Ugarit describe enemy ships (Cline 2014).</span></div><div class="trig"><b>Earthquakes</b><span>Some destruction layers show collapsed walls and trapped bodies consistent with a cluster of earthquakes, the &#x27;earthquake storm&#x27; idea (Nur and Cline 2000), though this is debated.</span></div><div class="trig"><b>Fragile interdependence</b><span>Palace economies depended on imported tin and grain, so a break in one link could cascade through the rest (Knapp and Manning 2016).</span></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Invading Sea Peoples destroyed the Late Bronze Age civilisations.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:50.0%" role="img" aria-label="Weight of evidence: Mixed record"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The Sea Peoples are real: Egyptian reliefs show their ships and captives, and Ugarit&#x27;s last letters describe enemy fleets. But tree rings show a severe drought, some destructions may be earthquakes or revolts, and several cities fell without any sign of foreign attackers. Most specialists now see a cascade in which drought, famine, raids, rebellion and broken trade fed one another, with the Sea Peoples as one strand, and partly as displaced people themselves.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">For much of the 20th century textbooks told a crisp story of barbarian invaders from the sea. That was overconfident: it rested mostly on Egyptian royal propaganda. Newer textbooks present a multi-causal collapse, which fits the evidence better, but they can make it sound more settled than it is. The order and weight of the causes still differ from site to site and remain open.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>The Uluburun ship, wrecked off southern Türkiye around 1300 BCE, carried about 10 tonnes of copper and 1 tonne of tin, plus glass, ivory and ebony from several lands.<small>Pulak 1998</small></li><li>About two-thirds of Uluburun&#x27;s tin came from Kestel in Anatolia and about a third from Mušiston in Central Asia, thousands of kilometres away.<small>Powell et al. 2022</small></li><li>Hattusa, Ugarit, Pylos, Mycenae and Troy VIIa were destroyed or abandoned within a few decades of 1200 BCE.<small>Cline 2014; Knapp and Manning 2016</small></li><li>Linear B, deciphered as Greek by Michael Ventris in 1952, disappears with the palaces; Greek was next written in an alphabet from about the 8th century BCE.<small>Chadwick 1958; Cline 2014</small></li><li>A severe three-year drought hit central Anatolia around 1198–1196 BCE.<small>Manning et al. 2023</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Who the Sea Peoples were, where they came from, and whether they were a cause of the collapse or refugees from it.</li><li>When Thera erupted: radiocarbon on an olive branch favours c. 1600 BCE, tree-ring calibrations and a 2023 olive shrub favour the mid-16th century, and some archaeologists prefer c. 1500 BCE.</li><li>Whether earthquakes caused several destructions, or whether burned layers are the work of enemies.</li><li>Whether the Trojan War of Greek epic remembers a real war over Wilusa (Troy).</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>The palace archives that survive are mostly clay tablets baked by the fires that destroyed them, so we see the last months of each palace, not the decades before.</li><li>Western Anatolia, the likely home of some Sea Peoples groups, is still thinly excavated.</li><li>Linear A and Cypro-Minoan, the scripts of Crete and Cyprus, remain undeciphered.</li></ul></div></div><h3 class="sub-h wsub">The bold reading</h3><div class="face"><div class="face-c face-x" style="grid-column:1/-1"><p>Geoarchaeologist Eberhard Zangger argues that western Anatolia was home to a major, overlooked Luwian civilisation of many kingdoms, and that a series of wars in which Luwian states attacked their neighbours, a &#x27;World War Zero&#x27;, brought down the Bronze Age world. The Sea Peoples, in his view, were largely these western Anatolian fleets. His Luwian Studies foundation catalogues hundreds of large, unexcavated settlement mounds in the region to make the case that its importance has been underrated.</p><div class="face-s"><b>Its strongest point</b><p>Western Anatolia is full of large Bronze Age mounds that have never been excavated, Hittite texts name many powerful western kingdoms such as Arzawa and Wilusa, and some Sea Peoples names plausibly point to Anatolian lands.</p></div><p class="face-cr"><b>Credit</b> Eberhard Zangger (the Luwian hypothesis)</p></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">4 min read · 933 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of The Bronze Age World and its Collapse"><button type="button" class="wtoc-i" data-go="age-10-s1">Metal biscuits with ears</button><button type="button" class="wtoc-i" data-go="age-10-s2">A club of great kings</button><button type="button" class="wtoc-i" data-go="age-10-s3">The fifty years that ended an age</button><button type="button" class="wtoc-i" data-go="age-10-s4">The challenger: a Luwian world war?</button><button type="button" class="wtoc-i" data-go="age-10-s5">Four hundred years without writing</button><button type="button" class="wtoc-i" data-go="age-10-s6">What the fire kept and what it took</button></nav></div><section class="wsec" id="age-10-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Metal biscuits with ears</h3><p>In 1982 a young Turkish sponge diver told archaeologists he had seen &#x27;metal biscuits with ears&#x27; on the sea floor off Cape Uluburun. They were copper ingots in the shape of an ox hide, and they belonged to a ship that sank around 1300 BCE. Over eleven summers of diving, a team led by George Bass and Cemal Pulak raised the Bronze Age in miniature: about ten tonnes of copper in 354 ingots, about a tonne of tin, 175 ingots of blue and turquoise glass, logs of African ebony, hippo and elephant ivory, amber, and a gold scarab with the name of Queen Nefertiti.</p><p>Copper plus tin at about ten to one makes bronze, and that ship carried enough for roughly eleven tonnes of it. A 2022 study traced about two-thirds of its tin to Kestel in Anatolia and a third to Mušiston in Central Asia, thousands of kilometres from any sea. This was a connected world, and connected worlds have a weakness: they can fall together.</p><blockquote class="wpull"><p>One wreck held the raw materials of a whole civilisation, gathered from three continents.</p></blockquote></section><section class="wsec" id="age-10-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>A club of great kings</h3><p>Between about 1600 and 1200 BCE the eastern Mediterranean was run by a handful of powers that knew each other well. The Amarna letters, 382 clay tablets found in Egypt, preserve their correspondence from the 14th century BCE: the kings of Babylon, Mitanni, Hatti and Assyria write to Pharaoh as &#x27;my brother&#x27;, ask for gold, send horses, and negotiate royal marriages. After the great chariot battle at Kadesh, Egypt and the Hittites signed a peace treaty around 1259 BCE whose text survives in both Egyptian and Akkadian versions.</p><p>On Crete the Minoans had built palaces with light wells, drains and painted walls, and wrote in Linear A, still unread. On Thera, the island now called Santorini, a whole town was buried by one of the largest eruptions of the last ten thousand years. When exactly is fiercely argued: radiocarbon on a buried olive branch favours about 1600 BCE, while tree-ring calibrations and an olive shrub published in 2023 favour the middle of the 16th century. The Atlantis case examines whether Plato&#x27;s story could remember it. After about 1450 BCE Mycenaean Greeks took over Knossos and wrote their accounts in Linear B, an early form of Greek.</p><figure class="wx wx--steps" id="age-10-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">How a connected world came apart</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How a connected world came apart"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 485" class="wx-svg" role="img" aria-labelledby="age-10-f1-t"><title id="age-10-f1-t">Map of the Late Bronze Age trade and diplomatic network and how it broke apart around 1200 BCE</title><defs><marker id="age-10-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker><marker id="age-10-f1-ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class
