a href="https://doi.org/10.7554/eLife.89106" target="_blank" rel="noopener">doi:10.7554/eLife.89106</a></li><li>Martinón-Torres M. et al. (2024). No scientific evidence that Homo naledi buried their dead and produced rock art. Journal of Human Evolution 195: 103464. <a href="https://doi.org/10.1016/j.jhevol.2023.103464" target="_blank" rel="noopener">doi:10.1016/j.jhevol.2023.103464</a></li><li>Sehasseh E.M. et al. (2021). Early Middle Stone Age personal ornaments from Bizmoune Cave, Essaouira, Morocco. Science Advances 7(39).</li><li>Henshilwood C.S. et al. (2011). A 100,000-year-old ochre-processing workshop at Blombos Cave, South Africa. Science 334: 219–222. <a href="https://doi.org/10.1126/science.1211535" target="_blank" rel="noopener">doi:10.1126/science.1211535</a></li><li>van den Bergh G.D. et al. (2016). Homo floresiensis-like fossils from the early Middle Pleistocene of Flores. Nature 534: 245–248. <a href="https://doi.org/10.1038/nature17999" target="_blank" rel="noopener">doi:10.1038/nature17999</a></li><li>Henshilwood C.S. et al. (2018). An abstract drawing from the 73,000-year-old levels at Blombos Cave, South Africa. Nature 562: 115–118. <a href="https://doi.org/10.1038/s41586-018-0514-3" target="_blank" rel="noopener">doi:10.1038/s41586-018-0514-3</a></li><li>Strasser T.F. et al. (2010). Stone Age seafaring in the Mediterranean: evidence from the Plakias region for Lower Palaeolithic and Mesolithic habitation of Crete. Hesperia 79: 145–190.</li><li>Hoffmann D.L. et al. (2018). U-Th dating of carbonate crusts reveals Neandertal origin of Iberian cave art. Science 359: 912–915. <a href="https://doi.org/10.1126/science.aap7778" target="_blank" rel="noopener">doi:10.1126/science.aap7778</a></li><li>Ambrose S.H. (1998). Late Pleistocene human population bottlenecks, volcanic winter, and differentiation of modern humans. Journal of Human Evolution 34: 623–651. <a href="https://doi.org/10.1006/jhev.1998.0219" target="_blank" rel="noopener">doi:10.1006/jhev.1998.0219</a></li><li>Storey M., Roberts R.G. &amp; Saidin M. (2012). Astronomically calibrated 40Ar/39Ar age for the Toba supereruption and global synchronization of late Quaternary records. PNAS 109: 18684–18688.</li><li>Smith E.I. et al. (2018). Humans thrived in South Africa through the Toba eruption about 74,000 years ago. Nature 555: 511–515. <a href="https://doi.org/10.1038/nature25967" target="_blank" rel="noopener">doi:10.1038/nature25967</a></li><li>Kappelman J. et al. (2024). Adaptive foraging behaviours in the Horn of Africa during Toba supereruption. Nature 628: 365–372. <a href="https://doi.org/10.1038/s41586-024-07208-3" target="_blank" rel="noopener">doi:10.1038/s41586-024-07208-3</a></li></ol></details></div></script><script type="text/x-tpl" id="age-02-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Paintings-Handprint-Cueva-de-las-Manos-Argentina.webp" data-cap="Hand stencils at the Cueva de las Manos, Argentina" data-big><figcaption></figcaption></figure><div class="sh-k">70,000–30,000 years ago</div><h2 class="sh-t" id="age-02-st" tabindex="-1">The Great Awakening</h2><p class="sh-s">Our species spreads across the world, paints the oldest pictures we know, and absorbs the last of the other humans.</p><div class="sh-v"><span class="vstamp vstamp--phase" style="--vc:var(--malachite)"><span aria-hidden="true">▲</span>Rise</span></div></div><p class="v4-q">Did the human mind switch on in Europe 40,000 years ago, or much earlier elsewhere?</p><div class="ctrs"><div class="ctr"><div class="ctr-v">at least <b class="ctr-n" data-v="67800" >67,800</b><span class="ctr-u"> years</span></div><div class="ctr-l">minimum age of the Muna hand stencil, Sulawesi</div><div class="ctr-c">Oktaviana et al. 2026</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="65000" >65,000</b><span class="ctr-u"> years</span></div><div class="ctr-l">age of the oldest artefact layers at Madjedbebe (± 5,700)</div><div class="ctr-c">Clarkson et al. 2017</div></div><div class="ctr"><div class="ctr-v">c. 1.5–<b class="ctr-n" data-v="2.1" data-dec="1">2.1</b><span class="ctr-u"> %</span></div><div class="ctr-l">Neanderthal DNA in people with non-African ancestry</div><div class="ctr-c">Prüfer et al. 2014</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="7000" >7,000</b><span class="ctr-u"> years</span></div><div class="ctr-l">length of the main Neanderthal mixing episode</div><div class="ctr-c">Iasi et al. 2024</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="40000" >40,000</b><span class="ctr-u"> years ago</span></div><div class="ctr-l">the last Neanderthals disappear</div><div class="ctr-c">Higham et al. 2014</div></div></div><div class="rf"><div class="rf-c rf-up"><h3 class="rf-h"><span aria-hidden="true">▲</span> What rose</h3><ul><li>Homo sapiens spreads out of Africa across Asia, into Sahul (Australia and New Guinea) and Europe</li><li>The oldest dated cave art: a hand stencil on Muna Island, Sulawesi, at least 67,800 years old</li><li>Narrative painting in Sulawesi by 51,200 years ago; carved figurines, flutes and Chauvet&#x27;s paintings in Europe by c. 36,000</li><li>Open-sea crossings of up to several tens of kilometres to reach Sahul</li></ul></div><div class="rf-c rf-down"><h3 class="rf-h"><span aria-hidden="true">▼</span> What fell or was lost</h3><ul><li>Neanderthals disappear c. 41,000–39,000 years ago</li><li>Homo floresiensis vanishes from the record c. 50,000 years ago</li><li>Denisovans fade from view; their end is unknown</li><li>Australia&#x27;s giant animals disappear, roughly 45,000–40,000 years ago</li></ul></div></div><h3 class="sub-h wsub">What drove it</h3><div class="trigs"><div class="trig"><b>A successful dispersal out of Africa</b><span>Genetic studies place the main lasting spread of modern humans from Africa at roughly 60,000–50,000 years ago.</span></div><div class="trig"><b>Unstable ice-age climate</b><span>Greenland ice records many abrupt warm-cold swings (Dansgaard-Oeschger events) through this period, each within decades.</span></div><div class="trig"><b>Volcanic and magnetic shocks around 42,000–40,000 years ago</b><span>The Campanian Ignimbrite eruption in Italy c. 40,000 years ago; the Laschamps geomagnetic excursion c. 42,000 years ago (Cooper et al. 2021, links to human events debated).</span></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>People reached Sahul (Australia and New Guinea) by about 65,000 years ago.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Madjedbebe&#x27;s luminescence dates are internally consistent, a 2025 genetic study of nearly 2,500 mitochondrial genomes lands near 60,000 years, and the 2026 Sulawesi date shows people on the island route by 67,800 years ago. Against it: sandy sites can move artefacts downward, other sites are younger, and the Neanderthal mixing window (50,500–43,500 years ago) sits awkwardly with an earlier arrival unless those genes came in later. The earlier date is now well supported but not settled.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">The confidence depends on where you read. Many international textbooks state &#x27;about 50,000 years&#x27;, while Australian public institutions often present 65,000 years as fact. Both sound more settled than the evidence, which consists of a few key sites and conflicting genetic arguments. On the rise of art, older textbooks were overconfident in a European &#x27;creative explosion&#x27; that the Sulawesi dates have overturned.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>A hand stencil on Muna Island off Sulawesi is at least 67,800 years old, the oldest dated rock art known; a painted scene of people and a pig on Sulawesi is at least 51,200 years old.<small>Oktaviana et al. 2026; Oktaviana et al. 2024</small></li><li>Everyone with ancestry outside Africa carries c. 1.5–2.1% Neanderthal DNA, mostly from one long episode of mixing c. 50,500–43,500 years ago.<small>Prüfer et al. 2014; Iasi et al. 2024</small></li><li>Modern humans were at Grotte Mandrin in France c. 54,000 years ago, far earlier than the old picture allowed.<small>Slimak et al. 2022</small></li><li>People were in Australia by at least c. 45,000–40,000 years ago; the burials at Lake Mungo date to c. 40,000 years.<small>Bowler et al. 2003; O&#x27;Connell et al. 2018</small></li><li>Neanderthal sites across Europe end c. 41,000–39,000 years ago, after thousands of years of overlap with modern humans.<small>Higham et al. 2014</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether people reached Sahul by c. 65,000 years ago (Madjedbebe; mitochondrial genomes, 2025) or only after c. 50,000 (the &#x27;short chronology&#x27;).</li><li>Why the Neanderthals disappeared: competition, absorption, small numbers, climate, disease, or a mix.</li><li>Whether the Laschamps magnetic excursion c. 42,000 years ago had any effect on people, as Cooper et al. 2021 proposed.</li><li>What caused the loss of Australia&#x27;s megafauna: hunting, fire, climate or a combination.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>The coastal route out of Africa and along southern Asia ran on shorelines tens of metres below today&#x27;s sea: the likeliest early camps are underwater.</li><li>Boats: people crossed to Sahul, but no watercraft of this age survives.</li><li>Rock art in the tropics weathers away; what survives in Sulawesi is a tiny sample, and most regions have never been dated.</li><li>Denisovan sites: we carry their genes, but their skeletons in Southeast Asia have hardly been found.</li></ul></div></div><h3 class="sub-h wsub">The bold reading</h3><div class="face"><div class="face-c face-x" style="grid-column:1/-1"><p>For decades the &#x27;human revolution&#x27; was placed in Europe around 40,000 years ago, when cave paintings and carved figurines appear. These researchers argue the story was a map of where archaeologists dug, not of where people thought. Their dates put figurative art and complex seafaring in Island Southeast Asia and northern Australia well before 50,000 years ago, and push the settlement of Australia to about 65,000 years ago.</p><div class="face-s"><b>Its strongest point</b><p>The Muna hand stencil, at least 67,800 years old, is older than any European cave art by more than 25,000 years, and it sits on the island route to Australia.</p></div><p class="face-cr"><b>Credit</b> Chris Clarkson and the Madjedbebe team; Adam Brumm, Maxime Aubert and Adhi Agus Oktaviana (Sulawesi rock art)</p></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">4 min read · 927 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Great Awakening"><button type="button" class="wtoc-i" data-go="age-02-s1">A hand on the wall</button><button type="button" class="wtoc-i" data-go="age-02-s2">Out of Africa, again</button><button type="button" class="wtoc-i" data-go="age-02-s3">Mixing with the cousins</button><button type="button" class="wtoc-i" data-go="age-02-s4">The oldest art is not where we looked</button><button type="button" class="wtoc-i" data-go="age-02-s5">When did people reach Australia?</button><button type="button" class="wtoc-i" data-go="age-02-s6">The last of the others</button><button type="button" class="wtoc-i" data-go="age-02-s7">What time has hidden</button></nav></div><section class="wsec" id="age-02-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A hand on the wall</h3><p>On Muna, a small island off southeast Sulawesi, someone pressed a hand against a limestone wall at least 67,800 years ago and blew red pigment around it. Then, it seems, they reworked the outline so the fingertips look narrow and pointed, almost like claws. It is the oldest dated rock art on Earth, and it is not in Europe, where the story of human creativity used to begin.</p><p>This age is the one most textbooks call the great awakening: art, ornaments, musical instruments, long-distance travel. The evidence now suggests the awakening was not a sudden switch in one place but lights coming on across a vast region, most of them in places archaeologists visited late.</p><blockquote class="wpull"><p>The awakening looks less like a switch in Europe and more like lights coming on across half the world.</p></blockquote></section><section class="wsec" id="age-02-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Out of Africa, again</h3><p>Homo sapiens had left Africa before, into the Levant and perhaps beyond, but those earlier groups left little or no trace in living people. The dispersal that counts genetically happened roughly 60,000–50,000 years ago. From there people moved fast: into South and Southeast Asia, across the sea to Sahul, and into Europe. At Grotte Mandrin in the Rhône valley, a tooth and distinctive stone points place modern humans in France c. 54,000 years ago, apparently a pioneer group that did not last.</p><p>Much of that journey probably ran along coasts. During this age the sea stood tens of metres below today, so the beaches, estuaries and shell middens of the southern route now lie offshore. Its best evidence is underwater.</p></section><section class="wsec" id="age-02-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Mixing with the cousins</h3><p>Ancient genomes have turned a debate into a record. Everyone with ancestry outside Africa carries roughly 1.5–2.1% Neanderthal DNA. Genomes from Ranis in Germany and Zlatý kůň in Czechia, and a 2024 study of many ancient individuals, place most of that mixing in one long episode c. 50,500–43,500 years ago. People in New Guinea and Aboriginal Australians carry additional Denisovan ancestry, from encounters somewhere in Asia or Wallacea.</p><p>Some of these genes still matter. A Denisovan-derived gene variant helps many Tibetans cope with high altitude. The other humans did not simply vanish; part of them is in us.</p></section><section class="wsec" id="age-02-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The oldest art is not where we looked</h3><p>European caves gave the world its first image of Ice Age art: the lions and rhinos of Chauvet, painted c. 36,000 years ago, the ivory lion-man of Hohlenstein-Stadel, bone flutes from the Swabian Jura. For a century these were treated as the beginning. Then a team working in Sulawesi began dating the thin mineral crusts that grow over paintings there.</p><figure class="wx wx--steps" id="age-02-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">How a hand stencil is dated</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How a hand stencil is dated"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" class="wx-svg" role="img" aria-labelledby="age-02-f1-t"><title id="age-02-f1-t">How a cave hand stencil is dated with uranium-series dating of the mineral crust that grew over it</title><rect class="wx-stone" x="16" y="70" width="280" height="300" rx="14"/><path class="wx-edge-soft" d="M30,120 C80,110 120,140 170,126 M40,300 C90,290 150,320 220,300 M200,90 C230,110 260,100 280,120" fill="none"/><text class="wx-t-cap" x="24" y="60">THE CAVE WALL</text><circle class="wx-c4 wx-o40 wx-st" data-s="1" cx="206" cy="220" r="38"/><circle class="wx-c4 wx-o40 wx-st" data-s="1" cx="208.4" cy="250.2" r="29"/><circle class="wx-c4 wx-o40 wx-st" data-s="1" cx="182.9" cy="261.1" r="22.3"/><circle class="wx-c4 wx-o40 wx-st" data-s="1" cx="173.6" cy="291.1" r="33"/><circle class="wx-c4 wx-o40 wx-st" data-s="1" cx="150" cy="292.7" r="37"/><circle class="wx-c4 wx-o40 wx-st" data-s="1" cx="131.8" cy="275" r="25.2"/><circle class="wx-c4 wx-o40 wx-st" data-s="1" cx="104" cy="277.5" r="24.3"/><circle class="wx-c4 wx-o40 wx-st" data-s="1" cx="101.7" cy="245" r="36.3"/><circle class="wx-c4 wx-o40 wx-st" data-s="1" cx="98.2" cy="220" r="34.1"/><circle class="wx-c4 wx-o40 wx-st" data-s="1" cx="89.7" cy="188.8" r="22.7"/><circle class="wx-c4 wx-o40 wx-st" data-s="1" cx="116.1" cy="177.7" r="27.8"/><circle class="wx-c4 wx-o40 wx-st" data-s="1" cx="128" cy="153.5" r="37.9"/><circle class="wx-c4 wx-o40 wx-st" data-s="1" cx="150" cy="142.5" r="30.2"/><circle class="wx-c4 wx-o40 wx-st" data-s="1" cx="167.8" cy="166.4" r="22"/><circle class="wx-c4 wx-o40 wx-st" data-s="1" cx="194.4" cy="164.5" r="31.9"/><circle class="wx-c4 wx-o40 wx-st" data-s="1" cx="202.2" cy="192.9" r="37.5"/><ellipse class="wx-c4 wx-o60 wx-st" data-s="1" cx="150" cy="220" rx="80" ry="92"/><rect class="wx-stone wx-st" data-s="1" x="120" y="210" width="60" height="62" rx="18"/><rect class="wx-stone wx-st" data-s="1" x="128" y="260" width="44" height="60" rx="8"/><path class="wx-stone wx-st" data-s="1" d="M121.6,217.4 L115,165.6 Q115.9,159.3 119.4,164.7 L134.4,214.6 Z"/><path class="wx-stone wx-st" data-s="1" d="M135.5,216.5 L135.4,154.3 Q137.3,148.2 139.9,154 L148.5,215.5 Z"/><path class="wx-stone wx-st" data-s="1" d="M150.5,215.5 L158.9,156 Q161.6,150.2 163.5,156.3 L163.5,216.5 Z"/><path class="wx-stone wx-st" data-s="1" d="M164.6,214.6 L179.2,166.6 Q182.6,161.2 183.6,167.6 L177.4,217.4 Z"/><path class="wx-stone wx-st" data-s="1" d="M119.3,255.9 L84.4,228.8 Q80.6,223.5 87,224.6 L126.7,244.1 Z"/><text class="wx-t-s wx-halo" x="156" y="360" text-anchor="middle">pointed fingertips, altered on purpose</text><circle class="wx-hl" cx="208" cy="162" r="16"/><path class="wx-thin" d="M222,154 L330,92 M222,170 L330,330"/><rect class="wx-rock" x="330" y="272" width="370" height="58"/><text class="wx-t-s" x="690" y="316" text-anchor="end">limestone</text><rect class="wx-c4 wx-st" data-s="1" x="330" y="264" width="370" height="8"/><text class="wx-t-b wx-halo wx-st" x="340" y="290" data-s="1">paint layer</text><path class="wx-ice wx-edge-soft wx-st" data-s="2" d="M330,264 H700 V244 C620,238 520,246 440,240 S360,245 330,242 Z"/><path class="wx-sand wx-edge-soft wx-st" data-s="2" d="M330,240 H700 V218 C620,212 520,220 440,214 S360,219 330,216 Z"/><path class="wx-ice wx-edge-soft wx-st" data-s="2" d="M330,214 H700 V194 C620,188 520,196 440,190 S360,195 330,192 Z"/><path class="wx-sand wx-edge-soft wx-st" data-s="2" d="M330,190 H700 V168 C620,162 520,170 440,164 S360,169 330,166 Z"/><g class="wx-st wx-hide" data-only="2"><circle class="wx-num" cx="344" cy="128" r="9"/><text class="wx-numt" x="344" y="132" text-anchor="middle">2</text><text class="wx-t-b" x="360" y="132">Calcite crust grows over the paint,</text><text class="wx-t" x="360" y="148">a film at a time, over millennia</text></g><g class="wx-st wx-hide" data-only="1"><circle class="wx-num" cx="344" cy="128" r="9"/><text class="wx-numt" x="344" y="132" text-anchor="middle">1</text><text class="wx-t-b" x="360" y="132">Pigment is blown around a hand:</text><text class="wx-t" x="360" y="148">a stencil on bare rock</text></g><rect class="wx-paper wx-hl wx-st wx-hide" data-s="3" x="560" y="244" width="18" height="16"/><rect class="wx-paper wx-hl wx-st wx-hide" data-s="3" x="590" y="218" width="18" height="16"/><rect class="wx-paper wx-hl wx-st wx-hide" data-s="3" x="620" y="192" width="18" height="16"/><rect class="wx-paper wx-hl wx-st wx-hide" data-s="3" x="650" y="168" width="18" height="16"/><g class="wx-st wx-hide" data-only="3"><circle class="wx-num" cx="344" cy="128" r="9"/><text class="wx-numt" x="344" y="132" text-anchor="middle">3</text><text class="wx-t-b" x="360" y="132">Scrape tiny samples, layer by layer,</text><text class="wx-t" x="360" y="148">from the top down to the paint</text></g><g class="wx-st wx-hide" data-only="4"><circle class="wx-num" cx="344" cy="128" r="9"/><text class="wx-numt" x="344" y="132" text-anchor="middle">4</text><text class="wx-t-b" x="360" y="132">Uranium in the calcite decays to thorium</text><text class="wx-t" x="360" y="148">at a known rate: the ratio is a clock</text></g><g class="wx-st wx-hide" data-s="4"><rect class="wx-c2 wx-o80" x="504" y="248" width="46" height="8"/><rect class="wx-accfill" x="504" y="248" width="41.4" height="8"/></g><g class="wx-st wx-hide" data-s="4"><rect class="wx-c2 wx-o80" x="534" y="222" width="46" height="8"/><rect class="wx-accfill" x="534" y="222" width="27.6" height="8"/></g><g class="wx-st wx-hide" data-s="4"><rect class="wx-c2 wx-o80" x="564" y="196" width="46" height="8"/><rect class="wx-accfill" x="564" y="196" width="16.1" height="8"/></g><g class="wx-st wx-hide" data-s="4"><rect class="wx-c2 wx-o80" x="594" y="172" width="46" height="8"/><rect class="wx-accfill" x="594" y="172" width="6.9" height="8"/></g><text class="wx-t-s" x="360" y="360"></text><g class="wx-st wx-hide" data-s="4"><rect class="wx-accfill" x="330" y="352" width="14" height="8"/><text class="wx-t-s" x="350" y="360">thorium-230 (grows with time)</text><rect class="wx-c2 wx-o60" x="530" y="352" width="14" height="8"/><text class="wx-t-s" x="550" y="360">uranium</text></g><g class="wx-st wx-hide" data-s="5"><circle class="wx-num" cx="344" cy="128" r="9"/><text class="wx-numt" x="344" y="132" text-anchor="middle">5</text><text class="wx-t-b" x="360" y="132">The crust just above the paint is at least</text><text class="wx-t" x="360" y="148">67,800 years old, so the paint is older still</text></g><path class="wx-dim wx-st wx-hide" data-s="5" d="M350,168 V262"/><text class="wx-t-s wx-halo wx-st wx-hide" x="358" y="186" data-s="5">younger</text><text class="wx-t-b wx-t-a wx-halo wx-st wx-hide" x="358" y="256" data-s="5">≥ 67,800 yrs</text><text class="wx-t-cap" x="330" y="60">CROSS-SECTION, MAGNIFIED (A FEW MM THICK)</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> An artist blows pigment around a hand pressed to the rock, leaving a stencil. On Muna the fingertips were reshaped to look pointed.</p><ol class="wx-steplist"><li>An artist blows pigment around a hand pressed to the rock, leaving a stencil. On Muna the fingertips were reshaped to look pointed.</li><li>Over thousands of years, water seeping down the wall leaves thin films of calcite that build up into a crust over the paint.</li><li>Researchers scrape tiny samples from the crust, layer by layer, down towards the paint.</li><li>Water brings in uranium but almost no thorium. Uranium decays into thorium-230 at a known rate, so the ratio of the two gives each layer&#x27;s age.</li><li>The deepest crust over the Muna stencil is at least 67,800 years old, so the painting beneath is older still.</li></ol><figcaption>Uranium-series dating measures the mineral crust over the paint, so the result is a minimum age: the paint must be older. <span class="wx-src">Based on: Method as described in Aubert et al. 2014 and Oktaviana et al. 2026; layer thicknesses and ratios schematic.</span></figcaption><p class="vh">Left: a cave wall with a red sprayed stencil of a hand whose fingertips are narrowed to points. A magnifying circle on the stencil&#x27;s edge links to a magnified cross-section on the right: limestone at the bottom, a thin red paint layer, and above it four bands of calcite crust. Step 3 adds small sample boxes cut from each band. Step 4 adds bars comparing uranium and thorium in each sample, with more thorium in deeper layers. Step 5 marks the layer just above the paint as at least 67,800 years old and the top as younger.</p></figure><p>The results arrived in steps. A painted pig at Leang Tedongnge, at least 45,500 years old. A scene of human-like figures and a pig at Leang Karampuang, at least 51,200 years old, the oldest known picture that seems to tell a story. And in 2026, the Muna hand stencil, at least 67,800 years old. Because the method dates the crust, not the paint, every one of these is a minimum age.</p><aside class="wcall"><b>Fresh from the field</b><p>The 2026 Muna date (Oktaviana et al., Nature) pushes dated rock art back by more than 16,000 years compared with the Sulawesi records of 2024. The researchers think the painters were probably Homo sapiens, perhaps among the people whose relatives reached Australia, but they note that another kind of human cannot be fully ruled out.</p></aside></section><section class="wsec" id="age-02-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>When did people reach Australia?</h3><p>Reaching Sahul needed boats and open-water crossings, even at low sea level. At Madjedbebe, a rock shelter in Arnhem Land, excavators in 2017 dated the lowest dense layer of stone tools, ground ochre and grinding stones to c. 65,000 years ago. Critics, notably James O&#x27;Connell and Jim Allen, argue that artefacts can sink through sandy deposits and that most reliably dated sites are younger than c. 50,000 years. In 2025 they added a genetic argument: the Neanderthal DNA shared by all non-Africans was acquired no earlier than about 50,500 years ago, so Sahul&#x27;s first settlers, they reason, arrived after that.</p><figure class="wx wx--static" id="age-02-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">When did people reach Sahul? The evidence on one axis</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="When did people reach Sahul? The evidence on one axis"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" class="wx-svg" role="img" aria-labelledby="age-02-f2-t"><title id="age-02-f2-t">Timeline of the evidence for when people first reached Sahul, from 80,000 to 35,000 years ago: Madjedbebe, Sulawesi rock art, genetic estimates, the Neanderthal mixing window, the short chronology and Lake Mungo</title><defs><marker id="age-02-f2-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker><marker id="age-02-f2-ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text class="wx-t-cap" x="16" y="26">WHEN DID PEOPLE REACH SAHUL (AUSTRALIA + NEW GUINEA)?</text><text class="wx-t-m" x="16" y="44">The evidence on one time axis; bars show published ranges</text><path class="wx-guide" d="M250,64V356"/><text class="wx-t-s" x="250" y="374" text-anchor="middle">80,000</text><path class="wx-guide" d="M350,64V356"/><text class="wx-t-s" x="350" y="374" text-anchor="middle">70,000</text><path class="wx-guide" d="M450,64V356"/><text class="wx-t-s" x="450" y="374" text-anchor="middle">60,000</text><path class="wx-guide" d="M550,64V356"/><text class="wx-t-s" x="550" y="374" text-anchor="middle">50,000</text><path class="wx-guide" d="M650,64V356"/><text class="wx-t-s" x="650" y="374" text-anchor="middle">40,000</text><path class="wx-line" d="M250,356H700"/><text class="wx-t-s" x="700" y="392" text-anchor="end">years ago</text><text class="wx-t-b" x="16" y="98">Madjedbebe, N. Australia</text><text class="wx-t-s" x="16" y="112">sediment luminescence (OSL)</text><rect class="wx-c3 wx-o60 wx-growx" style="--d:0" x="343" y="90" width="114" height="14" rx="3"/><circle class="wx-c3 wx-edge wx-pop" style="--d:2" cx="400" cy="97" r="6"/><text class="wx-t-s wx-halo" x="469" y="101">65,000 ± 5,700</text><text class="wx-t-b" x="16" y="136">Sulawesi hand stencil</text><text class="wx-t-s" x="16" y="150">U-series, minimum age</text><circle class="wx-c4 wx-edge wx-pop" style="--d:3" cx="372" cy="135" r="6"/><path class="wx-line wx-s4 wx-draw" pathLength="1" style="--d:4" marker-end="url(#age-02-f2-ak)" d="M364,135 H332"/><text class="wx-t-s wx-halo" x="384" y="139">≥ 67,800 (could be older)</text><text class="wx-t-b" x="16" y="174">Mitochondrial genomes</text><text class="wx-t-s" x="16" y="188">c. 2,500 modern genomes, 2025</text><circle class="wx-c5 wx-edge wx-pop" style="--d:4" cx="450" cy="173" r="6"/><text class="wx-t-s wx-halo" x="462" y="177">c. 60,000</text><text class="wx-t-b" x="16" y="212">Sulawesi painted scene</text><text class="wx-t-s" x="16" y="226">U-series, minimum age</text><circle class="wx-c4 wx-edge wx-pop" style="--d:5" cx="538" cy="211" r="6"/><path class="wx-line wx-s4 wx-draw" pathLength="1" style="--d:6" marker-end="url(#age-02-f2-ak)" d="M530,211 H498"/><text class="wx-t-s wx-halo" x="550" y="215">≥ 51,200</text><text class="wx-t-b" x="16" y="250">Neanderthal mixing</text><text class="wx-t-s" x="16" y="264">shared by all non-Africans</text><rect class="wx-c2 wx-o60 wx-growx" style="--d:4" x="545" y="242" width="70" height="14" rx="3"/><text class="wx-t-s wx-halo" x="535" y="253" text-anchor="end">50,500–43,500</text><text class="wx-t-b" x="16" y="288">'Short chronology'</text><text class="wx-t-s" x="16" y="302">securely dated sites</text><rect class="wx-c6 wx-o60 wx-growx" style="--d:5" x="550" y="280" width="50" height="14" rx="3"/><text class="wx-t-s wx-halo" x="540" y="291" text-anchor="end">c. 50,000–45,000</text><text class="wx-t-b" x="16" y="326">Lake Mungo burials</text><text class="wx-t-s" x="16" y="340">SE Australia</text><rect class="wx-c3 wx-o60 wx-growx" style="--d:6" x="630" y="318" width="40" height="14" rx="3"/><circle class="wx-c3 wx-edge wx-pop" style="--d:8" cx="650" cy="325" r="6"/><text class="wx-t-s wx-halo" x="620" y="329" text-anchor="end">c. 40,000 ± 2,000</text><rect class="wx-accfill wx-o20" x="545" y="64" width="70" height="292"/><text class="wx-t-s wx-t-a wx-halo" x="580" y="76" text-anchor="middle">mixing window</text></svg></div></div><figcaption>The case for an early arrival and the case for a later one, plotted together. Arrows mark minimum ages, which could be older. <span class="wx-src">Based on: Clarkson et al. 2017; Oktaviana et al. 2024, 2026; Science Advances 2025 (long chronology genomes); Iasi et al. 2024; O&#x27;Connell et al. 2018; Allen &amp; O&#x27;Connell 2025; Bowler et al. 2003.</span></figcaption><p class="vh">A horizontal time axis from 80,000 to 35,000 years ago with seven rows. Madjedbebe: a bar from about 70,700 to 59,300 with a point at 65,000. Sulawesi hand stencil: a point at 67,800 with an arrow pointing older. Mitochondrial genomes: a point at about 60,000. Sulawesi painted scene: a point at 51,200 with an arrow pointing older. Neanderthal mixing: a bar from 50,500 to 43,500, also shaded as a vertical band. Short chronology: a bar from about 50,000 to 45,000. Lake Mungo burials: a bar around 40,000 years.</p></figure><p>The same year a study of nearly 2,500 mitochondrial genomes from Aboriginal Australians and New Guineans estimated first settlement at about 60,000 years ago, by two routes. And the Muna date shows people on the island chain leading toward Australia by 67,800 years ago. Many Aboriginal communities hold that they have always been on Country; science cannot test &#x27;always&#x27;, but it increasingly supports a very deep presence.</p></section><section class="wsec" id="age-02-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>The last of the others</h3><p>By c. 41,000–39,000 years ago the Neanderthals were gone from the record across Europe, after thousands of years of overlap with incoming modern humans. Homo floresiensis disappears c. 50,000 years ago, not long after modern humans reached the region. In Australia, giant marsupials, birds and reptiles vanish roughly 45,000–40,000 years ago. The timing is suggestive; the mechanism is still argued over. Competition and absorption, fire, hunting and a jittery climate all play a part in current models.</p><p>Some researchers point to extra shocks: the Campanian Ignimbrite super-eruption near Naples c. 40,000 years ago, and the Laschamps excursion c. 42,000 years ago, when Earth&#x27;s magnetic field weakened drastically. A 2021 study linked the latter to environmental crisis and even to cave use; critics find the human connections unproven.</p></section><section class="wsec" id="age-02-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What time has hidden</h3><p>The pattern here is a rise, but a rise seen through a keyhole. The coasts are drowned, the boats have rotted, and tropical paint weathers. The Sulawesi dates came from a handful of caves; most walls in Southeast Asia, India and Arabia have never been sampled. Every time a new region is examined carefully, the story gets older.</p><p>What would settle the big questions: more dated sites in Wallacea and northern Australia with sealed layers, Denisovan skeletons, submerged coastal surveys along the Arabian and Indian shelves, and uranium-series dating of rock art far beyond Sulawesi.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">65,800 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Hand stencil painted on Muna, Sulawesi (minimum age)</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">63,000 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Oldest artefact layers at Madjedbebe, northern Australia</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">52,000 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Modern humans at Grotte Mandrin, France</span></li><li class="wtl-build" style="--i:3"><span class="wtl-y">49,200 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Painted pig-and-people scene, Sulawesi (minimum age)</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">45,000 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Main period of Neanderthal mixing (c. 50,500–43,500 years ago)</span></li><li class="wtl-loss" style="--i:5"><span class="wtl-y">38,000 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Burials at Lake Mungo; last Neanderthals disappear</span></li><li class="wtl-build" style="--i:6"><span class="wtl-y">34,000 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Chauvet Cave paintings, France</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2017 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Madjedbebe dated to c. 65,000 years</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2026 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Muna hand stencil dated to at least 67,800 years</span></li></ol><h3 class="sub-h wsub">Go deeper</h3><div class="links-row"><button type="button" onclick="openItem('articles','case-aboriginal-sea')">Stories Older Than the Sea <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-drowned-coasts')">The Drowned Coasts <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-lost-civilization')">Was There a Lost Ice Age Civilisation? <span aria-hidden="true">→</span></button></div><details class="srcs"><summary>Sources for this age (18)</summary><ol><li>Oktaviana A.A. et al. (2026). Rock art from at least 67,800 years ago in Sulawesi. Nature 650: 652–656. <a href="https://doi.org/10.1038/s41586-025-09968-y" target="_blank" rel="noopener">doi:10.1038/s41586-025-09968-y</a></li><li>Oktaviana A.A. et al. (2024). Narrative cave art in Indonesia by 51,200 years ago. Nature 631: 814–818. <a href="https://doi.org/10.1038/s41586-024-07541-7" target="_blank" rel="noopener">doi:10.1038/s41586-024-07541-7</a></li><li>Brumm A. et al. (2021). Oldest cave art found in Sulawesi. Science Advances 7: eabd4648. <a href="https://doi.org/10.1126/sciadv.abd4648" target="_blank" rel="noopener">doi:10.1126/sciadv.abd4648</a></li><li>Aubert M. et al. (2014). Pleistocene cave art from Sulawesi, Indonesia. Nature 514: 223–227. <a href="https://doi.org/10.1038/nature13422" target="_blank" rel="noopener">doi:10.1038/nature13422</a></li><li>Clarkson C. et al. (2017). Human occupation of northern Australia by 65,000 years ago. Nature 547: 306–310. <a href="https://doi.org/10.1038/nature22968" target="_blank" rel="noopener">doi:10.1038/nature22968</a></li><li>O&#x27;Connell J.F. et al. (2018). When did Homo sapiens first reach Southeast Asia and Sahul? PNAS 115: 8482–8490.</li><li>Allen J. &amp; O&#x27;Connell J.F. (2025). Article in Archaeology in Oceania arguing from the timing of Neanderthal admixture that people reached Sahul after c. 50,000 years ago (reported by Archaeology Magazine, July 2025).</li><li>Science Advances (2025). Genomic evidence supports the &#x27;long chronology&#x27; for the peopling of Sahul (University of Huddersfield and University of Southampton team incl. M. Richards and H. Farr). <a href="https://doi.org/10.1126/sciadv.ady9493" target="_blank" rel="noopener">doi:10.1126/sciadv.ady9493</a></li><li>Iasi L.N.M. et al. (2024). Neanderthal ancestry through time: insights from genomes of ancient and present-day humans. Science 386: eadq3010. <a href="https://doi.org/10.1126/science.adq3010" target="_blank" rel="noopener">doi:10.1126/science.adq3010</a></li><li>Sümer A.P. et al. (2024). Earliest modern human genomes constrain timing of Neanderthal admixture. Nature. <a href="https://doi.org/10.1038/s41586-024-08420-x" target="_blank" rel="noopener">doi:10.1038/s41586-024-08420-x</a></li><li>Prüfer K. et al. (2014). The complete genome sequence of a Neanderthal from the Altai Mountains. Nature 505: 43–49. <a href="https://doi.org/10.1038/nature12886" target="_blank" rel="noopener">doi:10.1038/nature12886</a></li><li>Huerta-Sánchez E. et al. (2014). Altitude adaptation in Tibetans caused by introgression of Denisovan-like DNA. Nature 512: 194–197. <a href="https://doi.org/10.1038/nature13408" target="_blank" rel="noopener">doi:10.1038/nature13408</a></li><li>Slimak L. et al. (2022). Modern human incursion into Neanderthal territories 54,000 years ago at Mandrin, France. Science Advances 8: eabj9496. <a href="https://doi.org/10.1126/sciadv.abj9496" target="_blank" rel="noopener">doi:10.1126/sciadv.abj9496</a></li><li>Higham T. et al. (2014). The timing and spatiotemporal patterning of Neanderthal disappearance. Nature 512: 306–309. <a href="https://doi.org/10.1038/nature13621" target="_blank" rel="noopener">doi:10.1038/nature13621</a></li><li>Bowler J.M. et al. (2003). New ages for human occupation and climatic change at Lake Mungo, Australia. Nature 421: 837–840. <a href="https://doi.org/10.1038/nature01383" target="_blank" rel="noopener">doi:10.1038/nature01383</a></li><li>Roberts R.G. et al. (2001). New ages for the last Australian megafauna: continent-wide extinction about 46,000 years ago. Science 292: 1888–1892. <a href="https://doi.org/10.1126/science.1060264" target="_blank" rel="noopener">doi:10.1126/science.1060264</a></li><li>Cooper A. et al. (2021). A global environmental crisis 42,000 years ago. Science 371: 811–818. <a href="https://doi.org/10.1126/science.abb8677" target="_blank" rel="noopener">doi:10.1126/science.abb8677</a></li><li>Quiles A. et al. (2016). A high-precision chronological model for the decorated Upper Paleolithic cave of Chauvet-Pont d&#x27;Arc, Ardèche, France. PNAS 113: 4670–4675.</li></ol></details></div></script><script type="text/x-tpl" id="age-03-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Lascaux painting.jpg" data-cap="Ice Age animals painted at Lascaux, France" data-big><figcaption></figcaption></figure><div class="sh-k">30,000–14,700 years ago</div><h2 class="sh-t" id="age-03-st" tabindex="-1">The Ice Age World</h2><p class="sh-s">With the sea some 130 m lower, a lost world of coasts, plains and river valleys lay open, and people walked into the Americas.</p><div class="sh-v"><span class="vstamp vstamp--phase" style="--vc:var(--bronze)"><span aria-hidden="true">↕</span>Rise and fall</span></div></div><p class="v4-q">Who lived on the Ice Age coasts that are now under the sea?</p><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="134" >134</b><span class="ctr-u"> m</span></div><div class="ctr-l">global sea level below today at the glacial peak</div><div class="ctr-c">Lambeck et al. 2014</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="1.8" data-dec="1">1.8</b><span class="ctr-u"> million km²</span></div><div class="ctr-l">area of Sundaland, Southeast Asia&#x27;s ice-age landmass</div><div class="ctr-c">Hanebuth et al. 2000; Bird et al. 2005</div></div><div class="ctr"><div class="ctr-v">up to c. <b class="ctr-n" data-v="1000" >1,000</b><span class="ctr-u"> km</span></div><div class="ctr-l">width of Beringia from north to south</div><div class="ctr-c">Hoffecker et al. 2014</div></div><div class="ctr"><div class="ctr-v">up to c. <b class="ctr-n" data-v="23000" >23,000</b><span class="ctr-u"> years</span></div><div class="ctr-l">age of the oldest footprints at White Sands</div><div class="ctr-c">Bennett et al. 2021; Pigati et al. 2023</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="37" >37</b><span class="ctr-u"> m</span></div><div class="ctr-l">depth of the entrance to Cosquer Cave&#x27;s painted chambers today</div><div class="ctr-c">Clottes &amp; Courtin 1996</div></div></div><div class="rf"><div class="rf-c rf-up"><h3 class="rf-h"><span aria-hidden="true">▲</span> What rose</h3><ul><li>People in North America by c. 23,000–21,000 years ago, at White Sands, New Mexico</li><li>Great painted caves: Lascaux (c. 17,000–22,000 years ago) and the now-drowned Cosquer Cave</li><li>Wide land connections: Beringia, Sundaland, Sahul and Doggerland became dry country</li><li>Survival skills for extreme cold: tailored clothing, needles, stored food and mammoth-bone dwellings</li></ul></div><div class="rf-c rf-down"><h3 class="rf-h"><span aria-hidden="true">▼</span> What fell or was lost</h3><ul><li>Much of northern Europe, Asia and North America under ice or polar desert</li><li>Populations retreat into warmer refuges in southern Europe and elsewhere</li><li>Everything people built on the ice-age coasts, drowned as the sea later rose</li></ul></div></div><h3 class="sub-h wsub">What drove it</h3><div class="trigs"><div class="trig"><b>The ice sheets at their greatest</b><span>The Last Glacial Maximum, c. 26,500–19,000 years ago; about 52 million km³ more ice on land than today (Clark et al. 2009; Lambeck et al. 2014).</span></div><div class="trig"><b>Sea level c. 130 m below today</b><span>Global ice-volume sea level fell to about −134 m by 21,000 years ago (Lambeck et al. 2014).</span></div><div class="trig"><b>Deglaciation begins</b><span>Ice sheets start to shrink c. 20,000–19,000 years ago; a first sea-level rise of 10–15 m follows before 18,000 years ago (Lambeck et al. 2014).</span></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>A civilisation with monumental architecture flourished on the ice-age coasts and was lost when the sea rose.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The premise is sound: vast coastal land was drowned and is largely unexplored. But no artefact, structure, domesticated plant or genetic trace of a complex ice-age society has been found, including on shelves that have been dredged, trawled and surveyed, such as the North Sea. The Gunung Padang construction claim was retracted in 2024 because the dated soil showed no link to human activity. The idea awaits evidence rather than being ruled out.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks are right that every excavated ice-age site shows hunter-gatherers, but they rarely mention that the likeliest places for larger coastal settlements were never excavated. On the Americas they were badly overconfident: &#x27;Clovis first&#x27;, about 13,000 years ago, was taught as settled for decades before sites such as Monte Verde and White Sands pushed arrival much earlier.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Global sea level stood about 134 m below today at the height of the last glaciation, c. 21,000 years ago.<small>Lambeck et al. 2014</small></li><li>Sundaland, the dry Sunda Shelf joining Malaysia, Sumatra, Java and Borneo, covered about 1.8 million km², roughly twice the land there today.<small>Hanebuth et al. 2000; Bird et al. 2005</small></li><li>Human footprints at White Sands, New Mexico, are c. 23,000–21,000 years old, confirmed by seeds, pollen, quartz and lake-sediment dating.<small>Bennett et al. 2021; Pigati et al. 2023; Holliday et al. 2025</small></li><li>Cosquer Cave near Marseille holds Ice Age paintings and engravings; its entrance is now 37 m under the sea.<small>Clottes &amp; Courtin 1996</small></li><li>Beringia, the land between Siberia and Alaska, was up to about 1,000 km wide from north to south.<small>Hoffecker et al. 2014</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>How the first Americans arrived: along the Pacific coast by boat, through an inland route, or earlier than anyone has shown.</li><li>Whether any society on the drowned shelves was more complex than the hunter-gatherers known from inland sites.</li><li>Whether Gunung Padang in Java hides construction c. 27,000 years old; the 2023 paper claiming it was retracted in 2024.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>The ice-age coastline itself: a strip of land that ran around every continent now lies 40–130 m under water, and only a tiny fraction has been surveyed.</li><li>Coastal camps, boats, fish traps and shell middens that would show seafaring and settled coastal life.</li><li>In the Americas, most places where people could have lived 20,000 years ago are buried under later sediment or now under the sea.</li></ul></div></div><h3 class="sub-h wsub">The bold reading</h3><div class="face"><div class="face-c face-x" style="grid-column:1/-1"><p>Hancock argues that the flooding of the ice-age coasts could have erased an early, more advanced civilisation, and that archaeologists are looking in the wrong place: dry land that was then marginal. Natawidjaja argues that Gunung Padang in Java contains buried construction phases reaching back tens of thousands of years. Oppenheimer proposed that the drowning of Sundaland scattered people and ideas across Asia.</p><div class="face-s"><b>Its strongest point</b><p>The best land of the Ice Age, the flat, fertile, well-watered coasts, is exactly the land nobody can dig. Absence of evidence there is weak evidence, and Cosquer shows that important human sites really did go under.</p></div><p class="face-cr"><b>Credit</b> Graham Hancock; Danny Hilman Natawidjaja; Stephen Oppenheimer</p></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,005 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Ice Age World"><button type="button" class="wtoc-i" data-go="age-03-s1">A world with the plug pulled</button><button type="button" class="wtoc-i" data-go="age-03-s2">What is solid</button><button type="button" class="wtoc-i" data-go="age-03-s3">Proof that sites went under</button><button type="button" class="wtoc-i" data-go="age-03-s4">Footprints that broke a rule</button><button type="button" class="wtoc-i" data-go="age-03-s5">Art in the deep cold</button><button type="button" class="wtoc-i" data-go="age-03-s6">A lost civilisation on the shelves?</button><button type="button" class="wtoc-i" data-go="age-03-s7">What would settle it</button></nav></div><section class="wsec" id="age-03-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A world with the plug pulled</h3><p>Twenty-one thousand years ago you could have walked from England to Denmark, from Siberia to Alaska and from Malaysia to Borneo without getting your feet wet. So much water was locked in ice sheets up to 3 km thick that the oceans stood about 130 m lower than today. The world&#x27;s coastlines lay far out on what is now seabed, and a strip of land larger than many countries edged every continent.</p><p>This is the age of the Last Glacial Maximum. Textbooks show it as a hard time of mammoth hunters in fur. That is true inland. But it was also a world of broad coastal plains, estuaries and lagoons, perhaps the richest real estate on Earth, and nearly all of it is now underwater.</p><blockquote class="wpull"><p>The best land of the Ice Age is exactly the land nobody can dig.</p></blockquote></section><section class="wsec" id="age-03-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What is solid</h3><p>The physical numbers are well constrained. Ice sheets reached their greatest extent c. 26,500–19,000 years ago. Coral reefs, drowned beaches and ice-volume models put global sea level about 134 m below today around 21,000 years ago. Then the melt began, first slowly and later in dramatic pulses, and the sea climbed back over the land, reaching roughly its modern level only some 7,000 years ago.</p><figure class="wx wx--steps" id="age-03-f1" data-n="6"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">How the sea swallowed the coast</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How the sea swallowed the coast"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 432" class="wx-svg" role="img" aria-labelledby="age-03-f1-t"><title id="age-03-f1-t">A continental shelf in cross-section as sea level rises from 134 metres below today, 21,000 years ago, to its present level, drowning former coastlines</title><path class="wx-water wx-st wx-hide" data-only="1" d="M620.9,348.7 L644,373.5 L668,385.9 L668,348.7 Z"/><g class="wx-st wx-hide" data-only="1"><path class="wx-flow wx-s2" d="M624.9,348.7 H668"/><path class="wx-line wx-s2" d="M620.9,348.7 H668"/><circle class="wx-num" cx="28" cy="34" r="9"/><text class="wx-numt" x="28" y="38" text-anchor="middle">1</text><text class="wx-t-b" x="44" y="38">21,000 years ago</text><text class="wx-t" x="44" y="56">−134 m: the shelf is dry land</text><path class="wx-hl" d="M620.9,344.7 V322.7"/><text class="wx-t-s wx-t-a wx-halo" x="620.9" y="316.7" text-anchor="middle">coast</text></g><path class="wx-water wx-st wx-hide" data-only="2" d="M526.7,296 L560,311.5 L600,336.3 L618,345.6 L644,373.5 L668,385.9 L668,296 Z"/><g class="wx-st wx-hide" data-only="2"><path class="wx-flow wx-s2" d="M530.7,296 H668"/><path class="wx-line wx-s2" d="M526.7,296 H668"/><circle class="wx-num" cx="28" cy="34" r="9"/><text class="wx-numt" x="28" y="38" text-anchor="middle">2</text><text class="wx-t-b" x="44" y="38">14,500 years ago</text><text class="wx-t" x="44" y="56">−100 m: the melt is under way</text><path class="wx-hl" d="M526.7,292 V270"/><text class="wx-t-s wx-t-a wx-halo" x="526.7" y="264" text-anchor="middle">coast</text></g><path class="wx-water wx-st wx-hide" data-only="3" d="M460,265 L500,283.6 L560,311.5 L600,336.3 L618,345.6 L644,373.5 L668,385.9 L668,265 Z"/><g class="wx-st wx-hide" data-only="3"><path class="wx-flow wx-s2" d="M464,265 H668"/><path class="wx-line wx-s2" d="M460,265 H668"/><circle class="wx-num" cx="28" cy="34" r="9"/><text class="wx-numt" x="28" y="38" text-anchor="middle">3</text><text class="wx-t-b" x="44" y="38">14,000 years ago</text><text class="wx-t" x="44" y="56">−80 m: Meltwater Pulse 1A, c. 20 m in c. 500 years</text><path class="wx-hl" d="M460,261 V239"/><text class="wx-t-s wx-t-a wx-halo" x="460" y="233" text-anchor="middle">coast</text></g><path class="wx-water wx-st wx-hide" data-only="4" d="M380,230.9 L440,255.7 L500,283.6 L560,311.5 L600,336.3 L618,345.6 L644,373.5 L668,385.9 L668,230.9 Z"/><g class="wx-st wx-hide" data-only="4"><path class="wx-flow wx-s2" d="M384,230.9 H668"/><path class="wx-line wx-s2" d="M380,230.9 H668"/><circle class="wx-num" cx="28" cy="34" r="9"/><text class="wx-numt" x="28" y="38" text-anchor="middle">4</text><text class="wx-t-b" x="44" y="38">11,700 years ago</text><text class="wx-t" x="44" y="56">−58 m: the Holocene begins</text><path class="wx-hl" d="M380,226.9 V204.9"/><text class="wx-t-s wx-t-a wx-halo" x="380" y="198.9" text-anchor="middle">coast</text></g><path class="wx-water wx-st wx-hide" data-only="5" d="M200,159.6 L260,181.3 L320,206.1 L380,230.9 L440,255.7 L500,283.6 L560,311.5 L600,336.3 L618,345.6 L644,373.5 L668,385.9 L668,159.6 Z"/><g class="wx-st wx-hide" data-only="5"><path class="wx-flow wx-s2" d="M204,159.6 H668"/><path class="wx-line wx-s2" d="M200,159.6 H668"/><circle class="wx-num" cx="28" cy="34" r="9"/><text class="wx-numt" x="28" y="38" text-anchor="middle">5</text><text class="wx-t-b" x="44" y="38">8,200 years ago</text><text class="wx-t" x="44" y="56">−12 m: Doggerland is almost gone</text><path class="wx-hl" d="M200,155.6 V133.6"/><text class="wx-t-s wx-t-a wx-halo" x="200" y="127.6" text-anchor="middle">coast</text></g><path class="wx-water wx-st wx-hide" data-only="6" d="M140,141 L200,159.6 L260,181.3 L320,206.1 L380,230.9 L440,255.7 L500,283.6 L560,311.5 L600,336.3 L618,345.6 L644,373.5 L668,385.9 L668,141 Z"/><g class="wx-st wx-hide" data-only="6"><path class="wx-flow wx-s2" d="M144,141 H668"/><path class="wx-line wx-s2" d="M140,141 H668"/><circle class="wx-num" cx="28" cy="34" r="9"/><text class="wx-numt" x="28" y="38" text-anchor="middle">6</text><text class="wx-t-b" x="44" y="38">Today</text><text class="wx-t" x="44" y="56">0 m: the coast most people think is permanent</text><path class="wx-hl" d="M140,137 V115"/><text class="wx-t-s wx-t-a wx-halo" x="140" y="109" text-anchor="middle">coast</text></g><path class="wx-soil wx-edge-soft" d="M16,106.9 L60,113.1 L100,127 L140,141 L200,159.6 L260,181.3 L320,206.1 L380,230.9 L440,255.7 L500,283.6 L560,311.5 L600,336.3 L618,345.6 L644,373.5 L668,385.9 L668,396.8 L16,396.8 Z"/><path class="wx-bold" d="M16,106.9 L60,113.1 L100,127 L140,141 L200,159.6 L260,181.3 L320,206.1 L380,230.9 L440,255.7 L500,283.6 L560,311.5 L600,336.3 L618,345.6 L644,373.5 L668,385.9"/><path class="wx-thin" d="M668,141h6"/><text class="wx-t-s" x="678" y="145">0 m</text><path class="wx-thin" d="M668,218.5h6"/><text class="wx-t-s" x="678" y="222.5">−50 m</text><path class="wx-thin" d="M668,296h6"/><text class="wx-t-s" x="678" y="300">−100 m</text><path class="wx-thin" d="M668,373.5h6"/><text class="wx-t-s" x="678" y="377.5">−150 m</text><g class="wx-pop" style="--d:2"><path class="wx-wood wx-edge-soft" d="M221,170.4 L230,155.4 L239,170.4 Z"/><circle class="wx-fire" cx="245" cy="167.4" r="3"/></g><g class="wx-pop" style="--d:3"><path class="wx-wood wx-edge-soft" d="M381,235 L390,220 L399,235 Z"/><circle class="wx-fire" cx="405" cy="232" r="3"/></g><g class="wx-pop" style="--d:4"><path class="wx-wood wx-edge-soft" d="M531,302.2 L540,287.2 L549,302.2 Z"/><circle class="wx-fire" cx="555" cy="299.2" r="3"/></g><text class="wx-t-m" x="300" y="358" text-anchor="middle">shore camps, rivers, lagoons: the best land then, the seabed now</text><text class="wx-t-cap" x="16" y="94.9">LAND</text><path class="wx-thin" d="M618,345.6 L590,373.5"/><text class="wx-t-s wx-halo" x="586" y="376.6" text-anchor="end">shelf edge</text><text class="wx-t-s" x="16" y="422">Heights to scale; distance offshore is schematic (a few km on steep coasts, hundreds on the Sunda Shelf)</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button><button type="button" class="wx-dot" data-k="6" aria-label="Step 6" aria-pressed="false">6</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 6.</b> 21,000 years ago: sea level about 134 m below today. The whole shelf is dry land with rivers, lagoons and camps.</p><ol class="wx-steplist"><li>21,000 years ago: sea level about 134 m below today. The whole shelf is dry land with rivers, lagoons and camps.</li><li>14,500 years ago: the melt is under way and the sea has climbed to about 100 m below today.</li><li>14,000 years ago: Meltwater Pulse 1A has added about 20 m in roughly 500 years. The outer camps are gone.</li><li>11,700 years ago, the start of the Holocene: the sea is near 58 m below today.</li><li>8,200 years ago: the sea is about 12 m below today. Doggerland is almost gone.</li><li>Today: the ice-age coast lies far offshore, and every camp is on the seabed.</li></ol><figcaption>One continental shelf in cross-section as the sea rises from 21,000 years ago to today. Heights to scale; distance offshore schematic. <span class="wx-src">Based on: Sea levels from Lambeck et al. 2014 (as compiled in this site&#x27;s sea-level series); shelf profile schematic.</span></figcaption><p class="vh">A cross-section of land sloping gently from a hill on the left down a wide continental shelf to a steep shelf edge at the right, with depth marks at 0, 50, 100 and 150 metres below today&#x27;s sea level. Three camps sit on the shelf. In step 1 the sea level is at minus 134 metres and the shelf is dry. In each later step the water rises: minus 100 metres, minus 80 after Meltwater Pulse 1A, minus 58 at the start of the Holocene, minus 12 at 8,200 years ago, and finally today&#x27;s level, when all three camps are under water.</p></figure><p>Some of the lost lands were enormous. Sundaland in Southeast Asia covered about 1.8 million km². Beringia, between Siberia and Alaska, was up to about 1,000 km wide, a region with its own plants and animals rather than a narrow bridge. Doggerland joined Britain to the continent and was drowned in stages until c. 8,000 years ago.</p></section><section class="wsec" id="age-03-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Proof that sites went under</h3><p>In 1985 the diver Henri Cosquer found a narrow tunnel in the sea cliffs near Marseille. Its entrance is now 37 m underwater. It leads up into chambers above the waterline, painted and engraved during the Ice Age with horses, bison, seals, penguin-like great auks and hand stencils. When the art was made, the entrance opened onto dry land several kilometres from the shore.</p><p>Cosquer is the rule made visible. Wherever people lived close to the Ice Age sea, their traces are now either underwater or scoured away. A few projects map drowned landscapes, notably in the North Sea, where trawlers have brought up bone tools and animal remains for a century. But for most of the world&#x27;s lost coast, no one has looked at all.</p></section><section class="wsec" id="age-03-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Footprints that broke a rule</h3><p>For much of the 20th century, American textbooks taught &#x27;Clovis first&#x27;: people arrived c. 13,000 years ago, walked down an ice-free corridor and spread with their distinctive spear points. Sites that seemed older were dismissed. Monte Verde in Chile, c. 14,500 years old, won acceptance only in 1997 after a long fight.</p><p>White Sands pushed the date far back. In the gypsum basin of New Mexico, footprints of adults, teenagers and children cross ancient lake-shore mud, alongside tracks of mammoth and giant ground sloth. In 2021 seeds of a water plant in the layers gave ages of c. 23,000–21,000 years. Critics argued the seeds could hold &#x27;old&#x27; carbon from the lake water. So teams dated conifer pollen and quartz grains, and later the lake&#x27;s own sediments. The answers agreed.</p><figure class="wx wx--static" id="age-03-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">White Sands: four ways to date one muddy shore</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="White Sands: four ways to date one muddy shore"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 425" class="wx-svg" role="img" aria-labelledby="age-03-f2-t"><title id="age-03-f2-t">Cross-section of the layered lake sediments at White Sands with footprint surfaces between them and the four kinds of material used to date them: seeds, pollen, quartz grains and lake beds</title><defs><marker id="age-03-f2-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth=
