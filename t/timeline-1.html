<script type="text/x-tpl" id="age-01-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Reconstruction of Neanderthal at the SUMPHG.jpg" data-cap="A Neanderthal reconstruction" data-big><figcaption></figcaption></figure><div class="sh-k">300,000–70,000 years ago</div><h2 class="sh-t" id="age-01-st" tabindex="-1">Many Kinds of Human</h2><p class="sh-s">For most of our species&#x27; history we shared the Earth with other humans, and some of them built, decorated and may have crossed the sea.</p><div class="sh-v"><span class="vstamp vstamp--phase" style="--vc:var(--bronze)"><span aria-hidden="true">↕</span>Rise and fall</span></div></div><p class="v4-q">How capable were the other humans, and how much of their world has vanished?</p><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="315000" >315,000</b><span class="ctr-u"> years</span></div><div class="ctr-l">age of the Jebel Irhoud fossils, the oldest known Homo sapiens</div><div class="ctr-c">Richter et al. 2017</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="176500" >176,500</b><span class="ctr-u"> years</span></div><div class="ctr-l">age of the Neanderthal rings in Bruniquel Cave</div><div class="ctr-c">Jaubert et al. 2016</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="2.2" data-dec="1">2.2</b><span class="ctr-u"> tonnes</span></div><div class="ctr-l">of broken stalagmites moved to build them</div><div class="ctr-c">Jaubert et al. 2016</div></div><div class="ctr"><div class="ctr-v">at least <b class="ctr-n" data-v="4" >4</b><span class="ctr-u"> kinds of human</span></div><div class="ctr-l">alive 100,000 years ago, probably more</div><div class="ctr-c">Sutikna et al. 2016; Slon et al. 2018; Détroit et al. 2019</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="74000" >74,000</b><span class="ctr-u"> years ago</span></div><div class="ctr-l">the Toba super-eruption in Sumatra</div><div class="ctr-c">Storey et al. 2012</div></div></div><div class="rf"><div class="rf-c rf-up"><h3 class="rf-h"><span aria-hidden="true">▲</span> What rose</h3><ul><li>Homo sapiens, with a modern-looking face, in North Africa by c. 315,000 years ago</li><li>Neanderthal engineering: rings of broken stalagmites built 336 m inside Bruniquel Cave, 176,500 years ago</li><li>Shell beads, ochre and engraved patterns in Africa, from c. 150,000 years ago onward</li><li>Humans living on islands such as Flores and Luzon, which could only be reached across open water</li></ul></div><div class="rf-c rf-down"><h3 class="rf-h"><span aria-hidden="true">▼</span> What fell or was lost</h3><ul><li>Homo naledi vanishes from the record after c. 236,000 years ago</li><li>The last known Homo erectus, at Ngandong in Java, c. 117,000–108,000 years ago</li><li>Early sapiens groups that reached the Levant c. 120,000–90,000 years ago leave no descendants we can detect today</li><li>Coastal camps of the cold phases, now under the sea</li></ul></div></div><h3 class="sub-h wsub">What drove it</h3><div class="trigs"><div class="trig"><b>Swings between ice ages and warm interglacials</b><span>Ocean-sediment and ice records show a warm interglacial c. 130,000–115,000 years ago between long cold phases, shifting deserts, coasts and corridors for people.</span></div><div class="trig"><b>Small, isolated populations</b><span>Neanderthal and Denisovan genomes show low diversity and, in one Altai Neanderthal, parents as closely related as half-siblings (Prüfer et al. 2014).</span></div><div class="trig"><b>The Toba super-eruption, c. 74,000 years ago</b><span>Argon dates of c. 73,900 years; its effect on people is disputed (Ambrose 1998 versus Smith et al. 2018 and Kappelman et al. 2024).</span></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Humans other than Homo sapiens were capable of planned construction and symbolic behaviour long before 70,000 years ago.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The Bruniquel structures are securely dated by uranium-series methods and were clearly built, not natural. Neanderthal use of pigments, shells and bird feathers is documented at several sites by different teams. What remains open is the edge of the claim: whether Neanderthals made cave paintings, whether naledi buried its dead, and whether anyone crossed to Crete. The core claim of capable cousins is strong; the most dramatic individual cases are still contested.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Older textbooks were overconfident: they presented Neanderthals as dim evolutionary dead ends and symbolic behaviour as a sapiens monopoly, on thin evidence from a few excavated caves. Newer museum labels have largely caught up. Where they now risk overreaching is the other way, presenting contested cases such as naledi burials as fact.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Fossils with modern-looking faces from Jebel Irhoud, Morocco, date to c. 315,000 years ago and are counted as early Homo sapiens.<small>Richter et al. 2017; Hublin et al. 2017</small></li><li>Around 100,000 years ago at least four kinds of human were alive: our species, Neanderthals, Denisovans and Homo floresiensis, and probably Homo luzonensis too.<small>Sutikna et al. 2016; Slon et al. 2018; Détroit et al. 2019</small></li><li>Neanderthals broke off about 400 stalagmite pieces (c. 2.2 t) and built two rings and four stacks deep in Bruniquel Cave, dated to 176,500 ± 2,100 years ago.<small>Jaubert et al. 2016</small></li><li>The different kinds of human met and had children together: a girl from Denisova Cave, c. 90,000 years ago, had a Neanderthal mother and a Denisovan father.<small>Slon et al. 2018</small></li><li>People made a cross-hatched drawing in ochre on a stone flake at Blombos Cave, South Africa, c. 73,000 years ago.<small>Henshilwood et al. 2018</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether small-brained Homo naledi buried its dead and engraved cave walls in the Rising Star system (Berger et al. 2025 versus Martinón-Torres et al. 2024).</li><li>Whether stone tools near Plakias on Crete, argued to be at least 130,000 years old from their geological setting, show that pre-sapiens humans crossed open sea to the island.</li><li>Whether the Toba eruption caused a volcanic winter and a human population crash, or had little lasting effect on people.</li><li>Whether a hand stencil in Maltravieso Cave, Spain, dated to at least 66,700 years ago, is Neanderthal art; the dating method has been challenged.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Shorelines of the long cold phases lie tens of metres under today&#x27;s sea. If people camped, fished or launched boats on them, that evidence is offshore and almost unexplored.</li><li>Wood, fibre, hide and feathers rarely survive; rare finds such as the wooden spears of Schöningen, Germany, hint at how much ordinary technology is lost.</li><li>Denisovans are known from a few bones, teeth and genomes: we can read their DNA but know almost nothing of their daily lives or tools.</li><li>Large parts of Africa, Arabia and Southeast Asia have barely been surveyed for sites of this age.</li></ul></div></div><h3 class="sub-h wsub">The bold reading</h3><div class="face"><div class="face-c face-x" style="grid-column:1/-1"><p>For a century the story ran as a ladder: brutish cousins below, clever sapiens on top. These researchers argue that picture was built on missing evidence, not on evidence of absence. Neanderthals used pigments, feathers and shells, built structures and may have painted; Homo naledi may have handled its dead with care; and someone may have crossed the sea to Crete long before our species left Africa. The capacity for complex behaviour, on this reading, is old and shared.</p><div class="face-s"><b>Its strongest point</b><p>Bruniquel. A ring of 400 carefully arranged stalagmite pieces, lit by fire 336 m inside a cave 176,500 years ago, is a planned construction project by people who were not Homo sapiens.</p></div><p class="face-cr"><b>Credit</b> João Zilhão; Francesco d&#x27;Errico; Lee Berger; Thomas Strasser and the Plakias survey team</p></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,092 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Many Kinds of Human"><button type="button" class="wtoc-i" data-go="age-01-s1">A crowded planet</button><button type="button" class="wtoc-i" data-go="age-01-s2">What is solid</button><button type="button" class="wtoc-i" data-go="age-01-s3">Builders in the dark</button><button type="button" class="wtoc-i" data-go="age-01-s4">Beads, pigment and a drawing</button><button type="button" class="wtoc-i" data-go="age-01-s5">Sailors before us?</button><button type="button" class="wtoc-i" data-go="age-01-s6">The Toba question</button><button type="button" class="wtoc-i" data-go="age-01-s7">What time has taken</button></nav></div><section class="wsec" id="age-01-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A crowded planet</h3><p>Picture the world 100,000 years ago and count the humans. In North and East Africa, people with faces much like ours. In Europe and western Asia, stocky Neanderthals. Across Asia, the Denisovans, a population we know mostly from DNA. On the island of Flores, people about 1.1 m tall. On Luzon, another small island people. For almost all of our species&#x27; existence, being human did not mean being the only kind.</p><p>The textbook picture many of us grew up with was a ladder: primitive cousins on the lower rungs, then us, clever and alone. This age is where that ladder breaks. The evidence now points to a crowded, overlapping world in which several kinds of human made tools, used fire, mixed with one another and, in at least one case, built something strange in the dark.</p><blockquote class="wpull"><p>For almost all of our species&#x27; existence, being human did not mean being the only kind.</p></blockquote></section><section class="wsec" id="age-01-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What is solid</h3><p>Some things here rest on several independent lines of evidence. The Jebel Irhoud fossils from Morocco, dated by luminescence to c. 315,000 years ago, have a modern face on a longer, lower braincase. Our species seems to have assembled itself across Africa over a long time rather than in one cradle. Genomes read from bones show that Neanderthals and Denisovans split from our lineage more than half a million years ago and from each other a little later, and that the groups met and had children together.</p><figure class="wx wx--steps" id="age-01-f1" data-n="4"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">The human family, 800,000 years ago to today</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The human family, 800,000 years ago to today"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" class="wx-svg" role="img" aria-labelledby="age-01-f1-t"><title id="age-01-f1-t">The human family between 800,000 years ago and today: seven lineages, at least four of them alive 100,000 years ago, mixing with one another, and all but one gone by about 40,000 years ago</title><defs><marker id="age-01-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker><marker id="age-01-f1-ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><path class="wx-line" d="M150,412H690"/><path class="wx-thin" d="M150,412v6"/><text class="wx-t-s" x="150" y="432" text-anchor="middle">800k</text><path class="wx-thin" d="M223.3,412v6"/><text class="wx-t-s" x="223.3" y="432" text-anchor="middle">600k</text><path class="wx-thin" d="M296.7,412v6"/><text class="wx-t-s" x="296.7" y="432" text-anchor="middle">400k</text><path class="wx-thin" d="M370,412v6"/><text class="wx-t-s" x="370" y="432" text-anchor="middle">200k</text><path class="wx-thin" d="M450,412v6"/><text class="wx-t-s" x="450" y="432" text-anchor="middle">150k</text><path class="wx-thin" d="M530,412v6"/><text class="wx-t-s" x="530" y="432" text-anchor="middle">100k</text><path class="wx-thin" d="M610,412v6"/><text class="wx-t-s" x="610" y="432" text-anchor="middle">50k</text><path class="wx-thin" d="M690,412v6"/><text class="wx-t-s" x="690" y="432" text-anchor="middle">today</text><path class="wx-thin" d="M366,406l4,12 M372,406l4,12"/><text class="wx-t-s" x="690" y="450" text-anchor="end">thousands of years ago (scale stretches after 200k)</text><text class="wx-t-cap" x="16" y="30">WHO WAS WHERE, AND WHEN</text><text class="wx-t-m" x="16" y="48">Solid: fossils or DNA. Dashed: inferred lineage</text><text class="wx-t-b" x="16" y="94">Homo sapiens</text><text class="wx-t-s" x="16" y="108">Africa, then everywhere</text><path class="wx-guide" d="M150,96H690"/><text class="wx-t-b" x="16" y="142">Neanderthals</text><text class="wx-t-s" x="16" y="156">Europe, W and C Asia</text><path class="wx-guide" d="M150,144H690"/><text class="wx-t-b" x="16" y="190">Denisovans</text><text class="wx-t-s" x="16" y="204">Siberia to Taiwan, Tibet</text><path class="wx-guide" d="M150,192H690"/><text class="wx-t-b" x="16" y="238">Homo erectus</text><text class="wx-t-s" x="16" y="252">Java (last population)</text><path class="wx-guide" d="M150,240H690"/><text class="wx-t-b" x="16" y="286">H. floresiensis</text><text class="wx-t-s" x="16" y="300">Flores, Indonesia</text><path class="wx-guide" d="M150,288H690"/><text class="wx-t-b" x="16" y="334">H. luzonensis</text><text class="wx-t-s" x="16" y="348">Luzon, Philippines</text><path class="wx-guide" d="M150,336H690"/><text class="wx-t-b" x="16" y="382">Homo naledi</text><text class="wx-t-s" x="16" y="396">South Africa</text><path class="wx-guide" d="M150,384H690"/><path class="wx-dash wx-st" data-s="1" d="M205,96 V144 M205,96H327.8 M205,144H285.7 M271,144V192H333.3"/><path class="wx-bold wx-s4 wx-st" data-s="1" d="M327.8,96H690"/><path class="wx-bold wx-s2 wx-st" data-s="1" d="M285.7,144H626"/><path class="wx-dash wx-st" data-s="1" d="M333.3,192H434"/><path class="wx-bold wx-s2 wx-st" data-s="1" d="M434,192H618"/><path class="wx-dash wx-st" data-s="1" d="M618,192H642"/><path class="wx-bold wx-s2 wx-st" data-s="1" d="M150,240H517.2"/><path class="wx-dash wx-st" data-s="1" d="M150,288H186.7"/><path class="wx-bold wx-s2 wx-st" data-s="1" d="M186.7,288H610"/><path class="wx-dash wx-st" data-s="1" d="M183.4,336H582.8"/><path class="wx-bold wx-s2 wx-st" data-s="1" d="M582.8,336H610"/><path class="wx-dash wx-st" data-s="1" d="M260,384H320.5"/><path class="wx-bold wx-s2 wx-st" data-s="1" d="M320.5,384H356.8"/><text class="wx-t-s wx-halo wx-st" x="327.8" y="88" text-anchor="middle" data-s="1">Jebel Irhoud 315k</text><text class="wx-t-s wx-halo wx-st" x="285.7" y="136" text-anchor="middle" data-s="1">Sima de los Huesos 430k</text><text class="wx-t-s wx-halo wx-st" x="456.4" y="208" text-anchor="middle" data-s="1">Harbin ≥146k</text><text class="wx-t-s wx-halo wx-st" x="517.2" y="232" text-anchor="middle" data-s="1">Ngandong 117–108k</text><text class="wx-t-s wx-halo wx-st" x="186.7" y="280" text-anchor="middle" data-s="1">Mata Menge c. 700k</text><text class="wx-t-s wx-halo wx-st" x="183.4" y="328" text-anchor="start" data-s="1">tools, maker unknown, 709k</text><text class="wx-t-s wx-halo wx-st" x="597.2" y="328" text-anchor="middle" data-s="1">≥50–67k</text><text class="wx-t-s wx-halo wx-st" x="338.5" y="376" text-anchor="middle" data-s="1">Rising Star 335–236k</text><rect class="wx-accfill wx-o20 wx-st wx-hide" data-s="2" x="525" y="66" width="10" height="346"/><text class="wx-t-b wx-t-a wx-st wx-hide" x="530" y="62" text-anchor="middle" data-s="2">100,000 years ago</text><circle class="wx-accfill wx-edge wx-st wx-hide" data-s="2" cx="530" cy="96" r="6"/><circle class="wx-accfill wx-edge wx-st wx-hide" data-s="2" cx="530" cy="144" r="6"/><circle class="wx-accfill wx-edge wx-st wx-hide" data-s="2" cx="530" cy="192" r="6"/><circle class="wx-accfill wx-edge wx-st wx-hide" data-s="2" cx="530" cy="288" r="6"/><circle class="wx-paper wx-hl wx-st wx-hide" data-s="2" cx="530" cy="336" r="5.5"/><circle class="wx-paper wx-hl wx-st wx-hide" data-s="2" cx="530" cy="240" r="5.5"/><text class="wx-t-s wx-halo wx-st wx-hide" x="520" y="388" text-anchor="end" data-s="2">open ring = maybe</text><path class="wx-hl wx-st wx-hide" data-s="3" marker-end="url(#age-01-f1-ah)" marker-start="url(#age-01-f1-ah)" d="M614.8,101 C636.8,116 636.8,124 614.8,139"/><path class="wx-hl wx-st wx-hide" data-s="3" marker-end="url(#age-01-f1-ah)" marker-start="url(#age-01-f1-ah)" d="M606,101 C566,136 566,162 606,187"/><path class="wx-hl wx-st wx-hide" data-s="3" marker-end="url(#age-01-f1-ah)" marker-start="url(#age-01-f1-ah)" d="M546,149 C528,162 528,174 546,187"/><text class="wx-t-s wx-halo wx-st wx-hide" x="524" y="172" text-anchor="end" data-s="3">Denny, c. 90k</text><text class="wx-t-s wx-t-a wx-halo wx-st wx-hide" x="648" y="172" text-anchor="start" data-s="3">mixing</text><text class="wx-t-s wx-t-a wx-halo wx-st wx-hide" x="648" y="185" text-anchor="start" data-s="3">c. 50–44k</text><path class="wx-bold wx-st wx-hide" data-s="4" d="M621,139 L631,149 M631,139 L621,149"/><path class="wx-bold wx-st wx-hide" data-s="4" d="M605,283 L615,293 M615,283 L605,293"/><path class="wx-bold wx-st wx-hide" data-s="4" d="M605,331 L615,341 M615,331 L605,341"/><path class="wx-bold wx-st wx-hide" data-s="4" d="M512.2,235 L522.2,245 M522.2,235 L512.2,245"/><text class="wx-t-s wx-halo wx-st wx-hide" x="645.2" y="210" text-anchor="middle" data-s="4">fate unknown</text><g class="wx-st wx-hide" data-s="4"><circle class="wx-num" cx="588" cy="78" r="9"/><text class="wx-numt" x="588" y="82" text-anchor="middle">4</text><text class="wx-t-b wx-halo" x="690" y="82" text-anchor="end">one kind left</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 4.</b> The lineages. Solid bars show where fossils or DNA exist; dashed lines are inferred ancestry and gaps.</p><ol class="wx-steplist"><li>The lineages. Solid bars show where fossils or DNA exist; dashed lines are inferred ancestry and gaps.</li><li>Slice the tree at 100,000 years ago: at least four kinds of human are alive at once, probably five or six.</li><li>They meet and mix: Denny around 90,000 years ago, and Homo sapiens with Neanderthals and Denisovans around 50,000–44,000 years ago.</li><li>By about 40,000 years ago only one kind is left in the fossil record. The Denisovans&#x27; end is unknown.</li></ol><figcaption>Tap through: the lineages, who was alive 100,000 years ago, how they mixed, and who was left. Dashed lines are inferred, solid lines have fossils or DNA. <span class="wx-src">Based on: Dates from Richter et al. 2017; Meyer et al. 2016; Fu et al. 2025; Rizal et al. 2020; Sutikna et al. 2016; van den Bergh et al. 2016; Ingicco et al. 2018; Détroit et al. 2019; Dirks et al. 2017; Slon et al. 2018; Iasi et al. 2024; Higham et al. 2014. Branch points simplified.</span></figcaption><p class="vh">A timeline chart with seven horizontal rows for Homo sapiens, Neanderthals, Denisovans, Homo erectus, Homo floresiensis, Homo luzonensis and Homo naledi, running from 800,000 years ago to today with the scale stretched after 200,000. Solid bars show fossil or DNA evidence and dashed lines show inferred lineages joining sapiens to the Neanderthal and Denisovan branch. Step 2 adds a vertical band at 100,000 years ago with dots on the sapiens, Neanderthal, Denisovan and floresiensis rows and open rings for erectus and luzonensis. Step 3 adds curved arrows for interbreeding. Step 4 adds crosses where lineages end, leaving only Homo sapiens.</p></figure><p>The clearest single case is Denisova 11, nicknamed Denny, a girl who lived in a Siberian cave c. 90,000 years ago. Her mother was a Neanderthal and her father a Denisovan. She is not a statistical inference: she is a person whose genome records that two kinds of human met, lived together and raised a child.</p></section><section class="wsec" id="age-01-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Builders in the dark</h3><p>In 1990 cavers broke into a sealed passage of Bruniquel Cave in southern France. About 336 m from the entrance they found rings of broken stalagmites on the floor. When a team led by Jacques Jaubert dated the calcite that had regrown over the pieces, the answer was 176,500 ± 2,100 years. No Homo sapiens is known in Europe anywhere near that early. The builders were almost certainly early Neanderthals.</p><figure class="wx wx--static" id="age-01-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">Bruniquel: a Neanderthal construction, to scale</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Bruniquel: a Neanderthal construction, to scale"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" class="wx-svg" role="img" aria-labelledby="age-01-f2-t"><title id="age-01-f2-t">Plan of the Neanderthal stalagmite structures in Bruniquel Cave, France, drawn to scale: a large ring 6.7 by 4.5 metres, a small ring 2.2 by 2.1 metres and stacks up to 2.6 metres across, 336 metres from the entrance</title><text class="wx-t-cap" x="16" y="26">336 M INTO THE HILL, IN TOTAL DARKNESS</text><path class="wx-rock" d="M16,40 H704 V70 H16 Z"/><path class="wx-paper" d="M16,50 C120,46 200,60 300,54 S520,48 600,56 S680,54 704,52 V60 C680,62 640,66 600,64 S420,58 300,64 S100,56 16,60 Z"/><path class="wx-flow wx-s1" d="M24,55 C140,52 220,60 300,59 S520,52 600,60 S680,58 690,57" pop" style="--d:9" x="-7.7" y="-3.5" width="15.4" height="7" rx="2"/></g><g transform="translate(541.9,139.6) rotate(21.6)"><rect class="wx-stone2 wx-edge-soft wx-pop" style="--d:9" x="-7.7" y="-3.5" width="15.4" height="7" rx="2"/></g><g transform="translate(560.4,151.4) rotate(43.7)"><rect class="wx-stone2 wx-edge-soft wx-pop" style="--d:9" x="-7.7" y="-3.5" width="15.4" height="7" rx="2"/></g><g transform="translate(572.8,169.1) rotate(66.5)"><rect class="wx-stone2 wx-edge-soft wx-pop" style="--d:9" x="-7.7" y="-3.5" width="15.4" height="7" rx="2"/></g><text class="wx-t-b" x="591.2" y="186">Small ring</text><text class="wx-t-n" x="591.2" y="202">2.2 × 2.1 m</text><circle class="wx-stone3 wx-o60 wx-edge-soft wx-pop" style="--d:9" cx="455" cy="330" r="14.3"/><circle class="wx-stone3 wx-o60 wx-edge-soft wx-pop" style="--d:10" cx="590" cy="330" r="67.6"/><g transform="translate(626,330) rotate(0)"><rect class="wx-stone2 wx-edge-soft wx-pop" style="--d:11" x="-9" y="-3" width="18" height="6" rx="2"/></g><g transform="translate(612.4,358.1) rotate(87.4)"><rect class="wx-stone2 wx-edge-soft wx-pop" style="--d:11" x="-9" y="-3" width="18" height="6" rx="2"/></g><g transform="translate(582,365.1) rotate(174.9)"><rect class="wx-stone2 wx-edge-soft wx-pop" style="--d:11" x="-9" y="-3" width="18" height="6" rx="2"/></g><g transform="translate(557.6,345.6) rotate(262.3)"><rect class="wx-stone2 wx-edge-soft wx-pop" style="--d:11" x="-9" y="-3" width="18" height="6" rx="2"/></g><g transform="translate(557.6,314.4) rotate(349.7)"><rect class="wx-stone2 wx-edge-soft wx-pop" style="--d:11" x="-9" y="-3" width="18" height="6" rx="2"/></g><g transform="translate(582,294.9) rotate(437.1)"><rect class="wx-stone2 wx-edge-soft wx-pop" style="--d:11" x="-9" y="-3" width="18" height="6" rx="2"/></g><g transform="translate(612.4,301.9) rotate(524.6)"><rect class="wx-stone2 wx-edge-soft wx-pop" style="--d:11" x="-9" y="-3" width="18" height="6" rx="2"/></g><text class="wx-t-n" x="455" y="362.3" text-anchor="middle">0.55 m</text><text class="wx-t-n wx-halo" x="590" y="334" text-anchor="middle">2.6 m</text><text class="wx-t-b" x="520" y="413" text-anchor="middle">Four stacks, 0.55–2.6 m across</text><circle class="wx-fire wx-pulse" cx="69.8" cy="232" r="6"/><circle class="wx-fire wx-pulse" cx="274" cy="375" r="6"/><circle class="wx-fire wx-pulse" cx="510" cy="242.6" r="6"/><path class="wx-thin" d="M280,381 L334,429"/><text class="wx-t-s" x="338" y="433">heated, blackened pieces:</text><text class="wx-t-s" x="338" y="446">traces of fire</text><path class="wx-bold" d="M40,135H144 M40,129v12 M92,131v8 M144,129v12"/><text class="wx-t-s" x="40" y="122" text-anchor="middle">0</text><text class="wx-t-s" x="144" y="122" text-anchor="middle">2 m</text><text class="wx-t-s" x="704" y="110" text-anchor="end">True sizes; positions simplified</text><text class="wx-t-s wx-t-a" x="704" y="124" text-anchor="end">Dated to 176,500 ± 2,100 years ago</text></svg></div></div><figcaption>The broken-stalagmite structures in Bruniquel Cave drawn at true size, 336 m from the entrance. Their exact layout is simplified. <span class="wx-src">Based on: Jaubert et al. 2016 (dimensions, number and length of pieces, date, distance from entrance); relative positions of structures simplified.</span></figcaption><p class="vh">A strip at the top shows a long cave passage 336 metres from entrance to structures. Below, a plan drawn to scale shows a large oval ring 6.7 by 4.5 metres made of two rows of short stalagmite pieces, a small ring 2.2 by 2.1 metres, and two circular stacks 0.55 and 2.6 metres across, with a 2 metre scale bar. Orange dots mark pieces with traces of fire. A note gives the date 176,500 plus or minus 2,100 years ago.</p></figure><p>The numbers are not casual. About 400 pieces with a total length of 112 m, of fairly even length, laid in rings up to 6.7 m across, in places stacked several layers high and wedged with small props. Many carry traces of fire: reddened, blackened and cracked calcite, and at least one burnt bone. Nobody knows what the rings were for. Shelter, ritual, storage, something we have no word for. But someone planned it, carried light deep underground and worked as a group.</p><aside class="wcall"><b>How do we know?</b><p>Stalagmites grow by adding calcite. When a piece is broken off and laid down, new calcite starts to grow on it. Uranium-series dating measures how long that new growth has been accumulating, so the regrowth on the cut pieces gives the time since they were moved. The team dated both the stumps left in the floor and the regrowth on the placed pieces, and the two agree.</p></aside></section><section class="wsec" id="age-01-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Beads, pigment and a drawing</h3><p>In Africa the symbolic record thickens through this age. At Bizmoune Cave in Morocco, perforated sea snail shells, apparently worn as beads, date to c. 142,000–150,000 years ago. At Blombos Cave in South Africa, people mixed ochre in abalone shells c. 100,000 years ago and, c. 73,000 years ago, drew a red cross-hatched pattern on a stone flake. Beads say something about identity: who you are, whose group you belong to.</p><p>The most contested case is Homo naledi, a small-brained species that lived in South Africa c. 335,000–236,000 years ago. Its discoverers argue that bodies were deliberately buried deep in the Rising Star cave system and that nearby wall marks are engravings. Critics reply that the burial pits are not demonstrated and the marks are undated. Both sides agree something unusual happened there; the verdict on what remains open.</p><blockquote class="wpull"><p>Absence of beads in a cave nobody has dug is not evidence that nobody wore them.</p></blockquote></section><section class="wsec" id="age-01-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Sailors before us?</h3><p>Flores has been an island throughout human history, and hominins were there by c. 700,000 years ago. On Luzon, butchered rhinoceros bones date to c. 709,000 years ago, long before Homo sapiens existed. However they arrived, on rafts, drifting on storm debris or on purpose, water was crossed by people who were not us.</p><p>Crete is the boldest claim. In 2008 and 2009 a survey led by Thomas Strasser found quartz handaxes in terraces near Plakias and argued, from the geology, that they are at least 130,000 years old. Crete has been separated from the mainland for millions of years, so the claim implies deliberate seafaring in the Mediterranean. Sceptics point out that the age comes from the geological setting of the finds rather than from direct dating. It remains open, and it is exactly the kind of result that a few well-dated excavations could settle.</p></section><section class="wsec" id="age-01-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>The Toba question</h3><p>About 74,000 years ago Toba in Sumatra erupted, the largest eruption of the last few hundred thousand years, spreading ash from the South China Sea to Lake Malawi. In 1998 anthropologist Stanley Ambrose proposed that its volcanic winter crashed human numbers to a few thousand. It is a great story, and it seemed to fit genetic hints of an old bottleneck.</p><p>The field tested it, which is to the credit of everyone involved. In India, stone tools at Jwalapuram continue above and below the ash. At Pinnacle Point in South Africa, where tiny glass shards from Toba were found in the layers, people carried on through the eruption. At Shinfa-Metema in Ethiopia, a 2024 study found people adapting to drought and following seasonal rivers across the Toba horizon. The catastrophe version now looks unlikely for people in Africa; regional effects in South and Southeast Asia are less studied.</p></section><section class="wsec" id="age-01-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What time has taken</h3><p>This age is our deepest look at a real pattern: many experiments in being human, most of which ended. Several of those endings are genuine mysteries. Why did naledi, erectus, the Flores and Luzon people and eventually the Neanderthals disappear, while one lineage spread everywhere? Small populations and climate swings are strong candidates, but for most of these groups we have a handful of sites.</p><p>And the most human-friendly land of the cold phases, the lowland coasts, is now seabed. What would change the picture: dated underwater surveys of Pleistocene shorelines, direct dates on the Plakias tools, more Denisovan skeletons and securely dated naledi remains. Until then the honest summary is that the cousins were cleverer than we were taught, and much of their story is still buried.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">333,000 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Homo naledi in the Rising Star cave system (until c. 236,000 years ago)</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">313,000 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Early Homo sapiens at Jebel Irhoud, Morocco</span></li><li class="wtl-build" style="--i:2"><span class="wtl-y">174,500 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Neanderthals build the Bruniquel rings</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">144,000 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">The Harbin skull, later linked to Denisovans</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">128,000 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Warm interglacial begins</span></li><li class="wtl-loss" style="--i:5"><span class="wtl-y">110,000 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Last known Homo erectus, Ngandong, Java</span></li><li class="wtl-event" style="--i:6"><span class="wtl-y">88,000 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Denny, child of two kinds of human</span></li><li class="wtl-event" style="--i:7"><span class="wtl-y">72,000 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Toba erupts</span></li><li class="wtl-build" style="--i:8"><span class="wtl-y">71,000 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Cross-hatched drawing at Blombos Cave</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">2016 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Bruniquel structures dated and published</span></li></ol><h3 class="sub-h wsub">Go deeper</h3><div class="links-row"><button type="button" onclick="openItem('articles','case-lost-civilization')">Was There a Lost Ice Age Civilisation? <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-drowned-coasts')">The Drowned Coasts <span aria-hidden="true">→</span></button></div><details class="srcs"><summary>Sources for this age (24)</summary><ol><li>Richter D. et al. (2017). The age of the hominin fossils from Jebel Irhoud, Morocco, and the origins of the Middle Stone Age. Nature 546: 293–296. <a href="https://doi.org/10.1038/nature22335" target="_blank" rel="noopener">doi:10.1038/nature22335</a></li><li>Hublin J.-J. et al. (2017). New fossils from Jebel Irhoud, Morocco and the pan-African origin of Homo sapiens. Nature 546: 289–292. <a href="https://doi.org/10.1038/nature22336" target="_blank" rel="noopener">doi:10.1038/nature22336</a></li><li>Jaubert J. et al. (2016). Early Neanderthal constructions deep in Bruniquel Cave in southwestern France. Nature 534: 111–114. <a href="https://doi.org/10.1038/nature18291" target="_blank" rel="noopener">doi:10.1038/nature18291</a></li><li>Slon V. et al. (2018). The genome of the offspring of a Neanderthal mother and a Denisovan father. Nature 561: 113–116. <a href="https://doi.org/10.1038/s41586-018-0455-x" target="_blank" rel="noopener">doi:10.1038/s41586-018-0455-x</a></li><li>Meyer M. et al. (2016). Nuclear DNA sequences fro
