="281.3" text-anchor="end">Cyprus</text><circle class="wx-bronze wx-edge" cx="331.6" cy="390.1" r="6.5"/><text class="wx-t-b wx-halo" x="343.6" y="410.1" text-anchor="start">Egypt</text><circle class="wx-bronze wx-edge" cx="637.3" cy="338" r="6.5"/><text class="wx-t-b wx-halo" x="637.3" y="360" text-anchor="middle">Babylon</text><circle class="wx-bronze wx-edge" cx="609.2" cy="250.7" r="6.5"/><text class="wx-t-b wx-halo" x="609.2" y="237.7" text-anchor="middle">Assur</text><circle class="wx-bronze wx-edge" cx="422.4" cy="323.7" r="6.5"/><text class="wx-t-b wx-halo" x="434.4" y="327.7" text-anchor="start">Canaan</text><text class="wx-t-cap" x="20" y="26">EASTERN MEDITERRANEAN, c. 1300–1150 BCE</text><text class="wx-st wx-hide wx-t-cap wx-t-a" data-only="1" x="700" y="26" text-anchor="end">c. 1300 BCE: THE NETWORK</text><text class="wx-st wx-hide wx-t-cap wx-t-a" data-only="2" x="700" y="26" text-anchor="end">c. 1200 BCE: STRESSES</text><text class="wx-st wx-hide wx-t-cap wx-t-a" data-only="3" x="700" y="26" text-anchor="end">c. 1200–1180 BCE: FIRES</text><text class="wx-st wx-hide wx-t-cap wx-t-a" data-only="4" x="700" y="26" text-anchor="end">c. 1177 BCE: EGYPT HOLDS</text><text class="wx-st wx-hide wx-t-cap wx-t-a" data-only="5" x="700" y="26" text-anchor="end">AFTER c. 1150 BCE: SURVIVORS</text><rect class="wx-inkfill" x="24" y="458" width="53.9" height="5"/><text class="wx-t-s" x="24" y="476" text-anchor="middle">0</text><text class="wx-t-s" x="77.9" y="476" text-anchor="middle">200 km</text><line class="wx-line wx-s6" x1="130" y1="460" x2="150" y2="460"/><text class="wx-t-s" x="156" y="464">trade or diplomatic link (schematic)</text><path class="wx-dash wx-s2" d="M390,460.0 L410,460.0"/><text class="wx-t-s" x="416" y="464">letters between Egypt and Babylon</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> c. 1300 BCE: a network of palaces and great kings; the Uluburun ship carries copper and tin.</p><ol class="wx-steplist"><li>c. 1300 BCE: a network of palaces and great kings; the Uluburun ship carries copper and tin.</li><li>c. 1200 BCE: stresses pile up: drought in Anatolia, earthquakes, raiders at sea.</li><li>c. 1200–1180 BCE: palaces burn or are abandoned, and the links break.</li><li>c. 1177 BCE: Ramesses III fights the Sea Peoples on Egypt&#x27;s border.</li><li>After c. 1150 BCE: survivors and a long quiet; Greece loses writing for about 400 years.</li></ol><figcaption>The eastern Mediterranean network around 1300 BCE, and its failure in stages between about 1200 and 1150 BCE. Links are schematic; many routes and partners are not shown. <span class="wx-src">Based on: Coastlines: Natural Earth 1:110m. Sites and dates after Pulak 1998, Cline 2014, Knapp and Manning 2016, Powell et al. 2022 and Manning et al. 2023.</span></figcaption><p class="vh">A map of the eastern Mediterranean and Near East with nodes for Pylos, Mycenae, Knossos, Troy, Hattusa, Ugarit, Cyprus, Canaan, Egypt, Assur and Babylon, joined by trade and diplomatic links. The Uluburun ship route runs from the Levant past Cyprus toward the Aegean, with tin from Central Asia arriving from the east. In step two, drought, earthquakes and raiders are marked. In step three, crosses mark destroyed cities and the links turn into broken dashes. In step four, Egypt fights off the Sea Peoples around 1177 BCE. In step five, only Egypt, Assyria, Babylon and the Phoenician coast remain, and Greece is marked as without writing for about 400 years.</p></figure></section><section class="wsec" id="age-10-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The fifty years that ended an age</h3><p>Then, in the decades around 1200 BCE, almost every palace in the network was destroyed or abandoned. Pylos burned, preserving its clay archive by baking it. Mycenae&#x27;s citadel was damaged and later abandoned as a seat of power. Hattusa, the Hittite capital, was emptied. Ugarit, on the Syrian coast, was destroyed around 1185 BCE and never rebuilt. Troy VIIa burned. In Egypt, Ramesses III recorded on his temple at Medinet Habu how in his 8th year, around 1177 BCE, he defeated a coalition of peoples from the sea.</p><blockquote class="quote"><p>My father, behold, the enemy&#x27;s ships came (here); my cities (?) were burned, and they did evil things in my country.</p><cite>Letter from Ammurapi, last king of Ugarit, to the king of Alashiya (Cyprus), RS 20.238; trans. after Nougayrol et al. (1968), as quoted in E. H. Cline, 1177 B.C. (Princeton, 2014)</cite></blockquote><p>For decades that was the whole story: barbarians from the sea. The evidence now shows a more tangled picture. Tree rings from Gordion show three consecutive severe drought years around 1198–1196 BCE. Letters from Ugarit and Hatti beg for grain shipments. Some ruins look like earthquake damage. Some cities were burned with no weapons in the streets, which could mean revolt. The archaeologist Eric Cline calls it a &#x27;perfect storm&#x27;: a system so interconnected that when several stresses hit at once, each failure made the next more likely.</p></section><section class="wsec" id="age-10-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The challenger: a Luwian world war?</h3><p>Geoarchaeologist Eberhard Zangger argues that historians have missed a whole civilisation. Western Anatolia, he points out, was home to Luwian-speaking kingdoms such as Arzawa, the Seha River Land and Wilusa (Homer&#x27;s Ilios), and it is dotted with hundreds of large settlement mounds that have never been excavated. His thesis is that wars launched by these states, a &#x27;World War Zero&#x27;, were the core of the collapse, and that the Sea Peoples were largely their fleets.</p><p>The geographical point is fair, and Hittite texts do show powerful western kingdoms. But the case suffered a blow when a long hieroglyphic Luwian inscription that Zangger and a colleague published in 2017 turned out to rest entirely on drawings left by the late James Mellaart; in 2019 Zangger himself reported evidence that Mellaart had fabricated material. Without excavation, the world-war scenario remains a hypothesis. Its useful demand stands, though: dig the mounds.</p></section><section class="wsec" id="age-10-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Four hundred years without writing</h3><p>The most striking loss was knowledge itself. Linear B was a palace tool, used by scribes to count sheep, bronze and perfumed oil. When the palaces fell, so did the need for it, and Greece became illiterate. When Greeks wrote again, from around the 8th century BCE, they used an alphabet borrowed from the Phoenicians, and they remembered their Bronze Age only through poetry: heroes, a war at Troy, a palace with a labyrinth. When Michael Ventris showed in 1952 that Linear B was Greek, the tablets turned out to be mostly inventories, not epics.</p><p>Egypt survived but shrank, losing its empire in Canaan and, after about 1070 BCE, its unity. Assyria endured. Phoenician cities such as Tyre and Sidon recovered fastest and spread a new, simpler way of writing that most alphabets descend from. Iron, available locally in many places, gradually replaced bronze, which had depended on long trade routes.</p><blockquote class="wpull"><p>A whole civilisation forgot how to write, and remembered its past only as a story of heroes.</p></blockquote></section><section class="wsec" id="age-10-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What the fire kept and what it took</h3><p>Ironically, destruction preserved our best evidence. Clay tablets survive because burning buildings baked them hard, so we read the last weeks of Ugarit and Pylos in detail and know far less about the years before. Wooden writing boards, mentioned in texts and found at Uluburun, have almost all rotted away. Western Anatolia, the key region for the Sea Peoples question, is still largely unexcavated.</p><ul class="wlist"><li>Excavating large western Anatolian mounds would test the Luwian hypothesis directly.</li><li>More annually dated tree-ring and cave records from Greece, Cyprus and the Levant would show how far the drought reached.</li><li>A decipherment of Linear A or Cypro-Minoan would give Crete and Cyprus their own voice.</li></ul></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">1,600 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Thera erupts (date debated: c. 1600 or c. 1560 BCE)</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">1,550 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Egypt&#x27;s New Kingdom begins</span></li><li class="wtl-loss" style="--i:2"><span class="wtl-y">1,450 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Minoan sites on Crete destroyed; Mycenaeans at Knossos</span></li><li class="wtl-use" style="--i:3"><span class="wtl-y">1,350 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Amarna letters: great kings write to &#x27;my brother&#x27;</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">1,300 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">The Uluburun ship sinks with its cargo</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">1,259 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Egyptian–Hittite peace treaty</span></li><li class="wtl-event" style="--i:6"><span class="wtl-y">1,198 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Three-year drought in Anatolia begins</span></li><li class="wtl-loss" style="--i:7"><span class="wtl-y">1,185 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Ugarit destroyed; Hattusa abandoned about this time</span></li><li class="wtl-event" style="--i:8"><span class="wtl-y">1,177 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Ramesses III fights the Sea Peoples</span></li><li class="wtl-find" style="--i:9"><span class="wtl-y">1982 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Sponge diver reports &#x27;metal biscuits with ears&#x27;: Uluburun found</span></li></ol><h3 class="sub-h wsub">Go deeper</h3><div class="links-row"><button type="button" onclick="openItem('articles','case-troy')">Troy <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-knossos')">Knossos <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-atlantis')">Atlantis <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-exodus')">Moses, Pharaoh and the Sea That Stepped Back <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-sodom')">Sodom, the People of Lut, and a Comet Paper That Fell <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-solomon-mines')">King Solomon&#x27;s Mines <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-stonehenge')">Stonehenge <span aria-hidden="true">→</span></button></div><details class="srcs"><summary>Sources for this age (14)</summary><ol><li>Cline, E. H. (2014; rev. 2021). 1177 B.C.: The Year Civilization Collapsed. Princeton University Press.</li><li>Knapp, A. B. &amp; Manning, S. W. (2016). Crisis in context: the end of the Late Bronze Age in the eastern Mediterranean. American Journal of Archaeology 120: 99–149. <a href="https://doi.org/10.3764/aja.120.1.0099" target="_blank" rel="noopener">doi:10.3764/aja.120.1.0099</a></li><li>Manning, S. W. et al. (2023). Severe multi-year drought coincident with Hittite collapse around 1198–1196 BC. Nature 614: 719–724. <a href="https://doi.org/10.1038/s41586-022-05693-y" target="_blank" rel="noopener">doi:10.1038/s41586-022-05693-y</a></li><li>Pulak, C. (1998). The Uluburun shipwreck: an overview. International Journal of Nautical Archaeology 27: 188–224. <a href="https://doi.org/10.1111/j.1095-9270.1998.tb00803.x" target="_blank" rel="noopener">doi:10.1111/j.1095-9270.1998.tb00803.x</a></li><li>Powell, W. et al. (2022). Tin from Uluburun shipwreck shows small-scale commodity exchange fueled continental tin supply across Late Bronze Age Eurasia. Science Advances 8: eabq3766. <a href="https://doi.org/10.1126/sciadv.abq3766" target="_blank" rel="noopener">doi:10.1126/sciadv.abq3766</a></li><li>Kaniewski, D. et al. (2013). Environmental roots of the Late Bronze Age crisis. PLOS ONE 8: e71004. <a href="https://doi.org/10.1371/journal.pone.0071004" target="_blank" rel="noopener">doi:10.1371/journal.pone.0071004</a></li><li>Nur, A. &amp; Cline, E. H. (2000). Poseidon&#x27;s horses: plate tectonics and earthquake storms in the Late Bronze Age Aegean and Eastern Mediterranean. Journal of Archaeological Science 27: 43–63.</li><li>Friedrich, W. L. et al. (2006). Santorini eruption radiocarbon dated to 1627–1600 B.C. Science 312: 548.</li><li>Pearson, C. L. et al. (2018). Annual radiocarbon record indicates 16th century BCE date for the Thera eruption. Science Advances 4: eaar8241. <a href="https://doi.org/10.1126/sciadv.aar8241" target="_blank" rel="noopener">doi:10.1126/sciadv.aar8241</a></li><li>Ehrlich, Y., Regev, L. &amp; Boaretto, E. (2023). Olive shrub buried on Therasia supports a mid-16th century BCE date for the Thera eruption. Scientific Reports 13. <a href="https://doi.org/10.1038/s41598-023-33696-w" target="_blank" rel="noopener">doi:10.1038/s41598-023-33696-w</a></li><li>Moran, W. L. (1992). The Amarna Letters. Johns Hopkins University Press.</li><li>Chadwick, J. (1958). The Decipherment of Linear B. Cambridge University Press.</li><li>Zangger, E. (2016). The Luwian Civilization: The Missing Link in the Aegean Bronze Age. Ege Yayınları.</li><li>Nougayrol, J. et al. (1968). Ugaritica V. Mission de Ras Shamra 16. Paris.</li></ol></details></div></script><script type="text/x-tpl" id="age-11-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Antikythera Fragment A (Front).webp" data-cap="Fragment A of the Antikythera mechanism" data-big><figcaption></figcaption></figure><div class="sh-k">c. 800 BCE–400 CE</div><h2 class="sh-t" id="age-11-st" tabindex="-1">The Axial and Classical Age</h2><p class="sh-s">Philosophers, prophets, a bronze computer, self-healing concrete and a library that tried to hold every book, and most of what they wrote is gone.</p><div class="sh-v"><span class="vstamp vstamp--phase" style="--vc:var(--malachite)"><span aria-hidden="true">▲</span>Rise</span></div></div><p class="v4-q">How much did the ancients know that we later lost?</p><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="7" >7</b><span class="ctr-u"> of 123</span></div><div class="ctr-l">of Sophocles&#x27; plays survive complete</div><div class="ctr-c">Suda; Reynolds and Wilson 1991</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="30" >30</b><span class="ctr-u"> gears</span></div><div class="ctr-l">surviving in the Antikythera mechanism fragments</div><div class="ctr-c">Freeth et al. 2021</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="43.3" data-dec="1">43.3</b><span class="ctr-u"> m</span></div><div class="ctr-l">span of the Pantheon&#x27;s unreinforced concrete dome</div><div class="ctr-c">MacDonald 1976</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="57.7" data-dec="1">57.7</b><span class="ctr-u"> million people</span></div><div class="ctr-l">in Han China&#x27;s census of 2 CE</div><div class="ctr-c">Bielenstein 1947</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="1800" >1,800</b><span class="ctr-u"> scrolls</span></div><div class="ctr-l">carbonised at Herculaneum&#x27;s Villa of the Papyri</div><div class="ctr-c">Vesuvius Challenge 2024</div></div></div><div class="rf"><div class="rf-c rf-up"><h3 class="rf-h"><span aria-hidden="true">▲</span> What rose</h3><ul><li>New ways of thinking about justice, suffering and the good life across Eurasia: Greek philosophy, the Hebrew prophets, the Upanishads, the Buddha, Confucius and Laozi</li><li>Greek mathematics and astronomy, from Euclid and Archimedes to Eratosthenes&#x27; measurement of the Earth and Hipparchus</li><li>Geared machines such as the Antikythera mechanism, and Roman concrete that still stands</li><li>Great libraries and schools, above all the Mouseion and Library of Alexandria</li><li>Empires joined by roads: Persia, the Mauryas, Rome and Han China, with its census, paper and seismoscope</li></ul></div><div class="rf-c rf-down"><h3 class="rf-h"><span aria-hidden="true">▼</span> What fell or was lost</h3><ul><li>Most of classical literature and science: only a small fraction of known works survived the copying bottleneck</li><li>The Library of Alexandria, which faded over centuries rather than burning in a day</li><li>Know-how such as fine geared instruments, which vanished from the record for over a thousand years</li></ul></div></div><h3 class="sub-h wsub">What drove it</h3><div class="trigs"><div class="trig"><b>Cities, coins and wealth</b><span>One study links new moralising philosophies to societies crossing a threshold of affluence (Baumard et al. 2015); coinage spread from Lydia around 600 BCE.</span></div><div class="trig"><b>A mild, stable climate</b><span>The &#x27;Roman Climate Optimum&#x27; of roughly 200 BCE to 150 CE saw relatively warm, stable conditions in Europe and the Mediterranean (McCormick et al. 2012).</span></div><div class="trig"><b>Connected empires</b><span>Roads, sea lanes and the routes later called the Silk Road moved goods, books and ideas across Eurasia (Hansen 2012).</span></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Hellenistic science reached a nearly modern level and was then lost for more than a thousand years.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:50.0%" role="img" aria-label="Weight of evidence: Mixed record"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The loss was real and large: most scientific works vanished, and nothing as complex as the Antikythera mechanism survives for over a millennium. But &#x27;lost&#x27; is too strong. Euclid, Ptolemy, Galen and Archimedes were preserved in Greek in Byzantium and translated and extended in Arabic, and that relay fed Europe&#x27;s revival. And &#x27;nearly modern&#x27; overstates: systematic experiment and physics built on it did not develop in antiquity in the way it did later. Half of the claim fits the evidence well.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">School histories tend to present classical knowledge as having been passed down, dimmed in a &#x27;Dark Age&#x27; and then revived. That story is too tidy in two directions. It understates how much was lost (for many authors, well under a tenth of their work) and it overstates the darkness, ignoring the Greek East and the Arabic translators who kept and extended the sciences.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Eratosthenes estimated the Earth&#x27;s circumference around 240 BCE from shadow angles at Syene and Alexandria.<small>Cleomedes, On the Heavens 1.7</small></li><li>The Antikythera mechanism, from a wreck of about 70–60 BCE, used around 30 surviving bronze gears to model the Sun, Moon and eclipse cycles.<small>Freeth et al. 2006; Freeth et al. 2021</small></li><li>Roman concrete contains lime clasts from hot mixing that can reseal cracks, and the Pantheon&#x27;s 43.3-metre dome remains the largest unreinforced concrete dome.<small>Seymour et al. 2023; MacDonald 1976</small></li><li>Of Sophocles&#x27; 123 recorded plays, 7 survive complete; of Livy&#x27;s 142 books of Roman history, 35 survive.<small>Suda; Reynolds and Wilson 1991</small></li><li>Han China recorded 57.7 million people in its census of 2 CE.<small>Bielenstein 1947</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether there was a single, connected &#x27;Axial Age&#x27;, or parallel changes spread over many centuries.</li><li>How far Hellenistic science went toward a modern experimental method before it stalled.</li><li>How many scrolls the Library of Alexandria held: ancient figures range from 40,000 to 700,000.</li><li>Whether the Antikythera mechanism was a one-off masterpiece or one of many lost instruments.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Books survived only if someone recopied them, so authors not taught in schools after about 500 CE mostly vanished.</li><li>Papyrus rots except in very dry places, so most Greek and Roman books are known only by title or quotation.</li><li>Around 1,800 carbonised scrolls from Herculaneum&#x27;s Villa of the Papyri are only now beginning to be read by X-ray and machine learning.</li></ul></div></div><h3 class="sub-h wsub">The bold reading</h3><div class="face"><div class="face-c face-x" style="grid-column:1/-1"><p>Physicist and historian Lucio Russo argues that in the 3rd and 2nd centuries BCE, Hellenistic science reached something very like modern science: theories built from definitions and theorems, tested by measurement and applied in technology, from Archimedes&#x27; mechanics to Herophilus&#x27; anatomy. After the Roman conquests the social base for this science collapsed, later readers no longer understood it, and Europe had to reinvent it in the 16th and 17th centuries.</p><div class="face-s"><b>Its strongest point</b><p>The Antikythera mechanism shows gear trains and a mathematical model of the sky of a complexity not known again until the astronomical clocks of medieval Europe, which fits a lost, sophisticated tradition.</p></div><p class="face-cr"><b>Credit</b> Lucio Russo (The Forgotten Revolution)</p></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">4 min read · 955 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of The Axial and Classical Age"><button type="button" class="wtoc-i" data-go="age-11-s1">A computer on the sea floor</button><button type="button" class="wtoc-i" data-go="age-11-s2">An age of big questions</button><button type="button" class="wtoc-i" data-go="age-11-s3">Measuring the world</button><button type="button" class="wtoc-i" data-go="age-11-s4">The great copying bottleneck</button><button type="button" class="wtoc-i" data-go="age-11-s5">A forgotten revolution?</button><button type="button" class="wtoc-i" data-go="age-11-s6">What might still come back</button></nav></div><section class="wsec" id="age-11-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A computer on the sea floor</h3><p>In 1901 sponge divers working a Roman-era wreck off the Greek island of Antikythera brought up statues, glass, coins and a lump of corroded bronze. It later cracked open to reveal gear teeth. Over the following century, and especially since X-ray tomography in the 2000s, researchers have shown that the Antikythera mechanism was a hand-cranked model of the heavens: around 30 surviving bronze gears tracked the Sun and Moon, the Moon&#x27;s phases and a cycle of eclipses, and inscriptions refer to the planets. The ship sank around 70–60 BCE.</p><p>Nothing of comparable complexity survives from the next thousand years; simpler geared calendars are known from Byzantium around 500 CE and from the writings of al-Biruni in the 11th century. It is the single best object for this age&#x27;s big question. The Classical world was not just temples and poetry. It had mathematics, instruments and engineering that were later forgotten, at least in part. How much, and how completely, is the argument.</p><blockquote class="wpull"><p>The Antikythera mechanism is a message from a technical tradition whose other products have simply vanished.</p></blockquote></section><section class="wsec" id="age-11-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>An age of big questions</h3><p>In 1949 the philosopher Karl Jaspers noticed something strange. Between roughly 800 and 200 BCE, in lands with little contact, people began asking new questions about justice, suffering and how to live. Greek philosophers argued about the nature of the world; Hebrew prophets preached justice for the poor; the Upanishads explored the self; the Buddha taught a path out of suffering; Confucius and the Daoist thinkers debated order and virtue. Jaspers called it the Axial Age.</p><blockquote class="quote"><p>When you know a thing, to hold that you know it; and when you do not know a thing, to allow that you do not know it</p><cite>Confucius, Analects 2.17, trans. James Legge (1861)</cite></blockquote><p>Whether it was one connected turning point is debated. A 2018 study using a global historical database found that the key changes were spread over a longer period and appeared earlier in some places than others. Dates for several founders, including the Buddha and Zarathustra, are uncertain by a century or more. But the explosion of recorded thought is real, and much of the world&#x27;s religious and philosophical vocabulary still comes from it.</p></section><section class="wsec" id="age-11-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Measuring the world</h3><p>The Greek-speaking scientists of Alexandria did astonishing things with simple tools. Around 240 BCE Eratosthenes compared the Sun&#x27;s angle at Syene and at Alexandria at noon and worked out the Earth&#x27;s circumference; depending on the length of his stade, his answer was somewhere between about 2% and 16% off the true value. Aristarchus of Samos proposed that the Earth goes round the Sun. Hipparchus catalogued stars and discovered the slow shift of the equinoxes. Hero of Alexandria described a steam-driven spinning ball and automated theatres.</p><p>In Rome, builders mixed quicklime with volcanic ash and water while hot, creating concrete with lime clasts that can reseal cracks when water seeps in, a trick rediscovered by researchers in 2023. The Pantheon&#x27;s dome, 43.3 metres across and finished around 125 CE, is still the largest unreinforced concrete dome in the world. In Han China, officials counted 57.7 million people in 2 CE, papermaking was reported to the court in 105 CE, and the astronomer Zhang Heng built a device to detect distant earthquakes in 132 CE.</p><aside class="wcall"><b>Fresh from the field</b><p>Vesuvius buried a library at Herculaneum in 79 CE, carbonising about 1,800 scrolls too fragile to unroll. In 2023–2024 the Vesuvius Challenge used X-ray scans and machine learning to read more than 2,000 characters from inside one of them, a philosophical text on pleasure, and in 2025 researchers read the title of another as a work by Philodemus. Whole lost books may still be waiting inside.</p></aside></section><section class="wsec" id="age-11-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The great copying bottleneck</h3><p>Here is the uncomfortable number at the heart of classical history: most of it is gone. Ancient books existed only as handwritten copies on papyrus, which rots in damp climates. A text survived only if, generation after generation, someone chose to copy it again. When the school curriculum narrowed in late antiquity and papyrus rolls gave way to parchment books, anything not being actively read was left behind.</p><figure class="wx wx--static" id="age-11-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">How much of the classical library reached us</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How much of the classical library reached us"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 462" class="wx-svg" role="img" aria-labelledby="age-11-f1-t"><title id="age-11-f1-t">Bar chart comparing works written and works surviving for seven classical authors</title><text class="wx-t-cap" x="20" y="28">WRITTEN VERSUS SURVIVING</text><line class="wx-guide" x1="170" y1="50" x2="170" y2="396"/><text class="wx-t-s" x="170" y="412" text-anchor="middle">0</text><line class="wx-guide" x1="242.2" y1="50" x2="242.2" y2="396"/><text class="wx-t-s" x="242.2" y="412" text-anchor="middle">25</text><line class="wx-guide" x1="314.4" y1="50" x2="314.4" y2="396"/><text class="wx-t-s" x="314.4" y="412" text-anchor="middle">50</text><line class="wx-guide" x1="386.5" y1="50" x2="386.5" y2="396"/><text class="wx-t-s" x="386.5" y="412" text-anchor="middle">75</text><line class="wx-guide" x1="458.7" y1="50" x2="458.7" y2="396"/><text class="wx-t-s" x="458.7" y="412" text-anchor="middle">100</text><line class="wx-guide" x1="530.9" y1="50" x2="530.9" y2="396"/><text class="wx-t-s" x="530.9" y="412" text-anchor="middle">125</text><text class="wx-t-s" x="580" y="428" text-anchor="end">number of works</text><text class="wx-t-b" x="20" y="66">Aeschylus</text><text class="wx-t-s" x="20" y="81">tragedies</text><rect class="wx-stone2 wx-growx" style="--d:0" x="170" y="54" width="231" height="20" rx="3"/><rect class="wx-paper wx-o60 wx-growx" style="--d:0" x="372.1" y="54" width="57.7" height="20"/><rect class="wx-c1 wx-growx" style="--d:5" x="170" y="54" width="20.2" height="20" rx="3"/><text class="wx-t-n wx-pop" style="--d:6" x="409" y="69">7 of c. 70–90</text><text class="wx-t-s wx-pop" style="--d:6" x="409" y="83">about 8–10% survive</text><text class="wx-t-b" x="20" y="116">Sophocles</text><text class="wx-t-s" x="20" y="131">tragedies</text><rect class="wx-stone2 wx-growx" style="--d:1" x="170" y="104" width="355.1" height="20" rx="3"/><rect class="wx-c1 wx-growx" style="--d:6" x="170" y="104" width="20.2" height="20" rx="3"/><text class="wx-t-n wx-pop" style="--d:7" x="533.1" y="119">7 of 123</text><text class="wx-t-s wx-pop" style="--d:7" x="533.1" y="133">about 6% survive</text><text class="wx-t-b" x="20" y="166">Euripides</text><text class="wx-t-s" x="20" y="181">tragedies</text><rect class="wx-stone2 wx-growx" style="--d:2" x="170" y="154" width="259.9" height="20" rx="3"/><rect class="wx-c1 wx-growx" style="--d:7" x="170" y="154" width="52" height="20" rx="3"/><text class="wx-t-n wx-pop" style="--d:8" x="437.9" y="169">18 of c. 90</text><text class="wx-t-s wx-pop" style="--d:8" x="437.9" y="183">about 20% survive</text><text class="wx-t-b" x="20" y="216">Menander</text><text class="wx-t-s" x="20" y="231">comedies</text><rect class="wx-stone2 wx-growx" style="--d:3" x="170" y="204" width="303.2" height="20" rx="3"/><rect class="wx-c8 wx-growx" style="--d:8" x="170" y="204" width="2.9" height="20" rx="3"/><text class="wx-t-n wx-pop" style="--d:9" x="481.2" y="219">1 of over 100</text><text class="wx-t-s wx-pop" style="--d:9" x="481.2" y="233">about 1% survive</text><text class="wx-t-b" x="20" y="266">Livy</text><text class="wx-t-s" x="20" y="281">books of history</text><rect class="wx-stone2 wx-growx" style="--d:4" x="170" y="254" width="410" height="20" rx="3"/><rect class="wx-c2 wx-growx" style="--d:9" x="170" y="254" width="101.1" height="20" rx="3"/><text class="wx-t-n wx-pop" style="--d:10" x="588" y="269">35 of 142</text><text class="wx-t-s wx-pop" style="--d:10" x="588" y="283">about 25% survive</text><text class="wx-t-b" x="20" y="316">Polybius</text><text class="wx-t-s" x="20" y="331">books of history</text><rect class="wx-stone2 wx-growx" style="--d:5" x="170" y="304" width="115.5" height="20" rx="3"/><rect class="wx-c2 wx-growx" style="--d:10" x="170" y="304" width="14.4" height="20" rx="3"/><text class="wx-t-n wx-pop" style="--d:11" x="293.5" y="319">5 of 40</text><text class="wx-t-s wx-pop" style="--d:11" x="293.5" y="333">about 12% survive</text><text class="wx-t-b" x="20" y="366">Diodorus</text><text class="wx-t-s" x="20" y="381">books of history</text><rect class="wx-stone2 wx-growx" style="--d:6" x="170" y="354" width="115.5" height="20" rx="3"/><rect class="wx-c2 wx-growx" style="--d:11" x="170" y="354" width="43.3" height="20" rx="3"/><text class="wx-t-n wx-pop" style="--d:12" x="293.5" y="369">15 of 40</text><text class="wx-t-s wx-pop" style="--d:12" x="293.5" y="383">about 38% survive</text><rect class="wx-stone2" x="20" y="440" width="14" height="10"/><text class="wx-t-s" x="40" y="449">known to have been written</text><rect class="wx-c1" x="220" y="440" width="14" height="10"/><text class="wx-t-s" x="240" y="449">survive complete or nearly complete</text></svg></div></div><figcaption>Works known to have been written (grey) against works that survive complete or nearly complete (colour), for seven famous authors. <span class="wx-src">Based on: Totals from ancient catalogues (the Suda and others) as given in Reynolds and Wilson 1991 and standard reference works; Aeschylus plotted at 80, Euripides at 90 and Menander at 105.</span></figcaption><p class="vh">A horizontal bar chart. Aeschylus wrote about 70 to 90 plays and 7 survive. Sophocles wrote 123 and 7 survive. Euripides wrote about 90 and 18 survive. Menander wrote over 100 comedies and 1 survives nearly complete. Livy wrote 142 books of history and 35 survive. Polybius wrote 40 books and 5 survive complete. Diodorus wrote 40 books and 15 survive.</p></figure><p>The Library of Alexandria has become the symbol of this loss, but the evidence suggests it faded over centuries through lost royal funding, a purge of scholars in 145 BCE, fire during Caesar&#x27;s war in 48 BCE and civil wars in the 3rd century CE, rather than in one great blaze. Ancient estimates of its size range from 40,000 to 700,000 scrolls, and nobody knows which is closer. The Library case weighs the famous culprits.</p></section><section class="wsec" id="age-11-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>A forgotten revolution?</h3><p>The physicist Lucio Russo argues that we have misjudged the Hellenistic age. In his book The Forgotten Revolution he makes the case that scientists in the 3rd and 2nd centuries BCE built true theoretical science, deducing results from definitions and testing them against measurement, and applied it in engineering, optics, anatomy and hydraulics. After Rome&#x27;s conquests broke up the Hellenistic kingdoms, he argues, that culture collapsed; later writers copied summaries they no longer fully understood, and Europe had to reinvent the method more than 1,500 years later.</p><p>His strongest exhibit is the Antikythera mechanism itself: gearing of comparable complexity does not reappear in the surviving record until the astronomical clocks of medieval Europe. Critics reply that ancient science rarely used controlled experiment, and that &#x27;lost&#x27; is not quite right, because much Greek science was copied in Byzantium and translated, corrected and extended in Baghdad, Cairo and Córdoba, as the next age shows.</p><blockquote class="wpull"><p>The ancients knew more than their surviving books show. Where the knowledge went next is its own adventure.</p></blockquote></section><section class="wsec" id="age-11-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What might still come back</h3><p>Some of what this age lost is not destroyed, only hidden. Charred scrolls at Herculaneum, reused parchments whose original writing was scraped off (like the Archimedes Palimpsest, which preserved his otherwise lost Method), papyrus scraps in the rubbish mounds of Oxyrhynchus, and the unexcavated parts of the Villa of the Papyri may still hold lost works. Other losses, such as most of Aristotle&#x27;s published dialogues or Eratosthenes&#x27; own account of his measurement, are probably gone for good.</p><ul class="wlist"><li>Excavating the unexplored lower floors of the Villa of the Papyri could recover a larger Latin or Greek library.</li><li>Scanning more palimpsests with multispectral imaging keeps revealing erased texts.</li><li>Finding a second geared instrument would settle whether Antikythera was unique.</li></ul></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">600 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">First coins struck in Lydia and Ionia (approx.)</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">551 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Confucius born (traditional date)</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">399 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Socrates executed in Athens</span></li><li class="wtl-build" style="--i:3"><span class="wtl-y">331 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Alexandria founded; its Library grows under the Ptolemies</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">240 BCE</span><span class="wtl-k">Studied</span><span class="wtl-t">Eratosthenes measures the Earth (approx.)</span></li><li class="wtl-loss" style="--i:5"><span class="wtl-y">65 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Ship carrying the Antikythera mechanism sinks (approx.)</span></li><li class="wtl-event" style="--i:6"><span class="wtl-y">2 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Han census counts 57.7 million people</span></li><li class="wtl-loss" style="--i:7"><span class="wtl-y">79 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Vesuvius buries Herculaneum&#x27;s library</span></li><li class="wtl-build" style="--i:8"><span class="wtl-y">125 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Pantheon dome completed (approx.)</span></li><li class="wtl-find" style="--i:9"><span class="wtl-y">2024 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Machine learning reads a Herculaneum scroll</span></li></ol><h3 class="sub-h wsub">Go deeper</h3><div class="links-row"><button type="button" onclick="openItem('articles','case-alexandria-library')">The Library of Alexandria Did Not Burn in a Day <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-dhul-qarnayn')">Dhul-Qarnayn and the Wall Against Gog and Magog <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-thamud-hegra')">Thamud, Salih and the Houses Carved in Mountains <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-sheba')">The Queen of Sheba and the Flood of the Dam <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-star-bethlehem')">The Star of Bethlehem <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-delphi')">The Oracle of Delphi <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-antikythera-mechanism')">Antikythera <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-roman-concrete')">Roman concrete <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-pantheon')">Pantheon <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-petra-water')">Petra&#x27;s water <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-terracotta-army')">Terracotta Army <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-great-wall')">Great Wall <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-seven-wonders')">Seven Wonders <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-teotihuacan')">Teotihuacan <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-nazca-lines')">Nazca Lines <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-india-stone')">India&#x27;s precise stone <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-lycurgus-cup')">Lycurgus Cup <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-baghdad-battery')">&#x27;Baghdad battery&#x27; <span aria-hidden="true">→</span></button></div><details class="srcs"><summary>Sources for this age (15)</summary><ol><li>Jaspers, K. (1949). Vom Ursprung und Ziel der Geschichte. Artemis.</li><li>Bellah, R. N. &amp; Joas, H. (eds) (2012). The Axial Age and Its Consequences. Harvard University Press.</li><li>Mullins, D. A. et al. (2018). A systematic assessment of &#x27;Axial Age&#x27; proposals using global comparative historical evidence. American Sociological Review 83: 596–626. <a href="https://doi.org/10.1177/0003122418772567" target="_blank" rel="noopener">doi:10.1177/0003122418772567</a></li><li>Baumard, N. et al. (2015). Increased affluence explains the emergence of ascetic wisdoms and moralizing religions. Current Biology 25: 10–15. <a href="https://doi.org/10.1016/j.cub.2014.10.063" target="_blank" rel="noopener">doi:10.1016/j.cub.2014.10.063</a></li><li>Freeth, T. et al. (2006). Decoding the ancient Greek astronomical calculator known as the Antikythera Mechanism. Nature 444: 587–591. <a href="https://doi.org/10.1038/nature05357" target="_blank" rel="noopener">doi:10.1038/nature05357</a></li><li>Freeth, T. et al. (2021). A model of the Cosmos in the ancient Greek Antikythera Mechanism. Scientific Reports 11: 5821. <a href="https://doi.org/10.1038/s41598-021-84310-w" target="_blank" rel="noopener">doi:10.1038/s41598-021-84310-w</a></li><li>Seymour, L. M. et al. (2023). Hot mixing: mechanistic insights into the durability of ancient Roman concrete. Science Advances 9: eadd1602. <a href="https://doi.org/10.1126/sciadv.add1602" target="_blank" rel="noopener">doi:10.1126/sciadv.add1602</a></li><li>MacDonald, W. L. (1976). The Pantheon: Design, Meaning, and Progeny. Harvard University Press.</li><li>Russo, L. (2004). The Forgotten Revolution: How Science Was Born in 300 BC and Why It Had to Be Reborn. Springer.</li><li>Reynolds, L. D. &amp; Wilson, N. G. (1991). Scribes and Scholars: A Guide to the Transmission of Greek and Latin Literature. 3rd ed. Oxford University Press.</li><li>Bagnall, R. S. (2002). Alexandria: library of dreams. Proceedings of the American Philosophical Society 146: 348–362.</li><li>Bielenstein, H. (1947). The census of China during the period 2–742 A.D. Bulletin of the Museum of Far Eastern Antiquities 19: 125–163.</li><li>McCormick, M. et al. (2012). Climate change during and after the Roman Empire: reconstructing the past from scientific and historical evidence. Journal of Interdisciplinary History 43: 169–220.</li><li>Vesuvius Challenge (2024). 2023 Grand Prize awarded: we can read the first scroll. scrollprize.org.</li><li>Netz, R. &amp; Noel, W. (2007). The Archimedes Codex. Weidenfeld &amp; Nicolson.</li></ol></details></div></script><script type="text/x-tpl" id="age-12-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Birmingham Quran manuscript full.jpg" data-cap="The Birmingham Quran manuscript" data-big><figcaption></figcaption></figure><div class="sh-k">536–c. 1000 CE</div><h2 class="sh-t" id="age-12-st" tabindex="-1">The Dark Year and a Knowledge Relay</h2><p class="sh-s">A dimmed sun and a new plague, then a faith whose first word was &#x27;Read!&#x27; and a relay carrying science from Alexandria to Baghdad to Toledo.</p><div class="sh-v"><span class="vstamp vstamp--phase" style="--vc:var(--bronze)"><span aria-hidden="true">↕</span>Rise and fall</span></div></div><p class="v4-q">Did a volcanic winter help end the ancient world?</p><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="124" >124</b><span class="ctr-u"> years</span></div><div class="ctr-l">of the Late Antique Little Ice Age, 536 to c. 660</div><div class="ctr-c">Büntgen et al. 2016</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="762" >762</b><span class="ctr-u"> CE</span></div><div class="ctr-l">Baghdad founded by the caliph al-Mansur</div><div class="ctr-c">Gutas 1998</div></div><div class="ctr"><div class="ctr-v">41–<b class="ctr-n" data-v="54" >54</b><span class="ctr-u"> % less rain</span></div><div class="ctr-l">in Terminal Classic Maya droughts</div><div class="ctr-c">Evans et al. 2018</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="645" >645</b><span class="ctr-u"> CE</span></div><div class="ctr-l">latest date in the Birmingham Quran&#x27;s radiocarbon range (568–645)</div><div class="ctr-c">University of Birmingham 2015</div></div></div><div class="rf"><div class="rf-c rf-up"><h3 class="rf-h"><span aria-hidden="true">▲</span> What rose</h3><ul><li>Islam, from the first revelation around 610 CE, and within a century a civilisation stretching from Iberia to Central Asia</li><li>Baghdad, founded in 762, and the translation movement that brought Greek, Persian and Indian science into Arabic</li><li>New science built on the old: algebra, Hindu–Arabic numerals, experimental optics, clinical medicine</li><li>Byzantium&#x27;s survival, Hagia Sophia, Tang China and monuments such as the rock-cut Kailasa temple at Ellora</li></ul></div><div class="rf-c rf-down"><h3 class="rf-h"><span aria-hidden="true">▼</span> What fell or was lost</h3><ul><li>The material complexity of the former Western Roman world: coinage, mass-produced pottery, roof tiles, literacy</li><li>Millions of lives to the first plague pandemic, from 541 onward</li><li>Teotihuacan&#x27;s power by about 550, and the Classic Maya cities of the southern lowlands between about 800 and 950</li><li>The Sasanian Persian empire, conquered in the 630s–650s</li></ul></div></div><h3 class="sub-h wsub">What drove it</h3><div class="trigs"><div class="trig"><b>Volcanic eruptions</b><span>Ice cores show major eruptions in 536 and around 540, with another in 547, causing one of the sharpest Northern Hemisphere coolings of the last 2,000 years (Sigl et al. 2015; Toohey et al. 2016).</span></div><div class="trig"><b>A cold century</b><span>Tree rings from the Alps and the Altai define a Late Antique Little Ice Age from 536 to about 660 (Büntgen et al. 2016).</span></div><div class="trig"><b>Plague</b><span>DNA from 6th-century graves confirms Yersinia pestis as the cause of the pandemic that reached Egypt in 541 (Wagner et al. 2014; Keller et al. 2019).</span></div><div class="trig"><b>Drought in the Maya lowlands</b><span>Lake sediments show annual rainfall 41–54% lower during the Terminal Classic, with deeper falls in peak droughts (Evans et al. 2018).</span></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>A volcanic &#x27;dust veil&#x27; from 536 and the plague that followed helped end the ancient world and opened the way for new powers.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The eruptions, the cold and the plague are all firmly established, and their timing lines up with famine, the failure of Justinian&#x27;s reconquest and the exhaustion of Rome and Persia before the Arab conquests. What remains hard is measuring cause: some studies find the plague&#x27;s long-term footprint smaller than the texts suggest, and politics, war and religion had their own momentum. Baillie&#x27;s comet adds nothing the ice cores require; the sulphate is volcanic, so that variant awaits evidence.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks still often call this the &#x27;Dark Ages&#x27; with confidence, a label that fits parts of western Europe but not Byzantium, the Islamic world, India or China. They usually leave out 536 and the Late Antique Little Ice Age entirely, and describe Islamic scholars as &#x27;preserving&#x27; Greek science when they also corrected and extended it. Overconfident framing, underplayed evidence.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Contemporary writers in 536 describe a dim sun for about a year, and ice cores record the volcanic sulphate that explains it.<small>Procopius, Wars 4.14.5; Sigl et al. 2015</small></li><li>Yersinia pestis caused the first plague pandemic, which reached Pelusium in Egypt in 541 and Constantinople in 542.<small>Wagner et al. 2014; Keller et al. 2019</small></li><li>Two leaves of a Quran manuscript at the University of Birmingham were radiocarbon dated to 568–645 CE (95.4% probability).<small>University of Birmingham 2015</small></li><li>Baghdad&#x27;s scholars translated much of Greek science and philosophy into Arabic between the 8th and 10th centuries, then corrected and extended it.<small>Gutas 1998</small></li><li>Twelfth-century translators in Toledo turned Arabic scientific works, including Ptolemy&#x27;s Almagest, into Latin.<small>Burnett 2001</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>How deadly the first plague pandemic was across the whole Mediterranean: a quarter or more, or much less.</li><li>Whether the cold of 536–660 helped drive migrations, wars and the fall of empires, or merely coincided with them.</li><li>Whether &#x27;Dark Ages&#x27; is a fair name even for western Europe, given continuity in Byzantium and the flowering of the Islamic world.</li><li>Which volcanoes erupted in 536 and 540; candidates in Iceland and Central America have been proposed and questioned.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>The library of the House of Wisdom was lost when the Mongols sacked Baghdad in 1258, so we know it largely through the books it produced.</li><li>Many Greek works translated into Arabic survive only in Arabic, and others were lost in both languages.</li><li>Most Maya books were burned in the 16th century; only four are known today, so their own account of the collapse is gone.</li></ul></div></div><h3 class="sub-h wsub">The bold reading</h3><div class="face"><div class="face-c face-x" style="grid-column:1/-1"><p>Dendrochronologist Mike Baillie, whose Irish oak chronologies helped reveal the 536–545 downturn, argued in Exodus to Arthur (1999) that the event was caused not only by volcanoes but by cometary debris or impacts, and that the sky-fire and dragons in legends of the period, including the Arthurian ones, may remember it. Geologist Dallas Abbott and colleagues reported possible cosmic dust and marine microfossils in Greenland ice of this time.</p><div class="face-s"><b>Its strongest point</b><p>The tree-ring downturn is extraordinary, global and sudden, and several traditions of the 6th century describe fire and portents in the sky around the time the rings go narrow.</p></div><p class="face-cr"><b>Credit</b> Mike Baillie (a cosmic cause for 536); Dallas Abbott</p></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,070 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Dark Year and a Knowledge Relay"><button type="button" class="wtoc-i" data-go="age-12-s1">The year the sun went dim</button><button type="button" class="wtoc-i" data-go="age-12-s2">Plague, and the end of an old world</button><button type="button" class="wtoc-i" data-go="age-12-s3">&#x27;Read!&#x27;: a new faith in Arabia</button><button type="button" class="wtoc-i" data-go="age-12-s4">The relay: Alexandria to Baghdad to Toledo</button><button type="button" class="wtoc-i" data-go="age-12-s5">Drought in the Maya forest</button><button type="button" class="wtoc-i" data-go="age-12-s6">A comet in the tree rings?</button><button type="button" class="wtoc-i" data-go="age-12-s7">What was lost in the relay</button></nav></div><section class="wsec" id="age-12-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The year the sun went dim</h3><p>In 536 CE the historian Procopius, travelling with the Byzantine army, recorded something that frightened everyone who saw it. For a whole year the sun seemed weak and pale. Irish annals record a &#x27;failure of bread&#x27;. Chinese chronicles report a yellow dust falling from the sky, unusual cold and famine. The medieval historian Michael McCormick later called 536 the beginning of one of the worst periods to be alive, if not the worst year.</p><blockquote class="quote"><p>For the sun gave forth its light without brightness, like the moon, during this whole year, and it seemed exceedingly like the sun in eclipse.</p><cite>Procopius, History of the Wars 4.14.5, trans. H. B. Dewing (Loeb, 1916)</cite></blockquote><p>For centuries this read like exaggeration. Then the science caught up. Greenland and Antarctic ice cores hold layers of volcanic sulphate from a large eruption in 536 and another around 540, followed by a third in 547. Tree rings across the Northern Hemisphere go narrow, and a 2016 study defined a Late Antique Little Ice Age lasting from 536 to about 660.</p><figure class="wx wx--static" id="age-12-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">The 536 signal in a tree</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The 536 signal in a tree"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" class="wx-svg" role="img" aria-labelledby="age-12-f1-t"><title id="age-12-f1-t">Schematic strip of tree rings from 526 to 560 CE showing narrow rings after the eruptions of 536, 540 and 547</title><defs><marker id="age-12-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker><marker id="age-12-f1-ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text class="wx-t-cap" x="20" y="26">SCHEMATIC TREE-RING STRIP, 526–560 CE (BARK TO THE RIGHT)</text><rect class="wx-wood wx-o40 wx-growx" style="--d:0" x="30" y="120" width="660" height="110"/><rect class="wx-sand wx-growx" style="--d:0.0" x="30" y="120" width="19.3" height="110"/><rect class="wx-stone3 wx-growx" style="--d:0.0" x="48.3" y="120" width="6.4" height="110"/><rect class="wx-sand wx-growx" style="--d:0.25" x="54.7" y="120" width="18.2" height="110"/><rect class="wx-stone3 wx-growx" style="--d:0.25" x="72" y="120" width="6.1" height="110"/><rect class="wx-sand wx-growx" style="--d:0.5" x="78.1" y="120" width="21.3" height="110"/><rect class="wx-stone3 wx-growx" style="--d:0.5" x="98.3" y="120" width="7.1" height="110"/><rect class="wx-sand wx-growx" style="--d:0.75" x="105.4" y="120" width="17.7" height="110"/><rect class="wx-stone3 wx-growx" style="--d:0.75" x="122.2" y="120" width="5.9" height="110"/><rect class="wx-sand wx-growx" style="--d:1.0" x="128.1" y=" height="110"/><rect class="wx-sand wx-growx" style="--d:6.5" x="498.5" y="120" width="15.9" height="110"/><rect class="wx-stone3 wx-growx" style="--d:6.5" x="513.5" y="120" width="5.3" height="110"/><rect class="wx-sand wx-growx" style="--d:6.75" x="518.8" y="120" width="16.3" height="110"/><rect class="wx-stone3 wx-growx" style="--d:6.75" x="534.3" y="120" width="5.4" height="110"/><rect class="wx-sand wx-growx" style="--d:7.0" x="539.7" y="120" width="15.5" height="110"/><rect class="wx-stone3 wx-growx" style="--d:7.0" x="554.4" y="120" width="5.2" height="110"/><rect class="wx-sand wx-growx" style="--d:7.25" x="559.5" y="120" width="16.7" height="110"/><rect class="wx-stone3 wx-growx" style="--d:7.25" x="575.4" y="120" width="5.6" height="110"/><rect class="wx-sand wx-growx" style="--d:7.5" x="580.9" y="120" width="16.3" height="110"/><rect class="wx-stone3 wx-growx" style="--d:7.5" x="596.4" y="120" width="5.4" height="110"/><rect class="wx-sand wx-growx" style="--d:7.75" x="601.8" y="120" width="17.1" height="110"/><rect class="wx-stone3 wx-growx" style="--d:7.75" x="618" y="120" width="5.7" height="110"/><rect class="wx-sand wx-growx" style="--d:8.0" x="623.7" y="120" width="16.9" height="110"/><rect class="wx-stone3 wx-growx" style="--d:8.0" x="639.7" y="120" width="5.6" height="110"/><rect class="wx-sand wx-growx" style="--d:8.25" x="645.4" y="120" width="17.5" height="110"/><rect class="wx-stone3 wx-growx" style="--d:8.25" x="662" y="120" width="5.8" height="110"/><rect class="wx-sand wx-growx" style="--d:8.5" x="667.8" y="120" width="17.3" height="110"/><rect class="wx-stone3 wx-growx" style="--d:8.5" x="684.2" y="120" width="5.8" height="110"/><rect class="wx-line" x="30" y="120" width="660" height="110"/><line class="wx-thin" x1="42.4" y1="230" x2="42.4" y2="236"/><text class="wx-t-s" x="42.4" y="250" text-anchor="middle">526</text><line class="wx-thin" x1="141.3" y1="230" x2="141.3" y2="236"/><text class="wx-t-s" x="141.3" y="250" text-anchor="middle">530</text><line class="wx-thin" x1="263.6" y1="230" x2="263.6" y2="236"/><text class="wx-t-s" x="263.6" y="250" text-anchor="middle">535</text><line class="wx-thin" x1="391.5" y1="230" x2="391.5" y2="236"/><text class="wx-t-s" x="391.5" y="250" text-anchor="middle">545</text><line class="wx-thin" x1="470.5" y1="230" x2="470.5" y2="236"/><text class="wx-t-s" x="470.5" y="250" text-anchor="middle">550</text><line class="wx-thin" x1="570.2" y1="230" x2="570.2" y2="236"/><text class="wx-t-s" x="570.2" y="250" text-anchor="middle">555</text><line class="wx-thin" x1="678.9" y1="230" x2="678.9" y2="236"/><text class="wx-t-s" x="678.9" y="250" text-anchor="middle">560</text><line class="wx-thin wx-pop" style="--d:8" x1="280.3" y1="118" x2="280.3" y2="78"/><text class="wx-t-b wx-t-a wx-pop" style="--d:9" x="280.3" y="58" text-anchor="middle">536</text><text class="wx-t-s wx-pop" style="--d:9" x="280.3" y="72" text-anchor="middle">eruption; dim sun</text><line class="wx-thin wx-pop" style="--d:8" x1="329.6" y1="118" x2="329.6" y2="108"/><text class="wx-t-b wx-t-a wx-pop" style="--d:9" x="329.6" y="88" text-anchor="middle">c. 540</text><text class="wx-t-s wx-pop" style="--d:9" x="329.6" y="102" text-anchor="middle">second eruption</text><line class="wx-thin wx-pop" style="--d:8" x1="337.4" y1="232" x2="337.4" y2="266"/><text class="wx-t-b wx-pop" style="--d:9" x="337.4" y="278" text-anchor="middle">541</text><text class="wx-t-s wx-pop" style="--d:9" x="337.4" y="292" text-anchor="middle">plague reaches Egypt</text><line class="wx-thin wx-pop" style="--d:8" x1="425" y1="118" x2="425" y2="78"/><text class="wx-t-b wx-t-a wx-pop" style="--d:9" x="425" y="58" text-anchor="middle">547</text><text class="wx-t-s wx-pop" style="--d:9" x="425" y="72" text-anchor="middle">third eruption</text><rect class="wx-fire wx-o60 wx-growx" style="--d:6" x="276.4" y="116" width="413.6" height="4"/><path class="wx-hl wx-draw" pathLength="1" style="--d:10" marker-end="url(#age-12-f1-ah)" d="M461.4,304 L698,304"/><text class="wx-t-b" x="461.4" y="296">cool summers continue to c. 660</text><text class="wx-t-s" x="461.4" y="322">the Late Antique Little Ice Age</text><text class="wx-t-b" x="128.1" y="296">wide rings:</text><text class="wx-t-s" x="128.1" y="311">good growing years</text><text class="wx-t-s" x="20" y="344">Widths illustrate the pattern in European and Siberian chronologies; they are not measurements from one tree.</text></svg></div></div><figcaption>A schematic strip of tree rings from 526 to 560 CE. Ring widths are illustrative, drawn to show the pattern in European and Siberian chronologies, not measured values. <span class="wx-src">Based on: Pattern after Baillie 1999, Sigl et al. 2015 and Büntgen et al. 2016; widths schematic.</span></figcaption><p class="vh">A horizontal strip of wood showing tree rings from 526 to 560 CE. Rings are wide in the 520s and early 530s, then suddenly narrow in 536, stay narrow through the early 540s with a second dip at 540 and a third at 547, and recover only slowly. Labels mark the 536 eruption, the eruption around 540, the arrival of plague in Egypt in 541 and the eruption of 547, and an arrow notes that cool conditions continued to about 660.</p></figure></section><section class="wsec" id="age-12-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Plague, and the end of an old world</h3><p>In 541 a new disease arrived by ship at Pelusium in Egypt. It reached Constantinople the next year, where Procopius claims that at the peak ten thousand people died each day. Ancient DNA from 6th-century graves in Bavaria and, in 2025, from a mass grave at Jerash in Jordan confirms the killer as Yersinia pestis, the bacterium of the later Black Death. Waves returned for two centuries. How deadly it was overall is argued: some historians estimate a quarter or more of the Mediterranean population, while a 2019 review of papyri, coins, laws and pollen found little sign of a lasting collapse in many places.</p><p>In the former Western Roman provinces, the change was already deep. The last western emperor had been deposed in 476, and Justinian&#x27;s long wars to reconquer Italy, fought through the cold years, ruined much of what remained. Archaeologist Bryan Ward-Perkins has documented the result: fewer coins, cruder pottery, fewer tiled roofs, and even smaller cattle. Byzantium survived, and built Hagia Sophia, but it and Persia fought each other almost to exhaustion in the early 7th century.</p></section><section class="wsec" id="age-12-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>&#x27;Read!&#x27;: a new faith in Arabia</h3><p>Into that exhausted world came a message from western Arabia. Muslim tradition holds that around 610 Muhammad, a merchant of Mecca then about forty, was meditating in a cave on Mount Hira when the angel Gabriel brought the first words of the Quran. They are a command to read, and a praise of the pen and of learning, which is worth remembering given what followed.</p><blockquote class="quote"><p>Read! In the name of your Lord who created: He created man from a clinging form. Read! Your Lord is the Most Bountiful One who taught by [means of] the pen, who taught man what he did not know.</p><cite>Quran 96:1–5, trans. M. A. S. Abdel Haleem (Oxford, 2004)</cite></blockquote><p>The early community migrated to Medina in 622, the year from which the Islamic calendar counts. The Quran also speaks to events of its own day. A passage that tradition dates to the years of Persian victory opens: &#x27;The Byzantines have been defeated in a nearby land. They will reverse their defeat with a victory in a few years&#x27; time.&#x27; The history fits well: the Persians took Antioch in 613 and Jerusalem in 614, and from 622 the emperor Heraclius counter-attacked, crushing a Persian army near Nineveh in 627 and forcing a peace in 628. Believers read this as a fulfilled prophecy; historians note how closely the text tracks the war. The physical record of the text is early too: in 2015, two leaves at the University of Birmingham were radiocarbon dated to between 568 and 645, within or close to the Prophet&#x27;s lifetime.</p><blockquote class="wpull"><p>A civilisation that began with the command &#x27;Read!&#x27; became, within two centuries, the world&#x27;s great translator.</p></blockquote></section><section class="wsec" id="age-12-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The relay: Alexandria to Baghdad to Toledo</h3><p>Within a century of Muhammad&#x27;s death in 632 the caliphate reached from Iberia to the Indus. In 762 the Abbasid caliph al-Mansur founded Baghdad, and over the next two centuries its patrons paid for one of the great intellectual projects in history: translating the science and philosophy of Greece, Persia and India into Arabic. Hunayn ibn Ishaq and his circle translated Galen&#x27;s medicine; Euclid, Ptolemy and Aristotle followed. Indian astronomy and the decimal place-value numerals arrived with Sanskrit texts. Paper, made in Baghdad from the late 8th century, made books cheaper.</p><figure class="wx wx--steps" id="age-12-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">The knowledge relay</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The knowledge relay"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 402" class="wx-svg" role="img" aria-labelledby="age-12-f2-t"><title id="age-12-f2-t">Map of the knowledge relay from Athens and Alexandria to Baghdad, Cairo, Toledo and Latin Europe</title><defs><marker id="age-12-f2-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker><marker id="age-12-f2-ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><rect class=
