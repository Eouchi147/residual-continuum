th class="wx-hl" marker-end="url(#age-07-f1-ah)" d="M530,250.1 Q555.2,232.1 580.4,295.7"/><text class="wx-t-b wx-t-a wx-halo" x="445.6" y="230.2" text-anchor="middle">people withdraw</text><text class="wx-t-s wx-halo" x="445.6" y="245.2" text-anchor="middle">to the Nile and the Sahel</text><text class="wx-t-s wx-halo" x="443.9" y="338.3">lakes shrink</text></g><text class="wx-t-cap" x="406.9" y="55.4">MEDITERRANEAN SEA</text><text class="wx-t-cap" x="29.4" y="235">ATLANTIC</text><text class="wx-t-big wx-o40" x="254.5" y="127.5">SAHARA</text><text class="wx-st wx-hide wx-t-cap wx-t-a" data-only="1" x="700" y="448.6" text-anchor="end">TODAY</text><text class="wx-st wx-hide wx-t-cap wx-t-a" data-only="2" x="700" y="448.6" text-anchor="end">c. 9,000–6,000 YEARS AGO</text><text class="wx-st wx-hide wx-t-cap wx-t-a" data-only="3" x="700" y="448.6" text-anchor="end">PEOPLE OF THE GREEN SAHARA</text><text class="wx-st wx-hide wx-t-cap wx-t-a" data-only="4" x="700" y="448.6" text-anchor="end">FROM c. 5300 BCE: THE RAINS RETREAT</text><rect class="wx-inkfill" x="24" y="440.6" width="57" height="5"/><text class="wx-t-s" x="24" y="460.6" text-anchor="middle">0</text><text class="wx-t-s" x="81" y="460.6" text-anchor="middle">500 km</text><text class="wx-t-s" x="24" y="480.6">Schematic: lake outlines and vegetation limits are approximate and shifted through time.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 4.</b> Today: the Sahara, with the desert&#x27;s southern edge near 15° north and a small Lake Chad.</p><ol class="wx-steplist"><li>Today: the Sahara, with the desert&#x27;s southern edge near 15° north and a small Lake Chad.</li><li>c. 9,000–6,000 years ago: a stronger monsoon brings grassland far north and fills great lakes.</li><li>People: fishers at Gobero, painters at Tassili and Sefar, herders at Nabta Playa.</li><li>From c. 5300 BCE: the rains retreat south, lakes shrink, and people move toward the Nile and the Sahel.</li></ol><figcaption>North Africa today, in the Green Sahara, and as the rains retreated. Lake outlines and the northern edge of grassland are approximate and varied through time. <span class="wx-src">Based on: Coastlines: Natural Earth 1:110m. Lakes and vegetation limit schematic after Drake and Bristow 2006, Armitage et al. 2015, Kuper and Kröpelin 2006 and Tierney et al. 2017; site positions approximate.</span></figcaption><p class="vh">A map of North Africa from the Atlantic to the Red Sea. Step one shows today&#x27;s desert with the Sahel edge near 15 degrees north and a small Lake Chad. Step two adds green grassland reaching far north and large lakes: Mega-Chad, lakes in the Fezzan and the West Nubian palaeolake. Step three marks people: Gobero, Tassili and Sefar, Wadi Sura and Nabta Playa. Step four shows the lakes shrinking to dashed outlines, the green belt retreating south, and arrows of people moving toward the Nile and the Sahel.</p></figure><aside class="wcall"><b>How do we know?</b><p>Off Mauritania, the seabed collects Saharan dust blown out to sea. In ocean drilling core 658C, Peter deMenocal and colleagues found that windblown dust fell sharply when the humid period began and jumped back up around 5,500 years ago. Less dust means more plants holding the soil. Pollen from lake beds, fossil shells, hippo and crocodile bones, and dated shorelines tell the same story from the land.</p></aside></section><section class="wsec" id="age-07-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The cold snap of 8,200 years ago</h3><p>Even in the green millennia the climate could lurch. Around 8,200 years ago, giant meltwater lakes left by the North American ice sheet drained into the North Atlantic. The fresh water appears to have weakened the ocean currents that carry heat north. Greenland ice records a cooling of about 3.3 °C in under 20 years, with the coldest spell lasting a few decades and the whole event about a century and a half. The shock is so widely recorded that geologists now use it to mark the start of a formal slice of time, the Northgrippian Age.</p><p>Much of the Northern Hemisphere turned drier. In Anatolia, the famous town of Çatalhöyük, home to perhaps a few thousand people who walked across the rooftops and climbed down ladders into their houses, reorganised around this time, and by about 6000 BCE its people had moved to a new mound across the river. Whether the cold snap pushed them, or merely coincided with changes already under way, is still argued. Some villages in the Near East show disruption; others, such as Tell Sabi Abyad in Syria, carried on.</p></section><section class="wsec" id="age-07-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Did the sea break into the Black Sea?</h3><p>In 1997 two marine geologists at Columbia University, William Ryan and Walter Pitman, made a thrilling proposal. At the end of the Ice Age, they argued, the Black Sea was a freshwater lake lying far below the level of the rising Mediterranean. Around 7,600 years ago (a date later revised to about 8,800) the sea topped the Bosporus sill and poured in. By their estimate about 50 km³ of water rushed through every day for at least 300 days, drowning roughly 100,000 km² of shoreline. Farmers who fled, they suggested, carried the memory of a world lost to water into the flood stories of Mesopotamia and beyond.</p><p>Their strongest evidence came from the seabed: freshwater mollusc shells abruptly replaced by Mediterranean species, and drowned beaches and dunes far below today&#x27;s water line. In 1999 an expedition led by Robert Ballard reported an ancient shoreline about 150 metres down off Sinop in Türkiye.</p><p>Critics pushed back hard. Ali Aksu, Richard Hiscott and colleagues argued from cores near the Bosporus that the Black Sea had been flowing out into the Mediterranean, not the other way, which would rule out a waterfall. Valentina Yanko-Hombach and others reported no archaeological sign of a catastrophic submergence of settlements. Today many researchers accept a real reconnection and a rise in the Black Sea, but argue over its speed, with estimates ranging from a months-long deluge to a &#x27;fast transgression&#x27; over decades or a couple of centuries. The flood case weighs the memory question in detail.</p><blockquote class="wpull"><p>A real sea did rise over real land. What remains open is whether it came as a deluge anyone would remember.</p></blockquote></section><section class="wsec" id="age-07-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Turning off the tap</h3><p>As summer sunshine weakened, the monsoon slowly retreated south. How fast the Sahara then dried is a live argument. The dust record off Mauritania shows a sharp switch around 5,500 years ago. But when Stefan Kröpelin&#x27;s team cored Lake Yoa in northern Chad, one of the few Saharan lakes that never dried, they found a gradual change in its pollen over about two thousand years. A 2015 study concluded that the end was time-transgressive: earlier in the north, later in the south.</p><p>People followed the water. Kuper and Kröpelin compiled radiocarbon dates from archaeological sites across the eastern Sahara and found occupation retreating from about 5300 BCE onward, toward the Sudanese Sahel, the oases and the Nile. By about 3500 BCE the Egyptian Sahara was largely empty, and the valley was filling with the villages that would, within a few centuries, become a unified kingdom. At Nabta Playa in southern Egypt, herders had already buried cattle in stone-covered tombs and set up a small ring of standing stones. Some scholars see a line from that cattle-centred world to the cow goddesses of Pharaonic Egypt. It is a fair suggestion, not yet a demonstration.</p><p>Arabia went through the same cycle. Its own humid phase filled lakes in the Nefud before the rains failed, which is worth remembering whenever old stories speak of lost peoples and cities in the sands, such as the tradition weighed in the case of Iram of the pillars.</p></section><section class="wsec" id="age-07-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What the sand keeps, and what it erased</h3><p>The Green Sahara is a textbook example of evidence destroyed by time. Wind has stripped away many lakeshore camps; dunes have buried others. Rock paintings rarely contain anything that can be radiocarbon dated, so their ages rest on style sequences and on dates from nearby deposits, and some famous copies made in the 1950s were later exposed as embellished or even invented. The drowned Black Sea shelf, where any flooded farming villages would lie, has scarcely been searched.</p><ul class="wlist"><li>Directly dated pigments or mineral crusts on Round Head paintings would anchor the art to the climate record.</li><li>Systematic survey of the drowned Black Sea shelf, below 50 metres, could find or rule out flooded villages.</li><li>Ancient DNA from Saharan burials such as Gobero, compared with early Nile valley genomes, could test whether desert herders fed into Egypt&#x27;s population.</li></ul><p>The lesson of this age is the one this whole timeline keeps teaching. A desert can be a garden, a lake can be a sea, and an empty map can hide a crowded past.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">7,500 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Round Head paintings begin in the central Sahara (approx.)</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">7,100 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Çatalhöyük founded on the Konya Plain</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">6,200 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">The 8.2 ka cold snap after North American lakes drain</span></li><li class="wtl-use" style="--i:3"><span class="wtl-y">6,000 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Çatalhöyük&#x27;s people shift to the West Mound</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">5,600 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Ryan and Pitman&#x27;s first date for a Black Sea deluge (later revised to c. 6800 BCE)</span></li><li class="wtl-loss" style="--i:5"><span class="wtl-y">5,300 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Rains begin to fail; eastern Saharan herders drift south and east</span></li><li class="wtl-loss" style="--i:6"><span class="wtl-y">3,500 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Eastern Sahara largely empty outside oases</span></li><li class="wtl-find" style="--i:7"><span class="wtl-y">2000 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Gobero cemeteries discovered by Paul Sereno&#x27;s team</span></li></ol><h3 class="sub-h wsub">Go deeper</h3><div class="links-row"><button type="button" onclick="openItem('articles','case-flood')">The Flood <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-iram-ubar')">ʿĀd and Iram of the Pillars <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-sefar')">Sefar rock art <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-gobekli-tepe')">Göbekli Tepe <span aria-hidden="true">→</span></button></div><details class="srcs"><summary>Sources for this age (19)</summary><ol><li>deMenocal, P. et al. (2000). Abrupt onset and termination of the African Humid Period: rapid climate responses to gradual insolation forcing. Quaternary Science Reviews 19: 347–361. <a href="https://doi.org/10.1016/S0277-3791(99)00081-5" target="_blank" rel="noopener">doi:10.1016/S0277-3791(99)00081-5</a></li><li>Kuper, R. &amp; Kröpelin, S. (2006). Climate-controlled Holocene occupation in the Sahara: motor of Africa&#x27;s evolution. Science 313: 803–807. <a href="https://doi.org/10.1126/science.1130989" target="_blank" rel="noopener">doi:10.1126/science.1130989</a></li><li>Kröpelin, S. et al. (2008). Climate-driven ecosystem succession in the Sahara: the past 6000 years. Science 320: 765–768. <a href="https://doi.org/10.1126/science.1154913" target="_blank" rel="noopener">doi:10.1126/science.1154913</a></li><li>Shanahan, T. M. et al. (2015). The time-transgressive termination of the African Humid Period. Nature Geoscience 8: 140–144. <a href="https://doi.org/10.1038/ngeo2329" target="_blank" rel="noopener">doi:10.1038/ngeo2329</a></li><li>Tierney, J. E., Pausata, F. S. R. &amp; deMenocal, P. B. (2017). Rainfall regimes of the Green Sahara. Science Advances 3: e1601503. <a href="https://doi.org/10.1126/sciadv.1601503" target="_blank" rel="noopener">doi:10.1126/sciadv.1601503</a></li><li>Sereno, P. C. et al. (2008). Lakeside cemeteries in the Sahara: 5000 years of Holocene population and environmental change. PLoS ONE 3(8): e2995. <a href="https://doi.org/10.1371/journal.pone.0002995" target="_blank" rel="noopener">doi:10.1371/journal.pone.0002995</a></li><li>Drake, N. &amp; Bristow, C. (2006). Shorelines in the Sahara: geomorphological evidence for an enhanced mons rther evidence of abrupt Holocene drowning of the Black Sea shelf. Marine Geology 170: 253–261.</li><li>Yüncü, E. et al. (2025). Female lineages and changing kinship patterns in Neolithic Çatalhöyük. Science. <a href="https://doi.org/10.1126/science.adr2915" target="_blank" rel="noopener">doi:10.1126/science.adr2915</a></li><li>UNESCO World Heritage Centre. Tassili n&#x27;Ajjer (inscribed 1982). World Heritage List no. 179.</li></ol></details></div></script><script type="text/x-tpl" id="age-08-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Warka vase (background retouched).jpg" data-cap="The Warka Vase from Uruk" data-big><figcaption></figcaption></figure><div class="sh-k">c. 5,500–4,200 years ago</div><h2 class="sh-t" id="age-08-st" tabindex="-1">First Cities and Writing</h2><p class="sh-s">In a few centuries, on four continents, people built cities, pyramids and scripts, and one of those scripts still refuses to be read.</p><div class="sh-v"><span class="vstamp vstamp--phase" style="--vc:var(--malachite)"><span aria-hidden="true">▲</span>Rise</span></div></div><p class="v4-q">Did civilisation start here, or is something older hiding underneath?</p><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="85" >85</b><span class="ctr-u"> %</span></div><div class="ctr-l">of the earliest Uruk tablets that are administrative records</div><div class="ctr-c">Englund 1998</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="146.6" data-dec="1">146.6</b><span class="ctr-u"> m</span></div><div class="ctr-l">original height of the Great Pyramid</div><div class="ctr-c">Lehner 1997</div></div><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="700" >700</b><span class="ctr-u"> wells</span></div><div class="ctr-l">brick-lined wells at Mohenjo-daro</div><div class="ctr-c">Kenoyer 1998</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="5" >5</b><span class="ctr-u"> signs</span></div><div class="ctr-l">average length of an Indus inscription</div><div class="ctr-c">Parpola 1994; Rao et al. 2009</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="3" >3</b><span class="ctr-u"> inventions</span></div><div class="ctr-l">independent inventions of writing, at least</div><div class="ctr-c">Woods 2010</div></div></div><div class="rf"><div class="rf-c rf-up"><h3 class="rf-h"><span aria-hidden="true">▲</span> What rose</h3><ul><li>Uruk in southern Iraq, perhaps the largest city of its day, and the first writing on clay</li><li>A unified Egyptian kingdom from about 3100 BCE, with hieroglyphs, the Step Pyramid and the Great Pyramid</li><li>The Indus cities, with grid streets, hundreds of wells, covered drains and a script nobody can read</li><li>Caral in Peru&#x27;s Supe valley, a city of platform mounds with no sign of warfare</li><li>Liangzhu in China, with some of the world&#x27;s oldest large dams, and the great sarsen circle at Stonehenge</li></ul></div><div class="rf-c rf-down"><h3 class="rf-h"><span aria-hidden="true">▼</span> What fell or was lost</h3><ul><li>The Uruk expansion&#x27;s far-flung trading colonies, abandoned around 3100 BCE</li><li>Liangzhu, abandoned around 2300 BCE after centuries of water engineering</li><li>The Akkadian empire and Egypt&#x27;s Old Kingdom, both unravelling as this age closed</li></ul></div></div><h3 class="sub-h wsub">What drove it</h3><div class="trigs"><div class="trig"><b>Rivers and floodplains</b><span>Irrigated floodplains of the Tigris–Euphrates, Nile and Indus fed dense populations (Algaze 2008; Kenoyer 1998).</span></div><div class="trig"><b>Administration</b><span>About 85% of the earliest Uruk tablets are accounts of grain, animals, labour and rations, so writing grew out of bookkeeping (Englund 1998).</span></div><div class="trig"><b>A drying Sahara</b><span>The end of the Green Sahara concentrated people along the Nile just before Egypt was unified (Kuper and Kröpelin 2006).</span></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The core of the Great Sphinx was carved thousands of years before Khafre, by an older, forgotten culture.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The weathering pattern is real and Schoch is a serious geologist. But other geologists explain it through salt crystallisation, softer limestone members and the rains that still fell in the early third millennium BCE. The archaeology points one way: the Sphinx Temple was built from blocks cut out of the Sphinx ditch, the enclosure sits against Khafre&#x27;s causeway, and no tools, pottery, hearths or buildings of an older culture have been found on the plateau. A dated older layer would change this rating.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Museum labels state flatly that Khafre built the Sphinx. That is the best reading, but it rests on context, not an inscription: no contemporary text names him as its builder. The textbooks are slightly overconfident about the attribution, and too dismissive of the fact that the weathering question was raised by a qualified geologist. The challenger case, though, still lacks any artefact from the supposed older culture.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Proto-cuneiform tablets from Uruk date to about 3300–3100 BCE, and most record administration rather than stories.<small>Englund 1998; Woods 2010</small></li><li>Writing was invented independently at least three times: in Mesopotamia, China and Mesoamerica, and probably also in Egypt.<small>Woods 2010</small></li><li>The Great Pyramid was built for Khufu around 2560 BCE, and a logbook by an official named Merer records limestone deliveries to it.<small>Lehner 1997; Tallet and Lehner 2021</small></li><li>Mohenjo-daro covered about 250 hectares, with hundreds of wells and street drains, at its height around 2500 BCE.<small>Kenoyer 1998</small></li><li>Caral in Peru was a planned monumental centre by about 2600 BCE, without pottery and without known fortifications.<small>Shady Solís et al. 2001</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the Indus script records a spoken language at all, and which one.</li><li>How the Great Pyramid&#x27;s blocks were raised, and how large the workforce was.</li><li>Whether the Great Sphinx was carved under Khafre around 2500 BCE or reworked from a much older monument.</li><li>Whether Egyptian writing was inspired by Mesopotamian contact or invented on its own.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Most early writing was on perishable media (papyrus, wood, cloth, bamboo), so the clay and stone that survive give a biased picture.</li><li>The oldest levels of Uruk, Mohenjo-daro and many Nile towns lie below the water table or under later cities and have barely been reached.</li><li>No bilingual inscription has ever been found for the Indus script.</li></ul></div></div><h3 class="sub-h wsub">The bold reading</h3><div class="face"><div class="face-c face-x" style="grid-column:1/-1"><p>In 1991 Boston University geologist Robert Schoch, invited by the writer John Anthony West, argued that the walls of the Great Sphinx&#x27;s enclosure were weathered by long periods of rainfall, which would place the carving of its core body in a wetter age thousands of years before Khafre. He first suggested about 7000–5000 BCE and later earlier still. Graham Hancock took up the argument in Fingerprints of the Gods (1995) as a trace of a forgotten civilisation whose legacy the dynastic Egyptians inherited.</p><div class="face-s"><b>Its strongest point</b><p>The Sphinx enclosure walls show deep, rounded vertical fissures and a rolling profile that Schoch reads as precipitation-induced weathering, unlike the wind-scoured faces of many Old Kingdom tombs cut into the same plateau.</p></div><p class="face-cr"><b>Credit</b> Robert Schoch; John Anthony West; Graham Hancock</p></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,055 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of First Cities and Writing"><button type="button" class="wtoc-i" data-go="age-08-s1">Somebody needed to count the barley</button><button type="button" class="wtoc-i" data-go="age-08-s2">Four starts, not one</button><button type="button" class="wtoc-i" data-go="age-08-s3">Pyramids and the paperwork of Khufu</button><button type="button" class="wtoc-i" data-go="age-08-s4">The script that will not speak</button><button type="button" class="wtoc-i" data-go="age-08-s5">The Sphinx question</button><button type="button" class="wtoc-i" data-go="age-08-s6">What the clay does not show</button></nav></div><section class="wsec" id="age-08-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Somebody needed to count the barley</h3><p>Uruk, southern Iraq, around 3200 BCE. The city is enormous for its time, with perhaps tens of thousands of people, temple precincts faced with mosaics of coloured clay cones, and canals branching off the Euphrates. In a storeroom an official wets a lump of clay, flattens it, and presses a reed into it: a sign for barley, marks for quantities, a sign group that may be a name or a job title. About 85% of the earliest tablets are records like this, of rations, sheep, workers and beer. Nobody here thinks they are inventing history. They are trying not to lose track of the grain.</p><p>Within a few centuries of this moment, the world changes shape. Cities, kings, scripts, standard weights and monuments appear in Mesopotamia, then Egypt, the Indus valley, China&#x27;s Yangtze delta and the desert coast of Peru. It looks like a starting gun. The question for this age is whether it really was one, or whether we are seeing only the first chapter that happened to be written on clay and stone.</p><blockquote class="wpull"><p>Writing was not invented for poetry. It was invented because a city could no longer remember its own accounts.</p></blockquote></section><section class="wsec" id="age-08-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Four starts, not one</h3><p>The striking thing about this age is that it happened more than once. Egypt&#x27;s earliest hieroglyphs, on small bone and ivory labels from a tomb at Abydos, date to about 3250 BCE, and around 3100 BCE the Nile valley was united under one king. Writing was invented independently at least three times in world history, in Mesopotamia, China and Mesoamerica, and probably in Egypt as well.</p><figure class="wx wx--static" id="age-08-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Four starts, not one: early cities side by side</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Four starts, not one: early cities side by side"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 472" class="wx-svg" role="img" aria-labelledby="age-08-f1-t"><title id="age-08-f1-t">Timeline of early cities in six regions from 3600 to 1800 BCE</title><line class="wx-guide" x1="160" y1="50" x2="160" y2="426"/><text class="wx-t-s" x="160" y="444" text-anchor="middle">3600</text><line class="wx-guide" x1="220" y1="50" x2="220" y2="426"/><text class="wx-t-s" x="220" y="444" text-anchor="middle">3400</text><line class="wx-guide" x1="280" y1="50" x2="280" y2="426"/><text class="wx-t-s" x="280" y="444" text-anchor="middle">3200</text><line class="wx-guide" x1="340" y1="50" x2="340" y2="426"/><text class="wx-t-s" x="340" y="444" text-anchor="middle">3000</text><line class="wx-guide" x1="400" y1="50" x2="400" y2="426"/><text class="wx-t-s" x="400" y="444" text-anchor="middle">2800</text><line class="wx-guide" x1="460" y1="50" x2="460" y2="426"/><text class="wx-t-s" x="460" y="444" text-anchor="middle">2600</text><line class="wx-guide" x1="520" y1="50" x2="520" y2="426"/><text class="wx-t-s" x="520" y="444" text-anchor="middle">2400</text><line class="wx-guide" x1="580" y1="50" x2="580" y2="426"/><text class="wx-t-s" x="580" y="444" text-anchor="middle">2200</text><line class="wx-guide" x1="640" y1="50" x2="640" y2="426"/><text class="wx-t-s" x="640" y="444" text-anchor="middle">2000</text><line class="wx-guide" x1="700" y1="50" x2="700" y2="426"/><text class="wx-t-s" x="700" y="444" text-anchor="middle">1800</text><text class="wx-t-s" x="700" y="460" text-anchor="end">years BCE</text><rect class="wx-fire wx-o20" style="--d:0" x="565" y="46" width="75" height="380"/><text class="wx-t-s wx-t-a" x="602.5" y="40" text-anchor="middle">4.2 ka drought</text><text class="wx-t-s" x="602.5" y="26" text-anchor="middle">next age:</text><text class="wx-t-cap" x="10" y="26">URBAN OR MONUMENTAL PHASE</text><text class="wx-t-b" x="20" y="80">Mesopotamia</text><text class="wx-t-s" x="20" y="95">Uruk, Akkad</text><rect class="wx-c1 wx-growx" style="--d:0" x="190" y="76" width="510" height="14" rx="3"/><text class="wx-t-b" x="702" y="87">›</text><circle class="wx-paper wx-edge wx-pop" style="--d:4" cx="250" cy="83" r="5"/><text class="wx-t-s wx-halo" x="250" y="70" text-anchor="middle">first clay tablets (3300)</text><circle class="wx-paper wx-edge wx-pop" style="--d:4" cx="539.8" cy="83" r="5"/><text class="wx-t-s wx-halo" x="539.8" y="108" text-anchor="middle">Akkad (2334)</text><text class="wx-t-b" x="20" y="142">Egypt</text><text class="wx-t-s" x="20" y="157">Nile valley</text><rect class="wx-c2 wx-growx" style="--d:1" x="310" y="138" width="275.7" height="14" rx="3"/><rect class="wx-c2 wx-growx" style="--d:1" x="623.5" y="138" width="76.5" height="14" rx="3"/><text class="wx-t-b" x="702" y="149">›</text><circle class="wx-paper wx-edge wx-pop" style="--d:5" cx="310" cy="145" r="5"/><text class="wx-t-s wx-halo" x="310" y="132" text-anchor="middle">one kingdom (3100)</text><circle class="wx-paper wx-edge wx-pop" style="--d:5" cx="472" cy="145" r="5"/><text class="wx-t-s wx-halo" x="472" y="170" text-anchor="middle">Great Pyramid (2560)</text><text class="wx-t-b" x="20" y="204">Indus</text><text class="wx-t-s" x="20" y="219">Mohenjo-daro, Harappa</text><rect class="wx-c3 wx-o40 wx-growx" style="--d:2" x="250" y="200" width="210" height="14" rx="3"/><rect class="wx-c3 wx-growx" style="--d:2" x="460" y="200" width="210" height="14" rx="3"/><circle class="wx-paper wx-edge wx-pop" style="--d:6" cx="490" cy="207" r="5"/><text class="wx-t-s wx-halo" x="490" y="232" text-anchor="middle">drains, wells, script (c. 2500)</text><text class="wx-t-b" x="20" y="266">China</text><text class="wx-t-s" x="20" y="281">Liangzhu</text><rect class="wx-c7 wx-growx" style="--d:3" x="250" y="262" width="300" height="14" rx="3"/><circle class="wx-paper wx-edge wx-pop" style="--d:7" cx="310" cy="269" r="5"/><text class="wx-t-s wx-halo" x="310" y="256" text-anchor="middle">dams (3100)</text><circle class="wx-paper wx-edge wx-pop" style="--d:7" cx="550" cy="269" r="5"/><text class="wx-t-s wx-halo" x="550" y="294" text-anchor="middle">abandoned (2300)</text><text class="wx-t-b" x="20" y="328">Peru</text><text class="wx-t-s" x="20" y="343">Caral, Supe valley</text><rect class="wx-c6 wx-growx" style="--d:4" x="460" y="324" width="180" height="14" rx="3"/><circle class="wx-paper wx-edge wx-pop" style="--d:8" cx="460" cy="331" r="5"/><text class="wx-t-s wx-halo" x="460" y="356" text-anchor="middle">platform mounds, no walls (2600)</text><text class="wx-t-b" x="20" y="390">Britain</text><text class="wx-t-s" x="20" y="405">Stonehenge</text><rect class="wx-c5 wx-o40 wx-growx" style="--d:5" x="340" y="386" width="150" height="14" rx="3"/><rect class="wx-c5 wx-growx" style="--d:5" x="490" y="386" width="210" height="14" rx="3"/><text class="wx-t-b" x="702" y="397">›</text><circle class="wx-paper wx-edge wx-pop" style="--d:9" cx="490" cy="393" r="5"/><text class="wx-t-s wx-halo" x="490" y="418" text-anchor="middle">sarsen circle (2500)</text></svg></div></div><figcaption>The urban or monumental phases of six regions on one time axis. Bars are approximate; faded ends show uncertain beginnings or slow endings. <span class="wx-src">Based on: Dates after Englund 1998, Woods 2010, Lehner 1997, Kenoyer 1998, Liu et al. 2017, Shady Solís et al. 2001 and Darvill et al. 2012.</span></figcaption><p class="vh">A timeline from 3600 to 1800 BCE with six horizontal lanes. Mesopotamia&#x27;s bar starts about 3500 BCE with the first tablets at 3300 BCE. Egypt&#x27;s begins with unification at 3100 BCE and marks the Great Pyramid at 2560 BCE, then breaks at 2181 BCE. The Indus bar runs from 2600 to 1900 BCE. China&#x27;s Liangzhu runs from 3300 to 2300 BCE with dams about 3100 BCE. Peru&#x27;s Caral runs from 2600 to 2000 BCE. Britain&#x27;s Stonehenge runs from 3000 BCE with the sarsen circle at 2500 BCE. A shaded band at 2200 BCE marks the 4.2 kiloyear drought.</p></figure><p>In the Indus valley, cities such as Mohenjo-daro and Harappa reached their mature form around 2600 BCE. Mohenjo-daro covered about 250 hectares and housed perhaps 40,000 people. Its builders used bricks of standard proportions, sank more than 700 wells, and ran covered drains along the streets, a level of municipal plumbing many European towns did not match until the 19th century. The Great Bath, a waterproofed brick pool about 12 by 7 metres and 2.4 metres deep, still has its steps.</p><p>On the other side of the world, in Peru&#x27;s Supe valley, Caral was a planned centre of platform mounds and sunken circular plazas by about 2600 BCE, as radiocarbon dates published in Science in 2001 showed. Its people had no pottery and, as far as excavators can tell, no walls, weapons or massacre graves. In China, the Liangzhu culture built a system of earthen dams more than 5,000 years ago to manage floods around its walled capital.</p></section><section class="wsec" id="age-08-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Pyramids and the paperwork of Khufu</h3><p>Egypt&#x27;s builders moved from mud-brick tombs to Djoser&#x27;s Step Pyramid around 2650 BCE, and within a century to the Great Pyramid of Khufu, finished around 2560 BCE at about 146.6 metres tall. It stayed the tallest human-made structure for around 3,800 years. In 2013, at the Red Sea harbour of Wadi al-Jarf, Pierre Tallet&#x27;s team found the oldest inscribed papyri yet known: the logbook of an inspector named Merer, whose crew of about 40 men shipped white limestone from the Tura quarries to Giza. In 2024 satellite radar and sediment cores revealed a buried branch of the Nile running beside 31 pyramids, which probably served as their transport canal.</p><aside class="wcall"><b>How do we know?</b><p>Merer&#x27;s diary gives the building in the words of someone who was there: dates, sailing times, a basin called the &#x27;Lake of Khufu&#x27; near the site. It confirms an organised, provisioned workforce, not slaves under whips. It does not tell us how the blocks were lifted; that remains one of the most argued questions in archaeology.</p></aside></section><section class="wsec" id="age-08-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The script that will not speak</h3><p>About 5,000 Indus inscriptions are known, mostly on small stone seals carved with animals such as the &#x27;unicorn&#x27; bull. They average about five signs each, and scholars count somewhere between 400 and 700 distinct signs. Dozens of decipherments have been announced; none has produced readings that others can check against new finds. A 2009 statistical study argued the sign sequences behave like language, while critics argue the inscriptions are too short to tell. In 2025 the government of Tamil Nadu offered a prize of US$1 million to anyone who can crack it.</p><p>This is a reminder of how fragile knowledge is. A whole civilisation of perhaps a million or more people across an area larger than Egypt and Mesopotamia combined left us thousands of messages, and we cannot read one of them.</p></section><section class="wsec" id="age-08-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The Sphinx question</h3><p>Here the challengers have a real argument. In 1991 geologist Robert Schoch, encouraged by the writer John Anthony West, told the Geological Society of America that the walls of the Sphinx enclosure look rain-weathered: deep vertical fissures and a rounded, rolling profile. Long periods of rainfall, he argued, point to a time before the Old Kingdom, when Egypt was wetter. Graham Hancock and others took this as a clue that the dynastic Egyptians inherited a much older monument from a forgotten culture.</p><p>The mainstream reply, led by Egyptologist Mark Lehner and geologists such as K. Lal Gauri and James Harrell, is that the limestone layers of the enclosure are of very different hardness, that salts drawn up from the ground and dissolved by dew crumble the rock quickly, and that occasional heavy rains still fell in the third millennium BCE. The archaeological context is harder to wave away: the blocks of the Sphinx Temple were quarried from the Sphinx ditch itself, and the enclosure respects the line of Khafre&#x27;s causeway. After a century of digging on the plateau, no pottery, tools or hearths of an older culture have been found.</p><blockquote class="wpull"><p>The weathering question was fair to ask. What the older-Sphinx theory still lacks is a single object left by the people who supposedly carved it.</p></blockquote></section><section class="wsec" id="age-08-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What the clay does not show</h3><p>This age may look like the beginning mainly because clay and stone survive. Papyrus, wood, textiles and bamboo usually do not. The deepest levels of Uruk and Mohenjo-daro sit at or below the water table and have barely been reached, and the Nile&#x27;s floodplain has buried its earliest towns under metres of silt. Caral itself was dismissed as a late site until radiocarbon dates showed it was as old as the pyramids.</p><p>And earlier chapters did exist: Göbekli Tepe&#x27;s enclosures were already 6,000 years old when Uruk&#x27;s scribes pressed their first signs, and Çatalhöyük housed thousands of people long before any king. The first cities were not a bolt from the blue. They were the part of a much longer story that started keeping records.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">3,300 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">First proto-cuneiform tablets at Uruk</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">3,250 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Inscribed labels in tomb U-j at Abydos, Egypt</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">3,100 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Egypt unified under one king</span></li><li class="wtl-build" style="--i:3"><span class="wtl-y">3,100 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Liangzhu&#x27;s dams under construction, China</span></li><li class="wtl-build" style="--i:4"><span class="wtl-y">2,650 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Djoser&#x27;s Step Pyramid, the first great stone building</span></li><li class="wtl-build" style="--i:5"><span class="wtl-y">2,600 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Caral&#x27;s platform mounds; Indus cities reach their mature phase</span></li><li class="wtl-build" style="--i:6"><span class="wtl-y">2,560 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Great Pyramid finished for Khufu</span></li><li class="wtl-build" style="--i:7"><span class="wtl-y">2,500 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Stonehenge&#x27;s sarsen circle raised</span></li><li class="wtl-event" style="--i:8"><span class="wtl-y">2,334 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Sargon founds the Akkadian empire (traditional date)</span></li><li class="wtl-loss" style="--i:9"><span class="wtl-y">2,300 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Liangzhu abandoned</span></li></ol><h3 class="sub-h wsub">Go deeper</h3><div class="links-row"><button type="button" onclick="openItem('articles','case-babel')">The Tower of Babel Stood in Babylon <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-gilgamesh')">Gilgamesh <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-flood')">The Flood <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-great-pyramid')">Great Pyramid <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-stonehenge')">Stonehenge <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-gobekli-tepe')">Göbekli Tepe <span aria-hidden="true">→</span></button></div><details class="srcs"><summary>Sources for this age (16)</summary><ol><li>Englund, R. K. (1998). Texts from the Late Uruk Period. In: Mesopotamien: Späturuk-Zeit und Frühdynastische Zeit. Orbis Biblicus et Orientalis 160/1.</li><li>Woods, C. (ed.) (2010). Visible Language: Inventions of Writing in the Ancient Middle East and Beyond. Oriental Institute, Chicago.</li><li>Algaze, G. (2008). Ancient Mesopotamia at the Dawn of Civilization. University of Chicago Press.</li><li>Dreyer, G. (1998). Umm el-Qaab I: Das prädynastische Königsgrab U-j und seine frühen Schriftzeugnisse. Philipp von Zabern.</li><li>Lehner, M. (1997). The Complete Pyramids. Thames &amp; Hudson.</li><li>Tallet, P. &amp; Lehner, M. (2021). The Red Sea Scrolls: How Ancient Papyri Reveal the Secrets of the Pyramids. Thames &amp; Hudson.</li><li>Ghoneim, E. et al. (2024). The Egyptian pyramid chain was built along the now abandoned Ahramat Nile Branch. Communications Earth &amp; Environment 5: 233. <a href="https://doi.org/10.1038/s43247-024-01379-7" target="_blank" rel="noopener">doi:10.1038/s43247-024-01379-7</a></li><li>Kenoyer, J. M. (1998). Ancient Cities of the Indus Valley Civilization. Oxford University Press.</li><li>Parpola, A. (1994). Deciphering the Indus Script. Cambridge University Press.</li><li>Rao, R. P. N. et al. (2009). Entropic evidence for linguistic structure in the Indus script. Science 324: 1165. <a href="https://doi.org/10.1126/science.1170391" target="_blank" rel="noopener">doi:10.1126/science.1170391</a></li><li>Shady Solís, R., Haas, J. &amp; Creamer, W. (2001). Dating Caral, a preceramic site in the Supe Valley on the central coast of Peru. Science 292: 723–726. <a href="https://doi.org/10.1126/science.1059519" target="_blank" rel="noopener">doi:10.1126/science.1059519</a></li><li>Liu, B. et al. (2017). Earliest hydraulic enterprise in China, 5,100 years ago. PNAS 114: 13637–13642. <a href="https://doi.org/10.1073/pnas.1710516114" target="_blank" rel="noopener">doi:10.1073/pnas.1710516114</a></li><li>Darvill, T. et al. (2012). Stonehenge remodelled. Antiquity 86: 1021–1040. <a href="https://doi.org/10.1017/S0003598X00048225" target="_blank" rel="noopener">doi:10.1017/S0003598X00048225</a></li><li>Schoch, R. M. (1992). Redating the Great Sphinx of Giza. KMT: A Modern Journal of Ancient Egypt 3(2): 52–59, 66–70.</li><li>Gauri, K. L., Sinai, J. J. &amp; Bandyopadhyay, J. K. (1995). Geologic weathering and its implications on the age of the Sphinx. Geoarchaeology 10: 119–133.</li><li>Lehner, M. &amp; Hawass, Z. (2017). Giza and the Pyramids. Thames &amp; Hudson.</li></ol></details></div></script><script type="text/x-tpl" id="age-09-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Disk of Enheduanna (2).jpg" data-cap="The Disk of Enheduanna" data-big><figcaption></figcaption></figure><div class="sh-k">c. 4,300–3,900 years ago</div><h2 class="sh-t" id="age-09-st" tabindex="-1">The 4.2 Kiloyear Collapse</h2><p class="sh-s">Dust storms, failed floods and empty cities: the first recorded age of collapse is so clear that geologists named an age after it.</p><div class="sh-v"><span class="vstamp vstamp--phase" style="--vc:var(--carnelian)"><span aria-hidden="true">▼</span>Fall</span></div></div><p class="v4-q">Did one megadrought bring down the first empires?</p><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="4250" >4,250</b><span class="ctr-u"> years before 2000 CE</span></div><div class="ctr-l">start of the Meghalayan Age, defined by a stalagmite</div><div class="ctr-c">Walker et al. 2018</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="290" >290</b><span class="ctr-u"> years</span></div><div class="ctr-l">length of the dust episode in Gol-e Zard cave, Iran</div><div class="ctr-c">Carolin et al. 2019</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="300" >300</b><span class="ctr-u"> years</span></div><div class="ctr-l">gap in occupation at Tell Leilan after c. 2200 BCE</div><div class="ctr-c">Weiss et al. 1993</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="125" >125</b><span class="ctr-u"> years</span></div><div class="ctr-l">of divided rule in Egypt&#x27;s First Intermediate Period</div><div class="ctr-c">Shaw (ed.) 2000</div></div></div><div class="rf"><div class="rf-c rf-up"><h3 class="rf-h"><span aria-hidden="true">▲</span> What rose</h3><ul><li>Survivors and successors: the Third Dynasty of Ur in Mesopotamia, with its great ziggurats, after Akkad fell</li><li>Egypt&#x27;s Middle Kingdom, reunited around 2055 BCE, with a literature that looked back on chaos</li><li>New villages and farming strategies on the edges of the old Indus heartland and in the Ganga plain</li></ul></div><div class="rf-c rf-down"><h3 class="rf-h"><span aria-hidden="true">▼</span> What fell or was lost</h3><ul><li>The Akkadian empire, the first to rule most of Mesopotamia</li><li>Egypt&#x27;s Old Kingdom, which dissolved into the First Intermediate Period (c. 2181–2055 BCE)</li><li>Dozens of towns on the dry-farming plains of northern Syria, including Tell Leilan</li><li>The great Indus cities, which emptied gradually from about 1900 BCE</li><li>Liangzhu in China, abandoned a little earlier, around 2300 BCE</li></ul></div></div><h3 class="sub-h wsub">What drove it</h3><div class="trigs"><div class="trig"><b>Abrupt drying and dust</b><span>A cave in Iran records a rise in windblown dust from about 4,260 to 3,970 years ago, and a Gulf of Oman core shows a spike of Mesopotamian dust (Carolin et al. 2019; Cullen et al. 2000).</span></div><div class="trig"><b>Weakened monsoon</b><span>The Mawmluh Cave stalagmite in northeast India, lake cores in northwest India and Arabian Sea sediments record weaker monsoon rains around 4,200 years ago (Berkelhammer et al. 2012; Dixit et al. 2014).</span></div><div class="trig"><b>Low Nile floods</b><span>Nile delta sediments point to reduced Nile flow at the end of the Old Kingdom (Stanley et al. 2003).</span></div><div class="trig"><b>Political strain</b><span>Egypt&#x27;s provincial governors had grown powerful and Akkad faced repeated revolts and Gutian incursions before the worst drought (Butzer 2012).</span></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>A global megadrought around 4,200 years ago caused the fall of the Akkadian empire, Egypt&#x27;s Old Kingdom and the Indus cities.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:50.0%" role="img" aria-label="Weight of evidence: Mixed record"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Part of this holds up well: many records from the eastern Mediterranean to India show a sharp dry, dusty phase, and its timing fits the end of Akkad and the Old Kingdom closely. Other parts do not: the Indus cities declined some three centuries later and gradually, Liangzhu fell earlier and apparently to floods, and in Egypt the Old Kingdom was already fragmenting. Drought looks like a powerful stress on fragile states, not a single global switch.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 3 of 6, leaning one way"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>leaning one way</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Older textbooks blamed Akkad&#x27;s fall on invading Gutians, repeating a Mesopotamian poem, and treated Egypt&#x27;s First Intermediate Period as purely political. Newer popular accounts swing to the opposite certainty, a planet-wide drought toppling empires. The evidence sits between: a real, regionally severe drying whose effects depended on how each society was already organised. Both versions have been more confident than the record allows.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>A climate shift around 4,200 years ago is recorded widely enough that it marks the start of the Meghalayan Age, the latest formal slice of the Holocene, from 4,250 years before 2000 CE.<small>Walker et al. 2018; Walker et al. 2019</small></li><li>Tell Leilan in northeast Syria was abandoned around 2200 BCE, and its abandonment layer is covered by windblown silt.<small>Weiss et al. 1993</small></li><li>Egypt&#x27;s Old Kingdom ended around 2181 BCE, followed by roughly 125 years of divided rule.<small>Shaw (ed.) 2000</small></li><li>Drier or dustier conditions around this time are recorded in caves, lakes and marine cores from the eastern Mediterranean to India.<small>Bini et al. 2019; Carolin et al. 2019</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the drought caused the collapses, or struck states already failing for political reasons.</li><li>How global the event was: some regions show drying, some show wetter conditions, and the timing differs by up to centuries.</li><li>Whether the Indus decline around 1900 BCE belongs to the same event at all.</li><li>Whether the Egyptian &#x27;lament&#x27; texts describe this period or were written generations later as literature.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Most farming villages of the period were mud-brick and have eroded or lie under later towns, so we see collapse mainly through the few excavated tells.</li><li>Dates for the Akkadian kings depend on which Mesopotamian chronology is used, which can shift events by decades.</li><li>Few climate records sit right next to the sites whose fate they are used to explain.</li></ul></div></div><h3 class="sub-h wsub">The bold reading</h3><div class="face"><div class="face-c face-x" style="grid-column:1/-1"><p>Archaeologist Harvey Weiss, excavator of Tell Leilan, argued from 1993 onward that an abrupt megadrought struck the whole of west Asia around 2200 BCE, emptying the dry-farming plains of northern Mesopotamia, sending refugees south and bringing down the Akkadian empire, with echoes in Egypt and the Indus. It was a bold challenge to histories that explained collapse through kings, rebels and invaders. Soil scientist Marie-Agnès Courty went further, proposing that an unusual debris layer at Leilan and other sites came from a cosmic airburst.</p><div class="face-s"><b>Its strongest point</b><p>At Tell Leilan the last Akkadian-period floors are sealed by sterile, windblown silt with no occupation for about 300 years, and dust peaks in cave and ocean records fall at the same time.</p></div><p class="face-cr"><b>Credit</b> Harvey Weiss (climate-driven collapse); Marie-Agnès Courty (an impact variant)</p></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">4 min read · 923 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of The 4.2 Kiloyear Collapse"><button type="button" class="wtoc-i" data-go="age-09-s1">The first great crash</button><button type="button" class="wtoc-i" data-go="age-09-s2">Dust on the floors of Tell Leilan</button><button type="button" class="wtoc-i" data-go="age-09-s3">A golden spike in a cave</button><button type="button" class="wtoc-i" data-go="age-09-s4">Egypt: when the Nile ran low</button><button type="button" class="wtoc-i" data-go="age-09-s5">Not one switch, but many stresses</button><button type="button" class="wtoc-i" data-go="age-09-s6">What we still cannot see</button></nav></div><section class="wsec" id="age-09-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The first great crash</h3><p>Around 2200 BCE the world&#x27;s first empires were at a peak. Akkad, founded by Sargon, ruled from the Gulf to the upper Euphrates. Egypt&#x27;s pharaohs had been building pyramids for four centuries. The Indus cities traded seals and beads as far as Mesopotamia. Within a few generations the Akkadian empire had dissolved, Egypt had split into rival lordships, and the dry-farming towns of northern Syria stood empty. A few centuries later the great Indus cities were emptying too.</p><p>Ancient writers remembered it as a time of chaos. A Sumerian poem blamed Akkad&#x27;s fall on a god&#x27;s anger and on the Gutians, mountain people it described in unflattering terms. Modern scientists have found something the poets could only feel: dust in the caves, silt in the ruins, and a failing monsoon.</p><blockquote class="quote"><p>As if it had been before the time when cities were built and founded, the large arable tracts yielded no grain</p><cite>The Cursing of Agade, trans. J. A. Black et al., Electronic Text Corpus of Sumerian Literature (Oxford)</cite></blockquote></section><section class="wsec" id="age-09-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Dust on the floors of Tell Leilan</h3><p>In 1993 Harvey Weiss and his colleagues published a paper in Science that changed the debate. At Tell Leilan, a walled city on the rain-fed plains of northeast Syria, the last Akkadian-period floors were covered by a layer of fine windblown silt, with no sign of people for about three centuries. Nearby towns showed the same pattern. Weiss argued that an abrupt drought had wrecked rain-fed farming and sent people south toward the irrigated river valleys, where the next rulers built walls to keep newcomers out.</p><p>Later work filled in the climate side. A marine core from the Gulf of Oman showed a spike of dust blown from Mesopotamia. A stalagmite from Gol-e Zard cave in northern Iran, dated precisely with uranium series, recorded a surge in dust from about 4,260 to 3,970 years ago, a dry spell lasting roughly 290 years. Caves in Israel, lakes in Turkey and Italy and even the ice of Kilimanjaro record changes around the same time.</p><figure class="wx wx--steps" id="age-09-f1" data-n="3"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">The 4.2 kiloyear event across a map</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The 4.2 kiloyear event across a map"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 375" class="wx-svg" role="img" aria-labelledby="age-09-f1-t"><title id="age-09-f1-t">Map of climate records and societies around 4,200 years ago, from the Nile to the Yangtze</title><rect class="wx-water wx-o60" x="20" y="40" width="680" height="281.6"/><path class="wx-sand wx-edge-soft" d="M603.1,315.7 L611.8,316.2 L612.8,314.2 L621.2,316.5 L622.8,319.7 L629.6,320.6 L631.7,321.64 L610.4,321.64 L606.7,320.4 L603.4,319.9 L601.5,320.5 L593.3,318.5 L592.5,316.4 L588.3,316.1 L591.4,311.4 L596.9,311.7 L600.6,313.6 L602.5,314 L603.1,315.7ZM687.5,299.6 L685.8,301.2 L682.7,300.3 L681.8,298.2 L686.4,298 L687.5,299.6ZM700,299.5 L696.2,299.1 L693.6,299.4 L690.5,299.3 L691.5,296.6 L697.2,296.4 L700,297.2ZM678.4,275.9 L674.8,280.7 L671.4,281.6 L667,280.7 L659.5,280.9 L655.5,281.6 L654.9,285.3 L658.9,289.6 L661.3,287.4 L669.8,285.8 L669.4,288 L667.5,287.3 L665.5,290.2 L661.5,292 L665.8,298.3 L665,299.9 L669,305.
