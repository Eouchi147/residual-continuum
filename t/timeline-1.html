0" cx="336" cy="264" rx="6" ry="2.6"/><circle class="wx-inkfill wx-o60" cx="344" cy="262.5" r="1.4"/><ellipse class="wx-inkfill wx-o60" cx="388" cy="264" rx="6" ry="2.6"/><circle class="wx-inkfill wx-o60" cx="396" cy="262.5" r="1.4"/></g><path class="wx-dash wx-draw" pathLength="1" style="--d:9" d="M150,231 H430"/><g class="wx-pop" style="--d:10"><ellipse class="wx-inkfill wx-o60" cx="197" cy="232" rx="6" ry="2.6"/><circle class="wx-inkfill wx-o60" cx="205" cy="230.5" r="1.4"/><ellipse class="wx-inkfill wx-o60" cx="249" cy="232" rx="6" ry="2.6"/><circle class="wx-inkfill wx-o60" cx="257" cy="230.5" r="1.4"/><ellipse class="wx-inkfill wx-o60" cx="301" cy="232" rx="6" ry="2.6"/><circle class="wx-inkfill wx-o60" cx="309" cy="230.5" r="1.4"/><ellipse class="wx-inkfill wx-o60" cx="353" cy="232" rx="6" ry="2.6"/><circle class="wx-inkfill wx-o60" cx="361" cy="230.5" r="1.4"/><ellipse class="wx-inkfill wx-o60" cx="405" cy="232" rx="6" ry="2.6"/><circle class="wx-inkfill wx-o60" cx="413" cy="230.5" r="1.4"/></g><path class="wx-dash wx-draw" pathLength="1" style="--d:10" d="M150,197 H430"/><g class="wx-pop" style="--d:11"><ellipse class="wx-inkfill wx-o60" cx="184" cy="198" rx="6" ry="2.6"/><circle class="wx-inkfill wx-o60" cx="192" cy="196.5" r="1.4"/><ellipse class="wx-inkfill wx-o60" cx="236" cy="198" rx="6" ry="2.6"/><circle class="wx-inkfill wx-o60" cx="244" cy="196.5" r="1.4"/><ellipse class="wx-inkfill wx-o60" cx="288" cy="198" rx="6" ry="2.6"/><circle class="wx-inkfill wx-o60" cx="296" cy="196.5" r="1.4"/><ellipse class="wx-inkfill wx-o60" cx="340" cy="198" rx="6" ry="2.6"/><circle class="wx-inkfill wx-o60" cx="348" cy="196.5" r="1.4"/><ellipse class="wx-inkfill wx-o60" cx="392" cy="198" rx="6" ry="2.6"/><circle class="wx-inkfill wx-o60" cx="400" cy="196.5" r="1.4"/></g><text class="wx-t-b" x="140" y="232" text-anchor="end">footprint</text><text class="wx-t-b" x="140" y="248" text-anchor="end">surfaces</text><path class="wx-line" marker-end="url(#age-03-f2-ak)" d="M110,356 V150"/><text class="wx-t-s" x="100" y="366" text-anchor="middle">older</text><text class="wx-t-s" x="100" y="144" text-anchor="middle">younger</text><g class="wx-pop" style="--d:12"><ellipse class="wx-green wx-edge" cx="210" cy="280" rx="5" ry="3.2"/><ellipse class="wx-green wx-edge" cx="290" cy="214" rx="5" ry="3.2"/><ellipse class="wx-green wx-edge" cx="370" cy="180" rx="5" ry="3.2"/><circle class="wx-glow wx-edge" cx="250" cy="246" r="4.5"/><circle class="wx-glow wx-edge" cx="340" cy="212" r="4.5"/><polygon class="wx-paper wx-edge" points="195,217 199,209 205,213 203,218"/><polygon class="wx-paper wx-edge" points="395,251 399,243 405,247 403,252"/></g><ellipse class="wx-green wx-edge" cx="452" cy="150" rx="5" ry="3.2"/><text class="wx-t-b" x="466" y="154">Ditchgrass seeds</text><text class="wx-t-s" x="466" y="170">radiocarbon: c. 23,000–21,000 yrs (2021)</text><path class="wx-thin" d="M444,150 L378,180"/><circle class="wx-glow wx-edge" cx="452" cy="206" r="4.5"/><text class="wx-t-b" x="466" y="210">Conifer pollen</text><text class="wx-t-s" x="466" y="226">radiocarbon: same age range (2023)</text><path class="wx-thin" d="M444,206 L348,212"/><polygon class="wx-paper wx-edge" points="447,265 451,257 457,261 455,266"/><text class="wx-t-b" x="466" y="266">Quartz grains</text><text class="wx-t-s" x="466" y="282">luminescence: at least c. 21,000 (2023)</text><path class="wx-thin" d="M444,262 L408,248"/><rect class="wx-c2 wx-o60" x="446" y="314" width="12" height="8"/><text class="wx-t-b" x="466" y="322">Old lake beds</text><text class="wx-t-s" x="466" y="338">lake chronology agrees (2025)</text><path class="wx-thin" d="M444,318 L418,340"/><text class="wx-t-s" x="16" y="400">The worry in 2021: water plants can take up 'old' carbon and look too old. Pollen and quartz do not share that</text><text class="wx-t-s" x="16" y="415">problem, and they give the same answer. Layer thicknesses schematic.</text></svg></div></div><figcaption>The footprints lie between layers that were dated by four independent methods. Layer thicknesses are schematic. <span class="wx-src">Based on: Bennett et al. 2021; Pigati et al. 2023; Holliday et al. 2025; stratigraphy simplified.</span></figcaption><p class="vh">A layered block of lake sediments beneath gypsum dunes. Three dashed lines inside mark footprint surfaces with small dark footprints on them. An arrow on the left shows older at the bottom and younger at the top. Small symbols in the layers mark sampled seeds, pollen grains and quartz grains, with leader lines to labels on the right: ditchgrass seeds dated by radiocarbon to about 23,000 to 21,000 years, conifer pollen with the same age range, quartz grains dated by luminescence to at least about 21,000 years, and old lake beds whose chronology agrees.</p></figure><aside class="wcall"><b>How do we know?</b><p>Radiocarbon measures the decay of carbon-14 in once-living things, such as seeds and pollen. Luminescence measures how long quartz grains have been buried out of sunlight. The two methods rely on different physics and different materials, so when they agree, a shared error becomes much less likely.</p></aside></section><section class="wsec" id="age-03-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Art in the deep cold</h3><p>In Europe, people pulled back into warmer refuges in Iberia, southern France, Italy and the Balkans. Life there was not merely survival. The Lascaux paintings, usually dated to c. 17,000–22,000 years ago, include nearly 6,000 figures, among them hundreds of horses and a famous shaft scene with a bird-headed man. Eyed bone needles made tailored clothing possible, and on the Russian and Ukrainian plains people built dwellings from mammoth bones.</p><p>In the Americas the puzzle is how anyone got south of the ice so early. The inland corridor between the great North American ice sheets was probably closed, or too barren to cross, around 23,000 years ago. Many researchers therefore favour a route down the Pacific coast by boat, following shorelines rich in kelp, fish and seals, an idea championed by Jon Erlandson as the &#x27;kelp highway&#x27;. Genetic studies suggest the ancestors of Native Americans were isolated for several thousand years, perhaps in Beringia, before spreading south. White Sands forces that clock earlier, and the coastal sites that could show the route are, once again, underwater.</p></section><section class="wsec" id="age-03-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>A lost civilisation on the shelves?</h3><p>Graham Hancock&#x27;s argument, developed in Underworld (2002) and later books, starts from a real gap. If the most attractive land was drowned, then perhaps a more advanced ice-age society lived there, and all we see inland are its hunter-gatherer neighbours. Danny Hilman Natawidjaja has argued that Gunung Padang, a terraced hilltop site in West Java, contains buried construction phases going back c. 27,000 years.</p><p>The test is what has been found. Dredging and trawling on the North Sea and other shelves have produced ice-age animal bones, stone tools and hunter-gatherer camps, but no masonry, metal, pottery or crops. Genetics shows no population with the signature of an early farming civilisation. In 2024 the Gunung Padang paper was retracted by its journal because the radiocarbon-dated soil had no demonstrated link to human work. The drowned-coast idea is a fair question; it is not yet a finding.</p></section><section class="wsec" id="age-03-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle it</h3><p>The answer lies under the sea. Systematic surveys of drowned river valleys and shorelines at depths of 40–130 m, cores through submerged sediments, and targeted underwater excavation would reveal what kind of people lived on the lost coasts. In the Americas, older sealed sites on the Pacific coast route would show how the first Americans arrived. Until then, the Ice Age holds the largest unexplored archive of human history.</p><p>It is worth being clear about both halves of the verdict. The lost coasts are real, vast and almost untouched by archaeology. The lost civilisation is, so far, a hypothesis without a single artefact. Both statements can be true at once, and only fieldwork on the seabed will move either of them.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">24,500 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Last Glacial Maximum begins</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">21,000 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">People walk the shores of a lake at White Sands</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">19,000 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Lowest sea level, c. 134 m below today</span></li><li class="wtl-build" style="--i:3"><span class="wtl-y">18,000 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Lascaux painted (c. 17,000–22,000 years ago)</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">17,000 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Ice sheets begin to retreat</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">14,000 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">People at Cooper&#x27;s Ferry, Idaho</span></li><li class="wtl-find" style="--i:6"><span class="wtl-y">1940 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Lascaux discovered</span></li><li class="wtl-find" style="--i:7"><span class="wtl-y">1991 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Cosquer Cave&#x27;s paintings made public</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2021 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">White Sands footprints published</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">2024 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Gunung Padang &#x27;pyramid&#x27; paper retracted</span></li></ol><h3 class="sub-h wsub">Go deeper</h3><div class="links-row"><button type="button" onclick="openItem('articles','case-drowned-coasts')">The Drowned Coasts <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-first-americans')">The First Americans <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-gunung-padang')">Gunung Padang <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-lost-civilization')">Was There a Lost Ice Age Civilisation? <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-atlantis')">Atlantis <span aria-hidden="true">→</span></button></div><details class="srcs"><summary>Sources for this age (16)</summary><ol><li>Clark P.U. et al. (2009). The Last Glacial Maximum. Science 325: 710–714. <a href="https://doi.org/10.1126/science.1172873" target="_blank" rel="noopener">doi:10.1126/science.1172873</a></li><li>Lambeck K. et al. (2014). Sea level and global ice volumes from the Last Glacial Maximum to the Holocene. PNAS 111: 15296–15303. <a href="https://doi.org/10.1073/pnas.1411762111" target="_blank" rel="noopener">doi:10.1073/pnas.1411762111</a></li><li>Hanebuth T., Stattegger K. &amp; Grootes P.M. (2000). Rapid flooding of the Sunda Shelf: a late-glacial sea-level record. Science 288: 1033–1035. <a href="https://doi.org/10.1126/science.288.5468.1033" target="_blank" rel="noopener">doi:10.1126/science.288.5468.1033</a></li><li>Bird M.I., Taylor D. &amp; Hunt C. (2005). Palaeoenvironments of insular Southeast Asia during the Last Glacial Period: a savanna corridor in Sundaland? Quaternary Science Reviews 24: 2228–2242.</li><li>Hoffecker J.F., Elias S.A. &amp; O&#x27;Rourke D.H. (2014). Out of Beringia? Science 343: 979–980.</li><li>Bennett M.R. et al. (2021). Evidence of humans in North America during the Last Glacial Maximum. Science 373: 1528–1531. <a href="https://doi.org/10.1126/science.abg7586" target="_blank" rel="noopener">doi:10.1126/science.abg7586</a></li><li>Pigati J.S. et al. (2023). Independent age estimates resolve the controversy of ancient human footprints at White Sands. Science 382: 73–75. <a href="https://doi.org/10.1126/science.adh5007" target="_blank" rel="noopener">doi:10.1126/science.adh5007</a></li><li>Holliday V.T. et al. (2025). Paleolake geochronology supports Last Glacial Maximum age for human tracks at White Sands, New Mexico. Science Advances 11: eadv4951. <a href="https://doi.org/10.1126/sciadv.adv4951" target="_blank" rel="noopener">doi:10.1126/sciadv.adv4951</a></li><li>Davis L.G. et al. (2019). Late Upper Paleolithic occupation at Cooper&#x27;s Ferry, Idaho, USA, ~16,000 years ago. Science 365: 891–897. <a href="https://doi.org/10.1126/science.aax9830" target="_blank" rel="noopener">doi:10.1126/science.aax9830</a></li><li>Dillehay T.D. et al. (2015). New archaeological evidence for an early human presence at Monte Verde, Chile. PLOS ONE 10: e0141923. <a href="https://doi.org/10.1371/journal.pone.0141923" target="_blank" rel="noopener">doi:10.1371/journal.pone.0141923</a></li><li>Erlandson J.M. et al. (2007). The kelp highway hypothesis: marine ecology, the coastal migration theory, and the peopling of the Americas. Journal of Island and Coastal Archaeology 2: 161–174.</li><li>Tamm E. et al. (2007). Beringian standstill and spread of Native American founders. PLOS ONE 2: e829. <a href="https://doi.org/10.1371/journal.pone.0000829" target="_blank" rel="noopener">doi:10.1371/journal.pone.0000829</a></li><li>Clottes J. &amp; Courtin J. (1996). The Cave Beneath the Sea: Paleolithic Images at Cosquer. New York: Harry N. Abrams.</li><li>Gaffney V., Fitch S. &amp; Smith D. (2009). Europe&#x27;s Lost World: The Rediscovery of Doggerland. York: Council for British Archaeology.</li><li>Hancock G. (2002). Underworld: Flooded Kingdoms of the Ice Age. London: Michael Joseph.</li><li>Natawidjaja D.H. et al. (2023, retracted 2024). Geo-archaeological prospecting of Gunung Padang buried prehistoric pyramid in West Java, Indonesia. Archaeological Prospection.</li></ol></details></div></script><script type="text/x-tpl" id="age-04-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Cherry Lake, Seaholme and Port Phillip Bay.jpg" data-cap="Port Phillip Bay, Victoria" data-big><figcaption></figcaption></figure><div class="sh-k">14,700–12,900 years ago</div><h2 class="sh-t" id="age-04-st" tabindex="-1">The Great Melt</h2><p class="sh-s">Greenland warmed by around 9 °C within decades, the sea surged, and in the Levant people settled into the first villages.</p><div class="sh-v"><span class="vstamp vstamp--phase" style="--vc:var(--malachite)"><span aria-hidden="true">▲</span>Rise</span></div></div><p class="v4-q">Could people have watched the coast move within a single lifetime?</p><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="9" >9</b><span class="ctr-u"> °C</span></div><div class="ctr-l">Greenland warming at the start of the Bølling, within decades</div><div class="ctr-c">Severinghaus &amp; Brook 1999</div></div><div class="ctr"><div class="ctr-v">c. 14–<b class="ctr-n" data-v="20" >20</b><span class="ctr-u"> m</span></div><div class="ctr-l">global sea-level rise in Meltwater Pulse 1A</div><div class="ctr-c">Deschamps et al. 2012; Lambeck et al. 2014</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="40" >40</b><span class="ctr-u"> mm a year</span></div><div class="ctr-l">peak rate of sea-level rise, about ten times today&#x27;s</div><div class="ctr-c">Lambeck et al. 2014</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="14400" >14,400</b><span class="ctr-u"> years</span></div><div class="ctr-l">age of the oldest known bread, Shubayqa 1, Jordan</div><div class="ctr-c">Arranz-Otaegui et al. 2018</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="14500" >14,500</b><span class="ctr-u"> years</span></div><div class="ctr-l">age of the Monte Verde camp in southern Chile</div><div class="ctr-c">Dillehay et al. 2015</div></div></div><div class="rf"><div class="rf-c rf-up"><h3 class="rf-h"><span aria-hidden="true">▲</span> What rose</h3><ul><li>Abrupt warming: the Bølling-Allerød interval, c. 14,700–12,900 years ago</li><li>Natufian hamlets of round stone houses in the Levant, with sickles, grinding stones and bread</li><li>People across both Americas, from Oregon and Florida to southern Chile</li><li>Dogs buried alongside people, in Germany and the Levant</li></ul></div><div class="rf-c rf-down"><h3 class="rf-h"><span aria-hidden="true">▼</span> What fell or was lost</h3><ul><li>Coastal plains worldwide, drowned by some 16–20 m of sea-level rise in a few centuries</li><li>Ice-dammed lakes that burst in megafloods, scouring whole landscapes</li><li>The old ice-age steppe, as forests spread north</li></ul></div></div><h3 class="sub-h wsub">What drove it</h3><div class="trigs"><div class="trig"><b>Abrupt northern warming</b><span>Gases trapped in Greenland ice show a warming of about 9 ± 3 °C within decades c. 14,700 years ago (Severinghaus &amp; Brook 1999).</span></div><div class="trig"><b>Ice-sheet collapse</b><span>Tahiti corals record 14–18 m of sea-level rise between c. 14,650 and 14,310 years ago (Deschamps et al. 2012); global models give c. 20 m in c. 500 years (Lambeck et al. 2014).</span></div><div class="trig"><b>Richer plant life</b><span>Wild cereals and nuts spread in the Levant as rainfall and temperature rose, supporting more settled foraging.</span></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>During Meltwater Pulse 1A the sea rose fast enough for people on low coasts to see their shoreline move within a single lifetime.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">At c. 40 mm a year, the sea rose about 2.4 m in 60 years. On very flat shelves such as the Sunda Shelf, a metre of rise can move the shore hundreds of metres to kilometres inland, so the change would have been visible within one life. The physical numbers come from independent coral, sediment and model records. What cannot be tested directly is whether anyone remembered it.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 3 of 6, leaning one way"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>leaning one way</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Popular accounts still describe the end of the Ice Age as a slow, steady warming and a gradual rise of the sea. The evidence shows steps and jolts: warmings of several degrees within decades and sea-level pulses ten times faster than today&#x27;s. On this point the textbooks sound calmer and more certain than the evidence allows.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Central Greenland warmed by about 9 ± 3 °C within a few decades at the start of the Bølling, c. 14,700 years ago.<small>Severinghaus &amp; Brook 1999</small></li><li>Meltwater Pulse 1A raised global sea level by roughly 14–20 m within a few centuries, at rates of c. 40 mm a year or more.<small>Deschamps et al. 2012; Lambeck et al. 2014</small></li><li>Natufian foragers at Shubayqa 1 in Jordan baked a flatbread-like food c. 14,400 years ago, some 4,000 years before farming.<small>Arranz-Otaegui et al. 2018</small></li><li>People were in the Americas well before Clovis: Monte Verde in Chile c. 14,500 years ago, Page-Ladson in Florida c. 14,550, Paisley Caves in Oregon c. 14,300.<small>Dillehay et al. 2015; Halligan et al. 2016; Gilbert et al. 2008</small></li><li>Giant ice-age floods from glacial Lake Missoula repeatedly scoured the Channeled Scablands of Washington State near the end of the Ice Age.<small>Bretz 1923; Baker 2009</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Where Meltwater Pulse 1A&#x27;s water came from: mostly Antarctica, mostly North America, or both.</li><li>Whether residues in 13,000-year-old stone mortars at Raqefet Cave show brewing of beer.</li><li>Whether any myths preserve memories of this particular surge of the sea, as opposed to later, slower rises.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>The coastlines people knew at the start of this age were drowned by its end; coastal Natufian and pre-Clovis sites would now be offshore.</li><li>Wooden boats, nets and basketry that would show how people moved along the coasts.</li><li>Only a handful of pre-Clovis sites have been excavated, in a continent-sized area.</li></ul></div></div><h3 class="sub-h wsub">The bold reading</h3><div class="face"><div class="face-c face-x" style="grid-column:1/-1"><p>Carlson and Hancock argue that the end of the Ice Age was not a gentle thaw but a series of catastrophes: abrupt warmings, bursting ice-dammed lakes, megafloods and sudden sea-level jumps, which people must have witnessed. They see the world&#x27;s flood stories as possible memories of this violent transition, and they point to how long geology resisted catastrophe before accepting it.</p><div class="face-s"><b>Its strongest point</b><p>J Harlen Bretz proposed a colossal flood to explain Washington&#x27;s Channeled Scablands in 1923 and was dismissed for decades; the megafloods are now textbook geology. Catastrophe at the end of the Ice Age is not fringe.</p></div><p class="face-cr"><b>Credit</b> Randall Carlson; Graham Hancock</p></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">4 min read · 975 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of The Great Melt"><button type="button" class="wtoc-i" data-go="age-04-s1">The thaw that was not gradual</button><button type="button" class="wtoc-i" data-go="age-04-s2">Seas on the move</button><button type="button" class="wtoc-i" data-go="age-04-s3">The first villagers</button><button type="button" class="wtoc-i" data-go="age-04-s4">Everywhere in the Americas</button><button type="button" class="wtoc-i" data-go="age-04-s5">The catastrophists&#x27; case</button><button type="button" class="wtoc-i" data-go="age-04-s6">What the melt erased</button></nav></div><section class="wsec" id="age-04-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The thaw that was not gradual</h3><p>About 14,700 years ago the North Atlantic world switched climate. Gases trapped in bubbles in the Greenland ice show that the air above the ice sheet warmed by about 9 °C within a few decades. Forests pushed north into tundra, lakes filled, rainfall returned to the eastern Mediterranean. Scientists call the warm period that followed the Bølling-Allerød; it lasted, with wobbles, until c. 12,900 years ago.</p><p>For people alive at the time, this was not a slow trend visible only to geologists. A grandchild could grow up in a different landscape from the grandparent. And on the coasts, something even more dramatic was under way.</p><blockquote class="wpull"><p>A grandchild could grow up in a different landscape from the grandparent.</p></blockquote></section><section class="wsec" id="age-04-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Seas on the move</h3><p>As the ice sheets collapsed, the sea surged. Drowned coral reefs off Tahiti, drilled in 2005 and dated with uranium-series methods, record a rise of about 14–18 m between c. 14,650 and 14,310 years ago. Global reconstructions put the jump at about 20 m in roughly 500 years, at c. 40 mm a year or more. Today the sea rises by a few millimetres a year and it is front-page news.</p><figure class="wx wx--static" id="age-04-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Meltwater Pulse 1A: the sea&#x27;s great leap</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Meltwater Pulse 1A: the sea&#x27;s great leap"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" class="wx-svg" role="img" aria-labelledby="age-04-f1-t"><title id="age-04-f1-t">Global sea level from 17,000 to 11,500 years ago, showing the sharp jump of Meltwater Pulse 1A, about 20 metres in roughly 500 years, next to a 20 metre column and a person for scale</title><text class="wx-t-cap" x="16" y="26">GLOBAL SEA LEVEL DURING THE GREAT MELT</text><text class="wx-t-m" x="16" y="44">Metres below today (after Lambeck et al. 2014)</text><path class="wx-guide" d="M70,115H460"/><text class="wx-t-s" x="62" y="119" text-anchor="end">−60 m</text><path class="wx-guide" d="M70,185H460"/><text class="wx-t-s" x="62" y="189" text-anchor="end">−80 m</text><path class="wx-guide" d="M70,255H460"/><text class="wx-t-s" x="62" y="259" text-anchor="end">−100 m</text><path class="wx-guide" d="M70,325H460"/><text class="wx-t-s" x="62" y="329" text-anchor="end">−120 m</text><path class="wx-thin" d="M70,360v6"/><text class="wx-t-s" x="70" y="380" text-anchor="middle">17,000</text><path class="wx-thin" d="M140.9,360v6"/><text class="wx-t-s" x="140.9" y="380" text-anchor="middle">16,000</text><path class="wx-thin" d="M211.8,360v6"/><text class="wx-t-s" x="211.8" y="380" text-anchor="middle">15,000</text><path class="wx-thin" d="M282.7,360v6"/><text class="wx-t-s" x="282.7" y="380" text-anchor="middle">14,000</text><path class="wx-thin" d="M353.6,360v6"/><text class="wx-t-s" x="353.6" y="380" text-anchor="middle">13,000</text><path class="wx-thin" d="M424.5,360v6"/><text class="wx-t-s" x="424.5" y="380" text-anchor="middle">12,000</text><path class="wx-line" d="M70,360H460"/><text class="wx-t-s" x="460" y="398" text-anchor="end">years ago</text><rect class="wx-accfill wx-o20" x="247.3" y="80" width="35.5" height="280"/><text class="wx-t-b wx-t-a" x="265" y="72" text-anchor="middle">Meltwater Pulse 1A</text><path class="wx-water wx-o60" d="M70,339 L105.5,335.5 L140.9,314.5 L176.4,290 L211.8,269 L247.3,255 L261.5,227 L282.7,185 L318.2,164 L353.6,143 L389.1,122 L424.5,115 L460,108 L460,360 L70,360 Z"/><path class="wx-bold wx-s2 wx-draw" pathLength="1" d="M70,339 L105.5,335.5 L140.9,314.5 L176.4,290 L211.8,269 L247.3,255 L261.5,227 L282.7,185 L318.2,164 L353.6,143 L389.1,122 L424.5,115 L460,108"/><path class="wx-hl wx-draw" pathLength="1" style="--d:6" d="M247.3,255 L261.5,227 L282.7,185"/><text class="wx-t-b wx-halo" x="290.7" y="206">c. 20 m in</text><text class="wx-t-b wx-halo" x="290.7" y="222">c. 500 years</text><path class="wx-dash" d="M233.1,110 V255"/><text class="wx-t-s wx-halo" x="227.1" y="106" text-anchor="end">Bølling warming</text><text class="wx-t-s wx-halo" x="227.1" y="120" text-anchor="end">c. 14,700 years ago</text><text class="wx-t-cap" x="520" y="70">20 M, TO SCALE</text><rect class="wx-water2 wx-o80 wx-grow" style="--d:4" x="560" y="90" width="60" height="270"/><path class="wx-flow wx-s2" d="M560,90 h60"/><path class="wx-line" d="M520,360 H704"/><g><circle class="wx-line" cx="645" cy="339.1" r="2.1"/><path class="wx-line" d="M645,341.2 L645,349.2 M642,360 L645,349.2 L648,360 M641.3,347.6 L645,343 L648.7,347.6"/></g><text class="wx-t-s" x="645" y="378" text-anchor="middle">1.7 m</text><path class="wx-dim" d="M550,360 V90 M546,360h8 M546,90h8"/><text class="wx-t-n" x="544" y="225" text-anchor="end">20 m</text><path class="wx-guide" d="M560,314.1 h60"/><path class="wx-guide" d="M560,268.2 h60"/><path class="wx-guide" d="M560,222.3 h60"/><path class="wx-guide" d="M560,176.4 h60"/><path class="wx-guide" d="M560,130.5 h60"/><text class="wx-t-s" x="630" y="94">≈ a six-storey</text><text class="wx-t-s" x="630" y="108">building</text><text class="wx-t-s" x="520" y="396">Rate: c. 40 mm a year or more,</text><text class="wx-t-s" x="520" y="410">roughly ten times today's rise</text></svg></div></div><figcaption>Global sea level from 17,000 to 11,500 years ago, with the pulse shaded, and 20 m drawn to scale next to a person. <span class="wx-src">Based on: Sea levels from the Lambeck et al. 2014 reconstruction as compiled in this site&#x27;s sea-level series (±5 m); Meltwater Pulse 1A timing from Deschamps et al. 2012 and Lambeck et al. 2014.</span></figcaption><p class="vh">A line chart of global sea level from 17,000 to 11,500 years ago, rising from about 124 metres below today to about 58 metres below. A shaded band between 14,500 and 14,000 years ago marks Meltwater Pulse 1A, where the line steepens and rises about 20 metres. A dashed line marks the Bølling warming at 14,700 years ago. To the right, a blue column 20 metres tall stands beside a 1.7 metre person and is compared to a six-storey building.</p></figure><p>What did that mean on the ground? At 40 mm a year, the sea climbs about 2.4 m in 60 years. On a very flat shelf, such as much of Sundaland, where the seabed may drop only about a metre per kilometre, that is kilometres of lost land in one lifetime. Hunting grounds, fresh-water springs and burial places would have gone under within memory. The water came from shrinking ice sheets, but which ones is still debated: Antarctica, North America and Scandinavia all have their advocates.</p></section><section class="wsec" id="age-04-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The first villagers</h3><p>In the Levant, the warm, wet centuries helped a remarkable culture flourish. The Natufians, named after Wadi en-Natuf in the Judean hills, built hamlets of round, semi-sunken stone houses at sites such as Ain Mallaha (Eynan) in the Jordan Valley. They harvested wild cereals with sickles of flint set in bone handles, pounded them in stone mortars, stored food and buried their dead beneath their floors.</p><p>They were not farmers. They were foragers who stayed put, and their lives look surprisingly familiar. At Shubayqa 1 in northeast Jordan, charred crumbs show that people were baking a flatbread-like food c. 14,400 years ago. At Raqefet Cave near Mount Carmel, residues in stone mortars c. 13,000 years old have been read as traces of brewing, though others doubt it. Dogs were already companions. At Bonn-Oberkassel in Germany, a young dog buried with two people c. 14,200 years ago had survived a serious illness, which suggests it was cared for. At Ain Mallaha, c. 12,000 years ago, an elderly person was buried with a hand resting on a puppy.</p><aside class="wcall"><b>How do we know?</b><p>Charred plant remains survive when food falls into a fire. Under the microscope, bread crumbs show the porous structure left by gas bubbles in dough and the fragments of ground grain, which distinguishes them from roasted whole seeds. At Shubayqa 1 these were found in a hearth together with the radiocarbon-dated charcoal.</p></aside></section><section class="wsec" id="age-04-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Everywhere in the Americas</h3><p>Across the Americas, this age now has people in it, which is itself a revolution in the textbooks. At Monte Verde in southern Chile, a waterlogged camp c. 14,500 years old preserved wooden foundations, hide scraps and medicinal plants. At Page-Ladson in Florida, divers recovered stone tools and a butchered mastodon tusk c. 14,550 years old from a sinkhole river. In the Paisley Caves in Oregon, dried human faeces c. 14,300 years old contain human DNA. At the Friedkin site in Texas, thousands of stone artefacts lie beneath the Clovis layer, dated c. 15,500 years ago.</p><p>Clovis itself, with its elegant fluted spear points, appears only near the end of this age, c. 13,050 years ago. It was a successful technology spreading through a continent that was already inhabited, not the first footprint.</p></section><section class="wsec" id="age-04-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The catastrophists&#x27; case</h3><p>Randall Carlson and Graham Hancock read this age as a time of catastrophe, and they have a strong precedent. In 1923 geologist J Harlen Bretz argued that the bizarre landscape of eastern Washington, with its dry waterfalls, giant ripples and canyons cut into basalt, was carved by a colossal flood. Geology at the time rejected sudden catastrophes on principle, and Bretz was dismissed for decades. Once the source was identified, glacial Lake Missoula, repeatedly bursting through its ice dam, he was vindicated and, in 1979, awarded geology&#x27;s Penrose Medal.</p><p>The megafloods, the rapid warmings and the sea-level pulses are all real. Where the catastrophists go further, arguing that these events wiped out an advanced culture or that specific myths describe them, the evidence is thinner. The lesson Bretz teaches cuts both ways: geology was wrong to rule catastrophe out in advance, and it came round because the physical evidence was overwhelming.</p></section><section class="wsec" id="age-04-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What the melt erased</h3><p>By the end of this age the sea had risen roughly 60 m from its lowest point, and the coasts people had used for thousands of years were gone. That means the Natufian and pre-Clovis worlds we know are the inland halves of those worlds. The coastal halves, where boats were launched and shellfish gathered, are offshore.</p><p>Could anyone have remembered? In Australia, geographer Patrick Nunn and linguist Nicholas Reid gathered Aboriginal stories from 21 places around the coast that describe the sea rising and drowning land that was once walked on. They argue that some of these accounts are more than 7,000 years old. Those memories, if they are memories, would belong to the later and slower stages of the rise, not to this pulse. But they show that the loss of land to the sea is exactly the kind of event people pass on.</p><p>What would settle the open questions: dated drowned shorelines at the depths of the pre-pulse coast, better fingerprinting of where Meltwater Pulse 1A&#x27;s water came from, and more sealed early sites in the Americas. Then, around 12,900 years ago, the warm world stopped.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">13,500 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">People at the Friedkin site, Texas (c. 15,500 years ago)</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">12,700 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Bølling warming</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">12,550 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Mastodon butchered at Page-Ladson, Florida</span></li><li class="wtl-loss" style="--i:3"><span class="wtl-y">12,500 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Meltwater Pulse 1A begins; people camp at Monte Verde, Chile</span></li><li class="wtl-build" style="--i:4"><span class="wtl-y">12,400 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Bread baked at Shubayqa 1, Jordan</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">12,000 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Short cold snap (Older Dryas)</span></li><li class="wtl-build" style="--i:6"><span class="wtl-y">11,050 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Clovis spear points appear in North America</span></li><li class="wtl-build" style="--i:7"><span class="wtl-y">11,000 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Possible brewing residues at Raqefet Cave</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">1923 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Bretz proposes the Scablands megaflood</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">2012 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Tahiti corals time Meltwater Pulse 1A</span></li></ol><h3 class="sub-h wsub">Go deeper</h3><div class="links-row"><button type="button" onclick="openItem('articles','case-drowned-coasts')">The Drowned Coasts <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-first-americans')">The First Americans <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-flood')">The Flood <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-aboriginal-sea')">Stories Older Than the Sea <span aria-hidden="true">→</span></button></div><details class="srcs"><summary>Sources for this age (15)</summary><ol><li>Severinghaus J.P. &amp; Brook E.J. (1999). Abrupt climate change at the end of the last glacial period inferred from trapped air in polar ice. Science 286: 930–934. <a href="https://doi.org/10.1126/science.286.5441.930" target="_blank" rel="noopener">doi:10.1126/science.286.5441.930</a></li><li>Deschamps P. et al. (2012). Ice-sheet collapse and sea-level rise at the Bølling warming 14,600 years ago. Nature 483: 559–564. <a href="https://doi.org/10.1038/nature10902" target="_blank" rel="noopener">doi:10.1038/nature10902</a></li><li>Lambeck K. et al. (2014). Sea level and global ice volumes from the Last Glacial Maximum to the Holocene. PNAS 111: 15296–15303. <a href="https://doi.org/10.1073/pnas.1411762111" target="_blank" rel="noopener">doi:10.1073/pnas.1411762111</a></li><li>Arranz-Otaegui A. et al. (2018). Archaeobotanical evidence reveals the origins of bread 14,400 years ago in northeastern Jordan. PNAS 115: 7925–7930. <a href="https://doi.org/10.1073/pnas.1801071115" target="_blank" rel="noopener">doi:10.1073/pnas.1801071115</a></li><li>Liu L. et al. (2018). Fermented beverage and food storage in 13,000 y-old stone mortars at Raqefet Cave, Israel. Journal of Archaeological Science: Reports 21: 783–793. <a href="https://doi.org/10.1016/j.jasrep.2018.08.008" target="_blank" rel="noopener">doi:10.1016/j.jasrep.2018.08.008</a></li><li>Davis S.J.M. &amp; Valla F.R. (1978). Evidence for domestication of the dog 12,000 years ago in the Natufian of Israel. Nature 276: 608–610. <a href="https://doi.org/10.1038/276608a0" target="_blank" rel="noopener">doi:10.1038/276608a0</a></li><li>Janssens L. et al. (2018). A new look at an old dog: Bonn-Oberkassel reconsidered. Journal of Archaeological Science 92: 126–138.</li><li>Dillehay T.D. et al. (2015). New archaeological evidence for an early human presence at Monte Verde, Chile. PLOS ONE 10: e0141923. <a href="https://doi.org/10.1371/journal.pone.0141923" target="_blank" rel="noopener">doi:10.1371/journal.pone.0141923</a></li><li>Halligan J.J. et al. (2016). Pre-Clovis occupation 14,550 years ago at the Page-Ladson site, Florida, and the peopling of the Americas. Science Advances 2: e1600375. <a href="https://doi.org/10.1126/sciadv.1600375" target="_blank" rel="noopener">doi:10.1126/sciadv.1600375</a></li><li>Gilbert M.T.P. et al. (2008). DNA from pre-Clovis human coprolites in Oregon, North America. Science 320: 786–789. <a href="https://doi.org/10.1126/science.1154116" target="_blank" rel="noopener">doi:10.1126/science.1154116</a></li><li>Waters M.R. et al. (2011). The Buttermilk Creek complex and the origins of Clovis at the Debra L. Friedkin site, Texas. Science 331: 1599–1603. <a href="https://doi.org/10.1126/science.1201855" target="_blank" rel="noopener">doi:10.1126/science.1201855</a></li><li>Waters M.R., Stafford T.W. &amp; Carlson D.L. (2020). The age of Clovis: 13,050 to 12,750 cal yr B.P. Science Advances 6: eaaz0455. <a href="https://doi.org/10.1126/sciadv.aaz0455" target="_blank" rel="noopener">doi:10.1126/sciadv.aaz0455</a></li><li>Nunn P.D. &amp; Reid N.J. (2016). Aboriginal memories of inundation of the Australian coast dating from more than 7000 years ago. Australian Geographer 47: 11–47. <a href="https://doi.org/10.1080/00049182.2015.1077539" target="_blank" rel="noopener">doi:10.1080/00049182.2015.1077539</a></li><li>Bretz J H. (1923). The Channeled Scablands of the Columbia Plateau. Journal of Geology 31: 617–649.</li><li>Baker V.R. (2009). The Channeled Scabland: a retrospective. Annual Review of Earth and Planetary Sciences 37: 393–411.</li></ol></details></div></script><script type="text/x-tpl" id="age-05-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Greenland ice sheet USGS.jpg" data-cap="The Greenland ice sheet, the last big leftover of the Ice Age" data-big><figcaption></figcaption></figure><div class="sh-k">12,900–11,700 years ago</div><h2 class="sh-t" id="age-05-st" tabindex="-1">The Younger Dryas Reset</h2><p class="sh-s">Just as the world warmed, the north plunged back into near-glacial cold for 1,200 years, then leapt out of it within decades.</p><div class="sh-v"><span class="vstamp vstamp--phase" style="--vc:var(--indigo)"><span aria-hidden="true">↺</span>Reset</span></div></div><p class="v4-q">What flipped the climate back to the Ice Age, and what did it cost people?</p><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="12896" >12,896</b><span class="ctr-u"> years b2k</span></div><div class="ctr-l">onset of the Younger Dryas in Greenland ice (± 138)</div><div class="ctr-c">Rasmussen et al. 2006</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="1200" >1,200</b><span class="ctr-u"> years</span></div><div class="ctr-l">length of the cold interval</div><div class="ctr-c">Rasmussen et al. 2006; Walker et al. 2009</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="8" >8</b><span class="ctr-u"> °C</span></div><div class="ctr-l">Greenland warming at its end, in less than a century</div><div class="ctr-c">Alley 2000</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="35" >35</b><span class="ctr-u"> genera</span></div><div class="ctr-l">of large mammals lost in North America at the end of the Ice Age</div><div class="ctr-c">Faith &amp; Surovell 2009</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="3" >3</b><span class="ctr-u"> papers</span></div><div class="ctr-l">impact-hypothesis papers retracted in 2025–2026</div><div class="ctr-c">Scientific Reports 2025; PLOS One 2026</div></div></div><div class="rf"><div class="rf-c rf-up"><h3 class="rf-h"><span aria-hidden="true">▲</span> What rose</h3><ul><li>Villages that held on through the cold, such as Abu Hureyra on the Euphrates</li><li>Folsom and other new tool traditions in North America after Clovis</li><li>In the Levant, more intensive use of wild cereals, which some researchers link to the first cultivation</li></ul></div><div class="rf-c rf-down"><h3 class="rf-h"><span aria-hidden="true">▼</span> What fell or was lost</h3><ul><li>Greenland back to near-glacial cold, c. 15 °C below recent centuries at the ice-sheet summit</li><li>The Clovis tool tradition ends c. 12,750 years ago</li><li>North America&#x27;s mammoths, mastodons, horses, camels and giant sloths disappear around this time</li><li>Some Natufian villages are abandoned or used more seasonally</li></ul></div></div><h3 class="sub-h wsub">What drove it</h3><div class="trigs"><div class="trig"><b>A weakened Atlantic overturning circulation</b><span>Ocean sediments show the Atlantic&#x27;s heat-carrying circulation slowed; the leading explanation is a flood of fresh meltwater from the North American ice sheet (Broecker et al. 1989; Murton et al. 2010).</span></div><div class="trig"><b>Proposed: a cosmic airburst or impact</b><span>Claimed markers in a thin layer at many sites (Firestone et al. 2007); a platinum spike in Greenland ice (Petaev et al. 2013). Contested and partly retracted; see below.</span></div><div class="trig"><b>Abrupt switches in the ice record</b><span>Some Greenland ice indicators change state within 1–3 years at the onset and end of the interval (Steffensen et al. 2008).</span></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>A cosmic airburst or impact c. 12,800 years ago triggered the Younger Dryas cooling, the megafauna extinctions and the collapse of Clovis.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">After nearly two decades, the key markers have not been consistently reproduced by independent teams, several are common in ordinary sediments, and no crater of the right age is known. A 2025 study attributes the Greenland platinum spike to Icelandic eruptions, and the timing does not match an impact. In 2025 and February 2026, three papers by the group were retracted, citing problems with dating, sampling and data. The weakening of Atlantic circulation explains the cooling without an impact, though its trigger is still discussed.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks present the meltwater-and-ocean-current explanation as settled. It is well supported but not closed: the meltwater route, its timing and whether the Younger Dryas was one of several natural oscillations are still researched. The popular impact story is presented in documentaries far more confidently than the evidence justifies, which is the larger gap today.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>The Younger Dryas began 12,896 ± 138 years before 2000 CE in the Greenland ice and ended 11,703 years before 2000 CE, the formal start of the Holocene.<small>Rasmussen et al. 2006; Walker et al. 2009</small></li><li>Central Greenland fell back to near-glacial temperatures, about −46 to −50 °C, then warmed by about 8 °C within a century at the end.<small>Alley 2000</small></li><li>The Clovis tool tradition dates to c. 13,050–12,750 years ago and ends near the Younger Dryas onset.<small>Waters et al. 2020</small></li><li>About 35 genera of large mammals disappeared from North America at the end of the Ice Age, many of them near this time.<small>Faith &amp; Surovell 2009</small></li><li>A dark organic &#x27;black mat&#x27; layer caps Clovis-age deposits at many North American sites.<small>Haynes 2008</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether a cosmic impact or airburst c. 12,800 years ago triggered the cold, fires and extinctions (the Younger Dryas Impact Hypothesis).</li><li>Exactly where the meltwater went (east through the St Lawrence or north through the Mackenzie River to the Arctic), and whether meltwater alone explains the timing.</li><li>How much hunting, climate and habitat change each contributed to the megafauna extinctions.</li><li>Whether melted glass at Abu Hureyra, Syria, formed in an airburst or in ordinary burning of buildings and vegetation.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Abu Hureyra itself: excavated in a rush in 1972–1973 and then drowned by Lake Assad behind the Tabqa Dam; no one can go back for new samples in place.</li><li>A crater: none of the right age has been confirmed. Greenland&#x27;s Hiawatha crater, once a candidate, has been dated to c. 58 million years.</li><li>Continuous, finely dated sediment sections that would show whether the claimed markers are one sharp layer or spread through time.</li></ul></div></div><h3 class="sub-h wsub">The bold reading</h3><div class="face"><div class="face-c face-x" style="grid-column:1/-1"><p>Since 2007 these researchers have argued that fragments of a comet exploded over several continents c. 12,800 years ago, setting off wildfires, cooling the climate, helping to kill the megafauna and disrupting Clovis and Natufian societies. They report microspherules, nanodiamonds, melt glass, platinum and soot in a thin layer at dozens of sites. Hancock builds on this: an advanced civilisation, he proposes, was destroyed and its survivors seeded later cultures.</p><div class="face-s"><b>Its strongest point</b><p>The timing is striking: an abrupt cooling, the end of Clovis and a platinum spike in Greenland ice all fall within a few centuries of 12,800 years ago.</p></div><p class="face-cr"><b>Credit</b> The Comet Research Group (Richard Firestone, James Kennett, Allen West, Andrew Moore and colleagues); Martin Sweatman; Graham Hancock</p></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,059 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Younger Dryas Reset"><button type="button" class="wtoc-i" data-go="age-05-s1">The world slips back</button><button type="button" class="wtoc-i" data-go="age-05-s2">What the ice remembers</button><button type="button" class="wtoc-i" data-go="age-05-s3">Losses in the Americas</button><button type="button" class="wtoc-i" data-go="age-05-s4">The impact hypothesis at its strongest</button><button type="button" class="wtoc-i" data-go="age-05-s5">The case against, and the retractions</button><button type="button" class="wtoc-i" data-go="age-05-s6">Abu Hureyra: a village through the cold</button><button type="button" class="wtoc-i" data-go="age-05-s7">The sudden spring</button></nav></div><section class="wsec" id="age-05-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The world slips back</h3><p>Imagine being a Natufian grandmother on the Euphrates c. 12,900 years ago. For as long as anyone can remember, the valley has been generous: oak and pistachio on the slopes, wild rye and einkorn in the steppe, gazelle every spring. Then, within a few decades, the winters bite harder, the rains fail more often, the wild stands thin. No one alive has seen anything like it, and no one alive will see it end.</p><p>This is the Younger Dryas, named after a small Arctic flower, Dryas octopetala, whose leaves turn up in European lake muds of this time. It is the most famous reversal in the story of the end of the Ice Age, and, since 2007, one of its fiercest debates.</p><blockquote class="wpull"><p>No one alive has seen anything like it, and no one alive will see it end.</p></blockquote></section><section class="wsec" id="age-05-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What the ice remembers</h3><p>Greenland&#x27;s ice sheet stores a year-by-year archive. Counting annual layers places the onset of the cold at 12,896 ± 138 years before 2000 CE and its end at 11,703. Reconstructed temperatures at the GISP2 drill site show the summit dropping from around −41 °C to near −49 °C within about 160 years, staying at −46 to −50 °C for some twelve centuries, then jumping by about 8 °C in less than a century.</p><figure class="wx wx--steps" id="age-05-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">The Younger Dryas in the Greenland ice</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The Younger Dryas in the Greenland ice"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" class="wx-svg" role="img" aria-labelledby="age-05-f1-t"><title id="age-05-f1-t">Greenland temperature from the GISP2 ice core, 15,700 to 10,000 years ago, stepping through the Bølling warming, the Allerød, the Younger Dryas plunge and the jump into the Holocene</title><defs><marker id="age-05-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker><marker id="age-05-f1-ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><path class="wx-guide" d="M78,345.9H690"/><text class="wx-t-s" x="70" y="349.9" text-anchor="end">-50</text><path class="wx-guide" d="M78,280.7H690"/><text class="wx-t-s" x="70" y="284.7" text-anchor="end">-45</text><path class="wx-guide" d="M78,215.5H690"/><text class="wx-t-s" x="70" y="219.5" text-anchor="end">-40</text><path class="wx-guide" d="M78,150.3H690"/><text class="wx-t-s" x="70" y="154.3" text-anchor="
