y="323.7" text-anchor="middle">1</text><text class="wx-t-b wx-halo" x="98.2" y="323.7" text-anchor="start">Bølling warming</text><text class="wx-t wx-halo" x="98.2" y="339.7" text-anchor="start">+11 °C in c. 160 years</text><text class="wx-t-s wx-halo" x="98.2" y="355.7" text-anchor="start">c. 14,700 years ago</text></g><path class="wx-hl wx-st wx-hide" data-s="1" marker-end="url(#age-05-f1-ah)" d="M177,313.3 L189.8,163.3"/><g class="wx-st wx-hide" data-s="2"><circle class="wx-num" cx="255.6" cy="122.8" r="9"/><text class="wx-numt" x="255.6" y="126.8" text-anchor="middle">2</text><text class="wx-t-b wx-halo" x="269.6" y="126.8" text-anchor="start">Allerød</text><text class="wx-t wx-halo" x="269.6" y="142.8" text-anchor="start">slow, bumpy cooling</text><text class="wx-t-s wx-halo" x="269.6" y="158.8" text-anchor="start">over c. 1,600 years</text></g><g class="wx-st wx-hide" data-s="3"><circle class="wx-num" cx="374.1" cy="335.4" r="9"/><text class="wx-numt" x="374.1" y="339.4" text-anchor="middle">3</text><text class="wx-t-b wx-halo" x="360.1" y="339.4" text-anchor="end">The plunge</text><text class="wx-t wx-halo" x="360.1" y="355.4" text-anchor="end">−8 °C in c. 160 years</text></g><path class="wx-hl wx-st wx-hide" data-s="3" marker-end="url(#age-05-f1-ah)" d="M370.7,215.5 L384.5,319.8"/><g class="wx-st wx-hide" data-s="4"><circle class="wx-num" cx="382.2" cy="221.9" r="9"/><text class="wx-numt" x="382.2" y="225.9" text-anchor="middle">4</text><text class="wx-t-b wx-halo" x="396.2" y="225.9" text-anchor="start">Deep cold</text><text class="wx-t wx-halo" x="396.2" y="241.9" text-anchor="start">−46 to −50 °C</text></g><g class="wx-st wx-hide" data-s="5"><circle class="wx-num" cx="524.9" cy="270.2" r="9"/><text class="wx-numt" x="524.9" y="274.2" text-anchor="middle">5</text><text class="wx-t-b wx-halo" x="538.9" y="274.2" text-anchor="start">The Holocene jump</text><text class="wx-t wx-halo" x="538.9" y="290.2" text-anchor="start">+8 °C in under</text><text class="wx-t wx-halo" x="538.9" y="306.2" text-anchor="start">a century, 11,700</text></g><path class="wx-hl wx-st wx-hide" data-s="5" marker-end="url(#age-05-f1-ah)" d="M519.7,313.3 L524,215.5"/><text class="wx-t-cap" x="78" y="30">CENTRAL GREENLAND, GISP2 ICE CORE</text><text class="wx-t-m" x="78" y="48">Reconstructed air temperature, Alley 2000</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Bølling warming, c. 14,700 years ago: the Greenland summit warms by about 11 °C in about 160 years.</p><ol class="wx-steplist"><li>Bølling warming, c. 14,700 years ago: the Greenland summit warms by about 11 °C in about 160 years.</li><li>Allerød: a slow, bumpy cooling over about 1,600 years, with short cold dips.</li><li>The plunge, c. 12,900 years ago: about 8 °C of cooling in roughly 160 years.</li><li>The Younger Dryas: about 1,200 years at −46 to −50 °C, near full glacial cold.</li><li>The Holocene jump, 11,700 years ago: about 8 °C of warming in less than a century.</li></ol><figcaption>Reconstructed air temperature at the GISP2 drill site, 15,700 to 10,000 years ago. Tap through the warming, the slide, the plunge, the cold and the jump. <span class="wx-src">Based on: GISP2 temperature reconstruction, Alley 2000 (NOAA World Data Service for Paleoclimatology); ages converted to years before 2000 CE. Event dates from Rasmussen et al. 2006.</span></figcaption><p class="vh">A line chart of temperature in central Greenland from 15,700 to 10,000 years ago, on a scale from minus 50 to minus 30 degrees Celsius, with a dashed line at minus 31.6 for the most recent value in the core. Step 1 highlights a jump of about 11 degrees at 14,700 years ago. Step 2 shows a bumpy slide through the Allerød. Step 3 shows a plunge of about 8 degrees around 12,900 years ago. Step 4 shades the 1,200-year Younger Dryas with temperatures between minus 46 and minus 50. Step 5 shows a rise of about 8 degrees within a century at 11,700 years ago and the warm Holocene after it.</p></figure><aside class="wcall"><b>How do we know?</b><p>Three independent signals in the ice agree. The ratio of heavy to light oxygen in the ice tracks temperature. Nitrogen and argon isotopes in trapped air bubbles record how steep the temperature gradient in the snow was, giving the size of abrupt changes. And annual layers in dust and chemistry can be counted like tree rings, fixing the dates.</p></aside><p>The cold was not only Greenland&#x27;s. European lakes, Chinese caves and Venezuelan ocean sediments record the event, though the southern hemisphere shows a muted or opposite response, a clue that the ocean&#x27;s heat conveyor was involved.</p></section><section class="wsec" id="age-05-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Losses in the Americas</h3><p>In North America the Clovis tool tradition, with its fluted points, ends c. 12,750 years ago. Mammoths, mastodons, native horses and camels, giant ground sloths and sabre-toothed cats disappear around the same broad window; in all about 35 genera of large mammals were lost at the end of the Ice Age. People did not vanish: Folsom and other traditions followed. But a way of life built around big game ended.</p><figure class="wx wx--static" id="age-05-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">The black mat: one layer, two readings</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The black mat: one layer, two readings"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 405" class="wx-svg" role="img" aria-labelledby="age-05-f2-t"><title id="age-05-f2-t">Simplified geological section of a black mat site such as Murray Springs, Arizona, with Clovis artefacts and mammoth bones directly beneath a dark organic layer, and the rival readings of that layer</title><text class="wx-t-cap" x="16" y="26">THE LINE IN THE GROUND: A 'BLACK MAT' SECTION</text><text class="wx-t-m" x="16" y="44">Simplified from Murray Springs, Arizona (Haynes 2008); not to scale</text><path class="wx-sand wx-edge-soft wx-grow" style="--d:0" d="M30,370 H420 V274 C330,266 220,274 130,270 S50,274 30,270 Z"/><path class="wx-soil wx-edge-soft wx-grow" style="--d:1" d="M30,272 H420 V238 C330,230 220,238 130,234 S50,238 30,234 Z"/><path class="wx-inkfill wx-o80 wx-edge-soft wx-grow" style="--d:3" d="M30,236 H420 V216 C330,212 220,216 130,214 S50,216 30,214 Z"/><path class="wx-stone wx-edge-soft wx-grow" style="--d:5" d="M30,216 H420 V124 C330,116 220,124 130,120 S50,124 30,120 Z"/><path class="wx-green wx-edge-soft" d="M30,122 C120,110 200,116 260,112 S380,114 420,118 V122 H30 Z"/><g class="wx-pop" style="--d:6"><path class="wx-stone2 wx-edge" d="M120,248 C140,240 190,242 210,249 C190,254 140,255 120,248 Z"/><circle class="wx-stone2 wx-edge" cx="118" cy="248" r="6"/><circle class="wx-stone2 wx-edge" cx="212" cy="249" r="6"/><path class="wx-bold wx-s6" d="M240,254 C260,236 300,232 320,248"/><path class="wx-rock wx-edge" d="M348,256 L356,238 L364,256 Z"/><path class="wx-thin" d="M356,242 V254"/></g><text class="wx-t-s wx-halo" x="165" y="268" text-anchor="middle">mammoth bones</text><text class="wx-t-s wx-halo" x="282" y="268" text-anchor="middle">tusk</text><text class="wx-t-s wx-halo" x="356" y="268" text-anchor="middle">Clovis point</text><text class="wx-t wx-halo" x="40" y="170">later sediments (the Holocene)</text><text class="wx-t wx-halo" x="40" y="320">older stream sands and silts</text><path class="wx-thin" d="M400,225 L434,112"/><text class="wx-t-b" x="440" y="110">The black mat</text><text class="wx-t-s" x="440" y="126">Dark, organic-rich: a wet-ground</text><text class="wx-t-s" x="440" y="140">soil. Forms at dozens of US sites</text><text class="wx-t-s" x="440" y="154">near the Younger Dryas onset</text><circle class="wx-c4 wx-pulse" cx="444" cy="192" r="5"/><text class="wx-t-b" x="456" y="196">Impact claim (from 2007)</text><text class="wx-t-s" x="456" y="212">at its base: microspherules,</text><text class="wx-t-s" x="456" y="226">nanodiamonds, platinum, iridium</text><circle class="wx-c2" cx="444" cy="262" r="5"/><text class="wx-t-b" x="456" y="266">Counter-evidence</text><text class="wx-t-s" x="456" y="282">markers often not reproduced or</text><text class="wx-t-s" x="456" y="296">not unique; black mats also form</text><text class="wx-t-s" x="456" y="310">at other times, from rising water</text><path class="wx-line wx-s3" d="M30,378 H420"/><text class="wx-t-s" x="30" y="396">No Clovis points and no mammoth bones are found above the mat at such sites.</text></svg></div></div><figcaption>A simplified section like Murray Springs, Arizona: Clovis tools and mammoth bones directly beneath a dark organic layer. Not to scale. <span class="wx-src">Based on: After Haynes 2008 (Murray Springs and black mats); impact claims from Firestone et al. 2007; counter-evidence from Holliday et al. 2023.</span></figcaption><p class="vh">A cross-section of layered ground. At the bottom, older stream sands and silts. Above them, a layer holding mammoth bones, a tusk and a Clovis spear point. Directly on top, a dark band labelled the black mat. Above that, later Holocene sediments and a grassy surface. Labels on the right describe the black mat as a wet-ground soil found at dozens of sites near the Younger Dryas onset, the impact claim that its base holds microspherules, nanodiamonds, platinum and iridium, and the counter-evidence that the markers are often not reproduced and black mats form at other times too.</p></figure><p>At many sites a thin, dark &#x27;black mat&#x27; lies directly over Clovis-age deposits. At Murray Springs in Arizona, mammoth bones and Clovis points lie right beneath it and none are found above it. It is one of the most dramatic lines in American archaeology, and both sides of the impact debate have read it differently.</p></section><section class="wsec" id="age-05-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The impact hypothesis at its strongest</h3><p>In 2007 Richard Firestone and a large team proposed in PNAS that a comet or its fragments exploded over North America c. 12,900 years ago. At the base of the black mat and similar layers, they reported magnetic microspherules, nanodiamonds, carbon spherules and soot. The group, later known as the Comet Research Group, has since reported similar markers from Europe, Syria and South America, and argued that fires burned across continents.</p><p>In 2013 a separate team found a sharp platinum spike in the GISP2 ice core near the onset. Martin Sweatman has argued that carvings at Göbekli Tepe record the event, and Graham Hancock&#x27;s Magicians of the Gods (2015) made the airburst the destroyer of a lost ice-age civilisation. At its best, the argument is about coincidence in time: abrupt cooling, the end of Clovis, extinctions and a platinum spike, all near 12,800 years ago.</p></section><section class="wsec" id="age-05-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The case against, and the retractions</h3><p>Independent tests have repeatedly failed to confirm the markers. A 2009 study could not reproduce the reported microspherule peaks at several sites, including some the group had sampled. A 2010 study found no nanodiamonds of the kind described. Carbon spherules turned out to include fungal bodies and insect droppings. A 2011 review called for the hypothesis to be set aside, and in 2023 a team of 13 specialists, from archaeologists to impact physicists, published a detailed rebuttal. Black mats, they note, formed repeatedly through time when groundwater rose, not at one moment.</p><aside class="wcall"><b>Fresh from the field</b><p>In April 2025 Scientific Reports retracted the group&#x27;s paper claiming an airburst destroyed Tall el-Hammam in Jordan. In September 2025 a PLOS One study argued the Greenland platinum spike begins about 45 years after the cooling began and lasted 14 years, pointing to Icelandic fissure eruptions. On 11 February 2026 PLOS One retracted two 2025 papers by the group, on shocked quartz and on Baffin Bay sediments, citing problems with age models and sampling. Most of the authors disagreed with the retractions.</p></aside></section><section class="wsec" id="age-05-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Abu Hureyra: a village through the cold</h3><p>Abu Hureyra, on the Euphrates in Syria, was a village before, during and after the Younger Dryas. Andrew Moore excavated it in 1972 and 1973 in a race against the Tabqa Dam; the site now lies under Lake Assad. Plant remains suggested that villagers leaned harder on hardy wild plants as the cold set in, and one team argued they began to cultivate rye, a claim others dispute.</p><p>In 2020 Moore and colleagues reported melted glass with minerals formed above 2,200 °C, which they read as an airburst over the village. Critics had earlier argued that similar glassy droplets in Syrian sites formed when buildings and plant material burned. Because the site is drowned, the samples collected half a century ago are all there is.</p></section><section class="wsec" id="age-05-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>The sudden spring</h3><p>The end was as dramatic as the start. At 11,703 years before 2000 CE, Greenland warmed by several degrees within decades, and some ice indicators flipped within one to three years. That moment is the official beginning of the Holocene, the age we still live in. The leading explanation for both switches is a stall and restart of the Atlantic&#x27;s overturning circulation, set off by meltwater from the North American ice sheet. It is well supported, though the meltwater&#x27;s route and timing are still debated.</p><p>Ancient writers sensed that the world moves in cycles of catastrophe and renewal. In Plato&#x27;s Timaeus, an Egyptian priest tells the Athenian Solon that his people&#x27;s memory is short because it has been repeatedly wiped out:</p><blockquote class="quote"><p>There have been, and will be again, many destructions of mankind arising out of many causes; the greatest have been brought about by the agencies of fire and water, and other lesser ones by innumerable other causes.</p><cite>Plato, Timaeus 22c, trans. Benjamin Jowett (1871)</cite></blockquote><p>The Younger Dryas shows that at least the climate half of that idea is real: the world can reset within a lifetime. Whether fire from the sky played a part remains, on present evidence, unsupported but not beyond testing. Finely dated sediment cores, blind tests of markers by independent labs and a crater or airburst signature of the right age would settle it.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">10,896 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Younger Dryas begins in Greenland</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">10,800 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Proposed date of the cosmic airburst</span></li><li class="wtl-loss" style="--i:2"><span class="wtl-y">10,750 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Clovis tool tradition ends</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">9,703 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Abrupt warming; the Holocene begins</span></li><li class="wtl-find" style="--i:4"><span class="wtl-y">1972 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Abu Hureyra rescue excavation begins</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1989 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Meltwater rerouting proposed as the trigger</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2007 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Impact hypothesis published in PNAS</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2023 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Large team publishes a comprehensive rebuttal</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2025 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Tall el-Hammam airburst paper retracted</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">2026 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Two PLOS One impact papers retracted</span></li></ol><h3 class="sub-h wsub">Go deeper</h3><div class="links-row"><button type="button" onclick="openItem('articles','case-younger-dryas-impact')">The Younger Dryas Comet <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-lost-civilization')">Was There a Lost Ice Age Civilisation? <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-atlantis')">Atlantis <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-first-americans')">The First Americans <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-gobekli-tepe')">Göbekli Tepe <span aria-hidden="true">→</span></button></div><details class="srcs"><summary>Sources for this age (26)</summary><ol><li>Rasmussen S.O. et al. (2006). A new Greenland ice core chronology for the last glacial termination. Journal of Geophysical Research 111: D06102. <a href="https://doi.org/10.1029/2005JD006079" target="_blank" rel="noopener">doi:10.1029/2005JD006079</a></li><li>Walker M. et al. (2009). Formal definition and dating of the GSSP for the base of the Holocene. Journal of Quaternary Science 24: 3–17. <a href="https://doi.org/10.1002/jqs.1227" target="_blank" rel="noopener">doi:10.1002/jqs.1227</a></li><li>Alley R.B. (2000). The Younger Dryas cold interval as viewed from central Greenland. Quaternary Science Reviews 19: 213–226. Data: NOAA WDS Paleoclimatology, gisp2_temp_accum_alley2000.txt.</li><li>Steffensen J.P. et al. (2008). High-resolution Greenland ice core data show abrupt climate change happens in few years. Science 321: 680–684. <a href="https://doi.org/10.1126/science.1157707" target="_blank" rel="noopener">doi:10.1126/science.1157707</a></li><li>Broecker W.S. et al. (1989). Routing of meltwater from the Laurentide Ice Sheet during the Younger Dryas cold episode. Nature 341: 318–321. <a href="https://doi.org/10.1038/341318a0" target="_blank" rel="noopener">doi:10.1038/341318a0</a></li><li>Murton J.B. et al. (2010). Identification of Younger Dryas outburst flood path from Lake Agassiz to the Arctic Ocean. Nature 464: 740–743. <a href="https://doi.org/10.1038/nature08954" target="_blank" rel="noopener">doi:10.1038/nature08954</a></li><li>Waters M.R., Stafford T.W. &amp; Carlson D.L. (2020). The age of Clovis: 13,050 to 12,750 cal yr B.P. Science Advances 6: eaaz0455. <a href="https://doi.org/10.1126/sciadv.aaz0455" target="_blank" rel="noopener">doi:10.1126/sciadv.aaz0455</a></li><li>Faith J.T. &amp; Surovell T.A. (2009). Synchronous extinction of North America&#x27;s Pleistocene mammals. PNAS 106: 20641–20645. <a href="https://doi.org/10.1073/pnas.0908153106" target="_blank" rel="noopener">doi:10.1073/pnas.0908153106</a></li><li>Haynes C.V. (2008). Younger Dryas &#x27;black mats&#x27; and the Rancholabrean termination in North America. PNAS 105: 6520–6525.</li><li>Firestone R.B. et al. (2007). Evidence for an extraterrestrial impact 12,900 years ago that contributed to the megafaunal extinctions and the Younger Dryas cooling. PNAS 104: 16016–16021. <a href="https://doi.org/10.1073/pnas.0706977104" target="_blank" rel="noopener">doi:10.1073/pnas.0706977104</a></li><li>Petaev M.I. et al. (2013). Large Pt anomaly in the Greenland ice core points to a cataclysm at the onset of Younger Dryas. PNAS 110: 12917–12920. <a href="https://doi.org/10.1073/pnas.1303924110" target="_blank" rel="noopener">doi:10.1073/pnas.1303924110</a></li><li>Sweatman M.B. (2021). The Younger Dryas impact hypothesis: review of the impact evidence. Earth-Science Reviews 218: 103677. <a href="https://doi.org/10.1016/j.earscirev.2021.103677" target="_blank" rel="noopener">doi:10.1016/j.earscirev.2021.103677</a></li><li>Surovell T.A. et al. (2009). An independent evaluation of the Younger Dryas extraterrestrial impact hypothesis. PNAS 106.</li><li>Daulton T.L., Pinter N. &amp; Scott A.C. (2010). No evidence of nanodiamonds in Younger-Dryas sediments to support an impact event. PNAS 107.</li><li>Scott A.C. et al. (2010). Fungus, not comet or catastrophe, accounts for carbonaceous spherules in the Younger Dryas &#x27;impact layer&#x27;. Geophysical Research Letters 37.</li><li>Pinter N. et al. (2011). The Younger Dryas impact hypothesis: a requiem. Earth-Science Reviews 106: 247–264.</li><li>Holliday V.T. et al. (2023). Comprehensive refutation of the Younger Dryas Impact Hypothesis (YDIH). Earth-Science Reviews 247: 104502. <a href="https://doi.org/10.1016/j.earscirev.2023.104502" target="_blank" rel="noopener">doi:10.1016/j.earscirev.2023.104502</a></li><li>Green C.E., Baldini J.U.L., Brown R.J., Schmincke H.-U., Edmonds M. &amp; Meisel T.C. (2025). A possible volcanic origin for the Greenland ice core Pt anomaly near the Bølling-Allerød/Younger Dryas boundary. PLOS One 20(9): e0331811. <a href="https://doi.org/10.1371/journal.pone.0331811" target="_blank" rel="noopener">doi:10.1371/journal.pone.0331811</a></li><li>Bunch T.E. et al. (2021, retracted 24 April 2025). A Tunguska sized airburst destroyed Tall el-Hammam a Middle Bronze Age city in the Jordan Valley near the Dead Sea. Scientific Reports. Retraction note: <a href="https://doi.org/10.1038/s41598-025-99265-5" target="_blank" rel="noopener">doi:10.1038/s41598-025-99265-5</a></li><li>Kennett J.P. et al. (2025, retracted 11 February 2026). Shocked quartz at the Younger Dryas onset (12.8 ka) supports cosmic airbursts/impacts contributing to North American megafaunal extinctions and collapse of the Clovis technocomplex. PLOS One. Retraction notice: <a href="https://doi.org/10.1371/journal.pone.0342620" target="_blank" rel="noopener">doi:10.1371/journal.pone.0342620</a></li><li>Moore et al. (2025, retracted 11 February 2026). A 12,800-year-old layer with cometary dust, microspherules, and platinum anomaly recorded in multiple cores from Baffin Bay. PLOS One. Retraction notice: <a href="https://doi.org/10.1371/journal.pone.0342613" target="_blank" rel="noopener">doi:10.1371/journal.pone.0342613</a></li><li>Moore A.M.T. et al. (2020). Evidence of cosmic impact at Abu Hureyra, Syria at the Younger Dryas onset (~12.8 ka): high-temperature melting at &gt;2200 °C. Scientific Reports 10: 4185.</li><li>Hillman G. et al. (2001). New evidence of Lateglacial cereal cultivation at Abu Hureyra on the Euphrates. The Holocene 11.</li><li>Thy P. et al. (2015). Anthropogenic origin of siliceous scoria droplets from Pleistocene and Holocene archaeological sites in northern Syria. Journal of Archaeological Science 54.</li><li>Kenny G.G. et al. (2022). A Late Paleocene age for Greenland&#x27;s Hiawatha impact structure. Science Advances 8: eabm2434. <a href="https://doi.org/10.1126/sciadv.abm2434" target="_blank" rel="noopener">doi:10.1126/sciadv.abm2434</a></li><li>Plato. Timaeus, trans. B. Jowett (1871). Oxford: Clarendon Press.</li></ol></details></div></script><script type="text/x-tpl" id="age-06-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Göbekli Tepe, Urfa.jpg" data-cap="The enclosures of Göbekli Tepe" data-big><figcaption></figcaption></figure><div class="sh-k">11,700–9,000 years ago</div><h2 class="sh-t" id="age-06-st" tabindex="-1">The First Monuments</h2><p class="sh-s">As the climate steadied, people who were not yet farmers raised carved stone pillars, a stone tower and the first domesticated crops.</p><div class="sh-v"><span class="vstamp vstamp--phase" style="--vc:var(--malachite)"><span aria-hidden="true">▲</span>Rise</span></div></div><p class="v4-q">Did monuments come before farming, and why build them at all?</p><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="11700" >11,700</b><span class="ctr-u"> years b2k</span></div><div class="ctr-l">start of the Holocene</div><div class="ctr-c">Walker et al. 2009</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="5.5" data-dec="1">5.5</b><span class="ctr-u"> m</span></div><div class="ctr-l">height of the central pillars of Göbekli Tepe&#x27;s Enclosure D</div><div class="ctr-c">DAI Göbekli Tepe project</div></div><div class="ctr"><div class="ctr-v">up to c. <b class="ctr-n" data-v="10" >10</b><span class="ctr-u"> tonnes</span></div><div class="ctr-l">weight of the largest Göbekli Tepe pillars</div><div class="ctr-c">Dietrich et al. 2012</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="8.5" data-dec="1">8.5</b><span class="ctr-u"> m</span></div><div class="ctr-l">height of the Tower of Jericho</div><div class="ctr-c">Kenyon 1957</div></div><div class="ctr"><div class="ctr-v">c. 35–<b class="ctr-n" data-v="40" >40</b><span class="ctr-u"> m</span></div><div class="ctr-l">global sea-level rise during this age</div><div class="ctr-c">Lambeck et al. 2014</div></div></div><div class="rf"><div class="rf-c rf-up"><h3 class="rf-h"><span aria-hidden="true">▲</span> What rose</h3><ul><li>Göbekli Tepe&#x27;s great stone enclosures, from c. 9500 BCE, and sister sites such as Karahan Tepe</li><li>The Tower of Jericho, 8.5 m of stone, c. 8000 BCE</li><li>Domesticated wheat, barley, lentils, goats and sheep in the Fertile Crescent</li><li>Seafaring farmers settle Cyprus, bringing animals by boat</li></ul></div><div class="rf-c rf-down"><h3 class="rf-h"><span aria-hidden="true">▼</span> What fell or was lost</h3><ul><li>Coastal lowlands worldwide as the sea rose another c. 35–40 m</li><li>Göbekli Tepe&#x27;s great enclosures filled in and replaced by smaller buildings</li><li>The old hunting-and-gathering way of life, slowly, in the heartlands of farming</li></ul></div></div><h3 class="sub-h wsub">What drove it</h3><div class="trigs"><div class="trig"><b>A stable, warmer climate</b><span>The Holocene begins 11,700 years ago (Walker et al. 2009); Greenland ice shows far steadier temperatures than during the Ice Age.</span></div><div class="trig"><b>Steady sea-level rise</b><span>About 15 m per thousand years between 11,400 and 8,200 years ago (Lambeck et al. 2014).</span></div><div class="trig"><b>Gatherings around rich wild resources</b><span>Stands of wild cereals and herds of gazelle in the upper Fertile Crescent supported large gatherings and building projects (Dietrich et al. 2012).</span></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Göbekli Tepe&#x27;s builders inherited their astronomy and engineering from survivors of a lost ice-age civilisation.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Everything found so far points to local roots: the flint and limestone come from the plateau, the tools are regional Pre-Pottery Neolithic types, the animals carved are the local fauna, and the building tradition develops over centuries at a dozen neighbouring sites, with earlier Natufian and Epipalaeolithic precedents. The site&#x27;s excavators reject the comet reading of Pillar 43. No foreign material or technology has appeared. The inheritance idea awaits evidence.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Before the 1990s, textbooks confidently taught that farming came first and monuments followed. They were wrong, and the correction came from Göbekli Tepe. Today&#x27;s labels have caught up on the date but often still call it &#x27;the world&#x27;s first temple&#x27;, a label its current excavators question now that houses, cisterns and everyday tools have been found there.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Göbekli Tepe&#x27;s monumental enclosures, with T-shaped pillars up to c. 5.5 m tall, were built from c. 9500 BCE by people without domesticated crops or animals.<small>Dietrich et al. 2012; Schmidt 2012</small></li><li>A related site, Karahan Tepe, has a room cut into the bedrock with pillars and a carved human head, part of a cluster of similar sites in the Şanlıurfa region.<small>Karul 2021</small></li><li>The Tower of Jericho, 8.5 m tall with an internal stair of 22 steps, was built c. 8000 BCE, before pottery.<small>Kenyon 1957; Barkai &amp; Liran 2011</small></li><li>Domesticated cereals appear in the Fertile Crescent by c. 10,500 years ago, and goats were being herded in the Zagros by c. 10,000 years ago.<small>Zeder 2011; Zeder &amp; Hesse 2000</small></li><li>The Holocene began 11,700 years before 2000 CE, and sea level rose about 15 m per thousand years through most of this age.<small>Walker et al. 2009; Lambeck et al. 2014</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether Göbekli Tepe was mainly a ritual centre where few people lived, or a settlement where ritual and daily life mixed.</li><li>Whether carvings on Pillar 43, the &#x27;Vulture Stone&#x27;, record a comet strike or an astronomical calendar (Sweatman) or depict myth and funerary imagery (the excavators).</li><li>Whether the Tower of Jericho was defensive, communal-symbolic or aligned with the midsummer sunset.</li><li>Whether flood traditions preserve memories of post-glacial sea-level rise, of later local floods, or neither.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Only a small part of Göbekli Tepe, and a fraction of the other Taş Tepeler sites, has been excavated; geophysics suggests much more is buried.</li><li>The coastal sites of this age: early Holocene shores lie 20–60 m under today&#x27;s sea, including the floor of the Persian Gulf.</li><li>Wooden structures, textiles, songs and the meanings of the carvings, which no excavation can recover directly.</li></ul></div></div><h3 class="sub-h wsub">The bold reading</h3><div class="face"><div class="face-c face-x" style="grid-column:1/-1"><p>Hancock argues that Göbekli Tepe appears fully formed just after the Younger Dryas and may be the work of survivors of a lost ice-age civilisation passing on astronomy and building skills. Collins links the site to a lost culture remembered in later myths. Sweatman reads Pillar 43 as a record of the comet he believes began the Younger Dryas. Schoch, a geologist, argues that weathering on the Great Sphinx points to an age thousands of years older than Egyptology allows, part of the same wider picture of a lost early chapter.</p><div class="face-s"><b>Its strongest point</b><p>The textbooks said monuments needed farming, cities and chiefs. Göbekli Tepe was built by foragers, some 7,000 years before Stonehenge&#x27;s great sarsens. The mainstream picture had to be rebuilt, so asking what else it has missed is fair.</p></div><p class="face-cr"><b>Credit</b> Graham Hancock; Andrew Collins; Martin Sweatman; Robert Schoch</p></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">4 min read · 939 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The First Monuments"><button type="button" class="wtoc-i" data-go="age-06-s1">Stone before seed</button><button type="button" class="wtoc-i" data-go="age-06-s2">What is solid</button><button type="button" class="wtoc-i" data-go="age-06-s3">A tower at Jericho</button><button type="button" class="wtoc-i" data-go="age-06-s4">The slow taming of wheat</button><button type="button" class="wtoc-i" data-go="age-06-s5">Inheritance from a lost world?</button><button type="button" class="wtoc-i" data-go="age-06-s6">Rising seas and stories of the flood</button><button type="button" class="wtoc-i" data-go="age-06-s7">What is still buried</button></nav></div><section class="wsec" id="age-06-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Stone before seed</h3><p>On a limestone ridge above the Harran plain in southeastern Türkiye, c. 11,500 years ago, people are cutting a pillar out of the bedrock. They have stone tools, rope, wood and many hands, and no domesticated plants or animals at all. When the T-shaped pillar stands, it gets arms, hands, a belt and a fox-pelt loincloth: a stylised giant in stone. Around it, foxes, boars, snakes and vultures are carved in relief.</p><p>The climate had just steadied after the Younger Dryas. The world was warmer, wetter and, for the first time in a hundred thousand years, reliably so. In this age, the first known monuments rose, the first crops were tamed, and the sea kept climbing over the old coasts.</p><blockquote class="wpull"><p>Göbekli Tepe was built by foragers. The textbooks had the order backwards.</p></blockquote></section><section class="wsec" id="age-06-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What is solid</h3><p>Radiocarbon dates put Göbekli Tepe&#x27;s great enclosures at c. 9500 BCE and later. The central pillars of Enclosure D stand about 5.5 m high and the largest may weigh about 10 t. The builders were hunter-gatherers who processed wild cereals on a huge scale, with thousands of grinding stones, and feasted on gazelle and wild cattle. Since 2021 the Taş Tepeler project has revealed a whole landscape of related sites. At Karahan Tepe, some 46 km away, a room cut into the bedrock is filled with pillars and watched by a human head carved from the wall.</p><p>The discovery overturned a settled idea. For most of the 20th century it was taught that monumental building needed farming surpluses, towns and rulers. Göbekli Tepe shows the reverse order in this region: gathering and building came first, and domestication followed in the same area. Genetic studies trace domesticated einkorn wheat to wild stands on Karacadağ, a volcanic mountain in the same region.</p></section><section class="wsec" id="age-06-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>A tower at Jericho</h3><p>In the Jordan Valley, c. 8000 BCE, the people of Jericho built a stone tower 8.5 m high, about 9 m across at its base, with a stair of 22 steps inside. It is more than 5,000 years older than the Great Pyramid. Kathleen Kenyon, who excavated it in the 1950s, saw a fortification; later researchers doubted that, since no enemy is known.</p><figure class="wx wx--static" id="age-06-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">The Tower of Jericho in section</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The Tower of Jericho in section"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" class="wx-svg" role="img" aria-labelledby="age-06-f1-t"><title id="age-06-f1-t">Section of the Neolithic Tower of Jericho: 8.5 metres tall, about 9 metres wide at the base and 7 at the top, with an internal staircase of 22 steps, a person and the town wall for scale</title><text class="wx-t-cap" x="16" y="26">THE TOWER OF JERICHO, c. 10,000 YEARS AGO</text><text class="wx-t-m" x="16" y="44">Simplified section; dimensions after Kenyon's excavations</text><rect class="wx-stone2 wx-o60 wx-edge-soft wx-grow" style="--d:0" x="425" y="272" width="230" height="108"/><text class="wx-t-s" x="545" y="262" text-anchor="middle">town wall (height approx.)</text><path class="wx-stone wx-edge-soft wx-grow" style="--d:0" d="M165,380 L435,380 L432.5,358.8 L167.5,358.8 Z"/><path class="wx-stone2 wx-edge-soft wx-grow" style="--d:1" d="M167.5,358.8 L432.5,358.8 L430,337.5 L170,337.5 Z"/><path class="wx-stone wx-edge-soft wx-grow" style="--d:2" d="M170,337.5 L430,337.5 L427.5,316.2 L172.5,316.2 Z"/><path class="wx-stone2 wx-edge-soft wx-grow" style="--d:3" d="M172.5,316.2 L427.5,316.2 L425,295 L175,295 Z"/><path class="wx-stone wx-edge-soft wx-grow" style="--d:4" d="M175,295 L425,295 L422.5,273.8 L177.5,273.8 Z"/><path class="wx-stone2 wx-edge-soft wx-grow" style="--d:5" d="M177.5,273.8 L422.5,273.8 L420,252.5 L180,252.5 Z"/><path class="wx-stone wx-edge-soft wx-grow" style="--d:6" d="M180,252.5 L420,252.5 L417.5,231.2 L182.5,231.2 Z"/><path class="wx-stone2 wx-edge-soft wx-grow" style="--d:7" d="M182.5,231.2 L417.5,231.2 L415,210 L185,210 Z"/><path class="wx-stone wx-edge-soft wx-grow" style="--d:8" d="M185,210 L415,210 L412.5,188.8 L187.5,188.8 Z"/><path class="wx-stone2 wx-edge-soft wx-grow" style="--d:9" d="M187.5,188.8 L412.5,188.8 L410,167.5 L190,167.5 Z"/><path class="wx-stone wx-edge-soft wx-grow" style="--d:10" d="M190,167.5 L410,167.5 L407.5,146.2 L192.5,146.2 Z"/><path class="wx-stone2 wx-edge-soft wx-grow" style="--d:11" d="M192.5,146.2 L407.5,146.2 L405,125 L195,125 Z"/><path class="wx-line" d="M165,380 L195,125 L405,125 L435,380"/><path class="wx-paper wx-o80" d="M395,380 L230,125 L196,125 L361,380 Z"/><path class="wx-hl wx-draw" pathLength="1" style="--d:10" d="M395,380 L395,368.4 L387.5,368.4 L387.5,356.8 L380,356.8 L380,345.2 L372.5,345.2 L372.5,333.6 L365,333.6 L365,322 L357.5,322 L357.5,310.5 L350,310.5 L350,298.9 L342.5,298.9 L342.5,287.3 L335,287.3 L335,275.7 L327.5,275.7 L327.5,264.1 L320,264.1 L320,252.5 L312.5,252.5 L312.5,240.9 L305,240.9 L305,229.3 L297.5,229.3 L297.5,217.7 L290,217.7 L290,206.1 L282.5,206.1 L282.5,194.5 L275,194.5 L275,183 L267.5,183 L267.5,171.4 L260,171.4 L260,159.8 L252.5,159.8 L252.5,148.2 L245,148.2 L245,136.6 L237.5,136.6 L237.5,125 L230,125"/><text class="wx-t-b wx-halo" x="290" y="282.5" text-anchor="end">22 stone steps</text><text class="wx-t-s wx-halo" x="290" y="298.5" text-anchor="end">inside the tower</text><path class="wx-thin" d="M395,384 L435,408"/><text class="wx-t-s" x="439" y="414">entrance at the base</text><path class="wx-bold" d="M16,380 H704"/><path class="wx-dim" d="M141,380 V125 M135,380h12 M135,125h12"/><text class="wx-t-n" x="133" y="252.5" text-anchor="end">8.5 m</text><path class="wx-dim" d="M165,394 H435 M165,388v12 M435,388v12"/><text class="wx-t-n" x="300" y="410" text-anchor="middle">c. 9 m at the base</text><path class="wx-dim" d="M195,113 H405"/><text class="wx-t-n" x="300" y="107" text-anchor="middle">c. 7 m at the top</text><g><circle class="wx-line" cx="475" cy="333.6" r="4.6"/><path class="wx-line" d="M475,338.2 L475,356 M468.4,380 L475,356 L481.6,380 M466.8,352.5 L475,342.3 L483.2,352.5"/></g><text class="wx-t-s" x="475" y="396" text-anchor="middle">1.7 m</text><circle class="wx-glow wx-pulse" cx="60" cy="90" r="16"/><path class="wx-dash wx-draw" pathLength="1" style="--d:14" d="M76,96 L195,125"/><text class="wx-t-s" x="60" y="126" text-anchor="middle">midsummer sunset</text><text class="wx-t-s" x="60" y="140" text-anchor="middle">(proposed alignment)</text><text class="wx-t-s" x="540" y="140">Built with stone tools,</text><text class="wx-t-s" x="540" y="154">before pottery, around</text><text class="wx-t-s" x="540" y="168">8000 BCE (c. 10,000 years ago)</text></svg></div></div><figcaption>The Neolithic tower drawn to scale, with its internal stair, a person and part of the town wall. The midsummer sunset alignment is a proposal. <span class="wx-src">Based on: Dimensions after Kenyon&#x27;s excavations (height 8.5 m, base c. 9 m, top c. 7 m, 22 steps); alignment after Barkai &amp; Liran 2011; masonry courses and wall height schematic.</span></figcaption><p class="vh">A side section of a tapering stone tower, 8.5 metres tall, about 9 metres wide at the base and 7 at the top, built of horizontal stone courses. A diagonal staircase of 22 steps rises inside from an entrance at the base to the top. To the right, a lower town wall and a 1.7 metre person give scale. Top left, a sun with a dashed line to the tower top is labelled midsummer sunset, proposed alignment. A note says it was built with stone tools, before pottery, around 8000 BCE.</p></figure><p>In 2011 Ran Barkai and Roy Liran argued that on the midsummer evening the shadow of a nearby mountain first falls on the tower and then spreads over the town, and suggested it was a communal monument meant to bind people together. That reading is possible but hard to test. What is solid is the effort: a large, organised project, in a pre-pottery village.</p></section><section class="wsec" id="age-06-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The slow taming of wheat</h3><p>Farming did not arrive as a sudden invention. Wild einkorn, barley and emmer drop their seeds when ripe. Harvesting and replanting slowly favoured rare plants whose ears stay whole, and plant remains from sites across the Fertile Crescent show those plants taking over across two to three thousand years. By c. 10,500 years ago domesticated cereals are clear; by c. 10,000 years ago goats were being herded in the Zagros mountains of Iran.</p><figure class="wx wx--steps" id="age-06-f2" data-n="4"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">How wild einkorn became a crop</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How wild einkorn became a crop"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 415" class="wx-svg" role="img" aria-labelledby="age-06-f2-t"><title id="age-06-f2-t">Four steps from wild einkorn with shattering ears to domesticated einkorn whose ears stay whole, with a chart showing the share of tough ears rising over millennia</title><text class="wx-t-cap" x="16" y="26">HOW WILD EINKORN BECAME A CROP</text><path class="wx-soil" d="M16,380 H340 V394 H16 Z"/><g class="wx-st wx-hide" data-only="1"><path class="wx-line wx-s6" d="M110,380 V150"/><ellipse class="wx-sand wx-edge-soft" cx="119" cy="220" rx="8" ry="13" transform="rotate(25,119,220)"/><ellipse class="wx-sand wx-edge-soft" cx="101" cy="202" rx="8" ry="13" transform="rotate(-25,101,202)"/><ellipse class="wx-sand wx-edge-soft" cx="119" cy="184" ge-soft" cx="309" cy="184" rx="8" ry="13" transform="rotate(25,309,184)"/><ellipse class="wx-glow wx-edge-soft" cx="291" cy="166" rx="8" ry="13" transform="rotate(-25,291,166)"/><path class="wx-line wx-s6" d="M300,158 V118"/><text class="wx-t-s" x="170" y="414" text-anchor="middle">domesticated: ears wait for the farmer</text></g><text class="wx-t-b" x="400" y="62">Share of tough (non-shattering) ears</text><text class="wx-t-s" x="400" y="78">Shape of the trend only; measured shares vary by site</text><path class="wx-line" d="M400,330 H700 M400,330 V100"/><path class="wx-guide" d="M400,225 H700"/><text class="wx-t-s" x="394" y="229" text-anchor="end">50%</text><path class="wx-guide" d="M400,120 H700"/><text class="wx-t-s" x="394" y="124" text-anchor="end">100%</text><rect class="wx-accfill wx-st" data-s="1" x="420" y="325.8" width="44" height="4.2"/><text class="wx-t-s" x="442" y="348" text-anchor="middle">wild</text><circle class="wx-num" cx="442" cy="366" r="9"/><text class="wx-numt" x="442" y="370" text-anchor="middle">1</text><rect class="wx-accfill wx-st" data-s="2" x="492" y="309" width="44" height="21"/><text class="wx-t-s" x="514" y="348" text-anchor="middle">first</text><circle class="wx-num" cx="514" cy="366" r="9"/><text class="wx-numt" x="514" y="370" text-anchor="middle">2</text><rect class="wx-accfill wx-st" data-s="3" x="564" y="235.5" width="44" height="94.5"/><text class="wx-t-s" x="586" y="348" text-anchor="middle">centuries</text><circle class="wx-num" cx="586" cy="366" r="9"/><text class="wx-numt" x="586" y="370" text-anchor="middle">3</text><rect class="wx-accfill wx-st" data-s="4" x="636" y="130.5" width="44" height="199.5"/><text class="wx-t-s" x="658" y="348" text-anchor="middle">millennia</text><circle class="wx-num" cx="658" cy="366" r="9"/><text class="wx-numt" x="658" y="370" text-anchor="middle">4</text><text class="wx-t-s" x="400" y="392">c. 2,000–3,000 years from first cultivation to fully</text><text class="wx-t-s" x="400" y="406">domesticated wheat in the Fertile Crescent</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 4.</b> Wild einkorn: when ripe, the ear shatters and the grains fall to the ground and sow themselves.</p><ol class="wx-steplist"><li>Wild einkorn: when ripe, the ear shatters and the grains fall to the ground and sow themselves.</li><li>Harvesters cutting ripe stands take home the rare plants whose ears stay whole; the rest has already fallen.</li><li>Sowing saved grain year after year lets the tough-eared plants spread through the fields.</li><li>After two to three thousand years the crop is domesticated: its ears wait for the farmer, and it depends on people to be sown.</li></ol><figcaption>The key change was an ear that does not shatter. Tap through four stages; the chart shows the shape of the trend, not measured values. <span class="wx-src">Based on: Tanno &amp; Willcox 2006; Fuller 2007; Heun et al. 1997. The chart is illustrative of the trend only.</span></figcaption><p class="vh">Left, plants of einkorn wheat standing on soil. Step 1 shows a wild ear dropping its grains. Step 2 shows a shattered wild ear beside a rare ear that keeps its grains, with a curved sickle over it. Step 3 shows a field of mostly whole ears with a few shattering ones. Step 4 shows a field where every ear is whole. Right, a bar chart of the share of tough ears grows from almost none to nearly all across four stages labelled wild, first, centuries and millennia.</p></figure><p>People also moved plants and animals by sea. Farmers reached Cyprus in this age, carrying cattle, goats, pigs and deer across tens of kilometres of open water. At Shillourokambos, c. 9,500 years ago, a person was buried with a cat, the oldest known burial of the kind.</p></section><section class="wsec" id="age-06-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Inheritance from a lost world?</h3><p>Graham Hancock sees Göbekli Tepe as too sophisticated to be a first attempt. In his reading it appears soon after the Younger Dryas catastrophe, perhaps built with help or knowledge from survivors of a lost ice-age civilisation. Martin Sweatman argues that the carvings of Pillar 43 encode the date of a comet impact. Robert Schoch, a geologist, argues that deep weathering of the Sphinx enclosure at Giza points to an age far older than the 4th Dynasty.</p><p>These are real questions, fairly asked, but the evidence so far points inward. The Göbekli builders used local flint and limestone, made regional tool types and carved local animals. Their building tradition can be traced developing across a dozen neighbouring sites and back into Natufian round houses. The excavators interpret the Pillar 43 carvings as myth and funerary imagery. Sophistication, the finds suggest, was home-grown.</p></section><section class="wsec" id="age-06-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Rising seas and stories of the flood</h3><p>Through this age the sea rose by around 35–40 m. The floor of the Persian Gulf, a broad river valley during the Ice Age, was progressively flooded, and reached roughly its modern shoreline only about 6,000 years ago. Lowlands from the North Sea to Sundaland went under. Stories of a great flood are among the most widespread in human tradition.</p><blockquote class="quote"><p>In the six hundredth year of Noah&#x27;s life, in the second month, on the seventeenth day of the month, on that day all the fountains of the great deep burst forth, and the windows of the heavens were opened.</p><cite>Genesis 7:11, New Revised Standard Version (1989)</cite></blockquote><blockquote class="quote"><p>Then We opened the gates of the heaven with rain pouring down. And caused the earth to burst with springs, and the waters met for a matter already predestined.</p><cite>Quran 54:11–12, trans. Sahih International (1997)</cite></blockquote><p>Believers read these accounts as sacred history with moral meaning, and many scholars read the Mesopotamian flood stories, including Gilgamesh, as rooted in real river floods. What can be tested is narrower: did people live through seas that drowned their land? Yes, repeatedly, and within living memory. Whether any specific text remembers post-glacial sea rise, a later local flood, or something else is open. It is a question to hold with care rather than a finding.</p></section><section class="wsec" id="age-06-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What is still buried</h3><p>Only a small part of Göbekli Tepe has been excavated, and most Taş Tepeler sites have barely been touched. Geophysical surveys hint at more enclosures and buildings under the mound. The coasts of this age, where the richest fishing and gathering sites probably were, are 20–60 m underwater. And the meanings of the pillars&#x27; animals, the reasons for filling in enclosures, the songs sung at the gatherings, are gone.</p><p>What would change the picture: full excavation of more Taş Tepeler sites, underwater survey of the early Holocene coasts of the Gulf and eastern Mediterranean, and further scientific dating of the Sphinx enclosure&#x27;s weathering. This age marks a rise, but a rise built on older foundations that we are only beginning to see.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">9,700 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">The Holocene begins</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">9,500 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Göbekli Tepe&#x27;s great enclosures begin</span></li><li class="wtl-use" style="--i:2"><span class="wtl-y">9,000 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Karahan Tepe&#x27;s rock-cut pillar room in use</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">8,500 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Domesticated cereals in the Fertile Crescent</span></li><li class="wtl-build" style="--i:4"><span class="wtl-y">8,000 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Tower of Jericho built; goats herded in the Zagros</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">7,500 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">A person buried with a cat on Cyprus</span></li><li class="wtl-find" style="--i:6"><span class="wtl-y">1952 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Kathleen Kenyon begins excavating Jericho</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">1995 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Excavations begin at Göbekli Tepe</span></li><li class="wtl-event" style="--i:8"><span class="wtl-y">2018 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Göbekli Tepe becomes a UNESCO World Heritage Site</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">2021 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Karahan Tepe&#x27;s pillar room published</span></li></ol><h3 class="sub-h wsub">Go deeper</h3><div class="links-row"><button type="button" onclick="openItem('articles','case-flood')">The Flood <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-sphinx-erosion')">The Sphinx and the Rain <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-lost-civilization')">Was There a Lost Ice Age Civilisation? <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-younger-dryas-impact')">The Younger Dryas Comet <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-atlantis')">Atlantis <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-drowned-coasts')">The Drowned Coasts <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-gobekli-tepe')">Göbekli Tepe <span aria-hidden="true">→</span></button></div><details class="srcs"><summary>Sources for this age (20)</summary><ol><li>Walker M. et al. (2009). Formal definition and dating of the GSSP for the base of the Holocene. Journal of Quaternary Science 24: 3–17. <a href="https://doi.org/10.1002/jqs.1227" target="_blank" rel="noopener">doi:10.1002/jqs.1227</a></li><li>Lambeck K. et al. (2014). Sea level and global ice volumes from the Last Glacial Maximum to the Holocene. PNAS 111: 15296–15303. <a href="https://doi.org/10.1073/pnas.1411762111" target="_blank" rel="noopener">doi:10.1073/pnas.1411762111</a></li><li>Schmidt K. (2012). Göbekli Tepe: A Stone Age Sanctuary in South-Eastern Anatolia. Berlin: ex oriente.</li><li>Dietrich O. et al. (2012). The role of cult and feasting in the emergence of Neolithic communities: new evidence from Göbekli Tepe. Antiquity 86: 674–695. <a href="https://doi.org/10.1017/S0003598X00047840" target="_blank" rel="noopener">doi:10.1017/S0003598X00047840</a></li><li>Dietrich L. et al. (2019). Cereal processing at Early Neolithic Göbekli Tepe, southeastern Turkey. PLOS ONE 14: e0215214. <a href="https://doi.org/10.1371/journal.pone.0215214" target="_blank" rel="noopener">doi:10.1371/journal.pone.0215214</a></li><li>Karul N. (2021). Buried buildings at Pre-Pottery Neolithic Karahantepe. Türk Arkeoloji ve Etnografya Dergisi 82: 21–31.</li><li>Kenyon K.M. (1957). Digging Up Jericho. London: Ernest Benn.</li><li>Barkai R. &amp; Liran R. (2011). Midsummer sunset at Neolithic Jericho. Time and Mind 4: 273–283.</li><li>Zeder M.A. (2011). The origins of agriculture in the Near East. Current Anthropology 52: S221–S235. <a href="https://doi.org/10.1086/659307" target="_blank" rel="noopener">doi:10.1086/659307</a></li><li>Zeder M.A. &amp; Hesse B. (2000). The initial domestication of goats (Capra hircus) in the Zagros Mountains 10,000 years ago. Science 287: 2254–2257. <a href="https://doi.org/10.1126/science.287.5461.2254" target="_blank" rel="noopener">doi:10.1126/science.287.5461.2254</a></li><li>Heun M. et al. (1997). Site of einkorn wheat domestication identified by DNA fingerprinting. Science 278: 1312–1314. <a href="https://doi.org/10.1126/science.278.5341.1312" target="_blank" rel="noopener">doi:10.1126/science.278.5341.1312</a></li><li>Tanno K. &amp; Willcox G. (2006). How fast was wild wheat domesticated? Science 311: 1886.</li><li>Fuller D.Q. (2007). Contrasting patterns in crop domestication and domestication rates: recent archaeobotanical insights from the Old World. Annals of Botany 100.</li><li>Vigne J.-D. et al. (2004). Early taming of the cat in Cyprus. Science 304: 259. <a href="https://doi.org/10.1126/science.1095335" target="_blank" rel="noopener">doi:10.1126/science.1095335</a></li><li>Sweatman M.B. &amp; Tsikritsis D. (2017). Decoding Göbekli Tepe with archaeoastronomy: what does the fox say? Mediterranean Archaeology and Archaeometry 17(1).</li><li>Hancock G. (2015). Magicians of the Gods. London: Coronet.</li><li>Schoch R.M. (1992). Redating the Great Sphinx of Giza. KMT: A Modern Journal of Ancient Egypt 3(2).</li><li>Lambeck K. (1996). Shoreline reconstructions for the Persian Gulf since the last glacial maximum. Earth and Planetary Science Letters 142.</li><li>The Holy Bible, New Revised Standard Version (1989). Genesis 7:11.</li><li>The Quran, 54:11–12, trans. Sahih International (1997).</li></ol></details></div></script><script type="text/x-tpl" id="age-07-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Great god of Sefar.jpg" data-cap="The &#x27;Great God of Sefar&#x27;, a Round Head painting in the Tassili n&#x27;Ajjer" data-big><figcaption></figcaption></figure><div class="sh-k">c. 9,000–5,500 years ago</div><h2 class="sh-t" id="age-07-st" tabindex="-1">The Green Sahara</h2><p class="sh-s">The world&#x27;s biggest hot desert held lakes, hippos and painters, until the rains moved south and a whole people walked toward the Nile.</p><div class="sh-v"><span class="vstamp vstamp--phase" style="--vc:var(--bronze)"><span aria-hidden="true">↕</span>Rise and fall</span></div></div><p class="v4-q">When the Sahara dried, did its refugees help make Egypt?</p><div class="ctrs"><div class="ctr"><div class="ctr-v">up to c. <b class="ctr-n" data-v="350000" >350,000</b><span class="ctr-u"> km²</span></div><div class="ctr-l">possible area of Lake Mega-Chad at its Holocene peak (estimates vary)</div><div class="ctr-c">Drake and Bristow 2006; Armitage et al. 2015</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="200" >200</b><span class="ctr-u"> burials</span></div><div class="ctr-l">graves at the Gobero lakeside cemeteries, Niger</div><div class="ctr-c">Sereno et al. 2008</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="3.3" data-dec="1">3.3</b><span class="ctr-u"> °C</span></div><div class="ctr-l">Greenland cooling in under 20 years at the 8.2 ka event</div><div class="ctr-c">Kobashi et al. 2007</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="50" >50</b><span class="ctr-u"> km³ a day</span></div><div class="ctr-l">Bosporus inflow proposed in the Black Sea flood hypothesis</div><div class="ctr-c">Ryan and Pitman 1998</div></div><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="15000" >15,000</b><span class="ctr-u"> images</span></div><div class="ctr-l">paintings and engravings recorded at Tassili n&#x27;Ajjer</div><div class="ctr-c">UNESCO World Heritage List</div></div></div><div class="rf"><div class="rf-c rf-up"><h3 class="rf-h"><span aria-hidden="true">▲</span> What rose</h3><ul><li>Lakes, grassland and savanna across much of today&#x27;s Sahara, with hippos, crocodiles and fish far from any modern river</li><li>Fishing and then cattle-herding cultures in the Sahara, from Gobero in Niger to Nabta Playa in Egypt</li><li>One of the world&#x27;s great rock-art traditions at Tassili n&#x27;Ajjer and Sefar</li><li>Çatalhöyük in Anatolia: a crowded farming town of mud-brick houses entered through the roof</li><li>Growing farming villages along the Nile and in the Near East</li></ul></div><div class="rf-c rf-down"><h3 class="rf-h"><span aria-hidden="true">▼</span> What fell or was lost</h3><ul><li>The Green Sahara itself, as the monsoon rains retreated south from about 6,000 to 5,000 years ago</li><li>Saharan lakes such as Mega-Chad, which shrank to a fraction of their size</li><li>Human life across most of the eastern Sahara, abandoned except for oases by about 3500 BCE</li><li>A freshwater lake in the Black Sea basin, turned salt when the Mediterranean broke in (how fast is disputed)</li></ul></div></div><h3 class="sub-h wsub">What drove it</h3><div class="trigs"><div class="trig"><b>Slow orbital change</b><span>The wobble of Earth&#x27;s axis (precession) slowly reduced Northern Hemisphere summer sunlight after about 11,000 years ago, weakening the West African monsoon over millennia (deMenocal et al. 2000).</span></div><div class="trig"><b>The 8.2 kiloyear cold snap</b><span>Greenland ice records a cooling of about 3.3 °C in under 20 years around 8,200 years ago, after huge meltwater lakes in North America drained into the Atlantic (Alley et al. 1997; Barber et al. 1999; Kobashi et al. 2007).</span></div><div class="trig"><b>Rising seas and a breached strait</b><span>Postglacial sea-level rise eventually reconnected the Mediterranean with the Black Sea basin; cores disagree on whether the inflow was catastrophic or gradual (Ryan et al. 1997; Aksu et al. 2002).</span></div><div class="trig"><b>Vegetation feedback</b><span>As plants died back, bare ground reflected more sunlight and gave up less moisture, which may have sped the drying in some regions (deMenocal et al. 2000; Tierney et al. 2017).</span></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>As the Green Sahara dried, its people moved toward the Nile and the Sahel, and their herding culture helped shape early Egypt.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The first half of the claim is strongly supported: hundreds of radiocarbon dates track people leaving the drying eastern Sahara for the Nile valley, oases and the south between about 5300 and 3500 BCE. The second half is harder to test. Cattle burials and cattle symbolism at Nabta Playa and in early Egyptian art are suggestive, and Egypt&#x27;s own population was mixed, but no single line of evidence traces particular beliefs from desert herders into Pharaonic religion. So the whole claim rates as plausible, not strong.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">School histories of Egypt still often begin on the Nile, as if the desert had always been empty; that is underconfident about a well-evidenced Saharan prelude. Popular accounts go the other way on timing, presenting a single abrupt &#x27;switch&#x27; 5,500 years ago as settled. The records disagree: some show an abrupt end, others a slow fade, and the end came earlier in the north than in the south.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Much of the Sahara was wetter and greener during the African Humid Period, roughly 11,000 to 5,500 years ago, with lakes, grassland and savanna animals.<small>deMenocal et al. 2000; Tierney et al. 2017</small></li><li>Lakeside cemeteries at Gobero, Niger, hold about 200 burials from two cultures, with bones of fish, crocodiles and hippos.<small>Sereno et al. 2008</small></li><li>Radiocarbon-dated sites show people leaving the eastern Sahara for the Nile valley and the Sahel as the rains failed, with the Egyptian Sahara largely abandoned outside oases by about 3500 BCE.<small>Kuper and Kröpelin 2006</small></li><li>A sharp cold event about 8,200 years ago is recorded in ice cores and across the Northern Hemisphere, and it marks the start of the Northgrippian Age of the Holocene.<small>Alley et al. 1997; Walker et al. 2019</small></li><li>The Black Sea was once a lake that the Mediterranean reconnected with in the early Holocene.<small>Ryan et al. 1997; Yanko-Hombach et al. 2007</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the Green Sahara ended abruptly around 5,500 years ago or drained away gradually over two millennia, and whether that timing differed from north to south.</li><li>Whether the Black Sea filled in a catastrophic deluge in months, or rose over decades to centuries, and whether any people saw it.</li><li>How much of early Egyptian culture, such as the reverence for cattle, came with herders who left the Sahara.</li><li>Whether the 8.2 kiloyear event disrupted farming villages in the Near East or merely coincided with changes already under way.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Countless lakeshore camps have been scoured away by wind or buried under dunes, and vast parts of the Sahara have never been surveyed on foot.</li><li>Most Saharan rock paintings cannot be dated directly, so their ages rest on style sequences and nearby deposits.</li><li>The drowned Black Sea shelf, where any flooded villages would lie, has barely been searched by archaeologists.</li></ul></div></div><h3 class="sub-h wsub">The bold reading</h3><div class="face"><div class="face-c face-x" style="grid-column:1/-1"><p>Marine geologists William Ryan and Walter Pitman argued in 1997 and in their book Noah&#x27;s Flood that the Mediterranean burst through the Bosporus into a low freshwater lake, pouring in about 50 km³ of water a day for at least 300 days and drowning roughly 100,000 km² of land. Farmers fleeing its shores, they suggested, carried the memory into the flood stories of the Near East. Separately, archaeologists Rudolph Kuper and Stefan Kröpelin argued that Egypt&#x27;s civilisation cannot be understood from the Nile alone: it was built partly by Saharan people pushed into the valley by drought.</p><div class="face-s"><b>Its strongest point</b><p>Ryan and Pitman&#x27;s cores show freshwater shells abruptly replaced by Mediterranean species across the shelf, with drowned beaches and dunes far below today&#x27;s sea level: evidence of a real and dramatic change.</p></div><p class="face-cr"><b>Credit</b> William Ryan and Walter Pitman (Black Sea flood); Kuper and Kröpelin&#x27;s &#x27;climate motor&#x27; thesis as a challenge to Nile-only accounts of Egypt</p></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">6 min read · 1,211 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of The Green Sahara"><button type="button" class="wtoc-i" data-go="age-07-s1">Hippos in the Ténéré</button><button type="button" class="wtoc-i" data-go="age-07-s2">Reading a vanished monsoon</button><button type="button" class="wtoc-i" data-go="age-07-s3">The cold snap of 8,200 years ago</button><button type="button" class="wtoc-i" data-go="age-07-s4">Did the sea break into the Black Sea?</button><button type="button" class="wtoc-i" data-go="age-07-s5">Turning off the tap</button><button type="button" class="wtoc-i" data-go="age-07-s6">What the sand keeps, and what it erased</button></nav></div><section class="wsec" id="age-07-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Hippos in the Ténéré</h3><p>Stand at Gobero, in the Ténéré desert of Niger, and the horizon is sand in every direction. In 2000 a team led by palaeontologist Paul Sereno, out looking for dinosaurs, found something stranger: human skeletons weathering out of the dunes beside the bones of large fish, crocodiles and hippos. About 200 graves turned up, left by two peoples. The Kiffian people fished a lake here from roughly 9,700 to 8,200 years ago. After a dry gap, the Tenerian people buried their dead in the same spot from about 7,200 to 4,500 years ago. One Tenerian grave holds a woman and two children laid close together, and pollen in the grave hints that flowers were placed with them.</p><p>This is the African Humid Period, the Green Sahara. For thousands of years the world&#x27;s largest hot desert was a patchwork of grassland, scrub, wetlands and lakes. It is one of the clearest cases on Earth of a landscape that looks eternal and is not, and it sets up this age&#x27;s question: when the water left, where did the people go, and what did they carry with them?</p><blockquote class="wpull"><p>The emptiest place on the map was once a lakeshore with fishermen, hippos and funerals.</p></blockquote></section><section class="wsec" id="age-07-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Reading a vanished monsoon</h3><p>The cause was astronomical. Earth&#x27;s axis wobbles on a cycle of about 23,000 years, and around 11,000 years ago that wobble gave the Northern Hemisphere its strongest summer sunshine. North Africa heated up, pulled in moist Atlantic air, and the West African monsoon pushed hundreds of kilometres further north than it reaches today. Leaf waxes in marine sediments suggest that parts of the western Sahara received many times today&#x27;s rainfall.</p><p>The lakes were the most spectacular result. Ancient shorelines show that Lake Chad, today a shrinking wetland, swelled into Lake Mega-Chad, which by some estimates covered around 350,000 km², roughly the area of Germany. Smaller lakes filled in the Fezzan of Libya, in northern Chad and in the Nubian desert of Sudan. Painters on the Tassili plateau recorded giraffes, elephants and, later, herds of spotted cattle.</p><figure class="wx wx--steps" id="age-07-f1" data-n="4"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">The Sahara then and now</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The Sahara then and now"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 490" class="wx-svg" role="img" aria-labelledby="age-07-f1-t"><title id="age-07-f1-t">Map of North Africa showing the Sahara today, the Green Sahara with its great lakes, its people, and the retreat of the rains</title><defs><marker id="age-07-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker><marker id="age-07-f1-ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker><clipPath id="age-07-f1-land"><path d="M636.4,49.4 L628.5,54.8 L629.4,57.2 L629.7,58.2 L617.7,63.4 L611.9,61.7 L609.2,56.6 L614.8,56.2 L617.3,53 L625.7,53.2 L636.4,49.4ZM508.9,49 L515.3,53.3 L524.4,52.6 L533.2,53.4 L532.9,55.7 L539.3,54.1 L537.8,57.9 L520.9,58.9 L521,56.9 L506.7,54.4 L508.9,49ZM411.8,20 L408.8,27 L410.5,31 L408.1,37.4 L399.1,32.7 L393.1,31.3 L376.8,24.9 L378,20ZM700,20 L700,244.2 L697.7,243.3 L689.9,231.3 L688.5,222.5 L689,215 L682.3,201 L676.8,196 L670.5,193.4 L666.6,186.2 L667.3,183.3 L664,176.7 L660.6,173.9 L656,164.5 L648.9,154.3 L642.9,145.6 L637,145.7 L638.9,138.8 L639.4,134.3 L640.8,129.3 L640.5,127.5 L637.2,132.6 L634.6,142.1 L631.5,148.7 L628.7,150.9 L624.8,146.8 L619.5,141.2 L611.2,123 L610,124.2 L614.8,137.5 L622,150.3 L630.9,169.9 L635.2,176.8 L639,184 L649.5,198 L647.2,200.2 L647.6,208.4 L661.2,219.7 L663.3,222.3 L667.1,234.7 L664.5,237 L666.2,250 L670.5,265.1 L674.9,268.2 L681.4,272.9 L688.2,287.5 L691.4,299.2 L697.8,305.3 L700,307 L700,424.63 L285.1,424.63 L281.7,421.2 L272.9,421.4 L262.6,421.4 L252.9,422.8 L246.5,424.63 L107.3,424.63 L104.8,422.9 L96.9,414.7 L93.8,413.8 L85.3,408.7 L79.2,401.9 L77.2,397.3 L75.7,387.9 L70.6,380.5 L66,375.5 L63,373.9 L60.1,371.3 L58.8,365.8 L57,363 L53.7,360.9 L47.4,355.6 L42.4,354.8 L39.8,351.2 L39.8,349.3 L36.3,346.6 L35.5,343.9 L33.6,334.2 L35.1,328.6 L30.2,318.8 L24.4,314.3 L29.6,311.9 L35.2,303 L38,296.5 L37,289.7 L40.3,283.4 L41.7,271.5 L40.4,259 L39,252.7 L40.2,246.4 L37.2,240.4 L31,235 L31.5,229.6 L32,223.8 L36.5,220.3 L40.4,213.7 L39.6,209.4 L43.7,200.5 L50
