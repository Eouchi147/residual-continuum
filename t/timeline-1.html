ass="wx-hl" marker-end="url(#age-12-f2-ah)" d="M341.5,269.2 Q211.4,204.3 66.4,194.4"/><circle class="wx-bronze wx-edge" cx="61.3" cy="194.1" r="5"/><circle class="wx-accfill wx-edge" cx="67.3" cy="174.6" r="6.5"/><path class="wx-hl" marker-end="url(#age-12-f2-ah)" d="M58.9,188.1 Q56.5,181.9 62,178.2"/><text class="wx-t-b wx-halo" x="63.3" y="220.1" text-anchor="start">Córdoba</text><text class="wx-t-s wx-halo" x="63.3" y="235.1" text-anchor="start">libraries, 10th c.</text><text class="wx-t-b wx-halo" x="79.3" y="170.6" text-anchor="start">Toledo</text><text class="wx-t-s wx-halo" x="79.3" y="185.6" text-anchor="start">Arabic into Latin, 12th c.</text></g><g class="wx-st wx-hide" data-s="5"><path class="wx-hl" marker-end="url(#age-12-f2-ah)" d="M71.6,171.6 Q118.6,138.5 176.1,136.7"/><path class="wx-hl" marker-end="url(#age-12-f2-ah)" d="M66.2,169.3 Q54.7,111.6 86.2,61.9"/><circle class="wx-c4 wx-edge" cx="181.3" cy="136.5" r="5"/><circle class="wx-c4 wx-edge" cx="89.1" cy="57.3" r="5"/><text class="wx-t-b wx-halo" x="191.3" y="132.5" text-anchor="start">Pisa: Fibonacci, 1202</text><text class="wx-t-s wx-halo" x="191.3" y="147.5" text-anchor="start">Hindu–Arabic numerals</text><text class="wx-t-b wx-halo" x="99.1" y="53.3" text-anchor="start">Oxford</text><text class="wx-t-s wx-halo" x="99.1" y="68.3" text-anchor="start">optics in Latin, 13th c.</text></g><text class="wx-t-cap" x="20" y="26">HOW SCIENCE TRAVELLED, c. 500–1250 CE</text><text class="wx-st wx-hide wx-t-cap wx-t-a" data-only="1" x="700" y="26" text-anchor="end">GREEK SOURCES</text><text class="wx-st wx-hide wx-t-cap wx-t-a" data-only="2" x="700" y="26" text-anchor="end">CONVERGING ON BAGHDAD</text><text class="wx-st wx-hide wx-t-cap wx-t-a" data-only="3" x="700" y="26" text-anchor="end">NEW DISCOVERIES</text><text class="wx-st wx-hide wx-t-cap wx-t-a" data-only="4" x="700" y="26" text-anchor="end">THROUGH AL-ANDALUS</text><text class="wx-st wx-hide wx-t-cap wx-t-a" data-only="5" x="700" y="26" text-anchor="end">INTO LATIN EUROPE</text><text class="wx-t-s" x="20" y="392.6">Routes are simplified: books and scholars moved along many paths, including through Sicily and Byzantium.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Greek science in Athens and Alexandria; Syriac Christian scholars keep and translate it.</p><ol class="wx-steplist"><li>Greek science in Athens and Alexandria; Syriac Christian scholars keep and translate it.</li><li>8th–10th centuries: Greek, Persian and Indian learning converges on Baghdad.</li><li>New work: al-Khwarizmi&#x27;s algebra, al-Biruni&#x27;s measurements, Ibn al-Haytham&#x27;s optics.</li><li>West through al-Andalus: Córdoba&#x27;s libraries and Toledo&#x27;s translators (12th century).</li><li>Into Latin Europe: new numerals, Ptolemy, Galen and optics in the universities.</li></ol><figcaption>How Greek, Persian and Indian science reached Baghdad, grew there and in Cairo, and passed through Toledo into Latin Europe. Routes simplified. <span class="wx-src">Based on: Coastlines: Natural Earth 1:110m. Routes after Gutas 1998, Burnett 2001 and Sabra 1989; simplified.</span></figcaption><p class="vh">A map from Iberia to India. Step one marks Athens and Alexandria with Greek science, and Syriac translators at Edessa and Gundeshapur. Step two shows arrows from Alexandria, Gundeshapur and India converging on Baghdad, the House of Wisdom, in the 8th to 10th centuries. Step three marks new work: al-Khwarizmi in Baghdad around 820, Ibn al-Haytham in Cairo around 1011 to 1021 and al-Biruni in Ghazni. Step four shows the westward route to Córdoba and Toledo, where 12th-century translators produced Latin versions. Step five shows arrows into Latin Europe, to Pisa, where Fibonacci popularised Hindu-Arabic numerals in 1202, and to Oxford.</p></figure><p>Translation turned into discovery. Around 820 Muhammad ibn Musa al-Khwarizmi wrote the book whose title gave us &#x27;algebra&#x27;, and his name, in Latin, gave us &#x27;algorithm&#x27;. Al-Razi distinguished smallpox from measles. In Cairo, between about 1011 and 1021, Ibn al-Haytham wrote his Book of Optics, arguing from careful experiments with light and dark rooms that we see because light enters the eye. After Castile took Toledo in 1085, scholars there, such as Gerard of Cremona, translated dozens of these Arabic works into Latin, and they became textbooks of medieval European universities.</p><aside class="wcall"><b>How do we know?</b><p>The relay left fingerprints in words. Algebra, algorithm, zero (via Arabic sifr), alkali, almanac and the names of stars such as Aldebaran and Betelgeuse all came into European languages through Arabic. Latin manuscripts name their translators and the Arabic books they worked from, and some Greek works, such as parts of Apollonius on conic sections, survive only in their Arabic versions.</p></aside></section><section class="wsec" id="age-12-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Drought in the Maya forest</h3><p>Across the Atlantic, the great Classic Maya cities of the southern lowlands were emptying. Between about 800 and 950, cities such as Tikal and Calakmul stopped raising dated monuments; the last known Long Count date was carved in 909. Sediment cores from Lake Chichancanab show annual rainfall 41 to 54% lower than before during this period, with deeper falls in the worst droughts. Warfare between cities, deforestation and overstretched kings made the drought harder to survive. Northern cities such as Chichen Itza flourished for a time afterwards, and millions of Maya people live in the region today.</p></section><section class="wsec" id="age-12-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>A comet in the tree rings?</h3><p>The Belfast dendrochronologist Mike Baillie, whose oak chronologies helped expose the 536 downturn, made a bolder suggestion. In Exodus to Arthur he argued that cometary debris, not only volcanoes, darkened the sky, and that stories of fiery dragons and wasted lands from this period, including the Arthurian legends, might remember it. Dallas Abbott and colleagues later reported possible cosmic dust in Greenland ice of the time. It is a fair question, and the tree rings are extraordinary. But the ice cores now show volcanic sulphate in both 536 and 540, enough to explain the cooling without an impact, so the comet remains unconfirmed.</p></section><section class="wsec" id="age-12-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What was lost in the relay</h3><p>The relay was not lossless. The House of Wisdom&#x27;s library vanished when the Mongols sacked Baghdad in 1258. Most Maya books were burned by Spanish clergy in the 16th century; four survive. Some Greek works known to Arabic scholars have been lost in both languages. The phrase &#x27;Dark Ages&#x27; hides all of this: in this age the light did not go out, it moved.</p><blockquote class="wpull"><p>The lamp of learning was never switched off. It was carried from one hand to another, and each hand added something.</p></blockquote></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">536 CE</span><span class="wtl-k">Event</span><span class="wtl-t">The &#x27;dark year&#x27;: a dim sun and failed harvests</span></li><li class="wtl-loss" style="--i:1"><span class="wtl-y">541 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Plague reaches Pelusium in Egypt</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">610 CE</span><span class="wtl-k">Event</span><span class="wtl-t">First revelation of the Quran (traditional date)</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">622 CE</span><span class="wtl-k">Event</span><span class="wtl-t">The hijra to Medina; the Islamic calendar begins</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">627 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Heraclius defeats the Persians near Nineveh</span></li><li class="wtl-build" style="--i:5"><span class="wtl-y">762 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Baghdad founded</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">820 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Al-Khwarizmi&#x27;s book on al-jabr (approx.)</span></li><li class="wtl-loss" style="--i:7"><span class="wtl-y">909 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Last known Maya Long Count date</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">1011 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Ibn al-Haytham begins his Book of Optics (approx.)</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">2015 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Birmingham Quran leaves radiocarbon dated</span></li></ol><h3 class="sub-h wsub">Go deeper</h3><div class="links-row"><button type="button" onclick="openItem('articles','case-moon-split')">The Splitting of the Moon <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-alexandria-library')">The Library of Alexandria Did Not Burn in a Day <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-arthur')">King Arthur <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-dhul-qarnayn')">Dhul-Qarnayn and the Wall Against Gog and Magog <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-sheba')">The Queen of Sheba and the Flood of the Dam <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-kailasa')">Kailasa temple <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-greek-fire')">Greek fire <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-damascus-steel')">Damascus steel <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-qanats-yakhchal')">Qanats and ice houses <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-teotihuacan')">Teotihuacan <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-lycurgus-cup')">Lycurgus Cup <span aria-hidden="true">→</span></button></div><details class="srcs"><summary>Sources for this age (18)</summary><ol><li>Procopius. History of the Wars, Books III–IV. Trans. H. B. Dewing. Loeb Classical Library (1916).</li><li>Sigl, M. et al. (2015). Timing and climate forcing of volcanic eruptions for the past 2,500 years. Nature 523: 543–549. <a href="https://doi.org/10.1038/nature14565" target="_blank" rel="noopener">doi:10.1038/nature14565</a></li><li>Büntgen, U. et al. (2016). Cooling and societal change during the Late Antique Little Ice Age from 536 to around 660 AD. Nature Geoscience 9: 231–236. <a href="https://doi.org/10.1038/ngeo2652" target="_blank" rel="noopener">doi:10.1038/ngeo2652</a></li><li>Toohey, M. et al. (2016). Climatic and societal impacts of a volcanic double event at the dawn of the Middle Ages. Climatic Change 136: 401–412. <a href="https://doi.org/10.1007/s10584-016-1648-7" target="_blank" rel="noopener">doi:10.1007/s10584-016-1648-7</a></li><li>Wagner, D. M. et al. (2014). Yersinia pestis and the Plague of Justinian 541–543 AD: a genomic analysis. Lancet Infectious Diseases 14: 319–326. <a href="https://doi.org/10.1016/S1473-3099(13)70323-2" target="_blank" rel="noopener">doi:10.1016/S1473-3099(13)70323-2</a></li><li>Keller, M. et al. (2019). Ancient Yersinia pestis genomes from across Western Europe reveal early diversification during the First Pandemic (541–750). PNAS 116: 12363–12372. <a href="https://doi.org/10.1073/pnas.1820447116" target="_blank" rel="noopener">doi:10.1073/pnas.1820447116</a></li><li>Mordechai, L. et al. (2019). The Justinianic Plague: an inconsequential pandemic? PNAS 116: 25546–25554. <a href="https://doi.org/10.1073/pnas.1903797116" target="_blank" rel="noopener">doi:10.1073/pnas.1903797116</a></li><li>Ward-Perkins, B. (2005). The Fall of Rome and the End of Civilization. Oxford University Press.</li><li>Harper, K. (2017). The Fate of Rome: Climate, Disease, and the End of an Empire. Princeton University Press.</li><li>Abdel Haleem, M. A. S. (trans.) (2004). The Qur&#x27;an. Oxford World&#x27;s Classics. Oxford University Press.</li><li>University of Birmingham (2015). Birmingham Qur&#x27;an manuscript dated among the oldest in the world. Press release, 22 July 2015.</li><li>Kaegi, W. E. (2003). Heraclius, Emperor of Byzantium. Cambridge University Press.</li><li>Gutas, D. (1998). Greek Thought, Arabic Culture: The Graeco-Arabic Translation Movement in Baghdad and Early &#x27;Abbasid Society. Routledge.</li><li>Sabra, A. I. (1989). The Optics of Ibn al-Haytham, Books I–III: On Direct Vision. Warburg Institute.</li><li>Burnett, C. (2001). The coherence of the Arabic-Latin translation program in Toledo in the twelfth century. Science in Context 14: 249–288.</li><li>Evans, N. P. et al. (2018). Quantification of drought during the collapse of the classic Maya civilization. Science 361: 498–501. <a href="https://doi.org/10.1126/science.aas9871" target="_blank" rel="noopener">doi:10.1126/science.aas9871</a></li><li>Baillie, M. (1999). Exodus to Arthur: Catastrophic Encounters with Comets. Batsford.</li><li>Adapa, S. R. et al. (2025). Genetic evidence of Yersinia pestis from the first pandemic. Genes 16: 926. <a href="https://doi.org/10.3390/genes16080926" target="_blank" rel="noopener">doi:10.3390/genes16080926</a></li></ol></details></div></script><script type="text/x-tpl" id="age-13-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Western Entrance to the Great Enclosure - Great Zimbabwe II (46698655045).jpg" data-cap="The Great Enclosure at Great Zimbabwe" data-big><figcaption></figcaption></figure><div class="sh-k">c. 1000–1500 CE</div><h2 class="sh-t" id="age-13-st" tabindex="-1">Rises and Falls to 1500</h2><p class="sh-s">Cities of a million acres rose on four continents, then a colder climate and the deadliest pandemic in history tested them all.</p><div class="sh-v"><span class="vstamp vstamp--phase" style="--vc:var(--bronze)"><span aria-hidden="true">↕</span>Rise and fall</span></div></div><p class="v4-q">Why did so many great cities empty in the same two centuries?</p><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="1000" >1,000</b><span class="ctr-u"> km²</span></div><div class="ctr-l">approximate extent of greater Angkor&#x27;s urban complex</div><div class="ctr-c">Evans et al. 2007</div></div><div class="ctr"><div class="ctr-v">up to <b class="ctr-n" data-v="60" >60</b><span class="ctr-u"> %</span></div><div class="ctr-l">upper estimate of Europe&#x27;s population lost to the Black Death, 1347–1351 (lower estimates c. 30%)</div><div class="ctr-c">Benedictow 2004</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="30" >30</b><span class="ctr-u"> m</span></div><div class="ctr-l">height of Monks Mound at Cahokia, the largest earthwork north of Mexico</div><div class="ctr-c">Pauketat 2009</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="11" >11</b><span class="ctr-u"> m</span></div><div class="ctr-l">maximum height of the Great Enclosure wall, Great Zimbabwe</div><div class="ctr-c">Chirikure et al. 2017</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="350000" >350,000</b><span class="ctr-u"> manuscripts</span></div><div class="ctr-l">evacuated from Timbuktu to Bamako in 2012–2013</div><div class="ctr-c">SAVAMA-DCI; UNESCO</div></div></div><div class="rf"><div class="rf-c rf-up"><h3 class="rf-h"><span aria-hidden="true">▲</span> What rose</h3><ul><li>Angkor in Cambodia, the largest low-density urban complex of the pre-industrial world, with Angkor Wat</li><li>Great Zimbabwe, a stone-walled capital of a gold-trading state in southern Africa</li><li>Cahokia, a city of earthen pyramids on the Mississippi, and the moai of Rapa Nui</li><li>The Mongol empire, the largest land empire in history, and the trade it opened across Eurasia</li><li>Mali and the scholarly city of Timbuktu, whose manuscripts span law, medicine, astronomy and poetry</li></ul></div><div class="rf-c rf-down"><h3 class="rf-h"><span aria-hidden="true">▼</span> What fell or was lost</h3><ul><li>Cahokia, largely abandoned by about 1350</li><li>Angkor as a royal capital, which declined through the 14th and 15th centuries</li><li>Perhaps 30–60% of Europe&#x27;s people, and many in the Middle East and North Africa, in the Black Death of 1347–1351</li><li>The Norse settlements of Greenland, silent after the early 15th century</li><li>Great Zimbabwe, whose people dispersed in the 15th century</li></ul></div></div><h3 class="sub-h wsub">What drove it</h3><div class="trigs"><div class="trig"><b>A colder climate</b><span>Ice-cap and lake records suggest an abrupt onset of Little Ice Age cooling between 1275 and 1300, triggered by volcanic eruptions including Samalas in 1257, and intensified after 1430 (Miller et al. 2012; Lavigne et al. 2013).</span></div><div class="trig"><b>Monsoon extremes</b><span>Tree rings from Vietnam show decades-long droughts in the mid to late 14th and early 15th centuries, punctuated by intense monsoons, as Angkor declined (Buckley et al. 2010).</span></div><div class="trig"><b>Plague</b><span>Genomes from burials near Lake Issyk-Kul trace the Black Death&#x27;s source strain to the Tian Shan around 1338–1339 (Spyrou et al. 2022).</span></div><div class="trig"><b>Floods and drought on the Mississippi</b><span>Sediment and faecal stanol records link Cahokia&#x27;s decline to flooding and drier summers (Munoz et al. 2015; White et al. 2019).</span></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>A colder, more erratic climate from about 1300 was a major driver of the collapses of this age, from Angkor to Cahokia and Norse Greenland.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Climate records do show an abrupt cooling after about 1275–1300, megadroughts and floods in the Asian monsoon, and flooding and drought on the Mississippi, all near the times these places declined. But each case also has strong human causes: shifting trade (walrus ivory for Greenland, maritime commerce for Angkor), war, and the Black Death. And many societies thrived through the same climate. So climate is a plausible major driver, not a demonstrated single cause. Menzies&#x27; 1421 voyage, by contrast, has no receipts: Ming records place the fleets in the Indian Ocean, and no Chinese wreck or artefact of that date has been found in the Americas.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks present the Black Death confidently, and with good reason. They are less reliable elsewhere: Great Zimbabwe, Angkor and Cahokia are often squeezed into a sentence, and older colonial accounts even denied that Africans built Great Zimbabwe. On climate they tend to swing between silence and simple determinism. The evidence supports a middle position that few textbooks state: climate shocks mattered most where societies were already rigid or overextended.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>The Black Death reached the Black Sea by 1346, Italy and southern France in 1347, and much of Europe by 1351.<small>Benedictow 2004</small></li><li>Ancient genomes place the origin of the Black Death strain in the Tian Shan region around 1338–1339.<small>Spyrou et al. 2022</small></li><li>Angkor&#x27;s urban complex, mapped from radar and lidar, covered roughly 1,000 km² of houses, canals and reservoirs.<small>Evans et al. 2007; Evans et al. 2013</small></li><li>Great Zimbabwe was built by the ancestors of the Shona-speaking peoples; its Great Enclosure wall is up to about 11 m high.<small>Garlake 1973; Chirikure et al. 2017</small></li><li>About 350,000 Timbuktu manuscripts were evacuated to Bamako in 2012–2013; 4,203 were burned or stolen.<small>UNESCO; Haidara and SAVAMA-DCI</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>What share of Europe died in the Black Death: estimates range from about 30% to 60%.</li><li>Whether Angkor &#x27;collapsed&#x27; in the 15th century or declined slowly as elites moved south.</li><li>How many people lived at Cahokia at its peak: estimates range from about 10,000 to more than 20,000.</li><li>How much the Little Ice Age, rather than trade and politics, doomed Norse Greenland.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Cahokia&#x27;s people left no writing, so their account of why they left is lost.</li><li>Most houses at Angkor and Great Zimbabwe were of wood, thatch or daga (mud), and have vanished; lidar and survey are only now revealing their extent.</li><li>Many West African manuscripts are still in private family collections and uncatalogued.</li></ul></div></div><h3 class="sub-h wsub">The bold reading</h3><div class="face"><div class="face-c face-x" style="grid-column:1/-1"><p>Retired submarine officer Gavin Menzies argued in 2002 that Ming treasure fleets under Zheng He and his captains sailed around the world in 1421–1423, reaching the Americas, Australia and Antarctica decades before Europeans, and that this knowledge was then lost when China turned inward. He pointed to early maps showing lands supposedly unknown to Europeans and to the undoubted scale of the Ming fleets.</p><div class="face-s"><b>Its strongest point</b><p>Ming China really did send fleets of dozens of large ships as far as Arabia and East Africa between 1405 and 1433, and then abandoned ocean voyaging, so the capability and the forgetting are both real.</p></div><p class="face-cr"><b>Credit</b> Gavin Menzies (1421: The Year China Discovered the World)</p></div></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,020 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of Rises and Falls to 1500"><button type="button" class="wtoc-i" data-go="age-13-s1">Cities the textbooks forgot</button><button type="button" class="wtoc-i" data-go="age-13-s2">The world turns colder</button><button type="button" class="wtoc-i" data-go="age-13-s3">The Great Mortality</button><button type="button" class="wtoc-i" data-go="age-13-s4">Angkor, Cahokia and Great Zimbabwe</button><button type="button" class="wtoc-i" data-go="age-13-s5">The manuscripts of Timbuktu</button><button type="button" class="wtoc-i" data-go="age-13-s6">Did China discover the world in 1421?</button><button type="button" class="wtoc-i" data-go="age-13-s7">The long recovery</button></nav></div><section class="wsec" id="age-13-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Cities the textbooks forgot</h3><p>Around 1100 CE, the largest cities on Earth were not all where you might guess. In Cambodia, radar and lidar surveys have revealed that greater Angkor was a sprawling urban landscape of roughly 1,000 km², stitched together by canals, embankments and vast reservoirs, with Angkor Wat at its heart. On the Mississippi, Cahokia grew almost overnight after about 1050 into a planned city of plazas and earthen pyramids; its Monks Mound still stands about 30 metres high. In southern Africa, the rulers of Great Zimbabwe raised curving dry-stone walls up to about 11 metres high, and traded gold to the Swahili coast for glass beads and Chinese porcelain.</p><p>Then, within about two centuries, Cahokia was empty, Angkor was fading, the Norse had gone silent in Greenland and the Black Death had killed a large share of everyone from Iceland to Egypt. The question of this age is whether these falls share a cause.</p><blockquote class="wpull"><p>Around 1100 the planet held great cities on four continents that most schoolbooks still mention in a single sentence, if at all.</p></blockquote></section><section class="wsec" id="age-13-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The world turns colder</h3><p>In 1257 the Samalas volcano on the Indonesian island of Lombok blew itself apart in one of the largest eruptions of the last few thousand years. Its sulphate is in both polar ice caps. Further eruptions followed, and a study of dead plants emerging from Arctic ice caps suggests the cold of the Little Ice Age set in abruptly between 1275 and 1300, then deepened after 1430. Europe suffered the Great Famine of 1315–1317. In the Norse settlements of Greenland, founded around 985, the last written record is a wedding at Hvalsey church in 1408.</p><p>The Greenland story is often told as a parable of stubborn farmers who refused to adapt. Bones and isotopes tell a subtler tale: the Norse ate a great deal of seal, and their economy leaned on walrus ivory shipped to Europe, whose value fell as hunting pushed further north and African elephant ivory became easier to buy. Climate made life harder; trade removed the reason to stay.</p></section><section class="wsec" id="age-13-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The Great Mortality</h3><p>The Mongol conquests, begun under Genghis Khan in 1206, created the largest land empire in history and opened routes from China to the Black Sea. Along those routes came plague. In 2022 geneticists sequenced Yersinia pestis from graves near Lake Issyk-Kul in Kyrgyzstan, where tombstones record deaths from &#x27;pestilence&#x27; in 1338–1339, and found the ancestor of the strain that became the Black Death.</p><figure class="wx wx--steps" id="age-13-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">How the Black Death travelled</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How the Black Death travelled"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 458" class="wx-svg" role="img" aria-labelledby="age-13-f1-t"><title id="age-13-f1-t">Map of the spread of the Black Death from Central Asia to Europe and the Middle East, 1338 to 1353</title><defs><marker id="age-13-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker><marker id="age-13-f1-ahk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><rect class="wx-water wx-o60" x="20" y="40" width="680" height="376.3"/><path class="wx-sand wx-edge-soft" d="M364.3,325.7 L359.3,330.1 L359.8,332.1 L352.4,337.2 L348.8,335.8 L347.1,331.6 L350.6,331.2 L352.2,328.6 L357.5,328.8 L364.3,325.7ZM283.9,325.3 L287.9,328.8 L293.7,328.2 L299.2,329 L299,330.8 L303,329.5 L302.1,332.6 L291.4,333.5 L291.5,331.8 L282.5,329.8 L283.9,325.3ZM223.4,298.9 L220.8,307.1 L221.9,310.4 L220.3,315.7 L214.6,311.8 L210.9,310.7 L200.6,305.4 L201.6,300 L210.2,300.9 L217.8,299.8 L223.4,298.9ZM176.8,267.8 L181.2,275.2 L180.2,289 L176.8,288.4 L173.8,291.8 L171,289.1 L170.7,276.5 L169,270.5 L173.1,271 L176.8,267.8ZM179.4,257.9 L176.9,266 L173.6,263.9 L171.9,256.8 L173.3,252.9 L178.1,249 L179.4,257.9ZM58.5,152.3 L45.4,158.4 L34.9,156.9 L40.9,145.9 L37.1,135.3 L47.1,127.1 L52.7,122.2 L58.9,121.8 L66.9,128.3 L62.9,135.5 L64.1,142.9 L58.5,152.3ZM202.5,117.3 L198.1,125.7 L190.3,119.8 L189.3,115.5 L200.1,112 L202.5,117.3ZM86.5,85.6 L78.6,96.9 L86.1,95.5 L94.2,95.6 L92.3,104.1 L85.6,113.4 L93.3,114.1 L100.5,127.5 L105.5,129.2 L110.1,141.1 L112.2,145.3 L121.1,147.3 L120.2,153.9 L116.5,157 L119.4,162.4 L112.8,167.9 L102.9,167.8 L90.3,170.7 L86.8,168.6 L82,173.5 L75.1,172.3 L69.9,176.3 L66,17 1353</text></g><circle class="wx-c4 wx-o40 wx-pulse" cx="677.8" cy="254.3" r="12"/><g class="wx-st wx-hide" data-s="5"><rect class="wx-card wx-edge-soft" x="30" y="330" width="178" height="50" rx="6"/><text class="wx-t-b" x="119" y="351" text-anchor="middle">Europe loses perhaps</text><text class="wx-t-s" x="119" y="368" text-anchor="middle">30–60% of its people</text></g><text class="wx-t-cap" x="20" y="26">THE BLACK DEATH, 1338–1353</text><text class="wx-st wx-hide wx-t-cap wx-t-a" data-only="1" x="700" y="26" text-anchor="end">CENTRAL ASIA, 1338–39</text><text class="wx-st wx-hide wx-t-cap wx-t-a" data-only="2" x="700" y="26" text-anchor="end">1346: THE BLACK SEA</text><text class="wx-st wx-hide wx-t-cap wx-t-a" data-only="3" x="700" y="26" text-anchor="end">1347: BY SHIP</text><text class="wx-st wx-hide wx-t-cap wx-t-a" data-only="4" x="700" y="26" text-anchor="end">1348: EUROPE AND THE MIDDLE EAST</text><text class="wx-st wx-hide wx-t-cap wx-t-a" data-only="5" x="700" y="26" text-anchor="end">1349–53: NORTH AND EAST</text><rect class="wx-inkfill" x="24" y="430.3" width="47.1" height="5"/><text class="wx-t-s" x="24" y="448.3" text-anchor="middle">0</text><text class="wx-t-s" x="71.1" y="448.3" text-anchor="middle">500 km</text><text class="wx-t-s" x="120" y="436.3">Years are first recorded outbreaks; routes are simplified.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> 1338–39: plague deaths near Lake Issyk-Kul, where the strain&#x27;s ancestor has been found.</p><ol class="wx-steplist"><li>1338–39: plague deaths near Lake Issyk-Kul, where the strain&#x27;s ancestor has been found.</li><li>1346: along Mongol trade routes to the Golden Horde and the Genoese port of Caffa.</li><li>1347: by ship to Constantinople, Messina, Marseille and Alexandria.</li><li>1348: Florence, Paris, London, Cairo, Damascus.</li><li>1349–53: Scandinavia and Russia. Perhaps 30–60% of Europe has died.</li></ol><figcaption>The spread of the second plague pandemic from Central Asia to Europe, the Middle East and North Africa, by year. Dates are the first recorded outbreaks; routes simplified. <span class="wx-src">Based on: Coastlines: Natural Earth 1:110m. Dates after Benedictow 2004 and Spyrou et al. 2022.</span></figcaption><p class="vh">A map from the Atlantic to Central Asia. Step one marks Lake Issyk-Kul in the Tian Shan, 1338 to 1339. Step two shows the plague moving west along trade routes to the Golden Horde and Caffa in Crimea by 1346. Step three shows it reaching Constantinople, Messina, Marseille and Alexandria in 1347. Step four adds Florence, Paris, London, Cairo and Damascus in 1348. Step five adds Bergen in 1349 and Novgorod and Moscow in the early 1350s, with a note that about 30 to 60 percent of Europe died.</p></figure><p>Plague reached the Genoese port of Caffa in Crimea by 1346, Constantinople, Sicily and Marseille in 1347, and most of Europe by 1351. Estimates of Europe&#x27;s losses range from about 30% to 60% of the population; Cairo, Damascus and the cities of North Africa were also devastated. The survivors inherited land, wages rose, and some historians see the shock as a turning point toward the modern economy.</p><aside class="wcall"><b>How do we know?</b><p>Three kinds of evidence meet. Chroniclers and tax records give dates and places. Mass graves, such as those excavated at East Smithfield in London, hold the dead. And ancient DNA from their teeth identifies the bacterium and its family tree, which is how the source was traced to Central Asia.</p></aside></section><section class="wsec" id="age-13-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Angkor, Cahokia and Great Zimbabwe</h3><p>Angkor&#x27;s decline was long, not sudden. Tree rings from Vietnam record decades-long droughts in the mid to late 14th and early 15th centuries, punctuated by violent monsoons that could silt up and break the city&#x27;s canals and reservoirs. A 2019 study of sediments suggests that the elite core thinned out gradually over a century or more, as the kings shifted their centre south toward the Mekong and sea trade.</p><p>At Cahokia, lake sediments record a major Mississippi flood around 1200, and chemical traces of human waste in a nearby lake suggest the population fell as summers grew drier. The city was largely empty by about 1350. Great Zimbabwe&#x27;s people dispersed in the 15th century, probably as trade shifted north and local resources wore thin.</p><p>One of this age&#x27;s darkest chapters belongs to modern times. When European colonists reached Great Zimbabwe in the late 19th century, some insisted that Phoenicians or the Queen of Sheba must have built it. Archaeologists David Randall-MacIver in 1905 and Gertrude Caton-Thompson in 1929 showed it was African, and the Rhodesian government still pressured guides and museums to blur the point in the 1970s. The Sheba case tells that story.</p></section><section class="wsec" id="age-13-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The manuscripts of Timbuktu</h3><p>In 1324 Mansa Musa, ruler of Mali, passed through Cairo on pilgrimage with so much gold that, a writer reported about twelve years later, its value there fell. Under Mali and then Songhay, Timbuktu became a city of scholars. Its families collected manuscripts from the late 13th century to the early 20th: law, theology, medicine, astronomy, mathematics, history and poetry. In 2012–2013, when armed groups occupied the city, librarians led by Abdel Kader Haidara smuggled about 350,000 manuscripts to Bamako in footlockers. Militants burned or stole 4,203. It is the knowledge relay of the previous age, still being carried by hand.</p></section><section class="wsec" id="age-13-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Did China discover the world in 1421?</h3><p>Between 1405 and 1433 the Ming admiral Zheng He led seven great voyages to Southeast Asia, India, Arabia and East Africa, with fleets of dozens of large ships and many thousands of men. Then the court stopped them, and many records were later lost. In 2002 Gavin Menzies claimed that his captains had sailed on around the world in 1421, reaching the Americas and Australia. It is a thrilling idea, and the capability and the forgetting are both real. But Ming sources place the fleets in the Indian Ocean in those years, specialists found the book&#x27;s maps and artefacts misread, and no Chinese wreck, coin or DNA of that date has turned up in the Americas. For now it awaits evidence.</p></section><section class="wsec" id="age-13-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>The long recovery</h3><p>The end of this age is a rebound. Population recovered, and so did trade. When Constantinople fell to the Ottomans in 1453, Greek scholars carried manuscripts to Italy, feeding a Renaissance that also drew on the Arabic science translated in Toledo. Around 1455 Gutenberg printed his Bible with movable metal type, and copying bottlenecks began to fade. For the first time, knowledge could be multiplied faster than it could be lost.</p><blockquote class="wpull"><p>Printing broke the old cycle in which every age of darkness burned part of the library.</p></blockquote></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">1021 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Norse cutting timber at L&#x27;Anse aux Meadows, Newfoundland</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">1050 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Cahokia&#x27;s &#x27;big bang&#x27;: rapid growth begins</span></li><li class="wtl-build" style="--i:2"><span class="wtl-y">1150 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Angkor Wat completed (approx.)</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">1206 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Temüjin proclaimed Genghis Khan</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">1257 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Samalas erupts in Indonesia</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">1324 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Mansa Musa of Mali makes his pilgrimage through Cairo</span></li><li class="wtl-loss" style="--i:6"><span class="wtl-y">1347 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Black Death reaches Europe</span></li><li class="wtl-event" style="--i:7"><span class="wtl-y">1405 CE</span><span class="wtl-k">Event</span><span class="wtl-t">First of Zheng He&#x27;s seven voyages</span></li><li class="wtl-loss" style="--i:8"><span class="wtl-y">1453 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Constantinople falls; Greek scholars carry books to Italy</span></li><li class="wtl-build" style="--i:9"><span class="wtl-y">1455 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Gutenberg&#x27;s printed Bible (approx.)</span></li></ol><h3 class="sub-h wsub">Go deeper</h3><div class="links-row"><button type="button" onclick="openItem('articles','case-vinland')">Vinland <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-sheba')">The Queen of Sheba and the Flood of the Dam <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-moon-split')">The Splitting of the Moon <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-great-zimbabwe')">Great Zimbabwe <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-moai')">Moai <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-ollantaytambo')">Ollantaytambo <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-damascus-steel')">Damascus steel <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-great-wall')">Great Wall <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-india-stone')">India&#x27;s precise stone <span aria-hidden="true">→</span></button></div><details class="srcs"><summary>Sources for this age (18)</summary><ol><li>Spyrou, M. A. et al. (2022). The source of the Black Death in fourteenth-century central Eurasia. Nature 606: 718–724. <a href="https://doi.org/10.1038/s41586-022-04800-3" target="_blank" rel="noopener">doi:10.1038/s41586-022-04800-3</a></li><li>Benedictow, O. J. (2004). The Black Death 1346–1353: The Complete History. Boydell Press.</li><li>Miller, G. H. et al. (2012). Abrupt onset of the Little Ice Age triggered by volcanism and sustained by sea-ice/ocean feedbacks. Geophysical Research Letters 39: L02708. <a href="https://doi.org/10.1029/2011GL050168" target="_blank" rel="noopener">doi:10.1029/2011GL050168</a></li><li>Lavigne, F. et al. (2013). Source of the great A.D. 1257 mystery eruption unveil
