/b><span class="ctr-u"> minutes</span></div><div class="ctr-l">length of each burst of fission before the water boiled off</div><div class="ctr-c">Meshik et al. 2004</div></div><div class="ctr"><div class="ctr-v">under <b class="ctr-n" data-v="100" >100</b><span class="ctr-u"> kW</span></div><div class="ctr-l">probable upper limit of average thermal power</div><div class="ctr-c">Meshik 2005</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The Oklo reactors were entirely natural, formed and run by geology and groundwater without any intelligent design.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:91.7%" role="img" aria-label="Weight of evidence: Established"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Several independent lines agree: the uranium-235 shortfall, fission-product isotopes, the xenon record of a water-driven cycle, the ore geometry and the known decay of uranium-235 through time, which made natural enrichment high enough only in the deep past. The mechanism was predicted in 1956 before anyone knew Oklo existed. No manufactured material has ever been found. The rarity of natural reactors is real, but it is explained by the narrow window of time and chemistry, not by design.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Where Oklo appears in textbooks and museum displays it is presented as a settled natural phenomenon, and here the confidence matches the evidence. If anything, textbooks undersell how strange and informative it is: it is one of the best natural tests we have of whether physics has changed over billions of years, and a real-world experiment in storing radioactive waste.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>In 1972 uranium ore from Oklo, Gabon, was found to be short of the fissile isotope uranium-235: 0.717% instead of the 0.720% found in ore everywhere else, and as low as about 0.44% in some samples.<small>Meshik 2005; Gauthier-Lafaye et al. 1996</small></li><li>The ore also holds fission products such as neodymium, ruthenium and xenon isotopes in the proportions produced by splitting uranium, not in their natural proportions.<small>Gauthier-Lafaye et al. 1996</small></li><li>At least 16 reactor zones are known in the Oklo, Okélobondo and Bangombé deposits of the Franceville basin, the only natural reactors yet found.<small>Gauthier-Lafaye et al. 1996; Meshik 2005</small></li><li>Xenon trapped in phosphate grains records a cycle of about 30 minutes of fission followed by about 2.5 hours of shutdown, consistent with water acting as the moderator.<small>Meshik, Hohenberg and Pravdivtseva 2004</small></li><li>Paul Kuroda had calculated in 1956 that a uranium deposit could go critical on its own under the right conditions, sixteen years before Oklo was found.<small>Kuroda 1956</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Exactly how long each zone operated and at what power: recent isotope work suggests durations from about a quarter of a million to about two million years depending on the zone.</li><li>How far some fission products, such as caesium and strontium, migrated after the reactors died, and how well Oklo stands in for a modern engineered waste store.</li><li>How tightly Oklo limits changes in fundamental constants, since the bound depends on modelling the reactor&#x27;s temperature and neutron spectrum.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Several reactor zones were mined out for their uranium before and after the discovery; mining at Oklo ended in the late 1990s, so much of the original record is gone.</li><li>Other natural reactors may once have existed in similar deposits of the same age, but erosion, burial or later reworking of rock would have erased them.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Geologists and physicists read Oklo as a natural chain reaction. About 2 billion years ago uranium-235 made up roughly 3–4% of natural uranium, close to the enrichment of modern reactor fuel. After oxygen built up in the air, uranium dissolved in groundwater and was concentrated into rich seams in the Franceville basin. Where the ore was rich and thick enough, groundwater slowed neutrons, the seams went critical, and boiling water shut them down again. The chemistry and isotopes match this picture in detail.</p><ul><li>The U-235 shortfall matches the amount expected to have been burned, and fission products sit in the zones where the uranium is depleted.</li><li>The reaction zones follow the natural geometry of the ore seams, with no sign of manufactured structures.</li><li>The on-off rhythm recorded by xenon is what water moderation predicts.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Some popular writers present Oklo as an &#x27;ancient nuclear reactor&#x27; built or left by an earlier intelligence. They point out that humans needed the Manhattan Project&#x27;s engineering to make a chain reaction, that Oklo needed an exact combination of enrichment, moderator, geometry and chemistry, and that it regulated itself like a designed system. If nature can do this, they ask, why has it happened in only one basin on Earth? Some add that the reactors look like a disposal site for spent fuel.</p><ul><li>The conditions for criticality are demanding and were met in only one known place.</li><li>The reactors were self-regulating, which resembles engineered control.</li><li>Nuclear fission was only achieved by humans in 1942, after enormous effort.</li></ul><div class="face-s"><b>Its strongest point</b><p>A self-sustaining chain reaction is a narrow target. That nature hit it several times in one basin, and nowhere else we know of, is genuinely surprising and deserves an explanation rather than a shrug.</p></div><p class="face-cr"><b>Credit</b> Ancient-astronaut and lost-technology writers, websites and videos</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Finding a second natural reactor elsewhere, in ore of the same age, would show how common the conditions were.</li><li>Any manufactured material, tool mark or chemically processed fuel in the reactor zones would reopen the question; none has been reported in five decades of study.</li><li>Refined modelling of each zone&#x27;s neutron spectrum and temperature, now under way with new isotope data, would tighten the physics bounds.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">6 min read · 1,334 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Oklo: The Two-Billion-Year-Old Nuclear Reactors"><button type="button" class="wtoc-i" data-go="oklo-s1">The uranium that came up short</button><button type="button" class="wtoc-i" data-go="oklo-s2">A prediction nobody had tested</button><button type="button" class="wtoc-i" data-go="oklo-s3">How a rock became a reactor</button><button type="button" class="wtoc-i" data-go="oklo-s4">The case for something stranger</button><button type="button" class="wtoc-i" data-go="oklo-s5">What a dead reactor teaches physics</button><button type="button" class="wtoc-i" data-go="oklo-s6">Fresh work, lost rock and open questions</button></nav></div><section class="wsec" id="oklo-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The uranium that came up short</h3><p>In May 1972, at the French uranium enrichment plant at Pierrelatte, a routine measurement did not add up. Natural uranium is almost entirely uranium-238, with a small, famously constant share of the fissile isotope uranium-235: about 0.720 percent, in ore from around the world and even in meteorites and Moon rock. A sample traced to the Oklo mine in Gabon held 0.717 percent. The difference sounds tiny. Across the shipments it meant that roughly 200 kilograms of uranium-235 appeared to be missing.</p><p>For a nuclear agency, missing fissile uranium is an alarm bell. Had someone diverted it? Had the ore been contaminated with spent fuel? The French Atomic Energy Commission traced the anomaly back to the mine, and there it found something far stranger. Some ore was even more depleted, down to about 0.44 percent. And mixed in with it were the telltale products of nuclear fission. The uranium had not been stolen. It had already been burned, about 2 billion years before anyone was there to burn it.</p><blockquote class="wpull"><p>The uranium had not been stolen. It had already been burned, about 2 billion years before anyone was there to burn it.</p></blockquote></section><section class="wsec" id="oklo-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>A prediction nobody had tested</h3><p>The idea was not entirely new. In 1956 the chemist Paul Kuroda, at the University of Arkansas, published a two-page note in the Journal of Chemical Physics asking whether a uranium deposit could ever sustain a chain reaction on its own. His answer was yes, if several conditions came together: a thick, rich ore body; enough uranium-235 in the mix; water to slow neutrons down so they split nuclei efficiently. Later work added a further condition: few neutron-absorbing elements, such as boron or some rare earths, to poison the reaction.</p><p>The key was time. Uranium-235 decays faster than uranium-238, so the further back you go, the richer natural uranium becomes. Today it holds 0.72 percent uranium-235, too little for a natural reactor moderated by ordinary water. Two billion years ago it held about 3.7 percent, close to the 3 to 5 percent enrichment of fuel in many modern power reactors. Nature did not need to enrich anything. The clock had done it.</p><figure class="wx wx--static" id="oklo-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Why Oklo could happen then and cannot happen now</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Why Oklo could happen then and cannot happen now"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" class="wx-svg" role="img" aria-labelledby="oklo-f2-t"><title id="oklo-f2-t">Share of uranium-235 in natural uranium over the last 2.5 billion years</title><text class="wx-t-cap" x="24" y="28">Why Oklo could happen then and cannot happen now</text><rect class="wx-accfill wx-o20" x="90" y="105" width="580" height="90"/><text class="wx-t-m" x="560" y="121">modern reactor fuel,</text><text class="wx-t-m" x="560" y="136">typically 3–5% U-235</text><path class="wx-guide" d="M90,330H670"/><text class="wx-t-s" x="80" y="334" text-anchor="end">0%</text><path class="wx-guide" d="M90,285H670"/><text class="wx-t-s" x="80" y="289" text-anchor="end">1%</text><path class="wx-guide" d="M90,240H670"/><text class="wx-t-s" x="80" y="244" text-anchor="end">2%</text><path class="wx-guide" d="M90,195H670"/><text class="wx-t-s" x="80" y="199" text-anchor="end">3%</text><path class="wx-guide" d="M90,150H670"/><text class="wx-t-s" x="80" y="154" text-anchor="end">4%</text><path class="wx-guide" d="M90,105H670"/><text class="wx-t-s" x="80" y="109" text-anchor="end">5%</text><path class="wx-guide" d="M90,60H670"/><text class="wx-t-s" x="80" y="64" text-anchor="end">6%</text><path class="wx-thin" d="M90.0,330V337"/><text class="wx-t-s" x="90.0" y="352" text-anchor="middle">2.5 bn</text><path class="wx-thin" d="M206.0,330V337"/><text class="wx-t-s" x="206.0" y="352" text-anchor="middle">2 bn</text><path class="wx-thin" d="M322.0,330V337"/><text class="wx-t-s" x="322.0" y="352" text-anchor="middle">1.5 bn</text><path class="wx-thin" d="M438.0,330V337"/><text class="wx-t-s" x="438.0" y="352" text-anchor="middle">1 bn</text><path class="wx-thin" d="M554.0,330V337"/><text class="wx-t-s" x="554.0" y="352" text-anchor="middle">0.5 bn</text><path class="wx-thin" d="M670.0,330V337"/><text class="wx-t-s" x="670.0" y="352" text-anchor="middle">today</text><path class="wx-line" d="M90,330H670M90,330V60"/><text class="wx-t-s" x="380" y="372" text-anchor="middle">years ago (billions)</text><polyline class="wx-hl wx-draw" pathLength="1" style="--d:1" points="90.0,84.4 101.6,93.9 113.2,103.0 124.8,111.8 136.4,120.2 148.0,128.4 159.6,136.2 171.2,143.8 182.8,151.0 194.4,158.0 206.0,164.8 217.6,171.2 229.2,177.5 240.8,183.5 252.4,189.2 264.0,194.8 275.6,200.1 287.2,205.2 298.8,210.2 310.4,214.9 322.0,219.5 333.6,223.9 345.2,228.1 356.8,232.1 368.4,236.0 380.0,239.8 391.6,243.4 403.2,246.8 414.8,250.1 426.4,253.3 438.0,256.4 449.6,259.3 461.2,262.2 472.8,264.9 484.4,267.5 496.0,270.0 507.6,272.4 519.2,274.7 530.8,276.9 542.4,279.1 554.0,281.1 565.6,283.1 577.2,285.0 588.8,286.8 600.4,288.5 612.0,290.2 623.6,291.8 635.2,293.3 646.8,294.8 658.4,296.2 670.0,297.6"/><g class="wx-pop" style="--d:8"><circle class="wx-fire wx-edge" cx="206.0" cy="164.8" r="7"/><path class="wx-thin" d="M206.0,155.8V78.0"/><text class="wx-t-b wx-halo" x="198.0" y="72.0">Oklo reactors: c. 2 billion years ago</text><text class="wx-t wx-halo" x="218.0" y="186.8">about 3.7% U-235</text></g><g class="wx-pop" style="--d:11"><circle class="wx-inkfill" cx="670.0" cy="297.6" r="5"/><path class="wx-thin" d="M670,290V262"/><text class="wx-t-b wx-halo" x="662" y="222" text-anchor="end">today: 0.72%</text><text class="wx-t-m wx-halo" x="662" y="238" text-anchor="end">too little for a natural</text><text class="wx-t-m wx-halo" x="662" y="254" text-anchor="end">reactor moderated by water</text></g><text class="wx-t-s" x="90" y="392">Curve computed from the half-lives of U-235 (704 million years) and U-238 (4.47 billion years).</text></svg></div></div><figcaption>Uranium-235 decays faster than uranium-238, so natural uranium was richer in the fissile isotope in the past. Two billion years ago it resembled modern reactor fuel. <span class="wx-src">Based on: Computed from the half-lives of uranium-235 (704 million years) and uranium-238 (4.47 billion years) and today&#x27;s abundance of 0.72%; Oklo age after Gauthier-Lafaye et al. (1996).</span></figcaption><p class="vh">A line chart. The horizontal axis runs from 2.5 billion years ago on the left to today on the right; the vertical axis shows the percentage of uranium-235 in natural uranium, from 0 to 6 percent. A curve falls from about 5.5 percent 2.5 billion years ago to 0.72 percent today. A shaded band between 3 and 5 percent marks typical modern reactor fuel. A marker at 2 billion years ago, at about 3.7 percent, is labelled Oklo reactors. A marker at today, 0.72 percent, is labelled too little for a water-moderated natural reactor.</p></figure></section><section class="wsec" id="oklo-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>How a rock became a reactor</h3><p>The second ingredient was oxygen. Before about 2.4 billion years ago the air held almost none, and uranium stayed locked in insoluble minerals. Once photosynthesising microbes filled the atmosphere with oxygen, uranium could dissolve in water, travel, and then precipitate again where conditions changed, building rich seams in the sandstones of the Franceville basin. The reactors are, in a sense, a side effect of the planet learning to breathe.</p><p>Where a seam was rich and thick enough, groundwater filling its pores acted as a moderator, exactly the role water plays in most power reactors today. The seam went critical. The reaction heated the rock, the water boiled away, the neutrons stayed too fast to split much uranium-235, and the reaction stopped. When the rock cooled and water seeped back, it started again.</p><figure class="wx wx--steps" id="oklo-f1" data-n="4"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">A geological geyser: how water ran the reactor</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="A geological geyser: how water ran the reactor"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" class="wx-svg" role="img" aria-labelledby="oklo-f1-t"><title id="oklo-f1-t">How groundwater switched the Oklo reactors on and off, step by step</title><defs><marker id="oklo-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text class="wx-t-cap" x="24" y="28">A geological geyser · schematic section through an Oklo reactor zone</text><rect class="wx-sand" x="30" y="50" width="390" height="100"/><path class="wx-stone3" d="M30,150C130,146 320,156 420,150V196C320,202 130,192 30,198Z"/><rect class="wx-rock" x="30" y="197" width="390" height="113"/><path class="wx-guide" d="M30,95C150,90 290,100 420,94"/><path class="wx-thin" d="M60,240l12,-8M110,262l14,-6M170,230l10,-10M230,270l14,-4M290,238l10,-9M350,262l12,-8M395,228l10,-6"/><rect class="wx-line" x="30" y="50" width="390" height="260"/><text class="wx-t wx-halo" x="42" y="74">sandstone</text><text class="wx-t-b wx-t-w" x="42" y="178">uranium ore seam</text><text class="wx-t wx-halo" x="42" y="298">older basement rock</text><g class="wx-st" data-only="2"><ellipse class="wx-fire wx-o80" cx="270" cy="173" rx="72" ry="18"/><ellipse class="wx-glow wx-pulse" cx="270" cy="173" rx="38" ry="9"/></g><g class="wx-st wx-hide" data-only="1"><path class="wx-flow wx-s2" d="M120,56C150,90 190,120 230,160"/><path class="wx-flow wx-s2" d="M300,56C290,90 280,120 275,160"/><path class="wx-flow wx-s2" d="M400,60C380,100 350,130 320,162"/><circle class="wx-water2" cx="238" cy="170" r="3"/><circle class="wx-water2" cx="262" cy="176" r="3"/><circle class="wx-water2" cx="290" cy="168" r="3"/><circle class="wx-water2" cx="312" cy="177" r="3"/></g><g class="wx-st wx-hide" data-only="2"><circle class="wx-water2" cx="238" cy="170" r="3"/><circle class="wx-water2" cx="312" cy="177" r="3"/><path class="wx-hl" d="M270,173L220,128" marker-end="url(#oklo-f1-ah)"/><path class="wx-hl" d="M270,173L330,126" marker-end="url(#oklo-f1-ah)"/><path class="wx-hl" d="M270,173L360,190" marker-end="url(#oklo-f1-ah)"/><text class="wx-t-b wx-halo" x="222" y="118">heat</text></g><g class="wx-st wx-hide" data-only="3"><path class="wx-dash" d="M235,150C225,130 245,115 235,95C225,75 245,65 238,52"/><path class="wx-dash" d="M270,150C260,130 280,115 270,95C260,75 280,65 273,52"/><path class="wx-dash" d="M305,150C295,130 315,115 305,95C295,75 315,65 308,52"/><text class="wx-t-b wx-halo" x="322" y="100">steam</text></g><g class="wx-st wx-hide" data-only="4"><path class="wx-flow wx-s2" d="M120,56C150,90 190,120 230,160"/><path class="wx-flow wx-s2" d="M400,60C380,100 350,130 320,162"/><text class="wx-t-b wx-halo" x="92" y="120">water seeps back</text></g><g class="wx-st wx-hide" data-only="1"><text class="wx-t-h" x="450" y="70">1 · Soaked ore</text><text class="wx-t" x="450" y="94">Two billion years ago, natural</text><text class="wx-t" x="450" y="111">uranium held about 3–4% of the</text><text class="wx-t" x="450" y="128">fissile isotope uranium-235.</text><text class="wx-t" x="450" y="145">Groundwater filled the cracks</text><text class="wx-t" x="450" y="162">of a rich ore seam and slowed</text><text class="wx-t" x="450" y="179">stray neutrons down.</text><text class="wx-t-m" x="450" y="202">Slow neutrons split U-235 easily.</text></g><g class="wx-st wx-hide" data-only="2"><text class="wx-t-h" x="450" y="70">2 · Chain reaction</text><text class="wx-t" x="450" y="94">Each split released more</text><text class="wx-t" x="450" y="111">neutrons, the water slowed</text><text class="wx-t" x="450" y="128">them, and they split more</text><text class="wx-t" x="450" y="145">nuclei. The seam went critical</text><text class="wx-t" x="450" y="162">for about 30 minutes, heating</text><text class="wx-t" x="450" y="179">the rock around it.</text></g><g class="wx-st wx-hide" data-only="3"><text class="wx-t-h" x="450" y="70">3 · Boiled dry</text><text class="wx-t" x="450" y="94">The heat drove the water off as</text><text class="wx-t" x="450" y="111">steam. Without a moderator the</text><text class="wx-t" x="450" y="128">neutrons stayed fast, missed</text><text class="wx-t" x="450" y="145">their targets, and the reaction</text><text class="wx-t" x="450" y="162">shut itself down.</text><text class="wx-t-m" x="450" y="185">No operator, no control rods.</text></g><g class="wx-st wx-hide" data-only="4"><text class="wx-t-h" x="450" y="70">4 · Cool and repeat</text><text class="wx-t" x="450" y="94">After about 2.5 hours the rock</text><text class="wx-t" x="450" y="111">cooled, water seeped back and</text><text class="wx-t" x="450" y="128">the cycle restarted. Xenon gas</text><text class="wx-t" x="450" y="145">locked in phosphate grains</text><text class="wx-t" x="450" y="162">recorded the rhythm (Meshik</text><text class="wx-t" x="450" y="179">et al. 2004). It ran on and off</text><text class="wx-t" x="450" y="196">for hundreds of thousands of years.</text></g><text class="wx-t-cap" x="680" y="352" text-anchor="end">One cycle ≈ 3 hours</text><rect class="wx-fire wx-o80" x="40" y="362" width="106.7" height="26"/><rect class="wx-water" x="146.7" y="362" width="533.3" height="26"/><rect class="wx-line" x="40" y="362" width="640" height="26"/><text class="wx-t-b wx-halo" x="50" y="380">30 min on</text><text class="wx-t wx-halo" x="160" y="380">about 2.5 hours off: cooling, water returns</text><path class="wx-thin" d="M40,396V404M146.7,396V404M680,396V404"/><text class="wx-t-s" x="40" y="418">0</text><text class="wx-t-s" x="136" y="418">30 min</text><text class="wx-t-s" x="658" y="418">3 h</text><g class="wx-st wx-hide" data-only="2"><path class="wx-hl" d="M93,340V358" marker-end="url(#oklo-f1-ah)"/></g><g class="wx-st wx-hide" data-only="3"><path class="wx-hl" d="M147,340V358" marker-end="url(#oklo-f1-ah)"/></g><g class="wx-st wx-hide" data-only="4"><path class="wx-hl" d="M420,340V358" marker-end="url(#oklo-f1-ah)"/></g><text class="wx-t-s" x="40" y="440">Schematic section, not to scale. Cycle timing after Meshik et al. (2004).</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 4.</b> Groundwater soaks a rich uranium seam and slows neutrons down.</p><ol class="wx-steplist"><li>Groundwater soaks a rich uranium seam and slows neutrons down.</li><li>The seam goes critical: a chain reaction runs for about 30 minutes, heating the rock.</li><li>The heat boils the water away; without a moderator the reaction stops itself.</li><li>After about 2.5 hours the rock cools, water returns and the cycle restarts.</li></ol><figcaption>Tap through one cycle of an Oklo reactor zone: groundwater in, chain reaction, water boiled off, cool down and repeat. <span class="wx-src">Based on: Mechanism after Kuroda (1956), Gauthier-Lafaye et al. (1996) and Meshik (2005); cycle timing from xenon isotopes, Meshik, Hohenberg and Pravdivtseva (2004). Section schematic, not to scale.</span></figcaption><p class="vh">A schematic cross-section with pale sandstone on top, a dark uranium ore seam in the middle and older basement rock below. Step 1 shows groundwater flowing down into the ore seam. Step 2 shows a glowing orange lens in the seam, the reaction zone, with arrows for heat. Step 3 shows wavy dashed lines of steam rising as the water boils away and the reaction stops. Step 4 shows water seeping back in. A bar along the bottom shows one three-hour cycle: 30 minutes on in orange and about 2.5 hours off in blue, with a pointer showing where each step falls.</p></figure><p>In 2004 Alex Meshik and colleagues at Washington University in St. Louis read that rhythm from xenon isotopes trapped in aluminium phosphate grains: about 30 minutes on, then at least 2.5 hours off. At least 16 reactor zones are known in the Oklo, Okélobondo and Bangombé deposits. Their average power was probably below 100 kilowatts, enough, as Meshik put it, for a few dozen toasters, but they kept going on and off for hundreds of thousands of years, consuming tonnes of uranium-235.</p><aside class="wcall"><b>How do we know?</b><p>Fission leaves fingerprints. Splitting uranium makes elements such as neodymium, samarium, ruthenium and xenon in isotope ratios that are quite different from the natural ones. In the Oklo reactor zones these elements carry the fission pattern, and they sit exactly where the uranium-235 is most depleted. Some isotopes also show the effect of absorbing neutrons afterwards, which lets physicists estimate how many neutrons flowed through the rock and for how long.</p></aside></section><section class="wsec" id="oklo-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The case for something stranger</h3><p>It is not surprising that Oklo became a favourite of ancient-astronaut websites and videos. A working nuclear reactor, two billion years old, sounds like the ultimate out-of-place artefact. The strongest version of the argument is not silly. A self-sustaining chain reaction is a narrow target: too little uranium-235 or too much neutron poison and nothing happens, too much and the system could run away. Humans reached it only in 1942, with Enrico Fermi&#x27;s graphite pile in Chicago, after years of work. Oklo also regulated itself, which looks like engineering. And it is unique: no other natural reactor has been found anywhere.</p><p>Those are fair observations, and they are exactly what the natural model has to explain. It does so well. The narrow target was hit because the uranium-235 fraction was high enough only in a limited window of Earth history, and rich uranium seams could only form after oxygen appeared, so the window was short and the places few. The self-regulation is simple physics: water moderates, heat removes water. Nothing in the reactor zones looks manufactured. The ore lies in its natural sedimentary layers, the reaction zones follow the shape of the seams, and the fuel was never processed. A designed reactor would leave more than a pattern of isotopes in ordinary rock.</p><blockquote class="wpull"><p>The self-regulation that looks like engineering is simple physics: water slows neutrons, and heat drives the water away.</p></blockquote><p>There is also the question of who. Two billion years ago life on Earth was microbial. Complex cells were only beginning to appear. An outside visitor cannot be excluded by any experiment, but nothing at Oklo requires one, and nothing points to one.</p></section><section class="wsec" id="oklo-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>What a dead reactor teaches physics</h3><p>Oklo&#x27;s real surprise is how useful it has become. One isotope, samarium-149, swallows slow neutrons only at a very precise energy set by the strength of the electromagnetic force. In 1976 the Soviet physicist Alexander Shlyakhter realised that the amount of samarium-149 left at Oklo tests whether that force was the same two billion years ago. In 1996 Thibault Damour and Freeman Dyson reworked the analysis and found that the fine-structure constant, the number that measures the electromagnetic force, cannot have changed by more than about one part in ten million since the reactors ran. Oklo is one of the tightest natural checks that the laws of physics have held steady over billions of years.</p><p>It is also a two-billion-year experiment in nuclear waste storage. Much of the plutonium and many fission products stayed within metres of where they formed, held by the surrounding clays and minerals, while more mobile elements escaped. A European research programme in the 1990s studied the site as a natural analogue for deep geological repositories. The lesson is encouraging but not a guarantee: Oklo&#x27;s rocks, water and history are not those of any modern waste store.</p></section><section class="wsec" id="oklo-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Fresh work, lost rock and open questions</h3><aside class="wcall"><b>Fresh from the field</b><p>In February 2026 Hiroshi Hidaka, Alex Meshik and colleagues reviewed new isotope work on the reactors using modern mass spectrometry. They report that reactor zone 13 behaved differently from the others: uranium-235 supplied only about 75 percent of its fissions, against roughly 88 to 95 percent elsewhere, and it ran for about 240,000 years, while other zones operated for roughly 0.6 to 2.2 million years. The reactors were not identical machines, and each has its own history still being read.</p></aside><p>Time and industry have both taken their toll. Oklo was a working mine, and several reactor zones were dug out for their uranium before and after the discovery. Mining ended in the late 1990s. Other natural reactors may have existed in similar ore elsewhere, only to be eroded or reworked long ago. What remains open is mostly detail: how long each zone ran, how hot it became, and how the fission products moved afterwards. The central question, whether nature built these reactors, has a clear answer.</p><p>What would change that answer? A manufactured object, a processed fuel or an engineered structure in the reactor zones would. Fifty years of drilling, sampling and isotope work have not found one. What they have found is arguably more wonderful: a planet that, for a brief window in its youth, could run its own nuclear reactors, and left the ashes where we could read them.</p></section><details class="srcs"><summary>Sources for this case (9)</summary><ol><li>Kuroda P. K. (1956). On the nuclear physical stability of the uranium minerals. Journal of Chemical Physics 25: 781–782. <a href="https://doi.org/10.1063/1.1743058" target="_blank" rel="noopener">doi:10.1063/1.1743058</a></li><li>Meshik A. P., Hohenberg C. M., Pravdivtseva O. V. (2004). Record of cycling operation of the natural nuclear reactor in the Oklo/Okelobondo area in Gabon. Physical Review Letters 93: 182302. <a href="https://doi.org/10.1103/PhysRevLett.93.182302" target="_blank" rel="noopener">doi:10.1103/PhysRevLett.93.182302</a></li><li>Meshik A. P. (2005). The workings of an ancient nuclear reactor. Scientific American 293(5), November 2005.</li><li>Gauthier-Lafaye F., Holliger P., Blanc P.-L. (1996). Natural fission reactors in the Franceville basin, Gabon: a review of the conditions and results of a &#x27;critical event&#x27; in a geologic system. Geochimica et Cosmochimica Acta 60(23): 4831–4852. <a href="https://doi.org/10.1016/S0016-7037(96)00245-1" target="_blank" rel="noopener">doi:10.1016/S0016-7037(96)00245-1</a></li><li>Shlyakhter A. I. (1976). Direct test of the constancy of fundamental nuclear constants. Nature 264: 340. <a href="https://doi.org/10.1038/264340a0" target="_blank" rel="noopener">doi:10.1038/264340a0</a></li><li>Damour T., Dyson F. (1996). The Oklo bound on the time variation of the fine-structure constant revisited. Nuclear Physics B 480: 37–54. <a href="https://doi.org/10.1016/S0550-3213(96)00467-1" target="_blank" rel="noopener">doi:10.1016/S0550-3213(96)00467-1</a></li><li>Hidaka H., Kagami S., Saito T., Yokoyama T., Pravdivtseva O., Meshik A., Bentridi S., Mombo E. D. D. R., Gall B. (2026). New insights into the Oklo natural fission reactors elucidated from isotopic studies using state-of-the-art analytical techniques. Radiation Protection Dosimetry 202(2): 65–69. <a href="https://doi.org/10.1093/rpd/ncaf119" target="_blank" rel="noopener">doi:10.1093/rpd/ncaf119</a></li><li>International Atomic Energy Agency (1975). The Oklo Phenomenon: proceedings of a symposium, Libreville, June 1975. IAEA, Vienna.</li><li>Naudet R. (1991). Oklo: des réacteurs nucléaires fossiles. Eyrolles, Paris.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-oklo" data-t="Oklo: The Two-Billion-Year-Old Nuclear Reactors"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Oklo: The Two-Billion-Year-Old Nuclear Reactors</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-oklo</span> (updated 25 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-herculaneum-scrolls-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Herculaneum papyri.jpg" data-cap="Carbonised scrolls from the Villa of the Papyri, Herculaneum" data-big><figcaption></figcaption></figure><div class="sh-k">Mysteries of the Earth</div><h2 class="sh-t" id="case-herculaneum-scrolls-st" tabindex="-1">The Herculaneum Scrolls: Reading a Burned Library</h2><p class="sh-s">Vesuvius turned a Roman library into lumps of charcoal. Two thousand years later, X-rays and machine learning are reading scrolls nobody can open.</p><div class="sh-v"><span class="vstamp vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><p class="sh-claim"><b>What the stamp rates:</b> Machine learning applied to X-ray scans can recover readable text from unopened carbonised scrolls.</p></div><p class="v4-q">Can we read ancient books that would crumble if anyone tried to open them?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>About 1,800 scrolls were carbonised when Vesuvius buried Herculaneum in 79 CE; opening them destroys them.</li><li>Since 2023, X-ray scans and machine learning have found the ink inside unopened rolls.</li><li>Different teams using different models read the same letters and words.</li><li>A first word in 2023 became a title in 2025 and a whole scroll in 2026.</li><li>Reading a burned library without opening it is established; how much and how fast are the open questions.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Physics</span><span class="thr">Texts and scripts</span><span class="thr">Chemistry</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="1800" >1,800</b><span class="ctr-u"> rolls and fragments</span></div><div class="ctr-l">recovered from the Villa of the Papyri</div><div class="ctr-c">Sider 2005</div></div><div class="ctr"><div class="ctr-v">$<b class="ctr-n" data-v="700000" >700,000</b><span class="ctr-u"> US dollars</span></div><div class="ctr-l">Grand Prize awarded in February 2024</div><div class="ctr-c">Vesuvius Challenge 2024</div></div><div class="ctr"><div class="ctr-v">more than <b class="ctr-n" data-v="2000" >2,000</b><span class="ctr-u"> characters</span></div><div class="ctr-l">read inside one unopened scroll by early 2024</div><div class="ctr-c">Vesuvius Challenge 2024</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="45" >45</b><span class="ctr-u"> scrolls and fragments</span></div><div class="ctr-l">scanned for the challenge by 2026</div><div class="ctr-c">scrollprize.org 2026</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Machine learning applied to X-ray scans can recover readable text from unopened carbonised scrolls.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:91.7%" role="img" aria-label="Weight of evidence: Established"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Several independent lines agree. Different teams, working from the same scans with different models, reached the same letters and words. The recovered text reads as coherent Greek on subjects and in a style that fit Philodemus. The method was validated on fragments where ink can be seen directly. And results have grown steadily from a word in 2023 to a title in 2025 and a whole scroll in 2026. The open questions are about how much, how fast and how accurately, not whether.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 3 of 6, leaning one way"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>leaning one way</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Older reference works described the unopened Herculaneum rolls as practically unreadable, and many museum labels still do; on that, the textbooks are now behind the evidence. The opposite risk comes from headlines implying a lost ancient library has been read. So far a handful of scrolls have yielded text, much of it Epicurean philosophy, and every reading still needs human papyrologists. The reality is extraordinary, and narrower than the hype.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>About 1,800 papyrus rolls and fragments were recovered from the Villa of the Papyri at Herculaneum from 1752, carbonised by the eruption of Vesuvius in 79 CE.<small>Sider 2005</small></li><li>Attempts to open the scrolls, including Antonio Piaggio&#x27;s silk-thread unrolling machine from the 1750s, read many texts but damaged or destroyed many rolls.<small>Sider 2005</small></li><li>In 2016 Brent Seales&#x27;s team virtually unwrapped the charred En-Gedi scroll from CT scans and read a passage of Leviticus.<small>Seales et al. 2016</small></li><li>In February 2024 the Vesuvius Challenge awarded its $700,000 Grand Prize for more than 2,000 characters read inside an unopened scroll, a previously unknown work attributed to Philodemus.<small>Vesuvius Challenge 2024</small></li><li>In May 2025 the title of the unopened scroll PHerc. 172 was read: a work of Philodemus, On Vices, confirmed by papyrologists.<small>Vesuvius Challenge 2025</small></li><li>In 2026 PHerc. 1667 became the first Herculaneum scroll virtually unwrapped and read end to end.<small>Vesuvius Challenge 2026</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>How far machine-learning ink detection can be trusted letter by letter, and how best to guard against a model producing letter-like shapes that are not there.</li><li>Whether the Villa belonged to Lucius Calpurnius Piso Caesoninus, Julius Caesar&#x27;s father-in-law, as often proposed.</li><li>Whether unexcavated parts of the Villa still hold more of the library, including Latin works.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Beginnings and endings of many opened scrolls were destroyed by early unrolling methods.</li><li>Large parts of the Villa remain buried under the modern town and up to about 20 m of volcanic deposits.</li><li>Scans exist for only a few dozen of the hundreds of unopened rolls, and each must be scanned and processed separately.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Papyrologists and imaging scientists now agree that X-ray computed tomography combined with machine learning can recover text from rolled, carbonised scrolls. The method traces each layer of papyrus through the 3D scan, flattens it into an image, and uses models trained to spot the faint surface texture of ink. Results are accepted only when papyrologists can read coherent Greek, and increasingly when independent teams produce the same letters.</p><ul><li>Independent teams reached the same readings, as with the title of PHerc. 172 in 2025.</li><li>Recovered passages make grammatical and philosophical sense, matching Philodemus&#x27;s known style and themes.</li><li>The method was tested first on opened fragments, where ink can be checked by eye and infrared imaging.</li><li>Reading has progressed from single letters (2023) to a title (2025) to a whole scroll (2026).</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>The unconventional move here was not a theory but a method. Two technology investors, working with Brent Seales, put up prize money, released the scan data openly and invited anyone to try. Many experts had expected the rolled scrolls to stay unreadable for a long time. Within months, a 21-year-old student found the first word, and within a year three young researchers read passages of a lost book. The challengers&#x27; case is that open data, public prizes and fast online collaboration can move a slow field quickly.</p><ul><li>Scans were public, so thousands of people could test ideas in parallel.</li><li>Prizes rewarded partial steps: tracing layers, finding letters, reading titles.</li><li>Crowd discoveries, such as the &#x27;crackle&#x27; texture of ink, came from outside academia.</li></ul><div class="face-s"><b>Its strongest point</b><p>The first word was found about seven months after the open challenge began, and the Grand Prize fell within a year: faster progress than decades of closed, institution-by-institution work had produced.</p></div><p class="face-cr"><b>Credit</b> Nat Friedman and Daniel Gross (funders); student prize-winners Luke Farritor, Youssef Nader and Julian Schilliger</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Scan and read many more of the unopened rolls with the same pipeline and publish the images for independent checking.</li><li>Test ink-detection models blind on scans of opened fragments where the true text is known.</li><li>Recover a work whose text is partly known from another copy, and compare letter by letter.</li><li>Resume excavation of the Villa&#x27;s unexplored levels to learn whether more of the library survives.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,162 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Herculaneum Scrolls: Reading a Burned Library"><button type="button" class="wtoc-i" data-go="herculaneum-scrolls-s1">A library of charcoal</button><button type="button" class="wtoc-i" data-go="herculaneum-scrolls-s2">Two centuries of opening and losing</button><button type="button" class="wtoc-i" data-go="herculaneum-scrolls-s3">Unwrapping without touching</button><button type="button" class="wtoc-i" data-go="herculaneum-scrolls-s4">The crowd cracks it</button><button type="button" class="wtoc-i" data-go="herculaneum-scrolls-s5">Can we trust a machine&#x27;s letters?</button><button type="button" class="wtoc-i" data-go="herculaneum-scrolls-s6">What is still buried</button><button type="button" class="wtoc-i" data-go="herculaneum-scrolls-s7">What would settle the rest</button></nav></div><section class="wsec" id="herculaneum-scrolls-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A library of charcoal</h3><p>In 1752 workmen tunnelling through hardened volcanic rock under the town of Ercolano broke into the rooms of a great Roman villa. Among the statues and bronzes they found blackened cylinders, some of which they took for lumps of charcoal and burned. Then someone noticed traces of writing. They had found a library, the only one to survive intact from the classical world, carbonised by the eruption of Vesuvius in 79 CE.</p><p>The Villa of the Papyri gave up about 1,800 rolls and fragments. The problem was obvious at once. The scrolls were fused, fragile lumps of carbon, and every attempt to open them destroyed part of what they held. The mystery was not who wrote them or where they came from. It was simpler and more painful: what is inside, and can anyone ever read it?</p><blockquote class="wpull"><p>The only surviving library of the ancient world was a shelf of books nobody could open.</p></blockquote></section><section class="wsec" id="herculaneum-scrolls-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Two centuries of opening and losing</h3><p>The earliest efforts were brutal: rolls were sliced in half and the layers scraped away one by one, each copied before it was destroyed. In the 1750s the priest Antonio Piaggio built a machine that unrolled scrolls by gluing silk threads to the outer edge and turning a winch, a few millimetres at a time. It worked, slowly, and it read many texts. It also tore away the beginnings and often the ends of scrolls, where titles were written.</p><p>What did come out was surprising. Most readable texts belong to Philodemus of Gadara, an Epicurean philosopher of the first century BCE who wrote on ethics, music, poetry and death; more than 40 of his works have been identified. There are books of Epicurus&#x27;s own On Nature and fragments of the Stoic Chrysippus. The Villa&#x27;s owner may have been Lucius Calpurnius Piso Caesoninus, Julius Caesar&#x27;s father-in-law and a patron of Philodemus, though that attribution remains a proposal.</p><p>From 1999, multispectral imaging by Brigham Young University made opened fragments far more legible, because infrared light shows dark carbon ink against charred papyrus better than the eye can. But hundreds of rolls stayed closed, judged too fragile to risk.</p></section><section class="wsec" id="herculaneum-scrolls-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Unwrapping without touching</h3><p>The idea of reading a scroll without opening it came from Brent Seales, a computer scientist at the University of Kentucky, who spent two decades on it. The plan: scan the roll with X-ray computed tomography, like a medical CT but at far higher resolution, trace the papyrus surface as it spirals through the 3D volume, flatten it into an image, and find the ink.</p><figure class="wx wx--steps" id="herculaneum-scrolls-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">Reading a scroll without opening it</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Reading a scroll without opening it"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" class="wx-svg" role="img" aria-labelledby="herculaneum-scrolls-f1-t"><title id="herculaneum-scrolls-f1-t">Reading a scroll without opening it: scan, trace, flatten, detect ink, read</title><text x="24" y="26" class="wx-t-cap">The virtual unwrapping pipeline · schematic</text><g class="wx-st" data-s="1"><rect x="40" y="110" width="120" height="60" rx="30" class="wx-inkfill wx-o80"/><ellipse cx="160" cy="140" rx="12" ry="30" class="wx-stone3 wx-edge"/><path d="M20,90 L180,90" class="wx-flow wx-s7"/><path d="M20,190 L180,190" class="wx-flow wx-s7"/><text x="100" y="80" text-anchor="middle" class="wx-t-s">X-ray beam</text><circle cx="32" cy="232" r="9" class="wx-num"/><text x="32" y="236" text-anchor="middle" class="wx-numt">1</text><text x="48" y="236" class="wx-t-b">Scan</text><text x="48" y="251" class="wx-t-s">X-ray CT turns the</text><text x="48" y="265" class="wx-t-s">roll into 3D slices</text></g><g class="wx-st" data-s="2"><path d="M284.0,140.0 L284.1,140.2 L284.2,140.5 L284.3,140.8 L284.3,141.0 L284.2,141.3 L284.1,141.6 L284.0,141.9 L283.8,142.2 L283.5,142.5 L283.2,142.7 L282.8,143.0 L282.4,143.2 L282.0,143.4 L281.5,143.6 L281.0,143.8 L280.4,143.9 L279.8,144.0 L279.2,144.1 L278.5,144.1 L277.9,144.1 L277.2,144.0 L276.5,143.9 L275.9,143.8 L275.2,143.6 L274.6,143.3 L274.0,143.1 L273.5,142.8 L272.9,142.4 L272.5,142.0 L272.1,141.6 L271.7,141.1 L271.4,140.7 L271.2,140.2 L271.1,139.7 L271.0,139 tton" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Scan: X-ray computed tomography turns the roll into thousands of 3D slices.</p><ol class="wx-steplist"><li>Scan: X-ray computed tomography turns the roll into thousands of 3D slices.</li><li>Trace: software follows one sheet of papyrus round the spiral (segmentation).</li><li>Flatten: the traced surface is unrolled into a flat image.</li><li>Detect ink: a model trained on ink&#x27;s &#x27;crackle&#x27; texture shows letters.</li><li>Read and check: papyrologists read the Greek and compare teams&#x27; results.</li></ol><figcaption>The virtual unwrapping pipeline used by Seales&#x27;s team and the Vesuvius Challenge, in five steps. <span class="wx-src">Based on: Seales et al. 2016 (virtual unwrapping); Vesuvius Challenge announcements 2023–2026 (crackle, first word, prizes). Schematic, not to scale.</span></figcaption><p class="vh">Four panels in a row joined by arrows. Step 1: a dark scroll lies in an X-ray beam, drawn as moving dashed lines, labelled X-ray CT turns the roll into 3D slices. Step 2: a cross-section shows a tight spiral with one turn highlighted, labelled follow one sheet of papyrus round the spiral. Step 3: a flat rectangular sheet, labelled unroll the surface into a flat image. Step 4: the flat sheet with faint crack marks and the Greek word porphyras appearing in white, labelled machine learning spots the texture of dried ink. Step 5: a box below explains that papyrologists read and check the letters; the first word, found in October 2023, was porphyras, purple.</p></figure><p>In 2016 the method worked on a charred scroll from En-Gedi on the Dead Sea shore, revealing the opening verses of Leviticus. Herculaneum was harder. The En-Gedi ink contained metal, which shows up brightly in X-rays. Herculaneum&#x27;s ink is mostly carbon, written on papyrus that is now also carbon, so the two look almost identical to an X-ray. In 2015 Vito Mocella&#x27;s team reported letters inside rolled papyri using phase-contrast imaging, and in 2016 another study found lead in the ink of some fragments, but readable text from inside a closed roll stayed out of reach.</p><figure class="wx wx--static" id="herculaneum-scrolls-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">Why the ink is so hard to see</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Why the ink is so hard to see"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" class="wx-svg" role="img" aria-labelledby="herculaneum-scrolls-f2-t"><title id="herculaneum-scrolls-f2-t">Inside a carbonised scroll: crushed layers, carbon ink on charred papyrus, and why X-rays barely see it</title><text x="24" y="26" class="wx-t-cap">Section through a carbonised roll · schematic</text><path d="M196.0,210.0 L196.2,210.3 L196.3,210.6 L196.4,210.9 L196.5,211.2 L196.5,211.5 L196.4,211.9 L196.3,212.2 L196.1,212.5 L195.9,212.9 L195.6,213.2 L195.2,213.5 L194.8,213.8 L194.3,214.1 L193.8,214.4 L193.2,214.7 L192.6,214.9 L191.9,215.1 L191.1,215.3 L190.4,215.4 L189.5,215.6 L188.7,215.6 L187.8,215.7 L187.0,215.7 L186.1,215.6 L185.2,215.5 L184.3,215.4 L183.4,215.2 L182.5,215.0 L181.7,214.7 L180.8,214.4 L180.1,214.1 L179.3,213.7 L178.6,213.2 L178.0,212.7 L177.4,212.2 L177.0,211.7 L176.5,211.1 L176.2,210.5 L176.0,209.9 L175.8, 2 L48.8,217.0 L48.0,210.7 L48.2,204.4 L49.3,198.1 L51.3,191.9 L54.2,185.7 L58.0,179.7 L62.7,173.9 L68.2,168.3 L74.6,163.0 L81.7,158.0 L89.5,153.2 L98.1,148.9 L107.2,144.9 L116.9,141.3 L127.1,138.2 L137.8,135.6 L148.8,133.4 L160.2,131.7 L171.7,130.5 L183.5,129.8 L195.2,129.7 L207.0,130.1 L218.7,131.0 L230.3,132.4 L241.6,134.3 L252.6,136.8 L263.3,139.7 L273.5,143.1 L283.1,146.9 L292.2,151.2 L300.7,155.8 L308.4,160.9 L315.4,166.2 L321.6,171.9 L327.0,177.8 L331.5,183.9 L335.0,190.3 L337.6,196.8 L339.3,203.4 L340.0,210.0" class="wx-bold wx-draw" pathLength="1" style="--d:0"/><rect x="276" y="176" width="54" height="44" rx="4" class="wx-hl"/><line x1="330" y1="198" x2="420" y2="120" class="wx-thin"/><text x="190" y="320" text-anchor="middle" class="wx-t-m">crushed and fused layers, many turns</text><text x="190" y="336" text-anchor="middle" class="wx-t-s">(fewer drawn)</text><g class="wx-pop" style="--d:6"><rect x="420" y="60" width="280" height="150" rx="10" class="wx-card wx-edge-soft"/><rect x="440" y="100" width="240" height="16" class="wx-inkfill wx-o80"/><rect x="440" y="146" width="240" height="16" class="wx-inkfill wx-o80"/><rect x="460" y="116" width="18" height="4" class="wx-inkfill"/><rect x="504" y="116" width="18" height="4" class="wx-inkfill"/><rect x="548" y="116" width="18" height="4" class="wx-inkfill"/><rect x="592" y="116" width="18" height="4" class="wx-inkfill"/><rect x="636" y="116" width="18" height="4" class="wx-inkfill"/><text x="440" y="86" class="wx-t-b">Zoom: two layers of papyrus</text><text x="440" y="136" class="wx-t-s">carbon ink: a thin film of soot</text><text x="440" y="182" class="wx-t-s">charred papyrus: also mostly carbon</text><text x="440" y="198" class="wx-t-s">so ink and page look almost the same</text></g><text x="420" y="250" class="wx-t-b">X-ray contrast (illustrative)</text><text x="420" y="276" class="wx-t-s">metal-based ink</text><rect x="540" y="265" width="160" height="14" class="wx-c2 wx-growx" style="--d:8"/><text x="420" y="304" class="wx-t-s">carbon ink, charred</text><rect x="540" y="293" width="12" height="14" class="wx-c4 wx-growx" style="--d:9"/><text x="560" y="304" class="wx-t-s">almost nothing</text><text x="420" y="336" class="wx-t-s">What machine learning uses instead: the ink's</text><text x="420" y="350" class="wx-t-s">surface texture, a "crackle" seen in 2023.</text></svg></div></div><figcaption>The layers of a carbonised roll are crushed and fused, and carbon ink on charred papyrus gives almost no X-ray contrast. <span class="wx-src">Based on: Mocella et al. 2015; Brun et al. 2016 (metal in some inks); Parker et al. 2019 (machine-learning ink detection). Contrast bars illustrative, not measured values.</span></figcaption><p class="vh">Left: a flattened spiral representing a crushed scroll in cross-section, labelled crushed and fused layers, many turns, fewer drawn. A small box on the spiral leads to a zoom on the right showing two dark layers of papyrus with thin dashes of ink between them, labelled carbon ink, a thin film of soot, and charred papyrus, also mostly carbon, so ink and page look almost the same. Below, an illustrative bar chart compares X-ray contrast: a long bar for metal-based ink and a tiny bar for carbon ink on charred papyrus, labelled almost nothing. A note says machine learning uses the ink&#x27;s surface texture, a crackle seen in 2023.</p></figure></section><section class="wsec" id="herculaneum-scrolls-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The crowd cracks it</h3><p>In March 2023 Seales teamed up with the investors Nat Friedman and Daniel Gross to launch the Vesuvius Challenge. They released high-resolution scans of scrolls from the Institut de France, made at the Diamond Light Source synchrotron in England, and offered prizes. Thousands joined. One of them, Casey Handmer, noticed a faint &#x27;crackle&#x27; texture on the scanned papyrus that matched where ink should be: a physical signal a model could learn.</p><p>In October 2023 Luke Farritor, a 21-year-old student at the University of Nebraska, trained a model on that texture and saw a word emerge: ΠΟΡΦΥΡΑϹ, porphyras, &#x27;purple&#x27;. In February 2024 Farritor, Youssef Nader and Julian Schilliger won the $700,000 Grand Prize for more than 2,000 characters, about 5% of one scroll. Papyrologists found a previously unknown text, apparently by Philodemus, on pleasure, music and food.</p><aside class="wcall"><b>Fresh from the field</b><p>In May 2025 Marcel Roth and Micha Nowak of the University of Würzburg read the title of PHerc. 172, a still-rolled scroll in Oxford&#x27;s Bodleian Library: Philodemus, On Vices. Sean Johnson of the Vesuvius Challenge found it independently, and papyrologists led by Federica Nicolardi confirmed it. It was the first title ever recovered noninvasively from a rolled Herculaneum scroll. In 2026 the team announced that PHerc. 1667, held in Naples, had been virtually unwrapped and read end to end.</p></aside><blockquote class="wpull"><p>A word nobody had seen for almost two thousand years was &#x27;purple&#x27;. The colour of kings, read by a student&#x27;s software.</p></blockquote></section><section class="wsec" id="herculaneum-scrolls-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Can we trust a machine&#x27;s letters?</h3><p>The fair worry is obvious. Machine-learning models find patterns, and a model trained to see letters might see letters that are not there. The challenge answered this in three ways. Winning entries had to be reproducible from the public data. Independent teams, using different models, had to converge on the same readings, as happened with the title of PHerc. 172. And papyrologists judged whether the result made sense as Greek, in grammar, spelling and content.</p><p>No model invents a coherent sentence of Epicurean philosophy in first-century Greek hand by accident. That is the strongest check of all, and it is why scholars who study these texts have accepted the readings, while still arguing, as they always have, over individual letters.</p><p>It also matters what is being read. So far the recovered texts are philosophy, mostly Epicurean, which is what the opened scrolls led scholars to expect from this collection. That is not a disappointment. Each new passage fills gaps in how Greek thinkers argued about pleasure, virtue and the good life, and each confirmed reading makes the next one faster, because models improve with every letter that experts verify.</p></section><section class="wsec" id="herculaneum-scrolls-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What is still buried</h3><p>The Villa itself was never fully excavated. The eighteenth-century tunnellers followed walls underground and then left; excavations in the 1990s and 2000s exposed part of the building and showed it had lower levels, but much remains buried beneath volcanic deposits and the modern town. Some scholars hope more of the library lies there, perhaps including Latin literature. That hope is reasonable but untested: nobody knows what the unexplored rooms contain.</p><p>The scrolls already found are a race against time and money. Each must be moved, scanned at a synchrotron and processed, and the carbonised rolls are fragile. By 2026 some 45 scrolls and fragments had been scanned for the challenge, a small share of those that remain unopened.</p></section><section class="wsec" id="herculaneum-scrolls-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle the rest</h3><p>The core claim is already settled: text can be read inside unopened scrolls. What remains is scale and accuracy. Scanning the remaining rolls, publishing images for independent checking, and blind tests on fragments whose text is known would measure the method&#x27;s error rate. Reading a work that also survives in another copy would give a direct letter-by-letter check. And careful excavation of the Villa&#x27;s unexplored levels could show whether the library of Herculaneum was larger than the shelves found in 1752.</p><p>It is a rare thing for a mystery to end with the evidence itself speaking. Here, new tools are letting a burned library tell us what it held.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-loss" style="--i:0"><span class="wtl-y">79 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Vesuvius buries and carbonises the library</span></li><li class="wtl-find" style="--i:1"><span class="wtl-y">1752 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Scrolls found in the Villa of the Papyri</span></li><li class="wtl-study" style="--i:2"><span class="wtl-y">1756 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Piaggio&#x27;s unrolling machine in use</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">2015 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">X-ray phase contrast reveals letters in rolled papyri</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">2016 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">En-Gedi scroll read by virtual unwrapping</span></li><li class="wtl-find" style="--i:5"><span class="wtl-y">2023 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Vesuvius Challenge; first word: &#x27;purple&#x27;</span></li><li class="wtl-find" style="--i:6"><span class="wtl-y">2024 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Grand Prize: passages of a lost Philodemus work</span></li><li class="wtl-find" style="--i:7"><span class="wtl-y">2025 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Title of PHerc. 172 read: On Vices</span></li><li class="wtl-find" style="--i:8"><span class="wtl-y">2026 CE</span><span class="wtl-k">Found</span><span class="wtl-t">PHerc. 1667 read end to end</span></li></ol><details class="srcs"><summary>Sources for this case (10)</summary><ol><li>Seales, W. B., Parker, C. S., Segal, M., Tov, E., Shor, P. &amp; Porath, Y. (2016). From damage to discovery via virtual unwrapping: reading the scroll from En-Gedi. Science Advances 2(9): e1601247. <a href="https://doi.org/10.1126/sciadv.1601247" target="_blank" rel="noopener">doi:10.1126/sciadv.1601247</a></li><li>Mocella, V., Brun, E., Ferrero, C. &amp; Delattre, D. (2015). Revealing letters in rolled Herculaneum papyri by X-ray phase-contrast imaging. Nature Communications 6: 5895. <a href="https://doi.org/10.1038/ncomms6895" target="_blank" rel="noopener">doi:10.1038/ncomms6895</a></li><li>Brun, E., Cotte, M., Wright, J., et al. (2016). Revealing metallic ink in Herculaneum papyri. PNAS 113(14): 3751–3754. <a href="https://doi.org/10.1073/pnas.1519958113" target="_blank" rel="noopener">doi:10.1073/pnas.1519958113</a></li><li>Parker, C. S., Parsons, S., Bandy, J., Chapman, C., Coppens, F. &amp; Seales, W. B. (2019). From invisibility to readability: recovering the ink of Herculaneum. PLOS ONE 14(5): e0215775. <a href="https://doi.org/10.1371/journal.pone.0215775" target="_blank" rel="noopener">doi:10.1371/journal.pone.0215775</a></li><li>Bukreeva, I., Mittone, A., Bravin, A., et al. (2016). Virtual unrolling and deciphering of Herculaneum papyri by X-ray phase-contrast tomography. Scientific Reports 6: 30364. <a href="https://doi.org/10.1038/srep30364" target="_blank" rel="noopener">doi:10.1038/srep30364</a></li><li>Stabile, S., Palermo, F., Bukreeva, I., et al. (2021). A computational platform for the virtual unfolding of Herculaneum Papyri. Scientific Reports 11. <a href="https://doi.org/10.1038/s41598-020-80458-z" target="_blank" rel="noopener">doi:10.1038/s41598-020-80458-z</a></li><li>Sider, D. (2005). The Library of the Villa dei Papiri at Herculaneum. J. Paul Getty Museum.</li><li>Vesuvius Challenge (2024). 2023 Grand Prize awarded: we can read the first scroll. scrollprize.org, 5 February 2024.</li><li>Vesuvius Challenge (2025). $60,000 First Title Prize awarded. scrollprize.substack.com, 5 May 2025.</li><li>Vesuvius Challenge (2026). PHerc. 1667: the first Herculaneum scroll read end to end. scrollprize.org; reported by L. Katz, Forbes, 1 July 2026.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-herculaneum-scrolls" data-t="The Herculaneum Scrolls: Reading a Burned Library"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Herculaneum Scrolls: Reading a Burned Library</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-herculaneum-scrolls</span> (updated 25 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script>
