<script type="text/x-tpl" id="case-malta-temples-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Ggantija Temple on Gozo.jpg" data-cap="Ġgantija (Gozo), Ħaġar Qim, Mnajdra, Tarxien and Ħal Saflieni (Malta)" data-big><figcaption></figcaption></figure><div class="sh-k">Chambers, Sound and Stone</div><h2 class="sh-t" id="case-malta-temples-st" tabindex="-1">Malta&#x27;s Temples: Older Than the Pyramids, but Ice Age?</h2><p class="sh-s">Europe&#x27;s oldest freestanding stone temples, an underground city of the dead, and claims of drowned sanctuaries offshore. How far back does Malta go?</p><div class="sh-v"><span class="vstamp vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><p class="sh-claim"><b>What the stamp rates:</b> Malta&#x27;s megalithic temples were built in the Ice Age, thousands of years before 3600 BCE, by a lost culture whose other works now lie under the sea.</p></div><p class="v4-q">Were Malta&#x27;s megalithic temples built in the Ice Age by a people now lost beneath the sea?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Malta&#x27;s stone temples, built about 3600 to 2500 BCE, are older than the pyramids.</li><li>Some say they are far older, Ice Age work of a culture now under the sea.</li><li>Radiocarbon dates, pottery, the villages beneath the temples and the bones of the people buried in them all fall in the same window.</li><li>Hunter-gatherers did reach Malta by sea around 8,500 years ago, which shows how much remains to be found.</li><li>An Ice Age temple culture is ruled out; the offshore &#x27;temple&#x27; has not stood up to inspection.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Geology</span><span class="thr">Biology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="3600" >3,600</b><span class="ctr-u"> BCE</span></div><div class="ctr-l">approximate start of temple building at Ġgantija</div><div class="ctr-c">UNESCO; Trump 2002</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="7000" >7,000</b><span class="ctr-u"> people</span></div><div class="ctr-l">estimated remains in the Ħal Saflieni Hypogeum</div><div class="ctr-c">UNESCO</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="100" >100</b><span class="ctr-u"> km</span></div><div class="ctr-l">open sea crossed by hunter-gatherers to reach Malta c. 8,500 years ago</div><div class="ctr-c">Scerri et al. 2025</div></div><div class="ctr"><div class="ctr-v">up to c. <b class="ctr-n" data-v="6" >6</b><span class="ctr-u"> m</span></div><div class="ctr-l">height of Ġgantija&#x27;s surviving walls</div><div class="ctr-c">Heritage Malta</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Malta&#x27;s megalithic temples were built in the Ice Age, thousands of years before 3600 BCE, by a lost culture whose other works now lie under the sea.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The temples&#x27; age rests on many independent lines: radiocarbon dates from inside and beneath them, pottery sequences, temples built over earlier farming villages, and the bones and DNA of the people buried in them, all within about 3600–2500 BCE. Nothing from the temples is older. The 2025 discovery of hunter-gatherers shows how much remains to be found, but it points to seafaring foragers around 6500 BCE, not Ice Age temple builders. The offshore &#x27;temple&#x27; has not stood up to inspection.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks date the temples confidently and correctly. If anything they undersell them, rarely saying that they are among the oldest freestanding stone buildings on Earth and that specialists once wrongly assumed they were derivative. They were also too sure that nobody reached Malta before farming, which the Latnija finds of 2025 overturned. That record of surprises is a fair reason to keep looking offshore, not a reason to move the temples into the Ice Age.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Malta and Gozo hold some of the oldest freestanding stone buildings known, the megalithic temples, built between about 3600 and 2500 BCE; Ġgantija on Gozo, from about 3600 BCE, has walls still up to about 6 m high.<small>UNESCO; Trump 2002</small></li><li>The Ħal Saflieni Hypogeum, a three-level complex cut into the rock and found in 1902, was used from about 4000 to 2500 BCE, and archaeologists estimated it held the remains of some 7,000 people.<small>UNESCO; Trump 2002</small></li><li>Hunter-gatherers reached Malta by sea around 8,500 years ago, about 1,000 years before farmers, crossing roughly 100 km of open water from Sicily; their remains were found at Latnija cave.<small>Scerri et al. 2025</small></li><li>Farmers from Sicily settled Malta around 5500 BCE, and at sites such as Skorba temples were built over the remains of their earlier villages, in a sequence of pottery styles and radiocarbon dates.<small>Trump 1966; Malone et al. 2020</small></li><li>Calibrated radiocarbon dating in the late 1960s and 1970s showed that the temples were older than Egypt&#x27;s pyramids and the Aegean palaces, overturning the older view that the idea came to Malta from the east.<small>Renfrew 1973</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>What the temples were used for and how the societies that built them were organised.</li><li>Why temple building ended around 2500 BCE, whether through drought, soil exhaustion, disease, social change or newcomers.</li><li>How deliberately the temples were aligned to the sun and stars, such as the equinox sunrise through Mnajdra&#x27;s lower temple, or to Sirius as some propose.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>At the end of the Ice Age the sea stood some 50–80 m lower, and the drowned coasts around Malta have barely been surveyed by archaeologists.</li><li>Many temple sites were cleared in the 19th and early 20th centuries with poor recording, and most of the Hypogeum&#x27;s bones were lost.</li><li>The temple builders left no writing, so their names, beliefs and language are unknown.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Archaeologists see the temples as the work of Malta&#x27;s own Neolithic farming communities, descendants of settlers from Sicily, who over a thousand years developed a unique tradition of stone temples and rock-cut tombs. The sequence is fixed by stratigraphy, pottery and many radiocarbon dates: villages first, then temples built over them, then the end of the tradition around 2500 BCE. Specialists were wrong before, when they thought the temples copied older eastern models, and they were surprised in 2025 by hunter-gatherers a thousand years before farming.</p><ul><li>Temple floors and fills contain pottery and bones of the known temple phases, never older ones.</li><li>At Skorba and elsewhere, temples sit on top of the remains of earlier Neolithic villages.</li><li>Ancient DNA from the temple period points to descent from Mediterranean Neolithic farmers.</li><li>The offshore &#x27;temple&#x27; reported in 1999 has not been accepted by Maltese archaeologists as a built structure.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>In Underworld Hancock drew on Maltese researchers, among them Anton Mifsud and colleagues, who argued that Malta was inhabited in the Old Stone Age, 15,000–18,000 years ago, and that a flood ended the temple culture. He dived in search of a reported underwater temple and discussed cart ruts running into the sea. In Ancient Apocalypse he suggested that people could have reached Malta in the Ice Age following migrating animals, backed Lenie Reedijk&#x27;s view that the temples tracked the star Sirius over many centuries, and argued that the temples may be far older than the textbook date, with more evidence under the sea.</p><ul><li>The temples appear suddenly and at a high level of skill, which he reads as a sign of an older inheritance.</li><li>Malta was much larger and joined or nearly joined to Sicily when sea level was low, so Ice Age visitors are plausible.</li><li>Cart ruts run into the sea, suggesting that land now under water was once used.</li><li>Star alignments, if they were set deliberately, could record the date the builders began.</li></ul><div class="face-s"><b>Its strongest point</b><p>Malta&#x27;s prehistory has twice turned out older than experts thought: first when calibration placed the temples before the pyramids, and again in 2025 when hunter-gatherers were found there a thousand years before farming. And the drowned coasts around the islands are real and largely unexplored.</p></div><p class="face-cr"><b>Credit</b> Graham Hancock (Underworld, book and Channel 4 series, 2002; Ancient Apocalypse, Netflix, 2022, episode &#x27;Sirius Rising&#x27;); with Anton Mifsud and colleagues (Malta: Echoes of Plato&#x27;s Island, 2001) and Lenie Reedijk</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Radiocarbon or luminescence dates from sealed layers beneath a temple&#x27;s foundations that are older than the Neolithic.</li><li>An archaeological survey of the claimed underwater structures, with samples and dates.</li><li>Any Palaeolithic tools or hearths on Malta or on its drowned shelf, securely dated.</li><li>A precise, published survey showing whether temple axes point to Sirius or other stars at a specific date.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,123 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Malta&#x27;s Temples: Older Than the Pyramids, but Ice Age?"><button type="button" class="wtoc-i" data-go="malta-temples-s1">Giants&#x27; work</button><button type="button" class="wtoc-i" data-go="malta-temples-s2">What is firmly dated</button><button type="button" class="wtoc-i" data-go="malta-temples-s3">Where the experts were wrong</button><button type="button" class="wtoc-i" data-go="malta-temples-s4">The Ice Age case at its strongest</button><button type="button" class="wtoc-i" data-go="malta-temples-s5">Testing it</button><button type="button" class="wtoc-i" data-go="malta-temples-s6">What the sea still hides</button></nav></div><section class="wsec" id="malta-temples-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Giants&#x27; work</h3><p>Maltese folklore says a giantess built Ġgantija. Standing inside it, you can see why. On a ridge on the island of Gozo, walls of great limestone blocks still rise about 6 m, curving into lobed chambers that once held altars, carved stone and the bones of sacrificed animals. Five and a half thousand years after they were raised, they remain among the oldest freestanding stone buildings in the world.</p><p>Malta has more. Beneath a suburb of the capital lies the Ħal Saflieni Hypogeum, three levels of chambers carved into the rock, their ceilings painted with red ochre spirals, where the remains of thousands of people were laid. Graham Hancock has visited the islands for his book and television series Underworld (2002) and for the third episode of Ancient Apocalypse (2022), &#x27;Sirius Rising&#x27;, and in both he asked whether the temples could be far older than the textbooks say, perhaps from the Ice Age.</p><blockquote class="wpull"><p>Malta&#x27;s temples are older than the pyramids. The question is whether they are older than farming.</p></blockquote></section><section class="wsec" id="malta-temples-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What is firmly dated</h3><p>Malta&#x27;s prehistory has been dug, dated and argued over for more than a century. Excavations by David Trump at Skorba in the 1960s established a sequence of pottery styles and radiocarbon dates. First came farmers from Sicily, with pottery, crops and herds. After more than a thousand years of village life, from about 3600 BCE, their descendants began to build temples: Ġgantija, then Ħaġar Qim, Mnajdra, Tarxien and others. At Skorba, the temple sits on top of the remains of the earlier village. The Hypogeum was in use from about 4000 to 2500 BCE, and temple building ended around 2500 BCE.</p><figure class="wx wx--steps" id="malta-temples-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">Malta&#x27;s deep time</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Malta&#x27;s deep time"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" class="wx-svg" role="img" aria-labelledby="malta-temples-f1-t"><title id="malta-temples-f1-t">A timeline of Malta's prehistory, from the proposed Ice Age temples to the dated temple period, with the rising sea, in five steps</title><text x="24" y="28" class="wx-t-cap">Malta, 12,500 to 2000 BCE</text><line x1="223.3" y1="44" x2="223.3" y2="300" class="wx-guide"/><text x="223.3" y="316" text-anchor="middle" class="wx-t-s">12,000 BCE</text><line x1="316.7" y1="44" x2="316.7" y2="300" class="wx-guide"/><text x="316.7" y="316" text-anchor="middle" class="wx-t-s">10,000</text><line x1="410.0" y1="44" x2="410.0" y2="300" class="wx-guide"/><text x="410.0" y="316" text-anchor="middle" class="wx-t-s">8000</text><line x1="503.3" y1="44" x2="503.3" y2="300" class="wx-guide"/><text x="503.3" y="316" text-anchor="middle" class="wx-t-s">6000</text><line x1="596.7" y1="44" x2="596.7" y2="300" class="wx-guide"/><text x="596.7" y="316" text-anchor="middle" class="wx-t-s">4000</text><line x1="690.0" y1="44" x2="690.0" y2="300" class="wx-guide"/><text x="690.0" y="316" text-anchor="middle" class="wx-t-s">2000 BCE</text><line x1="200" y1="300" x2="690" y2="300" class="wx-line"/><g class="wx-st" data-s="1"><text x="24" y="71" class="wx-t-b">Temple building</text><text x="24" y="85" class="wx-t-s">Ġgantija to Tarxien phases</text><rect x="615.3" y="64" width="51.3" height="14" rx="3" class="wx-c1 wx-o80"/></g><g class="wx-st" data-s="1"><text x="24" y="117" class="wx-t-b">Ħal Saflieni Hypogeum in use</text><text x="24" y="131" class="wx-t-s">rock-cut burial complex</text><rect x="596.7" y="110" width="70.0" height="14" rx="3" class="wx-c6 wx-o80"/></g><g class="wx-st" data-s="2"><text x="24" y="163" class="wx-t-b">First farmers</text><text x="24" y="177" class="wx-t-s">pottery, crops, herds from Sicily</text><rect x="529.0" y="156" width="86.3" height="14" rx="3" class="wx-c3 wx-o80"/></g><g class="wx-st" data-s="3"><text x="24" y="209" class="wx-t-b">Hunter-gatherers at Latnija</text><text x="24" y="223" class="wx-t-s">reached by sea, c. 100 km</text><rect x="477.7" y="202" width="46.7" height="14" rx="3" class="wx-c2 wx-o80"/></g><g class="wx-st" data-s="4"><text x="24" y="255" class="wx-t-b">Proposed Ice Age temples</text><text x="24" y="269" class="wx-t-s">Hancock; Mifsud and colleagues</text><rect x="200.0" y="248" width="135.3" height="14" rx="3" class="wx-accfill wx-o20"/><rect x="200.0" y="248" width="135.3" height="14" rx="3" class="wx-dash"/><text x="341.3" y="259" class="wx-t-s wx-t-a">no dated find</text></g><g class="wx-st wx-hide" data-s="5"><polygon points="200.0,340 200.0,410.2 223.3,404.8 270.0,395.8 316.7,388.6 363.3,377.8 410.0,367.0 456.7,357.1 503.3,349.9 550.0,345.4 596.7,343.6 643.3,342.2 690.0,341.4 690.0,340" class="wx-water wx-o60"/><line x1="200" y1="340" x2="690" y2="340" class="wx-line wx-s2"/><polyline points="200.0,410.2 223.3,404.8 270.0,395.8 316.7,388.6 363.3,377.8 410.0,367.0 456.7,357.1 503.3,349.9 550.0,345.4 596.7,343.6 643.3,342.2 690.0,341.4" class="wx-line wx-s2 wx-draw" pathLength="1"/><text x="24" y="344" class="wx-t-b">Sea level</text><text x="24" y="358" class="wx-t-s">below today, approximate</text><text x="316.7" y="402.6" text-anchor="middle" class="wx-t-s wx-halo">c. 55 m lower</text><text x="596.7" y="362.0" text-anchor="middle" class="wx-t-s wx-halo">near today</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> Temples c. 3600–2500 BCE; the Hypogeum in use c. 4000–2500 BCE.</p><ol class="wx-steplist"><li>Temples c. 3600–2500 BCE; the Hypogeum in use c. 4000–2500 BCE.</li><li>Farmers from Sicily arrive c. 5500 BCE; their villages lie beneath some temples.</li><li>Hunter-gatherers reached Malta by sea c. 8,500 years ago, a 2025 discovery.</li><li>The proposed Ice Age temples: no dated find supports them.</li><li>The rising sea: c. 55 m lower around 10,000 BCE, which drowned the old coasts.</li></ol><figcaption>The dated sequence of Malta&#x27;s prehistory set against the proposed Ice Age temples, with the sea level that drowned the old coasts. <span class="wx-src">Based on: Temple phases after Trump 2002 and Malone et al. 2020; Hypogeum after UNESCO; Latnija after Scerri et al. 2025; sea level approximate, after Fairbanks 1989 and later global curves.</span></figcaption><p class="vh">A timeline from 12,500 to 2000 BCE. Step 1 shows temple building from about 3600 to 2500 BCE and use of the Ħal Saflieni Hypogeum from about 4000 to 2500 BCE. Step 2 adds the first farmers from about 5500 BCE. Step 3 adds hunter-gatherers at Latnija cave from about 6550 to 5550 BCE, reached by a sea crossing of about 100 kilometres. Step 4 adds a dashed bar from 12,500 to about 9600 BCE for the proposed Ice Age temples, marked &#x27;no dated find&#x27;. Step 5 adds an approximate sea-level curve, about 55 metres below today around 10,000 BCE and close to today&#x27;s by about 4000 BCE.</p></figure><p>Recent work has tightened this picture. The FRAGSUS project led by Caroline Malone and colleagues added new dates, soil records and burial studies, and ancient genomes from the temple period trace the builders mainly to the Neolithic farmers who spread through the Mediterranean. None of these lines places any temple before the Neolithic.</p><p>How the builders worked is also well understood in outline. They quarried the islands&#x27; two main limestones, often hard coralline for outer walls and softer globigerina for carved interiors, and moved blocks weighing many tonnes without metal tools or wheels, probably on rollers and levers; stone balls found at Ġgantija are often interpreted as rollers. Inner walls were faced with dressed slabs and outer walls with huge upright blocks, with rubble packed between them. Carved spirals, animal friezes and stout human figures show a confident, local art with no close parallel abroad.</p></section><section class="wsec" id="malta-temples-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Where the experts were wrong</h3><p>The mainstream has been surprised on Malta before, and fairly so. Until the late 1960s many archaeologists assumed that great stone architecture must have spread west from Egypt and the Aegean, and that Malta&#x27;s temples were late provincial copies. Calibrated radiocarbon dating, championed by Colin Renfrew in Before Civilization (1973), showed the reverse: the temples were older than the pyramids and the Aegean palaces. Malta became a showcase for local invention.</p><aside class="wcall"><b>Fresh from the field</b><p>In 2025 Eleanor Scerri and colleagues reported in Nature that hunter-gatherers were living in Latnija cave on Malta from about 8,500 years ago, roughly a thousand years before the first farmers. Sea levels were then close to today&#x27;s, so they must have crossed about 100 km of open sea from Sicily, the longest known hunter-gatherer voyage in the Mediterranean. The textbook view that nobody reached Malta before farming was wrong.</p></aside><p>Those two surprises are the heart of Hancock&#x27;s appeal. If experts misjudged Malta twice, why trust them now?</p></section><section class="wsec" id="malta-temples-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The Ice Age case at its strongest</h3><p>In Underworld Hancock drew on Maltese researchers, among them Anton Mifsud and colleagues, authors of Malta: Echoes of Plato&#x27;s Island (2001), who argued that people lived on Malta in the Old Stone Age and that a great flood ended the temple culture. He pointed to cart ruts that run into the sea and to reports of structures under water, and dived in search of a sunken temple said to lie off the north-east coast, though conflicting directions defeated him.</p><p>In Ancient Apocalypse he framed it differently. When sea level was low, Malta was much larger and joined or nearly joined to Sicily, so people could have followed migrating animals there in the Ice Age. The Għar Dalam cave holds dwarf elephants and hippos of that age. He supported the Dutch researcher Lenie Reedijk&#x27;s idea that the temples were built to track the rising of Sirius as its position shifted over centuries, and linked the temples with Egyptian traditions of Osiris as a bringer of star knowledge. The drowned shelf around the islands, he argued, may hold the evidence.</p><figure class="wx wx--static" id="malta-temples-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">Where Malta&#x27;s evidence lies</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Where Malta&#x27;s evidence lies"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" class="wx-svg" role="img" aria-labelledby="malta-temples-f2-t"><title id="malta-temples-f2-t">Map of Malta and Gozo showing the temples, the Hypogeum, Għar Dalam, the cart ruts and the claimed underwater temple</title><text x="24" y="28" class="wx-t-cap">Malta and Gozo: where the evidence lies (coast simplified)</text><rect x="16" y="40" width="688" height="470" rx="6" class="wx-water wx-o40"/><polygon points="221.7,212.6 272.4,205.7 289.3,247.3 317.5,261.2 334.4,268.1 345.7,282.0 390.8,302.8 402.1,309.7 419.0,330.6 430.3,337.5 447.2,344.4 481.0,372.2 492.3,393.0 486.6,420.7 464.1,413.8 452.8,441.6 435.9,462.4 402.1,476.3 362.6,455.4 334.4,441.6 289.3,420.7 266.8,399.9 244.2,365.2 221.7,323.6 232.9,288.9 227.3,268.1 216.0,240.4" class="wx-sand wx-edge"/><polygon points="187.9,171.0 221.7,150.2 187.9,122.4 165.3,108.6 137.1,94.7 97.7,87.8 63.8,108.6 58.2,129.4 86.4,157.1 120.2,177.9 154.0,184.9" class="wx-sand wx-edge"/><ellipse cx="227.3" cy="182.1" rx="10" ry="6" class="wx-sand wx-edge"/><circle cx="152.9" cy="133.5" r="6" class="wx-c1 wx-edge wx-pop" style="--d:0"/><line x1="152.9" y1="133.5" x2="208.9" y2="135.5" class="wx-thin"/><text x="212.9" y="139.5" text-anchor="start" class="wx-t-b wx-halo">Ġgantija</text><text x="212.9" y="153.5" text-anchor="start" class="wx-t-s wx-halo">c. 3600 BCE</text><circle cx="275.8" cy="308.4" r="6" class="wx-c1 wx-edge wx-pop" style="--d:1"/><line x1="275.8" y1="308.4" x2="219.8" y2="310.4" class="wx-thin"/><text x="215.8" y="314.4" text-anchor="end" class="wx-t-b wx-halo">Ta' Ħaġrat and Skorba</text><text x="215.8" y="328.4" text-anchor="end" class="wx-t-s wx-halo">temples over older villages</text><circle cx="421.2" cy="379.1" r="6" class="wx-c6 wx-edge wx-pop" style="--d:2"/><line x1="421.2" y1="379.1" x2="477.2" y2="349.1" class="wx-thin"/><text x="481.2" y="353.1" text-anchor="start" class="wx-t-b wx-halo">Ħal Saflieni Hypogeum</text><text x="481.2" y="367.1" text-anchor="start" class="wx-t-s wx-halo">burials c. 4000–2500 BCE</text><circle cx="426.9" cy="380.5" r="6" class="wx-c1 wx-edge wx-pop" style="--d:3"/><line x1="426.9" y1="380.5" x2="482.9" y2="382.5" class="wx-thin"/><text x="486.9" y="386.5" text-anchor="start" class="wx-t-b wx-halo">Tarxien</text><text x="486.9" y="400.5" text-anchor="start" class="wx-t-s wx-halo">c. 3150–2500 BCE</text><circle cx="345.7" cy="437.4" r="6" class="wx-c1 wx-edge wx-pop" style="--d:4"/><line x1="345.7" y1="437.4" x2="289.7" y2="439.4" class="wx-thin"/><text x="285.7" y="443.4" text-anchor="end" class="wx-t-b wx-halo">Ħaġar Qim and Mnajdra</text><text x="285.7" y="457.4" text-anchor="end" class="wx-t-s wx-halo">solar alignments</text><circle cx="442.7" cy="429.1" r="6" class="wx-c3 wx-edge wx-pop" style="--d:5"/><line x1="442.7" y1="429.1" x2="498.7" y2="431.1" class="wx-thin"/><text x="502.7" y="435.1" text-anchor="start" class="wx-t-b wx-halo">Għar Dalam</text><text x="502.7" y="449.1" text-anchor="start" class="wx-t-s wx-halo">cave: Ice Age animals, first farmers</text><circle cx="307.4" cy="402.7" r="6" class="wx-c5 wx-edge wx-pop" style="--d:6"/><line x1="307.4" y1="402.7" x2="251.4" y2="404.7" class="wx-thin"/><text x="247.4" y="408.7" text-anchor="end" class="wx-t-b wx-halo">Misraħ Għar il-Kbir</text><text x="247.4" y="422.7" text-anchor="end" class="wx-t-s wx-halo">cart ruts</text><circle cx="419.0" cy="288.9" r="7" class="wx-dash"/><circle cx="419.0" cy="288.9" r="2.5" class="wx-inkfill"/><line x1="426.0" y1="284.9" x2="477.0" y2="248.9" class="wx-thin"/><text x="481.0" y="248.9" class="wx-t-b wx-t-a wx-halo">Ġebel ġol-Baħar (claimed)</text><text x="481.0" y="262.9" class="wx-t-s wx-halo">boulders c. 19 m down, 1999;</text><text x="481.0" y="276.9" class="wx-t-s wx-halo">not accepted as a temple</text><g><line x1="640" y1="104" x2="640" y2="64" class="wx-line"/><polygon points="640,58 635,68 645,68" class="wx-inkfill"/><text x="640" y="120" text-anchor="middle" class="wx-t-b">N</text><text x="600" y="62" text-anchor="end" class="wx-t-s">Sicily c. 90 km north</text></g><g><rect x="40" y="480" width="31.2" height="5" class="wx-inkfill"/><rect x="71.2" y="480" width="31.2" height="5" class="wx-paper wx-edge"/><text x="40" y="500" class="wx-t-s">0</text><text x="102.5" y="500" text-anchor="middle" class="wx-t-s">5 km</text></g><text x="696" y="500" text-anchor="end" class="wx-t-s">Positions approximate.</text></svg></div></div><figcaption>The temples, the Hypogeum, Għar Dalam and the cart ruts on land, and the claimed underwater temple off St Julian&#x27;s. <span class="wx-src">Based on: Coastline simplified; site positions approximate from published coordinates. Ġebel ġol-Baħar depth after press reports of 1999.</span></figcaption><p class="vh">A simplified map of Malta, Gozo and Comino with a 5 kilometre scale bar and a north arrow noting Sicily about 90 kilometres to the north. Marked sites: Ġgantija on Gozo, about 3600 BCE; Ta&#x27; Ħaġrat and Skorba, temples over older villages; the Ħal Saflieni Hypogeum and Tarxien near the Grand Harbour; Ħaġar Qim and Mnajdra on the south coast; the cave of Għar Dalam in the south-east; and the Misraħ Għar il-Kbir cart ruts. Offshore of St Julian&#x27;s a dashed circle marks Ġebel ġol-Baħar, boulders about 19 metres down reported in 1999 and not accepted as a temple.</p></figure></section><section class="wsec" id="malta-temples-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Testing it</h3><p>The Ice Age reading runs into the temples themselves. Their floors, fills and foundations contain the pottery and bones of the known temple phases and the villages before them, never anything older, and they stand on top of those villages. Radiocarbon dates from many Maltese sites fall into the same order. An Ice Age temple would have to leave no trace of its age inside its own walls.</p><p>The underwater claims have fared no better. The &#x27;temple&#x27; of Ġebel ġol-Baħar, reported by divers off St Julian&#x27;s in 1999 at about 19 m depth, has not been accepted by Maltese archaeologists, some of whom suggested the boulders were dumped in modern times; no survey has published evidence of construction. The Għar Dalam teeth once claimed as Neanderthal have long been doubted by specialists, and no Palaeolithic tools have been securely identified on Malta. Maltese archaeologists criticised the series, and the Heritage Malta curator Katya Stroud said her own interview had been heavily edited and presented out of context.</p><aside class="wcall"><b>How do we know the temples&#x27; age?</b><p>Three methods agree. Stratigraphy: temples lie on top of earlier village layers. Pottery: each phase has its own styles, found in order. Radiocarbon: charcoal, bones and seeds from sealed layers give dates between about 3600 and 2500 BCE for temple building and use. Ancient DNA and burial studies add who the people were. The Sirius idea, by contrast, depends on which stars and which doorways are chosen.</p></aside></section><section class="wsec" id="malta-temples-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What the sea still hides</h3><p>Hancock is right about one thing that matters. At the end of the Ice Age the sea around Malta stood some 50–80 m lower, and the islands were far larger. The drowned shelf has barely been surveyed, and the 2025 Latnija finds show that seafarers reached these islands earlier than anyone expected. Older coastal sites may lie out there. For the cart ruts, see the Cart Ruts case; for the Hypogeum&#x27;s famous resonance, see Temples That Sing.</p><p>But evidence of Ice Age visitors, if it is ever found, would be a different thing from Ice Age temples. The temples are a Neolithic achievement, built by farmers whose villages lie beneath them, and a more remarkable story for it: a small island people who, without metal or wheels, raised some of the first great stone buildings on Earth.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">6,500 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Hunter-gatherers reach Malta by sea</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">5,500 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Farmers from Sicily settle</span></li><li class="wtl-use" style="--i:2"><span class="wtl-y">4,000 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Ħal Saflieni Hypogeum first used</span></li><li class="wtl-build" style="--i:3"><span class="wtl-y">3,600 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Ġgantija built</span></li><li class="wtl-loss" style="--i:4"><span class="wtl-y">2,500 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Temple period ends</span></li><li class="wtl-find" style="--i:5"><span class="wtl-y">1902 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Hypogeum found by builders</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">1973 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Renfrew: temples older than the pyramids</span></li><li class="wtl-event" style="--i:7"><span class="wtl-y">2002 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Hancock&#x27;s Underworld on Malta</span></li><li class="wtl-event" style="--i:8"><span class="wtl-y">2022 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Ancient Apocalypse, &#x27;Sirius Rising&#x27;</span></li><li class="wtl-find" style="--i:9"><span class="wtl-y">2025 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Latnija: hunter-gatherers 8,500 years ago</span></li></ol><details class="srcs"><summary>Sources for this case (13)</summary><ol><li>Scerri, E. M. L., Blinkhorn, J., Groucutt, H. S. et al. (2025). Hunter-gatherer sea voyages extended to remotest Mediterranean islands. Nature 641: 137–143. <a href="https://doi.org/10.1038/s41586-025-08780-y" target="_blank" rel="noopener">doi:10.1038/s41586-025-08780-y</a></li><li>Renfrew, C. (1973). Before Civilization: The Radiocarbon Revolution and Prehistoric Europe. Jonathan Cape, London.</li><li>Trump, D. H. (1966). Skorba. Reports of the Research Committee of the Society of Antiquaries of London 22. Oxford University Press.</li><li>Trump, D. H. (2002). Malta: Prehistory and Temples. Midsea Books, Malta.</li><li>Evans, J. D. (1971). The Prehistoric Antiquities of the Maltese Islands: A Survey. Athlone Press, London.</li><li>Malone, C., Grima, R., McLaughlin, R., Parkinson, E. W., Stoddart, S. &amp; Vella, N., eds (2020). Temple Places: Excavating Cultural Sustainability in Prehistoric Malta. McDonald Institute for Archaeological Research, Cambridge.</li><li>Ariano, B. et al. (2022). Ancient Maltese genomes and the genetic geography of Neolithic Europe. Current Biology 32(12).</li><li>UNESCO World Heritage Centre. Megalithic Temples of Malta (inscribed 1980, extended 1992); Ħal Saflieni Hypogeum (inscribed 1980).</li><li>Mifsud, A., Mifsud, S., Agius Sultana, C. &amp; Savona Ventura, C. (2001). Malta: Echoes of Plato&#x27;s Island. Prehistoric Society of Malta.</li><li>Hancock, G. (2002). Underworld: Flooded Kingdoms of the Ice Age. Michael Joseph, London; and the Channel 4 series, episode &#x27;Malta and Bimini&#x27;.</li><li>Ancient Apocalypse (2022). Season 1, episode 3, &#x27;Sirius Rising&#x27;. Netflix.</li><li>The Malta Independent (20 November 2022). Netflix series suggests possibility that megalithic temples in Malta are far older.</li><li>Fairbanks, R. G. (1989). A 17,000-year glacio-eustatic sea level record. Nature 342: 637–642. <a href="https://doi.org/10.1038/342637a0" target="_blank" rel="noopener">doi:10.1038/342637a0</a></li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-malta-temples" data-t="Malta&#x27;s Temples: Older Than the Pyramids, but Ice Age?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Malta&#x27;s Temples: Older Than the Pyramids, but Ice Age?</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-malta-temples</span> (updated 26 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-lost-civilization-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Göbekli Tepe, Urfa.jpg" data-cap="The enclosures of Göbekli Tepe" data-big><figcaption></figcaption></figure><div class="sh-k">Lost Ice Age World</div><h2 class="sh-t" id="case-lost-civilization-st" tabindex="-1">Was There a Lost Ice Age Civilisation?</h2><p class="sh-s">Graham Hancock says an advanced civilisation was wiped out at the end of the Ice Age. Archaeologists say it should have left traces. Who reads the evidence better?</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> An advanced civilisation, with knowledge beyond any known Ice Age culture, existed before 12,900 years ago and was destroyed by the Younger Dryas catastrophe.</p></div><p class="v4-q">Did an advanced civilisation flourish in the Ice Age, then vanish almost without trace?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>The idea: an advanced civilisation flourished before 12,900 years ago and was wiped out at the Younger Dryas.</li><li>Its ingredients are real: drowned coasts, an abrupt climate upheaval, capable Ice Age people, early monuments.</li><li>But no domesticated crops, mines, unknown tools or pottery have turned up, and ancient DNA shows no sudden newcomers.</li><li>Some of those traces could drown; genetic ones could not.</li><li>Its key supports, the comet and Gunung Padang, have not survived testing; the claim is still waiting for its evidence.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Biology</span><span class="thr">Geology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="12900" >12,900</b><span class="ctr-u"> years ago</span></div><div class="ctr-l">onset of the Younger Dryas, Hancock&#x27;s proposed catastrophe</div><div class="ctr-c">Greenland ice cores</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="120" >120</b><span class="ctr-u"> m</span></div><div class="ctr-l">fall in sea level at the Last Glacial Maximum</div><div class="ctr-c">Lambeck et al. 2014</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="11500" >11,500</b><span class="ctr-u"> years ago</span></div><div class="ctr-l">Göbekli Tepe&#x27;s first monumental enclosures</div><div class="ctr-c">Schmidt 2010</div></div><div class="ctr"><div class="ctr-v">#<b class="ctr-n" data-v="2136" >2,136</b><span class="ctr-u"> </span></div><div class="ctr-l">Joe Rogan Experience episode of the Hancock and Dibble debate, April 2024</div><div class="ctr-c">JRE, 16 April 2024</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>An advanced civilisation, with knowledge beyond any known Ice Age culture, existed before 12,900 years ago and was destroyed by the Younger Dryas catastrophe.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Every ingredient Hancock uses is real: drowned coasts, an abrupt climate upheaval, sophisticated foragers, early monuments. But the civilisation itself has left no physical trace: no domesticated crops or animals, no inland quarries or mines, no tools or pottery of an unknown culture, no sudden newcomers in ancient DNA. Some of those traces could drown; genetic ones could not. The key supporting claims, the Younger Dryas impact and Gunung Padang&#x27;s great age, have not survived testing. This does not rule the idea out forever, but the claim is still waiting for its evidence.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks confidently present civilisation as starting with farming and cities about 11,000–5,500 years ago, preceded by simple foragers. The first half holds up well: no Ice Age civilisation has been found. The second half has been too dismissive: Göbekli Tepe, mammoth-bone architecture and early seafaring show Ice Age societies were more capable than the old ladder of progress allowed.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Ice Age people were fully modern and highly capable: they painted caves, built mammoth-bone houses, made ceramic figurines and crossed open sea to reach Australia more than 50,000 years ago.<small>Clarkson et al. 2017; standard Palaeolithic record</small></li><li>Sea level stood about 120 m lower until about 20,000 years ago, and rising seas drowned vast coastal plains between about 16,000 and 7,000 years ago.<small>Lambeck et al. 2014</small></li><li>The Younger Dryas, c. 12,900–11,700 years ago, was an abrupt global climate upheaval, with a near-glacial cold snap and a sudden warming at its end.<small>Greenland ice cores; Walker et al. 2009</small></li><li>Göbekli Tepe&#x27;s monumental carved enclosures were begun about 11,500 years ago by people who were still largely hunter-gatherers.<small>Schmidt 2010; DAI Göbekli Tepe project</small></li><li>Genetic and archaeological evidence places the domestication of the major crops after about 11,500 years ago, with fully domesticated cereals from about 10,500 years ago.<small>Larson et al. 2014, PNAS</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the drowned shelves could hide the remains of a civilisation more advanced than any known Ice Age culture.</li><li>Whether myths of civilising heroes (Oannes, Quetzalcoatl, Viracocha) preserve memories of real teachers or are universal storytelling patterns.</li><li>Whether a cosmic impact caused the Younger Dryas, the catastrophe Hancock proposes destroyed the civilisation.</li><li>How complex Ice Age societies really were: archaeologists increasingly credit foragers with monuments, long-distance trade and astronomy.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Almost all Ice Age coastlines, now 20–120 m underwater and barely surveyed.</li><li>Organic materials (wood, textiles, rope, food) from before about 12,000 years ago, which rarely survive anywhere.</li><li>Large regions that are little excavated, including parts of the Sahara, the Amazon and South and Southeast Asia.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Archaeologists argue that a civilisation big enough to build cities, sail oceans and teach the world would leave a heavy footprint that no flood could erase: domesticated crops and animals whose genes we would still see, quarries and mines on dry land, tools and pottery scattered across continents, and pollution in ice cores. Flint Dibble put this case to Hancock on the Joe Rogan Experience in April 2024. Tens of thousands of Late Pleistocene sites show capable foragers, and nothing more advanced. The Society for American Archaeology asked Netflix in 2022 to reclassify Ancient Apocalypse as science fiction.</p><ul><li>The wild ancestors of wheat, barley, rice and maize were still wild until the Holocene; domestication leaves a genetic signature that would outlive any civilisation.</li><li>Survivors who taught hunter-gatherers would have passed on their tools, crops and techniques; none appear before the known Neolithic.</li><li>Inland land surfaces of the Ice Age are well sampled and show no trace of an advanced culture.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Graham Hancock argues that an advanced civilisation, rich in astronomical, navigational and architectural knowledge, flourished during the last Ice Age and was destroyed by the global cataclysm of the Younger Dryas around 12,800 years ago, which he links to a comet impact and the drowning of the coasts. Survivors, the &#x27;magicians of the gods&#x27;, carried their knowledge to hunter-gatherers, which is why he thinks Göbekli Tepe appears so suddenly at the end of the Younger Dryas, and why myths worldwide tell of bearded teachers arriving after a flood. He stresses that he proposes a lost civilisation, not a high-tech one.</p><ul><li>The drowned coastal plains, where the richest Ice Age societies probably lived, have barely been searched.</li><li>Mainstream archaeology has repeatedly been wrong about the depth of the human past: Göbekli Tepe, pre-Clovis Americans, early seafaring.</li><li>Myths of civilising heroes after a flood recur from Mesopotamia to the Andes.</li></ul><div class="face-s"><b>Its strongest point</b><p>Absence of evidence on the drowned shelves is weak evidence, because almost nobody has looked there; and archaeology&#x27;s picture of &#x27;simple&#x27; Ice Age foragers has had to be revised upward again and again.</p></div><p class="face-cr"><b>Credit</b> Graham Hancock (Fingerprints of the Gods 1995; Magicians of the Gods 2015; America Before 2019; Ancient Apocalypse, Netflix 2022 and 2024); Randall Carlson; Danny Hilman Natawidjaja</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>A drowned or buried site older than 12,900 years with architecture, metallurgy or writing beyond any known Ice Age culture.</li><li>Domesticated plants or animals, with the genetic signature of domestication, dated before 12,900 years ago.</li><li>Ancient DNA from a population that shows up suddenly among Early Holocene foragers, consistent with a group of &#x27;teachers&#x27;.</li><li>An independently confirmed Younger Dryas impact, which would supply the catastrophe the theory requires.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">7 min read · 1,432 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Was There a Lost Ice Age Civilisation?"><button type="button" class="wtoc-i" data-go="lost-civilization-s1">The most seductive idea in prehistory</button><button type="button" class="wtoc-i" data-go="lost-civilization-s2">The teachers from the sea</button><button type="button" class="wtoc-i" data-go="lost-civilization-s3">What is solid about the Ice Age world</button><button type="button" class="wtoc-i" data-go="lost-civilization-s4">Hancock&#x27;s strongest card: the drowned coasts</button><button type="button" class="wtoc-i" data-go="lost-civilization-s5">The Rogan debate: what should survive?</button><button type="button" class="wtoc-i" data-go="lost-civilization-s6">What time could erase, and what it could not</button><button type="button" class="wtoc-i" data-go="lost-civilization-s7">An honest weighing</button></nav></div><section class="wsec" id="lost-civilization-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The most seductive idea in prehistory</h3><p>Imagine that everything we were taught about the beginning of civilisation is missing its first chapter. That before Sumer and Egypt, before the first farmers, there was a people who mapped the stars, sailed the oceans and raised great monuments, until a catastrophe at the end of the Ice Age drowned their coasts and scattered their survivors. This is Graham Hancock&#x27;s thesis, set out in Fingerprints of the Gods (1995), refined in Magicians of the Gods (2015) and America Before (2019), and seen by millions in Netflix&#x27;s Ancient Apocalypse (2022 and 2024).</p><p>It deserves a fair hearing, because it is built from real pieces. The last Ice Age did end in upheaval. The sea did rise about 120 metres. Monumental building did begin earlier than anyone expected. The question is not whether these things happened. It is whether they add up to a lost civilisation.</p><blockquote class="wpull"><p>Every ingredient of Hancock&#x27;s story is real. The disputed part is the civilisation itself.</p></blockquote></section><section class="wsec" id="lost-civilization-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The teachers from the sea</h3><p>Hancock&#x27;s case begins with myth. Many peoples remember a culture hero who arrived after a catastrophe and taught the arts of civilisation. The Babylonian priest Berossus, writing about 280 BCE, described Oannes, a fish-bodied being who emerged from the sea.</p><blockquote class="quote"><p>He taught them to construct cities, to found temples, to compile laws, and explained to them the principles of geometrical knowledge.</p><cite>Berossus, Babyloniaca, fragment preserved via Alexander Polyhistor and Syncellus, trans. I. P. Cory, Ancient Fragments (1832)</cite></blockquote><p>In the Andes, Spanish chroniclers of the 16th century recorded stories of Viracocha, who rose from Lake Titicaca after a flood and walked the land teaching. In Mesoamerica, Quetzalcoatl, the feathered serpent, was remembered as a bringer of learning who departed over the sea. For Hancock these are echoes of real survivors. Scholars answer that culture heroes are one of humanity&#x27;s most universal story types, that these accounts were written down thousands of years after the proposed events, and that details such as Quetzalcoatl&#x27;s pale beard appear mostly in sources written after the Spanish conquest. The myths are real witnesses to human imagination and memory; what they remember is the open question.</p></section><section class="wsec" id="lost-civilization-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>What is solid about the Ice Age world</h3><p>The people of 20,000 years ago were us: same brains, same hands. They painted Lascaux and Chauvet, built houses from mammoth bones on the Ukrainian plains, fired clay figurines at Dolní Věstonice more than 25,000 years ago, and had crossed open sea to reach Australia by at least 50,000 years ago. They tracked the Moon and the seasons. Then, around 11,500 years ago, just after the Younger Dryas ended, people who still hunted gazelle and gathered wild cereals began carving the great T-shaped pillars of Göbekli Tepe in south-east Türkiye.</p><figure class="wx wx--static" id="lost-civilization-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">The window a lost civilisation would have to fit</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The window a lost civilisation would have to fit"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 392" class="wx-svg" role="img" aria-labelledby="lost-civilization-f2-t"><title id="lost-civilization-f2-t">Timeline from 16,000 to 4,000 years ago with sea level, the Younger Dryas, Plato's date, Göbekli Tepe, first domesticated crops, first towns, first cities and the Great Pyramid</title><text class="wx-t-cap" x="24" y="28">The window a lost civilisation would have to fit · 16,000 to 4,000 years ago</text><rect class="wx-ice wx-o80" x="207.9" y="50" width="65" height="156"/><text class="wx-t-s" x="240.4" y="176" text-anchor="middle">Younger</text><text class="wx-t-s" x="240.4" y="189" text-anchor="middle">Dryas</text><path class="wx-guide" d="M40,58H690"/><text class="wx-t-s" x="690" y="52" text-anchor="end">sea level today</text><path class="wx-bold wx-s2 wx-draw" pathLength="1" d="M40,134C48.5,133.3 99.4,130.5 110.4,128.5C121.5,126.6 121,120 132.1,117.7C143.1,115.4 187.6,111.3 202.5,109.5C217.4,107.8 246.9,104.2 256.7,102.8C266.4,101.3 277.2,98.6 283.8,97.3C290.2,96 301.1,93.5 310.8,91.9C320.6,90.3 352,85.7 365,83.8C378,81.8 406.2,77.7 419.2,75.6C432.2,73.6 460.3,68.5 473.3,66.8C486.3,65.1 514.5,62.2 527.5,61.4C540.5,60.5 562.2,60 581.7,59.7C601.2,59.4 677,58.8 690,58.7"/><text class="wx-t-s wx-halo" x="45.4" y="106">sea c. −110 m</text><path class="wx-bold" d="M40,206H690"/><path class="wx-thin" d="M40,206v6"/><text class="wx-t-s" x="40" y="226" text-anchor="middle">16k</text><path class="wx-thin" d="M148.3,206v6"/><text class="wx-t-s" x="148.3" y="226" text-anchor="middle">14k</text><path class="wx-thin" d="M256.7,206v6"/><text class="wx-t-s" x="256.7" y="226" text-anchor="middle">12k</text><path class="wx-thin" d="M365,206v6"/><text class="wx-t-s" x="365" y="226" text-anchor="middle">10k</text><path class="wx-thin" d="M473.3,206v6"/><text class="wx-t-s" x="473.3" y="226" text-anchor="middle">8k</text><path class="wx-thin" d="M581.7,206v6"/><text class="wx-t-s" x="581.7" y="226" text-anchor="middle">6k</text><path class="wx-thin" d="M690,206v6"/><text class="wx-t-s" x="690" y="226" text-anchor="middle">4k</text><text class="wx-t-m" x="690" y="242" text-anchor="end">years ago</text><rect class="wx-card wx-edge-soft" x="40" y="148" width="163.9" height="48" rx="4" stroke-dasharray="4 3"/><text class="wx-t-s" x="46" y="164">Hancock's proposed</text><text class="wx-t-s" x="46" y="177">lost civilisation</text><text class="wx-t-s" x="46" y="190">(no remains found)</text><path class="wx-hl" d="M278.3,206V148"/><circle class="wx-accfill" cx="278.3" cy="206" r="5"/><text class="wx-t-b wx-t-a wx-halo" x="283.3" y="136">Plato’s date for Atlantis</text><text class="wx-t-s wx-halo" x="283.3" y="150">c. 11,600 yrs</text><g class="wx-pop" style="--d:2"><path class="wx-thin" d="M283.8,206V250"/><circle class="wx-inkfill" cx="283.8" cy="206" r="4.5"/><text class="wx-t-b wx-halo" x="288.8" y="262" text-anchor="start">Göbekli Tepe begun</text><text class="wx-t-s wx-halo" x="288.8" y="276" text-anchor="start">c. 11,500 yrs</text></g><g class="wx-pop" style="--d:3"><path class="wx-thin" d="M337.9,206V298"/><circle class="wx-inkfill" cx="337.9" cy="206" r="4.5"/><text class="wx-t-b wx-halo" x="342.9" y="310" text-anchor="start">first domesticated crops</text><text class="wx-t-s wx-halo" x="342.9" y="324" text-anchor="start">c. 11,000–10,000 yrs</text></g><g class="wx-pop" style="--d:4"><path class="wx-thin" d="M413.7,206V346"/><circle class="wx-inkfill" cx="413.7" cy="206" r="4.5"/><text class="wx-t-b wx-halo" x="418.7" y="358" text-anchor="start">Çatalhöyük town</text><text class="wx-t-s wx-halo" x="418.7" y="372" text-anchor="start">c. 9,100 yrs</text></g><g class="wx-pop" style="--d:5"><path class="wx-thin" d="M608.8,206V250"/><circle class="wx-inkfill" cx="608.8" cy="206" r="4.5"/><text class="wx-t-b wx-halo" x="603.8" y="262" text-anchor="end">first cities (Uruk)</text><text class="wx-t-s wx-halo" x="603.8" y="276" text-anchor="end">c. 5,500 yrs</text></g><g class="wx-pop" style="--d:6"><path class="wx-thin" d="M659.7,206V298"/><circle class="wx-inkfill" cx="659.7" cy="206" r="4.5"/><text class="wx-t-b wx-halo" x="654.7" y="310" text-anchor="end">Great Pyramid</text><text class="wx-t-s wx-halo" x="654.7" y="324" text-anchor="end">c. 4,560 yrs</text></g></svg></div></div><figcaption>From 16,000 to 4,000 years ago: sea level, the Younger Dryas, Plato&#x27;s date, and the known firsts of the Neolithic and early civilisation. <span class="wx-src">Based on: Lambeck et al. 2014 (sea level, simplified); Walker et al. 2009; Schmidt 2010; Larson et al. 2014; Çatalhöyük and Uruk dates from standard syntheses; Plato, Timaeus 23e.</span></figcaption><p class="vh">A timeline from 16,000 to 4,000 years ago. At the top a line shows sea level rising from about minus 110 metres to today&#x27;s level by about 7,000 years ago. A pale band marks the Younger Dryas from 12,900 to 11,700 years ago. A dashed box before 12,900 years ago marks Hancock&#x27;s proposed lost civilisation, with no remains found. An orange marker shows Plato&#x27;s date for Atlantis at about 11,600 years ago. Below the axis, markers show Göbekli Tepe begun about 11,500 years ago, first domesticated crops about 11,000 to 10,000 years ago, the town of Çatalhöyük about 9,100 years ago, the first cities at Uruk about 5,500 years ago, and the Great Pyramid about 4,560 years ago.</p></figure><p>Göbekli Tepe genuinely shocked archaeology. It showed that monuments came before farming, not after, and it overturned the tidy ladder of hunters, then farmers, then temples. Hancock reads its sudden sophistication as a sign of inherited knowledge. Most archaeologists read it as what capable foragers could achieve once climate stabilised and they gathered in large numbers.</p></section><section class="wsec" id="lost-civilization-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Hancock&#x27;s strongest card: the drowned coasts</h3><p>The most serious part of the case is geographical. Ice Age people, like people today, probably favoured coasts, deltas and river mouths, rich in fish, shellfish and fresh water. Those landscapes now lie tens of metres underwater. The world&#x27;s continental shelves cover roughly 30 million square kilometres, and much of that, outside the ice sheets, was dry land at the glacial maximum. Only a tiny fraction has been examined by archaeologists.</p><p>Hancock argues that the evidence for his civilisation, if it exists, would be precisely where nobody has looked. On this point he is on firm ground. Recent finds, such as the 971-metre Blinkerwall hunting structure under the Baltic and Homo erectus fossils dredged from drowned Sundaland, show that the seabed hides real surprises. Our Drowned Coasts case explores this in depth.</p><p>There is a limit, though, to what the drowned-coast argument can do. Coastal people did not live in isolation. They traded shells, stone and ideas inland, as the shell beads found hundreds of kilometres from the sea in Ice Age Europe show. A culture far more advanced than its neighbours should have left some echo on the land that stayed dry, even if its heartland drowned.</p></section><section class="wsec" id="lost-civilization-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The Rogan debate: what should survive?</h3><p>In April 2024 the archaeologist Flint Dibble, of Cardiff University, debated Hancock for more than four hours on the Joe Rogan Experience (episode 2136). Dibble chose not to argue about individual sites. Instead he asked what any advanced society leaves behind, drowned or not, and whether we find it.</p><figure class="wx wx--steps" id="lost-civilization-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">What would a lost civilisation leave behind?</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="What would a lost civilisation leave behind?"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 486" class="wx-svg" role="img" aria-labelledby="lost-civilization-f1-t"><title id="lost-civilization-f1-t">Schematic landscape section showing what Ice Age foragers left, what an advanced civilisation would add, what rising seas would hide, and which traces should survive even so</title><defs><marker id="lost-civilization-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker><marker id="lost-civilization-f1-ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text class="wx-t-cap" x="24" y="26">What would a lost Ice Age civilisation leave behind? · schematic, vertical scale exaggerated</text><rect class="wx-sky" x="16" y="40" width="688" height="390" rx="6"/><path class="wx-water" d="M586,330H704V430H586Z"/><path class="wx-soil wx-edge" d="M16,128C22.2,125.8 46.8,116.5 60,112C73.2,107.5 97.4,97.1 110,96C122.6,94.9 137.4,97.6 150,104C162.6,110.4 186,133 200,142C214,151 236,160.4 250,168C264,175.6 284.6,188.4 300,196C315.4,203.6 341.8,214.4 360,222C378.2,229.6 410.4,241.6 430,250C449.6,258.4 482.4,272.5 500,282C517.6,291.5 543.4,310.7 556,318C568.6,325.3 581,326.4 590,334C599,341.6 610.2,362.2 620,372C629.8,381.8 648.2,398.1 660,404C671.8,409.9 697.8,412.6 704,414L704,430L16,430Z"/><path class="wx-thin" d="M16,430H704"/><path class="wx-dash" d="M300,214H704"/><text class="wx-t-s wx-halo" x="700" y="228" text-anchor="end">today's sea level</text><path class="wx-line wx-s2" d="M586,330H704"/><text class="wx-t-s wx-halo" x="700" y="422" text-anchor="end">sea c. 20,000 years ago: −120 m</text><text class="wx-t-cap" x="40" y="200">INLAND</text><text class="wx-t-cap wx-halo" x="420" y="236">COASTAL PLAIN</text><g class="wx-st" data-s="1"><path class="wx-inkfill wx-o80" d="M92,121 q10,-18 22,-2 v10 h-22 z"/><path class="wx-paper wx-edge-soft" d="M180,136 q16,-26 32,0 z"/><path class="wx-thin" d="M184,135 q12,-20 24,0 M188,135 q8,-14 16,0"/><circle class="wx-fire" cx="236" cy="160" r="4"/><path class="wx-stone3 wx-edge" d="M262,172 l6,-8 l6,8 z"/><text class="wx-t-b wx-
