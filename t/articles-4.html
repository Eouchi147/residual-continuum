the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-other-humans-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Homo floresiensis skull 45.JPG" data-cap="Skull of Homo floresiensis, the &#x27;hobbit&#x27; of Flores" data-big><figcaption></figcaption></figure><div class="sh-k">Mysteries of the Earth</div><h2 class="sh-t" id="case-other-humans-st" tabindex="-1">The Other Humans: We Were Never Alone</h2><p class="sh-s">A pinky bone, a skull hidden in a well and a jaw from a fishing net reveal a planet crowded with other kinds of people.</p><div class="sh-v"><span class="vstamp vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><p class="sh-claim"><b>What the stamp rates:</b> Within roughly the last 60,000 years, Homo sapiens shared the planet with at least four other human groups.</p></div><p class="v4-q">How many kinds of humans shared the Earth with our ancestors, and until when?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Sixty thousand years ago there were at least five kinds of human on Earth.</li><li>Neanderthals lived in Europe until about 40,000 years ago, and their DNA is still in most people outside Africa.</li><li>Denisovans, known first from a finger bone, left their DNA in people from Tibet to Papua.</li><li>On Flores lived people about 1.1 metres tall; on Luzon another small kind.</li><li>For the last two the dates sit close to the line, which keeps this strong rather than established.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Biology</span><span class="thr">Archaeology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">at least <b class="ctr-n" data-v="4" >4</b><span class="ctr-u"> other groups</span></div><div class="ctr-l">alive within the last 60,000 years</div><div class="ctr-c">Higham 2014; Sutikna 2016; Détroit 2019</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="1.1" data-dec="1">1.1</b><span class="ctr-u"> m</span></div><div class="ctr-l">height of Homo floresiensis</div><div class="ctr-c">Brown et al. 2004</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="1420" >1,420</b><span class="ctr-u"> cm³</span></div><div class="ctr-l">brain volume of the Harbin skull</div><div class="ctr-c">Ji et al. 2021</div></div><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="1550" >1,550</b><span class="ctr-u"> fossil pieces</span></div><div class="ctr-l">of Homo naledi from Rising Star</div><div class="ctr-c">Dirks et al. 2017</div></div><div class="ctr"><div class="ctr-v">up to <b class="ctr-n" data-v="6" >6</b><span class="ctr-u"> %</span></div><div class="ctr-l">Denisovan DNA in some Papuans</div><div class="ctr-c">Reich et al. 2010</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Within roughly the last 60,000 years, Homo sapiens shared the planet with at least four other human groups.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">For Neanderthals and Denisovans the case rests on fossils plus DNA that entered our own genomes after about 60,000 years ago, which is very hard to dispute. For Homo floresiensis, skeletons reach about 60,000 years and tools about 50,000. For Homo luzonensis, the dates are minimum ages of about 50,000 and 67,000 years. Those last two sit close to the line, which is why the rating is strong rather than established.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">University textbooks now teach a crowded, interbreeding human past, and they are right to. But many school books and museum murals still show a single march from ape to human, and they rarely mention that several groups were found only in the last twenty years. On diversity, popular accounts are still overconfident in a simple story.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>DNA from a finger bone found in Denisova Cave in 2008 revealed a previously unknown human group, the Denisovans, whose genome was published in 2010.<small>Krause et al. 2010; Reich et al. 2010</small></li><li>Neanderthals survived in Europe until about 40,000 years ago, and people outside Africa today carry a small share of Neanderthal DNA.<small>Higham et al. 2014; Green et al. 2010</small></li><li>Homo floresiensis, about 1.1 m tall, lived on Flores; its skeletons date to about 100,000–60,000 years ago and its tools to about 50,000.<small>Brown et al. 2004; Sutikna et al. 2016</small></li><li>Homo luzonensis, described in 2019 from Callao Cave in the Philippines, has minimum ages of about 50,000 and 67,000 years.<small>Détroit et al. 2019</small></li><li>In 2025, ancient proteins identified a jaw from the Taiwan Strait and the near-complete Harbin skull as Denisovan.<small>Tsutaya et al. 2025; Fu et al. 2025</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether small-brained Homo naledi deliberately buried its dead and engraved cave walls, about 300,000–240,000 years ago.</li><li>Whether the Harbin skull should be called Homo longi, a species of its own, or simply the Denisovans with a face.</li><li>When the last Denisovans, hobbits and Luzon people died out, and whether they met modern humans.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Tropical heat and acid soils destroy bone and DNA, so the islands of South-East Asia, where several groups lived, preserve very little.</li><li>The Sunda and Sahul shelves, dry land during the Ice Age, now lie under the sea.</li><li>Key fossils such as the Harbin skull and Penghu jaw lack a recorded findspot, which makes dating them hard.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Palaeoanthropologists now describe human evolution as a braided stream, not a ladder. Homo sapiens arose in Africa by about 300,000 years ago, spread widely after about 60,000 years ago, and met Neanderthals and Denisovans, interbreeding with both. On the islands of South-East Asia, small-bodied humans with deep roots survived in isolation. All the others disappeared by about 40,000 years ago or somewhat later; why is debated, with climate, competition and absorption all playing parts.</p><ul><li>Ancient DNA shows repeated interbreeding between groups.</li><li>Proteins survive longer than DNA and can identify fossils too old or too warm for genomes.</li><li>Island dwarfing explains the small bodies of Flores and Luzon.</li><li>Most living people carry traces of at least one archaic group.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Three challenges push the story further. Berger and Hawks argue that Homo naledi, with a brain a third the size of ours, carried its dead into a deep cave, buried them and scratched patterns on the walls. Ji Qiang and Ni Xijun named the Harbin skull Homo longi, &#x27;Dragon Man&#x27;, and argue it belongs to a lineage closer to us than Neanderthals are. The anthropologist Gregory Forth argues that Lio stories on Flores of small hairy wild people may preserve memories of Homo floresiensis, or even a surviving population.</p><ul><li>If naledi buried its dead, symbolic behaviour did not need a big brain.</li><li>The Harbin skull&#x27;s size and shape set it apart from both Neanderthals and us.</li><li>Oral traditions on Flores describe small hairy people in detail.</li><li>Each new tool (DNA, proteins, new dating) has so far added groups, never removed them.</li></ul><div class="face-s"><b>Its strongest point</b><p>Every time a new technique has been applied, from ancient DNA in 2010 to ancient proteins in 2019 and 2025, the family tree has gained members. The old single-line story underestimated human diversity by a wide margin.</p></div><p class="face-cr"><b>Credit</b> Lee Berger and John Hawks (Homo naledi); Ji Qiang and Ni Xijun (Homo longi); Gregory Forth (hobbit survival)</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Nuclear DNA from the Harbin skull or the Penghu jaw, to place Denisovans precisely on the family tree.</li><li>Direct dates on the Homo naledi bones inside the proposed burial features, with independent sediment studies of how they formed.</li><li>New excavations in South-East Asian caves and island sites for fossils younger than 50,000 years.</li><li>Sediment DNA surveys across Wallacea to test when floresiensis and luzonensis vanished.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,188 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Other Humans: We Were Never Alone"><button type="button" class="wtoc-i" data-go="other-humans-s1">A finger bone with a secret</button><button type="button" class="wtoc-i" data-go="other-humans-s2">A crowded planet</button><button type="button" class="wtoc-i" data-go="other-humans-s3">New tools, new faces</button><button type="button" class="wtoc-i" data-go="other-humans-s4">The mainstream story, rewritten</button><button type="button" class="wtoc-i" data-go="other-humans-s5">The challengers&#x27; case</button><button type="button" class="wtoc-i" data-go="other-humans-s6">What time has erased</button><button type="button" class="wtoc-i" data-go="other-humans-s7">What would settle it</button></nav></div><section class="wsec" id="other-humans-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A finger bone with a secret</h3><p>In 2008, digging in Denisova Cave in the Altai Mountains of Siberia, Russian archaeologists found a scrap of bone smaller than a fingernail: the tip of a child&#x27;s little finger. It looked like nothing. Then geneticists at the Max Planck Institute in Leipzig extracted its DNA, expecting a Neanderthal or a modern human, and found neither.</p><p>The girl belonged to a group of people no one had ever seen, known from no skull, no skeleton and no tool that could be tied to them. They were named after the cave: the Denisovans. When their genome was published in 2010 it revealed something even stranger. Their DNA is still walking around. People in New Guinea carry about 4–6 percent of it, and many Tibetans owe their tolerance of thin air to a gene variant they inherited from these vanished people.</p><blockquote class="wpull"><p>For a decade, a whole branch of humanity was known mainly as a genome in search of a face.</p></blockquote><p>We were taught a simple picture: a single line of ancestors climbing from ape to human, with us at the top, alone. The last twenty years have replaced that picture with something far stranger.</p></section><section class="wsec" id="other-humans-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>A crowded planet</h3><p>Set the clock to 60,000 years ago, when our own species was beginning to spread out of Africa in numbers. Neanderthals still lived across Europe and western Asia, and they would last until about 40,000 years ago. Denisovans lived somewhere across Asia, from Siberia to the tropics. On the island of Flores in Indonesia lived Homo floresiensis, the &#x27;hobbit&#x27;, about 1.1 metres tall with a brain about a third the size of ours, found in Liang Bua cave in 2003. To the north, on Luzon in the Philippines, lived Homo luzonensis, known from a handful of teeth and small bones in Callao Cave and described in 2019.</p><figure class="wx wx--static" id="other-humans-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">Who was here when</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Who was here when"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" class="wx-svg" role="img" aria-labelledby="other-humans-f1-t"><title id="other-humans-f1-t">Time ranges of Homo sapiens and five other human groups over the last 350,000 years</title><defs><marker id="other-humans-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text x="24" y="28" class="wx-t-cap">Who was here when · dated fossils and tools, thousands of years ago</text><line x1="690.0" y1="60" x2="690.0" y2="460" class="wx-guide"/><text x="690.0" y="480" text-anchor="middle" class="wx-t-s">0</text><line x1="620.0" y1="60" x2="620.0" y2="460" class="wx-guide"/><text x="620.0" y="480" text-anchor="middle" class="wx-t-s">50</text><line x1="550.0" y1="60" x2="550.0" y2="460" class="wx-guide"/><text x="550.0" y="480" text-anchor="middle" class="wx-t-s">100</text><line x1="480.0" y1="60" x2="480.0" y2="460" class="wx-guide"/><text x="480.0" y="480" text-anchor="middle" class="wx-t-s">150</text><line x1="410.0" y1="60" x2="410.0" y2="460" class="wx-guide"/><text x="410.0" y="480" text-anchor="middle" class="wx-t-s">200</text><line x1="340.0" y1="60" x2="340.0" y2="460" class="wx-guide"/><text x="340.0" y="480" text-anchor="middle" class="wx-t-s">250</text><line x1="270.0" y1="60" x2="270.0" y2="460" class="wx-guide"/><text x="270.0" y="480" text-anchor="middle" class="wx-t-s">300</text><line x1="200.0" y1="60" x2="200.0" y2="460" class="wx-guide"/><text x="200.0" y="480" text-anchor="middle" class="wx-t-s">350</text><line x1="200" y1="460" x2="690" y2="460" class="wx-line"/><text x="445" y="502" text-anchor="middle" class="wx-t-m">thousand years ago (today at the right)</text><text x="24" y="98" class="wx-t-b">Homo sapiens</text><text x="24" y="113" class="wx-t-s">us: Africa, then the world</text><text x="24" y="158" class="wx-t-b">Neanderthals</text><text x="24" y="173" class="wx-t-s">western Eurasia</text><text x="24" y="218" class="wx-t-b">Denisovans</text><text x="24" y="233" class="wx-t-s">Siberia to Taiwan</text><text x="24" y="298" class="wx-t-b">Homo floresiensis</text><text x="24" y="313" class="wx-t-s">Flores, Indonesia</text><text x="24" y="358" class="wx-t-b">Homo luzonensis</text><text x="24" y="373" class="wx-t-s">Luzon, Philippines</text><text x="24" y="418" class="wx-t-b">Homo naledi</text><text x="24" y="433" class="wx-t-s">South Africa</text><rect x="270.0" y="93.0" width="420.0" height="14" rx="4" class="wx-c2 wx-growx" style="--d:1"/><rect x="200.0" y="153.0" width="434.0" height="14" rx="4" class="wx-c1 wx-growx" style="--d:2"/><line x1="206" y1="160" x2="196" y2="160" class="wx-line" marker-end="url(#other-humans-f1-ah)"/><text x="640.0" y="146" class="wx-t-s">c. 40,000</text><rect x="410.0" y="213.0" width="210.0" height="14" rx="4" class="wx-c5 wx-growx" style="--d:3"/><circle cx="466.0" cy="220" r="5" class="wx-card wx-edge wx-pop" style="--d:6"/><circle cx="485.6" cy="220" r="5" class="wx-card wx-edge wx-pop" style="--d:6"/><rect x="424.0" y="241" width="84.0" height="10" rx="4" class="wx-dash wx-pop" style="--d:7"/><rect x="592.0" y="241" width="84.0" height="10" rx="4" class="wx-dash wx-pop" style="--d:7"/><text x="418.0" y="250" text-anchor="end" class="wx-t-s">Penghu jaw: two possible ranges</text><text x="404.0" y="224" text-anchor="end" class="wx-t-s">dots: Xiahe 160+, Harbin 146+</text><rect x="424.0" y="295" width="196.0" height="10" rx="4" class="wx-dash wx-pop" style="--d:4"/><rect x="550.0" y="293.0" width="56.0" height="14" rx="4" class="wx-c3 wx-growx" style="--d:5"/><text x="424.0" y="286" class="wx-t-s">stone tools (dashed)</text><text x="546.0" y="322" text-anchor="end" class="wx-t-s">skeletons</text><line x1="206" y1="300" x2="196" y2="300" class="wx-line" marker-end="url(#other-humans-f1-ah)"/><text x="206" y="322" class="wx-t-s">ancestors on Flores by 700 (off chart)</text><circle cx="596.2" cy="360" r="5" class="wx-c4 wx-pop" style="--d:6"/><circle cx="620.0" cy="360" r="5" class="wx-c4 wx-pop" style="--d:6"/><line x1="589.2" y1="360" x2="536.0" y2="360" class="wx-dash" marker-end="url(#other-humans-f1-ah)"/><text x="530.0" y="364" text-anchor="end" class="wx-t-s">minimum ages; may be older</text><rect x="221.0" y="413.0" width="138.6" height="14" rx="4" class="wx-c6 wx-growx" style="--d:3"/><text x="365.6" y="424" class="wx-t-s">335–236</text><line x1="606.0" y1="64" x2="606.0" y2="460" class="wx-hl wx-draw" pathLength="1" style="--d:8"/><text x="606.0" y="56" text-anchor="middle" class="wx-t-b wx-t-a">60,000 years ago</text></svg></div></div><figcaption>Dated ranges for Homo sapiens and five other human groups; the accent line marks 60,000 years ago. <span class="wx-src">Based on: Sutikna et al. 2016; Détroit et al. 2019; Higham et al. 2014; Dirks et al. 2017; Chen et al. 2019; Ji et al. 2021; Tsutaya et al. 2025; Kaifu et al. 2024; Douka et al. 2019. Start and end points are approximate; the Denisovan bar spans dated fossils only.</span></figcaption><p class="vh">A horizontal time chart from 350,000 years ago on the left to today on the right, with six rows. Homo sapiens: a bar from about 300,000 years ago to today. Neanderthals: a bar from before 350,000 to about 40,000 years ago. Denisovans: a bar from about 200,000 to 50,000 years ago, with open dots for the Xiahe jaw at 160,000 and the Harbin skull at 146,000, and two dashed boxes for the two possible age ranges of the Penghu jaw, 190,000 to 130,000 or 70,000 to 10,000. Homo floresiensis: dashed stone-tool range from 190,000 to 50,000 and skeletons from 100,000 to 60,000, with an arrow noting ancestors on Flores by 700,000. Homo luzonensis: two dots at minimum ages of 67,000 and 50,000 with a dashed arrow meaning they may be older. Homo naledi: a bar from 335,000 to 236,000. A vertical accent line at 60,000 years ago crosses five rows.</p></figure><p>Further back, the crowd grows. In South Africa, cavers squeezing into the Rising Star cave system in 2013 found more than 1,550 pieces of bone from at least fifteen individuals of Homo naledi, a small-brained species that lived between about 335,000 and 236,000 years ago, when early Homo sapiens was already walking the continent. And in north-east China, a skull that had spent decades hidden in a well turned out to hold another surprise.</p></section><section class="wsec" id="other-humans-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>New tools, new faces</h3><p>DNA breaks down in heat and time, so for years the Denisovans could only be studied in cold Siberia. The breakthrough came from proteins, which last longer. In 2019 proteins from a jaw found in 1980 by a Buddhist monk in Baishiya Karst Cave, at 3,280 metres on the Tibetan Plateau, showed it was Denisovan and at least 160,000 years old. Sediment DNA from the same cave showed Denisovans had lived there for a long time.</p><figure class="wx wx--steps" id="other-humans-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">From a finger bone to a face</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="From a finger bone to a face"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" class="wx-svg" role="img" aria-labelledby="other-humans-f2-t"><title id="other-humans-f2-t">How the Denisovans went from a finger bone to a face: key finds on a latitude and longitude grid, in five steps</title><defs><marker id="other-humans-f2-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text x="24" y="28" class="wx-t-cap">Denisovan finds plotted by latitude and longitude · coastlines omitted</text><rect x="40" y="50" width="630" height="434" rx="6" class="wx-sky wx-o60"/><line x1="40" y1="50" x2="40" y2="484" class="wx-guide"/><text x="40" y="500" text-anchor="middle" class="wx-t-s">60° E</text><line x1="250" y1="50" x2="250" y2="484" class="wx-guide"/><text x="250" y="500" text-anchor="middle" class="wx-t-s">90° E</text><line x1="460" y1="50" x2="460" y2="484" class="wx-guide"/><text x="460" y="500" text-anchor="middle" class="wx-t-s">120° E</text><line x1="670" y1="50" x2="670" y2="484" class="wx-guide"/><text x="670" y="500" text-anchor="middle" class="wx-t-s">150° E</text><line x1="40" y1="50.0" x2="670" y2="50.0" class="wx-guide"/><text x="676" y="54.0" class="wx-t-s">60° N</text><line x1="40" y1="174.0" x2="670" y2="174.0" class="wx-guide"/><text x="676" y="178.0" class="wx-t-s">40° N</text><line x1="40" y1="298.0" x2="670" y2="298.0" class="wx-guide"/><text x="676" y="302.0" class="wx-t-s">20° N</text><line x1="40" y1="422.0" x2="670" y2="422.0" class="wx-guide"/><text x="676" y="426.0" class="wx-t-s">0° </text><g class="wx-st" data-s="1"><circle cx="212.8" cy="103.3" r="7" class="wx-accfill"/><circle cx="235.8" cy="85.3" r="9" class="wx-num"/><text x="235.8" y="89.3" text-anchor="middle" class="wx-numt">1</text><text x="248.8" y="89.3" text-anchor="start" class="wx-t-b wx-halo">Denisova Cave, Altai</text><text x="226.8" y="107.3" text-anchor="start" class="wx-t-s wx-halo">2008 finger bone;</text><text x="226.8" y="121.3" text-anchor="start" class="wx-t-s wx-halo">2010 genome from it</text></g><g class="wx-st" data-s="2"><circle cx="338.0" cy="202.2" r="7" class="wx-accfill"/><circle cx="361.0" cy="184.2" r="9" class="wx-num"/><text x="361.0" y="188.2" text-anchor="middle" class="wx-numt">2</text><text x="374.0" y="188.2" text-anchor="start" class="wx-t-b wx-halo">Xiahe jaw, Tibetan Plateau</text><text x="352.0" y="206.2" text-anchor="start" class="wx-t-s wx-halo">3,280 m up; 160,000+ years;</text><text x="352.0" y="220.2" text-anchor="start" class="wx-t-s wx-halo">named by its proteins, 2019</text></g><g class="wx-st" data-s="3"><circle cx="343.8" cy="296.8" r="7" class="wx-accfill"/><circle cx="320.8" cy="278.8" r="9" class="wx-num"/><text x="320.8" y="282.8" text-anchor="middle" class="wx-numt">3</text><text x="307.8" y="282.8" text-anchor="end" class="wx-t-b wx-halo">Tam Ngu Hao 2, Laos</text><text x="329.8" y="300.8" text-anchor="end" class="wx-t-s wx-halo">a child's molar, 164,000–131,000</text><text x="329.8" y="314.8" text-anchor="end" class="wx-t-s wx-halo">years; probably Denisovan, 2022</text></g><g class="wx-st" data-s="4"><circle cx="457.2" cy="276.3" r="7" class="wx-accfill"/><circle cx="480.2" cy="258.3" r="9" class="wx-num"/><text x="480.2" y="262.3" text-anchor="middle" class="wx-numt">4</text><text x="493.2" y="262.3" text-anchor="start" class="wx-t-b wx-halo">Penghu jaw</text><text x="471.2" y="280.3" text-anchor="start" class="wx-t-s wx-halo">dredged from the Taiwan Strait;</text><text x="471.2" y="294.3" text-anchor="start" class="wx-t-s wx-halo">male Denisovan by proteins, 2025</text></g><g class="wx-st" data-s="5"><circle cx="506.6" cy="138.4" r="7" class="wx-accfill"/><circle cx="475.6" cy="120.4" r="9" class="wx-num"/><text x="475.6" y="124.4" text-anchor="middle" class="wx-numt">5</text><text x="462.6" y="124.4" text-anchor="end" class="wx-t-b wx-halo">Harbin skull</text><text x="484.6" y="142.4" text-anchor="end" class="wx-t-s wx-halo">146,000+ years; 1,420 cm³ brain;</text><text x="484.6" y="156.4" text-anchor="end" class="wx-t-s wx-halo">proteins and mtDNA, 2025</text></g><circle cx="506.6" cy="138.4" r="13" class="wx-hl wx-st wx-hide" data-only="5"/><text x="526.6" y="143.4" class="wx-t-b wx-t-a wx-halo wx-st wx-hide" data-only="5">first Denisovan face</text><g class="wx-st" data-s="1"><circle cx="635" cy="459.2" r="6" class="wx-c3"/><text x="623" y="455.2" text-anchor="end" class="wx-t-b wx-halo">New Guinea today</text><text x="623" y="470.2" text-anchor="end" class="wx-t-s wx-halo">about 4–6% Denisovan DNA</text><text x="623" y="484.2" text-anchor="end" class="wx-t-s wx-halo">(found by comparing with the 2010 genome)</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> 2008–2010: a finger bone from Denisova Cave yields a new human genome, still found in people of New Guinea today.</p><ol class="wx-steplist"><li>2008–2010: a finger bone from Denisova Cave yields a new human genome, still found in people of New Guinea today.</li><li>2019: proteins identify a Denisovan jaw from 3,280 m up on the Tibetan Plateau.</li><li>2022: a child&#x27;s molar from a cave in Laos extends the range south.</li><li>2025: a jaw dredged from the Taiwan Strait is identified as a male Denisovan.</li><li>2025: the Harbin skull is identified as Denisovan: the first face.</li></ol><figcaption>Five Denisovan finds that turned a genome into a people, plotted by latitude and longitude. <span class="wx-src">Based on: Krause et al. 2010; Reich et al. 2010; Chen et al. 2019; Demeter et al. 2022 (Laos); Tsutaya et al. 2025; Fu et al. 2025. Site coordinates approximate; equirectangular grid.</span></figcaption><p class="vh">A latitude and longitude grid from 60 to 150 degrees east and 60 degrees north to 10 degrees south, without coastlines. Step 1: Denisova Cave in the Altai, with the 2008 finger bone and 2010 genome, and a dashed arrow to New Guinea, where people today carry about 4 to 6 percent Denisovan DNA. Step 2: the Xiahe jaw on the Tibetan Plateau at 3,280 metres, over 160,000 years old, identified by proteins in 2019. Step 3: a child&#x27;s molar from Tam Ngu Hao 2 in Laos, 164,000 to 131,000 years old, probably Denisovan. Step 4: the Penghu jaw dredged from the Taiwan Strait, identified by proteins in 2025. Step 5: the Harbin skull in north-east China, over 146,000 years old, with a 1,420 cubic centimetre brain, identified in 2025 by proteins and mitochondrial DNA: the first Denisovan face.</p></figure><aside class="wcall"><b>Fresh from the field</b><p>In 2025 two finds gave the Denisovans a body. Proteins from a jaw dredged by fishermen from the Penghu Channel off Taiwan identified a male Denisovan, extending their range into warm, humid East Asia. Then Qiaomei Fu&#x27;s team recovered proteins and mitochondrial DNA from dental calculus on the Harbin skull, at least 146,000 years old, and found it was Denisovan. For the first time, we can see their face: broad, with heavy brows, large teeth and a brain of about 1,420 cubic centimetres, well within the modern human range.</p></aside><p>The Harbin story has its own strangeness. According to the family account, a labourer found the skull in 1933 while building a bridge over the Songhua River, hid it in an abandoned well to keep it from the occupying authorities, and his descendants revealed it only around 2018. Such a history makes dating difficult, which is why the chemical tests matter so much.</p></section><section class="wsec" id="other-humans-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The mainstream story, rewritten</h3><p>To its credit, mainstream palaeoanthropology has changed its mind quickly. The older &#x27;Out of Africa&#x27; model, in which our species replaced every other human without mixing, has given way to replacement with interbreeding. Our ancestors met Neanderthals and Denisovans and had children with them, and those children&#x27;s genes are in most people alive. A bone fragment from Denisova Cave even came from a girl, nicknamed Denny, whose mother was a Neanderthal and whose father was a Denisovan.</p><p>The islands of South-East Asia add a different lesson. The ancestors of the Flores hobbits were already small 700,000 years ago, according to a tiny arm bone published in 2024, and they survived in isolation for hundreds of thousands of years. The ladder picture never had room for such a long, parallel human story.</p></section><section class="wsec" id="other-humans-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The challengers&#x27; case</h3><p>Lee Berger and John Hawks argue that Homo naledi carried its dead into the deepest chambers of Rising Star, buried them in dug pits, and scratched cross-hatched patterns into the walls. If true, a creature with a brain the size of an orange behaved in ways once reserved for big-brained humans. Critics, including María Martinón-Torres and colleagues in 2024, reply that the sediment work cannot yet rule out natural accumulation, and that the engravings are neither dated nor clearly made by naledi. The papers were finally published by eLife in 2025, with reviewers still divided.</p><p>Ji Qiang and Ni Xijun named the Harbin skull Homo longi and argue it represents a lineage close to our own; a reconstruction of the million-year-old Yunxian skull, published in 2025, pushed the split of these lineages further back, a result still debated. And the anthropologist Gregory Forth has spent years recording stories among the Lio people of Flores about small, hairy wild people, which he suggests may preserve a memory of Homo floresiensis, or even a late survival.</p><blockquote class="wpull"><p>The challengers ask the right question: if we missed whole kinds of humans until yesterday, what else have we missed?</p></blockquote><p>The verdicts differ. The naledi burials are a genuine open question with serious work on both sides. The Homo longi name is a dispute about labels more than facts. The hobbit-survival idea has no fossil, tool or DNA younger than about 50,000 years to support it, so it remains a hypothesis awaiting discovery, though the stories themselves deserve respect as a record of how people saw their world.</p></section><section class="wsec" id="other-humans-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What time has erased</h3><p>Almost every one of these groups was found by luck. Bone and DNA survive best in cold, dry caves; the tropics, where much of human history happened, destroy them. During the Ice Age the Sunda shelf joined Java, Sumatra and Borneo to Asia, a landmass now under the sea. Wallacea, the island world between Asia and Australia, has barely been excavated. When the evidence comes from a finger bone, a jaw from a fishing net and a skull from a well, the honest conclusion is that the family tree is still incomplete.</p></section><section class="wsec" id="other-humans-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle it</h3><p>Nuclear DNA from Harbin or Penghu would fix the Denisovans&#x27; place on the tree. Direct dates on the naledi remains inside the proposed graves, with independent studies of how the sediment formed, would test the burial claim. And sediment DNA surveys in the caves of Wallacea could reveal when the island humans disappeared, and whether they met us.</p><p>The idea that we &#x27;started at the bottom and climbed alone&#x27; does not survive the evidence. Humanity was a crowd of cousins, some tall, some tiny, some big-brained, some not, and for most of our history we were not the only people on Earth.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-find" style="--i:0"><span class="wtl-y">2004 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Homo floresiensis described from Flores</span></li><li class="wtl-find" style="--i:1"><span class="wtl-y">2008 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Finger bone found in Denisova Cave</span></li><li class="wtl-study" style="--i:2"><span class="wtl-y">2010 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Denisovan genome published</span></li><li class="wtl-find" style="--i:3"><span class="wtl-y">2015 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Homo naledi announced</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">2019 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Xiahe jaw and Homo luzonensis</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">2021 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Harbin skull named Homo longi</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2024 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">700,000-year-old tiny humerus on Flores</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2025 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Penghu and Harbin identified as Denisovan</span></li></ol><details class="srcs"><summary>Sources for this case (22)</summary><ol><li>Krause, J. et al. (2010). The complete mitochondrial DNA genome of an unknown hominin from southern Siberia. Nature 464: 894–897. <a href="https://doi.org/10.1038/nature08976" target="_blank" rel="noopener">doi:10.1038/nature08976</a></li><li>Reich, D. et al. (2010). Genetic history of an archaic hominin group from Denisova Cave in Siberia. Nature 468: 1053–1060. <a href="https://doi.org/10.1038/nature09710" target="_blank" rel="noopener">doi:10.1038/nature09710</a></li><li>Chen, F. et al. (2019). A late Middle Pleistocene Denisovan mandible from the Tibetan Plateau. Nature 569: 409–412. <a href="https://doi.org/10.1038/s41586-019-1139-x" target="_blank" rel="noopener">doi:10.1038/s41586-019-1139-x</a></li><li>Tsutaya, T. et al. (2025). A male Denisovan mandible from Pleistocene Taiwan. Science 388: 176–180. <a href="https://doi.org/10.1126/science.ads3888" target="_blank" rel="noopener">doi:10.1126/science.ads3888</a></li><li>Fu, Q. et al. (2025). Ancient proteome of the Harbin cranium (title abbreviated). Science 389: 704–707. <a href="https://doi.org/10.1126/science.adu9677" target="_blank" rel="noopener">doi:10.1126/science.adu9677</a></li><li>Fu, Q. et al. (2025). Denisovan mitochondrial DNA from dental calculus of the &gt;146,000-year-old Harbin cranium. Cell 188: 3919–3926. <a href="https://doi.org/10.1016/j.cell.2025.05.040" target="_blank" rel="noopener">doi:10.1016/j.cell.2025.05.040</a></li><li>Ji, Q. et al. (2021). Late Middle Pleistocene Harbin cranium represents a new Homo species. The Innovation 2: 100132. <a href="https://doi.org/10.1016/j.xinn.2021.100132" target="_blank" rel="noopener">doi:10.1016/j.xinn.2021.100132</a></li><li>Brown, P. et al. (2004). A new small-bodied hominin from the Late Pleistocene of Flores, Indonesia. Nature 431: 1055–1061. <a href="https://doi.org/10.1038/nature02999" target="_blank" rel="noopener">doi:10.1038/nature02999</a></li><li>Sutikna, T. et al. (2016). Revised stratigraphy and chronology for Homo floresiensis at Liang Bua in Indonesia. Nature 532: 366–369. <a href="https://doi.org/10.1038/nature17179" target="_blank" rel="noopener">doi:10.1038/nature17179</a></li><li>Kaifu, Y. et al. (2024). Early evolution of small body size in Homo floresiensis. Nature Communications 15: 6381. <a href="https://doi.org/10.1038/s41467-024-50649-7" target="_blank" rel="noopener">doi:10.1038/s41467-024-50649-7</a></li><li>Détroit, F. et al. (2019). A new species of Homo from the Late Pleistocene of the Philippines. Nature 568: 181–186. <a href="https://doi.org/10.1038/s41586-019-1067-9" target="_blank" rel="noopener">doi:10.1038/s41586-019-1067-9</a></li><li>Dirks, P. H. G. M. et al. (2017). The age of Homo naledi and associated sediments in the Rising Star Cave, South Africa. eLife 6: e24231. <a href="https://doi.org/10.7554/eLife.24231" target="_blank" rel="noopener">doi:10.7554/eLife.24231</a></li><li>Berger, L. R. et al. (2025). Evidence for deliberate burial of the dead by Homo naledi. eLife 12: RP89106. <a href="https://doi.org/10.7554/eLife.89106" target="_blank" rel="noopener">doi:10.7554/eLife.89106</a></li><li>Martinón-Torres, M., Garate, D., Herries, A. I. R. &amp; Petraglia, M. D. (2024). No scientific evidence that Homo naledi buried their dead and produced rock art. Journal of Human Evolution 195: 103464. <a href="https://doi.org/10.1016/j.jhevol.2023.103464" target="_blank" rel="noopener">doi:10.1016/j.jhevol.2023.103464</a></li><li>Slon, V. et al. (2018). The genome of the offspring of a Neanderthal mother and a Denisovan father. Nature 561: 113–116. <a href="https://doi.org/10.1038/s41586-018-0455-x" target="_blank" rel="noopener">doi:10.1038/s41586-018-0455-x</a></li><li>Higham, T. et al. (2014). The timing and spatiotemporal patterning of Neanderthal disappearance. Nature 512: 306–309. <a href="https://doi.org/10.1038/nature13621" target="_blank" rel="noopener">doi:10.1038/nature13621</a></li><li>Douka, K. et al. (2019). Age estimates for hominin fossils and the onset of the Upper Palaeolithic at Denisova Cave. Nature 565: 640–644. <a href="https://doi.org/10.1038/s41586-018-0870-z" target="_blank" rel="noopener">doi:10.1038/s41586-018-0870-z</a></li><li>Green, R. E. et al. (2010). A draft sequence of the Neandertal genome. Science 328: 710–722. <a href="https://doi.org/10.1126/science.1188021" target="_blank" rel="noopener">doi:10.1126/science.1188021</a></li><li>Demeter, F. et al. (2022). A Middle Pleistocene Denisovan molar from the Annamite Chain of northern Laos. Nature Communications 13: 2557. <a href="https://doi.org/10.1038/s41467-022-29923-z" target="_blank" rel="noopener">doi:10.1038/s41467-022-29923-z</a></li><li>Huerta-Sánchez, E. et al. (2014). Altitude adaptation in Tibetans caused by introgression of Denisovan-like DNA. Nature 512: 194–197. <a href="https://doi.org/10.1038/nature13408" target="_blank" rel="noopener">doi:10.1038/nature13408</a></li><li>Feng, X. et al. (2025). The phylogenetic position of the Yunxian cranium elucidates the origin of Homo longi and the Denisovans. Science 389: 1320–1324.</li><li>Forth, G. (2022). Between Ape and Human: An Anthropologist on the Trail of a Hidden Hominoid. Pegasus Books.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-other-humans" data-t="The Other Humans: We Were Never Alone"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Other Humans: We Were Never Alone</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-other-humans</span> (updated 25 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-shigir-idol-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Shigir idol.jpg" data-cap="The Shigir Idol, drawn in its surviving fragments" data-big><figcaption></figcaption></figure><div class="sh-k">Mysteries of the Earth</div><h2 class="sh-t" id="case-shigir-idol-st" tabindex="-1">The Shigir Idol: A Wooden Giant Older Than Göbekli Tepe</h2><p class="sh-s">Gold miners pulled a carved face from four metres of peat. A century later, the wood turned out to be twelve thousand years old.</p><div class="sh-v"><span class="vstamp vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><p class="sh-claim"><b>What the stamp rates:</b> The Shigir Idol was carved around 12,000 years ago, making it the oldest known monumental wooden sculpture.</p></div><p class="v4-q">Who carved a five-metre wooden figure in the Urals at the end of the Ice Age?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Pulled from a Russian peat bog in 1890, the Shigir idol is a carved larch figure over five metres tall.</li><li>Early tests said about 9,500 years; the outer wood had been soaked in preservative.</li><li>New samples from the untouched core, run in two laboratories, gave about 12,000 years.</li><li>Tool marks show it was carved in fresh green wood with stone adze and chisels.</li><li>The oldest monumental wooden sculpture known: strong evidence, with the exact century still uncertain.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Chemistry</span><span class="thr">Texts and scripts</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="5.3" data-dec="1">5.3</b><span class="ctr-u"> m</span></div><div class="ctr-l">height as first reconstructed</div><div class="ctr-c">Tolmachev 1914, in Zhilin et al. 2018</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="12000" >12,000</b><span class="ctr-u"> years</span></div><div class="ctr-l">since the carving</div><div class="ctr-c">Terberger et al. 2021</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="159" >159</b><span class="ctr-u"> rings</span></div><div class="ctr-l">growth rings in the larch trunk</div><div class="ctr-c">Zhilin et al. 2018</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="4" >4</b><span class="ctr-u"> m</span></div><div class="ctr-l">depth of peat above the find</div><div class="ctr-c">Zhilin et al. 2018</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="7" >7</b><span class="ctr-u"> samples</span></div><div class="ctr-l">AMS dates taken in 2014</div><div class="ctr-c">Zhilin et al. 2018</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The Shigir Idol was carved around 12,000 years ago, making it the oldest known monumental wooden sculpture.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Seven AMS dates were run in two laboratories, and the pattern makes sense: the outer wood, soaked in conservation resin, gave young ages, while the untouched core gave the oldest. Tool marks show carving in green wood, so the felling date is close to the carving date. The earlier 9,500-year result used older methods on contaminated samples. Only one object has been dated this way, and the exact century remains uncertain, which keeps the rating short of established.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Museum labels now give the early date with confidence, and that is fair. The larger gap lies in general histories, which still present monumental art as a product of farming villages. Shigir, like Göbekli Tepe, shows that account was overconfident: foragers built monuments, and the archaeological record is biased toward stone because wood almost never survives.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>The sculpture was recovered in ten pieces on 24 January 1890 from about 4 m down in the Shigir peat bog, a gold-mining area east of the Middle Urals.<small>Zhilin et al. 2018</small></li><li>It is carved from a single larch trunk; the tree was about 159 years old when it was felled.<small>Zhilin et al. 2018</small></li><li>Tool marks from a polished stone adze and two or three kinds of stone chisel show it was carved in fresh, green wood, soon after felling.<small>Zhilin et al. 2018</small></li><li>AMS radiocarbon dates on the innermost, uncontaminated wood place the carving close to the end of the Younger Dryas, about 12,000 years ago (c. 10,000 cal BCE).<small>Terberger et al. 2021</small></li><li>In 1914 Vladimir Tolmachev reconstructed the complete figure at about 5.3 m, using fragments that were later lost.<small>Zhilin et al. 2018</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>What the faces and zigzag bands mean: a creation story, a map, guardian spirits, or a warning about dangerous places.</li><li>Whether the idol stood upright as a pole, leaned against a rock, or lay in a sanctuary.</li><li>Whether monumental art in the Urals and at Göbekli Tepe share any connection, or arose independently at the same climatic moment.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>The lower fragments used in the 1914 reconstruction are lost; only Tolmachev&#x27;s drawings remain.</li><li>The find was made by gold miners, not archaeologists, so its exact position and any surrounding offerings were never recorded.</li><li>Wood survives only in waterlogged, oxygen-free deposits; other wooden monuments of the period have almost certainly rotted away unseen.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Archaeologists now accept the early date. The team led by Mikhail Zhilin, Svetlana Savchenko and Thomas Terberger took seven new AMS samples in 2014, showed that the young dates came from outer wood contaminated by conservation chemicals, and placed the carving in the late Younger Dryas or earliest Holocene. The mainstream reading is that Late Glacial hunter-gatherers of the Urals had a rich ritual life and a developed art style, whose zigzags and geometric motifs are shared with other Late Palaeolithic and Mesolithic art across Eurasia.</p><ul><li>The innermost growth rings give the oldest and most reliable ages.</li><li>The carving style fits a long local tradition of Eurasian geometric decoration.</li><li>The makers were foragers, living by hunting, fishing and gathering in a forested landscape.</li><li>Monumental art therefore does not require farming, a point also made by Göbekli Tepe.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>The Shigir team were themselves challengers: their dates broke the long-standing idea that ritual monuments began with farming in the Near East. Savchenko has read the figure as a creation story in code; Koksharov sees an &#x27;X-ray&#x27; style of ancestral figures echoed in later Ural art; Bobrov argues the tradition grew locally in the taiga and persisted for millennia. Writers on lost Ice Age cultures go further, reading Shigir and Göbekli Tepe as twin survivals of an older symbolic world that crossed the Younger Dryas.</p><ul><li>Two traditions of monumental human figures appear at almost the same moment, 3,000 km apart.</li><li>Both were made by hunter-gatherers, not farmers.</li><li>Both appear at the end of an abrupt climate crisis.</li><li>Wooden art is nearly invisible to archaeology, so the true scale of Ice Age monument building is unknown.</li></ul><div class="face-s"><b>Its strongest point</b><p>A giant wooden figure carved by foragers 12,000 years ago shows that the textbook sequence, farming first and monuments after, was wrong, and that most of the evidence for such art has simply rotted.</p></div><p class="face-cr"><b>Credit</b> Mikhail Zhilin, Svetlana Savchenko and Thomas Terberger (against the farming-first view); Vladimir Bobrov; Stanislav Koksharov; writers on lost Ice Age cultures</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Further dates from independent laboratories on the innermost rings, with the conservation chemistry fully removed.</li><li>Wiggle-matching the 159 tree rings against the radiocarbon calibration curve to fix the felling date within a few decades.</li><li>Systematic coring and ground-penetrating radar of the Shigir and Gorbunovo bogs for other wooden structures.</li><li>Residue and wear analysis of the base to learn whether the figure stood upright and for how long.</li><li>Direct comparison of carving tools and motifs with Göbekli Tepe and other early Holocene sites, to test for any shared tradition.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,200 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Shigir Idol: A Wooden Giant Older Than Göbekli Tepe"><button type="button" class="wtoc-i" data-go="shigir-idol-s1">A face in the peat</button><button type="button" class="wtoc-i" data-go="shigir-idol-s2">What the wood can tell us</button><button type="button" class="wtoc-i" data-go="shigir-idol-s3">The story it broke</button><button type="button" class="wtoc-i" data-go="shigir-idol-s4">The challengers&#x27; reading</button><button type="button" class="wtoc-i" data-go="shigir-idol-s5">What the bog has kept, and what it has eaten</button><button type="button" class="wtoc-i" data-go="shigir-idol-s6">What would settle it</button></nav></div><section class="wsec" id="shigir-idol-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A face in the peat</h3><p>On 24 January 1890, gold miners digging through the Shigir peat bog, on the eastern slope of the Middle Urals, hit wood about four metres down. It came out in ten pieces. When the pieces were laid side by side, a face looked up at them: a long head with straight brows, a narrow nose and an open mouth, sitting on top of a flat plank covered in zigzags and more faces.</p><p>Nobody knew what to make of it. There were no written records from the region before the Russians arrived, no known local tradition of giant carvings, and no way to date wood. It went to the museum in Yekaterinburg, where in 1914 the archaeologist Vladimir Tolmachev pieced together the fragments into a figure some 5.3 metres tall, about the height of a giraffe. Then the fragments he had used for the lower part went missing, and the idol, now shorter, stood in its case as a curiosity: very old, probably, but how old?</p><blockquote class="wpull"><p>For a century the Shigir Idol was a carved question mark: a monument without a date, a culture or a name.</p></blockquote><p>The answer, when it came, rearranged a textbook chapter. The wood turned out to be about 12,000 years old. The people who carved it did not farm, keep animals or live in towns. They probably hunted elk, fished and gathered in the forests at the very end of the Ice Age.</p></section><section class="wsec" id="shigir-idol-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What the wood can tell us</h3><p>The idol is cut from a single larch trunk. Counting the growth rings gives 159, so the tree was about a century and a half old when it came down. Under the microscope, the cut marks are sharp and flat, with no crushed fibres: the carvers worked the wood green, soon after felling, with a polished stone adze and two or three kinds of stone chisel. That detail matters, because it ties the date of the tree to the date of the carving.</p><figure class="wx wx--static" id="shigir-idol-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">The Shigir sculpture at scale</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The Shigir sculpture at scale"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" class="wx-svg" role="img" aria-labelledby="shigir-idol-f1-t"><title id="shigir-idol-f1-t">The Shigir sculpture at scale: surviving part, 1914 reconstruction, a person and a Göbekli Tepe pillar</title><text x="24" y="28" class="wx-t-cap">Elevation at one scale · heights from published figures, widths schematic</text><g><line x1="70" y1="500" x2="690" y2="500" class="wx-line"/><line x1="70" y1="420" x2="690" y2="420" class="wx-guide"/><line x1="70" y1="340" x2="690" y2="340" class="wx-guide"/><line x1="70" y1="260" x2="690" y2="260" class="wx-guide"/><line x1="70" y1="180" x2="690" y2="180" class="wx-guide"/><line x1="70" y1="100" x2="690" y2="100" class="wx-guide"/><text x="60" y="504" text-anchor="end" class="wx-t-s">0 m</text><text x="60" y="424" text-anchor="end" class="wx-t-s">1</text><text x="60" y="344" text-anchor="end" class="wx-t-s">2</text><text x="60" y="264" text-anchor="end" class="wx-t-s">3</text><text x="60" y="184" text-anchor="end" class="wx-t-s">4</text><text x="60" y="104" text-anchor="end" class="wx-t-s">5</text></g><g class="wx-pop" style="--d:1"><circle cx="120" cy="373" r="9" class="wx-line"/><line x1="120" y1="382" x2="120" y2="448" class="wx-line"/><line x1="120" y1="448" x2="108" y2="500" class="wx-line"/><line x1="120" y1="448" x2="132" y2="500" class="wx-line"/><line x1="120" y1="396" x2="104" y2="432" class="wx-line"/><line x1="120" y1="396" x2="136" y2="432" class="wx-line"/><text x="120" y="522" text-anchor="middle" class="wx-t-s">person, 1.7 m</text></g><rect x="268" y="76" width="44" height="424" rx="6" class="wx-dash"/><g class="wx-grow" style="--d:2"><rect x="268" y="76" width="44" height="224" rx="6" class="wx-wood wx-edge"/></g><g class="wx-pop" style="--d:6"><ellipse cx="290" cy="98" rx="17" ry="20" class="wx-wood wx-edge"/><line x1="282" y1="94" x2="287" y2="94" class="wx-bold"/><line x1="293" y1="94" x2="298" y2="94" class="wx-bold"/><line x1="290" y1="98" x2="290" y2="106" class="wx-line"/><line x1="284" y1="111" x2="296" y2="111" class="wx-line"/><line x1="274" y1="130" x2="306" y2="130" class="wx-thin"/><line x1="274" y1="137" x2="306" y2="137" class="wx-thin"/><line x1="274" y1="144" x2="306" y2="144" class="wx-thin"/><polyline points="274,160 280,168 286,160 292,168 298,160 304,168" class="wx-line"/><rect x="278" y="186" width="24" height="26" rx="4" class="wx-stone2 wx-edge-soft"/><line x1="283" y1="195" x2="287" y2="195" class="wx-bold"/><line x1="293" y1="195" x2="297" y2="195" class="wx-bold"/><line x1="286" y1="205" x2="294" y2="205" class="wx-line"/><polyline points="274,230 280,238 286,230 292,238 298,230 304,238" class="wx-line"/><rect x="278" y="254" width="24" height="26" rx="4" class="wx-stone2 wx-edge-soft"/><line x1="283" y1="263" x2="287" y2="263" class="wx-bold"/><line x1="293" y1="263" x2="297" y2="263" class="wx-bold"/><line x1="286" y1="273" x2="294" y2="273" class="wx-line"/></g><g class="wx-pop" style="--d:8"><polyline points="274,330 280,338 286,330 292,338 298,330 304,338" class="wx-guide"/><polyline points="274,400 280,408 286,400 292,408 298,400 304,408" class="wx-guide"/></g><g class="wx-pop" style="--d:9"><line x1="316" y1="180" x2="350" y2="180" class="wx-thin"/><text x="356" y="176" class="wx-t-b">Surviving sculpture</text><text x="356" y="191" class="wx-t-s">on display in Yekaterinburg, c. 2.8 m</text><text x="356" y="205" class="wx-t-s">(some studies give 3.4 m for the pieces)</text><line x1="316" y1="400" x2="350" y2="400" class="wx-thin"/><text x="356" y="396" class="wx-t-b">Lower part: reconstruction</text><text x="356" y="411" class="wx-t-s">Tolmachev's 1914 drawings; those</text><text x="356" y="425" class="wx-t-s">fragments were later lost</text><line x1="316" y1="98" x2="350" y2="98" class="wx-thin"/><text x="356" y="94" class="wx-t-b">Carved head</text><text x="356" y="109" class="wx-t-s">more faces lower down the plank</text></g><g class="wx-pop" style="--d:4"><line x1="236" y1="76" x2="236" y2="500" class="wx-dim"/><line x1="230" y1="76" x2="242" y2="76" class="wx-dim"/><line x1="230" y1="500" x2="242" y2="500" class="wx-dim"/><text x="228" y="292" text-anchor="end" class="wx-t-n">5.3 m</text><text x="228" y="308" text-anchor="end" class="wx-t-s">as first</text><text x="228" y="321" text-anchor="end" class="wx-t-s">reconstructed</text></g><g class="wx-pop" style="--d:10"><path d="M590,500 L590,160 L560,160 L560,60 L680,60 L680,160 L650,160 L650,500" class="wx-dash"/><rect x="560" y="60" width="120" height="100" class="wx-stone wx-o40"/><rect x="590" y="160" width="60" height="340" class="wx-stone wx-o40"/><text x="620" y="522" text-anchor="middle" class="wx-t-s">Göbekli Tepe central</text><text x="620" y="536" text-anchor="middle" class="wx-t-s">pillar, Enclosure D, c. 5.5 m</text></g><text x="24" y="552" class="wx-t-s">Stone versus wood: the stone pillar survived; a wooden monument survives only in rare waterlogged peat.</text></svg></div></div><figcaption>The surviving figure, the 1914 reconstruction, a person and a central pillar from Göbekli Tepe, drawn at the same scale. <span class="wx-src">Based on: Heights: 5.3 m reconstruction (Tolmachev 1914) and surviving part as reported by Zhilin et al. 2018 and museum descriptions (2.8 m on display; 3.4 m is also given for the preserved pieces). Göbekli Tepe central pillars c. 5.5 m (Dietrich et al. 2012). Widths and ornament positions schematic.</span></figcaption><p class="vh">An elevation drawing on a height grid from 0 to 5 metres. On the left, a 1.7 metre person. In the middle, a narrow carved plank: the upper part, about 2.8 metres, is drawn solid with a carved head at the top, horizontal rib lines, zigzag bands and two smaller faces; the lower part is a dashed outline labelled as Tolmachev&#x27;s 1914 reconstruction, whose fragments were later lost. A dimension line gives 5.3 metres for the reconstructed figure. On the right, a dashed T-shaped Göbekli Tepe central pillar from Enclosure D, about 5.5 metres tall, for comparison.</p></figure><p>Radiocarbon first reached the idol in 1997, and gave about 9,500 years. That was already startling. Then, in 2014, a Russian and German team led by Mikhail Zhilin, Svetlana Savchenko and Thomas Terberger took seven fresh samples for accelerator dating in two laboratories. The results fanned out, and the pattern explained itself.</p><aside class="wcall"><b>How do we know?</b><p>After the first dating, the sampling holes had been filled with wood powder mixed with butyl acrylate, and the whole sculpture had been soaked in the same resin to stop it cracking. Modern carbon in the resin makes wood look younger. The outer samples, most affected, gave the youngest ages; the innermost wood gave the oldest. The team published the early date in Antiquity in 2018 and refined it in Quaternary International in 2021, to about 12,000 years ago.</p></aside><figure class="wx wx--steps" id="shigir-idol-f2" data-n="5"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">How the date moved</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How the date moved"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" class="wx-svg" role="img" aria-labelledby="shigir-idol-f2-t"><title id="shigir-idol-f2-t">How the date of the Shigir sculpture moved from unknown to about 12,000 years ago, in five steps</title><text x="24" y="28" class="wx-t-cap">Radiocarbon results on one time axis · years before 2000 CE</text><rect x="92" y="52" width="144" height="318" class="wx-ice"/><text x="164" y="68" text-anchor="middle" class="wx-t-s">Younger Dryas</text><text x="164" y="82" text-anchor="middle" class="wx-t-s">cold snap</text><line x1="80" y1="370" x2="680" y2="370" class="wx-line"/><g><line x1="80" y1="370" x2="80" y2="377" class="wx-line"/><text x="80" y="392" text-anchor="middle" class="wx-t-s">13,000</text><line x1="200" y1="370" x2="200" y2="377" class="wx-line"/><text x="200" y="392" text-anchor="middle" class="wx-t-s">12,000</text><line x1="320" y1="370" x2="320" y2="377" class="wx-line"/><text x="320" y="392" text-anchor="middle" class="wx-t-s">11,000</text><line x1="440" y1="370" x2="440" y2="377" class="wx-line"/><text x="440" y="392" text-anchor="middle" class="wx-t-s">10,000</text><line x1="560" y1="370" x2="560" y2="377" class="wx-line"/><text x="560" y="392" text-anchor="middle" class="wx-t-s">9,000</text><line x1="680" y1="370" x2="680" y2="377" class="wx-line"/><text x="680" y="392" text-anchor="middle" class="wx-t-s">8,000</text><text x="380" y="412" text-anchor="middle" class="wx-t-m">years ago (older to the left)</text></g><g class="wx-st wx-hide" data-only="1"><rect x="80" y="100" width="600" height="40" rx="6" class="wx-stone wx-o40"/><text x="380" y="126" text-anchor="middle" class="wx-t-b">1890: found 4 m down in peat. Age unknown.</text></g><g class="wx-st wx-hide" data-only="1"><circle cx="36" cy="120" r="9" class="wx-num"/><text x="36" y="124" text-anchor="middle" class="wx-numt">1</text></g><g class="wx-st" data-s="2"><rect x="452" y="112" width="42" height="14" rx="3" class="wx-c2"/><text x="526" y="124" class="wx-t-b">1997: c. 9,500–9,900</text><text x="526" y="139" class="wx-t-s">conventional radiocarbon</text><circle cx="512" cy="120" r="9" class="wx-num"/><text x="512" y="124" text-anchor="middle" class="wx-numt">2</text></g><g class="wx-st" data-s="3"><circle cx="48" cy="162" r="9" class="wx-num"/><text x="48" y="166" text-anchor="middle" class="wx-numt">3</text><rect x="560" y="176" width="48" height="10" rx="3" class="wx-c4"/><rect x="560" y="190" width="48" height="10" rx="3" class="wx-c4"/><text x="612" y="214" text-anchor="end" class="wx-t-s">outer wood, soaked in</text><text x="612" y="227" text-anchor="end" class="wx-t-s">conservation resin: too young</text><rect x="320" y="206" width="120" height="10" rx="3" class="wx-c6"/><rect x="320" y="220" width="120" height="10" rx="3" class="wx-c6"/><rect x="320" y="234" width="120" height="10" rx="3" class="wx-c6"/><text x="380" y="260" text-anchor="middle" class="wx-t-s">middle rings</text><rect x="140" y="236" width="60" height="10" rx="3" class="wx-c3"/><rect x="140" y="250" width="60" height="10" rx="3" class="wx-c3"/><text x="134" y="256" text-anchor="end" class="wx-t-s">innermost wood</text><text x="64" y="166" class="wx-t-b">2014: seven AMS samples, 2 labs</text></g><g class="wx-st" data-s="4"><line x1="200" y1="180" x2="200" y2="370" class="wx-hl"/><line x1="207" y1="330" x2="264" y2="330" class="wx-thin"/><circle cx="200" cy="330" r="7" class="wx-accfill wx-pulse"/><text x="292" y="334" class="wx-t-b wx-t-a wx-halo">Carved c. 12,000 years ago</text><text x="292" y="349" class="wx-t-s wx-halo">in green wood (Zhilin et al. 2018;</text><text x="474" y="349" class="wx-t-s wx-halo">Terberger et al. 2021)</text><circle cx="278" cy="330" r="9" class="wx-num"/><text x="278" y="334" text-anchor="middle" class="wx-numt">4</text></g><g class="wx-st" data-s="5"><line x1="260" y1="286" x2="260" y2="370" class="wx-dash"/><rect x="260" y="286" width="60" height="12" class="wx-stone2"/><text x="352" y="296" class="wx-t-b">Göbekli Tepe enclosures begin</text><text x="352" y="282" class="wx-t-s">c. 11,500 years ago</text><circle cx="338" cy="289" r="9" class="wx-num"/><text x="338" y="293" text-anchor="middle" class="wx-numt">5</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> 1890: the idol comes out of the peat with no way to date it.</p><ol class="wx-steplist"><li>1890: the idol comes out of the peat with no way to date it.</li><li>1997: conventional radiocarbon gives about 9,500 years, already a surprise.</li><li>2014: seven AMS samples fan out; the outer wood, soaked in conservation resin, dates too young.</li><li>The innermost wood and green-wood tool marks put the carving about 12,000 years ago.</li><li>That is at, or a little before, the first enclosures at Göbekli Tepe.</li></ol><figcaption>From an undated find to about 12,000 years ago: why the new dates are older, and how they compare with Göbekli Tepe. <span class="wx-src">Based on: Calibrated ranges from Zhilin et al. 2018 (1997 and 2014 series) and Terberger et al. 2021 (carving c. 10,000 cal BCE); Younger Dryas limits after Rasmussen et al. 2006; Göbekli Tepe after Dietrich et al. 2012. Bars show ranges approximately; sample order simplified.</span></figcaption><p class="vh">A horizontal time axis from 13,000 to 8,000 years ago, with a shaded band for the Younger Dryas cold snap from 12,900 to 11,700 years ago. Step 1: a grey box says the idol was found in 1890 with no known age. Step 2: a bar at about 9,500 to 9,900 years marks the 1997 radiocarbon dates. Step 3: seven AMS results from 2014: two young results from outer wood contaminated by conservation resin at about 9,000 to 8,600 years, three from middle rings at 11,000 to 10,000 years, and two from the innermost wood at 12,500 to 12,000 years. Step 4: an accent line at about 12,000 years marks the proposed carving date. Step 5: a marker at about 11,500 years shows when the Göbekli Tepe enclosures began.</p></figure></section><section class="wsec" id="shigir-idol-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The story it broke</h3><p>For most of the twentieth century the story of civilisation ran in a neat order. First came farming, in the Fertile Crescent, around 11,000 years ago. Farming produced surplus, surplus produced villages and priests, and priests produced temples and monumental art. Hunter-gatherers, in this picture, were small bands with little time for anything grand.</p><p>Göbekli Tepe, in south-eastern Turkey, began to crack that order in the 1990s: massive carved stone pillars raised by people who had not yet domesticated crops. Shigir cracks it from the other side of the map. If the new dates are right, a monumental carved figure stood in the Urals at, or a few centuries before, the first enclosures at Göbekli Tepe, about 11,500 years ago. The carvers lived nearly 3,000 kilometres to the north, in a forest, with no connection to the Near Eastern farming world.</p><p>The mainstream has absorbed this without much fuss, and to its credit. Terberger and his colleagues present Shigir as evidence that Late Glacial foragers in Eurasia had complex ritual lives and a developed visual language. The zigzags and lines on the idol are common in Late Palaeolithic and early Mesolithic art, so the idol belongs to a long tradition rather than appearing from nowhere.</p></section><section class="wsec" id="shigir-idol-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The challengers&#x27; reading</h3><p>Readings of what the figure means are many, and most are honest guesses. Svetlana Savchenko, who has studied the idol for decades at the Sverdlovsk Regional Museum, has suggested it records a creation story in coded form. Others have read it as a map of the landscape. The Danish archaeologist Peter Vang Petersen has suggested it may have served as a warning to keep away from dangerous places. Stanislav Koksharov sees an &#x27;X-ray&#x27; style of skeletal ancestral figures that echoes through later Ural art, and Vladimir Bobrov argues that the whole tradition grew in the taiga and lasted for thousands of years.</p><p>Writers interested in lost Ice Age cultures push the pattern further. Two traditions of monumental human figures appear within a few centuries of each other, one in stone in Anatolia and one in wood in Siberia&#x27;s western gateway. Both were made by foragers. Both appear as the Younger Dryas cold snap ends and the climate lurches warmer. Is that a coincidence, or a shared response to a world-changing event, or a sign of a wider, older symbolic world that we see only in the two places where it happened to survive?</p><blockquote class="wpull"><p>Stone lasts and wood rots. The real surprise of Shigir may be how much of the Ice Age world we have simply never seen.</p></blockquote><p>The evidence supports part of this. The timing is real, and so is the point about preservation. What is missing is any sign of contact: the materials, styles and motifs differ, and nothing links the Urals to Anatolia at that date. A shared climatic trigger is a testable idea; a single lost source remains a speculation.</p></section><section class="wsec" id="shigir-idol-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>What the bog has kept, and what it has eaten</h3><p>The idol survived because it fell, or was placed, in water. In the airless peat of a bog, bacteria and fungi cannot break wood down, so a larch trunk can last twelve millennia. On dry ground it would have been gone in a century or two. That means the Shigir Idol is not evidence that such monuments were rare; it is evidence that they almost never survive.</p><ul class="wlist"><li>The lower third of the figure is known only from drawings, because the fragments were lost after 1914.</li><li>The miners who found it recorded no layers, no associated objects and no exact position.</li><li>Other wooden figures are known from the nearby Gorbunovo bog, but they are thousands of years younger, and the older landscape around Shigir has barely been explored.</li></ul><p>It is a reminder that absence of evidence in forests and wetlands says very little. How many carved poles stood on riverbanks across Ice Age Eurasia? We cannot count them, because the ground has kept almost none.</p></section><section class="wsec" id="shigir-idol-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What would settle it</h3><p>The date itself can be tightened. The idol&#x27;s 159 rings are a gift: by radiocarbon-dating several rings at known intervals and matching the series to the calibration curve, a method called wiggle-matching, the felling date could be fixed to within a few decades. More dates from independent laboratories, on the innermost wood, would test the 2021 result.</p><p>The bigger questions need new finds. Cores and radar surveys of the Shigir and Gorbunovo bogs could reveal other structures, platforms or figures. Careful study of the idol&#x27;s base could show whether it stood upright. And a systematic comparison of tools and motifs across early Holocene Eurasia would test the most intriguing idea of all: that the end of the Ice Age drove people in very different places to build their first monuments at the same time.</p><p>For now, the verdict is simple. The evidence strongly supports a carving date around 12,000 years ago. What it meant to the people who raised it is still, in the best sense, open.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">10,000 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Larch felled and carved, end of Younger Dryas</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">9,500 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">First Göbekli Tepe enclosures</span></li><li class="wtl-find" style="--i:2"><span class="wtl-y">1890 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Gold miners find it in the Shigir bog</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">1914 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Tolmachev reconstructs it at 5.3 m</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">1997 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">First radiocarbon dates: c. 9,500 years</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">2014 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">New AMS samples taken</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2018 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Antiquity paper: Early Holocene date</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2021 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Date refined to c. 12,000 years ago</span></li></ol><details class="srcs"><summary>Sources for this case (8)</summary><ol><li>Zhilin, M., Savchenko, S., Hansen, S., Heussner, K.-U. &amp; Terberger, T. (2018). Early art in the Urals: new research on the wooden sculpture from Shigir. Antiquity 92(362): 334–350. <a href="https://doi.org/10.15184/aqy.2018.48" target="_blank" rel="noopener">doi:10.15184/aqy.2018.48</a></li><li>Terberger, T., Zhilin, M. &amp; Savchenko, S. (2021). The Shigir idol in the context of early art in Eurasia. Quaternary International 573: 14–29. <a href="https://doi.org/10.1016/j.quaint.2020.10.025" target="_blank" rel="noopener">doi:10.1016/j.quaint.2020.10.025</a></li><li>Koksharov, S. F. (2021). A new subject in the study of the Great Shigir Idol. Quaternary International 573: 30–37. <a href="https://doi.org/10.1016/j.quaint.2020.05.034" target="_blank" rel="noopener">doi:10.1016/j.quaint.2020.05.034</a></li><li>Bobrov, V. (2021). Shigir idol: origin of monumental sculpture and ideas about the ways of preservation of the representational tradition. Quaternary International 573: 38–48. <a href="https://doi.org/10.1016/j.quaint.2020.08.041" target="_blank" rel="noopener">doi:10.1016/j.quaint.2020.08.041</a></li><li>Chairkina, N. M. (2014). Anthropomorphic wooden figures from the Trans-Urals. Archaeology, Ethnology and Anthropology of Eurasia 42(1): 84 ff.</li><li>Dietrich, O., Heun, M., Notroff, J., Schmidt, K. &amp; Zarnkow, M. (2012). The role of cult and feasting in the emergence of Neolithic communities: new evidence from Göbekli Tepe, south-eastern Turkey. Antiquity 86(333): 674–695. <a href="https://doi.org/10.1017/S0003598X00047840" target="_blank" rel="noopener">doi:10.1017/S0003598X00047840</a></li><li>Rasmussen, S. O. et al. (2006). A new Greenland ice core chronology for the last glacial termination. Journal of Geophysical Research 111: D06102. <a href="https://doi.org/10.1029/2005JD006079" target="_blank" rel="noopener">doi:10.1029/2005JD006079</a></li><li>McKie, R. (2018). Carved idol from the Urals shatters expert views on birth of ritual art. The Guardian, 20 May 2018.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-shigir-idol" data-t="The Shigir Idol: A Wooden Giant Older Than Göbekli Tepe"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Shigir Idol: A Wooden Giant Older Than Göbekli Tepe</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-shigir-idol</span> (updated 25 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-oklo-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Gabon Geology Oklo.svg" data-cap="Geology of the Oklo natural reactors, Gabon" data-big><figcaption></figcaption></figure><div class="sh-k">Mysteries of the Earth</div><h2 class="sh-t" id="case-oklo-st" tabindex="-1">Oklo: The Two-Billion-Year-Old Nuclear Reactors</h2><p class="sh-s">In 1972 French engineers found uranium that had already been burned. The reactor that burned it had shut down two billion years earlier.</p><div class="sh-v"><span class="vstamp vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><p class="sh-claim"><b>What the stamp rates:</b> The Oklo reactors were entirely natural, formed and run by geology and groundwater without any intelligent design.</p></div><p class="v4-q">Who, or what, ran nuclear reactors in Gabon two billion years ago?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>In 1972, uranium ore from Oklo in Gabon came up short of the isotope that powers reactors.</li><li>The missing uranium had been split: the ore holds the leftovers of nuclear fission in exactly the right proportions.</li><li>Two billion years ago, when natural uranium was rich enough, groundwater started chain reactions that ran for hundreds of thousands of years.</li><li>The mechanism was predicted in 1956, before anyone knew Oklo existed.</li><li>Nature built a reactor; no manufactured material has ever been found there.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Physics</span><span class="thr">Chemistry</span><span class="thr">Geology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="0.717" data-dec="3">0.717</b><span class="ctr-u"> %</span></div><div class="ctr-l">uranium-235 in the first suspicious Oklo sample (normal: 0.720%)</div><div class="ctr-c">Meshik 2005</div></div><div class="ctr"><div class="ctr-v">at least <b class="ctr-n" data-v="16" >16</b><span class="ctr-u"> zones</span></div><div class="ctr-l">natural reactor zones identified in the Franceville basin</div><div class="ctr-c">Gauthier-Lafaye et al. 1996; Meshik 2005</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="30" >30<
