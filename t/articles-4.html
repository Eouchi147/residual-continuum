x-t-b wx-halo" x="700" y="252" text-anchor="end">drowned: town,</text><text class="wx-t-b wx-halo" x="700" y="268" text-anchor="end">port and fields</text></g><g class="wx-st wx-hide" data-s="3"><path class="wx-hl wx-draw" pathLength="1" d="M575,324 V220" marker-end="url(#lost-civilization-f1-ah)"/></g><g><rect class="wx-ice wx-edge" x="630" y="60" width="26" height="110" rx="4"/><path class="wx-thin" d="M630,70h26"/><path class="wx-thin" d="M630,81h26"/><path class="wx-thin" d="M630,92h26"/><path class="wx-thin" d="M630,103h26"/><path class="wx-thin" d="M630,114h26"/><path class="wx-thin" d="M630,125h26"/><path class="wx-thin" d="M630,136h26"/><path class="wx-thin" d="M630,147h26"/><path class="wx-thin" d="M630,158h26"/><text class="wx-t-s" x="643" y="54" text-anchor="middle">Greenland ice</text></g><g class="wx-st wx-hide" data-s="4"><rect class="wx-accfill wx-o60" x="630" y="132" width="26" height="12"/><text class="wx-t-b wx-halo" x="624" y="142" text-anchor="end">metal-smelting</text><text class="wx-t-b wx-halo" x="624" y="156" text-anchor="end">pollution?</text></g><g class="wx-st wx-hide" data-s="4"><path class="wx-line wx-s3" d="M350,88 q4,-8 8,0"/><path class="wx-line wx-s3" d="M358,88 q4,8 8,0"/><path class="wx-line wx-s3" d="M366,88 q4,-8 8,0"/><path class="wx-line wx-s3" d="M374,88 q4,8 8,0"/><path class="wx-line wx-s3" d="M382,88 q4,-8 8,0"/><path class="wx-line wx-s3" d="M390,88 q4,8 8,0"/><path class="wx-line wx-s3" d="M398,88 q4,-8 8,0"/><path class="wx-line wx-s3" d="M406,88 q4,8 8,0"/><text class="wx-t-b wx-halo" x="382" y="72" text-anchor="middle">domestication genes</text><text class="wx-t-s wx-halo" x="382" y="112" text-anchor="middle">carried in living crops</text></g><g class="wx-st wx-hide" data-s="4"><circle class="wx-hl" cx="62" cy="116" r="22"/><circle class="wx-hl" cx="330" cy="206" r="22"/><path class="wx-hl wx-dash" d="M338,186 L360,108" marker-end="url(#lost-civilization-f1-ah)"/></g><g class="wx-st wx-hide" data-only="1"><g><circle class="wx-num" cx="28" cy="450" r="9"/><text class="wx-numt" x="28" y="454" text-anchor="middle">1</text></g><text class="wx-t-b" x="44" y="454">What Ice Age people did leave:</text><text class="wx-t" x="44" y="471">painted caves, mammoth-bone houses, hearths and tools, found by the thousand.</text></g><g class="wx-st wx-hide" data-only="2"><g><circle class="wx-num" cx="28" cy="450" r="9"/><text class="wx-numt" x="28" y="454" text-anchor="middle">2</text></g><text class="wx-t-b" x="44" y="454">What a civilisation would add:</text><text class="wx-t" x="44" y="471">quarries and mines, crop fields, towns, ports and ships.</text></g><g class="wx-st wx-hide" data-only="3"><g><circle class="wx-num" cx="28" cy="450" r="9"/><text class="wx-numt" x="28" y="454" text-anchor="middle">3</text></g><text class="wx-t-b" x="44" y="454">The sea rises about 120 m:</text><text class="wx-t" x="44" y="471">coastal towns and ports vanish under water and sediment.</text></g><g class="wx-st wx-hide" data-only="4"><g><circle class="wx-num" cx="28" cy="450" r="9"/><text class="wx-numt" x="28" y="454" text-anchor="middle">4</text></g><text class="wx-t-b" x="44" y="454">What drowning cannot erase:</text><text class="wx-t" x="44" y="471">inland quarries and mines, crop genes, pollution in ice cores.</text></g><g class="wx-st wx-hide" data-only="5"><g><circle class="wx-num" cx="28" cy="450" r="9"/><text class="wx-numt" x="28" y="454" text-anchor="middle">5</text></g><text class="wx-t-b" x="44" y="454">What we find: domesticated crop genes</text><text class="wx-t" x="44" y="471">from c. 11,000 years ago, metal pollution only in the last few thousand.</text></g><g class="wx-st wx-hide" data-only="5"><text class="wx-t-b wx-t-a wx-halo" x="424" y="92">none older than</text><text class="wx-t-b wx-t-a wx-halo" x="424" y="106">c. 11,000 yrs</text><text class="wx-t-b wx-t-a wx-halo" x="643" y="188" text-anchor="middle">none before</text><text class="wx-t-b wx-t-a wx-halo" x="643" y="202" text-anchor="middle">the metal ages</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> What Ice Age people did leave: caves, mammoth-bone houses, hearths and tools, found by the thousand.</p><ol class="wx-steplist"><li>What Ice Age people did leave: caves, mammoth-bone houses, hearths and tools, found by the thousand.</li><li>What a civilisation would add: quarries and mines, crop fields, towns, ports and ships.</li><li>The sea rises about 120 m and drowns the coastal plain, with its towns, fields and ports.</li><li>What drowning cannot erase: inland quarries and mines, crop genes in living plants, pollution in ice cores.</li><li>What we find: domestication only from about 11,000 years ago, and metal pollution only in the metal ages.</li></ol><figcaption>A schematic landscape from inland hills to the Ice Age shore. Tap through what foragers left, what a civilisation would add, what the rising sea would hide, and what should survive anyway. <span class="wx-src">Based on: Schematic, not to scale. Based on the argument set out by Flint Dibble (2024) and on Larson et al. 2014 (domestication), Hong et al. 1994 (ancient lead pollution in Greenland ice) and Lambeck et al. 2014 (sea level).</span></figcaption><p class="vh">A schematic cross-section of land sloping from inland hills on the left, across a coastal plain, to the sea of 20,000 years ago on the right, with today&#x27;s sea level marked by a dashed line partway down the slope and a Greenland ice core drawn at top right. Step 1 shows a painted cave, mammoth-bone houses, a hearth and tools on the inland slopes. Step 2 adds a quarry and mines on the hills, crop fields, a coastal town and a port with a ship. Step 3 fills the coastal plain with water up to today&#x27;s sea level, drowning the town, fields and port, with an arrow showing the 120 metre rise. Step 4 circles the inland quarry and the fields and adds symbols for domestication genes in living crops and for metal pollution in the ice core. Step 5 adds the findings: no domesticated crop genes older than about 11,000 years and no metal pollution before the metal ages.</p></figure><p>His sharpest point was about plants. A civilisation able to build cities and support specialists would need a reliable food supply, almost certainly farming. Domesticated crops are genetically and physically different from their wild ancestors: cereals that no longer scatter their seeds, larger grains, altered genes. Those changes persist wherever the crops go, even after the farmers vanish. Yet the genomes and archaeological remains of wheat, barley, rice, maize and the rest point to domestication beginning only after about 11,500 years ago, in several separate places. Dibble also stressed the missing material traces: tens of thousands of excavated Late Pleistocene sites, and not one tool, pot, metal object or trade good from an unknown advanced culture, nor any resource extraction on the scale civilisation requires.</p><aside class="wcall"><b>How do we know when crops were domesticated?</b><p>Archaeobotanists study charred seeds from dated layers. In wild wheat and barley the ear shatters to scatter its seed; in domesticated forms it stays intact, leaving a rough scar at the joint that can be seen under the microscope. Geneticists compare living crops with their wild relatives to trace when and where the domestic lines split. Both methods agree: domestication was a slow process that began after the end of the Ice Age (Larson et al. 2014).</p></aside><p>Hancock replied that absence of evidence is not evidence of absence, that most of the relevant land is underwater or unexcavated, and that his civilisation need not have been agricultural or industrial in a modern sense. Many listeners, including some of Hancock&#x27;s admirers, judged that Dibble had the better of the evidence.</p></section><section class="wsec" id="lost-civilization-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What time could erase, and what it could not</h3><p>Honesty cuts both ways. Rising seas could erase ports, towns and ships. Twelve thousand years of rot could erase wood, cloth and rope. What they could not easily erase are inland quarries and mines, the genetic legacy of domesticated plants and animals, and chemical traces in ice cores: lead pollution from Greek and Roman mining shows up clearly in Greenland ice, but nothing comparable appears in the Ice Age layers. A lost civilisation small and knowledge-based enough to leave none of these traces is possible in principle, but it would also be hard to tell apart from the capable foragers we already know.</p><p>So what would a lost civilisation have to look like to fit the evidence we have? It would need to be small enough, or coastal enough, that almost all its settlements drowned. It would need to live without farming, or with farming that never spread and left no feral crops. It would need to work stone without inland quarries anyone has found, and to teach survivors things that left no new tools, pots or genes in their camps. Hancock has moved towards exactly this picture: a civilisation of knowledge, astronomy and ritual rather than of industry. That version is harder to rule out. It is also harder to test, and the harder an idea is to test, the less weight it can carry as history.</p><aside class="wcall"><b>Fresh from the field</b><p>Two pillars of the case have weakened recently. In October 2023 Danny Hilman Natawidjaja and colleagues claimed that Gunung Padang in Java was a buried pyramid whose first stages dated back to around 25,000 BCE. In March 2024 the journal retracted the paper because the radiocarbon dates came from soil that showed no reliable sign of human work; the authors disagreed. And the Younger Dryas impact hypothesis has suffered retractions of key papers in 2025 and 2026 (see our case on the Younger Dryas comet).</p></aside></section><section class="wsec" id="lost-civilization-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>An honest weighing</h3><p>Hancock deserves credit for asking questions that archaeology was slow to ask. He was early to stress the importance of drowned landscapes, of the Younger Dryas as a human catastrophe, and of how old and ambitious Göbekli Tepe really is. In the Americas, the experts he criticised really did hold on to Clovis-first for too long. A field that dismissed him with sneers rather than evidence did itself no favours.</p><p>But on the central claim, the evidence points the other way. Every line that should carry a civilisation&#x27;s signature through a flood, from genes to quarries to ice, is silent before the Holocene. The fair verdict is awaiting discovery. What would change it is clear and testable: a drowned site with unmistakable architecture or metal, domesticated crops older than 12,900 years, or ancient DNA revealing a population of teachers. Until one of those turns up, the lost civilisation remains a question, and a good one, rather than a chapter of history.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">10,900 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Younger Dryas begins: Hancock&#x27;s proposed catastrophe</span></li><li class="wtl-build" style="--i:1"><span class="wtl-y">9,500 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Göbekli Tepe begun by hunter-gatherers</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">8,500 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Domesticated cereals established in the Fertile Crescent</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">1995 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Fingerprints of the Gods published</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">2015 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Magicians of the Gods ties the theory to the Younger Dryas impact</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">2022 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Ancient Apocalypse on Netflix; SAA open letter</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2024 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Gunung Padang paper retracted; Hancock and Dibble debate on Joe Rogan</span></li></ol><details class="srcs"><summary>Sources for this case (15)</summary><ol><li>Hancock G. (1995). Fingerprints of the Gods. Heinemann.</li><li>Hancock G. (2015). Magicians of the Gods. Coronet.</li><li>Hancock G. (2019). America Before: The Key to Earth&#x27;s Lost Civilization. St. Martin&#x27;s Press.</li><li>Dibble F. (2024). Why I talked to pseudoarchaeologist Graham Hancock on Joe Rogan. SAPIENS / ZME Science.</li><li>The Joe Rogan Experience #2136: Graham Hancock and Flint Dibble (16 April 2024).</li><li>Larson G. et al. (2014). Current perspectives and the future of domestication studies. PNAS 111(17): 6139–6146. <a href="https://doi.org/10.1073/pnas.1323964111" target="_blank" rel="noopener">doi:10.1073/pnas.1323964111</a></li><li>Lambeck K., Rouby H., Purcell A., Sun Y., Sambridge M. (2014). Sea level and global ice volumes from the Last Glacial Maximum to the Holocene. PNAS 111(43): 15296–15303. <a href="https://doi.org/10.1073/pnas.1411762111" target="_blank" rel="noopener">doi:10.1073/pnas.1411762111</a></li><li>Hong S., Candelone J.-P., Patterson C. C., Boutron C. F. (1994). Greenland ice evidence of hemispheric lead pollution two millennia ago by Greek and Roman civilizations. Science 265: 1841–1843. <a href="https://doi.org/10.1126/science.265.5180.1841" target="_blank" rel="noopener">doi:10.1126/science.265.5180.1841</a></li><li>Schmidt K. (2010). Göbekli Tepe: the Stone Age sanctuaries. New results of ongoing excavations. Documenta Praehistorica 37: 239–256. <a href="https://doi.org/10.4312/dp.37.21" target="_blank" rel="noopener">doi:10.4312/dp.37.21</a></li><li>Clarkson C. et al. (2017). Human occupation of northern Australia by 65,000 years ago. Nature 547: 306–310. <a href="https://doi.org/10.1038/nature22968" target="_blank" rel="noopener">doi:10.1038/nature22968</a></li><li>Holliday V. T. et al. (2023). Comprehensive refutation of the Younger Dryas Impact Hypothesis (YDIH). Earth-Science Reviews 247: 104502. <a href="https://doi.org/10.1016/j.earscirev.2023.104502" target="_blank" rel="noopener">doi:10.1016/j.earscirev.2023.104502</a></li><li>Natawidjaja D. H. et al. (2023). Geo-archaeological prospecting of Gunung Padang buried prehistoric pyramid in West Java, Indonesia. Archaeological Prospection. Retracted 18 March 2024 (retraction notice doi 10.1002/arp.1932). <a href="https://doi.org/10.1002/arp.1912" target="_blank" rel="noopener">doi:10.1002/arp.1912</a></li><li>Walker M. et al. (2009). Formal definition and dating of the GSSP for the base of the Holocene using the Greenland NGRIP ice core. Journal of Quaternary Science 24(1): 3–17. <a href="https://doi.org/10.1002/jqs.1227" target="_blank" rel="noopener">doi:10.1002/jqs.1227</a></li><li>Cory I. P. (1832). Ancient Fragments (Berossus on Oannes). William Pickering.</li><li>Society for American Archaeology (2022). Open letter to Netflix regarding Ancient Apocalypse, 2 December 2022.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-lost-civilization" data-t="Was There a Lost Ice Age Civilisation?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Was There a Lost Ice Age Civilisation?</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-lost-civilization</span> (updated 25 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-younger-dryas-impact-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Murray Springs Clovis site, Clanton clay black mat 1.JPG" data-cap="Murray Springs Clovis site, San Pedro Valley, Arizona, USA" data-big><figcaption></figcaption></figure><div class="sh-k">Lost Ice Age World</div><h2 class="sh-t" id="case-younger-dryas-impact-st" tabindex="-1">The Younger Dryas Comet: Did the Sky Fall 12,900 Years Ago?</h2><p class="sh-s">Just as the Ice Age was ending, the world lurched back into the cold. A bold team says a comet did it; most specialists disagree.</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> A comet impact or airburst swarm around 12,800 years ago triggered the Younger Dryas cooling and the end of the Clovis world.</p></div><p class="v4-q">Did a cosmic impact trigger the Younger Dryas cold and end the Clovis world?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>About 12,900 years ago, just as the Ice Age was ending, the world plunged back into cold for 1,200 years.</li><li>One group of scientists blames a comet: blasts over North America, fires, the end of the mammoths.</li><li>There are clues: a platinum spike in Greenland ice, a dark layer over the last mammoth bones.</li><li>But no crater of the right age, markers other teams cannot reproduce, a volcanic explanation for the platinum, and key papers retracted.</li><li>The cold is real; most specialists blame meltwater stalling the ocean; the comet awaits evidence.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Climate</span><span class="thr">Geology</span><span class="thr">Physics</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="1200" >1,200</b><span class="ctr-u"> years</span></div><div class="ctr-l">length of the Younger Dryas cold interval</div><div class="ctr-c">Greenland ice cores</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="45" >45</b><span class="ctr-u"> years</span></div><div class="ctr-l">gap between the onset of cooling and the start of the Greenland platinum spike, in a 2025 re-analysis</div><div class="ctr-c">Green et al. 2025</div></div><div class="ctr"><div class="ctr-v">over <b class="ctr-n" data-v="2200" >2,200</b><span class="ctr-u"> °C</span></div><div class="ctr-l">melting temperature claimed for glass at Abu Hureyra</div><div class="ctr-c">Moore et al. 2020</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="3" >3</b><span class="ctr-u"> papers</span></div><div class="ctr-l">impact papers retracted in 2025–2026</div><div class="ctr-c">Scientific Reports; PLOS ONE</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>A comet impact or airburst swarm around 12,800 years ago triggered the Younger Dryas cooling and the end of the Clovis world.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The Younger Dryas, the megafaunal losses and the end of Clovis are real. The link to an impact is not established. Core markers have not been reproduced by independent teams, many boundary ages are insecure, the platinum spike now has a strong volcanic explanation, and several flagship papers have been retracted for problems with data or dating. The proposers dispute these judgments, and a cosmic event cannot be excluded in principle, but at present the physical evidence does not carry the claim.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks usually say that meltwater weakened the Atlantic circulation and the Younger Dryas followed. That is the best-supported explanation, but its details (which route the water took, and when) are still argued over, so the textbook tone is a little too settled. On the impact itself, textbooks either skip it or dismiss it, and there they are close to the evidence.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>The Younger Dryas was real and abrupt: about 12,900 years ago the North Atlantic region plunged back towards glacial cold for some 1,200 years, ending about 11,700 years ago.<small>Greenland ice cores; Walker et al. 2009</small></li><li>Across North America the Clovis style of stone tools disappears around the same time, and many large mammals, including mammoths, mastodons and native horses, vanish within a few centuries of it.<small>Waters et al. 2020; Meltzer 2009</small></li><li>At many western US sites a dark organic &#x27;black mat&#x27; layer lies directly on top of the last Clovis and mammoth remains.<small>Haynes 2008, PNAS</small></li><li>A platinum anomaly appears in the GISP2 Greenland ice core close to the onset of the Younger Dryas.<small>Petaev et al. 2013, PNAS</small></li><li>Several key impact papers have been retracted: the Tall el-Hammam &#x27;Sodom&#x27; airburst paper (April 2025) and two PLOS ONE papers, including the 2025 shocked-quartz study (February 2026).<small>Scientific Reports 2025; PLOS ONE 2026</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether spherules, nanodiamonds, melt glass and metal spikes really peak in one thin layer of the same age on several continents.</li><li>Whether the Greenland platinum anomaly came from space or, as Green and colleagues argued in 2025, from Icelandic volcanic eruptions starting about 45 years after the cold began.</li><li>What triggered the cooling: the standard answer is a flood of glacial meltwater that weakened Atlantic ocean circulation, but the route and timing of that water are still debated.</li><li>Whether melted glass at Abu Hureyra in Syria and markers at Pilauco in Chile record an impact or ordinary burning.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>A crater of the right age. Greenland&#x27;s Hiawatha crater, once suggested, was dated in 2022 to about 58 million years ago.</li><li>Many boundary layers were sampled decades ago or have eroded; independent re-sampling of the same sections is limited.</li><li>Abu Hureyra itself lies under Lake Assad, flooded after its excavation in 1972–73, so no one can dig there again.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Most geologists, archaeologists and impact physicists think the Younger Dryas Impact Hypothesis has failed its tests. Independent teams did not find the claimed nanodiamonds or spherule peaks, dated boundary layers often turned out to be the wrong age, and many &#x27;markers&#x27; also occur in ordinary sediments. The cold snap is better explained by changes in ocean circulation, and the megafaunal extinctions by a mix of climate change and human hunting. Holliday and colleagues&#x27; 2023 review called the hypothesis comprehensively refuted.</p><ul><li>Spherules, charcoal and black mats occur at many times, not just 12,800 years ago (Surovell et al. 2009; Pigati et al. 2012).</li><li>Only a few of the claimed boundary sites have secure ages at the right moment (Meltzer et al. 2014).</li><li>No crater, and no plausible physics for continent-wide airbursts that leave the claimed melt, has been demonstrated.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Since 2007 the Comet Research Group has argued that a fragmenting comet showered the Northern Hemisphere with airbursts and impacts about 12,800 years ago. They point to a thin boundary layer at dozens of sites on four continents holding magnetic spherules, nanodiamonds, melt glass, platinum and soot, to a Greenland platinum spike and to evidence of widespread burning. The event, they argue, set off the Younger Dryas, helped wipe out the megafauna and broke the Clovis culture. Martin Sweatman links it to carvings at Göbekli Tepe, and Graham Hancock makes it the catastrophe that destroyed his lost civilisation.</p><ul><li>Markers have been reported by several labs at sites from California and Arizona to Syria, Chile and Europe.</li><li>Bayesian modelling of boundary ages suggests a single moment around 12,835–12,735 years ago (Kennett et al. 2015).</li><li>The timing matches three dramatic changes at once: climate, megafauna and Clovis.</li></ul><div class="face-s"><b>Its strongest point</b><p>Something abrupt and far-reaching happened around 12,900 years ago: climate flipped, great animals disappeared and a continent-wide culture ended. A single sudden trigger is an economical explanation, and the platinum anomaly in Greenland ice sits close to that moment.</p></div><p class="face-cr"><b>Credit</b> The Comet Research Group (Richard Firestone, Allen West, James Kennett, Andrew Moore, Wendy Wolbach and others); Martin Sweatman; popularised by Randall Carlson and Graham Hancock</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Blind, multi-lab re-sampling of the same boundary sections, with the labs not told which layer is which.</li><li>A crater, or unambiguous shocked minerals in securely dated layers, confirmed by impact specialists outside the proposing group.</li><li>A platinum and iridium record from several ice cores and ocean cores that isolates an extraterrestrial signature from volcanic ones.</li><li>High-resolution dates showing a single synchronous layer at many sites, rather than layers spread over centuries.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,179 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Younger Dryas Comet: Did the Sky Fall 12,900 Years Ago?"><button type="button" class="wtoc-i" data-go="younger-dryas-impact-s1">The world slips back into the cold</button><button type="button" class="wtoc-i" data-go="younger-dryas-impact-s2">The comet hypothesis at its strongest</button><button type="button" class="wtoc-i" data-go="younger-dryas-impact-s3">What independent tests found</button><button type="button" class="wtoc-i" data-go="younger-dryas-impact-s4">Fresh from the field: a hard two years for the comet</button><button type="button" class="wtoc-i" data-go="younger-dryas-impact-s5">What time has hidden</button><button type="button" class="wtoc-i" data-go="younger-dryas-impact-s6">The verdict, and how to change it</button></nav></div><section class="wsec" id="younger-dryas-impact-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The world slips back into the cold</h3><p>Around 14,700 years ago the Ice Age was finally letting go. Greenland warmed by several degrees in a few decades, forests marched north and people spread across newly open land. Then, about 12,900 years ago, the warmth broke. Across the North Atlantic region temperatures plunged back towards glacial levels and stayed there for some 1,200 years. Geologists call this the Younger Dryas, after a little alpine flower, Dryas octopetala, whose pollen returns to European lake muds in the cold.</p><p>In North America, the same centuries saw the end of the Clovis culture, famous for its beautifully fluted spear points, and the disappearance of mammoths, mastodons, native horses and giant ground sloths. Three dramatic changes, close together. In 2007 a team of scientists offered one explosive explanation: the sky fell.</p><blockquote class="wpull"><p>Three dramatic changes close together invite a single sudden cause. The question is whether the ground agrees.</p></blockquote></section><section class="wsec" id="younger-dryas-impact-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The comet hypothesis at its strongest</h3><p>Richard Firestone, Allen West, James Kennett and colleagues, later known as the Comet Research Group, argued in PNAS that a fragmenting comet exploded over the Northern Hemisphere about 12,900 years ago. At Clovis sites from Arizona to the Great Lakes they reported a thin layer, just beneath the black mat, rich in magnetic grains and microspherules, carbon spherules, nanodiamonds, iridium and soot. Their reading: debris and fire from airbursts, powerful enough to shift climate and devastate animals and people.</p><figure class="wx wx--steps" id="younger-dryas-impact-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">Reading the boundary layer</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Reading the boundary layer"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" class="wx-svg" role="img" aria-labelledby="younger-dryas-impact-f1-t"><title id="younger-dryas-impact-f1-t">Schematic stream-bank section at a Clovis site showing the Clovis surface, the black mat and the claimed impact layer, step by step</title><defs><marker id="younger-dryas-impact-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker><marker id="younger-dryas-impact-f1-ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text class="wx-t-cap" x="24" y="28">Reading the Younger Dryas boundary · schematic section after Murray Springs, Arizona</text><rect class="wx-sky" x="40" y="50" width="380" height="20"/><rect class="wx-soil" x="40" y="70" width="380" height="202"/><path class="wx-guide" d="M40,110C160,104 280,116 420,110"/><path class="wx-guide" d="M40,150C160,144 280,156 420,150"/><path class="wx-guide" lovis point,</text><text class="wx-t" x="452" y="132">about 12,900 years old.</text><text class="wx-t-m" x="452" y="149">Then the Clovis style vanishes</text><text class="wx-t-m" x="452" y="166">from the record.</text></g><g class="wx-st wx-hide" data-only="3"><text class="wx-t-h" x="452" y="76">The black mat</text><text class="wx-t" x="452" y="98">A dark, organic-rich layer</text><text class="wx-t" x="452" y="115">drapes the Clovis surface.</text><text class="wx-t" x="452" y="132">It formed in wet, spring-fed</text><text class="wx-t" x="452" y="149">ground as the Younger Dryas</text><text class="wx-t" x="452" y="166">cold began (Haynes 2008).</text><text class="wx-t-m" x="452" y="183">No Clovis finds lie above it.</text></g><g class="wx-st wx-hide" data-only="4"><text class="wx-t-h" x="452" y="76">The claimed impact layer</text><text class="wx-t" x="452" y="98">At its base, Firestone and</text><text class="wx-t" x="452" y="115">colleagues (2007) reported</text><text class="wx-t" x="452" y="132">magnetic spherules,</text><text class="wx-t" x="452" y="149">nanodiamonds, iridium, soot</text><text class="wx-t" x="452" y="166">and melt glass, peaking in</text><text class="wx-t" x="452" y="183">a thin 'YDB' layer.</text><text class="wx-t-b" x="452" y="200">Reading: a comet airburst.</text></g><g class="wx-st wx-hide" data-only="5"><text class="wx-t-h" x="452" y="76">The critics' reading</text><text class="wx-t" x="452" y="98">Similar particles turn up in</text><text class="wx-t" x="452" y="115">other layers too; counts and</text><text class="wx-t" x="452" y="132">identifications vary between</text><text class="wx-t" x="452" y="149">labs; black mats form at many</text><text class="wx-t" x="452" y="166">dates; many 'boundary' ages</text><text class="wx-t" x="452" y="183">miss 12,800 years (Meltzer 2014;</text><text class="wx-t" x="452" y="200">Holliday et al. 2023).</text><text class="wx-t-b" x="452" y="217">Reading: normal processes.</text></g><g class="wx-st wx-hide" data-only="3"><path class="wx-hl" d="M32,266V296"/><text class="wx-t" x="28" y="285"></text></g><g class="wx-st wx-hide" data-s="4"><circle class="wx-glow wx-edge" cx="49.9" cy="294.4" r="2.6"/><circle class="wx-glow wx-edge" cx="65.2" cy="294.6" r="2.6"/><circle class="wx-glow wx-edge" cx="76.5" cy="295.6" r="2.6"/><circle class="wx-glow wx-edge" cx="97.3" cy="297.2" r="2.6"/><circle class="wx-glow wx-edge" cx="110.1" cy="294.9" r="2.6"/><circle class="wx-glow wx-edge" cx="122.3" cy="295.1" r="2.6"/><circle class="wx-glow wx-edge" cx="133.4" cy="294.4" r="2.6"/><circle class="wx-glow wx-edge" cx="147.7" cy="297.7" r="2.6"/><circle class="wx-glow wx-edge" cx="166.6" cy="297.2" r="2.6"/><circle class="wx-glow wx-edge" cx="180.4" cy="294.8" r="2.6"/><circle class="wx-glow wx-edge" cx="190.5" cy="296.5" r="2.6"/><circle class="wx-glow wx-edge" cx="207.9" cy="297.4" r="2.6"/><circle class="wx-glow wx-edge" cx="223" cy="294.3" r="2.6"/><circle class="wx-glow wx-edge" cx="234.8" cy="296.7" r="2.6"/><circle class="wx-glow wx-edge" cx="248" cy="294.7" r="2.6"/><circle class="wx-glow wx-edge" cx="261.8" cy="294.4" r="2.6"/><circle class="wx-glow wx-edge" cx="279.5" cy="297.5" r="2.6"/><circle class="wx-glow wx-edge" cx="290.4" cy="295.2" r="2.6"/><circle class="wx-glow wx-edge" cx="307.3" cy="296.3" r="2.6"/><circle class="wx-glow wx-edge" cx="321.1" cy="297.4" r="2.6"/><circle class="wx-glow wx-edge" cx="332.1" cy="295.7" r="2.6"/><circle class="wx-glow wx-edge" cx="346.8" cy="295.7" r="2.6"/><circle class="wx-glow wx-edge" cx="357.3" cy="295.2" r="2.6"/><circle class="wx-glow wx-edge" cx="376.5" cy="294.2" r="2.6"/><circle class="wx-glow wx-edge" cx="384.4" cy="296.5" r="2.6"/><circle class="wx-glow wx-edge" cx="400.2" cy="296.1" r="2.6"/></g><g class="wx-st wx-hide" data-only="4"><path class="wx-hl" d="M446,178L390,296" marker-end="url(#younger-dryas-impact-f1-ah)"/></g><g class="wx-st wx-hide" data-s="5"><circle class="wx-glow wx-edge" cx="219.9" cy="164.6" r="2.4"/><circle class="wx-glow wx-edge" cx="77.4" cy="361.5" r="2.4"/><circle class="wx-glow wx-edge" cx="151.3" cy="370.3" r="2.4"/><circle class="wx-glow wx-edge" cx="277.3" cy="145.8" r="2.4"/><circle class="wx-glow wx-edge" cx="303.3" cy="156.1" r="2.4"/><circle class="wx-glow wx-edge" cx="97" cy="241.5" r="2.4"/><circle class="wx-glow wx-edge" cx="69.1" cy="381.9" r="2.4"/><circle class="wx-glow wx-edge" cx="312.7" cy="313.4" r="2.4"/><circle class="wx-glow wx-edge" cx="167.2" cy="139.9" r="2.4"/><circle class="wx-glow wx-edge" cx="157.3" cy="144.9" r="2.4"/><circle class="wx-glow wx-edge" cx="142" cy="197.8" r="2.4"/><circle class="wx-glow wx-edge" cx="181.9" cy="340.5" r="2.4"/><circle class="wx-glow wx-edge" cx="405" cy="194.3" r="2.4"/><circle class="wx-glow wx-edge" cx="203.2" cy="147" r="2.4"/><circle class="wx-glow wx-edge" cx="313.5" cy="197.4" r="2.4"/><circle class="wx-glow wx-edge" cx="246.3" cy="195.7" r="2.4"/><circle class="wx-glow wx-edge" cx="97" cy="372.4" r="2.4"/><circle class="wx-glow wx-edge" cx="283.4" cy="327.7" r="2.4"/></g><text class="wx-t wx-halo" x="50" y="90">Holocene deposits (last c. 12,000 years)</text><text class="wx-t-b wx-t-w" x="50" y="287">black mat</text><text class="wx-t wx-halo" x="50" y="340">older sands and gravels</text><text class="wx-t-m wx-halo" x="50" y="390">Pleistocene</text><text class="wx-t-s" x="40" y="426">Not to scale horizontally; layer thicknesses indicative only.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> The section: layers laid down over the last 15,000 years, oldest at the bottom.</p><ol class="wx-steplist"><li>The section: layers laid down over the last 15,000 years, oldest at the bottom.</li><li>The Clovis surface: mammoth bones and a Clovis point, about 12,900 years old.</li><li>The black mat drapes the Clovis surface: wet, spring-fed ground as the cold began.</li><li>The impact team&#x27;s reading: a thin boundary layer rich in spherules, nanodiamonds, metals and soot.</li><li>The critics&#x27; reading: similar particles occur at other levels, and many boundary ages do not match.</li></ol><figcaption>A simplified stream-bank section like those at Clovis sites in Arizona. Tap through the layers, then the two rival readings of the thin layer at the base of the black mat. <span class="wx-src">Based on: Schematic after descriptions of Murray Springs and other Clovis sites (Haynes 2008; Firestone et al. 2007; Holliday et al. 2023). Layer thicknesses are indicative only; particle positions are illustrative, not data.</span></figcaption><p class="vh">A schematic vertical section through sediments. At the top, grass over thick pale Holocene deposits. Below them a dark band labelled black mat, then pale older sands and gravels. Step 1 introduces the section. Step 2 shows mammoth bones and a Clovis point on the surface directly beneath the black mat. Step 3 highlights the black mat, which formed in wet ground at the start of the Younger Dryas. Step 4 highlights a thin orange layer at the base of the mat dotted with particles, labelled as the claimed impact layer with spherules, nanodiamonds, iridium, soot and melt glass. Step 5 scatters similar particles through the other layers, representing the critics&#x27; finding that such particles are not confined to one level.</p></figure><p>The team kept adding lines of evidence. In 2013 Michail Petaev and colleagues found a platinum anomaly in the GISP2 Greenland ice core near the start of the cold. In 2015 Kennett&#x27;s group used Bayesian statistics to argue that boundary ages from many sites fit one moment, about 12,835 to 12,735 years ago. Wendy Wolbach and colleagues (2018) proposed a burst of biomass burning worldwide. Mario Pino&#x27;s team (2019) reported markers at Pilauco in southern Chile, and in 2020 Andrew Moore and colleagues described glass at Abu Hureyra in Syria that they said had melted at over 2,200 °C, hotter than any hearth or house fire.</p><aside class="wcall"><b>Abu Hureyra: a village at the edge of the cold</b><p>Abu Hureyra, on the Euphrates, was home to some of the world&#x27;s earliest villagers, foragers who also gathered and perhaps began to cultivate wild cereals. Andrew Moore excavated it in 1972–73, just before the Tabqa Dam flooded it under Lake Assad. His 2020 team argued that melted glass on bones, seeds and building material shows an airburst struck the village. People lived on at the site afterwards, so even on this reading it was not an extinction event.</p></aside><p>The hypothesis also spread beyond geology. The chemical engineer Martin Sweatman has argued that carvings on Göbekli Tepe&#x27;s Pillar 43, the &#x27;Vulture Stone&#x27;, record the sky at the time of the impact, a reading most archaeologists reject. Randall Carlson and Graham Hancock made the comet the catastrophe that ended the Ice Age world in books, podcasts and Netflix&#x27;s Ancient Apocalypse, turning a technical dispute into one of the best-known ideas in popular prehistory.</p></section><section class="wsec" id="younger-dryas-impact-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>What independent tests found</h3><p>Extraordinary claims draw testers, and the testers mostly came back empty-handed. Todd Surovell&#x27;s team (2009) looked for the spherule peak at boundary sites and did not find it. Tyrone Daulton&#x27;s group (2010) looked for the nanodiamonds and found none; other researchers identified some &#x27;carbon spherules&#x27; as fungal bodies or insect droppings. Nicholas Pinter and colleagues (2011) titled their review &#x27;The Younger Dryas impact hypothesis: a requiem&#x27;. David Meltzer and colleagues (2014) examined the dating of 29 claimed boundary sites and argued that only a handful had reliable ages at the right moment.</p><p>The glass at Abu Hureyra has a rival explanation too. Peter Thy and colleagues (2015) found similar glassy droplets at northern Syrian sites of several different ages and argued that they form when mud-brick and reed buildings burn, melting silica-rich plant material. Black mats, meanwhile, formed at many times in the past, as Jeffrey Pigati&#x27;s team showed in 2012, because they record wet, spring-fed ground, not fire from the sky.</p><figure class="wx wx--static" id="younger-dryas-impact-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">Twenty years of the comet debate</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Twenty years of the comet debate"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" class="wx-svg" role="img" aria-labelledby="younger-dryas-impact-f2-t"><title id="younger-dryas-impact-f2-t">Vertical timeline from 2007 to 2026 of the main papers supporting and challenging the Younger Dryas impact hypothesis, including retractions</title><text class="wx-t-cap" x="24" y="28">Twenty years of the comet debate · selected papers</text><text class="wx-t-b wx-t-a" x="340" y="58" text-anchor="end">Evidence offered f  class="wx-thin" d="M354,578.9H342"/><text class="wx-t-b" x="338" y="577.9" text-anchor="end">Kennett et al., PLOS ONE</text><text class="wx-t-m" x="338" y="591.9" text-anchor="end">shocked quartz at Clovis sites</text><text class="wx-t-n" x="26" y="583.9">2025</text></g><g class="wx-pop" style="--d:5.4"><circle class="wx-inkfill" cx="360" cy="134.5" r="4.5"/><path class="wx-thin" d="M366,134.5H378"/><text class="wx-t-b" x="382" y="133.5">Surovell et al., PNAS</text><text class="wx-t-m" x="382" y="147.5">no spherule peak at the boundary</text><text class="wx-t-n" x="694" y="139.5" text-anchor="end">2009</text></g><g class="wx-pop" style="--d:6.0"><circle class="wx-inkfill" cx="360" cy="161.8" r="4.5"/><path class="wx-thin" d="M366,161.8H378"/><text class="wx-t-b" x="382" y="160.8">Daulton et al., PNAS</text><text class="wx-t-m" x="382" y="174.8">no nanodiamonds found</text><text class="wx-t-n" x="694" y="166.8" text-anchor="end">2010</text></g><g class="wx-pop" style="--d:6.6"><circle class="wx-inkfill" cx="360" cy="189.1" r="4.5"/><path class="wx-thin" d="M366,189.1H378"/><text class="wx-t-b" x="382" y="188.1">Pinter et al., Earth-Sci. Rev.</text><text class="wx-t-m" x="382" y="202.1">'a requiem' for the hypothesis</text><text class="wx-t-n" x="694" y="194.1" text-anchor="end">2011</text></g><g class="wx-pop" style="--d:7.2"><circle class="wx-inkfill" cx="360" cy="270.8" r="4.5"/><path class="wx-thin" d="M366,270.8H378"/><text class="wx-t-b" x="382" y="269.8">Meltzer et al., PNAS</text><text class="wx-t-m" x="382" y="283.8">most boundary ages unreliable</text><text class="wx-t-n" x="694" y="275.8" text-anchor="end">2014</text></g><g class="wx-pop" style="--d:7.8"><circle class="wx-inkfill" cx="360" cy="303.6" r="4.5"/><path class="wx-thin" d="M366,303.6H378"/><text class="wx-t-b" x="382" y="302.6">Thy et al., J. Archaeol. Sci.</text><text class="wx-t-m" x="382" y="316.6">Syrian glass from burning buildings</text><text class="wx-t-n" x="694" y="308.6" text-anchor="end">2015</text></g><g class="wx-pop" style="--d:8.4"><circle class="wx-inkfill" cx="360" cy="488.9" r="4.5"/><path class="wx-thin" d="M366,488.9H378"/><text class="wx-t-b" x="382" y="487.9">Kenny et al., Sci. Advances</text><text class="wx-t-m" x="382" y="501.9">Hiawatha crater is 58 million yrs old</text><text class="wx-t-n" x="694" y="493.9" text-anchor="end">2022</text></g><g class="wx-pop" style="--d:9.0"><circle class="wx-inkfill" cx="360" cy="518.9" r="4.5"/><path class="wx-thin" d="M366,518.9H378"/><text class="wx-t-b" x="382" y="517.9">Holliday et al., Earth-Sci. Rev.</text><text class="wx-t-m" x="382" y="531.9">'comprehensive refutation'</text><text class="wx-t-n" x="694" y="523.9" text-anchor="end">2023</text></g><g class="wx-pop" style="--d:9.6"><circle class="wx-inkfill" cx="360" cy="573.5" r="4.5"/><path class="wx-thin" d="M366,573.5H378"/><text class="wx-t-b wx-t-a" x="382" y="572.5">Tall el-Hammam paper retracted;</text><text class="wx-t-m" x="382" y="586.5">Green et al.: platinum likely volcanic</text><text class="wx-t-n" x="694" y="578.5" text-anchor="end">2025</text></g><g class="wx-pop" style="--d:10.2"><circle class="wx-inkfill" cx="360" cy="600.7" r="4.5"/><path class="wx-thin" d="M366,600.7H378"/><text class="wx-t-b wx-t-a" x="382" y="599.7">PLOS ONE retracts shocked-quartz</text><text class="wx-t-m" x="382" y="613.7">and Baffin Bay papers (Feb 2026)</text><text class="wx-t-n" x="694" y="605.7" text-anchor="end">2026</text></g></svg></div></div><figcaption>Selected papers for and against the Younger Dryas Impact Hypothesis, 2007 to 2026. Retractions are highlighted. <span class="wx-src">Based on: Publication records and retraction notices: Scientific Reports (24 April 2025), PLOS ONE (11 February 2026, doi 10.1371/journal.pone.0342620); Retraction Watch, 4 March 2026.</span></figcaption><p class="vh">A vertical timeline from 2007 at the top to 2026 at the bottom. On the left, papers offering evidence for an impact: Firestone 2007, Petaev 2013, Kennett 2015, Wolbach 2018, Pino 2019, Moore 2020, Sweatman 2021, Sweatman, Powell and West 2024, and Kennett 2025 on shocked quartz. On the right, challenges: Surovell 2009, Daulton 2010, Pinter 2011, Meltzer 2014, Thy 2015, Kenny 2022 dating the Hiawatha crater to 58 million years, Holliday 2023, the 2025 retraction of the Tall el-Hammam paper with Green&#x27;s volcanic reading of the platinum, and the February 2026 retraction of two PLOS ONE papers.</p></figure><p>In 2023 Vance Holliday and a large team of archaeologists, geologists and impact scientists published a &#x27;comprehensive refutation&#x27; in Earth-Science Reviews. In 2024 Martin Sweatman, James Powell and Allen West replied in the same journal, arguing that differences of interpretation cannot falsify a hypothesis that many peer-reviewed studies have supported. The exchange is sharp, and both sides deserve to be read in full.</p></section><section class="wsec" id="younger-dryas-impact-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Fresh from the field: a hard two years for the comet</h3><p>Recent events have gone badly for the hypothesis. In April 2025 Scientific Reports retracted the 2021 paper claiming that an airburst destroyed Tall el-Hammam in Jordan, proposed as biblical Sodom, after concerns about images, methods and data. In September 2025 Charlotte Green and colleagues re-examined the Greenland platinum and concluded that it begins some 45 to 50 years after the cooling started, lasts about 14 years, and most likely came from a volcanic fissure eruption in Iceland rather than from a meteorite.</p><p>Then, on 11 February 2026, PLOS ONE retracted two Comet Research Group papers published only months earlier: a study reporting shocked quartz at Murray Springs, Blackwater Draw and Arlington Canyon, and a study of a Baffin Bay core. The editors cited problems with the age models, incomplete sampling and data reporting. Most of the authors who responded disagreed with the retractions.</p><blockquote class="wpull"><p>A retraction does not falsify an idea. But when the flagship evidence keeps failing checks, the burden of proof grows heavier.</p></blockquote></section><section class="wsec" id="younger-dryas-impact-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>What time has hidden</h3><p>The fair-minded reader should notice what is genuinely hard here. The boundary layers are thin, often a few centimetres, and easily mixed by roots, burrowing animals and water. Many were sampled once, by one team, years ago. Abu Hureyra is underwater. Any airburst debris landing on open ground would have been reworked by 12,000 years of rain and wind. Impact specialists note that an airburst leaves no crater, which removes the most decisive kind of evidence. So absence of a crater does not settle the matter on its own.</p><p>The standard explanation has its own open questions. A flood of glacial meltwater, from Lake Agassiz or elsewhere, is thought to have weakened the Atlantic overturning circulation, but where the water went and exactly when it arrived are still argued over. Megafaunal extinction in the Americas probably involved both a changing climate and skilled human hunters, in proportions nobody can yet fix.</p></section><section class="wsec" id="younger-dryas-impact-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>The verdict, and how to change it</h3><p>The Younger Dryas, the losses of large animals and the end of Clovis are real, and they happened close together. The comet is the part that has not survived testing. Its core markers have not been independently reproduced, its dates are often insecure, its best physical signal now has a volcanic rival, and several of its flagship papers have been withdrawn. We rate the impact claim as awaiting discovery, not ruled out, because a cosmic event could in principle leave the kind of subtle traces that are hard to find.</p><p>What would change that verdict is simple to state: blind, multi-lab re-sampling of the same boundary sections; shocked minerals or an impact signature confirmed by specialists outside the proposing group; and ice and ocean cores that separate a cosmic signal from a volcanic one. If those tests come back positive, the story of the end of the Ice Age will need rewriting. So far, they have not.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">10,900 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Younger Dryas cold begins; Clovis style ends soon after</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">9,700 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Younger Dryas ends in abrupt warming</span></li><li class="wtl-find" style="--i:2"><span class="wtl-y">1973 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Abu Hureyra excavated before Lake Assad floods it</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">2007 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Firestone et al. propose the impact in PNAS</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">2011 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Pinter et al. publish &#x27;a requiem&#x27; for the hypothesis</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">2020 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Moore et al. report Abu Hureyra melt glass</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2023 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Holliday et al.: &#x27;comprehensive refutation&#x27;</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2025 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Sodom airburst paper retracted; platinum linked to Iceland</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2026 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">PLOS ONE retracts two further impact papers</span></li></ol><details class="srcs"><summary>Sources for this case (17)</summary><ol><li>Firestone R. B. et al. (2007). Evidence for an extraterrestrial impact 12,900 years ago that contributed to the megafaunal extinctions and the Younger Dryas cooling. PNAS 104(41): 16016–16021. <a href="https://doi.org/10.1073/pnas.0706977104" target="_blank" rel="noopener">doi:10.1073/pnas.0706977104</a></li><li>Surovell T. A. et al. (2009). An independent evaluation of the Younger Dryas extraterrestrial impact hypothesis. PNAS 106(43): 18155–18158. <a href="https://doi.org/10.1073/pnas.0907857106" target="_blank" rel="noopener">doi:10.1073/pnas.0907857106</a></li><li>Daulton T. L., Pinter N., Scott A. C. (2010). No evidence of nanodiamonds in Younger-Dryas sediments to support an impact event. PNAS 107(37): 16043–16047. <a href="https://doi.org/10.1073/pnas.1003904107" target="_blank" rel="noopener">doi:10.1073/pnas.1003904107</a></li><li>Pinter N. et al. (2011). The Younger Dryas impact hypothesis: a requiem. Earth-Science Reviews 106(3–4): 247–264. <a href="https://doi.org/10.1016/j.earscirev.2011.02.005" target="_blank" rel="noopener">doi:10.1016/j.earscirev.2011.02.005</a></li><li>Petaev M. I. et al. (2013). Large Pt anomaly in the Greenland ice core points to a cataclysm at the onset of Younger Dryas. PNAS 110(32): 12917–12920. <a href="https://doi.org/10.1073/pnas.1303924110" target="_blank" rel="noopener">doi:10.1073/pnas.1303924110</a></li><li>Meltzer D. J. et al. (2014). Chronological evidence fails to support claim of an isochronous widespread layer of cosmic impact indicators dated to 12,800 years ago. PNAS 111(21): E2162–E2171. <a href="https://doi.org/10.1073/pnas.1401150111" target="_blank" rel="noopener">doi:10.1073/pnas.1401150111</a></li><li>Kennett J. P. et al. (2015). Bayesian chronological analyses consistent with synchronous age of 12,835–12,735 Cal B.P. for Younger Dryas boundary on four continents. PNAS 112(32): E4344–E4353. <a href="https://doi.org/10.1073/pnas.1507146112" target="_blank" rel="noopener">doi:10.1073/pnas.1507146112</a></li><li>Thy P., Willcox G., Barfield G. H., Fuller D. Q. (2015). Anthropogenic origin of siliceous scoria droplets from Pleistocene and Holocene archaeological sites in northern Syria. Journal of Archaeological Science 54: 193–209. <a href="https://doi.org/10.1016/j.jas.2014.11.027" target="_blank" rel="noopener">doi:10.1016/j.jas.2014.11.027</a></li><li>Pino M. et al. (2019). Sedimentary record from Patagonia, southern Chile supports cosmic-impact triggering of biomass burning, climate change, and megafaunal extinctions at 12.8 ka. Scientific Reports 9: 4413.</li><li>Moore A. M. T. et al. (2020). Evidence of cosmic impact at Abu Hureyra, Syria at the Younger Dryas onset (~12.8 ka): high-temperature melting at &gt;2200 °C. Scientific Reports 10: 4185. <a href="https://doi.org/10.1038/s41598-020-60867-w" target="_blank" rel="noopener">doi:10.1038/s41598-020-60867-w</a></li><li>Holliday V. T. et al. (2023). Comprehensive refutation of the Younger Dryas Impact Hypothesis (YDIH). Earth-Science Reviews 247: 104502. <a href="https://doi.org/10.1016/j.earscirev.2023.104502" target="_blank" rel="noopener">doi:10.1016/j.earscirev.2023.104502</a></li><li>Sweatman M. B., Powell J. L., West A. (2024). Rejection of Holliday et al.&#x27;s alleged refutation of the Younger Dryas impact hypothesis. Earth-Science Reviews 258: 104960. <a href="https://doi.org/10.1016/j.earscirev.2024.104960" target="_blank" rel="noopener">doi:10.1016/j.earscirev.2024.104960</a></li><li>Green C. E., Baldini J. U. L., Brown R. J., Schmincke H.-U., Edmonds M., Meisel T. C. (2025). A possible volcanic origin for the Greenland ice core Pt anomaly near the Bølling-Allerød/Younger Dryas boundary. PLOS ONE 20(9): e0331811. <a href="https://doi.org/10.1371/journal.pone.0331811" target="_blank" rel="noopener">doi:10.1371/journal.pone.0331811</a></li><li>PLOS ONE Editors (2026). Retraction: Shocked quartz at the Younger Dryas onset (12.8 ka) supports cosmic airbursts/impacts contributing to North American megafaunal extinctions and collapse of the Clovis technocomplex. PLOS ONE. <a href="https://doi.org/10.1371/journal.pone.0342620" target="_blank" rel="noopener">doi:10.1371/journal.pone.0342620</a></li><li>Kenny G. G. et al. (2022). A Late Paleocene age for Greenland&#x27;s Hiawatha impact structure. Science Advances 8(10): eabm2434. <a href="https://doi.org/10.1126/sciadv.abm2434" target="_blank" rel="noopener">doi:10.1126/sciadv.abm2434</a></li><li>Haynes C. V. (2008). Younger Dryas &#x27;black mats&#x27; and the Rancholabrean termination in North America. PNAS 105(18): 6520–6525. <a href="https://doi.org/10.1073/pnas.0800560105" target="_blank" rel="noopener">doi:10.1073/pnas.0800560105</a></li><li>Pigati J. S. et al. (2012). Accumulation of impact markers in desert wetlands and implications for the Younger Dryas impact hypothesis. PNAS 109(19): 7208–7212. <a href="https://doi.org/10.1073/pnas.1200296109" target="_blank" rel="noopener">doi:10.1073/pnas.1200296109</a></li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-younger-dryas-impact" data-t="The Younger Dryas Comet: Did the Sky Fall 12,900 Years Ago?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Younger Dryas Comet: Did the Sky Fall 12,900 Years Ago?</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-younger-dryas-impact</span> (updated 25 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-drowned-coasts-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="MAP Sundaland.png" data-cap="Continental shelves worldwide (Sunda Shelf, North Sea, Bering Sea, Persian Gulf)" data-big><figcaption></figcaption></figure><div class="sh-k">Lost Ice Age World</div><h2 class="sh-t" id="case-drowned-coasts-st" tabindex="-1">The Drowned Coasts: A Continent&#x27;s Worth of Lost Land</h2><p class="sh-s">When the ice melted, the sea rose about 120 metres and swallowed the coasts where Ice Age people most liked to live.</p><div class="sh-v"><span class="vstamp vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><p class="sh-claim"><b>What the stamp rates:</b> Some of the most important human settlements of the late Ice Age lie undiscovered on the drowned continental shelves.</p></div><p class="v4-q">What human history lies on the seabed of the drowned Ice Age coasts?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>At the coldest point of the Ice Age the sea stood about 120 metres lower than today.</li><li>A continent&#x27;s worth of coastal plain has since drowned, and people lived on it.</li><li>Fossils, walls, villages and tools keep coming up from the seabed.</li><li>The rise was uneven: in one pulse the sea climbed about 15 metres in 350 years.</li><li>A large missing chapter is down there; so far every drowned site matches the tools known inland.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Geology</span><span class="thr">Climate</span><span class="thr">Archaeology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="120" >120</b><span class="ctr-u"> m</span></div><div class="ctr-l">approximate fall in sea level at the Last Glacial Maximum</div><div class="ctr-c">Lambeck et al. 2014</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="971" >971</b><span class="ctr-u"> m</span></div><div class="ctr-l">length of the Blinkerwall, a Stone Age stone line 21 m under the Baltic</div><div class="ctr-c">Geersen et al. 2024</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="23000" >23,000</b><span class="ctr-u"> km²</span></div><div class="ctr-l">of drowned North Sea landscape mapped from seismic data, 2003–2007</div><div class="ctr-c">Gaffney et al. 2007</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="6732" >6,732</b><span class="ctr-u"> fossils</span></div><div class="ctr-l">recovered from sand dredged out of the Madura Strait</div><div class="ctr-c">Berghuis et al. 2025</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Some of the most important human settlements of the late Ice Age lie undiscovered on the drowned continental shelves.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">That people lived on the shelves is established: fossils, walls, villages and tools keep coming up from the seabed. That the most important settlements are down there is a reasonable inference, because coasts are rich places and they are almost entirely unsearched, but it remains an inference. Every drowned site found so far matches the technology known inland, so &#x27;important&#x27; here most likely means populous and inventive rather than industrial. The evidence supports the idea of a large missing chapter, not yet its contents.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks state the land bridges and sea-level fall confidently, and rightly so. What they underplay is the consequence: prehistory is told from the uplands because the coasts are gone. Maps of early human sites look inland-heavy partly because the coastal half of the record is underwater. Here the textbooks are overconfident by omission, presenting a partial sample as if it were the whole picture.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>At the Last Glacial Maximum, about 26,000–20,000 years ago, global sea level stood roughly 120–130 m below today&#x27;s.<small>Lambeck et al. 2014, PNAS</small></li><li>The rise was uneven: during Meltwater Pulse 1A, about 14,650–14,310 years ago, the sea climbed some 14–18 m in about 350 years.<small>Deschamps et al. 2012, Nature</small></li><li>The Bering land bridge was cut by the sea about 11,000 years ago; Britain became an island around 6500 BCE as Doggerland drowned.<small>Jakobsson et al. 2017; Gaffney et al. 2007</small></li><li>Real human structures lie on the seabed: the Atlit Yam village (8–12 m down, c. 8,700–8,300 years old) and the 971 m Blinkerwall stone line in the Baltic (21 m down, over 10,000 years old).<small>Galili et al. 1993; Geersen et al. 2024, PNAS</small></li><li>In 2025 the first hominin fossils from submerged Sundaland were published: two Homo erectus skull fragments dredged from c. 32 m below sea level in the Madura Strait, dated c. 146,000–131,000 years ago.<small>Berghuis et al. 2025, Quaternary Environments and Humans</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>How many people lived on the shelves, and whether coastal populations were larger and more settled than the inland record implies.</li><li>Whether the Persian Gulf basin was a major refuge whose people reappeared, fully formed, as the new coastal villages of about 7,500 years ago (Jeffrey Rose&#x27;s &#x27;Gulf Oasis&#x27;).</li><li>Whether the 8,000-year-old wheat DNA at Bouldnor Cliff is genuine evidence of early trade or modern contamination.</li><li>Whether Sundaland hosted a precocious culture whose flooding pushed people and ideas outward (Stephen Oppenheimer, Danny Natawidjaja).</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Almost every Ice Age shoreline on Earth. Coastal camps, harbours, boats and shell middens of 20,000–8,000 years ago lie 20–120 m down, mostly unsurveyed.</li><li>Organic material on exposed or trawled seabeds: wood, fibre, hide and bone rot or are scattered unless quickly buried in mud or peat.</li><li>Sites wiped out by the waves as the shoreline swept across them, or later buried under metres of marine sediment.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Archaeologists and geologists agree the shelves were inhabited and that much of the coastal story is lost. The mainstream view is that the people who lived there were hunter-gatherers and fisher-foragers much like those known from inland sites, perhaps with richer, more settled coastal life, and that the drowned record will add detail rather than a hidden high civilisation. Submerged-landscape archaeology is a growing field that has already mapped tens of thousands of square kilometres of the North Sea and found sites wherever it has looked carefully.</p><ul><li>Every submerged site found so far (Atlit Yam, Bouldnor Cliff, the Blinkerwall, Pavlopetri) fits the technology of its time inland.</li><li>Coastal and inland people were connected; a sophisticated coastal culture should have left traces of trade, crops or technology on land that stayed dry.</li><li>Seismic mapping and coring can target old river valleys and coastlines, so the seabed is not a complete blank.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Graham Hancock&#x27;s Underworld (2002) argued that archaeologists have systematically looked in the wrong place: the richest, most populous Ice Age landscapes were the warm, well-watered coastal plains that are now underwater, and myths of drowned homelands may remember them. Stephen Oppenheimer&#x27;s Eden in the East (1998) made a similar case for Sundaland, and Jeffrey Rose&#x27;s Gulf Oasis model argues that a fertile basin under today&#x27;s Persian Gulf sheltered populations for millennia. Their shared point: the land record is a biased sample of the Ice Age, taken from the uplands.</p><ul><li>Coasts, deltas and river mouths are where foragers find the most food; they are also exactly what the sea took.</li><li>More than 60 new settlements appear on the Gulf shore around 7,500 years ago, apparently without local ancestors, as the basin finished flooding (Rose 2010).</li><li>Every time divers and dredgers look (Madura Strait, the Baltic, the Solent), they find something.</li></ul><div class="face-s"><b>Its strongest point</b><p>The sample is biased. Ice Age archaeology is built almost entirely from inland sites, while the coastal plains, likely among the most attractive and populated places to live, have barely been searched.</p></div><p class="face-cr"><b>Credit</b> Graham Hancock; Stephen Oppenheimer; Jeffrey Rose; Danny Hilman Natawidjaja</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Systematic seismic mapping and coring of drowned river valleys on the Sunda Shelf and in the Persian Gulf, as has been done for the North Sea.</li><li>Excavation of a well-preserved Late Pleistocene coastal settlement below 40 m, showing what coastal life at the time actually looked like.</li><li>Independent replication of the Bouldnor Cliff wheat DNA with contamination-controlled methods.</li><li>Ancient DNA linking the first Gulf-coast villages of c. 7,500 years ago to an older population rather than to inland neighbours.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,142 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Drowned Coasts: A Continent&#x27;s Worth of Lost Land"><button type="button" class="wtoc-i" data-go="drowned-coasts-s1">The biggest missing chapter in prehistory</button><button type="button" class="wtoc-i" data-go="drowned-coasts-s2">What is solid: a sea that rose in bursts</button><button type="button" class="wtoc-i" data-go="drowned-coasts-s3">Five lost landscapes</button><button type="button" class="wtoc-i" data-go="drowned-coasts-s4">What the seabed has already given back</button><button type="button" class="wtoc-i" data-go="drowned-coasts-s5">The challengers: we have been searching the wrong half of the world</button><button type="button" class="wtoc-i" data-go="drowned-coasts-s6">Why the sea keeps its secrets</button><button type="button" class="wtoc-i" data-go="drowned-coasts-s7">What would settle it</button></nav></div><section class="wsec" id="drowned-coasts-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The biggest missing chapter in prehistory</h3><p>Stand on a beach in Java, Norfolk or the Gulf coast of Qatar and look out to sea. Twenty thousand years ago you would have been looking at dry land: river valleys, lagoons, forests and grasslands stretching to a shoreline tens or even hundreds of kilometres away. So much water was locked up in ice sheets that the world&#x27;s oceans stood roughly 120 metres lower than today. Then the ice melted, and over some fourteen thousand years the sea came back and took the coasts.</p><p>This is not a fringe idea. It is one of the most secure facts in Earth science. What remains open, and genuinely exciting, is what the sea took with it. Coasts are where foragers find shellfish, fish, birds, fresh springs and easy travel. If you were an Ice Age human choosing where to live, the coastal plain was often the best address on the map. And almost none of it has been searched.</p><blockquote class="wpull"><p>Prehistory is told from the uplands because the coasts are underwater.</p></blockquote></section><section class="wsec" id="drowned-coasts-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What is solid: a sea that rose in bursts</h3><p>Sea-level curves are built from drowned coral reefs, dated peat and shells, and computer models of how the Earth&#x27;s crust responds to the weight of ice. The synthesis by Kurt Lambeck and colleagues (2014) puts the low point at about 120 to 130 metres below present, around 26,000 to 20,000 years ago. The rise that followed was not smooth. During Meltwater Pulse 1A, dated at Tahiti to about 14,650 to 14,310 years ago, the sea climbed some 14 to 18 metres in roughly 350 years: several centimetres a year, enough for a grandparent to remember beaches their grandchildren could not walk on.</p><figure class="wx wx--static" id="drowned-coasts-f1" data-n="0"><div class="wx-head"><span class="wx-k">Figure 1 · Animated drawing</span><h4 class="wx-title">How fast the sea came back</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How fast the sea came back"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" class="wx-svg" role="img" aria-labelledby="drowned-coasts-f1-t"><title id="drowned-coasts-f1-t">Chart of 193.5" r="4.5"/><text class="wx-t wx-halo" x="686" y="188.5" text-anchor="end">Bering Strait sill: Beringia cut</text><text class="wx-t-n wx-halo" x="377.9" y="197.5" text-anchor="end">≈ 11.2k</text></g><text class="wx-t-s" x="690" y="50" text-anchor="end">sites plotted at today's depth; dot = when the sea reached them</text></svg></div></div><figcaption>Approximate global sea level over the last 22,000 years. Each dashed line is a drowned site at its present depth; the dot marks roughly when the rising sea reached that depth. <span class="wx-src">Based on: Curve simplified from the global mean sea-level synthesis of Lambeck et al. 2014 and Meltwater Pulse 1A from Deschamps et al. 2012. Global curve only: local land movement shifts the real drowning dates by centuries (the Blinkerwall paper gives 8.57–8.0 ka; Jakobsson et al. 2017 give c. 11 ka for Bering Strait).</span></figcaption><p class="vh">A line chart with time on the horizontal axis from 22,000 years ago to today and sea level on the vertical axis from 0 to minus 135 metres. The curve starts near minus 130 metres at the Last Glacial Maximum, rises slowly, jumps steeply around 14,500 years ago during Meltwater Pulse 1A, keeps rising through and after the Younger Dryas band, and flattens near zero about 7,000 years ago. Area above the curve is shaded as dry land then, seabed now. Four dashed depth lines mark Bouldnor Cliff at 11 metres, reached about 7,800 years ago; the Blinkerwall at 21 metres, about 8,600 years ago; the Cosquer Cave entrance at 37 metres, about 9,900 years ago; and the Bering Strait sill at about 53 metres, about 11,200 years ago.</p></figure><p>By the end of the Younger Dryas, about 11,700 years ago, the sea was still some 60 metres below today. The Bering land bridge between Siberia and Alaska was cut about 11,000 years ago (Jakobsson and colleagues, 2017). Doggerland, the lowland joining Britain to the continent, shrank to islands and was gone by around 6500 to 6000 BCE, battered on the way by the tsunami of the Storegga submarine landslide off Norway, about 8,150 years ago. By about 7,000 years ago most coasts were close to where they are now.</p></section><section class="wsec" id="drowned-coasts-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Five lost landscapes</h3><figure class="wx wx--steps" id="drowned-coasts-f2" data-n="4"><div class="wx-head"><span class="wx-k">Figure 2 · Step through it</span><h4 class="wx-title">The land the sea took back</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="The land the sea took back"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 446" class="wx-svg" role="img" aria-labelledby="drowned-coasts-f2-t"><title id="drowned-coasts-f2-t">World map of the main continental shelves that were dry land when sea level was about 120 metres lower, with drowned sites marked</title><defs><clipPath id="drowned-coasts-f2-clip"><rect x="12" y="44" width="696" height="296.8" rx="6"/></clipPath></defs><text class="wx-t-cap" x="24" y="26">The land the sea took back · c. 21,000 years ago vs today</text><rect class="wx-water wx-o40" x="12" y="44" width="696" height="296.8" rx="6"/><g clip-path="url(#drowned-coasts-f2-clip)"><path class="wx-st wx-hide wx-c1 wx-o60" data-s="2" d="M543.8,193.5L545.1,191.6L546.4,189.7L547.6,187.8L548.9,185.9L549.1,183L549.2,180.1L549.3,177.2L549.4,174.3L551.2,174L553,173.7L554.7,173.4L556.5,173L558.2,174.6L559.8,176.3L561.5,177.9L563.1,179.5L564.7,179.2L566.2,178.8L567.7,178.5L569.3,178.2L569.7,180.4L570,182.7L570.4,185L570.7,187.2L572,188.2L573.3,189.2L574.6,190.1L575.9,191.1L577.8,190.9L579.7,190.7L581.6,190.5L583.5,190.3L584.4,192.2L585.2,194L586.1,195.8L586.9,197.6L587.2,199.6L587.5,201.5L587.8,203.5L588.1,205.4L587.4,208.4L586.7,211.3L585.9,214.2L585,217.1L584.5,220.5L584,223.8L583.3,227.1L582.7,230.4L579.9,230.1L577.2,229.9L574.4,229.6L571.6,229.4L569.5,228.6L567.4,227.8L565.3,227L563.2,226.2L561.2,224.3L559.2,222.3L557.1
