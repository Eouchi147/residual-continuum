ing water shaped the enclosure, but argued it was runoff from the plateau above, not direct rainfall over many millennia. That runoff, he noted, would have been cut off once Khufu&#x27;s quarries were dug upslope. So the Sphinx enclosure could predate Khufu, placing its origin in the Early Dynastic period, a few centuries before Khafre, rather than in the Stone Age.</p></aside></section><section class="wsec" id="sphinx-erosion-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Where the argument breaks down</h3><p>The difficulty for any very early date is rates. Weathering speed depends on rock chemistry, salt load, humidity, burial by sand and exposure, all of which changed repeatedly over at least 4,500 years. Soft Member II beds can lose centimetres in decades under the wrong conditions, and the Sphinx spent long periods buried to the neck in sand, which alters both moisture and wear. Turning a depth of weathering into an age is therefore very uncertain, as Schoch himself acknowledges when he describes his date as a minimum.</p><p>The second difficulty is people. A monument carved in 7000 BCE implies a society in Egypt capable of organised, large-scale stone working and long-term planning. Göbekli Tepe shows that Stone Age foragers could build megaliths, so the idea is not absurd in principle. But in the Nile Valley the archaeology of that period shows small groups of hunters and herders, and nothing on the Giza plateau is securely older than the Early Dynastic period.</p><p>There is also a problem of comparison. The tombs Schoch contrasts with the enclosure were cut at different heights, in slightly different beds, and some were buried or roofed for long stretches, so they have not faced identical conditions. Critics argue that like is not being compared with like. Supporters reply that the contrast between the enclosure and its neighbours is too systematic to be an accident. Neither side has yet published the kind of measured, bed-by-bed survey that would decide it.</p><blockquote class="wpull"><p>The rock may be telling us something real. So far it has not told us a date.</p></blockquote></section><section class="wsec" id="sphinx-erosion-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What would settle it</h3><p>The best hope is a physical clock. Cosmogenic-nuclide exposure dating measures how long a rock surface has faced the sky, and has dated rock-cut features elsewhere. Applied carefully to the enclosure floor and walls, it could test whether the trench is 4,500 years old or 9,000. Controlled monitoring of how Giza limestone weathers today would test the salt and rain models against each other. And any datable material sealed at the very bottom of the ditch fill would anchor the quarrying directly.</p><p>Until then the fair verdict is this. Khafre remains the best-supported builder, with a respectable case for a slightly earlier start. Schoch deserves credit for asking a geological question that Egyptology had not, and for publishing his data. But a Sphinx from the age of the rains is still waiting for its evidence.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-build" style="--i:0"><span class="wtl-y">2,550 BCE</span><span class="wtl-k">Built</span><span class="wtl-t">Khafre&#x27;s pyramid complex built; Sphinx carved (conventional)</span></li><li class="wtl-use" style="--i:1"><span class="wtl-y">1,400 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Thutmose IV clears the sand and sets up his Dream Stela</span></li><li class="wtl-find" style="--i:2"><span class="wtl-y">1817 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Caviglia excavates the chest and paws</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">1979 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Lehner and Hawass begin the ARCE Sphinx mapping project</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">1979 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">West proposes water erosion in Serpent in the Sky</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1991 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Schoch presents rain-erosion dating to the GSA</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">1992 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Seismic study of the enclosure floor published</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">1995 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Gauri and colleagues publish the salt-weathering reply</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2001 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Reader&#x27;s geomorphological study proposes an Early Dynastic start</span></li></ol><details class="srcs"><summary>Sources for this case (10)</summary><ol><li>Schoch R. M. (1992). Redating the Great Sphinx of Giza. KMT: A Modern Journal of Ancient Egypt 3(2): 52–59, 66–70.</li><li>Dobecki T. L., Schoch R. M. (1992). Seismic investigations in the vicinity of the Great Sphinx of Giza, Egypt. Geoarchaeology 7(6): 527–544. <a href="https://doi.org/10.1002/gea.3340070603" target="_blank" rel="noopener">doi:10.1002/gea.3340070603</a></li><li>Gauri K. L., Sinai J. J., Bandyopadhyay J. K. (1995). Geologic weathering and its implications on the age of the Sphinx. Geoarchaeology 10(2): 119–133. <a href="https://doi.org/10.1002/gea.3340100203" target="_blank" rel="noopener">doi:10.1002/gea.3340100203</a></li><li>Reader C. D. (2001). A geomorphological study of the Giza necropolis, with implications for the development of the site. Archaeometry 43(1): 149–165. <a href="https://doi.org/10.1111/1475-4754.00009" target="_blank" rel="noopener">doi:10.1111/1475-4754.00009</a></li><li>Harrell J. A. (1994). The Sphinx controversy: another look at the geological evidence. KMT 5(2): 70–74.</li><li>Hawass Z., Lehner M. (1994). The Sphinx: who built it, and why? Archaeology 47(5).</li><li>Lehner M. (1992). Reconstructing the Sphinx. Cambridge Archaeological Journal 2(1): 3–26.</li><li>Lehner M., Hawass Z. (2017). Giza and the Pyramids. Thames &amp; Hudson.</li><li>West J. A. (1979). Serpent in the Sky: The High Wisdom of Ancient Egypt. Harper &amp; Row.</li><li>Schoch R. M., McNally R. A. (1999). Voices of the Rocks. Harmony Books.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-sphinx-erosion" data-t="The Sphinx and the Rain: Older Than Khafre?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Sphinx and the Rain: Older Than Khafre?</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-sphinx-erosion</span> (updated 28 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-atlantis-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Nea Kameni.jpg" data-cap="Nea Kameni in the drowned caldera of Santorini" data-big><figcaption></figcaption></figure><div class="sh-k">Lost Ice Age World</div><h2 class="sh-t" id="case-atlantis-st" tabindex="-1">Atlantis: Plato&#x27;s Island and the 9600 BCE Coincidence</h2><p class="sh-s">Plato dated the fall of Atlantis to about 9600 BCE. Geologists now date the end of the last Ice Age cold snap to about 9700 BCE.</p><div class="sh-v"><span class="vstamp vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><p class="sh-claim"><b>What the stamp rates:</b> A large island empire, as Plato describes it, existed beyond Gibraltar and sank into the Atlantic around 9600 BCE.</p></div><p class="v4-q">Was Atlantis a real drowned civilisation, a memory, or Plato&#x27;s invention?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Atlantis appears first in two dialogues by Plato, written about 360 BCE; no earlier text mentions it.</li><li>Plato places it beyond Gibraltar, 9,000 years before his source, which works out to about 9600 BCE.</li><li>The Atlantic floor is young volcanic crust with no drowned continent on it.</li><li>Nowhere on Earth does archaeology show a bronze-using naval empire that early; the candidate sites are too small or too late.</li><li>The date coincides with the end of the Ice Age, which is interesting, but it cannot rescue the empire.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Geology</span><span class="thr">Archaeology</span><span class="thr">Texts and scripts</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="9000" >9,000</b><span class="ctr-u"> years</span></div><div class="ctr-l">time Plato says had passed between the war and Solon</div><div class="ctr-c">Critias 108e</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="27" >27</b><span class="ctr-u"> stadia</span></div><div class="ctr-l">diameter of Plato&#x27;s ring city, about 5 km</div><div class="ctr-c">Critias 115d–116a</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="40" >40</b><span class="ctr-u"> km</span></div><div class="ctr-l">diameter of the Richat Structure in Mauritania</div><div class="ctr-c">Matton et al. 2005</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="56" >56</b><span class="ctr-u"> m</span></div><div class="ctr-l">depth of the top of Spartel Bank today</div><div class="ctr-c">Gutscher 2005</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>A large island empire, as Plato describes it, existed beyond Gibraltar and sank into the Atlantic around 9600 BCE.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The ocean floor itself contradicts a sunken island &#x27;larger than Libya and Asia&#x27;: it is young volcanic crust with no drowned continent. Nowhere in the world does archaeology show a bronze-using naval empire around 9600 BCE. The candidate sites fail on scale or date: Thera is 8,000 years too late, Spartel Bank was a small islet, and Richat is a natural landform 40 km across, far larger than Plato&#x27;s city. The date coincidence with the Younger Dryas is real and interesting, but it cannot rescue the empire.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks call Atlantis a Platonic myth, and on the empire they are right. They are more confident than the evidence about Plato&#x27;s intentions, which nobody can read. He may have woven real Egyptian lore or folk memories of drowned lands into his fable. The fair statement: the empire is ruled out; whether any memory lies beneath the story remains open.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Atlantis appears first in Plato&#x27;s Timaeus and Critias, written about 360 BCE; no earlier Greek or Egyptian text that mentions it has been found.<small>Plato, Timaeus 20d–25d; Critias</small></li><li>Plato says the story came from Egyptian priests at Saïs via the Athenian lawgiver Solon, and that the war happened 9,000 years before Solon, which works out to about 9600 BCE.<small>Timaeus 23e; Critias 108e</small></li><li>The Younger Dryas cold interval ended, and sea level rose steeply, about 11,700 years ago, around 9700 BCE.<small>Walker et al. 2009</small></li><li>The Atlantic floor beyond Gibraltar is oceanic crust formed at the Mid-Atlantic Ridge; there is no foundered continent-sized island.<small>Standard plate-tectonic mapping</small></li><li>The eruption of Thera (Santorini) devastated the Bronze Age Aegean in the 16th century BCE, and the Greek city of Helike sank in an earthquake and tsunami in 373 BCE, in Plato&#x27;s lifetime.<small>Pearson et al. 2023; Strabo, Geography 8.7.2</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether Plato invented the story outright to illustrate his ideal state, or built it on real Egyptian traditions or Greek memories of catastrophe.</li><li>Whether the 9600 BCE date is a genuine memory of the end of the Ice Age or a round, symbolic number.</li><li>Whether any real place (Thera and Crete, Spartel Bank, the Richat Structure, the drowned shelves) supplied details.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Any Egyptian record of the story; the temple archives of Saïs, where Plato sets its source, are lost.</li><li>Coastal sites of the Ice Age Atlantic and Mediterranean, which lie under 60–120 m of water.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Most classicists read Atlantis as Plato&#x27;s philosophical invention: a proud, rich naval empire that serves as the foil for an idealised ancient Athens, destroyed for its arrogance. The detailed numbers are part of the storytelling, as in Plato&#x27;s other myths. Geology rules out a sunken Atlantic continent, and archaeology finds no metal-working naval empires anywhere around 9600 BCE. Real disasters such as Thera and Helike may have coloured the ending.</p><ul><li>No source before Plato mentions Atlantis, and Plato uses invented myths elsewhere (the Myth of Er, the Ring of Gyges).</li><li>The empire&#x27;s temples, fleets, bronze and orichalcum match no culture of 9600 BCE.</li><li>The Richat Structure is a natural eroded dome about 100 million years old, eight times wider than Plato&#x27;s city.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Ignatius Donnelly&#x27;s Atlantis: The Antediluvian World (1882) made Atlantis a real mother civilisation. Spyridon Marinatos (1939) and Angelos Galanopoulos linked it to Minoan Crete and the Thera eruption, suggesting the 9,000 years were a tenfold slip for 900. Jacques Collina-Girard proposed a drowned islet on Spartel Bank near Gibraltar. Graham Hancock stresses Plato&#x27;s date: 9,000 years before Solon lands close to the abrupt end of the Younger Dryas and the fast sea-level rise that drowned coasts worldwide. Online researchers have promoted the ringed Richat Structure in Mauritania.</p><ul><li>Plato insists the story is true and gives it a chain of transmission: Saïs priests, Solon, Critias.</li><li>Plato&#x27;s date of about 9600 BCE falls within a century or so of the end of the Younger Dryas.</li><li>Real islands and coasts did drown at the end of the Ice Age, including Spartel Bank near Gibraltar.</li></ul><div class="face-s"><b>Its strongest point</b><p>The date. Plato, writing more than 2,000 years before ice cores, placed his drowning around 9600 BCE, which falls close to a real global catastrophe of rising seas and abrupt warming. That coincidence is striking and deserves an explanation.</p></div><p class="face-cr"><b>Credit</b> Ignatius Donnelly; Spyridon Marinatos and Angelos Galanopoulos (Thera); Jacques Collina-Girard (Spartel Bank); Graham Hancock; Richat Structure proponents</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>An Egyptian text independently recording the story, for example from the Late Period temples of Saïs.</li><li>Excavation of a drowned site of about 10,000 BCE showing monumental architecture or metallurgy.</li><li>Coring on Spartel Bank showing human occupation of the islet before it drowned.</li><li>Archaeological survey of the Richat Structure finding anything younger than its natural rock rings that resembles Plato&#x27;s city.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,182 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Atlantis: Plato&#x27;s Island and the 9600 BCE Coincidence"><button type="button" class="wtoc-i" data-go="atlantis-s1">A story from the priests of Saïs</button><button type="button" class="wtoc-i" data-go="atlantis-s2">What Plato actually describes</button><button type="button" class="wtoc-i" data-go="atlantis-s3">The mainstream reading: a philosopher&#x27;s fable</button><button type="button" class="wtoc-i" data-go="atlantis-s4">The challengers: Thera, Spartel, Richat and the date</button><button type="button" class="wtoc-i" data-go="atlantis-s5">Weighing the coincidence</button><button type="button" class="wtoc-i" data-go="atlantis-s6">What would change the verdict</button></nav></div><section class="wsec" id="atlantis-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A story from the priests of Saïs</h3><p>Around 360 BCE Plato wrote a dialogue in which the Athenian politician Critias tells a story passed down from his great-grandfather&#x27;s friend Solon, the famous lawgiver. Solon, the story goes, had visited the Egyptian city of Saïs, where the priests laughed at the Greeks&#x27; short memory. Greece had forgotten its own past, they said, because fire and flood had destroyed it again and again.</p><blockquote class="quote"><p>Solon, Solon, you Hellenes are never anything but children, and there is not an old man among you.</p><cite>Plato, Timaeus 22b, trans. Benjamin Jowett (1892)</cite></blockquote><p>Then they told him of Atlantis: a great island beyond the Pillars of Heracles, the Strait of Gibraltar, whose kings ruled much of the Mediterranean world and attacked Athens and Egypt. A heroic ancient Athens beat them back. Then catastrophe struck both sides.</p><blockquote class="quote"><p>But afterwards there occurred violent earthquakes and floods; and in a single day and night of misfortune all your warlike men in a body sank into the earth, and the island of Atlantis in like manner disappeared in the depths of the sea.</p><cite>Plato, Timaeus 25c–d, trans. Benjamin Jowett (1892)</cite></blockquote></section><section class="wsec" id="atlantis-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What Plato actually describes</h3><p>In the unfinished Critias, Plato adds astonishing detail. Poseidon&#x27;s island city was built in rings: a central island five stadia across, surrounded by alternating rings of water and land, one, two, two, three and three stadia wide, all bridged and tunnelled for ships. A canal 50 stadia long led to the sea, and a great wall ran round the whole city 50 stadia out from the largest ring. Beyond lay a vast, level plain of 3,000 by 2,000 stadia, ringed by a ditch 10,000 stadia long. With a stadion of about 185 metres, the ring city is some 5 km across and the plain about 555 by 370 km.</p><figure class="wx wx--steps" id="atlantis-f1" data-n="4"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">Plato&#x27;s numbers, drawn</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Plato&#x27;s numbers, drawn"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" class="wx-svg" role="img" aria-labelledby="atlantis-f1-t"><title id="atlantis-f1-t">Plato's ring city of Atlantis drawn from the Critias measurements, then placed at true scale beside the Richat Structure and Plato's great plain</title><defs><marker id="atlantis-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker><marker id="atlantis-f1-ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text class="wx-t-cap" x="24" y="28">Plato's numbers, drawn · 1 stadion ≈ 185 m</text><text class="wx-t-b" x="24" y="58">Plato's city, enlarged</text><circle class="wx-water wx-edge-soft wx-pop" style="--d:0" cx="118" cy="206" r="99.9"/><circle class="wx-green wx-edge-soft wx-pop" style="--d:1" cx="118" cy="206" r="77.7"/><circle class="wx-water wx-edge-soft wx-pop" style="--d:2" cx="118" cy="206" r="55.5"/><circle class="wx-green wx-edge-soft wx-pop" style="--d:3" cx="118" cy="206" r="40.7"/><circle class="wx-water wx-edge-soft wx-pop" style="--d:4" cx="118" cy="206" r="25.9"/><circle class="wx-stone wx-edge-soft wx-pop" style="--d:5" cx="118" cy="206" r="18.5"/><rect class="wx-water wx-edge-soft" x="114" y="305.9" width="8" height="34"/><path class="wx-thin" d="M110,343.9l16,-6M110,349.9l16,-6"/><text class="wx-t-s wx-halo" x="130" y="335.9">canal, 50 stadia</text><text class="wx-t-s wx-halo" x="130" y="348.9">to the sea</text><path class="wx-thin" d="M121.7,206L226,142H230"/><text class="wx-t wx-halo" x="233" y="146">island, 5 stadia across</text><path class="wx-thin" d="M151.3,206L226,166H230"/><text class="wx-t wx-halo" x="233" y="170">water, 1 stadion</text><path class="wx-thin" d="M166.1,206L226,190H230"/><text class="wx-t wx-halo" x="233" y="194">land, 2</text><path class="wx-thin" d="M184.6,206L226,214H230"/><text class="wx-t wx-halo" x="233" y="218">water, 2</text><path class="wx-thin" d="M206.8,206L226,238H230"/><text class="wx-t wx-halo" x="233" y="242">land, 3; water, 3</text><circle class="wx-inkfill" cx="118" cy="206" r="2"/><text class="wx-t-m" x="24" y="76">total ≈ 27 stadia ≈ 5 km across</text><text class="wx-t-b" x="410" y="58">True scale</text><g class="wx-st wx-hide" data-s="3"><circle class="wx-sand wx-edge-soft" cx="548" cy="252" r="146"/><circle class="wx-thin" cx="548" cy="252" r="127.8"/><circle class="wx-thin" cx="548" cy="252" r="98.5"/><circle class="wx-thin" cx="548" cy="252" r="73"/><circle class="wx-thin" cx="548" cy="252" r="47.4"/><text class="wx-t-b wx-halo" x="548" y="122" text-anchor="middle">Richat Structure, c. 40 km</text><text class="wx-t-s wx-halo" x="548" y="136" text-anchor="middle">eroded dome, c. 100 million yrs old</text></g><g class="wx-st" data-s="2"><circle class="wx-hl" cx="548" cy="252" r="85.8" stroke-dasharray="3 5"/><rect class="wx-water2 wx-edge-soft" x="546" y="270.2" width="4" height="67.5"/><circle class="wx-water wx-edge-soft" cx="548" cy="252" r="18.2"/><circle class="wx-green wx-edge-soft" cx="548" cy="252" r="14.2"/><circle class="wx-water wx-edge-soft" cx="548" cy="252" r="10.1"/><circle class="wx-green wx-edge-soft" cx="548" cy="252" r="7.4"/><circle class="wx-water wx-edge-soft" cx="548" cy="252" r="4.7"/><circle class="wx-stone wx-edge-soft" cx="548" cy="252" r="3.4"/><text class="wx-t-b wx-halo" x="572.2" y="248">ring city, 5 km</text><text class="wx-t-s wx-halo" x="554" y="310.7">canal, 9 km</text><text class="wx-t wx-halo" x="482.3" y="327.7" text-anchor="end">outer wall, 50 stadia</text><text class="wx-t wx-halo" x="482.3" y="341.7" text-anchor="end">beyond: c. 23 km across</text></g><path class="wx-line" d="M600,466h73M600,461v10M673,461v10"/><text class="wx-t-s" x="636.5" y="456" text-anchor="middle">10 km</text><g class="wx-st wx-hide" data-s="4"><rect class="wx-green wx-o60 wx-edge-soft" x="28" y="366" width="138.8" height="92.5"/><circle class="wx-inkfill" cx="97.4" cy="374" r="5"/><text class="wx-t-b" x="174.8" y="380">Plato's plain: 3,000 × 2,000</text><text class="wx-t" x="174.8" y="394">stadia ≈ 555 × 370 km</text><text class="wx-t-m" x="174.8" y="410">dot = Richat at the same</text><text class="wx-t-m" x="174.8" y="424">scale; Richat sits in hills,</text><text class="wx-t-m" x="174.8" y="438">not on a plain by the sea</text></g><g class="wx-st wx-hide" data-only="1"><text class="wx-t-m" x="410" y="90">Step 2 places this city</text><text class="wx-t-m" x="410" y="105">at true scale here.</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 4.</b> Plato&#x27;s ring city, enlarged: island of 5 stadia, rings of 1, 2, 2, 3 and 3 stadia.</p><ol class="wx-steplist"><li>Plato&#x27;s ring city, enlarged: island of 5 stadia, rings of 1, 2, 2, 3 and 3 stadia.</li><li>At true scale the city is about 5 km across; its canal runs about 9 km and its outer wall about 23 km across.</li><li>The Richat Structure at the same scale: about 40 km across, rings of natural rock ridges.</li><li>Plato&#x27;s plain, about 555 × 370 km, dwarfs both.</li></ol><figcaption>Plato&#x27;s ring city drawn from the measurements in the Critias, then placed at true scale over the Richat Structure, and finally within Plato&#x27;s great plain. <span class="wx-src">Based on: Measurements from Plato, Critias 113c–118b (trans. Jowett 1892), with 1 stadion taken as 185 m (Greek stadia varied, about 177–192 m). Richat diameter from Matton et al. 2005; its ring positions are schematic.</span></figcaption><p class="vh">Left: an enlarged diagram of concentric circles, a central island five stadia across surrounded by rings of water and land of one, two, two, three and three stadia, with a canal leading south to the sea; total about 27 stadia or 5 kilometres. Right, at true scale: step 2 shows the same city as a small ringed disc about 5 kilometres wide with a 9 kilometre canal and a dashed outer wall circle about 23 kilometres across. Step 3 adds the Richat Structure, a circle about 40 kilometres across with concentric ridges, around it. Step 4 adds an inset rectangle for Plato&#x27;s plain of 555 by 370 kilometres, with Richat as a small dot at the same scale.</p></figure><p>Plato also gives a date. The Egyptian priests told Solon that their own records went back 8,000 years and that Athens and the war were 9,000 years old. Solon visited Egypt early in the 6th century BCE, so Plato&#x27;s catastrophe falls around 9600 BCE.</p></section><section class="wsec" id="atlantis-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The mainstream reading: a philosopher&#x27;s fable</h3><p>Most classicists think Plato invented Atlantis. The story does exactly the job he needed: the Republic had sketched an ideal city, and Timaeus and Critias set that city in motion against a rich, arrogant sea power that the gods punish. Plato invents myths elsewhere too, from the Ring of Gyges to the Myth of Er, and he often gives them solemn chains of witnesses. No earlier author mentions Atlantis. According to the late commentator Proclus, Plato&#x27;s early follower Crantor took the story as history, but even in antiquity readers disagreed.</p><p>Science adds hard limits. The Atlantic floor beyond Gibraltar is young crust spreading from the Mid-Atlantic Ridge; there is no sunken continent. Around 9600 BCE people everywhere lived as foragers or very early cultivators. Göbekli Tepe, being built in Anatolia at about that time, shows remarkable skill in stone, but there is no bronze, no orichalcum, no fleets of triremes, no kings of ten nations anywhere in the record.</p></section><section class="wsec" id="atlantis-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The challengers: Thera, Spartel, Richat and the date</h3><p>The modern Atlantis industry began with Ignatius Donnelly, a Minnesota congressman whose Atlantis: The Antediluvian World (1882) argued that Atlantis was a real mid-Atlantic continent and the mother of Egypt, Mexico and much else, pointing to shared flood myths, pyramids and alphabets. Donnelly wrote before plate tectonics and before radiocarbon, and his parallels have not survived scrutiny, but his instinct, that similar myths on both sides of the ocean call for an explanation, still drives the debate.</p><p>The most scholarly alternative came from Greece. In 1939 Spyridon Marinatos proposed that the Bronze Age eruption of Thera (Santorini) helped bring down Minoan Crete, a real island sea power. Angelos Galanopoulos later suggested that Plato&#x27;s numbers had slipped by a factor of ten: 900 years before Solon puts the catastrophe near 1500 BCE, close to Thera. Radiocarbon now dates the eruption to the 16th or late 17th century BCE. The fit in spirit is good; the fit in place and size is poor, because Crete lies inside the Mediterranean, not beyond Gibraltar.</p><p>In 2001 the geologist Jacques Collina-Girard pointed to Spartel Bank, west of the Strait of Gibraltar, which was a small island when the sea was low and drowned as it rose. Marc-André Gutscher tested the idea in 2005 and found evidence for great earthquakes and tsunamis in the region, but concluded that the islet was small and drowned gradually, not in a day and a night. More recently, online researchers have championed the Richat Structure in Mauritania, a spectacular set of rings 40 km across visible from space.</p><aside class="wcall"><b>How do we know what Richat is?</b><p>Geologists mapped Richat in detail in the 2000s. It is an eroded dome: molten rock pushed up the layers about 100 million years ago, hot fluids dissolved and collapsed the centre, and erosion then carved the tilted hard beds into concentric ridges (Matton and colleagues, 2005). Its rings are rock, not canals, and it sits on a desert plateau far from the sea. It is also about eight times wider than Plato&#x27;s city, though Plato&#x27;s outer wall, at about 23 km, comes closer.</p></aside><figure class="wx wx--static" id="atlantis-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">When was Atlantis?</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="When was Atlantis?"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" class="wx-svg" role="img" aria-labelledby="atlantis-f2-t"><title id="atlantis-f2-t">Timeline with a broken axis comparing Plato's date for Atlantis, the end of the Younger Dryas and the drowning of Spartel Bank with the Thera eruption, Solon, Helike and Plato himself</title><defs><marker id="atlantis-f2-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker><marker id="atlantis-f2-ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text class="wx-t-cap" x="24" y="28">When was Atlantis? Plato's date and the candidates</text><path class="wx-bold wx-draw" pathLength="1" d="M40,190H290"/><path class="wx-bold wx-draw" pathLength="1" style="--d:2" d="M350,190H690"/><path class="wx-line" d="M306,180l-8,20M316,180l-8,20"/><text class="wx-t-s" x="320" y="224" text-anchor="middle">8,000 years</text><text class="wx-t-s" x="320" y="237" text-anchor="middle">omitted</text><path class="wx-thin" d="M55.6,190v6"/><text class="wx-t-s" x="55.6" y="210" text-anchor="middle">10,500 BCE</text><path class="wx-thin" d="M133.8,190v6"/><text class="wx-t-s" x="133.8" y="210" text-anchor="middle">10,000 BCE</text><path class="wx-thin" d="M211.9,190v6"/><text class="wx-t-s" x="211.9" y="210" text-anchor="middle">9,500 BCE</text><path class="wx-thin" d="M350,190v6"/><text class="wx-t-s" x="350" y="210" text-anchor="middle">2,000 BCE</text><path class="wx-thin" d="M450,190v6"/><text class="wx-t-s" x="450" y="210" text-anchor="middle">1,500 BCE</text><path class="wx-thin" d="M550,190v6"/><text class="wx-t-s" x="550" y="210" text-anchor="middle">1,000 BCE</text><path class="wx-thin" d="M650,190v6"/><text class="wx-t-s" x="650" y="210" text-anchor="middle">500 BCE</text><rect class="wx-ice wx-o80" x="40" y="130" width="140.6" height="60"/><text class="wx-t-s" x="46" y="144">Younger Dryas cold</text><g class="wx-pop" style="--d:3"><path class="wx-thin" d="M180.6,190V90"/><circle class="wx-inkfill" cx="180.6" cy="190" r="5"/><text class="wx-t-b wx-halo" x="176.6" y="72" text-anchor="end">End of the Younger Dryas</text><text class="wx-t-s wx-halo" x="176.6" y="86" text-anchor="end">c. 9700 BCE</text></g><g class="wx-pop" style="--d:4"><path class="wx-thin" d="M196.2,190V260"/><circle class="wx-accfill" cx="196.2" cy="190" r="5"/><text class="wx-t-b wx-halo" x="200.2" y="274" text-anchor="start">Plato's date</text><text class="wx-t-s wx-halo" x="200.2" y="288" text-anchor="start">9,000 years before Solon</text></g><g class="wx-pop" style="--d:5"><path class="wx-thin" d="M133.8,190V310"/><circle class="wx-inkfill" cx="133.8" cy="190" r="5"/><text class="wx-t-b wx-halo" x="137.8" y="324" text-anchor="start">Spartel Bank islet drowns</text><text class="wx-t-s wx-halo" x="137.8" y="338" text-anchor="start">c. 12,000 years ago</text></g><g class="wx-pop" style="--d:6"><path class="wx-thin" d="M430,190V90"/><circle class="wx-inkfill" cx="430" cy="190" r="5"/><text class="wx-t-b wx-halo" x="434" y="72" text-anchor="start">Thera eruption</text><text class="wx-t-s wx-halo" x="434" y="86" text-anchor="start">c. 1600 BCE; Minoan Crete</text></g><g class="wx-pop" style="--d:7"><path class="wx-thin" d="M632,190V260"/><circle class="wx-inkfill" cx="632" cy="190" r="5"/><text class="wx-t-b wx-halo" x="628" y="274" text-anchor="end">Solon in Egypt</text><text class="wx-t-s wx-halo" x="628" y="288" text-anchor="end">c. 590 BCE</text></g><g class="wx-pop" style="--d:8"><path class="wx-thin" d="M675.4,190V130"/><circle class="wx-inkfill" cx="675.4" cy="190" r="5"/><text class="wx-t-b wx-halo" x="671.4" y="112" text-anchor="end">Helike sinks</text><text class="wx-t-s wx-halo" x="671.4" y="126" text-anchor="end">373 BCE</text></g><g class="wx-pop" style="--d:9"><path class="wx-thin" d="M678,190V310"/><circle class="wx-accfill" cx="678" cy="190" r="5"/><text class="wx-t-b wx-halo" x="674" y="324" text-anchor="end">Plato writes</text><text class="wx-t-s wx-halo" x="674" y="338" text-anchor="end">c. 360 BCE</text></g><path class="wx-hl wx-dash wx-draw" pathLength="1" style="--d:10" d="M196.2,180 C276.2,60 370,60 450,178" marker-end="url(#atlantis-f2-ah)"/><text class="wx-t-a wx-t-b wx-halo" x="333.1" y="126" text-anchor="middle">a tenfold slip? 900 years</text><text class="wx-t-s wx-halo" x="333.1" y="140" text-anchor="middle">before Solon ≈ 1500 BCE (Galanopoulos)</text></svg></div></div><figcaption>Plato&#x27;s date sits close to the end of the Younger Dryas; the other candidates cluster thousands of years later. The axis is broken to skip 8,000 years. <span class="wx-src">Based on: Plato, Timaeus and Critias; Walker et al. 2009 (Holocene start); Pearson et al. 2023 and Friedrich et al. 2006 (Thera); Gutscher 2005 (Spartel Bank).</span></figcaption><p class="vh">A horizontal timeline broken into two parts. The left part, from 10,600 to 9,000 BCE, shows a pale band for the Younger Dryas cold ending at about 9700 BCE, Plato&#x27;s date at about 9600 BCE, and the drowning of the Spartel Bank islet about 12,000 years ago. After a break marked 8,000 years omitted, the right part runs from 2000 to 300 BCE with the Thera eruption about 1600 BCE, Solon&#x27;s visit to Egypt about 590 BCE, Helike sinking in 373 BCE, and Plato writing about 360 BCE. A curved arrow from Plato&#x27;s date to about 1500 BCE is labelled with Galanopoulos&#x27;s idea of a tenfold slip.</p></figure><p>Then there is the date, which Graham Hancock has made central. Plato&#x27;s 9600 BCE falls within about a century of the abrupt end of the Younger Dryas, around 9700 BCE, when temperatures leapt and the rising sea drowned coastlines worldwide. For Hancock, this is too close for chance: perhaps Egyptian priests preserved a genuine memory of a drowned world.</p></section><section class="wsec" id="atlantis-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Weighing the coincidence</h3><p>It is worth taking the date seriously and testing it. Plato did not know about ice ages, so the match is not a trick of hindsight. But the end of the Ice Age was not one day and night of disaster; sea level rose over thousands of years, and the fastest pulses came before 9600 BCE. The number 9,000 is also a round figure in a story full of round figures, and Plato&#x27;s Egyptian priests needed their records to be far older than Greek memory to make his point. A coincidence within a century or two, among many possible dates, is suggestive but weak evidence.</p><p>There is also a much closer candidate for the ending. In the winter of 373 BCE, when Plato was in his fifties, an earthquake struck the Gulf of Corinth and the sea swept over the prosperous city of Helike in a single night, drowning it so completely that later visitors said they could see its ruins under the water. Plato&#x27;s audience would have known the story well. A city swallowed by the sea overnight was not a far-off legend to them; it was recent news.</p><p>What survives the test is smaller but still interesting. Real islands and coastal plains did drown in the millennia around Plato&#x27;s date. Real catastrophes, Thera and Helike among them, struck the Greek world. Plato&#x27;s story may be a fable built from these materials, and his priests&#x27; warning, that fire and water had repeatedly wiped out human memory, reads today like a fair summary of the drowned coasts.</p><blockquote class="wpull"><p>The empire is ruled out. The drowning of the Ice Age world is not a myth at all.</p></blockquote></section><section class="wsec" id="atlantis-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What would change the verdict</h3><p>An Egyptian source, independent of Plato, that tells the story would transform the debate. So would a drowned site of about 10,000 BCE showing monumental building or metalwork, or human traces on Spartel Bank. None has appeared. For now, Atlantis as Plato describes it, a vast Atlantic empire of 9600 BCE, is ruled out by the seafloor and the archaeological record. Atlantis as a question, whether ancient stories can carry faint memories of real drowned lands, remains open, and the rest of this site returns to it often.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">9,600 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Plato&#x27;s date for the war and the sinking</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">1,600 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Thera erupts; Minoan Crete damaged</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">590 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Solon visits Egypt (as Plato tells it)</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">373 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Helike swallowed by earthquake and sea</span></li><li class="wtl-event" style="--i:4"><span class="wtl-y">360 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Plato writes Timaeus and Critias</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1882 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Donnelly&#x27;s Atlantis: The Antediluvian World</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">1939 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Marinatos links Thera to Minoan collapse</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2005 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Gutscher tests Spartel Bank; Matton explains Richat</span></li></ol><details class="srcs"><summary>Sources for this case (13)</summary><ol><li>Plato, Timaeus and Critias, trans. B. Jowett (1892). The Dialogues of Plato, 3rd ed. Oxford University Press.</li><li>Walker M. et al. (2009). Formal definition and dating of the GSSP for the base of the Holocene using the Greenland NGRIP ice core. Journal of Quaternary Science 24(1): 3–17. <a href="https://doi.org/10.1002/jqs.1227" target="_blank" rel="noopener">doi:10.1002/jqs.1227</a></li><li>Gutscher M.-A. (2005). Destruction of Atlantis by a great earthquake and tsunami? A geological analysis of the Spartel Bank hypothesis. Geology 33(8): 685–688. <a href="https://doi.org/10.1130/G21597.1" target="_blank" rel="noopener">doi:10.1130/G21597.1</a></li><li>Matton G., Jébrak M., Lee J. K. W. (2005). Resolving the Richat enigma: doming and hydrothermal karstification above an alkaline complex. Geology 33(8): 665–668. <a href="https://doi.org/10.1130/G21542.1" target="_blank" rel="noopener">doi:10.1130/G21542.1</a></li><li>Matton G., Jébrak M. (2014). The &#x27;eye of Africa&#x27; (Richat dome, Mauritania): an isolated Cretaceous alkaline–hydrothermal complex. Journal of African Earth Sciences 97: 109–124.</li><li>Friedrich W. L. et al. (2006). Santorini eruption radiocarbon dated to 1627–1600 B.C. Science 312: 548. <a href="https://doi.org/10.1126/science.1125087" target="_blank" rel="noopener">doi:10.1126/science.1125087</a></li><li>Pearson C. et al. (2023). Olive shrub buried on Therasia supports a mid-16th century BCE date for the Thera eruption. Scientific Reports 13. <a href="https://doi.org/10.1038/s41598-023-33696-w" target="_blank" rel="noopener">doi:10.1038/s41598-023-33696-w</a></li><li>Marinatos S. (1939). The volcanic destruction of Minoan Crete. Antiquity 13: 425–439.</li><li>Galanopoulos A. G., Bacon E. (1969). Atlantis: The Truth Behind the Legend. Nelson.</li><li>Donnelly I. (1882). Atlantis: The Antediluvian World. Harper &amp; Brothers.</li><li>Collina-Girard J. (2001). L&#x27;Atlantide devant le détroit de Gibraltar? Mythe et géologie. Comptes Rendus de l&#x27;Académie des Sciences, Earth and Planetary Sciences 333: 233–240.</li><li>Hancock G. (2015). Magicians of the Gods. Coronet.</li><li>Strabo, Geography 8.7.2 (on the destruction of Helike), trans. H. L. Jones, Loeb Classical Library (1927).</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-atlantis" data-t="Atlantis: Plato&#x27;s Island and the 9600 BCE Coincidence"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Atlantis: Plato&#x27;s Island and the 9600 BCE Coincidence</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-atlantis</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-aboriginal-sea-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Cherry Lake, Seaholme and Port Phillip Bay.jpg" data-cap="Port Phillip Bay, Victoria" data-big><figcaption></figcaption></figure><div class="sh-k">Lost Ice Age World</div><h2 class="sh-t" id="case-aboriginal-sea-st" tabindex="-1">Stories Older Than the Sea: Australia&#x27;s Drowned Coasts</h2><p class="sh-s">Around Australia&#x27;s coast, Aboriginal stories tell of dry land where the sea now is. The seabed says those stories may be 10,000 years old.</p><div class="sh-v"><span class="vstamp vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><p class="sh-claim"><b>What the stamp rates:</b> Some Aboriginal Australian stories preserve accurate memories of coastal drowning that happened more than 7,000 years ago.</p></div><p class="v4-q">Can a spoken story accurately remember a coastline that drowned 10,000 years ago?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Around Australia, 21 Aboriginal stories describe coastlines that are now under the sea.</li><li>Sea level really did rise about 120 metres after the last Ice Age, drowning wide plains, and it settled about 7,000 years ago.</li><li>Match each story to the depth of water over the land it describes, and the stories come out 7,000 to 13,000 years old.</li><li>That would make them the oldest memories anyone has ever kept by word of mouth.</li><li>It is the simplest explanation for the whole set, but any single story could also be a later guess from the landscape, so it stays plausible rather than proven.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Geology</span><span class="thr">Climate</span><span class="thr">Texts and scripts</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="21" >21</b><span class="ctr-u"> places</span></div><div class="ctr-l">coastal locations with stories of drowning studied by Nunn and Reid</div><div class="ctr-c">Nunn &amp; Reid 2016</div></div><div class="ctr"><div class="ctr-v">up to <b class="ctr-n" data-v="13070" >13,070</b><span class="ctr-u"> years</span></div><div class="ctr-l">oldest calculated age for a remembered drowning</div><div class="ctr-c">Nunn &amp; Reid 2016</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="300" >300</b><span class="ctr-u"> generations</span></div><div class="ctr-l">roughly how many tellings separate today from 7,500+ years ago</div><div class="ctr-c">Nunn &amp; Reid 2016</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="120" >120</b><span class="ctr-u"> m</span></div><div class="ctr-l">fall in sea level at the Last Glacial Maximum</div><div class="ctr-c">Lambeck et al. 2014</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Some Aboriginal Australian stories preserve accurate memories of coastal drowning that happened more than 7,000 years ago.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The pattern is striking: 21 locations, many different language groups, and every calculated age inside the known window of postglacial sea-level rise. Strict, cross-checked transmission is documented in Aboriginal societies. But each individual story could also be a later inference from landscape clues, and the recorded versions passed through colonial hands. Long memory is the most economical explanation for the whole set, and a serious possibility, but it is hard to test any one story independently.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 3 of 6, leaning one way"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>leaning one way</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">History textbooks rarely address this at all, and when they discuss oral tradition they usually assume it fades within a few centuries. For Aboriginal Australia that assumption now looks too pessimistic. Here the conventional view is underconfident about oral memory rather than overconfident, while the sea-level science behind the dates is secure.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Sea level around Australia stood roughly 120 m lower at the Last Glacial Maximum and reached close to its present level about 7,000 years ago, drowning wide coastal plains.<small>Lambeck et al. 2014</small></li><li>Aboriginal groups recorded from the 19th century onward tell stories, at 21 coastal locations studied by Nunn and Reid, of land that is now under the sea.<small>Nunn &amp; Reid 2016, Australian Geographer</small></li><li>Matching each story&#x27;s claim to the depth of water that now covers the land, and then to the sea-level curve, gives ages of about 7,250–13,070 years.<small>Nunn &amp; Reid 2016</small></li><li>Kangaroo Island was cut off from the mainland about 10,000 years ago; Ngarrindjeri tradition tells of the ancestral being Ngurunderi making the waters rise between them.<small>Ngarrindjeri tradition; regional sea-level data</small></li><li>Elsewhere, oral traditions demonstrably preserve real events: Pacific Northwest stories of the great Cascadia earthquake of January 1700 match the Japanese record of its tsunami.<small>Ludwin et al. 2005</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the stories are memories handed down for some 300 generations, or later inferences from clues in the landscape such as drowned trees, submerged shell middens and reefs.</li><li>How much 19th- and 20th-century recording, translation and editing reshaped the stories, and whether European ideas about sea-level change crept in.</li><li>Whether some stories, such as those of Port Phillip Bay, recall much more recent events; a 2011 geological study proposed the bay was partly dry as recently as about 1,000 years ago.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>The drowned land itself: campsites, shell middens and stone arrangements on the old coastal plains now lie 10 to 120 m underwater.</li><li>Many versions of the stories, lost when communities were displaced and languages disrupted after 1788.</li><li>Some knowledge that remains restricted by its custodians and is, rightly, not published.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Many historians have long assumed that oral traditions stay reliable for a few centuries at most before they drift into myth. Nunn and Reid&#x27;s study has persuaded many geographers and archaeologists that Australian cases may be exceptional, but caution remains. A story about a drowned coast could be inferred by people reading their landscape, and records made by colonists and anthropologists are filtered through other languages and assumptions. The mainstream position today is that long memory is plausible but hard to test story by story.</p><ul><li>Visible clues, such as drowned tree stumps or islands with the same animals as the mainland, could suggest a former land connection.</li><li>Early recorders sometimes paraphrased freely and rarely noted who told the story and how.</li><li>Only a minority of drowning stories can be tied to a specific place and depth.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>The geographer Patrick Nunn and the linguist Nicholas Reid gathered stories from 21 places around Australia that describe the sea rising over land, islands once joined to the mainland, or bays that were once dry. For each they calculated how far the sea must have been lowered to match the story, and dated that level with sea-level curves. All the dates fall between about 7,250 and 13,070 years ago, exactly the window in which rising seas were reshaping the coast. Nunn argues that Aboriginal cultures had rules for exact transmission, with kin who cross-checked each telling, making such long memory possible.</p><ul><li>Separate communities around the whole continent tell consistent kinds of stories about the same process.</li><li>The stories give specific details, such as named places now underwater, that fit the bathymetry.</li><li>Other traditions worldwide, from the Klamath of Oregon to the Pacific Islands, also seem to remember datable events.</li></ul><div class="face-s"><b>Its strongest point</b><p>Stories from 21 separate places, told by many different peoples, all point to land that sea-level science says drowned between about 7,250 and 13,070 years ago, and none describe drownings that the science says could not have happened.</p></div><p class="face-cr"><b>Credit</b> Patrick Nunn; Nicholas Reid; Aboriginal knowledge holders; Graham Hancock (flood memory generally)</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Finding a story that describes a specific drowned feature (a hill, a spring, a stone arrangement) that nobody could see today, and then locating it on the seabed.</li><li>Checking whether the earliest recorded versions of each story predate the spread of European geology in the colony.</li><li>Underwater archaeology on a drowned site named in a story, dating human use to before its drowning.</li><li>Community-led recording of surviving versions with notes on transmission rules, where custodians choose to share them.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,206 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Stories Older Than the Sea: Australia&#x27;s Drowned Coasts"><button type="button" class="wtoc-i" data-go="aboriginal-sea-s1">When the gulf was a plain</button><button type="button" class="wtoc-i" data-go="aboriginal-sea-s2">What is solid: the sea really did come in</button><button type="button" class="wtoc-i" data-go="aboriginal-sea-s3">Three stories and a warning</button><button type="button" class="wtoc-i" data-go="aboriginal-sea-s4">How could a story last 10,000 years?</button><button type="button" class="wtoc-i" data-go="aboriginal-sea-s5">The case for caution</button><button type="button" class="wtoc-i" data-go="aboriginal-sea-s6">What would settle it</button></nav></div><section class="wsec" id="aboriginal-sea-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>When the gulf was a plain</h3><p>On the Yorke Peninsula of South Australia, the Narrangga people tell of a time when Spencer Gulf was not sea at all. It was marshy country with freshwater lagoons where animals came to drink, until the sea broke through a barrier at its mouth and flooded in. The gulf is now up to several tens of metres deep. For its floor to be dry land, the sea would have to fall far below today&#x27;s level, something that last happened roughly 9,000 to 12,000 years ago.</p><p>Stories like this are found all around Australia&#x27;s coast. Islands that people once walked to. Reefs that were hills. Bays that were hunting grounds. The possibility they raise is thrilling: that people have been passing on an accurate description of a vanished landscape for some 400 generations, far longer than any written record.</p><blockquote class="wpull"><p>If these stories are memories, they are among the oldest accurate histories anywhere on Earth.</p></blockquote></section><section class="wsec" id="aboriginal-sea-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What is solid: the sea really did come in</h3><p>The geology is not in doubt. At the Last Glacial Maximum, about 21,000 years ago, sea level stood roughly 120 metres lower than today. Tasmania and New Guinea were joined to mainland Australia in one landmass, Sahul, and the Gulf of Carpentaria was a great lake. As the ice sheets melted, the sea climbed, sometimes several centimetres a year, and reached close to its present level around 7,000 years ago. Aboriginal people had lived in Australia for tens of thousands of years by then. Their coastal homelands were drowned while they watched.</p><p>In 2016 the geographer Patrick Nunn and the linguist Nicholas Reid published a study of stories from 21 coastal locations that describe this kind of change. Their method was simple and testable.</p><figure class="wx wx--steps" id="aboriginal-sea-f1" data-n="4"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">How a story is dated</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How a story is dated"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 404" class="wx-svg" role="img" aria-labelledby="aboriginal-sea-f1-t"><title id="aboriginal-sea-f1-t">How a story is dated: a channel's depth, the claim that people once walked across, and the sea-level curve that gives a minimum age</title><defs><marker id="aboriginal-sea-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker><marker id="aboriginal-sea-f1-ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text class="wx-t-cap" x="24" y="28">Dating a story with a depth sounder and a sea-level curve</text><rect class="wx-sky" x="24" y="60" width="326" height="90"/><rect class="wx-water" x="24" y="150" width="326" height="128.0"/><path class="wx-soil wx-edge" d="M24,110C32.4,110.9 65.6,111.8 80,116C94.4,120.2 109.5,129.9 120,138C130.5,146.1 141,158.8 150,170C159,181.2 171,203.7 180,212.4C189,221.1 200.2,227.4 210,228C219.8,228.6 235.2,225.3 245,216.3C254.8,207.3 266.8,180.6 275,168C283.2,155.4 292.9,139.2 300,132C307.1,124.8 314.5,120.6 322,120C329.5,119.4 345.8,126.8 350,128L350,288.0L24,288.0Z"/><path class="wx-line wx-s2" d="M24,150H350"/><text class="wx-t-s" x="30" y="144">sea level today</text><text class="wx-t-b" x="60" y="102">mainland</text><text class="wx-t-b" x="318" y="108" text-anchor="middle">island</text><g class="wx-st" data-s="1"><path class="wx-dim" d="M210,150V228M204,150h12M204,228h12"/><text class="wx-t wx-halo" x="218" y="193">deepest point</text><text class="wx-t-b wx-halo" x="218" y="207">e.g. 30 m</text></g><g class="wx-st wx-hide" data-s="2"><path class="wx-line wx-s2 wx-dash" d="M24,228H350"/><text class="wx-t-b wx-t-a wx-halo" x="30" y="244">sea at least 30 m lower</text></g><g class="wx-st wx-hide" data-only="2"><path class="wx-flow wx-s1" d="M100,124 C150,210 250,240 300,128"/><text class="wx-t-b wx-halo" x="206" y="138" text-anchor="middle">“people walked across”</text></g><path class="wx-line" d="M420,70V330H690"/><path class="wx-guide" d="M420,70H690"/><text class="wx-t-s" x="414" y="74" text-anchor="end">0</text><path class="wx-guide" d="M420,122H690"/><text class="wx-t-s" x="414" y="126" text-anchor="end">−20 m</text><path class="wx-guide" d="M420,174H690"/><text class="wx-t-s" x="414" y="178" text-anchor="end">−40 m</text><path class="wx-guide" d="M420,226H690"/><text class="wx-t-s" x="414" y="230" text-anchor="end">−60 m</text><path class="wx-guide" d="M420,278H690"/><text class="wx-t-s" x="414" y="282" text-anchor="end">−80 m</text><path class="wx-guide" d="M420,330H690"/><text class="wx-t-s" x="414" y="334" text-anchor="end">−100 m</text><text class="wx-t-s" x="420" y="346" text-anchor="middle">14k</text><text class="wx-t-s" x="497.1" y="346" text-anchor="middle">10k</text><text class="wx-t-s" x="574.3" y="346" text-anchor="middle">6k</text><text class="wx-t-s" x="651.4" y="346" text-anchor="middle">2k</text><text class="wx-t-m" x="555" y="362" text-anchor="middle">years ago</text><text class="wx-t-m" x="420" y="58">sea level, approximate</text><path class="wx-bold wx-s2" d="M420,317C422.3,311.1 434.7,276.6 439.3,267.6C443.9,258.6 455.1,247.2 458.6,241.6C462,236 465.9,225.8 468.2,220.8C470.5,215.8 474.4,206.2 477.9,200C481.3,193.8 492.5,176.3 497.1,168.8C501.8,161.3 513,143.2 516.4,137.6C519.9,132 523.8,126.1 526.1,122C528.4,117.9 533.4,107.5 535.7,103.8C538,100.1 543,93.6 545.4,90.8C547.7,88 551.5,82.9 555,80.4C558.5,77.9 567.3,71.2 574.3,70C581.2,68.8 599,70 612.9,70C626.7,70 680.7,70 690,70"/><g class="wx-st wx-hide" data-s="3"><path class="wx-hl" d="M420,148H510V330" marker-end="url(#aboriginal-sea-f1-ah)"/><circle class="wx-accfill" cx="510" cy="148" r="5"/><text class="wx-t-b wx-t-a wx-halo" x="518" y="170">minimum age</text><text class="wx-t-b wx-halo" x="518" y="184">≈ 9,300 years</text></g><g class="wx-st wx-hide" data-s="4"><rect class="wx-accfill wx-o40" x="437.9" y="314" width="112.2" height="16"/><text class="wx-t-b wx-halo" x="556.2" y="306">21 stories:</text><text class="wx-t-b wx-t-a wx-halo" x="556.2" y="321">7,250–13,070 yrs</text></g><text class="wx-t-s" x="24" y="392">Illustrative example with a 30 m channel; real cases use local depths and regional sea-level data.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 4.</b> Today an island is separated from the mainland by a channel; its deepest point is, say, 30 m.</p><ol class="wx-steplist"><li>Today an island is separated from the mainland by a channel; its deepest point is, say, 30 m.</li><li>The story says people once walked across, so the sea must then have been at least 30 m lower.</li><li>The sea-level curve shows when the sea was last that low: here about 9,300 years ago, a minimum age.</li><li>Applied to 21 Australian stories, the method gives ages between about 7,250 and 13,070 years.</li></ol><figcaption>The method Nunn and Reid used, shown with an illustrative 30 m channel: depth, story, sea-level curve, minimum age. <span class="wx-src">Based on: Method from Nunn &amp; Reid 2016. Sea-level curve simplified from global syntheses (Lambeck et al. 2014); the 30 m channel is illustrative, not a specific site.</span></figcaption><p class="vh">Left: a cross-section through a channel between a mainland and an island, with today&#x27;s sea level and the channel&#x27;s deepest point marked at 30 metres as an example. Right: a curve of sea level rising from about minus 95 metres 14,000 years ago to zero about 6,000 years ago. Step 1 shows the channel and its depth. Step 2 adds a dashed arrow of people walking across and a dashed line for a sea at least 30 metres lower. Step 3 draws a line from minus 30 metres across to the curve and down to the time axis, giving a minimum age of about 9,300 years. Step 4 adds a band for the range of all 21 Australian stories, 7,250 to 13,070 years ago.</p></figure><p>For each story they asked how far the sea must have fallen for the story&#x27;s claim to be true, for example for an island to be joined to the mainland. They measured the depth of the water that now covers the land, then read the date from sea-level curves. Every result fell between about 7,250 and 13,070 years ago.</p></section><section class="wsec" id="aboriginal-sea-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Three stories and a warning</h3><p>Near Cairns in Queensland, the Yidindji remember a time when the shoreline lay out near the Great Barrier Reef, Fitzroy Island was part of the mainland and Green Island was much larger, with named places that are now underwater. Nunn and Reid estimate this landscape at about 10,000 to 13,000 years ago. In the Gulf of Carpentaria, a Wellesley Islands story tells how the peninsula was cut through and flooded, a change dated to about 6,000 to 7,000 years ago.</p><p>Off South Australia, Kangaroo Island was separated from the mainland about 10,000 years ago. Ngarrindjeri tradition tells how the ancestral being Ngurunderi, pursuing his wives as they waded across to the island, made the waters rise and drown them. The Kaurna name for the island, Karta Pintingga, is usually translated &#x27;island of the dead&#x27;. The island&#x27;s own Aboriginal population disappears from the archaeological record some time after it became an island.</p><aside class="wcall"><b>A warning from Port Phillip Bay</b><p>Stories from around Melbourne describe Port Phillip Bay as a dry plain where people hunted kangaroo before the sea rushed in. These have often been cited as memories of postglacial flooding. But in 2011 Guy Holdgate and colleagues proposed, from seismic surveys and cores, that the bay was partly dry as recently as about 1,000 years ago, when its narrow entrance was blocked. If so, the stories may remember a much later flood. It is a reminder that every story needs its own local geology.</p></aside></section><section class="wsec" id="aboriginal-sea-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>How could a story last 10,000 years?</h3><p>Historians of oral tradition have usually assumed that stories drift and blur within a few centuries. Nunn and Reid argue that some Aboriginal societies worked differently. Knowledge was law, tied to land, ceremony and kin. In many groups, the owners of a story were checked by people from a complementary kin group whose duty was to see that it was told and performed correctly. A mistake was not just embarrassing; it was a breach of law. Such cross-checking can, in principle, keep a story&#x27;s key facts stable for a very long time.</p><figure class="wx wx--static" id="aboriginal-sea-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">How old can a remembered event be?</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How old can a remembered event be?"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 390" class="wx-svg" role="img" aria-labelledby="aboriginal-sea-f2-t"><title id="aboriginal-sea-f2-t">Log-scale chart of how old the events behind several oral traditions are, from the 1700 Cascadia earthquake to Australian sea-level stories and the Budj Bim eruption</title><text class="wx-t-cap" x="24" y="28">How old can a remembered event be? · logarithmic time scale</text><rect class="wx-paper" x="250" y="56" width="163" height="254"/><rect class="wx-stone wx-o40" x="250" y="56" width="163" height="254"/><text class="wx-t-s" x="254" y="326">often assumed limit</text><text class="wx-t-s" x="254" y="339">of oral memory</text><path class="wx-guide" d="M250,56V314"/><text class="wx-t-s" x="250" y="358" text-anchor="middle">100</text><path class="wx-guide" d="M327.8,56V314"/><text class="wx-t-s" x="327.8" y="358" text-anchor="middle">300</text><path class="wx-guide" d="M413,56V314"/><text class="wx-t-s" x="413" y="358" text-anchor="middle">1,000</text><path class="wx-guide" d="M490.8,56V314"/><text class="wx-t-s" x="490.8" y="358" text-anchor="middle">3,000</text><path class="wx-guide" d="M576.1,56V314"/><text class="wx-t-s" x="576.1" y="358" text-anchor="middle">10,000</text><path class="wx-guide" d="M653.8,56V314"/><text class="wx-t-s" x="653.8" y="358" text-anchor="middle">30,000</text><text class="wx-t-m" x="470" y="376" text-anchor="middle">years ago (log scale)</text><text class="wx-t-b" x="240" y="82" text-anchor="end">Cascadia earthquake, 1700</text><text class="wx-t-s" x="240" y="97" text-anchor="end">Native stories + Japanese tsunami record</text><circle class="wx-accfill wx-pop" style="--d:0" cx="333.4" cy="78" r="7"/><text class="wx-t-n" x="345.4" y="82">c. 325</text><text class="wx-t-b" x="240" y="132" text-anchor="end">Mount Mazama eruption (Klamath)</text><text class="wx-t-s" x="240" y="147" text-anchor="end">Crater Lake formed; Klamath accounts</text><circle class="wx-accfill wx-pop" style="--d:1" cx="557.5" cy="128" r="7"/><text class="wx-t-n" x="569.5" y="132">c. 7,700</text><text class="wx-t-b" x="240" y="182" text-anchor="end">Australian drowning stories</text><text class="wx-t-s" x="240" y="197" text-anchor="end">21 coastal sites (Nunn &amp; Reid 2016)</text><rect class="wx-accfill wx-growx" style="--d:2" x="553.3" y="171" width="41.7" height="14" rx="7"/><text class="wx-t-n" x="603" y="182">7,250–13,070</text><text class="wx-t-b" x="240" y="232" text-anchor="end">Kangaroo Island cut off</text><text class="wx-t-s" x="240" y="247" text-anchor="end">Ngurunderi story of rising water</text><circle class="wx-accfill wx-pop" style="--d:3" cx="576.1" cy="228" r="7"/><text class="wx-t-n" x="588.1" y="232">c. 10,000</text><text class="wx-t-b" x="240" y="282" text-anchor="end">Budj Bim eruption</text><text class="wx-t-s" x="240" y="297" text-anchor="end">proposed link to Gunditjmara story</text><rect class="wx-card wx-edge wx-growx" style="--d:4" x="661.9" y="271" width="12.7" height="14" rx="7" stroke-dasharray="4 3"/><text class="wx-t-n" x="653.9" y="282" text-anchor="end">33,600–40,200</text></svg></div></div><figcaption>Ages of events that oral traditions have been linked to, on a logarithmic scale. The shaded area is the span many historians have treated as the limit of reliable oral memory. <span class="wx-src">Based on: Ludwin et al. 2005 (Cascadia); Mount Mazama eruption age from published tephra dating (c. 7,700 years); Nunn &amp; Reid 2016; Matchan et al. 2020 (Budj Bim, 36,900 ± 3,300 years). The shaded &#x27;limit&#x27; is a generalisation of historians&#x27; assumptions, not a measured value.</span></figcaption><p class="vh">A chart with a logarithmic time axis from 100 to 50,000 years ago. A shaded band from 100 to 1,000 years is labelled often assumed limit of oral memory. Dots and bars show the Cascadia earthquake of 1700 at about 325 years, the Mount Mazama eruption remembered in Klamath accounts at about 7,700 years, the 21 Australian drowning stories spanning 7,250 to 13,070 years, Kangaroo Island&#x27;s separation at about 10,000 years, and a dashed outline for the Budj Bim eruption at 33,600 to 40,200 years, whose link to Gunditjmara tradition is proposed but debated.</p></figure><p>There are hints from elsewhere that long memory is possible. The Klamath people of Oregon tell of a battle between spirits of the mountain and the sky that ended with a great mountain collapsing; Crater Lake formed when Mount Mazama erupted about 7,700 years ago. In Victoria, the Gunditjmara tell of an ancestral being who became the volcano Budj Bim, which geologists have dated to about 37,000 years ago; whether the story truly remembers the eruption is debated. On firmer ground, Pacific Northwest stories of a great earthquake and flood match the Cascadia earthquake of January 1700, which is fixed to the day by the tsunami it sent to Japan.</p><p>This matters far beyond Australia. Writers such as Graham Hancock have long argued that the world&#x27;s flood stories, from Mesopotamia to the Pacific, may preserve memories of the drowning of the Ice Age coasts. Most scholars have been sceptical, because those stories are usually vague about place and time. The Australian cases are different: they are local, specific and testable against a depth sounder. If they hold up, they give the idea of deep oral memory a solid foundation, and they suggest that other traditions deserve a more careful hearing than they usually get. They also say something about the people who told them: that for thousands of years, knowing the land exactly, including land that had been lost, was a matter of law and survival.</p></section><section class="wsec" id="aboriginal-sea-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The case for caution</h3><p>The strongest objection is inference. A person standing on a beach can see drowned tree stumps at low tide, shell middens eroding from the shoreline, or an island covered in the same animals as the mainland. It would be natural to conclude that the land was once joined, and to tell a story about how it was lost. Such a story would be accurate, but it would not be a memory.</p><p>The second objection is the record itself. Most versions were written down by colonists, missionaries and anthropologists from the 1800s onward, often in paraphrase and without noting who told them or how. By then European ideas of changing sea levels were in circulation. And the people who held these stories were being displaced from their land, which broke the chains of transmission the argument relies on. None of this makes long memory impossible. It does mean each story must be judged on its own evidence.</p><blockquote class="wpull"><p>Accurate is not the same as remembered. The hard part is telling them apart.</p></blockquote></section><section class="wsec" id="aboriginal-sea-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What would settle it</h3><p>The most convincing test would be a story that names a specific drowned feature nobody could see today, a hill, a spring, a stone arrangement, which is then found on the seabed at the depth and in the place the story implies. Underwater surveys off Western Australia have already found submerged Aboriginal stone artefacts, so such a match is not fanciful. Careful work in the archives, finding the earliest recorded version of each story, would also help separate old tradition from later influence.</p><p>Any such research depends on the communities who hold these stories and decide what may be shared. For now the verdict is plausible, and leaning hopeful. The sea-level science is secure, the pattern across 21 places is hard to dismiss, and Aboriginal Australians may be the keepers of the oldest accurate histories anywhere.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">11,120 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Oldest remembered drowning in the study, c. 13,070 years ago</span></li><li class="wtl-loss" style="--i:1"><span class="wtl-y">8,000 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Kangaroo Island cut off from the mainland</span></li><li class="wtl-event" style="--i:2"><span class="wtl-y">5,300 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Youngest drowning in the set, c. 7,250 years ago; seas near present</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">1700 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Cascadia earthquake, later matched to Native stories</span></li><li class="wtl-loss" style="--i:4"><span class="wtl-y">1788 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">British colonisation begins; disruption of many traditions</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">2016 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Nunn and Reid publish the 21-site study</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2018 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Nunn&#x27;s The Edge of Memory broadens the case worldwide</span></li></ol><details class="srcs"><summary>Sources for this case (9)</summary><ol><li>Nunn P. D., Reid N. J. (2016). Aboriginal memories of inundation of the Australian coast dating from more than 7000 years ago. Australian Geographer 47(1): 11–47. <a href="https://doi.org/10.1080/00049182.2015.1077539" target="_blank" rel="noopener">doi:10.1080/00049182.2015.1077539</a></li><li>Nunn P. D. (2018). The Edge of Memory: Ancient Stories, Oral Tradition and the Post-Glacial World. Bloomsbury Sigma.</li><li>Reid N., Nunn P. (2015). Ancient Aboriginal stories preserve history of a rise in sea level. The Conversation, January 2015.</li><li>Lambeck K., Rouby H., Purcell A., Sun Y., Sambridge M. (2014). Sea level and global ice volumes from the Last Glacial Maximum to the Holocene. PNAS 111(43): 15296–15303. <a href="https://doi.org/10.1073/pnas.1411762111" target="_blank" rel="noopener">doi:10.1073/pnas.1411762111</a></li><li>Ludwin R. S. et al. (2005). Dating the 1700 Cascadia earthquake: great coastal earthquakes in Native stories. Seismological Research Letters 76(2): 140–148. <a href="https://doi.org/10.1785/gssrl.76.2.140" target="_blank" rel="noopener">doi:10.1785/gssrl.76.2.140</a></li><li>Matchan E. L., Phillips D., Jourdan F., Oostingh K. (2020). Early human occupation of southeastern Australia: new insights from 40Ar/39Ar dating of young volcanoes. Geology 48(4): 390–394. <a href="https://doi.org/10.1130/G47166.1" target="_blank" rel="noopener">doi:10.1130/G47166.1</a></li><li>Holdgate G. R., Wagstaff B., Gallagher S. J. (2011). Did Port Phillip Bay nearly dry up between ~2800 and 1000 cal. yr BP? Australian Journal of Earth Sciences 58(2): 157–175.</li><li>Benjamin J. et al. (2020). Aboriginal artefacts on the continental shelf reveal ancient drowned cultural landscapes in northwest Australia. PLOS ONE 15(7): e0233912. <a href="https://doi.org/10.1371/journal.pone.0233912" target="_blank" rel="noopener">doi:10.1371/journal.pone.0233912</a></li><li>Vansina J. (1985). Oral Tradition as History. University of Wisconsin Press.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-aboriginal-sea" data-t="Stories Older Than the Sea: Australia&#x27;s Drowned Coasts"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>Stories Older Than the Sea: Australia&#x27;s Drowned Coasts</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-aboriginal-sea</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on
