depths from the publications cited.</span></figcaption><p class="vh">A world map in the Equal Earth projection. Step 1 shows present coastlines. Step 2 adds shaded areas of continental shelf that were dry at about minus 120 metres: the Sunda Shelf joining Sumatra, Java and Borneo to Asia; the East China Sea shelf; the Sahul shelf joining Australia and New Guinea; Bass Strait; Beringia between Siberia and Alaska; the Siberian Arctic shelf; the southern North Sea and English Channel; the Persian Gulf; the Patagonian shelf; and smaller areas off Florida, Yucatan and in the northern Adriatic. Step 3 labels the main regions. Step 4 adds numbered markers for Bouldnor Cliff, the Blinkerwall, Cosquer Cave, Atlit Yam, the Madura Strait and the Gulf of Carpentaria.</p></figure><ul class="wlist"><li>Sundaland: the Sunda Shelf joined Sumatra, Java, Borneo and mainland Southeast Asia into one great lowland crossed by rivers. Hanebuth and colleagues (2000) recorded its rapid flooding during Meltwater Pulse 1A.</li><li>Doggerland: rolling country of rivers, marshes and hills between Britain, the Netherlands, Germany and Denmark. Trawlers have dragged up mammoth bones, a Neanderthal skull fragment and, in 1931, a barbed antler point from a lump of peat.</li><li>Beringia: the land bridge over which the ancestors of Native Americans crossed, and where they may have lived for millennia before moving south.</li><li>The Gulf basin: the floor of today&#x27;s Persian Gulf, which averages only about 35 m deep, was a river valley fed by the Tigris, Euphrates and Karun and by freshwater springs.</li><li>Europe&#x27;s Atlantic and Mediterranean edges: on Spain&#x27;s steep Cantabrian coast, home of the Altamira painters, the Ice Age shore lay several kilometres further out; near Marseille, the painted Cosquer Cave can now be entered only through a tunnel 37 m under the sea.</li></ul></section><section class="wsec" id="drowned-coasts-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>What the seabed has already given back</h3><p>Where people have looked, they have found. Off Atlit in Israel, Ehud Galili&#x27;s team excavated a whole Neolithic village 8 to 12 metres down: houses, a stone-lined well 5.5 m deep, burials and a semicircle of seven standing stones of about 600 kg each around a spring, dated roughly 8,700 to 8,300 years ago. In the Solent off the Isle of Wight, Bouldnor Cliff (11 m down, about 8,000 years old) was found in 1999 when divers watched a lobster kicking worked flints out of its burrow. It has yielded worked timber and a burnt-clay floor.</p><p>In 2024 Jörn Geersen and colleagues published the Blinkerwall: 1,673 stones in a line 971 m long, 21 m under the Bay of Mecklenburg, most plausibly a drive lane for hunting reindeer, built more than 10,000 years ago and drowned between about 8,570 and 8,000 years ago. It is a Stone Age megastructure nobody had suspected.</p><aside class="wcall"><b>Fresh from the field</b><p>In 2025 Harold Berghuis, Yousuke Kaifu and colleagues described two Homo erectus skull fragments from the Madura Strait, off Java. They came from some five million cubic metres of sand dredged from about 32 m below sea level for a land-reclamation project, together with 6,732 other fossils. The sand filled an ancient valley of the Solo River, and the fossils date to about 146,000 to 131,000 years ago. They are the first hominin fossils from drowned Sundaland, and they were found by accident.</p></aside></section><section class="wsec" id="drowned-coasts-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The challengers: we have been searching the wrong half of the world</h3><p>Graham Hancock put the argument most forcefully in Underworld (2002). If archaeologists want to know what Ice Age people were capable of, he argued, they are sampling the harsh uplands and ignoring the warm, rich lowlands where most people probably lived. He paired that with flood myths from India to the Pacific, reading them as memories of drowned homelands. Stephen Oppenheimer&#x27;s Eden in the East (1998) argued that the flooding of Sundaland pushed people and ideas across Asia and the Pacific. The Indonesian geologist Danny Hilman Natawidjaja has gone further, arguing that Sundaland was home to an advanced culture.</p><p>The strongest version of this case has good archaeology behind it. Jeffrey Rose&#x27;s Gulf Oasis model (2010) notes that more than 60 new settlements appear along the Gulf shoreline around 7,500 years ago, well built and with no obvious local ancestors, just as the basin finished flooding. His reading: a population that had sheltered in the fertile basin for millennia was pushed onto the new coast. That is a testable, sober hypothesis, and it has not been ruled out.</p><blockquote class="wpull"><p>Every time divers and dredgers look carefully, the drowned coasts give something back.</p></blockquote></section><section class="wsec" id="drowned-coasts-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>Why the sea keeps its secrets</h3><p>Underwater archaeology is slow, expensive and often blind. Visibility in the North Sea can be a metre or less. Sites may lie under metres of later sediment, or may have been scoured away as the surf zone swept across them. Organic finds survive only when buried quickly in mud or peat, and trawlers have been ploughing parts of the seabed for more than a century. A single dive team can excavate a few square metres a season, while the drowned shelves cover millions of square kilometres.</p><aside class="wcall"><b>How do we know where to look?</b><p>Oil, gas and wind-farm surveys record seismic images of the seabed and the layers beneath it. From these, the Birmingham team led by Vince Gaffney mapped about 23,000 km² of drowned North Sea landscape, tracing rivers, lakes and coastlines. The Europe&#x27;s Lost Frontiers project then cored old river channels and read their sediment DNA to rebuild the plants and animals. Archaeologists can now target the likeliest places, such as river mouths, springs and sheltered bays, instead of searching at random.</p></aside><p>The important caution runs both ways. Absence of evidence on the shelves means little, because so little has been searched. But the finds so far also match the technology of their time on land: flint, antler, timber, stone walls. None of them hints at metal, writing or cities. The drowned coasts are a vast unread library, and its first pages read like the rest of the Stone Age, only richer.</p></section><section class="wsec" id="drowned-coasts-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What would settle it</h3><p>Three things would transform this debate. First, North Sea style mapping of the Sunda Shelf and the Gulf basin, where the stakes are highest and the surveys thinnest. Second, the excavation of a well-preserved coastal settlement from the Last Glacial Maximum or just after, below 40 metres, to show what the richest Ice Age homes were really like. Third, ancient DNA from the first Gulf-coast villages to test whether their people came from the drowned basin.</p><p>Until then, the fair summary is this: the drowned coasts almost certainly hold a large part of the human story from 20,000 to 7,000 years ago, and it is a scandal of attention, not of evidence, that we know so little about it.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">19,000 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Last Glacial Maximum: sea c. 120–130 m lower</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">12,650 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Meltwater Pulse 1A: c. 14–18 m rise in about 350 years</span></li><li class="wtl-loss" style="--i:2"><span class="wtl-y">9,000 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Bering land bridge flooded</span></li><li class="wtl-use" style="--i:3"><span class="wtl-y">6,700 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Atlit Yam village thriving on the Levant coast</span></li><li class="wtl-loss" style="--i:4"><span class="wtl-y">6,500 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Britain cut off as Doggerland drowns</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">6,150 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Storegga slide tsunami strikes the North Sea coasts</span></li><li class="wtl-event" style="--i:6"><span class="wtl-y">5,000 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Sea level near today&#x27;s in most regions</span></li><li class="wtl-find" style="--i:7"><span class="wtl-y">1999 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Divers find Bouldnor Cliff after a lobster digs up flints</span></li><li class="wtl-find" style="--i:8"><span class="wtl-y">2024 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Blinkerwall published from the Bay of Mecklenburg</span></li><li class="wtl-find" style="--i:9"><span class="wtl-y">2025 CE</span><span class="wtl-k">Found</span><span class="wtl-t">First hominin fossils from submerged Sundaland published</span></li></ol><details class="srcs"><summary>Sources for this case (14)</summary><ol><li>Lambeck K., Rouby H., Purcell A., Sun Y., Sambridge M. (2014). Sea level and global ice volumes from the Last Glacial Maximum to the Holocene. PNAS 111(43): 15296–15303. <a href="https://doi.org/10.1073/pnas.1411762111" target="_blank" rel="noopener">doi:10.1073/pnas.1411762111</a></li><li>Deschamps P. et al. (2012). Ice-sheet collapse and sea-level rise at the Bølling warming 14,600 years ago. Nature 483: 559–564. <a href="https://doi.org/10.1038/nature10902" target="_blank" rel="noopener">doi:10.1038/nature10902</a></li><li>Hanebuth T., Stattegger K., Grootes P. M. (2000). Rapid flooding of the Sunda Shelf: a late-glacial sea-level record. Science 288: 1033–1035. <a href="https://doi.org/10.1126/science.288.5468.1033" target="_blank" rel="noopener">doi:10.1126/science.288.5468.1033</a></li><li>Jakobsson M. et al. (2017). Post-glacial flooding of the Bering Land Bridge dated to 11 cal ka BP based on new geophysical and sediment records. Climate of the Past 13: 991–1005. <a href="https://doi.org/10.5194/cp-13-991-2017" target="_blank" rel="noopener">doi:10.5194/cp-13-991-2017</a></li><li>Geersen J. et al. (2024). A submerged Stone Age hunting architecture from the Western Baltic Sea. PNAS 121(8): e2312008121. <a href="https://doi.org/10.1073/pnas.2312008121" target="_blank" rel="noopener">doi:10.1073/pnas.2312008121</a></li><li>Berghuis H. W. K., Kaifu Y. et al. (2025). The late Middle Pleistocene Homo erectus of the Madura Strait, first hominin fossils from submerged Sundaland. Quaternary Environments and Humans 3(2): 100068. <a href="https://doi.org/10.1016/j.qeh.2025.100068" target="_blank" rel="noopener">doi:10.1016/j.qeh.2025.100068</a></li><li>Gaffney V., Thomson K., Fitch S. (eds) (2007). Mapping Doggerland: The Mesolithic Landscapes of the Southern North Sea. Archaeopress.</li><li>Galili E. et al. (1993). Atlit-Yam: a prehistoric site on the sea floor off the Israeli coast. Journal of Field Archaeology 20(2): 133–157.</li><li>Smith O. et al. (2015). Sedimentary DNA from a submerged site reveals wheat in the British Isles 8000 years ago. Science 347: 998–1001. <a href="https://doi.org/10.1126/science.1261278" target="_blank" rel="noopener">doi:10.1126/science.1261278</a></li><li>Rose J. I. (2010). New light on human prehistory in the Arabo-Persian Gulf Oasis. Current Anthropology 51(6): 849–883. <a href="https://doi.org/10.1086/657397" target="_blank" rel="noopener">doi:10.1086/657397</a></li><li>Bailey G. N., Flemming N. C. (2008). Archaeology of the continental shelf: marine resources, submerged landscapes and underwater archaeology. Quaternary Science Reviews 27: 2153–2165. <a href="https://doi.org/10.1016/j.quascirev.2008.08.012" target="_blank" rel="noopener">doi:10.1016/j.quascirev.2008.08.012</a></li><li>Hancock G. (2002). Underworld: Flooded Kingdoms of the Ice Age. Michael Joseph.</li><li>Oppenheimer S. (1998). Eden in the East: The Drowned Continent of Southeast Asia. Weidenfeld &amp; Nicolson.</li><li>Clottes J., Courtin J. (1996). The Cave Beneath the Sea: Paleolithic Images at Cosquer. Harry N. Abrams.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-drowned-coasts" data-t="The Drowned Coasts: A Continent&#x27;s Worth of Lost Land"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Drowned Coasts: A Continent&#x27;s Worth of Lost Land</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-drowned-coasts</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-first-americans-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Human fossil tracks at White Sands New Mexico.jpg" data-cap="White Sands National Park, New Mexico, USA" data-big><figcaption></figcaption></figure><div class="sh-k">Lost Ice Age World</div><h2 class="sh-t" id="case-first-americans-st" tabindex="-1">The First Americans: How Clovis-First Fell</h2><p class="sh-s">For sixty years textbooks said people reached the Americas about 13,000 years ago. Footprints in New Mexico now say at least 21,000.</p><div class="sh-v"><span class="vstamp vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><p class="sh-claim"><b>What the stamp rates:</b> People were living in the Americas more than 20,000 years ago, thousands of years before Clovis.</p></div><p class="v4-q">When did people first reach the Americas, and why did it take so long to admit?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>For sixty years the textbooks said the first Americans arrived about 13,000 years ago: the Clovis people.</li><li>At White Sands, New Mexico, human footprints beside an ancient lake have been dated four different ways.</li><li>All four point to about 23,000 to 21,000 years ago.</li><li>Genetics allows a split from Siberian populations in that window.</li><li>The footprints are strong evidence; the tools, camps and skeletons of those people are still being found.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Archaeology</span><span class="thr">Geology</span><span class="thr">Biology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="23000" >23,000</b><span class="ctr-u"> years</span></div><div class="ctr-l">age of the oldest White Sands footprints</div><div class="ctr-c">Bennett et al. 2021; Pigati et al. 2023</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="4" >4</b><span class="ctr-u"> methods</span></div><div class="ctr-l">independent dating approaches at White Sands: seeds, pollen, quartz, lake mud</div><div class="ctr-c">2021–2025 studies</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="1997" >1,997</b><span class="ctr-u"> </span></div><div class="ctr-l">year a panel of sceptics accepted Monte Verde as pre-Clovis</div><div class="ctr-c">Meltzer et al. 1997</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="130000" >130,000</b><span class="ctr-u"> years</span></div><div class="ctr-l">age claimed for the Cerutti Mastodon site (contested)</div><div class="ctr-c">Holen et al. 2017</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>People were living in the Americas more than 20,000 years ago, thousands of years before Clovis.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">White Sands is the key. The footprints are unmistakably human, and their age has been measured four ways: aquatic plant seeds (2021), terrestrial conifer pollen and quartz luminescence (2023), and the mud of the ancient lake (2025), all pointing to about 23,000–21,000 years ago. Genetics allows a split from Siberians in that window. What remains thin is everything around the footprints: tools, camps and skeletons from that age. The claim is strong; the fuller picture is still being assembled.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 4 of 6, fairly sure"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>fairly sure</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">For most of the 20th century textbooks presented Clovis-first as settled, a clear case of overconfidence. Many now say &#x27;about 15,000–16,000 years ago&#x27;, which is safe but lags behind White Sands. Meanwhile, much older claims like Cerutti are sometimes repeated in popular media as if established. The honest line is: more than 20,000 years is strong, much older is open.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>The Clovis culture, known for fluted spear points, is dated to about 13,050–12,750 years ago.<small>Waters et al. 2020, Science Advances</small></li><li>Monte Verde II in southern Chile was occupied about 14,500 years ago; a panel of sceptics accepted it after a site visit in 1997.<small>Dillehay 1997; Meltzer et al. 1997</small></li><li>Several other sites predate Clovis: Paisley Caves, Oregon (c. 14,300 years), Page-Ladson, Florida (c. 14,550) and Cooper&#x27;s Ferry, Idaho (c. 16,000).<small>Gilbert et al. 2008; Halligan et al. 2016; Davis et al. 2019</small></li><li>Human footprints at White Sands, New Mexico, have been dated to about 23,000–21,000 years ago using seeds, conifer pollen, quartz grains and ancient lake mud.<small>Bennett et al. 2021; Pigati et al. 2023; Holliday et al. 2025</small></li><li>Genetic studies place the separation of Native American ancestors from Siberian populations at roughly 25,000–20,000 years ago.<small>Raghavan et al. 2015, Science</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Which route the first people took: down the Pacific coast by boat, through an ice-free corridor, or both at different times.</li><li>Whether sites claimed at 24,000 to 33,000 years old (Bluefish Caves, Chiquihuite Cave, Pedra Furada) show human work or natural breakage.</li><li>Whether the Cerutti Mastodon site in California records humans breaking bones about 130,000 years ago, which would mean an unknown earlier population.</li><li>Why a faint Australasian genetic signal (&#x27;Population Y&#x27;) appears in some Amazonian peoples.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>The Pacific coast of the Ice Age, the likeliest early route, now lies tens of metres underwater.</li><li>Traces of small, mobile groups of 20,000+ years ago: a few campfires and footprints spread over a continent, most of them eroded or buried.</li><li>Human skeletons older than about 13,000 years in the Americas, which remain extremely rare.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Today&#x27;s consensus has moved a long way. Almost all specialists accept that people were in the Americas before Clovis, by at least 14,500–16,000 years ago, and most now accept White Sands as strong evidence for people south of the ice sheets by about 23,000 years ago. The favoured model is a small population that lived in Beringia for millennia, then moved south, probably along the Pacific coast. Much older claims, such as Cerutti at 130,000 years, are treated with deep scepticism because the &#x27;tools&#x27; could be natural.</p><ul><li>Clovis was a widespread technology, not the first people.</li><li>White Sands is accepted by many former sceptics, including geologists who once questioned its dates.</li><li>Claims older than about 25,000 years need unambiguous artefacts and human remains, not broken bones or rockfall-flaked stones.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>For decades, researchers who reported pre-Clovis sites met fierce resistance. Tom Dillehay spent some twenty years defending Monte Verde. Niède Guidon argued that people sheltered at Pedra Furada, Brazil, more than 30,000 years ago. Steven Holen&#x27;s team proposed that broken mastodon bones in California show people there 130,000 years ago. Graham Hancock&#x27;s America Before uses this history to argue that archaeology&#x27;s orthodoxy has repeatedly been wrong about the Americas, that people arrived far earlier than admitted, and that the continent holds a deeper, stranger past, including the Australasian genetic signal in the Amazon.</p><ul><li>Clovis-first was held as near-dogma for about sixty years and turned out wrong.</li><li>White Sands vindicated those who argued for a Last Glacial Maximum presence.</li><li>Evidence of older arrivals is exactly what would be hardest to find, if early groups were few and coastal.</li></ul><div class="face-s"><b>Its strongest point</b><p>They were right that Clovis-first was wrong. The peopling of the Americas is now pushed back by at least 8,000 years, and the scientists who said so early were treated as cranks for decades.</p></div><p class="face-cr"><b>Credit</b> Tom Dillehay; Niède Guidon; Steven Holen; Graham Hancock (America Before, 2019; Ancient Apocalypse season 2, 2024)</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Human remains or unambiguous stone tools at a securely dated site older than 25,000 years.</li><li>Survey and coring of drowned Ice Age coastlines off British Columbia and Alaska for coastal campsites.</li><li>Ancient DNA from a pre-Clovis individual, showing how they relate to later Native Americans.</li><li>Independent re-excavation of Cerutti-type sites with modern taphonomic controls.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">6 min read · 1,286 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The First Americans: How Clovis-First Fell"><button type="button" class="wtoc-i" data-go="first-americans-s1">Footprints that rewrote a continent</button><button type="button" class="wtoc-i" data-go="first-americans-s2">The age of Clovis first</button><button type="button" class="wtoc-i" data-go="first-americans-s3">The wall breaks at Monte Verde</button><button type="button" class="wtoc-i" data-go="first-americans-s4">White Sands: tested four ways</button><button type="button" class="wtoc-i" data-go="first-americans-s5">Why the resistance lasted so long</button><button type="button" class="wtoc-i" data-go="first-americans-s6">The challengers: older, and stranger?</button><button type="button" class="wtoc-i" data-go="first-americans-s7">What time has hidden, and what would settle it</button></nav></div><section class="wsec" id="first-americans-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Footprints that rewrote a continent</h3><p>Some 23,000 years ago, on the soft shore of a lake in what is now New Mexico, a group of people walked through the mud. Children ran and splashed. Adults strode past the tracks of mammoths and giant ground sloths. The mud dried, was buried, and waited. When archaeologists published the footprints in 2021, the tracks landed like a small earthquake, because according to the story most of us were taught, nobody should have been there for another 10,000 years.</p><p>The peopling of the Americas is one of the great stories of prehistory, and one of the best examples of a scientific consensus that held too tightly for too long. It is also a live lesson in how evidence finally wins.</p><blockquote class="wpull"><p>For sixty years, the oldest Americans had a fixed birthday. Then the ground kept offering older ones.</p></blockquote></section><section class="wsec" id="first-americans-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The age of Clovis first</h3><p>In 1927 at Folsom, New Mexico, a spear point was found lodged among the ribs of an extinct bison, finally showing that people had lived in America during the Ice Age. In the early 1930s, at Blackwater Draw near Clovis, New Mexico, larger fluted points turned up with mammoth bones. The Clovis style was soon found across North America. By 1964, C. Vance Haynes had set out an elegant model in Science: big-game hunters crossed Beringia, walked south through a gap between the ice sheets and spread across the continents within a few centuries.</p><p>The model was tidy, testable and, for decades, treated as the rule. Clovis is now dated to about 13,050 to 12,750 years ago. Claims of anything older were examined with a severity rarely applied to Clovis itself, and almost all were rejected. Careers suffered. The phrase &#x27;Clovis police&#x27; entered the field&#x27;s vocabulary.</p><figure class="wx wx--steps" id="first-americans-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">How the first Americans arrived: the model, revised</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How the first Americans arrived: the model, revised"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" class="wx-svg" role="img" aria-labelledby="first-americans-f1-t"><title id="first-americans-f1-t">Map of the Americas at the end of the Ice Age showing ice sheets, Beringia, proposed routes and dated early sites, step by step</title><defs><marker id="first-americans-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker><marker id="first-americans-f1-ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker><clipPath id="first-americans-f1-clip"><rect x="16" y="56" width="390" height="418.6" rx="6"/></clipPath></defs><text class="wx-t-cap" x="24" y="28">How the first Americans arrived: the model, revised</text><rect class="wx-water wx-o40" x="16" y="56" width="390" height="418.6" rx="6"/><g clip-path="url(#first-americans-f1-clip)"><path class="wx-c1 wx-o60" d="M31.1,81.7L36.9,81.1L42.6,80.5L48.2,79.9L53.9,79.3L58.8,72.7L63.7,66.7L68.5,61.1L73.1,56L67,56.7L60.7,57.3L54.4,58L48.1,58.7L47.3,61.3L46.6,64.1L45.8,66.9L45.1,69.9L41.6,72.7L38.2,75.7L34.7,78.6ZM53.9,79.3L56.7,78.9L59.5,78.6L62.3,78.3L65.1,78L66.6,78.9L68,79.9L69.5,80.8L71,81.7L72.7,83.3L74.3,84.9L 201.3,35.2"/><text class="wx-t-b wx-halo" x="204.3" y="39.2" text-anchor="start">Bluefish Caves</text><text class="wx-t-s wx-halo" x="204.3" y="52.2" text-anchor="start">24,000 yrs? (contested)</text></g><g class="wx-st wx-hide" data-s="5"><circle class="wx-paper wx-edge" cx="212.1" cy="193.9" r="4"/><circle class="wx-line" cx="212.1" cy="193.9" r="6" stroke-dasharray="2 2"/><path class="wx-thin" d="M212.1,193.9L232.1,219.9"/><text class="wx-t-b wx-halo" x="235.1" y="223.9" text-anchor="start">Chiquihuite Cave</text><text class="wx-t-s wx-halo" x="235.1" y="236.9" text-anchor="start">33,000 yrs? (contested)</text></g><g class="wx-st wx-hide" data-s="5"><circle class="wx-paper wx-edge" cx="375.6" cy="316.3" r="4"/><circle class="wx-line" cx="375.6" cy="316.3" r="6" stroke-dasharray="2 2"/><path class="wx-thin" d="M375.6,316.3L369.6,352.3"/><text class="wx-t-b wx-halo" x="366.6" y="356.3" text-anchor="end">Pedra Furada</text><text class="wx-t-s wx-halo" x="366.6" y="369.3" text-anchor="end">32,000+ yrs? (contested)</text></g><g class="wx-st wx-hide" data-only="1"><text class="wx-t-h" x="428" y="84">20,000 years ago</text><text class="wx-t" x="428" y="106">Sea level is about 120 m lower.</text><text class="wx-t" x="428" y="123">Beringia joins Siberia to Alaska;</text><text class="wx-t" x="428" y="140">ice sheets cover most of Canada.</text></g><g class="wx-st wx-hide" data-only="2"><text class="wx-t-h" x="428" y="84">Clovis first</text><text class="wx-t" x="428" y="106">From the 1930s to the 1990s the</text><text class="wx-t" x="428" y="123">textbook model: big-game hunters</text><text class="wx-t" x="428" y="140">walk south through a gap in the</text><text class="wx-t" x="428" y="157">ice about 13,000 years ago.</text><text class="wx-t-m" x="428" y="174">Older claims were routinely</text><text class="wx-t-m" x="428" y="191">dismissed.</text></g><g class="wx-st wx-hide" data-only="3"><text class="wx-t-h" x="428" y="84">The wall breaks</text><text class="wx-t" x="428" y="106">Monte Verde, in southern Chile,</text><text class="wx-t" x="428" y="123">is accepted in 1997 after a site</text><text class="wx-t" x="428" y="140">visit by sceptics. People were</text><text class="wx-t" x="428" y="157">16,000 km south of Beringia</text><text class="wx-t" x="428" y="174">before Clovis. A coastal route</text><text class="wx-t" x="428" y="191">becomes the favoured model.</text></g><g class="wx-st wx-hide" data-only="4"><text class="wx-t-h" x="428" y="84">Footprints in the mud</text><text class="wx-t" x="428" y="106">At White Sands, New Mexico,</text><text class="wx-t" x="428" y="123">human tracks dated by seeds,</text><text class="wx-t" x="428" y="140">pollen, quartz grains and lake</text><text class="wx-t" x="428" y="157">mud to c. 23,000–21,000 years:</text><text class="wx-t" x="428" y="174">people south of the ice at the</text><text class="wx-t" x="428" y="191">glacial maximum.</text></g><g class="wx-st wx-hide" data-only="5"><text class="wx-t-h" x="428" y="84">Still contested</text><text class="wx-t" x="428" y="106">Older claims rest on broken</text><text class="wx-t" x="428" y="123">bones or stones that nature</text><text class="wx-t" x="428" y="140">can also break. They are not</text><text class="wx-t" x="428" y="157">ruled out, but none has won</text><text class="wx-t" x="428" y="174">broad acceptance.</text><text class="wx-t-m" x="428" y="191">Dashed rings: contested.</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> About 20,000 years ago: Beringia is dry land and ice sheets cover most of Canada.</p><ol class="wx-steplist"><li>About 20,000 years ago: Beringia is dry land and ice sheets cover most of Canada.</li><li>Clovis first: hunters walk south through an ice-free corridor about 13,000 years ago.</li><li>Monte Verde (accepted 1997) and Paisley Caves: people were here before Clovis, perhaps via the coast.</li><li>White Sands: footprints dated to about 23,000–21,000 years ago, during the glacial maximum.</li><li>Still contested: claims from 24,000 to 130,000 years that have not won broad acceptance.</li></ol><figcaption>Tap through how the story changed: from Clovis hunters walking a corridor in the ice, to Monte Verde and the coastal route, to footprints from the glacial maximum and the contested claims beyond. <span class="wx-src">Based on: Land: Natural Earth 1:110m. Ice-sheet outline and Beringia simplified and schematic (after Dyke 2004 and standard reconstructions). Site ages from Waters et al. 2020, Dillehay 1997, Gilbert et al. 2008, Bennett et al. 2021, Pigati et al. 2023, Bourgeon et al. 2017, Ardelean et al. 2020, Guidon &amp; Delibrias 1986, Holen et al. 2017.</span></figcaption><p class="vh">A map of North and South America at the end of the Ice Age. Step 1 shows ice sheets covering most of Canada and the dry Beringia land bridge joining Alaska and Siberia. Step 2 adds a dashed arrow for the ice-free corridor between the ice sheets and a marker for Clovis sites in New Mexico, dated about 13,050 to 12,750 years ago. Step 3 adds a moving dashed line down the Pacific coast and markers for Paisley Caves in Oregon at about 14,300 years and Monte Verde in Chile at about 14,500 years. Step 4 adds White Sands, New Mexico, at 23,000 to 21,000 years. Step 5 adds dashed rings for contested claims: Bluefish Caves, Yukon, 24,000 years; Chiquihuite Cave, Mexico, 33,000 years; Pedra Furada, Brazil, 32,000 years or more; and the Cerutti Mastodon, California, 130,000 years.</p></figure></section><section class="wsec" id="first-americans-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The wall breaks at Monte Verde</h3><p>The site that broke the wall was a boggy creek bank in southern Chile. From 1977 Tom Dillehay excavated Monte Verde, where a peat layer had preserved wooden foundations of huts, reeds knotted around stakes, seaweed carried from the coast and bones of gomphotheres, elephant relatives. Its radiocarbon dates came out at about 14,500 years ago, a thousand years before Clovis and some 16,000 km from Beringia. For twenty years many colleagues refused to accept it. In 1997 a group of leading sceptics visited the site, examined the finds and, remarkably, agreed: Monte Verde was real and pre-Clovis.</p><p>Other sites followed. Human DNA in dried faeces from Paisley Caves in Oregon dated to about 14,300 years ago. Cut-marked mastodon bones and tools at Page-Ladson in Florida came in at about 14,550 years. At Cooper&#x27;s Ferry in Idaho, Loren Davis&#x27;s team reported occupation about 16,000 years ago. The ice-free corridor may not have been open or livable until about 13,500 years ago, so attention turned to the coast: people may have followed a &#x27;kelp highway&#x27; of rich shorelines down the Pacific edge, now drowned by the rising sea.</p><aside class="wcall"><b>Fresh from the field</b><p>In March 2026 a team led by Todd Surovell argued in Science that the Monte Verde layers are only about 4,200 to 8,200 years old, reopening the site&#x27;s age. The original excavators, including Tom Dillehay, replied that the new work sampled the wrong deposits, and the argument is still running. The case for people in the Americas before Clovis no longer rests on Monte Verde alone: White Sands carries most of the weight.</p></aside></section><section class="wsec" id="first-americans-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>White Sands: tested four ways</h3><p>Matthew Bennett, David Bustos and colleagues dated the White Sands footprints in 2021 using seeds of the aquatic plant Ruppia from layers above and below the tracks: 23,000 to 21,000 years ago. Critics raised a fair objection. Water plants can absorb old carbon dissolved in lake water, which makes them look older than they are.</p><aside class="wcall"><b>How do we know?</b><p>In 2023 Jeffrey Pigati and colleagues answered the critics with two independent methods: radiocarbon dates on pollen from land-growing conifers, which take carbon from the air, and optically stimulated luminescence on quartz grains, which measures when sediment was last exposed to light. Both agreed with the seed dates. In June 2025 a team led by the geoarchaeologist Vance Holliday dated the mud of ancient Lake Otero and found 20,700 to 22,400 years. Four materials, one answer.</p></aside><figure class="wx wx--static" id="first-americans-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">How old? Claimed ages of early American sites</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How old? Claimed ages of early American sites"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" class="wx-svg" role="img" aria-labelledby="first-americans-f2-t"><title id="first-americans-f2-t">Bar chart of claimed ages of early American sites, from Clovis at about 13,000 years to White Sands at about 23,000, with contested older claims shown dashed</title><text class="wx-t-cap" x="24" y="28">How old? Claimed ages of early sites in the Americas</text><path class="wx-guide" d="M200,60V374"/><text class="wx-t-s" x="200" y="392" text-anchor="middle">0</text><path class="wx-guide" d="M254.4,60V374"/><text class="wx-t-s" x="254.4" y="392" text-anchor="middle">4k</text><path class="wx-guide" d="M308.9,60V374"/><text class="wx-t-s" x="308.9" y="392" text-anchor="middle">8k</text><path class="wx-guide" d="M363.3,60V374"/><text class="wx-t-s" x="363.3" y="392" text-anchor="middle">12k</text><path class="wx-guide" d="M417.8,60V374"/><text class="wx-t-s" x="417.8" y="392" text-anchor="middle">16k</text><path class="wx-guide" d="M472.2,60V374"/><text class="wx-t-s" x="472.2" y="392" text-anchor="middle">20k</text><path class="wx-guide" d="M526.7,60V374"/><text class="wx-t-s" x="526.7" y="392" text-anchor="middle">24k</text><path class="wx-guide" d="M581.1,60V374"/><text class="wx-t-s" x="581.1" y="392" text-anchor="middle">28k</text><path class="wx-guide" d="M635.6,60V374"/><text class="wx-t-s" x="635.6" y="392" text-anchor="middle">32k</text><path class="wx-guide" d="M690,60V374"/><text class="wx-t-s" x="690" y="392" text-anchor="middle">36k</text><text class="wx-t-m" x="445" y="410" text-anchor="middle">thousands of years ago</text><rect class="wx-ice wx-o60" x="472.2" y="60" width="81.7" height="314"/><text class="wx-t-s" x="513.1" y="54" text-anchor="middle">glacial maximum</text><text class="wx-t-b" x="190" y="88" text-anchor="end">Clovis culture</text><rect class="wx-accfill wx-growx" style="--d:0" x="200" y="78" width="177.6" height="12" rx="2"/><rect class="wx-c1 wx-pop" style="--d:3" x="373.5" y="76" width="4.1" height="16" rx="2"/><text class="wx-t-s" x="206" y="104">accepted</text><text class="wx-t-b" x="190" y="126" text-anchor="end">Paisley Caves, Oregon</text><rect class="wx-accfill wx-growx" style="--d:1" x="200" y="116" width="194.6" height="12" rx="2"/><rect class="wx-c1 wx-pop" style="--d:4" x="391.9" y="114" width="3" height="16" rx="2"/><text class="wx-t-s" x="206" y="142">accepted</text><text class="wx-t-b" x="190" y="164" text-anchor="end">Monte Verde II, Chile</text><rect class="wx-accfill wx-growx" style="--d:2" x="200" y="154" width="198.7" height="12" rx="2"/><rect class="wx-c1 wx-pop" style="--d:5" x="393.3" y="152" width="5.4" height="16" rx="2"/><text class="wx-t-s" x="206" y="180">accepted since 1997</text><text class="wx-t-b" x="190" y="202" text-anchor="end">White Sands, New Mexico</text><rect class="wx-accfill wx-growx" style="--d:3" x="200" y="192" width="313.1" height="12" rx="2"/><rect class="wx-c1 wx-pop" style="--d:6" x="485.8" y="190" width="27.2" height="16" rx="2"/><text class="wx-t-s" x="206" y="218">strong: seeds, pollen, quartz and lake mud</text><text class="wx-t-b" x="190" y="240" text-anchor="end">Bluefish Caves, Yukon</text><rect class="wx-card wx-edge-soft wx-growx" style="--d:4" x="200" y="230" width="326.7" height="12" rx="2" stroke-dasharray="4 3"/><text class="wx-t-s" x="206" y="256">contested cut-marked bones</text><text class="wx-t-b" x="190" y="278" text-anchor="end">Chiquihuite Cave, Mexico</text><rect class="wx-card wx-edge-soft wx-growx" style="--d:5" x="200" y="268" width="449.2" height="12" rx="2" stroke-dasharray="4 3"/><text class="wx-t-s" x="206" y="294">contested stone tools, c. 33,000–31,000</text><text class="wx-t-b" x="190" y="316" text-anchor="end">Pedra Furada, Brazil</text><rect class="wx-card wx-edge-soft wx-growx" style="--d:6" x="200" y="306" width="490" height="12" rx="2" stroke-dasharray="4 3"/><text class="wx-t-b" x="696" y="316">→</text><text class="wx-t-s" x="206" y="332">contested; claims from 32,000 to 50,000+</text><text class="wx-t-b" x="190" y="354" text-anchor="end">Cerutti Mastodon, California</text><rect class="wx-card wx-edge-soft wx-growx" style="--d:7" x="200" y="344" width="490" height="12" rx="2" stroke-dasharray="4 3"/><text class="wx-t-b" x="696" y="354">→</text><text class="wx-t-s" x="206" y="370">130,000 claimed; contested</text></svg></div></div><figcaption>Solid bars are widely accepted ages; dashed bars are contested claims. The pale band marks the Last Glacial Maximum. <span class="wx-src">Based on: Waters et al. 2020; Gilbert et al. 2008; Dillehay 1997; Bennett et al. 2021; Pigati et al. 2023; Holliday et al. 2025; Bourgeon et al. 2017; Ardelean et al. 2020; Guidon &amp; Delibrias 1986; Holen et al. 2017.</span></figcaption><p class="vh">A horizontal bar chart of site ages from 0 to 36,000 years ago. Solid bars: Clovis culture about 13,000 years, Paisley Caves about 14,300, Monte Verde II about 14,500, and White Sands 21,000 to 23,000, falling inside a shaded band for the glacial maximum from 26,000 to 20,000 years ago. Dashed bars for contested claims: Bluefish Caves about 24,000 years, Chiquihuite Cave 31,000 to 33,000, Pedra Furada 32,000 to over 50,000, and the Cerutti Mastodon at 130,000 years, shown running off the chart.</p></figure><p>The implication is profound. People were south of the ice sheets during the Last Glacial Maximum, when Beringia was dry land and the northern route was frozen shut. They must have arrived even earlier, or come along the coast. Genetic estimates, which place the split between Native American ancestors and Siberians at roughly 25,000 to 20,000 years ago, allow exactly that.</p></section><section class="wsec" id="first-americans-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Why the resistance lasted so long</h3><p>It is tempting to cast the Clovis-first era as simple stubbornness, but the story is more instructive than that. Many early pre-Clovis claims really were weak: charcoal that could have come from natural fires, &#x27;tools&#x27; that were stones cracked by frost or rockfall, and dates run on contaminated samples. Sceptics were right to reject those. The trouble was that the scepticism hardened into a filter. A site that did not fit was assumed to be wrong before it was examined, and a single ambiguous detail was enough to dismiss years of careful work.</p><p>The cost was real. Jacques Cinq-Mars, who excavated Bluefish Caves in the Yukon from the late 1970s and argued for an Ice Age human presence there, later described the hostility he met; in 2017 Lauriane Bourgeon&#x27;s re-analysis of cut-marked bones from the caves pushed their age to about 24,000 years. Dillehay&#x27;s Monte Verde volumes sat under suspicion for two decades. The lesson for this site is the one the challengers draw: consensus can lag behind evidence. The lesson the mainstream draws is also fair: the claims that finally won did so with excavation, dating and replication, not with argument alone.</p><blockquote class="wpull"><p>Scepticism is a tool. Clovis-first turned it into a wall.</p></blockquote></section><section class="wsec" id="first-americans-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>The challengers: older, and stranger?</h3><p>If Clovis-first was wrong, how much else might be? Niède Guidon argued from the 1980s that Pedra Furada, a painted rock shelter in north-east Brazil, held hearths more than 30,000 years old; sceptics answered that its &#x27;tools&#x27; could be quartzite broken by falling rocks. At Chiquihuite Cave in Mexico, Ciprian Ardelean&#x27;s team (2020) reported stone tools as early as 33,000 to 31,000 years ago; others doubt they are artefacts. Most startling, Steven Holen and colleagues (2017) argued that mastodon bones at the Cerutti site near San Diego were broken by people using stone hammers about 130,000 years ago. Critics, including prominent pre-Clovis researchers, doubt the bones were broken by hand.</p><p>Graham Hancock&#x27;s America Before (2019) and season two of Ancient Apocalypse (2024) use this history to argue that the Americas have a much deeper past than archaeology admits. He highlights the &#x27;Population Y&#x27; signal, a faint Australasian genetic trace identified by Pontus Skoglund and colleagues in 2015 among some Amazonian peoples, and asks what else the orthodoxy has missed. On the central point, that the experts held a too-young date far too long, history is on his side.</p><blockquote class="wpull"><p>The challengers were right about the direction. The open question is how far back the evidence can really carry us.</p></blockquote></section><section class="wsec" id="first-americans-s7"><h3 class="wsec-h"><span class="wsec-n">07</span>What time has hidden, and what would settle it</h3><p>The earliest Americans were probably few and mobile, and the likeliest route, the Ice Age Pacific shore, now lies 50 to 120 metres underwater. Their camps would leave scattered hearths and flakes, not monuments. Human skeletons older than about 13,000 years are almost unknown. So absence of older evidence is weak evidence. But it cuts both ways: a broken bone is not a person, and extraordinary ages need unmistakable tools, hearths or human remains.</p><p>What would settle it: a human skeleton or unambiguous stone tools at a securely dated site older than 25,000 years; ancient DNA from a pre-Clovis individual; and survey of drowned coastal landscapes off Alaska and British Columbia. For now the verdict is clear on one point: people were in the Americas more than 20,000 years ago, and the textbooks have some catching up to do.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-use" style="--i:0"><span class="wtl-y">21,000 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Footprints pressed into lake mud at White Sands</span></li><li class="wtl-use" style="--i:1"><span class="wtl-y">12,550 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Monte Verde II occupied in southern Chile</span></li><li class="wtl-use" style="--i:2"><span class="wtl-y">11,050 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Clovis technology spreads across North America</span></li><li class="wtl-find" style="--i:3"><span class="wtl-y">1932 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Clovis points found with mammoth at Blackwater Draw</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">1964 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Haynes sets out the Clovis-first model in Science</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1997 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Sceptics visit Monte Verde and accept it</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2017 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Cerutti Mastodon claim published in Nature</span></li><li class="wtl-find" style="--i:7"><span class="wtl-y">2021 CE</span><span class="wtl-k">Found</span><span class="wtl-t">White Sands footprints dated to 23,000–21,000 years</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2023 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Pollen and quartz dates confirm White Sands</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">2025 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Lake-mud dates confirm White Sands again</span></li><li class="wtl-study" style="--i:10"><span class="wtl-y">2026 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">New Monte Verde dates challenge its age; the original team disputes them</span></li></ol><details class="srcs"><summary>Sources for this case (18)</summary><ol><li>Bennett M. R. et al. (2021). Evidence of humans in North America during the Last Glacial Maximum. Science 373: 1528–1531. <a href="https://doi.org/10.1126/science.abg7586" target="_blank" rel="noopener">doi:10.1126/science.abg7586</a></li><li>Pigati J. S. et al. (2023). Independent age estimates resolve the controversy of ancient human footprints at White Sands. Science 382: 73–75. <a href="https://doi.org/10.1126/science.adh5007" target="_blank" rel="noopener">doi:10.1126/science.adh5007</a></li><li>Holliday V. T. et al. (2025). Paleolake geochronology supports Last Glacial Maximum (LGM) age for human tracks at White Sands, New Mexico. Science Advances 11(25). <a href="https://doi.org/10.1126/sciadv.adv4951" target="_blank" rel="noopener">doi:10.1126/sciadv.adv4951</a></li><li>Waters M. R., Stafford T. W., Carlson D. L. (2020). The age of Clovis: 13,050 to 12,750 cal yr B.P. Science Advances 6(43): eaaz0455. <a href="https://doi.org/10.1126/sciadv.aaz0455" target="_blank" rel="noopener">doi:10.1126/sciadv.aaz0455</a></li><li>Haynes C. V. (1964). Fluted projectile points: their age and dispersion. Science 145: 1408–1413. <a href="https://doi.org/10.1126/science.145.3639.1408" target="_blank" rel="noopener">doi:10.1126/science.145.3639.1408</a></li><li>Dillehay T. D. (1997). Monte Verde: A Late Pleistocene Settlement in Chile, vol. 2. Smithsonian Institution Press.</li><li>Meltzer D. J. et al. (1997). On the Pleistocene antiquity of Monte Verde, southern Chile. American Antiquity 62(4): 659–663.</li><li>Gilbert M. T. P. et al. (2008). DNA from pre-Clovis human coprolites in Oregon, North America. Science 320: 786–789. <a href="https://doi.org/10.1126/science.1154116" target="_blank" rel="noopener">doi:10.1126/science.1154116</a></li><li>Davis L. G. et al. (2019). Late Upper Paleolithic occupation at Cooper&#x27;s Ferry, Idaho, USA, ~16,000 years ago. Science 365: 891–897. <a href="https://doi.org/10.1126/science.aax9830" target="_blank" rel="noopener">doi:10.1126/science.aax9830</a></li><li>Halligan J. J. et al. (2016). Pre-Clovis occupation 14,550 years ago at the Page-Ladson site, Florida, and the peopling of the Americas. Science Advances 2(5): e1600375. <a href="https://doi.org/10.1126/sciadv.1600375" target="_blank" rel="noopener">doi:10.1126/sciadv.1600375</a></li><li>Holen S. R. et al. (2017). A 130,000-year-old archaeological site in southern California, USA. Nature 544: 479–483. <a href="https://doi.org/10.1038/nature22065" target="_blank" rel="noopener">doi:10.1038/nature22065</a></li><li>Ardelean C. F. et al. (2020). Evidence of human occupation in Mexico around the Last Glacial Maximum. Nature 584: 87–92. <a href="https://doi.org/10.1038/s41586-020-2509-0" target="_blank" rel="noopener">doi:10.1038/s41586-020-2509-0</a></li><li>Guidon N., Delibrias G. (1986). Carbon-14 dates point to man in the Americas 32,000 years ago. Nature 321: 769–771. <a href="https://doi.org/10.1038/321769a0" target="_blank" rel="noopener">doi:10.1038/321769a0</a></li><li>Bourgeon L., Burke A., Higham T. (2017). Earliest human presence in North America dated to the Last Glacial Maximum: new radiocarbon dates from Bluefish Caves, Canada. PLOS ONE 12(1): e0169486. <a href="https://doi.org/10.1371/journal.pone.0169486" target="_blank" rel="noopener">doi:10.1371/journal.pone.0169486</a></li><li>Skoglund P. et al. (2015). Genetic evidence for two founding populations of the Americas. Nature 525: 104–108. <a href="https://doi.org/10.1038/nature14895" target="_blank" rel="noopener">doi:10.1038/nature14895</a></li><li>Raghavan M. et al. (2015). Genomic evidence for the Pleistocene and recent population history of Native Americans. Science 349: aab3884. <a href="https://doi.org/10.1126/science.aab3884" target="_blank" rel="noopener">doi:10.1126/science.aab3884</a></li><li>Hancock G. (2019). America Before: The Key to Earth&#x27;s Lost Civilization. St. Martin&#x27;s Press.</li><li>Surovell, T. A. et al. (2026). Monte Verde fieldwork and a younger age for the site. Science (March 2026); reported by the University of Wyoming and phys.org, with a reply by Dillehay and colleagues.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-first-americans" data-t="The First Americans: How Clovis-First Fell"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The First Americans: How Clovis-First Fell</i>. <span class="cite-u">https://residual-continuum.vercel.app/#articles/case-first-americans</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-sphinx-erosion-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Great Sphinx of Giza - 20080716a.jpg" data-cap="The Great Sphinx of Giza in its enclosure" data-big><figcaption></figcaption></figure><div class="sh-k">Lost Ice Age World</div><h2 class="sh-t" id="case-sphinx-erosion-st" tabindex="-1">The Sphinx and the Rain: Older Than Khafre?</h2><p class="sh-s">A Boston geologist looked at the Sphinx&#x27;s weathered walls and saw rain, in a land that has been desert for five thousand years.</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> The core body of the Great Sphinx was carved thousands of years before Khafre, around 7000–5000 BCE or earlier.</p></div><p class="v4-q">Does the weathering of the Sphinx enclosure show it is thousands of years older than Khafre?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>Geologist Robert Schoch argued in 1991 that the weathering of the Sphinx&#x27;s enclosure walls was caused by rain over thousands of years.</li><li>Because Egypt has been dry for about five thousand years, he dated the carving to 7000–5000 BCE.</li><li>Other geologists say salt from groundwater, dew and wet sand can do the same damage to this soft layered limestone.</li><li>The temple in front of the Sphinx is built from blocks cut out of the Sphinx&#x27;s own pit, and fits the building works of King Khafre, around 2500 BCE.</li><li>The observation is real; the very early date still needs dated evidence.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Geology</span><span class="thr">Climate</span><span class="thr">Archaeology</span></div></section><div class="ctrs"><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="73" >73</b><span class="ctr-u"> m</span></div><div class="ctr-l">length of the Great Sphinx</div><div class="ctr-c">Lehner &amp; Hawass 2017</div></div><div class="ctr"><div class="ctr-v">c. <b class="ctr-n" data-v="20" >20</b><span class="ctr-u"> m</span></div><div class="ctr-l">height from base to top of head</div><div class="ctr-c">Lehner &amp; Hawass 2017</div></div><div class="ctr"><div class="ctr-v">up to <b class="ctr-n" data-v="2.4" data-dec="1">2.4</b><span class="ctr-u"> m</span></div><div class="ctr-l">maximum depth of weathered rock under the enclosure floor</div><div class="ctr-c">Dobecki &amp; Schoch 1992</div></div><div class="ctr"><div class="ctr-v"><b class="ctr-n" data-v="7000" >7,000</b><span class="ctr-u"> BCE</span></div><div class="ctr-l">earliest date Schoch proposed in 1992 for the core body</div><div class="ctr-c">Schoch 1992</div></div></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The core body of the Great Sphinx was carved thousands of years before Khafre, around 7000–5000 BCE or earlier.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Schoch&#x27;s observation is real and his argument is geological, not mystical. But weathering rates in soft, salt-laden limestone are too uncertain to date a monument, and credible alternatives (salt crystallisation, dew, flash floods, wet sand) exist. Against the early date stands concrete archaeology: temples built of blocks from the ditch, a building sequence tied to Khafre&#x27;s complex, and no trace of an earlier carving culture at Giza. Reader&#x27;s modest version (a few centuries earlier) remains plausible; the far older date awaits evidence.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks usually state flatly that Khafre built the Sphinx. The evidence for that is strong but circumstantial: no Old Kingdom text says so, and Colin Reader&#x27;s case for a slightly earlier start is respectable. A more honest label would read &#x27;probably carved for Khafre, c. 2500 BCE&#x27;. On the far older date, the textbooks&#x27; silence is closer to the evidence.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>The Sphinx was carved from the living rock of the Giza plateau: it is about 73 m long, 20 m high and 19 m wide.<small>Lehner &amp; Hawass 2017</small></li><li>Its body lies in layered limestone of alternating hard and soft beds (Member II of the Mokattam Formation); the head is in harder rock above and the base in a hard lower bed.<small>Gauri et al. 1995</small></li><li>The walls of the Sphinx enclosure are deeply weathered, with a rolling, recessed profile and vertical fissures.<small>Schoch 1992; Gauri et al. 1995</small></li><li>No inscription of Khafre&#x27;s time names the Sphinx; the attribution to Khafre rests on its position, architecture and building sequence.<small>Lehner 1992; Hawass &amp; Lehner 1994</small></li><li>Seismic surveys found weathered rock beneath the enclosure floor, about 1.8–2.4 m deep in front and along the sides and roughly half as deep behind the Sphinx.<small>Dobecki &amp; Schoch 1992</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the enclosure&#x27;s weathering profile requires long periods of heavy rainfall or can be produced by salt crystallisation, dew and occasional storms.</li><li>How fast weathering proceeds, and whether the depth of subsurface weathering can be turned into an age at all.</li><li>Whether the Sphinx and its temples predate Khufu&#x27;s quarrying, as Colin Reader argued, placing it a few centuries before Khafre.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Any archaeological trace in Egypt of a society capable of large-scale rock carving between 9000 and 5000 BCE.</li><li>Original surfaces: the Sphinx has been repaired, re-cased and sand-cleared many times, from the New Kingdom to the 20th century.</li><li>A direct date on the carving itself; rock surfaces cannot be radiocarbon-dated, and exposure-dating of the enclosure has not been published.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Egyptologists, led by Mark Lehner and Zahi Hawass, date the Sphinx to Khafre&#x27;s reign, around 2500 BCE. They point to the building sequence: Khafre&#x27;s causeway and Valley Temple already existed when the Sphinx Temple was built against them, and the Sphinx Temple&#x27;s giant core blocks were cut from the ditch that frees the Sphinx itself. Geologists such as K. Lal Gauri and James Harrell argue that salt crystallisation from groundwater, dew and wet sand, acting on soft, layered limestone, explains the weathering without an ancient rainy age.</p><ul><li>The Sphinx Temple is built of blocks quarried from the Sphinx ditch, with matching fossil beds (Lehner).</li><li>The Sphinx complex fits the layout of Khafre&#x27;s pyramid complex and uses its causeway line.</li><li>Soft Member II limestone weathers fast; Old Kingdom tombs cut into it also show deep recesses (Gauri et al. 1995).</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>John Anthony West, following the French esoteric scholar R. A. Schwaller de Lubicz, proposed in 1979 that the Sphinx was eroded by water. In 1990 he brought Boston University geologist Robert Schoch to Giza. Schoch concluded that the enclosure walls show precipitation-induced weathering: a rolling profile and deep vertical fissures carved by rain running down the rock over thousands of years. He presented the case at the Geological Society of America in 1991 and dated the core body to about 7000–5000 BCE, later suggesting it could reach back to the end of the Ice Age. Colin Reader, an engineering geologist, agreed rainfall runoff was involved but argued only for an Early Dynastic date, a few centuries before Khafre.</p><ul><li>The enclosure profile looks different from the wind-scoured faces of nearby Old Kingdom tombs.</li><li>Subsurface weathering is about twice as deep in front of the Sphinx as behind, consistent with the rear being cut later (Dobecki &amp; Schoch 1992).</li><li>Egypt had a much wetter climate before about 3000 BCE; significant rain afterwards was rare.</li></ul><div class="face-s"><b>Its strongest point</b><p>The Sphinx enclosure shows a distinctive rounded, fissured weathering that Schoch, a trained geologist, reads as the work of prolonged rain, and heavy prolonged rain on the Giza plateau is a feature of the millennia before, not after, 2500 BCE.</p></div><p class="face-cr"><b>Credit</b> Robert M. Schoch; John Anthony West; Colin Reader (moderate version)</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Cosmogenic-nuclide exposure dating of the enclosure walls and floor, published with full data.</li><li>Long-term monitoring of weathering rates on Member II limestone at Giza under present conditions, to calibrate salt versus rain models.</li><li>Excavation of datable material (tools, pottery, organics) sealed in the lowest fills of the Sphinx ditch.</li><li>Any securely dated settlement or tool-making site on the plateau older than the Early Dynastic period.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">6 min read · 1,260 words · 2 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Sphinx and the Rain: Older Than Khafre?"><button type="button" class="wtoc-i" data-go="sphinx-erosion-s1">A geologist looks at the walls</button><button type="button" class="wtoc-i" data-go="sphinx-erosion-s2">What is solid: a statue carved from a quarry</button><button type="button" class="wtoc-i" data-go="sphinx-erosion-s3">The mainstream story: Khafre&#x27;s guardian</button><button type="button" class="wtoc-i" data-go="sphinx-erosion-s4">The challengers at their strongest</button><button type="button" class="wtoc-i" data-go="sphinx-erosion-s5">Where the argument breaks down</button><button type="button" class="wtoc-i" data-go="sphinx-erosion-s6">What would settle it</button></nav></div><section class="wsec" id="sphinx-erosion-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A geologist looks at the walls</h3><p>In 1990 a geologist from Boston University stood in the trench around the Great Sphinx and ran his hand along the rock. Robert Schoch had come at the invitation of John Anthony West, a writer who believed the Sphinx was far older than Egyptologists said. Schoch expected to find nothing surprising. Instead he saw walls that looked, to his eye, as if they had been worn by rain: a rolling, rounded profile and deep vertical fissures, the kind of weathering produced when water runs down a rock face for a very long time.</p><p>The problem was obvious. Giza has been desert for about five thousand years. If rain carved these walls, the Sphinx might date from a time when Egypt was green, long before the pyramids. In 1991 Schoch presented the idea to the Geological Society of America, and the fight that followed has never quite ended.</p><blockquote class="wpull"><p>Egyptologists read the Sphinx through its temples. Schoch read it through its rock. They reached very different ages.</p></blockquote></section><section class="wsec" id="sphinx-erosion-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What is solid: a statue carved from a quarry</h3><p>The Sphinx was not built; it was carved. Quarrymen cut a U-shaped trench into the plateau, leaving a block of rock about 73 metres long that they shaped into a lion with a human head, about 20 metres high. The body lies in layered limestone of alternating hard and soft beds, which weather at very different rates. That is why the Sphinx&#x27;s flanks look ribbed and why its body has been patched with masonry again and again, in the New Kingdom, in Roman times and in the 20th century.</p><p>Its date is inferred, not written. No text of Khafre&#x27;s reign names the Sphinx. Mark Lehner, who spent years mapping every stone of it with Zahi Hawass from 1979, built the conventional case from the ground up.</p><p>Even the best-known &#x27;inscription&#x27; does not help much. Around 1400 BCE, Thutmose IV set up a granite stela between the paws recording a dream in which the Sphinx asked to be freed from the sand. Early copyists read part of a royal name, &#x27;Khaf&#x27;, in a damaged line, but the text is now largely lost and the reading cannot carry any weight. By Thutmose&#x27;s day the Sphinx was already more than a thousand years old on anyone&#x27;s reckoning, half-buried and in need of repair.</p><figure class="wx wx--steps" id="sphinx-erosion-f1" data-n="4"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">How Egyptologists read the building sequence</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How Egyptologists read the building sequence"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" class="wx-svg" role="img" aria-labelledby="sphinx-erosion-f1-t"><title id="sphinx-erosion-f1-t">Simplified plan of the Sphinx, its enclosure, the Sphinx Temple, Khafre's Valley Temple and causeway, showing the building sequence Egyptologists infer</title><defs><marker id="sphinx-erosion-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker><marker id="sphinx-erosion-f1-ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><text class="wx-t-cap" x="24" y="28">The Sphinx complex from above · simplified plan, north at top</text><rect class="wx-sand wx-o60" x="20" y="44" width="680" height="380" rx="8"/><g class="wx-st" data-s="1"><path class="wx-stone2 wx-edge-soft" d="M402,262 L40,236 L40,252 L402,278 Z"/><text class="wx-t-b wx-halo" x="46" y="276">Khafre causeway, up to his pyramid (c. 500 m)</text></g><g class="wx-st" data-s="1"><rect class="wx-stone3 wx-edge" x="402" y="258" width="144" height="144"/><text class="wx-t-b wx-t-w" x="474" y="330" text-anchor="middle">Khafre's</text><text class="wx-t-b wx-t-w" x="474" y="345" text-anchor="middle">Valley Temple</text></g><g class="wx-st" data-s="2"><rect class="wx-soil wx-edge" x="96" y="108" width="296" height="124"/><text class="wx-t-m" x="102" y="124">enclosure: the quarried ditch</text></g><g class="wx-st" data-s="2"><path class="wx-stone wx-edge" d="M130,149.6 L329.6,141.6 L329.6,158 L373.6,160 L373.6,168 L329.6,168 L329.6,176 L373.6,176 L373.6,184 L329.6,186 L329.6,202.4 L130,194.4 Z"/><ellipse class="wx-stone2 wx-edge" cx="311.6" cy="172" rx="13" ry="15"/><text class="wx-t-b" x="210" y="177" text-anchor="middle">Sphinx, 73 m long</text></g><g class="wx-st wx-hide" data-s="3"><rect class="wx-stone3 wx-edge" x="402" y="112" width="140.8" height="140.8"/><text class="wx-t-b wx-t-w" x="472.4" y="178.4" text-anchor="middle">Sphinx</text><text class="wx-t-b wx-t-w" x="472.4" y="193.4" text-anchor="middle">Temple</text></g><g class="wx-st wx-hide" data-only="3"><path class="wx-hl" d="M180,124 C240,74 412,72 432,118" marker-end="url(#sphinx-erosion-f1-ah)"/><path class="wx-hl" d="M300,124 C360,74 412,72 472,118" marker-end="url(#sphinx-erosion-f1-ah)"/></g><g class="wx-st wx-hide" data-s="4"><path class="wx-hl" d="M402,258 H546"/><circle class="wx-accfill wx-pulse" cx="474" cy="258" r="5"/></g><g class="wx-st wx-hide" data-only="1"><g><circle class="wx-num" cx="34" cy="441" r="9"/><text class="wx-numt" x="34" y="445" text-anchor="middle">1</text></g><text class="wx-t" x="50" y="445">Khafre's causeway and Valley Temple are laid out on the plateau (c. 2550 BCE).</text><text class="wx-t-m" x="50" y="461">The south side of the Sphinx enclosure follows the causeway's line.</text></g><g class="wx-st wx-hide" data-only="2"><g><circle class="wx-num" cx="34" cy="441" r="9"/><text class="wx-numt" x="34" y="445" text-anchor="middle">2</text></g><text class="wx-t" x="50" y="445">Quarrymen cut a U-shaped ditch into the rock, leaving a core that becomes the Sphinx.</text><text class="wx-t-m" x="50" y="461">Head in harder Member III limestone; body in softer, layered Member II.</text></g><g class="wx-st wx-hide" data-only="3"><g><circle class="wx-num" cx="34" cy="441" r="9"/><text class="wx-numt" x="34" y="445" text-anchor="middle">3</text></g><text class="wx-t" x="50" y="445">Big limestone blocks from the ditch go to build the Sphinx Temple core walls.</text><text class="wx-t-m" x="50" y="461">Their fossil-rich layers match the beds left in the ditch (Lehner).</text></g><g class="wx-st wx-hide" data-only="4"><g><circle class="wx-num" cx="34" cy="441" r="9"/><text class="wx-numt" x="34" y="445" text-anchor="middle">4</text></g><text class="wx-t" x="50" y="445">The Sphinx Temple was fitted against the Valley Temple's existing north wall,</text><text class="wx-t-m" x="50" y="461">so the Khafre complex came first. Schoch replies: the core body could be older still.</text></g><path class="wx-line" d="M580,396h64"/><path class="wx-line" d="M580,391v10M644,391v10M612,393v6"/><text class="wx-t-s" x="612" y="386" text-anchor="middle">20 m</text><path class="wx-line" d="M672,110V74" marker-end="url(#sphinx-erosion-f1-ak)"/><text class="wx-t-b" x="672" y="124" text-anchor="middle">N</text><text class="wx-t-s" x="690" y="418" text-anchor="end">outlines approximate</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 4.</b> Khafre&#x27;s Valley Temple and causeway are laid out on the plateau.</p><ol class="wx-steplist"><li>Khafre&#x27;s Valley Temple and causeway are laid out on the plateau.</li><li>Quarrymen cut a ditch into the rock, leaving a core that is carved into the Sphinx.</li><li>Blocks from the ditch are used for the Sphinx Temple&#x27;s core walls.</li><li>The Sphinx Temple is fitted against the Valley Temple&#x27;s north wall: Khafre&#x27;s complex came first.</li></ol><figcaption>A simplified plan of the Sphinx complex. Tap through the order in which Mark Lehner and Zahi Hawass argue the parts were made. <span class="wx-src">Based on: After the Giza plans of Lehner 1992 and Lehner &amp; Hawass 2017. Sphinx length to scale; temple outlines and positions simplified and approximate.</span></figcaption><p class="vh">A plan view with north at the top. At the lower right is Khafre&#x27;s Valley Temple, a square about 45 metres across, with Khafre&#x27;s causeway leading west-north-west from its corner. Step 2 adds a rectangular quarried enclosure north of the causeway with the Sphinx inside it, 73 metres long and facing east. Step 3 adds the Sphinx Temple directly east of the Sphinx and north of the Valley Temple, with arrows showing blocks carried from the Sphinx ditch into its walls. Step 4 highlights the shared line where the Sphinx Temple was built against the Valley Temple&#x27;s north wall. A 20 metre scale bar and a north arrow are shown.</p></figure></section><section class="wsec" id="sphinx-erosion-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The mainstream story: Khafre&#x27;s guardian</h3><p>Lehner&#x27;s argument is architectural. The south side of the Sphinx enclosure runs along the line of Khafre&#x27;s causeway, which leads up from his Valley Temple to his pyramid. The Sphinx Temple, directly in front of the statue, was built of enormous limestone blocks, and those blocks carry the same fossil-rich layers as the beds exposed in the Sphinx ditch: they are the stone removed to free the Sphinx. The Sphinx Temple was also fitted against the north wall of Khafre&#x27;s Valley Temple, so Khafre&#x27;s complex already stood. Quarry, statue and temple, on this reading, are one project, around 2500 BCE.</p><p>The geologists who disagree with Schoch offer mechanisms too. K. Lal Gauri and colleagues (1995) argued that the soft beds of the enclosure are destroyed chiefly by salt: moisture from dew and groundwater carries dissolved salts into the rock, which crystallise and burst its surface. James Harrell proposed that wet sand, which filled the enclosure for much of its history, did the damage. Egyptologists add that the Old Kingdom was not entirely dry. Flash floods still struck: the Sadd el-Kafara dam, built in the Old Kingdom in a wadi near Helwan, appears to have been breached by one.</p></section><section class="wsec" id="sphinx-erosion-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The challengers at their strongest</h3><p>Schoch&#x27;s case has three parts. First, the shape of the weathering: the enclosure walls have a rolling, undulating profile with vertical fissures that open at the top, which he regards as a textbook signature of precipitation running down a rock face. Nearby tombs cut into the same beds in the Old Kingdom, he says, show a sharper, wind-scoured profile instead. Second, the ground: seismic surveys he carried out with the geophysicist Thomas Dobecki found weathered rock beneath the enclosure floor about 1.8 to 2.4 metres deep in front and along the sides, but only about half as deep at the back. Schoch reads that as the rear being excavated much later, perhaps under Khafre, while the front and sides are far older.</p><figure class="wx wx--static" id="sphinx-erosion-f2" data-n="0"><div class="wx-head"><span class="wx-k">Figure 2 · Animated drawing</span><h4 class="wx-title">Same limestone, rival readings</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Same limestone, rival readings"><svg Harrell: can round</text><text class="wx-t-m" x="500" y="423">and fissure without rain</text><path class="wx-thin" d="M190,114 L236,114"/><text class="wx-t-s" x="238" y="118">soft</text><path class="wx-thin" d="M190,139 L236,139"/><text class="wx-t-s" x="238" y="143">hard</text></svg></div></div><figcaption>Schematic cross-sections through three rock faces cut in the same kind of layered limestone, with the explanation each side offers. <span class="wx-src">Based on: Schematic, based on descriptions in Schoch 1992, Gauri et al. 1995 and Harrell 1994. Not drawn from measured profiles.</span></figcaption><p class="vh">Three schematic vertical cross-sections through limestone walls with alternating hard and soft beds. The first, the Sphinx enclosure wall, has deep rounded coves in the soft beds and is cut back most near the top, with a dashed line of rain running down it; the label gives Schoch&#x27;s reading of rain runoff over thousands of wet years. The second, an Old Kingdom tomb face, has sharp rectangular notches where soft beds are cut back, which Schoch reads as wind and sand erosion. The third shows the salt-weathering model, with rising moisture and salt crystals flaking the soft beds into rounded recesses, which Gauri and Harrell argue can happen without rain.</p></figure><p>Third, the climate. Egypt was much wetter before about 3000 BCE, during what is now called the African Humid Period. Assuming weathering proceeded at a steady rate, Schoch in 1992 dated the core body to about 7000 to 5000 BCE, noting that if weathering slowed with depth, the Sphinx could be older still. In later books he has linked it to the end of the Ice Age, around 9700 BCE. John Anthony West&#x27;s 1993 NBC documentary The Mystery of the Sphinx brought the debate to millions, and Graham Hancock made it a pillar of Fingerprints of the Gods.</p><aside class="wcall"><b>The middle way: Colin Reader</b><p>The British engineering geologist Colin Reader (Archaeometry, 2001) agreed that runn
