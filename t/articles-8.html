<script type="text/x-tpl" id="case-arthur-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="View from Tintagel Castle - Cornwall - England.jpg" data-cap="The view from Tintagel" data-big><figcaption></figcaption></figure><div class="sh-k">Legends and Relics</div><h2 class="sh-t" id="case-arthur-st" tabindex="-1">King Arthur: A Real Hero in Britain&#x27;s Dark Age?</h2><p class="sh-s">Rome left, the lights of Britain dimmed, and somewhere in the dark a war-leader won a famous battle. Was his name Arthur?</p><div class="sh-v"><span class="vstamp vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><p class="sh-claim"><b>What the stamp rates:</b> A real British war-leader named Arthur fought the Saxons around 500 CE.</p></div><p class="v4-q">Did a real war-leader called Arthur fight the Saxons around 500 CE?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>The world of King Arthur was real: Britain after Rome, in crisis, with a real British victory at a place called Badon.</li><li>The one writer alive at the time, Gildas, describes that victory and never mentions Arthur.</li><li>The first text to name Arthur as a war-leader was written about 300 years later.</li><li>Around the year 600 the name Arthur suddenly became fashionable among royal families, which is odd if no one famous had carried it.</li><li>Neither side can close the case: a real leader is possible, and unprovable so far.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Texts and scripts</span><span class="thr">Archaeology</span></div></section><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>A real British war-leader named Arthur fought the Saxons around 500 CE.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:41.7%" role="img" aria-label="Weight of evidence: Open question"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The world of the story is real: a post-Roman Britain in crisis, a real victory at Badon, and powerful western lords trading with Byzantium from places like Tintagel. The man himself rests on sources written three to six centuries later, and the one writer from his own time is silent. That silence is not decisive, because Gildas names very few people, and the sudden fashion for the name Arthur around 600 is intriguing. Neither side can close the case, so it stays open.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 2 of 6, cautious"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>cautious</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks are mostly honest here: they call Arthur legendary, &#x27;possibly based on a real leader&#x27;, and that matches the evidence. If anything the academic mood has swung slightly past the evidence into firm scepticism: &#x27;no evidence&#x27; is sometimes presented as &#x27;evidence of absence&#x27;, although the whole century left almost no written record for anyone. The real overconfidence is in popular culture, where Camelot is treated as a lost historical court.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Gildas, writing around 540 CE, describes a British victory at the siege of Mount Badon in the year of his own birth and praises Ambrosius Aurelianus, but never names Arthur.<small>Gildas, De Excidio 25–26</small></li><li>The first datable text to name Arthur as a war-leader is the Historia Brittonum of 829–830, about 300 years after Badon; it lists twelve battles.<small>Historia Brittonum 56</small></li><li>The Annales Cambriae, compiled around the mid-10th century and surviving in a manuscript of about 1100, date Badon to 516 and the strife of Camlann, where Arthur and Medraut fell, to 537.<small>Annales Cambriae, Harleian MS 3859</small></li><li>Britain after about 410 CE saw a steep material collapse: coin use and mass-produced pottery ended and towns decayed, more sharply than in most of the western empire.<small>Ward-Perkins 2005</small></li><li>Excavations at Tintagel found a high-status site of the 5th to 7th centuries with imported Mediterranean pottery and glass, and a 7th-century inscribed slate window ledge in 2018; nothing names Arthur.<small>Barrowman et al. 2007; English Heritage 2018</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether Arthur began as a historical commander later mythologised, or as a mythical hero later given a place in history.</li><li>Whether the Annales Cambriae entries preserve older records or were written up from the Historia Brittonum and legend.</li><li>Which, if any, of the proposed candidates (Riothamus, Lucius Artorius Castus, Ambrosius, others) lies behind the name.</li><li>How dark the &#x27;Dark Ages&#x27; really were: collapse in the east of Britain, continuing trade with the Mediterranean in the west.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Almost no written records survive from 5th- and 6th-century Britain; Gildas is essentially the only contemporary British writer.</li><li>Early Welsh poems survive only in manuscripts of the 13th and 14th centuries, so their original dates are argued over.</li><li>Timber halls and hillforts of the period leave faint traces, and many candidate sites are unexcavated or dug before modern dating methods.</li></ul></div></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Most historians of early medieval Britain are sceptical. David Dumville wrote in 1977 that there is no historical evidence about Arthur and that he should be rejected from our histories; Guy Halsall and Nicholas Higham argue that the Arthur of the Historia Brittonum was built for 9th-century Welsh politics. On this view Badon was real, its victor unknown, and Arthur a legendary figure, possibly a hero of myth, attached to it later. A minority still thinks a real commander is possible but unprovable.</p><ul><li>The only near-contemporary writer, Gildas, names no Arthur.</li><li>Every source that names him is three centuries or more later.</li><li>Early Welsh tales show Arthur fighting giants, witches and a monstrous boar, which looks like myth.</li><li>Geoffrey of Monmouth&#x27;s 1136 history invented most of the famous story.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>The challengers argue that legends this persistent usually have a seed. Geoffrey Ashe identified Arthur with Riothamus, a &#x27;king of the Britons&#x27; who took an army into Gaul around 470, was betrayed, and vanished near a town called Avallon. Linda Malcor and Scott Littleton traced the name to Lucius Artorius Castus, a Roman officer in Britain. Others simply argue that someone won Badon, that Gildas names almost nobody, and that a war-leader called Arthur fits the gap.</p><ul><li>Jordanes describes Riotimus, king of the Brittones, crossing to Gaul with 12,000 men around 469–470.</li><li>Lucius Artorius Castus served as a prefect of the Sixth Legion at York and is commemorated on inscriptions in Croatia.</li><li>Gildas deliberately names very few contemporaries, so his silence is weaker evidence than it looks.</li></ul><div class="face-s"><b>Its strongest point</b><p>In the late 6th century the rare name Arthur suddenly appears in several British and Irish royal families, including Artúr son of Áedán of Dál Riata. A famous namesake a generation or two earlier would explain the fashion neatly.</p></div><p class="face-cr"><b>Credit</b> Geoffrey Ashe; Linda Malcor and C. Scott Littleton; historians open to a historical Arthur</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>A 5th- or 6th-century inscription, such as a memorial stone, naming an Arthur (Artorius) as a leader.</li><li>Securely dating the Arthur line in Y Gododdin to the 7th century by linguistic or manuscript evidence.</li><li>Locating and excavating the site of Badon, with a battle horizon dated to about 490–516.</li><li>Showing that the Annales Cambriae entries for 516 and 537 derive from a contemporary Easter-table record.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,085 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of King Arthur: A Real Hero in Britain&#x27;s Dark Age?"><button type="button" class="wtoc-i" data-go="arthur-s1">When the lights went out in Britain</button><button type="button" class="wtoc-i" data-go="arthur-s2">What is solid</button><button type="button" class="wtoc-i" data-go="arthur-s3">The mainstream view: a hero built later</button><button type="button" class="wtoc-i" data-go="arthur-s4">The challengers: the seed of the legend</button><button type="button" class="wtoc-i" data-go="arthur-s5">Tintagel and Glastonbury: finds and forgeries</button><button type="button" class="wtoc-i" data-go="arthur-s6">What would settle it</button></nav></div><section class="wsec" id="arthur-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>When the lights went out in Britain</h3><p>Around 410 CE Rome stopped defending Britain. What followed is one of the sharpest collapses anywhere in the ancient world. Within a generation or two the island stopped using coins, stopped making wheel-thrown pottery on any scale, and let its towns crumble. Bryan Ward-Perkins has argued that material life in parts of Britain fell below the level of the Iron Age before the Romans came. Into this darkness came Angles and Saxons from across the North Sea, first as hired soldiers and then as settlers and conquerors.</p><p>And somewhere in the middle of it, the story says, stood Arthur: a Christian war-leader who beat the invaders in twelve battles and held them back for a generation. It is exactly the kind of story this site is interested in: a rise, a fall, and a figure half-remembered from the dark between them. The question is whether there was a real man at its core.</p></section><section class="wsec" id="arthur-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What is solid</h3><p>The Battle of Badon was real. Our best witness is Gildas, a British monk who wrote a furious sermon on the sins of Britain&#x27;s rulers around 540. He says that after the Saxon revolt the Britons rallied under Ambrosius Aurelianus, a modest man of Roman family, and fought on with mixed success until the siege of Mount Badon, a great victory that Gildas places in the year of his own birth. Peace, of a sort, followed.</p><p>Gildas never names the victor of Badon. The first text to name Arthur as a war-leader is the Historia Brittonum, a Welsh history compiled around 829–830 and later attributed to Nennius. It calls him dux bellorum, the leader of battles, who fought alongside the kings of the Britons, lists twelve battles and says that at Badon 960 men fell in a single charge by Arthur alone. The Annales Cambriae, compiled around the 950s, add two dates: Badon in 516 and Camlann in 537, &#x27;in which Arthur and Medraut fell&#x27;.</p><figure class="wx wx--steps" id="arthur-f1" data-n="6"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">How Arthur grew: the sources, by distance from Badon</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How Arthur grew: the sources, by distance from Badon"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" class="wx-svg" role="img" aria-labelledby="arthur-f1-t"><title id="arthur-f1-t">How far each Arthur source stands from the Battle of Badon, and what it adds</title><rect class="wx-accfill wx-o20" x="110.2" y="50" width="20.29" height="450"/><path class="wx-hl" d="M118.0,50V500"/><text class="wx-t-b wx-t-a" x="118.0" y="24" text-anchor="middle">Battle of Badon</text><text class="wx-t-s" x="118.0" y="40" text-anchor="middle">c. 490–516</text><path class="wx-line" d="M40.0,500H703.0"/><path class="wx-line" d="M40.0,500v6"/><text class="wx-t-s" x="40.0" y="522" text-anchor="middle">400 CE</text><path class="wx-line" d="M118.0,500v4"/><path class="wx-line" d="M196.0,500v6"/><text class="wx-t-s" x="196.0" y="522" text-anchor="middle">600 CE</text><path class="wx-line" d="M274.0,500v4"/><path class="wx-line" d="M352.0,500v6"/><text class="wx-t-s" x="352.0" y="522" text-anchor="middle">800 CE</text><path class="wx-line" d="M430.0,500v4"/><path class="wx-line" d="M508.0,500v6"/><text class="wx-t-s" x="508.0" y="522" text-anchor="middle">1000 CE</text><path class="wx-line" d="M586.0,500v4"/><path class="wx-line" d="M664.0,500v6"/><text class="wx-t-s" x="664.0" y="522" text-anchor="middle">1200 CE</text><text class="wx-t-cap" x="40.0" y="546">Written sources, by date of writing</text><g class="wx-st" data-s="1"><text class="wx-t-b" x="128.0" y="80">Gildas, On the Ruin of Britain</text><text class="wx-t-m" x="128.0" y="95">c. 540 · Badon won, Ambrosius praised</text><path class="wx-line wx-draw" pathLength="1" style="--d:1" d="M118.0,110H149.2"/><circle class="wx-card wx-edge" cx="149.2" cy="110" r="6"/><text class="wx-t-s" x="161.2" y="114">+c. 40 years · Arthur not named</text></g><g class="wx-st" data-s="2"><text class="wx-t-b" x="128.0" y="148">Y Gododdin</text><text class="wx-t-m" x="128.0" y="163">date of the line disputed · 'he was no Arthur'</text><path class="wx-line wx-draw" pathLength="1" d="M118.0,178H196.0"/><path class="wx-dash" d="M196.0,178H508.0"/><rect class="wx-card wx-edge" x="196.0" y="173" width="312.0" height="10" rx="5"/><circle class="wx-accfill wx-edge" cx="352.0" cy="178" r="6"/><text class="wx-t-s" x="520.0" y="182">named only in passing</text></g><g class="wx-st" data-s="3"><text class="wx-t-b" x="128.0" y="216">Historia Brittonum</text><text class="wx-t-m" x="128.0" y="231">829–830 · twelve battles, 960 fall at Badon</text><path class="wx-line wx-draw" pathLength="1" style="--d:3" d="M118.0,246H374.6"/><circle class="wx-accfill wx-edge" cx="374.6" cy="246" r="6"/><text class="wx-t-s" x="386.6" y="250">+c. 330 years · a war-leader</text></g><g class="wx-st" data-s="4"><text class="wx-t-b" x="128.0" y="284">Annales Cambriae</text><text class="wx-t-m" x="128.0" y="299">compiled c. 950s · Badon 516, Camlann 537</text><path class="wx-line wx-draw" pathLength="1" style="--d:4" d="M118.0,314H472.1"/><circle class="wx-accfill wx-edge" cx="472.1" cy="314" r="6"/><text class="wx-t-s" x="472.1" y="334" text-anchor="end">+c. 450 years · Arthur and Medraut fall</text></g><g class="wx-st" data-s="5"><text class="wx-t-b" x="128.0" y="352">Geoffrey of Monmouth</text><text class="wx-t-m" x="128.0" y="367">c. 1136 · a king: Tintagel, Merlin, Avalon</text><path class="wx-line wx-draw" pathLength="1" style="--d:5" d="M118.0,382H614.1"/><circle class="wx-accfill wx-edge" cx="614.1" cy="382" r="6"/><text class="wx-t-s" x="614.1" y="402" text-anchor="end">+c. 630 years · Arthur the emperor-king</text></g><g class="wx-st" data-s="6"><text class="wx-t-b" x="128.0" y="420">Glastonbury and Chrétien</text><text class="wx-t-m" x="128.0" y="435">1191 grave 'found' · Lancelot and the Grail</text><path class="wx-line wx-draw" pathLength="1" style="--d:6" d="M118.0,450H657.0"/><circle class="wx-accfill wx-edge" cx="657.0" cy="450" r="6"/><text class="wx-t-s" x="657.0" y="470" text-anchor="end">+c. 690 years · the legend in full</text></g><circle class="wx-accfill wx-edge" cx="508.0" cy="546" r="5"/><text class="wx-t-s" x="518.0" y="550">Arthur named</text><circle class="wx-card wx-edge" cx="609.4" cy="546" r="5"/><text class="wx-t-s" x="619.4" y="550">not named</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button><button type="button" class="wx-dot" data-k="6" aria-label="Step 6" aria-pressed="false">6</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 6.</b> Gildas, c. 540: a living witness to the aftermath of Badon. He names Ambrosius, not Arthur.</p><ol class="wx-steplist"><li>Gildas, c. 540: a living witness to the aftermath of Badon. He names Ambrosius, not Arthur.</li><li>Y Gododdin: a warrior &#x27;was no Arthur&#x27;. If the line is 7th-century, Arthur was famous early; its date is disputed.</li><li>Historia Brittonum, 829–830: Arthur appears as dux bellorum with twelve battles, some 300 years after Badon.</li><li>Annales Cambriae, compiled c. 950s: dates for Badon (516) and Camlann (537), where Arthur and Medraut fall.</li><li>Geoffrey of Monmouth, c. 1136: Arthur becomes a conquering king, conceived at Tintagel, with Merlin and Avalon.</li><li>1191 and after: Glastonbury &#x27;finds&#x27; his grave; Chrétien de Troyes adds Lancelot and the Grail.</li></ol><figcaption>Each bar runs from the Battle of Badon (c. 490–516) to the date a source was written. The further a source stands from the battle, the more it knows about Arthur. <span class="wx-src">Based on: Dates after Dumville 1977, Charles-Edwards 1991, Higham 2002 and Halsall 2013; Y Gododdin range after Koch 1997 and critics.</span></figcaption><p class="vh">Six stacked bars on a timeline from 400 to 1250 CE, each starting at the Battle of Badon around 500. Step 1: Gildas, about 540, describes Badon and Ambrosius but does not name Arthur. Step 2: Y Gododdin, with a line saying a warrior was no Arthur, dated anywhere from about 600 to 1000. Step 3: the Historia Brittonum of 829 to 830, with twelve battles and 960 killed at Badon. Step 4: the Annales Cambriae, compiled around the 950s, dating Badon to 516 and Camlann to 537. Step 5: Geoffrey of Monmouth about 1136 makes Arthur a king with Tintagel, Merlin and Avalon. Step 6: the 1191 Glastonbury grave and Chrétien&#x27;s Lancelot and Grail stories.</p></figure><p>The chart shows the problem at a glance. The closer a source stands to Badon, the less it says about Arthur. As the gap grows to three, four and six centuries, he gains a name, battles, a date of death, a crown, a wizard and finally a Grail.</p></section><section class="wsec" id="arthur-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The mainstream view: a hero built later</h3><p>Most specialists are sceptical, some sharply so. In 1977 David Dumville wrote that there is no historical evidence about Arthur and that historians should reject him from their books. Nicholas Higham and Guy Halsall have shown how the Historia Brittonum served the politics of 9th-century Wales, which needed a Christian British hero to set against the English.</p><p>There is a further twist. In the earliest Welsh stories, such as Culhwch and Olwen, Arthur leads a warband that hunts a giant magical boar and fights witches and giants. Oliver Padel has argued that Arthur began as a figure of folklore, a protector of the landscape, and was only later given a place in history, rather than the other way round. The Historia Brittonum itself includes a stone marked by the paw print of Arthur&#x27;s dog, Cabal, that always returns to its heap.</p><aside class="wcall"><b>How do we know?</b><p>By dating manuscripts and texts separately. The Historia Brittonum can be dated to 829–830 from internal reckoning. The Annales Cambriae survive in British Library Harleian MS 3859 of about 1100, but their structure points to compilation in the mid-10th century. Y Gododdin, with its famous line comparing a warrior unfavourably to Arthur, survives in a manuscript of about 1265, and linguists argue over whether that line is 7th-century or a later addition.</p></aside></section><section class="wsec" id="arthur-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The challengers: the seed of the legend</h3><p>The challengers answer that great legends usually grow around something. Geoffrey Ashe made the most careful case, in The Discovery of King Arthur (1985). He pointed to Riothamus, described by the 6th-century historian Jordanes as &#x27;king of the Brittones&#x27;, who crossed into Gaul with 12,000 men around 469–470 to fight the Visigoths, was betrayed by a Roman official, and was last seen retreating towards the Burgundians, near a town still called Avallon. A contemporary, Sidonius Apollinaris, wrote him a letter, so Riothamus is real. Whether he is Arthur depends on reading his name as a title, &#x27;supreme king&#x27;.</p><p>Linda Malcor and C. Scott Littleton looked further back, to Lucius Artorius Castus, a Roman officer who served as prefect of the Sixth Legion at York in the late 2nd or early 3rd century, and argued that his cavalry and their steppe traditions seeded the legend. Others favour Ambrosius himself, or a now-forgotten northern commander.</p><blockquote class="wpull"><p>Around 600 CE a rare name suddenly became fashionable among British and Irish princes. Someone famous may have made it so.</p></blockquote><p>Their strongest point is subtle. The Roman name Artorius is rare, yet in the late 6th century several princes in Britain and Ireland are called Arthur, including Artúr, son of King Áedán of Dál Riata. That looks like parents naming sons after a celebrated hero. It fits a real war-leader of the previous century, though it would also fit a hero of popular stories.</p></section><section class="wsec" id="arthur-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>Tintagel and Glastonbury: finds and forgeries</h3><p>Archaeology has transformed the setting, if not the man. Tintagel, where Geoffrey of Monmouth placed Arthur&#x27;s conception, turned out to be a major 5th- to 7th-century site with fine tableware and wine jars from the eastern Mediterranean, more imported pottery than any other site of the period in Britain. In 1998 a slate inscribed with the name Artognou was found there, briefly hailed as an &#x27;Arthur stone&#x27;; it is a different name. In 2017 excavators found the walls of substantial buildings, and in 2018 a slate window ledge scratched with Latin and Greek letters and Christian symbols.</p><aside class="wcall"><b>Fresh from the field</b><p>The 2016–2019 English Heritage excavations at Tintagel showed a literate, Christian elite in contact with the Byzantine Mediterranean in the very period of the Arthur legend. The &#x27;Dark Ages&#x27; in western Britain were far from primitive. None of the finds names Arthur, but they explain why medieval writers remembered Tintagel as a royal place.</p></aside><p>Glastonbury is the cautionary tale. In 1191, a few years after a fire had destroyed much of their abbey, the monks announced that they had found Arthur and Guinevere buried in their cemetery, complete with a lead cross naming him. Pilgrims and donations followed. The cross is now lost and most historians regard the find as a pious fraud.</p></section><section class="wsec" id="arthur-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What would settle it</h3><p>Much of the evidence we would need never existed in writing, and what did exist has mostly perished. That is why the case stays open. A few things could still move it.</p><ul class="wlist"><li>A memorial stone of the 5th or 6th century naming an Artorius as a leader. Britain has dozens of inscribed stones of this date, so this is not impossible.</li><li>Firm linguistic dating of the Y Gododdin line to the 7th century, which would bring Arthur&#x27;s fame within a century of Badon.</li><li>Identifying Badon on the ground, with a dated battle horizon.</li><li>Evidence that the Annales Cambriae dates of 516 and 537 come from a contemporary Easter table rather than later legend.</li></ul><p>For now, Arthur stands in the fog between history and myth: a real battle with an unnamed victor, and a name that arrives three centuries late.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">410 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Roman rule in Britain ends</span></li><li class="wtl-event" style="--i:1"><span class="wtl-y">500 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Battle of Badon (c. 490–516)</span></li><li class="wtl-study" style="--i:2"><span class="wtl-y">540 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Gildas writes, naming no Arthur</span></li><li class="wtl-study" style="--i:3"><span class="wtl-y">829 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Historia Brittonum lists Arthur&#x27;s twelve battles</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">954 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Annales Cambriae compiled, with Badon and Camlann</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1136 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Geoffrey of Monmouth creates King Arthur</span></li><li class="wtl-find" style="--i:6"><span class="wtl-y">1191 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Glastonbury monks announce Arthur&#x27;s grave</span></li><li class="wtl-find" style="--i:7"><span class="wtl-y">2018 CE</span><span class="wtl-k">Found</span><span class="wtl-t">Inscribed window ledge found at Tintagel</span></li></ol><details class="srcs"><summary>Sources for this case (13)</summary><ol><li>Gildas, The Ruin of Britain and Other Works, ed. and trans. M. Winterbottom (Phillimore, 1978).</li><li>Nennius, British History and the Welsh Annals, ed. and trans. J. Morris (Phillimore, 1980).</li><li>Dumville D. N. (1977). Sub-Roman Britain: history and legend. History 62(205): 173–192.</li><li>Charles-Edwards T. M. (1991). The Arthur of history. In Bromwich R., Jarman A. O. H., Roberts B. F. (eds), The Arthur of the Welsh. University of Wales Press.</li><li>Padel O. J. (1994). The nature of Arthur. Cambrian Medieval Celtic Studies 27: 1–31.</li><li>Higham N. J. (2002). King Arthur: Myth-Making and History. Routledge.</li><li>Halsall G. (2013). Worlds of Arthur: Facts and Fictions of the Dark Ages. Oxford University Press.</li><li>Ashe G. (1985). The Discovery of King Arthur. Doubleday.</li><li>Littleton C. S., Malcor L. A. (1994). From Scythia to Camelot. Garland.</li><li>Ward-Perkins B. (2005). The Fall of Rome and the End of Civilization. Oxford University Press.</li><li>Barrowman R. C., Batey C. E., Morris C. D. (2007). Excavations at Tintagel Castle, Cornwall, 1990–1999. Society of Antiquaries of London Research Report 74.</li><li>Koch J. T. (1997). The Gododdin of Aneirin: Text and Context from Dark-Age North Britain. University of Wales Press.</li><li>English Heritage (2018). Rare inscribed window ledge found at Tintagel Castle. Press release, June 2018.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-arthur" data-t="King Arthur: A Real Hero in Britain&#x27;s Dark Age?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>King Arthur: A Real Hero in Britain&#x27;s Dark Age?</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-arthur</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-delphi-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Delphi BW 2017-10-08 11-44-18.jpg" data-cap="The sanctuary at Delphi" data-big><figcaption></figcaption></figure><div class="sh-k">Legends and Relics</div><h2 class="sh-t" id="case-delphi-st" tabindex="-1">The Oracle of Delphi: Did the Earth Speak Through Her?</h2><p class="sh-s">Ancient writers said a sweet vapour rose from the rock beneath Apollo&#x27;s temple. Scholars laughed for a century. Then geologists found the faults.</p><div class="sh-v"><span class="vstamp vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><p class="sh-claim"><b>What the stamp rates:</b> The Pythia&#x27;s trance was induced by an intoxicating gas, such as ethylene, rising along faults beneath the temple.</p></div><p class="v4-q">Did gas from faults under the temple put the Pythia into her trance?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>For over a thousand years a priestess at Delphi gave the god&#x27;s answers from an inner room.</li><li>Ancient writers said a breath rose from the ground and sometimes smelled sweet.</li><li>Two faults really do cross under the temple, springs once flowed there, and gas still leaks today.</li><li>The gases measured are mostly methane and carbon dioxide; the team found the ground unable to make enough ethylene for a trance.</li><li>The vapour is real; whether it put her into a trance is still open.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Geology</span><span class="thr">Chemistry</span><span class="thr">Texts and scripts</span></div></section><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The Pythia&#x27;s trance was induced by an intoxicating gas, such as ethylene, rising along faults beneath the temple.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:41.7%" role="img" aria-label="Weight of evidence: Open question"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Half of the old story has been vindicated: faults cross under the temple, springs flowed there, and gas still leaks today. The other half is unresolved. The measured gases are mostly methane, ethane and carbon dioxide, and the Etiope team found the setting unable to make ethylene in the hundreds to thousands of parts per million a trance would need. Oxygen loss from carbon dioxide and methane in a closed room, or sweet-smelling aromatic compounds, remain possible, untested alternatives. The gas is real; its effect on the Pythia is not established.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 3 of 6, leaning one way"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>leaning one way</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">The gap swung both ways. For most of the 20th century handbooks declared flatly that there was no chasm and no vapour, an overconfidence that the fault mapping exposed. Since 2001 the pendulum has swung, and popular books and documentaries often present &#x27;the Pythia was high on ethylene&#x27; as solved. Neither is warranted: the geology is solid, the intoxication is an open hypothesis.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>For over a thousand years a priestess, the Pythia, gave Apollo&#x27;s answers in the temple&#x27;s inner room, the adyton; the oracle ended in the late 4th century CE.<small>Strabo 9.3.5; Plutarch, Moralia</small></li><li>Strabo and Plutarch describe a pneuma, a breath or vapour, rising from the ground; Plutarch, a priest at Delphi, says it sometimes filled the waiting room with a sweet fragrance and had weakened in his day.<small>Strabo 9.3.5; Plutarch, De defectu oraculorum</small></li><li>Two active faults, the east–west Delphi fault and the NNW–SSE Kerna fault, cross beneath or close to the temple, and travertine deposits show that fault-fed springs once flowed there.<small>de Boer, Hale and Chanton 2001</small></li><li>Gas still leaks at Delphi today: new surveys found methane, ethane and carbon dioxide coming from hydrocarbon-bearing limestone.<small>Etiope et al. 2006</small></li><li>An earthquake in 373 BCE destroyed the earlier temple; the ruins visible today belong to its 4th-century BCE rebuild.<small>Temple excavation reports</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Which gas, if any, affected the Pythia: ethylene, a mix of carbon dioxide and methane lowering oxygen, or none at all.</li><li>Whether past gas flow was far stronger than today&#x27;s, for example after earthquakes, as the ancient reports of a weakening vapour might suggest.</li><li>Whether the Pythia&#x27;s state was a chemical trance or a ritual, learned and religious state of possession.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>The adyton&#x27;s floor and whatever opening it had were heavily disturbed; the French &#x27;Great Excavation&#x27; of 1892–1903 cleared the area before modern geochemistry existed.</li><li>The spring that fed the adyton was later diverted, so the ancient water and gas supply cannot be sampled directly.</li><li>No ancient measurement of the vapour exists; its strength in, say, 500 BCE can only be inferred.</li></ul></div></div><h3 class="sub-h wsub">How the traditions tell it</h3><div class="v4texts"><blockquote class="quote v4q"><span class="v4q-t">Greek geography · Strabo, Geography 9.3.5</span><p>They say that the seat of the oracle is a cave that is hollowed out deep down in the earth, with a rather narrow mouth, from which arises breath that inspires a divine frenzy; and that over the mouth is placed a high tripod, mounting which the Pythian priestess receives the breath and then utters oracles in both verse and prose</p><cite>trans. H. L. Jones (Loeb Classical Library, 1927)</cite></blockquote></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>For most of the 20th century the vapour was treated as myth. French excavators found no chasm, and in 1904 Adolphe Paul Oppé argued that no gas could cause prophecy and that ancient reports were travellers&#x27; tales. Today many classicists, such as Lisa Maurizio, see the Pythia&#x27;s state as ritual possession shaped by religious expectation, and toxicologists Jonathan Foster and Daryn Lehoux have argued that the ethylene idea fails chemically and clinically. The faults are accepted; the intoxicating gas is not.</p><ul><li>Trance states are well documented in cultures with no gas vents at all.</li><li>Ethylene at trance-inducing levels would need a source the local geology does not seem to have.</li><li>Most ancient descriptions of the Pythia show her calm and coherent, not delirious.</li><li>The &#x27;chasm&#x27; may be literary: a small opening or a spring, not a gaping crack.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Geologist Jelle de Boer and archaeologist John Hale took the ancient writers at their word and went looking. They mapped the Delphi and Kerna faults crossing beneath the temple, found travertine left by old springs, and with chemist Jeffrey Chanton detected methane, ethane and ethylene in spring water nearby. Toxicologist Henry Spiller compared the Pythia&#x27;s reported behaviour with 1940s clinical studies of ethylene anaesthesia: mild doses gave euphoria and detachment; higher doses, thrashing and groaning, like Plutarch&#x27;s account of a Pythia who died.</p><ul><li>The temple sits on a fault intersection: exactly where ancient writers put a breath from the earth.</li><li>Ethylene smells sweet, matching Plutarch&#x27;s description of the fragrance.</li><li>A declining vapour fits a spring system altered by earthquakes and time.</li></ul><div class="face-s"><b>Its strongest point</b><p>The ancient authors were right about the geology when modern scholars said they were wrong. A sanctuary built over a crossing of active faults, with gas still seeping, is not a coincidence the old sceptics could have predicted.</p></div><p class="face-cr"><b>Credit</b> Jelle Zeilinga de Boer, John R. Hale, Jeffrey Chanton, Henry Spiller</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Long-term monitoring of gas flux and composition in and around the temple, including after local earthquakes.</li><li>Analysis of travertine layers and ancient spring deposits for trapped gases or hydrocarbons dated to the oracle&#x27;s active centuries.</li><li>Modelling of gas build-up in a room the size and shape of the adyton, testing whether oxygen could drop or aromatic compounds collect.</li><li>Re-examination of the excavation records for the adyton&#x27;s original floor, drains and opening.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,090 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of The Oracle of Delphi: Did the Earth Speak Through Her?"><button type="button" class="wtoc-i" data-go="delphi-s1">A breath from the earth</button><button type="button" class="wtoc-i" data-go="delphi-s2">What is solid</button><button type="button" class="wtoc-i" data-go="delphi-s3">The mainstream story: no chasm, no gas</button><button type="button" class="wtoc-i" data-go="delphi-s4">The challengers: the rocks were telling the truth</button><button type="button" class="wtoc-i" data-go="delphi-s5">The pushback: which gas, and how much?</button><button type="button" class="wtoc-i" data-go="delphi-s6">What time has hidden, and what would settle it</button></nav></div><section class="wsec" id="delphi-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A breath from the earth</h3><p>For more than a thousand years, kings and cities climbed the slopes of Mount Parnassus to ask Apollo what to do. Should we found a colony? Fight Persia? Marry? Their questions went into the temple&#x27;s innermost room, the adyton, where a local woman sat on a bronze tripod and answered in the god&#x27;s voice. She was the Pythia, and the ancient writers were clear about where her power came from: a breath rising out of the ground.</p><blockquote class="quote"><p>They say that the seat of the oracle is a cave that is hollowed out deep down in the earth, with a rather narrow mouth, from which arises breath that inspires a divine frenzy</p><cite>Strabo, Geography 9.3.5, trans. H. L. Jones (Loeb Classical Library, 1927)</cite></blockquote><p>Diodorus tells how the spot was found: a goatherd noticed his goats leaping and bleating strangely near a cleft, leaned over it himself and began to prophesy. For a century, modern scholars dismissed all this as picturesque nonsense. Then a geologist noticed something in the rocks.</p></section><section class="wsec" id="delphi-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What is solid</h3><p>The oracle itself is beyond question. Inscriptions, dedications, treasuries and hundreds of recorded responses show it working from at least the 8th century BCE until it fell silent under the Christian emperor Theodosius I around 390 CE. The temple was rebuilt more than once; an earthquake in 373 BCE brought down the 6th-century building, and the foundations visible today belong to its 4th-century replacement.</p><p>Our best inside witness is Plutarch, who served as a priest at Delphi around 100 CE. He writes that the consulting room was sometimes filled, not regularly, with a sweet fragrance, as if the adyton were sending out the finest perfumes from a spring. He also says the power of the vapour seemed weaker than in earlier times, and describes a session that went wrong: a Pythia forced to prophesy despite bad omens began to speak in a harsh voice, rushed shrieking for the door, and died a few days later.</p><p>The ritual was precise. Consultations were held on set days, at first reportedly only once a year and later monthly, never in the winter months when Apollo was said to be away. The Pythia, by Plutarch&#x27;s time a local woman of blameless life rather than a trained scholar, purified herself in the Castalian spring. A goat was sprinkled with cold water, and only if it trembled all over was the god judged willing. Later writers add that she burned or chewed laurel leaves. Male priests stood nearby and may have put her words into the verse or prose that visitors took home.</p></section><section class="wsec" id="delphi-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The mainstream story: no chasm, no gas</h3><p>When French archaeologists cleared the sanctuary in the &#x27;Great Excavation&#x27; of 1892–1903, they found no chasm under the temple. In 1904 Adolphe Paul Oppé published an influential paper arguing that there never had been one, that no natural gas could produce prophecy, and that the ancient accounts were stories told to credulous visitors. For most of the century that became textbook orthodoxy.</p><p>Many scholars still see the Pythia&#x27;s state as essentially religious. Lisa Maurizio compared her with spirit possession documented by anthropologists: a trained, expected, culturally shaped trance that needs no chemical trigger. Most ancient descriptions show the Pythia calm and coherent rather than raving. On this view the vapour was part of the sacred story, not the cause of the trance.</p></section><section class="wsec" id="delphi-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The challengers: the rocks were telling the truth</h3><p>In the 1980s the geologist Jelle Zeilinga de Boer, surveying active faults in Greece, noticed a major fault running along the base of the cliffs at Delphi. With archaeologist John Hale he later mapped a second fault, the Kerna fault, crossing the first near the temple. Travertine, the limestone crust left by mineral springs, showed that water had flowed up through the cracked rock there. Earth movement on such faults can heat bituminous limestone and release light hydrocarbons into the groundwater.</p><figure class="wx wx--steps" id="delphi-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">Under the temple: the proposed gas pathway</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Under the temple: the proposed gas pathway"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 540" class="wx-svg" role="img" aria-labelledby="delphi-f1-t"><title id="delphi-f1-t">Schematic section beneath the Temple of Apollo at Delphi, showing the proposed gas pathway</title><defs><clipPath id="delphi-f1-clip"><path d="M0,330 L150,318 L290,262 L480,262 L560,190 L720,120 L720,500 L0,500 Z"/></clipPath></defs><text class="wx-t-cap" x="16" y="24">South · Pleistos valley</text><text class="wx-t-cap" x="704" y="24" text-anchor="end">North · Phaedriades cliffs</text><path class="wx-rock" d="M0,330 L150,318 L290,262 L480,262 L560,190 L720,120 L720,500 L0,500 Z"/><g clip-path="url(#delphi-f1-clip)"><path class="wx-edge-soft" d="M0,340 L720,260 M0,364 L720,284 M0,388 L720,308 M0,412 L720,332 M0,436 L720,356 M0,460 L720,380 M0,484 L720,404 M0,508 L720,428 M0,532 L720,452"/><path class="wx-stone3 wx-o80" d="M0,460 L720,380 L720,410 L0,490 Z"/></g><path class="wx-bold" d="M0,330 L150,318 L290,262 L480,262 L560,190 L720,120"/><path class="wx-bold wx-s4" d="M300,500 L540,196"/><path class="wx-bold wx-s4 wx-dash" d="M452,500 L440,262"/><text class="wx-t-b wx-halo" x="306" y="466" text-anchor="end">Delphi fault</text><text class="wx-t-s wx-halo" x="306" y="480" text-anchor="end">runs E–W</text><text class="wx-t-b wx-halo" x="464" y="466">Kerna fault</text><text class="wx-t-s wx-halo" x="464" y="480">runs NNW–SSE, across the section</text><g class="wx-st" data-s="1"><rect class="wx-stone2 wx-edge" x="305" y="256" width="165" height="6"/><rect class="wx-stone wx-edge-soft" x="312" y="210" width="7" height="46"/><rect class="wx-stone wx-edge-soft" x="328" y="210" width="7" height="46"/><rect class="wx-stone wx-edge-soft" x="344" y="210" width="7" height="46"/><rect class="wx-stone wx-edge-soft" x="360" y="210" width="7" height="46"/><rect class="wx-stone wx-edge-soft" x="376" y="210" width="7" height="46"/><rect class="wx-stone wx-edge-soft" x="392" y="210" width="7" height="46"/><rect class="wx-stone wx-edge-soft" x="408" y="210" width="7" height="46"/><rect class="wx-stone wx-edge-soft" x="424" y="210" width="7" height="46"/><rect class="wx-stone wx-edge-soft" x="440" y="210" width="7" height="46"/><rect class="wx-stone wx-edge-soft" x="456" y="210" width="7" height="46"/><path class="wx-stone2 wx-edge" d="M301,210 L387.5,188 L474,210 Z"/><rect class="wx-paper wx-edge" x="420" y="262" width="40" height="26"/><path class="wx-thin" d="M440,270 v-1 M434,288 L440,276 L446,288 M436,276 h8"/><circle class="wx-line" cx="440" cy="267" r="2.6"/><path class="wx-thin" d="M470,276 L540,296"/><text class="wx-t-b wx-halo" x="544" y="300">Adyton</text><text class="wx-t-s wx-halo" x="544" y="314">sunken inner room</text><text class="wx-t-b wx-halo" x="387.5" y="166" text-anchor="middle">Temple of Apollo</text><text class="wx-t-s wx-halo" x="387.5" y="180" text-anchor="middle">4th-century BCE rebuild</text></g><g class="wx-st" data-s="2"><circle class="wx-glow wx-edge-soft wx-pulse" style="--d:0" cx="380" cy="432" r="4"/><circle class="wx-glow wx-edge-soft wx-pulse" style="--d:1" cx="410" cy="428" r="4"/><circle class="wx-glow wx-edge-soft wx-pulse" style="--d:2" cx="440" cy="424" r="4"/><circle class="wx-glow wx-edge-soft wx-pulse" style="--d:3" cx="470" cy="420" r="4"/><circle class="wx-glow wx-edge-soft wx-pulse" style="--d:4" cx="500" cy="416" r="4"/><text class="wx-t-b wx-halo" x="120" y="420">Bituminous limestone</text><text class="wx-t-s wx-halo" x="120" y="434">rich in hydrocarbons; fault movement</text><text class="wx-t-s wx-halo" x="120" y="448">can release light gases</text></g><g class="wx-st" data-s="3"><path class="wx-flow wx-s2" d="M440,424 C446,380 442,330 444,292"/><path class="wx-flow wx-s7" d="M470,418 C488,390 512,330 530,238"/><circle class="wx-num" cx="443" cy="319" r="5"/><text class="wx-t-b wx-halo" x="560" y="330">Fault crossing</text><text class="wx-t-s wx-halo" x="560" y="344">cracked rock lets gas</text><text class="wx-t-s wx-halo" x="560" y="358">and spring water rise</text><path class="wx-thin" d="M556,338 L449,321"/><path class="wx-sand wx-edge-soft" d="M520,232 q12,-8 24,-2 l-4,8 q-10,-4 -20,0 Z"/><text class="wx-t-b wx-halo" x="590" y="70">Travertine</text><text class="wx-t-s wx-halo" x="590" y="84">crust left by old springs</text><path class="wx-thin" d="M600,90 L538,226"/></g><g class="wx-st" data-s="4"><path class="wx-dash wx-s1" d="M436,262 q-8,-18 2,-30 q10,-12 -2,-26"/><path class="wx-dash wx-s1" d="M446,262 q8,-16 -2,-28 q-8,-12 4,-24"/><text class="wx-t-b wx-t-a wx-halo" x="300" y="100">Proposed: sweet-smelling</text><text class="wx-t-b wx-t-a wx-halo" x="300" y="116">vapour in a closed room</text><text class="wx-t-s wx-halo" x="300" y="132">de Boer, Hale et al. 2001: ethylene</text><path class="wx-thin" d="M510,136 L470,196 L447,226"/></g><g class="wx-st" data-s="5"><rect class="wx-card wx-edge" x="16" y="48" width="250" height="84" rx="8"/><text class="wx-t-b" x="28" y="70">Measured today (Etiope 2006)</text><text class="wx-t-s" x="28" y="88">methane, ethane and CO2, low flux</text><text class="wx-t-s" x="28" y="104">no source for the ethylene a trance</text><text class="wx-t-s" x="28" y="120">needs (100s–1,000s of ppmv)</text></g><text class="wx-t-s" x="16" y="530">Schematic, not to scale. Fault geometry simplified after de Boer et al. 2001 and Etiope et al. 2006.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> The Temple of Apollo stands on a terrace; the Pythia sat on her tripod in the adyton, a room set below the temple floor.</p><ol class="wx-steplist"><li>The Temple of Apollo stands on a terrace; the Pythia sat on her tripod in the adyton, a room set below the temple floor.</li><li>Deep down lies bituminous limestone. Fault movement can heat and crack it, freeing light hydrocarbon gases.</li><li>Where the Delphi and Kerna faults cross, fractured rock lets gas and spring water rise; travertine marks old springs.</li><li>Proposed by de Boer, Hale and colleagues: sweet-smelling ethylene collects in the small, closed adyton.</li><li>The critique: gas measured today is mostly methane, ethane and CO2; ethylene at trance levels looks unlikely.</li></ol><figcaption>A schematic north–south section through the sanctuary. Step through the geology behind the vapour hypothesis and the main critique. Not to scale. <span class="wx-src">Based on: Fault names, orientations and springs after de Boer, Hale and Chanton 2001 and Etiope et al. 2006; section geometry simplified.</span></figcaption><p class="vh">Cross-section of a hillside rising from the Pleistos valley in the south to the Phaedriades cliffs in the north, with tilted limestone beds. Step 1: the Temple of Apollo sits on a terrace, with a sunken inner room, the adyton, containing a figure on a tripod. Step 2: a dark layer of bituminous limestone at depth, with gas bubbles. Step 3: the east-west Delphi fault and the Kerna fault cross beneath the temple, and animated lines show gas and spring water rising, with travertine deposits near the surface. Step 4: a dashed plume of proposed sweet-smelling vapour enters the adyton. Step 5: a panel reports the 2006 measurements of methane, ethane and carbon dioxide and says ethylene at trance-inducing levels is unlikely.</p></figure><p>In 2001, with the chemist Jeffrey Chanton, they reported methane, ethane and ethylene in water from the nearby Kerna spring. Ethylene has a sweet smell, like Plutarch&#x27;s perfume. Toxicologist Henry Spiller then compared the Pythia with 1940s clinical studies of ethylene anaesthesia: light doses produced a pleasant, detached trance in which patients could still answer questions; stronger doses caused thrashing and groaning. The fit with Plutarch&#x27;s accounts was striking.</p><blockquote class="wpull"><p>The ancient writers put a breath from the earth exactly where modern geologists found two faults crossing. The sceptics had the geology wrong.</p></blockquote><p>On the geology, the challengers clearly beat the old consensus. A temple built over a crossing of active faults, with springs and seeping gas, is exactly what Strabo and Plutarch implied and what Oppé denied.</p></section><section class="wsec" id="delphi-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The pushback: which gas, and how much?</h3><p>The chemistry has been harder. In 2006 a team led by Giuseppe Etiope measured gas coming out of the soil and groundwater around Delphi. They confirmed that gas is escaping, but it is mostly methane, ethane and carbon dioxide from deep, thermally altered hydrocarbons. They concluded that this environment is not prone to producing ethylene in the hundreds or thousands of parts per million needed for neurotoxic effects. If gas affected the Pythia, they suggested, it might have been through lack of oxygen in a closed room, or through sweet-smelling aromatic hydrocarbons such as benzene dissolved in the spring.</p><p>Foster and Lehoux went further, arguing in 2007 that the ethylene hypothesis does not match the clinical picture or the measured concentrations. Defenders reply that today&#x27;s seepage is a weak echo, that earthquakes periodically reopen fractures, and that Plutarch himself noticed the vapour fading. Both sides agree the ancient spring has been diverted and its gas cannot now be measured.</p><aside class="wcall"><b>How do we know?</b><p>Parallel sites help. At the Plutonium of Hierapolis in Turkey, a &#x27;gate to the underworld&#x27; where ancient writers said birds dropped dead, researchers have measured carbon dioxide from a fault building up to lethal levels near the ground at night, killing small animals just as described. Ancient sanctuaries really were built on gas vents, and ancient reports of their effects can be accurate.</p></aside></section><section class="wsec" id="delphi-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What time has hidden, and what would settle it</h3><p>The crucial evidence was disturbed long ago. The adyton&#x27;s floor was dug out before anyone thought to sample gas, the spring was rerouted, and a vapour that waxed and waned with earthquakes left no ancient measurements. Absence of a chasm tells us little: the &#x27;mouth&#x27; may have been a small fissure or a spring outlet, easily lost in a rebuilt floor.</p><p>There is also a deeper layer of memory. Delphi&#x27;s founding myth tells how Apollo killed the serpent Python, a child of Earth, whose rotting body gave the sanctuary its old name, Pytho. Luigi Piccardi and colleagues have read this as geomythology: an old story shaped by a landscape of earthquakes, rockfalls, springs and smelly gas. It cannot be tested directly, but it fits the site&#x27;s restless geology surprisingly well.</p><ul class="wlist"><li>Continuous gas monitoring at the temple, especially after local earthquakes.</li><li>Chemical analysis of dated travertine and spring deposits for trapped hydrocarbons.</li><li>A physical model of the adyton testing whether carbon dioxide and methane could lower oxygen enough to alter a sitting woman&#x27;s state.</li><li>A fresh study of the old excavation records for the adyton&#x27;s openings and drains.</li></ul><p>Until then Delphi remains a satisfying half-victory for the ancient witnesses: the earth under the god really did breathe, even if we cannot yet say what it breathed.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-use" style="--i:0"><span class="wtl-y">800 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Oracle of Apollo active at Delphi</span></li><li class="wtl-loss" style="--i:1"><span class="wtl-y">373 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Earthquake destroys the earlier temple</span></li><li class="wtl-study" style="--i:2"><span class="wtl-y">100 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Plutarch, priest at Delphi, says the vapour has weakened</span></li><li class="wtl-loss" style="--i:3"><span class="wtl-y">390 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Oracle falls silent under Theodosius I</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">1892 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">French &#x27;Great Excavation&#x27; begins; no chasm found</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1904 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Oppé dismisses the vapour as myth</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">2001 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">de Boer, Hale and Chanton publish the faults and gases</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2006 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Etiope team re-measures: methane, ethane, CO2</span></li></ol><details class="srcs"><summary>Sources for this case (11)</summary><ol><li>de Boer J. Z., Hale J. R., Chanton J. (2001). New evidence for the geological origins of the ancient Delphic oracle (Greece). Geology 29(8): 707–710. <a href="https://doi.org/10.1130/0091-7613(2001)029&lt;0707:NEFTGO&gt;2.0.CO;2" target="_blank" rel="noopener">doi:10.1130/0091-7613(2001)029&lt;0707:NEFTGO&gt;2.0.CO;2</a></li><li>Etiope G., Papatheodorou G., Christodoulou D., Geraga M., Favali P. (2006). The geological links of the ancient Delphic Oracle (Greece): a reappraisal of natural gas occurrence and origin. Geology 34(10): 821–824. <a href="https://doi.org/10.1130/G22824.1" target="_blank" rel="noopener">doi:10.1130/G22824.1</a></li><li>Spiller H. A., Hale J. R., de Boer J. Z. (2002). The Delphic oracle: a multidisciplinary defense of the gaseous vent theory. Journal of Toxicology: Clinical Toxicology 40(2): 189–196.</li><li>Hale J. R., de Boer J. Z., Chanton J. P., Spiller H. A. (2003). Questioning the Delphic Oracle. Scientific American 289(2): 66–73.</li><li>Foster J., Lehoux D. (2007). The Delphic oracle and the ethylene-intoxication hypothesis. Clinical Toxicology 45(1): 85–89. <a href="https://doi.org/10.1080/15563650601120800" target="_blank" rel="noopener">doi:10.1080/15563650601120800</a></li><li>Piccardi L. et al. (2008). Scent of a myth: tectonics, geochemistry and geomythology at Delphi (Greece). Journal of the Geological Society 165: 5–18.</li><li>Oppé A. P. (1904). The chasm at Delphi. Journal of Hellenic Studies 24: 214–240.</li><li>Maurizio L. (1995). Anthropology and spirit possession: a reconsideration of the Pythia&#x27;s role at Delphi. Journal of Hellenic Studies 115: 69–86.</li><li>Pfanz H. et al. (2019). Deadly CO2 gases in the Plutonium of Hierapolis (Denizli, Turkey). Archaeological and Anthropological Sciences 11. <a href="https://doi.org/10.1007/s12520-018-0599-5" target="_blank" rel="noopener">doi:10.1007/s12520-018-0599-5</a></li><li>Strabo, Geography 9.3.5, trans. H. L. Jones (Loeb Classical Library, 1927).</li><li>Plutarch, De defectu oraculorum (On the Obsolescence of Oracles), Moralia 409E–438E, trans. F. C. Babbitt (Loeb Classical Library, 1936).</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-delphi" data-t="The Oracle of Delphi: Did the Earth Speak Through Her?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Oracle of Delphi: Did the Earth Speak Through Her?</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-delphi</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-shroud-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Holy Face of Jesus from Shroud of Turin (1909).jpg" data-cap="The Shroud of Turin, photographed in 1909" data-big><figcaption></figcaption></figure><div class="sh-k">Legends and Relics</div><h2 class="sh-t" id="case-shroud-st" tabindex="-1">The Shroud of Turin: The Most Tested Cloth on Earth</h2><p class="sh-s">A linen sheet with the faint image of a crucified man. Three labs dated it to the Middle Ages. Why has the argument never stopped?</p><div class="sh-v"><span class="vstamp vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><p class="sh-claim"><b>What the stamp rates:</b> The linen of the Shroud of Turin dates to the 1st century CE.</p></div><p class="v4-q">Is the Shroud&#x27;s linen ancient, and how did its image form?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>The Shroud of Turin is a linen cloth bearing the faint image of a man with the wounds of crucifixion.</li><li>It first appears in the record in France in the 1350s; a bishop wrote in 1389 that the painter had been found.</li><li>In 1988 three laboratories independently radiocarbon-dated it to 1260 to 1390 CE.</li><li>The critiques, a patched corner or contamination, widen that range; they do not move it to antiquity, and a 2026 textile study undercut them.</li><li>A first-century date is ruled out; how the image formed is still open, and what the cloth means is not a scientific question.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Chemistry</span><span class="thr">Texts and scripts</span><span class="thr">Religion and myth</span></div></section><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The linen of the Shroud of Turin dates to the 1st century CE.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The most direct test available, radiocarbon dating in three independent laboratories, contradicts a 1st-century date by more than a thousand years, and it agrees with the first documentation in the 1350s. The critiques are real but narrow: heterogeneity widens the range, it does not move it to antiquity, and the 2026 textile study undercuts the reweave and contamination explanations. The X-ray result rests on one thread and an uncalibrated storage assumption. The image&#x27;s formation remains open, and the cloth&#x27;s religious meaning is not a scientific question.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 5 of 6, confident"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>confident</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Encyclopedias and museum texts present the medieval date as settled, and on the age of the linen that confidence is largely earned. They are slightly overconfident in two ways: the 1988 sample came from one small corner, so the result is strictly a date for that strip, and the image&#x27;s making has not been convincingly reproduced. Treating the Shroud as a simple painting undersells a genuinely unusual object.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>The Shroud is a linen cloth about 4.4 by 1.1 m in a 3/1 herringbone twill, bearing faint front and back images of a man with wounds consistent with crucifixion.<small>Freer-Waters and Jull 2026</small></li><li>It first appears in the historical record at Lirey in France in the 1350s; in 1389 Bishop Pierre d&#x27;Arcis wrote that an earlier inquiry had found the artist who painted it.<small>d&#x27;Arcis memorandum 1389</small></li><li>In 1988 laboratories in Arizona, Oxford and Zurich independently radiocarbon-dated samples from one strip to 1260–1390 CE with at least 95 per cent confidence.<small>Damon et al. 1989</small></li><li>A 2026 study of retained fragments of the 1988 sample found pure flax linen matching the main cloth, with no cotton, no repairs and no significant surface contamination.<small>Freer-Waters and Jull 2026</small></li><li>The image is extremely superficial, confined to the outermost fibres of the threads, and behaves like a photographic negative, which is why its method of formation is still debated.<small>STURP reports; Fanti et al.</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether one sample strip from one corner represents the whole cloth, given statistical signs of heterogeneity in the 1988 raw data.</li><li>Whether new methods such as wide-angle X-ray scattering can date linen reliably at all.</li><li>How the image was made: painting, dusting, rubbing on a low relief, scorching, or a process nobody has reproduced.</li><li>Whether the cloth has any history before the 1350s, for example as the Image of Edessa or the cloth seen in Constantinople in 1203–1204.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>No written record places this cloth anywhere before the 1350s; any earlier history must be reconstructed from images and disputed identifications.</li><li>The 1532 fire at Chambéry scorched and partly altered the cloth, and later repairs and handling added contamination that complicates every new test.</li><li>The custodians have not allowed a new, wider radiocarbon sampling since 1988, so the main test has never been repeated on other parts of the cloth.</li></ul></div></div><h3 class="sub-h wsub">How the traditions tell it</h3><div class="v4texts"><blockquote class="quote v4q"><span class="v4q-t">New Testament · Mark 15:46</span><p>Then Joseph bought a linen cloth, and taking down the body, wrapped it in the linen cloth, and laid it in a tomb that had been hewn out of the rock.</p><cite>New Revised Standard Version (1989)</cite></blockquote></div><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>For most scientists the key facts line up: a 14th-century first appearance, a bishop&#x27;s report of an artist in 1389, and radiocarbon dates from three independent labs pointing to 1260–1390. The Shroud is then a remarkable medieval object, perhaps made for devotion or display, whose image technique is not fully understood. Retained fragments studied in 2010 and 2026 found no sign of the invisible reweave or contamination proposed to explain the date away.</p><ul><li>Three labs, working separately, got consistent medieval results, and all three control samples dated correctly.</li><li>The radiocarbon range overlaps neatly with the first documentation in the 1350s.</li><li>Textile study of the dated fragments shows the same linen as the main cloth.</li><li>Image formation is an open technical puzzle, but not evidence of age.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Supporters of an ancient origin argue that the 1988 test was narrower than it looks. Only one strip was cut, from a much-handled corner near old repairs and fire damage. Chemist Raymond Rogers argued in 2005 that the sample area differed chemically from the main cloth. In 2019 Tristan Casabianca and colleagues obtained the raw data and found statistical signs that the dates drift across the strip. In 2022 Liberato De Caro&#x27;s team used wide-angle X-ray scattering on one thread and reported a structure like linen from Masada of 55–74 CE.</p><ul><li>Casabianca&#x27;s reanalysis found the laboratory results were not homogeneous, weakening the stated precision.</li><li>De Caro&#x27;s X-ray method estimates the natural ageing of the cellulose, independent of carbon contamination.</li><li>No one has reproduced all the image&#x27;s physical properties together: superficiality, negativity and 3D information.</li></ul><div class="face-s"><b>Its strongest point</b><p>The 1988 test sampled a single small area at one edge of a cloth with a turbulent history. Real statistical heterogeneity in the raw data means the result is less secure than a single tidy date range suggests.</p></div><p class="face-cr"><b>Credit</b> Raymond Rogers; Giulio Fanti; Liberato De Caro; Tristan Casabianca</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>New radiocarbon dating of several well-separated areas of the main cloth, run blind in multiple laboratories.</li><li>Independent calibration of the X-ray scattering method on linen of known age and known storage history.</li><li>Reproduction by any method of all the image&#x27;s measured properties on linen.</li><li>A written or archival reference that securely identifies this cloth before the 1350s.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,024 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of The Shroud of Turin: The Most Tested Cloth on Earth"><button type="button" class="wtoc-i" data-go="shroud-s1">The photograph that changed everything</button><button type="button" class="wtoc-i" data-go="shroud-s2">What is solid</button><button type="button" class="wtoc-i" data-go="shroud-s3">Three labs, one answer</button><button type="button" class="wtoc-i" data-go="shroud-s4">The challengers: one corner, many questions</button><button type="button" class="wtoc-i" data-go="shroud-s5">The replies, and what is still unexplained</button><button type="button" class="wtoc-i" data-go="shroud-s6">What would settle it</button></nav></div><section class="wsec" id="shroud-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The photograph that changed everything</h3><p>On 28 May 1898 an Italian lawyer and amateur photographer, Secondo Pia, developed a glass plate he had just exposed in Turin Cathedral. On the negative, the faint brownish stains on an old linen sheet turned into something startling: a positive image of a bearded man, with realistic light and shade, marked with wounds on his wrists, feet, side and scalp. The cloth itself behaves like a negative. Nobody in the Middle Ages knew what a photographic negative was.</p><p>That moment turned a relic into a scientific mystery. The Shroud of Turin is venerated by many Christians as the burial cloth of Jesus, and it is also probably the most tested single object in history. Two questions have to be kept apart: how old is the linen, and how did the image get there? Science can say a lot about the first and rather less about the second.</p></section><section class="wsec" id="shroud-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What is solid</h3><p>The cloth is a single piece of linen about 4.4 by 1.1 metres, woven in a fine 3/1 herringbone twill, with the image of a man laid out front and back as if the cloth had been folded over a body from head to feet. It enters written history in the 1350s at Lirey in France, in a church founded by the knight Geoffroi de Charny; a pilgrim&#x27;s badge from Lirey, now in the Musée de Cluny, shows it on display. In 1389 Bishop Pierre d&#x27;Arcis of Troyes wrote to the Pope that a predecessor had investigated and found the artist who painted it. The cloth passed to the House of Savoy in 1453, was scorched in a fire at Chambéry in 1532, and has been in Turin since 1578.</p><blockquote class="quote"><p>Then Joseph bought a linen cloth, and taking down the body, wrapped it in the linen cloth, and laid it in a tomb that had been hewn out of the rock.</p><cite>Mark 15:46, New Revised Standard Version (1989)</cite></blockquote></section><section class="wsec" id="shroud-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Three labs, one answer</h3><p>On 21 April 1988, in the cathedral sacristy, a strip was cut from one corner of the cloth and divided among laboratories in Arizona, Oxford and Zurich. Each also received control samples of known age, among them linen from a Nubian tomb and fibres from a medieval cope, without being told which was which. The labs used accelerator mass spectrometry, which can count carbon-14 atoms directly in samples of a few tens of milligrams.</p><figure class="wx wx--steps" id="shroud-f1" data-n="6"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">How you radiocarbon-date a piece of linen</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="How you radiocarbon-date a piece of linen"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 548" class="wx-svg" role="img" aria-labelledby="shroud-f1-t"><title id="shroud-f1-t">How a linen sample is radiocarbon dated, in six steps, with the 1988 Shroud results</title><defs><marker id="shroud-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker></defs><g class="wx-st" data-s="1"><rect class="wx-card wx-edge-soft" x="12" y="14" width="224" height="256" rx="12"/><circle class="wx-num" cx="32" cy="36" r="9"/><text class="wx-numt" x="32" y="40" text-anchor="middle">1</text><text class="wx-t-b" x="48" y="41">Flax grows</text><text class="wx-t-s" x="26" y="244">the plant takes in CO2, including</text><text class="wx-t-s" x="26" y="258">about 1 carbon-14 atom per trillion</text><circle class="wx-glow" cx="212" cy="70" r="13"/><path class="wx-line wx-s3" d="M104.0,210 C108.0,164 100.0,124 106.0,96"/><circle class="wx-c2" cx="106.0" cy="94" r="4"/><path class="wx-line wx-s3" d="M124.0,210 C128.0,164 120.0,124 126.0,96"/><circle class="wx-c2" cx="126.0" cy="94" r="4"/><path class="wx-line wx-s3" d="M144.0,210 C148.0,164 140.0,124 146.0,96"/><ci
