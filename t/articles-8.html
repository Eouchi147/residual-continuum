 x="608" y="209" text-anchor="middle">Oxford</text><path class="wx-line" marker-end="url(#shroud-f1-ah)" d="M520,151 L664,190"/><rect class="wx-paper wx-edge-soft" x="646" y="194" width="56" height="22" rx="4"/><text class="wx-t-s" x="674" y="209" text-anchor="middle">Zurich</text></g><g class="wx-st" data-s="4"><rect class="wx-card wx-edge-soft" x="12" y="282" width="224" height="256" rx="12"/><circle class="wx-num" cx="32" cy="304" r="9"/><text class="wx-numt" x="32" y="308" text-anchor="middle">4</text><text class="wx-t-b" x="48" y="309">Clean and burn</text><text class="wx-t-s" x="26" y="512">acid and alkali washes remove</text><text class="wx-t-s" x="26" y="526">dirt; the fibre becomes graphite</text><path class="wx-water wx-edge" d="M52,352 h44 v70 q0,18 -22,18 q-22,0 -22,-18 Z"/><text class="wx-t-s" x="74" y="342" text-anchor="middle">wash</text><path class="wx-line" marker-end="url(#shroud-f1-ah)" d="M108,402 H132"/><path class="wx-fire wx-pulse" d="M158,442 c-12,-8 -10,-22 -2,-32 c0,10 6,11 7,6 c2,-9 -1,-16 6,-22 c-2,12 10,17 5,34 c-3,8 -10,14 -16,14 Z"/><text class="wx-t-s" x="162" y="462" text-anchor="middle">burn to CO2</text><path class="wx-line" marker-end="url(#shroud-f1-ah)" d="M182,402 H198"/><rect class="wx-inkfill" x="202" y="392" width="18" height="18" rx="3"/><text class="wx-t-s" x="211" y="428" text-anchor="middle">graphite</text></g><g class="wx-st" data-s="5"><rect class="wx-card wx-edge-soft" x="248" y="282" width="224" height="256" rx="12"/><circle class="wx-num" cx="268" cy="304" r="9"/><text class="wx-numt" x="268" y="308" text-anchor="middle">5</text><text class="wx-t-b" x="284" y="309">Count the atoms</text><text class="wx-t-s" x="262" y="512">an accelerator mass spectrometer</text><text class="wx-t-s" x="262" y="526">counts C-14 against C-12</text><rect class="wx-metal wx-edge" x="262" y="422" width="30" height="22" rx="3"/><text class="wx-t-s" x="277" y="460" text-anchor="middle">ions</text><path class="wx-line" d="M292,433 H344"/><rect class="wx-metal wx-o40 wx-edge-soft" x="344" y="378" width="62" height="74" rx="8"/><text class="wx-t-s" x="375" y="468" text-anchor="middle">magnet</text><path class="wx-flow wx-s6" d="M344,433 Q376,432 380,352"/><path class="wx-flow wx-s4" d="M344,433 Q398,432 444,378"/><rect class="wx-inkfill" x="372" y="338" width="16" height="8" rx="2"/><text class="wx-t-s" x="366" y="344" text-anchor="end">C-12, C-13</text><rect class="wx-accfill" x="440" y="360" width="16" height="16" rx="2"/><text class="wx-t-s wx-t-a" x="456" y="354" text-anchor="end">C-14 counter</text><text class="wx-t-n" x="264" y="488">689 ± 16</text><text class="wx-t-s" x="334" y="488">radiocarbon years</text></g><g class="wx-st" data-s="6"><rect class="wx-card wx-edge-soft" x="484" y="282" width="224" height="256" rx="12"/><circle class="wx-num" cx="504" cy="304" r="9"/><text class="wx-numt" x="504" y="308" text-anchor="middle">6</text><text class="wx-t-b" x="520" y="309">Calibrate</text><text class="wx-t-s" x="498" y="512">tree-ring curve turns 689 ± 16</text><text class="wx-t-s" x="498" y="526">radiocarbon years into dates</text><path class="wx-line" d="M514,330V470H694"/><rect class="wx-accfill wx-o20" x="514" y="385" width="180" height="22.4"/><polyline class="wx-line wx-s2 wx-draw" pathLength="1" style="--d:2" points="514.0,456.0 532.0,445.5 550.0,435.0 568.0,421.0 580.0,412.2 586.0,407.0 598.0,401.8 610.0,396.5 622.0,393.0 634.0,396.5 646.0,389.5 658.0,379.0 670.0,365.0 682.0,351.0 694.0,337.0"/><rect class="wx-c4 wx-o20" x="580.0" y="330" width="78.0" height="140"/><path class="wx-dash" d="M514,396.1H694"/><text class="wx-t-s" x="510" y="400.1" text-anchor="end">689</text><text class="wx-t-s" x="580.0" y="484" text-anchor="middle">1260</text><text class="wx-t-s" x="658.0" y="484" text-anchor="middle">1390</text><text class="wx-t-b wx-t-a" x="694" y="324" text-anchor="end">1260–1390 CE (95%)</text><text class="wx-t-s" x="690" y="462" text-anchor="end">schematic curve</text></g></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button><button type="button" class="wx-dot" data-k="6" aria-label="Step 6" aria-pressed="false">6</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 6.</b> Growing flax takes in carbon dioxide from the air, including about one carbon-14 atom in every trillion carbon atoms.</p><ol class="wx-steplist"><li>Growing flax takes in carbon dioxide from the air, including about one carbon-14 atom in every trillion carbon atoms.</li><li>Once harvested and woven, the fibres take in no new carbon. Carbon-14 decays, halving every 5,730 years.</li><li>21 April 1988: one strip is cut from a corner of the Shroud and shared between Arizona, Oxford and Zurich, with control samples.</li><li>Each lab cleans its piece with acid and alkali washes, burns it to carbon dioxide and turns that into graphite.</li><li>An accelerator mass spectrometer counts carbon-14 atoms against carbon-12. Combined result: 689 ± 16 radiocarbon years.</li><li>A calibration curve built from tree rings converts this into calendar years: 1260–1390 CE at 95 per cent confidence.</li></ol><figcaption>Six steps from a flax field to a calendar date, with the 1988 Shroud results. The calibration curve in step 6 is schematic. <span class="wx-src">Based on: Results from Damon et al. 1989; half-life 5,730 years (Cambridge value); calibration curve drawn schematically.</span></figcaption><p class="vh">Six panels. Step 1: flax plants grow in the sun, taking in carbon dioxide, with one highlighted carbon-14 atom among many ordinary ones. Step 2: a woven cloth and a decay curve showing half the carbon-14 left after 5,730 years; after 700 years about 92 per cent remains. Step 3: the 4.4 metre Shroud with a small strip at one corner sampled and sent to Arizona, Oxford and Zurich. Step 4: the sample washed, burned to carbon dioxide and turned into graphite. Step 5: an accelerator mass spectrometer bends ions in a magnet so carbon-14 reaches its own detector, giving 689 plus or minus 16 radiocarbon years. Step 6: a calibration curve converts that to 1260 to 1390 CE.</p></figure><p>The results, published in Nature in February 1989, gave a mean radiocarbon age of 689 ± 16 years before 1950, which calibrates to 1260–1390 CE at 95 per cent confidence. The controls came out right. The date sits almost exactly where the documents first put the cloth.</p><aside class="wcall"><b>How do we know?</b><p>Radiocarbon dating works because living plants keep taking in carbon dioxide containing a tiny, steady share of carbon-14. Once flax is harvested, that intake stops and the carbon-14 decays, halving every 5,730 years. Measure how much is left, correct for past changes in the atmosphere using tree rings of known age, and you get a calendar date. For linen about 700 years old, roughly 92 per cent of the original carbon-14 remains, which is easy to tell apart from the roughly 78 per cent expected after 2,000 years.</p></aside></section><section class="wsec" id="shroud-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The challengers: one corner, many questions</h3><p>Critics of the test do not have to argue that three labs all blundered. Their case is subtler. The strip came from a single spot at the edge of the cloth, a place handled for centuries during displays and close to repairs made after the 1532 fire. In 2005 the chemist Raymond Rogers, a veteran of the 1978 STURP investigation, argued that threads from the sample area were chemically different from the main cloth and might include later, rewoven material.</p><p>In 2019 Tristan Casabianca and colleagues obtained the labs&#x27; raw data through a freedom-of-information request. Their statistical analysis found that the individual measurements were not homogeneous: the dates appear to vary across the strip in a way that should not happen in a uniform sample. That does not produce an ancient date, but it means the famous 1260–1390 range was reported with more confidence than the data strictly support.</p><blockquote class="wpull"><p>The critics&#x27; best point is not that the labs failed, but that they were only ever allowed to test one small corner.</p></blockquote><p>In 2022 Liberato De Caro&#x27;s team in Italy tried a different clock. Wide-angle X-ray scattering measures how far the cellulose in linen has naturally broken down, which depends on time, temperature and humidity. Testing one thread, they reported a structure like that of linen from the siege of Masada, 55–74 CE, if the cloth had been stored at typical room conditions for 13 centuries.</p></section><section class="wsec" id="shroud-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>The replies, and what is still unexplained</h3><p>The strongest reply came from the fragments themselves. In 2010 Rachel Freer-Waters and Timothy Jull examined a retained piece of the Arizona sample and found no evidence that it came from a medieval repair. In April 2026 they published a fuller study of two dated fragments: pure flax, with the same herringbone weave and yarn twist as the main cloth, no repairs and no significant surface contamination.</p><aside class="wcall"><b>Fresh from the field</b><p>The 2026 npj Heritage Science study removes the most popular explanation for a wrong date, the invisible medieval patch. Meanwhile a 2025 digital study by Cicero Moraes argued that the image matches a low relief better than a wrapped human body, which suits a medieval craft technique; Casabianca and colleagues published a rebuttal in 2026. The image debate is very much alive.</p></aside><p>The X-ray claim has not persuaded most specialists. It rests on one thread, the method has not been calibrated on a series of linens of known age and history, and its answer depends heavily on the assumed storage temperature, which for this cloth included a fire hot enough to melt silver. As for the image, it is real and odd: the colour lies only in the outermost fibres, a layer a small fraction of a thousandth of a millimetre deep, with no paint soaking into the threads. Researchers have produced images with some of its properties by rubbing, dusting and scorching, but none that match all of them together.</p></section><section class="wsec" id="shroud-s6"><h3 class="wsec-h"><span class="wsec-n">06</span>What would settle it</h3><ul class="wlist"><li>Blind radiocarbon dating of several distant areas of the cloth, in several laboratories, with the raw data published from the start.</li><li>Calibration of X-ray and other structural dating methods on dozens of linens of known age and storage history.</li><li>A reproduction of all the image&#x27;s physical properties, by any technique, on real linen.</li><li>An archival reference that securely identifies this particular cloth before the 1350s.</li></ul><p>The date of the linen is as well established as a single sampling can make it, and it is medieval. The image is a separate and genuinely open puzzle. And for millions of people the Shroud&#x27;s meaning has never depended on a laboratory, which is exactly as it should be: science can weigh the cloth, not the faith of those who pray before it.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-event" style="--i:0"><span class="wtl-y">1355 CE</span><span class="wtl-k">Event</span><span class="wtl-t">First displayed at Lirey, France</span></li><li class="wtl-study" style="--i:1"><span class="wtl-y">1389 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Bishop d&#x27;Arcis reports an artist confessed</span></li><li class="wtl-loss" style="--i:2"><span class="wtl-y">1532 CE</span><span class="wtl-k">Lost</span><span class="wtl-t">Fire at Chambéry scorches the cloth</span></li><li class="wtl-event" style="--i:3"><span class="wtl-y">1578 CE</span><span class="wtl-k">Event</span><span class="wtl-t">Moved to Turin</span></li><li class="wtl-study" style="--i:4"><span class="wtl-y">1898 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Secondo Pia&#x27;s photograph reveals a negative image</span></li><li class="wtl-study" style="--i:5"><span class="wtl-y">1978 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">STURP team examines the cloth for five days</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">1988 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Radiocarbon dating: 1260–1390 CE</span></li><li class="wtl-study" style="--i:7"><span class="wtl-y">2019 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Raw data reanalysis finds heterogeneity</span></li><li class="wtl-study" style="--i:8"><span class="wtl-y">2022 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">X-ray scattering claim of a 1st-century thread</span></li><li class="wtl-study" style="--i:9"><span class="wtl-y">2026 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Dated fragments confirmed as unrepaired linen</span></li></ol><details class="srcs"><summary>Sources for this case (10)</summary><ol><li>Damon P. E. et al. (1989). Radiocarbon dating of the Shroud of Turin. Nature 337: 611–615. <a href="https://doi.org/10.1038/337611a0" target="_blank" rel="noopener">doi:10.1038/337611a0</a></li><li>Casabianca T., Marinelli E., Pernagallo G., Torrisi B. (2019). Radiocarbon dating of the Turin Shroud: new evidence from raw data. Archaeometry 61(5): 1223–1231. <a href="https://doi.org/10.1111/arcm.12467" target="_blank" rel="noopener">doi:10.1111/arcm.12467</a></li><li>Freer-Waters R. A., Jull A. J. T. (2010). Investigating a dated piece of the Shroud of Turin. Radiocarbon 52(4): 1521–1527. <a href="https://doi.org/10.1017/S0033822200056277" target="_blank" rel="noopener">doi:10.1017/S0033822200056277</a></li><li>Freer-Waters R., Jull A. J. T. (2026). Analysis of textile fragments from the 1988 radiocarbon samples of the Turin Shroud. npj Heritage Science. <a href="https://doi.org/10.1038/s40494-026-02530-7" target="_blank" rel="noopener">doi:10.1038/s40494-026-02530-7</a></li><li>De Caro L., Sibillano T., Lassandro R., Giannini C., Fanti G. (2022). X-ray dating of a Turin Shroud&#x27;s linen sample. Heritage 5(2): 860–870. <a href="https://doi.org/10.3390/heritage5020047" target="_blank" rel="noopener">doi:10.3390/heritage5020047</a></li><li>Rogers R. N. (2005). Studies on the radiocarbon sample from the Shroud of Turin. Thermochimica Acta 425: 189–194.</li><li>Moraes C. (2025). Image formation on the Holy Shroud: a digital 3D approach. Archaeometry. <a href="https://doi.org/10.1111/arcm.70030" target="_blank" rel="noopener">doi:10.1111/arcm.70030</a></li><li>Casabianca T., Marinelli E., Piana A. (2026). Commentary on &#x27;Image formation on the Holy Shroud&#x27;. Archaeometry. <a href="https://doi.org/10.1111/arcm.70109" target="_blank" rel="noopener">doi:10.1111/arcm.70109</a></li><li>Jumper E. J. et al. (1984). A comprehensive examination of the various stains and images on the Shroud of Turin. In Lambert J. B. (ed.), Archaeological Chemistry III. Advances in Chemistry 205, American Chemical Society.</li><li>Nicolotti A. (2020). The Shroud of Turin: The History and Legends of the World&#x27;s Most Famous Relic. Baylor University Press.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-shroud" data-t="The Shroud of Turin: The Most Tested Cloth on Earth"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Shroud of Turin: The Most Tested Cloth on Earth</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-shroud</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script><script type="text/x-tpl" id="case-ark-covenant-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="James Jacques Joseph Tissot - The Ark Passes Over the Jordan - Google Art Project.jpg" data-cap="The Ark as painted by James Tissot" data-big><figcaption></figcaption></figure><div class="sh-k">Legends and Relics</div><h2 class="sh-t" id="case-ark-covenant-st" tabindex="-1">The Ark of the Covenant: Lost, Hidden or Guarded?</h2><p class="sh-s">The holiest object of ancient Israel vanished from the record 2,600 years ago. An Ethiopian church says it never left their care.</p><div class="sh-v"><span class="vstamp vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><p class="sh-claim"><b>What the stamp rates:</b> The original Ark of the Covenant survives today in the Chapel of the Tablet at Aksum.</p><p class="sh-claim"><b>The text's own words:</b> <span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span> <span class="sh-more">(line by line below)</span></p></div><p class="v4-q">What happened to the Ark, and could the Aksum tradition ever be tested?</p><section class="inshort" aria-label="In short"><h3 class="inshort-h">In short</h3><ol><li>The Ark was a gold-covered wooden chest carried on poles, the kind of object well known from ancient Egypt.</li><li>It vanishes from the record around the fall of Jerusalem in 586 BCE; the list of what the Babylonians took does not mention it.</li><li>A church in Aksum, Ethiopia, says it keeps the original in a closed chapel.</li><li>That tradition is sincere and old, but the written account is about 1,900 years after the events, and the object has never been examined.</li><li>Nothing contradicts the claim; nothing supports it either, and it cannot be tested while the chapel stays closed.</li></ol><div class="thr-row"><span class="thr-k">Science threads</span><span class="thr">Texts and scripts</span><span class="thr">Religion and myth</span><span class="thr">Institutions</span></div></section><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The original Ark of the Covenant survives today in the Chapel of the Tablet at Aksum.</p></div><div class="v4m-grid"><div class="v4m-c"><div class="meter" style="--pos:25.0%" role="img" aria-label="Weight of evidence: Awaiting discovery"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The Aksum tradition is sincere, ancient in Ethiopian terms, and central to a living church, but there is currently no physical or early textual evidence linking the object in the chapel to Solomon&#x27;s Temple. The written account is about 1,900 years later than the events, and the object has never been examined. Hancock&#x27;s route uses real places, such as the Elephantine temple, but no source says the Ark passed through them. This is a case of missing evidence rather than contrary evidence: it cannot be tested while the chapel stays closed, and respecting that is the custodians&#x27; right.</p></div><div class="v4m-c"><div class="tmeter" role="img" aria-label="Textbook confidence: 3 of 6, leaning one way"><div class="tmeter-top"><span class="meter-k">Textbook confidence</span><b>leaning one way</b></div><div class="tmeter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i></div><div class="meter-ends" aria-hidden="true"><span>Openly unsure</span><span>Settled fact</span></div><p class="tgap">Textbooks usually say the Ark &#x27;was probably destroyed or taken by the Babylonians in 586 BCE&#x27;. That is the most economical reading, but it is an inference from silence, not a recorded event, and the Bible&#x27;s own list of Babylonian loot omits it. A little more humility would be honest: we know when the Ark stops being mentioned, not what happened to it. On Aksum, textbooks are appropriately cautious.</p></div></div></div></div><div class="ssm"><div class="ssm-c ssm-solid"><h3 class="ssm-h">What is solid</h3><ul><li>Exodus describes a chest of acacia wood overlaid with gold, 2.5 by 1.5 by 1.5 cubits (about 1.1 by 0.7 by 0.7 m), carried on poles, with two cherubim on its cover.<small>Exodus 25:10–22</small></li><li>Gilded wooden chests and shrines carried on poles are well attested in New Kingdom Egypt, such as the Anubis shrine from Tutankhamun&#x27;s tomb, so the described object fits its world.<small>Tomb KV62, Egyptian Museum</small></li><li>The biblical list of what the Babylonians took from the Temple in 586 BCE does not mention the Ark, and Roman writers say Pompey found the inner sanctuary empty in 63 BCE.<small>2 Kings 25:13–17; Tacitus, Histories 5.9</small></li><li>Excavations at Kiriath-jearim, where the Bible says the Ark rested for twenty years, revealed a monumental Iron Age platform on the hilltop.<small>Finkelstein et al. 2021</small></li><li>The Ethiopian Orthodox Church holds that the Ark is kept in the Chapel of the Tablet at Aksum, guarded by a single monk; the tradition is set out in the Kebra Nagast, compiled in the early 14th century.<small>Kebra Nagast; Munro-Hay 2005</small></li></ul></div><div class="ssm-c ssm-disputed"><h3 class="ssm-h">What is disputed</h3><ul><li>Whether the Ark was taken by Egypt around 925 BCE, destroyed or carried off by Babylon in 586 BCE, or hidden before the fall of Jerusalem.</li><li>Whether the Aksum tradition preserves an ancient memory or grew up in medieval Ethiopia around a sacred object of later date.</li><li>What the Ark originally held: the tablets of the covenant, as Deuteronomy and Kings say, or, as some scholars propose, a divine image.</li></ul></div><div class="ssm-c ssm-missing"><h3 class="ssm-h">What time has hidden</h3><ul><li>Wood and gold leave little behind: an Ark burned or melted down in 586 BCE would leave no trace.</li><li>The Temple Mount in Jerusalem, where rabbinic tradition places a hidden Ark, cannot be excavated for religious and political reasons.</li><li>No outsider has been allowed to examine the object at Aksum, so nothing about it has been described or measured.</li></ul></div></div><h3 class="sub-h wsub">How the traditions tell it</h3><div class="v4texts"><blockquote class="quote v4q"><span class="v4q-t">Hebrew Bible · Exodus 25:10</span><p>They shall make an ark of acacia wood; it shall be two and a half cubits long, a cubit and a half wide, and a cubit and a half high.</p><cite>New Revised Standard Version (1989)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Hebrew Bible · 1 Kings 8:9</span><p>There was nothing in the ark except the two tablets of stone that Moses had placed there at Horeb, where the Lord made a covenant with the Israelites, when they came out of the land of Egypt.</p><cite>New Revised Standard Version (1989)</cite></blockquote><blockquote class="quote v4q"><span class="v4q-t">Quran · 2:248</span><p>And their prophet said to them, &#x27;Indeed, a sign of his kingship is that the chest will come to you in which is assurance from your Lord and a remnant of what the family of Moses and the family of Aaron had left, carried by the angels. Indeed in that is a sign for you, if you are believers.&#x27;</p><cite>trans. Sahih International (1997)</cite></blockquote></div><h3 class="sub-h wsub">In the text's own words</h3><p class="rd-rule">Each line rates only what the text itself says, not later dates, commentaries or modern identifications.</p><ul class="rds"><li class="rd"><p class="rd-s">A chest held the tablets and relics left by the families of Moses and Aaron (Exodus 25:10; 1 Kings 8:9; Quran 2:248).</p><span class="vd vd--unsupported"><svg class="i" aria-hidden="true"><use href="#i0"/></svg>Awaiting discovery</span><p class="rd-n">Portable sacred chests carried on poles are well known from Egypt. The Ark&#x27;s fate after the Babylonian conquest of 586 BCE is unknown, and no object has been found.</p></li></ul><h3 class="sub-h wsub">Two readings</h3><div class="face"><div class="face-c face-m"><span class="face-k">The mainstream view</span><p>Most biblical scholars and archaeologists think a real portable shrine stood at the heart of Israel&#x27;s early cult and later in the Jerusalem Temple, whatever it held. It most likely disappeared in the Babylonian destruction of 586 BCE, or earlier, and the silence of the later sources reflects its loss. The Aksum tradition is respected as a living faith, but historians such as Stuart Munro-Hay trace its written form to medieval Ethiopia and doubt a physical link to Solomon&#x27;s Temple.</p><ul><li>The Ark&#x27;s last clear appearances are in the time of Solomon and, in Chronicles, King Josiah around 622 BCE.</li><li>Jeremiah foresees a day when the Ark will no longer be spoken of, which reads like a response to its loss.</li><li>Thomas Römer and Israel Finkelstein read parts of the Ark story as shaped by later politics, including a shrine at Kiriath-jearim.</li><li>The Kebra Nagast dates from about 1314–1322 CE, some 1,900 years after the Temple fell.</li></ul></div><div class="face-c face-x"><span class="face-k">The bold reading</span><p>Graham Hancock took the Ethiopian tradition seriously and tried to trace a real route for it. He proposed that priests removed the Ark from Jerusalem during the reign of King Manasseh in the 7th century BCE, when a rival idol was placed in the Temple, and carried it to the Jewish temple at Elephantine on the Nile, which existed in the 5th century BCE. From there, he argued, it travelled into Ethiopia, rested for centuries on the island of Tana Kirkos in Lake Tana, and was brought to Aksum after the kingdom became Christian in the 4th century CE.</p><ul><li>A Jewish temple really did stand at Elephantine in the 5th century BCE, documented by Aramaic papyri, and was destroyed in 410 BCE.</li><li>Ethiopian Christianity has unusually strong Israelite features, and every church holds a tabot, a sacred replica of the tablets.</li><li>The Bible never records the Ark&#x27;s capture or destruction, leaving room for a secret removal.</li></ul><div class="face-s"><b>Its strongest point</b><p>The biblical record simply goes silent: no text says the Babylonians took or burned the Ark. Of all the traditions claiming it, only Ethiopia&#x27;s has kept an unbroken ritual life built around it for many centuries.</p></div><p class="face-cr"><b>Credit</b> Graham Hancock (The Sign and the Seal, 1992); the Ethiopian Orthodox tradition</p></div></div><h3 class="sub-h wsub">What would settle it</h3><ol class="settle"><li>Independent examination of the object at Aksum: radiocarbon dating of any wood, and analysis of any metal or gold overlay.</li><li>An early source, older than the Kebra Nagast, placing the Ark in Ethiopia or at Elephantine.</li><li>Excavation evidence from Elephantine or Tana Kirkos for a portable Israelite shrine of the right date.</li><li>Textual discoveries, such as Babylonian booty lists, recording what was taken from the Jerusalem Temple in 586 BCE.</li></ol><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">5 min read · 1,065 words · 1 animated drawing</span></div><nav class="wtoc" aria-label="Sections of The Ark of the Covenant: Lost, Hidden or Guarded?"><button type="button" class="wtoc-i" data-go="ark-covenant-s1">The object that vanished</button><button type="button" class="wtoc-i" data-go="ark-covenant-s2">What is solid</button><button type="button" class="wtoc-i" data-go="ark-covenant-s3">The mainstream story: lost in the fall of Jerusalem</button><button type="button" class="wtoc-i" data-go="ark-covenant-s4">The challengers: the road to Aksum</button><button type="button" class="wtoc-i" data-go="ark-covenant-s5">What could be tested, and what cannot</button></nav></div><section class="wsec" id="ark-covenant-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The object that vanished</h3><p>Few objects have been described so exactly and then lost so completely. The book of Exodus gives the Ark&#x27;s measurements to the half-cubit, its wood, its gold, its carrying rings and the two winged cherubim facing each other over its lid. It led Israel across the Jordan, was captured in battle by the Philistines, brought plague on their cities, and was finally carried into Jerusalem by a dancing King David. Solomon set it in the innermost room of his Temple.</p><blockquote class="quote"><p>They shall make an ark of acacia wood; it shall be two and a half cubits long, a cubit and a half wide, and a cubit and a half high.</p><cite>Exodus 25:10, New Revised Standard Version (1989)</cite></blockquote><p>Then the record falls silent. When the Babylonians sacked Jerusalem in 586 BCE, the Bible lists the bronze pillars, stands and basins they carried away, but not the Ark. Five centuries later, when the Roman general Pompey pushed into the Holy of Holies in 63 BCE, Tacitus says he found the room empty. Where did it go?</p></section><section class="wsec" id="ark-covenant-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What is solid</h3><p>The Ark fits its ancient world remarkably well. Egypt&#x27;s New Kingdom produced gilded wooden chests and shrines carried on poles, the best known being the Anubis shrine found in Tutankhamun&#x27;s tomb in 1922, with a jackal crouching on a gilded chest mounted on sledge runners and poles. Winged guardian figures flanking a sacred object are common in the art of the Levant. A cubit of about 44.5 cm makes the Ark about 1.1 m long and 0.7 m wide and high: small enough for a few bearers to carry on poles, as the scale drawing in the map shows.</p><figure class="wx wx--steps" id="ark-covenant-f1" data-n="5"><div class="wx-head"><span class="wx-k">Figure 1 · Step through it</span><h4 class="wx-title">Where did the Ark go?</h4></div><div class="wx-frame"><div class="wx-scroll" tabindex="0" role="group" aria-label="Where did the Ark go?"><svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 630" class="wx-svg" role="img" aria-labelledby="ark-covenant-f1-t"><title id="ark-covenant-f1-t">Where the Ark went: the biblical story and the rival theories on a map</title><defs><marker id="ark-covenant-f1-ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-accfill" d="M0,0 L10,5 L0,10 Z"/></marker><marker id="ark-covenant-f1-ak" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="wx-inkfill" d="M0,0 L10,5 L0,10 Z"/></marker><clipPath id="ark-covenant-f1-c cy="308" r="9"/><text class="wx-numt" x="459" y="312" text-anchor="middle">5</text><text class="wx-t-b" x="476" y="312">Aksum today</text><text class="wx-t-s" x="476" y="328">Chapel of the Tablet: one</text><text class="wx-t-s" x="476" y="342">guardian monk, no testing</text></g><path class="wx-line" d="M30,574.0 h105.9"/><text class="wx-t-s" x="30" y="568.0">about 500 km</text><text class="wx-t-s" x="20" y="624">Schematic map, equirectangular; routes are proposals, not recorded journeys.</text></svg></div></div><div class="wx-ctl"><button type="button" class="wx-b" data-a="prev" aria-label="Previous step"><svg class="i" aria-hidden="true"><use href="#i10"/></svg></button><div class="wx-dots" role="group" aria-label="Steps"><button type="button" class="wx-dot" data-k="1" aria-label="Step 1" aria-pressed="true">1</button><button type="button" class="wx-dot" data-k="2" aria-label="Step 2" aria-pressed="false">2</button><button type="button" class="wx-dot" data-k="3" aria-label="Step 3" aria-pressed="false">3</button><button type="button" class="wx-dot" data-k="4" aria-label="Step 4" aria-pressed="false">4</button><button type="button" class="wx-dot" data-k="5" aria-label="Step 5" aria-pressed="false">5</button></div><button type="button" class="wx-b" data-a="next" aria-label="Next step"><svg class="i" aria-hidden="true"><use href="#i11"/></svg></button><button type="button" class="wx-play" data-a="play">Play</button></div><p class="wx-stepcap" aria-live="polite"><b>Step 1 of 5.</b> The biblical story: from Sinai to Jerusalem, where Solomon places the Ark in the Temple. Inset: its size from Exodus 25, beside a person.</p><ol class="wx-steplist"><li>The biblical story: from Sinai to Jerusalem, where Solomon places the Ark in the Temple. Inset: its size from Exodus 25, beside a person.</li><li>c. 925 BCE: Shishak of Egypt (Shoshenq I) takes the Temple treasures. Did the Ark go too? The Bible later mentions it again.</li><li>586 BCE: Babylon destroys the Temple. The Bible lists the loot, and the Ark is not on it.</li><li>Hancock&#x27;s proposal: removed in the 7th century BCE to the Jewish temple at Elephantine, then south to Lake Tana.</li><li>Aksum: the Chapel of the Tablet, where Ethiopian tradition holds the Ark is kept, unseen by outsiders.</li></ol><figcaption>A map of the biblical story and the main theories, with the Ark drawn to scale beside a person. Routes after Jerusalem are proposals, not recorded journeys. <span class="wx-src">Based on: Coastlines and rivers simplified from standard atlases (equirectangular, 500 km scale bar); Ark dimensions from Exodus 25:10 with a 44.5 cm cubit; routes after Hancock 1992 and the biblical texts.</span></figcaption><p class="vh">A map from the Mediterranean to Ethiopia, with the Nile, Red Sea, Euphrates and Tigris. Step 1: the biblical route from Sinai to Jerusalem, and an inset drawing of the Ark to scale, about 1.1 m long and 0.7 m high, beside a 1.7 m person. Step 2: an arrow from Jerusalem to Tanis in Egypt for Shishak&#x27;s raid around 925 BCE. Step 3: an arrow from Jerusalem to Babylon for 586 BCE. Step 4: Graham Hancock&#x27;s proposed dashed route from Jerusalem to Elephantine on the Nile and on to Tana Kirkos in Lake Tana. Step 5: the route ends at Aksum, highlighted, where the Chapel of the Tablet stands.</p></figure><p>Archaeology has touched the story at Kiriath-jearim, where the Ark is said to have rested for twenty years before David moved it. Excavations led by Israel Finkelstein and Thomas Römer from 2017 found a massive artificial platform on the hilltop, built in the 8th century BCE, which they link to a sanctuary there. Römer has also suggested that the Ark may once have carried a divine image before later tradition described it as holding the tablets of the law.</p></section><section class="wsec" id="ark-covenant-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The mainstream story: lost in the fall of Jerusalem</h3><p>The simplest reading is that the Ark was lost when Jerusalem fell, or before. The last clear mention is in Chronicles, where King Josiah, around 622 BCE, tells the Levites to put the holy ark in the house that Solomon built. The prophet Jeremiah, active in those same decades, looks ahead to a time when people will no longer say &#x27;The ark of the covenant of the Lord&#x27;, which reads like a community coming to terms with its absence.</p><p>Two other departures are possible. Around 925 BCE Pharaoh Shoshenq I, the biblical Shishak, raided the region; 1 Kings says he took away the treasures of the house of the Lord and the treasures of the king&#x27;s house, and took everything. Yet the Ark reappears later in Chronicles, and Shoshenq&#x27;s own victory list at Karnak does not name Jerusalem. Later Jewish traditions offered hopeful alternatives: 2 Maccabees says Jeremiah hid it in a cave on Mount Nebo, and rabbinic sources debated whether it lay hidden beneath the Temple itself.</p><aside class="wcall"><b>How do we know?</b><p>Mostly from what the texts do not say. Biblical scholars date the relevant books, compare their lists and note where the Ark disappears. It is a case built on silence, which is why the Babylonian ending, though most likely, remains an inference. An inscribed Babylonian booty list from 586 BCE would be the kind of document that could close the question.</p></aside></section><section class="wsec" id="ark-covenant-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The challengers: the road to Aksum</h3><p>In the ancient city of Aksum in northern Ethiopia, a small green-domed chapel beside the Church of Our Lady Mary of Zion is said to hold the Ark itself. One monk, chosen for life, guards it and may see it; no one else may. The story is told in the Kebra Nagast, the &#x27;Glory of the Kings&#x27;: Menelik, son of Solomon and the Queen of Sheba, visits his father in Jerusalem and returns to Ethiopia with the Ark. Every Ethiopian Orthodox church keeps a tabot, a consecrated replica of the tablets, and at the festival of Timkat these are carried in procession under brocade, much as the Ark was carried in the Bible.</p><blockquote class="wpull"><p>No text records the Ark&#x27;s destruction. Only one tradition says where it went, and only one people has built its worship around guarding it.</p></blockquote><p>Graham Hancock&#x27;s The Sign and the Seal (1992) gave the tradition a historical route. He argued that loyal priests removed the Ark from the Temple during the reign of Manasseh in the 7th century BCE and took it to Egypt, to the Jewish temple on Elephantine island at Aswan, which Aramaic papyri show was flourishing in the 5th century BCE until its destruction in 410 BCE. From there, he suggested, it went up the Nile into Ethiopia, rested for centuries on Tana Kirkos island in Lake Tana, where monks still point to ancient stone pillars, and reached Aksum after the kingdom converted to Christianity in the 4th century CE.</p><p>The route uses real places, and Ethiopian Christianity does have deep Israelite roots. But no ancient source places the Ark at Elephantine, whose papyri describe its temple in some detail, or on Lake Tana. The Kebra Nagast was compiled around 1314–1322 CE from older materials, and Stuart Munro-Hay argued that the object at Aksum is most likely a revered tabot whose identification with Solomon&#x27;s Ark grew up in medieval times.</p></section><section class="wsec" id="ark-covenant-s5"><h3 class="wsec-h"><span class="wsec-n">05</span>What could be tested, and what cannot</h3><p>The Ark is one of the rare legends with a testable physical claim. If the object in Aksum is a wooden chest overlaid with gold, a few milligrams of wood could be radiocarbon-dated and the gold analysed for its source and working. A date around 1000 BCE would transform the case; a date around 1300 CE would settle it the other way. Other claimed Arks have met this fate: Tudor Parfitt traced a sacred drum of the Lemba people of southern Africa, identified by them with the Ark, and radiocarbon dating placed it around 1350 CE.</p><p>But testing requires permission, and the Ethiopian Church has consistently refused, as is its right. The Temple Mount cannot be excavated. Mount Nebo has been searched by enthusiasts without result. Wood burns and gold melts, so an Ark destroyed in 586 BCE would leave no recognisable trace. This is a case where time and reverence together keep the evidence out of reach.</p><blockquote class="quote"><p>And their prophet said to them, &#x27;Indeed, a sign of his kingship is that the chest will come to you in which is assurance from your Lord and a remnant of what the family of Moses and the family of Aaron had left, carried by the angels.&#x27;</p><cite>Quran 2:248, trans. Sahih International (1997)</cite></blockquote><p>The Quran, too, remembers the Ark, the tabut, as a sign of divine favour in the time of Saul, holding relics of Moses and Aaron. Across three traditions the object is remembered with awe. None of them, in its own texts, tells us where it is now.</p></section><h3 class="sub-h wsub">Through time</h3><ol class="wtl"><li class="wtl-use" style="--i:0"><span class="wtl-y">950 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Ark placed in Solomon&#x27;s Temple (biblical setting)</span></li><li class="wtl-loss" style="--i:1"><span class="wtl-y">925 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Shishak of Egypt takes the Temple treasures</span></li><li class="wtl-use" style="--i:2"><span class="wtl-y">622 BCE</span><span class="wtl-k">In use</span><span class="wtl-t">Last biblical mention, under King Josiah</span></li><li class="wtl-loss" style="--i:3"><span class="wtl-y">586 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Babylon destroys the Temple</span></li><li class="wtl-loss" style="--i:4"><span class="wtl-y">410 BCE</span><span class="wtl-k">Lost</span><span class="wtl-t">Jewish temple at Elephantine destroyed</span></li><li class="wtl-event" style="--i:5"><span class="wtl-y">63 BCE</span><span class="wtl-k">Event</span><span class="wtl-t">Pompey finds the Holy of Holies empty</span></li><li class="wtl-study" style="--i:6"><span class="wtl-y">1320 CE</span><span class="wtl-k">Studied</span><span class="wtl-t">Kebra Nagast compiled in Ethiopia</span></li><li class="wtl-build" style="--i:7"><span class="wtl-y">1965 CE</span><span class="wtl-k">Built</span><span class="wtl-t">Chapel of the Tablet built at Aksum</span></li></ol><details class="srcs"><summary>Sources for this case (11)</summary><ol><li>Finkelstein I., Römer T. et al. (2018). Excavations at Kiriath-jearim near Jerusalem, 2017: preliminary report. Semitica 60.</li><li>Finkelstein I. et al. (2021). Excavations at Kiriath-jearim, 2019: preliminary report. Tel Aviv 48(1). <a href="https://doi.org/10.1080/03344355.2021.1904680" target="_blank" rel="noopener">doi:10.1080/03344355.2021.1904680</a></li><li>Römer T. (2015). The Invention of God. Harvard University Press.</li><li>Munro-Hay S. (2005). The Quest for the Ark of the Covenant: The True History of the Tablets of Moses. I. B. Tauris.</li><li>Hancock G. (1992). The Sign and the Seal: The Quest for the Lost Ark of the Covenant. Crown.</li><li>Parfitt T. (2008). The Lost Ark of the Covenant: Solving the 2,500-Year-Old Mystery of the Fabled Biblical Ark. HarperOne.</li><li>Budge E. A. W. (trans.) (1922). The Queen of Sheba and Her Only Son Menyelek (Kebra Nagast). Medici Society.</li><li>Porten B. (1968). Archives from Elephantine: The Life of an Ancient Jewish Military Colony. University of California Press.</li><li>Tacitus, Histories 5.9, trans. C. H. Moore (Loeb Classical Library, 1931).</li><li>Day J. (2005). Whatever happened to the Ark of the Covenant? In Day J. (ed.), Temple and Worship in Biblical Israel. T&amp;T Clark.</li><li>The Holy Bible, New Revised Standard Version (1989): Exodus 25; 1 Samuel 4–7; 2 Samuel 6; 1 Kings 8 and 14; 2 Kings 25; 2 Chronicles 35; Jeremiah 3.</li></ol></details><aside class="rc-cite" data-v="articles" data-id="case-ark-covenant" data-t="The Ark of the Covenant: Lost, Hidden or Guarded?"><b class="cite-k">Cite this page</b><p class="cite-t">Residual Continuum (2026). <i>The Ark of the Covenant: Lost, Hidden or Guarded?</i>. <span class="cite-u">https://residualcontinuum.com/#articles/case-ark-covenant</span> (updated 24 September 2026).</p><div class="cite-b"><button type="button" class="chip" data-cite-copy>Copy citation</button><button type="button" class="chip" data-cite-link>Copy link</button><button type="button" class="chip" data-fix>Report an error</button></div><small>Verdicts change when the evidence does. Every change is dated on the <a href="#corrections" onclick="go('corrections');return false;">corrections page</a>.</small></aside></div></script>
