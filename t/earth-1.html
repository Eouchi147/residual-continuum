"wtoc-i" data-go="le-cambrian-explosion-s2">Eyes, armour and the first arms race</button><button type="button" class="wtoc-i" data-go="le-cambrian-explosion-s3">Why then?</button><button type="button" class="wtoc-i" data-go="le-cambrian-explosion-s4">What it left us</button></nav></div><section class="wsec" id="le-cambrian-explosion-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A sea that suddenly fills</h3><p>For more than three billion years, life on Earth was mostly microscopic. Then, beginning about 539 million years ago, the fossil record changes character. Within a span of roughly 25 million years, a blink in geological terms, rocks around the world fill with animals that have shells, legs, eyes, guts and teeth. Trilobites scuttle across the seabed. Sponges and reef-building archaeocyaths form mounds. Worms burrow. Strange experiments such as five-eyed Opabinia sit alongside animals that are clearly the ancestors of crabs, snails and fish.</p><blockquote class="wpull"><p>The Cambrian did not invent animals. It invented animals that could see, chase, bite and hide.</p></blockquote></section><section class="wsec" id="le-cambrian-explosion-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Eyes, armour and the first arms race</h3><p>Many researchers think predation was the spark that kept the explosion going. Once some animals could see and catch others, prey needed armour, spines, speed or burrows, and predators needed better eyes and grasping limbs. Anomalocaris, a swimming hunter with spiny head claws, had compound eyes built from thousands of lenses. Burrowing deep into the mud became both a hiding strategy and a way to feed, and it transformed the seafloor itself.</p><p>Two windows let us see soft bodies that normally rot away. The Burgess Shale in the Canadian Rockies, found by Charles Walcott in 1909, is about 508 million years old. The older Chengjiang fossils of Yunnan, China, found in 1984, preserve guts, gills and even nervous tissue.</p></section><section class="wsec" id="le-cambrian-explosion-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Why then?</h3><p>No single trigger explains the timing. The leading ideas overlap, and most specialists now think they reinforced each other.</p><ul class="wlist"><li>Oxygen: active predators need more oxygen, and a modest rise in ocean oxygen may have crossed a threshold for large, mobile animals (Sperling et al. 2013).</li><li>Ecology: once predators appeared, feedback between hunters and hunted drove rapid innovation.</li><li>Genes: the developmental toolkit for building complex bodies, including Hox genes, was already in place, ready to be used in new ways.</li><li>Chemistry: seawater rich in calcium and phosphate may have made building skeletons easier.</li></ul><aside class="wcall"><b>How do we know?</b><p>Dates come from uranium-lead ages of zircon crystals in volcanic ash beds sandwiched between fossil layers. Trace fossils show when burrowing began, because tracks record behaviour even when bodies are lost. Exceptional sites with soft tissue show animals without shells. Molecular clocks, which estimate when lineages split from the number of genetic differences between living animals, suggest many groups began earlier than their first fossils, which is why the explosion is read as a burst of visible, large animals rather than a sudden origin.</p></aside></section><section class="wsec" id="le-cambrian-explosion-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>What it left us</h3><p>Look at your own body and you are looking at a Cambrian design: a front and a back, a gut running through, paired eyes, a nerve cord along the spine. The chordate line that leads to fish and eventually to us is already present in Chengjiang and the Burgess Shale. The Cambrian also set the pattern for all later ecosystems, with food webs of grazers, filter feeders and predators. The seas that followed would lose many of these experiments, but the basic plans survived and still shape life today.</p></section><details class="srcs"><summary>Sources for this entry (7)</summary><ol><li>Erwin, D.H. et al. (2011). The Cambrian conundrum: early divergence and later ecological success in the early history of animals. Science 334: 1091-1097. <a href="https://doi.org/10.1126/science.1206375" target="_blank" rel="noopener">doi:10.1126/science.1206375</a></li><li>Briggs, D.E.G. (2015). The Cambrian explosion. Current Biology 25: R864-R868. <a href="https://doi.org/10.1016/j.cub.2015.04.047" target="_blank" rel="noopener">doi:10.1016/j.cub.2015.04.047</a></li><li>Wood, R. et al. (2019). Integrated records of environmental change and evolution challenge the Cambrian Explosion. Nature Ecology &amp; Evolution 3: 528-538. <a href="https://doi.org/10.1038/s41559-019-0821-6" target="_blank" rel="noopener">doi:10.1038/s41559-019-0821-6</a></li><li>Sperling, E.A. et al. (2013). Oxygen, ecology, and the Cambrian radiation of animals. PNAS 110: 13446-13451. <a href="https://doi.org/10.1073/pnas.1312778110" target="_blank" rel="noopener">doi:10.1073/pnas.1312778110</a></li><li>Paterson, J.R. et al. (2011). Acute vision in the giant Cambrian predator Anomalocaris and the origin of compound eyes. Nature 480: 237-240. <a href="https://doi.org/10.1038/nature10689" target="_blank" rel="noopener">doi:10.1038/nature10689</a></li><li>Fu, D. et al. (2019). The Qingjiang biota: a Burgess Shale-type fossil Lagerstätte from the early Cambrian of South China. Science 363: 1338-1342. <a href="https://doi.org/10.1126/science.aau8800" target="_blank" rel="noopener">doi:10.1126/science.aau8800</a></li><li>Cohen, K.M. et al. (2013, updated 2023). The ICS International Chronostratigraphic Chart. Episodes 36: 199-204. <a href="https://doi.org/10.18814/epiiugs/2013/v36i3/002" target="_blank" rel="noopener">doi:10.18814/epiiugs/2013/v36i3/002</a></li></ol></details></div></script><script type="text/x-tpl" id="le-ordovician-radiation-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Diorama of a Cincinnatian seafloor (Late Ordovician) (44702899525).jpg" data-cap="The Great Ordovician Biodiversification" data-big><figcaption></figcaption></figure><div class="sh-k">Paleozoic · Ordovician</div><h2 class="sh-t" id="le-ordovician-radiation-st" tabindex="-1">The Great Ordovician Biodiversification</h2><p class="sh-s">c. 485–445 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Strong evidence</span></span></div></div><p class="v4-q">Seas filled with reefs, shellfish and squid-like hunters, while the first tiny plants crept onto bare rock.</p><div class="lx-nums" data-from="lxs-le-ordovician-radiation"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-ordovician-radiation"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Plants were already growing on land by about 470 million years ago.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The evidence is spores, not whole plants, but they are distinctive: thick walls of the resistant polymer sporopollenin, often in fours (tetrads), with wall structure matching that of living liverworts. They appear in Argentina around 470 million years ago and soon afterwards in many regions, in sediments laid down near land. Molecular clocks agree that land plants existed by then, and some place their origin even earlier.</p></div></div></div><div class="twist"><b>Still open</b><p>Whether plants reached land earlier, in the Cambrian as some molecular clocks suggest, is unresolved because no fossils confirm it. What these first plants looked like is largely unknown. Also debated: whether cooling seas, rising oxygen, or even dust from an asteroid break-up about 466 million years ago helped drive the marine boom.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 408 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Great Ordovician Biodiversification"><button type="button" class="wtoc-i" data-go="le-ordovician-radiation-s1">The biggest boom you have never heard of</button><button type="button" class="wtoc-i" data-go="le-ordovician-radiation-s2">Reefs, hunters and drifting colonies</button><button type="button" class="wtoc-i" data-go="le-ordovician-radiation-s3">Green on bare rock</button><button type="button" class="wtoc-i" data-go="le-ordovician-radiation-s4">A warm age with a cold ending</button></nav></div><section class="wsec" id="le-ordovician-radiation-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The biggest boom you have never heard of</h3><p>The Cambrian explosion created the basic body plans of animals. The Ordovician filled them with variety. Over roughly 40 million years the number of marine families and genera multiplied several times over, a rise that later extinctions set back but never fully reversed. It happened in pulses: plankton first, then communities on the seafloor, then reefs. Researchers now call it the Great Ordovician Biodiversification Event, and it is the moment the sea began to look richly populated.</p><blockquote class="wpull"><p>The Cambrian drew the blueprints for animal life. The Ordovician built the neighbourhoods.</p></blockquote></section><section class="wsec" id="le-ordovician-radiation-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Reefs, hunters and drifting colonies</h3><p>Shallow tropical seas became crowded. Bryozoans, tiny colonial animals, built lacy frameworks; sponges and the first rugose and tabulate corals added reefs. Crinoids rose on stalks like underwater gardens. Nautiloids with straight, chambered shells hunted above them. Trilobites took on spines, big eyes and the ability to roll up. Near the coasts, jawless fish covered in bony plates sucked food from the mud, early members of the vertebrate line.</p><p>Why such a boom? Proposed drivers include cooling seas that let more animals thrive, more oxygen, more nutrients from weathered rock, continents scattered across many climate zones, and even a shower of dust after the break-up of an asteroid about 466 million years ago. Most researchers see several factors working together.</p></section><section class="wsec" id="le-ordovician-radiation-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Green on bare rock</h3><p>Until this age the continents were bare rock and sand, perhaps with microbial crusts. Then spores start appearing that could only belong to land plants. They were small and simple, living close to the ground in damp places, much like liverworts and mosses do today. Yet they began a revolution: roots and soils, forests and grasslands all descend from this modest start.</p><aside class="wcall"><b>How do we know?</b><p>Plants rarely fossilise whole, but their spores do. Land-plant spores are coated in sporopollenin, a polymer so tough it survives hundreds of millions of years, and they often stay stuck in groups of four. Palynologists dissolve rock in acid and count what remains under the microscope. Sea temperatures come from oxygen isotopes in conodont teeth, made of hard phosphate that preserves the water&#x27;s chemistry. Ages come from graptolite and conodont zones tied to radiometric dates.</p></aside></section><section class="wsec" id="le-ordovician-radiation-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>A warm age with a cold ending</h3><p>The Ordovician world was warm, with high seas and no big ice for most of its length. But the climate drifted colder. By the end, ice sheets were spreading over the southern supercontinent Gondwana, which then sat over the South Pole. That cooling set the stage for the first of the great mass extinctions, which would undo part of this boom.</p></section><details class="srcs"><summary>Sources for this entry (7)</summary><ol><li>Servais, T. &amp; Harper, D.A.T. (2018). The Great Ordovician Biodiversification Event (GOBE): definition, concept and duration. Lethaia 51: 151-164. <a href="https://doi.org/10.1111/let.12259" target="_blank" rel="noopener">doi:10.1111/let.12259</a></li><li>Rubinstein, C.V. et al. (2010). Early Middle Ordovician evidence for land plants in Argentina (eastern Gondwana). New Phytologist 188: 365-369. <a href="https://doi.org/10.1111/j.1469-8137.2010.03433.x" target="_blank" rel="noopener">doi:10.1111/j.1469-8137.2010.03433.x</a></li><li>Morris, J.L. et al. (2018). The timescale of early land plant evolution. PNAS 115: E2274-E2283. <a href="https://doi.org/10.1073/pnas.1719588115" target="_blank" rel="noopener">doi:10.1073/pnas.1719588115</a></li><li>Trotter, J.A. et al. (2008). Did cooling oceans trigger Ordovician biodiversification? Evidence from conodont thermometry. Science 321: 550-554. <a href="https://doi.org/10.1126/science.1155814" target="_blank" rel="noopener">doi:10.1126/science.1155814</a></li><li>Lenton, T.M. et al. (2012). First plants cooled the Ordovician. Nature Geoscience 5: 86-89. <a href="https://doi.org/10.1038/ngeo1390" target="_blank" rel="noopener">doi:10.1038/ngeo1390</a></li><li>Schmitz, B. et al. (2019). An extraterrestrial trigger for the mid-Ordovician ice age: dust from the breakup of the L-chondrite parent body. Science Advances 5: eaax4184. <a href="https://doi.org/10.1126/sciadv.aax4184" target="_blank" rel="noopener">doi:10.1126/sciadv.aax4184</a></li><li>Cohen, K.M. et al. (2013, updated 2023). The ICS International Chronostratigraphic Chart. Episodes 36: 199-204. <a href="https://doi.org/10.18814/epiiugs/2013/v36i3/002" target="_blank" rel="noopener">doi:10.18814/epiiugs/2013/v36i3/002</a></li></ol></details></div></script><script type="text/x-tpl" id="le-end-ordovician-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Diorama of a Cincinnatian seafloor (Late Ordovician) - crinoids, bryozoans, brachiopods, algae (31744487208).jpg" data-cap="The First Great Extinction" data-big><figcaption></figcaption></figure><div class="sh-k">Paleozoic · Late Ordovician (Hirnantian)</div><h2 class="sh-t" id="le-end-ordovician-st" tabindex="-1">The First Great Extinction</h2><p class="sh-s">c. 445–443 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Strong evidence</span></span></div></div><p class="v4-q">Ice spread over the South Pole, seas cooled and drained from the continents, and most species in the ocean vanished in two blows.</p><div class="lx-nums" data-from="lxs-le-end-ordovician"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-end-ordovician"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>An ice age caused the first great mass extinction.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The first and larger pulse coincides with the onset of the Hirnantian glaciation, recorded by glacial deposits in North Africa and South America, falling sea level and cooling measured in fossil shells. Models of how cooling and shrinking shelf habitat would affect marine animals reproduce much of the observed pattern (Saupe et al. 2020). But low oxygen, and possibly volcanism, clearly played roles, especially in the second pulse, so cooling was central but not the whole story.</p></div></div></div><div class="twist"><b>Still open</b><p>A minority view argues that volcanism, warming and ocean anoxia were the main killers rather than cooling (Bond &amp; Grasby 2020). Also debated: what triggered such a sudden glaciation in a greenhouse world, with land plants, falling carbon dioxide, volcanic weathering and asteroid dust all proposed; and how the exact percentage losses should be counted.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 367 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The First Great Extinction"><button type="button" class="wtoc-i" data-go="le-end-ordovician-s1">A cold shock in a warm world</button><button type="button" class="wtoc-i" data-go="le-end-ordovician-s2">Two blows</button><button type="button" class="wtoc-i" data-go="le-end-ordovician-s3">Weighing the causes</button><button type="button" class="wtoc-i" data-go="le-end-ordovician-s4">What it tells us</button></nav></div><section class="wsec" id="le-end-ordovician-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A cold shock in a warm world</h3><p>For most of the Ordovician the planet was warm and the seas were high and full of life. Then, around 445 million years ago, ice began to build over Gondwana, the great southern landmass that sat over the South Pole. The glaciation was short by geological standards, lasting perhaps one to two million years, but it was intense. Ice sheets spread across what is now the Sahara, and the ocean, with nowhere else for the water to go, dropped away from the continental shelves.</p><blockquote class="wpull"><p>The first great extinction was not a fire or an impact. It was a freeze in a world built for warmth.</p></blockquote></section><section class="wsec" id="le-end-ordovician-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Two blows</h3><p>The extinction came in two pulses. The first struck as the ice grew. Warm shallow seas that had supported reefs and rich seafloor communities cooled and drained, and species adapted to them had nowhere to go. Graptolites, conodonts and many trilobites suffered badly. In their place came the Hirnantia fauna, a set of cold-tolerant brachiopods that spread across the globe.</p><p>The second pulse struck as the ice melted. Sea level rose again, but the returning water was often low in oxygen, and black, organic-rich mud blanketed the seafloor. The cold-adapted survivors of the first pulse were now out of place in their turn. Two opposite shocks, close together, were more than many lineages could bear.</p></section><section class="wsec" id="le-end-ordovician-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Weighing the causes</h3><ul class="wlist"><li>Cooling and loss of shelf habitat: the leading explanation for the first pulse, supported by glacial deposits, sea-level records and shell chemistry.</li><li>Ocean anoxia: widely accepted as a factor, especially in the second pulse.</li><li>Volcanism and warming: argued by some as the main driver, based on mercury spikes and other chemical signals; still a minority view.</li><li>Triggers of the cooling itself: plant weathering, volcanic rock weathering and asteroid dust have all been proposed.</li></ul><aside class="wcall"><b>How do we know?</b><p>Glacial deposits (tillites), scratched bedrock and ice-carved valleys in North Africa show where the ice lay. Sea-level falls appear as erosion surfaces cut into shelf sediments. Temperatures come from oxygen isotopes and clumped isotopes in brachiopod shells. Extinction counts come from global fossil databases, sorted by time slices defined by graptolites and conodonts. Carbon isotope shifts in limestones track changes in the carbon cycle across the same interval.</p></aside></section><section class="wsec" id="le-end-ordovician-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>What it tells us</h3><p>Paleontologists usually count the end-Ordovician as the second largest of the Big Five extinctions by species lost, with about 85% of marine species gone in the classic estimate, though revised methods tend to lower such figures. Yet the ecosystems that followed looked broadly similar to those before. Many groups shrank but did not vanish, and the Silurian seas soon rebuilt reefs. The lesson is that speed of change matters, and that climate swings in either direction can be deadly.</p></section><details class="srcs"><summary>Sources for this entry (6)</summary><ol><li>Sheehan, P.M. (2001). The Late Ordovician mass extinction. Annual Review of Earth and Planetary Sciences 29: 331-364. <a href="https://doi.org/10.1146/annurev.earth.29.1.331" target="_blank" rel="noopener">doi:10.1146/annurev.earth.29.1.331</a></li><li>Harper, D.A.T., Hammarlund, E.U. &amp; Rasmussen, C.M.Ø. (2014). End Ordovician extinctions: a coincidence of causes. Gondwana Research 25: 1294-1307. <a href="https://doi.org/10.1016/j.gr.2012.12.021" target="_blank" rel="noopener">doi:10.1016/j.gr.2012.12.021</a></li><li>Finnegan, S. et al. (2011). The magnitude and duration of Late Ordovician-Early Silurian glaciation. Science 331: 903-906. <a href="https://doi.org/10.1126/science.1200803" target="_blank" rel="noopener">doi:10.1126/science.1200803</a></li><li>Saupe, E.E. et al. (2020). Extinction intensity during Ordovician and Cenozoic glaciations explained by cooling and palaeogeography. Nature Geoscience 13: 65-70. <a href="https://doi.org/10.1038/s41561-019-0504-6" target="_blank" rel="noopener">doi:10.1038/s41561-019-0504-6</a></li><li>Bond, D.P.G. &amp; Grasby, S.E. (2020). Late Ordovician mass extinction caused by volcanism, warming, and anoxia, not cooling and glaciation. Geology 48: 777-781. <a href="https://doi.org/10.1130/G47377.1" target="_blank" rel="noopener">doi:10.1130/G47377.1</a></li><li>Stanley, S.M. (2016). Estimates of the magnitudes of major marine mass extinctions in earth history. PNAS 113: E6325-E6334. <a href="https://doi.org/10.1073/pnas.1613094113" target="_blank" rel="noopener">doi:10.1073/pnas.1613094113</a></li></ol></details></div></script><script type="text/x-tpl" id="le-silurian-land-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Cooksonia pertoni.png" data-cap="Life Climbs onto Land" data-big><figcaption></figcaption></figure><div class="sh-k">Paleozoic · Silurian</div><h2 class="sh-t" id="le-silurian-land-st" tabindex="-1">Life Climbs onto Land</h2><p class="sh-s">c. 443–419 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Open question</span></span></div></div><p class="v4-q">Forests were still far off, but ankle-high plants and the first air-breathing animals began to colonise the shores.</p><div class="lx-nums" data-from="lxs-le-silurian-land"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-silurian-land"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Animals were already living on land more than 425 million years ago.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:41.7%" role="img" aria-label="Weight of evidence: Open question"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The key fossil, the millipede Pneumodesmus from Scotland, has spiracles, openings for breathing air, so it clearly lived on land. The problem is its age. It was first placed at about 428 million years; zircon dating in 2017 suggested about 414 million; a 2023 study argued again for about 430 million; and a 2025 review favours the latest Silurian to earliest Devonian. Older tracks hint that arthropods visited shores earlier, but visiting is not living there.</p></div></div></div><div class="twist"><b>Still open</b><p>Whether the Scottish millipede beds are mid-Silurian or close to the boundary between the Silurian and Devonian is still argued, and the answer moves the date of the first confirmed land animal by more than ten million years. Molecular clocks suggest millipedes and other land arthropods originated earlier than any fossil shows. When jawed fish first evolved is also being pushed back by new finds.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 418 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Life Climbs onto Land"><button type="button" class="wtoc-i" data-go="le-silurian-land-s1">The shore becomes a frontier</button><button type="button" class="wtoc-i" data-go="le-silurian-land-s2">Breathing air</button><button type="button" class="wtoc-i" data-go="le-silurian-land-s3">The jaw appears</button><button type="button" class="wtoc-i" data-go="le-silurian-land-s4">A greener, harder world</button></nav></div><section class="wsec" id="le-silurian-land-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The shore becomes a frontier</h3><p>Stand on a Silurian coast and you would see green only up close: a velvet of mosslike plants in wet hollows, and here and there a thin forked stem no taller than a matchstick. That was Cooksonia, one of the first plants to stand upright. Its stems ended in small round capsules that released spores to the wind. Some specimens contain a dark central strand interpreted as water-conducting tissue, the innovation that would later make trees possible.</p><blockquote class="wpull"><p>The first land plants were no taller than a matchstick. Every forest on Earth descends from that height.</p></blockquote></section><section class="wsec" id="le-silurian-land-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Breathing air</h3><p>Animals followed the plants. The best early example is Pneumodesmus newmani, a small millipede-like arthropod from Scotland whose body segments carry spiracles, holes that feed a network of breathing tubes. That system only works in air, so this animal lived on land. Its age, though, has become a scientific tug of war, with estimates ranging from about 430 to about 414 million years. Tracks in older rocks show arthropods crossing sand near water, but a creature that walks onto the beach is not necessarily a land animal.</p></section><section class="wsec" id="le-silurian-land-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The jaw appears</h3><p>In the sea, a quieter revolution changed vertebrates for ever. Until now, fish had no jaws; they filtered or sucked food. In 2022, researchers described teeth about 439 million years old and complete early jawed fish from Silurian rocks in Chongqing and Guizhou, China. These finds show that jawed vertebrates were diversifying far earlier than their scarce earlier fossils suggested. Jaws let fish bite and crush a new range of food, and they opened the way to every jawed animal that followed, including us.</p><aside class="wcall"><b>How do we know?</b><p>Early plants are identified by their spores and by fragments with preserved cell walls; water-conducting cells called tracheids have spiral or ringed thickenings visible under the microscope. Air-breathing is inferred from spiracles, which only make sense out of water. Ages come from spores, fish fossils and uranium-lead dating of zircon crystals, but zircons can be older than the rock that holds them, which is part of why the millipede&#x27;s age is disputed.</p></aside></section><section class="wsec" id="le-silurian-land-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>A greener, harder world</h3><p>By the end of the Silurian, land was no longer lifeless. Low plants lined the waterways, fungi and small arthropods lived among them, and thin soils were starting to form where roots and rot broke down rock. It was still a world without trees, flowers, insects or four-legged animals, and most of the interior was bare. But the basic partnership of plants, fungi and land animals was in place, and the Devonian would build the first forests on this foundation.</p></section><details class="srcs"><summary>Sources for this entry (7)</summary><ol><li>Andreev, P.S. et al. (2022). The oldest gnathostome teeth. Nature 609: 964-968. <a href="https://doi.org/10.1038/s41586-022-05166-2" target="_blank" rel="noopener">doi:10.1038/s41586-022-05166-2</a></li><li>Zhu, Y.-a. et al. (2022). The oldest complete jawed vertebrates from the early Silurian of China. Nature 609: 954-958. <a href="https://doi.org/10.1038/s41586-022-05136-8" target="_blank" rel="noopener">doi:10.1038/s41586-022-05136-8</a></li><li>Edwards, D., Davies, K.L. &amp; Axe, L. (1992). A vascular conducting strand in the early land plant Cooksonia. Nature 357: 683-685. <a href="https://doi.org/10.1038/357683a0" target="_blank" rel="noopener">doi:10.1038/357683a0</a></li><li>Wilson, H.M. &amp; Anderson, L.I. (2004). Morphology and taxonomy of Paleozoic millipedes (Diplopoda: Chilognatha: Archipolypoda) from Scotland. Journal of Paleontology 78: 169-184.</li><li>Suarez, S.E. et al. (2017). A U-Pb zircon age constraint on the oldest-recorded air-breathing land animal. PLOS ONE 12: e0179262. <a href="https://doi.org/10.1371/journal.pone.0179262" target="_blank" rel="noopener">doi:10.1371/journal.pone.0179262</a></li><li>Brookfield, M.E., Catlos, E.J. &amp; Garza, H.K. (2025). Reconciling divergent ages for the oldest recorded air-breathing land animal, the millipede Pneumodesmus newmani Wilson &amp; Anderson, 2004. Fossil Studies 3(2): 6. <a href="https://doi.org/10.3390/fossils3020006" target="_blank" rel="noopener">doi:10.3390/fossils3020006</a></li><li>Zhu, M. et al. (2013). A Silurian placoderm with osteichthyan-like marginal jaw bones. Nature 502: 188-193. <a href="https://doi.org/10.1038/nature12617" target="_blank" rel="noopener">doi:10.1038/nature12617</a></li></ol></details></div></script><script type="text/x-tpl" id="le-devonian-forests-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Eospermatopteris textilis fossil tree trunk (Ithaca Formation, Upper Devonian; Riverside Quarry, Gilboa, Schoharie County, New York State, USA) (15523316876).jpg" data-cap="The First Forests" data-big><figcaption></figcaption></figure><div class="sh-k">Paleozoic · Devonian</div><h2 class="sh-t" id="le-devonian-forests-st" tabindex="-1">The First Forests</h2><p class="sh-s">c. 419–359 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Plausible</span></span></div></div><p class="v4-q">Plants grew into trees, roots cracked rock into soil, and the air began to change as the first forests spread.</p><div class="lx-nums" data-from="lxs-le-devonian-forests"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-devonian-forests"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The spread of the first forests pulled carbon dioxide out of the air and helped push Earth toward an ice age.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The timing fits: carbon dioxide proxies fall across the Devonian and into the Carboniferous as forests with deep roots spread, and glaciation followed. Fossil soils show deeper rooting and stronger chemical weathering, and models of the carbon cycle reproduce a large drawdown when forests are added. But tectonics also changed, and some modelling (Goddéris et al. 2017) attributes most of the cooling to mountain building and rock weathering rather than to plants, so the size of the forest effect is uncertain.</p></div></div></div><div class="twist"><b>Still open</b><p>How much carbon dioxide fell, and how fast, depends on proxies with large uncertainties. Researchers still argue about whether plants or tectonics did most of the work, and about how forest expansion connects to the ocean anoxia and extinctions of the Late Devonian. The oldest forests keep getting older as new sites are found, most recently in England in 2024.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 348 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The First Forests"><button type="button" class="wtoc-i" data-go="le-devonian-forests-s1">From ankle height to trees</button><button type="button" class="wtoc-i" data-go="le-devonian-forests-s2">Archaeopteris and the modern tree</button><button type="button" class="wtoc-i" data-go="le-devonian-forests-s3">How forests changed the planet</button><button type="button" class="wtoc-i" data-go="le-devonian-forests-s4">The Age of Fishes</button></nav></div><section class="wsec" id="le-devonian-forests-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>From ankle height to trees</h3><p>At the start of the Devonian the tallest plants on land reached perhaps knee height. Sixty million years later there were forests. The race upward was driven by competition for light, and it needed new engineering: strong, water-conducting wood, leaves to catch light, and roots to anchor tall trunks and find water. Different plant groups solved the problem in different ways, and the earliest forests looked strange to modern eyes.</p><p>Wattieza, known from the famous stumps of Gilboa in New York State, was a cladoxylopsid about 8 metres tall, with no leaves in the modern sense and a crown of branching twigs like a palm or a feather duster. In 2024 researchers described fossil trees of a related kind, Calamophyton, from about 390 million years ago in the Hangman Sandstone of southwest England, now the oldest known fossil forest.</p><blockquote class="wpull"><p>The first forests did not only grow on the land. They remade the land, the rivers and the air.</p></blockquote></section><section class="wsec" id="le-devonian-forests-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Archaeopteris and the modern tree</h3><p>The real revolution was Archaeopteris. It had wood much like a conifer, flat leaves and a deep, branching root system. At Cairo, New York, fossil root systems about 386 million years old show extensive, branching roots radiating from their trunks, far more complex than those of earlier plants. Archaeopteris forests spread widely in the Late Devonian, shading the ground, dropping leaf litter into streams and building soils.</p></section><section class="wsec" id="le-devonian-forests-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>How forests changed the planet</h3><ul class="wlist"><li>Soils: roots and fungi broke rock into thicker, richer soils.</li><li>Rivers: vegetated banks helped rivers settle into single, meandering channels.</li><li>Air: faster weathering of rock drew carbon dioxide out of the atmosphere.</li><li>Seas: more nutrients washed into the oceans, possibly feeding algal blooms and low-oxygen zones.</li></ul><aside class="wcall"><b>How do we know?</b><p>Fossil stumps and root traces preserved in place show where trees stood and how deep their roots went. Fossil soils (paleosols) show changes in chemistry and depth. Past carbon dioxide is estimated from the chemistry of soil carbonates, the density of pores (stomata) on fossil leaves and carbon isotopes in organic matter, each with its own uncertainties. Fossil charcoal shows fires, which need oxygen above roughly 15%.</p></aside></section><section class="wsec" id="le-devonian-forests-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The Age of Fishes</h3><p>While trees rose on land, the waters teemed with fish. Placoderms with armoured heads, early sharks and lobe-finned fish with bony, fleshy fins shared the seas and rivers. Some of the lobe-finned fish, living in the shallow, leaf-choked waters beside these new forests, would soon begin the move onto land. Our own ancestors were among them.</p></section><details class="srcs"><summary>Sources for this entry (6)</summary><ol><li>Stein, W.E. et al. (2007). Giant cladoxylopsid trees resolve the enigma of the Earth&#x27;s earliest forest stumps at Gilboa. Nature 446: 904-907. <a href="https://doi.org/10.1038/nature05705" target="_blank" rel="noopener">doi:10.1038/nature05705</a></li><li>Stein, W.E. et al. (2020). Mid-Devonian Archaeopteris roots signal revolutionary change in earliest fossil forests. Current Biology 30: 421-431. <a href="https://doi.org/10.1016/j.cub.2019.11.067" target="_blank" rel="noopener">doi:10.1016/j.cub.2019.11.067</a></li><li>Davies, N.S. et al. (2024). Earth&#x27;s earliest forest: fossilized trees and vegetation-induced sedimentary structures from the Middle Devonian (Eifelian) Hangman Sandstone Formation, Somerset and Devon, SW England. Journal of the Geological Society 181(4): jgs2023-204. <a href="https://doi.org/10.1144/jgs2023-204" target="_blank" rel="noopener">doi:10.1144/jgs2023-204</a></li><li>Algeo, T.J. &amp; Scheckler, S.E. (1998). Terrestrial-marine teleconnections in the Devonian: links between the evolution of land plants, weathering processes, and marine anoxic events. Philosophical Transactions of the Royal Society B 353: 113-130. <a href="https://doi.org/10.1098/rstb.1998.0195" target="_blank" rel="noopener">doi:10.1098/rstb.1998.0195</a></li><li>Foster, G.L., Royer, D.L. &amp; Lunt, D.J. (2017). Future climate forcing potentially without precedent in the last 420 million years. Nature Communications 8: 14845. <a href="https://doi.org/10.1038/ncomms14845" target="_blank" rel="noopener">doi:10.1038/ncomms14845</a></li><li>Goddéris, Y. et al. (2017). Onset and ending of the late Palaeozoic ice age triggered by tectonically paced rock weathering. Nature Geoscience 10: 382-386. <a href="https://doi.org/10.1038/ngeo2931" target="_blank" rel="noopener">doi:10.1038/ngeo2931</a></li></ol></details></div></script><script type="text/x-tpl" id="le-tetrapods-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Tiktaalik roseae life restor.jpg" data-cap="Fish Walk Ashore" data-big><figcaption></figcaption></figure><div class="sh-k">Paleozoic · Middle to Late Devonian</div><h2 class="sh-t" id="le-tetrapods-st" tabindex="-1">Fish Walk Ashore</h2><p class="sh-s">c. 395–360 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Plausible</span></span></div></div><p class="v4-q">In weedy shallows beside the first forests, fish grew necks, wrists and fingers, and the ancestors of all land vertebrates took their first steps.</p><div class="lx-nums" data-from="lxs-le-tetrapods"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-tetrapods"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Four-limbed animals were walking about 395 million years ago, some 20 million years before Tiktaalik lived.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The Zachełmie trackways from Poland show footprints with digit impressions in paired, alternating patterns, in rocks dated by fossils to about 395 million years. Many specialists accept them as tetrapod tracks, which would make Tiktaalik a late survivor of an older lineage rather than a direct ancestor. But no bones accompany the tracks, and some researchers have questioned whether all of them were made by limbed animals.</p></div></div></div><div class="twist"><b>Still open</b><p>Who made the Zachełmie tracks, and in what setting, is still discussed. A 2025 study of 355-million-year-old footprints from Australia argued that the main branches of land vertebrates had already split in the Devonian, compressing the timeline even further. Why the transition happened, whether for escaping predators, finding food or surviving low-oxygen water, is still debated.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 400 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Fish Walk Ashore"><button type="button" class="wtoc-i" data-go="le-tetrapods-s1">A fish with a neck</button><button type="button" class="wtoc-i" data-go="le-tetrapods-s2">Limbs before land</button><button type="button" class="wtoc-i" data-go="le-tetrapods-s3">The footprints that came too early</button><button type="button" class="wtoc-i" data-go="le-tetrapods-s4">Your inner fish</button></nav></div><section class="wsec" id="le-tetrapods-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A fish with a neck</h3><p>In 2004, a team led by Neil Shubin, Ted Daeschler and Farish Jenkins found what they were looking for in Arctic Canada. They had searched rocks of the right age and the right setting, ancient river deltas about 375 million years old, for a creature halfway between fish and land animal. Tiktaalik roseae had scales and fins, but also a flattened head, a neck that could turn, strong ribs and fins with bones corresponding to a shoulder, elbow and wrist. It could probably prop itself up in shallow water and raise its head to breathe.</p><blockquote class="wpull"><p>Tiktaalik was found by prediction: the team knew roughly the age and kind of rock where such a creature should be.</p></blockquote></section><section class="wsec" id="le-tetrapods-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Limbs before land</h3><p>Surprisingly, the first limbs did not evolve for walking on land. Acanthostega from East Greenland, about 365 million years old, had eight fingers per hand, internal gills and limbs better suited to pushing through water weeds than walking. Its relative Ichthyostega, with seven toes on the hind foot, was sturdier and may have hauled itself across mudflats. Limbs with digits seem to have evolved in water first, and were later co-opted for life on land.</p></section><section class="wsec" id="le-tetrapods-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The footprints that came too early</h3><p>In 2010 a team working in a quarry at Zachełmie, Poland, reported trackways about 395 million years old with digit impressions. If they were made by limbed animals, walking tetrapods existed some 20 million years before Tiktaalik, and the transition began earlier than the fossils of bodies suggest. In 2025 footprints about 355 million years old from Victoria, Australia, with clawed toes, were interpreted as made by an early relative of reptiles, again suggesting the family tree branched earlier than the bones show.</p><aside class="wcall"><b>How do we know?</b><p>Transitional fossils are compared bone by bone with living fish and land animals, and family trees are built from shared features. CT scans reveal fin and limb bones still inside the rock. Trackways are measured for stride, digit marks and body drag, then compared with tracks made by living animals. Ages come from spores and fish fossils in the surrounding rock, tied to radiometric dates.</p></aside></section><section class="wsec" id="le-tetrapods-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Your inner fish</h3><p>Every land vertebrate, from frogs to birds to humans, shares the limb pattern first seen in these Devonian animals: one bone, two bones, many small bones, digits. The five-fingered hand became standard only later, after early experiments with more. When you bend your wrist or turn your head, you are using hardware that was first tested in a shallow Devonian stream.</p></section><details class="srcs"><summary>Sources for this entry (6)</summary><ol><li>Niedźwiedzki, G. et al. (2010). Tetrapod trackways from the early Middle Devonian period of Poland. Nature 463: 43-48. <a href="https://doi.org/10.1038/nature08623" target="_blank" rel="noopener">doi:10.1038/nature08623</a></li><li>Daeschler, E.B., Shubin, N.H. &amp; Jenkins, F.A. (2006). A Devonian tetrapod-like fish and the evolution of the tetrapod body plan. Nature 440: 757-763. <a href="https://doi.org/10.1038/nature04639" target="_blank" rel="noopener">doi:10.1038/nature04639</a></li><li>Shubin, N.H., Daeschler, E.B. &amp; Jenkins, F.A. (2006). The pectoral fin of Tiktaalik roseae and the origin of the tetrapod limb. Nature 440: 764-771. <a href="https://doi.org/10.1038/nature04637" target="_blank" rel="noopener">doi:10.1038/nature04637</a></li><li>Coates, M.I. &amp; Clack, J.A. (1990). Polydactyly in the earliest known tetrapod limbs. Nature 347: 66-69. <a href="https://doi.org/10.1038/347066a0" target="_blank" rel="noopener">doi:10.1038/347066a0</a></li><li>Ahlberg, P.E., Clack, J.A. &amp; Blom, H. (2005). The axial skeleton of the Devonian tetrapod Ichthyostega. Nature 437: 137-140. <a href="https://doi.org/10.1038/nature03893" target="_blank" rel="noopener">doi:10.1038/nature03893</a></li><li>Long, J.A. et al. (2025). Earliest amniote tracks recalibrate the timeline of tetrapod evolution. Nature 641: 1193-1200. <a href="https://doi.org/10.1038/s41586-025-08884-5" target="_blank" rel="noopener">doi:10.1038/s41586-025-08884-5</a></li></ol></details></div></script><script type="text/x-tpl" id="le-late-devonian-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Dunkleosteus terrelli (fossil fish) (Cleveland Shale Member, Ohio Shale, Upper Devonian; Rocky River Valley, Cleveland, Ohio, USA) 3 (34091327576).jpg" data-cap="The Late Devonian Crises" data-big><figcaption></figcaption></figure><div class="sh-k">Paleozoic · Late Devonian (Frasnian to Famennian, end-Devonian)</div><h2 class="sh-t" id="le-late-devonian-st" tabindex="-1">The Late Devonian Crises</h2><p class="sh-s">c. 372 and 359 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Open question</span></span></div></div><p class="v4-q">Two waves of extinction, thirteen million years apart, destroyed the greatest reefs of the age and reset the story of backboned animals.</p><div class="lx-nums" data-from="lxs-le-late-devonian"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-late-devonian"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The spread of the first forests poisoned the seas and triggered the Late Devonian extinctions.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:41.7%" role="img" aria-label="Weight of evidence: Open question"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The idea fits the timing: forests with deep roots expanded, releasing nutrients that could have fed algal blooms and oxygen-poor water, and black shales mark anoxia at both crises (Algeo &amp; Scheckler 1998). Some geochemical records support pulses of nutrient release from land. But volcanism, including the Viluy traps of Siberia dated close to the Kellwasser event, cooling and glaciation, and even ultraviolet damage are strong competitors, so no single cause is agreed.</p></div></div></div><div class="twist"><b>Still open</b><p>Were the two crises driven by the same cause or different ones? Was the Late Devonian loss due more to a collapse in the birth of new species than to extra extinction, as Stigall (2010) argued? A 2020 suggestion that a nearby supernova played a role awaits evidence such as specific radioactive isotopes in the rocks.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 353 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Late Devonian Crises"><button type="button" class="wtoc-i" data-go="le-late-devonian-s1">The age of great reefs ends</button><button type="button" class="wtoc-i" data-go="le-late-devonian-s2">Suspects</button><button type="button" class="wtoc-i" data-go="le-late-devonian-s3">A bottleneck for backbones</button><button type="button" class="wtoc-i" data-go="le-late-devonian-s4">What it tells us</button></nav></div><section class="wsec" id="le-late-devonian-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The age of great reefs ends</h3><p>By the Middle Devonian, reefs built by stromatoporoid sponges and corals stretched along tropical coasts across much of the world. They were among the largest reef systems in Earth&#x27;s history. Then, about 372 million years ago, at the boundary between the Frasnian and Famennian ages, they collapsed. The warm, shallow seas that had held the greatest diversity lost the most. Thirteen million years later, at the very end of the Devonian, a second crisis struck, and the armoured placoderms, which had dominated the seas, disappeared entirely.</p><blockquote class="wpull"><p>The Late Devonian was not one catastrophe but a long, unstable stretch with two severe blows.</p></blockquote></section><section class="wsec" id="le-late-devonian-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Suspects</h3><p>Unlike the asteroid that ended the dinosaurs, there is no single clear culprit. Several candidates are supported by some evidence, and they may have worked together.</p><ul class="wlist"><li>Forests and nutrient runoff: new trees and soils released nutrients, possibly fuelling algal blooms and oxygen loss in shallow seas.</li><li>Anoxia: black shales at both crises show that seafloors lost oxygen over wide areas.</li><li>Volcanism: the Viluy traps in Siberia have been dated close to the Kellwasser event.</li><li>Cooling and glaciation: especially at the Hangenberg event, when ice grew in Gondwana.</li><li>Ultraviolet damage: malformed spores at the end of the Devonian suggest ozone loss, perhaps linked to warming or other causes.</li></ul><aside class="wcall"><b>How do we know?</b><p>Extinctions are counted from fossil ranges in thousands of rock sections, calibrated by conodont zones. Black shale layers and trace metals such as molybdenum and uranium record low oxygen. Carbon and oxygen isotopes track the carbon cycle and temperature. Volcanic episodes are dated with argon-argon and uranium-lead methods. Mercury spikes can mark big eruptions. Fossil spores are checked for malformations that may indicate environmental stress.</p></aside></section><section class="wsec" id="le-late-devonian-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>A bottleneck for backbones</h3><p>The Hangenberg event reshaped vertebrate life. Placoderms vanished, many lobe-finned fish lineages were lost, and ray-finned fish and sharks became more dominant afterwards. Early tetrapods became rare in the fossil record for millions of years, a stretch known as Romer&#x27;s Gap. Sallan and Coates (2010) argued that this was a bottleneck: the handful of survivors became the ancestors of all later jawed vertebrates. A crisis that erased most of the Age of Fishes also shaped the family tree that led, much later, to us.</p></section><section class="wsec" id="le-late-devonian-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>What it tells us</h3><p>The Late Devonian is a warning about slow-burning crises. Unlike a single impact, it unfolded over millions of years of unstable climate, oxygen-starved seas and ecosystems that could not rebuild. Reefs, which today shelter a large share of all marine species, proved especially fragile then, as they are now. The comparison is loose, since the causes and scales differ, but the pattern of warm, shallow, nutrient-rich waters losing oxygen is one that oceanographers watch closely today.</p></section><details class="srcs"><summary>Sources for this entry (8)</summary><ol><li>McGhee, G.R. (1996). The Late Devonian Mass Extinction: The Frasnian/Famennian Crisis. Columbia University Press.</li><li>Kaiser, S.I., Aretz, M. &amp; Becker, R.T. (2016). The global Hangenberg Crisis (Devonian-Carboniferous transition): review of a first-order mass extinction. Geological Society, London, Special Publications 423: 387-437. <a href="https://doi.org/10.1144/SP423.9" target="_blank" rel="noopener">doi:10.1144/SP423.9</a></li><li>Algeo, T.J. &amp; Scheckler, S.E. (1998). Terrestrial-marine teleconnections in the Devonian: links between the evolution of land plants, weathering processes, and marine anoxic events. Philosophical Transactions of the Royal Society B 353: 113-130. <a href="https://doi.org/10.1098/rstb.1998.0195" target="_blank" rel="noopener">doi:10.1098/rstb.1998.0195</a></li><li>Sallan, L.C. &amp; Coates, M.I. (2010). End-Devonian extinction and a bottleneck in the early evolution of modern jawed vertebrates. PNAS 107: 10131-10135. <a href="https://doi.org/10.1073/pnas.0914000107" target="_blank" rel="noopener">doi:10.1073/pnas.0914000107</a></li><li>Racki, G. (2020). A volcanic scenario for the Frasnian-Famennian major biotic crisis and other Late Devonian global changes: more answers than questions? Global and Planetary Change 189: 103174. <a href="https://doi.org/10.1016/j.gloplacha.2020.103174" target="_blank" rel="noopener">doi:10.1016/j.gloplacha.2020.103174</a></li><li>Marshall, J.E.A. et al. (2020). UV-B radiation was the Devonian-Carboniferous boundary terrestrial extinction kill mechanism. Science Advances 6: eaba0768. <a href="https://doi.org/10.1126/sciadv.aba0768" target="_blank" rel="noopener">doi:10.1126/sciadv.aba0768</a></li><li>Fields, B.D. et al. (2020). Supernova triggers for end-Devonian extinctions. PNAS 117: 21008-21010. <a href="https://doi.org/10.1073/pnas.2013774117" target="_blank" rel="noopener">doi:10.1073/pnas.2013774117</a></li><li>Stigall, A.L. (2010). Invasive species and biodiversity crises: testing the link in the Late Devonian. PLOS ONE 5: e15584. <a href="https://doi.org/10.1371/journal.pone.0015584" target="_blank" rel="noopener">doi:10.1371/journal.pone.0015584</a></li></ol></details></div></script><script type="text/x-tpl" id="le-carboniferous-coal-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Meganeura monyi au Museum de Toulouse.jpg" data-cap="The Coal Forests" data-big><figcaption></figcaption></figure><div class="sh-k">Paleozoic · Carboniferous</div><h2 class="sh-t" id="le-carboniferous-coal-st" tabindex="-1">The Coal Forests</h2><p class="sh-s">c. 359–299 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Plausible</span></span></div></div><p class="v4-q">Steaming swamp forests buried so much carbon that they changed the air, fed giant insects, and later powered the Industrial Revolution.</p><div class="lx-nums" data-from="lxs-le-carboniferous-coal"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-carboniferous-coal"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Oxygen once reached about 35% and made giant insects possible.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Several models and fossil charcoal agree that oxygen peaked well above today&#x27;s level, although estimates for the peak range from about 25% to 35%. Insects breathe through tubes whose efficiency limits body size, and the maximum size of fossil insects tracks estimated oxygen over much of their history (Clapham &amp; Karr 2012). But giant griffinflies persisted into the Permian as oxygen fell, and the lack of flying vertebrate predators may matter as much, so oxygen was likely an enabling factor, not the sole cause.</p></div></div></div><div class="twist"><b>Still open</b><p>The exact peak of oxygen remains uncertain. Why so much coal formed in this period is debated: the idea that fungi able to rot lignin had not yet evolved was challenged in 2016 by researchers who pointed instead to the wet tropical climate and to sinking basins formed as Pangaea assembled. Some coal-forming lycopsids had little lignin at all.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 451 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Coal Forests"><button type="button" class="wtoc-i" data-go="le-carboniferous-coal-s1">A swamp that became a fuel</button><button type="button" class="wtoc-i" data-go="le-carboniferous-coal-s2">Giants in a rich atmosphere</button><button type="button" class="wtoc-i" data-go="le-carboniferous-coal-s3">Why so much coal?</button><button type="button" class="wtoc-i" data-go="le-carboniferous-coal-s4">The long loan comes due</button></nav></div><section class="wsec" id="le-carboniferous-coal-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A swamp that became a fuel</h3><p>Walk into a Carboniferous coal swamp and you would be surrounded by trunks like giant green columns, covered in diamond-shaped leaf scars. These were lycopsids, cousins of the small club mosses that still grow on forest floors. Their roots spread through waterlogged peat, and when they fell they sank into stagnant water with little oxygen, where decay was slow. Over millions of years the peat was buried, compressed and heated into coal. The seams mined in Britain, Germany, Poland and the Appalachians are the remains of these forests.</p><blockquote class="wpull"><p>Every tonne of coal is a piece of ancient sunlight, stored by a swamp forest more than 300 million years ago.</p></blockquote></section><section class="wsec" id="le-carboniferous-coal-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Giants in a rich atmosphere</h3><p>The Carboniferous is famous for its giants: griffinflies with wingspans around 65 to 70 cm, Arthropleura up to about 2.6 metres long, and scorpions and spider relatives larger than their modern cousins. A popular explanation is oxygen. Insects breathe through a network of tubes (tracheae), and oxygen diffuses along them; in richer air, bigger bodies would still get enough. Experiments with living insects and the fossil record of insect size both give some support. Yet the story is more complex. Arthropleura was not an insect, and giant insects outlasted the oxygen peak, and the arrival of flying predators, first pterosaurs and then birds, may have limited insect size later.</p></section><section class="wsec" id="le-carboniferous-coal-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Why so much coal?</h3><p>In 2012 a study of fungal genomes suggested that white-rot fungi, which can break down lignin, the tough polymer in wood, evolved near the end of the Carboniferous. This supported an older idea: that wood piled up because nothing could rot it. In 2016, Nelsen and colleagues challenged this. They noted that lignin-degrading organisms were probably present earlier, that the main coal-forming lycopsids were low in lignin, and that coal formation fits a combination of an ever-wet equatorial climate and deep, sinking basins at the edges of growing mountains.</p><aside class="wcall"><b>How do we know?</b><p>Past oxygen is estimated from carbon and sulphur isotope models such as GEOCARBSULF and COPSE, and from the proportion of fossil charcoal (inertinite) in coal, since fires need oxygen above about 15% and become frequent at higher levels. Plant fossils in coal balls, mineralised lumps of peat, preserve cell-level anatomy. Insect wingspans are measured from fossil wings, and the age of fungal enzymes is estimated with molecular clocks.</p></aside></section><section class="wsec" id="le-carboniferous-coal-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The long loan comes due</h3><p>For most of human history, the Carboniferous was buried and silent. Then, from the eighteenth century, miners in Britain and later in Europe and North America dug into the Coal Measures, and steam engines, iron works and railways ran on them. In about two and a half centuries, people have burned coal that the swamps took millions of years to store. The chemistry is simple: carbon that left the air as peat returns as carbon dioxide.</p></section><details class="srcs"><summary>Sources for this entry (9)</summary><ol><li>Berner, R.A. (2006). GEOCARBSULF: a combined model for Phanerozoic atmospheric O2 and CO2. Geochimica et Cosmochimica Acta 70: 5653-5664. <a href="https://doi.org/10.1016/j.gca.2005.11.032" target="_blank" rel="noopener">doi:10.1016/j.gca.2005.11.032</a></li><li>Krause, A.J. et al. (2018). Stepwise oxygenation of the Paleozoic atmosphere. Nature Communications 9: 4081. <a href="https://doi.org/10.1038/s41467-018-06383-y" target="_blank" rel="noopener">doi:10.1038/s41467-018-06383-y</a></li><li>Glasspool, I.J. &amp; Scott, A.C. (2010). Phanerozoic concentrations of atmospheric oxygen reconstructed from sedimentary charcoal. Nature Geoscience 3: 627-630. <a href="https://doi.org/10.1038/ngeo923" target="_blank" rel="noopener">doi:10.1038/ngeo923</a></li><li>Clapham, M.E. &amp; Karr, J.A. (2012). Environmental and biotic controls on the evolutionary history of insect body size. PNAS 109: 10927-10930. <a href="https://doi.org/10.1073/pnas.1204026109" target="_blank" rel="noopener">doi:10.1073/pnas.1204026109</a></li><li>Harrison, J.F., Kaiser, A. &amp; VandenBrooks, J.M. (2010). Atmospheric oxygen level and the evolution of insect body size. Proceedings of the Royal Society B 277: 1937-1946. <a href="https://doi.org/10.1098/rspb.2010.0001" target="_blank" rel="noopener">doi:10.1098/rspb.2010.0001</a></li><li>Floudas, D. et al. (2012). The Paleozoic origin of enzymatic lignin decomposition reconstructed from 31 fungal genomes. Science 336: 1715-1719. <a href="https://doi.org/10.1126/science.1221748" target="_blank" rel="noopener">doi:10.1126/science.1221748</a></li><li>Nelsen, M.P. et al. (2016). Delayed fungal evolution did not cause the Paleozoic peak in coal production. PNAS 113: 2442-2447. <a href="https://doi.org/10.1073/pnas.1517943113" target="_blank" rel="noopener">doi:10.1073/pnas.1517943113</a></li><li>Davies, N.S. et al. (2022). The largest arthropod in Earth history: insights from newly discovered Arthropleura remains (Serpukhovian Stainmore Formation, Northumberland, England). Journal of the Geological Society 179: jgs2021-115. <a href="https://doi.org/10.1144/jgs2021-115" target="_blank" rel="noopener">doi:10.1144/jgs2021-115</a></li><li>Conybeare, W.D. &amp; Phillips, W. (1822). Outlines of the Geology of England and Wales. London: William Phillips.</li></ol></details></div></script><script type="text/x-tpl" id="le-late-paleozoic-ice-age-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="The World of the Carboniferous-Permian boundary.svg" data-cap="The Late Paleozoic Ice Age" data-big><figcaption></figcaption></figure><div class="sh-k">Paleozoic · Mississippian to early Permian</div><h2 class="sh-t" id="le-late-paleozoic-ice-age-st" tabindex="-1">The Late Paleozoic Ice Age</h2><p class="sh-s">c. 340–285 million years ago (main glacial phase)</p><div class="sh-v"><span class="vstamp vstamp--on vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Mixed record</span></span></div></div><p class="v4-q">Ice sheets came and went over the southern continents for tens of millions of years, and the tropical coal forests broke apart.</p><div class="lx-nums" data-from="lxs-le-late-paleozoic-ice-age"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-late-paleozoic-ice-age"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The collapse of the coal rainforests about 305 million years ago was a mass extinction on land.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:50.0%" role="img" aria-label="Weight of evidence: Mixed record"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Plant fossils show a major turnover: lycopsid-dominated swamps gave way to tree ferns and drier-adapted plants across Euramerica, and tetrapod diversity dropped afterwards (Sahney et al. 2010; Dunne et al. 2018). But many plant groups survived, the change was spread over time and space, and the record comes mostly from Europe and North America, so it looks more like a regional ecological reorganisation than a global mass extinction.</p></div></div></div><div class="twist"><b>Still open</b><p>What ended the ice age and what drove its pulses are debated, with carbon dioxide from volcanoes, changes in weathering as Pangaea&#x27;s mountains eroded, and the decline of coal-forming swamps all proposed. Researchers also argue over how widespread and how abrupt the rainforest collapse was, and whether it drove the rise of reptiles and our mammal-line ancestors.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 408 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Late Paleozoic Ice Age"><button type="button" class="wtoc-i" data-go="le-late-paleozoic-ice-age-s1">An ice age with forests</button><button type="button" class="wtoc-i" data-go="le-late-paleozoic-ice-age-s2">Written in stripes</button><button type="button" class="wtoc-i" data-go="le-late-paleozoic-ice-age-s3">When the rainforest broke</button><button type="button" class="wtoc-i" data-go="le-late-paleozoic-ice-age-s4">Why it matters now</button></nav></div><section class="wsec" id="le-late-paleozoic-ice-age-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>An ice age with forests</h3><p>About 340 million years ago, ice began to spread across the southern part of the supercontinent that was assembling into Pangaea. Unlike earlier brief glaciations, this one lasted tens of millions of years. It was not one giant ice sheet but a shifting set of ice centres that grew and melted in cycles, driven in part by wobbles in Earth&#x27;s orbit, much like the ice ages of the last 2.6 million years. It is the longest earlier ice age to play out on a planet with extensive forests.</p><blockquote class="wpull"><p>For tens of millions of years Earth breathed in and out: ice grew, seas fell, forests shifted, and then it all reversed.</p></blockquote></section><section class="wsec" id="le-late-paleozoic-ice-age-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Written in stripes</h3><p>In the tropics, the ice ages left a signature. As ice sheets grew, sea level dropped and coastal swamps spread over exposed land, building peat. As ice melted, the sea returned and buried the swamps under marine mud and limestone. The result is the cyclothem, a repeating stack of layers seen in coalfields from Kansas to the Ruhr. Each coal seam records a glacial phase; each limestone records a return of the sea.</p><aside class="wcall"><b>How do we know?</b><p>Glacial tillites, striated pavements and dropstones (pebbles that fell from floating ice into sea mud) map where ice lay. Uranium-lead dates on volcanic ash tie glacial pulses to a timeline. Oxygen isotopes in brachiopod shells track ice volume and temperature. Carbon dioxide is estimated from fossil soil carbonates and leaf pores. Plant fossils and pollen show the shift from lycopsid swamps to drier forests, and tetrapod fossils are compiled into databases to track diversity.</p></aside></section><section class="wsec" id="le-late-paleozoic-ice-age-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>When the rainforest broke</h3><p>Around 307 million years ago, the equatorial coal forests broke into isolated patches as the climate dried and became more seasonal. Sahney, Benton and Falcon-Lang (2010) argued that this fragmentation triggered a shake-up among land animals. A later analysis by Dunne and colleagues (2018) found that tetrapod diversity dropped and the survivors spread more widely. Amphibians, tied to water for breeding, suffered; amniotes with shelled eggs spread. The event helped set the stage for the reptiles and synapsids of the Permian.</p></section><section class="wsec" id="le-late-paleozoic-ice-age-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Why it matters now</h3><p>This ice age is the best natural experiment we have for a world like ours, with ice, forests and a carbon cycle run partly by living things. It shows that glacial cycles, sea-level swings and ecosystems are tightly linked, and that warming out of an ice age can reshape tropical forests. The analogy is imperfect, but researchers use it to test how climate and life respond to changing carbon dioxide.</p></section><details class="srcs"><summary>Sources for this entry (6)</summary><ol><li>Montañez, I.P. &amp; Poulsen, C.J. (2013). The Late Paleozoic Ice Age: an evolving paradigm. Annual Review of Earth and Planetary Sciences 41: 629-656.</li><li>Montañez, I.P. et al. (2016). Climate, pCO2 and terrestrial carbon cycle linkages during late Palaeozoic glacial-interglacial cycles. Nature Geoscience 9: 824-828. <a href="https://doi.org/10.1038/ngeo2822" target="_blank" rel="noopener">doi:10.1038/ngeo2822</a></li><li>Sahney, S., Benton, M.J. &amp; Falcon-Lang, H.J. (2010). Rainforest collapse triggered Carboniferous tetrapod diversification in Euramerica. Geology 38: 1079-1082. <a href="https://doi.org/10.1130/G31182.1" target="_blank" rel="noopener">doi:10.1130/G31182.1</a></li><li>Dunne, E.M. et al. (2018). Diversity change during the rise of tetrapods and the impact of the &#x27;Carboniferous rainforest collapse&#x27;. Proceedings of the Royal Society B 285: 20172730. <a href="https://doi.org/10.1098/rspb.2017.2730" target="_blank" rel="noopener">doi:10.1098/rspb.2017.2730</a></li><li>Goddéris, Y. et al. (2017). Onset and ending of the late Palaeozoic ice age triggered by tectonically paced rock weathering. Nature Geoscience 10: 382-386. <a href="https://doi.org/10.1038/ngeo2931" target="_blank" rel="noopener">doi:10.1038/ngeo2931</a></li><li>Fielding, C.R., Frank, T.D. &amp; Isbell, J.L. (2008). The late Paleozoic ice age: a review of current understanding and synthesis of global climate patterns. In: Resolving the Late Paleozoic Ice Age in Time and Space. Geological Society of America Special Paper 441.</li></ol></details></div></script><script type="text/x-tpl" id="le-pangaea-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Dimetrodon skeleton.jpg" data-cap="Pangaea and the Rise of Our Ancestors" data-big><figcaption></figcaption></figure><div class="sh-k">Paleozoic · Permian</div><h2 class="sh-t" id="le-pangaea-st" tabindex="-1">Pangaea and the Rise of Our Ancestors</h2><p class="sh-s">c. 299–252 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Established</span></span></div></div><p class="v4-q">Nearly all land joined into one supercontinent, its heart turned to desert, and the ancestors of mammals ruled the land.</p><div class="lx-nums" data-from="lxs-le-pangaea"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-pangaea"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Dimetrodon, the sail-backed &#x27;dinosaur&#x27; of toy boxes, was more closely related to us than to any dinosaur.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:91.7%" role="img" aria-label="Weight of evidence: Established"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Dimetrodon lived at least 40 million years before the first dinosaurs. Its skull has a single opening behind each eye, the defining feature of synapsids, the lineage that leads to mammals. Its teeth came in different sizes, an early step toward our differentiated teeth. Anatomy, the fossil sequence through therapsids and cynodonts, and every modern family tree place it on the mammal side of the split with reptiles, including dinosaurs.</p></div></div></div><div class="twist"><b>Still open</b><p>What Dimetrodon&#x27;s sail was for (heat regulation, display, or both) is still debated. So is the exact pattern of Permian climate change and how strongly the harsh interior climate shaped where animals could live. The timing of the split between synapsids and reptiles has been pushed back by new trackway finds, which remain under discussion.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 397 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Pangaea and the Rise of Our Ancestors"><button type="button" class="wtoc-i" data-go="le-pangaea-s1">One world</button><button type="button" class="wtoc-i" data-go="le-pangaea-s2">Deserts and megamonsoons</button><button type="button" class="wtoc-i" data-go="le-pangaea-s3">Seeds for a drier world</button><button type="button" class="wtoc-i" data-go="le-pangaea-s4">Our side of the family</button></nav></div><section class="wsec" id="le-pangaea-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>One world</h3><p>By the start of the Permian, the continents had collided into one supercontinent: Pangaea, from the Greek for &#x27;all land&#x27;. You could, in principle, have walked from what is now Siberia to what is now Antarctica. The collisions pushed up a mountain chain through the middle of the land, whose worn-down roots survive as the Appalachians, the mountains of Morocco and the uplands of central Europe. A single world ocean surrounded it all.</p><blockquote class="wpull"><p>When all land is one continent, most of it is far from the sea, and far from rain.</p></blockquote></section><section class="wsec" id="le-pangaea-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Deserts and megamonsoons</h3><p>A single huge landmass creates extreme weather. The interior heats up dramatically in summer and cools in winter, pulling moist air in and pushing it out in strong seasonal cycles that climate modellers call megamonsoons. Coasts might be drenched in season while the heart of the continent turned to desert. Permian sandstones in Arizona and Utah preserve the cross-bedding of ancient dunes, and salt deposits show where seas dried out.</p><aside class="wcall"><b>How do we know?</b><p>Paleomagnetism, the magnetic direction frozen into rocks as they form, shows where each continent lay. Rock types record climate: coal forms in wet places, salt and dune sandstones in dry ones, tillites under ice. Climate models test how a supercontinent would shape wind and rain. Fossil skulls and skeletons, compared feature by feature, place animals such as Dimetrodon on the family tree.</p></aside></section><section class="wsec" id="le-pangaea-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Seeds for a drier world</h3><p>Plants had to adapt as well. Spore-bearing plants such as ferns and club mosses need a film of water for fertilisation, which ties them to damp ground. Seed plants carry their own water and food supply inside a protective coat, and their pollen travels on the wind. In the drier, more seasonal Permian, they spread widely. Conifers, cycads and ginkgo relatives rose in the north, and in the south the Glossopteris flora covered Gondwana. Its fossils, found today in India, Africa, South America, Australia and Antarctica, became one more clue that these lands were once joined.</p></section><section class="wsec" id="le-pangaea-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Our side of the family</h3><p>The land animals of the Permian look like reptiles to modern eyes, but many belonged to our own branch. Synapsids split from the reptile line in the Carboniferous. Dime
