trodon, with its tall sail and teeth of several sizes, was a top predator in early Permian Texas. Later came therapsids: dog-sized to rhinoceros-sized plant-eaters, sabre-toothed hunters, and finally cynodonts, small animals with a bony palate, more complex teeth and possibly fur. Mammals would descend from cynodonts in the Triassic.</p><ul class="wlist"><li>Dimetrodon: early synapsid, sail-backed, closer to us than to dinosaurs.</li><li>Dicynodonts: beaked plant-eaters, some with tusks.</li><li>Gorgonopsians: sabre-toothed predators of the late Permian.</li><li>Cynodonts: small, mammal-like, the survivors that led to mammals.</li></ul></section><details class="srcs"><summary>Sources for this entry (6)</summary><ol><li>Parrish, J.T. (1993). Climate of the supercontinent Pangea. Journal of Geology 101: 215-233. <a href="https://doi.org/10.1086/648217" target="_blank" rel="noopener">doi:10.1086/648217</a></li><li>Kutzbach, J.E. &amp; Gallimore, R.G. (1989). Pangaean climates: megamonsoons of the megacontinent. Journal of Geophysical Research 94: 3341-3357. <a href="https://doi.org/10.1029/JD094iD03p03341" target="_blank" rel="noopener">doi:10.1029/JD094iD03p03341</a></li><li>Angielczyk, K.D. (2009). Dimetrodon is not a dinosaur: using tree thinking to understand the ancient relatives of mammals and their evolution. Evolution: Education and Outreach 2: 257-271. <a href="https://doi.org/10.1007/s12052-009-0117-4" target="_blank" rel="noopener">doi:10.1007/s12052-009-0117-4</a></li><li>Cohen, K.M. et al. (2013, updated 2023). The ICS International Chronostratigraphic Chart. Episodes 36: 199-204. <a href="https://doi.org/10.18814/epiiugs/2013/v36i3/002" target="_blank" rel="noopener">doi:10.18814/epiiugs/2013/v36i3/002</a></li><li>Long, J.A. et al. (2025). Earliest amniote tracks recalibrate the timeline of tetrapod evolution. Nature 641: 1193-1200. <a href="https://doi.org/10.1038/s41586-025-08884-5" target="_blank" rel="noopener">doi:10.1038/s41586-025-08884-5</a></li><li>Burgess, S.D., Bowring, S. &amp; Shen, S. (2014). High-precision timeline for Earth&#x27;s most severe extinction. PNAS 111: 3316-3321. <a href="https://doi.org/10.1073/pnas.1317692111" target="_blank" rel="noopener">doi:10.1073/pnas.1317692111</a></li></ol></details></div></script><script type="text/x-tpl" id="le-great-dying-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Plato Putorana 01.jpg" data-cap="The Great Dying" data-big><figcaption></figcaption></figure><div class="sh-k">Paleozoic · End-Permian (Changhsingian to earliest Triassic)</div><h2 class="sh-t" id="le-great-dying-st" tabindex="-1">The Great Dying</h2><p class="sh-s">c. 252 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Strong evidence</span></span></div></div><p class="v4-q">Siberian volcanoes poured out carbon, the oceans overheated and lost their oxygen, and most species in the sea disappeared.</p><div class="lx-nums" data-from="lxs-le-great-dying"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-great-dying"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Volcanic eruptions in Siberia caused the Great Dying.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">High-precision dating shows the main Siberian Traps activity, especially the intrusion of magma sills into carbon-rich rocks, began shortly before and overlapped the extinction (Burgess &amp; Bowring 2015). The extinction coincides with a sharp carbon isotope shift, mercury spikes typical of big eruptions, rapid warming, ocean acidification and oxygen loss, all expected from a massive carbon release. Proposed impacts lack convincing evidence. What remains debated is the exact chain of killing mechanisms.</p></div></div></div><div class="twist"><b>Still open</b><p>How much each killer contributed (heat, oxygen loss, acidification, toxic hydrogen sulphide, ozone damage) is still argued, as is whether life on land died before life in the sea: a 2024 study suggested land extinction began tens of thousands of years earlier. Also debated is why recovery took millions of years.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 348 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Great Dying"><button type="button" class="wtoc-i" data-go="le-great-dying-s1">The worst of all</button><button type="button" class="wtoc-i" data-go="le-great-dying-s2">Fire from Siberia</button><button type="button" class="wtoc-i" data-go="le-great-dying-s3">Reading the rocks</button><button type="button" class="wtoc-i" data-go="le-great-dying-s4">A long road back</button></nav></div><section class="wsec" id="le-great-dying-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The worst of all</h3><p>Of the five great mass extinctions, the one that ended the Permian was the deadliest. About 252 million years ago, in a span that high-precision dating suggests lasted tens of thousands of years at most, most species in the sea disappeared, together with most large land animals and many plants. Revised counts put the loss at about 81% of marine species, still far more than any other extinction. The world that emerged in the Triassic was fundamentally different.</p><blockquote class="wpull"><p>The Great Dying did not come from the sky. It rose from below, through the rock of Siberia.</p></blockquote></section><section class="wsec" id="le-great-dying-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Fire from Siberia</h3><p>The Siberian Traps are one of the largest volcanic provinces on Earth, a pile of lava flows and intrusions covering millions of square kilometres. Crucially, much of the magma did not simply erupt; it forced its way sideways as sills through layers of coal, limestone and salt, baking them and releasing additional carbon dioxide, methane and toxic gases. Warming followed rapidly, and the chain of damage spread through the planet.</p><ul class="wlist"><li>Heat: tropical oceans may have reached about 40 °C, too hot for many animals.</li><li>Oxygen loss: warm water holds less oxygen, while warm animals need more.</li><li>Acidification: extra carbon dioxide made seawater more acidic, harming animals that build shells.</li><li>Forest collapse: dying vegetation removed a brake on carbon dioxide and intensified climate swings.</li></ul></section><section class="wsec" id="le-great-dying-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Reading the rocks</h3><aside class="wcall"><b>How do we know?</b><p>Uranium-lead dating of zircons in volcanic ash beds at Meishan, China, and in Siberian rocks, lets researchers compare the timing of eruptions and extinction to within tens of thousands of years. Oxygen isotopes in conodont teeth record sea temperatures. Boron isotopes track ocean acidity. Carbon isotopes and mercury spikes mark the carbon release and volcanism. Fossil ranges in hundreds of rock sections record which species disappeared and when.</p></aside><p>Penn and colleagues (2018) combined climate and physiology models and found that warming plus oxygen loss could explain much of the pattern of marine extinction, including why polar species fared better than tropical ones. The same combination, heat and falling oxygen, is what oceanographers now track in today&#x27;s warming seas, although on a far smaller scale.</p></section><section class="wsec" id="le-great-dying-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>A long road back</h3><p>Recovery was slow. For millions of years into the early Triassic, oceans stayed hot and unstable, and reefs, forests and coal swamps were rare. Complex ecosystems took roughly 5 to 10 million years to rebuild fully. When they did, the new world belonged to new groups: modern-style reefs, early dinosaurs and, from small cynodont survivors, the first mammals.</p></section><details class="srcs"><summary>Sources for this entry (8)</summary><ol><li>Burgess, S.D., Bowring, S. &amp; Shen, S. (2014). High-precision timeline for Earth&#x27;s most severe extinction. PNAS 111: 3316-3321. <a href="https://doi.org/10.1073/pnas.1317692111" target="_blank" rel="noopener">doi:10.1073/pnas.1317692111</a></li><li>Burgess, S.D. &amp; Bowring, S.A. (2015). High-precision geochronology confirms voluminous magmatism before, during, and after Earth&#x27;s most severe extinction. Science Advances 1: e1500470. <a href="https://doi.org/10.1126/sciadv.1500470" target="_blank" rel="noopener">doi:10.1126/sciadv.1500470</a></li><li>Stanley, S.M. (2016). Estimates of the magnitudes of major marine mass extinctions in earth history. PNAS 113: E6325-E6334. <a href="https://doi.org/10.1073/pnas.1613094113" target="_blank" rel="noopener">doi:10.1073/pnas.1613094113</a></li><li>Sun, Y. et al. (2012). Lethally hot temperatures during the Early Triassic greenhouse. Science 338: 366-370. <a href="https://doi.org/10.1126/science.1224126" target="_blank" rel="noopener">doi:10.1126/science.1224126</a></li><li>Penn, J.L. et al. (2018). Temperature-dependent hypoxia explains biogeography and severity of end-Permian marine mass extinction. Science 362: eaat1327. <a href="https://doi.org/10.1126/science.aat1327" target="_blank" rel="noopener">doi:10.1126/science.aat1327</a></li><li>Clarkson, M.O. et al. (2015). Ocean acidification and the Permo-Triassic mass extinction. Science 348: 229-232. <a href="https://doi.org/10.1126/science.aaa0193" target="_blank" rel="noopener">doi:10.1126/science.aaa0193</a></li><li>Chen, Z.-Q. &amp; Benton, M.J. (2012). The timing and pattern of biotic recovery following the end-Permian mass extinction. Nature Geoscience 5: 375-383. <a href="https://doi.org/10.1038/ngeo1475" target="_blank" rel="noopener">doi:10.1038/ngeo1475</a></li><li>Sun, Y. et al. (2024). Mega El Niño instigated the end-Permian mass extinction. Science 385. <a href="https://doi.org/10.1126/science.ado2030" target="_blank" rel="noopener">doi:10.1126/science.ado2030</a></li></ol></details></div></script><script type="text/x-tpl" id="le-triassic-recovery-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Herrerasaurus ischigualastensis skeleton, Eoraptor lunensis skeleton, Plateosaurus skull.JPG" data-cap="Life Recovers from the Great Dying" data-big><figcaption></figcaption></figure><div class="sh-k">Mesozoic · Early to Late Triassic</div><h2 class="sh-t" id="le-triassic-recovery-st" tabindex="-1">Life Recovers from the Great Dying</h2><p class="sh-s">c. 251–230 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Ruled out</span></span></div></div><p class="v4-q">After the worst extinction in Earth&#x27;s history, a scorched supercontinent slowly refilled with life, and among the survivors walked the ancestors of dinosaurs and mammals.</p><div class="lx-nums" data-from="lxs-le-triassic-recovery"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-triassic-recovery"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Dinosaurs dominated the land as soon as they appeared.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Early dinosaurs are well dated to about 231 million years ago in Argentina, and they are a minority in those beds. Studies of body-shape diversity show that crocodile-line archosaurs matched or outdid dinosaurs through much of the Late Triassic (Brusatte et al. 2008). Dinosaurs became dominant only later, after the Carnian crisis and especially after the end-Triassic extinction. The idea that they took over at once does not fit the record.</p></div></div></div><div class="twist"><b>Still open</b><p>When the dinosaur line really began is debated. Footprints from Poland and the Tanzanian fossil Nyasasaurus hint at dinosaur relatives about 243 to 250 million years ago, but their identity is disputed. Why recovery took so long, whether through repeated heat and carbon pulses or lingering low-oxygen seas, also remains open.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 408 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Life Recovers from the Great Dying"><button type="button" class="wtoc-i" data-go="le-triassic-recovery-s1">A planet emptied</button><button type="button" class="wtoc-i" data-go="le-triassic-recovery-s2">Too hot for the tropics</button><button type="button" class="wtoc-i" data-go="le-triassic-recovery-s3">Enter the archosaurs</button><button type="button" class="wtoc-i" data-go="le-triassic-recovery-s4">Our own thin thread</button></nav></div><section class="wsec" id="le-triassic-recovery-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A planet emptied</h3><p>About 251.9 million years ago, the end-Permian extinction wiped out most species in the sea and many on land. Huge eruptions in Siberia released carbon dioxide and other gases, warming the planet and stripping oxygen from parts of the ocean. What came next was not a quick bounce back. The Early Triassic world was hot, patchy and strangely empty, with the same few hardy species turning up almost everywhere.</p><blockquote class="wpull"><p>For millions of years, the same few survivors turned up almost everywhere, like weeds on a cleared field.</p></blockquote></section><section class="wsec" id="le-triassic-recovery-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Too hot for the tropics</h3><p>Chemical clues in tiny fossil teeth suggest that tropical seas reached around 40 °C in parts of the Early Triassic. That is warmer than a hot bath and above the limit many marine animals can tolerate. Fish and marine reptiles seem to have been scarce near the equator for a time, and on land some groups of vertebrates are hard to find at low latitudes. Reefs almost disappeared, and coal swamps vanished worldwide for several million years.</p><aside class="wcall"><b>How do we know?</b><p>Conodonts were small eel-like animals whose tooth-like parts are made of apatite. The ratio of oxygen-18 to oxygen-16 locked into that mineral depends on the water temperature when it grew, so samples taken layer by layer give a temperature curve (Sun et al. 2012). Dates come from zircon crystals in volcanic ash beds, which trap uranium that decays to lead at a known rate. Fossil counts, bed by bed, show when groups vanish and return.</p></aside></section><section class="wsec" id="le-triassic-recovery-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Enter the archosaurs</h3><p>As ecosystems rebuilt over roughly 5 to 10 million years, a group of reptiles called archosaurs spread and split. One branch led to crocodiles and their many extinct cousins, some of them large, upright predators. Another led to pterosaurs and dinosaurs. The earliest widely accepted dinosaurs, including Eoraptor and Herrerasaurus, come from rocks in Argentina dated to about 231 million years ago.</p><p>Yet early dinosaurs were not rulers. Through much of the Late Triassic, crocodile-line archosaurs were at least as varied as dinosaurs, and at many fossil sites dinosaurs are a minority. Their rise to dominance came later, helped by two crises: the Carnian rains and the end-Triassic extinction.</p></section><section class="wsec" id="le-triassic-recovery-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Our own thin thread</h3><p>Our story passes through this bottleneck too. Mammals descend from synapsids, the group that included the survivor Lystrosaurus and the small, weasel-like cynodonts. By the Late Triassic, small mammaliaforms, close cousins of true mammals, were probably hunting insects, perhaps at night, beneath the feet of larger reptiles. Their descendants would wait more than 150 million years for their own turn.</p><ul class="wlist"><li>Legacy: the mammal line, and so our own, passed through this recovery.</li><li>Legacy: Triassic red sandstones and salt beds, still quarried and mined in Europe.</li><li>Lesson: rich ecosystems took millions of years to rebuild after a carbon-driven crisis.</li></ul></section><details class="srcs"><summary>Sources for this entry (7)</summary><ol><li>Burgess, S.D., Bowring, S. &amp; Shen, S. (2014). High-precision timeline for Earth&#x27;s most severe extinction. PNAS 111: 3316-3321. <a href="https://doi.org/10.1073/pnas.1317692111" target="_blank" rel="noopener">doi:10.1073/pnas.1317692111</a></li><li>Sun, Y. et al. (2012). Lethally hot temperatures during the Early Triassic greenhouse. Science 338: 366-370. <a href="https://doi.org/10.1126/science.1224126" target="_blank" rel="noopener">doi:10.1126/science.1224126</a></li><li>Chen, Z.-Q. and Benton, M.J. (2012). The timing and pattern of biotic recovery following the end-Permian mass extinction. Nature Geoscience 5: 375-383. <a href="https://doi.org/10.1038/ngeo1475" target="_blank" rel="noopener">doi:10.1038/ngeo1475</a></li><li>Martinez, R.N. et al. (2011). A basal dinosaur from the dawn of the dinosaur era in southwestern Pangaea. Science 331: 206-210. <a href="https://doi.org/10.1126/science.1198467" target="_blank" rel="noopener">doi:10.1126/science.1198467</a></li><li>Brusatte, S.L. et al. (2008). Superiority, competition, and opportunism in the evolutionary radiation of dinosaurs. Science 321: 1485-1488. <a href="https://doi.org/10.1126/science.1161833" target="_blank" rel="noopener">doi:10.1126/science.1161833</a></li><li>Langer, M.C. et al. (2010). The origin and early evolution of dinosaurs. Biological Reviews 85: 55-110. <a href="https://doi.org/10.1111/j.1469-185X.2009.00094.x" target="_blank" rel="noopener">doi:10.1111/j.1469-185X.2009.00094.x</a></li><li>Luo, Z.-X. (2007). Transformation and diversification in early mammal evolution. Nature 450: 1011-1019. <a href="https://doi.org/10.1038/nature06277" target="_blank" rel="noopener">doi:10.1038/nature06277</a></li></ol></details></div></script><script type="text/x-tpl" id="le-carnian-pluvial-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Valle de la Luna – Parque Provincial Ischigualasto.JPG" data-cap="The Carnian Rains" data-big><figcaption></figcaption></figure><div class="sh-k">Mesozoic · Late Triassic (Carnian)</div><h2 class="sh-t" id="le-carnian-pluvial-st" tabindex="-1">The Carnian Rains</h2><p class="sh-s">c. 234–232 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Plausible</span></span></div></div><p class="v4-q">In the middle of the dry Triassic, the skies opened for a million years or more, and dinosaurs emerged from the wetter world that followed.</p><div class="lx-nums" data-from="lxs-le-carnian-pluvial"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-carnian-pluvial"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The Carnian rains set off the rise of the dinosaurs.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Dinosaur footprints in the Dolomites become common just after the episode (Bernardi et al. 2018), and body fossils show dinosaurs becoming more varied in the later Carnian and Norian. The turnover of rival plant-eaters fits the idea that wet-phase changes opened space. But early dinosaur fossils are loosely dated, and some analyses find dinosaur-line diversity rising faster at other times. The link is reasonable, not firmly established.</p></div></div></div><div class="twist"><b>Still open</b><p>How closely the Wrangellia eruptions match the wet pulses in time, and whether there were several separate pulses, is still being worked out. Whether the rains were the decisive push for dinosaurs, or one factor among several including the end-Triassic extinction, remains debated.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 393 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Carnian Rains"><button type="button" class="wtoc-i" data-go="le-carnian-pluvial-s1">Rain on a desert world</button><button type="button" class="wtoc-i" data-go="le-carnian-pluvial-s2">The volcanic trigger</button><button type="button" class="wtoc-i" data-go="le-carnian-pluvial-s3">Winners and losers</button><button type="button" class="wtoc-i" data-go="le-carnian-pluvial-s4">An open case</button></nav></div><section class="wsec" id="le-carnian-pluvial-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Rain on a desert world</h3><p>The Triassic is usually pictured as dry, and for most of it that is fair. But around 234 million years ago, rocks around the world record a change. Red desert soils give way to grey, wetter ones. River sands thicken. Amber turns up in unusual amounts in the Italian Alps. In 1989, geologists Michael Simms and Alastair Ruffell argued this was a global rainy phase, and later work has broadly supported them.</p><blockquote class="wpull"><p>For a million years or more, a desert supercontinent became a land of swollen rivers and spreading lakes.</p></blockquote></section><section class="wsec" id="le-carnian-pluvial-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The volcanic trigger</h3><p>The leading explanation is volcanic. The Wrangellia basalts, now sliced into slivers along the Pacific coast of Alaska and British Columbia, erupted around this time. In 2012, Jacopo Dal Corso and colleagues found a sharp shift in carbon isotopes at the start of the wet phase, the fingerprint of a large injection of light carbon into the air and ocean. More carbon dioxide meant warming, and a warmer atmosphere holds and moves more water.</p><aside class="wcall"><b>How do we know?</b><p>Carbon comes in two stable forms, carbon-12 and carbon-13. Volcanic and organic carbon is rich in the lighter kind, so when a lot of it enters the air and sea, the ratio recorded in plant remains and limestone swings sharply. Geologists match these swings between distant rock sections, then use pollen, soil types, sand bodies and fossil counts to track changes in rainfall and life. Dates rely on volcanic ash beds and fossil zones.</p></aside></section><section class="wsec" id="le-carnian-pluvial-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Winners and losers</h3><p>The sea felt it first. Ammonoids, conodonts and reef-building animals suffered heavy losses, and reef systems were disrupted. On land, several plant-eating reptile groups that had been common later dwindled. After the rains, the world looked different. Dinosaurs became more varied and widespread, and footprints in the Dolomites show dinosaur tracks becoming common just after the episode. Tiny chalk-plated algae appear in the oceans, and reefs built by stony corals spread.</p><p>Dal Corso and colleagues called it the dawn of the modern world, because so many groups that still shape ecosystems appear or expand around this time.</p></section><section class="wsec" id="le-carnian-pluvial-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>An open case</h3><p>Not everyone is convinced the rains were the decisive push. The timing of early dinosaur fossils is still loosely pinned, and some studies find dinosaur-line diversity rising faster before and after the Carnian. The episode may have been one push among several, with the end-Triassic extinction, some 30 million years later, doing more to hand dinosaurs the land.</p></section><details class="srcs"><summary>Sources for this entry (5)</summary><ol><li>Simms, M.J. and Ruffell, A.H. (1989). Synchroneity of climatic change and extinctions in the Late Triassic. Geology 17: 265-268. <a href="https://doi.org/10.1130/0091-7613(1989)017&lt;0265:SOCCAE&gt;2.3.CO;2" target="_blank" rel="noopener">doi:10.1130/0091-7613(1989)017&lt;0265:SOCCAE&gt;2.3.CO;2</a></li><li>Dal Corso, J. et al. (2012). Discovery of a major negative δ13C spike in the Carnian (Late Triassic) linked to the eruption of Wrangellia flood basalts. Geology 40: 79-82. <a href="https://doi.org/10.1130/G32473.1" target="_blank" rel="noopener">doi:10.1130/G32473.1</a></li><li>Dal Corso, J. et al. (2020). Extinction and dawn of the modern world in the Carnian (Late Triassic). Science Advances 6: eaba0099. <a href="https://doi.org/10.1126/sciadv.aba0099" target="_blank" rel="noopener">doi:10.1126/sciadv.aba0099</a></li><li>Bernardi, M. et al. (2018). Dinosaur diversification linked with the Carnian Pluvial Episode. Nature Communications 9: 1499. <a href="https://doi.org/10.1038/s41467-018-03996-1" target="_blank" rel="noopener">doi:10.1038/s41467-018-03996-1</a></li><li>Cohen, K.M., Finney, S.C., Gibbard, P.L. and Fan, J.-X. (2013, updated). The ICS International Chronostratigraphic Chart. Episodes 36: 199-204. <a href="https://doi.org/10.18814/epiiugs/2013/v36i3/002" target="_blank" rel="noopener">doi:10.18814/epiiugs/2013/v36i3/002</a></li></ol></details></div></script><script type="text/x-tpl" id="le-end-triassic-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Palisades Sill near Englewood Cliffs.jpg" data-cap="The End-Triassic Extinction" data-big><figcaption></figcaption></figure><div class="sh-k">Mesozoic · Triassic-Jurassic boundary</div><h2 class="sh-t" id="le-end-triassic-st" tabindex="-1">The End-Triassic Extinction</h2><p class="sh-s">c. 201.5 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Strong evidence</span></span></div></div><p class="v4-q">As Pangaea began to split, lava flooded parts of four future continents, and in the upheaval that followed, the dinosaurs inherited the land.</p><div class="lx-nums" data-from="lxs-le-end-triassic"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-end-triassic"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Volcanic eruptions from the Central Atlantic Magmatic Province caused the end-Triassic extinction.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">High-precision zircon dates place the oldest lava pulses at the extinction horizon, within the limits of the method (Blackburn et al. 2013). Carbon-isotope swings, a rise in carbon dioxide in fossil soils, signs of acidification and mercury spikes in many sections all fit a volcanic trigger. Gas-rich bubbles show the magma carried large amounts of carbon dioxide (Capriolo et al. 2020). No known impact matches the date. Details of the kill mechanism are still argued.</p></div></div></div><div class="twist"><b>Still open</b><p>Which gases did the most harm, carbon dioxide warming, sulfur cooling or both, is still debated, as is how quickly the extinction unfolded; some records suggest tens of thousands of years or less. Why dinosaurs came through while their crocodile-line rivals did not remains an open question.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 387 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The End-Triassic Extinction"><button type="button" class="wtoc-i" data-go="le-end-triassic-s1">A supercontinent cracks</button><button type="button" class="wtoc-i" data-go="le-end-triassic-s2">Dating the crime scene</button><button type="button" class="wtoc-i" data-go="le-end-triassic-s3">Who survived</button><button type="button" class="wtoc-i" data-go="le-end-triassic-s4">Why it still matters</button></nav></div><section class="wsec" id="le-end-triassic-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A supercontinent cracks</h3><p>By the end of the Triassic, Pangaea was under strain. Rift valleys opened between what are now North America, Africa and South America, filling with lakes and sediment. Then, around 201.5 million years ago, the crust gave way to magma. Lava flooded out in pulses, and molten rock pushed sideways between sediment layers to form thick sheets called sills. Geologists call the whole system the Central Atlantic Magmatic Province, or CAMP.</p><blockquote class="wpull"><p>The line where the lava rose is, roughly, the line where the Atlantic Ocean would later open.</p></blockquote></section><section class="wsec" id="le-end-triassic-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Dating the crime scene</h3><p>For decades the link between lava and extinction was suspected but loosely dated. Then in 2013, Terrence Blackburn and colleagues dated zircon crystals from the lavas and sills with the uranium-lead method. The oldest pulses matched the extinction horizon closely, and the eruptions continued in bursts for about 600,000 years. Tiny gas bubbles trapped in the minerals later showed that the magma carried large amounts of carbon dioxide from deep in the Earth (Capriolo et al. 2020).</p><aside class="wcall"><b>How do we know?</b><p>Zircon crystals grow in cooling magma and lock in uranium but almost no lead. Uranium decays to lead at a precisely known rate, so the ratio gives an age, here with an uncertainty of only tens of thousands of years. Researchers match these ages to rock layers recording the extinction, using fossil pollen, carbon-isotope swings and magnetic reversals preserved in the lake sediments of eastern North America&#x27;s rift basins and elsewhere.</p></aside></section><section class="wsec" id="le-end-triassic-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Who survived</h3><p>In the sea, conodonts vanished after some 300 million years, and many ammonoids, bivalves and reef builders died out. On land, the crocodile-line archosaurs, which had rivalled dinosaurs through the Triassic, were cut back to a few groups, including the ancestors of crocodiles. Dinosaurs, pterosaurs and small mammal relatives came through. In the rift basins of eastern North America, dinosaur footprints become larger and more common soon after the boundary, which Paul Olsen and colleagues read as dinosaurs filling emptied roles.</p></section><section class="wsec" id="le-end-triassic-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Why it still matters</h3><p>The end-Triassic event is one of the best-dated cases of a volcanic carbon burst coinciding with mass extinction and acidified seas. It is not a perfect match for today: the eruptions released carbon in pulses over many thousands of years, and the continents and life were very different. But it suggests that the Earth system can shift abruptly when large amounts of carbon enter it, and that recovery is slow.</p></section><details class="srcs"><summary>Sources for this entry (5)</summary><ol><li>Blackburn, T.J. et al. (2013). Zircon U-Pb geochronology links the end-Triassic extinction with the Central Atlantic Magmatic Province. Science 340: 941-945. <a href="https://doi.org/10.1126/science.1234204" target="_blank" rel="noopener">doi:10.1126/science.1234204</a></li><li>Marzoli, A. et al. (1999). Extensive 200-million-year-old continental flood basalts of the Central Atlantic Magmatic Province. Science 284: 616-618. <a href="https://doi.org/10.1126/science.284.5414.616" target="_blank" rel="noopener">doi:10.1126/science.284.5414.616</a></li><li>Schaller, M.F., Wright, J.D. and Kent, D.V. (2011). Atmospheric PCO2 perturbations associated with the Central Atlantic Magmatic Province. Science 331: 1404-1409. <a href="https://doi.org/10.1126/science.1199011" target="_blank" rel="noopener">doi:10.1126/science.1199011</a></li><li>Olsen, P.E. et al. (2002). Ascent of dinosaurs linked to an iridium anomaly at the Triassic-Jurassic boundary. Science 296: 1305-1307. <a href="https://doi.org/10.1126/science.1065522" target="_blank" rel="noopener">doi:10.1126/science.1065522</a></li><li>Capriolo, M. et al. (2020). Deep CO2 in the end-Triassic Central Atlantic Magmatic Province. Nature Communications 11: 1670. <a href="https://doi.org/10.1038/s41467-020-15325-6" target="_blank" rel="noopener">doi:10.1038/s41467-020-15325-6</a></li></ol></details></div></script><script type="text/x-tpl" id="le-jurassic-giants-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Giraffatitan brancai Naturkundemuseum Berlin.jpg" data-cap="Jurassic Giants in a Greenhouse World" data-big><figcaption></figcaption></figure><div class="sh-k">Mesozoic · Jurassic</div><h2 class="sh-t" id="le-jurassic-giants-st" tabindex="-1">Jurassic Giants in a Greenhouse World</h2><p class="sh-s">c. 201–145 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Established</span></span></div></div><p class="v4-q">Long-necked sauropods, the largest animals ever to walk, browsed conifer forests as Pangaea split and warm, shallow seas crept over the land.</p><div class="lx-nums" data-from="lxs-le-jurassic-giants"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-jurassic-giants"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Sauropods were the largest animals ever to walk on land.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:91.7%" role="img" aria-label="Weight of evidence: Established"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Limb bones, vertebrae and complete skeletons from several continents show sauropods far larger than any land mammal, including the giant hornless rhinos of later times. Mass estimates for individual species vary widely, because the largest are known from partial skeletons, but even conservative estimates for the biggest sauropods exceed any other land animal. Only whales, supported by water, have been larger.</p></div></div></div><div class="twist"><b>Still open</b><p>How sauropods grew so big and shed heat from such huge bodies is still debated, as are their exact masses. When exactly the Atlantic first opened, and how high Jurassic carbon dioxide rose, also carry wide uncertainty.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 360 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Jurassic Giants in a Greenhouse World"><button type="button" class="wtoc-i" data-go="le-jurassic-giants-s1">A warm world splitting apart</button><button type="button" class="wtoc-i" data-go="le-jurassic-giants-s2">Built to be big</button><button type="button" class="wtoc-i" data-go="le-jurassic-giants-s3">Forests before flowers</button><button type="button" class="wtoc-i" data-go="le-jurassic-giants-s4">The Jurassic under our feet</button></nav></div><section class="wsec" id="le-jurassic-giants-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A warm world splitting apart</h3><p>When the Jurassic began, about 201 million years ago, the survivors of the end-Triassic crisis inherited a supercontinent that was pulling itself apart. Rifts widened into seas. The central Atlantic was born as a long, narrow gulf between North America and Africa, and shallow seas flooded large parts of Europe. The climate was warm and generally humid near the coasts, with no permanent ice at the poles.</p><blockquote class="wpull"><p>Picture forests with no flowers, no grass and no fruit, grazed by the largest animals ever to walk the Earth.</p></blockquote></section><section class="wsec" id="le-jurassic-giants-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Built to be big</h3><p>Sauropods are the signature of the age. Giraffatitan, whose mounted skeleton towers over visitors in Berlin, came from Late Jurassic rocks in Tanzania. Diplodocus and Apatosaurus roamed North America, and Mamenchisaurus stretched a neck some 15 metres long in China. Martin Sander and colleagues argue that a mix of traits made such size possible: they swallowed food without chewing, laid many small eggs, and had bird-like air sacs that lightened the skeleton and helped them breathe.</p><aside class="wcall"><b>How do we know?</b><p>Masses of extinct giants are estimated in two main ways. One scales from the thickness of limb bones, which carry the weight, using living animals as a guide. The other builds a 3D model of the skeleton, adds flesh and air spaces, and multiplies by density. The methods often disagree, which is why published masses for the same sauropod can differ by tens of percent. Air sacs are inferred from hollow, pocketed vertebrae like those of birds.</p></aside></section><section class="wsec" id="le-jurassic-giants-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Forests before flowers</h3><p>The plants that fed these giants would look partly familiar. Conifers related to monkey puzzles and redwoods formed tall forests; cycads and ginkgos grew beneath them; ferns and horsetails lined the rivers. Insects were everywhere, but none visited flowers, which had not yet evolved. The sea teemed with ammonites, belemnites, ichthyosaurs and plesiosaurs, and coral reefs spread along the warm Tethys Ocean.</p><p>Small mammals and early lizards scurried through the undergrowth, and pterosaurs skimmed over the lagoons, some of them preserved in the same fine limestones that hold the first birds.</p></section><section class="wsec" id="le-jurassic-giants-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The Jurassic under our feet</h3><ul class="wlist"><li>The Kimmeridge Clay, a Late Jurassic mudstone, is the main source rock for North Sea oil.</li><li>Honey-coloured Jurassic limestones built Bath and much of Oxford.</li><li>On England&#x27;s Jurassic Coast, Mary Anning&#x27;s finds of ichthyosaurs and plesiosaurs in the early 1800s helped show that species can go extinct.</li></ul><p>Geologists also study Jurassic ocean crises, like the Toarcian event about 183 million years ago, as examples of how warming and carbon release can strip oxygen from the seas.</p></section><details class="srcs"><summary>Sources for this entry (5)</summary><ol><li>Cohen, K.M., Finney, S.C., Gibbard, P.L. and Fan, J.-X. (2013, updated). The ICS International Chronostratigraphic Chart. Episodes 36: 199-204. <a href="https://doi.org/10.18814/epiiugs/2013/v36i3/002" target="_blank" rel="noopener">doi:10.18814/epiiugs/2013/v36i3/002</a></li><li>Sander, P.M. et al. (2011). Biology of the sauropod dinosaurs: the evolution of gigantism. Biological Reviews 86: 117-155. <a href="https://doi.org/10.1111/j.1469-185X.2010.00137.x" target="_blank" rel="noopener">doi:10.1111/j.1469-185X.2010.00137.x</a></li><li>Taylor, M.P. and Wedel, M.J. (2013). Why sauropods had long necks; and why giraffes have short necks. PeerJ 1: e36. <a href="https://doi.org/10.7717/peerj.36" target="_blank" rel="noopener">doi:10.7717/peerj.36</a></li><li>Jenkyns, H.C. (2010). Geochemistry of oceanic anoxic events. Geochemistry, Geophysics, Geosystems 11: Q03004. <a href="https://doi.org/10.1029/2009GC002788" target="_blank" rel="noopener">doi:10.1029/2009GC002788</a></li><li>Foster, G.L., Royer, D.L. and Lunt, D.J. (2017). Future climate forcing potentially without precedent in the last 420 million years. Nature Communications 8: 14845. <a href="https://doi.org/10.1038/ncomms14845" target="_blank" rel="noopener">doi:10.1038/ncomms14845</a></li></ol></details></div></script><script type="text/x-tpl" id="le-first-birds-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Archaeopteryx lithographica (Berlin specimen).jpg" data-cap="Feathered Dinosaurs and the First Birds" data-big><figcaption></figcaption></figure><div class="sh-k">Mesozoic · Middle to Late Jurassic</div><h2 class="sh-t" id="le-first-birds-st" tabindex="-1">Feathered Dinosaurs and the First Birds</h2><p class="sh-s">c. 165–150 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Established</span></span></div></div><p class="v4-q">Feathers came before flight, and the line between dinosaur and bird blurred so completely that birds are now counted as living dinosaurs.</p><div class="lx-nums" data-from="lxs-le-first-birds"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-first-birds"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Birds are living dinosaurs.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:91.7%" role="img" aria-label="Weight of evidence: Established"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Hundreds of anatomical features, analysed in many independent studies, place birds inside the theropod dinosaurs, close to troodontids and dromaeosaurs. Feathers, wishbones, hollow air-filled bones, brooding postures and bird-like eggs all appear in non-bird dinosaurs. Transitional fossils such as Anchiornis and Archaeopteryx fill the gap. The conclusion rests on several lines of evidence that agree.</p></div></div></div><div class="twist"><b>Still open</b><p>Where exactly the line between bird and non-bird dinosaur falls is debated, since Anchiornis and Archaeopteryx sit close to it. How flight began, from the ground up or the trees down, and how well Archaeopteryx could fly, remain open. A 2025 study of the Chicago Archaeopteryx added new clues about its wings and feet (O&#x27;Connor et al. 2025).</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 402 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Feathered Dinosaurs and the First Birds"><button type="button" class="wtoc-i" data-go="le-first-birds-s1">The stone that printed a revolution</button><button type="button" class="wtoc-i" data-go="le-first-birds-s2">Feathers everywhere</button><button type="button" class="wtoc-i" data-go="le-first-birds-s3">Where birds fit</button><button type="button" class="wtoc-i" data-go="le-first-birds-s4">A new specimen, 2025</button></nav></div><section class="wsec" id="le-first-birds-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The stone that printed a revolution</h3><p>In 1861, quarry workers near Solnhofen in Bavaria split a slab of fine limestone and found a feather. That same year a skeleton turned up with feathered wings, but also teeth, clawed fingers and a long bony tail. Named Archaeopteryx, it arrived two years after Darwin&#x27;s On the Origin of Species and seemed to catch a reptile in the act of becoming a bird. More than a dozen specimens are now known.</p><blockquote class="wpull"><p>Feathers were not invented for flight. They were already there, on the arms, legs and tails of dinosaurs that never left the ground.</p></blockquote></section><section class="wsec" id="le-first-birds-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Feathers everywhere</h3><p>Since the 1990s, fossil beds in north-east China have revealed dozens of feathered dinosaurs. Anchiornis, about 160 million years old, is older than Archaeopteryx and had long feathers even on its legs. By studying microscopic pigment capsules called melanosomes, Quanguo Li and colleagues reconstructed its colours: grey, with black-and-white spangled wings and a rusty-red crown. At the other extreme, Yutyrannus, a tyrannosaur relative weighing about 1.4 tonnes, was covered in long filaments.</p><aside class="wcall"><b>How do we know?</b><p>Palaeontologists build family trees from hundreds of anatomical features, such as the wishbone, the wrist joint, hollow air-filled bones and the shape of the hip. Computer analyses group species by shared features. In study after study, birds nest inside the theropod dinosaurs, next to troodontids and dromaeosaurs like Velociraptor. Fossils of dinosaurs brooding eggs in bird-like postures, and melanosomes seen with electron microscopes, add independent lines of evidence.</p></aside></section><section class="wsec" id="le-first-birds-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Where birds fit</h3><p>So when did a dinosaur become a bird? There is no sharp line. Features we think of as bird-like, including feathers, wishbones, hollow bones and brooding, appeared step by step across many theropods. Birds are the one branch that survived the asteroid 66 million years ago, which is why scientists describe them as living dinosaurs rather than merely their descendants.</p><p>Many feathered dinosaurs could not fly at all. Their feathers probably served first for warmth, display or covering eggs, and were later put to use for gliding and flight. Flight may even have evolved more than once among small feathered dinosaurs.</p></section><section class="wsec" id="le-first-birds-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>A new specimen, 2025</h3><p>The picture is still being filled in. In 2025, Jingmai O&#x27;Connor and colleagues described the Chicago Archaeopteryx, a small, finely prepared specimen studied with CT scans and ultraviolet light. It preserves inner wing feathers called tertials, which in flying birds close the gap between wing and body, and soft tissue on its feet suggesting it spent time on the ground as well as in the air.</p></section><details class="srcs"><summary>Sources for this entry (5)</summary><ol><li>Hu, D. et al. (2009). A pre-Archaeopteryx troodontid theropod from China with long feathers on the metatarsus. Nature 461: 640-643. <a href="https://doi.org/10.1038/nature08322" target="_blank" rel="noopener">doi:10.1038/nature08322</a></li><li>Li, Q. et al. (2010). Plumage color patterns of an extinct dinosaur. Science 327: 1369-1372. <a href="https://doi.org/10.1126/science.1186290" target="_blank" rel="noopener">doi:10.1126/science.1186290</a></li><li>Xu, X. et al. (2012). A gigantic feathered dinosaur from the Lower Cretaceous of China. Nature 484: 92-95. <a href="https://doi.org/10.1038/nature10906" target="_blank" rel="noopener">doi:10.1038/nature10906</a></li><li>Brusatte, S.L., O&#x27;Connor, J.K. and Jarvis, E.D. (2015). The origin and diversification of birds. Current Biology 25: R888-R898. <a href="https://doi.org/10.1016/j.cub.2015.08.003" target="_blank" rel="noopener">doi:10.1016/j.cub.2015.08.003</a></li><li>O&#x27;Connor, J. et al. (2025). Chicago Archaeopteryx informs on the early evolution of the avian bauplan. Nature 641: 1201-1207. <a href="https://doi.org/10.1038/s41586-025-08912-4" target="_blank" rel="noopener">doi:10.1038/s41586-025-08912-4</a></li></ol></details></div></script><script type="text/x-tpl" id="le-flowering-plants-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Archaefructus liaoningensis.jpg" data-cap="Flowers Take Over the World" data-big><figcaption></figcaption></figure><div class="sh-k">Mesozoic · Early to Late Cretaceous</div><h2 class="sh-t" id="le-flowering-plants-st" tabindex="-1">Flowers Take Over the World</h2><p class="sh-s">c. 140–90 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Open question</span></span></div></div><p class="v4-q">Darwin called their sudden rise an abominable mystery. In some 50 million years, flowering plants went from rare newcomers to rulers of the green world.</p><div class="lx-nums" data-from="lxs-le-flowering-plants"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-flowering-plants"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Flowering plants originated long before their first fossils, in the Jurassic or earlier.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:41.7%" role="img" aria-label="Weight of evidence: Open question"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Unambiguous flowering-plant fossils, especially distinctive pollen, begin about 135 million years ago and grow steadily more common. Some molecular clock studies put the origin near 140 million years ago (Magallón et al. 2015), close to the fossils, while others place it in the Jurassic or Triassic (Barba-Montoya et al. 2018). Claimed Jurassic flowers remain disputed. The two kinds of evidence have not yet been reconciled.</p></div></div></div><div class="twist"><b>Still open</b><p>When and where flowering plants first evolved, and from which seed-plant ancestors, is unresolved. The Chinese fossil Nanjinganthus, described as Jurassic, is disputed. Why they spread so fast, through faster growth, insect partners or repeated doublings of their genomes, is still debated.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 409 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Flowers Take Over the World"><button type="button" class="wtoc-i" data-go="le-flowering-plants-s1">Darwin&#x27;s abominable mystery</button><button type="button" class="wtoc-i" data-go="le-flowering-plants-s2">The first flowers</button><button type="button" class="wtoc-i" data-go="le-flowering-plants-s3">A world remade</button><button type="button" class="wtoc-i" data-go="le-flowering-plants-s4">The flowers on our plate</button></nav></div><section class="wsec" id="le-flowering-plants-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Darwin&#x27;s abominable mystery</h3><p>In 1879, Charles Darwin wrote to his friend Joseph Hooker that the rapid development of the higher plants within recent geological times was an abominable mystery. The fossil record of his day showed flowering plants appearing in the Cretaceous with little warning and soon filling the world. For a theory of slow, gradual change, that looked awkward. The mystery has been narrowed since, but not fully solved (Friedman 2009).</p><blockquote class="wpull"><p>The first flowers were not showy blossoms. They were small and easy to miss, and some of them lived entirely underwater.</p></blockquote></section><section class="wsec" id="le-flowering-plants-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The first flowers</h3><p>The earliest widely accepted flowering-plant fossils are pollen grains from roughly 135 million years ago. Among the oldest whole plants is Montsechia, found in lake limestones in Spain and dated to about 130 million years ago. Bernard Gomez and colleagues showed in 2015 that it lived submerged, like the hornworts of ponds today. Archaefructus, from China and about 125 million years old, was also a water plant, with seeds enclosed in small pods.</p><aside class="wcall"><b>How do we know?</b><p>Flowering plants are recognised by features other seed plants lack: seeds enclosed in a fruit wall, and pollen with a distinctive layered, often net-like outer wall. Pollen survives well in rock, so its first appearances give an early signal, and whole-plant fossils confirm it. Molecular clocks add another line: they compare DNA differences among living plants and calibrate the rate with fossils, but their results depend heavily on assumptions.</p></aside></section><section class="wsec" id="le-flowering-plants-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>A world remade</h3><p>Between about 125 and 90 million years ago, flowering plants spread from wet margins into almost every habitat. Their leaves grew faster and, with denser veins, moved more water, which may have made parts of the tropics wetter. Beetles, flies, wasps and later bees diversified as pollinators. New plant-eating dinosaurs with batteries of grinding teeth appeared. Conifers, cycads and ferns did not vanish, but many retreated to cooler places or poorer soils.</p></section><section class="wsec" id="le-flowering-plants-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>The flowers on our plate</h3><p>Today there are around 295,000 described species of flowering plants, far more than all other land plants combined. Nearly all our food traces back to them. Wheat, rice and maize are grasses, a flowering-plant family that appeared later; beans, apples, potatoes, coffee and cotton are flowering plants too. Even meat and milk come mostly from animals fed on grasses and grains.</p><p>Flowers also rebuilt the animal world. Fruit-eating birds and mammals, nectar-feeding bats and a huge diversity of beetles, bees and butterflies depend on them. When we plant a garden or tend an orchard, we are working inside a partnership that began in the Cretaceous.</p></section><details class="srcs"><summary>Sources for this entry (8)</summary><ol><li>Friedman, W.E. (2009). The meaning of Darwin&#x27;s &#x27;abominable mystery&#x27;. American Journal of Botany 96: 5-21. <a href="https://doi.org/10.3732/ajb.0800150" target="_blank" rel="noopener">doi:10.3732/ajb.0800150</a></li><li>Gomez, B. et al. (2015). Montsechia, an ancient aquatic angiosperm. PNAS 112: 10985-10988. <a href="https://doi.org/10.1073/pnas.1509241112" target="_blank" rel="noopener">doi:10.1073/pnas.1509241112</a></li><li>Sun, G. et al. (2002). Archaefructaceae, a new basal angiosperm family. Science 296: 899-904. <a href="https://doi.org/10.1126/science.1069439" target="_blank" rel="noopener">doi:10.1126/science.1069439</a></li><li>Magallón, S. et al. (2015). A metacalibrated time-tree documents the early rise of flowering plant phylogenetic diversity. New Phytologist 207: 437-453. <a href="https://doi.org/10.1111/nph.13264" target="_blank" rel="noopener">doi:10.1111/nph.13264</a></li><li>Barba-Montoya, J. et al. (2018). Constraining uncertainty in the timescale of angiosperm evolution and the veracity of a Cretaceous Terrestrial Revolution. New Phytologist 218: 819-834. <a href="https://doi.org/10.1111/nph.15011" target="_blank" rel="noopener">doi:10.1111/nph.15011</a></li><li>Boyce, C.K. et al. (2009). Angiosperm leaf vein evolution was physiologically and environmentally transformative. Proceedings of the Royal Society B 276: 1771-1776. <a href="https://doi.org/10.1098/rspb.2008.1919" target="_blank" rel="noopener">doi:10.1098/rspb.2008.1919</a></li><li>Christenhusz, M.J.M. and Byng, J.W. (2016). The number of known plants species in the world and its annual increase. Phytotaxa 261: 201-217. <a href="https://doi.org/10.11646/phytotaxa.261.3.1" target="_blank" rel="noopener">doi:10.11646/phytotaxa.261.3.1</a></li><li>FAO. What is agrobiodiversity? In: Building on Gender, Agrobiodiversity and Local Knowledge. Rome: Food and Agriculture Organization (fao.org/4/y5609e).</li></ol></details></div></script><script type="text/x-tpl" id="le-cretaceous-hothouse-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="White Cliffs of Dover 02.JPG" data-cap="The Cretaceous Hothouse" data-big><figcaption></figcaption></figure><div class="sh-k">Mesozoic · Mid to Late Cretaceous</div><h2 class="sh-t" id="le-cretaceous-hothouse-st" tabindex="-1">The Cretaceous Hothouse</h2><p class="sh-s">c. 120–80 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Strong evidence</span></span></div></div><p class="v4-q">No ice at the poles, forests near the North Pole, and seas so high that a shallow ocean cut North America in two.</p><div class="lx-nums" data-from="lxs-le-cretaceous-hothouse"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-cretaceous-hothouse"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>At its peak, the Cretaceous hothouse had no permanent polar ice sheets.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Fossil forests, polar dinosaurs and warm-water plankton at high latitudes, together with oxygen-isotope and molecular temperature records, point to warm poles and no lasting ice at peak warmth. A proposed short-lived ice sheet around 91 million years ago (Bornemann et al. 2008) has been questioned by later work (Huber et al. 2018). Small mountain glaciers cannot be excluded, but large ice sheets do not fit the evidence.</p></div></div></div><div class="twist"><b>Still open</b><p>How high carbon dioxide rose, how hot the tropics became (some proxies suggest well above 35 °C), and why the poles were so warm with such a small pole-to-equator temperature difference are still debated. Sea-level estimates differ by more than 100 m depending on method.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 342 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Cretaceous Hothouse"><button type="button" class="wtoc-i" data-go="le-cretaceous-hothouse-s1">A planet without ice caps</button><button type="button" class="wtoc-i" data-go="le-cretaceous-hothouse-s2">The high seas</button><button type="button" class="wtoc-i" data-go="le-cretaceous-hothouse-s3">Seas without oxygen</button><button type="button" class="wtoc-i" data-go="le-cretaceous-hothouse-s4">What the hothouse left us</button></nav></div><section class="wsec" id="le-cretaceous-hothouse-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A planet without ice caps</h3><p>Imagine a world where the Arctic is forested, Antarctica is green and warm seas lap at the middle of North America. That was Earth for much of the mid-Cretaceous. Between about 120 and 80 million years ago, and especially around 94 million years ago, the planet ran hotter than in almost any later time. Dinosaurs lived in polar Alaska and southern Australia, where they endured months of winter darkness, but not deep, lasting ice.</p><blockquote class="wpull"><p>At its peak, the sea stood so high that North America was cut in two, and chalk piled up across much of Europe.</p></blockquote></section><section class="wsec" id="le-cretaceous-hothouse-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The high seas</h3><p>Why was sea level so high? With no ice sheets, all the water was in the ocean. More importantly, mid-ocean ridges were swollen and young seafloor was warm and buoyant, pushing water up onto the continents. How high it stood is debated. Kenneth Miller and colleagues, working from drill cores in New Jersey, estimate a peak about 100 m above today, give or take 50 m. Bilal Haq&#x27;s global synthesis puts the earliest Turonian peak near 240–250 m.</p><aside class="wcall"><b>How do we know?</b><p>Sea level is reconstructed from layers of shallow-sea rock. Where the shoreline moved inland, beach sands give way to deeper muds. Backstripping removes the effects of sinking crust and compacting sediment to estimate how much of the change was global. Temperatures come from oxygen isotopes in well-preserved fossil shells and from TEX86, a molecular fossil of marine microbes whose membranes change with water temperature.</p></aside></section><section class="wsec" id="le-cretaceous-hothouse-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Seas without oxygen</h3><p>Warm water holds less oxygen. Around 94 million years ago, during Oceanic Anoxic Event 2, large parts of the ocean floor became oxygen-starved. Organic matter that normally rots instead piled up as black shale, drawing down carbon. The event, probably triggered by volcanic outpourings, coincided with extinctions among plankton and other marine life. Hugh Jenkyns and others see these events as extreme responses of the ocean to carbon release and warming.</p></section><section class="wsec" id="le-cretaceous-hothouse-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>What the hothouse left us</h3><ul class="wlist"><li>Chalk: the White Cliffs of Dover and the chalk aquifers under London and Paris are built from coccolithophore plates.</li><li>Oil: organic-rich mid-Cretaceous muds are among the most productive petroleum source rocks known.</li><li>A lesson: a warm world without polar ice sheets had a far higher sea level, though today&#x27;s ocean ridges and continents are arranged differently.</li></ul><p>Nothing here maps directly onto our future, since Cretaceous warmth built up over millions of years. But it shows how much water can sit on the continents when the ice is gone.</p></section><details class="srcs"><summary>Sources for this entry (6)</summary><ol><li>Huber, B.T., MacLeod, K.G., Watkins, D.K. and Coffin, M.F. (2018). The rise and fall of the Cretaceous Hot Greenhouse climate. Global and Planetary Change 167: 1-23. <a href="https://doi.org/10.1016/j.gloplacha.2018.04.004" target="_blank" rel="noopener">doi:10.1016/j.gloplacha.2018.04.004</a></li><li>Miller, K.G. et al. (2005). The Phanerozoic record of global sea-level change. Science 310: 1293-1298. <a href="https://doi.org/10.1126/science.1116412" target="_blank" rel="noopener">doi:10.1126/science.1116412</a></li><li>Haq, B.U. (2014). Cretaceous eustasy revisited. Global and Planetary Change 113: 44-58. <a href="https://doi.org/10.1016/j.gloplacha.2013.12.007" target="_blank" rel="noopener">doi:10.1016/j.gloplacha.2013.12.007</a></li><li>Jenkyns, H.C. (2010). Geochemistry of oceanic anoxic events. Geochemistry, Geophysics, Geosystems 11: Q03004. <a href="https://doi.org/10.1029/2009GC002788" target="_blank" rel="noopener">doi:10.1029/2009GC002788</a></li><li>Klemme, H.D. and Ulmishek, G.F. (1991). Effective petroleum source rocks of the world: stratigraphic distribution and controlling depositional factors. AAPG Bulletin 75: 1809-1851.</li><li>Bornemann, A. et al. (2008). Isotopic evidence for glaciation during the Cretaceous supergreenhouse. Science 319: 189-192. <a href="https://doi.org/10.1126/science.1148777" target="_blank" rel="noopener">doi:10.1126/science.1148777</a></li></ol></details></div></script><script type="text/x-tpl" id="le-chicxulub-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Chicxulub impact - artist impression.jpg" data-cap="Chicxulub: The Day the Dinosaurs Died" data-big><figcaption></figcaption></figure><div class="sh-k">Mesozoic · Cretaceous-Paleogene boundary</div><h2 class="sh-t" id="le-chicxulub-st" tabindex="-1">Chicxulub: The Day the Dinosaurs Died</h2><p class="sh-s">c. 66 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Strong evidence</span></span></div></div><p class="v4-q">A rock about 10 kilometres across struck the Yucatán, darkened the sky and ended the age of dinosaurs in a geological instant.</p><div class="lx-nums" data-from="lxs-le-chicxulub"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-chicxulub"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>An asteroid impact was the main cause of the dinosaurs&#x27; extinction.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Iridium, shocked quartz, melt spherules and tsunami deposits sit at the same thin layer worldwide, the crater is dated to the boundary, and extinctions in well-sampled sections are abrupt at that layer. Precise dating shows major Deccan eruptions both before and after the impact, but studies combining climate models and fossil patterns find the impact best explains the extinction (Hull et al. 2020). Some researchers still give volcanism a larger role.</p></div></div></div><div class="twist"><b>Still open</b><p>How much the Deccan Traps contributed remains debated: precise dates show major eruptions both before and after the impact (Schoene et al. 2019; Sprain et al. 2019). Whether dinosaurs were already declining beforehand, and exactly how long the darkness lasted, are also still argued.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 382 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Chicxulub: The Day the Dinosaurs Died"><button type="button" class="wtoc-i" data-go="le-chicxulub-s1">A layer of clay</button><button type="button" class="wtoc-i" data-go="le-chicxulub-s2">Finding the crater</button><button type="button" class="wtoc-i" data-go="le-chicxulub-s3">The Deccan question</button><button type="button" class="wtoc-i" data-go="le-chicxulub-s4">After the darkness</button></nav></div><section class="wsec" id="le-chicxulub-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A layer of clay</h3><p>In 1980, physicist Luis Alvarez, his geologist son Walter and colleagues reported a thin layer of clay at the boundary between the Cretaceous and Paleogene periods, in Italy and elsewhere, loaded with iridium. Iridium is rare in Earth&#x27;s crust but common in many meteorites. They proposed that an asteroid about 10 km across had struck the Earth, throwing up dust that darkened the sky. Many geologists resisted the idea at first, but the evidence kept accumulating.</p><blockquote class="wpull"><p>The dinosaurs&#x27; world did not fade away over millions of years. The fossil record points to an ending measured in a geological instant.</p></blockquote></section><section class="wsec" id="le-chicxulub-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Finding the crater</h3><p>The missing piece was the crater. In 1991, Alan Hildebrand and colleagues identified it, buried under the Yucatán Peninsula near the town of Chicxulub, where geophysicists searching for oil had noticed a huge ring structure years earlier. The crater is about 180–200 km wide. Argon dating by Paul Renne&#x27;s team placed the impact about 66.04 million years ago, matching the extinction within tens of thousands of years or less.</p><aside class="wcall"><b>How do we know?</b><p>The case rests on several independent clues found at the same thin layer worldwide: iridium, shocked quartz grains that form only under extreme pressure, glassy droplets of melted rock, and tsunami deposits around the Gulf of Mexico. Radiometric dates for the crater&#x27;s melt rock and for ash beds near the boundary agree. Fossil counts show when groups disappear, and cores drilled into the crater itself in 2016 show how it formed.</p></aside></section><section class="wsec" id="le-chicxulub-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The Deccan question</h3><p>Not everyone thought the asteroid acted alone. In India, the Deccan Traps poured out vast stacks of lava around the same time, and some researchers argue their gases were already stressing life. Precise dating published in 2019 shows big eruption phases both before and after the impact. Most studies find the extinction pattern fits the impact best, with volcanic gases playing at most a supporting role (Hull et al. 2020). The debate continues.</p></section><section class="wsec" id="le-chicxulub-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>After the darkness</h3><p>Recent work adds detail. Models by Cem Berk Senel and colleagues suggest that fine silicate dust from pulverised rock lingered for years, shutting down photosynthesis for up to about two years. In 2024, Mario Fischer-Gödde&#x27;s team used ruthenium isotopes to argue the impactor was a carbonaceous asteroid that formed beyond Jupiter. Survivors were mostly small, generalist or sheltered animals, among them the ancestors of every mammal alive today, including us.</p></section><details class="srcs"><summary>Sources for this entry (8)</summary><ol><li>Alvarez, L.W., Alvarez, W., Asaro, F. and Michel, H.V. (1980). Extraterrestrial cause for the Cretaceous-Tertiary extinction. Science 208: 1095-1108. <a href="https://doi.org/10.1126/science.208.4448.1095" target="_blank" rel="noopener">doi:10.1126/science.208.4448.1095</a></li><li>Schulte, P. et al. (2010). The Chicxulub asteroid impact and mass extinction at the Cretaceous-Paleogene boundary. Science 327: 1214-1218. <a href="https://doi.org/10.1126/science.1177265" target="_blank" rel="noopener">doi:10.1126/science.1177265</a></li><li>Renne, P.R. et al. (2013). Time scales of critical events around the Cretaceous-Paleogene boundary. Science 339: 684-687. <a href="https://doi.org/10.1126/science.1230492" target="_blank" rel="noopener">doi:10.1126/science.1230492</a></li><li>Hull, P.M. et al. (2020). On impact and volcanism across the Cretaceous-Paleogene boundary. Science 367: 266-272. <a href="https://doi.org/10.1126/science.aay5055" target="_blank" rel="noopener">doi:10.1126/science.aay5055</a></li><li>Schoene, B. et al. (2019). U-Pb constraints on pulsed eruption of the Deccan Traps across the end-Cretaceous mass extinction. Science 363: 862-866. <a href="https://doi.org/10.1126/science.aau2422" target="_blank" rel="noopener">doi:10.1126/science.aau2422</a></li><li>Sprain, C.J. et al. (2019). The eruptive tempo of Deccan volcanism in relation to the Cretaceous-Paleogene boundary. Science 363: 866-870. <a href="https://doi.org/10.1126/science.aav1446" target="_blank" rel="noopener">doi:10.1126/science.aav1446</a></li><li>Senel, C.B. et al. (2023). Chicxulub impact winter sustained by fine silicate dust. Nature Geoscience 16: 1033-1040. <a href="https://doi.org/10.1038/s41561-023-01290-4" target="_blank" rel="noopener">doi:10.1038/s41561-023-01290-4</a></li><li>Fischer-Gödde, M. et al. (2024). Ruthenium isotopes show the Chicxulub impactor was a carbonaceous-type asteroid. Science 385: 752-756. <a href="https://doi.org/10.1126/science.adk4868" target="_blank" rel="noopener">doi:10.1126/science.adk4868</a></li></ol></details></div></script><script type="text/x-tpl" id="le-age-of-mammals-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Titanoboa Size and Giraffe Size.jpg" data-cap="Mammals Inherit the Earth" data-big><figcaption></figcaption></figure><div class="sh-k">Cenozoic · Paleocene</div><h2 class="sh-t" id="le-age-of-mammals-st" tabindex="-1">Mammals Inherit the Earth</h2><p class="sh-s">c. 66–56 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Mixed record</span></span></div></div><p class="v4-q">With the dinosaurs gone, small mammals grew, multiplied and spread, while a giant snake hunted in one of the first true tropical rainforests.</p><div class="lx-nums" data-from="lxs-le-age-of-mammals"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-age-of-mammals"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Mammals only began to flourish after the dinosaurs died out.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:50.0%" role="img" aria-label="Weight of evidence: Mixed record"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Jurassic and Cretaceous mammals were already varied: there were gliders, swimmers, diggers and even Repenomamus, which ate small dinosaurs. Molecular clocks suggest several modern mammal lineages split before the impact. But body size, numbers of species and ecological range jumped after it, as Corral Bluffs shows (Lyson et al. 2019), with maximum body size rising sharply (Smith et al. 2010). The claim is half right.</p></div></div></div><div class="twist"><b>Still open</b><p>How many placental mammal lineages crossed the boundary, and how quickly the modern orders arose, is still debated between fossil and molecular evidence. Whether Titanoboa&#x27;s size really records hotter tropics is contested. How tropical forests coped with such heat is also an open question.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 398 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Mammals Inherit the Earth"><button type="button" class="wtoc-i" data-go="le-age-of-mammals-s1">The morning after</button><button type="button" class="wtoc-i" data-go="le-age-of-mammals-s2">Snapshots from Corral Bluffs</button><button type="button" class="wtoc-i" data-go="le-age-of-mammals-s3">A primate relative at the dawn</button><button type="button" class="wtoc-i" data-go="le-age-of-mammals-s4">Tropical giants</button></nav></div><section class="wsec" id="le-age-of-mammals-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The morning after</h3><p>In the first years after the impact, the world was dark, cold and then hot, and food webs collapsed. The mammals that survived were mostly small, able to eat insects, seeds or whatever else they found. What happened next was one of the most important radiations in the history of life, and fossil sites in the American West capture it almost step by step.</p><blockquote class="wpull"><p>In the space of a few hundred thousand years, mammals began to fill the roles that dinosaurs had left empty.</p></blockquote></section><section class="wsec" id="le-age-of-mammals-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Snapshots from Corral Bluffs</h3><p>In 2019, Tyler Lyson and colleagues described a rich collection of fossils from Corral Bluffs, near Colorado Springs, found by splitting open concretions, hard lumps of rock that preserve skulls. The sequence covers the first million years after the impact. Mammal body sizes grew in steps that line up with changes in the plants: first walnut relatives, and later legumes, whose protein-rich seeds may have offered new food.</p></section><section class="wsec" id="le-age-of-mammals-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>A primate relative at the dawn</h3><p>One of the earliest new mammals matters to us directly. Purgatorius, a small animal known mostly from teeth and ankle bones, is considered one of the earliest members of the primate branch. In 2021, Gregory Wilson Mantilla and colleagues dated its oldest fossils, from Montana, to only about 105,000 to 139,000 years after the impact. Its ankle bones suggest it climbed trees, a habit that would shape the primate body.</p><aside class="wcall"><b>How do we know?</b><p>Dates this clos
