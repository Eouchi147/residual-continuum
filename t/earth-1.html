 claim on the scales</span><p>The Little Ice Age was a single, worldwide cold spell.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:50.0%" role="img" aria-label="Weight of evidence: Mixed record"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Many records agree that roughly 1300–1850 was cooler on average than the centuries before or since, and volcanic eruptions explain much of it (PAGES 2k Consortium 2019). But a global analysis of hundreds of records found the coldest decades came at different times in different regions, and no preindustrial period was globally synchronous, unlike today&#x27;s warming (Neukom et al. 2019). Cooler, yes; one worldwide freeze, no.</p></div></div></div><div class="twist"><b>Still open</b><p>How much the cold drove famine, revolt and migration, compared with war, taxation and disease, is debated. The relative roles of volcanoes, the sun and ocean circulation are still being weighed, as is why the Norse left Greenland: drought, cold, falling markets or choice.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 355 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Medieval Warmth and the Little Ice Age"><button type="button" class="wtoc-i" data-go="le-little-ice-age-s1">A warm spell that was not warm everywhere</button><button type="button" class="wtoc-i" data-go="le-little-ice-age-s2">Frost fairs and hungry years</button><button type="button" class="wtoc-i" data-go="le-little-ice-age-s3">Lessons from a small cooling</button></nav></div><section class="wsec" id="le-little-ice-age-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A warm spell that was not warm everywhere</h3><p>The centuries around 1000 CE are often called the Medieval Warm Period. Vineyards grew in England, and Norse voyagers settled Iceland and Greenland and reached North America. But the warmth was patchy. At the same time, western North America suffered droughts that lasted decades, longer than any in modern records (Cook et al. 2004). In the Southwest, the Ancestral Puebloans left Mesa Verde by around 1300, after a severe drought. Scientists now prefer the neutral name Medieval Climate Anomaly.</p><blockquote class="wpull"><p>The same centuries that felt mild in Europe brought decades of drought to the American West.</p></blockquote></section><section class="wsec" id="le-little-ice-age-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Frost fairs and hungry years</h3><p>From the 1300s, a cooler, more changeable climate set in across much of the Northern Hemisphere. Rivers froze. When the Thames iced over in London, helped by the narrow arches of old London Bridge, people held frost fairs with stalls, games and printing presses on the ice. Dutch painters such as Hendrick Avercamp filled canvases with skaters. The seventeenth century, among the coldest, saw wars, rebellions and famines from England to China (Parker 2013). Then in 1815 Tambora erupted, and the following summer brought snow in June to New England and hunger across Europe.</p><aside class="wcall"><b>How do we know?</b><p>Scientists combine tree rings, ice cores, corals, lake sediments and cave stalagmites into global reconstructions such as PAGES 2k. Written records add detail: dates of grape harvests, frozen rivers, ship logs and grain prices. Glacier positions are mapped from old paintings and from dated wood and moraines. Lake sediments beside Norse farms record rainfall through changes in plant waxes (Zhao et al. 2022).</p></aside></section><section class="wsec" id="le-little-ice-age-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Lessons from a small cooling</h3><p>The Little Ice Age cooled the Northern Hemisphere by only a fraction of a degree to about a degree on average, far less than today&#x27;s warming. Yet societies that depended on a narrow margin of harvests felt it deeply. People adapted: new crops such as potatoes, better storage, trade in grain and changing diets. The Norse in Greenland adjusted for centuries before they left. The story is a reminder that small shifts in average climate can reach deep into ordinary lives. It also shows that societies with stores, trade links and flexible farming coped far better than those living close to the edge.</p><ul class="wlist"><li>Medieval Climate Anomaly: roughly 950–1250, warm in places, megadroughts in others.</li><li>Little Ice Age: roughly 1300–1850, cooler in many regions but not all at once.</li><li>End: warming from the mid-1800s, soon overtaken by industrial greenhouse gases.</li></ul></section><h3 class="sub-h wsub">Go deeper</h3><div class="links-row"><button type="button" onclick="openItem('timeline','age-13')">Rises and Falls to 1500 <span aria-hidden="true">→</span></button></div><details class="srcs"><summary>Sources for this entry (7)</summary><ol><li>Neukom, R., Steiger, N., Gómez-Navarro, J.J., Wang, J. &amp; Werner, J.P. (2019). No evidence for globally coherent warm and cold periods over the preindustrial Common Era. Nature 571: 550-554. <a href="https://doi.org/10.1038/s41586-019-1401-2" target="_blank" rel="noopener">doi:10.1038/s41586-019-1401-2</a></li><li>PAGES 2k Consortium (2019). Consistent multidecadal variability in global temperature reconstructions and simulations over the Common Era. Nature Geoscience 12: 643-649. <a href="https://doi.org/10.1038/s41561-019-0400-0" target="_blank" rel="noopener">doi:10.1038/s41561-019-0400-0</a></li><li>Cook, E.R. et al. (2004). Long-term aridity changes in the western United States. Science 306: 1015-1018. <a href="https://doi.org/10.1126/science.1102586" target="_blank" rel="noopener">doi:10.1126/science.1102586</a></li><li>Zhao, B. et al. (2022). Prolonged drying trend coincident with the demise of Norse settlement in southern Greenland. Science Advances 8: eabm4346. <a href="https://doi.org/10.1126/sciadv.abm4346" target="_blank" rel="noopener">doi:10.1126/sciadv.abm4346</a></li><li>Oppenheimer, C. (2003). Climatic, environmental and human consequences of the largest known historic eruption: Tambora volcano (Indonesia) 1815. Progress in Physical Geography 27: 230-259. <a href="https://doi.org/10.1191/0309133303pp379ra" target="_blank" rel="noopener">doi:10.1191/0309133303pp379ra</a></li><li>Kennett, D.J. et al. (2012). Development and disintegration of Maya political systems in response to climate change. Science 338: 788-791. <a href="https://doi.org/10.1126/science.1226299" target="_blank" rel="noopener">doi:10.1126/science.1226299</a></li><li>Parker, G. (2013). Global Crisis: War, Climate Change and Catastrophe in the Seventeenth Century. Yale University Press.</li></ol></details></div></script><script type="text/x-tpl" id="le-anthropocene-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Mauna Loa CO2 monthly mean concentration.svg" data-cap="The Human Age: Carbon, Heat and Hope" data-big><figcaption></figcaption></figure><div class="sh-k">Holocene · Holocene: Meghalayan (industrial era)</div><h2 class="sh-t" id="le-anthropocene-st" tabindex="-1">The Human Age: Carbon, Heat and Hope</h2><p class="sh-s">1850 CE–today</p><div class="sh-v"><span class="vstamp vstamp--on vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Established</span></span></div></div><p class="v4-q">In under two centuries, burning coal, oil and gas lifted carbon dioxide to levels unseen for millions of years; the same ingenuity is now building ways back.</p><div class="lx-nums" data-from="lxs-le-anthropocene"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-anthropocene"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Human activity is the main cause of warming since 1950.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:91.7%" role="img" aria-label="Weight of evidence: Established"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The IPCC&#x27;s 2021 assessment calls it unequivocal that human influence has warmed the planet, estimating human-caused warming of about 1.07 °C (likely range 0.8–1.3 °C) from 1850–1900 to 2010–2019, essentially all of the observed warming (IPCC 2021). Independent lines agree: greenhouse physics, the chemical fingerprint of fossil carbon in the air, a cooling upper atmosphere above a warming surface, and the failure of solar or volcanic changes to explain the trend.</p></div></div></div><div class="twist"><b>Still open</b><p>How sensitive climate is to doubled CO2 (IPCC likely range 2.5–4 °C), how fast ice sheets may respond, and where tipping points lie are the main scientific uncertainties. How quickly emissions fall, and so how warm the century becomes, depends on choices still being made.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 342 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Human Age: Carbon, Heat and Hope"><button type="button" class="wtoc-i" data-go="le-anthropocene-s1">A new kind of climate driver</button><button type="button" class="wtoc-i" data-go="le-anthropocene-s2">What the deep past suggests</button><button type="button" class="wtoc-i" data-go="le-anthropocene-s3">Reasons for hope</button></nav></div><section class="wsec" id="le-anthropocene-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A new kind of climate driver</h3><p>For most of Earth&#x27;s history, climate changed because of orbits, volcanoes, the sun, drifting continents and life itself. From the 1800s a new driver appeared: people burning ancient carbon. Coal, oil and gas are the remains of plants and plankton buried over hundreds of millions of years. Burning them in two centuries has returned that carbon to the air at a pace that is, as far as the rock record shows, faster than any natural release in the last 66 million years (Zeebe et al. 2016). The atmosphere now holds more carbon dioxide than at any time in human existence.</p><blockquote class="wpull"><p>We are spending in two centuries the carbon that ancient forests and seas took hundreds of millions of years to bury.</p></blockquote></section><section class="wsec" id="le-anthropocene-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>What the deep past suggests</h3><p>Earth&#x27;s history offers rough guides. About 3 million years ago, in the Pliocene, carbon dioxide was at levels similar to today&#x27;s, the world was 2.5–4 °C warmer than before industry, and seas stood several metres higher (NOAA Climate.gov 2025; IPCC 2021). Ice sheets respond slowly, so today&#x27;s air may already commit us to higher seas over centuries. The deep past also shows that fast carbon releases, like one 56 million years ago, acidified oceans and reshuffled life, though ecosystems recovered over many thousands of years.</p><aside class="wcall"><b>How do we know?</b><p>Carbon dioxide has been measured directly at Mauna Loa since 1958, and air bubbles in Antarctic ice extend the record back 800,000 years. Fossil carbon lacks radiocarbon and is poor in carbon-13, and both signatures are rising in the air. Thermometers on land and at sea, satellites and ocean floats track warming. Wildlife trends come from tens of thousands of monitored populations (WWF 2024).</p></aside></section><section class="wsec" id="le-anthropocene-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Reasons for hope</h3><p>The story is not only loss. People have turned environmental tides before. The Montreal Protocol has put the ozone layer on course to recover. Humpback whales, once hunted close to vanishing, have returned in many oceans. Rewilded rivers, restored wetlands and protected forests are bringing species back. Clean energy is growing faster than almost anyone predicted, and solar power made up about three quarters of new renewable capacity in 2025 (IRENA 2026).</p><ul class="wlist"><li>Measured today: about 1.4 °C of warming, higher seas and an average 73% decline in monitored wildlife populations since 1970.</li><li>Still uncertain: how sensitive the climate is and how fast ice sheets respond.</li><li>Still possible: holding warming lower by cutting emissions, and restoring much of what was lost.</li></ul></section><details class="srcs"><summary>Sources for this entry (7)</summary><ol><li>IPCC (2021). Climate Change 2021: The Physical Science Basis. Contribution of Working Group I to the Sixth Assessment Report (Summary for Policymakers, Technical Summary and Chapters 2 and 9). Cambridge University Press. <a href="https://doi.org/10.1017/9781009157896" target="_blank" rel="noopener">doi:10.1017/9781009157896</a></li><li>NOAA Climate.gov (2025). Climate change: atmospheric carbon dioxide. https://www.climate.gov/news-features/understanding-climate/climate-change-atmospheric-carbon-dioxide</li><li>Met Office (2026). Mauna Loa carbon dioxide forecast for 2026 (reports the observed 2025 annual mean of 427.0 ppm). https://www.metoffice.gov.uk/research/climate/seasonal-to-decadal/long-range/forecasts/co2-forecast</li><li>WMO (2026). State of the Global Climate 2025 (WMO-No. 1391); press release &#x27;WMO confirms 2025 was one of warmest years on record&#x27;. World Meteorological Organization.</li><li>WWF (2024). Living Planet Report 2024: A System in Peril. WWF, Gland, Switzerland (Living Planet Index with ZSL).</li><li>IRENA (2026). Renewable Capacity Statistics 2026. International Renewable Energy Agency, Abu Dhabi.</li><li>Zeebe, R.E., Ridgwell, A. &amp; Zachos, J.C. (2016). Anthropogenic carbon release rate unprecedented during the past 66 million years. Nature Geoscience 9: 325-329. <a href="https://doi.org/10.1038/ngeo2681" target="_blank" rel="noopener">doi:10.1038/ngeo2681</a></li></ol></details></div></script>
