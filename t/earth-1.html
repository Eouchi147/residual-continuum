<script type="text/x-tpl" id="le-earth-forms-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Hadean.png" data-cap="The Earth and Moon are born" data-big><figcaption></figcaption></figure><div class="sh-k">Precambrian · Hadean</div><h2 class="sh-t" id="le-earth-forms-st" tabindex="-1">The Earth and Moon are born</h2><p class="sh-s">c. 4.567–4.4 billion years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Strong evidence</span></span></div></div><p class="v4-q">A young planet was struck by another world about the size of Mars, and from the glowing debris the Moon was born.</p><div class="lx-nums" data-from="lxs-le-earth-forms"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-earth-forms"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The Moon formed when a Mars-sized planet collided with the young Earth.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The giant-impact idea explains the Moon&#x27;s small iron core, its dry rocks, the fast spin of the Earth-Moon pair, and the near identical isotopes of lunar and Earth rocks. Simulations since 2001 can make a Moon this way. The main puzzle is that the Moon is almost too similar to Earth, which has pushed researchers toward variants: a more violent impact, a well-mixed debris cloud, or an impactor born near Earth.</p></div></div></div><div class="twist"><b>Still open</b><p>Theia&#x27;s size, speed and birthplace are still debated, and so is the Moon&#x27;s exact age, with estimates spread over more than 100 million years. A 2023 study proposed that pieces of Theia survive as two continent-sized blobs deep in Earth&#x27;s mantle. That idea is new and far from confirmed.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 508 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Earth and Moon are born"><button type="button" class="wtoc-i" data-go="le-earth-forms-s1">A planet built from dust</button><button type="button" class="wtoc-i" data-go="le-earth-forms-s2">The collision that made the Moon</button><button type="button" class="wtoc-i" data-go="le-earth-forms-s3">A world of magma</button><button type="button" class="wtoc-i" data-go="le-earth-forms-s4">What the Moon gave us</button></nav></div><section class="wsec" id="le-earth-forms-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A planet built from dust</h3><p>The Solar System&#x27;s clock starts with the oldest grains found in meteorites. Dating their uranium and lead, Connelly and colleagues (2012) placed them at about 4,567.3 million years ago. Around the newborn Sun, dust stuck together into pebbles, pebbles into rocky bodies, and those bodies crashed into one another. Within a few tens of millions of years, one of the survivors had grown into the Earth. Heat from collisions and from radioactive elements melted much of it, and heavy iron sank inward to form the core.</p><blockquote class="wpull"><p>Everything we stand on was once a cloud of dust and gas, circling a star that had only just switched on.</p></blockquote></section><section class="wsec" id="le-earth-forms-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The collision that made the Moon</h3><p>The Moon is strange for a moon. It is very large compared with its planet, it has only a small iron core, and its rocks are poor in water and other easily boiled elements. In 2001, Canup and Asphaug showed with computer simulations that a glancing blow from a Mars-sized body late in Earth&#x27;s growth could throw out a disc of hot debris that gathered into a Moon. The impactor is often called Theia, after the mother of the Moon goddess in Greek myth.</p><p>A puzzle remains. Moon rocks and Earth rocks have nearly identical isotope fingerprints, as if both came from the same source. One answer arrived in 2025: Hopp and colleagues compared isotopes of several elements and argued that Theia formed in the inner Solar System, close to Earth, so the two worlds were made of similar stuff from the start.</p></section><section class="wsec" id="le-earth-forms-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>A world of magma</h3><p>For a time after the impact, the Earth&#x27;s surface was probably a sea of molten rock under an atmosphere of vapour. The Moon hung much closer than it does now, looking many times larger in the sky, and its pull raised tides in the magma and later in the first seas. As the surface cooled, a dark crust formed and water began to rain out. Zircon crystals from the Moon suggest its own crust had formed by about 4.51 billion years ago (Barboni et al. 2017), though other methods point to younger ages.</p><aside class="wcall"><b>How do we know?</b><p>Ages come from radioactive clocks: uranium decaying to lead in meteorite grains and zircon crystals, and hafnium decaying to tungsten, which records when cores formed. The Moon story comes from rocks carried home by the Apollo astronauts and Soviet Luna probes, from comparing their oxygen, titanium and other isotopes with Earth rocks, and from computer simulations of impacts. No rock from Earth&#x27;s first few hundred million years survives, so much of this age is reconstructed rather than observed.</p></aside></section><section class="wsec" id="le-earth-forms-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>What the Moon gave us</h3><p>The Moon still shapes life on Earth. Its pull, together with the Sun&#x27;s, drives the tides that flush estuaries and set the clocks of countless shore animals. It also steadies Earth&#x27;s tilt: calculations by Laskar and colleagues (1993) suggest that without a large Moon the tilt could swing chaotically over long spans, bringing wild changes in seasons. Tidal friction slowly lengthens our day, while the Moon drifts away by a few centimetres a year, a rate measured with laser reflectors left on its surface by Apollo crews.</p><ul class="wlist"><li>Tides that shape coasts and shore ecosystems</li><li>A fairly stable axis and regular seasons</li><li>A preserved record of the early Solar System</li><li>A night light that every human culture has watched and named</li></ul></section><details class="srcs"><summary>Sources for this entry (6)</summary><ol><li>Connelly, J.N. et al. (2012). The absolute chronology and thermal processing of solids in the solar protoplanetary disk. Science 338: 651-655. <a href="https://doi.org/10.1126/science.1226919" target="_blank" rel="noopener">doi:10.1126/science.1226919</a></li><li>Canup, R.M. and Asphaug, E. (2001). Origin of the Moon in a giant impact near the end of the Earth&#x27;s formation. Nature 412: 708-712. <a href="https://doi.org/10.1038/35089010" target="_blank" rel="noopener">doi:10.1038/35089010</a></li><li>Barboni, M. et al. (2017). Early formation of the Moon 4.51 billion years ago. Science Advances 3: e1602365. <a href="https://doi.org/10.1126/sciadv.1602365" target="_blank" rel="noopener">doi:10.1126/sciadv.1602365</a></li><li>Laskar, J., Joutel, F. and Robutel, P. (1993). Stabilization of the Earth&#x27;s obliquity by the Moon. Nature 361: 615-617. <a href="https://doi.org/10.1038/361615a0" target="_blank" rel="noopener">doi:10.1038/361615a0</a></li><li>Yuan, Q. et al. (2023). Moon-forming impactor as a source of Earth&#x27;s basal mantle anomalies. Nature 623: 95-99. <a href="https://doi.org/10.1038/s41586-023-06589-1" target="_blank" rel="noopener">doi:10.1038/s41586-023-06589-1</a></li><li>Hopp, T., Dauphas, N., Boyet, M., Jacobson, S.A. and Kleine, T. (2025). The Moon-forming impactor Theia originated from the inner Solar System. Science 390: 819-823. <a href="https://doi.org/10.1126/science.ado0623" target="_blank" rel="noopener">doi:10.1126/science.ado0623</a></li></ol></details></div></script><script type="text/x-tpl" id="le-first-oceans-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Zircon microscope.jpg" data-cap="The first oceans and a cool early Earth" data-big><figcaption></figcaption></figure><div class="sh-k">Precambrian · Hadean</div><h2 class="sh-t" id="le-first-oceans-st" tabindex="-1">The first oceans and a cool early Earth</h2><p class="sh-s">c. 4.4–4.0 billion years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Strong evidence</span></span></div></div><p class="v4-q">Zircon grains thinner than a hair hint that Earth had liquid water within a few hundred million years of its birth.</p><div class="lx-nums" data-from="lxs-le-first-oceans"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-first-oceans"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Liquid water existed at Earth&#x27;s surface within about 300 million years of the planet&#x27;s formation.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Two teams in 2001 found heavy oxygen in Jack Hills zircons about 4.4 to 4.3 billion years old, a signature of rock altered by liquid water near the surface before it melted. Later atom-probe work showed the ages are not artefacts of lead moving inside the crystals. The case still rests on rare grains from a small part of Western Australia, which is why it is strong rather than settled.</p></div></div></div><div class="twist"><b>Still open</b><p>How large were the oceans, and was there land above them? Some researchers picture a water world with a few volcanic islands; others argue for continents and even plate tectonics by 4.4 billion years ago. The oldest grains come mostly from one Australian range, so they may not speak for the whole planet.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 422 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The first oceans and a cool early Earth"><button type="button" class="wtoc-i" data-go="le-first-oceans-s1">Grains older than any rock</button><button type="button" class="wtoc-i" data-go="le-first-oceans-s2">Water written in oxygen</button><button type="button" class="wtoc-i" data-go="le-first-oceans-s3">Rain on early land?</button><button type="button" class="wtoc-i" data-go="le-first-oceans-s4">An early window for life</button></nav></div><section class="wsec" id="le-first-oceans-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Grains older than any rock</h3><p>In the Jack Hills of Western Australia, an ancient pebbly sandstone holds tiny crystals of zircon. The sandstone is roughly 3 billion years old, but some of its grains are far older: they eroded from rocks that have since vanished completely. Zircon is almost indestructible. It survives erosion, burial and even melting of the rock around it, carrying a chemical record of where it formed. In 2001, Wilde and colleagues dated one grain to about 4.404 billion years, the oldest known fragment of our planet.</p><blockquote class="wpull"><p>A speck of crystal, smaller than a grain of sand, is our only witness to Earth&#x27;s first oceans.</p></blockquote></section><section class="wsec" id="le-first-oceans-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Water written in oxygen</h3><p>Oxygen has a heavy and a light form. Rocks that have been weathered or altered by water at low temperature become richer in the heavy form, and zircons that later grow from melted versions of those rocks inherit the signal. Wilde&#x27;s team and, in the same issue of Nature, Mojzsis and colleagues found this heavy oxygen in grains more than 4.3 billion years old. The simplest reading is that liquid water already existed at the surface. Valley and colleagues (2002) called this a &#x27;cool early Earth&#x27;, replacing the image of a hellish Hadean.</p><aside class="wcall"><b>How do we know?</b><p>Each zircon is dated by measuring uranium and the lead it has decayed into, often spot by spot with an ion probe. Oxygen isotopes are measured in the same spots. Critics asked whether lead might have moved inside the crystals, making them look older. Valley and colleagues (2014) used atom-probe tomography, mapping individual atoms, and found the lead clusters formed long after the crystal, supporting a true age of about 4.374 billion years.</p></aside></section><section class="wsec" id="le-first-oceans-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Rain on early land?</h3><p>In 2024, Gamaleldien and colleagues analysed many Jack Hills zircons and found some with unusually light oxygen around 4 billion years ago. Light oxygen is typical of fresh water, such as rain and snowmelt. They argued that land stood above the sea and a hydrological cycle of rain, rivers and evaporation was already running. The result is recent and depends on how the grains are interpreted, but it adds to the view that Earth became a watery world quickly.</p></section><section class="wsec" id="le-first-oceans-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>An early window for life</h3><p>If water was stable so early, life had a long window to begin. Bell and colleagues (2015) found graphite sealed inside a 4.1-billion-year-old zircon, with a carbon signature that is consistent with biology but not unique to it. Nothing in these grains shows life for certain. What they do show is that the ingredients most often linked with life, liquid water and a solid crust, were in place far earlier than scientists once assumed.</p></section><details class="srcs"><summary>Sources for this entry (6)</summary><ol><li>Wilde, S.A., Valley, J.W., Peck, W.H. and Graham, C.M. (2001). Evidence from detrital zircons for the existence of continental crust and oceans on the Earth 4.4 Gyr ago. Nature 409: 175-178. <a href="https://doi.org/10.1038/35051550" target="_blank" rel="noopener">doi:10.1038/35051550</a></li><li>Mojzsis, S.J., Harrison, T.M. and Pidgeon, R.T. (2001). Oxygen-isotope evidence from ancient zircons for liquid water at the Earth&#x27;s surface 4,300 Myr ago. Nature 409: 178-181. <a href="https://doi.org/10.1038/35051557" target="_blank" rel="noopener">doi:10.1038/35051557</a></li><li>Valley, J.W. et al. (2002). A cool early Earth. Geology 30: 351-354. <a href="https://doi.org/10.1130/0091-7613(2002)030&lt;0351:ACEE&gt;2.0.CO;2" target="_blank" rel="noopener">doi:10.1130/0091-7613(2002)030&lt;0351:ACEE&gt;2.0.CO;2</a></li><li>Valley, J.W. et al. (2014). Hadean age for a post-magma-ocean zircon confirmed by atom-probe tomography. Nature Geoscience 7: 219-223. <a href="https://doi.org/10.1038/ngeo2075" target="_blank" rel="noopener">doi:10.1038/ngeo2075</a></li><li>Gamaleldien, H. et al. (2024). Onset of the Earth&#x27;s hydrological cycle four billion years ago or earlier. Nature Geoscience 17: 560-565. <a href="https://doi.org/10.1038/s41561-024-01450-0" target="_blank" rel="noopener">doi:10.1038/s41561-024-01450-0</a></li><li>Bell, E.A., Boehnke, P., Harrison, T.M. and Mao, W.L. (2015). Potentially biogenic carbon preserved in a 4.1 billion-year-old zircon. PNAS 112: 14518-14521. <a href="https://doi.org/10.1073/pnas.1517557112" target="_blank" rel="noopener">doi:10.1073/pnas.1517557112</a></li></ol></details></div></script><script type="text/x-tpl" id="le-late-bombardment-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Mare Imbrium-AS17-M-2444.jpg" data-cap="The Late Heavy Bombardment" data-big><figcaption></figcaption></figure><div class="sh-k">Precambrian · Hadean to Eoarchean</div><h2 class="sh-t" id="le-late-bombardment-st" tabindex="-1">The Late Heavy Bombardment</h2><p class="sh-s">c. 4.1–3.8 billion years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Open question</span></span></div></div><p class="v4-q">The Moon&#x27;s scarred face was read as a sudden storm of asteroids. Rocks from its far side now suggest a long, slow decline instead.</p><div class="lx-nums" data-from="lxs-le-late-bombardment"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-late-bombardment"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>A sudden spike of impacts, a &#x27;lunar cataclysm&#x27;, struck the inner Solar System about 3.9 billion years ago.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:41.7%" role="img" aria-label="Weight of evidence: Open question"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The spike rests on Apollo rock ages clustering near 3.9 billion years. But the Apollo and Luna landings were all on the near side, close to the huge Imbrium basin, whose debris may have reset many of those clocks. Boehnke and Harrison (2016) showed how partial resetting of argon ages can create an illusory spike. Far-side Chang&#x27;e-6 melts published in 2026 spread over three billion years, favouring a gradual decline.</p></div></div></div><div class="twist"><b>Still open</b><p>Was there a smaller, later bump in impacts, perhaps driven by the giant planets shifting orbits as in the Nice model, or only a smooth decline after the planets formed? How old are the big lunar basins, and how often was the early Earth hit? The answers change when life could first have settled in.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 420 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Late Heavy Bombardment"><button type="button" class="wtoc-i" data-go="le-late-bombardment-s1">A storm read in Moon rocks</button><button type="button" class="wtoc-i" data-go="le-late-bombardment-s2">The problem with where we sampled</button><button type="button" class="wtoc-i" data-go="le-late-bombardment-s3">News from the far side</button><button type="button" class="wtoc-i" data-go="le-late-bombardment-s4">What it meant for Earth</button></nav></div><section class="wsec" id="le-late-bombardment-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A storm read in Moon rocks</h3><p>When the Apollo samples reached laboratories in the early 1970s, many impact-melted rocks gave strikingly similar ages, around 3.9 billion years. Tera, Papanastassiou and Wasserburg (1974) proposed a &#x27;terminal lunar cataclysm&#x27;: a short, violent shower of impacts long after the planets had formed. The idea gained a mechanism in 2005, when Gomes and colleagues modelled how a late rearrangement of Jupiter, Saturn, Uranus and Neptune could fling asteroids and comets inward. For three decades, the Late Heavy Bombardment was a fixture of textbooks and documentaries.</p></section><section class="wsec" id="le-late-bombardment-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The problem with where we sampled</h3><p>Every Apollo and Luna site lies on the Moon&#x27;s near side, and several sit close to the Imbrium basin. One giant impact can scatter melt and reset clocks across a whole hemisphere, so a cluster of ages may record one or two basins rather than a solar-system-wide storm. Boehnke and Harrison (2016) went further. They showed that the argon-argon method, which many lunar ages rely on, can produce an apparent spike even when impacts were declining smoothly, because later heating partly resets older rocks.</p><blockquote class="wpull"><p>A spike in the data is not always a spike in history. Sometimes it is a portrait of where we happened to look.</p></blockquote><aside class="wcall"><b>How do we know?</b><p>Impact melts are dated with radioactive clocks, mainly argon-argon and uranium-lead. Crater counting adds relative ages: older surfaces carry more craters, calibrated against dated samples. Tiny glassy spherules from vaporised rock, found in ancient sea-floor layers on Earth, record large impacts directly. Each method has blind spots, such as heat resetting clocks, which is why sampling from new places matters so much.</p></aside></section><section class="wsec" id="le-late-bombardment-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>News from the far side</h3><p>In 2024 China&#x27;s Chang&#x27;e-6 mission returned the first samples from the Moon&#x27;s far side, from the Apollo basin inside the vast South Pole-Aitken basin. In 2026, Zhang and colleagues reported argon-argon ages from its impact melt rocks spreading from about 4.33 to 1.13 billion years ago, with no pile-up near 3.9. Their reading is that lunar bombardment declined gradually rather than peaking in a cataclysm. This is a significant change in the picture, though it rests on one landing site.</p></section><section class="wsec" id="le-late-bombardment-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>What it meant for Earth</h3><p>Whether storm or long decline, the early Earth was hit far more often than today. Abramov and Mojzsis (2009) modelled even an intense bombardment and found that parts of the crust stayed cool enough for heat-loving microbes. Impacts continued long after: spherule beds in South Africa record several very large strikes between 3.42 and 3.23 billion years ago. Reviews such as Bottke and Norman (2017) weigh a sharp late spike against a slower tail of planet building, and the new far-side data now tilt that balance.</p></section><details class="srcs"><summary>Sources for this entry (7)</summary><ol><li>Tera, F., Papanastassiou, D.A. and Wasserburg, G.J. (1974). Isotopic evidence for a terminal lunar cataclysm. Earth and Planetary Science Letters 22: 1-21. <a href="https://doi.org/10.1016/0012-821X(74)90059-4" target="_blank" rel="noopener">doi:10.1016/0012-821X(74)90059-4</a></li><li>Gomes, R. et al. (2005). Origin of the cataclysmic Late Heavy Bombardment period of the terrestrial planets. Nature 435: 466-469. <a href="https://doi.org/10.1038/nature03676" target="_blank" rel="noopener">doi:10.1038/nature03676</a></li><li>Boehnke, P. and Harrison, T.M. (2016). Illusory Late Heavy Bombardments. PNAS 113: 10802-10806. <a href="https://doi.org/10.1073/pnas.1611535113" target="_blank" rel="noopener">doi:10.1073/pnas.1611535113</a></li><li>Bottke, W.F. and Norman, M.D. (2017). The Late Heavy Bombardment. Annual Review of Earth and Planetary Sciences 45: 619-647. <a href="https://doi.org/10.1146/annurev-earth-063016-020131" target="_blank" rel="noopener">doi:10.1146/annurev-earth-063016-020131</a></li><li>Zhang, W. et al. (2026). The bombardment history on the lunar farside revealed by 40Ar/39Ar geochronology of Chang&#x27;e-6 impact melt rocks. Science Advances 12. <a href="https://doi.org/10.1126/sciadv.aee8718" target="_blank" rel="noopener">doi:10.1126/sciadv.aee8718</a></li><li>Abramov, O. and Mojzsis, S.J. (2009). Microbial habitability of the Hadean Earth during the late heavy bombardment. Nature 459: 419-422. <a href="https://doi.org/10.1038/nature08015" target="_blank" rel="noopener">doi:10.1038/nature08015</a></li><li>Lowe, D.R. et al. (2014). Recently discovered 3.42-3.23 Ga impact layers, Barberton Belt, South Africa. Geology 42: 747-750. <a href="https://doi.org/10.1130/G35743.1" target="_blank" rel="noopener">doi:10.1130/G35743.1</a></li></ol></details></div></script><script type="text/x-tpl" id="le-faint-sun-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Earth in the early Archean.png" data-cap="The faint young Sun paradox" data-big><figcaption></figcaption></figure><div class="sh-k">Precambrian · Archean</div><h2 class="sh-t" id="le-faint-sun-st" tabindex="-1">The faint young Sun paradox</h2><p class="sh-s">c. 4.0–2.5 billion years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Strong evidence</span></span></div></div><p class="v4-q">The young Sun shone roughly a quarter weaker than today, enough to freeze the oceans, yet the rocks record liquid water. Something kept Earth warm.</p><div class="lx-nums" data-from="lxs-le-faint-sun"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-faint-sun"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>A stronger greenhouse, mainly carbon dioxide and methane, kept the young Earth from freezing under a faint Sun.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The Sun&#x27;s early faintness follows from well-tested stellar physics, and the rocks record liquid water, so extra warming is needed. Climate models reviewed by Feulner (2012) and Charnay and colleagues (2020) find that carbon dioxide at many times today&#x27;s level, plus methane, can do the job within the limits set by ancient soils and minerals. Other factors, such as fewer clouds or less land, probably helped.</p></div></div></div><div class="twist"><b>Still open</b><p>How much carbon dioxide was really in the air is poorly pinned down, because estimates from ancient soils and minerals disagree. The roles of clouds, a thinner atmosphere, hydrogen and the amount of land also matter. Rosing and colleagues (2010) argued that fewer clouds and darker oceans reduce the need for greenhouse gases.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 416 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The faint young Sun paradox"><button type="button" class="wtoc-i" data-go="le-faint-sun-s1">A dim star</button><button type="button" class="wtoc-i" data-go="le-faint-sun-s2">Warm seas anyway</button><button type="button" class="wtoc-i" data-go="le-faint-sun-s3">Greenhouse gases and an orange sky</button><button type="button" class="wtoc-i" data-go="le-faint-sun-s4">An answer, mostly</button></nav></div><section class="wsec" id="le-faint-sun-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A dim star</h3><p>Stars like the Sun grow brighter as they age. As hydrogen in the core fuses into helium, the core becomes denser and hotter and burns faster. Standard models, summarised by Gough (1981), suggest the newborn Sun gave about 70% of the light it gives today. In 1972, Carl Sagan and George Mullen pointed out the problem: with today&#x27;s atmosphere, that much less sunlight would have left the Earth frozen for much of its first two billion years. The rocks say otherwise.</p><blockquote class="wpull"><p>A planet under a weaker Sun kept liquid seas for billions of years. Its air did the work its star could not.</p></blockquote></section><section class="wsec" id="le-faint-sun-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Warm seas anyway</h3><p>Archean rocks are full of signs of liquid water: sediments sorted by currents, lavas that cooled into pillow shapes on the sea floor, and stromatolites built by microbes in shallow water. Glacial deposits are rare for most of the eon. So the early Earth was, on average, not a frozen world, even though its Sun was weaker. Something about its atmosphere or surface must have trapped more heat or reflected less light than today.</p><aside class="wcall"><b>How do we know?</b><p>The Sun&#x27;s past brightness comes from models of stellar interiors, tested against the Sun&#x27;s own vibrations and against other stars of different ages. The early climate is read from rocks: sediments that need liquid water, the chemistry of ancient soils, which limits how much carbon dioxide was in the air, and gas bubbles in lava or fossil raindrop prints, which hint at air pressure. Climate models then test which mixtures of gases and clouds can match the evidence.</p></aside></section><section class="wsec" id="le-faint-sun-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Greenhouse gases and an orange sky</h3><p>Carbon dioxide is the first suspect. Volcanoes release it constantly, and on a cold planet it builds up because rock weathering, which removes it, slows down. This natural thermostat works over hundreds of thousands to millions of years. Methane is the second suspect. Without oxygen to destroy it, methane from microbes could reach high levels. With enough methane, Arney and colleagues (2016) found that an orange organic haze would form, cooling the surface somewhat but also shielding life from ultraviolet light.</p></section><section class="wsec" id="le-faint-sun-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>An answer, mostly</h3><p>Reviews by Feulner (2012) and Charnay and colleagues (2020) conclude that a combination of carbon dioxide and methane can explain a mostly unfrozen Archean, especially in three-dimensional climate models. Details remain uncertain. Som and colleagues (2016) found the air may have been less than half as dense as today, which weakens the greenhouse. Rosing and colleagues (2010) argued that fewer clouds and darker seas soaked up more sunlight. The paradox is less a mystery now than an open accounting problem.</p></section><details class="srcs"><summary>Sources for this entry (7)</summary><ol><li>Sagan, C. and Mullen, G. (1972). Earth and Mars: evolution of atmospheres and surface temperatures. Science 177: 52-56. <a href="https://doi.org/10.1126/science.177.4043.52" target="_blank" rel="noopener">doi:10.1126/science.177.4043.52</a></li><li>Gough, D.O. (1981). Solar interior structure and luminosity variations. Solar Physics 74: 21-34. <a href="https://doi.org/10.1007/BF00151270" target="_blank" rel="noopener">doi:10.1007/BF00151270</a></li><li>Feulner, G. (2012). The faint young Sun problem. Reviews of Geophysics 50: RG2006. <a href="https://doi.org/10.1029/2011RG000375" target="_blank" rel="noopener">doi:10.1029/2011RG000375</a></li><li>Charnay, B. et al. (2020). Is the faint young Sun problem for Earth solved? Space Science Reviews 216: 90. <a href="https://doi.org/10.1007/s11214-020-00711-9" target="_blank" rel="noopener">doi:10.1007/s11214-020-00711-9</a></li><li>Arney, G. et al. (2016). The pale orange dot: the spectrum and habitability of hazy Archean Earth. Astrobiology 16: 873-899. <a href="https://doi.org/10.1089/ast.2015.1422" target="_blank" rel="noopener">doi:10.1089/ast.2015.1422</a></li><li>Som, S.M. et al. (2016). Earth&#x27;s air pressure 2.7 billion years ago constrained to less than half of modern levels. Nature Geoscience 9: 448-451. <a href="https://doi.org/10.1038/ngeo2713" target="_blank" rel="noopener">doi:10.1038/ngeo2713</a></li><li>Rosing, M.T., Bird, D.K., Sleep, N.H. and Bjerrum, C.J. (2010). No climate paradox under the faint early Sun. Nature 464: 744-747. <a href="https://doi.org/10.1038/nature08955" target="_blank" rel="noopener">doi:10.1038/nature08955</a></li></ol></details></div></script><script type="text/x-tpl" id="le-first-life-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Stromatolite (Strelley Pool Formation, Paleoarchean, 3.35-3.46 Ga; East Strelley Greenstone Belt, Pilbara Craton, Western Australia) 1 (17346619166).jpg" data-cap="The first life leaves its mark" data-big><figcaption></figcaption></figure><div class="sh-k">Precambrian · Eoarchean to Paleoarchean</div><h2 class="sh-t" id="le-first-life-st" tabindex="-1">The first life leaves its mark</h2><p class="sh-s">c. 3.8–3.4 billion years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Open question</span></span></div></div><p class="v4-q">Layered mounds in Australian rock record microbial mats about 3.5 billion years old. Older claims, back to 3.7 billion years and beyond, are fiercely argued.</p><div class="lx-nums" data-from="lxs-le-first-life"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-first-life"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Fossils show that life existed on Earth more than 3.7 billion years ago.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:41.7%" role="img" aria-label="Weight of evidence: Open question"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Evidence from 3.48–3.43 billion years ago is widely accepted, with several independent lines: reef-like stromatolites, microfossils and chemical traces. Older claims are much weaker. The 3.7-billion-year-old Isua &#x27;stromatolites&#x27; in Greenland were reinterpreted by Allwood and colleagues (2018) as deformed rock. The Nuvvuagittuq tubes could be mineral growths. Genetic clocks place life earlier still, but they are estimates, not fossils.</p></div></div></div><div class="twist"><b>Still open</b><p>Did life begin in hot springs on land or at deep-sea vents? How soon did it appear after the Earth cooled, and could non-living chemistry mimic every sign we use to spot it? New methods, from atom-scale imaging to machine learning applied to ancient organic molecules, are re-examining the oldest rocks.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 432 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The first life leaves its mark"><button type="button" class="wtoc-i" data-go="le-first-life-s1">Reefs built by microbes</button><button type="button" class="wtoc-i" data-go="le-first-life-s2">Life in hot springs?</button><button type="button" class="wtoc-i" data-go="le-first-life-s3">The oldest claims</button><button type="button" class="wtoc-i" data-go="le-first-life-s4">Reading the family tree</button></nav></div><section class="wsec" id="le-first-life-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Reefs built by microbes</h3><p>Stromatolites are rocks made by life. Sticky mats of microbes trap grains of sediment, grow up through them toward the light, and trap more, building layer upon layer into domes, cones and columns. At Strelley Pool in Western Australia, Allwood and colleagues (2006) described a fossil reef about 3.43 billion years old with several distinct stromatolite shapes arranged in different settings, like a real community rather than a chemical accident. In the same rocks, Wacey and colleagues (2011) found tiny cell-like bodies with walls, clustered and associated with pyrite, pointing to microbes that lived on sulphur.</p><blockquote class="wpull"><p>The first builders on Earth were not animals or people but films of microbes, patiently raising reefs grain by grain.</p></blockquote></section><section class="wsec" id="le-first-life-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Life in hot springs?</h3><p>In the nearby Dresser Formation, rocks about 3.48 billion years old contain stromatolites and mineral deposits of the kind that form around hot springs and geysers on land. Djokic and colleagues (2017) argued that these record microbial life in freshwater pools, not only in the sea. If they are right, the idea that life began, or at least thrived early, in land-based hot springs gains support, alongside the older idea that it began at deep-sea hydrothermal vents.</p></section><section class="wsec" id="le-first-life-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The oldest claims</h3><p>In 2016, Nutman and colleagues reported small cone-shaped stromatolites in 3.7-billion-year-old rocks at Isua, Greenland. Two years later, Allwood and colleagues re-examined the outcrop in three dimensions and concluded the shapes were probably produced by squeezing and folding of the rock, not by microbes. In Canada, Dodd and colleagues (2017) described tubes and filaments of iron oxide in rocks that may be 3.77 to 4.28 billion years old, resembling bacteria at modern vents. Many researchers remain unconvinced, since similar structures can grow without life.</p><aside class="wcall"><b>How do we know?</b><p>Researchers look for several signs that agree. Shape: structures that match living microbes or mats. Chemistry: carbon enriched in its light form, which living things prefer. Context: a setting where life could live, and minerals that formed at the same time as the structures. And they try to rule out non-living mimics, because heat, pressure and mineral growth can copy many of these signs. The older the rock, the more it has been cooked and deformed.</p></aside></section><section class="wsec" id="le-first-life-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Reading the family tree</h3><p>A different approach works backward from living things. By comparing genes across all life and calibrating them with fossils, Moody and colleagues (2024) estimated that LUCA, the last universal common ancestor of all living cells, lived about 4.2 billion years ago and was already a fairly complex microbe. That would mean life began remarkably soon after the Earth formed. Such estimates carry wide uncertainties, but they fit a growing sense that the planet did not stay lifeless for long.</p></section><details class="srcs"><summary>Sources for this entry (8)</summary><ol><li>Allwood, A.C. et al. (2006). Stromatolite reef from the Early Archaean era of Australia. Nature 441: 714-718. <a href="https://doi.org/10.1038/nature04764" target="_blank" rel="noopener">doi:10.1038/nature04764</a></li><li>Wacey, D. et al. (2011). Microfossils of sulphur-metabolizing cells in 3.4-billion-year-old rocks of Western Australia. Nature Geoscience 4: 698-702. <a href="https://doi.org/10.1038/ngeo1238" target="_blank" rel="noopener">doi:10.1038/ngeo1238</a></li><li>Djokic, T. et al. (2017). Earliest signs of life on land preserved in ca. 3.5 Ga hot spring deposits. Nature Communications 8: 15263. <a href="https://doi.org/10.1038/ncomms15263" target="_blank" rel="noopener">doi:10.1038/ncomms15263</a></li><li>Nutman, A.P. et al. (2016). Rapid emergence of life shown by discovery of 3,700-million-year-old microbial structures. Nature 537: 535-538. <a href="https://doi.org/10.1038/nature19355" target="_blank" rel="noopener">doi:10.1038/nature19355</a></li><li>Allwood, A.C. et al. (2018). Reassessing evidence of life in 3,700-million-year-old rocks of Greenland. Nature 563: 241-244. <a href="https://doi.org/10.1038/s41586-018-0610-4" target="_blank" rel="noopener">doi:10.1038/s41586-018-0610-4</a></li><li>Dodd, M.S. et al. (2017). Evidence for early life in Earth&#x27;s oldest hydrothermal vent precipitates. Nature 543: 60-64. <a href="https://doi.org/10.1038/nature21377" target="_blank" rel="noopener">doi:10.1038/nature21377</a></li><li>Moody, E.R.R. et al. (2024). The nature of the last universal common ancestor and its impact on the early Earth system. Nature Ecology &amp; Evolution 8: 1654-1666. <a href="https://doi.org/10.1038/s41559-024-02461-1" target="_blank" rel="noopener">doi:10.1038/s41559-024-02461-1</a></li><li>Wong, M.L. et al. (2025). Organic geochemical evidence for life in Archean rocks identified by pyrolysis-GC-MS and supervised machine learning. PNAS 122. <a href="https://doi.org/10.1073/pnas.2514534122" target="_blank" rel="noopener">doi:10.1073/pnas.2514534122</a></li></ol></details></div></script><script type="text/x-tpl" id="le-great-oxidation-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Jaspilite banded iron formation, Soudan Underground State Park.jpg" data-cap="The Great Oxidation Event" data-big><figcaption></figcaption></figure><div class="sh-k">Precambrian · Paleoproterozoic (Siderian–Rhyacian)</div><h2 class="sh-t" id="le-great-oxidation-st" tabindex="-1">The Great Oxidation Event</h2><p class="sh-s">c. 2.46–2.06 billion years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Plausible</span></span></div></div><p class="v4-q">Cyanobacteria filled the air with oxygen for the first time, rusting the seas, chilling the planet and opening the road to breathing life.</p><div class="lx-nums" data-from="lxs-le-great-oxidation"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-great-oxidation"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The oxygen released by cyanobacteria triggered one of Earth&#x27;s first global glaciations.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The timing fits: oxygen began rising around 2.46–2.43 billion years ago, and Warke and colleagues (2020) found this came before the most widespread Huronian glaciation. Oxygen would have destroyed methane, a potent greenhouse gas, cooling the planet. But these rocks are hard to date precisely, there were several glaciations, some may predate the oxygen rise, and changes in volcanism or continents could also have contributed.</p></div></div></div><div class="twist"><b>Still open</b><p>Why did oxygen take so long to build up if cyanobacteria already existed? Was the trigger biological, such as new kinds of cyanobacteria, or geological, such as fewer oxygen-consuming volcanic gases? How high did oxygen climb during the Lomagundi excursion, and why did it fall back afterwards? Estimates of oxygen levels in this era span orders of magnitude.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 421 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Great Oxidation Event"><button type="button" class="wtoc-i" data-go="le-great-oxidation-s1">The great exhale</button><button type="button" class="wtoc-i" data-go="le-great-oxidation-s2">Signals in rock</button><button type="button" class="wtoc-i" data-go="le-great-oxidation-s3">Rust and ice</button><button type="button" class="wtoc-i" data-go="le-great-oxidation-s4">A wobbling rise</button></nav></div><section class="wsec" id="le-great-oxidation-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The great exhale</h3><p>Cyanobacteria invented a trick that changed the planet: using sunlight to split water, keeping the hydrogen and releasing the oxygen. For a long time that oxygen vanished almost as soon as it was made, reacting with iron dissolved in the seas, with volcanic gases and with methane. Then, around 2.4 billion years ago, the balance tipped. Oxygen began to accumulate in the air for the first time. Reviews such as Lyons and colleagues (2014) stress that levels stayed far below today&#x27;s 21% for a very long time afterwards.</p><blockquote class="wpull"><p>The first great pollution crisis in Earth&#x27;s history was oxygen, released by microbes, and it made our lives possible.</p></blockquote></section><section class="wsec" id="le-great-oxidation-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Signals in rock</h3><p>The clearest signal is in sulphur. In air without oxygen, ultraviolet light splits sulphur gases in a way that leaves an unusual isotope pattern in sediments. Farquhar and colleagues (2000) showed that this pattern disappears from rocks younger than about 2.4 billion years. At the same time, grains of pyrite and uraninite, minerals that rust away in oxygen, vanish from river sands, and red soils rich in oxidised iron appear.</p><aside class="wcall"><b>How do we know?</b><p>Geologists read oxygen history from minerals that only survive, or only form, under certain conditions. Unusual sulphur isotope patterns need oxygen-free air. Pyrite and uraninite pebbles survive transport only when oxygen is scarce. Red beds and rusty ancient soils need oxygen. Carbon isotopes in limestone track how much organic matter was buried, which releases oxygen. Volcanic ash layers between these rocks are dated by uranium and lead in zircon crystals.</p></aside></section><section class="wsec" id="le-great-oxidation-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Rust and ice</h3><p>Dissolved iron in the oceans reacted with oxygen and settled to the sea floor as layers of iron oxide interleaved with silica, the banded iron formations. Many formed in the few hundred million years around this transition. On land, glaciers left scratched boulders and tillites in what is now Canada, South Africa and elsewhere: the Huronian glaciations. Gumsley and colleagues (2017) dated the start of the oxygen rise to 2.46–2.43 billion years ago, and Warke and colleagues (2020) found that it preceded the most extensive glaciation, as expected if oxygen destroyed a methane greenhouse.</p></section><section class="wsec" id="le-great-oxidation-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>A wobbling rise</h3><p>The rise was not a single step. Poulton and colleagues (2021) found that oxygen came and went several times between about 2.43 and 2.22 billion years ago before it stayed. Then came the Lomagundi excursion, when limestones became unusually rich in heavy carbon for more than 100 million years, suggesting huge amounts of organic carbon were buried and oxygen may have briefly risen high. Afterwards oxygen seems to have fallen back, setting up the long, low-oxygen &#x27;Boring Billion&#x27; that followed.</p></section><h3 class="sub-h wsub">Go deeper</h3><div class="links-row"><button type="button" onclick="openItem('articles','case-oklo')">Oklo <span aria-hidden="true">→</span></button></div><details class="srcs"><summary>Sources for this entry (8)</summary><ol><li>Lyons, T.W., Reinhard, C.T. and Planavsky, N.J. (2014). The rise of oxygen in Earth&#x27;s early ocean and atmosphere. Nature 506: 307-315. <a href="https://doi.org/10.1038/nature13068" target="_blank" rel="noopener">doi:10.1038/nature13068</a></li><li>Poulton, S.W. et al. (2021). A 200-million-year delay in permanent atmospheric oxygenation. Nature 592: 232-236. <a href="https://doi.org/10.1038/s41586-021-03393-7" target="_blank" rel="noopener">doi:10.1038/s41586-021-03393-7</a></li><li>Farquhar, J., Bao, H. and Thiemens, M. (2000). Atmospheric influence of Earth&#x27;s earliest sulfur cycle. Science 289: 756-758. <a href="https://doi.org/10.1126/science.289.5480.756" target="_blank" rel="noopener">doi:10.1126/science.289.5480.756</a></li><li>Gumsley, A.P. et al. (2017). Timing and tempo of the Great Oxidation Event. PNAS 114: 1811-1816. <a href="https://doi.org/10.1073/pnas.1608824114" target="_blank" rel="noopener">doi:10.1073/pnas.1608824114</a></li><li>Warke, M.R. et al. (2020). The Great Oxidation Event preceded a Paleoproterozoic &#x27;snowball Earth&#x27;. PNAS 117: 13314-13320. <a href="https://doi.org/10.1073/pnas.2003090117" target="_blank" rel="noopener">doi:10.1073/pnas.2003090117</a></li><li>Karhu, J.A. and Holland, H.D. (1996). Carbon isotopes and the rise of atmospheric oxygen. Geology 24: 867-870. <a href="https://doi.org/10.1130/0091-7613(1996)024&lt;0867:CIATRO&gt;2.3.CO;2" target="_blank" rel="noopener">doi:10.1130/0091-7613(1996)024&lt;0867:CIATRO&gt;2.3.CO;2</a></li><li>Konhauser, K.O. et al. (2017). Iron formations: a global record of Neoarchaean to Palaeoproterozoic environmental history. Earth-Science Reviews 172: 140-177. <a href="https://doi.org/10.1016/j.earscirev.2017.06.012" target="_blank" rel="noopener">doi:10.1016/j.earscirev.2017.06.012</a></li><li>Wong, M.L. et al. (2025). Organic geochemical evidence for life in Archean rocks identified by pyrolysis-GC-MS and supervised machine learning. PNAS 122. <a href="https://doi.org/10.1073/pnas.2514534122" target="_blank" rel="noopener">doi:10.1073/pnas.2514534122</a></li></ol></details></div></script><script type="text/x-tpl" id="le-boring-billion-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Bangiomorpha pubescens, Hunting Formation (Sumerset Island, Nunavut, Canada).jpg" data-cap="The Boring Billion" data-big><figcaption></figcaption></figure><div class="sh-k">Precambrian · Late Paleoproterozoic to early Neoproterozoic</div><h2 class="sh-t" id="le-boring-billion-st" tabindex="-1">The Boring Billion</h2><p class="sh-s">c. 1.8–0.8 billion years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Mixed record</span></span></div></div><p class="v4-q">For a billion years the climate barely changed and oxygen stayed low. Beneath the calm, complex cells, sex and many-celled life were quietly invented.</p><div class="lx-nums" data-from="lxs-le-boring-billion"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-boring-billion"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Little of importance happened on Earth during the &#x27;Boring Billion&#x27;.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:50.0%" role="img" aria-label="Weight of evidence: Mixed record"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The &#x27;boring&#x27; label fits the climate and chemistry: carbon isotopes stayed flat, no major ice ages are known, and oxygen stayed low for hundreds of millions of years. But biology was busy. Fossils and chemical traces show eukaryotes diversifying, the first multicellular forms, the first red algae and early evidence of sex, while supercontinents assembled and broke apart. The calm surface hid deep change.</p></div></div></div><div class="twist"><b>Still open</b><p>Why did oxygen stay low for so long? Were eukaryotes held back by low oxygen, scarce nutrients or simply the slow pace of evolution? When did the modern eukaryote groups arise, and are the oldest &#x27;multicellular&#x27; fossils truly eukaryotes? The shapes of Nuna and Rodinia are still debated.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 390 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Boring Billion"><button type="button" class="wtoc-i" data-go="le-boring-billion-s1">A billion quiet years</button><button type="button" class="wtoc-i" data-go="le-boring-billion-s2">The cell that changed everything</button><button type="button" class="wtoc-i" data-go="le-boring-billion-s3">Sex and seaweed</button><button type="button" class="wtoc-i" data-go="le-boring-billion-s4">Why so slow?</button></nav></div><section class="wsec" id="le-boring-billion-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A billion quiet years</h3><p>After the upheavals of the Great Oxidation Event, the Earth settled into a long calm. Brasier and Lindsay (1998) noticed that carbon isotopes in limestones, which swing wildly in other ages, stayed almost flat from about 1.8 to 0.8 billion years ago, and that glacial deposits were missing. Geologists nicknamed the interval the &#x27;Boring Billion&#x27;. Oxygen remained well below modern levels and the deep sea was largely oxygen-free, a stable but stingy world for life.</p><blockquote class="wpull"><p>A quiet climate is not a quiet biology. The Boring Billion was when the machinery of complex life was assembled.</p></blockquote></section><section class="wsec" id="le-boring-billion-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The cell that changed everything</h3><p>The eukaryotic cell, with a nucleus and energy-making mitochondria descended from once free-living bacteria, is the basis of every animal, plant and fungus. It became established during this age. Miao and colleagues (2024) described many-celled filaments from 1.63-billion-year-old rocks in North China, which they interpret as early multicellular eukaryotes. Brocks and colleagues (2023) found chemical traces of &#x27;protosterols&#x27;, made by an early branch of eukaryotes that thrived for hundreds of millions of years and then disappeared, a lost world known only from molecules.</p></section><section class="wsec" id="le-boring-billion-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Sex and seaweed</h3><p>On Somerset Island in Arctic Canada, Butterfield (2000) described Bangiomorpha pubescens, a filament of cells that closely resembles living red algae. Its different cell types and spore-like stages suggest sexual reproduction and division of labour among cells. Gibson and colleagues (2018) dated the rocks to about 1.047 billion years ago. That makes Bangiomorpha the oldest widely accepted fossil of a eukaryote that photosynthesised, the ancestor-type of the seaweeds on our plates.</p><aside class="wcall"><b>How do we know?</b><p>Microfossils are found in chert and shale, where silica or clay sealed cells before they decayed. Chemical fossils, or biomarkers, are durable molecules such as sterols that different groups of organisms make. Oxygen levels come from isotopes of chromium, zinc and other metals that behave differently when oxygen is present. Ages come from uranium-lead dating of volcanic layers and rhenium-osmium dating of black shales.</p></aside></section><section class="wsec" id="le-boring-billion-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Why so slow?</h3><p>Several explanations compete. Low oxygen may have limited large, active cells: Planavsky and colleagues (2014) argued it was below 0.1% of today&#x27;s level, though Zhang and colleagues (2016) found evidence of enough oxygen for simple animals around 1.4 billion years ago. Nutrient scarcity in sulphide-rich seas may have been just as important. Supercontinent cycles, Nuna then Rodinia, changed coastlines and weathering. When Rodinia broke apart, the calm ended in the most extreme ice ages Earth has known.</p></section><details class="srcs"><summary>Sources for this entry (7)</summary><ol><li>Brasier, M.D. and Lindsay, J.F. (1998). A billion years of environmental stability and the emergence of eukaryotes: new data from northern Australia. Geology 26: 555-558. <a href="https://doi.org/10.1130/0091-7613(1998)026&lt;0555:ABYOES&gt;2.3.CO;2" target="_blank" rel="noopener">doi:10.1130/0091-7613(1998)026&lt;0555:ABYOES&gt;2.3.CO;2</a></li><li>Butterfield, N.J. (2000). Bangiomorpha pubescens n. gen., n. sp.: implications for the evolution of sex, multicellularity, and the Mesoproterozoic/Neoproterozoic radiation of eukaryotes. Paleobiology 26: 386-404. <a href="https://doi.org/10.1666/0094-8373(2000)026&lt;0386:BPNGNS&gt;2.0.CO;2" target="_blank" rel="noopener">doi:10.1666/0094-8373(2000)026&lt;0386:BPNGNS&gt;2.0.CO;2</a></li><li>Gibson, T.M. et al. (2018). Precise age of Bangiomorpha pubescens dates the origin of eukaryotic photosynthesis. Geology 46: 135-138. <a href="https://doi.org/10.1130/G39829.1" target="_blank" rel="noopener">doi:10.1130/G39829.1</a></li><li>Planavsky, N.J. et al. (2014). Low Mid-Proterozoic atmospheric oxygen levels and the delayed rise of animals. Science 346: 635-638. <a href="https://doi.org/10.1126/science.1258410" target="_blank" rel="noopener">doi:10.1126/science.1258410</a></li><li>Zhang, S. et al. (2016). Sufficient oxygen for animal respiration 1,400 million years ago. PNAS 113: 1731-1736. <a href="https://doi.org/10.1073/pnas.1523449113" target="_blank" rel="noopener">doi:10.1073/pnas.1523449113</a></li><li>Brocks, J.J. et al. (2023). Lost world of complex life and the late rise of the eukaryotic crown. Nature 618: 767-773. <a href="https://doi.org/10.1038/s41586-023-06170-w" target="_blank" rel="noopener">doi:10.1038/s41586-023-06170-w</a></li><li>Miao, L. et al. (2024). 1.63-billion-year-old multicellular eukaryotes from the Chuanlinggou Formation in North China. Science Advances 10: eadk3208. <a href="https://doi.org/10.1126/sciadv.adk3208" target="_blank" rel="noopener">doi:10.1126/sciadv.adk3208</a></li></ol></details></div></script><script type="text/x-tpl" id="le-snowball-earth-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Snowball Huronian.jpg" data-cap="Snowball Earth" data-big><figcaption></figcaption></figure><div class="sh-k">Precambrian · Cryogenian</div><h2 class="sh-t" id="le-snowball-earth-st" tabindex="-1">Snowball Earth</h2><p class="sh-s">c. 717–635 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Plausible</span></span></div></div><p class="v4-q">Twice, glaciers reached the tropics at sea level. Whether the oceans froze almost solid or kept open water is one of geology&#x27;s great arguments.</p><div class="lx-nums" data-from="lxs-le-snowball-earth"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-snowball-earth"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>During the Snowball glaciations, ice covered the oceans from pole to equator.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Glacial deposits formed near the equator at sea level, at the same times on many continents, and are capped by carbonates that suggest an abrupt, extreme greenhouse afterwards. A nearly frozen ocean explains these features neatly (Hoffman and colleagues, 1998 and 2017). But some rocks show signs of waves and active ice flow, and climate models such as Hyde and colleagues (2000) allow a &#x27;slushball&#x27; with a belt of open tropical water.</p></div></div></div><div class="twist"><b>Still open</b><p>Did a strip of open water survive near the equator, or only cracks and ponds? How did early eukaryotes and possible animals survive? What started the freeze: the breakup of Rodinia, weathering of fresh volcanic rock, or changes in life? And how quickly did the ice melt and the cap carbonates form?</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 401 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Snowball Earth"><button type="button" class="wtoc-i" data-go="le-snowball-earth-s1">Glaciers in the tropics</button><button type="button" class="wtoc-i" data-go="le-snowball-earth-s2">Freezing and escaping</button><button type="button" class="wtoc-i" data-go="le-snowball-earth-s3">Hard snowball or slushball?</button><button type="button" class="wtoc-i" data-go="le-snowball-earth-s4">Out of the ice</button></nav></div><section class="wsec" id="le-snowball-earth-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Glaciers in the tropics</h3><p>Glacial deposits are easy to recognise: jumbled boulders in fine mud, scratched pebbles, and stones dropped from floating ice into layered sediments. Rocks of this kind, around 700 to 635 million years old, turn up on almost every continent. Magnetic minerals in some of them record that they formed close to the equator. In 1998 Hoffman and colleagues gathered this evidence from Namibia and argued for a &#x27;Snowball Earth&#x27;, a planet frozen almost pole to pole, building on an idea proposed by Joseph Kirschvink in 1992.</p><blockquote class="wpull"><p>Imagine the tropics under ice, the sea silent, the sky clear and dry. Then imagine the thaw, and a planet suddenly flooded with nutrients.</p></blockquote></section><section class="wsec" id="le-snowball-earth-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Freezing and escaping</h3><p>Ice reflects sunlight. As ice sheets and sea ice spread toward the tropics, the planet absorbs less energy, cools further, and more ice forms. Models suggest that past a certain point this runaway freezes nearly everything. The way out is volcanic. Volcanoes keep releasing carbon dioxide, but with rocks buried under ice, weathering almost stops removing it. Over millions of years the gas builds up until the ice finally melts, often quickly, leaving a hot, stormy world that laid down the cap carbonates.</p><aside class="wcall"><b>How do we know?</b><p>Glacial deposits are identified by their mixed boulders, dropstones and scratched surfaces. Their ancient latitude comes from palaeomagnetism, the frozen record of Earth&#x27;s magnetic field in iron minerals. Their ages come from uranium-lead dating of volcanic ash and rhenium-osmium dating of shales. Carbon isotopes in the carbonates above and below the ice record swings in the carbon cycle, and chemical fossils record which organisms survived.</p></aside></section><section class="wsec" id="le-snowball-earth-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Hard snowball or slushball?</h3><p>The &#x27;hard&#x27; version pictures sea ice hundreds of metres thick almost everywhere. Critics point to sediments that seem to need open water, such as wave-formed ripples, and to the survival of algae and other photosynthesisers. Hyde and colleagues (2000) modelled a &#x27;slushball&#x27; with an ice-free tropical belt. Hoffman and colleagues (2017) reply that thin ice, cracks and meltwater ponds could shelter life even on a nearly frozen planet. Both sides agree that ice reached low latitudes, which is remarkable on its own.</p></section><section class="wsec" id="le-snowball-earth-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Out of the ice</h3><p>Between and after the glaciations, the seas changed. Brocks and colleagues (2017) found that molecules made by algae became abundant after the Sturtian ice, marking the first algae-rich oceans. Richer food may have favoured larger, more complex organisms. The Marinoan melt, about 635 million years ago, opened the Ediacaran Period, when the first large, complex life appears in the fossil record.</p></section><details class="srcs"><summary>Sources for this entry (6)</summary><ol><li>Hoffman, P.F., Kaufman, A.J., Halverson, G.P. and Schrag, D.P. (1998). A Neoproterozoic snowball Earth. Science 281: 1342-1346. <a href="https://doi.org/10.1126/science.281.5381.1342" target="_blank" rel="noopener">doi:10.1126/science.281.5381.1342</a></li><li>Hoffman, P.F. et al. (2017). Snowball Earth climate dynamics and Cryogenian geology-geobiology. Science Advances 3: e1600983. <a href="https://doi.org/10.1126/sciadv.1600983" target="_blank" rel="noopener">doi:10.1126/sciadv.1600983</a></li><li>Rooney, A.D. et al. (2015). A Cryogenian chronology: two long-lasting synchronous Neoproterozoic glaciations. Geology 43: 459-462. <a href="https://doi.org/10.1130/G36511.1" target="_blank" rel="noopener">doi:10.1130/G36511.1</a></li><li>MacLennan, S. et al. (2018). The arc of the Snowball: U-Pb dates constrain the Islay anomaly and the initiation of the Sturtian glaciation. Geology 46: 539-542. <a href="https://doi.org/10.1130/G40171.1" target="_blank" rel="noopener">doi:10.1130/G40171.1</a></li><li>Hyde, W.T., Crowley, T.J., Baum, S.K. and Peltier, W.R. (2000). Neoproterozoic &#x27;snowball Earth&#x27; simulations with a coupled climate/ice-sheet model. Nature 405: 425-429. <a href="https://doi.org/10.1038/35013005" target="_blank" rel="noopener">doi:10.1038/35013005</a></li><li>Brocks, J.J. et al. (2017). The rise of algae in Cryogenian oceans and the emergence of animals. Nature 548: 578-581. <a href="https://doi.org/10.1038/nature23457" target="_blank" rel="noopener">doi:10.1038/nature23457</a></li></ol></details></div></script><script type="text/x-tpl" id="le-ediacaran-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="DickinsoniaCostata.jpg" data-cap="The Ediacaran biota: first large life" data-big><figcaption></figcaption></figure><div class="sh-k">Precambrian · Ediacaran</div><h2 class="sh-t" id="le-ediacaran-st" tabindex="-1">The Ediacaran biota: first large life</h2><p class="sh-s">c. 575–539 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Strong evidence</span></span></div></div><p class="v4-q">Quilted fronds and flat ovals, some longer than a forearm, were the first large living things. At least one, Dickinsonia, was probably an animal.</p><div class="lx-nums" data-from="lxs-le-ediacaran"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-ediacaran"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Dickinsonia, one of the strangest Ediacaran fossils, was an animal.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Bobrovskiy and colleagues (2018) extracted organic films from Dickinsonia fossils in northern Russia and found them rich in cholesterol-derived molecules, the signature of animals, while the surrounding mats carried algal and bacterial sterols. Its growth pattern and trails left as it fed also fit an animal. Some researchers argue the sterols could have other sources, and where it fits in the animal family tree is unclear.</p></div></div></div><div class="twist"><b>Still open</b><p>How were most Ediacaran organisms related to later animals, and were some of them separate experiments in large life? Did they vanish because of environmental change such as low oxygen, because new animals out-competed and disturbed their mat world, or partly because the special conditions that preserved them ended?</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 440 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Ediacaran biota: first large life"><button type="button" class="wtoc-i" data-go="le-ediacaran-s1">A hidden world in sandstone</button><button type="button" class="wtoc-i" data-go="le-ediacaran-s2">Was Dickinsonia an animal?</button><button type="button" class="wtoc-i" data-go="le-ediacaran-s3">The first extinction of animals</button><button type="button" class="wtoc-i" data-go="le-ediacaran-s4">Into the Cambrian</button></nav></div><section class="wsec" id="le-ediacaran-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A hidden world in sandstone</h3><p>For a long time, the fossil record seemed to begin suddenly in the Cambrian. Then, in the mid twentieth century, geologists recognised soft-bodied fossils in older rocks, in the Ediacara Hills of South Australia, in Charnwood Forest in England and elsewhere. They were impressions of fronds, discs and quilted ovals, preserved as casts in sandstone. The Ediacaran Period, formally named in 2004, takes its name from those hills. Narbonne (2005) and Waggoner (2003) summarised the life of this age as three broad assemblages, different in time and setting.</p><ul class="wlist"><li>Avalon: deep-water fronds and &#x27;rangeomorphs&#x27;, from about 574 million years ago</li><li>White Sea: shallow-water communities with Dickinsonia and Kimberella, about 560 to 550 million years ago</li><li>Nama: the first mineral skeletons, such as Cloudina, until the end of the period</li></ul></section><section class="wsec" id="le-ediacaran-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Was Dickinsonia an animal?</h3><p>Dickinsonia is a flat oval with ribbed segments, from a few millimetres to more than a metre long. It has been called a jellyfish, a worm, a lichen, a fungus and a giant single cell. In 2018, Bobrovskiy and colleagues found fossils in cliffs by the White Sea in Russia that still held thin organic films. The molecules were dominated by cholesterol derivatives, typical of animals, and differed from the algal sterols in the mats around them. Most researchers now treat Dickinsonia as an early animal, though a simple and unusual one.</p><aside class="wcall"><b>How do we know?</b><p>Ediacaran organisms had no hard parts, so most are known as moulds and casts, often smothered by sand or volcanic ash that preserved them like a death mask. Volcanic ash layers can be dated precisely with uranium-lead in zircon crystals. Rare fossils that keep organic matter can be analysed for biomarkers, molecules such as sterols that different groups of organisms make. Trails, growth series and body symmetry add clues about how they lived.</p></aside></section><section class="wsec" id="le-ediacaran-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The first extinction of animals</h3><p>Around 550 million years ago, at the change from the White Sea to the Nama assemblage, many forms disappeared. Evans and colleagues (2022) estimated a loss of about 80% of known genera and linked it to falling oxygen in the oceans. The survivors were often forms that could cope with low oxygen. Darroch and colleagues (2015) argued that new burrowing and grazing animals also squeezed out the Ediacaran mat communities by breaking up their mat world.</p><blockquote class="wpull"><p>The first large living things on Earth were soft, strange and short-lived, a first draft of animal life that the Cambrian rewrote.</p></blockquote></section><section class="wsec" id="le-ediacaran-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Into the Cambrian</h3><p>The period ends about 538.8 million years ago on the international time scale, with the appearance of more complex burrows that mark the start of the Cambrian. Linnemann and colleagues (2019) dated this change in Namibia to about 539 million years ago. Most Ediacaran forms are absent from younger rocks, though a few may have lingered. The world that replaced them, with eyes, shells, predators and deep burrows, is the Cambrian explosion. The Ediacaran biota remains a reminder that the history of life includes experiments that did not last.</p></section><details class="srcs"><summary>Sources for this entry (8)</summary><ol><li>Bobrovskiy, I. et al. (2018). Ancient steroids establish the Ediacaran fossil Dickinsonia as one of the earliest animals. Science 361: 1246-1249. <a href="https://doi.org/10.1126/science.aat7228" target="_blank" rel="noopener">doi:10.1126/science.aat7228</a></li><li>Narbonne, G.M. (2005). The Ediacara biota: Neoproterozoic origin of animals and their ecosystems. Annual Review of Earth and Planetary Sciences 33: 421-442. <a href="https://doi.org/10.1146/annurev.earth.33.092203.122519" target="_blank" rel="noopener">doi:10.1146/annurev.earth.33.092203.122519</a></li><li>Waggoner, B. (2003). The Ediacaran biotas in space and time. Integrative and Comparative Biology 43: 104-113. <a href="https://doi.org/10.1093/icb/43.1.104" target="_blank" rel="noopener">doi:10.1093/icb/43.1.104</a></li><li>Matthews, J.J., Liu, A.G., Yang, C., McIlroy, D., Levell, B. and Condon, D.J. (2021). A chronostratigraphic framework for the rise of the Ediacaran macrobiota: new constraints from Mistaken Point Ecological Reserve, Newfoundland. GSA Bulletin 133: 612-624. <a href="https://doi.org/10.1130/B35646.1" target="_blank" rel="noopener">doi:10.1130/B35646.1</a></li><li>Evans, S.D. et al. (2022). Environmental drivers of the first major animal extinction across the Ediacaran White Sea-Nama transition. PNAS 119: e2207475119. <a href="https://doi.org/10.1073/pnas.2207475119" target="_blank" rel="noopener">doi:10.1073/pnas.2207475119</a></li><li>Darroch, S.A.F. et al. (2015). Biotic replacement and mass extinction of the Ediacara biota. Proceedings of the Royal Society B 282: 20151003. <a href="https://doi.org/10.1098/rspb.2015.1003" target="_blank" rel="noopener">doi:10.1098/rspb.2015.1003</a></li><li>Linnemann, U. et al. (2019). New high-resolution age data from the Ediacaran-Cambrian boundary indicate rapid, ecologically driven onset of the Cambrian explosion. Terra Nova 31: 49-58. <a href="https://doi.org/10.1111/ter.12368" target="_blank" rel="noopener">doi:10.1111/ter.12368</a></li><li>Cohen, K.M., Finney, S.C., Gibbard, P.L. and Fan, J.-X. (2013, updated 2023). The ICS International Chronostratigraphic Chart. Episodes 36: 199-204. <a href="https://doi.org/10.18814/epiiugs/2013/v36i3/002" target="_blank" rel="noopener">doi:10.18814/epiiugs/2013/v36i3/002</a></li></ol></details></div></script><script type="text/x-tpl" id="le-cambrian-explosion-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Diorama of the Burgess Shale Biota (Middle Cambrian) - Marrella, Marpolia.jpg" data-cap="The Cambrian Explosion" data-big><figcaption></figcaption></figure><div class="sh-k">Paleozoic · Early to Middle Cambrian</div><h2 class="sh-t" id="le-cambrian-explosion-st" tabindex="-1">The Cambrian Explosion</h2><p class="sh-s">c. 539–515 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Strong evidence</span></span></div></div><p class="v4-q">In a few tens of millions of years the seas filled with animals that could see, hunt, burrow and armour themselves.</p><div class="lx-nums" data-from="lxs-le-cambrian-explosion"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-cambrian-explosion"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The Cambrian explosion was a real burst of evolution, not just a burst in fossil preservation.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Several independent records change together. Body fossils, shelly fossils and trace fossils (burrows and tracks, which do not depend on unusual preservation) all diversify quickly and in step across many continents. Soft-bodied sites such as Chengjiang and the Burgess Shale show the same flowering among animals without shells. But molecular clocks and Ediacaran fossils point to deeper animal roots, so the explosion was of large, active, skeletal animals, not of animals from nothing.</p></div></div></div><div class="twist"><b>Still open</b><p>Why it happened then is still debated: rising oxygen, predator and prey arms races, genetic toolkits for building bodies, and changing seawater chemistry are all candidates, probably working together. How long the fuse was is also argued. Wood and colleagues (2019) see a longer, stepwise radiation beginning in the late Ediacaran rather than one sharp burst.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 411 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Cambrian Explosion"><button type="button" class="wtoc-i" data-go="le-cambrian-explosion-s1">A sea that suddenly fills</button><button type="button" class=
