e to the impact come from volcanic ash layers dated with argon and uranium-lead methods, combined with magnetic reversals and the iridium layer itself. Body sizes of fossil mammals are estimated from teeth and jaws, which scale with weight in living species. Titanoboa&#x27;s length comes from comparing its vertebrae with those of living boas and anacondas.</p></aside></section><section class="wsec" id="le-age-of-mammals-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Tropical giants</h3><p>Farther south, around 58 million years ago, the swampy coast of what is now northern Colombia supported the oldest known Neotropical rainforest. Scott Wing and colleagues found leaves of palms, legumes and ginger relatives in the Cerrejón coal mine. Among them lived Titanoboa, a snake about 13 metres long, along with crocodile relatives and giant turtles. Jason Head&#x27;s team argued that such a large cold-blooded animal needed a very warm climate, an inference others have questioned.</p><p>The coal of Cerrejón, now worked in one of the largest open-pit coal mines in the world, is made from the peat of these swamps. Burning it returns to the air carbon that Paleocene forests drew down some 58 million years ago.</p></section><details class="srcs"><summary>Sources for this entry (5)</summary><ol><li>Lyson, T.R. et al. (2019). Exceptional continental record of biotic recovery after the Cretaceous-Paleogene mass extinction. Science 366: 977-983. <a href="https://doi.org/10.1126/science.aay2268" target="_blank" rel="noopener">doi:10.1126/science.aay2268</a></li><li>Wilson Mantilla, G.P. et al. (2021). Earliest Palaeocene purgatoriids and the initial radiation of stem primates. Royal Society Open Science 8: 210050. <a href="https://doi.org/10.1098/rsos.210050" target="_blank" rel="noopener">doi:10.1098/rsos.210050</a></li><li>Head, J.J. et al. (2009). Giant boid snake from the Palaeocene neotropics reveals hotter past equatorial temperatures. Nature 457: 715-717. <a href="https://doi.org/10.1038/nature07671" target="_blank" rel="noopener">doi:10.1038/nature07671</a></li><li>Wing, S.L. et al. (2009). Late Paleocene fossils from the Cerrejón Formation, Colombia, are the earliest record of Neotropical rainforest. PNAS 106: 18627-18632. <a href="https://doi.org/10.1073/pnas.0905130106" target="_blank" rel="noopener">doi:10.1073/pnas.0905130106</a></li><li>Smith, F.A. et al. (2010). The evolution of maximum body size of terrestrial mammals. Science 330: 1216-1219. <a href="https://doi.org/10.1126/science.1194830" target="_blank" rel="noopener">doi:10.1126/science.1194830</a></li></ol></details></div></script><script type="text/x-tpl" id="le-petm-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Zumaia Itzurun 5.JPG" data-cap="The Paleocene-Eocene Thermal Maximum" data-big><figcaption></figcaption></figure><div class="sh-k">Cenozoic · Paleocene-Eocene boundary</div><h2 class="sh-t" id="le-petm-st" tabindex="-1">The Paleocene-Eocene Thermal Maximum</h2><p class="sh-s">c. 56 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Strong evidence</span></span></div></div><p class="v4-q">In a geological blink, a vast release of carbon warmed the planet by several degrees, acidified the oceans and reshuffled life on land.</p><div class="lx-nums" data-from="lxs-le-petm"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-petm"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Humans are releasing carbon faster than during the PETM.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Modelling of how fast the carbon-isotope signal and ocean chemistry changed suggests the PETM onset took at least about 4,000 years, with release rates of no more than about 1.1 billion tonnes of carbon a year (Zeebe et al. 2016). Human emissions are roughly ten times that. One study argued for a much faster onset of about 13 years, but most researchers reject that reading. Age models still carry uncertainty.</p></div></div></div><div class="twist"><b>Still open</b><p>The source of the carbon, whether volcanoes, methane from seafloor ice, thawing permafrost or burning peat, is still debated, as are the total amount and exact length of the onset. How ecosystems will respond to a faster, shorter human pulse is uncertain.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 401 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Paleocene-Eocene Thermal Maximum"><button type="button" class="wtoc-i" data-go="le-petm-s1">A spike in the record</button><button type="button" class="wtoc-i" data-go="le-petm-s2">Acid seas and dwarf horses</button><button type="button" class="wtoc-i" data-go="le-petm-s3">A northern arrival</button><button type="button" class="wtoc-i" data-go="le-petm-s4">Then and now</button></nav></div><section class="wsec" id="le-petm-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A spike in the record</h3><p>About 56 million years ago, an already warm Earth warmed sharply. In deep-sea cores, the chemistry of fossil shells shows a sudden plunge in carbon-13, the signature of a huge pulse of light carbon entering the oceans and air. Temperatures climbed by around 5 °C or more. This event, the Paleocene-Eocene Thermal Maximum or PETM, now marks the official start of the Eocene epoch.</p><blockquote class="wpull"><p>The PETM is the best natural experiment we have for a sudden carbon release, and it is not a reassuring one.</p></blockquote></section><section class="wsec" id="le-petm-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Acid seas and dwarf horses</h3><p>Much of the extra carbon dissolved into the ocean, turning it more acidic. At sites in the South Atlantic, James Zachos and colleagues found that pale carbonate ooze abruptly gives way to reddish clay, because shells dissolved before they could be buried. Deep-sea foraminifera suffered a major extinction. On land, mammals changed size. In Wyoming, Ross Secord&#x27;s team tracked the early horse Sifrhippus shrinking by about 30%, then growing back as the climate cooled.</p><aside class="wcall"><b>How do we know?</b><p>The carbon pulse is read from carbon isotopes in shells, soil nodules and plant waxes. Temperatures come from oxygen isotopes and magnesium-to-calcium ratios in shells, and from TEX86 molecules. Durations are counted using sediment cycles linked to regular wobbles in Earth&#x27;s orbit. The rate of carbon release is inferred by comparing how fast the isotope signal changed with how fast the ocean should respond, as Richard Zeebe and colleagues did.</p></aside></section><section class="wsec" id="le-petm-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>A northern arrival</h3><p>The PETM also reshuffled mammals across the Northern Hemisphere. With forests extending to the Arctic, land links across the far north let animals spread. The earliest true primates, early relatives of horses, and even-toed hoofed mammals related to deer and pigs appear suddenly in North America, Europe and Asia. Plant-eating insects did more damage to leaves as temperatures rose.</p><p>For these mammals, the far north was not a barrier but a corridor of warm forest linking the continents, and the modern shape of Northern Hemisphere mammal life owes much to this brief, hot window.</p></section><section class="wsec" id="le-petm-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Then and now</h3><p>It is tempting to call the PETM a preview of our future, but the comparison needs care. Its carbon release built up over thousands of years; by Zeebe&#x27;s estimates, we are releasing carbon about ten times faster. That leaves ecosystems less time to adapt and the ocean less time to buffer the acid. On the other hand, the PETM started from a warmer world with no big ice sheets. Its clearest lesson: recovery took more than 100,000 years.</p></section><details class="srcs"><summary>Sources for this entry (7)</summary><ol><li>McInerney, F.A. and Wing, S.L. (2011). The Paleocene-Eocene Thermal Maximum: a perturbation of carbon cycle, climate, and biosphere with implications for the future. Annual Review of Earth and Planetary Sciences 39: 489-516. <a href="https://doi.org/10.1146/annurev-earth-040610-133431" target="_blank" rel="noopener">doi:10.1146/annurev-earth-040610-133431</a></li><li>Tierney, J.E. et al. (2022). Spatial patterns of climate change across the Paleocene-Eocene Thermal Maximum. PNAS 119: e2205326119. <a href="https://doi.org/10.1073/pnas.2205326119" target="_blank" rel="noopener">doi:10.1073/pnas.2205326119</a></li><li>Zeebe, R.E., Ridgwell, A. and Zachos, J.C. (2016). Anthropogenic carbon release rate unprecedented during the past 66 million years. Nature Geoscience 9: 325-329. <a href="https://doi.org/10.1038/ngeo2681" target="_blank" rel="noopener">doi:10.1038/ngeo2681</a></li><li>Gutjahr, M. et al. (2017). Very large release of mostly volcanic carbon during the Palaeocene-Eocene Thermal Maximum. Nature 548: 573-577. <a href="https://doi.org/10.1038/nature23646" target="_blank" rel="noopener">doi:10.1038/nature23646</a></li><li>Zachos, J.C. et al. (2005). Rapid acidification of the ocean during the Paleocene-Eocene Thermal Maximum. Science 308: 1611-1615. <a href="https://doi.org/10.1126/science.1109004" target="_blank" rel="noopener">doi:10.1126/science.1109004</a></li><li>Secord, R. et al. (2012). Evolution of the earliest horses driven by climate change in the Paleocene-Eocene Thermal Maximum. Science 335: 959-962. <a href="https://doi.org/10.1126/science.1213859" target="_blank" rel="noopener">doi:10.1126/science.1213859</a></li><li>Currano, E.D. et al. (2008). Sharply increased insect herbivory during the Paleocene-Eocene Thermal Maximum. PNAS 105: 1960-1964. <a href="https://doi.org/10.1073/pnas.0708646105" target="_blank" rel="noopener">doi:10.1073/pnas.0708646105</a></li></ol></details></div></script><script type="text/x-tpl" id="le-eocene-hothouse-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Ambulocetus skeleton.jpg" data-cap="Arctic Forests and the Eocene Hothouse" data-big><figcaption></figcaption></figure><div class="sh-k">Cenozoic · Early to Middle Eocene</div><h2 class="sh-t" id="le-eocene-hothouse-st" tabindex="-1">Arctic Forests and the Eocene Hothouse</h2><p class="sh-s">c. 53–40 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Strong evidence</span></span></div></div><p class="v4-q">Alligator relatives basked in the Arctic, a floating fern carpeted a polar sea, and early whales waded out from the shores of the Tethys.</p><div class="lx-nums" data-from="lxs-le-eocene-hothouse"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-eocene-hothouse"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The Arctic had a warm, nearly frost-free climate in the Eocene.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Alligator relatives, which cannot survive long hard freezes, lived on Ellesmere Island, alongside turtles and broad-leaved forests (Eberle and Greenwood 2012). Leaf shapes, fossil soils and Arctic Ocean temperature proxies agree on mild conditions, with winters close to or just above freezing. The Azolla blooms point to a warm, fresh surface ocean. Several independent lines point the same way.</p></div></div></div><div class="twist"><b>Still open</b><p>How the poles stayed so warm while the tropics did not overheat still puzzles climate models, which tend to underestimate polar warmth. How much the Azolla blooms drew down carbon, and what drove the long Eocene cooling (falling carbon dioxide, changing ocean gateways or mountain building), are debated.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 398 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Arctic Forests and the Eocene Hothouse"><button type="button" class="wtoc-i" data-go="le-eocene-hothouse-s1">The warmest world of the last 66 million years</button><button type="button" class="wtoc-i" data-go="le-eocene-hothouse-s2">Life at the top of the world</button><button type="button" class="wtoc-i" data-go="le-eocene-hothouse-s3">The Azolla event</button><button type="button" class="wtoc-i" data-go="le-eocene-hothouse-s4">Whales walk back to the sea</button></nav></div><section class="wsec" id="le-eocene-hothouse-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The warmest world of the last 66 million years</h3><p>Around 53 to 49 million years ago, the Earth reached a long-lasting peak of warmth called the Early Eocene Climatic Optimum. Global average temperatures were perhaps 13 °C higher than before industrialisation. There were no large ice sheets. Tropical forests reached much farther from the equator than today, and the temperature difference between the poles and the tropics was far smaller. Carbon dioxide was probably several times the pre-industrial level, though estimates range widely.</p><blockquote class="wpull"><p>On an Arctic island where polar bears hunt today, alligator relatives once basked beside swampy forests.</p></blockquote></section><section class="wsec" id="le-eocene-hothouse-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Life at the top of the world</h3><p>On Ellesmere Island, in Canada&#x27;s far north, palaeontologists have found fossils of alligator relatives, freshwater turtles, early tapirs, the hippo-like Coryphodon and tree-dwelling primate cousins. Nearby, on Axel Heiberg Island, the stumps of dawn redwood forests still stand in the frozen ground. These animals and trees lived through months of winter darkness, which suggests winters were mild, close to or just above freezing (Eberle and Greenwood 2012).</p><aside class="wcall"><b>How do we know?</b><p>Temperatures this far back come from several proxies. Oxygen isotopes and magnesium-to-calcium ratios in fossil shells record seawater warmth, and TEX86 and other molecular fossils track ocean temperatures. Leaf shapes help too: in warm climates, more tree species have smooth-edged leaves. Cold-sensitive animals like alligators set minimum winter temperatures. Carbon dioxide is estimated from boron isotopes in shells, which record ocean acidity.</p></aside></section><section class="wsec" id="le-eocene-hothouse-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The Azolla event</h3><p>Around 49 million years ago, the nearly enclosed Arctic Ocean had a freshwater lid. Henk Brinkhuis and colleagues found that the floating fern Azolla, today a weed of ponds and a natural fertiliser in rice paddies, repeatedly covered it for about 800,000 years, leaving layers of its remains in cores drilled near the North Pole. Some researchers link the burial of so much plant carbon to the start of the long Eocene cooling, though how much it mattered is uncertain.</p></section><section class="wsec" id="le-eocene-hothouse-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Whales walk back to the sea</h3><p>Along the shores of the Tethys Sea, one of the most remarkable transitions in evolution was under way. Pakicetus, about 50 million years old, lived on land near rivers but had ear bones like those of whales. Ambulocetus, slightly younger, had big feet and a crocodile-like head and probably hunted in shallow water. Hans Thewissen and colleagues showed from ankle bones that whales belong with the even-toed hoofed mammals, with hippos among their closest living relatives.</p><p>Within roughly 10 million years, whales such as Basilosaurus were fully marine, with tiny hind legs that could no longer carry their weight.</p></section><details class="srcs"><summary>Sources for this entry (6)</summary><ol><li>Inglis, G.N. et al. (2020). Global mean surface temperature and climate sensitivity of the early Eocene Climatic Optimum (EECO), Paleocene-Eocene Thermal Maximum (PETM), and latest Paleocene. Climate of the Past 16: 1953-1968. <a href="https://doi.org/10.5194/cp-16-1953-2020" target="_blank" rel="noopener">doi:10.5194/cp-16-1953-2020</a></li><li>Anagnostou, E. et al. (2016). Changing atmospheric CO2 concentration was the primary driver of early Cenozoic climate. Nature 533: 380-384. <a href="https://doi.org/10.1038/nature17423" target="_blank" rel="noopener">doi:10.1038/nature17423</a></li><li>Brinkhuis, H. et al. (2006). Episodic fresh surface waters in the Eocene Arctic Ocean. Nature 441: 606-609. <a href="https://doi.org/10.1038/nature04692" target="_blank" rel="noopener">doi:10.1038/nature04692</a></li><li>Eberle, J.J. and Greenwood, D.R. (2012). Life at the top of the greenhouse Eocene world: a review of the Eocene flora and vertebrate fauna from Canada&#x27;s High Arctic. GSA Bulletin 124: 3-23. <a href="https://doi.org/10.1130/B30571.1" target="_blank" rel="noopener">doi:10.1130/B30571.1</a></li><li>Thewissen, J.G.M., Williams, E.M., Roe, L.J. and Hussain, S.T. (2001). Skeletons of terrestrial cetaceans and the relationship of whales to artiodactyls. Nature 413: 277-281. <a href="https://doi.org/10.1038/35095005" target="_blank" rel="noopener">doi:10.1038/35095005</a></li><li>Thewissen, J.G.M., Hussain, S.T. and Arif, M. (1994). Fossil evidence for the origin of aquatic locomotion in archaeocete whales. Science 263: 210-212. <a href="https://doi.org/10.1126/science.263.5144.210" target="_blank" rel="noopener">doi:10.1126/science.263.5144.210</a></li></ol></details></div></script><script type="text/x-tpl" id="le-antarctic-ice-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Antartica - Magischer Eiskontinent - 43241777215.jpg" data-cap="Antarctica Freezes Over" data-big><figcaption></figcaption></figure><div class="sh-k">Cenozoic · Eocene-Oligocene transition</div><h2 class="sh-t" id="le-antarctic-ice-st" tabindex="-1">Antarctica Freezes Over</h2><p class="sh-s">c. 34 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Mixed record</span></span></div></div><p class="v4-q">Within a few hundred thousand years, ice spread across Antarctica and Earth entered the cold state we still live in today.</p><div class="lx-nums" data-from="lxs-le-antarctic-ice"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-antarctic-ice"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The opening of ocean gateways around Antarctica, rather than falling carbon dioxide, froze the continent.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:50.0%" role="img" aria-label="Weight of evidence: Mixed record"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The gateway idea has real support: a current circling Antarctica would isolate it from warm water, and both passages opened around this time. But their exact timing is uncertain, and models find gateways alone struggle to build a large ice sheet, while falling carbon dioxide can (DeConto and Pollard 2003). Boron-isotope records show carbon dioxide declining across the transition (Pearson et al. 2009). Most recent reviews see carbon dioxide as the main driver, with gateways helping (Hutchinson et al. 2021).</p></div></div></div><div class="twist"><b>Still open</b><p>When the Drake Passage opened deeply enough to carry a strong circumpolar current is still uncertain, with estimates spread over millions of years. How big the first ice sheet was, and why carbon dioxide fell, through weathering, carbon burial or reduced volcanism, remain debated.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 385 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Antarctica Freezes Over"><button type="button" class="wtoc-i" data-go="le-antarctic-ice-s1">From greenhouse to icehouse</button><button type="button" class="wtoc-i" data-go="le-antarctic-ice-s2">Carbon dioxide or ocean currents?</button><button type="button" class="wtoc-i" data-go="le-antarctic-ice-s3">The Grande Coupure</button><button type="button" class="wtoc-i" data-go="le-antarctic-ice-s4">Living in the icehouse</button></nav></div><section class="wsec" id="le-antarctic-ice-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>From greenhouse to icehouse</h3><p>For well over 100 million years, Antarctica had carried no large ice sheet. Around 34 million years ago that changed, quickly by geological standards. Deep-sea cores show a jump in the oxygen isotopes of fossil shells, a sign of both cooling and ice piling up on land. Within a few hundred thousand years, an ice sheet covered much of East Antarctica. Earth had entered the icehouse state it is still in.</p><blockquote class="wpull"><p>The ice that covers Antarctica today began its reign 34 million years ago, probably when carbon dioxide slipped below a critical level.</p></blockquote></section><section class="wsec" id="le-antarctic-ice-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Carbon dioxide or ocean currents?</h3><p>For decades, the favourite explanation was geography. As Australia and South America pulled away from Antarctica, the Tasmanian Gateway and the Drake Passage opened, letting a current race around the continent and cutting it off from warmer waters. In 2003, Robert DeConto and David Pollard showed in a model that falling carbon dioxide was the key: ice sheets grew rapidly once it dropped below about 2.8 times the pre-industrial level. Proxy data from Paul Pearson and colleagues support such a decline. Many researchers now see both factors at work.</p><aside class="wcall"><b>How do we know?</b><p>The main evidence comes from deep-sea sediment cores. Oxygen isotopes in the shells of bottom-dwelling foraminifera shift as ice sheets lock up light water and as oceans cool; magnesium-to-calcium ratios help separate the two effects. Grains dropped by icebergs far from Antarctica show ice reaching the sea. Boron isotopes in shells track carbon dioxide, and fossils of plankton and mammals record the turnover in life.</p></aside></section><section class="wsec" id="le-antarctic-ice-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The Grande Coupure</h3><p>On land, the change was felt far from Antarctica. In 1910, the Swiss palaeontologist Hans Georg Stehlin named the Grande Coupure, the great break, in Europe&#x27;s mammal record. Many native European groups vanished, and newcomers from Asia, such as entelodonts and anthracotheres, spread in. Jerry Hooker and colleagues tied the turnover in southern England to the cooling at the transition. In North America, climates became drier and more seasonal, and forests opened up.</p></section><section class="wsec" id="le-antarctic-ice-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Living in the icehouse</h3><p>Every ice age of the last few million years, every mammoth and every Ice Age hunter, belongs to the cold world that began here. Antarctica&#x27;s ice now holds enough water to raise the sea by about 58 metres. The transition is a reminder that ice sheets respond to carbon dioxide, and that thresholds matter: small changes near a tipping level can bring large, lasting shifts.</p></section><h3 class="sub-h wsub">Go deeper</h3><div class="links-row"><button type="button" onclick="openItem('timeline','age-03')">The Ice Age World <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-drowned-coasts')">The Drowned Coasts <span aria-hidden="true">→</span></button></div><details class="srcs"><summary>Sources for this entry (7)</summary><ol><li>Coxall, H.K. et al. (2005). Rapid stepwise onset of Antarctic glaciation and deeper calcite compensation in the Pacific Ocean. Nature 433: 53-57. <a href="https://doi.org/10.1038/nature03135" target="_blank" rel="noopener">doi:10.1038/nature03135</a></li><li>DeConto, R.M. and Pollard, D. (2003). Rapid Cenozoic glaciation of Antarctica induced by declining atmospheric CO2. Nature 421: 245-249. <a href="https://doi.org/10.1038/nature01290" target="_blank" rel="noopener">doi:10.1038/nature01290</a></li><li>Pearson, P.N., Foster, G.L. and Wade, B.S. (2009). Atmospheric carbon dioxide through the Eocene-Oligocene climate transition. Nature 461: 1110-1113. <a href="https://doi.org/10.1038/nature08447" target="_blank" rel="noopener">doi:10.1038/nature08447</a></li><li>Liu, Z. et al. (2009). Global cooling during the Eocene-Oligocene climate transition. Science 323: 1187-1190. <a href="https://doi.org/10.1126/science.1166368" target="_blank" rel="noopener">doi:10.1126/science.1166368</a></li><li>Hutchinson, D.K. et al. (2021). The Eocene-Oligocene transition: a review of marine and terrestrial proxy data, models and model-data comparisons. Climate of the Past 17: 269-315. <a href="https://doi.org/10.5194/cp-17-269-2021" target="_blank" rel="noopener">doi:10.5194/cp-17-269-2021</a></li><li>Hooker, J.J., Collinson, M.E. and Sille, N.P. (2004). Eocene-Oligocene mammalian faunal turnover in the Hampshire Basin, UK: calibration to the global time scale and the major cooling event. Journal of the Geological Society 161: 161-172. <a href="https://doi.org/10.1144/0016-764903-091" target="_blank" rel="noopener">doi:10.1144/0016-764903-091</a></li><li>Fretwell, P. et al. (2013). Bedmap2: improved ice bed, surface and thickness datasets for Antarctica. The Cryosphere 7: 375-393. <a href="https://doi.org/10.5194/tc-7-375-2013" target="_blank" rel="noopener">doi:10.5194/tc-7-375-2013</a></li></ol></details></div></script><script type="text/x-tpl" id="le-grasslands-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Teleoceras major (fossil barrel-bodied rhino) in fossiliferous volcanic tuff (Ash Hollow Formation, Miocene, 11.83 Ma; Ashfall Fossil Beds, Nebraska, USA) 12.jpg" data-cap="The Age of Grass" data-big><figcaption></figcaption></figure><div class="sh-k">Cenozoic · Miocene</div><h2 class="sh-t" id="le-grasslands-st" tabindex="-1">The Age of Grass</h2><p class="sh-s">c. 23–5.3 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Mixed record</span></span></div></div><p class="v4-q">A warm world cooled, grass conquered the continents, and apes spread from Africa into Eurasia, setting the stage for our own family.</p><div class="lx-nums" data-from="lxs-le-grasslands"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-grasslands"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Falling carbon dioxide was the main reason grasslands spread in the late Miocene.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:50.0%" role="img" aria-label="Weight of evidence: Mixed record"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">C4 grasses have an advantage when carbon dioxide is low, and reconstructions point to a CO2 decline during late Miocene cooling (Herbert et al. 2016). But C4 grasslands took over at different times on different continents, which suggests regional drivers such as seasonal drought, fire and grazing also mattered. Falling CO2 probably set the stage; local climate and fire decided where and when grass won.</p></div></div></div><div class="twist"><b>Still open</b><p>How low CO2 fell in the late Miocene is still uncertain, because different proxies disagree. Scientists also debate how much fire, grazing animals and monsoon changes drove the grass takeover, and why C4 grasses rose millions of years apart in different regions.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 501 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Age of Grass"><button type="button" class="wtoc-i" data-go="le-grasslands-s1">A warm start, a long cooling</button><button type="button" class="wtoc-i" data-go="le-grasslands-s2">The grass revolution</button><button type="button" class="wtoc-i" data-go="le-grasslands-s3">Apes on the move</button><button type="button" class="wtoc-i" data-go="le-grasslands-s4">Forests under the sea</button></nav></div><section class="wsec" id="le-grasslands-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A warm start, a long cooling</h3><p>Picture a world where palms grew in central Europe and forests reached far into the north. That was the Miocene Climatic Optimum, between about 17 and 14.7 million years ago. A 2021 review of the epoch put carbon dioxide at roughly 400–600 ppm, similar to or above today&#x27;s level, and global temperatures several degrees higher than now. Seas were warm, and ice on Antarctica was smaller and unstable.</p><p>After about 14 million years ago the trend reversed. Antarctica&#x27;s ice expanded and stayed. By the late Miocene, from roughly 7 to 5.5 million years ago, sea surface temperatures fell across the globe, and climates on land grew drier and more seasonal. Herbert and colleagues argued in 2016 that this cooling, linked to falling carbon dioxide, helped build the ecosystems we recognise today.</p></section><section class="wsec" id="le-grasslands-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The grass revolution</h3><p>Grasses are old, but for most of their history they lived in the shade of forests. In the late Miocene one group, the C4 grasses, suddenly took over huge areas of Pakistan, East Africa, South America and North America. C4 plants concentrate carbon dioxide inside their leaves, so they thrive in heat, drought and low CO2, and they recover quickly after fire. Once they spread, fire and grazing helped keep woodlands open.</p><blockquote class="wpull"><p>Grass did not just cover the land. It rewrote the menu for every animal that lived on it.</p></blockquote><aside class="wcall"><b>How do we know?</b><p>Plants that use the C4 pathway take up slightly more of the heavy carbon isotope, carbon-13, than trees and shrubs do. That signature passes into the teeth of animals that eat them and into carbonate nodules in soils. In 1997 Thure Cerling and colleagues measured fossil tooth enamel and ancient soils on several continents and found a sharp rise in carbon-13 between about 8 and 6 million years ago. Fossil grass silica bodies, called phytoliths, add a second line of evidence.</p></aside><p>Animals answered. Horses evolved high-crowned teeth that could survive years of chewing gritty grass. Antelopes, rhinos and elephants shifted their diets too, and grazing herds became a defining feature of open country.</p></section><section class="wsec" id="le-grasslands-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Apes on the move</h3><p>The Miocene was the great age of apes. Early apes such as Proconsul lived in East African forests around 20 million years ago. Later, as Africa and Eurasia joined along the Middle East, apes spread into Europe and Asia. One of them, Danuvius from southern Germany, about 11.6 million years old, has been argued to show a partly upright posture, though that reading is debated. As European forests thinned after about 10 million years ago, most of Europe&#x27;s apes disappeared, while African lineages continued towards gorillas, chimpanzees and us.</p></section><section class="wsec" id="le-grasslands-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Forests under the sea</h3><p>While grass spread on land, another forest grew offshore. Fossil holdfasts, the root-like anchors of kelp, show that kelp already grew in the North Pacific about 32 million years ago. The animals we now link with kelp forests arrived later: by around 14 million years ago, seals, sea lions, urchins and seabirds had joined, and hippo-sized desmostylians may have been early kelp grazers. The Miocene built both of the great forests that feed coastal life and people today.</p></section><details class="srcs"><summary>Sources for this entry (5)</summary><ol><li>Steinthorsdottir, M. et al. (2021). The Miocene: The Future of the Past. Paleoceanography and Paleoclimatology 36: e2020PA004037. <a href="https://doi.org/10.1029/2020PA004037" target="_blank" rel="noopener">doi:10.1029/2020PA004037</a></li><li>Cerling, T.E. et al. (1997). Global vegetation change through the Miocene/Pliocene boundary. Nature 389: 153-158. <a href="https://doi.org/10.1038/38229" target="_blank" rel="noopener">doi:10.1038/38229</a></li><li>Herbert, T.D. et al. (2016). Late Miocene global cooling and the rise of modern ecosystems. Nature Geoscience 9: 843-847. <a href="https://doi.org/10.1038/ngeo2813" target="_blank" rel="noopener">doi:10.1038/ngeo2813</a></li><li>Kiel, S. et al. (2024). Early Oligocene kelp holdfasts and stepwise evolution of the kelp ecosystem in the North Pacific. PNAS 121(4): e2317054121. <a href="https://doi.org/10.1073/pnas.2317054121" target="_blank" rel="noopener">doi:10.1073/pnas.2317054121</a></li><li>Böhme, M. et al. (2019). A new Miocene ape and locomotion in the ancestor of great apes and humans. Nature 575: 489-493. <a href="https://doi.org/10.1038/s41586-019-1731-0" target="_blank" rel="noopener">doi:10.1038/s41586-019-1731-0</a></li></ol></details></div></script><script type="text/x-tpl" id="le-first-hominins-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Sahelanthropus tchadensis skull - Naturmuseum Senckenberg - DSC02104.JPG" data-cap="The First Upright Apes" data-big><figcaption></figcaption></figure><div class="sh-k">Cenozoic · Late Miocene to Early Pliocene</div><h2 class="sh-t" id="le-first-hominins-st" tabindex="-1">The First Upright Apes</h2><p class="sh-s">c. 7–4 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Mixed record</span></span></div></div><p class="v4-q">In the woods and grasslands of a drying, shifting Africa, a few apes began to walk on two legs. Why they stood up is still argued.</p><div class="lx-nums" data-from="lxs-le-first-hominins"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-first-hominins"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Our ancestors stood up because forests turned to savanna.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:50.0%" role="img" aria-label="Weight of evidence: Mixed record"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Early hominins did begin walking upright while Africa was drying and grasslands were spreading, which fits the idea. But Ardipithecus lived in woodland, and Sahelanthropus and Orrorin come from mosaic habitats with trees and water. Bipedalism seems to have begun before open savanna dominated. Many researchers now favour variability selection: changeable, patchy environments rewarded versatile bodies that could both climb and walk (Potts 1998).</p></div></div></div><div class="twist"><b>Still open</b><p>Whether Sahelanthropus walked upright is still argued: a 2026 study of its thigh and forearm bones reports hominin-like features, while critics read the same bones as ape-like. We also do not know which early species, if any, is our direct ancestor, or whether upright walking evolved more than once.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 411 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The First Upright Apes"><button type="button" class="wtoc-i" data-go="le-first-hominins-s1">Three candidates</button><button type="button" class="wtoc-i" data-go="le-first-hominins-s2">Why stand up?</button><button type="button" class="wtoc-i" data-go="le-first-hominins-s3">A variable world</button><button type="button" class="wtoc-i" data-go="le-first-hominins-s4">What the newest bones say</button></nav></div><section class="wsec" id="le-first-hominins-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Three candidates</h3><p>In 2001 a team led by Michel Brunet found a skull in the Djurab Desert of Chad. Nicknamed Toumaï, Sahelanthropus tchadensis is about 7 million years old, with a small, ape-sized brain but small canine teeth and a face flatter than a chimpanzee&#x27;s. The same year, Brigitte Senut and Martin Pickford described Orrorin tugenensis from Kenya, about 6 million years old, whose thigh bones suggest weight carried on two legs. Then came Ardipithecus: Ardipithecus kadabba at 5.8–5.2 million years, and the partial skeleton Ardi, 4.4 million years old, published in full in 2009.</p><p>Ardi surprised everyone. She had a grasping big toe for climbing yet a pelvis adapted for upright walking. She was neither a chimpanzee nor a human, but something in between that no one had predicted.</p></section><section class="wsec" id="le-first-hominins-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Why stand up?</h3><p>For much of the 20th century, the favourite answer was the savanna hypothesis: as forests shrank, apes stranded in open grassland stood up to see over grass, travel between trees or keep cool in the sun. It is a tidy story. The problem is that the oldest bipeds keep turning up in wooded places. Other ideas remain in play:</p><ul class="wlist"><li>Walking uses less energy than knuckle-walking over long distances.</li><li>Free hands can carry food, tools or infants.</li><li>Standing on branches helps reach fruit, as orangutans do today.</li><li>Upright bodies catch less midday sun and more cooling breeze.</li></ul></section><section class="wsec" id="le-first-hominins-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>A variable world</h3><p>Richard Potts proposed in 1998 that what mattered was not one habitat but change itself. East Africa&#x27;s uplift, modelled by Sepulchre and colleagues in 2006, gradually dried the region, while orbital cycles swung rainfall up and down. Under such swings, animals that could both climb and walk, eat fruit and roots, and cope with woodland and grassland would have had an edge.</p><aside class="wcall"><b>How do we know?</b><p>Fossil bones show how an animal moved: the angle where the spine meets the skull, the shape of the pelvis, the neck of the thigh bone and the toes. The setting comes from chemistry. Grasses and trees leave different carbon isotope signatures in soil carbonates and in herbivore teeth, which Cerling and colleagues used in 2011 to estimate woody cover at hominin sites. Volcanic ash layers above and below fossils are dated with argon isotopes.</p></aside></section><section class="wsec" id="le-first-hominins-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>What the newest bones say</h3><p>In January 2026 Scott Williams and colleagues reported three features in Sahelanthropus limb bones: a tubercle on the thigh bone that anchors a ligament used in upright standing, a hominin-like twist of the femur, and hip muscle attachments like those of later hominins. The species still had a chimpanzee-sized brain and probably spent much time in trees. Critics are not yet persuaded, and the debate is lively.</p><blockquote class="wpull"><p>Our ancestors did not leave the forest and stand up. They stood up while the forest was still around them.</p></blockquote></section><details class="srcs"><summary>Sources for this entry (7)</summary><ol><li>Brunet, M. et al. (2002). A new hominid from the Upper Miocene of Chad, Central Africa. Nature 418: 145-151. <a href="https://doi.org/10.1038/nature00879" target="_blank" rel="noopener">doi:10.1038/nature00879</a></li><li>Senut, B. et al. (2001). First hominid from the Miocene (Lukeino Formation, Kenya). Comptes Rendus de l&#x27;Académie des Sciences, Series IIA 332: 137-144. <a href="https://doi.org/10.1016/S1251-8050(01)01529-4" target="_blank" rel="noopener">doi:10.1016/S1251-8050(01)01529-4</a></li><li>White, T.D. et al. (2009). Ardipithecus ramidus and the paleobiology of early hominids. Science 326: 75-86. <a href="https://doi.org/10.1126/science.1175802" target="_blank" rel="noopener">doi:10.1126/science.1175802</a></li><li>Potts, R. (1998). Variability selection in hominid evolution. Evolutionary Anthropology 7: 81-96.</li><li>Sepulchre, P. et al. (2006). Tectonic uplift and Eastern Africa aridification. Science 313: 1419-1423. <a href="https://doi.org/10.1126/science.1129158" target="_blank" rel="noopener">doi:10.1126/science.1129158</a></li><li>Cerling, T.E. et al. (2011). Woody cover and hominin environments in the past 6 million years. Nature 476: 51-56. <a href="https://doi.org/10.1038/nature10306" target="_blank" rel="noopener">doi:10.1038/nature10306</a></li><li>Williams, S.A. et al. (2026). Earliest evidence of hominin bipedalism in Sahelanthropus tchadensis. Science Advances 12: eadv0130. <a href="https://doi.org/10.1126/sciadv.adv0130" target="_blank" rel="noopener">doi:10.1126/sciadv.adv0130</a></li></ol></details></div></script><script type="text/x-tpl" id="le-messinian-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Messinian salinity crisis 5.96 mya stage - drying.jpg" data-cap="When the Mediterranean Became a Salt Desert" data-big><figcaption></figcaption></figure><div class="sh-k">Cenozoic · Late Miocene (Messinian) to Early Pliocene (Zanclean)</div><h2 class="sh-t" id="le-messinian-st" tabindex="-1">When the Mediterranean Became a Salt Desert</h2><p class="sh-s">c. 5.97–5.33 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Plausible</span></span></div></div><p class="v4-q">Cut off from the Atlantic, the Mediterranean shrank into a salt-crusted basin far below sea level, then refilled, perhaps in a flood of unimaginable size.</p><div class="lx-nums" data-from="lxs-le-messinian"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-messinian"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The Mediterranean refilled in a catastrophic flood through Gibraltar.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">A long erosion channel beneath the Strait of Gibraltar, a huge chaotic deposit at the foot of the Malta Escarpment and about 300 streamlined ridges on the Sicily Sill all fit a sudden, violent inflow (Garcia-Castellanos et al. 2009; Micallef et al. 2018, 2025). But no single site records the flood unambiguously, and several specialist teams read the same rocks as the product of slower refilling. The megaflood is a serious candidate, not an established event.</p></div></div></div><div class="twist"><b>Still open</b><p>How far the sea actually fell is debated: some argue for a deep, nearly empty basin, others for a shallower, partly connected sea. Critics favour repeated drying and refilling, or a gradual rise fed by rivers and the Paratethys lakes to the north-east. New drilling near the Atlantic gateways may help decide.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 486 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of When the Mediterranean Became a Salt Desert"><button type="button" class="wtoc-i" data-go="le-messinian-s1">A sea cut off</button><button type="button" class="wtoc-i" data-go="le-messinian-s2">Two steps down</button><button type="button" class="wtoc-i" data-go="le-messinian-s3">The flood</button><button type="button" class="wtoc-i" data-go="le-messinian-s4">Flood or slow return?</button></nav></div><section class="wsec" id="le-messinian-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A sea cut off</h3><p>In 1970 the drilling ship Glomar Challenger pulled up something no one expected from the bottom of the Mediterranean: layers of salt, gypsum and pebbles that looked as if they had formed in desert pans and dry river beds. Kenneth Hsü, William Ryan and Maria Bianca Cita proposed in 1973 that the whole sea had once dried out. The idea sounded outrageous. Five decades of seismic surveys and drilling have made a salt crisis the accepted framework, even if its details are still fought over.</p><p>The trigger was a squeezed gateway. Tectonic uplift in southern Spain and northern Morocco slowly narrowed the Atlantic connections. Krijgsman and colleagues dated the start of the crisis to about 5.97 million years ago. With little ocean water flowing in, the hot, dry Mediterranean lost water faster than rivers could replace it.</p></section><section class="wsec" id="le-messinian-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Two steps down</h3><p>A 2024 study led by Giovanni Aloisi used chlorine isotopes in the salt to reconstruct how the sea shrank. It suggests two phases. First, over roughly 35,000 years, salt piled up in the eastern basin while the sea was still partly connected. Then, in less than 10,000 years, the sea dropped dramatically, by about 1.7–2.1 km in the east and about 0.85 km in the west, losing up to 70% of its water. The weight removed from the crust may even have triggered local volcanic eruptions.</p><aside class="wcall"><b>How do we know?</b><p>Seismic surveys, which bounce sound off buried layers, map the salt and the canyons cut into the old sea margins. Drill cores show evaporites, minerals left behind when seawater dries. Chlorine exists as two stable isotopes, and as salt crystallises it takes up slightly more of the heavier one, so the isotope pattern through a salt layer records how much water had already evaporated. Microfossils and volcanic ash layers provide the dates.</p></aside></section><section class="wsec" id="le-messinian-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The flood</h3><p>About 5.33 million years ago the Atlantic broke back in. In 2009 Daniel Garcia-Castellanos and colleagues described a buried erosion channel under the Strait of Gibraltar and modelled what happened next: a flood that could have refilled most of the basin within months to about two years, raising the water by metres a day at its peak. A 2025 study led by Aaron Micallef mapped about 300 streamlined ridges on the Sicily Sill, carved as the water poured east at an estimated 68–100 million cubic metres per second.</p><blockquote class="wpull"><p>At its peak, the refill may have carried hundreds of Amazon Rivers through a gap in the rocks.</p></blockquote></section><section class="wsec" id="le-messinian-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Flood or slow return?</h3><p>Not everyone is convinced. Researchers at Granada, Parma and Utrecht argue that some supposed flood deposits have other explanations, and that the basin may have filled in stages. A 2025 model led by Garcia-Castellanos himself explored rivers and the Paratethys lakes raising the Mediterranean to within a few hundred metres of ocean level before the final breach, which would make the last flood smaller. The honest summary: the Mediterranean clearly lost a great deal of water, and a catastrophic final refill remains plausible but unconfirmed.</p></section><details class="srcs"><summary>Sources for this entry (7)</summary><ol><li>Hsü, K.J., Ryan, W.B.F. &amp; Cita, M.B. (1973). Late Miocene desiccation of the Mediterranean. Nature 242: 240-244. <a href="https://doi.org/10.1038/242240a0" target="_blank" rel="noopener">doi:10.1038/242240a0</a></li><li>Krijgsman, W. et al. (1999). Chronology, causes and progression of the Messinian salinity crisis. Nature 400: 652-655. <a href="https://doi.org/10.1038/23231" target="_blank" rel="noopener">doi:10.1038/23231</a></li><li>Garcia-Castellanos, D. et al. (2009). Catastrophic flood of the Mediterranean after the Messinian salinity crisis. Nature 462: 778-781. <a href="https://doi.org/10.1038/nature08555" target="_blank" rel="noopener">doi:10.1038/nature08555</a></li><li>Micallef, A. et al. (2018). Evidence of the Zanclean megaflood in the eastern Mediterranean Basin. Scientific Reports 8: 1078. <a href="https://doi.org/10.1038/s41598-018-19446-3" target="_blank" rel="noopener">doi:10.1038/s41598-018-19446-3</a></li><li>Micallef, A. et al. (2025). Land-to-sea indicators of the Zanclean megaflood. Communications Earth &amp; Environment. <a href="https://doi.org/10.1038/s43247-024-01972-w" target="_blank" rel="noopener">doi:10.1038/s43247-024-01972-w</a></li><li>Aloisi, G. et al. (2024). Chlorine isotopes constrain a major drawdown of the Mediterranean Sea during the Messinian Salinity Crisis. Nature Communications 15. <a href="https://doi.org/10.1038/s41467-024-53781-6" target="_blank" rel="noopener">doi:10.1038/s41467-024-53781-6</a></li><li>Knowable Magazine (2026). The case against the Zanclean megaflood refilling the Mediterranean. knowablemagazine.org.</li></ol></details></div></script><script type="text/x-tpl" id="le-pliocene-warm-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Reconstruction of the fossil skeleton of &quot;Lucy&quot; the Australopithecus afarensis.jpg" data-cap="The Last Time CO2 Was This High" data-big><figcaption></figcaption></figure><div class="sh-k">Cenozoic · Pliocene (Piacenzian)</div><h2 class="sh-t" id="le-pliocene-warm-st" tabindex="-1">The Last Time CO2 Was This High</h2><p class="sh-s">c. 3.3–3.0 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Strong evidence</span></span></div></div><p class="v4-q">With carbon dioxide close to today&#x27;s level, the mid-Pliocene world was warmer, the Arctic was forested, and the seas stood metres higher.</p><div class="lx-nums" data-from="lxs-le-pliocene-warm"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-pliocene-warm"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The last time carbon dioxide was as high as today, about 3 million years ago, Earth was several degrees warmer and seas stood metres higher.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Independent proxies, including boron isotopes in plankton shells, leaf pores and plant waxes, place mid-Pliocene CO2 near or below today&#x27;s 420-plus ppm, while pollen, plankton and Arctic tree remains show clear warmth. Sea level is the weakest link: estimates depend on how coasts have risen or sunk since, so ranges run from about 5 to 25 m. The broad picture is robust; the exact numbers are not.</p></div></div></div><div class="twist"><b>Still open</b><p>How much Pliocene warmth came from CO2 and how much from slower changes, such as smaller ice sheets, different ocean gateways and vegetation, is debated. Whether parts of East Antarctica&#x27;s ice melted is uncertain. And today&#x27;s warming is far faster than any Pliocene change, so the Pliocene shows a possible end state, not the path.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 437 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Last Time CO2 Was This High"><button type="button" class="wtoc-i" data-go="le-pliocene-warm-s1">A warm mirror</button><button type="button" class="wtoc-i" data-go="le-pliocene-warm-s2">Camels in the Arctic</button><button type="button" class="wtoc-i" data-go="le-pliocene-warm-s3">A bridge between continents</button><button type="button" class="wtoc-i" data-go="le-pliocene-warm-s4">Walkers in the ash</button></nav></div><section class="wsec" id="le-pliocene-warm-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A warm mirror</h3><p>Climate scientists keep returning to a slice of time about 3 million years ago. Continents and oceans were almost in their present places, many plants and animals were close relatives of today&#x27;s, and carbon dioxide was near its current level. That makes the mid-Pliocene Warm Period the closest natural experiment we have for a world with our present CO2. The IPCC assessed its carbon dioxide at 360–420 ppm and its global temperature at 2.5–4 °C above pre-industrial.</p><p>In 2020 Elwyn de la Vega and colleagues, using boron isotopes in fossil plankton, estimated an average of 367 ppm, with peaks near 394 ppm. They noted that, at current emission rates, the air would hold more carbon dioxide by 2025 than at any time in at least 3.3 million years. That moment has now passed.</p><blockquote class="wpull"><p>The Pliocene is not a forecast. It is a reminder of where a world with our carbon dioxide once settled.</p></blockquote></section><section class="wsec" id="le-pliocene-warm-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Camels in the Arctic</h3><p>On Ellesmere Island in Arctic Canada, Natalia Rybczynski and colleagues found fragments of a leg bone that collagen analysis matched to camels. The deposit, about 3.4 million years old, held remains of a boreal forest with larch and birch. Lake sediments in north-east Siberia likewise record Arctic summers far warmer than now. In Africa, pollen and models suggest a smaller, greener Sahara.</p><aside class="wcall"><b>How do we know?</b><p>Carbon dioxide comes from proxies: the boron isotope ratio in tiny plankton shells tracks ocean acidity, which follows CO2, and fossil leaves grow fewer breathing pores when CO2 is high. Temperatures come from plankton chemistry and fossil pollen. Sea level is read from ancient shorelines and cave deposits, such as calcite crusts in Mallorca caves that form at the water table, corrected for how the land has moved since.</p></aside></section><section class="wsec" id="le-pliocene-warm-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>A bridge between continents</h3><p>For tens of millions of years South America was an island continent with its own animals. Aaron O&#x27;Dea and colleagues concluded in 2016 that the Isthmus of Panama fully formed about 2.8 million years ago, while others argue for earlier land connections. Either way, animals flooded across. The exchange reshaped both continents and is one of the best natural experiments in how ecosystems mix.</p></section><section class="wsec" id="le-pliocene-warm-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Walkers in the ash</h3><p>About 3.66 million years ago at Laetoli, Tanzania, a volcano dusted the ground with ash, rain turned it to a paste, and hominins walked across it. Mary Leakey&#x27;s team uncovered their trails in 1978: a human-like heel strike and aligned big toe. In 2021 Ellison McNutt and colleagues reexamined a second Laetoli trail and argued it was left by a different kind of biped. Lucy, found at Hadar in 1974 and dated to about 3.2 million years ago, lived in the warm Pliocene. Our ancestors knew this climate firsthand.</p></section><details class="srcs"><summary>Sources for this entry (8)</summary><ol><li>Gulev, S.K. et al. (2021). Changing State of the Climate System. In: Climate Change 2021: The Physical Science Basis (IPCC AR6 WGI), Cambridge University Press, 287-422. <a href="https://doi.org/10.1017/9781009157896.004" target="_blank" rel="noopener">doi:10.1017/9781009157896.004</a></li><li>de la Vega, E. et al. (2020). Atmospheric CO2 during the Mid-Piacenzian Warm Period and the M2 glaciation. Scientific Reports 10: 11002. <a href="https://doi.org/10.1038/s41598-020-67154-8" target="_blank" rel="noopener">doi:10.1038/s41598-020-67154-8</a></li><li>Dumitru, O.A. et al. (2019). Constraints on global mean sea level during Pliocene warmth. Nature 574: 233-236. <a href="https://doi.org/10.1038/s41586-019-1543-2" target="_blank" rel="noopener">doi:10.1038/s41586-019-1543-2</a></li><li>O&#x27;Dea, A. et al. (2016). Formation of the Isthmus of Panama. Science Advances 2: e1600883. <a href="https://doi.org/10.1126/sciadv.1600883" target="_blank" rel="noopener">doi:10.1126/sciadv.1600883</a></li><li>Rybczynski, N. et al. (2013). Mid-Pliocene warm-period deposits in the High Arctic yield insight into camel evolution. Nature Communications 4: 1550. <a href="https://doi.org/10.1038/ncomms2516" target="_blank" rel="noopener">doi:10.1038/ncomms2516</a></li><li>Leakey, M.D. &amp; Hay, R.L. (1979). Pliocene footprints in the Laetolil Beds at Laetoli, northern Tanzania. Nature 278: 317-323. <a href="https://doi.org/10.1038/278317a0" target="_blank" rel="noopener">doi:10.1038/278317a0</a></li><li>McNutt, E.J. et al. (2021). Footprint evidence of early hominin locomotor diversity at Laetoli, Tanzania. Nature 600: 468-471. <a href="https://doi.org/10.1038/s41586-021-04187-7" target="_blank" rel="noopener">doi:10.1038/s41586-021-04187-7</a></li><li>Johanson, D.C. &amp; Taieb, M. (1976). Plio-Pleistocene hominid discoveries in Hadar, Ethiopia. Nature 260: 293-297. <a href="https://doi.org/10.1038/260293a0" target="_blank" rel="noopener">doi:10.1038/260293a0</a></li></ol></details></div></script><script type="text/x-tpl" id="le-ice-ages-begin-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Olduvai stone chopping tool.jpg" data-cap="The Ice Ages Begin" data-big><figcaption></figcaption></figure><div class="sh-k">Ice Ages · Late Pliocene to Early Pleistocene (Piacenzian to Gelasian)</div><h2 class="sh-t" id="le-ice-ages-begin-st" tabindex="-1">The Ice Ages Begin</h2><p class="sh-s">c. 2.7–2.4 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Mixed record</span></span></div></div><p class="v4-q">As great ice sheets began to grow and melt across the north, Africa dried and flickered, and our ancestors reached for stone.</p><div class="lx-nums" data-from="lxs-le-ice-ages-begin"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-ice-ages-begin"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The start of the ice ages drove the origin of our genus, Homo.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:50.0%" role="img" aria-label="Weight of evidence: Mixed record"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The timing is suggestive: the oldest Homo fossil, a jaw from Ledi-Geraru, is about 2.8 million years old, close to the onset of northern glaciation and pulses of African drying. But fossils are sparse, dates have wide error bars, and stone tools start before Homo, at Lomekwi 3.3 million years ago. Climate probably shaped the stage, yet linking one global shift to the birth of a genus remains hard to test.</p></div></div></div><div class="twist"><b>Still open</b><p>Whether Lomekwi&#x27;s artefacts are truly 3.3 million years old and deliberately made has been questioned. Who made the earliest Oldowan tools is unclear: at Nyayanga, Kenya, they lie with Paranthropus teeth. And how strongly northern ice actually changed East African rainfall is debated.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 390 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Ice Ages Begin"><button type="button" class="wtoc-i" data-go="le-ice-ages-begin-s1">Ice in the north</button><button type="button" class="wtoc-i" data-go="le-ice-ages-begin-s2">The rhythm of the orbit</button><button type="button" class="wtoc-i" data-go="le-ice-ages-begin-s3">Stone in hand</button><button type="button" class="wtoc-i" data-go="le-ice-ages-begin-s4">Enter Homo</button></nav></div><section class="wsec" id="le-ice-ages-begin-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Ice in the north</h3><p>For most of the Cenozoic, the Northern Hemisphere had little permanent ice. Around 2.7 million years ago that changed. Deep-sea cores show oxygen isotope swings growing larger, and rock debris dropped by icebergs appears far out in the North Atlantic. Falling carbon dioxide, from Pliocene levels near today&#x27;s towards the lows of the ice ages, is the leading explanation, with ocean gateway changes such as the closing of Panama as possible helpers.</p><p>From then on, Earth breathed in and out. Ice sheets grew for tens of thousands of years, then melted back. In this early phase the beat was about 41,000 years.</p></section><section class="wsec" id="le-ice-ages-begin-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The rhythm of the orbit</h3><p>In the early 20th century the Serbian scientist Milutin Milanković calculated how Earth&#x27;s orbit changes the sunlight reaching high northern latitudes in summer. In 1976 James Hays, John Imbrie and Nicholas Shackleton found his rhythms in deep-sea sediments. Three cycles matter:</p><ul class="wlist"><li>Eccentricity: the orbit stretches from nearly circular to more oval over about 100,000 and 400,000 years.</li><li>Obliquity: the tilt of Earth&#x27;s axis nods between about 22 and 24.5 degrees over about 41,000 years.</li><li>Precession: the axis wobbles like a spinning top, shifting which season meets the closest approach to the Sun, over about 19,000–23,000 years.</li></ul><blockquote class="wpull"><p>Tiny changes in sunlight, amplified by ice, oceans and carbon dioxide, were enough to bury continents.</p></blockquote></section><section class="wsec" id="le-ice-ages-begin-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Stone in hand</h3><p>In 2015 Sonia Harmand&#x27;s team reported flakes and cores at Lomekwi 3, west of Lake Turkana, dated to about 3.3 million years ago. If correct, tool making began before our genus. The classic Oldowan kit of sharp flakes and choppers appears by about 2.6 million years ago at Gona, Ethiopia, and possibly as early as 3.0–2.6 million years ago at Nyayanga, Kenya, where tools were used to butcher hippos. At Namorotukunan, a 2025 study found three layers of Oldowan tools spanning 2.75 to 2.44 million years ago, through drying, fires and vegetation change.</p><aside class="wcall"><b>How do we know?</b><p>Tools and fossils are dated with volcanic ash layers, whose crystals hold argon that accumulates at a known rate, and with reversals of Earth&#x27;s magnetic field frozen into sediments. The ice ages themselves are read from oxygen isotopes in tiny seafloor shells: when ice sheets grow, they lock up the lighter oxygen, leaving ocean water and shells richer in the heavier kind. Lisiecki and Raymo stacked 57 such records into one global curve.</p></aside></section><section class="wsec" id="le-ice-ages-begin-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Enter Homo</h3><p>In 2013 a jaw was found at Ledi-Geraru in Ethiopia. Published in 2015, it is about 2.8 million years old and has features pointing towards Homo. Over the next million years, Homo bodies grew taller and brains larger. Whether the ice ages caused that trajectory or simply accompanied it remains open, but the people who made those first tools lived through an increasingly restless climate.</p></section><details class="srcs"><summary>Sources for this entry (7)</summary><ol><li>Lisiecki, L.E. &amp; Raymo, M.E. (2005). A Pliocene-Pleistocene stack of 57 globally distributed benthic δ18O records. Paleoceanography 20: PA1003. <a href="https://doi.org/10.1029/2004PA001071" target="_blank" rel="noopener">doi:10.1029/2004PA001071</a></li><li>Hays, J.D., Imbrie, J. &amp; Shackleton, N.J. (1976). Variations in the Earth&#x27;s orbit: pacemaker of the ice ages. Science 194: 1121-1132. <a href="https://doi.org/10.1126/science.194.4270.1121" target="_blank" rel="noopener">doi:10.1126/science.194.4270.1121</a></li><li>Harmand, S. et al. (2015). 3.3-million-year-old stone tools from Lomekwi 3, West Turkana, Kenya. Nature 521: 310-315. <a href="https://doi.org/10.1038/nature14464" target="_blank" rel="noopener">doi:10.1038/nature14464</a></li><li>Braun, D.R. et al. (2025). Early Oldowan technology thrived during Pliocene environmental change in the Turkana Basin, Kenya. Nature Communications 16: 9401. <a href="https://doi.org/10.1038/s41467-025-64244-x" target="_blank" rel="noopener">doi:10.1038/s41467-025-64244-x</a></li><li>Villmoare, B. et al. (2015). Early Homo at 2.8 Ma from Ledi-Geraru, Afar, Ethiopia. Science 347: 1352-1355. <a href="https://doi.org/10.1126/science.aaa1343" target="_blank" rel="noopener">doi:10.1126/science.aaa1343</a></li><li>Plummer, T.W. et al. (2023). Expanded geographic distribution and dietary strategies of the earliest Oldowan hominins and Paranthropus. Science 379: 561-566. <a href="https://doi.org/10.1126/science.abo7452" target="_blank" rel="noopener">doi:10.1126/science.abo7452</a></li><li>deMenocal, P.B. (2004). African climate change and faunal evolution during the Pliocene-Pleistocene. Earth and Planetary Science Letters 220: 3-24. <a href="https://doi.org/10.1016/S0012-821X(04)00003-2" target="_blank" rel="noopener">doi:10.1016/S0012-821X(04)00003-2</a></li></ol></details></div></script><script type="text/x-tpl" id="le-mid-pleistocene-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Dmanisi-D2282. Homo erectus or Homo georgicus.jpg" data-cap="When the Ice Ages Grew Longer" data-big><figcaption></figcaption></figure><div class="sh-k">Ice Ages · Early to Middle Pleistocene (Calabrian to Chibanian)</div><h2 class="sh-t" id="le-mid-pleistocene-st" tabindex="-1">When the Ice Ages Grew Longer</h2><p class="sh-s">c. 1.25–0.7 million years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Open question</span></span></div></div><p class="v4-q">The rhythm of the ice changed: short, gentle cycles gave way to long, deep ice ages, as our ancestors spread and struggled across three continents.</p><div class="lx-nums" data-from="lxs-le-mid-pleistocene"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-mid-pleistocene"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Our ancestors came close to dying out about 900,000 years ago.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:41.7%" role="img" aria-label="Weight of evidence: Open question"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">A 2023 genetic study (Hu et al.) inferred that the ancestors of modern humans fell to about 1,280 breeding individuals for roughly 117,000 years during the transition. A gap in the African fossil record around then fits loosely. But other geneticists argue the method can mistake population structure for a crash, and the signal is not clear in some other analyses. Humans lived on several continents then, though not all were our direct ancestors.</p></div></div></div><div class="twist"><b>Still open</b><p>The cause of the Mid-Pleistocene Transition is unresolved: falling carbon dioxide, erosion of soft ground beneath ice sheets and changes in ocean circulation are all candidates, and they may have acted together. Early dates for controlled fire are debated, because natural wildfires can leave similar traces.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 336 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of When the Ice Ages Grew Longer"><button type="button" class="wtoc-i" data-go="le-mid-pleistocene-s1">A new rhythm</button><button type="button" class="wtoc-i" data-go="le-mid-pleistocene-s2">Why did it change?</button><button type="button" class="wtoc-i" data-go="le-mid-pleistocene-s3">Humans on the move</button><button type="button" class="wtoc-i" data-go="le-mid-pleistocene-s4">Fire and a narrow squeeze</button></nav></div><section class="wsec" id="le-mid-pleistocene-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A new rhythm</h3><p>Seafloor records show a striking change between about 1.25 million and 700,000 years ago. The early ice ages were modest and regular, keeping time with the 41,000-year tilt of Earth&#x27;s axis. After the transition, glacials lasted around 100,000 years, grew enormous ice sheets and ended in rapid collapses. Nothing in Earth&#x27;s orbit changed to match, so scientists look inside the climate system for the cause.</p><aside class="wcall"><b>How do we know?</b><p>Tiny shells of seafloor foraminifera record ice volume and deep-ocean temperature in their oxygen isotopes, layer after layer, for millions of years. Ice cores add air itself: in 2019 Yuzhen Yan and colleagues analysed bubbles in two-million-year-old ice from Allan Hills, Antarctica, and found that glacial carbon dioxide levels before the transition were higher than those of later glacials, while interglacial levels stayed similar.</p></aside></section><section class="wsec" id="le-mid-pleistocene-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Why did it change?</h3><p>Peter Clark and colleagues reviewed the leading explanations in 2006. None has won outright:</p><ul class="wlist"><li>Falling carbon dioxide made it easier for ice sheets to survive warm summers and grow.</li><li>Early ice sheets scraped away soft soils, so later ice rested on hard bedrock, grew thicker and lasted longer.</li><li>Changes in the Southern Ocean stored more carbon in the deep sea during glacials.</li></ul></section><section class="wsec" id="le-mid-pleistocene-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Humans on the move</h3><p>By this time our relatives were already widespread. Stone tools at Shangchen, China, are about 2.1 million years old, and Homo erectus lived at Dmanisi, Georgia, about 1.8 million years ago. In 2025 Rosa Huguet&#x27;s team described a partial face from Sima del Elefante, Atapuerca, dated to 1.4–1.1 million years ago and assigned to a form close to Homo erectus. They proposed a population turnover in Europe before Homo antecessor, known from nearby Gran Dolina at about 900,000–800,000 years ago. At Happisburgh, on England&#x27;s eroding coast, footprints of adults and children were briefly exposed in 2013.</p><blockquote class="wpull"><p>The ice ages did not stop our ancestors from moving. They may have kept them moving.</p></blockquote></section><section class="wsec" id="le-mid-pleistocene-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Fire and a narrow squeeze</h3><p>Burned bone and plant ash deep inside Wonderwerk Cave, about 1 million years old, point to fire used in place. At Gesher Benot Ya&#x27;aqov in Israel, burned seeds, wood and flint cluster in patterns suggesting hearths about 790,000 years ago. Fire meant warmth, protection and cooked food. Meanwhile a 2023 genetic study proposed that our own ancestral line shrank to about 1,280 breeders for over 100,000 years during the transition. If true, the harsher new ice-age rhythm nearly ended our story.</p></section><h3 class="sub-h wsub">Go deeper</h3><div class="links-row"><button type="button" onclick="openItem('articles','case-other-humans')">The Other Humans <span aria-hidden="true">→</span></button></div><details class="srcs"><summary>Sources for this entry (8)</summary><ol><li>Clark, P.U. et al. (2006). The middle Pleistocene transition: characteristics, mechanisms, and implications for long-term changes in atmospheric pCO2. Quaternary Science Reviews 25: 3150-3184. <a href="https://doi.org/10.1016/j.quascirev.2006.07.008" target="_blank" rel="noopener">doi:10.1016/j.quascirev.2006.07.008</a></li><li>Yan, Y. et al. (2019). Two-million-year-old snapshots of atmospheric gases from Antarctic ice. Nature 574: 663-666. <a href="https://doi.org/10.1038/s41586-019-1692-3" target="_blank" rel="noopener">doi:10.1038/s41586-019-1692-3</a></li><li>Huguet, R. et al. (2025). The earliest human face of Western Europe. Nature 640: 707-713. <a href="https://doi.org/10.1038/s41586-025-08681-0" target="_blank" rel="noopener">doi:10.1038/s41586-025-08681-0</a></li><li>Hu, W. et al. (2023). Genomic inference of a severe human bottleneck during the Early to Middle Pleistocene transition. Science 381: 979-984. <a href="https://doi.org/10.1126/science.abq7487" target="_blank" rel="noopener">doi:10.1126/science.abq7487</a></li><li>Berna, F. et al. (2012). Microstratigraphic evidence of in situ fire in the Acheulean strata of Wonderwerk Cave, Northern Cape province, South Africa. PNAS 109: E1215-E1220. <a href="https://doi.org/10.1073/pnas.1117620109" target="_blank" rel="noopener">doi:10.1073/pnas.1117620109</a></li><li>Goren-Inbar, N. et al. (2004). Evidence of hominin control of fire at Gesher Benot Ya&#x27;aqov, Israel. Science 304: 725-727. <a href="https://doi.org/10.1126/science.1095443" target="_blank" rel="noopener">doi:10.1126/science.1095443</a></li><li>Ashton, N. et al. (2014). Hominin footprints from Early Pleistocene deposits at Happisburgh, UK. PLoS ONE 9: e88329. <a href="https://doi.org/10.1371/journal.pone.0088329" target="_blank" rel="noopener">doi:10.1371/journal.pone.0088329</a></li><li>Zhu, Z. et al. (2018). Hominin occupation of the Chinese Loess Plateau since about 2.1 million years ago. Nature 559: 608-612. <a href="https://doi.org/10.1038/s41586-018-0299-4" target="_blank" rel="noopener">doi:10.1038/s41586-018-0299-4</a></li></ol></details></div></script><script type="text/x-tpl" id="le-toba-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Toba Caldera, Sumatra (ASTER).jpg" data-cap="Toba: The Supereruption" data-big><figcaption></figcaption></figure><div class="sh-k">Ice Ages · Late Pleistocene</div><h2 class="sh-t" id="le-toba-st" tabindex="-1">Toba: The Supereruption</h2><p class="sh-s">c. 74,000 years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--debunked"><svg class="i" aria-hidden="true"><use href="#i9"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Ruled out</span></span></div></div><p class="v4-q">One of the largest eruptions of the past two million years blanketed South Asia in ash. Did it also push humanity to the edge?</p><div class="lx-nums" data-from="lxs-le-toba"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-toba"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The Toba eruption nearly wiped out humanity.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:8.3%" role="img" aria-label="Weight of evidence: Ruled out"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--debunked"><svg clas
