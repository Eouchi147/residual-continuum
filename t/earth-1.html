s="i" aria-hidden="true"><use href="#i9"/></svg>Ruled out</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The idea, popularised in 1998 (Ambrose), linked Toba&#x27;s volcanic winter to a genetic bottleneck in our species. Since then, sites spanning the ash layer in South Africa, Ethiopia and India show people carrying on and adapting, and Lake Malawi cores show no volcanic winter in East Africa. Bottlenecks in our genes are better explained by other events, such as small founding groups leaving Africa. Regional hardship is likely; near extinction is contradicted by the evidence.</p></div></div></div><div class="twist"><b>Still open</b><p>How cold and how long any volcanic winter was is still modelled with wide ranges. Whether the Jwalapuram toolmakers were modern humans or another kind of human is debated. The eruption&#x27;s effect on Denisovans and other Asian populations remains unknown.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">1 min read · 304 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Toba: The Supereruption"><button type="button" class="wtoc-i" data-go="le-toba-s1">The blast</button><button type="button" class="wtoc-i" data-go="le-toba-s2">The bottleneck idea</button><button type="button" class="wtoc-i" data-go="le-toba-s3">Testing it in the dirt</button><button type="button" class="wtoc-i" data-go="le-toba-s4">What remains open</button></nav></div><section class="wsec" id="le-toba-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The blast</h3><p>About 74,000 years ago a vast magma chamber beneath northern Sumatra emptied in a short, violent episode. Columns of ash rose into the stratosphere, and pyroclastic flows swept the surrounding land. The collapsed roof left a caldera about 100 km long, today filled by Lake Toba with Samosir Island in its middle. Michael Storey and colleagues dated the eruption in 2012 to about 73,880 years ago, with an uncertainty of a few hundred years.</p><p>In 1992 Michael Rampino and Stephen Self proposed that Toba&#x27;s sulphur could have caused a volcanic winter, with years of darkened skies and a sharp global cooling.</p></section><section class="wsec" id="le-toba-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>The bottleneck idea</h3><p>In 1998 anthropologist Stanley Ambrose connected that volcanic winter to a puzzle in our DNA: modern humans are genetically less diverse than chimpanzees, suggesting our ancestors passed through a small population at some point. Perhaps, he argued, Toba cut humanity down to a few thousand survivors. The story spread quickly through documentaries and popular books.</p><blockquote class="wpull"><p>It was a dramatic story with a testable prediction: if the world nearly ended, the archaeology should show it.</p></blockquote></section><section class="wsec" id="le-toba-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Testing it in the dirt</h3><p>Researchers went looking for sites that span the ash. What they found, again and again, was continuity:</p><ul class="wlist"><li>Jwalapuram, India (Petraglia et al. 2007): similar stone tools just below and just above the Toba ash.</li><li>Dhaba, India (Clarkson et al. 2020): toolmaking continued across the eruption.</li><li>Lake Malawi (Lane et al. 2013): no volcanic winter signal in East African lake sediments.</li><li>Pinnacle Point, South Africa (Smith et al. 2018): occupation continued and intensified through the ash fall.</li><li>Shinfa-Metema 1, Ethiopia (Kappelman et al. 2024): people adjusted to drier conditions by fishing and following seasonal rivers.</li></ul><aside class="wcall"><b>How do we know?</b><p>The key is cryptotephra: volcanic glass shards too small to see, sieved out of cave sediments and lake muds. Each eruption&#x27;s glass has a chemical fingerprint, so shards found in South Africa or Malawi can be matched to Toba. Because the ash fell within weeks, its layer marks the same moment everywhere. Archaeologists then compare tools, bones and plant remains just below and just above that line.</p></aside></section><section class="wsec" id="le-toba-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>What remains open</h3><p>None of this means Toba was harmless. People living near Sumatra or under the thickest ash in India may have suffered badly, and some climate models find sharp regional cooling alongside sheltered refuges. But the claim that humanity nearly vanished no longer fits the evidence.</p></section><h3 class="sub-h wsub">Go deeper</h3><div class="links-row"><button type="button" onclick="openItem('timeline','age-01')">Many Kinds of Human <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-other-humans')">The Other Humans <span aria-hidden="true">→</span></button></div><details class="srcs"><summary>Sources for this entry (8)</summary><ol><li>Storey, M. et al. (2012). Astronomically calibrated 40Ar/39Ar age for the Toba supereruption and global synchronization of late Quaternary records. PNAS 109: 18684-18688. <a href="https://doi.org/10.1073/pnas.1208178109" target="_blank" rel="noopener">doi:10.1073/pnas.1208178109</a></li><li>Rampino, M.R. &amp; Self, S. (1992). Volcanic winter and accelerated glaciation following the Toba super-eruption. Nature 359: 50-52. <a href="https://doi.org/10.1038/359050a0" target="_blank" rel="noopener">doi:10.1038/359050a0</a></li><li>Ambrose, S.H. (1998). Late Pleistocene human population bottlenecks, volcanic winter, and differentiation of modern humans. Journal of Human Evolution 34: 623-651. <a href="https://doi.org/10.1006/jhev.1998.0219" target="_blank" rel="noopener">doi:10.1006/jhev.1998.0219</a></li><li>Petraglia, M. et al. (2007). Middle Paleolithic assemblages from the Indian subcontinent before and after the Toba super-eruption. Science 317: 114-116. <a href="https://doi.org/10.1126/science.1141564" target="_blank" rel="noopener">doi:10.1126/science.1141564</a></li><li>Lane, C.S., Chorn, B.T. &amp; Johnson, T.C. (2013). Ash from the Toba supereruption in Lake Malawi shows no volcanic winter in East Africa at 75 ka. PNAS 110: 8025-8029. <a href="https://doi.org/10.1073/pnas.1301474110" target="_blank" rel="noopener">doi:10.1073/pnas.1301474110</a></li><li>Smith, E.I. et al. (2018). Humans thrived in South Africa through the Toba eruption about 74,000 years ago. Nature 555: 511-515. <a href="https://doi.org/10.1038/nature25967" target="_blank" rel="noopener">doi:10.1038/nature25967</a></li><li>Kappelman, J. et al. (2024). Adaptive foraging behaviours in the Horn of Africa during Toba supereruption. Nature 628: 365-372. <a href="https://doi.org/10.1038/s41586-024-07208-3" target="_blank" rel="noopener">doi:10.1038/s41586-024-07208-3</a></li><li>Clarkson, C. et al. (2020). Human occupation of northern India spans the Toba super-eruption ~74,000 years ago. Nature Communications 11: 961. <a href="https://doi.org/10.1038/s41467-020-14668-4" target="_blank" rel="noopener">doi:10.1038/s41467-020-14668-4</a></li></ol></details></div></script><script type="text/x-tpl" id="le-megafauna-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Woolly mammoth (Mammuthus primigenius) - Mauricio Antón.jpg" data-cap="The Vanishing Giants" data-big><figcaption></figcaption></figure><div class="sh-k">Ice Ages · Late Pleistocene to Early Holocene</div><h2 class="sh-t" id="le-megafauna-st" tabindex="-1">The Vanishing Giants</h2><p class="sh-s">c. 50,000–10,000 years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Strong evidence</span></span></div></div><p class="v4-q">Mammoths, giant sloths, diprotodons and cave bears disappeared. Was it hunters, climate, or both, and why did Africa keep its elephants?</p><div class="lx-nums" data-from="lxs-le-megafauna"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-megafauna"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Humans were the main cause of the megafauna extinctions.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Worldwide, extinctions track human arrival better than climate. Australia lost its giants after people came, without a big climate shift; the Americas lost theirs soon after people spread; Madagascar and New Zealand lost theirs only when people landed, thousands of years later. Africa, where animals evolved alongside humans, was largely spared. Climate clearly mattered in northern Eurasia, where mammoths and others shrank with warming, so &#x27;main cause&#x27; fits better than &#x27;sole cause&#x27;.</p></div></div></div><div class="twist"><b>Still open</b><p>Reliable last-appearance dates are few for many species, leaving timing gaps. In Eurasia, how climate and hunting combined species by species is still argued; cave bears may have suffered from competition for caves and a narrow plant diet. Whether small human populations could hunt enough to cause extinctions is still modelled.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">1 min read · 270 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Vanishing Giants"><button type="button" class="wtoc-i" data-go="le-megafauna-s1">A world of giants</button><button type="button" class="wtoc-i" data-go="le-megafauna-s2">Continent by continent</button><button type="button" class="wtoc-i" data-go="le-megafauna-s3">Overkill, climate, or both</button><button type="button" class="wtoc-i" data-go="le-megafauna-s4">A world without giants</button></nav></div><section class="wsec" id="le-megafauna-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A world of giants</h3><p>Fifty thousand years ago every continent except Antarctica had its own giants. Sloths the size of elephants browsed in the Americas. Diprotodon, a wombat relative as heavy as a rhinoceros, grazed in Australia. Mammoths, woolly rhinos and giant deer roamed from Spain to Siberia. Within some 40,000 years most were gone. A 2024 review led by Jens-Christian Svenning counted at least 161 lost mammal species of 45 kg or more.</p></section><section class="wsec" id="le-megafauna-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Continent by continent</h3><ul class="wlist"><li>Australia: humans arrived by about 50,000 years ago or earlier; the giants vanished around 46,000 years ago, during a fairly stable climate.</li><li>The Americas: people were present by the Last Glacial Maximum; most large mammals disappeared between about 13,000 and 11,000 years ago, as people spread and the climate swung sharply.</li><li>Northern Eurasia: losses were staggered over tens of thousands of years, with woolly mammoths surviving on Wrangel Island until about 4,000 years ago.</li><li>Africa and southern Asia: far fewer extinctions, where large animals had evolved alongside hominins for over a million years.</li><li>Islands: Madagascar, New Zealand and others lost their giants only after people arrived, often in the last 2,000 years.</li></ul></section><section class="wsec" id="le-megafauna-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Overkill, climate, or both</h3><p>In the 1960s Paul Martin argued that skilled hunters swept through naive prey in a blitzkrieg of overkill. Others pointed to climate: rapid warming at the end of the ice age broke up the mammoth steppe. Global analyses such as Sandom and colleagues in 2014 found that human arrival predicts extinction far better than climate change. Alan Cooper and colleagues showed in 2015 that abrupt warming events coincided with turnovers in northern species. Ancient DNA suggests each species responded differently to climate and hunting.</p><aside class="wcall"><b>How do we know?</b><p>Researchers radiocarbon-date the youngest bones of each species and the oldest traces of people, then compare the two. Ancient DNA from bones and from sediments tracks how populations shrank. Spores of fungi that grow on large herbivores&#x27; dung fall sharply in lake cores when megafauna decline, often before changes in pollen and charcoal, which helps separate cause from effect.</p></aside></section><section class="wsec" id="le-megafauna-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>A world without giants</h3><p>The loss rippled outward. Fire regimes changed, forests and shrubs spread into old grasslands, and the fruits of some trees lost the only animals large enough to swallow them. People adapted too, turning to smaller game, fish and plants.</p><blockquote class="wpull"><p>We live in a world of shrunken animals, and our ancestors played a large part in making it.</p></blockquote></section><h3 class="sub-h wsub">Go deeper</h3><div class="links-row"><button type="button" onclick="openItem('timeline','age-02')">The Great Awakening <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('timeline','age-03')">The Ice Age World <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('timeline','age-04')">The Great Melt <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-first-americans')">The First Americans <span aria-hidden="true">→</span></button></div><details class="srcs"><summary>Sources for this entry (8)</summary><ol><li>Svenning, J.-C. et al. (2024). The late-Quaternary megafauna extinctions: Patterns, causes, ecological consequences and implications for ecosystem management in the Anthropocene. Cambridge Prisms: Extinction. <a href="https://doi.org/10.1017/ext.2024.4" target="_blank" rel="noopener">doi:10.1017/ext.2024.4</a></li><li>Koch, P.L. &amp; Barnosky, A.D. (2006). Late Quaternary extinctions: state of the debate. Annual Review of Ecology, Evolution, and Systematics 37: 215-250. <a href="https://doi.org/10.1146/annurev.ecolsys.34.011802.132415" target="_blank" rel="noopener">doi:10.1146/annurev.ecolsys.34.011802.132415</a></li><li>Sandom, C. et al. (2014). Global late Quaternary megafauna extinctions linked to humans, not climate change. Proceedings of the Royal Society B 281: 20133254. <a href="https://doi.org/10.1098/rspb.2013.3254" target="_blank" rel="noopener">doi:10.1098/rspb.2013.3254</a></li><li>Cooper, A. et al. (2015). Abrupt warming events drove Late Pleistocene Holarctic megafaunal turnover. Science 349: 602-606. <a href="https://doi.org/10.1126/science.aac4315" target="_blank" rel="noopener">doi:10.1126/science.aac4315</a></li><li>Roberts, R.G. et al. (2001). New ages for the last Australian megafauna: continent-wide extinction about 46,000 years ago. Science 292: 1888-1892. <a href="https://doi.org/10.1126/science.1060264" target="_blank" rel="noopener">doi:10.1126/science.1060264</a></li><li>Saltré, F. et al. (2016). Climate change not to blame for late Quaternary megafauna extinctions in Australia. Nature Communications 7: 10511. <a href="https://doi.org/10.1038/ncomms10511" target="_blank" rel="noopener">doi:10.1038/ncomms10511</a></li><li>Lorenzen, E.D. et al. (2011). Species-specific responses of Late Quaternary megafauna to climate and humans. Nature 479: 359-364. <a href="https://doi.org/10.1038/nature10574" target="_blank" rel="noopener">doi:10.1038/nature10574</a></li><li>Vartanyan, S.L., Garutt, V.E. &amp; Sher, A.V. (1993). Holocene dwarf mammoths from Wrangel Island in the Siberian Arctic. Nature 362: 337-340. <a href="https://doi.org/10.1038/362337a0" target="_blank" rel="noopener">doi:10.1038/362337a0</a></li></ol></details></div></script><script type="text/x-tpl" id="le-last-glacial-maximum-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Ice age fauna of northern Spain - Mauricio Antón.jpg" data-cap="The Last Glacial Maximum" data-big><figcaption></figcaption></figure><div class="sh-k">Ice Ages · Late Pleistocene</div><h2 class="sh-t" id="le-last-glacial-maximum-st" tabindex="-1">The Last Glacial Maximum</h2><p class="sh-s">c. 26,000–19,000 years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Strong evidence</span></span></div></div><p class="v4-q">Ice kilometres thick covered Canada and northern Europe, seas fell by over 120 metres, and people still walked into new worlds.</p><div class="lx-nums" data-from="lxs-le-last-glacial-maximum"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-last-glacial-maximum"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>People were already living in North America at the height of the last ice age.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The White Sands footprints were first dated with seeds of a water plant, which critics said could read too old because of ancient carbon in the lake. Follow-up work dated conifer pollen and quartz grains from the same layers and found matching ages of about 23,000–21,000 years (Pigati et al. 2023). Three methods now agree, but few other sites this old are widely accepted, so some archaeologists remain cautious.</p></div></div></div><div class="twist"><b>Still open</b><p>How people reached North America while ice blocked much of the interior is unclear: a Pacific coastal route is favoured, but its evidence now lies under the sea. Whether the White Sands walkers left descendants among later Native Americans is unknown. Ancient DNA is still mapping how deeply Europe&#x27;s population fell.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 359 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Last Glacial Maximum"><button type="button" class="wtoc-i" data-go="le-last-glacial-maximum-s1">A frozen hemisphere</button><button type="button" class="wtoc-i" data-go="le-last-glacial-maximum-s2">Walking to other lands</button><button type="button" class="wtoc-i" data-go="le-last-glacial-maximum-s3">Refuges and the mammoth steppe</button><button type="button" class="wtoc-i" data-go="le-last-glacial-maximum-s4">Footprints in the gypsum</button></nav></div><section class="wsec" id="le-last-glacial-maximum-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A frozen hemisphere</h3><p>Peter Clark and colleagues placed the Last Glacial Maximum between about 26,500 and 19,000 years ago, when the great ice sheets reached their largest extent. The Laurentide ice sheet buried Canada and reached south of the Great Lakes, and the Scandinavian ice sheet spread across the Baltic into Germany and Poland. A 2020 study by Jessica Tierney and colleagues combined ocean temperature proxies with climate models and estimated global cooling of about 6.1 °C.</p><aside class="wcall"><b>How do we know?</b><p>Ice sheets leave moraines, scratched bedrock and erratic boulders, which can be dated by radiocarbon and by isotopes that build up in rock exposed to cosmic rays. Air bubbles in Antarctic ice give past carbon dioxide directly. Sea level comes from drowned corals and old shorelines, corrected for how the crust bent under the ice. Sea surface temperatures come from plankton chemistry, and pollen records the vegetation.</p></aside></section><section class="wsec" id="le-last-glacial-maximum-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Walking to other lands</h3><p>With seas more than 120 m lower, the map of the world changed:</p><ul class="wlist"><li>Beringia: a land bridge up to about 1,000 km wide joined Siberia and Alaska.</li><li>Sundaland: Sumatra, Java and Borneo were part of mainland Asia.</li><li>Sahul: Australia, New Guinea and Tasmania formed one continent.</li><li>Doggerland: a low plain of rivers and marshes joined Britain to Europe.</li></ul><p>These lowlands were rich in rivers, wetlands and game. When the ice melted, they were drowned. Some Aboriginal Australian stories describe the sea flooding once-dry land, and researchers have argued they may preserve memories of the rise that followed.</p></section><section class="wsec" id="le-last-glacial-maximum-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Refuges and the mammoth steppe</h3><p>In Europe, people pulled back towards the south, into refuges in France, Iberia, Italy and the Balkans. A 2023 ancient-DNA study led by Cosimo Posth traced how some populations persisted in the south-west while others in Italy and eastern Europe were replaced. Across the steppe, hunters built shelters from mammoth bones and made fitted clothing with bone needles, a technology that was far from primitive.</p><blockquote class="wpull"><p>At the coldest point of the last ice age, people did not only survive. They explored.</p></blockquote></section><section class="wsec" id="le-last-glacial-maximum-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>Footprints in the gypsum</h3><p>At White Sands National Park, New Mexico, footprints of children and adults cross the old shoreline of a vanished lake. In 2021 Matthew Bennett and colleagues dated them to about 23,000–21,000 years ago using seeds of a water plant. When critics raised doubts, a 2023 study by Jeffrey Pigati&#x27;s team dated conifer pollen and quartz grains from the same layers and got matching ages. If they stand, people reached the Americas before or during the Last Glacial Maximum, thousands of years earlier than long assumed.</p></section><h3 class="sub-h wsub">Go deeper</h3><div class="links-row"><button type="button" onclick="openItem('timeline','age-03')">The Ice Age World <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-drowned-coasts')">The Drowned Coasts <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-first-americans')">The First Americans <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-aboriginal-sea')">Stories Older Than the Sea <span aria-hidden="true">→</span></button></div><details class="srcs"><summary>Sources for this entry (8)</summary><ol><li>Clark, P.U. et al. (2009). The Last Glacial Maximum. Science 325: 710-714. <a href="https://doi.org/10.1126/science.1172873" target="_blank" rel="noopener">doi:10.1126/science.1172873</a></li><li>Tierney, J.E. et al. (2020). Glacial cooling and climate sensitivity revisited. Nature 584: 569-573. <a href="https://doi.org/10.1038/s41586-020-2617-x" target="_blank" rel="noopener">doi:10.1038/s41586-020-2617-x</a></li><li>Lambeck, K. et al. (2014). Sea level and global ice volumes from the Last Glacial Maximum to the Holocene. PNAS 111: 15296-15303. <a href="https://doi.org/10.1073/pnas.1411762111" target="_blank" rel="noopener">doi:10.1073/pnas.1411762111</a></li><li>Bereiter, B. et al. (2015). Revision of the EPICA Dome C CO2 record from 800 to 600 kyr before present. Geophysical Research Letters 42: 542-549. <a href="https://doi.org/10.1002/2014GL061957" target="_blank" rel="noopener">doi:10.1002/2014GL061957</a></li><li>Bennett, M.R. et al. (2021). Evidence of humans in North America during the Last Glacial Maximum. Science 373: 1528-1531. <a href="https://doi.org/10.1126/science.abg7586" target="_blank" rel="noopener">doi:10.1126/science.abg7586</a></li><li>Pigati, J.S. et al. (2023). Independent age estimates resolve the controversy of ancient human footprints at White Sands. Science 382: 73-75. <a href="https://doi.org/10.1126/science.adh5007" target="_blank" rel="noopener">doi:10.1126/science.adh5007</a></li><li>Posth, C. et al. (2023). Palaeogenomics of Upper Palaeolithic to Neolithic European hunter-gatherers. Nature 615: 117-126. <a href="https://doi.org/10.1038/s41586-023-05726-0" target="_blank" rel="noopener">doi:10.1038/s41586-023-05726-0</a></li><li>Nunn, P.D. &amp; Reid, N.J. (2016). Aboriginal memories of inundation of the Australian coast dating from more than 7000 years ago. Australian Geographer 47: 11-47. <a href="https://doi.org/10.1080/00049182.2015.1077539" target="_blank" rel="noopener">doi:10.1080/00049182.2015.1077539</a></li></ol></details></div></script><script type="text/x-tpl" id="le-great-melt-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Göbeklitepe Building D 5323.jpg" data-cap="The Great Melt and the Younger Dryas" data-big><figcaption></figcaption></figure><div class="sh-k">Ice Ages · Late Pleistocene to earliest Holocene</div><h2 class="sh-t" id="le-great-melt-st" tabindex="-1">The Great Melt and the Younger Dryas</h2><p class="sh-s">c. 14,700–11,700 years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Open question</span></span></div></div><p class="v4-q">In three restless millennia the Ice Age broke, seas swallowed coastlines, a sudden chill returned, and then the calm Holocene began.</p><div class="lx-nums" data-from="lxs-le-great-melt"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-great-melt"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>A cosmic impact triggered the Younger Dryas cold snap about 12,900 years ago.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:41.7%" role="img" aria-label="Weight of evidence: Open question"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Proponents report a layer with platinum spikes, nanodiamonds, tiny melted spherules and soot at many sites dated near 12,900 years ago (Firestone et al. 2007 and later work). Critics answer that these markers are not unique to impacts, have not been reproduced consistently by independent labs, and are not tightly synchronous; a 2023 review called the idea refuted (Holliday et al. 2023). The mainstream alternative, a slowdown of Atlantic ocean circulation after meltwater floods, is well supported but has not closed the case either.</p></div></div></div><div class="twist"><b>Still open</b><p>What exactly tipped the Atlantic circulation is still argued: meltwater routed north or east, expanding sea ice, or a volcanic nudge such as the Laacher See eruption in Germany. How quickly people noticed the changes, and whether any myths preserve them, is harder still to test.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 452 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The Great Melt and the Younger Dryas"><button type="button" class="wtoc-i" data-go="le-great-melt-s1">A world thawing in jumps</button><button type="button" class="wtoc-i" data-go="le-great-melt-s2">Seas that rose in a lifetime</button><button type="button" class="wtoc-i" data-go="le-great-melt-s3">The cold snap and its suspects</button><button type="button" class="wtoc-i" data-go="le-great-melt-s4">People on the moving shore</button></nav></div><section class="wsec" id="le-great-melt-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A world thawing in jumps</h3><p>The end of the last Ice Age was not a smooth warming. It came in lurches. Around 14,700 years ago, air temperatures over Greenland jumped within a few decades, as if a switch had been thrown. Forests spread, rivers swelled with meltwater and the great ice domes over Canada and Scandinavia began to sag and break. Then, about 12,900 years ago, much of the Northern Hemisphere fell back into near-glacial cold for about twelve centuries. When that cold snap ended, around 11,700 years ago, it ended fast again. A person could have seen the weather of their childhood become a memory.</p><blockquote class="wpull"><p>A person could have been born into one climate and grown old in another.</p></blockquote></section><section class="wsec" id="le-great-melt-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Seas that rose in a lifetime</h3><p>At the height of the Ice Age so much water was locked in ice that sea level stood about 120 metres lower than today. Britain was joined to Europe by Doggerland, Australia to New Guinea, and Sumatra, Java and Borneo formed one landmass. During Meltwater Pulse 1A the sea rose at more than 4 metres a century. Coastlines retreated inland by hundreds of metres a year on gentle shelves. Camps, shell middens and hunting grounds of coastal people are now under water, which is one reason the archaeology of this age can look thinner than it was.</p><aside class="wcall"><b>How do we know?</b><p>Sea level comes from fossil corals drilled off Tahiti and Barbados: reef corals grow near the surface, so dated drowned corals track the rising sea (Deschamps et al. 2012). Temperature comes from Greenland ice cores, where isotopes of oxygen in the ice and of nitrogen and argon in trapped air record past warmth. Annual ice layers, counted like tree rings, date the shifts to within decades (Rasmussen et al. 2006).</p></aside></section><section class="wsec" id="le-great-melt-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The cold snap and its suspects</h3><p>Why did the cold return? Three explanations dominate. Each has evidence; none has won outright. Many researchers think a surge of meltwater weakened the ocean current that carries tropical heat to the North Atlantic. Others propose a comet or asteroid, pointing to unusual particles in sediments near 12,900 years ago. A third view adds natural wobbles in ocean circulation, perhaps nudged by a volcanic eruption.</p><ul class="wlist"><li>Meltwater and ocean circulation: strongly supported in principle, but the route and timing of the water are still argued.</li><li>Cosmic impact: backed by a sediment layer at many sites, disputed on reproducibility and dating (Holliday et al. 2023).</li><li>Volcanic trigger: the Laacher See eruption happened close in time, but its effect on climate is uncertain.</li></ul></section><section class="wsec" id="le-great-melt-s4"><h3 class="wsec-h"><span class="wsec-n">04</span>People on the moving shore</h3><p>These changes were not a backdrop; they were daily life. In the Levant, Natufian communities built round stone houses and harvested wild cereals, then adjusted when the Younger Dryas dried the land. Soon after the cold ended, people in southeast Turkey carved foxes, boars, snakes and vultures on massive pillars at Göbekli Tepe (Dietrich et al. 2012). Around the world, oral traditions tell of lands swallowed by the sea. In Australia, some of these stories match drowned coastlines closely enough that researchers take them seriously as long memories (Nunn and Reid 2016), though linking myths to events thousands of years old remains difficult to test.</p></section><h3 class="sub-h wsub">Go deeper</h3><div class="links-row"><button type="button" onclick="openItem('timeline','age-04')">The Great Melt <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('timeline','age-05')">The Younger Dryas Reset <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-younger-dryas-impact')">The Younger Dryas Comet <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-flood')">The Flood <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-drowned-coasts')">The Drowned Coasts <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-aboriginal-sea')">Stories Older Than the Sea <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-gobekli-tepe')">Göbekli Tepe <span aria-hidden="true">→</span></button></div><details class="srcs"><summary>Sources for this entry (8)</summary><ol><li>Deschamps, P. et al. (2012). Ice-sheet collapse and sea-level rise at the Bølling warming 14,600 years ago. Nature 483: 559-564. <a href="https://doi.org/10.1038/nature10902" target="_blank" rel="noopener">doi:10.1038/nature10902</a></li><li>Buizert, C. et al. (2014). Greenland temperature response to climate forcing during the last deglaciation. Science 345: 1177-1180. <a href="https://doi.org/10.1126/science.1254961" target="_blank" rel="noopener">doi:10.1126/science.1254961</a></li><li>Rasmussen, S.O. et al. (2006). A new Greenland ice core chronology for the last glacial termination. Journal of Geophysical Research 111: D06102. <a href="https://doi.org/10.1029/2005JD006079" target="_blank" rel="noopener">doi:10.1029/2005JD006079</a></li><li>Walker, M. et al. (2009). Formal definition and dating of the GSSP for the base of the Holocene using the Greenland NGRIP ice core. Journal of Quaternary Science 24: 3-17. <a href="https://doi.org/10.1002/jqs.1227" target="_blank" rel="noopener">doi:10.1002/jqs.1227</a></li><li>Firestone, R.B. et al. (2007). Evidence for an extraterrestrial impact 12,900 years ago that contributed to the megafaunal extinctions and the Younger Dryas cooling. PNAS 104: 16016-16021. <a href="https://doi.org/10.1073/pnas.0706977104" target="_blank" rel="noopener">doi:10.1073/pnas.0706977104</a></li><li>Holliday, V.T. et al. (2023). Comprehensive refutation of the Younger Dryas Impact Hypothesis (YDIH). Earth-Science Reviews 247: 104502. <a href="https://doi.org/10.1016/j.earscirev.2023.104502" target="_blank" rel="noopener">doi:10.1016/j.earscirev.2023.104502</a></li><li>Nunn, P.D. &amp; Reid, N.J. (2016). Aboriginal memories of inundation of the Australian coast dating from more than 7000 years ago. Australian Geographer 47: 11-47. <a href="https://doi.org/10.1080/00049182.2015.1077539" target="_blank" rel="noopener">doi:10.1080/00049182.2015.1077539</a></li><li>Dietrich, O. et al. (2012). The role of cult and feasting in the emergence of Neolithic communities: new evidence from Göbekli Tepe, south-eastern Turkey. Antiquity 86: 674-695. <a href="https://doi.org/10.1017/S0003598X00047840" target="_blank" rel="noopener">doi:10.1017/S0003598X00047840</a></li></ol></details></div></script><script type="text/x-tpl" id="le-green-sahara-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Crying cow of Taghrirt.jpg" data-cap="When the Sahara Was Green" data-big><figcaption></figcaption></figure><div class="sh-k">Holocene · Late Pleistocene to Middle Holocene (African Humid Period)</div><h2 class="sh-t" id="le-green-sahara-st" tabindex="-1">When the Sahara Was Green</h2><p class="sh-s">c. 14,500–5,500 years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Mixed record</span></span></div></div><p class="v4-q">For thousands of years the world&#x27;s largest hot desert held lakes, rivers, grasslands and people, until the monsoon slipped back south.</p><div class="lx-nums" data-from="lxs-le-green-sahara"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-green-sahara"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The Green Sahara ended abruptly, within a few centuries, about 5,500 years ago.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:50.0%" role="img" aria-label="Weight of evidence: Mixed record"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">A dust record off Mauritania shows a sharp switch within decades to centuries (deMenocal et al. 2000), and some models predict a vegetation tipping point. But sediments from Lake Yoa in Chad record gradual drying over millennia (Kröpelin et al. 2008), and a wider compilation found the wet period ended earlier in the north and later in the south (Shanahan et al. 2015). The answer seems to depend on where you stand.</p></div></div></div><div class="twist"><b>Still open</b><p>How green the central Sahara really was, whether grazing herds sped the drying, and exactly how the wet period ended in each region are open. The meaning of the Gilf Kebir &#x27;swimmers&#x27; and the ages of much Saharan rock art remain uncertain, because the paint is hard to date directly.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 351 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of When the Sahara Was Green"><button type="button" class="wtoc-i" data-go="le-green-sahara-s1">A desert with lakes</button><button type="button" class="wtoc-i" data-go="le-green-sahara-s2">Painters of a vanished world</button><button type="button" class="wtoc-i" data-go="le-green-sahara-s3">The drying and the move to the Nile</button></nav></div><section class="wsec" id="le-green-sahara-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A desert with lakes</h3><p>Stand in the Sahara today and it is hard to imagine hippos. Yet for thousands of years, lakes glittered across it and rivers ran north toward the Mediterranean. The cause lay in space: a slow wobble in Earth&#x27;s orbit gave the Northern Hemisphere stronger summer sunshine, which heated the land and drew the monsoon rains deep into Africa. Grass and shrubs took hold, dark ground absorbed more heat, and less dust blew, feedbacks that probably pushed the rains further still. Lake Chad swelled to a vast inland sea. The Sahara, for a while, was a savanna.</p><blockquote class="wpull"><p>The Sahara was not always a desert; for thousands of years it was a land of lakes, grass and cattle.</p></blockquote></section><section class="wsec" id="le-green-sahara-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Painters of a vanished world</h3><p>The people of the Green Sahara left an extraordinary gallery. On the cliffs of Tassili n&#x27;Ajjer in Algeria and in the rock shelters of the Gilf Kebir in Egypt, they painted and carved elephants, giraffes, herds of cattle and human figures. In the Cave of Swimmers, figures seem to float, perhaps swimming, perhaps something else. Ancient DNA from Takarkori shows these people descended from a North African lineage that stayed distinct for tens of thousands of years (Salem et al. 2025). Herding, it seems, spread among them as an idea more than through new arrivals.</p><aside class="wcall"><b>How do we know?</b><p>Dust and plant waxes blown off Africa settle on the seafloor; drilling these muds gives a continuous rain record (deMenocal et al. 2000; Tierney et al. 2017). Lake sediments hold pollen, diatoms and shells. Buried river channels show up on satellite radar that sees through dry sand (Drake et al. 2011). Radiocarbon dates on hearths, bones and burials track where and when people lived.</p></aside></section><section class="wsec" id="le-green-sahara-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The drying and the move to the Nile</h3><p>As the orbit slowly changed, summer sunshine weakened and the monsoon retreated south. Lakes shrank, then vanished. People followed the water: toward the Nile, into mountain refuges and south into the Sahel (Kuper and Kröpelin 2006). The Nile valley filled with herders and farmers just as early Egyptian kingdoms took shape. Some researchers see Saharan traditions, such as reverence for cattle, echoed in early Egyptian culture, a connection that is plausible but hard to test directly.</p><ul class="wlist"><li>Early phase: hunter-fishers with bone harpoons and wavy-line pottery lived beside lakes and rivers.</li><li>Later phase: herders with cattle, sheep and goats spread across the grasslands.</li><li>Final phase: communities moved to highlands, oases, the Sahel and the Nile valley as the lakes dried.</li></ul></section><h3 class="sub-h wsub">Go deeper</h3><div class="links-row"><button type="button" onclick="openItem('timeline','age-06')">The First Monuments <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('timeline','age-07')">The Green Sahara <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-richat')">The Eye of the Sahara <span aria-hidden="true">→</span></button></div><details class="srcs"><summary>Sources for this entry (8)</summary><ol><li>deMenocal, P. et al. (2000). Abrupt onset and termination of the African Humid Period: rapid climate responses to gradual insolation forcing. Quaternary Science Reviews 19: 347-361. <a href="https://doi.org/10.1016/S0277-3791(99)00081-5" target="_blank" rel="noopener">doi:10.1016/S0277-3791(99)00081-5</a></li><li>Tierney, J.E., Pausata, F.S.R. &amp; deMenocal, P.B. (2017). Rainfall regimes of the Green Sahara. Science Advances 3: e1601503. <a href="https://doi.org/10.1126/sciadv.1601503" target="_blank" rel="noopener">doi:10.1126/sciadv.1601503</a></li><li>Kröpelin, S. et al. (2008). Climate-driven ecosystem succession in the Sahara: the past 6000 years. Science 320: 765-768. <a href="https://doi.org/10.1126/science.1154913" target="_blank" rel="noopener">doi:10.1126/science.1154913</a></li><li>Shanahan, T.M. et al. (2015). The time-transgressive termination of the African Humid Period. Nature Geoscience 8: 140-144. <a href="https://doi.org/10.1038/ngeo2329" target="_blank" rel="noopener">doi:10.1038/ngeo2329</a></li><li>Kuper, R. &amp; Kröpelin, S. (2006). Climate-controlled Holocene occupation in the Sahara: motor of Africa&#x27;s evolution. Science 313: 803-807. <a href="https://doi.org/10.1126/science.1130989" target="_blank" rel="noopener">doi:10.1126/science.1130989</a></li><li>Salem, N. et al. (2025). Ancient DNA from the Green Sahara reveals ancestral North African lineage. Nature. <a href="https://doi.org/10.1038/s41586-025-08793-7" target="_blank" rel="noopener">doi:10.1038/s41586-025-08793-7</a></li><li>Drake, N.A. et al. (2011). Ancient watercourses and biogeography of the Sahara explain the peopling of the desert. PNAS 108: 458-462. <a href="https://doi.org/10.1073/pnas.1012231108" target="_blank" rel="noopener">doi:10.1073/pnas.1012231108</a></li><li>Sereno, P.C. et al. (2008). Lakeside cemeteries in the Sahara: 5000 years of Holocene population and environmental change. PLoS ONE 3: e2995. <a href="https://doi.org/10.1371/journal.pone.0002995" target="_blank" rel="noopener">doi:10.1371/journal.pone.0002995</a></li></ol></details></div></script><script type="text/x-tpl" id="le-farming-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Triticum monococcum0.jpg" data-cap="Farming Begins in a Steadier World" data-big><figcaption></figcaption></figure><div class="sh-k">Holocene · Holocene: Greenlandian to early Northgrippian</div><h2 class="sh-t" id="le-farming-st" tabindex="-1">Farming Begins in a Steadier World</h2><p class="sh-s">c. 11,700–8,000 years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Plausible</span></span></div></div><p class="v4-q">Once the Ice Age flicker calmed, people on several continents who never met began taming plants and animals within a few thousand years.</p><div class="lx-nums" data-from="lxs-le-farming"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-farming"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Farming was only possible once the climate stabilised after the Ice Age.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:58.3%" role="img" aria-label="Weight of evidence: Plausible"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Every known centre of domestication appears after 11,700 years ago, in regions that had no contact with each other, which fits the idea that a warmer, steadier, carbon-richer climate made farming workable (Richerson et al. 2001). But people experimented with cultivation earlier, as at Ohalo II, and domestication then took thousands of years in each region. Climate looks like a door opening, not a push through it, so &#x27;only possible&#x27; may be too strong.</p></div></div></div><div class="twist"><b>Still open</b><p>Why farming began when and where it did is still argued: population pressure, feasting and social competition, the stress of the Younger Dryas, or long familiarity with plants. It is also debated whether glacial climates made farming impossible or simply too risky to pay off.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 356 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of Farming Begins in a Steadier World"><button type="button" class="wtoc-i" data-go="le-farming-s1">Why the Holocene was different</button><button type="button" class="wtoc-i" data-go="le-farming-s2">Many inventors, no teacher</button><button type="button" class="wtoc-i" data-go="le-farming-s3">The price of the plough</button></nav></div><section class="wsec" id="le-farming-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>Why the Holocene was different</h3><p>For most of the last 100,000 years, climate swung sharply from decade to decade. Rainfall could halve within a generation, and the plants people relied on shifted with it. Then, after 11,700 years ago, the swings calmed. Summers in the north were warm, monsoons were strong and carbon dioxide in the air was higher than during the Ice Age. Experiments show that plants grow better in such air. Richerson, Boyd and Bettinger (2001) argued that farming was impossible in the glacial world and almost inevitable in the Holocene. It is an elegant idea, and the timing fits remarkably well. Yet the idea has limits: people in the Near East first harvested and stored wild grain for centuries, and the move from gathering to true farming was slow, patchy and reversible.</p><blockquote class="wpull"><p>Farming was invented many times, by people who never met, within a few thousand years of the climate settling.</p></blockquote></section><section class="wsec" id="le-farming-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Many inventors, no teacher</h3><p>Domestication happened independently in the Fertile Crescent, China, New Guinea, Mesoamerica, the Andes, Amazonia, eastern North America and Africa (Larson et al. 2014). Each region tamed what grew locally. In the Kuk Swamp of New Guinea, people were draining and mounding wetland soils by about 7,000 years ago, with earlier signs of plant tending (Denham et al. 2003). In China, rice changed slowly over thousands of years, as grains that stayed on the plant became common (Fuller et al. 2009).</p><aside class="wcall"><b>How do we know?</b><p>Archaeobotanists sieve charred seeds from ancient hearths and look for domestic traits: wheat and rice ears that do not shatter, bigger grains, thinner seed coats. Starch grains and tiny silica bodies called phytoliths survive on grinding stones and in soil. Animal bones reveal domestication through smaller body size and herds culled by age and sex. Radiocarbon dating of the seeds and bones themselves gives the timeline (Zeder 2011).</p></aside></section><section class="wsec" id="le-farming-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The price of the plough</h3><p>Farming fed more people per square kilometre, but it was not an easy upgrade. Skeletons from early farming villages often show more tooth decay, signs of childhood stress and wear from grinding grain. Living close to animals and to each other invited new diseases. Yet farming spread, because it could support larger communities and store food for lean years.</p><ul class="wlist"><li>Gains: more food per hectare, storable surpluses, settled villages.</li><li>Costs: heavier workloads, narrower diets, new diseases and vulnerability to failed harvests.</li><li>Legacy: nearly every staple food eaten today was domesticated in this window or soon after.</li></ul></section><h3 class="sub-h wsub">Go deeper</h3><div class="links-row"><button type="button" onclick="openItem('timeline','age-06')">The First Monuments <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-gobekli-tepe')">Göbekli Tepe <span aria-hidden="true">→</span></button></div><details class="srcs"><summary>Sources for this entry (7)</summary><ol><li>Richerson, P.J., Boyd, R. &amp; Bettinger, R.L. (2001). Was agriculture impossible during the Pleistocene but mandatory during the Holocene? A climate change hypothesis. American Antiquity 66: 387-411. <a href="https://doi.org/10.2307/2694241" target="_blank" rel="noopener">doi:10.2307/2694241</a></li><li>Zeder, M.A. (2011). The origins of agriculture in the Near East. Current Anthropology 52(S4): S221-S235. <a href="https://doi.org/10.1086/659307" target="_blank" rel="noopener">doi:10.1086/659307</a></li><li>Larson, G. et al. (2014). Current perspectives and the future of domestication studies. PNAS 111: 6139-6146. <a href="https://doi.org/10.1073/pnas.1323964111" target="_blank" rel="noopener">doi:10.1073/pnas.1323964111</a></li><li>Snir, A. et al. (2015). The origin of cultivation and proto-weeds, long before Neolithic farming. PLoS ONE 10: e0131422. <a href="https://doi.org/10.1371/journal.pone.0131422" target="_blank" rel="noopener">doi:10.1371/journal.pone.0131422</a></li><li>Piperno, D.R. et al. (2009). Starch grain and phytolith evidence for early ninth millennium B.P. maize from the Central Balsas River Valley, Mexico. PNAS 106: 5019-5024. <a href="https://doi.org/10.1073/pnas.0812525106" target="_blank" rel="noopener">doi:10.1073/pnas.0812525106</a></li><li>Denham, T.P. et al. (2003). Origins of agriculture at Kuk Swamp in the Highlands of New Guinea. Science 301: 189-193. <a href="https://doi.org/10.1126/science.1085255" target="_blank" rel="noopener">doi:10.1126/science.1085255</a></li><li>Fuller, D.Q. et al. (2009). The domestication process and domestication rate in rice: spikelet bases from the Lower Yangtze. Science 323: 1607-1610. <a href="https://doi.org/10.1126/science.1166605" target="_blank" rel="noopener">doi:10.1126/science.1166605</a></li></ol></details></div></script><script type="text/x-tpl" id="le-8-2-event-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Çatalhöyük overview.jpg" data-cap="The 8.2 Kiloyear Chill and the Storegga Wave" data-big><figcaption></figcaption></figure><div class="sh-k">Holocene · Holocene: Greenlandian–Northgrippian boundary</div><h2 class="sh-t" id="le-8-2-event-st" tabindex="-1">The 8.2 Kiloyear Chill and the Storegga Wave</h2><p class="sh-s">c. 8,200 years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Mixed record</span></span></div></div><p class="v4-q">A giant ice-dammed lake emptied into the Atlantic, the north cooled for about 160 years, and a vast undersea landslide sent a tsunami across the North Sea.</p><div class="lx-nums" data-from="lxs-le-8-2-event"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-8-2-event"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>The 8.2 kiloyear cold snap disrupted early farming communities.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:50.0%" role="img" aria-label="Weight of evidence: Mixed record"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">At Çatalhöyük, animal fats on pots and butchered bones point to drought stress and changed herding right at the event (Roffet-Salque et al. 2018). But a regional review found many Near Eastern farming sites continued without clear breaks (Flohr et al. 2016), and some archaeologists question whether the Çatalhöyük changes were driven by climate at all. Effects look real in some places and absent in others.</p></div></div></div><div class="twist"><b>Still open</b><p>Did the cold push farmers into Europe, or did farming spread for other reasons at the same time? How far did Storegga&#x27;s damage reach, and was Doggerland already mostly under water? Dating sites to within decades is needed to separate coincidence from cause.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 351 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The 8.2 Kiloyear Chill and the Storegga Wave"><button type="button" class="wtoc-i" data-go="le-8-2-event-s1">A lake the size of a sea</button><button type="button" class="wtoc-i" data-go="le-8-2-event-s2">Farmers under stress</button><button type="button" class="wtoc-i" data-go="le-8-2-event-s3">The Storegga wave and the last of Doggerland</button></nav></div><section class="wsec" id="le-8-2-event-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>A lake the size of a sea</h3><p>As the Laurentide ice sheet over Canada melted, its meltwater pooled against the ice in a giant lake system known as Agassiz and Ojibway. When the ice dam finally failed, the water drained into Hudson Bay and out into the Labrador Sea (Barber et al. 1999). A flood of fresh water on the surface of the North Atlantic can slow the ocean conveyor that carries tropical heat north. Within a few years, Greenland cooled sharply. For about 160 years, winters bit harder around the North Atlantic, and rains faltered far away in Africa and Asia.</p><blockquote class="wpull"><p>A lake in Canada emptied, and farmers in Anatolia may have felt it in their herds.</p></blockquote></section><section class="wsec" id="le-8-2-event-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Farmers under stress</h3><p>Çatalhöyük, a town of packed mud-brick houses on the Konya Plain, was home to thousands of people. During the event, its cooks were rendering every scrap of fat from bones, and herders were keeping more goats, which cope better with drought than cattle (Roffet-Salque et al. 2018). Elsewhere, the record is quieter. Many villages in the Levant and Mesopotamia show no clear crisis (Flohr et al. 2016). Early farmers, it seems, were flexible and resourceful.</p><aside class="wcall"><b>How do we know?</b><p>The event shows up in Greenland ice as a drop in heavy oxygen isotopes and as changes in nitrogen and argon isotopes in trapped air bubbles, which record temperature (Kobashi et al. 2007). Annual ice layers give the length. At Çatalhöyük, researchers measured hydrogen isotopes in animal fat soaked into pottery: the fats were richer in heavy hydrogen during the event, a sign of drier conditions.</p></aside></section><section class="wsec" id="le-8-2-event-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>The Storegga wave and the last of Doggerland</h3><p>About 8,150 years ago, a slab of sediment off western Norway slid into the deep sea, one of the largest landslides known. The tsunami raced across the Norwegian Sea and North Sea, leaving sand layers in Norwegian lakes, Scottish peat and Shetland coasts. By then Doggerland, the land that once joined Britain to Europe, had shrunk to low islands and marshes. Some researchers see the wave as a final blow; others suggest parts of it survived a little longer (Walker et al. 2020). Either way, a rich hunting and fishing landscape was lost to the sea within human memory.</p><ul class="wlist"><li>Doggerland: a lowland of rivers, lakes and marshes between Britain and Europe, drowned step by step as the ice melted.</li><li>Storegga: sand layers left by the tsunami have been traced in Norway, Scotland, Shetland and the Faroe Islands.</li><li>The lesson: a drained lake, a cold century and a tsunami came close together, showing how separate shocks can stack up on the same people.</li></ul></section><h3 class="sub-h wsub">Go deeper</h3><div class="links-row"><button type="button" onclick="openItem('timeline','age-06')">The First Monuments <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('timeline','age-07')">The Green Sahara <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-drowned-coasts')">The Drowned Coasts <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-flood')">The Flood <span aria-hidden="true">→</span></button></div><details class="srcs"><summary>Sources for this entry (8)</summary><ol><li>Barber, D.C. et al. (1999). Forcing of the cold event of 8,200 years ago by catastrophic drainage of Laurentide lakes. Nature 400: 344-348. <a href="https://doi.org/10.1038/22504" target="_blank" rel="noopener">doi:10.1038/22504</a></li><li>Thomas, E.R. et al. (2007). The 8.2 ka event from Greenland ice cores. Quaternary Science Reviews 26: 70-81. <a href="https://doi.org/10.1016/j.quascirev.2006.07.017" target="_blank" rel="noopener">doi:10.1016/j.quascirev.2006.07.017</a></li><li>Kobashi, T. et al. (2007). Precise timing and characterization of abrupt climate change 8200 years ago from air trapped in polar ice. Quaternary Science Reviews 26: 1212-1222. <a href="https://doi.org/10.1016/j.quascirev.2007.01.009" target="_blank" rel="noopener">doi:10.1016/j.quascirev.2007.01.009</a></li><li>Roffet-Salque, M. et al. (2018). Evidence for the impact of the 8.2-kyBP climate event on Near Eastern early farmers. PNAS 115: 8705-8709. <a href="https://doi.org/10.1073/pnas.1803607115" target="_blank" rel="noopener">doi:10.1073/pnas.1803607115</a></li><li>Flohr, P. et al. (2016). Evidence of resilience to past climate change in Southwest Asia: early farming communities and the 9.2 and 8.2 ka events. Quaternary Science Reviews 136: 23-39. <a href="https://doi.org/10.1016/j.quascirev.2015.06.022" target="_blank" rel="noopener">doi:10.1016/j.quascirev.2015.06.022</a></li><li>Weninger, B. et al. (2006). Climate forcing due to the 8200 cal yr BP event observed at Early Neolithic sites in the eastern Mediterranean. Quaternary Research 66: 401-420. <a href="https://doi.org/10.1016/j.yqres.2006.06.009" target="_blank" rel="noopener">doi:10.1016/j.yqres.2006.06.009</a></li><li>Bondevik, S., Stormo, S.K. &amp; Skjerdal, G. (2012). Green mosses date the Storegga tsunami to the chilliest decades of the 8.2 ka cold event. Quaternary Science Reviews 45: 1-6. <a href="https://doi.org/10.1016/j.quascirev.2012.04.020" target="_blank" rel="noopener">doi:10.1016/j.quascirev.2012.04.020</a></li><li>Walker, J. et al. (2020). A great wave: the Storegga tsunami and the end of Doggerland? Antiquity 94: 1409-1425. <a href="https://doi.org/10.15184/aqy.2020.49" target="_blank" rel="noopener">doi:10.15184/aqy.2020.49</a></li></ol></details></div></script><script type="text/x-tpl" id="le-4-2-event-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Bronze head of an Akkadian ruler, discovered in Nineveh in 1931, presumably depicting either Sargon or Sargon&#x27;s grandson Naram-Sin (Rijksmuseum van Oudheden).jpg" data-cap="The 4.2 Kiloyear Megadrought" data-big><figcaption></figcaption></figure><div class="sh-k">Holocene · Holocene: Northgrippian–Meghalayan boundary</div><h2 class="sh-t" id="le-4-2-event-st" tabindex="-1">The 4.2 Kiloyear Megadrought</h2><p class="sh-s">c. 4,300–3,900 years ago</p><div class="sh-v"><span class="vstamp vstamp--on vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Mixed record</span></span></div></div><p class="v4-q">About 4,200 years ago rains failed across a belt from the Mediterranean to India; early states faltered, and geologists now mark a new age.</p><div class="lx-nums" data-from="lxs-le-4-2-event"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-4-2-event"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>A megadrought 4,200 years ago brought down the Akkadian Empire.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:50.0%" role="img" aria-label="Weight of evidence: Mixed record"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Dust in the Gulf of Oman, Iranian cave records and the abandonment of Tell Leilan line up broadly with Akkad&#x27;s fall (Weiss et al. 1993; Cullen et al. 2000; Carolin et al. 2019). But dating uncertainties of decades to a century, southern cities that carried on, and political causes such as revolts and invasions mean drought is best seen as a heavy stress on a fragile empire, not a sufficient single cause.</p></div></div></div><div class="twist"><b>Still open</b><p>Was the 4.2 event one global event or a cluster of regional ones, and how was it timed in each place? Why did some societies, such as parts of southern Mesopotamia, weather it better than others? Some geologists also question using it to define a global age boundary.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 347 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of The 4.2 Kiloyear Megadrought"><button type="button" class="wtoc-i" data-go="le-4-2-event-s1">When the rains failed</button><button type="button" class="wtoc-i" data-go="le-4-2-event-s2">Akkad, Egypt, the Indus and China</button><button type="button" class="wtoc-i" data-go="le-4-2-event-s3">A new age in the rock record</button></nav></div><section class="wsec" id="le-4-2-event-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>When the rains failed</h3><p>Around 4,200 years ago, a belt of drought ran through the heartlands of the first great states. Cave stalagmites in Italy and Iran, lake muds in Turkey and seafloor dust off Arabia all point to drier conditions. The Indian monsoon faltered, and the Nile floods, fed by East African rains, fell low. This did not happen everywhere at once, and some regions grew wetter. But across the Old World&#x27;s river civilisations, it came at a time when cities had grown large and dependent on steady harvests.</p><blockquote class="wpull"><p>The first empires were built on predictable rain, and around 4,200 years ago the rain stopped being predictable.</p></blockquote></section><section class="wsec" id="le-4-2-event-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>Akkad, Egypt, the Indus and China</h3><p>The Akkadian Empire, founded by Sargon, controlled much of Mesopotamia before it fragmented. A later Mesopotamian poem, the Curse of Akkad, blames the fall on the anger of the god Enlil and describes fields that yielded no grain, a story that may preserve a memory of real hardship. In Egypt, central authority collapsed at the end of the Old Kingdom. The Indus cities faded more slowly, as rivers shifted and the monsoon weakened (Staubwasser et al. 2003). In China, the story may be one of too much water: traditions of Yu the Great taming floods are traditionally placed in this broad era.</p><aside class="wcall"><b>How do we know?</b><p>Stalagmites grow in thin layers; their oxygen isotopes track rainfall and uranium-thorium dating gives ages within decades. Seafloor cores measure dust blown from dry land (Cullen et al. 2000). Archaeologists date the abandonment of towns such as Tell Leilan with radiocarbon on seeds and charcoal. Matching all these clocks is the hard part, and small offsets can make coincidence look like cause.</p></aside></section><section class="wsec" id="le-4-2-event-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>A new age in the rock record</h3><p>In 2018, geologists split the Holocene into three stages. The youngest, the Meghalayan, begins 4,250 years before 2000 CE and takes its name from Meghalaya in northeast India, where a stalagmite records the drought (Walker et al. 2018). Its base is one of very few boundaries in the geological timescale that fall within recorded history. The choice was controversial, because the drought was not global. Yet it recognises something the old stories hinted at: climate and history are entwined.</p><ul class="wlist"><li>Greenlandian Age: from 11,700 years ago, the start of the Holocene.</li><li>Northgrippian Age: from about 8,200 years ago, marked by the 8.2 kiloyear cold event.</li><li>Meghalayan Age: from 4,250 years ago, marked by the 4.2 kiloyear drought.</li></ul></section><h3 class="sub-h wsub">Go deeper</h3><div class="links-row"><button type="button" onclick="openItem('timeline','age-08')">First Cities and Writing <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('timeline','age-09')">The 4.2 Kiloyear Collapse <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('articles','case-yu-xia')">Yu the Great and the Flood That Made a Dynasty <span aria-hidden="true">→</span></button><button type="button" onclick="openItem('marvels','marvel-great-pyramid')">Great Pyramid <span aria-hidden="true">→</span></button></div><details class="srcs"><summary>Sources for this entry (7)</summary><ol><li>Weiss, H. et al. (1993). The genesis and collapse of third millennium north Mesopotamian civilization. Science 261: 995-1004. <a href="https://doi.org/10.1126/science.261.5124.995" target="_blank" rel="noopener">doi:10.1126/science.261.5124.995</a></li><li>Cullen, H.M. et al. (2000). Climate change and the collapse of the Akkadian empire: evidence from the deep sea. Geology 28: 379-382. <a href="https://doi.org/10.1130/0091-7613(2000)28&lt;379:CCATCO&gt;2.0.CO;2" target="_blank" rel="noopener">doi:10.1130/0091-7613(2000)28&lt;379:CCATCO&gt;2.0.CO;2</a></li><li>Carolin, S.A. et al. (2019). Precise timing of abrupt increase in dust activity in the Middle East coincident with 4.2 ka social change. PNAS 116: 67-72. <a href="https://doi.org/10.1073/pnas.1808103115" target="_blank" rel="noopener">doi:10.1073/pnas.1808103115</a></li><li>Walker, M. et al. (2018). Formal ratification of the subdivision of the Holocene Series/Epoch (Quaternary System/Period): two new Global Boundary Stratotype Sections and Points (GSSPs) and three new stages/subseries. Episodes 41: 213-223. <a href="https://doi.org/10.18814/epiiugs/2018/018016" target="_blank" rel="noopener">doi:10.18814/epiiugs/2018/018016</a></li><li>Bini, M. et al. (2019). The 4.2 ka BP Event in the Mediterranean region: an overview. Climate of the Past 15: 555-577. <a href="https://doi.org/10.5194/cp-15-555-2019" target="_blank" rel="noopener">doi:10.5194/cp-15-555-2019</a></li><li>Staubwasser, M. et al. (2003). Climate change at the 4.2 ka BP termination of the Indus valley civilization and Holocene south Asian monsoon variability. Geophysical Research Letters 30: 1425. <a href="https://doi.org/10.1029/2002GL016822" target="_blank" rel="noopener">doi:10.1029/2002GL016822</a></li><li>Zhang, H. et al. (2021). Collapse of the Liangzhu and other Neolithic cultures in the lower Yangtze region in response to climate change. Science Advances 7: eabi9275. <a href="https://doi.org/10.1126/sciadv.abi9275" target="_blank" rel="noopener">doi:10.1126/sciadv.abi9275</a></li></ol></details></div></script><script type="text/x-tpl" id="le-536-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Justinian mosaic, San Vitale, consecrated 547, Ravenna, Italy.jpg" data-cap="536 and the Late Antique Little Ice Age" data-big><figcaption></figcaption></figure><div class="sh-k">Holocene · Holocene: Meghalayan (Late Antiquity)</div><h2 class="sh-t" id="le-536-st" tabindex="-1">536 and the Late Antique Little Ice Age</h2><p class="sh-s">536–c. 660 CE</p><div class="sh-v"><span class="vstamp vstamp--on vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Strong evidence</span></span></div></div><p class="v4-q">In 536 a haze dimmed the sun for a year; more eruptions followed, harvests failed, plague spread, and a century of cold reshaped Eurasia.</p><div class="lx-nums" data-from="lxs-le-536"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-536"></div><div class="v4m"><div class="v4m-claim"><span>The claim on the scales</span><p>Volcanic eruptions in 536 and 540 CE caused years of cold and failed harvests across the Northern Hemisphere.</p></div><div class="v4m-grid"><div class="v4m-c" style="grid-column:1/-1"><div class="meter" style="--pos:75.0%" role="img" aria-label="Weight of evidence: Strong evidence"><div class="meter-top"><span class="meter-k">Weight of evidence</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Ice cores from both poles, tree rings from several continents, and written accounts from Constantinople, Ireland and China agree on a dimmed sun and cold summers right after the eruptions, and new ice-core dating aligns them year by year (Sigl et al. 2015). Models show cooling severe enough to damage crops (Toohey et al. 2016). What is less secure is how much of the century&#x27;s turmoil, migration and plague the cold explains.</p></div></div></div><div class="twist"><b>Still open</b><p>Which volcanoes erupted in 536 and 540 is unresolved. How deadly the Justinianic Plague was, and whether a cold century truly drove migrations and imperial decline, are debated; historians warn against letting a neat climate story replace politics, war and chance.</p></div><div class="wdeep"><div class="wdeep-top"><span class="wdeep-k">The full story</span><span class="wdeep-m">2 min read · 362 words · 0 animated drawings</span></div><nav class="wtoc" aria-label="Sections of 536 and the Late Antique Little Ice Age"><button type="button" class="wtoc-i" data-go="le-536-s1">The year the sun went dim</button><button type="button" class="wtoc-i" data-go="le-536-s2">A century in the cold</button><button type="button" class="wtoc-i" data-go="le-536-s3">Upheaval, or coincidence?</button></nav></div><section class="wsec" id="le-536-s1"><h3 class="wsec-h"><span class="wsec-n">01</span>The year the sun went dim</h3><p>In 536 CE, people across Europe, the Middle East and Asia noticed something wrong with the sky. The sun shone weakly, as if through a veil, for more than a year. Summer frosts and snow were reported, and crops failed. Irish annals record a failure of bread, and Chinese records note unusual cold. In 2018 a news feature in Science called 536 &#x27;the worst year to be alive&#x27; (Gibbons 2018). For centuries historians wondered what had happened. Ice cores gave the answer: a large eruption, followed four years later by another.</p><blockquote class="wpull"><p>A volcano most people never saw cast a shadow over harvests from Ireland to China.</p></blockquote></section><section class="wsec" id="le-536-s2"><h3 class="wsec-h"><span class="wsec-n">02</span>A century in the cold</h3><p>One eruption cools the world for a year or two. Three large eruptions in eleven years, with the sun also in a weak phase, did far more. Tree rings from the Russian Altai and the European Alps show summers stayed cold for over a century (Büntgen et al. 2016). Researchers named the period the Late Antique Little Ice Age. It overlapped the first great plague pandemic, which reached the Mediterranean in 541 and swept the eastern Roman Empire in waves until the mid-700s. Its toll is hard to count, because ancient writers rarely gave reliable numbers, but the disease clearly shaped life and death for generations.</p><aside class="wcall"><b>How do we know?</b><p>Volcanic eruptions leave sulfate in polar snow, and counting annual ice layers dates them. Sigl et al. (2015) matched these layers to tree rings using a spike of radiocarbon from a cosmic ray burst in 774-775 CE, fixing the dates precisely. Tree-ring widths and wood density record summer warmth. Ancient DNA from plague victims&#x27; teeth identifies the bacterium (Wagner et al. 2014).</p></aside></section><section class="wsec" id="le-536-s3"><h3 class="wsec-h"><span class="wsec-n">03</span>Upheaval, or coincidence?</h3><p>The sixth and seventh centuries saw dramatic change: the Avars and other steppe peoples moved west, Slavic groups spread across eastern Europe, the eastern Roman and Sasanian Persian empires exhausted each other in war, and new states rose across Eurasia. It is tempting to blame the cold. Some historians do see climate and plague as a heavy blow that weakened old empires. Others point out that plague deaths are hard to measure and that texts, coins and building records show resilience in many places (Mordechai et al. 2019).</p><ul class="wlist"><li>Strong: the eruptions, the cold summers and the famines they caused in several regions.</li><li>Plausible: that cold and plague together weakened states already under strain.</li><li>Debated: that climate caused specific migrations, wars or the fall of any single empire.</li></ul></section><h3 class="sub-h wsub">Go deeper</h3><div class="links-row"><button type="button" onclick="openItem('timeline','age-12')">The Dark Year and a Knowledge Relay <span aria-hidden="true">→</span></button></div><details class="srcs"><summary>Sources for this entry (6)</summary><ol><li>Büntgen, U. et al. (2016). Cooling and societal change during the Late Antique Little Ice Age from 536 to around 660 AD. Nature Geoscience 9: 231-236. <a href="https://doi.org/10.1038/ngeo2652" target="_blank" rel="noopener">doi:10.1038/ngeo2652</a></li><li>Sigl, M. et al. (2015). Timing and climate forcing of volcanic eruptions for the past 2,500 years. Nature 523: 543-549. <a href="https://doi.org/10.1038/nature14565" target="_blank" rel="noopener">doi:10.1038/nature14565</a></li><li>Toohey, M., Krüger, K., Sigl, M., Stordal, F. &amp; Svensen, H. (2016). Climatic and societal impacts of a volcanic double event at the dawn of the Middle Ages. Climatic Change 136: 401-412. <a href="https://doi.org/10.1007/s10584-016-1648-7" target="_blank" rel="noopener">doi:10.1007/s10584-016-1648-7</a></li><li>Wagner, D.M. et al. (2014). Yersinia pestis and the Plague of Justinian 541-543 AD: a genomic analysis. The Lancet Infectious Diseases 14: 319-326. <a href="https://doi.org/10.1016/S1473-3099(13)70323-2" target="_blank" rel="noopener">doi:10.1016/S1473-3099(13)70323-2</a></li><li>Mordechai, L. et al. (2019). The Justinianic Plague: an inconsequential pandemic? PNAS 116: 25546-25554. <a href="https://doi.org/10.1073/pnas.1903797116" target="_blank" rel="noopener">doi:10.1073/pnas.1903797116</a></li><li>Gibbons, A. (2018). Eruption made 536 &#x27;the worst year to be alive&#x27;. Science 362: 733-734. <a href="https://doi.org/10.1126/science.362.6416.733" target="_blank" rel="noopener">doi:10.1126/science.362.6416.733</a></li></ol></details></div></script><script type="text/x-tpl" id="le-little-ice-age-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Hendrick Avercamp - Winterlandschap met ijsvermaak.jpg" data-cap="Medieval Warmth and the Little Ice Age" data-big><figcaption></figcaption></figure><div class="sh-k">Holocene · Holocene: Meghalayan (Medieval to early modern)</div><h2 class="sh-t" id="le-little-ice-age-st" tabindex="-1">Medieval Warmth and the Little Ice Age</h2><p class="sh-s">c. 950–1850 CE</p><div class="sh-v"><span class="vstamp vstamp--on vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg><span class="vs-tx"><span class="vs-on">The claim:</span>Mixed record</span></span></div></div><p class="v4-q">A patchy medieval warm spell, then centuries of cooler, stormier weather: Norse Greenland faded, frost fairs rose on the Thames, and famines followed eruptions.</p><div class="lx-nums" data-from="lxs-le-little-ice-age"></div><div class="lx-rows lx-rows--sheet" data-from="lxs-le-little-ice-age"></div><div class="v4m"><div class="v4m-claim"><span>The
