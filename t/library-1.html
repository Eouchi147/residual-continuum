<script type="text/x-tpl" id="book-pyramid-texts-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Pyramid Texts in Unas’ Pyramid 2017.jpg" data-cap="Pyramid Texts in the tomb of Unas" data-big><figcaption></figcaption></figure><div class="sh-k">Old Kingdom Egypt</div><h2 class="sh-t" id="book-pyramid-texts-st" tabindex="-1">Pyramid Texts</h2><p class="sh-s">c. 2400-2300 BCE (carved); some spells likely older oral liturgy</p><div class="sh-v"><span class="vstamp vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div></div><div class="bk-facts"><div><b>Language and script</b>Old Egyptian; hieroglyphs carved and painted on stone walls</div><div><b>Oldest copy</b>Walls of the burial chamber and antechamber of the Pyramid of Unas, c. 2350 BCE (Unas&#x27;s reign is dated anywhere from c. 2404-2374 to c. 2312-2282 BCE)</div><div><b>Where it is now</b>In situ, Saqqara, Egypt</div><div><b>Size</b>283 spells in Unas&#x27;s pyramid alone; hundreds more across later Old Kingdom pyramids</div><div><b>Dating confidence</b>high for the carvings, low for oral origins</div></div><h3 class="sub-h">What it says</h3><p>A launch manual for a dead king. The spells help the pharaoh climb a ladder to the sky, ride a reed float across the heavens, join the boat of the sun god Ra and become one of the stars that never set. Others are practical charms against snakes and scorpions. The notorious Cannibal Hymn has the king swallowing gods to absorb their power. It reads less like a book than a ritual toolkit, carved in stone so it would keep working forever.</p><h3 class="sub-h">History check</h3><p>The texts sit exactly where and when they appear to belong: inside securely identified royal pyramids at Saqqara (Unas, Teti, Pepi I, Merenre, Pepi II and several queens). Their content is religious, not a chronicle, but it matches temple and tomb evidence for Old Kingdom cults of Ra and Osiris. Absolute dates for Unas still vary by several decades between chronologies.</p><div class="meter" style="--pos:91.7%" role="img" aria-label="History check: Established"><div class="meter-top"><span class="meter-k">History check</span><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">As a record of Old Kingdom royal belief and ritual.</p><div class="dyk"><p>Unas&#x27;s burial chamber has a ceiling painted with golden stars. Until the 1880s, most scholars assumed pyramid interiors were blank; the carved spells were only discovered in 1880-81.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Allen, J. P. (2005). The Ancient Egyptian Pyramid Texts. Society of Biblical Literature.</li><li>Lichtheim, M. (1973). Ancient Egyptian Literature, Vol. I. University of California Press.</li></ol></details></div></script><script type="text/x-tpl" id="book-gilgamesh-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Tablet V of the Epic of Gilgamesh.jpg" data-cap="Tablet V of the Epic of Gilgamesh" data-big><figcaption></figcaption></figure><div class="sh-k">Mesopotamia (Sumer and Babylonia)</div><h2 class="sh-t" id="book-gilgamesh-st" tabindex="-1">Epic of Gilgamesh</h2><p class="sh-s">Sumerian poems c. 2100 BCE; Old Babylonian epic c. 1800 BCE; Standard version (attributed to Sin-leqi-unninni) c. 1200-1100 BCE</p><div class="sh-v"><span class="vstamp vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div></div><div class="bk-facts"><div><b>Language and script</b>Sumerian (early poems) and Akkadian (the epic); cuneiform on clay tablets</div><div><b>Oldest copy</b>Old Babylonian epic tablets (e.g. the Pennsylvania and Yale tablets); the fullest version from Nineveh, c. 1800-1700 BCE; Nineveh copies 7th c. BCE</div><div><b>Where it is now</b>Penn Museum, Yale Babylonian Collection; British Museum (Nineveh tablets)</div><div><b>Size</b>About 3,000 lines on 12 tablets in the Standard Babylonian version, with gaps still being filled</div><div><b>Dating confidence</b>medium</div></div><h3 class="sub-h">What it says</h3><p>Gilgamesh, a bullying king of Uruk, meets his match in Enkidu, a wild man the gods create to keep him busy. They become best friends, kill the forest guardian Humbaba, snub the goddess Ishtar and slay her Bull of Heaven. The gods punish them: Enkidu dies. Terrified of death, Gilgamesh travels to Utnapishtim, survivor of a great flood, seeking immortality. He finds a plant of youth, and a snake steals it. He goes home and admires his city&#x27;s walls instead.</p><h3 class="sub-h">History check</h3><p>A Gilgamesh of Uruk appears in the Sumerian King List (with an impossible 126-year reign), and one of his legendary rivals, Enmebaragesi of Kish, is attested in his own inscriptions, so a real king around 2700 BCE is plausible. No inscription of Gilgamesh himself has been found. Uruk&#x27;s huge walls are real. The flood episode borrows from the older Atrahasis story; Mesopotamian flood layers are local and of different dates.</p><div class="meter" style="--pos:50.0%" role="img" aria-label="History check: Mixed record"><div class="meter-top"><span class="meter-k">History check</span><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Real city and plausibly real king; the adventures are legend.</p><div class="dyk"><p>When George Smith of the British Museum read the flood tablet in 1872, he was reportedly so excited that he started taking off his clothes. A tablet bought by the Sulaymaniyah Museum and published in 2014 added new lines describing chattering monkeys in the Cedar Forest.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>George, A. R. (2003). The Babylonian Gilgamesh Epic. Oxford University Press.</li><li>Al-Rawi, F. N. H., George, A. R. (2014). Back to the Cedar Forest: the beginning and end of Tablet V of the Standard Babylonian Epic of Gilgamesh. Journal of Cuneiform Studies 66, 69-90.</li></ol></details></div></script><script type="text/x-tpl" id="book-enuma-elish-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Enuma Elish K.3473.jpg" data-cap="An Enuma Elish tablet" data-big><figcaption></figcaption></figure><div class="sh-k">Babylonia</div><h2 class="sh-t" id="book-enuma-elish-st" tabindex="-1">Enuma Elish</h2><p class="sh-s">Debated, c. 1800-1100 BCE; many favour the reign of Nebuchadnezzar I (c. 1125-1104 BCE)</p><div class="sh-v"><span class="vstamp vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div></div><div class="bk-facts"><div><b>Language and script</b>Akkadian (Standard Babylonian); cuneiform on clay</div><div><b>Oldest copy</b>Tablet copies from Ashur, Kish and the Library of Ashurbanipal at Nineveh, 1st millennium BCE (earliest c. 9th c. BCE)</div><div><b>Where it is now</b>British Museum and other collections</div><div><b>Size</b>About 1,100 lines on 7 tablets</div><div><b>Dating confidence</b>low-medium</div></div><h3 class="sub-h">What it says</h3><p>Before sky and earth had names, sweet water (Apsu) and salt water (Tiamat) mingled. Their divine children are so noisy that Apsu plots to kill them; the clever god Ea strikes first. Furious, Tiamat raises an army of monsters. Young Marduk agrees to fight only if crowned king of the gods. He blasts her with winds, splits her body like a dried fish to make sky and earth, creates humans from a rebel god&#x27;s blood to do the gods&#x27; chores, and builds Babylon.</p><h3 class="sub-h">History check</h3><p>As an account of creation it is myth. As political history it fits well: it celebrates Marduk&#x27;s rise to the top of the pantheon, which tracks Babylon&#x27;s own rise. Later ritual texts indicate it was recited during the Akitu New Year festival. Its exact date of composition is still argued.</p><div class="meter" style="--pos:50.0%" role="img" aria-label="History check: Mixed record"><div class="meter-top"><span class="meter-k">History check</span><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Mythic cosmology; reliable mirror of Babylonian politics and religion.</p><div class="dyk"><p>The title just means &#x27;When on high&#x27;, the poem&#x27;s first two words. The last tablet is a victory list of Marduk&#x27;s 50 names.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Lambert, W. G. (2013). Babylonian Creation Myths. Eisenbrauns.</li><li>Dalley, S. (2000). Myths from Mesopotamia. Oxford World&#x27;s Classics.</li></ol></details></div></script><script type="text/x-tpl" id="book-ptahhotep-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Papyrus Prisse 187.jpg" data-cap="The Prisse Papyrus" data-big><figcaption></figcaption></figure><div class="sh-k">Middle Kingdom Egypt (set in the Old Kingdom)</div><h2 class="sh-t" id="book-ptahhotep-st" tabindex="-1">The Instruction of Ptahhotep</h2><p class="sh-s">Set in the reign of Djedkare Isesi (c. 2400 BCE); language suggests composition c. 2000-1800 BCE</p><div class="sh-v"><span class="vstamp vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div></div><div class="bk-facts"><div><b>Language and script</b>Middle Egyptian; hieratic script on papyrus</div><div><b>Oldest copy</b>Papyrus Prisse, c. 1800 BCE (12th Dynasty)</div><div><b>Where it is now</b>Bibliothèque nationale de France, Paris</div><div><b>Size</b>37 maxims plus a prologue and epilogue</div><div><b>Dating confidence</b>low for the attribution, medium for Middle Kingdom composition</div></div><h3 class="sub-h">What it says</h3><p>An aging vizier asks the king to let him train his son, and opens with a grumpy list of what old age does to the body. Then comes the advice: stay humble, because &#x27;good speech is more hidden than greenstone, yet it is found among the women at the grindstones&#x27;. Listen more than you talk. Do not gossip. Do not grab food at a superior&#x27;s table. Be generous, love your wife, and do not let success make you arrogant. Some tips would suit a modern office.</p><h3 class="sub-h">History check</h3><p>King Djedkare Isesi and viziers named Ptahhotep are attested, including tombs at Saqqara. But the grammar and style point to the Middle Kingdom, so the attribution is probably a literary device giving the text an ancient pedigree.</p><div class="meter" style="--pos:58.3%" role="img" aria-label="History check: Plausible"><div class="meter-top"><span class="meter-k">History check</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Real names and setting; authorship probably later than claimed.</p><div class="dyk"><p>Papyrus Prisse, acquired in Egypt in the 1840s by Émile Prisse d&#x27;Avennes, is often nicknamed &#x27;the oldest book in the world&#x27;.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Lichtheim, M. (1973). Ancient Egyptian Literature, Vol. I. University of California Press.</li><li>Parkinson, R. B. (1997). The Tale of Sinuhe and Other Ancient Egyptian Poems 1940-1640 BC. Oxford University Press.</li></ol></details></div></script><script type="text/x-tpl" id="book-hammurabi-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Detail of the Code of Hammurabi, SB 8 (56).jpg" data-cap="Cuneiform on the Hammurabi stele" data-big><figcaption></figcaption></figure><div class="sh-k">Old Babylonian Mesopotamia</div><h2 class="sh-t" id="book-hammurabi-st" tabindex="-1">Code of Hammurabi</h2><p class="sh-s">c. 1755-1750 BCE, late in Hammurabi&#x27;s reign (c. 1792-1750 BCE, middle chronology)</p><div class="sh-v"><span class="vstamp vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div></div><div class="bk-facts"><div><b>Language and script</b>Akkadian; cuneiform carved on a basalt stele</div><div><b>Oldest copy</b>The 2.25 m black stone stele, c. 1754 BCE</div><div><b>Where it is now</b>Louvre, Paris (found at Susa, Iran, in 1901-02)</div><div><b>Size</b>Prologue, 282 laws (as numbered by modern scholars), epilogue</div><div><b>Dating confidence</b>high relative date; absolute date depends on the chronology used</div></div><h3 class="sub-h">What it says</h3><p>A king announces that the gods chose him &#x27;to make justice appear in the land&#x27; and protect the weak from the strong. Then come the case rulings: theft, trade, wages, rent, marriage, divorce, adoption, surgeons&#x27; fees and building collapses. &#x27;An eye for an eye&#x27; applies, but only between social equals; hurting a commoner or a slave costs silver instead. If a house falls and kills its owner, the builder dies. It is justice, Bronze Age style.</p><h3 class="sub-h">History check</h3><p>Hammurabi is one of the best-attested kings of antiquity: his letters, year names, contracts and many tablet copies of the laws survive. Scholars debate whether courts actually applied the code; few trial records cite it, so it may have worked as royal showcase and model rulings.</p><div class="meter" style="--pos:91.7%" role="img" aria-label="History check: Established"><div class="meter-top"><span class="meter-k">History check</span><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The king, the text and its date are firmly attested; everyday legal use is debated.</p><div class="dyk"><p>The stele was itself war loot: an Elamite king, Shutruk-Nahhunte, carried it to Susa in the 12th century BCE, and several columns were chiselled off, perhaps for a boast he never carved.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Roth, M. T. (1997). Law Collections from Mesopotamia and Asia Minor. 2nd ed. Scholars Press.</li><li>Van De Mieroop, M. (2005). King Hammurabi of Babylon: A Biography. Blackwell.</li></ol></details></div></script><script type="text/x-tpl" id="book-rigveda-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="1500-1200 BCE, Vivaha sukta, Rigveda 10.85.16-27, Sanskrit, Devanagari, manuscript page.jpg" data-cap="A later manuscript page of the Rigveda" data-big><figcaption></figcaption></figure><div class="sh-k">Vedic Indo-Aryans, northwestern Indian subcontinent</div><h2 class="sh-t" id="book-rigveda-st" tabindex="-1">Rigveda</h2><p class="sh-s">c. 1500-1000 BCE (older hymns c. 1500-1200 BCE)</p><div class="sh-v"><span class="vstamp vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div></div><div class="bk-facts"><div><b>Language and script</b>Vedic Sanskrit; transmitted orally, later written in scripts such as Sharada and Devanagari</div><div><b>Oldest copy</b>Manuscripts in the Bhandarkar Oriental Research Institute collection (UNESCO Memory of the World, 2007), Oldest dated: 1464 CE</div><div><b>Where it is now</b>BORI, Pune, India</div><div><b>Size</b>10 books (mandalas), 1,028 hymns, about 10,600 verses</div><div><b>Dating confidence</b>medium; based on linguistics and external anchors</div></div><h3 class="sub-h">What it says</h3><p>A collection of hymns sung at fire rituals. Agni, the fire, carries offerings to the gods. Indra, a thunder-wielding hero fuelled by the drink soma, slays the serpent Vritra and frees the rivers. Ushas, the dawn, is praised in some of its loveliest poems, and Varuna guards cosmic order. One late hymn wonders how creation began and ends with a shrug: perhaps even the highest overseer &#x27;knows, or perhaps he does not know&#x27;.</p><h3 class="sub-h">History check</h3><p>The hymns describe a mobile, cattle-herding society with horses and chariots, and their river names fit the Punjab region. A Hittite-Mitanni treaty of about 1380 BCE invokes Mitra, Varuna, Indra and the Nasatyas, an independent sign these gods were known by the 14th century BCE. Exact dates and the question of origins remain debated.</p><div class="meter" style="--pos:58.3%" role="img" aria-label="History check: Plausible"><div class="meter-top"><span class="meter-k">History check</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Reliable window on an early society; dating is approximate.</p><div class="dyk"><p>The text was preserved by memory for many centuries using cross-checking recitation patterns (pada, krama, jata, ghana) that make errors easy to spot. Vedic chanting is on UNESCO&#x27;s list of Intangible Cultural Heritage.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Jamison, S. W., Brereton, J. P. (2014). The Rigveda: The Earliest Religious Poetry of India. Oxford University Press.</li><li>UNESCO Memory of the World Register: Rigveda manuscripts, BORI (2007).</li></ol></details></div></script><script type="text/x-tpl" id="book-book-of-the-dead-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="BD Weighing of the Heart.jpg" data-cap="The weighing of the heart" data-big><figcaption></figcaption></figure><div class="sh-k">New Kingdom to Ptolemaic Egypt</div><h2 class="sh-t" id="book-book-of-the-dead-st" tabindex="-1">Book of the Dead (Book of Coming Forth by Day)</h2><p class="sh-s">Emerges c. 1700-1550 BCE from earlier Coffin Texts; used until c. 50 BCE</p><div class="sh-v"><span class="vstamp vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div></div><div class="bk-facts"><div><b>Language and script</b>Egyptian; hieroglyphic and hieratic on papyrus, coffins and shrouds</div><div><b>Oldest copy</b>Early spells on the coffin of Queen Mentuhotep (13th Dynasty); the famous Papyrus of Ani, c. 1700 BCE; Ani c. 1250 BCE</div><div><b>Where it is now</b>Coffin now lost (known from copies); Papyrus of Ani in the British Museum</div><div><b>Size</b>About 190 spells known; no single copy has them all. The Papyrus of Ani is over 20 m long</div><div><b>Dating confidence</b>high</div></div><h3 class="sub-h">What it says</h3><p>A personalized survival kit for the afterlife. Spells let the dead transform into a heron or a lotus, avoid walking upside down, and keep their heart in place. The big moment is spell 125: in the Hall of Two Truths the heart is weighed against the feather of Maat while the deceased recites a &#x27;negative confession&#x27;: I have not stolen, I have not lied. Fail, and the monster Ammit, part crocodile, part lion, part hippo, eats the heart.</p><h3 class="sub-h">History check</h3><p>Thousands of copies come from dated tombs, so the text&#x27;s use and development are very well documented. It records what elite Egyptians hoped for after death rather than events.</p><div class="meter" style="--pos:91.7%" role="img" aria-label="History check: Established"><div class="meter-top"><span class="meter-k">History check</span><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">As evidence of Egyptian funerary belief and practice.</p><div class="dyk"><p>Some copies were prepared in advance with blank spaces where the buyer&#x27;s name would be filled in later: a ready-made afterlife guide.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Taylor, J. H. (ed.) (2010). Journey Through the Afterlife: Ancient Egyptian Book of the Dead. British Museum Press.</li><li>Faulkner, R. O. (1985). The Ancient Egyptian Book of the Dead. British Museum Press.</li></ol></details></div></script><script type="text/x-tpl" id="book-hebrew-bible-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Aleppo Codex, The Ten Commandments in Deuteronomy.jpg" data-cap="The Aleppo Codex" data-big><figcaption></figcaption></figure><div class="sh-k">Ancient Israel and Judah; Jewish communities of the Persian and Hellenistic eras</div><h2 class="sh-t" id="book-hebrew-bible-st" tabindex="-1">Hebrew Bible (Tanakh), including the Torah</h2><p class="sh-s">Written and edited over c. 9th/8th-2nd c. BCE; the Torah probably reached its present form c. 6th-5th c. BCE</p><div class="sh-v"><span class="vstamp vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div></div><div class="bk-facts"><div><b>Language and script</b>Biblical Hebrew with some Aramaic; Paleo-Hebrew, later Aramaic square script</div><div><b>Oldest copy</b>Ketef Hinnom silver amulets (the Priestly Blessing, Numbers 6:24-26); oldest complete Hebrew Bible: Leningrad Codex, Amulets c. 600 BCE; Leningrad Codex 1008 CE</div><div><b>Where it is now</b>Israel Museum, Jerusalem; National Library of Russia, St Petersburg</div><div><b>Size</b>24 books in the Jewish count; the Torah alone is about 80,000 Hebrew words</div><div><b>Dating confidence</b>low-medium; actively debated</div></div><h3 class="sub-h">What it says</h3><p>A library rather than a book: creation, a flood, the families of Abraham, Isaac and Jacob, the Exodus from Egypt and laws given at Sinai, then settlement, judges, kings, prophets, exile to Babylon and return. Alongside the stories sit poetry (Psalms, Song of Songs), proverbs, the long argument of Job and the gloriously skeptical Ecclesiastes. It is history, law, poetry and argument woven together by many hands.</p><h3 class="sub-h">History check</h3><p>Independent inscriptions confirm several figures and events: the Tel Dan stele mentions the &#x27;House of David&#x27;, the Mesha stele names Omri of Israel, Assyrian records name Jehu and Hezekiah, and Babylonian ration tablets list King Jehoiachin. The patriarchs, the Exodus and a sweeping conquest lack direct archaeological support, and the scale of the early monarchy is debated.</p><div class="meter" style="--pos:50.0%" role="img" aria-label="History check: Mixed record"><div class="meter-top"><span class="meter-k">History check</span><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Later monarchy period often corroborated; earlier narratives largely untestable or unsupported.</p><div class="dyk"><p>The Ketef Hinnom amulets are tiny rolled silver scrolls, found in 1979, that are roughly 400 years older than the Dead Sea Scrolls.</p></div><details class="srcs"><summary>Sources (3)</summary><ol><li>Barkay, G. et al. (2004). The amulets from Ketef Hinnom: a new edition and evaluation. Bulletin of the American Schools of Oriental Research 334, 41-71. <a href="https://doi.org/10.2307/4150106" target="_blank" rel="noopener">doi:10.2307/4150106</a></li><li>Finkelstein, I., Silberman, N. A. (2001). The Bible Unearthed. Free Press.</li><li>Tov, E. (2012). Textual Criticism of the Hebrew Bible. 3rd ed. Fortress Press.</li></ol></details></div></script><script type="text/x-tpl" id="book-homer-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Codex Venetus B.jpg" data-cap="A medieval manuscript of the Iliad" data-big><figcaption></figcaption></figure><div class="sh-k">Archaic Greece</div><h2 class="sh-t" id="book-homer-st" tabindex="-1">Iliad and Odyssey</h2><p class="sh-s">c. 750-650 BCE, from a much older oral tradition; fixed in writing between the 8th and 6th c. BCE</p><div class="sh-v"><span class="vstamp vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div></div><div class="bk-facts"><div><b>Language and script</b>Homeric Greek (an artificial poetic mix of dialects); Greek alphabet</div><div><b>Oldest copy</b>Papyrus fragments from Egypt; oldest complete Iliad manuscript: Venetus A, Fragments from 3rd c. BCE; Venetus A 10th c. CE</div><div><b>Where it is now</b>Various papyrus collections; Biblioteca Marciana, Venice</div><div><b>Size</b>Iliad 15,693 lines; Odyssey 12,109 lines</div><div><b>Dating confidence</b>medium</div></div><h3 class="sub-h">What it says</h3><p>The Iliad covers a few weeks in the tenth year of the Trojan War: Achilles sulks after an insult, his friend Patroclus is killed, Achilles kills Hector in revenge, and old King Priam sneaks into the enemy camp to beg for his son&#x27;s body. The Odyssey follows Odysseus&#x27;s ten-year trip home past a Cyclops, the witch Circe, the Sirens and the land of the dead, ending with a bow contest and a hall full of doomed suitors.</p><h3 class="sub-h">History check</h3><p>Troy is identified with Hisarlik in Turkey, a real city destroyed more than once around 1300-1180 BCE. Hittite texts mention Wilusa (likely Ilios), a king called Alaksandu and a western power called Ahhiyawa (likely Achaeans). The boar&#x27;s-tusk helmet in the Iliad matches Mycenaean finds. The heroes, gods and a single ten-year war remain unattested.</p><div class="meter" style="--pos:58.3%" role="img" aria-label="History check: Plausible"><div class="meter-top"><span class="meter-k">History check</span><span class="vd vd--plausible"><svg class="i" aria-hidden="true"><use href="#i6"/></svg>Plausible</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">A real Bronze Age setting with a possible kernel of conflict, heavily legendary.</p><div class="dyk"><p>There is no Trojan Horse in the Iliad. It appears only as a memory in the Odyssey (books 4 and 8), and the full tale is told much later by Virgil.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Latacz, J. (2004). Troy and Homer: Towards a Solution of an Old Mystery. Oxford University Press.</li><li>Cline, E. H. (2013). The Trojan War: A Very Short Introduction. Oxford University Press.</li></ol></details></div></script><script type="text/x-tpl" id="book-avesta-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="10938 0004 web.jpg" data-cap="An Avestan manuscript" data-big><figcaption></figcaption></figure><div class="sh-k">Ancient Iranian peoples; Zoroastrian tradition</div><h2 class="sh-t" id="book-avesta-st" tabindex="-1">Avesta</h2><p class="sh-s">Gathas perhaps c. 1500-1000 BCE (proposals range to c. 500 BCE); Young Avestan texts later; written down in Sasanian times</p><div class="sh-v"><span class="vstamp vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div></div><div class="bk-facts"><div><b>Language and script</b>Avestan (Old and Young Avestan); written in the Avestan alphabet, invented c. 5th-6th c. CE</div><div><b>Oldest copy</b>Manuscripts J2 and L4, the oldest securely dated, 1323 CE</div><div><b>Where it is now</b>UK libraries (Oxford and London); over 300 Avestan manuscripts are known</div><div><b>Size</b>About 83,000 surviving words, perhaps a quarter of the Sasanian-era Avesta</div><div><b>Dating confidence</b>low</div></div><h3 class="sub-h">What it says</h3><p>At its heart are the Gathas, 17 hymns attributed to the prophet Zarathustra, who talks directly with the wise lord Ahura Mazda. The big theme is choice: every person sides with truth (asha) or with the lie (druj). Around the Gathas sit liturgies for the fire ritual, hymns to divine beings such as Mithra and Anahita, and the Vendidad, a rulebook on purity, dogs, and how to keep the dead from polluting earth, fire and water.</p><h3 class="sub-h">History check</h3><p>The Gathas&#x27; language is very close to Rigvedic Sanskrit, which supports an early date. Achaemenid inscriptions of Darius I (c. 520 BCE) invoke Ahuramazda, so the god was central by then. Zarathustra himself has no external attestation, and his date is one of the most contested in the history of religion.</p><div class="meter" style="--pos:41.7%" role="img" aria-label="History check: Open question"><div class="meter-top"><span class="meter-k">History check</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The tradition is ancient; the founder&#x27;s date and life are uncertain.</p><div class="dyk"><p>The Avestan alphabet, with more than 50 letters, was invented centuries after the texts were composed, largely to record pronunciation precisely as priests chanted it.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Skjærvø, P. O. (2011). The Spirit of Zoroastrianism. Yale University Press.</li><li>Cantera, A. (ed.). Avestan Digital Archive (ada.geschkult.fu-berlin.de).</li></ol></details></div></script><script type="text/x-tpl" id="book-shijing-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Pelliot chinois 2129 - btv1b10099487h (36 of 39).jpg" data-cap="A Dunhuang manuscript of the Shijing" data-big><figcaption></figcaption></figure><div class="sh-k">Zhou dynasty China</div><h2 class="sh-t" id="book-shijing-st" tabindex="-1">Shijing (Classic of Poetry)</h2><p class="sh-s">c. 1000-600 BCE</p><div class="sh-v"><span class="vstamp vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div></div><div class="bk-facts"><div><b>Language and script</b>Old Chinese; Chinese characters on bamboo and silk</div><div><b>Oldest copy</b>Warring States bamboo slips held by Anhui University; Han-era Fuyang slips, c. 4th c. BCE; Fuyang c. 165 BCE</div><div><b>Where it is now</b>Anhui University, Hefei; Fuyang material in Anhui</div><div><b>Size</b>305 poems</div><div><b>Dating confidence</b>medium-high</div></div><h3 class="sub-h">What it says</h3><p>China&#x27;s oldest poetry anthology. The &#x27;Airs of the States&#x27; are folk songs about love, flirting by the river, harvests, homesick soldiers and brides leaving home. One poem begs a &#x27;big rat&#x27; to stop eating the grain: a thinly veiled complaint about greedy lords. The court odes and temple hymns praise Zhou ancestors such as King Wen and King Wu, who overthrew the Shang. It is sung history and everyday feeling in one.</p><h3 class="sub-h">History check</h3><p>Kings and events named in the hymns match Western Zhou bronze inscriptions, including the Zhou conquest of the Shang (c. 1046 BCE). Bamboo manuscripts from the 4th century BCE show the poems circulated before the Qin book burning, with variant wording.</p><div class="meter" style="--pos:75.0%" role="img" aria-label="History check: Strong evidence"><div class="meter-top"><span class="meter-k">History check</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Names and institutions largely match bronze-age inscriptions.</p><div class="dyk"><p>Tradition says Confucius picked these 305 from about 3,000 poems; most scholars doubt it. He did tell his son that without studying the Odes, &#x27;you will have nothing to say&#x27;.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Waley, A. (trans.) (1996). The Book of Songs. Grove Press.</li><li>Kern, M. (2010). Early Chinese literature, beginnings through Western Han. In The Cambridge History of Chinese Literature, Vol. 1. Cambridge University Press.</li></ol></details></div></script><script type="text/x-tpl" id="book-analects-tpl"><div class="xp-inner"><div class="sh-hd"><div class="sh-k">Lu state, Spring and Autumn to Han China</div><h2 class="sh-t" id="book-analects-st" tabindex="-1">Analects of Confucius (Lunyu)</h2><p class="sh-s">Compiled by disciples and later followers, c. 5th-3rd c. BCE, taking final shape by the Han</p><div class="sh-v"><span class="vstamp vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div></div><div class="bk-facts"><div><b>Language and script</b>Classical Chinese; Chinese characters on bamboo slips</div><div><b>Oldest copy</b>Dingzhou bamboo slips; Haihun marquis tomb slips, Before 55 BCE (Dingzhou) and 59 BCE (Haihun)</div><div><b>Where it is now</b>Hebei and Jiangxi provinces, China</div><div><b>Size</b>20 books, about 500 short passages, roughly 16,000 characters</div><div><b>Dating confidence</b>medium</div></div><h3 class="sub-h">What it says</h3><p>Short sayings and scenes starring a teacher and his students. &#x27;Is it not a pleasure to learn and practice what you have learned?&#x27; opens the book. Confucius praises humaneness (ren), ritual (li) and the gentleman who does not impose on others what he would not want himself. He can be funny and exasperated too: catching a student napping in the daytime, he says rotten wood cannot be carved.</p><h3 class="sub-h">History check</h3><p>Confucius (traditionally 551-479 BCE) is widely accepted as historical, and other early texts mention him and his disciples. But the Analects was assembled in layers over generations, so individual sayings are hard to pin on him directly.</p><div class="meter" style="--pos:75.0%" role="img" aria-label="History check: Strong evidence"><div class="meter-top"><span class="meter-k">History check</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Historical teacher; the exact words are layered.</p><div class="dyk"><p>The tomb of Liu He, Marquis of Haihun (d. 59 BCE), yielded slips that may belong to the lost &#x27;Qi&#x27; version of the Analects, including a chapter title unseen for nearly 2,000 years.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Slingerland, E. (trans.) (2003). Confucius: Analects. Hackett.</li><li>Brooks, E. B., Brooks, A. T. (1998). The Original Analects. Columbia University Press.</li></ol></details></div></script><script type="text/x-tpl" id="book-tao-te-ching-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Guodian-laozi.kopi.png" data-cap="The Guodian bamboo slips" data-big><figcaption></figcaption></figure><div class="sh-k">Warring States China</div><h2 class="sh-t" id="book-tao-te-ching-st" tabindex="-1">Tao Te Ching (Daodejing)</h2><p class="sh-s">c. 4th c. BCE (with older sayings); traditionally attributed to Laozi, 6th c. BCE</p><div class="sh-v"><span class="vstamp vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div></div><div class="bk-facts"><div><b>Language and script</b>Classical Chinese; bamboo slips and silk</div><div><b>Oldest copy</b>Guodian bamboo slips (partial); Mawangdui silk manuscripts (complete), c. 300 BCE; c. 168 BCE</div><div><b>Where it is now</b>Hubei Provincial Museum; Hunan Museum</div><div><b>Size</b>About 5,000 characters in 81 short chapters</div><div><b>Dating confidence</b>low for author, medium for dating</div></div><h3 class="sub-h">What it says</h3><p>A tiny book of big paradoxes. &#x27;The Tao that can be told is not the eternal Tao.&#x27; Water is soft yet wears down stone, so yielding beats forcing. The wise ruler practises wu wei, acting without straining, and governs a great state &#x27;like cooking a small fish&#x27;: do not poke it too much. It praises simplicity, humility and knowing when enough is enough, and it makes fun of cleverness and showy virtue.</p><h3 class="sub-h">History check</h3><p>Laozi&#x27;s biography comes from Sima Qian (c. 94 BCE), who himself offered several candidates. The Guodian slips show that sections of the text existed by about 300 BCE, but not necessarily as one book by one author.</p><div class="meter" style="--pos:41.7%" role="img" aria-label="History check: Open question"><div class="meter-top"><span class="meter-k">History check</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">The text is ancient; its author may be legendary.</p><div class="dyk"><p>The Mawangdui silk copies put the &#x27;Te&#x27; half first, so the oldest complete versions are really the Te Tao Ching.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Henricks, R. G. (2000). Lao Tzu&#x27;s Tao Te Ching: A Translation of the Startling New Documents Found at Guodian. Columbia University Press.</li><li>Lau, D. C. (trans.) (1963). Tao Te Ching. Penguin.</li></ol></details></div></script><script type="text/x-tpl" id="book-pali-canon-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="The Cullavagga manuscript of the Colombo National Museum.jpg" data-cap="A palm-leaf Pali manuscript" data-big><figcaption></figcaption></figure><div class="sh-k">Theravada Buddhist tradition, South and Southeast Asia</div><h2 class="sh-t" id="book-pali-canon-st" tabindex="-1">Pali Canon (Tipitaka)</h2><p class="sh-s">Oral teachings from c. 5th c. BCE; written down in Sri Lanka in the 1st c. BCE</p><div class="sh-v"><span class="vstamp vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div></div><div class="bk-facts"><div><b>Language and script</b>Pali; written in Sinhala, Burmese, Khmer, Thai, Pyu and later Roman scripts</div><div><b>Oldest copy</b>The Pyu &#x27;golden Pali text&#x27;: 20 gold leaves, c. 5th-6th c. CE</div><div><b>Where it is now</b>Found at Sri Ksetra, Myanmar</div><div><b>Size</b>Three &#x27;baskets&#x27; (discipline, discourses, higher teaching); dozens of volumes in printed editions</div><div><b>Dating confidence</b>medium</div></div><h3 class="sub-h">What it says</h3><p>The Vinaya sets rules for monks and nuns, and often explains each rule with the story of the monk whose mishap caused it. The Suttas hold the Buddha&#x27;s talks: the Four Noble Truths, the Eightfold Path, and parables like the raft you leave behind once you have crossed the river, or blind men arguing over what an elephant is. The Abhidhamma breaks the mind into moments and parts like an early psychology manual.</p><h3 class="sub-h">History check</h3><p>Ashoka&#x27;s inscriptions (3rd c. BCE) mention the Buddha, and the Lumbini pillar states that the Buddha was born there. The Buddha&#x27;s own dates remain debated (c. 563-483 or c. 480-400 BCE). The oldest Buddhist manuscripts of all are Gandharan birch-bark scrolls in the Gandhari language, not Pali.</p><div class="meter" style="--pos:75.0%" role="img" aria-label="History check: Strong evidence"><div class="meter-top"><span class="meter-k">History check</span><span class="vd vd--strong"><svg class="i" aria-hidden="true"><use href="#i3"/></svg>Strong evidence</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Historical teacher and early community; wording shaped by centuries of oral transmission.</p><div class="dyk"><p>Sri Lankan chronicles say monks wrote the canon down at Aluvihare cave after famine and war threatened the people who held it in memory.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Stargardt, J. (1995). The oldest known Pali texts, 5th-6th century: results of the Cambridge Symposium on the Pyu Golden Pali Text from Sri Ksetra. Journal of the Pali Text Society 21, 199-213.</li><li>Gethin, R. (1998). The Foundations of Buddhism. Oxford University Press.</li></ol></details></div></script><script type="text/x-tpl" id="book-mahabharata-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Brahma, Vishnu, and Shiva within an OM, in a Mahabharata manuscript from 1795.jpg" data-cap="A Mahabharata manuscript, 1795" data-big><figcaption></figcaption></figure><div class="sh-k">Ancient India</div><h2 class="sh-t" id="book-mahabharata-st" tabindex="-1">Mahabharata</h2><p class="sh-s">c. 400 BCE-400 CE, in layers</p><div class="sh-v"><span class="vstamp vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div></div><div class="bk-facts"><div><b>Language and script</b>Sanskrit; transmitted orally and in many scripts</div><div><b>Oldest copy</b>Spitzer Manuscript fragment listing the epic&#x27;s books; complete manuscripts much later, Spitzer c. 2nd c. CE; full manuscripts from the 2nd millennium CE</div><div><b>Where it is now</b>Spitzer fragments from Kizil, Xinjiang; full manuscripts in Indian and Nepalese collections</div><div><b>Size</b>About 100,000 couplets in the traditional count; roughly seven times the Iliad and Odyssey combined by lines</div><div><b>Dating confidence</b>medium</div></div><h3 class="sub-h">What it says</h3><p>A family feud that becomes a world war. The five Pandava brothers lose their kingdom and their shared wife Draupadi&#x27;s dignity in a rigged dice game, survive 13 years of exile, then face their cousins the Kauravas in an 18-day battle at Kurukshetra. Just before the fighting, Krishna counsels the hesitant archer Arjuna: that dialogue is the Bhagavad Gita. The epic claims, with some justification, that what is here is found elsewhere, and what is not here is nowhere.</p><h3 class="sub-h">History check</h3><p>The Kuru kingdom was real (Iron Age, c. 1200-500 BCE, associated with Painted Grey Ware culture), and excavations at Hastinapura found a settlement of that period. No archaeological trace of a great war has been found, and astronomical dates proposed for it (such as 3102 BCE) are disputed.</p><div class="meter" style="--pos:41.7%" role="img" aria-label="History check: Open question"><div class="meter-top"><span class="meter-k">History check</span><span class="vd vd--contested"><svg class="i" aria-hidden="true"><use href="#i7"/></svg>Open question</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Real Iron Age polity; the war and heroes are unverified.</p><div class="dyk"><p>In the frame story the sage Vyasa dictates the epic to the elephant-headed god Ganesha, who agrees to write only if Vyasa never pauses, and breaks off a tusk to use as a pen.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Hiltebeitel, A. (2001). Rethinking the Mahabharata. University of Chicago Press.</li><li>Witzel, M. (1995). Early Sanskritization: origins and development of the Kuru state. Electronic Journal of Vedic Studies 1(4).</li></ol></details></div></script><script type="text/x-tpl" id="book-herodotus-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="POxy v0017 n2099 a 01 hires - cropped.jpg" data-cap="A papyrus fragment of Herodotus from Oxyrhynchus" data-big><figcaption></figcaption></figure><div class="sh-k">Classical Greece (Herodotus of Halicarnassus)</div><h2 class="sh-t" id="book-herodotus-st" tabindex="-1">Histories of Herodotus</h2><p class="sh-s">c. 440-425 BCE</p><div class="sh-v"><span class="vstamp vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div></div><div class="bk-facts"><div><b>Language and script</b>Ionic Greek; Greek alphabet</div><div><b>Oldest copy</b>Papyrus fragments from Oxyrhynchus; oldest complete manuscript Codex Laurentianus 70.3, Fragments 1st-3rd c. CE; codex 10th c. CE</div><div><b>Where it is now</b>Oxford and other papyrus collections; Biblioteca Medicea Laurenziana, Florence</div><div><b>Size</b>9 books; roughly 190,000 Greek words</div><div><b>Dating confidence</b>high</div></div><h3 class="sub-h">What it says</h3><p>The first big &#x27;inquiry&#x27; (historia) in Greek: why did Greeks and Persians go to war? Along the way Herodotus detours into everything. Egyptian crocodiles and mummification, Scythian steam baths, a singer rescued by a dolphin, King Croesus misreading an oracle, and Indian ants that dig up gold. Then the main event: Marathon, Thermopylae and Salamis, told with a sharp eye for pride and its fall.</p><h3 class="sub-h">History check</h3><p>Persian royal inscriptions and the Persepolis administrative tablets confirm many names and institutions; the Behistun inscription parallels his account of Darius&#x27;s rise. Frozen Scythian tombs match some of the customs he describes. Some numbers are inflated, notably Xerxes&#x27; army of millions, and some stories are hearsay he admits he doubts.</p><div class="meter" style="--pos:50.0%" role="img" aria-label="History check: Mixed record"><div class="meter-top"><span class="meter-k">History check</span><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Core events and many details corroborated; numbers and tall tales are not.</p><div class="dyk"><p>Explorer Michel Peissel proposed that the gold-digging &#x27;ants&#x27; were Himalayan marmots, whose burrows on one high plateau throw up gold dust.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Herodotus, The Histories, trans. A. de Sélincourt, rev. J. Marincola (2003). Penguin.</li><li>Asheri, D., Lloyd, A., Corcella, A. (2007). A Commentary on Herodotus Books I-IV. Oxford University Press.</li></ol></details></div></script><script type="text/x-tpl" id="book-new-testament-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="P52 recto.jpg" data-cap="Papyrus 52, the oldest known New Testament fragment" data-big><figcaption></figcaption></figure><div class="sh-k">Early Christian communities, eastern Roman Empire</div><h2 class="sh-t" id="book-new-testament-st" tabindex="-1">New Testament</h2><p class="sh-s">c. 50-120 CE (Paul&#x27;s letters c. 50-60; Gospels c. 70-100)</p><div class="sh-v"><span class="vstamp vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div></div><div class="bk-facts"><div><b>Language and script</b>Koine Greek; Greek uncial script on papyrus and parchment</div><div><b>Oldest copy</b>Papyrus P52 (a few verses of John 18); oldest complete New Testament: Codex Sinaiticus, P52 c. 125-175 CE (dating debated); Sinaiticus mid-4th c. CE</div><div><b>Where it is now</b>John Rylands Library, Manchester; mostly British Library, London</div><div><b>Size</b>27 books; about 138,000 Greek words</div><div><b>Dating confidence</b>medium-high</div></div><h3 class="sub-h">What it says</h3><p>Four Gospels tell the life, teaching, death and reported resurrection of Jesus of Nazareth from different angles. Acts follows the early movement from Jerusalem to Rome. Then come letters, many by Paul, full of advice, theology and arguments with local congregations, and finally Revelation, a vivid apocalyptic vision packed with symbolic beasts and numbers. Its most famous passages, from the Sermon on the Mount to the parable of the Good Samaritan, still shape everyday language.</p><h3 class="sub-h">History check</h3><p>Most historians accept that Jesus existed and was executed under Pontius Pilate; Tacitus and Josephus mention him. A 1961 inscription from Caesarea names Pilate as prefect of Judea. Some details are problematic, such as the census of Quirinius (6 CE) versus Herod&#x27;s death (4 BCE). Miracle claims lie outside what historical method can test.</p><div class="meter" style="--pos:50.0%" role="img" aria-label="History check: Mixed record"><div class="meter-top"><span class="meter-k">History check</span><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Setting and several figures corroborated; many events untestable.</p><div class="dyk"><p>P52 is about the size of a credit card. More than 5,000 Greek manuscripts of the New Testament survive, more than for any other ancient text.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Metzger, B. M., Ehrman, B. D. (2005). The Text of the New Testament. 4th ed. Oxford University Press.</li><li>Sanders, E. P. (1993). The Historical Figure of Jesus. Penguin.</li></ol></details></div></script><script type="text/x-tpl" id="book-popol-vuh-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Popol vuh.jpg" data-cap="The oldest surviving Popol Vuh manuscript" data-big><figcaption></figcaption></figure><div class="sh-k">K&#x27;iche&#x27; Maya, highland Guatemala</div><h2 class="sh-t" id="book-popol-vuh-st" tabindex="-1">Popol Vuh</h2><p class="sh-s">Written c. 1554-1558 CE from much older traditions</p><div class="sh-v"><span class="vstamp vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div></div><div class="bk-facts"><div><b>Language and script</b>K&#x27;iche&#x27; Mayan written in the Latin alphabet</div><div><b>Oldest copy</b>Francisco Ximénez&#x27;s manuscript, K&#x27;iche&#x27; and Spanish in parallel columns, c. 1701-1703 CE</div><div><b>Where it is now</b>Newberry Library, Chicago</div><div><b>Size</b>Four parts; roughly 8,000-9,000 lines in line-by-line translations</div><div><b>Dating confidence</b>high for the writing; older sources uncertain</div></div><h3 class="sub-h">What it says</h3><p>The gods try to make people who will praise them. Mud people melt. Wooden people have no hearts, so their own dogs, pots and grinding stones rise up against them. Before humans are made from maize, the Hero Twins Hunahpu and Xbalanque play the ballgame against the lords of the underworld, Xibalba, survive the House of Razors and the House of Bats, outwit death, and rise as the sun and moon. Then comes the history of K&#x27;iche&#x27; lineages.</p><h3 class="sub-h">History check</h3><p>Scenes of the Hero Twins and the maize god appear in Classic Maya art, and related maize-god imagery appears in the San Bartolo murals of about 100 BCE, showing these myths are far older than the manuscript. The later dynastic sections match other K&#x27;iche&#x27; documents and the ruins of their capital, Q&#x27;umarkaj.</p><div class="meter" style="--pos:50.0%" role="img" aria-label="History check: Mixed record"><div class="meter-top"><span class="meter-k">History check</span><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Myths are ancient and corroborated in art; late dynastic history reasonably supported.</p><div class="dyk"><p>The original K&#x27;iche&#x27; manuscript is lost. The text survived only because a Dominican friar copied it around 1701; the copy resurfaced in Guatemala in the 1850s and now sits in Chicago.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Christenson, A. J. (2007). Popol Vuh: The Sacred Book of the Maya. University of Oklahoma Press.</li><li>Tedlock, D. (1996). Popol Vuh. Rev. ed. Simon &amp; Schuster.</li></ol></details></div></script><script type="text/x-tpl" id="book-quran-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Birmingham Quran manuscript full.jpg" data-cap="The Birmingham Quran manuscript" data-big><figcaption></figcaption></figure><div class="sh-k">7th-century Arabia</div><h2 class="sh-t" id="book-quran-st" tabindex="-1">Quran</h2><p class="sh-s">610-632 CE (traditional period of revelation); compiled as a standard codex c. 650 CE by tradition</p><div class="sh-v"><span class="vstamp vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div></div><div class="bk-facts"><div><b>Language and script</b>Classical Arabic; early Hijazi script, later Kufic</div><div><b>Oldest copy</b>The Birmingham leaves (two parchment folios); other early witnesses include the Sanaa palimpsest, Parchment radiocarbon-dated to 568-645 CE (95% probability)</div><div><b>Where it is now</b>Cadbury Research Library, University of Birmingham (Mingana Collection)</div><div><b>Size</b>114 suras, 6,236 verses (common count), about 77,000 words</div><div><b>Dating confidence</b>high for an early date, supported by manuscript evidence</div></div><h3 class="sub-h">What it says</h3><p>Arabic scripture presented as recited revelation. Its themes include one God, gratitude, justice, care for orphans and the poor, and a coming day of judgement. It retells stories of figures shared with Jewish and Christian traditions, such as Abraham, Moses, Mary and Jesus, often briefly and with a moral point, and it gives guidance on law and community life. It is famous for rhythmic rhymed prose meant to be heard aloud.</p><h3 class="sub-h">History check</h3><p>Radiocarbon dates on early parchments (Birmingham, Tubingen, Sanaa) support a written text very early, consistent with a 7th-century origin. Its references to ancient figures overlap with biblical traditions and are largely beyond archaeological testing, as with other scriptures.</p><div class="meter" style="--pos:50.0%" role="img" aria-label="History check: Mixed record"><div class="meter-top"><span class="meter-k">History check</span><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Early textual history well supported; ancient narratives largely untestable.</p><div class="dyk"><p>The Birmingham leaves sat in a university collection for about 90 years before a researcher&#x27;s close look led to radiocarbon testing in 2015.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>University of Birmingham (2015). Birmingham Qur&#x27;an manuscript dated among the oldest in the world (Oxford Radiocarbon Accelerator Unit results).</li><li>Déroche, F. (2014). Qur&#x27;ans of the Umayyads: A First Overview. Brill.</li></ol></details></div></script><script type="text/x-tpl" id="book-kojiki-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Shinpukuji-bon Kojiki (真福寺本古事記).png" data-cap="The Shinpukuji manuscript of the Kojiki" data-big><figcaption></figcaption></figure><div class="sh-k">Nara-period Japan</div><h2 class="sh-t" id="book-kojiki-st" tabindex="-1">Kojiki (Records of Ancient Matters)</h2><p class="sh-s">Presented to the court in 712 CE</p><div class="sh-v"><span class="vstamp vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div></div><div class="bk-facts"><div><b>Language and script</b>Old Japanese written with Chinese characters, partly as Chinese prose and partly phonetically</div><div><b>Oldest copy</b>Shinpukuji manuscript, copied by the monk Ken&#x27;yu (a National Treasure), 1371-1372 CE</div><div><b>Where it is now</b>Shinpukuji temple (Osu Kannon), Nagoya</div><div><b>Size</b>3 volumes</div><div><b>Dating confidence</b>high</div></div><h3 class="sub-h">What it says</h3><p>Two gods, Izanagi and Izanami, stir the ocean with a jeweled spear, and the drips form the islands of Japan. Izanami dies giving birth to fire, and Izanagi follows her to the land of the dead, then flees in horror. The sun goddess Amaterasu hides in a cave and darkens the world until the gods throw a raucous party outside. Her brother Susanoo slays an eight-headed serpent and finds a sword in its tail. Then come the emperors.</p><h3 class="sub-h">History check</h3><p>The first emperor Jimmu&#x27;s traditional date (660 BCE) is not supported by archaeology, which shows the Yayoi and Kofun periods instead. Later reigns fit better: a 5th-century sword inscription from Inariyama names a king widely matched to Emperor Yuryaku. Chinese records mention a queen Himiko who does not appear in the Kojiki at all.</p><div class="meter" style="--pos:50.0%" role="img" aria-label="History check: Mixed record"><div class="meter-top"><span class="meter-k">History check</span><span class="vd vd--mixed"><svg class="i" aria-hidden="true"><use href="#i12"/></svg>Mixed record</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class=""></i><i class=""></i><i class=""></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">Mythic early chapters; later royal history partly corroborated.</p><div class="dyk"><p>The compiler, O no Yasumaro, wrote down what the court reciter Hieda no Are had memorized. Yasumaro&#x27;s own tomb and bronze epitaph were found in 1979 in a Nara tea field.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Heldt, G. (trans.) (2014). The Kojiki: An Account of Ancient Matters. Columbia University Press.</li><li>Philippi, D. L. (trans.) (1968). Kojiki. University of Tokyo Press.</li></ol></details></div></script><script type="text/x-tpl" id="book-dead-sea-scrolls-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="The Temple Scroll (11Q20) - Google Art Project.jpg" data-cap="A Dead Sea Scroll" data-big><figcaption></figcaption></figure><div class="sh-k">Second Temple Judea</div><h2 class="sh-t" id="book-dead-sea-scrolls-st" tabindex="-1">Dead Sea Scrolls</h2><p class="sh-s">Copied c. 250 BCE-68 CE</p><div class="sh-v"><span class="vstamp vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div></div><div class="bk-facts"><div><b>Language and script</b>Hebrew, Aramaic and some Greek; mostly square Jewish script, some Paleo-Hebrew</div><div><b>Oldest copy</b>The scrolls are themselves the old copies; the Great Isaiah Scroll is the showpiece, Oldest fragments 3rd c. BCE; Great Isaiah Scroll c. 2nd c. BCE</div><div><b>Where it is now</b>Shrine of the Book, Israel Museum, Jerusalem, and other collections</div><div><b>Size</b>About 900-1,000 manuscripts in tens of thousands of fragments from 11 caves near Qumran (found 1947-1956)</div><div><b>Dating confidence</b>high (handwriting study plus radiocarbon)</div></div><h3 class="sub-h">What it says</h3><p>A library hidden in desert caves. It holds the oldest known copies of almost every book of the Hebrew Bible (Esther is missing), plus writings no one had seen for 2,000 years: rules for a strict community, a War Scroll about the &#x27;Sons of Light&#x27; fighting the &#x27;Sons of Darkness&#x27;, hymns, calendars, commentaries, and the Copper Scroll, a list of hidden treasure engraved on metal.</p><h3 class="sub-h">History check</h3><p>Radiocarbon tests and handwriting analysis agree on dates from about the 3rd century BCE to the 1st century CE; the nearby Qumran settlement was destroyed around 68 CE. The Isaiah scroll is remarkably close to the medieval text, while other books show variant versions, showing both careful copying and a still-fluid text.</p><div class="meter" style="--pos:91.7%" role="img" aria-label="History check: Established"><div class="meter-top"><span class="meter-k">History check</span><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">As direct evidence of how scriptures were copied and read in the Second Temple period.</p><div class="dyk"><p>The first scrolls were found in 1946-47 by Bedouin shepherds, reportedly while looking for a stray goat. The Copper Scroll lists dozens of treasure caches; none has ever been found.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>VanderKam, J., Flint, P. (2002). The Meaning of the Dead Sea Scrolls. HarperSanFrancisco.</li><li>Magness, J. (2021). The Archaeology of Qumran and the Dead Sea Scrolls. 2nd ed. Eerdmans.</li></ol></details></div></script><script type="text/x-tpl" id="book-rosetta-stone-tpl"><div class="xp-inner"><div class="sh-hd"><figure class="photo sh-hero" data-img="Rosetta Stone (copy British Museum).jpg" data-cap="A replica of the Rosetta Stone" data-big><figcaption></figcaption></figure><div class="sh-k">Ptolemaic Egypt</div><h2 class="sh-t" id="book-rosetta-stone-st" tabindex="-1">Rosetta Stone</h2><p class="sh-s">196 BCE (decree of priests at Memphis honouring Ptolemy V)</p><div class="sh-v"><span class="vstamp vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div></div><div class="bk-facts"><div><b>Language and script</b>Egyptian in hieroglyphic and Demotic scripts, plus Ancient Greek</div><div><b>Oldest copy</b>The granodiorite stele itself, about 760 kg, 196 BCE; found July 1799 at Rashid (Rosetta)</div><div><b>Where it is now</b>British Museum, London (since 1802)</div><div><b>Size</b>14 surviving lines of hieroglyphs, 32 of Demotic, 54 of Greek</div><div><b>Dating confidence</b>high</div></div><h3 class="sub-h">What it says</h3><p>Surprisingly, a piece of bureaucracy. Priests thank the young king Ptolemy V for tax breaks, gifts to temples and crushing a rebellion, and in return vote him statues and festivals. The key line orders the decree to be set up in every major temple in &#x27;sacred&#x27;, &#x27;native&#x27; and Greek writing. That last detail made it the key: one message in three scripts, one of which scholars could already read.</p><h3 class="sub-h">History check</h3><p>Other copies of the same decree have been found, and its events match the known reign of Ptolemy V. Using the Greek as a guide, Thomas Young made early progress and Jean-François Champollion announced the decipherment of hieroglyphs in 1822.</p><div class="meter" style="--pos:91.7%" role="img" aria-label="History check: Established"><div class="meter-top"><span class="meter-k">History check</span><span class="vd vd--solid"><svg class="i" aria-hidden="true"><use href="#i5"/></svg>Established</span></div><div class="meter-bar" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><span class="meter-pin"></span></div><div class="meter-ends" aria-hidden="true"><span>Ruled out</span><span>Established</span></div></div><p class="debate-why">An official dated document; its account of a royal decree is corroborated.</p><div class="dyk"><p>Legend says Champollion ran into his brother&#x27;s office shouting &#x27;Je tiens l&#x27;affaire!&#x27; (&#x27;I&#x27;ve got it!&#x27;) and then fainted.</p></div><details class="srcs"><summary>Sources (2)</summary><ol><li>Parkinson, R. (1999). Cracking Codes: The Rosetta Stone and Decipherment. British Museum Press.</li><li>Ray, J. (2007). The Rosetta Stone and the Rebirth of Ancient Egypt. Harvard University Press.</li></ol></details></div></script>
