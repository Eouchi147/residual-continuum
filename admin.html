<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#131211">
<title>Studio · Residual Continuum</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#131211;--panel:#1b1a18;--panel2:#22201d;--line:rgba(245,241,235,.09);--text:#f5f1eb;--muted:#a59d92;--gold:#e8b87a;--gold2:#c98a4e;--green:#8fd9b0;--red:#e98a8a;--blue:#9fd0ff;--amber:#f0c674;--r:16px}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--gold)}button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:Newsreader,Georgia,serif;font-weight:500;margin:0;letter-spacing:-.01em}
.mark{width:28px;height:28px;flex:none}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 18px;background:rgba(19,18,17,.86);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border-bottom:1px solid var(--line)}
header h1{font-size:20px}header .sub{color:var(--muted);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
header .sp{flex:1}
.pill{font-family:Inter,system-ui,sans-serif;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}.dot.ok{background:var(--green)}.dot.bad{background:var(--red)}.dot.wait{background:var(--amber)}.dot.off{background:#5d574f}
nav.tabs{display:flex;gap:4px;padding:10px 18px 0;overflow-x:auto;scrollbar-width:none}nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:9px 14px;border-radius:999px;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
main{max-width:1240px;margin:0 auto;padding:18px 18px 110px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card h2{font-size:19px;margin-bottom:10px;display:flex;align-items:center;gap:10px}.card h2 .sp{flex:1}
.kpi .n{font-family:Newsreader,serif;font-size:38px;line-height:1}.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-top:6px}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-weight:500;font-size:13px;font-family:Inter,system-ui,sans-serif;text-decoration:none;display:inline-block}
.btn:hover{border-color:rgba(232,184,122,.5)}.btn.gold{background:var(--gold);color:#1a1510;border-color:var(--gold)}.btn.red{color:var(--red)}.btn.green{color:var(--green)}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px;max-width:100%;overflow-x:auto;scrollbar-width:none}.seg::-webkit-scrollbar{display:none}
.seg button{background:none;border:0;padding:6px 12px;border-radius:9px;color:var(--muted);font-weight:500;font-size:13px;white-space:nowrap;flex:none}.seg button.on{background:var(--gold);color:#1a1510}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row.sb{justify-content:space-between}
.eg{border-top:1px solid var(--line);padding:10px 0}.eg textarea{min-height:64px;margin-top:6px}.egd{border-top:1px solid var(--line);padding:8px 0}.egd summary{cursor:pointer}.egrow{gap:4px 8px;padding:5px 0;align-items:baseline}.egrow a{overflow-wrap:anywhere}.egrow .tiny{min-width:0;flex-basis:100%;padding-left:22px}
.ttbox{margin-top:12px;padding:14px 16px}.ttgrid{display:grid;grid-template-columns:170px minmax(0,1fr);gap:16px;align-items:start}.ttgrid video{width:100%;aspect-ratio:9/16;border-radius:10px;background:#000;object-fit:contain}
.ttav{width:22px;height:22px;border-radius:50%;vertical-align:middle;margin-right:6px;object-fit:cover}.ttck{gap:6px}.ttck.off{opacity:.45}
@media (max-width:640px){.ttgrid{grid-template-columns:1fr}.ttgrid video{max-width:200px}}
.list{display:flex;flex-direction:column}.item{padding:11px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);text-decoration:none}
.chip.ok{color:var(--green);border-color:rgba(143,217,176,.35)}.chip.bad{color:var(--red);border-color:rgba(233,138,138,.35)}.chip.wait{color:var(--amber);border-color:rgba(240,198,116,.35)}.chip.priv{color:var(--blue);border-color:rgba(159,208,255,.35)}
.bar{height:10px;border-radius:6px;background:var(--panel2);overflow:hidden;position:relative}.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--gold2),var(--gold));border-radius:6px;transition:width .6s cubic-bezier(.25,1,.5,1)}
.bar.green i{background:linear-gradient(90deg,#4f9f78,var(--green))}.bar.blue i{background:linear-gradient(90deg,#4f7fa8,var(--blue))}
.funnel .r{display:grid;grid-template-columns:96px 1fr 52px;align-items:center;gap:10px;margin:8px 0}.funnel .v{text-align:right;font-variant-numeric:tabular-nums}
.nets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.net{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px}.net b{display:block;font-weight:600;font-size:13.5px}.net .who{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:13.5px}th{text-align:left;color:var(--muted);font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;padding:8px 6px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}tr:hover td{background:rgba(245,241,235,.02)}
.tbl{max-height:68vh;overflow:auto}
input,textarea,select{background:#141312;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 11px;font:inherit;width:100%}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.drawer{position:fixed;inset:0;z-index:40;display:none}.drawer.on{display:block}.drawer .scrim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.drawer .sheet{position:absolute;right:0;top:0;bottom:0;width:min(640px,100%);background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:20px}
video{width:100%;max-height:60vh;border-radius:12px;background:#000}
.chat{display:flex;flex-direction:column;gap:12px;max-height:62vh;overflow:auto;padding-right:4px}
.msg{max-width:88%;padding:11px 14px;border-radius:14px;white-space:pre-wrap;line-height:1.5}.msg.user{align-self:flex-end;background:#2a2620;border:1px solid rgba(232,184,122,.25)}.msg.assistant{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
.msg .meta{font-size:11px;color:var(--muted);margin-top:6px}
.prop{border:1px solid rgba(232,184,122,.35);background:rgba(232,184,122,.06);border-radius:12px;padding:10px 12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:60;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,.4)}
.login{max-width:380px;margin:12vh auto;padding:26px}.login h1{font-size:30px;margin-bottom:6px}
.setup li{margin:6px 0}.code{font-family:ui-monospace,Menlo,monospace;font-size:12px;background:#141312;border:1px solid var(--line);border-radius:8px;padding:2px 6px;word-break:break-all}
.hours{display:flex;gap:4px;flex-wrap:wrap}.hours button{width:34px;padding:5px 0;border-radius:8px;background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--muted)}.hours button.on{background:var(--gold);color:#1a1510;border-color:var(--gold)}
.timeline{display:flex;flex-direction:column;gap:0}.tl{display:grid;grid-template-columns:118px 1fr;gap:12px;padding:9px 0;border-top:1px solid var(--line)}.tl:first-child{border-top:0}
footer{color:var(--muted);text-align:center;font-size:12px;padding:30px 0 0}
.pol{font-size:11.5px;line-height:1.5;color:var(--muted);margin:14px auto 0;max-width:640px;text-align:center}.pol a{color:inherit;text-decoration:underline}
/* The Explorer's room */
.xhero{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.orb{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe2b8,var(--gold) 38%,var(--gold2) 70%,#5a3d22);box-shadow:0 0 0 6px rgba(232,184,122,.08),0 0 38px rgba(232,184,122,.35);position:relative}
.orb.alive::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1px solid rgba(232,184,122,.5);animation:pulse 2.8s cubic-bezier(.25,1,.5,1) infinite}
.orb.sleep{filter:grayscale(.8) brightness(.7);box-shadow:none}
@keyframes pulse{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.35);opacity:0}}
@media (prefers-reduced-motion:reduce){.orb.alive::after{animation:none}}
.north{font-family:Newsreader,serif;font-style:italic;font-size:19px;line-height:1.35;color:var(--text)}
.goal{padding:10px 0;border-top:1px solid var(--line)}.goal:first-child{border-top:0}
.goal .t{display:flex;justify-content:space-between;gap:10px;align-items:baseline}.goal .v{font-variant-numeric:tabular-nums;white-space:nowrap}
.mx{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.mx .m{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 12px 8px}
.mx .m .n{font-family:Newsreader,serif;font-size:28px;line-height:1.1}.mx .m .d{font-size:12px}.up{color:var(--green)}.down{color:var(--red)}
.mx svg{display:block;width:100%;height:54px;margin-top:6px}
.kind{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.kind.think{color:var(--gold);border-color:rgba(232,184,122,.4)}.kind.sense{color:var(--blue);border-color:rgba(159,208,255,.35)}.kind.learn,.kind.milestone{color:var(--green);border-color:rgba(143,217,176,.35)}.kind.trouble{color:var(--red);border-color:rgba(233,138,138,.35)}.kind.order,.kind.experiment,.kind.playbook{color:var(--amber);border-color:rgba(240,198,116,.35)}
.act{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:9px 0;border-top:1px solid var(--line)}.act:first-child{border-top:0}.act>.chip{align-self:start;justify-self:start;margin-top:1px}
.hbar{display:grid;grid-template-columns:minmax(80px,140px) 1fr 64px;gap:10px;align-items:center;margin:6px 0;font-size:12.5px}
details>summary{cursor:pointer;color:var(--muted);font-size:13px}details[open]>summary{margin-bottom:8px}
.st{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.st.on{color:var(--green);border-color:rgba(143,217,176,.4)}.st.behind{color:var(--amber);border-color:rgba(240,198,116,.4)}.st.off{color:var(--red);border-color:rgba(233,138,138,.4)}.st.done{color:var(--gold);border-color:rgba(232,184,122,.45)}.st.wait{color:var(--muted)}
.dial{width:92px;height:92px;flex:none}.course{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center}
@media (max-width:640px){.course{grid-template-columns:auto minmax(0,1fr);gap:12px}.course .dial{width:64px;height:64px}.course>.btn{grid-column:1/-1}.focus{font-size:18px}}.focus{font-family:Newsreader,serif;font-size:20px;line-height:1.35}
.vbars{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:8px}.vbars .b{flex:1;min-width:3px;background:linear-gradient(180deg,var(--gold),var(--gold2));border-radius:3px 3px 0 0;position:relative}.vbars .b i{position:absolute;left:30%;right:30%;bottom:0;background:#9fd0ff;border-radius:2px 2px 0 0}
.vlab{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px}
.cmt{padding:9px 0;border-top:1px solid var(--line)}.cmt:first-child{border-top:0}
.soul{white-space:pre-wrap;font-family:Newsreader,serif;font-size:15.5px;line-height:1.6;color:#e9e3da;max-width:72ch}
@media (max-width:640px){.xhero{grid-template-columns:auto 1fr}.xhero .acts{grid-column:1/-1}}
@media (max-width:640px){td:last-child .btn{display:block;margin:3px 0;width:100%}header{padding:10px 14px}main{padding:14px 14px 100px}.hide-s{display:none}.kpi .n{font-size:30px}.tl{grid-template-columns:96px 1fr}}
</style>
</head>
<body>
<header>
  <svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="27" fill="none" stroke="#f5f1eb" stroke-width="2.2"/><path d="M19 34a13 13 0 0 1 26 0z" fill="#e8b87a"/><line x1="7" y1="34" x2="57" y2="34" stroke="#f5f1eb" stroke-width="2.2"/><line x1="18" y1="40" x2="46" y2="40" stroke="#a59d92" stroke-width="1.6"/><line x1="24" y1="45" x2="40" y2="45" stroke="#a59d92" stroke-width="1.2"/></svg>
  <div><h1>Studio</h1><div class="sub">Residual Continuum</div></div>
  <div class="sp"></div>
  <span class="pill hide-s" id="modePill"><span class="dot"></span><span>…</span></span>
  <button class="btn" id="refreshBtn" title="Refresh">↻</button>
  <button class="btn" id="logoutBtn" style="display:none">Lock</button>
</header>
<nav class="tabs" id="tabs" style="display:none">
  <button data-room="overview" class="on">Overview</button><button data-room="explorer">The Explorer</button><button data-room="engage">Engage</button><button data-room="visitors">Visitors</button><button data-room="director">Talk</button><button data-room="schedule">Schedule</button><button data-room="films">Films</button><button data-room="networks">Networks</button><button data-room="log">Log</button>
</nav>
<main id="main"></main>
<div class="drawer" id="drawer"><div class="scrim" data-close></div><div class="sheet" id="sheet"></div></div>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const NETS = { youtube: "YouTube", tiktok: "TikTok", instagram: "Instagram", facebook: "Facebook", x: "X" };
let S = { room: (location.hash.slice(1).split("?")[0]) || "overview", ov: null, plan: null, chat: null, filter: "all", q: "" };

async function api(action, body, params) {
  const qs = new URLSearchParams({ action, ...(params || {}) }).toString();
  const r = await fetch("/api/studio?" + qs, body ? { method: "POST", headers: { "content-type": "application/json", "x-rc": "1" }, body: JSON.stringify(body), credentials: "same-origin" } : { credentials: "same-origin" });
  const j = await r.json().catch(() => ({ error: "http " + r.status }));
  if (r.status === 401 && action !== "login") { showLogin(); throw new Error("locked"); }
  if (!r.ok) throw new Error(j.error || ("http " + r.status));
  return j;
}
function toast(msg, ms = 3800) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
const when = iso => { if (!iso) return ""; const d = new Date(iso); return d.toLocaleString(undefined, { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); };
const ago = iso => { if (!iso) return ""; const s = (Date.now() - Date.parse(iso)) / 1000; if (s < 90) return "just now"; if (s < 5400) return Math.round(s / 60) + " min ago"; if (s < 129600) return Math.round(s / 3600) + " h ago"; return Math.round(s / 86400) + " d ago"; };
const slotTime = (date, hour) => { const h = String(hour).replace(/^[A-Z]/, "").slice(0, 2), m = /m(\d\d)/.exec(hour); const t = new Date(date + "T" + h + ":" + (m ? m[1] : "00") + ":00Z"); return isNaN(t) ? new Date(date + "T12:00:00Z") : t; };
function chipFor(net, r) {
  if (!r) return "";
  const name = NETS[net] || net;
  if (r.ok) return `<a class="chip ${r.private ? "priv" : "ok"}" ${r.url ? `href="${esc(r.url)}" target="_blank" rel="noopener"` : ""} title="${esc(r.note || "")}">${name}${r.private ? " · private" : ""}${r.already ? " · already" : ""}</a>`;
  if (r.pending) return `<span class="chip wait" title="${esc(r.note || "processing")}">${name} · processing</span>`;
  if (r.skipped) return `<span class="chip" title="${esc(r.skipped)}">${name} · not connected</span>`;
  return `<span class="chip bad" title="${esc(r.error || "")}">${name} · failed</span>`;
}

const POL = `<p class="pol">Residual Continuum Studio publishes our own films to our own channels. It uses YouTube API Services: see the YouTube Terms of Service (youtube.com/t/terms) and the Google Privacy Policy (policies.google.com/privacy). <a href="/privacy.html">Privacy policy</a> · <a href="/terms.html">Terms of use</a></p>`;
const FOOT = `<footer>Coherence is the measure, not final demonstration.${POL}</footer>`;
/* --------------------------------------------------------------- login */
function showLogin(setup) {
  $("#tabs").style.display = "none"; $("#logoutBtn").style.display = "none";
  const s = setup || {};
  $("#main").innerHTML = `<div class="card login"><h1>Studio</h1><p class="muted">The console for the films, the schedule and the AI. Not linked from anywhere.</p>
  ${s.password === false ? `<p class="small" style="color:var(--amber)">ADMIN_PASSWORD is not set in Vercel yet: see the setup steps below.</p>` : ""}
  <form id="lf"><input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus><div style="height:10px"></div><button class="btn gold" style="width:100%">Unlock</button></form>
  ${setupList(s)}${POL}</div>`;
  $("#lf").onsubmit = async e => { e.preventDefault(); try { await api("login", { password: $("#pw").value }); boot(); } catch (err) { toast(err.message); } };
}
function setupList(s) {
  if (!s || (s.password && s.store && s.cron && s.ai)) return "";
  const li = (ok, t) => `<li><span class="dot ${ok ? "ok" : "bad"}"></span> ${t}</li>`;
  return `<ul class="setup small muted" style="list-style:none;padding:0;margin-top:18px">
    ${li(s.password, "<b>ADMIN_PASSWORD</b> in Vercel → Settings → Environment Variables (you choose it), then Redeploy")}
    ${li(s.store, "A store: Vercel → Storage → Upstash Redis (free) → connect to this project")}
    ${li(s.cron, "<b>CRON_SECRET</b> (already used by the daily discovery)")}
    ${li(s.ai, "<b>OPENROUTER_API_KEY</b> (already set for the site assistant)")}</ul>`;
}

/* ------------------------------------------------------------- rooms */
async function load(room, force) {
  S.room = room; $$("#tabs button").forEach(b => b.classList.toggle("on", b.dataset.room === room));
  if (!location.hash.startsWith("#" + room)) history.replaceState(null, "", "#" + room);
  const R = { overview: roomOverview, explorer: roomExplorer, engage: roomEngage, visitors: roomVisitors, schedule: roomSchedule, films: roomFilms, director: roomDirector, networks: roomNetworks, log: roomLog }[room] || roomOverview;
  try { await R(force); } catch (e) { if (e.message !== "locked") $("#main").innerHTML = `<div class="card"><h2>Something went wrong</h2><p class="muted">${esc(e.message)}</p></div>`; }
  if (!S.ov) getOv().catch(() => {});   /* the header's mode pill, on every room */
}
async function getOv(force) { if (!S.ov || force) S.ov = await api("overview"); paintMode(); return S.ov; }
function paintMode() {
  const d = S.ov && S.ov.dials; if (!d) return;
  const map = { off: ["off", "Poster off"], approve: ["wait", "Waits for your yes"], auto: ["ok", "Posting on its own"] };
  const [c, t] = map[d.mode] || ["", d.mode];
  $("#modePill").innerHTML = `<span class="dot ${c}"></span><span>${t}</span>`;
}

async function roomOverview(force) {
  const o = await getOv(force);
  const f = o.films, max = Math.max(1, f.planned);
  const pct = n => Math.round(100 * n / max);
  const props = o.proposals || [];
  const recs = (o.calendar.records || []).slice(0, 6), up = (o.calendar.upcoming || []).slice(0, 6);
  const runs = (o.farm.runs || []).slice(0, 5);
  const nets = o.nets.map(n => {
    const c = n.connected ? (o.dials.nets[n.net] === false ? "off" : "ok") : (n.ready || n.kind === "form" ? "wait" : "bad");

function describeArgs(a) {
  a = a || {}; const t = id => { const f = (S.plan || []).find(x => x.id === id); return f ? f.title : id; };
  const parts = [];
  if (a.id) parts.push(t(a.id)); if (a.net) parts.push(NETS[a.net] || a.net); if (a.mode) parts.push("mode: " + a.mode);

const TT_LABEL = { PUBLIC_TO_EVERYONE: "Everyone", MUTUAL_FOLLOW_FRIENDS: "Friends", FOLLOWER_OF_CREATOR: "Followers", SELF_ONLY: "Only me" };

  go.onclick = async () => {
    const ch = choices(); go.disabled = true; go.textContent = "Sending to TikTok…"; out.textContent = "";
    try {
      const r = (await api("tt_post", { id: f.id, consent: true, caption: q("ttCap").value, ...ch })).result;

/* ------------------------------------------------- The Explorer's room */
const fmt = n => n == null ? "·" : Math.abs(n) >= 1e6 ? (n / 1e6).toFixed(n >= 1e7 ? 0 : 1) + "M" : Math.abs(n) >= 1e4 ? (n / 1e3).toFixed(n >= 1e5 ? 0 : 1) + "k" : Number(n).toLocaleString();
const KIND = { think: "thought", sense: "senses", learn: "learned", milestone: "milestone", trouble: "trouble", order: "work order", experiment: "experiment", playbook: "playbook", version: "upgrade", goal: "goals", note: "your notes" };
const OUTCOME = { done: "ok", proposed: "wait", stopped: "bad", "already waiting": "", failed: "bad", filed: "wait", "already open": "", started: "ok", revised: "ok" };
function spark(series, key) {
  const pts = series.filter(p => p[key] != null);
  if (pts.length < 2) return `<svg viewBox="0 0 200 54" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="44" x2="200" y2="44" stroke="rgba(245,241,235,.12)" stroke-dasharray="3 4"/></svg>`;
  const v = pts.map(p => p[key]), lo = Math.min(...v), hi = Math.max(...v), span = hi - lo || 1;
  const xy = v.map((y, i) => [(i / (v.length - 1)) * 196 + 2, 48 - ((y - lo) / span) * 40]);
  const line = xy.map(([x, y], i) => (i ? "L" : "M") + x.toFixed(1) + " " + y.toFixed(1)).join(" ");
  const [lx, ly] = xy[xy.length - 1];
  return `<svg viewBox="0 0 200 54" preserveAspectRatio="none" role="img" aria-label="${esc(key)} over ${v.length} days"><defs><linearGradient id="g${key}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e8b87a" stop-opacity=".35"/><stop offset="1" stop-color="#e8b87a" stop-opacity="0"/></linearGradient></defs>
    <path d="${line} L${lx.toFixed(1)} 54 L2 54 Z" fill="url(#g${key})"/><path d="${line}" fill="none" stroke="#e8b87a" stroke-width="1.8" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2.6" fill="#f5f1eb"/></svg>`;
}
function delta(series, key) {
  const pts = series.filter(p => p[key] != null); if (pts.length < 2) return "";
  const last = pts[pts.length - 1], ref = pts.filter(p => p.d <= new Date(Date.parse(last.d) - 7 * 864e5).toISOString().slice(0, 10)).pop() || pts[0];
  const dv = last[key] - ref[key]; if (!dv) return `<span class="muted">no change since ${esc(ref.d.slice(5))}</span>`;
  return `<span class="${dv > 0 ? "up" : "down"}">${dv > 0 ? "+" : ""}${fmt(dv)}</span> <span class="muted">since ${esc(ref.d.slice(5))}</span>`;
}
function hbars(obj, label) {
  const e = Object.entries(obj || {}); if (!e.length) return `<p class="muted small">Not enough posts measured yet.</p>`;
  const max = Math.max(1, ...e.map(([, x]) => x.avgViews));
  return e.slice(0, 8).map(([k, x]) => `<div class="hbar"><span class="muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(label ? label(k) : k)}</span><div class="bar"><i style="width:${Math.max(2, Math.round(100 * x.avgViews / max))}%"></i></div><span style="text-align:right;font-variant-numeric:tabular-nums">${fmt(x.avgViews)} <span class="tiny muted">×${x.films}</span></span></div>`).join("");
}
const localHour = h => h === "?" ? "?" : new Date(Date.UTC(2026, 0, 1, +h)).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + " (" + String(h).padStart(2, "0") + " UTC)";
function life(beat) {
  const last = [beat && beat.run, beat && beat.sensed, beat && beat.thought].filter(Boolean).sort().pop();
  const t = last ? Date.now() - Date.parse(last) : Infinity;
  return t < 2.2 * 3600e3 ? ["alive", "ok", "Awake: last heartbeat " + ago(last)] : t < 26 * 3600e3 ? ["", "wait", "Heartbeat late: last one " + ago(last)] : ["sleep", "bad", last ? "Asleep since " + ago(last) + ": check the Vercel crons" : "Not started: it wakes on the next hourly run"];
}

  const w = v.week, l7 = v.last7, l30 = v.last30;
  const diff = (a, b) => b ? `<span class="${a >= b ? "up" : "down"}">${a >= b ? "+" : ""}${Math.round(100 * (a - b) / b)} %</span> <span class="muted">vs the week before</span>` : `<span class="muted">no week before yet</span>`;
  const max = Math.max(1, ...v.series.map(x => x.visits));
  const bars = list => { const m = Math.max(1, ...list.map(x => x[1])); return list.map(([k, n]) => `<div class="hbar"><span class="muted" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(k)}</span><div class="bar"><i style="width:${Math.max(2, Math.round(100 * n / m))}%"></i></div><span style="text-align:right;font-variant-numeric:tabular-nums">${fmt(n)}</span></div>`).join("") || `<p class="muted small">Nothing yet.</p>`; };
  const SRC = { direct: "direct or an app", other: "other websites", ai: "AI assistants" };
  $("#main").innerHTML = `
  <div class="grid g4" style="margin-bottom:14px">
    <div class="card kpi"><div class="n"><span class="dot ${v.live ? "ok" : "off"}" style="width:10px;height:10px;vertical-align:middle"></span> ${v.live}</div><div class="l">On the site now</div></div>
    <div class="card kpi"><div class="n">${fmt(v.today.visits)}</div><div class="l">Visits today · ${fmt(v.today.uniques)} people</div></div>
    <div class="card kpi"><div class="n">${fmt(w.visits)}</div><div class="l">Visits, last 7 full days</div><div class="tiny" style="margin-top:6px">${diff(w.visits, w.before.visits)}</div></div>
    <div class="card kpi"><div class="n">${Math.floor(l7.avgSecs / 60)}:${String(l7.avgSecs % 60).padStart(2, "0")}</div><div class="l">Average visit · ${l7.engagedShare} % stay 30 s+</div></div>
  </div>
  <div class="card" style="margin-bottom:14px"><h2>Last 30 days <span class="sp"></span><span class="tiny muted">gold: visits · blue: different people</span><button class="btn tiny" id="vRefresh" style="margin-left:10px">↻</button></h2>
    <div class="vbars" role="img" aria-label="Visits per day over 30 days">${v.series.map(x => `<div class="b" style="height:${Math.max(1, Math.round(100 * x.visits / max))}%" title="${esc(x.d)}: ${x.visits} visits, ${x.uniques} people, ${x.pv} pages"><i style="height:${x.visits ? Math.round(100 * x.uniques / x.visits) : 0}%"></i></div>`).join("")}</div>
    <div class="vlab"><span>${esc(dfmt(v.series[0].d))}</span><span>today</span></div>
    <p class="tiny muted" style="margin:10px 0 0">All time: ${fmt(v.allTime.visits)} visits, ${fmt(v.allTime.pv)} pages read${v.allTime.since ? ", counted since " + dfmt(v.allTime.since) : ""}. Your own visits from this browser are not counted.</p></div>
  <div class="grid g2" style="margin-bottom:14px">
    <div class="card"><h2>Where they come from <span class="pill tiny">7 days</span></h2>${bars(l7.sources.map(([k, n]) => [SRC[k] || k, n]))}
      <p class="tiny muted" style="margin:8px 0 0">Instagram's and TikTok's apps often hide where a visitor came from (they count as direct). A link like residualcontinuum.com/?from=ig in a bio or a caption names it.</p></div>
    <div class="card"><h2>What they read <span class="pill tiny">7 days</span></h2>${bars(l7.pages.slice(0, 12))}</div>
  </div>
  <div class="grid g2" style="margin-bottom:14px">
    <div class="card"><h2>Countries <span class="pill tiny">30 days</span></h2>${bars(l30.countries)}</div>
    <div class="card"><h2>Devices <span class="pill tiny">30 days</span></h2>${bars(l30.devices)}
      <p class="small muted" style="margin:12px 0 0">Counted without cookies; nothing personal is kept (see the privacy page).</p></div>
  </div>${FOOT}`;
  $("#vRefresh").onclick = () => roomVisitors(true);
}
function visitorsCard(v) {
  if (!v) return "";
  const s = v.series || [], m = Math.max(1, ...s.map(x => x.visits));
  return `<div class="card"><h2>Visitors <span class="sp"></span><a class="btn tiny" href="#visitors">Open</a></h2>
    <div class="row" style="gap:22px;align-items:flex-end"><div class="kpi"><div class="n">${v.live}</div><div class="l">on the site now</div></div><div class="kpi"><div class="n">${fmt(v.today.visits)}</div><div class="l">visits today</div></div><div class="kpi"><div class="n">${fmt(v.week.visits)}</div><div class="l">last 7 full days</div></div></div>
    <div class="vbars" style="height:46px">${s.map(x => `<div class="b" style="height:${Math.max(2, Math.round(100 * x.visits / m))}%" title="${esc(x.d)}: ${x.visits}"></div>`).join("")}</div>
    <div class="tiny muted" style="margin-top:6px">${(v.sources || []).map(([k, n]) => esc(k) + " " + n).join(" · ") || "No visits counted yet."}</div></div>`;
}
function editGoals(x) {
  $("#drawer").classList.add("on");
  const opts = sel => Object.entries(x.metrics).map(([k, l]) => `<option value="${k}" ${k === sel ? "selected" : ""}>${esc(l)}</option>`).join("");
  const row = g => `<div class="item" data-g="${esc(g.id || "")}"><input data-f="label" value="${esc(g.label || "")}" placeholder="Goal"><div class="row" style="margin-top:6px;flex-wrap:nowrap"><select data-f="metric">${opts(g.metric)}</select><input data-f="target" type="number" min="1" value="${esc(g.target || "")}" placeholder="Target" style="max-width:120px"><input data-f="by" type="date" value="${esc(g.by || "")}" title="By" style="max-width:150px"><button class="btn tiny red" data-del>Remove</button></div></div>`;
  $("#sheet").innerHTML = `<div class="row sb"><h2 style="font-size:24px">Goals</h2><button class="btn" data-close>Close</button></div>
    <p class="small muted">The Explorer works toward these. It may propose changes; only you can make them.</p>
    <label class="small muted">North star</label><textarea id="gNorth" style="min-height:60px">${esc(x.north)}</textarea>
    <div class="list" id="gList" style="margin-top:10px">${x.goals.map(row).join("")}</div>
    <div class="row" style="margin-top:10px"><button class="btn" id="gAdd">Add a goal</button><button class="btn gold" id="gSave">Save</button></div>`;
  $$("[data-close]", $("#sheet")).forEach(b => b.onclick = closeDrawer);
  const wire = () => $$("[data-del]").forEach(b => b.onclick = () => b.closest("[data-g]").remove());
  wire();
  $("#gAdd").onclick = () => { $("#gList").insertAdjacentHTML("beforeend", row({ metric: "yt_subs" })); wire(); };
  $("#gSave").onclick = async () => {
    const goals = $$("#gList [data-g]").map(el => { const id = el.dataset.g || undefined, was = x.goals.find(g => g.id === id) || {};
      return { id, label: $("[data-f=label]", el).value, metric: $("[data-f=metric]", el).value, target: Number($("[data-f=target]", el).value), by: $("[data-f=by]", el).value, ...(was.note && was.metric === $("[data-f=metric]", el).value ? { note: was.note } : {}) }; });
    try { await api("explorer_goals", { goals: { north: $("#gNorth").value, goals } }); closeDrawer(); toast("Goals saved"); roomExplorer(true); } catch (e) { toast(e.message); }
  };
}

async function roomNetworks() {
  const n = (await api("networks")).networks;
  const flash = new URLSearchParams(location.hash.split("?")[1] || "");
  const guide = {
    youtube: "Google Cloud console → project residual-continuum-studio → APIs & Services → Credentials → the OAuth client \u201cResidual Continuum Studio\u201d (web application) → add this redirect URI. YouTube Data API v3 must be enabled. Scopes asked: youtube.upload and youtube.readonly.",
    facebook: "Meta for Developers → the app \u201cResidual Continuum Studio\u201d → Facebook Login → Settings → Valid OAuth Redirect URIs: add this one. You must be an admin of the app and of the Page. Connecting Facebook also connects the Instagram professional account linked to the Page.",
    instagram: "Connected through Facebook: switch Instagram to a professional account and link it to the Residual Continuum Page, then connect Facebook.",
    threads: "Meta for Developers → the app → Use cases → Threads API → Settings: add this redirect URI; copy the Threads app ID and secret into Vercel.",
    x: "developer.x.com → Projects & Apps → your app → User authentication settings: OAuth 2.0, type Web App, callback URI below, read and write. Copy the OAuth 2.0 Client ID and Secret into Vercel.",
    tiktok: "developers.tiktok.com → Manage apps → Residual Continuum Studio (its Sandbox, Studio test, until TikTok reviews the app): Login Kit with the redirect URI below, and the Content Posting API with Direct Post; scopes user.info.basic and video.publish. Until TikTok audits the app, its posts are private (Only me) and the account must be private, so scheduled TikTok posts wait for the audit; post by hand from a film's TikTok panel.",
    pinterest: "developers.pinterest.com → your app → Redirect URIs: add this one. Pinterest gives Trial access first; video pins need Standard access.",
    bluesky: "No app needed: make an app password in Bluesky (Settings → Privacy and security → App passwords) and enter it below.",
  };
  $("#main").innerHTML = `${flash.get("msg") ? `<div class="card" style="margin-bottom:14px;border-color:${flash.get("ok") === "1" ? "rgba(143,217,176,.4)" : "rgba(233,138,138,.4)"}">${esc(NETS[flash.get("net")] || "")}: ${esc(flash.get("msg"))}</div>` : ""}
  <div class="grid g2">${n.map(x => `<div class="card"><h2><span class="dot ${x.connected ? "ok" : x.ready ? "wait" : "bad"}"></span> ${x.label}<span class="sp"></span>${x.connected ? `<span class="pill">${esc(x.who || "connected")}</span>` : ""}</h2>
    <p class="small muted">${esc(guide[x.net] || "")}</p>
    ${x.callback ? `<div class="small" style="margin:8px 0">Redirect URI: <span class="code">${esc(x.callback)}</span></div>` : ""}
    ${x.vars && x.vars.length ? `<div class="small muted" style="margin:6px 0">Vercel variables: ${x.vars.map(v => `<span class="code">${v}</span>`).join(" ")} ${x.ready ? `<span style="color:var(--green)">set</span>` : `<span style="color:var(--red)">missing</span>`}</div>` : ""}
    ${x.kind === "form" && !x.connected ? `<form data-form="${x.net}">${(x.fields || []).map(f => `<input name="${f.k}" type="${f.secret ? "password" : "text"}" placeholder="${esc(f.label)}" style="margin-top:8px" autocomplete="off">`).join("")}<button class="btn gold" style="margin-top:10px">Connect</button></form>` : ""}
    <div class="row" style="margin-top:10px">${x.via ? "" : x.connected ? `<button class="btn red" data-disc="${x.net}">Disconnect</button>` : x.kind === "oauth" ? `<button class="btn gold" data-conn="${x.net}" ${x.ready ? "" : "disabled"}>Connect</button>` : ""}
    ${x.connected && x.since ? `<span class="tiny muted">since ${when(x.since)}</span>` : ""}</div></div>`).join("")}</div>${FOOT}`;
  $$("[data-conn]").forEach(b => b.onclick = async () => { try { const j = await api("connect", { net: b.dataset.conn }); location.href = j.url; } catch (e) { toast(e.message); } });
  $$("[data-disc]").forEach(b => b.onclick = async () => { if (!confirm("Disconnect " + NETS[b.dataset.disc] + "?")) return; try { await api("disconnect", { net: b.dataset.disc }); } catch (e) { toast(e.message); } roomNetworks(); });
  $$("[data-form]").forEach(f => f.onsubmit = async e => { e.preventDefault(); const values = Object.fromEntries(new FormData(f)); try { const r = await api("connect_form", { net: f.dataset.form, values }); if (!r.ok) throw new Error(r.error); toast("Connected " + (r.who || "")); } catch (err) { toast(err.message); } roomNetworks(); });
}

async function roomLog(force) {
  const o = await getOv(force);
  $("#main").innerHTML = `<div class="card"><h2>What happened</h2><div class="list">${(o.log || []).map(l => `<div class="item small row sb"><span><b>${esc(l.what)}</b> ${esc(l.film || "")} ${l.net ? "· " + esc(NETS[l.net] || l.net) : ""} ${l.url ? `<a href="${esc(l.url)}" target="_blank" rel="noopener">open</a>` : ""} <span class="muted">${esc(l.error || l.note || (l.tool ? l.tool + " " + JSON.stringify(l.args || {}) : ""))}</span></span><span class="tiny muted">${ago(l.at)}</span></div>`).join("") || `<p class="muted small">Empty.</p>`}</div></div>`;
}

/* --------------------------------------------------------------- boot */
async function boot() {
  let me; try { me = await api("me"); } catch (e) { $("#main").innerHTML = `<div class="card login"><p>${esc(e.message)}</p></div>`; return; }
  if (!me.owner) return showLogin(me.setup);
  $("#tabs").style.display = ""; $("#logoutBtn").style.display = "";
  try { S.plan = (await api("plan")).films; } catch { }
  load(S.room);
}
$$("#tabs button").forEach(b => b.onclick = () => load(b.dataset.room));
window.addEventListener("hashchange", () => { const r = location.hash.slice(1).split("?")[0]; if (r && r !== S.room && $("#tabs").style.display !== "none") load(r); });
$("#refreshBtn").onclick = async () => { try { await api("refresh", {}); } catch { } S.plan = null; load(S.room, true); };
$("#logoutBtn").onclick = async () => { await api("logout"); location.reload(); };
$("#drawer").addEventListener("click", e => { if (e.target.dataset && "close" in e.target.dataset) closeDrawer(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
boot();
</script>
</body>
